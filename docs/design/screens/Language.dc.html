<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Language</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Sans+Arabic:wght@400;500&amp;family=IM+Fell+English+SC&amp;family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&amp;display=swap">
<style>
:root{--color-bg-canvas:#0F1120;--color-bg-surface:#171A2D;--color-bg-surfaceRaised:#20243D;--color-bg-sunken:#0A0C17;--color-text-primary:#ECEEF7;--color-text-secondary:#B2B7CD;--color-text-tertiary:#8B91AB;--color-text-onAccent:#0F1120;--color-accent-primary:#9AA8FF;--color-accent-secondary:#F3957A;--color-accent-subtle:#262D5C;--color-border-subtle:#2A2F4A;--color-border-strong:#6A7196;--color-border-focus:#F2C14E;--color-status-success:#5FC795;--color-status-onSuccess:#0F1120;--color-status-error:#FF8C8C;--color-status-onError:#0F1120;--color-card-back:#23308F;--color-card-frame:#D4A63A;--color-card-glow:#F7D774;--color-ad-container:#0A0C17;--font-serif:"Literata",Georgia,serif;--font-sans:"IBM Plex Sans",system-ui,sans-serif;--font-numeral:"IM Fell English SC",Georgia,serif}
body{margin:0;font-family:var(--font-sans);color:var(--color-text-primary)}
a{color:var(--color-accent-primary)}
</style>
</helmet>
<div style="width: 390px; height: 1040px; box-sizing: border-box; background: var(--color-bg-canvas); padding: 48px 16px 28px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center">
<a href="Settings.dc.html" aria-label="Back to Settings" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: var(--color-text-primary); margin-left: -12px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: var(--font-serif); font-weight: 500; font-size: 28px; line-height: 34px">Language</h1>
<span style="font-size: 15px; line-height: 22px; color: var(--color-text-secondary)">Menus, card meanings and new readings use this language.</span>
</div>

<fieldset style="margin: 0; padding: 0; border: 0; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">App language</legend>

<label for="lang-system" style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 16px; box-sizing: border-box; border-radius: 16px; background: var(--color-bg-surface); box-shadow: inset 0 0 0 1.5px var(--color-accent-primary); cursor: pointer">
<span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 16px; line-height: 22px; font-weight: 500">Use phone language</span><span style="font-size: 13px; line-height: 18px; color: var(--color-text-tertiary)">English, from your phone settings</span></span>
<input type="radio" id="lang-system" name="lang" value="system" checked style="flex: none; width: 20px; height: 20px; margin: 0; accent-color: var(--color-accent-primary)">
</label>

<div style="display: flex; flex-direction: column; gap: 8px">
<span aria-hidden="true" style="padding: 0 4px; font-size: 13px; line-height: 18px; font-weight: 500; color: var(--color-text-tertiary)">Choose a language</span>
<div style="display: flex; flex-direction: column; background: var(--color-bg-surface); border-radius: 16px">
<label for="lang-en" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; cursor: pointer"><span lang="en" style="flex-grow: 1; font-size: 16px; line-height: 22px">English</span><input type="radio" id="lang-en" name="lang" value="en" style="flex: none; width: 20px; height: 20px; margin: 0; accent-color: var(--color-accent-primary)"></label>
<label for="lang-ar" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border-top: 1px solid var(--color-border-subtle); cursor: pointer"><span lang="ar" dir="rtl" style="flex-grow: 1; text-align: left; font-family: 'IBM Plex Sans Arabic', var(--font-sans); font-size: 16px; line-height: 22px">العربية</span><input type="radio" id="lang-ar" name="lang" value="ar" style="flex: none; width: 20px; height: 20px; margin: 0; accent-color: var(--color-accent-primary)"></label>
<label for="lang-de" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border-top: 1px solid var(--color-border-subtle); cursor: pointer"><span lang="de" style="flex-grow: 1; font-size: 16px; line-height: 22px">Deutsch</span><input type="radio" id="lang-de" name="lang" value="de" style="flex: none; width: 20px; height: 20px; margin: 0; accent-color: var(--color-accent-primary)"></label>
<label for="lang-es" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border-top: 1px solid var(--color-border-subtle); cursor: pointer"><span lang="es" style="flex-grow: 1; font-size: 16px; line-height: 22px">Español</span><input type="radio" id="lang-es" name="lang" value="es" style="flex: none; width: 20px; height: 20px; margin: 0; accent-color: var(--color-accent-primary)"></label>
<label for="lang-fr" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border-top: 1px solid var(--color-border-subtle); cursor: pointer"><span lang="fr" style="flex-grow: 1; font-size: 16px; line-height: 22px">Français</span><input type="radio" id="lang-fr" name="lang" value="fr" style="flex: none; width: 20px; height: 20px; margin: 0; accent-color: var(--color-accent-primary)"></label>
<label for="lang-it" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border-top: 1px solid var(--color-border-subtle); cursor: pointer"><span lang="it" style="flex-grow: 1; font-size: 16px; line-height: 22px">Italiano</span><input type="radio" id="lang-it" name="lang" value="it" style="flex: none; width: 20px; height: 20px; margin: 0; accent-color: var(--color-accent-primary)"></label>
<label for="lang-ja" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border-top: 1px solid var(--color-border-subtle); cursor: pointer"><span lang="ja" style="flex-grow: 1; font-size: 16px; line-height: 22px">日本語</span><input type="radio" id="lang-ja" name="lang" value="ja" style="flex: none; width: 20px; height: 20px; margin: 0; accent-color: var(--color-accent-primary)"></label>
<label for="lang-ko" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border-top: 1px solid var(--color-border-subtle); cursor: pointer"><span lang="ko" style="flex-grow: 1; font-size: 16px; line-height: 22px">한국어</span><input type="radio" id="lang-ko" name="lang" value="ko" style="flex: none; width: 20px; height: 20px; margin: 0; accent-color: var(--color-accent-primary)"></label>
<label for="lang-nl" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border-top: 1px solid var(--color-border-subtle); cursor: pointer"><span lang="nl" style="flex-grow: 1; font-size: 16px; line-height: 22px">Nederlands</span><input type="radio" id="lang-nl" name="lang" value="nl" style="flex: none; width: 20px; height: 20px; margin: 0; accent-color: var(--color-accent-primary)"></label>
<label for="lang-pt" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border-top: 1px solid var(--color-border-subtle); cursor: pointer"><span lang="pt" style="flex-grow: 1; font-size: 16px; line-height: 22px">Português</span><input type="radio" id="lang-pt" name="lang" value="pt" style="flex: none; width: 20px; height: 20px; margin: 0; accent-color: var(--color-accent-primary)"></label>
<label for="lang-tr" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border-top: 1px solid var(--color-border-subtle); cursor: pointer"><span lang="tr" style="flex-grow: 1; font-size: 16px; line-height: 22px">Türkçe</span><input type="radio" id="lang-tr" name="lang" value="tr" style="flex: none; width: 20px; height: 20px; margin: 0; accent-color: var(--color-accent-primary)"></label>
<label for="lang-uk" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border-top: 1px solid var(--color-border-subtle); cursor: pointer"><span lang="uk" style="flex-grow: 1; font-size: 16px; line-height: 22px">Українська</span><input type="radio" id="lang-uk" name="lang" value="uk" style="flex: none; width: 20px; height: 20px; margin: 0; accent-color: var(--color-accent-primary)"></label>
</div>
</div>
</fieldset>

<div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--color-bg-sunken)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px; color: var(--color-text-secondary)"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"></path><path d="M9 9h6M9 13h6"></path></svg>
<span style="font-size: 14px; line-height: 20px; color: var(--color-text-secondary)">Past readings in your journal keep the language they were written in. Only new readings change.</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
