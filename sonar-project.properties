# SonarQube project (06 §9, QA11; Phase 3 Sprint 3.5).
#
# ADVISORY ONLY (QA11, RC88): .gitea/workflows/sonarqube-main.yml runs the
# scan on pushes to main and posts the `Taro` quality-gate status to the job
# summary. Neither `ci` nor any deploy workflow queries it; the hard gate is
# tools/check_coverage.py + `ci`.
#
# Quality gate `Taro` (configured in the Sonar UI, MANUAL): coverage on new
# code >= 90 %, overall coverage >= 90 %, duplicated lines on new code <= 3 %,
# 0 new bugs, 0 new vulnerabilities, security hotspots 100 % reviewed,
# maintainability rating A.

sonar.projectKey=taro
sonar.projectName=Taro
# The app version (X.Y.Z of apps/taro/pubspec.yaml). tools/bump_version.sh
# rewrites it on every release so the new-code period rolls forward (a lesson
# from quiz_apps, where an anchored version kept old duplications failing).
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

# Sources and tests share folders; the inclusion/exclusion patterns below put
# every file in exactly one of the two sets.
sonar.sources=apps/taro/lib,packages,worker,tools
sonar.tests=apps/taro/test,packages,worker/test,tools/tests
sonar.test.inclusions=\
  apps/taro/test/**,\
  packages/*/test/**,\
  worker/test/**,\
  tools/tests/**,\
  tools/dart_tools/test/**
sonar.exclusions=\
  **/test/**,\
  tools/tests/**,\
  **/build/**,\
  **/.dart_tool/**,\
  **/coverage/**,\
  **/node_modules/**,\
  **/.venv/**,\
  **/*.egg-info/**,\
  **/__pycache__/**,\
  packages/*/example/**,\
  worker/dist/**,\
  worker/.wrangler/**,\
  worker/evals/cases/**,\
  worker/evals/safety/**,\
  apps/taro/lib/l10n/generated/**,\
  packages/taro_ui/lib/src/tokens/generated/**,\
  worker/src/generated/**,\
  **/*.g.dart,\
  **/*.freezed.dart,\
  **/*.gen.dart,\
  **/generated_plugin_registrant.dart,\
  **/GeneratedPluginRegistrant.*,\
  **/firebase_options_*.dart

# Coverage. Dart: the merged, repo-relative lcov that check_coverage.py
# writes. Worker: vitest istanbul. Tools: pytest-cov XML (tools/ci/test_coverage.sh).
sonar.dart.lcov.reportPaths=coverage/merged/lcov.info
sonar.flutter.coverage.reportPath=coverage/merged/lcov.info
sonar.javascript.lcov.reportPaths=worker/coverage/lcov.info
sonar.python.coverage.reportPaths=tools/coverage.xml
sonar.python.version=3.12

# Coverage exclusions: EXACTLY tools/coverage_exclusions.txt (06 §5.3), same
# order. `tools/check_coverage.py --verify-sonar` fails on any drift; change
# both files, and the 06 §5.3 table, in the same commit.
sonar.coverage.exclusions=\
  apps/taro/lib/l10n/generated/**,\
  packages/taro_ui/lib/src/tokens/generated/**,\
  **/*.g.dart,\
  **/*.freezed.dart,\
  **/*.gen.dart,\
  **/generated_plugin_registrant.dart,\
  **/GeneratedPluginRegistrant.*,\
  **/firebase_options_*.dart,\
  apps/taro/lib/main_*.dart,\
  worker/src/generated/**,\
  **/*.d.ts,\
  worker/worker-configuration.d.ts,\
  **/test/**,\
  **/integration_test/**,\
  worker/test/**,\
  tools/tests/**,\
  worker/evals/cases/**,\
  worker/evals/safety/**

# sonar-flutter plugin: one `flutter analyze --write=analyzer_report.log` per
# package (sonarqube-main.yml).
sonar.lang.patterns.dart=**/*.dart
sonar.flutter.analyzer.mode=report
sonar.flutter.analyzer.reportFile=analyzer_report.log

# Duplication: tests share scaffolding by design; generated code is not ours.
sonar.cpd.exclusions=\
  **/test/**,\
  tools/tests/**,\
  **/*.g.dart,\
  **/*.freezed.dart,\
  **/*.gen.dart,\
  apps/taro/lib/l10n/generated/**,\
  packages/taro_ui/lib/src/tokens/generated/**,\
  worker/src/generated/**
