name: Nightly

# 06 §4, §8; Phase 3 Sprint 3.4. Every night at 03:00 (Gitea evaluates cron
# in the server's time zone): integration on the iOS simulator and the
# Android emulator, the full golden run, npm audit, and a `dart pub outdated`
# report, and the install-size report (01 §16, 02 §17). On Mondays (or with `weekly: true`): check_urls.py online, and the
# `eval:safety` against the staging provider keys (Phase 8 Sprint 8.6).

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      weekly:
        description: 'Also run the Monday-only jobs (URLs, eval:safety)'
        required: false
        type: boolean
        default: false

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  integration:
    uses: ./.gitea/workflows/integration.yml
    with:
      platforms: ios,android

  golden:
    uses: ./.gitea/workflows/golden.yml
    with:
      update: false

  audit:
    name: npm audit + dart pub outdated
    runs-on: macos
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node (worker/.nvmrc, QA14)
        uses: actions/setup-node@v4
        with:
          node-version-file: worker/.nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: npm ci
        working-directory: worker
        run: npm ci

      - name: npm audit (full report, advisory)
        working-directory: worker
        run: |
          npm audit > "$RUNNER_TEMP/npm-audit.txt" 2>&1 || true
          cat "$RUNNER_TEMP/npm-audit.txt"

      - name: npm audit (prod deps, high+, gating)
        working-directory: worker
        run: npm audit --omit=dev --audit-level=high

      - name: Read pinned Flutter version (QA14)
        id: flutter-pin
        run: |
          v=$(sed -n 's/^[[:space:]]*flutter:[[:space:]]*\([0-9][0-9.]*\)[[:space:]]*$/\1/p' pubspec.yaml | head -n 1)
          if [ -z "$v" ]; then
            echo "::error::environment.flutter is missing from the root pubspec.yaml (QA14)"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-pin.outputs.version }}
          channel: stable
          cache: true
          # Host-mode act_runner: a second actions/cache copy inside this
          # composite fails on read-only git packs; the SDK cache is enough.
          pub-cache: false

      - name: dart pub outdated (report only)
        run: |
          dart pub get > /dev/null
          dart pub outdated --show-all > "$RUNNER_TEMP/pub-outdated.txt" 2>&1 || true
          cat "$RUNNER_TEMP/pub-outdated.txt"
          {
            echo "### dart pub outdated"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/pub-outdated.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v3
        with:
          name: nightly-dependency-reports
          path: |
            ${{ runner.temp }}/npm-audit.txt
            ${{ runner.temp }}/pub-outdated.txt
          if-no-files-found: ignore
          retention-days: 14

  # Phase 18 Sprint 18.1 (01 §16, 02 §17): release builds of the prod flavor
  # (Android: debug-signed AAB; iOS: --no-codesign Runner.app), then
  # tools/check_install_size.py: iOS download <= 60 MB, each Android per-ABI
  # split <= 40 MB. A build that fails is a warning and its platform is
  # skipped; an over-budget build fails the job.
  install-size:
    name: Install size report
    runs-on: macos
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Isolate CI Gradle home
        run: echo "GRADLE_USER_HOME=$HOME/.gradle-ci" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Read pinned Flutter version (QA14)
        id: flutter-pin
        run: |
          v=$(sed -n 's/^[[:space:]]*flutter:[[:space:]]*\([0-9][0-9.]*\)[[:space:]]*$/\1/p' pubspec.yaml | head -n 1)
          if [ -z "$v" ]; then
            echo "::error::environment.flutter is missing from the root pubspec.yaml (QA14)"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-pin.outputs.version }}
          channel: stable
          cache: true
          pub-cache: false

      - name: Bootstrap melos
        run: |
          ulimit -n 65536 || true
          mv=$(awk '/^  melos:/{f=1} f && /^    version:/{gsub(/"/, "", $2); print $2; exit}' pubspec.lock)
          dart pub global activate melos "${mv:?melos version not found in pubspec.lock}"
          echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"
          "${PUB_CACHE:-$HOME/.pub-cache}/bin/melos" bootstrap

      - name: Release builds (prod flavor, best effort)
        working-directory: apps/taro
        shell: bash
        run: |
          common=(--release --flavor prod -t lib/main_prod.dart --dart-define-from-file=config/prod.json)
          flutter build appbundle "${common[@]}" \
            || echo "::warning::flutter build appbundle failed; Android size skipped"
          flutter build ios --no-codesign "${common[@]}" \
            || echo "::warning::flutter build ios failed; iOS size skipped"

      - name: Setup Python 3.12 venv (tools/)
        run: |
          py=$(command -v python3.12 || true)
          if [ -z "$py" ]; then
            echo "::error::python3.12 is not on the runner PATH (QA14)"
            exit 1
          fi
          "$py" -m venv tools/.venv
          tools/.venv/bin/python -m pip install --quiet --upgrade pip
          tools/.venv/bin/python -m pip install --quiet -e './tools[dev]'

      - name: check_install_size.py (iOS <= 60 MB, Android per-ABI <= 40 MB)
        run: tools/.venv/bin/python tools/check_install_size.py --report "$GITHUB_STEP_SUMMARY"

  weekly:
    name: Weekly (Monday) - URLs + eval:safety
    runs-on: macos
    timeout-minutes: 90
    env:
      FORCE_WEEKLY: ${{ inputs.weekly && 'true' || 'false' }}
    steps:
      - name: Is it Monday?
        id: day
        run: |
          if [ "$(date +%u)" = "1" ] || [ "$FORCE_WEEKLY" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not Monday; weekly jobs skipped."
          fi

      - name: Checkout repository
        if: ${{ steps.day.outputs.run == 'true' }}
        uses: actions/checkout@v4

      - name: Setup Python 3.12 venv (tools/)
        if: ${{ steps.day.outputs.run == 'true' }}
        run: |
          py=$(command -v python3.12 || true)
          if [ -z "$py" ]; then
            echo "::error::python3.12 is not on the runner PATH (QA14)"
            exit 1
          fi
          "$py" -m venv tools/.venv
          tools/.venv/bin/python -m pip install --quiet --upgrade pip
          tools/.venv/bin/python -m pip install --quiet -e './tools[dev]'

      - name: check_urls.py (online, 05 CS10)
        if: ${{ steps.day.outputs.run == 'true' }}
        run: tools/.venv/bin/python tools/check_urls.py

      - name: Setup Node (worker/.nvmrc, QA14)
        if: ${{ steps.day.outputs.run == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version-file: worker/.nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: npm ci (worker)
        if: ${{ steps.day.outputs.run == 'true' }}
        working-directory: worker
        run: npm ci

      # Phase 8 Sprint 8.6 (05 §4.3, RC60, RC97): the weekly safety eval of
      # every provider + model the default config routes (`ai.provider.*` /
      # `ai.model.*` of paid, free, freeFallback, plus the outage fallback when
      # set), against the real provider APIs with the staging keys from the
      # secrets bundle. Guarded: a provider without a key is skipped with a
      # warning; `--max-usd` caps each run. Defaults: the ~50-case smoke sample
      # and $10 per provider + model (repository variables EVAL_SAFETY_SAMPLE =
      # smoke|all and EVAL_SAFETY_MAX_USD override them). Reports are an
      # artifact; nothing is committed.
      - name: eval:safety (staging providers, weekly)
        if: ${{ steps.day.outputs.run == 'true' }}
        env:
          SECRETS_PASSPHRASE: ${{ secrets.SECRETS_PASSPHRASE }}
          EVAL_SAMPLE: ${{ vars.EVAL_SAFETY_SAMPLE || 'smoke' }}
          EVAL_MAX_USD: ${{ vars.EVAL_SAFETY_MAX_USD || '10' }}
        shell: bash
        run: |
          out="$RUNNER_TEMP/eval-safety"
          mkdir -p "$out"
          if [ -z "${SECRETS_PASSPHRASE:-}" ]; then
            echo "::warning::SECRETS_PASSPHRASE is not set; eval:safety skipped"
            exit 0
          fi
          key_for() {
            # Staging key first (Sprint 8.0), then the shared one; empty when absent.
            v=$(tools/secrets-manager.sh get worker "staging_$1_api_key" 2>/dev/null || true)
            [ -n "$v" ] || v=$(tools/secrets-manager.sh get worker "$1_api_key" 2>/dev/null || true)
            printf '%s' "$v"
          }
          anthropic_key=$(key_for anthropic)
          openai_key=$(key_for openai)
          for k in "$anthropic_key" "$openai_key"; do
            if [ -n "$k" ]; then echo "::add-mask::$k"; fi
            case "$k" in
              *[[:space:]]*) echo "::error::a provider key has whitespace; refusing to use it"; exit 1 ;;
            esac
          done
          routes=$(node -e '
            const s = require("./worker/config/remote_config.default.json").server;
            const pairs = ["paid", "free", "freeFallback"].map((t) => [s["ai.provider." + t], s["ai.model." + t]]);
            if (s["ai.outageFallback.provider"] && s["ai.outageFallback.model"]) {
              pairs.push([s["ai.outageFallback.provider"], s["ai.outageFallback.model"]]);
            }
            console.log([...new Set(pairs.map((p) => p.join(" ")))].join("\n"));
          ')
          status=0
          while read -r provider model; do
            [ -n "$provider" ] || continue
            case "$provider" in
              anthropic) key="$anthropic_key" ;;
              openai) key="$openai_key" ;;
              *) echo "::warning::unknown provider $provider"; continue ;;
            esac
            if [ -z "$key" ]; then
              echo "::warning::no $provider key in the secrets bundle; eval:safety for $provider/$model skipped"
              continue
            fi
            echo "eval:safety $provider/$model (sample $EVAL_SAMPLE, max \$$EVAL_MAX_USD)"
            rc=0
            if [ "$provider" = "anthropic" ]; then
              (cd worker && ANTHROPIC_API_KEY="$key" npm run -s eval:safety -- --env staging \
                --provider "$provider" --model "$model" --prompt v1 --sample "$EVAL_SAMPLE" \
                --max-usd "$EVAL_MAX_USD" --out "$out") || rc=$?
            else
              (cd worker && OPENAI_API_KEY="$key" npm run -s eval:safety -- --env staging \
                --provider "$provider" --model "$model" --prompt v1 --sample "$EVAL_SAMPLE" \
                --max-usd "$EVAL_MAX_USD" --out "$out") || rc=$?
            fi
            if [ "$rc" != "0" ]; then
              echo "::error::eval:safety $provider/$model exited $rc (3 = 05 §4.3 bar failed or incomplete, 4 = budget)"
              status=1
            fi
          done <<< "$routes"
          {
            echo "### eval:safety (weekly, $EVAL_SAMPLE)"
            echo ""
            for f in "$out"/*.md; do
              [ -e "$f" ] || continue
              echo "- $(basename "$f"): $(grep -m1 -o 'Verdict: \*\*[A-Z]*\*\*' "$f" || echo 'no verdict')"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload eval:safety reports
        if: ${{ always() && steps.day.outputs.run == 'true' }}
        uses: actions/upload-artifact@v3
        with:
          name: eval-safety-reports
          path: ${{ runner.temp }}/eval-safety
          if-no-files-found: ignore
          retention-days: 90
