name: Reusable - Native plugin tests + coverage

# RC40, 06 §5.2. taro_attestation's Swift code (XCTest in the example
# Runner, xccov -> lcov) and Kotlin code (JUnit/Robolectric, JaCoCo -> lcov),
# gated at >= 90% as the units taro_attestation_ios / taro_attestation_android
# by check_coverage.py in ci.yml's coverage-gate job.
#
# The scripts own the details (tools/ci/native_coverage_{ios,android}.sh);
# this job provides the toolchain and ships every report they write.

on:
  workflow_call:

jobs:
  test:
    name: Native tests (XCTest + JUnit, coverage)
    runs-on: macos
    timeout-minutes: 60
    env:
      LANG: en_US.UTF-8
      LANGUAGE: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Same lesson as quiz_apps' Android deploy: the developer's ~/.gradle is
      # shared with Android Studio, whose daemons corrupt the kotlin-dsl cache
      # under CI. A dedicated CI Gradle home avoids the collision. It is also
      # exported inline below, since $GITHUB_ENV did not always reach Gradle.
      - name: Isolate CI Gradle home
        run: echo "GRADLE_USER_HOME=$HOME/.gradle-ci" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Read pinned Flutter version (QA14)
        id: flutter-pin
        run: |
          v=$(sed -n 's/^[[:space:]]*flutter:[[:space:]]*\([0-9][0-9.]*\)[[:space:]]*$/\1/p' pubspec.yaml | head -n 1)
          if [ -z "$v" ]; then
            echo "::error::environment.flutter is missing from the root pubspec.yaml (QA14)"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-pin.outputs.version }}
          channel: stable
          cache: true

      - name: Bootstrap melos
        run: |
          ulimit -n 65536 || true
          mv=$(awk '/^  melos:/{f=1} f && /^    version:/{gsub(/"/, "", $2); print $2; exit}' pubspec.lock)
          dart pub global activate melos "${mv:?melos version not found in pubspec.lock}"
          echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"
          "${PUB_CACHE:-$HOME/.pub-cache}/bin/melos" bootstrap

      - name: Setup Python 3.12 venv (xccov/JaCoCo converters)
        run: |
          py=$(command -v python3.12 || true)
          if [ -z "$py" ]; then
            echo "::error::python3.12 is not on the runner PATH (QA14)"
            exit 1
          fi
          "$py" -m venv tools/.venv
          tools/.venv/bin/python -m pip install --quiet --upgrade pip
          tools/.venv/bin/python -m pip install --quiet -e './tools[dev]'

      - name: Show Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Mark report start time
        run: touch "$RUNNER_TEMP/native-start.marker"

      - name: iOS XCTest coverage (taro_attestation_ios)
        run: |
          ulimit -n 65536 || true
          tools/ci/native_coverage_ios.sh

      - name: Android JUnit coverage (taro_attestation_android)
        run: |
          export GRADLE_USER_HOME="$HOME/.gradle-ci"
          tools/ci/native_coverage_android.sh

      - name: Pack native coverage reports
        if: ${{ !cancelled() }}
        run: |
          # Every coverage-looking file the scripts wrote (lcov, xccov JSON,
          # JaCoCo XML), repo-relative, so the gate sees the same paths.
          # (tools/ci/native_coverage_*.sh write packages/taro_attestation/coverage/{ios,android}/.)
          find . \( -name node_modules -o -name .dart_tool -o -name Pods -o -name .gradle -o -name .git -o -name '*.xcresult' \) -prune \
            -o -type f -newer "$RUNNER_TEMP/native-start.marker" \
               \( -path '*coverage*' -o -path '*jacoco*' -o -path '*xccov*' -o -name '*.lcov' \) \
               ! -name '*.html' ! -name '*.css' ! -name '*.js' ! -name '*.png' ! -name '*.gif' \
               -print > "$RUNNER_TEMP/native-reports.txt"
          cat "$RUNNER_TEMP/native-reports.txt"
          if [ -s "$RUNNER_TEMP/native-reports.txt" ]; then
            tar -czf "$RUNNER_TEMP/coverage-native.tgz" -T "$RUNNER_TEMP/native-reports.txt"
          else
            echo "::warning::the native coverage scripts wrote no reports"
          fi

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v3
        with:
          name: coverage-native
          path: ${{ runner.temp }}/coverage-native.tgz
          if-no-files-found: ignore
          retention-days: 7
