name: Integration

# 06 §4, §8. `melos run test:integration` (patrol from Phase 13) on the
# devices pinned in tools/ci/sim.env. ci.yml calls this on every mirrored
# push with platforms=ios; nightly.yml calls it at 03:00 with ios,android.
# (The schedule lives in nightly.yml only, so a capacity-1 runner never runs
# the same suite twice a night.)
#
# The melos script receives the device through TARO_DEVICE_ID and the
# platform through TARO_INTEGRATION_PLATFORM (ios | android).

on:
  workflow_call:
    inputs:
      platforms:
        description: 'Comma-separated: ios, android'
        required: false
        type: string
        default: ios
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to run'
        required: true
        type: choice
        options:
          - ios
          - android
          - ios,android
        default: ios

jobs:
  ios:
    name: Integration (iOS simulator)
    if: ${{ contains(inputs.platforms, 'ios') }}
    runs-on: macos
    timeout-minutes: 60
    env:
      LANG: en_US.UTF-8
      LANGUAGE: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      TARO_INTEGRATION_PLATFORM: ios
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load device pins (tools/ci/sim.env)
        run: |
          set -a
          . tools/ci/sim.env
          set +a
          grep -E '^[A-Z_][A-Z0-9_]*=' tools/ci/sim.env >> "$GITHUB_ENV"
          current=$(xcodebuild -version | sed -n 's/^Xcode //p')
          if [ "$current" != "$EXPECTED_XCODE" ]; then
            echo "::warning::Runner Xcode $current differs from the pin EXPECTED_XCODE=$EXPECTED_XCODE in tools/ci/sim.env"
          fi

      - name: Read pinned Flutter version (QA14)
        id: flutter-pin
        run: |
          v=$(sed -n 's/^[[:space:]]*flutter:[[:space:]]*\([0-9][0-9.]*\)[[:space:]]*$/\1/p' pubspec.yaml | head -n 1)
          if [ -z "$v" ]; then
            echo "::error::environment.flutter is missing from the root pubspec.yaml (QA14)"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-pin.outputs.version }}
          channel: stable
          cache: true
          # Host-mode act_runner: a second actions/cache copy inside this
          # composite fails on read-only git packs; the SDK cache is enough.
          pub-cache: false

      - name: Bootstrap melos
        run: |
          ulimit -n 65536 || true
          mv=$(awk '/^  melos:/{f=1} f && /^    version:/{gsub(/"/, "", $2); print $2; exit}' pubspec.lock)
          dart pub global activate melos "${mv:?melos version not found in pubspec.lock}"
          echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"
          "${PUB_CACHE:-$HOME/.pub-cache}/bin/melos" bootstrap

      - name: Create, erase and boot the pinned simulator
        run: |
          udid=$(xcrun simctl list devices -j \
            | jq -r --arg rt "$IOS_SIM_RUNTIME" --arg n "$IOS_SIM_NAME" \
                '[(.devices[$rt] // [])[] | select(.name == $n and .isAvailable) | .udid] | first // empty')
          if [ -z "$udid" ]; then
            udid=$(xcrun simctl create "$IOS_SIM_NAME" "$IOS_SIM_DEVICE_TYPE" "$IOS_SIM_RUNTIME")
          fi
          xcrun simctl shutdown "$udid" 2>/dev/null || true
          xcrun simctl erase "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "TARO_DEVICE_ID=$udid" >> "$GITHUB_ENV"
          echo "Booted $IOS_SIM_NAME ($udid) on $IOS_SIM_RUNTIME"

      - name: melos run test:integration
        run: |
          ulimit -n 65536 || true
          melos run test:integration

      - name: Shut down simulator
        if: ${{ always() }}
        run: |
          if [ -n "${TARO_DEVICE_ID:-}" ]; then
            xcrun simctl shutdown "$TARO_DEVICE_ID" 2>/dev/null || true
          fi

  android:
    name: Integration (Android emulator)
    if: ${{ contains(inputs.platforms, 'android') }}
    runs-on: macos
    timeout-minutes: 75
    env:
      TARO_INTEGRATION_PLATFORM: android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Isolate CI Gradle home
        run: echo "GRADLE_USER_HOME=$HOME/.gradle-ci" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Load device pins (tools/ci/sim.env) and the Android SDK
        run: |
          grep -E '^[A-Z_][A-Z0-9_]*=' tools/ci/sim.env >> "$GITHUB_ENV"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
          if [ ! -d "$sdk" ]; then
            echo "::error::Android SDK not found at $sdk"
            exit 1
          fi
          {
            echo "ANDROID_HOME=$sdk"
            echo "ANDROID_SDK_ROOT=$sdk"
          } >> "$GITHUB_ENV"
          {
            echo "$sdk/emulator"
            echo "$sdk/platform-tools"
            echo "$sdk/cmdline-tools/latest/bin"
          } >> "$GITHUB_PATH"

      - name: Read pinned Flutter version (QA14)
        id: flutter-pin
        run: |
          v=$(sed -n 's/^[[:space:]]*flutter:[[:space:]]*\([0-9][0-9.]*\)[[:space:]]*$/\1/p' pubspec.yaml | head -n 1)
          if [ -z "$v" ]; then
            echo "::error::environment.flutter is missing from the root pubspec.yaml (QA14)"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-pin.outputs.version }}
          channel: stable
          cache: true
          # Host-mode act_runner: a second actions/cache copy inside this
          # composite fails on read-only git packs; the SDK cache is enough.
          pub-cache: false

      - name: Bootstrap melos
        run: |
          ulimit -n 65536 || true
          mv=$(awk '/^  melos:/{f=1} f && /^    version:/{gsub(/"/, "", $2); print $2; exit}' pubspec.lock)
          dart pub global activate melos "${mv:?melos version not found in pubspec.lock}"
          echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"
          "${PUB_CACHE:-$HOME/.pub-cache}/bin/melos" bootstrap

      - name: Create and boot the pinned emulator
        run: |
          image="system-images;android-${ANDROID_API_LEVEL};${ANDROID_IMAGE_TAG};${ANDROID_ABI}"
          image_dir="$ANDROID_HOME/system-images/android-${ANDROID_API_LEVEL}/${ANDROID_IMAGE_TAG}/${ANDROID_ABI}"
          if [ ! -d "$image_dir" ]; then
            # `yes` dies of SIGPIPE when sdkmanager exits; judge by the result.
            yes | sdkmanager "$image" > /dev/null || true
            [ -d "$image_dir" ] || { echo "::error::could not install $image"; exit 1; }
          fi
          avds=$(avdmanager list avd -c)
          if ! printf '%s\n' "$avds" | grep -qx "$ANDROID_AVD_NAME"; then
            echo no | avdmanager create avd -n "$ANDROID_AVD_NAME" -k "$image" -d "$ANDROID_AVD_DEVICE"
          fi
          serial="emulator-${ANDROID_EMULATOR_PORT}"
          nohup emulator -avd "$ANDROID_AVD_NAME" -port "$ANDROID_EMULATOR_PORT" \
            -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data \
            -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          echo "EMULATOR_PID=$!" >> "$GITHUB_ENV"
          adb -s "$serial" wait-for-device
          booted=""
          i=0
          while [ "$i" -lt 60 ]; do
            booted=$(adb -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$booted" = "1" ] && break
            i=$((i + 1))
            sleep 5
          done
          if [ "$booted" != "1" ]; then
            echo "::error::emulator did not boot in 300 s"
            tail -n 50 "$RUNNER_TEMP/emulator.log"
            exit 1
          fi
          adb -s "$serial" shell settings put global window_animation_scale 0
          adb -s "$serial" shell settings put global transition_animation_scale 0
          adb -s "$serial" shell settings put global animator_duration_scale 0
          echo "TARO_DEVICE_ID=$serial" >> "$GITHUB_ENV"

      - name: melos run test:integration
        run: |
          export GRADLE_USER_HOME="$HOME/.gradle-ci"
          ulimit -n 65536 || true
          melos run test:integration

      - name: Stop emulator
        if: ${{ always() }}
        run: |
          if [ -n "${TARO_DEVICE_ID:-}" ]; then
            adb -s "$TARO_DEVICE_ID" emu kill 2>/dev/null || true
          fi
          if [ -n "${EMULATOR_PID:-}" ]; then
            kill "$EMULATOR_PID" 2>/dev/null || true
          fi
