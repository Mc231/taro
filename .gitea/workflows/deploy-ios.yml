name: Deploy iOS

# 06 §8, Phase 10 Sprint 10.6. Manual: builds the prod flavor (universal,
# RC24) with fastlane (apps/taro/fastlane) and uploads it:
#   beta    → TestFlight, internal groups only, never a public link (RC63)
#   release → App Store Connect binary; submit_for_review=true also submits it
# beta_internal (prodStaging, RC78) waits for that build configuration
# (docs/runbooks/RELEASE.md § prodStaging).
#
# Gates: `CI / coverage-gate` green on this SHA (Gitea commit status), the
# CHANGELOG check (release: a `## [X.Y.Z]` section for the pubspec version),
# and a build number above the last TestFlight build (the Fastfile).
# Secrets: decrypted into $RUNNER_TEMP, masked, removed in an always() step.
# Signing: shared Apple Distribution certificate in a throwaway keychain, the
# App Store profile "Taro iOS Distribution" (docs/runbooks/RELEASE.md § Signing).

on:
  workflow_dispatch:
    inputs:
      lane:
        description: 'fastlane ios lane'
        required: true
        type: choice
        options:
          - beta
          - release
        default: beta
      submit_for_review:
        description: 'release only: submit the build for App Review'
        required: false
        type: boolean
        default: false
      build_number:
        description: 'optional build number (default: max(last TestFlight + 1, pubspec))'
        required: false
        type: string
        default: ''

# Deploys queue; they never cancel an in-flight run (06 §8 Rules).
concurrency:
  group: deploy-ios
  cancel-in-progress: false

jobs:
  deploy:
    name: fastlane ios ${{ inputs.lane }}
    runs-on: macos
    timeout-minutes: 90
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require CI green on this SHA
        env:
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          state=$(curl -fsS -H "Authorization: token $TOKEN" "$API/commits/$SHA/statuses?limit=50" \
            | jq -r '[.[] | select(.context | startswith("CI / coverage-gate"))][0].status // "missing"')
          echo "CI / coverage-gate on $SHA: $state"
          if [ "$state" != "success" ]; then
            echo "::error::CI is not green on $SHA ($state); deploys need a green ci run (06 §8)"
            exit 1
          fi

      - name: Set up tools venv
        shell: bash
        run: |
          set -euo pipefail
          python3.12 -m venv tools/.venv
          tools/.venv/bin/python -m pip install --quiet -e './tools[dev]'

      - name: Check CHANGELOG
        env:
          LANE: ${{ inputs.lane }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' apps/taro/pubspec.yaml)
          if [ "$LANE" = "release" ]; then
            tools/.venv/bin/python tools/check_changelog.py --version "$version"
          else
            tools/.venv/bin/python tools/check_changelog.py
          fi

      - name: Decrypt secrets
        env:
          SECRETS_PASSPHRASE: ${{ secrets.SECRETS_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          tools/secrets-manager.sh decrypt-to "$RUNNER_TEMP/secrets.json" 2>/dev/null
          s="$RUNNER_TEMP/secrets.json"
          for path in shared.apple_distribution_cert_password shared.app_store_connect_api_key_base64 \
                      shared.apple_distribution_cert_base64 taro.ios_provisioning_profile_base64; do
            v=$(jq -r ".$path // empty" "$s")
            if [ -z "$v" ]; then
              echo "::error::secrets bundle: $path is empty (docs/runbooks/RELEASE.md § Signing)"
              exit 1
            fi
          done
          echo "::add-mask::$(jq -r '.shared.apple_distribution_cert_password' "$s")"
          {
            echo "APP_STORE_CONNECT_API_KEY_ID=$(jq -r '.shared.app_store_connect_api_key_id' "$s")"
            echo "APP_STORE_CONNECT_API_ISSUER_ID=$(jq -r '.shared.app_store_connect_api_issuer_id' "$s")"
          } >> "$GITHUB_ENV"
          jq -r '.shared.app_store_connect_api_key_base64' "$s" > "$RUNNER_TEMP/asc_key.b64"
          jq -r '.shared.apple_distribution_cert_base64' "$s" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          jq -r '.taro.ios_provisioning_profile_base64' "$s" | base64 --decode > "$RUNNER_TEMP/taro.mobileprovision"
          chmod 600 "$RUNNER_TEMP/asc_key.b64" "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/taro.mobileprovision"

      - name: Install certificate and profile
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/taro-build.keychain-db"
          security delete-keychain "$kc" 2>/dev/null || true
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$kc"
          security set-keychain-settings -t 3600 -u "$kc"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$kc"
          password=$(jq -r '.shared.apple_distribution_cert_password' "$RUNNER_TEMP/secrets.json")
          security import "$RUNNER_TEMP/dist.p12" -k "$kc" -P "$password" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          unset password
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$kc" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$dir"
          uuid=$(security cms -D -i "$RUNNER_TEMP/taro.mobileprovision" | plutil -extract UUID raw -)
          cp "$RUNNER_TEMP/taro.mobileprovision" "$dir/$uuid.mobileprovision"
          echo "PROFILE_UUID=$uuid" >> "$GITHUB_ENV"

      - name: Bootstrap workspace
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager
          dart pub global activate melos >/dev/null
          melos bootstrap
          (cd apps/taro/ios && pod install)

      - name: Install fastlane
        working-directory: apps/taro/fastlane
        shell: bash
        run: |
          set -euo pipefail
          bundle config set --local path "$HOME/.gem/taro-bundle"
          bundle install --quiet

      - name: fastlane ios ${{ inputs.lane }}
        working-directory: apps/taro/fastlane
        env:
          LANE: ${{ inputs.lane }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          SUBMIT_FOR_REVIEW: ${{ inputs.submit_for_review }}
        shell: bash
        run: |
          set -euo pipefail
          APP_STORE_CONNECT_API_KEY_BASE64=$(cat "$RUNNER_TEMP/asc_key.b64")
          export APP_STORE_CONNECT_API_KEY_BASE64
          bundle exec fastlane ios "$LANE"

      - name: Clean up secrets and keychain
        if: always()
        shell: bash
        run: |
          kc="$RUNNER_TEMP/taro-build.keychain-db"
          security list-keychains -d user -s login.keychain-db || true
          security delete-keychain "$kc" 2>/dev/null || true
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          for f in secrets.json asc_key.b64 dist.p12 taro.mobileprovision; do
            [ -f "$RUNNER_TEMP/$f" ] && rm -P "$RUNNER_TEMP/$f"
          done
          true
