# taro-api — Cloudflare Worker (03_BACKEND_WORKER.md §1, §11; GLOSSARY §6.1)
#
# Bindings are NOT inherited by [env.*] blocks, so every environment declares
# its own. [env.dev] keeps placeholder IDs (local miniflare only); staging and
# prod hold the real D1/KV IDs created in Phase 6 Sprint 6.0 (2026-09-29).
# Rate-limit namespace_ids are account-unique integers we choose.
#
# Test-only vars (ALLOW_DEBUG_ATTESTATION, AI_PROVIDER, DEBUG_ATTESTATION_TOKEN)
# may appear ONLY under [env.dev] / [env.staging] (BE20, RC86). [env.prod] must
# never define them: makeProdDeps() throws at startup and
# tools/check_worker_env.py fails CI if it does.

# Top-level name is deliberately NOT the prod name: a bare `wrangler deploy`
# (no --env) must never overwrite prod. Always pass --env dev|staging|prod.
name = "taro-api-dev"
main = "src/index.ts"
# Pinned; bump deliberately (03 §1). Must not be newer than the workerd bundled
# with @cloudflare/vitest-pool-workers.
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Prompt templates (prompts/**/*.md, 03 §9.2) are bundled as text modules.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = false

# ---------------------------------------------------------------------------
# dev — local `wrangler dev` / vitest (miniflare)
# ---------------------------------------------------------------------------
[env.dev]
name = "taro-api-dev"

[env.dev.vars]
ENVIRONMENT = "dev"
ALLOW_DEBUG_ATTESTATION = "true"
AI_PROVIDER = "fake"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "taro-dev"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[env.dev.kv_namespaces]]
binding = "CONFIG_KV"
id = "00000000000000000000000000000001"

[[env.dev.kv_namespaces]]
binding = "RL_KV"
id = "00000000000000000000000000000002"

[[env.dev.kv_namespaces]]
binding = "CACHE_KV"
id = "00000000000000000000000000000003"

[[env.dev.analytics_engine_datasets]]
binding = "METRICS"
dataset = "taro_api_events"

[[env.dev.ratelimits]]
name = "RL_BURST"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[env.dev.ratelimits]]
name = "RL_READINGS"
namespace_id = "1002"
simple = { limit = 6, period = 60 }

# Cron triggers (03 §12; jobs in src/scheduled.ts CRON_JOBS).
[env.dev.triggers]
crons = ["*/15 * * * *", "7 * * * *", "30 3 * * *"]

# ---------------------------------------------------------------------------
# staging — taro-api-staging (api-staging.taro.vshyrochuk.com)
# ---------------------------------------------------------------------------
[env.staging]
name = "taro-api-staging"
routes = [{ pattern = "api-staging.taro.vshyrochuk.com", custom_domain = true }]

[env.staging.vars]
ENVIRONMENT = "staging"
ALLOW_DEBUG_ATTESTATION = "true"
# No AI_PROVIDER: real providers are routed by ai.provider.* (RC97).

[[env.staging.d1_databases]]
binding = "DB"
database_name = "taro-staging"
database_id = "ad790568-1aa5-40db-89e1-12765782548f"
migrations_dir = "migrations"

[[env.staging.kv_namespaces]]
binding = "CONFIG_KV"
id = "3496c85a92e34e1b8e734dcb7c302ed8"

[[env.staging.kv_namespaces]]
binding = "RL_KV"
id = "1e385c09d3594792b3c6f66d581e54f3"

[[env.staging.kv_namespaces]]
binding = "CACHE_KV"
id = "1bd5a308e162423d8c5ce1aba494d8ab"

[[env.staging.analytics_engine_datasets]]
binding = "METRICS"
dataset = "taro_api_events"

[[env.staging.ratelimits]]
name = "RL_BURST"
namespace_id = "2001"
simple = { limit = 60, period = 60 }

[[env.staging.ratelimits]]
name = "RL_READINGS"
namespace_id = "2002"
simple = { limit = 6, period = 60 }

# Cron triggers (03 §12; jobs in src/scheduled.ts CRON_JOBS).
[env.staging.triggers]
crons = ["*/15 * * * *", "7 * * * *", "30 3 * * *"]

# ---------------------------------------------------------------------------
# prod — taro-api (api.taro.vshyrochuk.com). NO test-only vars here (RC86).
# ---------------------------------------------------------------------------
[env.prod]
name = "taro-api"
routes = [{ pattern = "api.taro.vshyrochuk.com", custom_domain = true }]

[env.prod.vars]
ENVIRONMENT = "prod"

[[env.prod.d1_databases]]
binding = "DB"
database_name = "taro-prod"
database_id = "db4b87ea-ddaa-4b99-90b8-85ddba0b766c"
migrations_dir = "migrations"

[[env.prod.kv_namespaces]]
binding = "CONFIG_KV"
id = "3142a148a98144a3a7f88be2468bfbf3"

[[env.prod.kv_namespaces]]
binding = "RL_KV"
id = "3f2b18f2be8a4866939c6f9ba8e5fb3c"

[[env.prod.kv_namespaces]]
binding = "CACHE_KV"
id = "637cf532bef24939b3004f975598c976"

[[env.prod.analytics_engine_datasets]]
binding = "METRICS"
dataset = "taro_api_events"

[[env.prod.ratelimits]]
name = "RL_BURST"
namespace_id = "3001"
simple = { limit = 60, period = 60 }

[[env.prod.ratelimits]]
name = "RL_READINGS"
namespace_id = "3002"
simple = { limit = 6, period = 60 }

# Cron triggers (03 §12; jobs in src/scheduled.ts CRON_JOBS).
[env.prod.triggers]
crons = ["*/15 * * * *", "7 * * * *", "30 3 * * *"]
