# ---------------------------------------------------------------------------
# prod — taro-api (api.taro.vshyrochuk.com). NO test-only vars here (RC86).
# ---------------------------------------------------------------------------
[env.prod]
name = "taro-api"

[env.prod.vars]
ENVIRONMENT = "prod"

[[env.prod.d1_databases]]
binding = "DB"
database_name = "taro-prod"
database_id = "00000000-0000-0000-0000-000000000000"
