[[env.staging.kv_namespaces]]
binding = "RL_KV"
id = "00000000000000000000000000000012"

[[env.staging.kv_namespaces]]
binding = "CACHE_KV"
id = "00000000000000000000000000000013"

[[env.staging.analytics_engine_datasets]]
binding = "METRICS"
dataset = "taro_api_events"

[[env.staging.ratelimits]]
