name: taro_workspace
description: Taro monorepo workspace root (pub workspace + melos 8).
publish_to: none

environment:
  sdk: ^3.9.0
  # QA14 pin: the toolchain every contributor and the CI runner uses.
  flutter: 3.44.8

workspace:
  - apps/taro
  - packages/taro_attestation
  - packages/taro_attestation/example
  - packages/taro_core
  - packages/taro_ui
  - tools/dart_tools

dev_dependencies:
  melos: ^8.9.0
  very_good_analysis: ^10.3.0

# Flutter 3.44.8 pins test_api 0.7.11, so `test` (taro_core, dart_tools)
# caps analyzer below 13 and drift_dev at 2.34.0, which declares
# cli_util ^0.4 while melos 8 needs cli_util >= 0.5. drift_dev only uses
# cli_util's Ansi/Logger (unchanged in 0.5; drift_dev 2.34.1 widened its
# constraint to <0.6). Remove when Flutter ships Dart 3.13 and drift_dev
# 2.35 resolves. See docs/phase2_notes/FLUTTER_NOTES.md.
dependency_overrides:
  cli_util: ^0.5.0

melos:
  repository: https://github.com/Mc231/taro

  command:
    bootstrap:
      hooks:
        # gen-l10n output is not committed (02 §11); produce it right after
        # `pub get` so analyze/test work on a fresh checkout.
        post: melos run gen:l10n

  scripts:
    gen:
      description: Run every code generator (gen-l10n, then build_runner for freezed).
      run: melos run gen:l10n && melos run gen:build

    gen:build:
      description: build_runner (freezed) in every package that uses it; `*.freezed.dart` is committed and excluded from coverage (RC16).
      exec:
        command: dart run build_runner build --delete-conflicting-outputs
        concurrency: 1
      packageFilters:
        dependsOn: build_runner

    gen:tokens:
      description: Generate TaroTokens (taro_tokens.g.dart) from docs/design/taro.tokens.json (02 §14.1); CI runs it with --check and validate_tokens.
      run: dart run tools/tokens/generate.dart && dart run tools/tokens/validate_tokens.dart

    gen:state_inventory:
      description: Generate docs/design/STATE_INVENTORY.md from the screen controllers' sealed state unions (Phase 13.4); `-- --check` fails when it is stale.
      run: dart run tools/dart_tools/bin/gen_state_inventory.dart

    gen:l10n:
      description: Generate TaroLocalizations from the ARB files.
      exec:
        command: flutter gen-l10n
        concurrency: 1
      packageFilters:
        scope: taro

    analyze:
      description: Static analysis with fatal infos (06 §6.1).
      exec:
        command: flutter analyze --fatal-infos --no-pub
        concurrency: 1

    format:check:
      description: Fail when any Dart file is not formatted (06 §6.1).
      exec:
        command: dart format --output=none --set-exit-if-changed .
        concurrency: 1

    test:
      description: Run the unit and widget tests of every package that has a test/ folder.
      exec:
        command: flutter test --no-pub
        concurrency: 1
        failFast: true
      packageFilters:
        dirExists: test

    test:fast:
      description: Unit tests only (placeholder until Phase 3 splits tags).
      exec:
        command: flutter test --no-pub --exclude-tags golden
        concurrency: 1
        failFast: true
      packageFilters:
        dirExists: test

    test:coverage:
      description: Coverage reports for every unit (06 §5.1, §5.2; Dart gen_coverage_all + flutter test + lcov --remove, worker, tools, native RC40). TARO_SKIP_NATIVE_COVERAGE=1 skips native.
      run: bash tools/ci/test_coverage.sh

    test:golden:
      description: Golden tests only (placeholder until Phase 3).
      exec:
        command: flutter test --no-pub --tags golden
        concurrency: 1
      packageFilters:
        dirExists: test

    golden:update:
      description: Regenerate goldens in every package with test/golden/ (06 §3). Refuses off the reference platform (macOS arm64 + the pinned Flutter; the CI runner) unless given --force-local, whose output is never committed.
      run: $(test -x tools/.venv/bin/python && echo tools/.venv/bin/python || echo python3) tools/golden_update.py

    test:integration:
      description: Device tests on a booted simulator/emulator (06 §4). Env TARO_INTEGRATION_PLATFORM (ios|android) and TARO_DEVICE_ID; patrol flows from Phase 13, integration_test spikes until then.
      run: bash tools/run_integration.sh

    check:
      description: The fast local gate, tools/verify.sh --fast (format, analyze, every repo check, gitleaks, test:fast; 06 §6.4).
      run: bash tools/verify.sh --fast

    contract:sync:
      description: Mirror worker/test/contract/fixtures into apps/taro/test/contract/fixtures (06 QA15, RC38). --dry-run prints the plan.
      run: $(test -x tools/.venv/bin/python && echo tools/.venv/bin/python || echo python3) tools/contract_sync.py

    hooks:install:
      description: Point git at tools/githooks (commit-msg -> check_commit_msg.py, pre-push -> tools/verify.sh --fast; 06 §6.4).
      run: git config core.hooksPath tools/githooks && echo "hooks installed (core.hooksPath=tools/githooks)"

    coverage:check:
      description: Coverage gate, >= 90 % per unit and >= 70 % per file (06 QA1-QA4; writes coverage/summary.md).
      run: $(test -x tools/.venv/bin/python && echo tools/.venv/bin/python || echo python3) tools/check_coverage.py --verify-sonar
