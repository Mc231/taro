# Banned phrases for store copy, in-app text and deck content.
#
# Content owned by 05_COMPLIANCE_STORE_ASO.md §9.5 (per-locale table, "Also
# banned" line) and seeded with the 06 §6.2 list. Canonical path (RC39): the
# Worker L3 output lexicon (03 §9.4) is compiled from this file by
# `tools/content build`; there is no other copy.
#
# Matching (tools/store_copy/check_store_copy.py): text and phrases are
# NFKC-normalized and case-folded, curly apostrophes become "'". A phrase is a
# sequence of whitespace-separated tokens matched on word boundaries; a token
# ending in `*` is a stem (any word continuing it matches, e.g. `guarantee*`
# also matches "guaranteed"). Locales with `match: substring` (no spaces
# between words, e.g. ja) match anywhere, `*` ignored.
#
# Lists per block:
#   global         banned in every surface of that locale
#   apple_only     banned in Apple-facing fields (App Store metadata) — rule
#                  apple_fields_no_android
#   play_only      banned in Play-facing fields — rule play_fields_no_apple
#   name_subtitle  banned in the app name / subtitle / Play title only
#                  ("free" is allowed in the keyword field, 05 §9.5)
#   allowed_contexts
#                  exact spans removed before matching: negated uses in the
#                  fixed compliance copy (05 §3), e.g. "not medical … advice".
#                  The locale's required disclaimer sentence
#                  (required_sentences.yaml) is always removed as well.
# `common` applies to every locale in addition to its own block.

version: 1

common:
  global:
    - "100%"
    - "#1"
    - "no.1"
    - "no. 1"
  apple_only:
    - android
    - google play
    - play store
    - google
  play_only:
    - iphone
    - ipad
    - app store
    - ios

locales:
  en:
    global:
      # 06 §6.2 seed list
      - accurate
      - guaranteed
      - real psychic
      - predict your future
      - know your future
      - medical
      - cure
      - win the lottery
      - free unlimited
      - limited time          # fake urgency
      # 05 §9.5
      - accuracy
      - precise
      - true reading
      - guarantee*
      - psychic*
      - medium
      - clairvoyan*
      - spirits say
      - will happen
      - heal
      - heals
      - healing
      - cures
      - cured
      - therapy
      - therapist*
      - therapeutic
      - spell
      - spells
      - hex
      - love spell
      - best
    name_subtitle:
      - free
    allowed_contexts:
      - "not medical, legal, financial or psychological advice"
      # 04 MO18 / §14: the computed S11 pack badge, never a product claim
      - "best value"

