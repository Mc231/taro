- tarot
- tarot reading
- daily card
- journal
privacy_policy_url: https://taro.vshyrochuk.com/privacy
whats_new: "Welcome to Taro.\n"
app_review_information:
  contact_email: volodymyr.shyrochuk@gmail.com
  notes: "APP PURPOSE\nTaro is a tarot app for entertainment and self-reflection.\n\nHOW TO REVIEW (no login needed)\n1. Launch and complete onboarding.\n2. Choose \"Allow AI readings\" (choosing \"Not now\" still works).\n3. On Today, tap “Start a reading”, then tap \"Begin\".\n4. Settings: \"Remove Banner Ads\", \"Restore purchases\".\n\nSAFETY\nTry for example: \"Am I pregnant?\".\n\nEXTERNAL SERVICES\n- App Attest (iOS) and Play Integrity (Android) protect free readings.\n"
