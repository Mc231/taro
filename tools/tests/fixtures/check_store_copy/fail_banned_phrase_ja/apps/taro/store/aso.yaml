app_identifier: taro
short_description: 'AI tarot readings for reflection: daily card, spreads, journal'
full_description: "Taro is for entertainment and self-reflection. It does not predict the future and is not a substitute for professional advice.\n\nAsk a question, draw your cards and read what they could mean for you.\n\nPrivacy Policy: https://taro.vshyrochuk.com/privacy\n"
