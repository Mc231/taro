# App icon (Phase 16 Sprint 16.1): `dart run flutter_launcher_icons` from
# apps/taro. Sources are the Phase 14 masters in docs/design/assets/icon/
# (README there): an opaque 1024 px iOS icon and the Android adaptive layers.
flutter_launcher_icons:
  image_path: "../../docs/design/assets/icon/app-icon-1024.png"
  ios: true
  remove_alpha_ios: true
  android: "ic_launcher"
  min_sdk_android: 24
  # The masters already keep the mark inside the 66 dp safe circle.
  adaptive_icon_foreground_inset: 0
  adaptive_icon_foreground: "../../docs/design/assets/icon/android-foreground.png"
  adaptive_icon_background: "../../docs/design/assets/icon/android-background.png"
  adaptive_icon_monochrome: "../../docs/design/assets/icon/android-monochrome.png"
