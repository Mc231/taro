      개인정보 보호 중심 설계
      계정도 로그인도 필요 없습니다. 저널과 기록을 파일로 내보내 새 휴대폰에서 가져올 수 있습니다. 언제든 데이터를 삭제할 수 있습니다.

      AI 리딩
      해석은 AI가 작성하며, 당신이 허용한 경우에만 이루어집니다. 언제든 카드 의미를 담은 클래식 리딩을 대신 선택할 수 있습니다. 건강, 법률, 금융 결정에 관한 질문은 정중히 거절합니다.

      리딩 더 받기
      선택형 광고를 보거나 리딩 팩으로 추가 리딩을 받으세요. '배너 광고 제거'는 일회성 구매이며, 선택형 보상 동영상은 계속 이용할 수 있습니다.

