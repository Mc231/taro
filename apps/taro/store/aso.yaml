      UNA LECTURA CON IA GRATIS CADA DÍA
      Cada día tienes una lectura con IA gratis para cualquier tirada. Puedes conseguir más lecturas con un anuncio opcional o un paquete de lecturas.

      TU CARTA DEL DÍA
      Saca una carta gratis cada día, con su significado y una pregunta para reflexionar, incluso sin conexión. Se guarda en tu diario.

      TIRADAS
      Desde una sola carta hasta pasado, presente y futuro con tres cartas, o la Cruz Celta. Cada posición se explica con palabras sencillas.

      DIARIO DE REFLEXIÓN
      Anota lo que una lectura despertó en ti. Cada entrada queda vinculada a sus cartas para que veas patrones con el tiempo.

      APRENDE TAROT
      Las 78 cartas, Arcanos Mayores y Menores, al derecho y invertidas, con palabras clave y simbolismo. Ideal para principiantes.

      UNA BARAJA ORIGINAL
      Cada carta es una ilustración original creada para Taro.

      PRIVACIDAD DESDE EL DISEÑO
      Sin cuenta ni registro. Exporta tu diario y tu historial a un archivo e impórtalos en un teléfono nuevo. Borra tus datos cuando quieras.

