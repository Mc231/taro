    whats_new: "Ласкаво просимо до Taro. Постав запитання й витягни карти з оригінальної колоди: щодня одне безкоштовне тлумачення від ШІ, безкоштовна карта дня, шість розкладів, щоденник роздумів і режим навчання для всіх 78 карт."
    description: &desc_uk |
      Taro створено для розваги та саморефлексії. Він не пророкує майбутнього і не замінює професійної консультації.

      Постав запитання, витягни карти й прочитай, що вони можуть означати для тебе. Taro пояснює кожну карту на її місці в розкладі, тож тлумачення відповідає саме твоєму запитанню, а не повторює загальне значення карти.

      ЩОДНЯ ОДНЕ БЕЗКОШТОВНЕ ТЛУМАЧЕННЯ ВІД ШІ
      Щодня ти отримуєш одне безкоштовне тлумачення від ШІ для будь-якого розкладу. Додаткові тлумачення можна отримати за перегляд необов'язкової реклами або в пакеті тлумачень.

      КАРТА ДНЯ
      Щодня витягуй безкоштовну карту з її значенням і запитанням для роздумів, навіть офлайн. Вона зберігається у твоєму щоденнику.

      РОЗКЛАДИ
      Від однієї карти до трьох карт «минуле, теперішнє, майбутнє» і Кельтського хреста. Кожну позицію пояснено простими словами.

      ЩОДЕННИК РОЗДУМІВ
      Запиши, що відгукнулося тобі в тлумаченні. Кожен запис залишається пов'язаним зі своїми картами, тож з часом ти побачиш закономірності.

      ВИВЧАЙ ТАРО
      Усі 78 карт, Старші й Молодші аркани, у прямому та перевернутому положенні, з ключовими словами й символікою. Чудово для початківців.

      ОРИГІНАЛЬНА КОЛОДА
      Кожна карта — оригінальна ілюстрація, створена для Taro.

      ПРИВАТНІСТЬ ЗА ЗАДУМОМ
      Без акаунта й без входу. Експортуй щоденник та історію у файл та імпортуй їх на новому телефоні. Видаляй свої дані будь-коли.

      ТЛУМАЧЕННЯ ВІД ШІ
      Тлумачення пише ШІ, і лише після твого дозволу. Ти завжди можеш обрати класичне тлумачення зі значеннями карт. Запитання про здоров'я, юридичні чи фінансові рішення ввічливо відхиляються.

      БІЛЬШЕ ТЛУМАЧЕНЬ
      Отримуй додаткові тлумачення, переглянувши необов'язкову рекламу, або з пакетом тлумачень. «Прибрати банерну рекламу» — одноразова покупка; необов'язкові відео з винагородою залишаються доступними.

      12 мов: English, العربية, Deutsch, Español, Français, Italiano, 日本語, 한국어, Nederlands, Português, Türkçe, Українська.

