    description: &desc_ko |
      Taro는 엔터테인먼트와 자기 성찰을 위한 앱입니다. 미래를 알려 주지 않으며 전문가의 조언을 대신하지 않습니다.

      질문을 하고 카드를 뽑은 뒤, 그 카드가 당신에게 어떤 의미일 수 있는지 읽어 보세요. Taro는 스프레드의 각 위치에 놓인 카드를 하나씩 설명해, 일반적인 카드 의미를 되풀이하는 대신 당신의 질문에 맞는 리딩을 제공합니다.

      매일 무료 AI 리딩 1회
      어떤 스프레드든 매일 한 번 AI 리딩을 무료로 받을 수 있습니다. 추가 리딩은 선택형 광고나 리딩 팩으로 받을 수 있습니다.

      오늘의 카드
      매일 카드 한 장을 무료로 뽑고, 의미와 성찰 질문을 확인하세요. 오프라인에서도 됩니다. 뽑은 카드는 저널에 저장됩니다.

      스프레드
      한 장 뽑기부터 과거·현재·미래 세 장 뽑기, 켈틱 크로스까지. 각 위치를 쉬운 말로 설명합니다.

      성찰 저널
      리딩을 통해 떠오른 생각을 적어 보세요. 모든 기록은 카드와 연결되어 있어 시간이 지나며 패턴을 발견할 수 있습니다.

      타로 배우기
      메이저·마이너 아르카나 78장 전체를 정방향과 역방향, 키워드와 상징과 함께 설명합니다. 초보자에게 좋습니다.

      오리지널 덱
