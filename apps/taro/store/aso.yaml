# App Store listing per locale (05 §8.1, §9.3); asa maps pt → pt-BR, ar → ar-SA.
localizations:
  en:
    name: "Taro: Reflection Journal"
    subtitle: "Tarot prompts, private diary"
    keywords: "self,mindful,mood,cards,daily,learn,meanings,deck,insight,writing,thoughts,notes,habit,ai"
    promotional_text: "A private journal that uses tarot as a mirror, not a forecast. Draw a card, answer its reflection question and see your patterns over time. No account needed."
    # App Store en: journal-first (4.3(b) repositioning, 2026-10-30); Play keeps *desc_en.
    description: |
      Taro is for entertainment and self-reflection. It does not predict the future and is not a substitute for professional advice.

      Taro is a private reflection journal that uses tarot cards as prompts. Draw a card or a spread, answer the reflection questions it raises, and keep what you notice. Over time your journal shows the themes that keep coming back.

      REFLECTION JOURNAL
      Write down what a reading brought up for you. Every entry stays linked to its cards, so you can look back and see patterns over time. Your journal stays on this phone.

      A CARD TO REFLECT ON EACH DAY
      Draw a daily card with its meaning and a reflection question, even offline. It is saved in your journal.

      QUESTIONS, NOT PREDICTIONS
      Each card is explained in its place in the spread and ends with open questions for you to answer. Taro never forecasts events or tells you what to do. Questions about health, legal or financial decisions are gently declined, and support lines are listed under Help.

      AI REFLECTIONS
      Reflections are written by AI, and only after you allow it. You can always choose a classic reading with card meanings instead. One AI reading a day is included at no cost; extra readings come from an optional ad or a reading pack.

      LEARN TAROT
      All 78 cards, Major and Minor Arcana, upright and reversed, with keywords and symbolism.

      AN ORIGINAL DECK
      Every card is original artwork made for Taro.

      PRIVATE BY DESIGN
      No account and no sign-in. Export your journal to a file and import it on a new phone. Delete your data at any time. Remove Banner Ads is a one-time purchase; optional reward videos stay available.

      12 languages: English, العربية, Deutsch, Español, Français, Italiano, 日本語, 한국어, Nederlands, Português, Türkçe, Українська.

      Privacy Policy: https://taro.vshyrochuk.com/privacy
      Terms of Use: https://taro.vshyrochuk.com/terms
    whats_new: "Welcome to Taro, a private reflection journal. Draw a card, answer its reflection question and keep what you notice. Includes six spreads, AI-written reflections and Learn mode for all 78 cards."
  ar:
    name: "Taro: مذكرات التأمل"
    subtitle: "تاروت للتأمل ومذكرات خاصة"
    keywords: "يوميات,تأمل,ذات,أسئلة,بطاقات,تعلم,معاني,أفكار,كتابة,وعي,ذكاء,اصطناعي"
    promotional_text: "مذكرات خاصة تستخدم التاروت مرآةً لا تنبؤًا. اسحب بطاقة، وأجب عن سؤالها للتأمل، وتابع أنماطك مع الوقت. دون حساب."
    whats_new: "مرحبًا بك في Taro، مذكراتك الخاصة للتأمل. اسحب بطاقة، وأجب عن سؤالها، واحتفظ بما تلاحظه. يشمل ست فرشات وتأملات يكتبها الذكاء الاصطناعي ووضع التعلّم لجميع البطاقات الـ78."
    description: &desc_ar |
      Taro مخصص للترفيه والتأمل الذاتي. لا يتنبأ بالمستقبل ولا يغني عن الاستشارة المهنية.

      اطرح سؤالًا واسحب بطاقاتك واقرأ ما قد تعنيه لك. يشرح Taro كل بطاقة في موضعها من الفرشة، فتأتي قراءتك مناسبة لسؤالك بدلًا من تكرار معنى عام للبطاقة.

      قراءة مجانية بالذكاء الاصطناعي كل يوم
      تحصل كل يوم على قراءة واحدة مجانية بالذكاء الاصطناعي لأي فرشة. ويمكنك الحصول على قراءات إضافية بمشاهدة إعلان اختياري أو بشراء باقة قراءات.

      بطاقة يومك
      اسحب بطاقة مجانية كل يوم مع معناها وسؤال للتأمل، حتى دون اتصال بالإنترنت. وتُحفظ في مذكراتك.

      الفرشات
      من بطاقة واحدة، إلى ثلاث بطاقات للماضي والحاضر والمستقبل، وصولًا إلى الصليب السلتي. يُشرح كل موضع بلغة بسيطة.

      مذكرات التأمل
      دوّن ما أثارته فيك القراءة. تبقى كل مذكرة مرتبطة ببطاقاتها لترى الأنماط مع مرور الوقت.

      تعلّم التاروت
      جميع البطاقات الـ78، الأركانا الكبرى والصغرى، في وضعها المستقيم والمقلوب، مع كلمات مفتاحية ورموز. مناسب للمبتدئين.

      مجموعة بطاقات أصلية
      كل بطاقة عمل فني أصلي صُمم خصيصًا لـ Taro.

      الخصوصية أولًا
      لا حساب ولا تسجيل دخول. صدّر مذكراتك وسجلك إلى ملف واستوردهما على هاتف جديد. احذف بياناتك في أي وقت.

      قراءات الذكاء الاصطناعي
      يكتب الذكاء الاصطناعي التفسيرات، وفقط بعد أن تسمح بذلك. ويمكنك دائمًا اختيار قراءة كلاسيكية بمعاني البطاقات بدلًا من ذلك. تُرفض بلطف الأسئلة المتعلقة بالصحة أو القرارات القانونية أو المالية.

      مزيد من القراءات
      احصل على قراءات إضافية بمشاهدة إعلان اختياري أو بشراء باقة قراءات. «إزالة إعلانات البانر» عملية شراء لمرة واحدة، وتبقى مقاطع الفيديو الاختيارية بمكافأة متاحة.

      12 لغة: English, العربية, Deutsch, Español, Français, Italiano, 日本語, 한국어, Nederlands, Português, Türkçe, Українська.

      سياسة الخصوصية: https://taro.vshyrochuk.com/privacy
      شروط الاستخدام: https://taro.vshyrochuk.com/terms
  de:
