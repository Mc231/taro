  ar:
    name: "Taro: قراءة التاروت"
    subtitle: "بطاقة اليوم ومذكرات وفرشات"
    keywords: "تاروت,بطاقات,أوراق,معنى,حب,الصليب,السلتي,الأركانا,أوراكل,ذكاء,اصطناعي,تأمل,تعلم"
    promotional_text: "اطرح سؤالًا واسحب من مجموعة بطاقات أصلية واحصل على قراءة تشرح كل بطاقة في موضعها. قراءة مجانية بالذكاء الاصطناعي كل يوم."
    whats_new: "مرحبًا بك في Taro. اطرح سؤالًا واسحب من مجموعة بطاقات أصلية، مع قراءة مجانية بالذكاء الاصطناعي كل يوم، وبطاقة يومية مجانية، وست فرشات، ومذكرات للتأمل، ووضع التعلّم لجميع البطاقات الـ78."
    description: &desc_ar |
      Taro مخصص للترفيه والتأمل الذاتي. لا يتنبأ بالمستقبل ولا يغني عن الاستشارة المهنية.

      اطرح سؤالًا واسحب بطاقاتك واقرأ ما قد تعنيه لك. يشرح Taro كل بطاقة في موضعها من الفرشة، فتأتي قراءتك مناسبة لسؤالك بدلًا من تكرار معنى عام للبطاقة.

      قراءة مجانية بالذكاء الاصطناعي كل يوم
      تحصل كل يوم على قراءة واحدة مجانية بالذكاء الاصطناعي لأي فرشة. ويمكنك الحصول على قراءات إضافية بمشاهدة إعلان اختياري أو بشراء باقة قراءات.

      بطاقة يومك
      اسحب بطاقة مجانية كل يوم مع معناها وسؤال للتأمل، حتى دون اتصال بالإنترنت. وتُحفظ في مذكراتك.

      الفرشات
      من بطاقة واحدة، إلى ثلاث بطاقات للماضي والحاضر والمستقبل، وصولًا إلى الصليب السلتي. يُشرح كل موضع بلغة بسيطة.

      مذكرات التأمل
      دوّن ما أثارته فيك القراءة. تبقى كل مذكرة مرتبطة ببطاقاتها لترى الأنماط مع مرور الوقت.

      تعلّم التاروت
      جميع البطاقات الـ78، الأركانا الكبرى والصغرى، في وضعها المستقيم والمقلوب، مع كلمات مفتاحية ورموز. مناسب للمبتدئين.

      مجموعة بطاقات أصلية
      كل بطاقة عمل فني أصلي صُمم خصيصًا لـ Taro.

      الخصوصية أولًا
      لا حساب ولا تسجيل دخول. صدّر مذكراتك وسجلك إلى ملف واستوردهما على هاتف جديد. احذف بياناتك في أي وقت.

      قراءات الذكاء الاصطناعي
      يكتب الذكاء الاصطناعي التفسيرات، وفقط بعد أن تسمح بذلك. ويمكنك دائمًا اختيار قراءة كلاسيكية بمعاني البطاقات بدلًا من ذلك. تُرفض بلطف الأسئلة المتعلقة بالصحة أو القرارات القانونية أو المالية.

      مزيد من القراءات
      احصل على قراءات إضافية بمشاهدة إعلان اختياري أو بشراء باقة قراءات. «إزالة إعلانات البانر» عملية شراء لمرة واحدة، وتبقى مقاطع الفيديو الاختيارية بمكافأة متاحة.

      12 لغة: English, العربية, Deutsch, Español, Français, Italiano, 日本語, 한국어, Nederlands, Português, Türkçe, Українська.

      سياسة الخصوصية: https://taro.vshyrochuk.com/privacy
      شروط الاستخدام: https://taro.vshyrochuk.com/terms
  de:
    name: "Taro: Tarot Karten legen"
    subtitle: "Tageskarte, Journal, Legungen"
    keywords: "kartenlegen,orakel,bedeutung,liebe,keltisches,kreuz,große,arkana,ki,deck,lernen,reflexion,anfänger"
    promotional_text: "Stell eine Frage, zieh aus einem eigenen Deck und erhalte eine Deutung, die jede Karte an ihrem Platz erklärt. Jeden Tag eine kostenlose KI-Deutung."
    whats_new: "Willkommen bei Taro. Stell eine Frage und zieh aus einem eigenen Deck: jeden Tag eine kostenlose KI-Deutung, eine kostenlose Tageskarte, sechs Legungen, ein Reflexions-Journal und ein Lernmodus für alle 78 Karten."
    description: &desc_de |
      Taro dient der Unterhaltung und Selbstreflexion. Es sagt nicht die Zukunft voraus und ersetzt keine professionelle Beratung.

      Stell eine Frage, zieh deine Karten und lies, was sie für dich bedeuten könnten. Taro erklärt jede Karte an ihrer Position in der Legung, damit deine Deutung zu deiner Frage passt, statt eine allgemeine Kartenbedeutung zu wiederholen.

      JEDEN TAG EINE KOSTENLOSE KI-DEUTUNG
      Jeden Tag erhältst du eine kostenlose KI-Deutung für jede Legung. Weitere Deutungen gibt es über optionale Werbung oder ein Deutungspaket.

      DEINE TAGESKARTE
      Zieh jeden Tag eine kostenlose Karte mit ihrer Bedeutung und einer Frage zum Nachdenken, auch offline. Sie wird in deinem Journal gespeichert.

      LEGUNGEN
      Von einer einzelnen Karte über Vergangenheit, Gegenwart und Zukunft mit drei Karten bis zum Keltischen Kreuz. Jede Position wird in einfachen Worten erklärt.

      REFLEXIONS-JOURNAL
      Schreib auf, was eine Deutung in dir ausgelöst hat. Jeder Eintrag bleibt mit seinen Karten verknüpft, so erkennst du mit der Zeit Muster.

      TAROT LERNEN
      Alle 78 Karten, Große und Kleine Arkana, aufrecht und umgekehrt, mit Stichworten und Symbolik. Ideal für Einsteiger.

      EIN EIGENES DECK
      Jede Karte ist ein Originalkunstwerk, das für Taro entstanden ist.

      PRIVATSPHÄRE VON ANFANG AN
      Kein Konto, keine Anmeldung. Exportiere Journal und Verlauf in eine Datei und importiere sie auf einem neuen Handy. Lösche deine Daten jederzeit.

      KI-DEUTUNGEN
      Die Deutungen schreibt eine KI, und nur, wenn du zustimmst. Du kannst stattdessen immer eine klassische Deutung mit Kartenbedeutungen wählen. Fragen zu Gesundheit, Recht oder Finanzentscheidungen werden freundlich abgelehnt.

      MEHR DEUTUNGEN
      Weitere Deutungen erhältst du über optionale Werbung oder mit einem Deutungspaket. „Bannerwerbung entfernen“ ist ein einmaliger Kauf; optionale Belohnungsvideos bleiben verfügbar.

      12 Sprachen: English, العربية, Deutsch, Español, Français, Italiano, 日本語, 한국어, Nederlands, Português, Türkçe, Українська.

      Datenschutzerklärung: https://taro.vshyrochuk.com/privacy
