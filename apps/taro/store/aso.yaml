  ja:
    name: "Taro: タロット占い"
    subtitle: "今日の一枚・ジャーナル・スプレッド"
    keywords: "タロットカード,カードの意味,恋愛,大アルカナ,小アルカナ,ケルト十字,オラクル,AI,無料,内省,日記,デッキ,初心者,学習"
    promotional_text: "質問をして、オリジナルデッキからカードを引けば、各カードをその位置に沿って解説するリーディングが届きます。AIリーディングは毎日1回無料。"
    whats_new: "Taroへようこそ。質問をしてオリジナルデッキからカードを引きましょう。毎日1回無料のAIリーディング、無料の今日の一枚、6種類のスプレッド、振り返りジャーナル、78枚すべてを学べる学習モードを備えています。"
    description: &desc_ja |
      Taroはエンターテインメントと自己省察のためのアプリです。未来を言い当てるものではなく、専門家の助言に代わるものでもありません。

      質問をしてカードを引き、それがあなたにとって何を意味しうるかを読み解きましょう。Taroはスプレッドの各位置にあるカードを一枚ずつ解説するので、一般的なカードの意味をなぞるのではなく、あなたの質問に沿ったリーディングになります。

      毎日1回、無料のAIリーディング
      どのスプレッドでも、毎日1回AIリーディングを無料で利用できます。追加のリーディングは、任意の広告視聴またはリーディングパックで入手できます。

      今日の一枚
      毎日1枚、意味と内省のための問いつきでカードを無料で引けます。オフラインでも使えます。引いたカードはジャーナルに保存されます。

      スプレッド
      1枚引きから、過去・現在・未来の3枚引き、ケルト十字まで。各位置の意味をわかりやすく説明します。

      内省ジャーナル
      リーディングで感じたことを書き留めましょう。各エントリーはカードと結びついたまま残るので、時間とともにパターンが見えてきます。

      タロットを学ぶ
      大アルカナ・小アルカナの全78枚を、正位置・逆位置、キーワード、シンボルとともに解説。初心者にもおすすめです。

      オリジナルデッキ
      すべてのカードはTaroのために描かれたオリジナルアートです。

      プライバシーを重視した設計
      アカウントもサインインも不要。ジャーナルと履歴をファイルに書き出し、新しいスマートフォンで読み込めます。データはいつでも削除できます。

      AIリーディング
      解釈はAIが作成し、あなたが許可した場合にのみ行われます。いつでも、カードの意味を使ったクラシックリーディングを選べます。健康、法律、お金に関する判断についての質問は丁寧にお断りします。

      さらにリーディング
      任意の広告を見るか、リーディングパックで追加のリーディングを入手できます。「バナー広告を削除」は買い切りの購入です。任意のリワード動画は引き続き利用できます。

