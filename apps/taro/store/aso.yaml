#
# Read by: `asa validate -c apps/taro/store/aso.yaml` (CI, reusable-static.yml),
# the asa store commands (docs/runbooks/STORE_SUBMISSION.md) and the taro checks
# check_store_copy.py, check_pack_sizes.py, check_iap_ids.py, check_l10n.py and
# check_urls.py.
#
# Status: Phase 20 final copy (2026-10-05). en is 05 §8.1 / §7 / §9.3; the
# 11 other locales are translations awaiting the native-speaker pass listed in
# docs/aso/REVIEW_NEEDED.md. Keywords follow 05 §9.3 with `yes,no` swapped out
# (RC2: no yes/no spread in v1) and with words already in the locale's name or
# subtitle removed (docs/aso/keywords.md). The repo is public, so the review
# phone is not stored here: it lives in ~/pet/secure/taro/review_contact and is
# entered at push time (Phase 20.3 / 20.4).

app_identifier: taro
app_name: Taro
company: vshyrochuk
short_description: "AI tarot readings for reflection: daily card, spreads, journal"
full_description: &desc_en |
  Taro is for entertainment and self-reflection. It does not predict the future and is not a substitute for professional advice.

  Ask a question, draw your cards, and read what they could mean for you. Taro explains each card in its place in the spread, so your reading fits your question instead of repeating a generic card meaning.

  ONE FREE AI READING EVERY DAY
  Every day you get one free AI reading for any spread. Extra readings come from an optional ad or a reading pack.

  YOUR DAILY CARD
  Draw a free card every day, with its meaning and a reflection question, even offline. It is saved in your journal.

  SPREADS
  From a single card to three-card past, present and future, to the Celtic Cross. Each position is explained in plain language.

  REFLECTION JOURNAL
  Write down what a reading brought up for you. Every journal entry stays linked to its cards so you can see patterns over time.

  LEARN TAROT
  All 78 cards, Major and Minor Arcana, upright and reversed, with keywords and symbolism. Great for beginners.

  AN ORIGINAL DECK
  Every card is original artwork made for Taro.

  PRIVATE BY DESIGN
  No account and no sign-in. Export your journal and history to a file and import it on a new phone. Delete your data at any time.

  AI READINGS
  Interpretations are written by AI, and only after you allow it. You can always choose a classic reading with card meanings instead. Questions about health, legal or financial decisions are gently declined.

  MORE READINGS
  Get extra readings by watching an optional ad or with a reading pack. Remove Banner Ads is a one-time purchase; optional reward videos stay available.

  12 languages: English, العربية, Deutsch, Español, Français, Italiano, 日本語, 한국어, Nederlands, Português, Türkçe, Українська.

  Privacy Policy: https://taro.vshyrochuk.com/privacy
  Terms of Use: https://taro.vshyrochuk.com/terms
keywords: [tarot, tarot reading, daily card, journal, spreads, learn tarot]
privacy_policy_url: https://taro.vshyrochuk.com/privacy
support_url: https://taro.vshyrochuk.com/support
marketing_url: https://taro.vshyrochuk.com
terms_url: https://taro.vshyrochuk.com/terms
whats_new: |
  Welcome to Taro, a private reflection journal. Draw a card, answer its reflection question and keep what you notice. Includes six spreads, AI-written reflections and Learn mode for all 78 cards.

app_review_information:
  contact_first_name: Volodymyr
  contact_last_name: Shyrochuk
  contact_email: volodymyr.shyrochuk@gmail.com
  # Filled from ~/pet/secure/taro/review_contact at push time; never committed (public repo).
  contact_phone: "<from ~/pet/secure/taro/review_contact>"
  # No login exists (05 §7), so no demo credentials are submitted. Testing
  # accounts (Apple sandbox testers, Play license testers, staging Worker) are
  # described in docs/compliance/REVIEW_NOTES.md "Staging test account plan".
  demo_account_required: false
  demo_account_name: ""
  demo_account_password: ""
  # Copied from docs/compliance/REVIEW_NOTES.md (rewritten 2026-10-06 in
  # Apple's step-by-step form, with the demo video); change both together. Quoted HOW TO REVIEW labels are app_en.arb values (RC79).
  # Provider: OpenAI only (ai.disclosedProviders = ["openai"], 2026-10-01).
  notes: |
    ABOUT THE APP
    Taro is a private reflection journal that uses tarot cards as writing prompts, not a fortune-telling app. The user draws cards from an original 78-card deck (our own art), answers the open reflection questions each card raises and keeps notes in an on-device journal, whose Patterns view shows recurring cards and themes over time. It does not predict the future or give advice: a disclaimer is shown in onboarding and on every reading, and predictive, health, legal and financial questions are declined by a safety layer. There is no account; all data stays on the device and can be exported or deleted.

    DEMO VIDEO
    A screen recording of the steps below is attached to this submission (taro_review_demo.mp4). It was recorded on the iPhone Simulator with scripted server answers so every step is shown; the live app behaves the same.

    NO LOGIN NEEDED
    There are no accounts, so no demo account is needed. Everything works right after onboarding.

    HOW TO REVIEW
    1. Onboarding: tap "Get started", read the disclaimer and tap "I understand".
    2. AI consent: this screen says the question is sent to our server and processed by a third-party AI provider (OpenAI, named in our privacy policy) and lists what is sent. Tap "Allow AI readings". "Not now" is a real choice: the app still works and "Try a classic reading" shows card meanings without AI.
    3. Tracking: a neutral screen explains the next prompt; tap "Continue" and the iOS App Tracking Transparency prompt appears. Either answer works.
    4. Today: the daily card (free, no AI) is on this screen.
    5. Reading: tap "Start a reading", pick a spread, type a question (optional) and tap "Begin". Tap "Shuffle", "I’m ready — draw", "Draw for me" and turn the cards. The AI reading takes about 10–15 seconds. It is marked "AI-generated" and has the disclaimer. One free AI reading per day is included.
    6. Report: on a reading, open the three-dot menu and tap "Report this reading".
    7. Paywall: start a second reading. Before any card is drawn a sheet opens with "Get more readings" (reading packs) and an optional rewarded ad for one reading. Ads never play on their own. Sandbox purchases work; credits appear only after our server verifies the purchase.
    8. "Restore purchases" and "Remove Banner Ads" are on the store screen and in Settings.
    9. Settings > "Privacy & data": "Privacy choices", "AI readings" (consent), "Export backup", "Import backup" and "Delete all data". "Legal" has the privacy policy and terms.

    SAFETY (YOU MAY TEST THIS)
    - Refusal: ask "Will I get sick next month?" or "Should I buy Bitcoin?". Health, pregnancy, death, legal, money and gambling questions get a calm refusal and the reading is not charged.
    - Crisis: type "I want to hurt myself". The app shows "You’re not alone" with local crisis helplines instead of a reading. No credit is used.

    IN-APP PURCHASES
    - Reading packs of 3, 10 and 30 (consumable). Credits are kept for this install on our server and cannot be restored after the app is deleted; the store screen says so.
    - Remove Banner Ads (non-consumable): removes banner ads; optional rewarded ads stay. Restorable.
    No subscriptions.

    SERVICES AND DATA
    - Our server (Cloudflare Workers): credits, daily allowance, purchase checks.
    - AI provider (OpenAI, named in our privacy policy): writes the reading and checks it for safety, only after consent.
    - AdMob with the consent form first, then the tracking prompt. Ads are never shown inside a reading.
    - Firebase Analytics and Crashlytics.
    - App Attest and DeviceCheck are used only to protect free readings from fraud, not for tracking.

    AGE RATING 13+
    Tarot themes and open-ended AI text are not meant for young children, so we chose 13+. The app is not for children.

    Same features in every storefront, on iPhone and iPad, in 12 languages (Arabic is right-to-left).

    Links: https://taro.vshyrochuk.com/privacy, https://taro.vshyrochuk.com/terms, https://taro.vshyrochuk.com/support
    Contact: volodymyr.shyrochuk@gmail.com

