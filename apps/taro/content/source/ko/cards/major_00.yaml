shortUpright: "확신보다는 호기심을 안고 새로운 무언가로 내딛는 한 걸음."
shortReversed: "가장자리에서 멈춘 순간: 신중함일까요, 바보처럼 보일까 하는 두려움일까요?"
meaningUpright: |-
  바보는 메이저 아르카나의 맨 처음, 0번에 서 있어요. 아직 어떤 교훈도 배우기 전의 자리예요. 가벼운 짐과 열린 얼굴로 길을 나서는 사람의 에너지이며, 길이 어디서 끝나는지 하나하나 알기보다 길이 무엇을 보여 줄지에 더 관심을 두어요.
  일상에서 이 카드는 새로운 곳에서 보내는 첫 주, 잘하려는 계획 없이 시작한 취미, 대사를 하나하나 연습하지 않고 시작하는 대화를 비추는 것일 수 있어요. 한쪽에서는 아무도 줄 수 없는 확신을 바라고 있어도, 다른 한쪽에서는 시도해 볼 준비가 된 내 모습을 가리킬 수도 있어요. 여기서 모른다는 것은 결점이 아니에요. 모든 여정이 시작되는 자리일 뿐이에요.
  이 카드는 조금 더 가벼워지는 것이 어디에서 도움이 될지 생각해 보도록 권해요. 다시 초보자가 되어 기본적인 질문을 하고 직접 해 보며 배우도록 스스로에게 허락한다면 무엇이 달라질까요? 바보는 상식을 무시하라고 하지 않아요. 틀릴까 봐 두려운 마음이 한 걸음도 내딛지 못하게 막고 있지는 않은지 살펴보라고 해요.
meaningReversed: |-
  역방향의 바보는 새로운 시작의 불꽃이 아직 완전히 붙지 않은 모습을 비출 수 있어요. 새로운 무언가에 끌리면서도 꼼짝하지 않고 서서 그 생각을 이리저리 굴리며, 움직여도 안전하다는 신호를 기다리고 있을지도 몰라요. 그 기다림이 현명할 때도 있지만, 어느새 습관이 되어 버렸을 때도 있어요.
  이 위치는 반대쪽으로 기울어진 모습을 비출 수도 있어요. 살피지 않고 앞서 달려 나가며 모든 것에 좋다고 말하고, 발이 어디에 닿는지 알아차릴 여유를 거의 남기지 않는 에너지예요. 두 기울기 모두 준비와 믿음에 관한 질문을 품고 있어요.
  지금은 둘 중 어느 쪽이 더 가깝게 느껴지는지 물어봐도 좋아요. 망설이고 있다면, 부담 없이 물을 시험해 볼 수 있는 작은 방법은 무엇일까요? 서두르고 있다면, 열정은 그대로 두되 다음 도약 전에 잠시 멈추는 순간을 하나 더한다면 어떤 모습일까요?
aspects:
  relationshipsUpright: >-
    관계에서 바보는 장난스럽고 경계 없는 모습을 비출 수 있어요. 각본 없이 누군가를 만나거나, 익숙한 관계가 다시 한번 나를 놀라게 하도록 두는 것이에요. 가까운 사람들에게 호기심을 갖고, 이미 답을 안다고 여기는 질문을 다시 던져 보도록 권할 수도 있어요. 여기서 열린 마음은 순진함이 아니에요. 일이 어떻게 흘러가야 할지 미리 정하지 않고 그 자리에 함께하려는 마음이에요.
  relationshipsReversed: >-
    역방향에서 이 카드는 누군가를 마음에 들이는 것에 대한 망설임, 또는 상대방이 따라오기 어려울 만큼 빠르게 나아가는 모습을 가리킬 수 있어요. 모호하게 머무르며 스스로를 지키고 있는지, 아니면 누군가를 알아 가는 느린 과정을 건너뛰고 있는지 살펴볼 수 있어요. 나의 속도와 상대의 속도에 대해 부드럽게 이야기를 나누면 두 사람 모두에게 여유가 생길 수 있어요.
  workUpright: >-
    일이나 프로젝트에서 바보는 낯선 무언가의 시작을 비출 수 있어요. 새로운 역할, 새로운 과정, 아직 아무 실적이 없는 창의적인 아이디어 같은 것이에요. 초반의 실수를 판결이 아닌 정보로 받아들이도록 권해요. 첫 시도가 서툴러도 괜찮다면 무엇을 해 보고 싶은지, 그리고 그 과정에서 요령을 익히도록 누가 도와줄 수 있을지 물어볼 수 있어요.
  workReversed: >-
    역방향의 바보는 조건이 완벽하게 느껴질 때까지 계속 미뤄지는 아이디어, 또는 기본을 확인하지 않은 채 뛰어든 도약을 비출 수 있어요. 더 많은 정보가 필요한지, 아니면 그저 용기가 더 필요한지 생각해 볼 수 있어요. 가능한 가장 작은 첫걸음과 현실적인 안전장치 하나를 적어 보면, 막연한 바람이 모든 것을 걸지 않고도 시험해 볼 수 있는 무언가로 바뀔 수 있어요.
  growthUpright: >-
    개인적 성장에서 이 카드는 초심자의 마음을 반겨요. 지켜야 할 평판이 없는 무언가를 시도해 보도록 권할 수 있어요. 새로운 기술, 집으로 가는 다른 길, 소리 내어 던지는 질문 같은 것이에요. 여기서 성장은 처음부터 모든 것을 잘 해내는 데서가 아니라, 호기심을 잃지 않고 스스로가 놀라도록 허락하는 데서 와요.
  growthReversed: >-
    역방향의 바보는 바보처럼 보일까 하는 두려움이 나의 세계를 좁히기 시작하지 않았는지 물을 수 있어요. 새로운 것에서 또 다른 새로운 것으로 옮겨 다니며 어느 하나도 뿌리내리지 못하게 하는 들뜬 마음을 비출 수도 있어요. 어떤 패턴이 익숙하게 느껴지는지 알아차리고, 일주일 동안 그 반대쪽을 부드럽게 실험해 볼 수 있어요.
reflectionQuestions:
  - "초보자가 되어도 괜찮다면 무엇을 시도해 보고 싶나요?"
  - "내 삶에서 작은 위험을 감수하기 쉽게 해 주는 사람은 누구이며, 왜 그럴까요?"
  - "이번 주에 부담 없이 내디딜 수 있는 첫걸음은 무엇인가요?"
imageryNote: >-
  Taro의 바보는 앞으로 열린 하늘이 펼쳐진 높은 곳의 가장자리에서, 작은 보따리 하나만 들고 걸음을 내딛는 모습으로 그려져요. 발치를 따르는 작은 동물은 장난스럽기도 하고 조심하라고 일러 주기도 하는 본능을 나타낼 수 있어요. 하얀 꽃 한 송이는 순수함과 열린 마음을, 넓은 지평선과 아침 햇살은 가능성을 이야기해요. 위를 향한 인물의 얼굴은 보는 이에게 그가 무엇을 바라보고 있는지, 그리고 무엇을 짊어지지 않기로 했는지 묻게 해요.
