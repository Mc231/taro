reflectionQuestions:
  - "어떤 가치를 물려받았고, 어떤 가치를 스스로 선택했나요?"
  - "누가 나에게 중요한 것을 가르쳐 주었고, 그 가르치는 방식에서 무엇을 배웠나요?"
  - "이번 주에 더 자세히 살펴보고 싶은 기대 하나는 무엇인가요?"
imageryNote: >-
  Taro의 교황은 조용한 안뜰에서 오래된 나무 아래 닳은 돌 벤치에 앉아, 여러 나이대의 사람들이 작은 원을 이루어 듣고 있는 스승으로 그려져요. 스승의 허리띠에 걸린 무거운 열쇠는 공부와 실천을 통해 전해지는 이해를 상징해요. 벤치 위에 쌓인 책들과 위쪽 아치에 달린 종은 함께하는 의식과 배움을 암시해요. 안뜰 저편의 열린 문은 모든 가르침이 어딘가 새로운 곳으로 이어질 수 있음을 넌지시 알려 줘요.
