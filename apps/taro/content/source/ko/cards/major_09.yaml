reflectionQuestions:
  - "길고 조용한 산책에 어떤 질문을 가져가고 싶나요?"
  - "누가 나의 공간이 필요하다는 마음을 존중해 주며, 그것이 고맙다는 걸 어떻게 전할 수 있을까요?"
  - "이번 주에 방해받지 않는 한 시간을 어디에서 지켜 낼 수 있을까요?"
imageryNote: >-
  Taro의 은둔자는 해 질 녘 눈 덮인 높은 능선 위에서 망토를 두르고, 길의 바로 다음 몇 걸음만 비추는 소박한 등불을 든 인물로 그려져요. 오래 써서 매끈해진 지팡이는 경험에서 얻은 버팀을 암시해요. 뒤편 눈 위의 발자국은 인물이 이미 얼마나 먼 길을 왔는지 보여 줘요. 차가운 푸른빛과 회색은 고독과 맑은 공기를 이야기하고, 등불의 따뜻한 빛은 가장 어두운 길목에도 통찰을 들고 갈 수 있음을 보여 줘요.
