  relationshipsReversed: >-
    역방향에서 이 카드는 다른 사람들에게 거리감으로 느껴지는 움츠러듦, 또는 말하지 않은 외로움을 가리킬 수 있어요. 누군가 먼저 손을 내밀어 주기를 기다리고 있지는 않았는지 생각해 볼 수 있어요. 짧고 솔직한 메시지 하나가 닫힌 문을 다시 열 수 있어요. 그 뒤에 여전히 조용한 시간이 필요하더라도요.
  workUpright: >-
