imageryNote: >-
  Taro의 연인은 좁은 시냇물 양쪽에 서서 물 너머로 손을 맞잡으려 뻗는 두 인물로 그려지며, 누구든 어느 쪽 인물에서나 자신을 볼 수 있도록 표현돼요. 그 위로 새 두 마리가 같은 밝은 하늘을 맴돌아요. 한쪽 둑에는 과일나무가, 다른 쪽에는 꽃 피는 덩굴이 자라 서로 다른 두 선물이 가운데에서 만나요. 시냇물은 진정한 연결이 두 사람 모두에게 요구하는 선택과 노력을 떠올리게 해요.
