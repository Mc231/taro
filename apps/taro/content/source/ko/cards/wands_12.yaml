imageryNote: >-
  질주하던 기수가 앞발을 들거나 도약하는 말 위에서 몸을 앞으로 기울이고, 지팡이를 높이 든 채 망토를 뒤로 휘날려요. 앞으로는 사막의 언덕이나 탁 트인 평원이 펼쳐지고, 기수의 옷은 작은 불꽃이나 도롱뇽 무늬로 꾸며져 있을 수 있어요. 도약하는 말은 열정과 추진력을, 들어 올린 지팡이는 행동으로 옮겨지는 목적을, 넓은 풍경은 아직 펼쳐지고 있는 모험을 나타내요. 앞으로 기운 자세는 용기와 성급함을 함께 암시해요.
