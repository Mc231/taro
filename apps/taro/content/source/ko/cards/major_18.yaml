imageryNote: >-
  Taro의 달은 바닷가의 키 큰 갈대 사이로 난 길 위로, 떠가는 구름에 반쯤 가려진 창백한 달로 그려져요. 길은 어떤 곳에서는 반짝이고 어떤 곳에서는 사라져서, 길을 가는 이는 천천히 걸어요. 얕은 물에 가만히 서 있는 왜가리는 끈기 있는 주의를 암시하고, 물 위의 잔물결은 아래에서 떠오르는 감정을 넌지시 알려 줘요. 은빛 빛, 부드러운 그림자, 흐릿한 가장자리는 보는 이에게 불확실한 여정에서 자신의 감각을 믿도록 권해요.
