imageryNote: >-
  Taro의 매달린 남자는 튼튼하고 살아 있는 나뭇가지에 한쪽 발목으로 거꾸로 매달려, 팔은 편안히 늘어뜨리고 얼굴은 차분하며 호기심마저 띤 모습으로 그려져요. 이 각도에서 인물은 아래 웅덩이에 거꾸로 비친 세상을 바라봐요. 나무는 푸르고 싹이 돋아 있어, 이 멈춤이 성장의 끝이 아니라 성장의 일부임을 보여 줘요. 물빛 푸른색과 헐렁하게 흘러내리는 옷은 내려놓음, 꿈꾸기, 표면 아래를 보는 것을 떠올리게 해요.
