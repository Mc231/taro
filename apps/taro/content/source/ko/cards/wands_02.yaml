  growthUpright: >-
    개인적 성장에서 이 카드는 나 자신의 포부를 진지하게 받아들이도록 권해요. 평소의 한계를 넘어 생각해도 된다고 스스로에게 허락한다면 무엇을 탐험하고 싶나요? 앞으로 한두 해의 대략적인 그림을 그려 볼 수 있어요. 고정된 약속이 아니라, 기회가 나타났을 때 알아차리도록 돕는 방향으로서요.
  growthReversed: >-
