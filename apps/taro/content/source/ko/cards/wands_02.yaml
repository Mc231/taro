imageryNote: >-
  한 인물이 높은 성벽이나 바위 턱 위에 서서, 지팡이 하나는 곁에 단단히 세워 두고 다른 하나는 손에 가볍게 쥔 채 먼 땅이나 바다를 바라봐요. 근처에는 작은 지구본이나 지도, 나침반이 놓여 있어요. 고정된 지팡이는 이미 쌓아 온 것을, 들어 올린 지팡이는 더 멀리 가기로 하는 선택을 나타내요. 탁 트인 전망은 보는 이에게 정해진 하나의 길이 아니라 가능한 여러 경로를 상상하도록 권해요.
