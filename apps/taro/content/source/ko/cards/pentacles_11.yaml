shortUpright: >-
  호기심 많고 배우기 좋아하는 에너지가 있어요. 배우고 싶은 실용적인 무언가를 알아차리고, 그것을 향해 진짜 첫걸음을 내디뎌 볼 수 있어요.
shortReversed: >-
