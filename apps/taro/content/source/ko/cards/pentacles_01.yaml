imageryNote: >-
  그림의 중심에는 열린 손이 내민 동전이나 원반 하나가 있을 수 있고, 그 뒤로 가꾼 땅이 펼쳐져요. 정원의 문, 낮은 산울타리, 언덕으로 이어지는 길이에요. 동전은 손에 잡히고 가능한 무언가를, 문은 아직 돌봄이 필요한 공간으로 들어서는 문턱을 암시해요. 차분한 초록빛과 따뜻한 흙빛은 인내, 성장, 그리고 손에 쥘 수 있는 것의 조용한 가치를 강조할 수 있어요.
