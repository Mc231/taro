imageryNote: >-
  그림은 앉아서 동전 하나를 가슴에 대고, 다른 동전들은 발밑에 두거나 머리 위에 균형 있게 얹은 인물을 보여 줄 수 있고, 그 뒤로 멀리 마을이 서 있어요. 웅크린 자세는 보호와 자기 안에 머무름을, 멀리 있는 건물들은 둥근 울타리 바깥에 둔 세상을 암시할 수 있어요. 묵직하고 각진 형태와 닫힌 실루엣은 안정을 강조하며, 그 안정이 어떤 대가를 치르는지라는 질문도 함께 던져요.
