shortUpright: >-
  실질적인 따뜻함과 돌봄을 쓸 수 있어요. 내가 다른 사람들을 위해 어떻게 편안함을 만드는지, 그리고 그 안에 나 자신도 포함되는지 알아차려 보세요.
shortReversed: >-
