imageryNote: >-
  그림은 걸음을 내딛는 중에 두 개의 동전을 공중에 띄우고 있는 인물을 보여 줄 수 있고, 동전들은 끝없는 곡선을 그리는 리본이나 끈으로 이어져 있어요. 뒤편의 굽이치는 물이나 파도 위에서 오르내리는 배들은 일상의 끊임없는 움직임을 떠올리게 할 수 있어요. 고리는 균형의 연속성과 계속되는 성질을 암시하고, 가볍게 춤추는 듯한 자세는 조정이 수월하게, 심지어 조금 즐겁게 이루어질 수 있다는 것을 넌지시 알려 줘요.
