imageryNote: >-
  Taro의 전차는 해안 길을 따라 작고 튼튼한 수레를 모는 인물로 그려지며, 수레를 끄는 두 동물은 하나는 차분하고 하나는 들떠 있어 기질이 서로 달라요. 모는 이는 고삐를 가볍게 쥐고 힘이 아닌 주의로 방향을 잡아요. 자리 위의 조개껍데기 같은 덮개는 게자리와 안전하게 앞으로 나아가게 해 주는 보호를 떠올리게 할 수 있고, 열린 길과 멀리 보이는 항구의 불빛은 강요된 것이 아닌 스스로 고른 목적지를 암시해요.
