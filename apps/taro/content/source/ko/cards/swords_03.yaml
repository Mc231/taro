imageryNote: >-
  이 고유한 그림은 낮게 드리운 회색 하늘 아래 하트 모양의 돌에 기대 놓인 가느다란 칼날 세 개를 보여 줘요. 그 주위로 부드러운 비가 내리고, 구름 가장자리에 희미한 빛줄기가 보여요. 돌은 슬픔의 무게를, 비는 눈물과 놓아줌을 암시해요. 먼 곳의 빛은 언제라고 약속하지는 않으면서, 폭풍은 지나간다는 것을 넌지시 알려 줘요.
