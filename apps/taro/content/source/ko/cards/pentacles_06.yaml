imageryNote: >-
  그림의 중심에는 한 손에 균형 잡힌 저울을 들고 다른 손으로 근처 사람들에게 동전을 건네는 서 있는 인물이 있을 수 있어요. 여섯 개의 동전이 장면 곳곳에 놓여, 일부는 손에, 일부는 사람들 사이의 공중에 있을 수 있어요. 저울은 공정함과 배려를, 내민 손은 너그러움을, 인물들의 서로 다른 위치는 어떤 교환에든 조용히 자리할 수 있는 힘의 문제를 상징할 수 있어요.
