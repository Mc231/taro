shortUpright: >-
  자원과 시간과 돌봄이 사람들 사이를 오가고 있어요. 내가 어떻게 주고, 어떻게 받으며, 모두에게 무엇이 공정하게 느껴지는지 알아차려 보세요.
shortReversed: >-
