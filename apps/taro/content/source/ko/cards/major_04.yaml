shortUpright: "소중한 것 주변에 구조를 세우고, 나의 선택을 차분히 책임질 때예요."
shortReversed: "한때 도움이 되던 규칙이 이제는 답답할 수 있어요. 더 너그럽고 튼튼한 구조는 어떤 모습일까요?"
meaningUpright: |-
  황제는 단단한 자리에 앉아 앞을 똑바로 바라봐요. 여황제가 무언가를 자라게 한다면, 이 카드는 그것이 자랄 틀을 마련해요. 일과, 약속, 지붕과 벽 같은 것이에요. 책임을 지는 에너지, 내 삶의 규칙이 무엇인지 정하고 그것을 지켜 나가는 에너지예요.
  일상에서 이 카드는 시간 계획을 세우거나, 프로젝트 계획서를 쓰거나, 바쁜 한 주 동안 다른 사람들이 기대는 든든한 사람이 되는 모습을 비출 수 있어요. 단호하고 차분한 "아니요"가 소중한 무언가를 지켜 주는 순간을 가리킬 수도 있어요. 여기서 구조는 통제를 위한 통제가 아니에요. 나와 주변 사람들이 숨 쉴 수 있을 만큼의 안정을 만드는 것이에요.
  이 카드는 조금 더 질서가 있으면 도움이 될 곳이 어디인지 생각해 보도록 권해요. 어떤 경계를 분명히 해야 하는지, 어떤 약속을 정말 지키고 싶은지, 힘이 아닌 공정함으로 어떻게 이끌 수 있을지 물어볼 수 있어요. 황제는 또한 내 삶에 대한 권한은 다른 누군가가 건네주기를 기다리지 않고 한 걸음씩 스스로 되찾을 수 있다는 것을 일깨워 줘요.
meaningReversed: |-
  역방향의 황제는 너무 무거워진 구조를 비출 수 있어요. 계획이 딱딱한 규칙으로 굳어지고, 안전하고 싶은 마음이 나 자신이나 다른 사람의 모든 세부 사항을 통제하려는 마음으로 바뀔 수 있어요. 일이 정해 둔 대로 꼭 맞게 흘러가지 않을 때 짜증이 나는 것을 알아차릴지도 몰라요.
  이 카드는 그 반대를 가리킬 수도 있어요. 구조가 조금 있으면 도움이 될 곳에 구조가 없거나, 다른 사람들이 규칙을 정하고 나는 따르기만 한다고 느끼는 것이에요. 어느 쪽이든 질문은 건강한 권한과 그것이 어디에 있는지에 관한 것이에요.
  균형이 어긋난 것 같은 영역 하나를 살펴봐도 좋아요. 너무 빡빡하다면 소중한 것을 잃지 않고 무엇을 느슨하게 할 수 있을까요? 너무 느슨하다면 어떤 작은 일과나 경계가 더 단단한 땅을 마련해 줄까요? 권한을 되찾는 일은 분명한 결정 하나에서 시작될 수 있어요.
aspects:
  relationshipsUpright: >-
    관계에서 황제는 믿음직함을 비출 수 있어요. 다른 사람이 기댈 수 있는 사람이 되고, 꾸준히 곁에 있어 주는 사람들을 소중히 여기는 것이에요. 일을 어떻게 나눌지, 계획을 어떻게 다룰지, 서로의 시간을 어떻게 존중할지 같은 함께 정한 약속에 대해 이야기해 보도록 권할 수 있어요. 분명한 경계는 친밀함을 차갑게 하기보다 더 안전하게 느끼게 할 수 있어요.
  relationshipsReversed: >-
    역방향에서 이 카드는 관계 속에서 한 사람이 대부분의 조건을 정하고 있지 않은지 물을 수 있어요. 어느 쪽에서든 통제, 고집, 말없이 규칙을 정하는 패턴을 알아차릴 수 있어요. 각자 존중받는다고 느끼려면 무엇이 필요한지 차분히 이야기하면, 겨루기로 만들지 않고도 균형을 되찾는 데 도움이 될 수 있어요.
  workUpright: >-
    일이나 프로젝트에서 황제는 조직과 주인 의식을 가리켜요. 우선순위를 정하고, 역할을 분명히 하고, 매일의 일을 더 쉽게 만드는 체계를 세우기 좋은 때일 수 있어요. 여기서 리더십은 공식 직함이 있든 없든 안정감, 공정함, 그리고 한 말을 끝까지 지키는 모습으로 나타나요.
  workReversed: >-
    역방향의 황제는 지나치게 경직된 직장, 또는 스트레스를 받을 때 사소한 것까지 관리하려는 나의 경향을 비출 수 있어요. 권위에 대한 답답함을 가리킬 수도 있어요. 어떤 규칙이 실제로 일에 도움이 되는지, 그리고 어디에서 건설적인 방식으로 더 많은 유연함을 제안하거나 요청할 수 있을지 물어볼 수 있어요.
  growthUpright: >-
    조용한 성장의 한 가지 형태는 나 자신에게 든든한 존재가 되는 것이에요. 일과, 자기 절제, 나와의 약속을 지키는 것은 조용한 종류의 자신감을 쌓아 줄 수 있어요. 내가 바라는 삶을 받쳐 주는 습관 하나를 골라 단순하고 믿을 수 있는 구조를 만들어 줄 수 있어요.
  growthReversed: >-
    역방향의 황제는 내가 스스로에게 너무 엄격한지, 아니면 충분히 엄격하지 않은지 물을 수 있어요. 가혹해진 자기 절제는 에너지를 고갈시키고, 아무 구조도 없으면 붕 뜬 느낌이 들 수 있어요. 중간의 길을 찾아볼 수 있어요. 나를 붙잡아 줄 만큼 단단하고, 함께 살아갈 만큼 부드러운 틀이에요.
reflectionQuestions:
  - "내 삶에서 더 분명하게 말하면 좋을 경계는 무엇인가요?"
  - "나는 어디에서 권한을 느끼고, 어디에서 그것을 내주고 있나요?"
  - "어떤 일과 하나가 한 주에 더 안정된 모양을 줄 수 있을까요?"
imageryNote: >-
  Taro의 황제는 언덕에 자리 잡은 튼튼한 돌 탁자에 앉아, 지도와 측량 막대와 등불을 가지런히 늘어놓은 인물로 그려져요. 뒤편 들판을 가로지르는 돌담은 손으로 돌 하나하나 쌓아 올린 경계를 보여 줘요. 근처에서 풀을 뜯는 숫양은 양자리와 시작하려는 추진력을 떠올리게 할 수 있어요. 따뜻한 붉은빛은 생명력을 암시하고, 한쪽 담에 열어 둔 작은 문은 단단한 구조도 사람들을 지나가게 할 수 있음을 넌지시 알려 줘요.
