imageryNote: >-
  Taro의 절제는 느리게 흐르는 강가에서 흙으로 빚은 그릇과 유리그릇, 서로 다른 두 그릇 사이로 액체를 조심스럽게 옮겨 붓는 날개 달린 인물로 그려져요. 두 그릇 사이의 물줄기는 부드럽게 휘어, 마치 지금 이 순간 균형을 찾아가는 듯해요. 강을 가로지르는 징검다리는 한쪽 둑에서 다른 쪽 둑으로 가는 중간의 길을 암시하고, 먼 언덕 위의 은은한 해돋이 빛깔은 분위기를 차분하고 희망차게 지켜 줘요.
