  workUpright: >-
    일이나 창작 프로젝트에서 완드 에이스는 진짜 끌림이 있는 아이디어를 가리킬 수 있어요. 새로운 접근, 사이드 프로젝트, 자꾸 다시 떠오르는 제안 같은 것이에요. 머릿속에만 두지 않고 바깥에서 시험해 볼 수 있도록 대략적인 개요, 시제품, 또는 믿을 수 있는 사람에게 하는 짧은 소개처럼 첫 번째 구체적인 형태를 줄 수 있어요.
  workReversed: >-
    역방향에서는 의욕이 깜빡이고 있을 수 있어요. 어떤 아이디어가 승인을 기다리고 있거나, 너무 많은 시작이 나의 시간을 두고 다투고 있을지도 몰라요. 따라갈 실 하나를 고르고 나머지는 당분간 내려놓을 때일 수 있어요. 여러 개를 한꺼번에 계획하는 것보다 아이디어 하나에서 작지만 눈에 보이는 진전을 이루는 것이 더 많은 에너지를 되살려 줄 때가 많아요.
  growthUpright: >-
    호기심은 그 자체로 하나의 스승이 될 수 있고, 이 카드는 그것을 따라가 보라고 넌지시 말해요. 내가 끌리는 것은 대개 내 안에서 무엇이 자라고 싶어 하는지 말해 줘요. 이번 주에 느끼는 불꽃들을 판단하지 말고 적어 두고, 그중 자꾸 다시 돌아오는 것을 찾아볼 수 있어요.
  growthReversed: >-
    역방향에서는 시작하기 전에 준비된 느낌이 들기를 기다리고 있거나, 영감이 떠오르지 않는다고 스스로를 다그치고 있을 수 있어요. 에너지에는 계절이 있어요. 지금을 조용히 모으는 시기로 여겨 볼 수 있어요. 쉬고, 읽고, 알아차리며, 새로운 관심이 저만의 속도로 모양을 갖추도록 두는 것이에요.
reflectionQuestions:
