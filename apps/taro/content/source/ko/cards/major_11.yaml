imageryNote: >-
  Taro의 정의는 가슴 높이에서 균형 잡힌 저울을 들고, 하늘을 향해 곧게 세운 칼날을 쥔 차분하고 꼿꼿한 인물로 그려져요. 인물은 보는 이를 똑바로 바라보며, 아무것도 숨기지 않는 정직함을 암시해요. 뒤편의 소박한 두 기둥과 장식 없는 커튼은 장면을 단정하게 유지하며, 신중한 생각을 위한 자리를 비워 두는 듯해요. 차가운 하늘빛과 하나의 따뜻한 강조색은 이성과 양심의 만남을 비출 수 있어요.
