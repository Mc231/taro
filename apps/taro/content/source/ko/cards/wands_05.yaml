  다섯 인물이 각자 지팡이를 들고 가까이 모여, 지팡이를 엇갈리는 각도로 들어 올리고 있어요. 장면은 활기차고 조금 혼란스럽지만 다친 사람은 아무도 없어 보여, 진짜 겨루기와 연습 놀이 사이에서 열려 있어요. 엇갈린 지팡이들의 얽힘은 서로 밀어붙이는 아이디어와 야망을 상징할 수 있고, 주변의 열린 땅은 한 걸음 물러나 함께하는 리듬을 찾을 여지를 암시해요.
