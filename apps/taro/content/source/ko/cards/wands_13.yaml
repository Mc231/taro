imageryNote: >-
  한 인물이 햇살 비치는 빈터에 놓인 넓은 자리에 편안히 앉아, 한 손에는 잎이 돋은 지팡이를 쥐고 다른 손은 보는 이를 향해 펼치고 있어요. 곁에는 화롯불이 빛나고, 주의 깊은 동물 친구가 가까이 누워 있어요. 화로는 다른 사람에게 건네는 따뜻함을, 펼친 손은 너그러움을, 편안한 자세는 스스로를 증명할 필요가 없는 자신감을 암시해요. 따뜻한 금빛과 호박색은 가장 안정되고 환하게 빛나는 불을 떠올리게 할 수 있어요.
