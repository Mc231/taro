imageryNote: >-
  Taro의 여황제는 늦여름의 텃밭에서 쉬고 있는 인물로 그려져요. 주변에는 익어 가는 채소들, 창턱에서 식어 가는 빵 한 덩이, 곁을 흐르는 시냇물이 있어요. 부드럽게 짠 천과 갓 딴 과일 바구니는 편안함과 감각의 즐거움을, 꽃 사이를 오가는 벌들은 수많은 작은 돌봄을 통해 이루어지는 성장을 암시해요. 분위기는 따뜻하고 여유로우며, 보는 이에게 이미 곁에 있는 풍요를 알아차리도록 권해요.
