  growthUpright: >-
    개인적 성장에서 여황제는 내 몸과 물리적인 세계 안에 있는 것을 즐기도록 권해요. 쉼, 좋은 음식, 자연 속에서 보내는 시간, 소박한 즐거움은 여기서 사치가 아니에요. 다시 힘을 채우는 방법이에요. 무엇이 나를 땅에 발 딛고 너그럽게 느끼게 하는지 알아차리고, 그것에 자리를 조금 더 내어 줄 수 있어요.
  growthReversed: >-
