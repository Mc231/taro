imageryNote: >-
  Taro의 여사제는 달빛이 비치는 문간의 문턱에 앉아, 반은 빛 속에 반은 그림자 속에 있으며 무릎 위에 덮인 책을 올려 둔 모습으로 그려져요. 인물 뒤로는 커튼이 살짝 흔들려 그 너머에 무언가가 기다리는 듯해요. 고요한 물그릇에 비친 초승달은 순환과 직관을 떠올리게 하고, 깊은 푸른빛은 표면의 잔잔함과 그 아래의 깊이를 암시해요. 그림의 중심은 인물의 조용하고 주의 깊은 고요함이에요.
