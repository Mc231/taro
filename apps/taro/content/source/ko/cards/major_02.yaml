shortUpright: "이미 느끼고 있지만 아직 말로 옮기지 못한 것에 귀 기울여 보라는 조용한 초대."
shortReversed: "바깥의 소음이 내 안의 더 조용한 목소리를 덮고 있을 수 있어요. 잠깐의 고요가 도움이 될 수 있어요."
meaningUpright: |-
  여사제는 두 기둥 사이, 알려진 것과 아직 감춰진 것의 경계에 앉아 있어요. 이 인물은 행동하거나 설명하지 않아요. 그의 선물은 주의 깊음이에요. 상황이나 대화, 감정의 표면 아래에 무엇이 있는지 알아차리는 깊고 끈기 있는 경청이에요.
  일상에서 이 카드는 완전히 설명할 수 없는 예감, 무언가 말해지지 않고 있다는 느낌, 오후까지 남아 맴도는 꿈을 비출 수 있어요. 더 많은 정보를 모아서가 아니라 이미 가진 것과 조용히 함께 머물 때 답을 찾게 되는 순간을 가리킬 수도 있어요. 어떤 것들은 명확함을 밀어붙이기를 멈출 때 비로소 분명해져요.
  이 카드는 나의 더 느리고 말이 적은 부분을 믿어 보도록 권해요. 저널을 쓰거나, 이어폰 없이 걷거나, 답하기 전에 잠시 멈추는 시간을 가져 볼 수 있어요. 내면의 앎은 사실을 대신하지 않으며, 사실과 나란히 있을 수 있어요. 여사제는 나의 조용한 목소리가 무엇을 말하려 했는지 알아차리고, 무엇을 할지 정하기 전에 그 목소리에 조금의 자리를 내어 주라고 해요.
meaningReversed: |-
  역방향의 여사제는 내면의 목소리가 있지만 듣기 어려운 상태를 나타낼 수 있어요. 바쁜 하루, 다른 사람들의 의견, 끊임없이 이어지는 화면들이 이 카드에 필요한 고요함을 밀어낼 수 있어요. 이미 어느 정도 알고 있는 일에 대해 계속 다른 사람에게 어떻게 해야 할지 묻고 있다는 것을 알아차릴지도 몰라요.
  이 카드는 무언가를 너무 오래 안에 품고 있는 모습을 가리킬 수도 있어요. 감춰진 채로 남아 이제는 무겁게 느껴지는 감정이나 질문, 진실 같은 것이에요. 사생활을 지키는 것은 건강한 일이지만, 나를 고립시키는 비밀은 다시 한번 살펴볼 만해요.
  작은 고요의 틈을 만들고 무엇이 떠오르는지 지켜봐도 좋아요. 고치지 않고 써 내려가거나, 스스로에게 간단한 질문 하나를 던지고 처음 떠오르는 솔직한 답을 기다려 보는 것도 도움이 될 수 있어요. 느끼고 있으면서 아직 스스로 말하도록 허락하지 않은 것은 무엇인가요?
aspects:
  relationshipsUpright: >-
    관계에서 여사제는 말하지 않아도 많은 것이 통하는 사이, 또는 말하기보다 듣는 것이 더 중요한 순간을 비출 수 있어요. 그 아래 흐르는 것들을 알아차리도록 권할 수 있어요. 친구의 침묵이 무엇을 뜻할지, 나의 망설임이 무엇을 지키고 있는지 같은 것이에요. 가까운 사람에게 서두르지 않는 관심이라는 선물을 건넬 수 있어요.
  relationshipsReversed: >-
    역방향에서 이 카드는 가까운 사람과의 사이에 남겨진 말하지 않은 것들, 또는 직접 묻지 않고 행간을 읽으려는 습관을 가리킬 수 있어요. 부드럽고 솔직한 질문 하나가 짐작을 대신할 수 있을지 생각해 볼 수 있어요. 나의 내면세계를 지키면서도 누군가가 그것을 조금 더 보도록 허락할 필요를 비출 수도 있어요.
  workUpright: >-
    일이나 프로젝트에서 여사제는 모든 결정을 오늘 내릴 필요는 없다고 말해 줄 수 있어요. 관찰하고, 인상을 모으고, 나의 타이밍 감각을 믿어 보도록 권할 수 있어요. 조사, 글쓰기, 계획, 멘토링 같은 성찰적인 일이 이 카드와 잘 어울려요. 조용한 역량과 신중함이 생각보다 더 높이 평가받고 있을지도 몰라요.
  workReversed: >-
    역방향의 여사제는 다른 사람들의 목소리가 더 커서 건전한 직감을 의심하게 되는 모습, 또는 팀 안에서 정보가 숨겨지는 상황을 비출 수 있어요. 어떤 상황에 대해 알고 있으면서 아직 말하지 않은 것은 무엇인지 물어볼 수 있어요. 그것을 차분하고 적절하게 나눌 방법을 찾으면 나를 포함한 모두에게 일이 더 분명해질 수 있어요.
  growthUpright: >-
    여사제와 함께하는 성장은 대개 고요함에서 시작돼요. 매일 몇 분씩 무언가를 고치려 하지 않고 그저 생각이나 호흡, 주변을 알아차리는 실험을 해 볼 수 있어요. 시간이 지나면 이런 주의 깊음이 불안한 잡념과 더 안정된 내면의 감각을 구별하는 데 도움이 될 수 있어요.
  growthReversed: >-
    역방향의 여사제는 요즘 성찰하기보다 반응하며 주로 표면에서만 살고 있지 않았는지 물을 수 있어요. 당장 답을 찾아야 한다는 부담 없이 다시 내면으로 향해 보라는 가벼운 신호일 수 있어요. 이번 주에 조용한 의식 하나를 마련하고, 귀 기울일 여유를 스스로에게 줄 때 무엇이 달라지는지 알아차려 볼 수 있어요.
reflectionQuestions:
  - "내 상황에 대해 느끼고 있지만 소리 내어 말하지 않은 것은 무엇인가요?"
