imageryNote: >-
  Taro의 악마는 그림자에 싸인 뿔 달린 형상이 높은 자리에 걸터앉아 있고, 그 아래 더 작은 두 인물이 헐겁게 늘어진 사슬로 그 자리에 이어진 모습으로 그려져요. 사슬은 손목 둘레에 분명히 헐겁게 그려져, 보는 이에게 그들이 사슬을 벗어 버릴 수도 있다는 것을 알아차리게 해요. 희미한 횃불과 짙은 흙빛은 무거운 분위기를 만들지만, 장면 가장자리의 희미한 빛의 문은 찾아갈 수 있는 다른 길이 있다는 것을 넌지시 알려 줘요.
