  growthUpright: >-
    악마는 그림자 작업으로 가는 문을 열어 줘요. 내가 숨기려 하는 내 안의 부분들을 부드럽게 탐색하는 것이에요. 어쩔 수 없이 하게 되는 것처럼 느껴지는 습관을 알아차리고, 판단이 아닌 호기심으로 그것이 나에게 무엇을 주려 하는지 물어볼 수 있어요. 변화에 앞서 이해가 먼저 와요.
  growthReversed: >-
