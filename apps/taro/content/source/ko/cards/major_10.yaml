imageryNote: >-
  Taro의 운명의 수레바퀴는 한쪽 끝은 새벽이고 다른 쪽 끝은 밤인 하늘 속에 놓인 커다란 바퀴로 그려져, 모든 시기를 한 번에 보여 줘요. 작은 인물과 생명체들이 바퀴 테두리에 올라타 있는데, 어떤 것은 올라가고 어떤 것은 내려가며 가만히 있는 것은 없어요. 네 귀퉁이의 사계절 상징은 자연의 순환이라는 생각을 감싸 줄 수 있어요. 바퀴 중심의 차분하고 움직이지 않는 축은 모든 것이 돌아가는 가운데에서도 찾을 수 있는 안정된 관점을 암시해요.
