  workReversed: >-
    역방향의 마법사는 제대로 쓰이지 않는 재능, 또는 너무 얇게 퍼져서 어느 것도 제대로 결실을 맺지 못하는 노력을 비출 수 있어요. 과장하거나 대충 넘어가고 싶은 유혹을 가리킬 수도 있어요. 지금 정말 에너지를 쏟을 만한 일은 무엇인지, 앞으로 며칠 동안 그 일에 정직하고 꾸준하게 임한다면 어떤 모습일지 물어볼 수 있어요.
  growthUpright: >-
    개인적 성장에서 이 카드는 나 자신의 주체성을 알아보도록 권해요. 이미 가진 기술, 습관, 도움의 손길을 적어 보고, 그것이 내가 아끼는 무언가에 어떻게 쓰일 수 있을지 살펴볼 수 있어요. 연습, 반복, 분명한 의도는 마법사의 조용한 도구예요. 매일의 작은 선택이 시간이 지나며 진짜 변화로 쌓일 수 있어요.
