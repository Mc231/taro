imageryNote: >-
  Taro의 마법사는 새벽녘 갈림길의 시장 가판대에서 네 수트를 나타내는 소박한 물건 네 가지를 늘어놓는 모습으로 그려져요. 푸른 나뭇가지, 흙으로 빚은 컵, 빵을 자르는 칼, 그리고 동전 하나예요. 한 손은 가판대로 뻗고 다른 손은 밝아 오는 하늘을 가리키며 생각과 행동을 이어요. 물건들 사이를 흐르는 빛줄기는 따로 떨어진 도구들을 하나의 목적으로 모으는 주의를 떠올리게 하고, 다 만들지 않은 빵 한 덩이는 만드는 일이 이제 막 시작되었음을 암시해요.
