imageryNote: >-
  Taro의 세계는 사계절의 잎과 꽃으로 엮은 커다란 타원형 화환 안에서 춤추는 인물로 그려지며, 별이 가득한 하늘 한가운데에서 자유롭게 움직여요. 화환 둘레에는 불, 물, 공기, 흙을 나타내는 작은 문장 네 개가 장면의 가장자리를 표시하며 균형과 온전함을 암시해요. 춤추는 이의 손에서 흘러나온 리본은 시작된 자리로 다시 돌아와 고리를 이루며, 보는 이에게 도착의 느낌과 한 바퀴를 돈 여정을 느끼도록 권해요.
