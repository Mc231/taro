imageryNote: >-
  Taro의 태양은 한낮의 넓은 여름 들판으로 그려져요. 여러 나이대의 친구들이 크고 따뜻한 태양 아래 담요 위에서 음식을 나눠요. 연들이 바람을 타고 오르고 긴 그림자는 어디에도 보이지 않아, 숨길 것이 없는 순간을 암시해요. 밝은 노랑과 따뜻한 주황이 장면을 채우고, 풀밭을 달리는 개 한 마리가 놀이의 기운을 더해요. 이 그림은 보는 이에게 따뜻함, 명료함, 복잡하지 않은 기쁨을 느끼도록 권해요.
