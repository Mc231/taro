imageryNote: >-
  Taro의 힘은 햇살 가득한 초원에서 커다란 사자 곁에 무릎 꿇은 차분한 인물로 그려져요. 한 손은 사자의 갈기에 얹혀 있고, 사자는 편안하고 믿는 듯 몸을 기대요. 밧줄이나 사슬은 보이지 않아요. 둘의 유대는 가까움과 편안함으로 드러나요. 둘 주변에 피어난 들꽃은 인내가 더 부드러운 것들을 피어나게 한다는 것을 암시해요. 따뜻한 금빛은 분위기를 평화롭게 지키며 힘과 부드러움이 나란히 있는 모습을 보여 줘요.
