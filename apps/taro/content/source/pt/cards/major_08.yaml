shortUpright: >-
  A coragem nem sempre ruge. Às vezes ela se parece com paciência, gentileza e permanecer diante de algo difícil.
shortReversed: >-
  A sua firmeza interior pode estar frágil agora. A gentileza consigo pode ser um ótimo ponto de partida.
meaningUpright: |-
  A Força é uma carta de coragem, mas não da coragem barulhenta. A sua imagem tradicional mostra uma figura apoiando a mão, com calma, sobre um leão, sem dominá-lo, apenas acalmando. A força aqui vem da paciência, do calor humano e de uma presença firme capaz de encarar uma energia selvagem, de outra pessoa ou sua, sem entrar em pânico.
  No dia a dia, esta carta pode refletir manter a calma numa conversa tensa, cumprir uma promessa quando ela ficou inconveniente, ou ficar com um sentimento forte tempo suficiente para entendê-lo antes de agir. Ela pode apontar para a confiança tranquila de quem não tem nada a provar. Domar o leão tem menos a ver com reprimi-lo e mais a ver com fazer amizade com ele.
  Esta carta convida você a considerar como responde à pressão. Você pode se perguntar onde a compaixão, inclusive consigo, poderia funcionar melhor do que a força. A Força sugere que suavidade e firmeza podem conviver, e que o tipo de coragem mais duradouro costuma ser firme, gentil e persistente.
meaningReversed: |-
  Invertida, a Força pode refletir um momento em que a sua firmeza de sempre parece mais difícil de encontrar. A paciência pode acabar rápido, ou você pode ouvir uma voz interior mais afiada e mais crítica do que o normal. O leão está inquieto, e você também.
  Esta carta também pode apontar para uma coragem voltada para dentro e ainda não expressa: pode haver em você mais força do que você sente, mas a insegurança tornou difícil mostrá-la. Ou pode refletir o esforço de segurar tudo só com a força de vontade, o que costuma desgastar.
  Talvez valha notar como você fala consigo quando as coisas estão difíceis. O que mudaria se você usasse o tom que usaria com uma pessoa amiga assustada? Reconstruir a coragem muitas vezes começa com pequenos gestos de gentileza consigo, e com pedir apoio quando a carga pesa.
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, a Força pode refletir uma paciência e um calor que ajudam as pessoas a se sentirem seguras com você. Ela pode convidar você a receber o mau humor de alguém com calma, sem entrar na mesma intensidade, e ainda assim manter os seus próprios limites. Uma firmeza gentil pode construir confiança aos poucos.
  relationshipsReversed: >-
    Invertida, esta carta pode apontar para pavios curtos, ou para alguém engolindo os próprios sentimentos para evitar conflito. Você pode considerar se está exigindo demais de você ou de alguém próximo. Falar com gentileza, antes que a frustração se acumule, pode proteger a conexão e a sua própria sensação de firmeza.
  workUpright: >-
    No trabalho ou em um projeto, a Força destaca a persistência e a maturidade emocional. Ela pode refletir lidar com uma tarefa ou uma pessoa exigente com paciência e elegância, ou liderar pelo incentivo, e não pela pressão. Você pode confiar que um esforço constante e firme conta, mesmo quando ninguém está olhando.
  workReversed: >-
    Invertida, a Força pode refletir um desgaste causado pela pressão, ou a dúvida sobre a sua capacidade de lidar com um desafio. Ela também pode apontar para reações bruscas sob estresse. Você pode se perguntar que apoio ou descanso ajudaria você a recuperar o equilíbrio, e como definir um ritmo que dê para manter.
  growthUpright: >-
    A Força sugere fazer amizade com o seu próprio leão interior, no lugar de prendê-lo numa jaula: os sentimentos fortes, os desejos e os instintos que fazem de você quem você é. Sem lutar contra eles, você pode ter curiosidade sobre o que eles pedem. A autocompaixão não é fraqueza aqui; é uma prática que torna a coragem mais sustentável.
  growthReversed: >-
    Invertida, a Força pode lembrar que a confiança pode diminuir e voltar. Ela pode refletir uma fase de insegurança ou de autocrítica dura. Você pode manter uma pequena lista de momentos em que lidou bem com as coisas, e lê-la nos dias difíceis, como prova da firmeza que você já tem.
reflectionQuestions:
  - >-
    Como seria uma coragem gentil na situação em que você está pensando?
  - >-
    O mau humor de quem você está enfrentando, e como manter a firmeza ao lado dessa pessoa?
  - "Que palavras gentis você poderia oferecer a si hoje?"
imageryNote: >-
  A Força do Taro é imaginada como uma figura serena ajoelhada num campo ensolarado ao lado de um grande leão, com uma mão apoiada na juba enquanto o animal se inclina, relaxado e confiante. Não há cordas nem correntes; o vínculo aparece na proximidade e na tranquilidade. Flores silvestres crescendo ao redor dos dois sugerem que a paciência deixa as coisas mais delicadas florescerem. Uma luz dourada e morna mantém o clima de paz, mostrando poder e gentileza lado a lado.
