  - "Onde você está esperando que outra pessoa se mova primeiro?"
  - >-
    Do que você poderia abrir mão nesta semana para dar espaço a algo novo?
imageryNote: >-
  O Enforcado do Taro é imaginado de cabeça para baixo, pendurado por um tornozelo num galho firme e vivo, com os braços relaxados e o rosto calmo, até curioso. Desse ângulo, a figura vê o mundo refletido num lago embaixo, virado ao contrário. A árvore está verde e cheia de brotos, mostrando que a pausa faz parte do crescimento, e não o encerra. Azuis aquosos e roupas soltas e fluidas ecoam a entrega, o sonho e o olhar por baixo da superfície.
