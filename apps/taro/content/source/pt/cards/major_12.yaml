shortUpright: >-
  Uma pausa, escolhida ou não, pode oferecer uma vista que você nunca veria correndo para a frente.
shortReversed: >-
  A espera pode ter virado adiamento. O que ajudaria você a decidir entre ficar no lugar ou se mover?
meaningUpright: |-
  O Enforcado está de cabeça para baixo, pendurado numa árvore viva, mas o seu rosto está calmo, às vezes até luminoso. Esta não é uma carta de castigo. É uma carta de suspensão deliberada: sair do fluxo habitual do fazer para ver as coisas de outro jeito. Quando você vira o mundo de cabeça para baixo, o que parecia óbvio pode de repente parecer estranho, e o que parecia impossível pode ficar ao alcance.
  No dia a dia, esta carta pode refletir um projeto em espera, um plano adiado pelas circunstâncias, ou um momento em que você percebe que forçar mais não está ajudando. Ela pode apontar para o valor de soltar uma ideia fixa sobre como algo deveria acontecer. Às vezes, o movimento mais útil é parar de se mover e simplesmente olhar.
  Esta carta convida você a considerar o que uma pausa pode estar oferecendo. Você pode se perguntar o que notaria se olhasse a sua situação pelo ângulo oposto. O Enforcado sugere que a entrega, no sentido de soltar a necessidade de controle, pode abrir espaço para a compreensão, e que a espera pode ser ativa quando vem acompanhada de atenção.
meaningReversed: |-
  Invertido, o Enforcado pode refletir uma pausa que durou além do seu propósito. Você pode ter a sensação de estar num limbo, esperando que algo mude sem saber direito o que está esperando. A indecisão pode começar a parecer mais segura do que escolher.
  Esta carta também pode apontar para a resistência a uma pausa de que você tem necessidade, enchendo cada momento para evitar o desconforto da quietude, ou sacrificando as próprias necessidades de um jeito que já não serve a ninguém.
  Talvez valha perguntar o que a espera está protegendo. Se é hora de se mover, qual é o menor passo que tiraria você do lugar? Se é hora de parar, que permissão você poderia se dar para descansar sem culpa? Em qualquer caso, a escolha é sua, e fazê-la pode devolver o senso de direção.
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, o Enforcado pode refletir um momento de dar um passo atrás e ver a situação pelo ponto de vista da outra pessoa. Ele pode convidar você a soltar a vontade de vencer uma discussão ou de resolver tudo agora. Paciência e abertura para ver de outro jeito podem trazer uma compreensão inesperada.
  relationshipsReversed: >-
    Invertida, esta carta pode apontar para um relacionamento em suspenso, em que nenhuma das pessoas diz o que quer. Ela também pode refletir dar mais do que parece justo na esperança de que as coisas mudem. Você pode considerar se é hora de dizer com gentileza o que você quer, para que os dois possam seguir em frente.
  workUpright: >-
    No trabalho ou em um projeto, o Enforcado destaca uma pausa para repensar. Atrasos podem frustrar, mas podem oferecer tempo para questionar suposições, pesquisar alternativas ou deixar uma ideia amadurecer. Você pode usar um período lento para olhar o seu trabalho por um ângulo completamente diferente.
  workReversed: >-
    Invertido, o Enforcado pode refletir um projeto parado há tempo demais ou uma decisão adiada sem fim. Você pode se perguntar que informação ou apoio está de fato esperando. Definir um prazo gentil para si, ou escolher abrir mão de uma opção, pode ajudar o movimento a voltar.
  growthUpright: >-
    Soltar é uma habilidade, e o Enforcado oferece uma chance de praticá-la. O que você solta pode ser uma crença, uma expectativa ou o hábito de correr. Você pode tentar fazer algo conhecido na ordem inversa ou por um novo ângulo, e notar o que essa pequena quebra revela sobre o jeito como você costuma ver o mundo.
  growthReversed: >-
    Invertido, o Enforcado pode perguntar se você está evitando a quietude ou se ela virou uma prisão. Ele pode refletir inquietação ou a sensação de estar em espera. Você pode fazer uma pausa e se perguntar: este é um momento de paciência ou de um empurrãozinho gentil? A sua resposta honesta pode guiar o próximo passo.
reflectionQuestions:
