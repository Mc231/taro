imageryNote: >-
  A arte pode mostrar uma figura pausando ao lado de uma planta frondosa ou de uma videira em que sete moedas pendem como frutos amadurecendo, apoiada numa enxada ou pá. A postura de descanso pode simbolizar a avaliação e a importância de dar um passo atrás, enquanto a planta sugere um crescimento que tem o seu próprio tempo. A terra, as folhas e a ferramenta juntas podem falar de um trabalho constante, e a colheita ainda verde lembra a quem olha que a obra ainda está em andamento.
