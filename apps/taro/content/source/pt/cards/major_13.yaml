shortUpright: >-
  Uma fase pode estar se encerrando. Esta carta convida você a notar o que está terminando e o espaço que fica.
shortReversed: >-
  Algo pode estar pronto para terminar enquanto uma parte de você ainda se agarra. O que ajudaria a soltar?
meaningUpright: |-
  Apesar do nome, esta carta não fala de morte física. Ela fala de fins no sentido comum e humano: o fechamento de uma fase, de um papel, de um hábito ou de um jeito de se ver. Como o outono que limpa os galhos antes do novo crescimento, ela sugere que algumas coisas terminam para que outras possam começar.
  No dia a dia, esta carta pode refletir mudar de casa, terminar um curso, se afastar de um projeto ou notar que uma versão antiga de você não serve mais. Ela pode trazer uma mistura de sentimentos: alívio, tristeza, incerteza, até empolgação. Todos são naturais. A transformação raramente é arrumada, e muitas vezes leva tempo para entender o que uma mudança tornou possível.
  Esta carta convida você a considerar o que está pronto para ser liberado. Você pode se perguntar o que ainda carrega por hábito, e que espaço poderia se abrir se você deixasse isso no chão. A Morte destaca que os fins, mesmo os bem-vindos, merecem reconhecimento. Honrar o que foi pode facilitar a virada em direção ao que pode vir a seguir.
meaningReversed: |-
  Invertida, a Morte pode refletir um fim que está levando o seu tempo. Você pode sentir que uma fase acabou e ainda assim se agarrar a ela, talvez porque o conhecido parece mais seguro do que o desconhecido, ou porque soltar parece perder uma parte de você.
  Esta carta também pode apontar para uma transição que acontece devagar e em silêncio, por baixo da superfície, e não num único momento claro. Nem toda mudança chega com um corte limpo.
  Talvez valha notar ao que você está se agarrando e o que esse apego está protegendo. Pequenos rituais de encerramento, como escrever uma carta de despedida que você não envia, arrumar uma gaveta ou marcar um último dia, podem ajudar. Não há pressa. Permitir-se viver o luto do que está terminando pode deixar a liberação mais suave.
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, esta carta pode refletir uma mudança importante no jeito como um vínculo funciona: uma nova etapa, uma troca de papéis, ou o fim de um padrão que já não ajudava nenhuma das pessoas. Ela não aponta para o bem-estar físico de ninguém. Ela pode convidar vocês a reconhecer juntos o que está mudando, com honestidade e cuidado.
  relationshipsReversed: >-
    Invertida, esta carta pode apontar para o apego a uma dinâmica antiga que as duas pessoas já superaram, ou para a dificuldade de aceitar que uma conexão mudou. Você pode considerar o que ajudaria você a deixar o relacionamento tomar a sua nova forma, seja ela qual for.
  workUpright: >-
    No trabalho ou em um projeto, a Morte destaca a conclusão e a transição. Ela pode refletir o fim de uma função, o encerramento de um projeto ou a aposentadoria de um jeito de trabalhar que já cumpriu o seu ciclo. Você pode fazer um balanço do que aprendeu e do que quer levar para o próximo capítulo.
  workReversed: >-
    Invertida, a Morte pode refletir continuar numa tarefa, função ou método por hábito, depois que deixou de servir. Ela também pode apontar para o medo do que vem depois. Você pode listar o que a situação atual ainda oferece e o que ela custa, e notar o que esse balanço diz a você.
  growthUpright: >-
    Identidades antigas podem cair como folhas, abrindo espaço para o que ainda está se formando. Você pode notar crenças sobre você que já foram verdadeiras, mas não são mais. Soltá-las pode criar espaço para uma versão sua mais fiel a quem você está se tornando.
  growthReversed: >-
    Invertida, a Morte pode perguntar se o medo da mudança está mantendo você num espaço menor do que o seu tamanho. Ela pode refletir uma transformação lenta e paciente que merece a sua confiança. Você pode escolher uma pequena coisa para soltar nesta semana e notar como se sente depois.
