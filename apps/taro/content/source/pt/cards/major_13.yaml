imageryNote: >-
  A Morte do Taro é imaginada como uma paisagem tranquila de outono, em que um rio lento leva folhas caídas em direção a um sol nascendo no horizonte. Uma figura de manto, sem pressa, caminha ao lado da água levando uma única vagem de sementes ou um galho nu, símbolos do que termina e do que espera para crescer. Uma flor branca sobre um fundo escuro pode sugerir renovação dentro da liberação. O clima é calmo e respeitoso, apontando para transformação, e não para perda.
