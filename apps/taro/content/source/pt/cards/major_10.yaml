imageryNote: >-
  A Roda da Fortuna do Taro é imaginada como uma grande roda girando num céu que passa do amanhecer, numa borda, à noite, na outra, mostrando todas as fases ao mesmo tempo. Pequenas figuras e criaturas seguem na sua borda, algumas subindo e outras descendo, nenhuma parada. Símbolos das quatro estações nos cantos podem emoldurar a ideia dos ciclos naturais. No eixo, um centro calmo e imóvel sugere a perspectiva firme que pode ser encontrada mesmo enquanto tudo gira.
