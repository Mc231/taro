meaningUpright: |-
  A Roda da Fortuna é a carta dos ciclos. As estações mudam, o humor sobe e desce, períodos agitados dão lugar a períodos calmos. Nada fica no alto ou embaixo para sempre. Esta carta lembra que a mudança é uma parte normal da vida, e que uma parte dela está fora do controle de qualquer pessoa, enquanto outra parte responde ao modo como você a recebe.
  No dia a dia, esta carta pode refletir um ponto de virada: um capítulo que se fecha e outro que se abre, um golpe de sorte que muda os seus planos, ou um contratempo inesperado que altera o seu ritmo. Ela também pode apontar para o reconhecimento de um padrão que já apareceu antes, como o mesmo tipo de situação chegando com outra forma, e para a chance de vê-lo com outros olhos.
  Esta carta convida você a considerar em que ponto da sua própria roda você está agora. Você pode se perguntar o que esta fase pede de você e o que ela poderia estar ensinando. A Roda não decide a sua vida por você. Ela destaca que flexibilidade, perspectiva e senso de humor podem ajudar você a acompanhar as voltas, e que uma estação difícil é uma estação, não um estado permanente.
meaningReversed: |-
  Invertida, a Roda da Fortuna pode refletir a sensação de estar num ciclo repetido ou de resistir a uma mudança que já está em andamento. Você pode sentir que os acontecimentos simplesmente caem sobre você, ou notar que o mesmo padrão frustrante volta e volta com outra roupa.
  Esta carta também pode apontar para o apego a uma fase boa, com medo de que ela não dure. Agarrar-se torna a virada natural mais difícil.
  Talvez valha olhar para o que está ao seu alcance. Os padrões costumam se repetir até que algo no nosso jeito de responder mude, mesmo que pouco. Pode ajudar dar nome ao ciclo que você vê, notar a sua parte nele sem culpa, e escolher uma pequena coisa para fazer de outro jeito. Você não pode parar a roda, mas pode encontrar um apoio mais firme nela.
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, a Roda pode refletir uma nova fase: aproximar-se, passar para outra etapa ou simplesmente se ajustar a circunstâncias que mudam. Ela pode convidar você a manter a flexibilidade e a conversar abertamente sobre como as coisas estão se transformando. Os relacionamentos, como as estações, têm ritmos, e dar nome a eles pode ajudar vocês a atravessá-los juntos.
  relationshipsReversed: >-
    Invertida, esta carta pode apontar para conflitos conhecidos que vivem voltando, ou para uma resistência a que o relacionamento mude de forma. Você pode considerar que padrão você e alguém próximo costumam repetir, e o que cada um poderia tentar de outro jeito. Mudança não é sinônimo de perda; pode significar crescimento.
  workUpright: >-
    No trabalho ou em um projeto, a Roda destaca circunstâncias que mudam e novas aberturas. Ela pode refletir uma mudança de planos, uma nova equipe ou um projeto que de repente avança. Você pode manter a atenção nas oportunidades, lembrando que cada fase, agitada ou lenta, tem algo a oferecer.
  workReversed: >-
    Invertida, a Roda pode refletir frustração com atrasos ou a sensação de que o esforço não está dando retorno. Ela também pode apontar para repetir a mesma abordagem esperando um resultado diferente. Você pode rever o que já funcionou, o que não funcionou, e onde uma pequena mudança de método poderia alterar o padrão.
  growthUpright: >-
    Ver a sua vida como uma série de ciclos, e não como uma linha reta, pode ser libertador. Notar os seus próprios ritmos, como os momentos de mais energia ou de mais necessidade de descanso, pode ajudar você a planejar a favor deles, e não contra. Você pode mapear o último ano e notar os seus pontos de virada.
  growthReversed: >-
    Invertida, a Roda pode perguntar se você está tentando controlar o que não pode ser controlado. Ela pode refletir um desejo de certeza num momento de mudança. Você pode praticar soltar uma coisa que não está nas suas mãos, e colocar essa energia em uma coisa que está.
