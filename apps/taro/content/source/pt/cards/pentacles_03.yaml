imageryNote: >-
  A arte pode colocar três figuras em volta de uma estrutura inacabada, como um arco, uma bancada ou uma armação erguida, cada uma ocupada com uma tarefa diferente. Uma segura um plano, outra trabalha o material, outra firma ou avalia. Três moedas encaixadas na própria estrutura podem sugerir que o valor nasce da cooperação. Andaimes, ferramentas e espaço aberto ao redor da obra indicam que o trabalho ainda está em andamento e aberto a melhorias.
