shortUpright: >-
  Um bom trabalho muitas vezes cresce entre pessoas. Note como habilidades diferentes poderiam se encaixar em algo que importa para você.
shortReversed: >-
  Um esforço compartilhado pode estar puxando para lados diferentes. Pode ajudar rever papéis, planos e o jeito como vocês se escutam.
meaningUpright: |-
  O Três de Ouros é uma carta de construir com os outros. Três moedas encaixadas numa estrutura sugerem uma obra que nenhuma pessoa sozinha conseguiria moldar: uma traz o desenho, outra os materiais, outra as mãos firmes. O que se destaca não é a hierarquia, e sim o respeito pelo que cada um contribui.
  No dia a dia, isso pode aparecer como um projeto em equipe que finalmente engrena, um vizinho que ajuda você a consertar algo, um grupo de estudos, ou um mentor cujo retorno afia a sua habilidade. Também pode refletir a satisfação de ter a sua parte reconhecida, e de reconhecer a parte dos outros.
  Esta carta convida você a considerar onde a colaboração poderia levar o seu trabalho além do que você conseguiria por conta própria. Você pode se perguntar que conhecimento complementa o seu, como poderia compartilhar um plano com clareza, e como você recebe opiniões. O ofício se aprofunda quando as pessoas aceitam olhar para o mesmo projeto e melhorá-lo juntas.
meaningReversed: |-
  Invertido, o Três de Ouros pode apontar para um esforço compartilhado que perdeu o plano comum. As pessoas podem estar trabalhando muito, mas em direção a imagens um pouco diferentes, ou os papéis podem estar vagos, de modo que algumas tarefas se repetem e outras caem no vão. Ele também pode refletir a vontade de fazer tudo sem ajuda, talvez porque pedir pareça mais lento ou menos seguro.
  É um convite para rever o projeto, e não para buscar culpados. O desalinhamento é comum, e dar nome a ele cedo costuma custar menos do que seguir em frente.
  Você pode sugerir uma conversa curta sobre objetivos e sobre quem faz o quê, ou escrever o plano num lugar onde todos possam ver. Se você costuma trabalhar isoladamente, considere uma parte que poderia passar adiante, e note o que muda quando outra pessoa soma a habilidade dela à sua.
aspects:
  relationshipsUpright: >-
    Nos vínculos próximos, esta carta pode refletir o trabalho em equipe no dia a dia: planejar uma mudança juntos, dividir as tarefas da casa, apoiar os projetos um do outro. Você pode notar como os seus pontos fortes são diferentes e como isso pode ser um presente, e não um atrito. Dizer em voz alta o que você valoriza no jeito como alguém contribui pode fortalecer a base que vocês estão construindo juntos.
  relationshipsReversed: >-
    Invertida, a carta pode sugerir que você e alguém próximo estão trabalhando por imagens diferentes do mesmo objetivo, ou que uma pessoa carrega mais da parte prática. No lugar de fazer contas, vocês podem sentar e comparar expectativas. Esclarecer quem cuida do quê pode aliviar a tensão e ajudar cada pessoa a sentir reconhecimento.
  workUpright: >-
    No trabalho, esta carta destaca a colaboração e o ofício. Ela pode refletir um projeto em que a comunicação clara e o respeito mútuo deixam as habilidades de todos aparecerem. Você pode buscar oportunidades de pedir retorno, compartilhar o que sabe ou reunir pessoas cujas capacidades se encaixam bem. A qualidade costuma subir quando o plano é compartilhado.
  workReversed: >-
    Aqui a carta pode apontar para papéis pouco claros, mal-entendidos ou uma equipe puxando para lados diferentes. Ela também pode refletir o trabalho isolado em algo que ganharia com outros olhares. Você pode propor um breve alinhamento sobre objetivos e responsabilidades, ou convidar um colega para revisar a sua abordagem antes de ir adiante.
  growthUpright: >-
    No crescimento pessoal, o Três de Ouros pode convidar você a aprender com os outros e junto deles. Um professor, uma oficina, alguém para praticar junto ou uma comunidade on-line podem ajudar você a aprimorar uma habilidade. Você pode notar como é ser iniciante entre pessoas que sabem mais, e o quanto você tem a oferecer em troca.
