meaningUpright: |-
  O Imperador está sentado em um trono firme e olha direto para a frente. Enquanto a Imperatriz deixa as coisas crescerem, esta carta lhes dá uma moldura para crescer dentro: rotinas, acordos, um teto e paredes. É a energia de assumir responsabilidade, de decidir quais são as regras da sua própria vida e de mantê-las.
  No dia a dia, esta carta pode refletir organizar o seu tempo, escrever o plano de um projeto ou ser a pessoa firme em quem os outros se apoiam numa semana corrida. Ela pode apontar para momentos em que um "não" calmo e firme protege algo que você valoriza. Estrutura aqui não é controle pelo controle; é criar estabilidade suficiente para que você e as pessoas ao seu redor possam respirar.
  Esta carta convida você a considerar onde um pouco mais de ordem ajudaria. Você pode se perguntar quais limites pedem mais clareza, quais compromissos você realmente quer manter e como pode liderar com justiça, sem recorrer à força. O Imperador também lembra que a autoridade sobre a sua própria vida é algo que você pode assumir, passo a passo, sem esperar que alguém a entregue a você.
meaningReversed: |-
  Invertido, o Imperador pode refletir uma estrutura que ficou pesada demais. Planos podem endurecer e virar regras rígidas, e a necessidade de segurança pode se transformar na necessidade de controlar cada detalhe, seu ou dos outros. Você pode notar uma irritação quando as coisas não saem do jeito combinado.
  Esta carta também pode apontar para o oposto: falta de estrutura onde um pouco dela ajudaria, ou a sensação de que os outros fazem as regras e você só segue. Em qualquer caso, a questão é sobre uma autoridade saudável e sobre onde ela está.
  Talvez valha olhar para uma área em que o equilíbrio parece fora do lugar. Se está apertado demais, o que você poderia afrouxar sem perder o que importa? Se está solto demais, que pequena rotina ou limite daria a você um chão mais firme? Retomar a autoridade pode começar com uma única decisão clara.
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, o Imperador pode refletir confiabilidade: ser alguém com quem os outros podem contar e valorizar as pessoas que estão presentes para você com constância. Ele pode convidar vocês a conversar sobre acordos em comum, como dividir tarefas, lidar com planos ou respeitar o tempo um do outro. Limites claros podem fazer a proximidade parecer mais segura, e não mais fria.
  relationshipsReversed: >-
    Invertida, esta carta pode perguntar se uma das pessoas do relacionamento está definindo a maior parte das condições. Você pode notar padrões de controle, teimosia ou regras impostas em silêncio, de qualquer um dos lados. Uma conversa calma sobre o que cada pessoa quer para sentir respeito pode ajudar a reequilibrar as coisas sem transformar isso numa disputa.
  workUpright: >-
    No trabalho ou em um projeto, o Imperador aponta para organização e responsabilidade. Pode ser um bom momento para definir prioridades, papéis ou montar um sistema que facilite o dia a dia. Liderança aqui se parece com firmeza, justiça e cumprir a palavra, tendo você um cargo formal ou não.
  workReversed: >-
    Invertido, o Imperador pode refletir um ambiente de trabalho que parece rígido demais, ou a sua própria tendência a controlar cada detalhe sob estresse. Ele também pode apontar para uma frustração com a autoridade. Você pode se perguntar quais regras realmente servem ao trabalho, e onde poderia oferecer ou pedir mais flexibilidade de um jeito construtivo.
  growthUpright: >-
    Uma forma discreta de crescimento é se tornar uma presença firme para você. Rotinas, autodisciplina e cumprir as promessas que você faz a si podem construir uma confiança tranquila. Você pode escolher um hábito que apoie a vida que deseja e dar a ele uma estrutura simples e confiável.
  growthReversed: >-
    Invertido, o Imperador pode perguntar se a sua disciplina consigo está dura demais, ou frouxa demais. A autodisciplina que endurece pode drenar a energia, enquanto a falta de estrutura pode deixar uma sensação de estar à deriva. Você pode buscar o caminho do meio: uma moldura firme o bastante para sustentar você e gentil o bastante para conviver com ela.
reflectionQuestions:
  - >-
    Qual limite na sua vida ganharia se fosse dito com mais clareza?
  - "Onde você sente que tem autoridade, e onde abre mão dela?"
  - "Que rotina poderia dar à sua semana uma forma mais estável?"
imageryNote: >-
  O Imperador do Taro é imaginado como uma figura sentada a uma mesa de pedra sólida encravada numa encosta, com um mapa, uma régua de medir e uma lamparina dispostos em ordem cuidadosa. Muros de pedra seca atravessando os campos ao fundo mostram limites construídos à mão, pedra por pedra. Um carneiro pastando por perto pode remeter a Áries e ao impulso de começar. Tons de vermelho quente sugerem vitalidade, e um pequeno portão deixado aberto em um dos muros indica que estruturas firmes ainda podem deixar as pessoas passarem.
