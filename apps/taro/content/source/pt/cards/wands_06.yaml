meaningUpright: |-
  O Seis de Paus é uma carta de reconhecimento. Depois do atrito do Cinco, alguém avança a cavalo com uma coroa de folhas no bastão, e as pessoas pelo caminho parecem aplaudir. Ela captura o momento em que o esforço se torna visível e os outros o reconhecem.
  Isso pode aparecer como um bom retorno sobre um trabalho em que você se dedicou de corpo e alma, uma pessoa amiga dizendo que admira o jeito como você lidou com algo, ou a conclusão de um desafio que você já duvidou que conseguiria enfrentar. Também pode ser um tipo mais silencioso de confiança: a postura um pouco mais ereta de quem sabe que fez um bom trabalho.
  Esta carta convida você a aceitar a valorização sem deixá-la de lado. O reconhecimento pode dar energia e coragem para o próximo passo. Ao mesmo tempo, a figura está cercada de gente, o que lembra que poucas conquistas são inteiramente individuais. Você pode aproveitar o momento e também considerar quem apoiou você, e como poderia dividir parte do mérito.
meaningReversed: |-
  Invertido, o Seis de Paus pode refletir um esforço que passou despercebido, ou elogios que não chegam bem até você. Você pode ter conquistado algo e ainda sentir que aquilo não conta até que outra pessoa diga. Ele também pode apontar para o cansaço de encenar uma confiança que você não sente por inteiro.
  Às vezes esta carta invertida descreve um sucesso discreto, significativo para você, ainda que não seja visível para os outros. Esse tipo de progresso também importa.
  Este pode ser um momento de olhar o quanto da sua noção de valor depende de aplausos. Como seria reconhecer o seu próprio esforço primeiro? Você pode anotar aquilo de que se orgulha, incluindo as partes que ninguém viu, e deixar que isso seja uma fonte de incentivo mais firme do que a aprovação de fora.
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, esta carta pode refletir uma valorização que corre nos dois sentidos: o orgulho por alguém próximo, ou a sensação de receber o olhar e o apoio dessa pessoa. Ela pode convidar vocês a celebrar em voz alta as conquistas um do outro. Você pode contar a alguém próximo algo que admira nessa pessoa, e se permitir receber o incentivo dela em troca.
  relationshipsReversed: >-
    Com a carta invertida, você pode sentir que os seus esforços num relacionamento passam despercebidos, ou que o reconhecimento virou uma competição silenciosa. Você pode considerar dizer com clareza que tipo de valorização importa para você, e perguntar o mesmo à outra pessoa. Agradecimentos pequenos e específicos muitas vezes mudam o clima mais do que grandes gestos.
  workUpright: >-
    No trabalho ou nos estudos, o Seis de Paus pode apontar para resultados visíveis: um retorno positivo, um projeto bem recebido, um momento de apresentar o que você fez. Você pode usar essa confiança para compartilhar as suas ideias com mais abertura, dando também o crédito às pessoas que contribuíram. Um reconhecimento dividido com generosidade tende a fortalecer as equipes.
  workReversed: >-
    Com a carta invertida, as suas contribuições podem parecer ignoradas, ou o sucesso pode depender demais de como as coisas parecem de fora. Você pode tornar o seu trabalho mais visível de um jeito calmo e objetivo, como um breve resumo do que entregou, e também refletir sobre quais resultados importam para você, independentemente de quem os note.
  growthUpright: >-
    No crescimento pessoal, esta carta convida você a se permitir sentir orgulho. Reconhecer o seu progresso pode construir uma confiança que acompanha você no próximo desafio. Você pode manter uma pequena lista de coisas com que lidou bem recentemente, para reler nos dias em que a confiança parecer mais fraca.
  growthReversed: >-
    Com a carta invertida, a insegurança ou a necessidade de aprovação podem estar apagando a sua sensação de conquista. Você pode explorar de onde veio a sua ideia de sucesso e se ela ainda combina com você. Definir sucesso com as suas próprias palavras pode fazer do reconhecimento dos outros um extra agradável, e não algo de que você depende.
reflectionQuestions:
  - >-
    O que você conquistou recentemente e ainda não reconheceu por inteiro?
  - >-
    Quem ajudou você pelo caminho, e como você poderia dividir o mérito com essa pessoa?
  - "Como seria o sucesso se ninguém mais estivesse olhando?"
imageryNote: >-
  Uma figura a cavalo, sobre um animal calmo, atravessa uma pequena multidão segurando um bastão coroado com uma guirlanda de folhas. Outros bastões erguidos ladeiam o caminho como uma guarda de honra. A guirlanda representa o reconhecimento conquistado com esforço; o cavalo tranquilo, uma confiança que foi treinada, não apressada; e as figuras ao redor, a comunidade que compartilha e apoia a conquista.
