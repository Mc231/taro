imageryNote: >-
  A Temperança do Taro é imaginada como uma figura alada à beira de um rio lento, passando com cuidado um líquido entre dois recipientes diferentes, um de barro e outro de vidro. O fio de água entre eles faz uma curva suave, como se o equilíbrio estivesse sendo encontrado ali, ao vivo. Pedras de travessia cruzando o rio sugerem um caminho do meio de uma margem à outra, e cores suaves de amanhecer sobre colinas distantes mantêm o clima calmo e esperançoso.
