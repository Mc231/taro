shortUpright: >-
  Uma mistura mais lenta e mais estável do que faz bem a você pode trazer mais leveza do que qualquer extremo.
shortReversed: >-
  Algo pode estar pendendo demais para um lado. Esta carta convida você a notar e reequilibrar com calma.
meaningUpright: |-
  A Temperança é a carta de misturar as coisas na medida certa. A sua imagem costuma mostrar água sendo passada de um recipiente para outro, com cuidado, para que pouco se derrame. A habilidade não está em escolher uma coisa no lugar de outra, e sim em misturá-las: trabalho e descanso, ação e paciência, o que você quer agora e o que vai querer depois.
  No dia a dia, esta carta pode refletir encontrar um ritmo que funciona, como uma agenda com espaço suficiente, um meio-termo que respeita as duas pessoas, ou um hábito ajustado aos poucos até ficar bom. Ela pode apontar para a satisfação tranquila da moderação, menos empolgante que os extremos, mas muitas vezes mais sustentável.
  Esta carta convida você a considerar onde a sua vida ganharia com um pouco mais de equilíbrio. Você pode se perguntar quais partes parecem cheias demais e quais parecem esquecidas, e que pequenos ajustes poderiam aproximá-las. A Temperança destaca a paciência: boas misturas levam tempo, e experimentar com calma pode ensinar mais do que qualquer reforma repentina.
meaningReversed: |-
  Invertida, a Temperança pode refletir uma sensação de desequilíbrio. Você pode estar colocando demais numa área da vida, como o trabalho, um relacionamento ou uma preocupação, enquanto outra seca. Ou pode notar um vaivém entre extremos: tudo ou nada, agitação ou exaustão, rigidez ou descuido.
  Esta carta também pode apontar para a impaciência com um processo que leva tempo, e para a tentação de forçar resultados no lugar de deixar que se misturem.
  Talvez valha fazer um inventário simples. Onde você está exagerando, e onde está fazendo de menos? Escolher um ajuste suave, e não uma solução drástica, pode ajudar você a se reajustar. O equilíbrio não é um lugar aonde se chega de uma vez; é algo a que você volta, de novo e de novo, com pequenas correções.
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, a Temperança pode refletir uma harmonia construída por meio de acordos e compreensão. Ela pode convidar você a encontrar alguém no meio do caminho, a misturar estilos e necessidades diferentes e a ter paciência enquanto vocês aprendem o ritmo um do outro. Um cuidado calmo e constante pode fazer um vínculo parecer leve de viver.
  relationshipsReversed: >-
    Invertida, esta carta pode apontar para um relacionamento em que as necessidades de uma pessoa dominam, ou em que os conflitos esquentam rápido. Você pode considerar como baixar a intensidade: desacelerar as conversas, fazer pausas quando os ânimos se exaltam e buscar o ponto em comum entre o que cada um quer.
  workUpright: >-
    No trabalho ou em um projeto, a Temperança destaca o progresso constante e a boa colaboração. Ela pode refletir a combinação de habilidades ou ideias diferentes em algo que funciona bem, ou um ritmo dosado para que a energia dure. Você pode buscar a versão do plano que é ambiciosa e, ainda assim, sustentável.
  workReversed: >-
    Invertida, a Temperança pode refletir excesso de trabalho, decisões apressadas ou atrito entre pessoas com abordagens diferentes. Você pode se perguntar onde o ritmo ficou irreal e o que poderia ser simplificado. Encontrar um caminho do meio entre prioridades que competem pode reduzir o estresse de todos os envolvidos. Até uma tarde sem reuniões pode mostrar como é um ritmo mais estável.
  growthUpright: >-
    No crescimento pessoal, esta carta convida você a praticar a moderação sem rigidez. Você pode notar os seus próprios pontos de equilíbrio: quanto descanso, atividade, tempo a sós e tempo com outras pessoas ajudam você a se sentir em equilíbrio. Ajustes pequenos e constantes podem trazer mais leveza do que grandes resoluções.
  growthReversed: >-
    Invertida, a Temperança pode perguntar se você tem vivido nos extremos. Ela pode refletir a vontade de desacelerar, descansar ou trazer de volta um ingrediente que anda faltando nos seus dias. Você pode escolher uma área para reequilibrar com calma, e se dar tempo para ver como ela se acomoda.
