imageryNote: >-
  Uma figura está sentada à vontade num assento amplo, numa clareira ensolarada, com um bastão cheio de folhas apoiado numa mão e a outra aberta em direção a quem olha. Uma lareira brilha ao lado, e um animal de companhia atento descansa por perto. A lareira sugere o calor oferecido aos outros; a mão aberta, a generosidade; e a postura relaxada, uma confiança que não tem nada a provar. Dourados e âmbares quentes podem ecoar o fogo no seu estado mais assentado e radiante.
