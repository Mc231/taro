meaningUpright: |-
  A Rainha de Paus encarna um fogo que se tornou estável e radiante. Sentada à vontade ao lado de uma lareira acesa, com um bastão cheio de folhas na mão, esta figura tem confiança sem ter nada a provar. A energia aqui é calorosa, magnética e generosa: alguém capaz de iluminar um ambiente e ainda assim manter o próprio centro.
  Você pode reconhecer essa qualidade em você quando fala com desenvoltura, recebe as pessoas com um calor genuíno, ou segue um projeto criativo com paixão e senso prático ao mesmo tempo. Ela também pode descrever alguém na sua vida cuja confiança incentiva os outros a brilhar.
  Esta carta convida você a assumir os seus dons. A confiança não tem de ser barulhenta; pode ser a sensação tranquila de que você tem algo que vale a pena oferecer. Você pode notar onde costuma se encolher e experimentar ocupar um pouco mais de espaço. Compartilhar o seu calor, o seu entusiasmo e as suas ideias pode ser um presente para você e para as pessoas ao seu redor.
meaningReversed: |-
  Invertida, a Rainha de Paus pode refletir uma chama que diminuiu. Você pode estar duvidando de si, com cansaço de ser sempre quem traz a energia, ou contendo a sua vitalidade para evitar atenção.
  Às vezes a Rainha invertida aponta para o fogo usado de formas menos generosas: comparação, inveja ou a vontade de controlar os holofotes. Isso muitas vezes nasce da sensação de invisibilidade.
  Este pode ser um momento de cuidar do seu próprio fogo. O que vem drenando a sua confiança, e o que costumava renová-la? Você pode voltar a uma atividade que traz vida a você, passar tempo com pessoas que valorizam você, ou descansar sem culpa. A confiança muitas vezes volta aos poucos, à medida que você se reconecta com o que importa para você, e não com a sua aparência.
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, esta carta pode refletir calor, abertura e um forte senso de si dentro de um vínculo. Você pode levar energia e incentivo às pessoas de quem gosta, sem deixar de lado as suas próprias necessidades. Essa qualidade pode tornar os relacionamentos vivos e honestos, com espaço para que cada pessoa brilhe.
  relationshipsReversed: >-
    Com a carta invertida, você pode sentir que fica à sombra de alguém, que falta valorização, ou ter vontade de se comparar com os outros. Você pode considerar se tem dado calor sem receber. Dizer o que você quer, e reconhecer o seu próprio valor antes de esperar que os outros o façam, pode ajudar a restaurar o equilíbrio num vínculo próximo.
  workUpright: >-
    No trabalho ou em projetos criativos, a Rainha de Paus pode apontar para uma liderança confiante e um dom para inspirar os outros. Você pode assumir de forma visível um projeto, compartilhar as suas ideias com convicção e criar um ambiente em que os colegas sintam energia. O seu entusiasmo pode ser um recurso prático, não só um estado de espírito.
  workReversed: >-
    Com a carta invertida, você pode estar com a atenção dividida entre papéis demais ou duvidando das suas capacidades depois de um contratempo. Você pode identificar as tarefas que realmente usam os seus pontos fortes e proteger tempo para elas. Abrir mão da necessidade de estar em todo lugar ao mesmo tempo pode ajudar a sua confiança natural a voltar.
  growthUpright: >-
    O seu calor tem efeito sobre os outros, e esta carta pede que você assuma isso. O que traz a você mais vitalidade e segurança? Você pode notar os ambientes em que sente confiança e levar um pouco dessa energia para as áreas em que costuma se conter.
  growthReversed: >-
    Com a carta invertida, você pode explorar onde a insegurança ou a comparação estão ocupando espaço nos seus pensamentos. Pode ajudar notar o seu próprio progresso e as suas qualidades sem medi-los pelos de outra pessoa. Descansar e brincar são dois jeitos de reacender um fogo que ficou baixo.
reflectionQuestions:
