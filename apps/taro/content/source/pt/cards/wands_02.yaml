shortUpright: >-
  Você está na borda do que conhece, olhando para fora; é um bom momento para esboçar aonde talvez queira ir.
shortReversed: >-
  O conforto e a cautela podem estar deixando um plano maior na gaveta; vale olhar de novo para o que segura você ali.
meaningUpright: |-
  O Dois de Paus segue a primeira faísca com uma pausa para enxergar mais longe. A ideia já não é só um sentimento; agora você está num ponto um pouco mais alto, olhando a paisagem e imaginando até onde ela pode chegar. Um bastão já está fincado atrás de você, sinal do que você construiu, enquanto o outro está na sua mão, pronto para ser levado a algum lugar novo.
  Esta carta costuma aparecer quando você está pesando um passo maior: fazer um curso em outra cidade, remodelar uma função, começar um projeto que pede mais de você do que a rotina de sempre. Ela também pode refletir aquela inquietação de quem já ficou maior do que um espaço, mas ainda tem carinho por ele.
  O convite aqui é planejar com ambição e com honestidade ao mesmo tempo. Você pode anotar o que espera, quanto isso custaria em tempo e energia, e qual primeiro movimento é pequeno o bastante para tentar. Olhar longe é útil; escolher o próximo passo que você consegue de fato dar também é.
meaningReversed: |-
  Invertido, o Dois de Paus pode refletir um plano que fica só no papel. Você pode continuar olhando o horizonte sem fazer as malas, porque o conhecido parece mais seguro ou porque o destino ainda está nebuloso. Às vezes a hesitação é sábia, e às vezes é só hábito.
  Esta carta também pode apontar para planos feitos em busca da aprovação de outras pessoas, ou para uma visão que já não combina com quem você está se tornando. Quando um objetivo parece pesado no lugar de empolgante, pode valer a pena perguntar se ele ainda é seu.
  Você pode revisitar o seu mapa com outros olhos. Como seria uma versão menor e mais pessoal deste plano? Qual medo fala mais alto, e ele tem a ver com o passo em si ou com o que os outros podem pensar? Dar nome a ele pode fazer o próximo movimento parecer menos um salto e mais uma escolha.
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, esta carta pode convidar a uma conversa sobre o futuro que cada pessoa está imaginando: onde quer morar, como quer passar o tempo, o que espera explorar. Ela pode refletir um vínculo que funciona como uma base segura a partir da qual cada um tem liberdade para olhar para fora. Você pode perguntar a alguém próximo para qual horizonte essa pessoa anda olhando.
  relationshipsReversed: >-
    Com a carta invertida, você ou alguém próximo pode estar guardando um desejo de mudança porque parece arriscado dizê-lo em voz alta. Os planos podem se afastar em silêncio quando nunca são compartilhados. Este pode ser um momento de falar sobre esperanças mantidas em segredo, escutando tanto quanto falando, para que ninguém planeje sem companhia.
  workUpright: >-
    No trabalho, o Dois de Paus pode apontar para o pensamento estratégico: mapear a próxima etapa de um projeto, considerar uma nova área ou dar forma a um objetivo de longo prazo. Você pode passar um tempo olhando o quadro geral antes de mergulhar de novo nas tarefas diárias, e depois escolher uma ação concreta que tire o plano do quadro branco e o coloque em movimento.
  workReversed: >-
    Com a carta invertida, um plano no trabalho pode estar preso entre o conforto e a ambição, ou moldado mais pelo que parece esperado do que pelo que você quer. Você pode conferir se o objetivo ainda motiva você. Se motiva, dividi-lo num primeiro pequeno experimento pode ajudar; se não motiva, redesenhar o plano também é um caminho válido.
  growthUpright: >-
    No crescimento pessoal, esta carta convida você a levar as suas próprias ambições a sério. O que você exploraria se se desse permissão para pensar além dos seus limites de sempre? Você pode esboçar um retrato aproximado do próximo ano ou dois, não como uma promessa fixa, mas como uma direção que ajuda você a notar oportunidades quando elas aparecem.
  growthReversed: >-
    Com a carta invertida, o desejo de segurança e o desejo de crescer podem estar puxando para lados diferentes. As duas são necessidades reais. Você pode explorar o que faria um novo passo parecer seguro o bastante para tentar, e que tipo de apoio, prática ou informação poderia transformar uma ideia distante em algo de que você consegue se aproximar aos poucos.
reflectionQuestions:
