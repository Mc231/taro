imageryNote: >-
  Uma figura está de pé sobre um muro alto ou uma saliência, com um bastão fincado firme ao lado e um segundo seguro com leveza na mão, olhando para uma terra ou um mar distante. Um pequeno globo, um mapa ou uma bússola descansa por perto. O bastão fincado representa o que já foi construído; o erguido, a escolha de ir mais longe. A vista ampla convida quem olha a imaginar muitos caminhos possíveis, e não uma única rota definida.
