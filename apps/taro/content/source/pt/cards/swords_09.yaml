    Invertida, esta carta pode refletir o aprendizado de que pensamentos nem sempre são fatos. Você pode notar o momento em que uma preocupação começa e, com delicadeza, chamá-la de preocupação. Com o tempo, essa pequena pausa pode criar espaço entre você e o medo. Buscar apoio faz parte desse crescimento, não é sinal de fraqueza.
