    Invertida, esta carta pode sugerir a pressão diminuindo no trabalho, ou a escolha de finalmente falar com alguém sobre uma carga que parece pesada demais. Você pode pedir clareza onde a incerteza está alimentando a sua preocupação. Dizer uma preocupação a um colega ou a uma liderança pode transformar um peso privado num problema compartilhado, com opções práticas.
  growthUpright: >-
