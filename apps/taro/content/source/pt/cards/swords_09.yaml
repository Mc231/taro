  workUpright: >-
    No trabalho, esta carta pode refletir um estresse que segue você até em casa: um prazo que tira o sono, o medo de errar ou a preocupação com como os seus esforços são vistos. Você pode anotar o primeiro passo de amanhã antes de encerrar o dia, para que a sua mente tenha permissão para descansar. Dividir grandes preocupações em pequenas tarefas pode torná-las mais administráveis.
