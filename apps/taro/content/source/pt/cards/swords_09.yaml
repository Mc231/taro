imageryNote: >-
  A arte original mostra uma figura sentada na cama, com os joelhos junto ao corpo, num quarto escuro iluminado apenas por uma fresta fina de luar na janela. Nove lâminas estão penduradas em fileiras arrumadas na parede atrás, sem nunca tocar a figura. Um cobertor dobrado e uma pequena luminária esperam por perto, apagados. As fileiras de lâminas sugerem pensamentos em círculo, enquanto a luminária e a janela indicam que o conforto e a manhã estão ao alcance da mão.
