imageryNote: >-
  Uma figura está de pé no alto de uma colina ou de um penhasco, parcialmente de costas, com três bastões fincados ao redor como marcos de esforço, observando barcos ou viajantes que atravessam águas abertas ou planícies lá embaixo. Uma luz de manhã cedo pode sugerir o começo de uma nova etapa. O movimento distante representa planos já em andamento, e a postura firme, uma confiança paciente enquanto os resultados ainda estão a caminho.
