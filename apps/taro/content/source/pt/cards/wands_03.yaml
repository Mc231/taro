shortUpright: >-
  Algo que você colocou em movimento está começando a viajar; dá para observar o que volta e se preparar para a próxima etapa.
shortReversed: >-
  O progresso pode parecer mais lento do que você esperava; talvez seja hora de ajustar expectativas, não de desistir.
meaningUpright: |-
  Se o Dois de Paus falava de planejar, o Três de Paus mostra planos já em movimento. Os navios já saíram do porto, por assim dizer: mensagens enviadas, inscrições feitas, primeiros passos dados. Agora vem um período de observar o horizonte enquanto as coisas se desenrolam fora do seu controle direto.
  Esta carta pode refletir a sensação gostosa dos primeiros avanços, como um projeto ganhando os primeiros apoiadores, um hábito novo se firmando ou uma colaboração chegando mais longe do que você esperava. Ela também pode destacar o valor da preparação: você fez base suficiente para poder dar um passo atrás e olhar mais adiante.
  O convite é sustentar duas coisas ao mesmo tempo: confiança no que você começou e abertura para o jeito como isso se desenvolve. Você pode notar onde os seus esforços estão começando a se conectar com outras pessoas, e considerar o que a próxima etapa pode pedir de você. A expansão muitas vezes pede novas habilidades, novas parcerias ou uma visão um pouco maior do que você está construindo.
meaningReversed: |-
  Invertido, o Três de Paus pode refletir uma espera que virou inquietação. Você pode ter feito o trabalho e ainda ver pouco retorno, ou os resultados podem parecer diferentes do que você imaginou. É fácil ler a lentidão como fracasso, mesmo quando as coisas estão apenas levando o seu tempo.
  Às vezes esta carta também aponta para uma visão estreita: focar num único resultado e não ver os pequenos sinais de movimento ao redor, ou planejar tão longe que o presente parece vazio.
  Este pode ser um bom momento para olhar as suas expectativas. Os seus prazos eram realistas? Há alguma informação faltando, ou alguém a quem você ainda não pediu ajuda? Você pode ajustar o plano sem abandoná-lo, e reparar no progresso que já aconteceu em silêncio.
aspects:
  relationshipsUpright: >-
    Nos vínculos próximos, esta carta pode refletir uma conexão que está crescendo além do primeiro capítulo, com mais confiança, novos planos em comum ou abertura para incluir outras pessoas. Ela pode convidar você a valorizar o caminho que vocês já percorreram juntos e a conversar sobre aonde gostariam de ir, deixando espaço para o horizonte de cada um.
  relationshipsReversed: >-
    Com a carta invertida, você pode sentir que está esperando que alguém venha ao seu encontro no meio do caminho, ou que um relacionamento não está se desenvolvendo no ritmo que você esperava. Pode ajudar falar abertamente das suas expectativas, no lugar de medir o progresso em silêncio. Você também pode perguntar o que a outra pessoa espera, já que os ritmos de vocês podem simplesmente ser diferentes.
  workUpright: >-
    No trabalho ou nos estudos, o Três de Paus pode apontar para projetos ganhando alcance: um lançamento, uma divulgação, uma colaboração entre equipes ou lugares. Você pode considerar como apoiar esse impulso, talvez dando retorno às pessoas, ampliando a sua rede ou se preparando para a próxima fase antes que ela chegue, para que o seu próprio progresso não pegue você de surpresa.
  workReversed: >-
    Com a carta invertida, os resultados podem demorar a aparecer, ou um plano pode ter encontrado atrasos que você não podia controlar. No lugar de forçar mais na mesma direção, você pode rever o que aprendeu até aqui e ajustar a rota. Conversar com as pessoas envolvidas pode revelar obstáculos, ou sucessos discretos, que são fáceis de perder de vista de onde você está.
  growthUpright: >-
    Confiar no esforço que você já fez é um tipo silencioso de crescimento. O crescimento muitas vezes continua fora da vista depois dos primeiros passos. Você pode olhar para onde começou alguns meses atrás e notar o que mudou, e então escolher o que gostaria de explorar a seguir com esse olhar mais amplo.
  growthReversed: >-
    Com a carta invertida, a impaciência consigo pode estar embaçando a sua visão de um progresso real. Você pode explorar onde espera uma mudança instantânea e onde um ritmo mais lento seria mais gentil. Manter um registro simples dos pequenos passos pode tornar o crescimento mais fácil de ver quando o horizonte ainda parece vazio.
