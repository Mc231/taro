imageryNote: >-
  A arte pode se concentrar numa única moeda ou disco estendido por uma mão aberta, diante de uma terra cultivada: o portão de um jardim, cercas vivas baixas, um caminho em direção às colinas. A moeda representa algo concreto e possível, enquanto o portão sugere a entrada para um espaço que ainda pede cuidado. Verdes suaves e tons quentes de terra podem reforçar a paciência, o crescimento e o valor silencioso do que dá para segurar.
