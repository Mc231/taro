imageryNote: >-
  A Torre do Taro é imaginada como uma torre de pedra alta e estreita no alto de um pico rochoso, com o topo arrancado por um raio de luz repentino vindo de um céu de tempestade. Faíscas ou pequenas chamas se espalham como sementes ao vento, sugerindo que o que é liberado pode trazer novos começos. A cena é desenhada como um momento de iluminação, clara contra nuvens escuras, mantendo o foco na limpeza e na compreensão, e não em dano a alguém.
