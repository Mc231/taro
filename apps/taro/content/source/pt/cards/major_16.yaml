meaningUpright: |-
  A Torre é a carta da mudança repentina. Uma estrutura que parecia sólida é sacudida, e o que estava escondido aparece. Isso pode inquietar, mas esta carta fala menos de desastre e mais de limpeza: o momento em que algo que não funcionava de verdade não pode mais ser ignorado. O que cai costuma ser o que foi construído sobre suposições, e não sobre chão firme.
  No dia a dia, esta carta pode refletir uma notícia inesperada que muda os seus planos, uma percepção que vira de cabeça para baixo o seu olhar sobre uma situação, ou um momento em que uma velha história que você contava para si deixa de fazer sentido. Ela pode trazer um lampejo de clareza, desconfortável mas útil, e a sensação de que as coisas não vão voltar a ser como eram.
  Esta carta convida você a considerar o que uma sacudida pode estar mostrando. Você pode se perguntar quais crenças ou arranjos estavam apoiados em bases instáveis, e como seria uma estrutura mais sólida. A Torre destaca que, depois de uma limpeza, há espaço para reconstruir de um jeito que reflita o que você sabe agora.
meaningReversed: |-
  Invertida, a Torre pode refletir uma mudança que acontece mais devagar, como um desmanche gradual, e não como um tranco repentino. Você pode sentir que algo pede uma mudança e, ainda assim, continuar escorando aquilo, na esperança de evitar uma ruptura maior.
  Esta carta também pode apontar para o período depois de uma grande reviravolta, quando a poeira está baixando e o trabalho de reconstruir começa. Essa etapa pode ser mais silenciosa e mais reflexiva do que o momento da mudança em si.
  Talvez valha perguntar o que você está segurando que talvez esteja pronto para ser redesenhado. Você poderia fazer uma mudança pequena e deliberada agora, no lugar de esperar que as circunstâncias forcem uma maior? Se você já está reconstruindo, o que gostaria de manter de antes, e o que gostaria de fazer de outro jeito desta vez?
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, a Torre pode refletir um momento repentino de honestidade, como uma conversa evitada por muito tempo que finalmente acontece, ou uma suposição sobre alguém que cai por terra. Isso pode inquietar, mas também pode limpar o ar. Você pode considerar o que essa nova clareza torna possível, e que apoio você e as outras pessoas querem para recuperar o equilíbrio.
  relationshipsReversed: >-
    Invertida, esta carta pode apontar para uma tensão que vem crescendo em silêncio, ou para evitar uma verdade difícil para manter a paz. Você pode considerar se dar nome a algo com gentileza agora poderia evitar uma ruptura maior depois. Ela também pode refletir um vínculo sendo reconstruído sobre uma base mais honesta depois de um período difícil.
  workUpright: >-
    No trabalho ou em um projeto, a Torre destaca mudanças inesperadas: uma alteração nos planos, nas estruturas ou nas prioridades que pede adaptação. Ela também pode refletir uma ideia inovadora que sacode o jeito habitual de fazer as coisas. Você pode concentrar a atenção no que está ao seu alcance e no espaço que a mudança abre.
  workReversed: >-
    Invertida, a Torre pode refletir um projeto ou sistema que todos sabem que é frágil, mas que ninguém enfrenta. Você pode se perguntar se uma mudança planejada e gradual não seria mais gentil do que esperar. Ela também pode apontar para a reconstrução depois de uma ruptura, com a oportunidade de criar algo mais sólido.
  growthUpright: >-
    No crescimento pessoal, esta carta convida você a soltar crenças que já não se sustentam. Uma percepção repentina pode desorientar, mas muitas vezes marca um avanço real. Você pode anotar o que agora vê de outro jeito, e como gostaria que esse novo entendimento moldasse as suas escolhas.
  growthReversed: >-
    Invertida, a Torre pode perguntar se você está resistindo a uma mudança interior que já está em andamento. Ela pode refletir uma queda suave e gradual de velhas defesas. Você pode se permitir sentir essa instabilidade por um tempo, e ter paciência enquanto reconstrói sobre um chão mais firme.
