imageryNote: >-
  Uma figura jovem está de pé numa paisagem aberta, segurando um bastão na vertical e olhando com fascínio aberto para um broto novo que nasce da madeira. A roupa pode trazer pequenos motivos de chamas ou salamandras para remeter ao elemento fogo. O bastão que brota representa uma ideia viva e em crescimento; o olhar admirado, a curiosidade; e a terra aberta, as muitas direções que ainda esperam para ser exploradas.
