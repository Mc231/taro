meaningUpright: |-
  O Valete de Paus é o aprendiz entusiasmado do fogo. Segurando um bastão que brota e olhando para ele com fascínio, esta figura representa a curiosidade antes da experiência: a alegria de descobrir algo novo e querer saber mais.
  Essa energia pode aparecer como se inscrever num curso por impulso, ler tudo o que encontra sobre um novo interesse, ou contar aos amigos uma ideia que acabou de ter. Também pode ser uma mensagem ou um convite que abre a porta para algo desconhecido. Há um tom de brincadeira aqui, e a disposição de deixar que os outros vejam você tentando.
  Esta carta convida você a encarar a vida com a abertura de quem está começando. Não é necessário saber aonde um interesse leva para explorá-lo. Você pode se dar permissão para experimentar sem a pressão de acertar logo de cara, e notar como essa liberdade faz você se sentir. Às vezes as paixões mais duradouras começam como perguntas pequenas e brincalhonas.
meaningReversed: |-
  Invertido, o Valete de Paus pode refletir uma curiosidade que não tem onde pousar. Você pode pular de um interesse para outro, começando projetos com alegria e largando quando a novidade passa. Ou a curiosidade pode estar ali, mas contida pela preocupação de parecer inexperiente.
  Esta carta também pode descrever ideias que ainda estão se formando: faíscas que pedem mais tempo antes de estarem prontas para serem compartilhadas.
  Você pode explorar o que está por trás da inquietação ou da hesitação. É tédio, medo de compromisso, ou medo de ainda não estar à altura? Um caminho pode ser escolher um único interesse e definir para ele um objetivo pequeno e sem pressão. Outro é se permitir aproveitar a exploração sem que ela tenha de levar a algum lugar específico.
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, esta carta pode refletir uma curiosidade nova por alguém: vontade de saber mais sobre essa pessoa, experimentar coisas novas juntos ou compartilhar uma energia brincalhona. Ela também pode trazer leveza a um vínculo conhecido. Você pode fazer a alguém próximo uma pergunta que nunca fez, ou sugerir uma atividade que nenhum dos dois experimentou antes.
  relationshipsReversed: >-
    Com a carta invertida, a empolgação num relacionamento pode vir em ondas e passar rápido, ou você pode sentir timidez em mostrar entusiasmo. Você pode notar se está buscando novidade no lugar de profundidade. Deixar o seu interesse genuíno aparecer, mesmo em pequenos gestos, pode convidar a outra pessoa a responder com a mesma abertura.
  workUpright: >-
    No trabalho ou nos estudos, o Valete de Paus pode apontar para uma fase de aprendizado: uma nova habilidade, uma função nova ou uma ideia que você tem vontade de testar. O entusiasmo é um trunfo aqui. Você pode fazer perguntas à vontade, se oferecer para algo desconhecido e tratar os primeiros erros como parte do processo, e não como um veredito sobre a sua capacidade.
  workReversed: >-
    Com a carta invertida, você pode ter muitas ideias e pouca continuidade, ou não saber bem para onde direcionar a sua energia. Você pode escolher um projeto para levar um passo além do habitual. Conversar com um mentor ou colega também pode ajudar a transformar uma faísca dispersa numa direção mais clara.
  growthUpright: >-
    O Valete de Paus entrega a você uma tarefa simples: reencontrar a sua curiosidade. O que você amava explorar quando não havia pressão para conquistar nada? Você pode reservar um tempo para um experimento brincalhão nesta semana, e tratar o que descobrir como informação útil sobre o que dá energia a você.
  growthReversed: >-
    Com a carta invertida, a timidez ou uma mente inquieta podem estar impedindo você de ir mais fundo. Você pode explorar o que significaria ficar com um interesse um pouco mais de tempo do que parece natural, e se permitir ser visivelmente iniciante nele. A profundidade muitas vezes chega logo depois do momento em que você costumaria seguir adiante.
