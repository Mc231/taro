imageryNote: >-
  A arte pode mostrar uma figura no meio de um passo, mantendo duas moedas no ar, unidas por uma fita ou um cordão que faz uma curva sem fim. Atrás, água ondulando ou barcos subindo e descendo nas ondas podem ecoar o movimento constante da vida diária. O laço sugere continuidade e a natureza contínua do equilíbrio, enquanto a postura leve, quase de dança, indica que se ajustar pode ser feito com facilidade e até com um pouco de brincadeira.
