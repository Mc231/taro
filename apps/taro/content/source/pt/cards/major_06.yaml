shortUpright: >-
  Uma escolha feita com o coração e a cabeça juntos, em sintonia com o que você realmente valoriza.
shortReversed: >-
  Uma parte de você pode querer uma coisa, e outra parte, outra. Esta carta convida você a ouvir as duas antes de escolher.
meaningUpright: |-
  Os Enamorados costumam ser lidos como uma carta de romance, mas o seu tema mais profundo é o alinhamento: o encontro de duas partes, duas pessoas ou dois caminhos de um jeito que parece inteiro. A carta pergunta o que você mais valoriza, e se as escolhas à sua frente refletem isso. A conexão aqui é tanto com os outros quanto com você.
  No dia a dia, esta carta pode refletir um relacionamento em que há um olhar verdadeiro sobre quem você é, uma parceria de trabalho em que as ideias fluem com facilidade, ou uma decisão que pede que você diga com clareza o que importa para você. Ela pode apontar para o momento de escolher entre duas boas opções, quando não há uma resposta certa óbvia, apenas aquela que combina com quem você está se tornando.
  Esta carta convida você a considerar quanta honestidade existe na sua relação consigo e com os outros. Você pode se perguntar o que atrai você e por quê, e com o que você aceita se comprometer. Os Enamorados destacam que escolhas significativas raramente têm a ver com perfeição. Elas têm a ver com colocar o coração e o discernimento na mesma sala e deixar que conversem.
meaningReversed: |-
  Invertidos, os Enamorados podem refletir a sensação de uma divisão entre duas direções. O que você quer e o que acha que deveria querer podem não combinar, ou um vínculo próximo pode parecer um pouco desafinado, com cada pessoa valorizando coisas diferentes sem dizer isso.
  Esta carta também pode apontar para uma decisão que vive sendo adiada, talvez porque escolher uma opção significa abrir mão de outra. Evitar a escolha pode parecer mais fácil no curto prazo, enquanto drena energia em silêncio.
  Talvez valha anotar o que cada opção honestamente oferece e pede de você, e quais dos seus valores ela apoia. Pode ajudar notar onde você se sente mais você. O realinhamento muitas vezes começa com uma pequena admissão sincera, primeiro para você e depois, se fizer sentido, para outra pessoa.
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, os Enamorados podem refletir uma compreensão mútua profunda e a alegria de escolher um ao outro, seja no romance, na amizade ou na família. A carta pode convidar você a compartilhar o que realmente valoriza e a escutar o que a outra pessoa valoriza também. A proximidade cresce quando as duas pessoas podem ser honestas e ainda se sentir bem-vindas.
  relationshipsReversed: >-
    Invertida, esta carta pode apontar para uma distância entre as esperanças ou prioridades de duas pessoas, ou para sentimentos que ainda não foram ditos. Você pode considerar se está se adaptando demais para manter a paz, ou esperando que alguém adivinhe o que você quer. Uma conversa aberta e gentil sobre valores pode ajudar vocês dois a ver onde estão.
  workUpright: >-
    No trabalho ou em um projeto, os Enamorados destacam a colaboração e as escolhas enraizadas nos seus valores. A carta pode refletir uma parceria que traz à tona o melhor das duas pessoas, ou uma decisão sobre que direção seguir. Você pode se perguntar qual opção parece significativa, além de prática, e deixar que as duas coisas contem na sua escolha.
  workReversed: >-
    Invertidos, os Enamorados podem refletir atrito em uma parceria ou a sensação de que o seu trabalho não combina com aquilo que importa para você. A carta também pode apontar para uma hesitação diante de uma escolha entre dois caminhos. Você pode listar o que cada caminho pediria de você, e notar a qual deles você tem mais vontade de dar isso.
  growthUpright: >-
    Conhecer os seus valores com mais clareza é o trabalho interior para o qual esta carta aponta. Quando você entende o que importa, as escolhas passam a ser menos sobre agradar aos outros e mais sobre se manter fiel a si. Você pode anotar três valores e notar onde eles já guiam os seus dias.
  growthReversed: >-
    Invertidos, os Enamorados podem refletir um conflito interior: uma parte de você querendo mudança, outra querendo conforto. Nenhuma das partes está errada. Você pode dar voz a cada uma, no papel ou numa conversa, e ver se existe uma escolha que respeite as duas, mesmo que só em parte.
reflectionQuestions:
  - "Qual dos seus valores parece mais importante honrar agora?"
  - >-
    Em que relacionamento próximo caberia um pouco mais de honestidade sobre o que você quer?
  - >-
    Que escolha você vem adiando, e o que ajudaria você a fazê-la?
imageryNote: >-
  Os Enamorados do Taro são imaginados como duas figuras de pé, uma de cada lado de um riacho estreito, estendendo as mãos para se dar as mãos por cima dele, desenhadas de modo que qualquer pessoa possa se ver em qualquer uma delas. Acima, dois pássaros voam em círculo no mesmo céu claro. Numa margem cresce uma árvore frutífera e na outra uma trepadeira em flor, dois presentes diferentes que se encontram no meio. O riacho sugere a escolha e o esforço que uma conexão real pede das duas pessoas.
