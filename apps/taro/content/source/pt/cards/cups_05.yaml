    O luto e o arrependimento merecem um lugar na sua história, e esta carta pergunta como dar a eles esse lugar sem deixar que escrevam o resto dela. Você pode praticar notar quando a sua atenção volta, de novo e de novo, para o que deu errado. Ampliar o olhar com delicadeza, nem que seja por alguns minutos por dia, pode facilitar ver o quadro inteiro.
