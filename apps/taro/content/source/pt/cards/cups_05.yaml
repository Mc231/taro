imageryNote: >-
  A arte mostra uma figura de manto, com a cabeça baixa sobre três cálices tombados, cujo conteúdo se infiltra no chão. Atrás da figura, dois cálices continuam de pé, fáceis de não ver. Um caminho ou uma travessia ao longe pode sugerir um jeito de seguir quando chegar a hora. Tons frios e contidos expressam o luto, enquanto uma linha fina de luz sobre os cálices de pé indica que nem tudo se foi.
