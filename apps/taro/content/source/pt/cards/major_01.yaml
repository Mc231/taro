shortUpright: >-
  Talvez você já tenha mais do que imagina para o que quer; esta carta pergunta o que você quer criar com isso.
shortReversed: >-
  Suas ferramentas estão sobre a mesa, mas sua atenção pode estar em outro lugar. O que ajudaria a reuni-la?
meaningUpright: |-
  O Mago é a carta de transformar uma ideia em algo real. Enquanto o Louco parte sem nada planejado, o Mago para, olha o que está ao seu alcance e decide usar. A imagem tradicional, com uma mão erguida e a outra apontando para baixo, sugere uma ponte entre intenção e ação, entre o que você imagina e o que de fato consegue fazer hoje.
  No dia a dia, esta carta pode refletir o momento em que um plano finalmente ganha uma data, um tempo reservado, um primeiro rascunho. Ela pode apontar para habilidades que você costuma deixar de lado porque vêm com facilidade: um talento para explicar as coisas, para resolver pequenos problemas, para aproximar pessoas. Desenvoltura aqui significa perceber que as peças já estão sobre a mesa.
  Esta carta convida você a considerar para onde vai a sua atenção. O foco é um tipo de ofício; dá para praticar. Você pode se perguntar que coisa gostaria de trazer ao mundo, e quais das ferramentas que você já tem poderiam aproximá-la um passo. O Mago não promete resultados. Ele destaca a força de aparecer com intenção e usar o que você tem.
meaningReversed: |-
  Invertido, o Mago pode refletir uma capacidade que está presente, mas ainda não está em uso. Você pode ter as habilidades e as ideias e, mesmo assim, sentir a energia escapando em direções demais, ou duvidar de que a sua contribuição conta. A mesa está posta; as mãos é que ainda não se movem.
  Esta carta também pode apontar para uma esperteza que saiu um pouco do eixo: usar o charme ou a conversa rápida para pular a parte do trabalho que parece chata, ou mostrar uma superfície confiante enquanto, por dentro, há insegurança. Nenhuma das duas coisas é uma falha moral. As duas podem ser sinais de que intenção e ação se afastaram.
  Talvez valha olhar para onde o seu foco está se dividindo. Escolher uma tarefa pequena e concreta e terminá-la pode reconstruir a confiança nas suas próprias mãos. Também pode ajudar perguntar o que você faria de outro jeito se ninguém estivesse olhando.
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, o Mago pode refletir a força de uma comunicação clara e direta. Ele pode convidar você a dizer o que pensa e a agir de um jeito que combine com as suas palavras. Você pode notar o quanto consegue moldar o tom de uma conexão com gestos pequenos e intencionais: uma mensagem atenciosa, um plano cumprido, uma atenção dada sem distração.
  relationshipsReversed: >-
    Invertida, esta carta pode perguntar se palavras e ações estão alinhadas em um vínculo próximo, as suas ou as da outra pessoa. Ela também pode refletir o hábito de guardar o que você realmente pensa, ou de encenar uma versão sua que você acredita que vai agradar. Você pode considerar o que mudaria se deixasse alguém ver as suas intenções reais, mesmo as incertas.
  workUpright: >-
    No trabalho ou em um projeto, o Mago aponta para a habilidade encontrando a oportunidade. Ele pode convidar você a fazer um balanço das suas capacidades, contatos e recursos, e a direcioná-los para um objetivo claro. É uma carta de começar, apresentar uma ideia, montar um protótipo ou finalmente escrever a proposta. Aqui, foco e constância contam mais do que ter todas as respostas de antemão.
  workReversed: >-
    Invertido, o Mago pode refletir um talento pouco aproveitado, ou um esforço tão espalhado que nada chega a acontecer. Ele também pode apontar para a tentação de prometer demais ou de cortar caminho. Você pode se perguntar qual tarefa de fato merece a sua energia agora, e como seria um trabalho honesto e constante nela nos próximos dias.
  growthUpright: >-
    No crescimento pessoal, esta carta convida você a reconhecer a sua própria capacidade de agir. Você pode listar as habilidades, os hábitos e os apoios que já tem, e notar como eles poderiam servir a algo que importa para você. Prática, repetição e intenção clara são as ferramentas discretas do Mago; pequenas escolhas diárias podem se somar e virar uma mudança real.
  growthReversed: >-
    Invertido, o Mago pode refletir uma distância entre quem você sabe que poderia ser e os hábitos que está vivendo. Ele pode perguntar onde a insegurança está fazendo você esperar por uma permissão. Você pode escolher uma habilidade para praticar abertamente, mesmo de forma imperfeita, e notar como a confiança cresce ao fazer, e não ao esperar se sentir à altura.
reflectionQuestions:
  - "Quais das suas habilidades você costuma não valorizar?"
  - >-
    Onde as suas palavras e as suas ações não estão bem alinhadas agora?
  - >-
    Que intenção você poderia colocar em prática hoje com o que já tem?
imageryNote: >-
  O Mago do Taro é imaginado em uma banca de feira numa encruzilhada, ao amanhecer, arrumando quatro objetos simples para os quatro naipes: um galho verde, um copo de barro, uma faca de cortar pão e uma única moeda. Uma mão se estende para a banca, a outra aponta para o céu que clareia, ligando ideia e ação. Fios de luz entre os objetos sugerem a atenção unindo ferramentas separadas em um único propósito, e um pão ainda por terminar indica que o fazer mal começou.
