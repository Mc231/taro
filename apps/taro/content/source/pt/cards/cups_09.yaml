meaningUpright: |-
  O Nove de Copas é muitas vezes chamado de carta dos desejos. Ele mostra uma figura à vontade entre cálices cheios, claramente contente com o que tem. Ele fala de contentamento: a sensação de que basta, de um desejo atendido ou de uma esperança que deu em alguma coisa.
  Esta carta convida você a notar a satisfação quando ela está presente, sem correr direto para o próximo objetivo. Talvez você tenha terminado algo em que trabalhou muito, aproveitado uma boa refeição com pessoas de quem gosta, ou simplesmente esteja à vontade na sua vida por um momento. Essas experiências merecem ser saboreadas.
  Ela também pode convidar você a refletir sobre o que realmente deseja. Se você pudesse encher mais um cálice, o que ele guardaria? Conhecer os seus desejos com clareza pode moldar escolhas de jeitos pequenos e práticos. Aproveitar o prazer e o conforto faz parte de uma vida plena. A gratidão, nesse sentido, não é achar que a felicidade é uma obrigação; é notar o que já está bom e deixar que isso conte.
meaningReversed: |-
  Invertido, o Nove de Copas pode refletir uma distância entre como as coisas parecem e como elas são sentidas. Você pode ter o que achava que queria e ainda sentir que algo falta. Ou o prazer pode ter virado excesso, com o conforto se tornando um jeito de evitar sentimentos, e não de aproveitar a vida.
  Ele também pode se voltar para dentro, sugerindo que um contentamento duradouro tem menos a ver com posses ou conquistas e mais com a sua relação consigo.
  Esta carta convida a uma reflexão honesta. O que você esperava que esse desejo trouxesse, e o que ele de fato trouxe? Você pode buscar satisfação nos valores, nas conexões e no sentido, além dos resultados. Prazeres pequenos e sinceros, escolhidos com cuidado, podem oferecer mais do que acumular. Tudo bem querer coisas; a pergunta é o que pareceria suficiente.
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, o Nove de Copas pode refletir contentamento e tranquilidade com as pessoas ao seu redor. Ele pode convidar você a aproveitar uma conexão como ela é, compartilhando prazeres e dizendo o que você valoriza. Você pode notar como é, para você, um vínculo que satisfaz, para poder nutri-lo com intenção, e não por acaso.
  relationshipsReversed: >-
    Invertida, esta carta pode apontar para a expectativa de que um relacionamento forneça todo o seu contentamento, ou para a sensação de que algo falta apesar da harmonia aparente. Você pode explorar quais necessidades poderia atender por conta própria, e o que gostaria de pedir com mais abertura a alguém próximo.
  workUpright: >-
    No trabalho, esta carta pode refletir a satisfação com uma conquista, o reconhecimento por um esforço ou simplesmente o gosto pelo que você faz. Ela pode convidar você a fazer uma pausa e reconhecer o progresso que fez. Celebrar um marco, mesmo em particular, pode renovar a energia para o que vem a seguir e lembrar por que o trabalho importa.
  workReversed: >-
    Invertida, a carta pode refletir um sucesso que parece vazio, ou a busca de símbolos de conquista que não refletem o que você valoriza. Você pode se perguntar o que faria o seu trabalho ter sentido, e não só impressionar. Alinhar objetivos com os seus valores pode transformar a conquista em satisfação genuína.
  growthUpright: >-
    No crescimento pessoal, o Nove de Copas convida a uma prática de gratidão e de prazer. Você pode terminar cada dia anotando três coisas que fizeram bem, por menores que sejam. Com o tempo, isso pode treinar a sua atenção para o contentamento e facilitar reconhecer quando você tem o suficiente.
  growthReversed: >-
    Invertida, esta carta pode pedir que você examine a diferença entre prazer e plenitude. Você pode notar hábitos de consumo, de correria ou de comparação que deixam você sempre querendo mais. Explorar o que traz uma satisfação profunda, e não só um alívio rápido, pode guiar escolhas mais gentis e mais duradouras.
reflectionQuestions:
