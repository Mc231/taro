imageryNote: >-
  A arte pode mostrar uma figura coroada sentada num trono esculpido com motivos de touro, cercada de videiras e de um jardim murado, com uma moeda repousando com naturalidade numa das mãos. O touro pode simbolizar resistência e força terrena; as videiras, maturidade e fartura; e os muros, um domínio protegido e bem cuidado. A postura relaxada sugere uma autoridade apoiada na experiência, e verdes profundos e dourados podem refletir um sustento duradouro e paciente.
