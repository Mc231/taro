imageryNote: >-
  A arte original se concentra numa única lâmina erguida que atravessa nuvens que se abrem, com o fio captando a primeira luz. Um aro fino pende perto da ponta, sugerindo que uma ideia clara pode virar um princípio que orienta. Céu aberto e ar em movimento a cercam, o elemento do pensamento e da respiração. O clima é nítido e desperto, como o ar frio da manhã, apontando para o instante em que uma mente dispersa encontra uma linha limpa para seguir.
