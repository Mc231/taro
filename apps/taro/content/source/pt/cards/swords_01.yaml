shortUpright: >-
  Um pensamento claro chega; você pode notar o que fica simples quando é dito com todas as letras.
shortReversed: >-
  A clareza pode estar perto, mas ainda fora de alcance; há espaço para deixar a névoa assentar antes de decidir.
meaningUpright: |-
  O Ás de Espadas é o momento em que um pensamento entra em foco. Depois de um período de barulho ou de confusão, uma ideia se destaca com nitidez, como uma única linha traçada numa página em branco. Esta carta convida você a considerar o que agora vê com mais clareza do que antes, e o que essa clareza torna possível.
  No dia a dia, isso pode aparecer como finalmente encontrar palavras para um sentimento que você vinha rodeando há semanas, ou perceber que um problema que parecia complicado tem um centro honesto. Pode ser o começo de um novo plano, uma pergunta que você está em condições de fazer em voz alta, ou uma decisão que agora consegue dizer sem rodeios. Às vezes é simplesmente o alívio de entender.
  O pensamento claro é uma ferramenta e, como qualquer ferramenta, funciona bem quando usado com cuidado. Você pode se perguntar como usar essa nova clareza de um jeito que respeite tanto a verdade quanto as pessoas que ela toca. Como seria dizer a coisa simples com gentileza, e deixar que uma ideia clara guie o seu próximo pequeno passo?
meaningReversed: |-
  Invertido, o Ás de Espadas pode refletir uma clareza bloqueada ou adiada. A ideia pode estar ali, mas continua escapando, ou chega embolada em pensamentos demais. Você pode se notar ensaiando a mesma discussão na cabeça, ou escrevendo uma mensagem várias vezes sem enviá-la.
  Outra leitura é um corte que perdeu o cuidado: uma verdade dita de forma tão brusca que fica difícil de ouvir, ou uma certeza que fecha a porta para outros pontos de vista. A clareza pode ficar quebradiça quando é usada para vencer, e não para entender.
  Esta carta convida você a dar um pouco de espaço ao seu pensamento. Escrever, caminhar ou conversar com alguém de confiança pode deixar a névoa se dissipar por conta própria. Talvez você não tenha de ter a resposta inteira hoje. Qual é uma pequena coisa que você já sabe, e você poderia começar por ela?
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, o Ás de Espadas pode apontar para uma conversa que limpa o ar. Você pode finalmente conseguir dizer o que quer, ou ouvir o que alguém próximo vem tentando dizer. A honestidade oferecida com carinho pode deixar um vínculo mais leve. Você pode escolher palavras claras sem serem cortantes, para que a verdade vire uma ponte, e não um muro.
  relationshipsReversed: >-
    Invertida, esta carta pode refletir palavras que ficam sem ser ditas, ou palavras ditas de forma afiada demais. Talvez um mal-entendido tenha crescido porque cada pessoa está adivinhando o que a outra quis dizer. Você pode considerar desacelerar antes de uma conversa difícil: o que você realmente quer que a outra pessoa entenda, e o que ajudaria essa pessoa a ouvir? Uma pergunta gentil pode abrir mais do que uma resposta afiada.
  workUpright: >-
    No trabalho ou em um projeto, o Ás de Espadas pode marcar um avanço na compreensão: a definição de um problema que finalmente faz sentido, um plano limpo ou uma ideia nova que vale testar. Pode ser um bom momento para anotar a ideia enquanto ela está fresca e compartilhá-la com alguém que ajude a afiá-la. A clareza sobre o objetivo muitas vezes torna os próximos passos mais fáceis de ver.
  workReversed: >-
    Invertida, esta carta pode sugerir um projeto nebuloso: objetivos pouco claros, mensagens contraditórias ou ideias demais disputando espaço. Forçar mais pode não ajudar tanto quanto dar um passo atrás. Você pode tentar nomear a pergunta que mais importa agora, ou pedir clareza às pessoas envolvidas no lugar de adivinhar. Às vezes, o movimento mais claro é admitir o que ainda não se sabe.
  growthUpright: >-
    No crescimento pessoal, o Ás de Espadas convida você a notar as histórias que conta para si e a confrontá-las com o que de fato sabe. Uma perspectiva nova pode afrouxar uma suposição antiga. Você pode explorar a escrita num diário como um jeito de capturar pensamentos em palavras simples, para olhar para eles, e não através deles. A curiosidade sobre a sua própria mente pode ser um tipo silencioso de coragem.
  growthReversed: >-
    Invertida, esta carta pode refletir uma mente ocupada, mas que não avança, girando nas mesmas preocupações ou planos. Você pode notar quando o pensar virou pensar demais. Descanso, movimento ou uma mudança de ambiente podem dar espaço para os pensamentos assentarem. Tudo bem manter uma pergunta em aberto um pouco mais enquanto a clareza se forma no seu próprio ritmo.
