imageryNote: >-
  A arte mostra três figuras num círculo solto, com os cálices erguidos e se encontrando no meio. Aos seus pés, uma colheita de frutas, flores ou videiras pode sugerir uma abundância que cresce do esforço compartilhado. As roupas, posturas e cores diferentes podem representar amigos que continuam distintos enquanto pertencem ao mesmo grupo. O movimento da cena, como um passo de dança ou uma barra de roupa girando, transmite uma alegria leve e espontânea.
