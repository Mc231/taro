meaningUpright: |-
  O Três de Copas é uma carta de amigos erguendo os cálices juntos. Ela celebra o tipo de conexão que não pede motivo: risadas em volta da mesa da cozinha, um grupo de mensagens que se acende com uma boa notícia, vizinhos que ajudam sem que ninguém peça. Se o Dois de Copas olha para um vínculo, esta carta olha para o círculo.
  Ela pode refletir uma temporada de encontros, um marco que merece ser comemorado, ou simplesmente a sensação de pertencer a um grupo que enxerga você. Também pode apontar para um apoio que já está ao seu redor, talvez mais do que você tem notado.
  Esta carta convida você a deixar a alegria ser compartilhada, sem guardá-la para depois. Você pode procurar alguém que vem querendo ver, aceitar um convite ou criar uma pequena ocasião sua. A celebração não tem de ser grandiosa. Às vezes é só reconhecer, juntos, que algo bom aconteceu, ou que vocês atravessaram algo difícil.
meaningReversed: |-
  Invertido, o Três de Copas pode refletir uma vida social que parece desafinada. Você pode se sentir à margem de um grupo do qual já fez parte, ou notar que amizades se afastaram à medida que as vidas mudaram. Ou pode haver coisa boa em excesso: planos que não deixam espaço para descansar, ou celebrações que viraram um jeito de evitar sentimentos mais silenciosos.
  Nada disso é um veredito sobre as suas amizades. Os círculos mudam de forma, e é natural deixar alguns encontros para trás e sentir falta de outros.
  O convite é olhar para a qualidade das suas conexões, e não para a quantidade. Com quais pessoas você se sente mais você? Onde você pode estar dizendo sim por hábito? Uma única conversa sincera com uma pessoa amiga pode oferecer mais do que uma agenda lotada.
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, esta carta destaca a rede mais ampla em torno de um vínculo: amizades, família, a família escolhida. Ela pode convidar você a compartilhar bons momentos com as pessoas que apoiam você, ou a acolher alguém próximo no seu círculo. Você também pode notar o quanto as suas amizades sustentam você, e dar a elas um pouco da atenção que costuma ficar reservada a um único relacionamento.
  relationshipsReversed: >-
    Invertida, esta carta pode refletir tensão num grupo, ou a sensação de ficar de fora. Ela também pode apontar para uma influência de fora sobre um vínculo, seja qual for a forma que ela tome. No lugar de adivinhar, você pode perguntar com simplicidade como estão as coisas. Também pode ajudar passar tempo com pessoas diante de quem você não tem de encenar nem acompanhar o ritmo de ninguém.
  workUpright: >-
    No trabalho, o Três de Copas pode apontar para espírito de equipe, uma vitória compartilhada ou colaboradores que realmente gostam de trabalhar juntos. Ele pode convidar você a celebrar o progresso pelo caminho, e não só no final. Agradecer as pessoas pelo nome, dividir o crédito e marcar pequenos marcos pode fortalecer o grupo e tornar o trabalho mais gratificante.
  workReversed: >-
    Invertida, a carta pode refletir uma equipe que perdeu o calor, talvez por fofocas, panelinhas ou simples excesso de trabalho. Você pode notar se a pressão social está moldando as suas escolhas, como ficar até mais tarde para se enturmar. Considere como seria um bom convívio entre colegas para você, e onde poderia dar o exemplo de um jeito pequeno.
  growthUpright: >-
    No crescimento pessoal, esta carta convida você a valorizar a alegria como parte de uma vida equilibrada, e não como uma recompensa que se conquista antes. Você pode anotar, ao longo de uma semana, pequenos prazeres compartilhados. Notá-los pode facilitar reconhecer a comunidade que você já tem, e ver onde gostaria de ampliá-la.
  growthReversed: >-
    Invertida, esta carta pode perguntar se você está usando a correria ou a companhia para evitar ficar a sós com os seus pensamentos. Ela também pode refletir uma solidão difícil de admitir. Você pode equilibrar o tempo social com momentos a sós e notar de qual dos dois sente mais falta. Procurar uma pessoa pode ser um começo gentil.
reflectionQuestions:
  - "Com quais pessoas você mais quer celebrar, e por quê?"
