imageryNote: >-
  Oito bastões cruzam na diagonal um céu amplo, paralelos e em pleno voo, sobre uma paisagem suave com um rio ou uma estrada embaixo. Não há pessoas na cena, só movimento. O ângulo compartilhado sugere uma energia alinhada numa só direção; o céu aberto, um caminho livre; e o rio embaixo, o fluxo constante dos acontecimentos. A ausência de figuras convida quem olha a sentir o movimento, e não a assistir à história de outra pessoa.
