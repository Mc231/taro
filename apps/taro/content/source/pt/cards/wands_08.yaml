meaningUpright: |-
  O Oito de Paus é uma das poucas cartas do baralho sem uma figura humana. Oito bastões voam pelo ar aberto, paralelos, todos na mesma direção. Ela captura o movimento puro: o momento em que a energia é liberada e as coisas começam a acontecer em alta velocidade.
  No dia a dia, isso pode parecer respostas chegando depois de um longo silêncio, várias partes de um plano se encaixando de repente, ou uma onda de foco em que as horas passam sem que você perceba. Também pode descrever viagens, conversas rápidas e ideias que se somam umas às outras com velocidade.
  Esta carta convida você a aproveitar o embalo enquanto ele está presente. Quando a direção está clara, pode ser libertador agir sem pensar demais em cada passo. Ao mesmo tempo, a velocidade ganha com a mira. Você pode conferir se todos os seus esforços apontam para onde você realmente quer ir, responder ao que pede resposta e deixar o resto da energia levar você adiante, sem se espalhar em muitas direções ao mesmo tempo.
meaningReversed: |-
  Invertido, o Oito de Paus pode refletir um movimento que travou ou se embolou. As respostas podem demorar, os planos podem se acumular esperando que outra coisa aconteça, ou as mensagens podem ser mal interpretadas pelo caminho.
  Ele também pode descrever o oposto: avançar tão rápido que os detalhes escapam, ou dizer sim a tudo e acabar com a energia voando para todos os lados. Em qualquer caso, o momento parece um pouco fora do lugar.
  Este pode ser um momento de desacelerar de propósito. O que é realmente urgente, e o que só parece ser? Você pode esclarecer uma mensagem que possa ter sido mal lida, ou usar uma pausa para se preparar, para que, quando as coisas voltarem a andar, a sua energia esteja direcionada, e não espalhada.
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, esta carta pode refletir uma comunicação animada: mensagens frequentes, planos espontâneos, conversas que fluem com facilidade. Ela pode apontar para um vínculo ganhando força, ou para o reencontro depois de um tempo longe. Você pode aproveitar o ritmo e também cuidar para que o que importa seja dito com clareza, não só com rapidez.
  relationshipsReversed: >-
    Com a carta invertida, as mensagens podem estar se desencontrando ou ficando sem resposta, ou uma pessoa pode querer ir mais rápido do que a outra. Você pode conferir se algum mal-entendido se infiltrou, e perguntar diretamente no lugar de adivinhar. Combinar um ritmo que funcione para as duas pessoas pode aliviar muita pressão não dita.
  workUpright: >-
    No trabalho ou nos estudos, o Oito de Paus pode apontar para uma fase produtiva: tarefas andando, aprovações chegando, um projeto acelerando. Você pode focar nas poucas coisas que mantêm o embalo e cuidar da comunicação sem demora. Prioridades claras ajudam a velocidade a virar progresso, e não um borrão de atividades.
  workReversed: >-
    Com a carta invertida, o trabalho pode parecer preso em atrasos, ou apressado de um jeito que gera erros. Você pode rever a sua lista e separar o que é urgente do que só parece urgente. Alinhar expectativas com outras pessoas, ou dar um pouco mais de tempo a uma tarefa importante, pode evitar que pequenos deslizes se acumulem.
  growthUpright: >-
    No crescimento pessoal, esta carta convida você a notar quando a energia flui com facilidade e o que torna isso possível. Talvez seja um objetivo claro, um certo horário do dia ou um ambiente que apoia. Você pode se deixar levar por esse fluxo por um tempo e ver quanto pode acontecer quando esforço e direção se alinham.
  growthReversed: >-
    Com a carta invertida, você pode estar se frustrando com mudanças lentas ou sentindo um puxão em direções demais. Você pode explorar que ritmo é sustentável para você agora. Às vezes uma pausa deliberada, usada para descansar ou renovar intenções, ajuda você a avançar com mais firmeza do que o movimento constante.
reflectionQuestions:
