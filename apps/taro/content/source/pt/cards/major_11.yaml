meaningUpright: |-
  A Justiça segura uma balança numa mão e uma espada na outra. A balança representa pesar as coisas com cuidado; a espada, a clareza para agir depois de pesar. Esta carta fala de equidade, honestidade e de assumir a responsabilidade pelas suas escolhas, entendendo que as ações têm consequências e que você pode escolhê-las com cuidado.
  No dia a dia, esta carta pode refletir uma decisão que pede a cabeça fria, como dividir tarefas de forma justa, dar um retorno honesto ou admitir um erro e repará-lo. Ela pode apontar para momentos em que a situação pede um olhar por todos os lados antes de responder, e a mesma justiça consigo que você tenta ter com os outros.
  Esta carta convida você a considerar como seria uma resposta equilibrada. Você pode se perguntar quais fatos importam, o que cada pessoa envolvida espera, e pelo que você pode assumir responsabilidade. A Justiça não prevê como qualquer questão formal vai terminar. Ela destaca a integridade: agir de acordo com o que você acredita ser certo e aceitar o que vier depois com a mente serena.
meaningReversed: |-
  Invertida, a Justiça pode refletir a sensação de que algo é injusto, ou de que a balança de uma situação pendeu para um lado. Você pode sentir que está carregando mais do que a sua parte, ou notar uma tentação de não olhar para o seu próprio papel numa dificuldade.
  Esta carta também pode apontar para um julgamento duro demais sobre si, pesando cada escolha contra um padrão impossível. Assumir responsabilidade é útil; a autocrítica constante é outra coisa.
  Talvez valha escrever a situação da forma mais neutra possível, como se estivesse explicando a uma pessoa amiga de olhar justo. O que é seu para assumir, e o que não é? Buscar justiça pode significar falar, fazer uma reparação ou simplesmente soltar um julgamento que ficou pesado de carregar.
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, a Justiça pode refletir equilíbrio e respeito mútuo: as duas pessoas dando e recebendo de um jeito que parece justo. Ela pode convidar você a olhar com honestidade para como as responsabilidades e o cuidado são divididos. Conversas claras e gentis sobre expectativas podem fortalecer a confiança e evitar ressentimentos silenciosos.
  relationshipsReversed: >-
    Invertida, esta carta pode apontar para um desequilíbrio, como uma pessoa fazendo mais do trabalho emocional ou prático, ou um conflito em que a culpa parece cair de um lado só. Você pode considerar como seria a justiça dos dois pontos de vista, e se um pedido de desculpas ou um acordo mais claro poderia restaurar o equilíbrio.
  workUpright: >-
    No trabalho ou em um projeto, a Justiça destaca a integridade, um processo justo e decisões cuidadosas. Ela pode refletir rever o que se espera de cada parte, dar um retorno equilibrado ou pesar as opções pelos seus méritos. Você pode se perguntar qual escolha você se sentiria à vontade para explicar abertamente a todas as pessoas afetadas.
  workReversed: >-
    Invertida, a Justiça pode refletir frustração com um tratamento injusto ou com regras pouco claras. Ela também pode apontar para cortar caminho sob pressão. Você pode anotar os fatos com calma, buscar o apoio adequado se for o caso, e conferir se as suas próprias ações estão à altura do padrão que gostaria que os outros seguissem.
  growthUpright: >-
    No crescimento pessoal, esta carta convida você a viver de acordo com os seus valores e assumir as suas escolhas. Refletir sobre os efeitos das suas ações, sem dureza, pode ajudar você a crescer. Você pode olhar para uma decisão recente e se perguntar o que manteria e o que faria de outro jeito da próxima vez.
  growthReversed: >-
    Invertida, a Justiça pode perguntar se você se cobra com um rigor muito maior do que cobra os outros. Ela pode refletir uma culpa que continua mesmo depois que a lição já foi aprendida. Você pode praticar uma autoavaliação justa: nomear tanto o que deu errado quanto o que deu certo.
