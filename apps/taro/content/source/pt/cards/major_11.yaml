imageryNote: >-
  A Justiça do Taro é imaginada como uma figura serena e ereta, segurando uma balança equilibrada na altura do coração e uma lâmina erguida apontando para o céu. A figura olha direto para quem observa, sugerindo honestidade, sem nada escondido. Duas colunas simples e uma cortina lisa ao fundo deixam a cena limpa, como se abrissem espaço para um pensamento cuidadoso. Azuis frios de ar e um único detalhe quente podem refletir o encontro entre razão e consciência.
