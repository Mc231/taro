meaningUpright: |-
  O Eremita caminha por uma trilha na montanha segurando uma lanterna que ilumina apenas os próximos passos. Esta carta fala de se afastar do barulho para buscar as próprias respostas. O Eremita não está em solidão triste, e sim com propósito: o recolhimento tem um motivo, e a luz é carregada, não esperada.
  No dia a dia, esta carta pode refletir escolher uma noite tranquila no lugar de uma agitada, fazer uma caminhada sem companhia para pensar numa decisão, ou passar um tempo com um livro, um caderno ou um trabalho manual que pede concentração. Ela pode apontar para uma fase de rever prioridades, em que a opinião dos outros importa menos do que a sua própria noção, formada aos poucos, do que é verdade para você.
  Esta carta convida você a considerar o que está buscando e se tem se dado espaço suficiente para encontrar. Você pode se perguntar que pergunta levaria numa longa caminhada. O Eremita sugere que a sabedoria muitas vezes chega em lampejos pequenos e firmes, como uma lanterna que mostra o caminho um passo de cada vez, e que isso basta para seguir em frente.
meaningReversed: |-
  Invertido, o Eremita pode refletir uma solitude que durou mais do que ajuda. O tempo a sós pode, aos poucos, virar recolhimento, e procurar alguém parece mais difícil a cada dia. Você pode notar que os seus pensamentos andam em círculos no lugar de ir em direção a algo.
  Esta carta também pode apontar para o oposto: encher tanto a agenda, ou viver com tanta gente ao redor, que não sobra espaço nenhum para refletir. Evitar o silêncio pode ser um jeito de evitar uma pergunta que você ainda não quer encarar.
  Talvez valha olhar qual dos lados parece mais próximo. Se você tem passado muito tempo a sós, qual seria um jeito pequeno e confortável de se reconectar com alguém? Se tem evitado a quietude, o que poderia aprender com dez minutos a sós com os seus pensamentos? A lanterna continua nas suas mãos para erguer.
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, o Eremita pode refletir a vontade de ter espaço para pensar, e o valor das pessoas que respeitam isso. Ele pode convidar você a explicar com delicadeza que se afastar um pouco é reflexão, não rejeição. O tempo a sós pode ajudar você a voltar aos outros com mais clareza sobre o que deseja e pode oferecer.
  relationshipsReversed: >-
    Invertida, esta carta pode apontar para um recolhimento que os outros sentem como distância, ou para uma solidão que você ainda não mencionou. Você pode considerar se tem esperado que outra pessoa tome a iniciativa. Uma mensagem curta e sincera pode reabrir uma porta, mesmo que depois você ainda queira um tempo de quietude.
  workUpright: >-
    No trabalho ou nos estudos, o Eremita destaca o trabalho profundo e focado e o pensamento independente. Pode ser um bom momento para pesquisa, escrita, planejamento ou para aprender algo a fundo. Você pode proteger um tempo sem interrupções e notar que ideias surgem quando você não está o tempo todo respondendo aos outros.
  workReversed: >-
    Invertido, o Eremita pode refletir trabalhar isoladamente por tempo demais, ou deixar de receber contribuições que ajudariam. Ele também pode apontar para pensar demais numa decisão. Você pode pedir um olhar novo a um colega ou mentor de confiança, e notar como compartilhar as suas ideias pode afiá-las.
  growthUpright: >-
    No crescimento pessoal, esta carta convida a uma prática de solitude e de autoinvestigação. Escrever num diário, caminhar ou simplesmente ficar em silêncio com uma pergunta pode ajudar você a se entender melhor. Você pode pensar na sua própria lanterna como uma percepção recente, e deixar que ela ilumine o seu próximo passo.
  growthReversed: >-
    Invertido, o Eremita pode perguntar se você está se escondendo de si ou dos outros. Ele pode refletir a necessidade de equilibrar reflexão e conexão. Você pode planejar um ritual tranquilo e um pequeno momento social nesta semana, e notar como cada um faz você se sentir. O equilíbrio aqui é pessoal; só você pode sentir a medida certa.
