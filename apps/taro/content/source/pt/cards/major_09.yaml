imageryNote: >-
  O Eremita do Taro é imaginado como uma figura de manto numa crista alta e nevada ao entardecer, segurando uma lanterna simples que ilumina apenas os próximos passos da trilha. Um cajado alisado pelo uso sugere o apoio que vem da experiência. Pegadas na neve, atrás, mostram o quanto a figura já caminhou. Azuis e cinzas frios falam de solitude e de ar limpo, enquanto o brilho morno da lanterna mostra que a compreensão pode ser levada até o trecho mais escuro da estrada.
