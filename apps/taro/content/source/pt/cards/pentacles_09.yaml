imageryNote: >-
  A arte pode mostrar uma única figura de pé entre videiras ou árvores frutíferas, com nove moedas entrelaçadas na vegetação ao redor e um pequeno pássaro pousado com calma numa das mãos. O jardim farto pode simbolizar os resultados de um cuidado paciente; o pássaro, uma mente disciplinada e gentil; e a postura sem pressa, uma confiança tranquila. Verdes intensos e dourado podem sugerir refinamento sem excesso, um espaço que parece conquistado e moldado do jeito de quem o habita.
