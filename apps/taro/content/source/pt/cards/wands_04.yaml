imageryNote: >-
  Quatro bastões em pé são unidos por uma guirlanda de folhas, flores e fitas, formando um portal aberto. Do outro lado, figuras se reúnem com as mãos erguidas, e uma casa simples ou uma cidade murada aparece ao longe. A moldura de quatro sugere bases estáveis construídas com esforço; a guirlanda, uma colheita de alegria compartilhada; e o portal aberto, uma acolhida que convida os outros a entrar, e não a ficar de fora.
