meaningUpright: |-
  O Quatro de Paus é uma carta de chegada e de encontro. Quatro bastões formam uma moldura simples, como os postes de uma tenda ou um portão enfeitado para receber convidados. Ele marca uma etapa em que o esforço criou algo estável o bastante para que se possa ficar debaixo dele e compartilhar.
  No dia a dia, isso pode aparecer como terminar uma fase puxada de trabalho e cozinhar para os amigos, mudar para um espaço que finalmente parece seu, ou uma família ou comunidade se reunindo em torno de uma ocasião especial. Tem menos a ver com um grande sucesso e mais com o calor de ter chegado a um ponto de descanso com pessoas ao redor.
  Esta carta convida você a fazer uma pausa e marcar o que conquistou, por mais modesto que pareça. Celebrar não é só uma recompensa; fortalece os vínculos e dá energia para o que vem depois. Você pode pensar em quem fez parte deste capítulo e em como poderia agradecer, ou simplesmente se permitir aproveitar a sensação de pertencimento sem correr para o próximo objetivo.
meaningReversed: |-
  Invertido, o Quatro de Paus pode sugerir que a sensação de lar ou de pertencimento está um pouco instável. Os planos para um encontro podem estar mudando, uma mudança de casa pode ainda não ter se assentado, ou você pode estar presente numa celebração e, ao mesmo tempo, sentir certa distância dela.
  Ele também pode apontar para uma celebração voltada para dentro. Talvez você sinta um orgulho silencioso de algo que os outros não notaram, ou prefira um jeito pequeno e privado de marcar um marco. Isso também pode ter muito significado.
  Este pode ser um momento de perguntar o que faz um lugar ou um grupo parecer um lar para você. Há algo nas suas bases pedindo atenção: uma rotina, uma conversa, um pequeno conserto? Você pode encontrar um jeito de criar um cantinho de estabilidade, mesmo que o quadro maior ainda esteja se ajeitando.
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, esta carta pode refletir calor, celebração compartilhada e a sensação de acolhida. Pode ser um momento de honrar um vínculo, seja com um aniversário, um reencontro, uma refeição juntos ou simplesmente dizendo em voz alta o que a outra pessoa significa para você. Você pode notar com quem se sente mais em casa e dizer isso a essa pessoa.
  relationshipsReversed: >-
    Com a carta invertida, você pode sentir que está um pouco do lado de fora de um círculo que importa para você, ou notar tensão em torno de um encontro ou de um espaço compartilhado. Nem toda ocasião tem de ser perfeita para ter significado. Você pode considerar um passo pequeno e honesto de reaproximação, como um convite, uma conversa tranquila ou uma oferta de ajuda com algo que importa para a outra pessoa.
  workUpright: >-
    No trabalho ou em um projeto, o Quatro de Paus pode apontar para um marco que merece reconhecimento: um lançamento, uma fase concluída, uma equipe que encontrou o seu ritmo. Você pode reservar um tempo para celebrar com as pessoas que tornaram isso possível. Reconhecer o esforço compartilhado pode fortalecer a confiança e dar à próxima etapa uma base mais firme.
  workReversed: >-
    Com a carta invertida, um marco pode passar sem reconhecimento, ou uma equipe pode estar menos assentada do que parece. Você pode nomear o progresso por conta própria, sem esperar que outra pessoa faça isso, ou olhar para o que ajudaria o grupo a sentir mais segurança: papéis mais claros, um espaço comum ou um momento para refletir sobre o caminho que vocês já percorreram juntos.
  growthUpright: >-
    No crescimento pessoal, esta carta convida você a deixar as conquistas assentarem antes de seguir em frente. Marcar um passo concluído pode construir uma estabilidade interior que acompanha você nos momentos mais difíceis. Você pode criar um pequeno ritual seu, como uma caminhada, uma anotação ou uma comida favorita, para honrar um avanço recente.
