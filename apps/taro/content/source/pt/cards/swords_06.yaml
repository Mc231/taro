shortUpright: >-
  Você pode estar saindo de águas agitadas em direção a margens mais calmas; a mudança pode ser quieta e lenta e, ainda assim, real.
shortReversed: >-
  Algo pode estar segurando você na margem antiga; você pode notar o que ainda não está em condições de deixar.
meaningUpright: |-
  O Seis de Espadas é uma carta de travessia. Um pequeno barco cruza a água, deixando ondas agitadas para trás e seguindo para uma margem mais tranquila. A viagem não é dramática. É constante, às vezes triste, muitas vezes um alívio.
  Esta carta pode refletir qualquer transição de um capítulo mais difícil para um mais leve: o fim de um período difícil no trabalho, a mudança para um lugar novo, o afastamento de uma situação que drena você, ou simplesmente a sensação de que os pensamentos começam a se acalmar depois de uma tempestade. As lâminas viajam com quem está no barco, o que sugere que algumas memórias e lições vão junto. Você não tem de deixar tudo para trás para seguir em frente.
  Esta carta convida você a notar a direção em que já está indo, mesmo que o progresso pareça lento. Você pode se perguntar quem ou o que está ajudando você a fazer a travessia, e se consegue aceitar essa ajuda. As transições muitas vezes misturam alívio com um pouco de luto pelo que fica para trás; os dois sentimentos podem ir no mesmo barco. O que tornaria esta travessia mais suave para você?
meaningReversed: |-
  Invertido, o Seis de Espadas pode refletir uma transição adiada ou que encontra resistência. Você pode saber que é hora de seguir em frente, mas sentir que hábitos, laços práticos ou a incerteza sobre o que espera do outro lado seguram você. O barco pode estar pronto enquanto você ainda está no cais.
  Outra leitura é carregar coisa demais da margem antiga: preocupações, papéis ou expectativas que deixam a travessia mais pesada do que deveria ser. Às vezes ela também pode apontar para voltar por um tempo para terminar algo antes de poder partir de verdade.
  Você pode se perguntar o que ainda falta para se mover. É informação, apoio, um desfecho ou a sua própria permissão? A mudança pode esperar até você estar em condições, e essa disposição também pode ser construída em pequenos passos. Que coisa você poderia deixar no chão antes de partir?
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, esta carta pode apontar para atravessar juntos uma fase difícil rumo a um terreno mais calmo, ou para se afastar com delicadeza de um padrão que já não serve. Ela também pode refletir o apoio a alguém próximo na sua própria transição. Você pode notar como uma companhia silenciosa, sem tentar resolver tudo, pode ajudar uma pessoa a sentir menos solidão na travessia.
  relationshipsReversed: >-
    Invertido, o Seis de Espadas pode refletir a dificuldade de deixar uma dinâmica antiga para trás, ou a tendência de levar mágoas passadas para um novo capítulo. Você pode considerar quais expectativas pertencem a um relacionamento anterior, e não a este. Conversar sobre o que vocês dois querem deixar na margem antiga pode tornar o presente mais leve.
  workUpright: >-
    No trabalho, esta carta pode sugerir uma mudança gradual: uma nova função, uma equipe diferente, ou a saída de um projeto estressante para um terreno mais estável. A transição pode não parecer empolgante, mas pode trazer alívio. Você pode fazer um balanço das habilidades e lições que está levando consigo, e soltar hábitos que só faziam sentido nas águas agitadas.
  workReversed: >-
    Invertida, esta carta pode refletir uma mudança no trabalho que vive sendo adiada, ou tarefas inacabadas que prendem você a uma situação que você quer deixar. Você pode listar o que realmente tem de ser concluído e o que poderia ser passado adiante. Às vezes, amarrar algumas pontas soltas é o que finalmente deixa o barco sair do cais.
  growthUpright: >-
    No crescimento pessoal, o Seis de Espadas convida você a honrar o progresso lento. Afastar-se de um jeito antigo de pensar muitas vezes acontece ao longo de muitos dias pequenos, e não num único salto ousado. Você pode notar sinais de que já tem mais calma ou mais sabedoria do que antes, e se dar crédito pela distância percorrida.
  growthReversed: >-
    Invertida, esta carta pode refletir o apego a padrões conhecidos mesmo quando já não ajudam, ou a pressa de seguir sem processar o que aconteceu. Você pode fazer uma pausa para olhar para trás uma vez, de propósito, e nomear o que está levando consigo e o que já está em condições de soltar. Depois, volte-se de novo para a água.
