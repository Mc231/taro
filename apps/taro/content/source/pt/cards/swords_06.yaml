imageryNote: >-
  Na arte original, um pequeno barco desliza de uma água encrespada em direção a uma margem parada e enevoada. Seis lâminas estão de pé no barco como uma carga silenciosa, e uma pessoa sentada olha para a frente. Uma vara longa empurra o barco com constância pela água rasa. A água que muda mostra a passagem da agitação para a calma, as lâminas sugerem lições levadas junto, e a vara aponta para um movimento paciente, passo a passo.
