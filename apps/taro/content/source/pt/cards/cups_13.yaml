meaningUpright: |-
  A Rainha de Copas está sentada à beira da água, segurando um cálice e observando-o com uma atenção tranquila. Esta figura representa a maturidade emocional na sua forma receptiva: a capacidade de sentir com profundidade, perceber o que os outros estão pedindo e responder com compaixão sem se perder de si.
  Esta carta pode refletir um momento em que você é a presença calma que alguém procura, ou em que surge a vontade de escutar com mais atenção a sua própria intuição. Ela destaca a empatia, a paciência e o tipo de cuidado que cria segurança, e não pressão.
  No dia a dia, isso pode aparecer como escutar uma pessoa amiga sem correr para resolver as coisas, confiar numa percepção silenciosa sobre uma situação, ou criar em casa um espaço gentil onde as pessoas possam ser quem são. Também pode apontar para um trabalho criativo ou reflexivo que se alimenta da sua vida interior.
  A carta convida você a honrar a sensibilidade como uma força. Você pode se perguntar como cuidar dos outros guardando também um cálice de compaixão para você.
meaningReversed: |-
  Invertida, a Rainha de Copas pode refletir um cuidado que transbordou das bordas. Você pode estar absorvendo os sentimentos dos outros tão por inteiro que fica difícil encontrar os seus, ou dando tanto que sobra pouco para você.
  Ela também pode apontar para dentro: a vontade de se reconectar com a sua própria intuição depois de escutar principalmente os outros, ou sentimentos que pedem atenção no lugar de serem deixados de lado.
  Esta carta convida você a tratar os limites como uma forma de compaixão. Como seria cuidar sem carregar tudo? Você pode reservar um tempo tranquilo para se ouvir, dizer não a um pedido ou deixar outra pessoa segurar parte da carga. Quando o seu próprio cálice recebe cuidado, o cuidado que você oferece pode fluir com mais liberdade e menos esforço.
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, a Rainha de Copas pode refletir escuta profunda, apoio emocional e compreensão. Ela pode convidar você a criar um vínculo em que os sentimentos são bem-vindos. Você pode notar como oferece conforto aos outros e como gosta de recebê-lo, e compartilhar isso com alguém próximo para que o cuidado flua nos dois sentidos.
  relationshipsReversed: >-
    Invertida, esta carta pode apontar para assumir peso emocional demais de outra pessoa, ou para perder de vista as suas próprias necessidades num vínculo. Você pode se perguntar onde um limite gentil poderia proteger você e o relacionamento. Cuidar de si pode fazer parte de cuidar de outra pessoa.
  workUpright: >-
    No trabalho, esta carta pode refletir funções que pedem empatia, como cuidado, ensino, trabalho criativo ou de apoio, ou simplesmente ser a pessoa em quem os colegas confiam. Ela pode convidar você a valorizar a inteligência emocional como uma habilidade real. Escutar bem pode moldar os resultados tanto quanto qualquer estratégia.
  workReversed: >-
    Invertida, a carta pode refletir o esgotamento emocional de ser o apoio de todo mundo no trabalho. Você pode notar onde assume o estresse dos outros como se fosse seu. Considere esclarecer o que cabe a você sustentar e o que não cabe, e encontrar pequenos jeitos de recuperar a energia ao longo do dia.
  growthUpright: >-
    No crescimento pessoal, a Rainha de Copas convida você a aprofundar a sua relação com a intuição e os sentimentos. Você pode ficar em silêncio com uma pergunta e notar o que surge antes de pensar a respeito. Práticas como escrever num diário ou passar um tempo perto da água podem ajudar você a escutar para dentro.
  growthReversed: >-
    Invertida, esta carta pode pedir que você estenda a compaixão a si. Você pode notar uma autocrítica que nunca dirigiria a uma pessoa amiga. Rotinas gentis, descanso e limites podem ajudar você a ter firmeza. Se os sentimentos ficarem intensos demais, procurar alguém de confiança pode oferecer apoio.
