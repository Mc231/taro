imageryNote: >-
  Uma figura a cavalo, em pleno galope, se inclina para a frente sobre um cavalo que empina ou salta, com o bastão erguido e a capa esvoaçando atrás. Colinas desérticas ou planícies abertas se estendem à frente, e pequenas formas de chama ou salamandras podem enfeitar a roupa. O cavalo que salta representa a paixão e o impulso; o bastão erguido, o propósito levado à ação; e a paisagem ampla, uma aventura ainda em curso. A inclinação para a frente sugere ao mesmo tempo coragem e pressa.
