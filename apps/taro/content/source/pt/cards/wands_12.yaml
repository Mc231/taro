shortUpright: >-
  Uma energia ousada e aventureira está pronta para se mover; você pode seguir a sua paixão sem tirar os olhos da estrada.
shortReversed: >-
  A energia pode estar correndo à frente da direção; talvez seja hora de segurar o galope e escolher para onde mirar.
meaningUpright: |-
  O Cavaleiro de Paus é o fogo em movimento. Montado num cavalo cheio de vida e com o bastão erguido, esta figura avança com paixão, confiança e gosto pela aventura. Enquanto o Valete se encanta, o Cavaleiro age.
  Essa energia pode aparecer como uma decisão repentina de viajar, uma onda de motivação para finalmente começar aquele projeto, ou a disposição de correr um risco que antes pareceria ousado demais. Ela pode trazer charme, coragem e um entusiasmo contagiante que arrasta outras pessoas junto.
  Esta carta convida você a confiar no seu impulso e deixar que ele leve você a territórios novos. O embalo é precioso, e às vezes o único jeito de descobrir aonde um caminho leva é partir. Ao mesmo tempo, um cavalo a galope pede alguém nas rédeas que saiba mais ou menos para onde vai. Você pode canalizar essa energia para uma aventura clara, mantendo atenção suficiente para se ajustar se o terreno mudar sob os seus pés.
meaningReversed: |-
  Invertido, o Cavaleiro de Paus pode refletir uma energia que corre mais rápido do que a direção. Você pode começar as coisas com pressa e perder o interesse no meio do caminho, agir por impulso e depois ter de lidar com as consequências, ou sentir frustração porque o seu impulso não tem para onde ir.
  Ele também pode apontar para uma paixão contida, com uma inquietação que cresce porque as circunstâncias fazem você esperar.
  Este pode ser um momento de perguntar para onde o seu fogo quer ir e o que ajudaria a chegar lá sem se esgotar. Você pode fazer uma pausa antes de uma grande decisão, terminar uma coisa antes de começar a próxima, ou encontrar uma saída saudável para a energia inquieta, como movimento, uma tarefa criativa ou uma conversa honesta sobre o que parece bloqueado.
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, esta carta pode refletir empolgação, atração e um senso de aventura: planos espontâneos, conversas intensas, vontade de fazer coisas juntos. Você pode aproveitar essa energia e também conferir se o ritmo funciona para todos os envolvidos. Aventuras compartilhadas tendem a ser mais ricas quando as duas pessoas têm voz na direção.
  relationshipsReversed: >-
    Com a carta invertida, sentimentos fortes podem andar mais rápido do que a comunicação, ou o entusiasmo pode esfriar tão rápido quanto chegou. Você pode notar se você ou alguém próximo está agindo por impulso sem conversar antes. Desacelerar para falar sobre o que cada pessoa realmente quer pode trazer firmeza a uma conexão cheia de faíscas.
  workUpright: >-
    No trabalho ou em um projeto, o Cavaleiro de Paus pode apontar para tomar uma iniciativa ousada: apresentar uma ideia ambiciosa, liderar um esforço, ou agir rápido diante de uma oportunidade. Você pode usar esse impulso para romper a inércia, fazendo também um plano simples para os passos que vêm depois da primeira onda de empolgação.
  workReversed: >-
    Com a carta invertida, você pode estar apressando decisões ou sentindo bloqueio e impaciência. Você pode conferir se a velocidade é mesmo necessária ou se uma breve pausa para planejar seria mais útil. Transformar a frustração numa lista clara de próximas ações pode ajudar a sua energia a avançar, e não a andar em círculos.
  growthUpright: >-
    A coragem e o apetite por experiências são dons que esta carta pede que você use. O que você faria se confiasse no seu próprio entusiasmo? Você pode tentar algo que amplia os seus limites e notar como é agir a partir da paixão, e não só da cautela.
  growthReversed: >-
    Com a carta invertida, você pode explorar a sua relação com o impulso. Quando a espontaneidade traz alegria, e quando deixa você com a energia dispersa? Aprender a fazer uma breve pausa antes de agir, sem perder a sua faísca, pode ajudar a sua energia a virar algo que você conduz, e não algo que conduz você.
reflectionQuestions:
  - "Onde você sente uma vontade forte de seguir em frente agora?"
  - >-
    Como o seu entusiasmo pode afetar as pessoas ao seu redor, para melhor ou nem tanto?
