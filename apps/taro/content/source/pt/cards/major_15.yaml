shortUpright: >-
  Um hábito ou um apego pode estar segurando você com mais força do que você percebe. Notar isso é o primeiro passo.
shortReversed: >-
  Um padrão que antes segurava firme pode estar afrouxando. O que ajudaria você a se afastar um pouco mais?
meaningUpright: |-
  O Diabo não fala do mal. É uma carta sobre os padrões e os apegos que podem nos prender, muitas vezes com o nosso consentimento silencioso. A sua imagem tradicional mostra duas figuras presas por correntes frouxas, e as correntes costumam estar soltas o bastante para sair. A carta pergunta: o que mantém você aqui, e quanto disso é escolha?
  No dia a dia, esta carta pode refletir rolar a tela até tarde da noite, dizer sim por medo de decepcionar alguém, buscar aprovação ou conforto de jeitos que deixam uma sensação de vazio depois, ou continuar numa rotina que já não serve porque sair parece incerto demais. Ela também pode apontar para as partes de você que você prefere não olhar, como inveja, ressentimento ou desejo, que tendem a ganhar força quando são ignoradas.
  Esta carta convida você a considerar o que tem mais poder sobre você do que você gostaria. Você pode se perguntar que necessidade um hábito está tentando atender, e se existe um jeito mais gentil de atendê-la. O Diabo destaca a consciência sem vergonha. Ver um padrão com clareza costuma ser o momento em que ele começa a afrouxar.
meaningReversed: |-
  Invertido, o Diabo pode refletir um afrouxamento. Um hábito, uma dinâmica de relacionamento ou uma crença que parecia inquebrável pode estar perdendo a força, e você pode começar a ver outras opções. Isso pode trazer alívio, junto com alguma incerteza sobre quem você é sem o padrão antigo.
  Esta carta também pode apontar para o trabalho de encarar a sua sombra: olhar com honestidade para sentimentos ou motivos difíceis e aceitá-los como parte de ser humano.
  Talvez valha notar os pequenos passos que você já deu para longe de algo que prendia você. O que os tornou possíveis? Manter esses apoios por perto, e pedir ajuda onde a atração ainda é forte, pode tornar a mudança mais duradoura. A liberdade muitas vezes cresce devagar, uma escolha de cada vez.
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, o Diabo pode refletir padrões de dependência, ciúme ou controle, de qualquer um dos lados, ou um vínculo mantido mais pelo hábito do que pelo cuidado. Ele pode convidar você a olhar com honestidade para o que mantém vocês conectados e se as duas pessoas se sentem livres. Dar nome a um padrão com gentileza pode abrir espaço para mudá-lo.
  relationshipsReversed: >-
    Invertida, esta carta pode apontar para se afastar de uma dinâmica pouco saudável ou para definir um limite que vinha sendo difícil de definir. Você pode considerar que apoio ajudaria você a manter esse limite. Ela também pode refletir um relacionamento ficando mais honesto à medida que sentimentos escondidos vêm à tona.
  workUpright: >-
    No trabalho ou em um projeto, o Diabo destaca a sensação de amarra a algo: longas jornadas, a necessidade de aprovação, ou uma função em que você continua principalmente por medo da mudança. Você pode se perguntar o que está ganhando com a situação e o que ela está custando, e se pequenas mudanças poderiam devolver a sensação de escolha.
  workReversed: >-
    Invertido, o Diabo pode refletir a libertação de um hábito de trabalho pouco útil, como o perfeccionismo ou a disponibilidade constante. Ele também pode apontar para o reconhecimento de uma pressão que você tinha normalizado. Você pode proteger essa nova liberdade com um limite claro, como um horário de encerrar o dia ou um limite para mensagens fora do expediente.
  growthUpright: >-
    O Diabo abre a porta para o trabalho com a sombra: explorar com delicadeza as partes de você que você tende a esconder. Você pode notar um hábito que parece compulsivo e perguntar, com curiosidade e sem julgamento, o que ele está tentando oferecer. A compreensão vem antes da mudança.
  growthReversed: >-
    Invertido, o Diabo pode refletir um avanço em afrouxar um apego antigo. Pode ser um momento de reconhecer o caminho que você já percorreu. Se hábitos ou sentimentos pesados continuam voltando, conversar com alguém de confiança ou com um profissional qualificado pode oferecer um apoio firme ao longo do caminho.
reflectionQuestions:
  - >-
    Que hábito tem mais domínio sobre você do que você gostaria, e que necessidade ele atende?
  - >-
    Em que relacionamento próximo você sente menos liberdade do que gostaria?
  - >-
    Que pequeno passo para longe de um padrão antigo você poderia dar nesta semana?
imageryNote: >-
  O Diabo do Taro é imaginado como uma figura sombria e com chifres, empoleirada acima de duas figuras menores, ligadas ao seu assento por correntes frouxas e caídas. As correntes aparecem claramente soltas em volta dos pulsos, convidando quem olha a notar que elas poderiam tirá-las. Uma luz fraca de tochas e tons terrosos profundos criam um clima pesado, enquanto uma passagem tênue de luz na borda da cena indica que existe outro caminho a ser encontrado.
