shortUpright: >-
  O movimento é possível quando você junta os seus diferentes impulsos e os aponta para uma só direção.
shortReversed: >-
  A energia pode estar puxando para vários lados ao mesmo tempo. Onde você poderia retomar as rédeas com calma?
meaningUpright: |-
  O Carro é a carta de seguir em frente com propósito. A sua imagem tradicional mostra dois animais puxando um veículo, muitas vezes de cores diferentes, como se cada um quisesse ir para um lado. A tarefa de quem conduz não é lutar contra eles, mas guiá-los juntos. Esse é o coração desta carta: transformar a tensão interior numa direção firme.
  No dia a dia, esta carta pode refletir uma semana em que você finalmente se compromete com um objetivo e persiste apesar das distrações: treinar para um evento, terminar um grande trabalho, mudar de casa ou fazer uma mudança da qual você fala há muito tempo. Ela pode apontar para a disciplina de equilibrar necessidades que competem entre si, como ambição e descanso, ou empolgação e cautela, sem deixar que uma vença por completo.
  Esta carta convida você a considerar aonde quer chegar e o que está tirando você do rumo. Você pode se perguntar como usar os sentimentos misturados como combustível, e não como freio. O Carro destaca o foco e a vontade, e também a proteção tranquila de se conhecer bem o bastante para conduzir.
meaningReversed: |-
  Invertido, o Carro pode refletir um movimento que travou ou se dispersou. Você pode ter a sensação de muita ocupação e pouco avanço, de estar entre objetivos demais, ou de não saber qual direção é realmente sua. As rédeas estão ali, mas podem parecer frouxas.
  Esta carta também pode apontar para um esforço excessivo: forçar o progresso só na base da força de vontade, ignorando sinais de que a rota pede ajustes. A força de vontade sozinha pode levar longe, mas cansa quando não vem acompanhada de clareza.
  Talvez valha fazer uma pausa e dar nome às forças que puxam você. Quais importam mais agora, e quais podem esperar? Escolher uma direção clara para os próximos dias, e se permitir deixar as outras de lado por um tempo, pode ajudar você a recuperar a firmeza no lugar de quem conduz.
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, o Carro pode refletir um senso de direção compartilhado: atravessar juntos um período corrido ou desafiador, cada um apoiando os objetivos do outro. Ele pode convidar vocês a conversar sobre para onde os dois estão indo e como manter o mesmo ritmo. Compromisso aqui se parece com esforço constante e incentivo mútuo.
  relationshipsReversed: >-
    Invertida, esta carta pode apontar para duas pessoas puxando para lados diferentes, ou para uma pessoa conduzindo enquanto a outra sente que só vai junto. Você pode considerar se está empurrando um relacionamento rumo a um objetivo antes de os dois estarem de acordo. Desacelerar para combinar o destino pode aliviar a tensão.
  workUpright: >-
    No trabalho ou em um projeto, o Carro destaca a garra e o esforço focado. Ele pode refletir uma fase de levar um projeto até a linha de chegada, competir de forma saudável ou manter uma equipe avançando junta. Você pode definir um objetivo claro, reunir os seus recursos e se dar um prazo realista, escolhido por você.
  workReversed: >-
    Invertido, o Carro pode refletir um projeto perdendo o ritmo ou a sensação de correr sem um plano claro. Ele também pode apontar para prioridades conflitantes vindas de pessoas diferentes. Você pode dar um passo atrás, esclarecer como seria de fato o sucesso, e decidir quais tarefas levam você até ele e quais só ocupam o seu tempo.
  growthUpright: >-
    No crescimento pessoal, esta carta convida você a praticar a autodireção. Saber o que você quer e manter juntos os seus diferentes humores e motivos é uma habilidade. Você pode escolher um objetivo significativo e notar como se mantém no rumo, celebrando cada pequeno trecho de estrada percorrido.
  growthReversed: >-
    Invertido, o Carro pode perguntar se você está se cobrando demais ou deixando que outros definam o seu rumo. Pode ser um convite para se reconectar com os seus próprios motivos para ir aonde está indo. Você pode fazer uma pausa consigo a cada manhã e perguntar qual direção parece realmente sua hoje.
reflectionQuestions:
  - >-
    Quais duas partes de você estão puxando para lados diferentes agora?
  - >-
    Quem está viajando ao seu lado, e como vocês estão se apoiando?
  - >-
    Com qual direção você poderia se comprometer nos próximos dias?
imageryNote: >-
  O Carro do Taro é imaginado como uma figura conduzindo uma carroça pequena e robusta por uma estrada litorânea, puxada por dois animais de temperamentos opostos, um calmo e outro inquieto. Quem conduz segura as rédeas com leveza, guiando com atenção, não com força. Uma cobertura em forma de concha sobre o assento pode remeter a Câncer e à proteção que permite seguir em frente com segurança, enquanto a estrada aberta e as luzes do porto ao longe sugerem um destino escolhido, não imposto.
