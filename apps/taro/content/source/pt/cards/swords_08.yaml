meaningUpright: |-
  O Oito de Espadas mostra uma figura cercada de lâminas, com os olhos vendados e as mãos atadas sem firmeza. Olhando de perto, há uma abertura no círculo, e as amarras não estão muito apertadas. Esta carta fala da experiência de sentir que não há saída quando parte da armadilha é feita de pensamentos.
  Você pode reconhecê-la numa situação em que toda opção parece bloqueada, em que você diz "não consigo" antes de tentar, ou em que o medo de errar deixa você completamente sem ação. Limitações reais existem, e esta carta não as ignora. Ela apenas pergunta se algumas das paredes são crenças que você ainda não questionou: que você não tem escolha, que ninguém ajudaria, que é tarde demais para mudar.
  Esta carta convida você a testar um limite com delicadeza. Você pode anotar os pensamentos que mantêm você no lugar e se perguntar quais são fatos e quais são medos. Às vezes dar nome a uma crença basta para afrouxá-la. Que pequeno passo você daria se supusesse que existe um pouco mais de espaço do que imagina?
meaningReversed: |-
  Invertido, o Oito de Espadas pode refletir uma sensação de libertação. A venda escorrega e o círculo parece menos fechado do que antes. Você pode estar notando opções que não conseguia ver, ou sentindo que é hora de sair de uma situação em que estava sem saída.
  Outra leitura é a força dos velhos padrões: justo quando você começa a se mover, dúvidas conhecidas voltam e tentam puxar você de volta para o círculo. Isso é uma parte comum da mudança, não um fracasso.
  Você pode se perguntar o que ajudou você a conquistar um pouco de liberdade, e como fazer mais disso. O apoio de outras pessoas, informações novas ou simplesmente a prática podem manter as amarras frouxas. Que crença você está em condições de deixar de lado, e o que gostaria de colocar no lugar dela?
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, esta carta pode refletir uma sensação de impasse: não conseguir dizer o que você quer, ou viver um papel que já ficou pequeno. Ela também pode mostrar como suposições sobre o que os outros pensam mantêm você em silêncio. Você pode conferir uma dessas suposições diretamente, com uma pergunta gentil. Muitas vezes as pessoas estão mais abertas à mudança do que os nossos medos sugerem.
  relationshipsReversed: >-
    Invertido, o Oito de Espadas pode apontar para uma nova liberdade num vínculo: finalmente falar, definir um limite ou ver uma dinâmica conhecida com outros olhos. Você pode notar onde velhos medos ainda tentam silenciar você. Praticar pequenos gestos de honestidade pode ajudar a nova perspectiva a se firmar no seu jeito de se relacionar.
  workUpright: >-
    No trabalho, esta carta pode refletir a sensação de falta de espaço diante de expectativas, regras ou da crença de que lhe faltam habilidades para mudar a situação. Alguns limites podem ser reais. Você pode listar as opções que descartou e olhar de novo para uma delas. Uma conversa com um mentor ou com uma pessoa amiga pode revelar caminhos que você não tinha considerado.
  workReversed: >-
    Invertida, esta carta pode sugerir sair da rotina: tentar uma nova abordagem, pedir responsabilidades diferentes ou soltar uma velha história sobre aquilo de que você é capaz. Você pode notar uma faísca de insegurança enquanto se move. Trate-a como um sinal de crescimento, e não como um motivo para parar.
  growthUpright: >-
    No crescimento pessoal, o Oito de Espadas convida você a notar a voz interior que diz que você não consegue. Você pode perguntar com delicadeza onde essa voz aprendeu as suas regras. Questionar uma crença não significa se forçar a passar por cima de todo medo; significa se dar permissão para procurar a abertura no círculo.
  growthReversed: >-
    Invertida, esta carta pode refletir um afrouxamento real de pensamentos limitantes. Você pode marcar o progresso que fez, por menor que seja, e praticar o novo olhar com regularidade para que ele se fortaleça. Quando as velhas dúvidas voltarem, você pode recebê-las com curiosidade, e não com rendição.
