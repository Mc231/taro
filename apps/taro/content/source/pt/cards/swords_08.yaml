imageryNote: >-
  Na arte original, uma figura está de pé num chão macio de brejo, dentro de um círculo frouxo de lâminas fincadas na terra. Uma fita fina cobre os olhos e outra cai sobre os pulsos sem estar amarrada. Atrás da figura, o círculo está aberto, e um caminho leva a colinas distantes. As fitas sugerem limites que podem ser afrouxados, e a abertura aponta para opções ainda não vistas.
