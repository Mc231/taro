imageryNote: >-
  A arte pode reunir pessoas de idades diferentes sob um arco que leva a uma casa ou a um pátio, com animais descansando por perto e dez moedas dispostas num desenho pela cena. O arco pode simbolizar a passagem entre a vida privada e a vida compartilhada; a mistura de idades, a continuidade; e as moedas em padrão, uma estrutura construída ao longo do tempo. Cores quentes e assentadas podem sugerir pertencimento, enquanto a composição movimentada indica a complexidade que existe dentro de toda casa.
