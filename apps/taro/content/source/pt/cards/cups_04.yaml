imageryNote: >-
  A arte coloca uma figura sentada sob uma árvore ou ao lado de águas paradas, de braços cruzados, com o olhar baixo voltado para três cálices no chão. Um quarto cálice se aproxima levado pela brisa ou boia na superfície da água, fácil de passar despercebido. Cores apagadas e uma postura fechada podem sugerir introspecção e a vontade de uma pausa, enquanto o cálice oferecido mantém à vista um fio de possibilidade.
