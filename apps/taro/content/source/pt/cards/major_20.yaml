shortUpright: >-
  Um momento para olhar para trás com honestidade, perdoar o que puder e atender ao que chama você para a frente.
shortReversed: >-
  O crítico interior pode estar mais alto do que o normal. O que um olhar justo e gentil sobre o seu passado mostraria?
meaningUpright: |-
  O Julgamento é uma carta de despertar e renovação. Ele fala menos de ser julgado pelos outros e mais de chegar a um ponto de autorreflexão honesta: olhar para onde você esteve, levar consigo o que aprendeu e sentir que é hora de se erguer para um novo capítulo. Muitas vezes há a sensação de um chamado, um impulso interior que diz que chegou a hora.
  No dia a dia, esta carta pode refletir um momento de clareza depois de um longo período de confusão, a decisão de finalmente ir atrás de algo que você vinha adiando, ou um acerto de contas com uma escolha do passado que ajuda você a seguir em frente. Ela pode apontar para o perdão, a você ou a outra pessoa, e para o alívio de ver a sua história sob uma luz mais completa e mais justa.
  Esta carta convida você a considerar o que está chamando você agora. Você pode se perguntar o que faria se confiasse que as suas experiências passadas prepararam você para isso. O Julgamento destaca a renovação por meio da compreensão: quando você consegue olhar para a sua história com honestidade e compaixão, pode descobrir mais liberdade para escolher o que vem a seguir.
meaningReversed: |-
  Invertido, o Julgamento pode refletir um crítico interior severo. Você pode estar repassando erros antigos, duvidando do seu valor ou hesitando em seguir em frente por causa de algo do passado. O chamado está ali, mas a culpa ou o medo podem estar abafando a sua voz.
  Esta carta também pode apontar para a fuga total da reflexão: passar de uma coisa para outra sem parar para aprender com o que aconteceu.
  Talvez valha olhar para o seu passado com a mesma justiça que você ofereceria a uma pessoa amiga. O que você aprendeu, e o que está em condições de deixar de lado? Escrever uma carta de compreensão para o seu eu mais jovem pode ser um jeito de começar. Atender ao chamado não exige perfeição; pode começar com um único passo honesto.
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, o Julgamento pode refletir um ponto de virada: a limpeza de mágoas antigas, um compromisso renovado ou um acerto de contas mútuo que aproxima vocês. Ele pode convidar vocês a conversar com honestidade sobre o passado e decidir juntos o que querem daqui para a frente. O perdão, quando fizer sentido, pode abrir espaço para um novo começo.
  relationshipsReversed: >-
    Invertida, esta carta pode apontar para culpas ou julgamentos que persistem num relacionamento, de um lado ou dos dois. Você pode considerar se guardar mágoas antigas ainda protege você, ou se está prendendo você no mesmo lugar. Uma conversa aberta e calma pode ajudar as duas pessoas a ver as coisas de forma mais justa.
  workUpright: >-
    No trabalho ou em um projeto, o Julgamento destaca um senso de vocação. Ele pode refletir a percepção de que tipo de trabalho parece significativo, ou a revisão de projetos passados para decidir o que vem a seguir. Você pode prestar atenção ao que entusiasma você e se perguntar como as suas habilidades poderiam servir a essa direção.
  workReversed: >-
    Invertido, o Julgamento pode refletir o medo de críticas segurando você, ou o hábito de ignorar a sensação de que é hora de mudar. Ele também pode apontar para uma crítica dura demais ao seu desempenho passado. Você pode listar o que aprendeu e como isso poderia guiar o seu próximo passo.
  growthUpright: >-
    Uma revisão cuidadosa do caminho percorrido até aqui pode ser, por si só, um ponto de virada. Você pode olhar para trás sobre um período importante, notando como cresceu e do que abriu mão. Essa perspectiva pode ajudar você a atender a um novo chamado com confiança e clareza.
  growthReversed: >-
    Invertido, o Julgamento pode perguntar se você está carregando uma culpa ou uma autocobrança desnecessária. Ele pode refletir a necessidade de soltar velhas histórias sobre você. Você pode praticar notar quando a sua voz interior fica dura e, com gentileza, oferecer a si um olhar mais justo. Uma voz interior mais justa pode deixar o crescimento mais leve e mais possível.
reflectionQuestions:
  - "O que parece estar chamando você para a frente agora?"
  - >-
    Há alguém, incluindo você, que você já consegue ver de forma mais justa?
  - >-
    Que lição do passado você gostaria de levar para o seu próximo capítulo?
imageryNote: >-
  O Julgamento do Taro é imaginado como uma ampla paisagem ao amanhecer depois de um longo inverno, em que um sino claro toca do alto de uma colina e as pessoas saem de casa para a primeira luz, se espreguiçando e olhando para cima. A neve derretendo revela brotos verdes por baixo. Uma janela aberta, com as cortinas voando para fora, sugere um chamado interior sendo atendido. Montanhas distantes indicam a perspectiva que a reflexão honesta traz, e as cores pálidas da manhã falam de renovação.
