  growthUpright: >-
    No crescimento pessoal, esta carta convida você a tratar o desenvolvimento pessoal como um ofício. Práticas pequenas e repetidas, seja escrever num diário, alongar o corpo, ler ou refletir, podem moldar quem você se torna. Você pode escolher uma prática e se comprometer com ela com gentileza, prestando atenção ao processo sem correr atrás de um resultado.
