  relationshipsReversed: >-
    Invertida, a carta pode sugerir um vínculo funcionando na rotina, com o cuidado expresso mais por hábito do que por atenção. Ela também pode refletir um esforço tão grande para acertar que a leveza desaparece. Você pode trazer de volta um pouco de curiosidade: perguntar algo novo, tentar um jeito diferente de passar o tempo, ou relaxar os seus critérios de como as coisas deveriam ser.
  workUpright: >-
    No trabalho, o Oito de Ouros destaca a dedicação e a construção de habilidades. Você pode estar numa fase de aprendizado, uma espécie de aprendizagem de ofício, ou simplesmente aproveitando a satisfação de fazer um bom trabalho. Você pode buscar retorno, proteger um tempo para foco profundo e notar o quanto a sua competência cresceu com a prática constante.
