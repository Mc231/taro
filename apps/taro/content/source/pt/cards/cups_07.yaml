imageryNote: >-
  A arte mostra uma figura, vista de costas, diante de sete cálices que pairam numa névoa que se move. Cada cálice guarda um símbolo diferente, talvez uma chave, uma guirlanda, uma casinha, uma estrela, uma forma enrolada, uma caixa fechada e um espelho, representando acesso, elogio, segurança, esperança, inquietação, segredos e autoimagem. Uma luz suave, como de sonho, e cores que mudam podem sugerir o quanto essas visões são sedutoras e incertas, convidando quem olha a se perguntar qual delas é real.
