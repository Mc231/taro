imageryNote: >-
  A Estrela do Taro é imaginada como uma cena noturna num jardim de terraço, em que uma figura rega plantas jovens com um jarro enquanto uma estrela brilhante aparece por uma brecha nas nuvens. Barris de chuva e um pequeno lago recolhem o que o céu devolve. Mariposas voando em volta de uma lanterna podem representar pensamentos atraídos pela luz. Azuis frios e tons de prata criam uma sensação de calma, abertura e renovação suave depois que a tempestade passou.
