  workUpright: >-
    No trabalho ou em um projeto, a Estrela destaca a inspiração e o senso de propósito. Ela pode refletir o reencontro com o motivo pelo qual você faz o que faz, ou uma energia nova depois de um contratempo. Você pode dar tempo a um objetivo de longo prazo ou a uma ideia criativa que traz esperança a você.
