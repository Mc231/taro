  relationshipsReversed: >-
    Invertida, a carta pode sugerir um relacionamento que parece rotineiro demais, ou uma cautela que impede você de expressar sentimentos. Você pode trazer uma pequena mudança ao tempo que passam juntos, ou compartilhar algo que costuma deixar no prático e no não dito. Previsibilidade e calor podem conviver quando as duas pessoas cuidam deles.
  workUpright: >-
    No trabalho, o Cavaleiro de Ouros pode descrever um progresso dedicado e metódico. Você pode ser a pessoa que cumpre o combinado, confere os detalhes e mantém os projetos andando. Você pode reconhecer o valor dessa contribuição e cuidar para que o seu ritmo e a sua carga de trabalho continuem sustentáveis ao longo do tempo.
  workReversed: >-
