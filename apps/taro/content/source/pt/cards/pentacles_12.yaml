  growthUpright: >-
    No crescimento pessoal, esta carta convida você a valorizar o esforço lento e constante. Hábitos construídos dia após dia muitas vezes duram mais do que resoluções dramáticas. Você pode escolher uma rotina simples que apoie você e mantê-la por um período definido, notando como a constância molda a sua confiança em si.
