imageryNote: >-
  A arte pode mostrar uma figura montada, sentada com calma num cavalo robusto e parado, segurando uma única moeda e olhando para campos arados. O cavalo parado pode simbolizar paciência e resistência; a terra sulcada, o trabalho metódico já feito; e o olhar nivelado, a atenção constante ao que vem pela frente. Tons escuros e sólidos e formas pesadas podem reforçar a confiabilidade, com uma sugestão de como a quietude às vezes vira inércia.
