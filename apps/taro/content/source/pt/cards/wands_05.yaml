meaningUpright: |-
  O Cinco de Paus mostra energias se chocando. Vários bastões se cruzam e batem uns nos outros, e é difícil saber se é uma briga de verdade, uma brincadeira ou um treino. Essa ambiguidade é o coração da carta: o mesmo atrito pode parecer desgastante ou revigorante, dependendo de como é conduzido.
  Você pode reconhecê-lo numa reunião em que todo mundo fala ao mesmo tempo, numa casa compartilhada discutindo a divisão das tarefas, num trabalho em grupo com direções demais, ou simplesmente numa mente cheia de prioridades que competem entre si. Pode haver ambição, orgulho e boas ideias na mistura, todas puxando para lados diferentes.
  Esta carta convida você a olhar para o tipo de conflito em que está. Ele está ajudando cada ideia a ficar mais forte, ou virou uma disputa para marcar pontos? Você pode tentar desacelerar a troca, nomear um objetivo comum ou combinar regras simples para que a energia da discordância se torne útil, e não exaustiva. Às vezes, dar um passo atrás por um momento mostra onde está de fato o desacordo.
meaningReversed: |-
  Invertido, o Cinco de Paus pode apontar para uma mudança no jeito de lidar com o conflito. A tensão pode estar diminuindo à medida que as pessoas encontram um ponto em comum, ou pode simplesmente estar sendo escondida, com desacordos não ditos para manter a paz.
  Ele também pode se voltar para dentro, como um cabo de guerra entre partes diferentes de você: a parte que quer descansar e a parte que quer insistir, ou dois planos que não dá para seguir ao mesmo tempo.
  Este pode ser um momento de notar se a calma é real ou só de superfície. Evitar toda discussão pode deixar necessidades importantes sem escuta, enquanto uma conversa justa pode limpar o ar. Você pode se perguntar qual desacordo, dentro ou ao redor de você, ganharia com um olhar paciente e honesto, e o que tornaria essa conversa segura.
aspects:
  relationshipsUpright: >-
    Nos vínculos próximos, esta carta pode refletir implicâncias, rivalidade brincalhona ou pequenas discordâncias repetidas. Nem todo atrito é sinal de problema; ele pode mostrar que as duas pessoas se importam e têm opiniões fortes. Você pode notar se está escutando para entender ou esperando a sua vez de responder, e tentar nomear o que vocês dois querem antes de debater como chegar lá.
  relationshipsReversed: >-
    Com a carta invertida, uma discordância pode estar esfriando, ou pode ter silenciado sem ser resolvida. Você pode considerar se o silêncio está dando espaço a vocês dois ou apenas evitando um assunto que importa. Um momento calmo pode ser uma boa hora para voltar a ele com delicadeza, com curiosidade sobre o lado da outra pessoa.
  workUpright: >-
    No trabalho ou numa equipe, o Cinco de Paus pode apontar para competição, um caos de ideias ou papéis pouco claros. A energia está alta, mas pode estar dispersa. Você pode ajudar a canalizá-la esclarecendo o objetivo, propondo que cada um fale na sua vez ou sugerindo um jeito simples de decidir. Um debate saudável pode levar a um plano mais forte quando todos se sentem ouvidos.
  workReversed: >-
    Com a carta invertida, o conflito no trabalho pode estar virando cooperação, ou pode estar fervendo por baixo de superfícies educadas. Você pode procurar os desacordos não ditos que atrasam as coisas. Convidar opiniões honestas, ou encontrar um ponto em comum numa pequena decisão, pode ajudar a transformar a tensão silenciosa em energia de trabalho de novo.
  growthUpright: >-
    Os desafios podem ser tratados como prática, e não como prova de alguma coisa. O atrito pode mostrar onde as suas opiniões são firmes, onde são flexíveis e onde você sente vontade de provar algo. Você pode notar o que desperta o seu lado competitivo e o que ele está tentando proteger.
