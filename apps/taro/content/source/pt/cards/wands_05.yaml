    Com a carta invertida, a disputa pode ser interna: desejos, valores ou planos em conflito que impedem você de se firmar num rumo. Você pode explorar cada lado por escrito, dando a cada um uma voz justa. Vê-los lado a lado pode facilitar encontrar um caminho que respeite mais de uma das suas necessidades.
