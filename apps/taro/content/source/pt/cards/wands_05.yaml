imageryNote: >-
  Cinco figuras, cada uma com um bastão, estão bem próximas, com os bastões erguidos em ângulos que se cruzam. A cena é animada e um pouco caótica, mas ninguém parece ferido, o que a deixa em aberto entre uma disputa real e um jogo de treino. O emaranhado de bastões cruzados pode simbolizar ideias e ambições empurrando umas às outras, e o terreno aberto ao redor sugere espaço para dar um passo atrás e encontrar um ritmo comum.
