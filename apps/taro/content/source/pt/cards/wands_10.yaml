imageryNote: >-
  Uma figura caminha curvada para a frente, com os braços em volta de um feixe alto de dez bastões que quase esconde o seu rosto, indo em direção a uma pequena casa ou cidade no horizonte. O feixe representa as responsabilidades acumuladas; o rosto escondido, o jeito como uma carga pesada pode estreitar o olhar; e o destino próximo, um fim que está ao alcance. A estrada aberta deixa espaço para imaginar a carga sendo dividida ou deixada no chão.
