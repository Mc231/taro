meaningUpright: |-
  O Dez de Paus mostra alguém carregando um grande feixe de bastões, com os braços em volta deles e a cabeça baixa, caminhando em direção a uma casa ao longe. O fogo que começou como uma única faísca se multiplicou em muitos compromissos, e cada um exige esforço para ser sustentado.
  Esta carta costuma aparecer quando as responsabilidades foram se acumulando aos poucos: um projeto que não parava de crescer, uma função que absorveu tarefas extras, cuidar dos outros enquanto tenta manter vivos os próprios planos. Muito disso pode ter começado com entusiasmo ou senso de dever, e pode ser difícil lembrar quando ficou tão pesado.
  Esta carta convida você a olhar com honestidade para o que está segurando. Quais responsabilidades são suas, e quais caíram em você por falta de outra pessoa? Quais ainda se ligam a algo que importa para você? O destino pode estar perto, mas você ainda pode se perguntar se daria para carregar isso de outro jeito: em cargas menores, com ajuda, ou deixando algumas coisas pelo caminho.
meaningReversed: |-
  Invertido, o Dez de Paus pode apontar para um momento de alívio. Você pode estar começando a largar responsabilidades que nunca foram suas, a delegar, ou a dizer não a pedidos que acrescentariam mais peso. Pode haver alívio em perceber que não é obrigatório carregar tudo de uma vez.
  Ele também pode refletir o padrão oposto voltado para dentro: insistir em fazer tudo por conta própria, mesmo quando há ajuda disponível, porque pedir parece mais difícil do que lutar.
  Este pode ser um bom momento para organizar a sua carga. Você pode listar o que está carregando e marcar o que poderia ser dividido, adiado ou abandonado. Pequenas mudanças, como uma tarefa delegada ou um convite recusado, podem fazer uma diferença real. Soltar não é fracassar; pode ser um jeito de guardar a sua energia para o que mais importa.
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, esta carta pode refletir um desequilíbrio em quem carrega o quê: uma pessoa cuidando da maior parte do planejamento, das preocupações ou do trabalho emocional. Você pode notar se a carga parece justa e conversar sobre isso abertamente. Dividir o peso pode aproximar as pessoas, enquanto carregar demais em silêncio costuma gerar ressentimentos discretos.
  relationshipsReversed: >-
    Com a carta invertida, você pode estar aprendendo a pedir ajuda ou a se afastar de papéis que assumiu pelos outros. Isso pode parecer desconfortável no começo. Você pode considerar quais responsabilidades gostaria de dividir e como pedir de um jeito que convide à cooperação, sem esperar o cansaço chegar a ponto de nem conseguir pedir.
  workUpright: >-
    No trabalho ou nos estudos, o Dez de Paus pode apontar para compromissos demais: mais tarefas do que tempo, ou um projeto que cresceu além da sua forma inicial. Você pode fazer um balanço dos seus compromissos, esclarecer prioridades com as pessoas envolvidas e procurar o que pode ser simplificado. Terminar bem muitas vezes depende de carregar menos de cada vez.
  workReversed: >-
    Com a carta invertida, você pode estar começando a definir limites, delegar ou renegociar prazos, ou pode estar resistindo a fazer isso. Você pode identificar uma tarefa que outra pessoa poderia assumir, ou um compromisso que poderia recusar. Abrir espaço na sua carga de trabalho pode devolver tanto o foco quanto o entusiasmo que deu início ao trabalho.
  growthUpright: >-
    Uma crença que vale questionar aqui é a de que você tem de dar conta de tudo por conta própria. De onde veio essa crença? Você pode notar como o seu corpo e o seu humor respondem a uma carga pesada, e tratar esses sinais como informação sobre o que pede mudança.
  growthReversed: >-
    Com a carta invertida, você pode estar descobrindo a leveza que vem de largar alguma coisa. Você pode explorar o que quer continuar carregando porque dá sentido, e o que já está em condições de soltar. Escolher as suas responsabilidades, no lugar de simplesmente aceitá-las, pode ser um ato silencioso de respeito por você.
reflectionQuestions:
