meaningUpright: |-
  O Sete de Espadas mostra alguém saindo de fininho com mais do que lhe foi dado, olhando para trás para ver se alguém percebeu. É uma carta de estratégia, esperteza e de seguir por conta própria. Às vezes isso é desenvoltura; às vezes é um jeito de evitar um caminho mais difícil e mais honesto.
  Você pode reconhecer esta carta num atalho que tem vontade de pegar, numa conversa que está evitando ao contornar alguém em silêncio, ou num plano que guardou só para você. Ela pode refletir a sensação de que você tem de resolver as coisas sem ajuda porque pedir seria complicado demais. Também pode apontar para a suspeita de que algo não está totalmente às claras numa situação ao seu redor, sem que você tenha certeza.
  Esta carta convida você a considerar o que o segredo ou o esforço solitário está protegendo. A independência pode ser sábia, e nem todo plano pede plateia. Ainda assim, você pode se perguntar se este caminho combina com os seus valores, e quanto custa mantê-lo escondido. Seria possível chegar ao mesmo objetivo de um jeito sobre o qual você conseguisse falar abertamente?
meaningReversed: |-
  Invertido, o Sete de Espadas pode refletir um plano escondido perdendo a força. Manter algo em segredo pode ter ficado mais cansativo do que vale a pena, ou você pode sentir que é hora de compartilhar o que vinha carregando sem ajuda. Abrir o jogo, mesmo que em parte, pode trazer um alívio inesperado.
  Outra leitura é voltada para dentro: a história que você conta para si para evitar uma verdade desconfortável. O autoengano pode ser sutil, como se convencer de que um problema cabe a outra pessoa resolver.
  Você pode se perguntar onde um pouco mais de abertura tornaria a sua situação mais simples. Isso pode significar admitir um erro, pedir a ajuda que você vem evitando pedir, ou repensar uma estratégia que depende de ninguém perceber. O que mudaria se você deixasse uma pessoa de confiança ver o quadro inteiro?
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, esta carta pode refletir algo não dito: uma decisão tomada em silêncio, uma necessidade atendida em outro lugar, ou a sensação incômoda de que nem tudo está sendo compartilhado. Ela não acusa ninguém. Você pode considerar onde a abertura parece arriscada e por quê. Uma curiosidade gentil, no lugar da desconfiança, tende a convidar à honestidade, dos outros e sua.
  relationshipsReversed: >-
    Invertido, o Sete de Espadas pode apontar para verdades vindo à luz ou para a vontade de ter mais transparência com alguém próximo. Você pode sentir que é hora de dizer o que vinha guardando. Se outra pessoa se abrir com você, escutar sem julgar de imediato pode tornar a reparação possível. A confiança muitas vezes cresce quando a honestidade é recebida com cuidado.
  workUpright: >-
    No trabalho, esta carta pode refletir contornar um sistema no lugar de passar por ele, ficar com o crédito em silêncio, ou carregar uma tarefa sem ajuda para não ter de se coordenar com os outros. A desenvoltura tem valor. Você pode se perguntar se a sua abordagem se sustentaria se todos pudessem vê-la, e se uma conversa direta poderia levar você mais longe com menos desgaste.
  workReversed: >-
    Invertida, esta carta pode sugerir repensar uma estratégia que depende de passar despercebida, ou finalmente compartilhar informações que você guardava. Você pode pedir ajuda com algo que vem enfrentando por conta própria. Falar abertamente cedo sobre um atalho ou um erro pode ser bem mais fácil do que administrá-lo depois.
  growthUpright: >-
    No crescimento pessoal, o Sete de Espadas convida você a olhar para quando você segue por conta própria e por quê. A autossuficiência pode ser uma força, e também pode ser um jeito de evitar a vulnerabilidade. Você pode notar situações em que escolhe a esperteza no lugar da franqueza, e experimentar pedir com clareza o que você quer.
  growthReversed: >-
    Invertida, esta carta pode refletir uma honestidade crescente consigo. Você pode flagrar uma história conveniente que vem contando e questioná-la com delicadeza. A honestidade consigo não exige dureza; significa simplesmente se permitir ver com clareza. O que você faria de outro jeito se parasse de arranjar explicações para esta situação?
