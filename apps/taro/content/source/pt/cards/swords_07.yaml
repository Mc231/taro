imageryNote: >-
  A arte original mostra uma figura atravessando na ponta dos pés um campo iluminado pela lua, carregando um punhado de lâminas enquanto algumas ficam de pé na grama atrás. Tendas ao longe brilham suavemente, sem perceber nada. Uma trilha de pegadas mostra o caminho feito. O punhado sugere pegar mais do que foi oferecido, as lâminas que ficaram indicam o que não dá para carregar, e o olhar para trás aponta para o desconforto de agir sem ser visto.
