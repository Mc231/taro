  Na arte original, uma figura sentada segura duas lâminas cruzadas junto ao peito, com um pano macio sobre os olhos. Uma lua crescente pálida está baixa sobre uma água calma e rasa, salpicada de pedras. As lâminas cruzadas formam uma figura defensiva, como uma porta mantida fechada. A água parada e a luz da noite sugerem emoções descansando sob a superfície, e os olhos cobertos apontam para a escolha de ainda não olhar.
