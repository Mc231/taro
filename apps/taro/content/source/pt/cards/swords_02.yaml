  relationshipsReversed: >-
    Invertido, o Dois de Espadas pode refletir o fim de uma trégua. Sentimentos guardados podem vir à tona, ou alguém pode pedir que você finalmente diga qual é a sua posição. Isso pode ser desconfortável, e também pode abrir espaço para mais honestidade. Você pode compartilhar o que vem guardando em pedaços pequenos e claros, e não tudo de uma vez.
  workUpright: >-
    No trabalho, esta carta pode refletir uma decisão em espera: duas abordagens, dois pedidos do seu tempo ou duas prioridades que parecem igualmente urgentes. Esperar pode ser sensato se faltam fatos. Você pode listar o que cada opção pediria de você e o que daria, e notar qual lista você está evitando. Essa relutância também pode ser uma informação útil.
