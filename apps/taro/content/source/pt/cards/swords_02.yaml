  growthUpright: >-
    No crescimento pessoal, o Dois de Espadas convida você a notar como se protege de sentimentos difíceis pela imobilidade. A quietude pode descansar; também pode ser um jeito de não sentir. Você pode tentar ficar alguns minutos com cada opção e prestar atenção à resposta do seu corpo, além do seu raciocínio. Os dois tipos de saber importam.
