imageryNote: >-
  A arte se concentra num único cálice transbordando, com a água caindo em vários fios finos num lago parado embaixo. Lírios-d'água ou folhas de lótus na superfície podem representar sentimentos que se abrem devagar e criam raízes em lugares profundos. Uma luz suave acima do cálice pode sugerir receptividade, uma oferenda estendida, e não agarrada. O clima geral é de uma abundância calma: mais do que o suficiente, transbordando com suavidade.
