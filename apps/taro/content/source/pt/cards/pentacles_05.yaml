imageryNote: >-
  A arte pode mostrar duas figuras atravessando a neve ou a chuva junto a um muro, com a cabeça baixa contra o tempo, enquanto acima delas uma janela brilha com cinco moedas no seu desenho. O contraste entre o caminho frio e a janela iluminada pode simbolizar a dificuldade ao lado de um abrigo próximo. A posição da janela, um pouco fora do campo de visão das figuras, sugere um apoio que está presente, mas ainda não foi notado nem buscado.
