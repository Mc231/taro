imageryNote: >-
  A arte original mostra uma figura sentada num trono alto de pedra numa crista de montanha, com a lâmina perfeitamente erguida e o rosto voltado diretamente para quem olha. Nuvens finas e ordenadas se estendem por um céu pálido, e dois pássaros voam em linhas paralelas no alto. A lâmina erguida sugere princípios firmes, o olhar direto aponta para a honestidade, e o céu ordenado indica uma mente que encontrou a sua calma.
