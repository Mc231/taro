imageryNote: >-
  O Hierofante do Taro é imaginado como um mestre num pátio tranquilo, sentado num banco de pedra gasto sob uma árvore antiga, com um pequeno círculo de ouvintes de idades diferentes. Uma chave pesada pende do cinto, símbolo do entendimento transmitido pelo estudo e pela prática. Livros empilhados no banco e um sino no arco acima sugerem ritual e aprendizado compartilhados. Um portão aberto no outro lado do pátio indica que todo ensinamento pode levar a algum lugar novo.
