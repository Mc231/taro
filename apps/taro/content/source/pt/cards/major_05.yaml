shortUpright: >-
  Pode haver sabedoria no caminho que outros já percorreram. Que tradição ou mestre poderia ajudar agora?
shortReversed: >-
  Uma regra herdada pode não servir mais. Esta carta convida você a colocá-la à prova diante do que você valoriza.
meaningUpright: |-
  O Hierofante é a carta do conhecimento compartilhado: os jeitos de fazer as coisas que uma comunidade passa de uma geração para a outra. Ele pode representar professores, mentores, instituições, rituais e códigos de conduta, tudo o que ajuda as pessoas a aprender juntas e a sentir que fazem parte de algo maior.
  No dia a dia, esta carta pode refletir entrar numa turma, seguir uma receita passada de geração em geração na família, pedir orientação a um colega experiente ou marcar uma etapa com uma cerimônia conhecida. Ela pode apontar para o conforto de não ter de inventar tudo por conta própria. As tradições carregam as lições de muitas pessoas, e muitas vezes há bom senso nelas.
  Esta carta convida você a considerar o que você herdou e o que você escolheu. Você pode se perguntar quais valores em comum dão estabilidade à sua vida, e com quem poderia aprender agora. O Hierofante não fala de obediência cega; ele destaca o valor de aprender bem uma forma, seja para mantê-la, adaptá-la ou um dia transmiti-la com as suas próprias palavras.
meaningReversed: |-
  Invertido, o Hierofante pode refletir uma distância crescente das regras ou expectativas com as quais você cresceu. Algo que antes parecia certo pode agora parecer estreito demais, ou você pode sentir que vem seguindo um roteiro mais por hábito do que por convicção.
  Esta carta também pode apontar para a inclinação oposta: rejeitar toda convenção com tanta firmeza que você perde o que ainda poderia ser útil nela. Questionar é saudável; costuma funcionar melhor quando nasce da curiosidade, e não da reação.
  Talvez valha olhar para uma expectativa que pesa e perguntar de onde ela veio. Ela ainda reflete os seus valores, ou os de outra pessoa? Encontrar o próprio caminho pode incluir manter as partes que ainda servem a você e soltar, com respeito, as que não servem mais.
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, o Hierofante pode refletir valores em comum, compromissos e os rituais que mantêm as pessoas unidas: tradições de família, aniversários, ligações semanais. Ele pode convidar você a notar aquilo em que você e alguém próximo acreditam, e como vocês honram isso. A orientação de uma amizade de confiança ou de alguém mais velho também pode ajudar agora.
  relationshipsReversed: >-
    Invertida, esta carta pode apontar para uma tensão entre o que se espera de um relacionamento e o que de fato parece verdadeiro para as pessoas que fazem parte dele. Você pode considerar se está seguindo normas de fora que não combinam com a sua situação. Uma conversa honesta sobre o tipo de vínculo que vocês dois querem pode abrir espaço para o jeito de vocês fazerem as coisas.
  workUpright: >-
    No trabalho ou nos estudos, o Hierofante destaca aprender bem um ofício, respeitar métodos consagrados e encontrar um mentor. Pode ser um bom momento para fazer um curso, conquistar uma qualificação ou pedir a alguém com experiência que mostre como as coisas funcionam. Fazer parte de uma equipe ou instituição pode oferecer apoio, além de estrutura.
  workReversed: >-
    Invertido, o Hierofante pode refletir frustração com o jeito como as coisas sempre foram feitas, ou a sensação de que o caminho oficial não combina com você. Você pode se perguntar quais regras protegem a qualidade e quais apenas resistem à mudança. Propor uma abordagem melhor, com calma e com argumentos, pode funcionar melhor do que contornar o sistema.
  growthUpright: >-
    No crescimento pessoal, esta carta convida você a aprender com quem veio antes. Livros, professores, comunidades e práticas podem oferecer referências que apoiam o seu desenvolvimento. Você pode escolher uma disciplina ou tradição para estudar com paciência, notando o que ela oferece antes de decidir o que fazer com isso.
  growthReversed: >-
    Invertido, o Hierofante pode ser um empurrãozinho para escrever as suas próprias diretrizes. Ele pode refletir um momento em que uma crença ou um papel antigo ficou pequeno. Você pode listar os valores que realmente tem hoje, com as suas palavras, e notar onde eles coincidem com o que aprendeu e onde, com delicadeza, seguem por outro rumo.
reflectionQuestions:
  - >-
    Quais valores você herdou, e quais escolheu por conta própria?
  - >-
    Quem ensinou a você algo importante, e o que você aprendeu com o jeito de ensinar?
  - >-
