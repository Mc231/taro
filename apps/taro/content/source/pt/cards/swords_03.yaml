imageryNote: >-
  A arte original mostra três lâminas finas apoiadas numa pedra em forma de coração, sob um céu cinzento e baixo. Uma chuva fina cai ao redor, e uma leve abertura de luz aparece na borda das nuvens. A pedra sugere o peso da tristeza, enquanto a chuva aponta para as lágrimas e o alívio. A luz distante indica que as tempestades passam, sem prometer quando.
