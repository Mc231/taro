  relationshipsReversed: >-
    Invertido, o Três de Espadas pode sugerir uma mágoa que começa a se aliviar entre pessoas, ou uma que ainda está guardada em silêncio. Talvez um pedido de desculpas seja possível, ou talvez o passo mais saudável seja simplesmente a aceitação. Você pode se perguntar o que ajudaria você a ficar em paz, incluindo a outra pessoa ou não. O perdão, se vier, pode chegar no seu próprio tempo.
  workUpright: >-
    No trabalho ou em um projeto, esta carta pode refletir decepção: uma crítica que doeu, um plano que não deu certo ou um contratempo depois de um esforço real. Tudo bem sentir isso. Você pode se permitir uma pausa antes de responder, e depois procurar a parte útil da mensagem quando a primeira onda passar. O seu valor é maior do que um único resultado.
  workReversed: >-
    Invertida, esta carta pode apontar para a recuperação depois de um contratempo profissional, ou para uma frustração que você vem carregando em silêncio. Você pode notar se uma decepção antiga ainda está moldando o jeito como você encara novas tarefas. Dar nome a ela, talvez com um colega ou mentor de confiança, pode afrouxar o seu peso e ajudar você a voltar ao trabalho com energia renovada.
  growthUpright: >-
    No crescimento pessoal, o Três de Espadas convida você a praticar a ternura com a sua própria dor. A tristeza faz parte de ser humano, não é sinal de que há algo errado com você. Você pode explorar jeitos simples de cuidar de si quando o ânimo está baixo: descanso, movimento, confortos conhecidos e pessoas que deixam você ser como é.
  growthReversed: >-
    Invertida, esta carta pode refletir o aprendizado de soltar o que dói num ritmo que pareça seguro. Você pode notar onde vem prendendo a respiração, ao pé da letra ou não. Soltar um suspiro, algumas lágrimas ou algumas frases honestas num diário pode ser um pequeno ato de alívio. A recuperação raramente é uma linha reta, e tudo bem.
