  workUpright: >-
    No trabalho, o Cavaleiro de Espadas pode sugerir um esforço para fazer as coisas acontecerem: atacar uma pilha de pendências, defender uma proposta ou agir rápido diante de uma oportunidade clara. O seu foco pode inspirar os outros. Você pode manter a comunicação aberta para que a equipe entenda a sua direção, e conferir os detalhes importantes para que a velocidade não prejudique a qualidade.
