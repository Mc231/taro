  growthUpright: >-
    No crescimento pessoal, o Cavaleiro de Espadas convida você a agir de acordo com as suas convicções. Você pode escolher um objetivo e persegui-lo com foco, notando a energia que vem de um esforço comprometido. A coragem de falar e de se mover tem valor; unida à reflexão, ela ajuda você a crescer numa direção que realmente deseja.
