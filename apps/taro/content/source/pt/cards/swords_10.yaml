imageryNote: >-
  A arte original mostra dez lâminas deitadas lado a lado num chão plano, à beira de um lago escuro, como ferramentas largadas no fim de um longo dia. O céu noturno acima está pesado, mas uma faixa nítida de luz dourada se estende pelo horizonte distante. A fileira de lâminas sugere um ciclo concluído, a água parada aponta para a exaustão e o descanso, e o amanhecer indica que outro dia começa.
