imageryNote: >-
  A Sacerdotisa do Taro é imaginada sentada no limiar de uma porta iluminada pela lua, metade na luz e metade na sombra, com um livro fechado apoiado nos joelhos. Atrás da figura, uma cortina se move como se algo esperasse do outro lado. Uma lua crescente refletida em uma bacia de água parada pode ecoar ciclos e intuição, e tons de azul profundo sugerem calma na superfície e profundidade embaixo. A quietude atenta e silenciosa da figura é o centro da imagem.
