meaningUpright: |-
  A Sacerdotisa está sentada entre duas colunas, no limiar entre o que se conhece e o que ainda está oculto. Essa figura não age nem explica; o seu dom é a atenção: aquela escuta profunda e paciente que percebe o que está por baixo da superfície de uma situação, de uma conversa ou de um sentimento.
  No dia a dia, esta carta pode refletir um palpite que você não consegue justificar por completo, a sensação de que algo não está sendo dito, ou um sonho que continua com você até a tarde. Ela pode apontar para momentos em que a resposta não vem de juntar mais informação, e sim de ficar em silêncio com o que você já tem. Algumas coisas só ficam claras quando você para de forçar a clareza.
  Esta carta convida você a confiar nas partes mais lentas e menos verbais de você. Você pode reservar um tempo para escrever no diário, caminhar sem fones de ouvido ou simplesmente fazer uma pausa antes de responder. O saber interior não substitui os fatos, e pode caminhar ao lado deles. A Sacerdotisa pede que você note o que a sua voz mais quieta vem tentando dizer, e que dê a ela um pouco de espaço antes de decidir o que fazer.
meaningReversed: |-
  Invertida, a Sacerdotisa pode sugerir que a sua voz interior está presente, mas difícil de ouvir. Dias corridos, opiniões alheias ou um fluxo constante de telas podem tomar o espaço da quietude de que esta carta gosta. Você pode notar que vive perguntando aos outros o que fazer sobre algo que, em parte, já sabe.
  Esta carta também pode apontar para algo guardado por tempo demais: um sentimento, uma pergunta ou uma verdade que ficou escondida e agora pesa. A privacidade é saudável; um segredo que isola você talvez mereça um segundo olhar.
  Talvez valha criar um pequeno espaço de silêncio e ver o que vem à tona. Pode ajudar escrever sem editar, ou fazer a si uma pergunta simples e esperar a primeira resposta honesta. O que você já percebeu e ainda não se permitiu dizer?
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, a Sacerdotisa pode refletir um vínculo em que muito se entende sem palavras, ou um momento em que escutar importa mais do que falar. Ela pode convidar você a notar o que corre por baixo: o que o silêncio de uma amizade pode significar, ou o que a sua própria relutância está protegendo. Você pode oferecer a alguém próximo o presente de uma atenção sem pressa.
  relationshipsReversed: >-
    Invertida, esta carta pode apontar para coisas não ditas entre você e alguém próximo, ou para o hábito de ler nas entrelinhas no lugar de perguntar diretamente. Você pode considerar se uma pergunta gentil e honesta poderia substituir as suposições. Ela também pode refletir a vontade de proteger o seu mundo interior e, ainda assim, deixar alguém ver um pouco mais dele.
  workUpright: >-
    No trabalho ou em um projeto, a Sacerdotisa pode sugerir que nem toda decisão tem de ser tomada hoje. Ela pode convidar você a observar, reunir impressões e confiar no seu senso de tempo. Trabalhos reflexivos, como pesquisa, escrita, planejamento ou mentoria, combinam bem com esta carta. Uma competência discreta pode ser mais valorizada do que você imagina.
  workReversed: >-
    Invertida, a Sacerdotisa pode refletir a dúvida sobre um instinto sensato porque outras vozes falam mais alto, ou informações sendo retidas em uma equipe. Você pode se perguntar o que sabe sobre uma situação e ainda não disse. Encontrar um jeito calmo e adequado de compartilhar isso pode deixar o trabalho mais claro para todo mundo, inclusive para você.
  growthUpright: >-
    O crescimento com a Sacerdotisa costuma começar na quietude. Você pode experimentar alguns minutos por dia apenas notando os seus pensamentos, a respiração ou o ambiente, sem tentar consertar nada. Aos poucos, esse tipo de atenção pode ajudar você a distinguir o falatório ansioso de uma percepção interior mais firme.
  growthReversed: >-
    Invertida, a Sacerdotisa pode perguntar se você tem vivido mais na superfície ultimamente, reagindo no lugar de refletir. Pode ser um empurrãozinho para voltar para dentro, sem pressão para encontrar respostas imediatas. Você pode reservar um pequeno ritual tranquilo nesta semana e notar o que muda quando você se dá espaço para escutar.
