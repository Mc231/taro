imageryNote: >-
  A arte mostra uma figura coroada sentada acima de águas em movimento, numa plataforma de pedra gasta, com um cálice numa mão e um bastão curto na outra. A água ao redor sobe e desce, mas os ombros da figura continuam soltos e o olhar permanece nivelado. Esse contraste sugere domínio emocional, enquanto azuis profundos aquecidos por toques de dourado indicam sabedoria e generosidade.
