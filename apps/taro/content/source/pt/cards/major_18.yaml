imageryNote: >-
  A Lua do Taro é imaginada como uma lua pálida, meio escondida por nuvens que passam, sobre uma trilha entre juncos altos à beira da água. A trilha brilha em alguns trechos e some em outros, então quem caminha vai devagar. Uma garça parada na água rasa pode sugerir uma atenção paciente, enquanto ondulações na superfície indicam sentimentos subindo do fundo. Luz prateada, sombras suaves e contornos borrados convidam quem olha a confiar nos próprios sentidos numa jornada incerta.
