shortUpright: >-
  Nem tudo está claro ainda, e tudo bem. Esta carta convida você a ir devagar e a confiar nos seus sentidos.
shortReversed: >-
  Uma neblina pode estar começando a se dissipar. O que você vê com mais clareza agora do que antes?
meaningUpright: |-
  A Lua é a carta do meio-termo: a luz que mostra as formas sem mostrar os contornos. Nesse brilho suave, as coisas podem parecer maiores, mais estranhas ou mais mágicas do que são à luz do dia. A carta fala de sonhos, humores, imaginação e da sensação inquieta de não saber bem onde você está.
  No dia a dia, esta carta pode refletir uma situação com peças faltando, um sentimento que você não consegue nomear, ou preocupações que parecem maiores à noite do que de manhã. Ela pode apontar para um momento em que a lógica sozinha não ajuda muito, e em que a intuição, os sonhos e o trabalho criativo podem oferecer pistas. A incerteza aqui não é um aviso; é simplesmente parte de percorrer um caminho que você ainda não consegue ver por inteiro.
  Esta carta convida você a considerar o que é real e o que pode ser imaginado. Você pode se perguntar quais dos seus medos se baseiam em fatos e quais em histórias que você contou para si. A Lua destaca a paciência com a ambiguidade. Ir devagar, consultar os seus instintos e esperar mais luz antes de tomar grandes decisões pode ser um caminho sábio em tempos de neblina.
meaningReversed: |-
  Invertida, a Lua pode refletir uma confusão que começa a clarear. Algo que parecia turvo pode estar entrando em foco, ou você pode se sentir em condições de olhar de frente para uma preocupação que vinha evitando. Isso pode trazer alívio, mesmo que o quadro não seja totalmente confortável.
  Esta carta também pode apontar para os truques da mente: contar para si uma história conveniente, ou deixar pensamentos ansiosos girarem em círculos. Notar esses padrões já é um passo rumo à clareza.
  Talvez valha anotar o que você sabe com certeza e o que está supondo. Ver a diferença no papel pode reduzir uma preocupação ao seu tamanho real. Confiar no caminho não exige ver o caminho inteiro; pode bastar ver o próximo passo e dá-lo com cuidado.
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, a Lua pode refletir incerteza sobre onde você está ou sobre o que outra pessoa está sentindo. Ela pode convidar você a notar se está preenchendo lacunas com suposições. Perguntas gentis e diretas e paciência podem ajudar, assim como prestar atenção às suas próprias reações emocionais sem tirar conclusões apressadas.
  relationshipsReversed: >-
    Invertida, esta carta pode apontar para mal-entendidos que começam a se desfazer, ou para o reconhecimento de uma história pouco útil que você contou sobre alguém. Você pode considerar uma conversa honesta para conferir o que é de fato verdade, abrindo espaço para o lado da outra pessoa. A clareza muitas vezes chega em pedaços, e cada troca honesta acrescenta um.
  workUpright: >-
    No trabalho ou em um projeto, a Lua destaca a ambiguidade: objetivos pouco claros, informações que mudam ou um processo criativo que ainda não encontrou a sua forma. Ela pode convidar você a tolerar não saber por um tempo. Um brainstorming imaginativo pode florescer aqui, enquanto compromissos firmes podem ganhar com a espera por mais clareza.
  workReversed: >-
    Invertida, a Lua pode refletir uma confusão que se desfaz quando chegam novas informações, ou uma chance de resolver um mal-entendido. Você pode anotar as perguntas em aberto e buscar respostas claras. Ela também pode apontar para perceber em você o pensamento de "o pior vai acontecer" e escolher um olhar mais calmo. Fatos claros costumam deixar a próxima decisão mais leve.
  growthUpright: >-
    Sob a Lua, vale explorar os sonhos, a imaginação e as partes menos racionais da sua mente. Escrever num diário ou brincar de criar pode ajudar você a escutá-las. Você pode notar os seus humores e os padrões deles, tratando-os como informação, e não como ordens.
  growthReversed: >-
    Invertida, a Lua pode perguntar se a ansiedade tem moldado o seu olhar mais do que os fatos. Ela pode refletir uma capacidade crescente de enxergar através das preocupações. Você pode praticar uma pausa quando um pensamento de medo aparece e perguntar o que uma pessoa amiga mais calma notaria. Aos poucos, essa pausa pode virar um hábito mais firme.
