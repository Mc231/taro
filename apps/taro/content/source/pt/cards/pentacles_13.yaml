imageryNote: >-
  A arte pode mostrar uma figura coroada sentada num trono esculpido dentro de um jardim em flor, segurando uma moeda com delicadeza no colo. Flores, frutos e um pequeno animal, como um coelho, podem cercar o trono, e um riacho pode correr por perto. O jardim pode simbolizar a abundância que vem do cuidado; a moeda embalada, uma administração atenta; e o animal, a riqueza criativa e o conforto do mundo natural.
