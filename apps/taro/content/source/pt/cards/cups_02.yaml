imageryNote: >-
  A arte reúne duas figuras, ou duas mãos, cada uma erguendo um cálice em direção à outra através de um pequeno espaço. Entre elas, um emblema comum, como caules entrelaçados ou dois peixes, pode sugerir que o encontro cria algo que nenhuma das duas tem sozinha. Cores espelhadas de cada lado podem expressar igualdade, com um brilho suave onde os cálices quase se tocam, como se a própria conexão emitisse luz.
