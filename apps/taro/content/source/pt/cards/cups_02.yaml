shortUpright: >-
  Um momento para notar onde o cuidado flui nos dois sentidos, e o que faz uma conexão parecer igual e viva.
shortReversed: >-
  Algo entre você e outra pessoa pode parecer fora de equilíbrio; considere o que cada um está realmente pedindo.
meaningUpright: |-
  O Dois de Copas mostra duas pessoas, ou duas partes de uma vida, se encontrando de igual para igual e oferecendo algo uma à outra. É uma carta de reconhecimento: o alívio da compreensão e o prazer de compreender alguém em troca. A conexão que ela descreve pode ser romântica, mas pode ser também uma amizade, uma colaboração criativa, um laço entre irmãos ou uma parceria de trabalho.
  Você pode reconhecer essa energia numa conversa em que as duas pessoas escutam, numa reconciliação depois de um mal-entendido, ou no acordo silencioso de duas pessoas que escolhem continuar presentes uma para a outra. Ela também pode refletir a união de dois lados seus que vinham puxando para direções diferentes.
  Esta carta convida você a notar onde há uma troca genuína na sua vida, e a honrá-la. Reciprocidade não é fazer contas. É as duas pessoas se sentirem livres para oferecer, receber e dizer o que querem.
meaningReversed: |-
  Invertido, o Dois de Copas pode apontar para uma conexão que saiu do equilíbrio. Uma pessoa pode estar dando mais, ou escutando menos, ou as duas podem simplesmente estar falando sem se encontrar. Isso não significa que algo se quebrou; muitos vínculos passam por fases assim.
  A carta também pode se voltar para dentro, perguntando que tipo de parceria você tem consigo. Você tem com as suas próprias necessidades a mesma paciência e a mesma justiça que tenta ter com as de outra pessoa?
  Você pode olhar para um relacionamento que parece desigual e se perguntar o que cada pessoa realmente espera, por baixo da discordância de superfície. Uma conversa calma e honesta, ou um pouco de distância para ver com mais clareza, pode ser mais útil do que tentar consertar tudo de uma vez. O equilíbrio é algo que as pessoas constroem juntas, uma troca de cada vez.
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, esta carta pode refletir uma atração mútua, uma amizade ou uma parceria em que as duas pessoas se sentem vistas. Ela pode convidar você a notar os pequenos rituais que mantêm um vínculo firme: perguntar como a outra pessoa está, lembrar o que importa para ela, pedir desculpas com simplicidade. Você pode se perguntar o que mais valoriza em alguém próximo, e se essa pessoa sabe disso.
  relationshipsReversed: >-
    Invertida, esta carta pode refletir um vínculo em que uma pessoa carrega mais do peso emocional, ou em que um mal-entendido ainda não foi esclarecido. Você pode considerar o que diria se soubesse que teria uma escuta gentil. A reparação muitas vezes começa com uma frase honesta e com a disposição de escutar a resposta sem se defender logo de cara.
  workUpright: >-
    No trabalho, o Dois de Copas pode apontar para uma colaboração promissora, um colega em quem você confia ou uma relação com clientes construída no respeito. Ele pode convidar você a dividir o crédito, pedir opiniões e deixar os acordos claros o bastante para que os dois lados se sintam seguros. Boas parcerias muitas vezes nascem mais de valores em comum do que de habilidades em comum.
  workReversed: >-
    Invertida, a carta pode refletir uma relação de trabalho em que as expectativas não foram ditas ou estão desiguais. Talvez uma pessoa suponha um acordo que não existe. Você pode nomear o que cada um espera, com palavras simples, e conferir se os papéis ainda funcionam. A clareza pode ser uma gentileza, mesmo quando a conversa parece desconfortável no começo.
  growthUpright: >-
    A parceria interior é o tema de crescimento aqui, uma chance de reconciliar partes suas: o que você quer e o que você valoriza, ou o seu lado prático e o seu lado sensível. Você pode escrever um pequeno diálogo entre duas vozes dentro de você e ver onde elas já concordam. A integração pode parecer encontrar uma parceria dentro de si.
  growthReversed: >-
    Invertida, esta carta pode perguntar se você depende dos outros para um equilíbrio que também poderia construir por dentro. Você pode notar onde busca aprovação antes de confiar no seu próprio olhar. Tratar você com a mesma justiça que oferece a uma pessoa amiga próxima pode ser uma prática que traz firmeza, uma pequena escolha de cada vez.
reflectionQuestions:
  - >-
