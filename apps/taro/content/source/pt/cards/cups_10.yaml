imageryNote: >-
  A arte reúne dez cálices em volta de um grupo de figuras de idades diferentes, que compartilham uma paisagem aberta com uma casa por perto. A água correndo por uma terra verde sugere um alimento emocional que sustenta uma comunidade. Braços abertos, mãos dadas ou uma dança compartilhada podem transmitir alegria e tranquilidade. Cores vivas, mas suaves, refletem calor, segurança e a sensação de ter chegado a um bom lugar.
