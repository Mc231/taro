imageryNote: >-
  A arte mostra duas pequenas figuras num pátio ou jardim protegido, uma oferecendo à outra um cálice cheio de flores. Outros cálices por perto, cada um com flores, sugerem memórias plantadas que continuam crescendo. Um muro antigo ou uma porta ao fundo pode representar o lar e a proteção dos lugares conhecidos. Cores quentes e suaves transmitem inocência, generosidade e a confiança tranquila de outros tempos.
