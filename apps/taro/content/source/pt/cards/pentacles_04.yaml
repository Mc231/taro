  relationshipsReversed: >-
    Invertida, a carta pode sugerir um amolecimento, uma disposição de deixar alguém entrar ou de parar de fazer contas cuidadosas de quem deu o quê. Ela também pode refletir o medo de perder alguém que aparece como controle. Você pode perguntar a si, com delicadeza, o que ajudaria você a sentir segurança, e conversar sobre isso no lugar de apertar ainda mais a mão.
  workUpright: >-
    No trabalho, o Quatro de Ouros pode descrever uma abordagem cautelosa e protetora: agarrar-se a uma função, a um método ou a informações que parecem ser o seu chão. A estabilidade pode ter valor. Você pode se perguntar se essa cautela ainda faz sentido, ou se compartilhar conhecimento e tentar uma nova abordagem poderia deixar a sua posição mais forte, e não mais fraca.
  workReversed: >-
    Aqui a carta pode refletir o afrouxamento de hábitos rígidos no trabalho, a delegação ou a divisão do crédito com mais liberdade. Ela também pode apontar para um uso disperso do tempo ou do esforço. Você pode olhar para onde a sua energia vai a cada semana e decidir, de forma deliberada, o que merece uma proteção cuidadosa e o que poderia fluir com mais facilidade.
  growthUpright: >-
    No crescimento pessoal, esta carta convida você a explorar o que segurança significa para você. Algumas das coisas a que você se agarra podem ser âncoras preciosas; outras podem ser proteções antigas de tempos mais difíceis. Você pode separá-las com delicadeza, guardando o que ainda dá firmeza e notando o que já não tem de proteger tão de perto.
  growthReversed: >-
    Invertida, a carta pode refletir uma disposição crescente de confiar, de gastar energia com coisas que trazem alegria, ou de deixar uma rotina mudar. Você pode notar qualquer desconforto que surja ao afrouxar o controle, e tratá-lo com curiosidade. Sentir segurança segurando as coisas com leveza é uma habilidade que pode ser construída aos poucos.
