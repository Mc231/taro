  A arte pode mostrar uma figura sentada segurando uma moeda contra o peito, com outras apoiadas sob os pés e equilibradas acima da cabeça, enquanto uma cidade aparece ao fundo, à distância. A postura fechada pode sugerir proteção e contenção, e os prédios distantes, um mundo mantido do lado de fora do círculo. Formas sólidas e quadradas e uma silhueta fechada podem enfatizar a estabilidade, junto com a pergunta sobre quanto essa estabilidade custa.
