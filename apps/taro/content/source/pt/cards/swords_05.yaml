imageryNote: >-
  A arte original mostra uma praia varrida pelo vento sob nuvens rasgadas e rápidas. Uma figura segura três lâminas sem firmeza, olhando para trás, enquanto mais duas lâminas estão na areia. Outras duas figuras se afastam em direção à água. As lâminas espalhadas sugerem discussões que ficaram sem solução, e as costas viradas apontam para a distância que o conflito cria. O céu inquieto reflete uma mente ainda agitada depois que as palavras pararam.
