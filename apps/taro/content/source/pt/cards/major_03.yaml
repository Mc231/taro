imageryNote: >-
  A Imperatriz do Taro é imaginada como uma figura em repouso em uma horta no fim do verão, cercada de legumes amadurecendo, um pão esfriando no parapeito e um riacho correndo ao lado. Tecidos macios e um cesto de frutas recém-colhidas sugerem conforto e o prazer dos sentidos, enquanto abelhas passando de flor em flor indicam um crescimento que acontece por meio de muitos pequenos atos de cuidado. O clima é caloroso e sem pressa, e convida quem olha a notar a abundância que já está presente.
