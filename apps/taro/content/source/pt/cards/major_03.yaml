shortUpright: >-
  Algo está crescendo, em você ou ao seu redor. Esta carta convida você a cuidar disso com paciência e carinho.
shortReversed: >-
  O cuidado pode estar indo todo para fora enquanto a sua própria fonte se esvazia. Onde parte dele poderia voltar a você?
meaningUpright: |-
  A Imperatriz é a carta do crescimento que acontece por meio do cuidado. Enquanto a Sacerdotisa escuta para dentro, a Imperatriz se volta para fora, para o mundo vivo: hortas, refeições, coisas feitas à mão, o prazer de um bom pão ou de um sol morno. Esta carta representa o tipo de criatividade que nutre, seja um projeto, uma casa, uma amizade ou a sua própria sensação de bem-estar.
  No dia a dia, esta carta pode refletir uma temporada de fazer: cozinhar para os amigos, voltar a desenhar, cuidar de plantas ou de pessoas, ou simplesmente notar que você se sente mais à vontade no próprio corpo do que de costume. Ela também pode apontar para a paciência. A Imperatriz sabe que o crescimento tem o seu próprio tempo, e que puxar uma muda não a faz crescer mais rápido.
  Esta carta convida você a considerar o que está cultivando e como está cultivando. Você pode se perguntar onde um pouco mais de suavidade, beleza ou descanso poderia ajudar algo a florescer. A abundância aqui tem menos a ver com ter muito e mais a ver com notar e aproveitar o que já está vivo ao seu redor.
meaningReversed: |-
  Invertida, a Imperatriz pode refletir um cuidado que perdeu o equilíbrio. Você pode estar despejando energia em todos e em tudo, menos em você, até que a criatividade parece seca e até as coisas agradáveis parecem obrigações. Ou o cuidado pode virar envolvimento demais, segurando com tanta força que sobra pouco espaço para os outros crescerem do seu próprio jeito.
  Esta carta também pode apontar para um projeto criativo que travou, ou para um afastamento dos confortos simples e físicos que costumam dar firmeza a você.
  Talvez valha olhar para onde o seu cuidado está indo e se parte dele poderia voltar para casa. Um pequeno gesto de cuidado consigo, como uma refeição que nutre, uma caminhada lenta ou alguns minutos fazendo algo só por diversão, pode ser um jeito de se reconectar com a energia generosa da Imperatriz.
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, a Imperatriz pode refletir calor, afeto e a sensação de receber cuidado, ou de cuidar dos outros com generosidade. Ela pode convidar vocês a criar conforto juntos: refeições compartilhadas, tempo ao ar livre, pequenos gestos de ternura. Você pode notar como as pessoas próximas gostam de ser cuidadas, e como você também gosta de receber cuidado.
  relationshipsReversed: >-
    Invertida, a Imperatriz pode perguntar se o cuidado em um relacionamento ficou unilateral, ou se a preocupação escorregou para o controle das escolhas de outra pessoa. Você pode considerar onde poderia dar um passo atrás e confiar mais na outra pessoa, e onde poderia pedir com mais abertura o cuidado de que você sente falta.
  workUpright: >-
    No trabalho ou em um projeto criativo, a Imperatriz aponta para um terreno fértil. Ela pode refletir um momento em que as ideias crescem com facilidade, em que você consegue nutrir uma equipe, um canteiro de projetos ou uma obra lenta e gratificante. Ela convida você a deixar o seu espaço de trabalho mais confortável e a valorizar o progresso que vem de uma atenção constante e paciente.
  workReversed: >-
    Invertida, esta carta pode refletir o esgotamento de cuidar dos projetos de todo mundo menos dos seus, ou um bloqueio criativo que nenhum esforço parece mover. Você pode se perguntar o que faria o trabalho voltar a nutrir você: uma mudança de ambiente, uma lista de tarefas mais curta, ou a permissão para fazer algo imperfeito.
  growthUpright: >-
    No crescimento pessoal, a Imperatriz convida você a aproveitar estar no seu corpo e no mundo físico. Descanso, boa comida, tempo na natureza e prazeres simples não são excessos aqui; são formas de recarregar. Você pode notar o que ajuda você a se sentir com os pés no chão e com generosidade, e abrir um pouco mais de espaço para isso.
  growthReversed: >-
    Invertida, a Imperatriz pode ser um lembrete gentil de que você merece a mesma paciência que dá aos outros. Ela pode refletir um afastamento das suas próprias necessidades ou uma dúvida sobre o seu valor criativo. Você pode começar com um pequeno ritual gentil que pertença só a você, e ver como ele muda a sua semana.
