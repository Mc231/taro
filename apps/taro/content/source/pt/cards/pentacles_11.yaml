  growthUpright: >-
    No crescimento pessoal, esta carta convida você a seguir uma curiosidade prática. Aprender algo com as mãos, como cozinhar, consertar, desenhar ou plantar, pode trazer muito chão. Você pode escolher um interesse e dar a ele um lugar pequeno e regular na sua semana, notando como é crescer com constância.
