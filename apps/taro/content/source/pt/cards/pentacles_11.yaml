imageryNote: >-
  A arte pode mostrar uma figura jovem de pé num campo aberto, segurando uma única moeda na altura dos olhos e observando-a de perto. Terra recém-revolvida, um pequeno bosque e colinas distantes podem estar ao redor. A moeda erguida pode simbolizar o estudo focado e o fascínio pelo que é concreto; a terra aberta, o potencial que ainda pede cultivo; e a postura ereta e atenta, a disposição de aprender passo a passo.
