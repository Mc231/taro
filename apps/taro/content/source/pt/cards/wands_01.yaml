imageryNote: >-
  Um único bastão vivo se ergue na imagem, recém-cortado e ainda brotando galhos verdes, como se a madeira não conseguisse parar de crescer. Uma pequena chama ou um brilho se reúne na ponta. O galho representa uma força criativa em estado bruto, ainda viva e sem forma, e as folhas novas sugerem que a inspiração cresce quando recebe cuidado. Vermelhos e dourados quentes podem carregar o elemento fogo, com um céu aberto ao fundo para indicar o espaço que ainda há para explorar.
