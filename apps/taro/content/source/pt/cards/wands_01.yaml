meaningUpright: |-
  O Ás de Paus é a primeira centelha de fogo do baralho: uma ideia repentina, um puxão de curiosidade, o momento em que algo faz você se endireitar e pensar "quero tentar isso". É energia em estado bruto, antes de ter um plano, mais perto de uma semente de empolgação do que de um projeto pronto.
  No dia a dia, isso pode aparecer como um rascunho rabiscado no verso de um recibo, a vontade de aprender um instrumento que você admira há anos, ou uma conversa que deixa você vibrando com as possibilidades. Também pode ser um apetite renovado por algo que você tinha deixado de lado e que volta com mais calor do que você esperava.
  Esta carta convida você a notar para onde a sua energia quer ir agora, sem exigir que ela se justifique por enquanto. Uma faísca não pede um plano de negócios; pede um pouco de oxigênio. Você pode dar a ela uma saída pequena e concreta hoje, como dez minutos, uma primeira anotação ou uma mensagem para alguém que compartilha o interesse, e ver como ela responde.
meaningReversed: |-
  Invertido, o Ás de Paus pode refletir uma faísca que ainda não pegou. O interesse pode ser real e, mesmo assim, vive sendo empurrado para amanhã, ou acende e se apaga antes de encontrar algo em que se agarrar. Às vezes a energia está espalhada entre tantos começos que nenhum deles recebe calor suficiente.
  Ele também pode apontar para uma fase mais quieta. Nem toda ideia está pronta para ser mostrada; algumas pedem um tempo debaixo da terra, ganhando força em anotações privadas e devaneios antes de virem à luz do dia.
  Este pode ser um momento de perguntar do que a sua faísca de fato tem necessidade. É de tempo, de um primeiro passo mais claro, da permissão para ser iniciante, ou simplesmente de descanso antes de começar? Você pode escolher uma ideia da pilha e dar a ela um espaço pequeno e protegido, sem esperar que o momento perfeito chegue.
aspects:
  relationshipsUpright: >-
    Nos vínculos próximos, esta carta pode refletir um novo impulso de calor ou de curiosidade: vontade de planejar algo novo juntos, de fazer perguntas diferentes, ou de trazer mais leveza e brincadeira a uma conexão conhecida. Você pode notar quem acende algo em você neste momento e que tipo de aventura em comum, mesmo pequena, poderia deixar essa energia circular entre vocês.
  relationshipsReversed: >-
    Com a carta invertida, a faísca entre você e alguém próximo pode parecer abafada pela rotina, pelo cansaço ou por uma hesitação não dita. Isso não significa que o calor acabou; ele pode estar só esperando uma abertura. Você pode considerar o que costumava puxar conversa entre vocês, e se um pequeno gesto de curiosidade poderia trazer de volta um pouco dessa vivacidade.
  workUpright: >-
    No trabalho ou em um projeto criativo, o Ás de Paus pode apontar para uma ideia com força de verdade: uma nova abordagem, um projeto paralelo, uma proposta à qual você sempre volta. Você pode dar a ela uma primeira forma concreta, como um esboço, um protótipo ou uma apresentação curta para alguém de confiança, para que ela seja testada às claras, e não só na sua cabeça.
  workReversed: >-
    Com a carta invertida, a motivação pode estar vacilando. Talvez uma ideia esteja esperando aprovação, ou começos demais estejam disputando o seu tempo. Este pode ser um momento de escolher um fio para seguir e deixar os outros de lado por enquanto. Um progresso pequeno e visível numa única ideia muitas vezes reacende mais energia do que planejar várias ao mesmo tempo.
  growthUpright: >-
    A curiosidade pode ser uma mestra por si só, e esta carta sugere segui-la. Aquilo que atrai você muitas vezes diz algo sobre o que quer crescer em você. Você pode anotar as faíscas que sentir nesta semana, sem julgá-las, e procurar aquela que sempre volta.
  growthReversed: >-
    Com a carta invertida, você pode estar esperando se sentir em condições antes de começar, ou se cobrando pela falta de inspiração. A energia costuma se mover em estações. Você pode tratar este momento como um tempo de recolhimento tranquilo: descansar, ler, observar, e deixar um novo interesse tomar forma no seu próprio ritmo.
