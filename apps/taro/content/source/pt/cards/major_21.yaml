shortUpright: >-
  Um ciclo pode estar se completando. Esta carta convida você a fazer uma pausa e honrar o que você concluiu.
shortReversed: >-
  Algo pode estar quase terminado. Que passo final ou ponta solta merece a sua atenção?
meaningUpright: |-
  O Mundo é a última carta dos Arcanos Maiores, o fim da jornada que começou com o Louco. É uma carta de conclusão e inteireza: a sensação de que as peças se encaixaram, de que um ciclo foi vivido por inteiro e de que você está, neste momento, em casa na história que viveu até aqui.
  No dia a dia, esta carta pode refletir terminar um projeto longo, alcançar um objetivo pelo qual você trabalhou, ou simplesmente se sentir em casa na sua vida e no seu corpo. Ela pode apontar para a integração: reunir as lições de muitas experiências, as fáceis e as difíceis, numa noção de quem você é. Pertencimento aqui pode significar pertencer a uma comunidade, a um lugar ou a si.
  Esta carta convida você a considerar o que conquistou e a celebrar isso. Você pode se perguntar como mudou desde que este ciclo começou, e o que gostaria de levar para o próximo. O Mundo destaca que a conclusão não é um fim no sentido de parar. É um momento de plenitude antes que uma nova jornada comece.
meaningReversed: |-
  Invertido, o Mundo pode refletir um ciclo que está quase completo, mas não totalmente. Algumas pontas soltas, uma despedida não dita ou uma última tarefa podem estar impedindo a sensação de conclusão. Você pode sentir que está em condições de seguir adiante enquanto algo ainda segura você no lugar.
  Esta carta também pode apontar para buscar um desfecho em outro lugar, procurando atalhos ou esperando que outras pessoas amarrem as coisas por você.
  Talvez valha identificar uma ou duas coisas que ajudariam você a sentir que concluiu. Pode ser terminar uma tarefa prática, agradecer a alguém, reconhecer uma decepção ou simplesmente dar a si o crédito pelo caminho que já percorreu. Dar esse último passo com intenção pode transformar um quase fim num fim de verdade.
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, o Mundo pode refletir uma sensação de plenitude e compreensão mútua, como se um vínculo tivesse encontrado a sua forma. Ele pode convidar vocês a valorizar o que construíram juntos e a celebrar marcos compartilhados. Os relacionamentos aqui parecem inteiros, com espaço tanto para a proximidade quanto para a liberdade de cada um.
  relationshipsReversed: >-
    Invertida, esta carta pode apontar para algo não resolvido num relacionamento, uma conversa que não terminou ou um capítulo que não foi encerrado. Você pode considerar o que ajudaria vocês dois a ficar em paz, seja dizer algo ou aceitar que já foi dito.
  workUpright: >-
    No trabalho ou em um projeto, o Mundo destaca a conclusão e o reconhecimento. Ele pode refletir terminar um trabalho importante, alcançar um marco ou sentir que a sua função combina bem com você. Você pode reservar um tempo para reconhecer o que você e as outras pessoas conquistaram antes de começar a próxima coisa.
  workReversed: >-
    Invertido, o Mundo pode refletir um projeto travado na etapa final ou a sensação de não chegar bem à linha de chegada. Você pode listar o que falta e decidir se aquilo realmente tem de ser feito ou se pode ser deixado de lado. Um esforço pequeno e focado pode ajudar a fechar as coisas de forma limpa.
  growthUpright: >-
    Antes de buscar o próximo objetivo, pode ajudar reconhecer o caminho que você já percorreu. Você pode refletir sobre as lições, os desafios e as alegrias de um capítulo recente e notar como eles se encaixam num retrato mais completo de você. A integração é um tipo discreto de conquista.
  growthReversed: >-
    Invertido, o Mundo pode perguntar o que ajudaria você a sentir que algo está completo. Ele pode refletir uma sensação de inquietação ou de incompletude. Você pode nomear uma coisa que vem querendo terminar e dar a ela toda a sua atenção, e então notar como é fechar esse ciclo.
