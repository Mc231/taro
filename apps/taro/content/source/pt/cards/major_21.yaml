imageryNote: >-
  O Mundo do Taro é imaginado como uma figura dançando dentro de uma grande guirlanda oval de folhas e flores de todas as estações, movendo-se livremente no centro de um céu estrelado. Ao redor da guirlanda, quatro pequenos emblemas de fogo, água, ar e terra marcam as bordas da cena, sugerindo equilíbrio e inteireza. Uma fita que sai da mão de quem dança dá a volta até o ponto onde começou, convidando quem olha a sentir uma chegada e uma jornada que se completa.
