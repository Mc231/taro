imageryNote: >-
  O Sol do Taro é imaginado como um amplo campo de verão ao meio-dia, com amigos de idades diferentes dividindo comida sobre uma toalha sob um sol enorme e morno. Pipas sobem com a brisa e não se vê nenhuma sombra longa, sugerindo um momento sem nada a esconder. Amarelos vivos e laranjas quentes enchem a cena, enquanto um cachorro correndo pela grama acrescenta um toque de brincadeira. A imagem convida quem olha a sentir calor, clareza e uma alegria descomplicada.
