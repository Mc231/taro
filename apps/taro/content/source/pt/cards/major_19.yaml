  relationshipsReversed: >-
    Invertida, esta carta pode apontar para um relacionamento que perdeu um pouco da leveza, talvez sob estresse ou rotina. Você pode considerar planejar algo simples e divertido juntos, ou perceber se alguém está escondendo como realmente se sente atrás de uma superfície alegre. A leveza pode voltar por meio de pequenos momentos compartilhados.
  workUpright: >-
    No trabalho ou em um projeto, o Sol destaca a clareza, a visibilidade e o entusiasmo. Ele pode refletir um momento em que os seus esforços são reconhecidos, ou em que o trabalho dá energia no lugar de drenar. Você pode compartilhar as suas ideias com confiança e se permitir aproveitar o progresso pelo caminho.
