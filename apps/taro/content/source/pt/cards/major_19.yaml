    Invertido, o Sol pode refletir a sensação de falta de reconhecimento, ou uma dificuldade de encontrar entusiasmo pelo seu trabalho. Ele também pode apontar para exposição demais, como uma pressão excessiva para ter um bom desempenho. Você pode se perguntar que pequena mudança traria mais energia e calor aos seus dias de trabalho.
  growthUpright: >-
    No crescimento pessoal, esta carta convida você a se reconectar com o seu entusiasmo e a sua curiosidade naturais. Você pode revisitar algo que amava na infância ou experimentar algo novo só pela diversão. A confiança pode crescer a partir da alegria tanto quanto das conquistas.
  growthReversed: >-
