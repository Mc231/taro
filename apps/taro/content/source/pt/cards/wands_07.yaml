shortUpright: >-
  Você pode estar sustentando uma posição que importa; esta carta honra a coragem que a firmeza exige.
shortReversed: >-
  Defender tudo ao mesmo tempo pode esgotar você; vale escolher qual terreno realmente merece ser defendido.
meaningUpright: |-
  O Sete de Paus mostra alguém num terreno mais alto, segurando um bastão diante de vários outros que sobem de baixo. A posição não é fácil, mas oferece uma vantagem. Esta carta fala de convicção: defender aquilo em que você acredita, proteger algo pelo qual trabalhou, ou manter o equilíbrio quando os outros empurram de volta.
  Ela pode aparecer quando você expressa uma opinião impopular num grupo, mantém um limite com alguém que vive testando esse limite, ou continua um projeto do qual os outros duvidam. Depois de chegar a um lugar de algum sucesso, você também pode perceber que mais pessoas querem desafiá-lo ou questioná-lo.
  Esta carta convida você a notar a sua própria força e os valores que dão propósito a ela. Manter a posição não exige agressividade; pode ser algo firme, calmo e claro. Você pode se perguntar o que, de fato, está defendendo e por que isso importa, para que a sua energia vá para o que é importante para você, e não para cada desafio passageiro.
meaningReversed: |-
  Invertido, o Sete de Paus pode refletir a sensação de estar em desvantagem ou de desgaste. Talvez você venha defendendo uma posição há muito tempo, e o esforço começa a aparecer. Ou você pode se notar na defensiva mesmo quando ninguém está realmente atacando.
  Esta carta também pode apontar para um momento de repensar. Nem todo desafio pede resposta, e nem toda posição tem de ser mantida para sempre. Abrir mão de uma briga pode liberar energia para as que importam mais.
  Você pode fazer um balanço de onde está resistindo e por quê. Quais limites protegem os seus valores, e quais viraram hábitos de defesa? Pode ajudar pedir apoio, dar um passo atrás para descansar, ou deixar que outras pessoas dividam a carga, sem segurar a colina por conta própria.
aspects:
  relationshipsUpright: >-
    Nos vínculos próximos, esta carta pode refletir o ato de falar pelas suas necessidades, mesmo quando isso cria algum atrito. Ela também pode apontar para a defesa de alguém de quem você gosta. Você pode considerar como manter um limite com carinho, dizendo com clareza o que importa para você e ainda deixando espaço para o ponto de vista da outra pessoa.
  relationshipsReversed: >-
    Com a carta invertida, você pode sentir que vive na defensiva com alguém, ou que toda conversa vira um debate. Você pode notar se está se protegendo de uma crítica real ou de um medo antigo. Uma abordagem mais suave, ou uma pausa antes de responder, pode abrir espaço para uma troca mais honesta.
  workUpright: >-
    No trabalho ou num projeto criativo, o Sete de Paus pode apontar para a firmeza num padrão ou numa ideia sob pressão: concorrência, críticas ou demandas que mudam. Você pode reunir os seus motivos e argumentos para falar com uma confiança calma. A persistência aqui vem da clareza sobre o que você está protegendo e por que isso importa.
  workReversed: >-
    Com a carta invertida, você pode estar com a energia espalhada demais, respondendo a cada desafio ou pedido como se todos fossem igualmente urgentes. Você pode escolher uma ou duas questões que realmente pedem a sua posição e deixar o resto de lado por enquanto. Pedir apoio a colegas ou parceiros também pode tornar mais fácil sustentar uma posição difícil.
  growthUpright: >-
    Manter a sua posição, mesmo por pouco tempo, é uma prova de resiliência que merece reconhecimento. Você tem mais capacidade de sustentar os seus valores do que talvez imagine. Você pode lembrar uma vez em que se manteve firme e notar o que ajudou naquele momento, como um motivo claro, uma pessoa que apoiava ou uma rotina estável.
  growthReversed: >-
    Com a carta invertida, você pode estar carregando uma sensação de vigilância constante. Vale explorar de onde ela vem e se ela ainda serve a você. Escolher as suas batalhas não é desistir; pode ser um jeito de proteger a sua energia para que a coragem esteja disponível quando realmente contar.
reflectionQuestions:
  - >-
    O que você está defendendo agora, e por que isso importa para você?
  - >-
    Onde você poderia abrir mão de uma briga menor para guardar energia para uma maior?
  - >-
    Quem poderia ficar ao seu lado, para que você não sustente esta posição sem companhia?
imageryNote: >-
  Uma única figura está de pé numa elevação de terreno rochoso, com os pés apoiados de forma desigual, um bastão erguido com as duas mãos enquanto outros seis sobem por baixo da borda. O apoio irregular sugere que a convicção nem sempre é confortável, e o terreno mais alto mostra um ponto de vista real conquistado com esforço. Os bastões de baixo podem representar desafios, perguntas e vozes concorrentes, e a mão firme, uma coragem enraizada em valores.
