shortUpright: >-
  Você passou por muita coisa e continua de pé; esta carta honra a sua resiliência na reta final.
shortReversed: >-
  Ficar na defensiva por tanto tempo pode cansar; vale notar onde é seguro descansar e deixar os outros se aproximarem.
meaningUpright: |-
  O Nove de Paus mostra alguém que passou por desafios e ainda está de pé. A figura se apoia num bastão, um pouco cansada e atenta, dentro de um círculo de outros bastões fincados como uma cerca que ela mesma construiu. É uma resiliência que carrega algumas marcas da experiência: não está intacta, mas também não foi derrotada.
  Ela pode falar com você quando um projeto longo está quase no fim, quando você está atravessando uma fase exigente de cuidar de alguém ou de estudar, ou quando enfrentou contratempos e escolheu continuar. Você sabe mais agora do que no começo, inclusive onde estão os seus limites.
  Esta carta convida você a reconhecer o caminho que já percorreu e a usar o que aprendeu. A persistência tem valor, e o ritmo também. Você pode se perguntar o que ajudaria você nesta reta final: uma linha de chegada clara, algumas horas de descanso, um limite prático, ou um lembrete de que o fim está mais perto do que parece.
meaningReversed: |-
  Invertido, o Nove de Paus pode refletir um cansaço que se acumulou com o tempo. Você pode sentir que vem protegendo a si ou os seus projetos há tanto tempo que relaxar parece impossível. A cautela aprendida com dificuldades passadas pode virar desconfiança de toda situação nova.
  Esta carta também pode apontar para um limite sendo alcançado. Seguir forçando nem sempre é a escolha mais forte; às vezes a força está em admitir que é hora de uma pausa ou de uma mão amiga.
  Você pode explorar onde as suas defesas ainda são úteis e onde agora barram tanto as dificuldades quanto o apoio. Há alguém em quem você poderia se apoiar, uma tarefa que poderia passar adiante, ou uma pausa que poderia se permitir? Baixar um pouco a guarda, num lugar seguro, pode ser um jeito de cuidar da resiliência que você construiu.
aspects:
  relationshipsUpright: >-
    Nos vínculos próximos, esta carta pode refletir um relacionamento que atravessou tempos difíceis e continua de pé. Ela também pode apontar para uma cautela aprendida com mágoas passadas. Você pode valorizar a firmeza que vocês construíram juntos, notando ao mesmo tempo se a desconfiança antiga ainda faz sentido com alguém que já mostrou ser de confiança.
  relationshipsReversed: >-
    Com a carta invertida, você pode estar mantendo os outros à distância para não se decepcionar de novo, ou sentindo cansaço demais para dar tanto quanto de costume. Você pode considerar contar a alguém próximo que a sua energia está baixa. Permitir-se receber apoio pode aprofundar um vínculo, e não enfraquecê-lo.
  workUpright: >-
    No trabalho ou nos estudos, o Nove de Paus pode apontar para o esforço final de uma longa jornada. A experiência deixou você mais realista sobre os obstáculos, e esse conhecimento é útil. Você pode planejar com cuidado os passos que faltam, proteger o seu foco e se lembrar dos motivos pelos quais começou, para que a reta final tenha propósito e não seja só desgaste.
  workReversed: >-
    Com a carta invertida, você pode estar perto do seu limite, trabalhando na defensiva ou sentindo que tem de dar conta de tudo por conta própria. Você pode olhar para o que poderia ser delegado, adiado ou simplificado. Falar com honestidade sobre a sua capacidade pode ser uma escolha responsável que protege você e o trabalho.
  growthUpright: >-
    Talvez haja em você mais firmeza do que você reconhece. Cada dificuldade que você enfrentou ensinou algo sobre o que você consegue sustentar. Você pode anotar algumas lições de desafios recentes e considerar como elas poderiam guiar você com um pouco mais de confiança e um pouco menos de tensão.
  growthReversed: >-
