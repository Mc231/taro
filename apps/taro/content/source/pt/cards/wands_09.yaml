imageryNote: >-
  Uma figura está de pé ao entardecer dentro de um círculo de bastões cravados no chão, apoiada num deles e olhando ao longe com olhos atentos. Uma pequena fogueira queima baixa ao lado. O círculo de bastões sugere as defesas construídas pela experiência; o fogo baixo, a energia que ainda se mantém viva depois de um longo esforço; e a luz que se apaga, um dia chegando ao fim. A postura vigilante guarda ao mesmo tempo o cansaço e a persistência que segue em frente.
