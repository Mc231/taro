imageryNote: >-
  A arte pode se concentrar numa figura de pé segurando uma balança equilibrada numa mão, enquanto a outra oferece moedas a pessoas próximas. Seis moedas podem estar dispostas pela cena, algumas nas mãos e outras no ar entre elas. A balança pode simbolizar justiça e consideração; a mão estendida, generosidade; e as posições diferentes das figuras, a questão de poder que pode existir em silêncio dentro de qualquer troca.
