imageryNote: >-
  O Louco do Taro é imaginado à beira de um lugar alto, com o céu aberto à frente, no meio de um passo, levando apenas uma pequena trouxa. Um pequeno animal de companhia aos seus pés pode representar o instinto, brincalhão ou cauteloso. Uma única flor branca pode sugerir inocência e abertura, enquanto o horizonte amplo e a luz da manhã falam de possibilidade. O rosto voltado para cima convida quem olha a perguntar para onde a figura está olhando, e o que ela escolheu não carregar.
