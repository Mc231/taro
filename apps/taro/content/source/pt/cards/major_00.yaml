meaningUpright: |-
  O Louco está bem no começo dos Arcanos Maiores, com o número zero, antes de qualquer lição aprendida. É a energia de quem parte com a bagagem leve e o rosto aberto, mais interessado no que a estrada pode mostrar do que em saber direitinho onde ela termina.
  No dia a dia, esta carta pode refletir a primeira semana em um lugar novo, um hobby começado sem nenhum plano de dominá-lo, ou uma conversa que você inicia sem ensaiar cada fala. Ela pode apontar para uma parte de você que está disposta a tentar, mesmo enquanto outra parte pede uma certeza que ninguém pode oferecer. Aqui, não saber não é um defeito; é simplesmente o lugar onde toda jornada começa.
  Esta carta convida você a considerar onde um pouco mais de leveza poderia ajudar. O que mudaria se você se permitisse ser iniciante de novo, fazer perguntas básicas e aprender fazendo? O Louco não pede que você ignore o bom senso. Ele pede que você observe se o medo de errar está impedindo você de dar qualquer passo.
meaningReversed: |-
  Invertido, o Louco pode mostrar a faísca de um novo começo que ainda não pegou fogo. Você pode sentir vontade de ir em direção a algo novo e, ao mesmo tempo, não sair do lugar, revirando a ideia e esperando um sinal de que é seguro se mover. Às vezes essa espera é sábia; às vezes ela virou um hábito sem que você percebesse.
  Esta posição também pode refletir a inclinação oposta: uma energia que dispara sem olhar, dizendo sim a tudo e deixando pouco espaço para notar onde os pés vão pisar. As duas inclinações compartilham uma pergunta sobre prontidão e confiança.
  Talvez valha perguntar qual delas parece mais próxima agora. Se você está se segurando, qual seria um jeito pequeno e de baixo risco de testar a água? Se você está correndo, como seria manter o entusiasmo e acrescentar um momento de pausa antes do próximo salto?
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, o Louco pode refletir uma qualidade leve e desarmada: conhecer alguém sem roteiro, ou deixar que um vínculo conhecido surpreenda você de novo. Ele pode convidar você a levar curiosidade às pessoas próximas, fazendo perguntas cujas respostas você acha que já sabe. Abertura aqui não é ingenuidade; é a disposição de estar presente sem decidir de antemão como as coisas devem ser.
  relationshipsReversed: >-
    Invertida, esta carta pode apontar para uma hesitação em deixar alguém se aproximar, ou para um ritmo tão rápido que a outra pessoa mal consegue acompanhar. Você pode observar se está se protegendo ao manter tudo vago, ou pulando as partes mais lentas de conhecer alguém. Uma conversa gentil sobre o ritmo, o seu e o da outra pessoa, pode abrir espaço para vocês dois.
  workUpright: >-
    No trabalho ou em qualquer projeto, o Louco pode refletir o início de algo desconhecido: uma nova função, um curso, uma ideia criativa ainda sem histórico. Ele convida você a tratar os primeiros erros como informação, e não como veredito. Você pode se perguntar o que tentaria se a primeira tentativa pudesse sair imperfeita, e quem poderia ajudar você a aprender o caminho.
  workReversed: >-
    Invertido, o Louco pode refletir uma ideia que vive sendo adiada até que as condições pareçam perfeitas, ou um salto dado sem conferir o básico. Você pode considerar se lhe falta mais informação ou simplesmente mais coragem. Anotar o menor primeiro passo possível, e uma proteção prática, pode transformar um desejo vago em algo que você consegue testar sem apostar tudo nisso.
  growthUpright: >-
    No crescimento pessoal, esta carta celebra a mente de iniciante. Ela pode convidar você a experimentar algo em que não há reputação a proteger: uma nova habilidade, um caminho diferente para casa, uma pergunta feita em voz alta. O crescimento aqui vem de manter a curiosidade e se deixar surpreender, e não de acertar tudo na primeira tentativa.
  growthReversed: >-
    Invertido, o Louco pode perguntar se o medo do ridículo começou a encolher o seu mundo. Ele também pode refletir uma inquietação que pula de uma novidade para outra sem deixar nenhuma criar raízes. Você pode observar qual padrão parece familiar e experimentar, por uma semana, o seu oposto mais suave.
