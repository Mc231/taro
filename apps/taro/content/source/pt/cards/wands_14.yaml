meaningUpright: |-
  O Rei de Paus leva o fogo do naipe à maturidade. Sentada num trono, mas inclinada levemente para a frente, com o bastão na mão, esta figura parece pronta para agir. A energia é visionária e decidida: alguém que consegue ver aonde as coisas podem chegar e tem a confiança e a experiência para definir a direção.
  Essa qualidade pode aparecer quando você assume um projeto, guia um grupo numa mudança ou toma uma decisão ousada baseada em valores claros. Ela também pode descrever um mentor ou uma liderança cujo senso de propósito dá coragem aos outros.
  Esta carta convida você a assumir a sua própria autoridade. A liderança aqui tem menos a ver com controle e mais com visão, integridade e constância. Você pode se perguntar a que objetivo maior os seus esforços atuais servem e como poderia compartilhá-lo com clareza com as pessoas envolvidas. Quando uma direção é honesta e bem comunicada, os outros muitas vezes querem se juntar a ela, e não apenas seguir ordens.
meaningReversed: |-
  Invertido, o Rei de Paus pode refletir um impulso que perdeu o equilíbrio. Você pode sentir impaciência com o ritmo dos outros, empurrar planos sem escutar, ou definir metas tão altas que não sobra espaço para descanso. Por outro lado, ele pode apontar para uma liderança, talvez a sua, que perdeu de vista a visão e não sabe bem para onde ir.
  Esta carta pode estar convidando você a olhar para como usa a sua influência. A sua energia está inspirando as pessoas, ou sobrecarregando? A visão ainda está viva para você?
  Você pode fazer uma pausa para se reconectar com o seu propósito, pedir um retorno honesto ou compartilhar as decisões de forma mais ampla. Uma liderança forte muitas vezes nasce tanto de escutar quanto de dirigir.
aspects:
  relationshipsUpright: >-
    Nos relacionamentos, esta carta pode refletir uma presença confiante, protetora e encorajadora. Você pode levar visão aos planos em comum e ajudar as pessoas próximas a acreditar nos próprios objetivos. O convite é liderar com generosidade, oferecendo direção quando ela é bem-vinda e apoio quando outra pessoa quer conduzir.
  relationshipsReversed: >-
    Com a carta invertida, uma pessoa pode estar tomando controle demais das decisões, ou a impaciência pode estar criando tensão. Você pode notar se está escutando alguém próximo por inteiro ou se já está planejando a sua resposta. Convidar as ideias da outra pessoa pode transformar um plano de um lado só num plano compartilhado.
  workUpright: >-
    No trabalho ou em um projeto, o Rei de Paus pode apontar para liderança, visão estratégica e a coragem de tomar a iniciativa. Você pode definir um objetivo claro, comunicá-lo com entusiasmo e delegar de um jeito que confie nos pontos fortes dos outros. Integridade e coerência ajudam as pessoas a se sentirem seguras para seguir uma direção ambiciosa.
  workReversed: >-
    Com a carta invertida, você pode estar forçando demais, esperando que os outros acompanhem o seu ritmo, ou sem ter clareza da direção. Você pode dar um passo atrás para rever a visão com as pessoas envolvidas. Pedir contribuições e ajustar objetivos pode tornar um plano mais realista e mais apoiado.
  growthUpright: >-
    No crescimento pessoal, esta carta convida você a assumir a sua direção. O que você quer construir a longo prazo, e que valores guiam isso? Você pode escrever uma breve declaração de propósito e usá-la como ponto de referência para as escolhas que vêm pela frente.
  growthReversed: >-
    Com a carta invertida, você pode explorar a sua relação com o controle e a paciência. Você sente que tem de estar sempre no comando, ou evita liderar porque parece demais? Encontrar um caminho do meio, em que você conduz a própria vida com confiança e flexibilidade, pode ser uma forma firme de força.
reflectionQuestions:
