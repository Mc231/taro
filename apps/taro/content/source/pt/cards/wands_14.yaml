imageryNote: >-
  Uma figura está sentada num assento alto, à beira de um mirante, inclinada para a frente, com um bastão florido fincado firme ao lado, como se estivesse prestes a se levantar. Mais adiante, uma estrada serpenteia em direção a colinas distantes iluminadas pelo sol do fim da tarde. O bastão florido sugere uma visão viva e em crescimento; o mirante, uma visão ampla do que pode ser construído; e a inclinação para a frente, a prontidão para transformar ideias em ação. Brasas ou pequenos motivos de chama podem carregar o elemento fogo.
