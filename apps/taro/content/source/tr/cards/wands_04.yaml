imageryNote: >-
  Dört dik asa, yapraklardan, çiçeklerden ve kurdelelerden oluşan bir çelenkle birleşerek açık bir geçit oluşturur. Ötesinde ellerini kaldırmış figürler toplanır; uzakta sade bir ev ya da surlarla çevrili bir kasaba görünür. Dörtlü çerçeve emekle kurulmuş sağlam temelleri, çelenk ortak sevincin hasadını, açık geçit ise başkalarını dışarıda tutan değil içeri davet eden bir karşılamayı çağrıştırır.
