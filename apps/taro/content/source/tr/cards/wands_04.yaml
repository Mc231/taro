shortUpright: >-
  Bir dönüm noktası işaretlenmeyi hak ediyor; bir araya gelmenin, teşekkür etmenin ve yuva hissinin tadını çıkarmanın zamanı.
shortReversed: >-
  Bir kutlama beklenenden daha sessiz ya da daha az oturmuş hissettirebilir; kendini evinde hissetmene neyin yardım edeceğine bakabilirsin.
meaningUpright: |-
  Asa Dörtlüsü, varışın ve bir araya gelmenin kartıdır. Dört asa, bir gölgeliğin direkleri ya da konuklar için süslenmiş bir kapı gibi sade bir çerçeve oluşturur. Emeğin, altında durulup paylaşılabilecek kadar istikrarlı bir şey yarattığı bir aşamayı işaretler.
  Gündelik hayatta bu, zorlu bir çalışma dönemini bitirip arkadaşların için yemek pişirmek, sonunda sana ait hissettiren bir yere taşınmak ya da bir ailenin veya topluluğun ortak bir vesileyle bir araya gelmesi gibi görünebilir. Büyük bir başarıdan çok, çevrende insanlarla birlikte bir dinlenme noktasına varmanın sıcaklığıyla ilgilidir.
  Bu kart, durup başardığın şeyi, ne kadar mütevazı görünürse görünsün, işaretlemeye davet eder. Kutlama yalnızca bir ödül sayılmaz; bağları güçlendirir ve sırada gelecek olan için enerji verir. Bu bölümün parçası olan insanları ve onlara nasıl teşekkür edebileceğini düşünebilir ya da bir sonraki hedefe koşmadan aidiyet duygusunun tadını çıkarmana izin verebilirsin.
meaningReversed: |-
  Ters geldiğinde Asa Dörtlüsü, yuva ya da aidiyet duygusunun biraz sarsıldığını düşündürebilir. Bir buluşma planları değişiyor olabilir, bir taşınma henüz yerine oturmamış olabilir ya da bir kutlamada bulunurken kendini biraz uzakta hissedebilirsin.
  İçe dönmüş bir kutlamaya da işaret edebilir. Belki başkalarının fark etmediği bir şeyle sessizce gurur duyuyorsun ya da bir dönüm noktasını küçük ve kişisel bir şekilde işaretlemeyi tercih ediyorsun. Bunun da kendine özgü bir anlamı olabilir.
  Bir yeri ya da bir grubu sana yuva gibi hissettiren şeyin ne olduğunu sormanın zamanı olabilir. Temellerinde dikkat isteyen bir şey var mı: bir rutin, bir konuşma, küçük bir onarım? Büyük resim hâlâ yerine otururken bile küçük bir istikrar cebi yaratmanın bir yolunu bulabilirsin.
aspects:
  relationshipsUpright: >-
    İlişkilerde bu kart sıcaklığı, ortak bir kutlamayı ve hoş karşılanma hissini yansıtabilir. Bir yıldönümü, bir kavuşma, birlikte yenen bir yemek ya da yalnızca diğer kişinin senin için ne anlama geldiğini yüksek sesle söylemek yoluyla bir bağı onurlandırmanın anı olabilir. Biriyle kendini en çok nerede evinde hissettiğini fark edip ona bunu söyleyebilirsin.
  relationshipsReversed: >-
    Ters geldiğinde önemsediğin bir çevrenin biraz dışında kaldığını hissedebilir ya da bir buluşma veya ortak bir alan çevresinde bir gerginlik fark edebilirsin. Her vesilenin anlamlı olması için kusursuz olması gerekmez. Bir davet, sessiz bir konuşma ya da diğer kişi için önemli bir şeye yardım teklifi gibi yeniden bağ kurmaya yönelik küçük ve dürüst bir adım düşünebilirsin.
  workUpright: >-
    İşte ya da bir projede Asa Dörtlüsü, kabul edilmeye değer bir dönüm noktasına ulaşmaya işaret edebilir: bir lansman, tamamlanmış bir aşama, ritmini bulmuş bir ekip. Bunu mümkün kılan insanlarla kutlamak için zaman ayırabilirsin. Ortak emeği takdir etmek güveni güçlendirebilir ve bir sonraki aşamaya daha sağlam bir temel verebilir.
  workReversed: >-
    Ters geldiğinde bir dönüm noktası takdir görmeden geçebilir ya da bir ekip göründüğünden daha az oturmuş hissedebilir. Başkasının yapmasını beklemek yerine ilerlemeyi kendin dile getirebilir ya da grubun kendini daha güvende hissetmesine neyin yardım edeceğine bakabilirsin: daha net roller, ortak bir alan ya da birlikte ne kadar yol aldığınızı düşünmek için bir an.
  growthUpright: >-
    Kişisel gelişim açısından bu kart, başarıların ilerlemeden önce yerine oturmasına izin vermeye davet eder. Tamamlanmış bir adımı işaretlemek, daha zor anlara taşınan bir iç istikrar duygusu oluşturabilir. Yakın zamanda attığın bir adımı onurlandırmak için yürüyüş, yazılı bir not ya da sevdiğin bir yemek gibi kendine ait küçük bir ritüel yaratabilirsin.
  growthReversed: >-
    Ters geldiğinde kendi dönüm noktalarını atlıyor ya da hiçbir şeyin kutlanacak kadar bitmediğini hissediyor olabilirsin. Yuvanın senin için içeride ne anlama geldiğini keşfedebilirsin: hangi alışkanlıkların, yerlerin ya da insanların ayaklarını yere bastığını hissettirdiğini. Bunlardan birini güçlendirmek, altındaki zemini daha çok senin gibi hissettirebilir.
