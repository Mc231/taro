shortUpright: >-
  Meraklı ve çalışkan bir enerji var. Öğrenmek istediğin pratik bir şeyi fark edip ona doğru gerçek bir ilk adım atabilirsin.
shortReversed: >-
  İlgi sonu getirilmeden kalıyor olabilir. Hangi küçük ve gerçekçi adımın merakı pratiğe dönüştüreceğini düşün.
meaningUpright: |-
  Tılsım Prensi tek bir sikkeyi ışığa doğru kaldırır ve onu tüm dikkatiyle inceler. Bu, toprak takımının öğrencisidir: meraklı, sabırlı ve en baştan başlamaya istekli. Kart ayakları yere basan ve pratik bir öğrenmeden söz eder; okuyarak, deneyerek, ölçerek ve yeniden deneyerek gerçekleşen türden.
  Bu enerjiyi bir kursa yazılırken, öğrenecek çok şeyi olan yeni bir role başlarken, bir soruyu derinlemesine araştırırken, bir bahçe planlarken ya da kendine videolardan bir el işi öğretirken tanıyabilirsin. Bir şeyin yüzeyini geçiştirmek yerine onu doğru düzgün anlamaya yönelik sessiz bir istek olarak da ortaya çıkabilir.
  Davet, kendi merakını onurlandırmak ve ona bir yapı vermektir. Ne öğrenmek istiyorsun ve somut bir ilk adım nasıl görünürdü? Düzenli bir zaman ayırabilir, ihtiyaç duyduğun araçları toplayabilir ve acemi olmana izin verebilirsin. Burada yavaşlığın bir değeri vardır; sağlam temeller çoğu zaman bir beceriyi hızlı kazanımlardan daha ileri taşır.
meaningReversed: |-
  Ters geldiğinde Tılsım Prensi henüz eyleme dönüşememiş bir merakı yansıtabilir. Tam başlamadan bilgi, kurs ya da plan biriktiriyor ya da pek çok şeye başlayıp azını bitiriyor olabilirsin. Yeni bir ilgiyi güvenli bir şekilde teoride tutan, deneyimsiz görünme korkusuna da işaret edebilir.
  Bu çerçeve var olan ama tıkanmış bir enerjiyle ilgilidir. Öğrenme isteği gerçektir; istekten alışkanlığa giden yolun ayarlanması gerekebilir.
  Başlamayı neyin zorlaştırdığını sorabilirsin. Hedef çok mu büyük, zaman çok mu dağınık, ölçüt çok mu yüksek? Tek bir ders ya da kısa bir çalışma gibi mütevazı ve belirli bir adım seçmek fikri yere indirebilir. Kendi temponda öğrenmek de öğrenmektir.
aspects:
  relationshipsUpright: >-
    İlişkilerde bu kart sana yakın insanlara duyulan merakı yansıtabilir: alışkanlıklarını, ilgi alanlarını ve özen gösterme biçimlerini öğrenmek. Bir bağ erken ve dikkatli bir aşamada olabilir ya da daha eski bir bağ taze bir ilgiden fayda görebilir. Daha önce hiç sormadığın bir soruyu sorup cevabı gerçekten dinleyebilirsin.
  relationshipsReversed: >-
    Ters geldiğinde kart söylenmeden kalan iyi niyetleri ya da yakın birinin kendini daha az görülmüş hissetmesine yol açan bir dikkat dağınıklığını düşündürebilir. Dikkatin nereye kaydığını fark edebilirsin. Bir ayrıntıyı hatırlamak ya da bir konuşmanın devamını sormak gibi küçük ve tutarlı bir jest ilgiyi büyük planlardan daha açık gösterebilir.
  workUpright: >-
    İşte Tılsım Prensi bir öğrenme dönemini anlatabilir: yeni bir rol, bir eğitim, becerilerini genişleten bir proje. Ona titizlik ve açıklıkla yaklaşmaya davet eder. Düşünceli sorular sorabilir, not tutabilir ve her görevi inşa ettiğin uzmanlık için bir pratik olarak görebilirsin.
  workReversed: >-
    Burada kart ertelemeyi, odak eksikliğini ya da hazır hissetmediğin için yeni bir şey üstlenmekte tereddüdü yansıtabilir. Gözünü korkutan bir hedefi daha küçük parçalara bölüp bir sonrakini seçebilirsin. Yol göstermesini ya da net bir ilk görev istemek öğrenmeyi daha yönetilebilir hissettirebilir.
  growthUpright: >-
    Kişisel gelişim açısından bu kart pratik bir merakın peşinden gitmeye davet eder. Yemek yapmak, onarmak, çizmek ya da bir şey ekmek gibi elle yapılan bir şeyi öğrenmek insanın ayaklarını derinden yere bastırabilir. Bir ilgi seçip ona haftanda küçük ve düzenli bir yer verebilir, istikrarlı bir şekilde gelişmenin nasıl hissettirdiğini fark edebilirsin.
  growthReversed: >-
    Ters geldiğinde kart hazır hissedene kadar bekleme alışkanlığını ya da ilgileri zorlaşınca bırakmayı yansıtabilir. Bir kenara koyduğun bir şeye dönüp onun daha nazik ve daha kısa bir hâlini deneyebilirsin. Gelişim hız gerektirmez; yalnızca geri dönmeye devam etme isteği gerektirir.
