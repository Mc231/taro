imageryNote: >-
  Görsel, açık bir tarlada duran, tek bir sikkeyi göz hizasına kaldırıp ona yakından bakan genç bir figürü gösterebilir. Çevresini yeni sürülmüş toprak, küçük bir koru ve uzak tepeler sarabilir. Kaldırılmış sikke odaklı bir çalışmayı ve somut olana duyulan hayranlığı, açık arazi hâlâ işlenmeyi bekleyen potansiyeli, dik ve dikkatli duruş ise adım adım öğrenmeye istekliliği simgeleyebilir.
