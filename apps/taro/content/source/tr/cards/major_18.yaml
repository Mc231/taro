  relationshipsReversed: >-
    Ters geldiğinde bu kart, dağılmaya başlayan yanlış anlamalara ya da biri hakkında kendine anlattığın işe yaramaz bir hikâyeyi fark etmeye işaret edebilir. Gerçekte neyin doğru olduğunu anlamak için dürüst bir konuşma yapmayı ve diğer kişinin tarafına yer açmayı düşünebilirsin. Netlik çoğu zaman küçük parçalar hâlinde gelir ve her dürüst konuşma bir parça ekler.
  workUpright: >-
    İşte ya da bir projede Ay, belirsizliği öne çıkarır: net olmayan hedefler, değişen bilgiler ya da henüz biçimini bulmamış yaratıcı bir süreç. Bir süre bilmemeye katlanmaya davet edebilir. Hayal gücüyle yapılan beyin fırtınaları burada serpilebilir; kalıcı taahhütler için ise biraz daha netlik beklemek iyi olabilir.
  workReversed: >-
    Ters geldiğinde Ay, yeni bilgiler geldikçe dağılan bir karışıklığı ya da bir yanlış anlamayı ele alma fırsatını yansıtabilir. Açık soruları yazıp net cevaplar arayabilirsin. Kendini en kötü senaryoyu düşünürken yakalayıp daha sakin bir bakışı seçmeye de işaret edebilir. Net bilgiler bir sonraki kararı genellikle hafifletir.
  growthUpright: >-
    Rüyalar, hayal gücü ve zihninin daha az akılcı yanları Ay’ın altında keşfetmeye değer. Günlük yazmak ya da yaratıcı oyunlar onları dinlemene yardım edebilir. Ruh hâllerini ve örüntülerini fark edip onlara birer emir gibi değil, birer bilgi gibi yaklaşabilirsin.
  growthReversed: >-
    Ters geldiğinde Ay, bakışını gerçeklerden çok kaygının şekillendirip şekillendirmediğini sorabilir. Endişelerin ötesini görme yeteneğinin arttığını yansıtabilir. Korkulu bir düşünce belirdiğinde durup daha sakin bir arkadaşın neyi fark edeceğini sormayı deneyebilirsin. Bu duraklama adım adım daha sağlam bir alışkanlığa dönüşebilir.
