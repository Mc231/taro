imageryNote: >-
  Taro’nun Ay’ı, kıyıdaki uzun sazların arasından geçen bir patikanın üzerinde, sürüklenen bulutların yarı yarıya örttüğü solgun bir ay olarak hayal edilir. Patika yer yer parıldar, yer yer kaybolur; bu yüzden yolcu yavaş ilerler. Sığ suda hareketsiz duran bir balıkçıl sabırlı bir dikkati çağrıştırabilir; sudaki halkalar ise derinden yükselen duyguları ima eder. Gümüşi ışık, yumuşak gölgeler ve bulanık kenarlar izleyiciyi belirsiz bir yolculukta duyularına güvenmeye davet eder.
