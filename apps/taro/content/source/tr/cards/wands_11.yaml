shortUpright: >-
  Meraklı ve oyunbaz bir enerji keşfetmek istiyor; seni heyecanlandıranı izle ve acemi olmana izin ver.
shortReversed: >-
  Coşku pek çok şey arasında gidip geliyor ya da şüpheyle geri tutuluyor olabilir; nazikçe keşfedeceğin birini seçebilirsin.
meaningUpright: |-
  Asa Prensi ateşin hevesli öğrencisidir. Filiz veren bir asayı tutup ona hayranlıkla bakan bu figür, uzmanlıktan önceki merakı temsil eder: yeni bir şey keşfetmenin ve daha fazlasını bilmek istemenin sevinci.
  Bu enerji, bir anlık hevesle bir kursa yazılmak, yeni bir ilgi alanı hakkında bulabildiğin her şeyi okumak ya da daha yeni aklına gelmiş bir fikri arkadaşlarına anlatmak gibi görünebilir. Tanımadığın bir şeye kapı açan bir mesaj ya da davet de olabilir. Burada bir oyun duygusu ve denerken görülmeye bir isteklilik vardır.
  Bu kart, hayata bir acemi açıklığıyla yaklaşmaya davet eder. Bir ilgiyi keşfetmek için onun nereye varacağını bilmen gerekmez. Hemen iyi olma baskısı olmadan denemeye kendine izin verebilir ve bu özgürlüğün nasıl hissettirdiğini fark edebilirsin. Bazen en kalıcı tutkular küçük ve oyunbaz sorular olarak başlar.
meaningReversed: |-
  Ters geldiğinde Asa Prensi, konacak bir yer bulamayan bir merakı yansıtabilir. Bir ilgiden ötekine atlayabilir, projelere keyifle başlayıp yenilik heyecanı geçince bırakabilirsin. Ya da merak orada olabilir ama deneyimsiz görünme kaygısıyla geri tutulabilir.
  Bu kart hâlâ şekillenmekte olan fikirleri de anlatabilir: paylaşılmaya hazır olmadan önce biraz daha zamana ihtiyaç duyan kıvılcımlar.
  Huzursuzluğun ya da tereddüdün ardında ne olduğunu keşfedebilirsin. Sıkılmak mı, bağlanma korkusu mu, yoksa henüz yeterince iyi olmama korkusu mu? İlerlemenin bir yolu, tek bir ilgi seçip onun için küçük ve baskısız bir hedef koymak olabilir. Bir diğeri de keşfetmenin belli bir yere varmasına gerek duymadan tadını çıkarmana izin vermektir.
aspects:
  relationshipsUpright: >-
    İlişkilerde bu kart, birine yönelik taze bir merakı yansıtabilir: onu daha iyi tanımak, birlikte yeni şeyler denemek ya da oyunbaz bir enerjiyi paylaşmak istemek. Tanıdık bir bağa da hafiflik getirebilir. Sana yakın birine daha önce hiç sormadığın bir soruyu sorabilir ya da ikinizin de denemediği bir etkinlik önerebilirsin.
  relationshipsReversed: >-
    Ters geldiğinde bir ilişkideki heyecan dalgalar hâlinde gelip çabucak sönebilir ya da coşkunu göstermekte çekingen davranabilirsin. Derinlik yerine yenilik arayıp aramadığını fark edebilirsin. Küçük yollarla da olsa gerçek ilgini göstermek, diğer kişiyi de aynı açıklıkla karşılık vermeye davet edebilir.
  workUpright: >-
    İşte ya da eğitimde Asa Prensi bir öğrenme dönemine işaret edebilir: yeni bir beceri, taze bir rol ya da denemeye hevesli olduğun bir fikir. Burada coşku bir değerdir. Soruları rahatça sorabilir, alışık olmadığın bir şeye gönüllü olabilir ve ilk hataları yeteneğin hakkında bir hüküm olarak değil, sürecin bir parçası olarak görebilirsin.
  workReversed: >-
    Ters geldiğinde pek çok fikrin olup pek azını sonuna götürüyor ya da enerjini nereye yönelteceğinden emin olamıyor olabilirsin. Bir projeyi seçip onu her zamankinden bir adım daha ileri taşıyabilirsin. Bir mentorla ya da iş arkadaşınla konuşmak da dağınık bir kıvılcımı daha net bir yöne dönüştürmeye yardım edebilir.
  growthUpright: >-
    Asa Prensi sana basit bir ödev verir: merakınla yeniden bağ kur. Bir şey başarma baskısı yokken neyi keşfetmeyi severdin? Bu hafta oyunbaz bir deneye zaman ayırabilir ve keşfettiğin her şeyi sana neyin enerji verdiğine dair faydalı bir bilgi olarak görebilirsin.
  growthReversed: >-
    Ters geldiğinde utangaçlık ya da huzursuz bir zihin daha derine inmeni engelliyor olabilir. Bir ilgiyle doğal gelenden biraz daha uzun kalmanın ve onda yeni olduğunun görülmesine izin vermenin ne anlama gelebileceğini keşfedebilirsin. Derinlik çoğu zaman genellikle bırakıp gideceğin anın hemen ardından gelir.
reflectionQuestions:
  - "Pratik görünmese bile şu anda neyi merak ediyorsun?"
  - >-
    Hayatında seni yeni şeyler denemeye kim cesaretlendiriyor ve onunla nasıl daha çok vakit geçirebilirsin?
  - >-
    Bu hafta yalnızca ne olacağını görmek için hangi küçük denemeye başlayabilirsin?
imageryNote: >-
  Genç bir figür açık bir manzarada durur; bir asayı dik tutar ve ağacından filizlenen taze bir sürgüne açık bir hayranlıkla bakar. Giysilerinde ateş elementine gönderme yapan küçük alev ya da semender motifleri olabilir. Filizlenen asa canlı ve büyüyen bir fikri, merak dolu bakış merakı, açık arazi ise keşfedilmeyi bekleyen pek çok yönü temsil eder.
