  relationshipsReversed: >-
    Ters geldiğinde bu kart, başka birinin duygusal yükünün fazlasını üstlenmeye ya da bir bağda kendi ihtiyaçlarını gözden kaçırmaya işaret edebilir. Nazik bir sınırın hem seni hem de ilişkiyi nerede koruyabileceğini sorabilirsin. Kendine özen göstermek bir başkasına özen göstermenin parçası olabilir.
  workUpright: >-
    İşte bu kart bakım, öğretmenlik, yaratıcı ya da destek işleri gibi empati gerektiren rolleri veya yalnızca başkalarının güvendiği iş arkadaşı olmayı yansıtabilir. Duygusal zekâya gerçek bir beceri olarak değer vermeye davet edebilir. İyi dinlemek sonuçları herhangi bir strateji kadar şekillendirebilir.
  workReversed: >-
    Ters geldiğinde kart, iş yerinde herkesin desteği olmaktan gelen duygusal bir yorgunluğu yansıtabilir. Başkalarının stresini kendininmiş gibi nerede üstlendiğini fark edebilirsin. Neyin taşınması sana düştüğünü ve neyin düşmediğini netleştirmeyi ve gün içinde enerjini toparlamanın küçük yollarını bulmayı düşün.
  growthUpright: >-
    Kişisel gelişim açısından Kupa Kraliçesi sezginle ve duygularınla ilişkini derinleştirmeye davet eder. Bir soruyla sessizce oturup üzerine düşünmeden önce aklına neyin geldiğini fark edebilirsin. Günlük yazmak ya da su kenarında vakit geçirmek gibi pratikler içini dinlemene yardım edebilir.
  growthReversed: >-
    Ters geldiğinde bu kart şefkatini kendine de yöneltmeni isteyebilir. Bir arkadaşına asla yöneltmeyeceğin bir öz eleştiriyi fark edebilirsin. Nazik rutinler, dinlenme ve sınırlar kendini dengede hissetmene yardım edebilir. Duygular bunaltıcı hâle gelirse güvendiğin birine ulaşmak destek sunabilir.
