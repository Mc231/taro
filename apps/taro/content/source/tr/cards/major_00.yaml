imageryNote: >-
  Taro’nun Delisi, önünde açık bir gökyüzü olan yüksek bir yerin kenarında, adım atmak üzereyken ve yanında yalnızca küçük bir bohçayla hayal edilir. Ayaklarının dibindeki küçük bir hayvan, oyunbaz ya da uyarıcı bir içgüdüyü temsil edebilir. Tek bir beyaz çiçek masumiyeti ve açıklığı çağrıştırabilir; geniş ufuk ve sabah ışığı ise olasılıklardan söz eder. Figürün yukarı dönük yüzü, izleyiciyi neye baktığını ve neyi taşımamayı seçtiğini sormaya davet eder.
