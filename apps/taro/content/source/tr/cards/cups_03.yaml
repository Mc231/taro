shortUpright: >-
  Sevinçlerini kimlerin paylaştığını ve onların sevinçlerini karşılığında nasıl paylaşabileceğini fark etmek için bir an.
shortReversed: >-
  Bağlar şu anda zayıf ya da yorucu hissettirebilir; hangi buluşmaların seni beslediğini, hangilerinin yalnızca vakit doldurduğunu düşün.
meaningUpright: |-
  Kupa Üçlüsü, kupalarını birlikte kaldıran arkadaşların kartıdır. Bir nedene ihtiyaç duymayan türden bir bağı kutlar: mutfak masasındaki kahkahalar, iyi bir haberle canlanan bir grup sohbeti, istenmeden yardım eden komşular. Kupa İkilisi tek bir bağa bakarken bu kart çevreye bakar.
  Buluşmalarla dolu bir dönemi, işaretlenmeye değer bir dönüm noktasını ya da yalnızca seni gören bir gruba ait olma hissini yansıtabilir. Çevrende zaten var olan, belki de fark ettiğinden daha fazla olan bir desteğe de işaret edebilir.
  Bu kart, sevinci sonraya saklamak yerine paylaşmaya davet eder. Uzun zamandır görmek istediğin birine ulaşabilir, bir davete evet diyebilir ya da kendine ait küçük bir vesile yaratabilirsin. Kutlamanın büyük olması gerekmez. Bazen yalnızca iyi bir şeyin olduğunu ya da zor bir şeyi atlattığınızı birlikte kabul etmektir.
meaningReversed: |-
  Ters geldiğinde Kupa Üçlüsü, ahengi bozulmuş bir sosyal hayatı yansıtabilir. Bir zamanlar parçası olduğunu hissettiğin bir grubun kenarında kaldığını hissedebilir ya da hayatlar değiştikçe dostlukların uzaklaştığını fark edebilirsin. Ya da güzel bir şeyin fazlası olabilir: dinlenmeye yer bırakmayan planlar ya da daha sessiz duygulardan kaçmanın bir yoluna dönüşmüş kutlamalar.
  Bunların hiçbiri dostlukların hakkında bir hüküm sayılmaz. Çevreler biçim değiştirir ve bazı buluşmaların sana dar gelmesi, başkalarını özlemen doğaldır.
  Davet, bağlarının sayısından çok niteliğine bakmaktır. Hangi insanlar seni daha çok kendin gibi hissettiriyor? Nerede alışkanlıktan evet diyor olabilirsin? Tek bir arkadaşla yapılacak dürüst bir sohbet, kalabalık bir takvimden daha fazlasını sunabilir.
aspects:
  relationshipsUpright: >-
    İlişkilerde bu kart, bir bağın çevresindeki daha geniş ağı öne çıkarır: arkadaşlar, aile, seçilmiş aile. Güzel anları seni destekleyen insanlarla paylaşmaya ya da yakın birini çevrene kabul etmeye davet edebilir. Dostluklarının seni ne kadar ayakta tuttuğunu fark edip onlara genellikle tek bir ilişkiye ayırdığın ilginin bir kısmını verebilirsin.
  relationshipsReversed: >-
    Ters geldiğinde bu kart bir gruptaki gerginliği ya da dışlanmışlık hissini yansıtabilir. Bir bağ üzerindeki, hangi biçimde olursa olsun, dışarıdan bir etkiye de işaret edebilir. Tahmin yürütmek yerine işlerin nasıl olduğunu açıkça sorabilirsin. Yanlarında rol yapmak ya da ayak uydurmak zorunda olmadığın insanlarla vakit geçirmek de yardımcı olabilir.
  workUpright: >-
    İşte Kupa Üçlüsü ekip ruhuna, ortak bir kazanıma ya da birlikte çalışmaktan gerçekten keyif alan iş arkadaşlarına işaret edebilir. İlerlemeyi yalnızca sonunda değil, yol boyunca da kutlamaya davet edebilir. İnsanlara adlarıyla teşekkür etmek, övgüyü paylaşmak ve küçük dönüm noktalarını işaretlemek bir grubu güçlendirebilir ve işi daha doyurucu kılabilir.
  workReversed: >-
    Ters geldiğinde kart, belki dedikodu, gruplaşmalar ya da düpedüz aşırı yük yüzünden sıcaklığını kaybetmiş bir ekibi yansıtabilir. Uyum sağlamak için geç saate kadar kalmak gibi, sosyal baskının seçimlerini şekillendirip şekillendirmediğini fark edebilirsin. Sağlıklı bir meslektaşlığın senin için nasıl görüneceğini ve onu küçük bir şekilde nerede örnekleyebileceğini düşün.
  growthUpright: >-
    Kişisel gelişim açısından bu kart, sevince önce kazanılması gereken bir ödül olarak değil, dengeli bir hayatın parçası olarak değer vermeye davet eder. Bir hafta boyunca paylaşılan küçük keyifleri not edebilirsin. Onları fark etmek, zaten sahip olduğun topluluğu tanımayı ve onu nerede genişletmek isteyebileceğini görmeyi kolaylaştırabilir.
  growthReversed: >-
    Ters geldiğinde bu kart, düşüncelerinle yalnız kalmaktan kaçınmak için meşguliyeti ya da kalabalığı kullanıp kullanmadığını sorabilir. Kabul etmesi zor bir yalnızlığı da yansıtabilir. Sosyal zamanı yalnız kalmakla dengeleyip hangisini daha çok özlediğini fark edebilirsin. Tek bir kişiye ulaşmak nazik bir başlangıç olabilir.
reflectionQuestions:
