    Bu hafta güzel bir şeyi paylaşmak için hangi küçük vesileyi yaratabilirsin?
imageryNote: >-
  Görsel, gevşek bir çember oluşturmuş, kupalarını kaldırıp ortada buluşturan üç figürü gösterir. Ayaklarının dibindeki meyve, çiçek ya da asma hasadı ortak emekten doğan bolluğu çağrıştırabilir. Farklı giysileri, duruşları ve renkleri, birbirine ait olurken kendileri olarak kalan arkadaşları temsil edebilir. Bir dans adımı ya da dönen bir etek ucu gibi sahnedeki hareket rahat ve zorlamasız bir sevinci aktarır.
