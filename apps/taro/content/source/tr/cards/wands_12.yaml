  relationshipsReversed: >-
    Ters geldiğinde güçlü duygular iletişimden daha hızlı ilerleyebilir ya da coşku geldiği kadar çabuk soğuyabilir. Senin ya da sana yakın birinin birbirine danışmadan bir dürtüyle hareket edip etmediğini fark edebilirsin. Her bir kişinin gerçekte ne istediğini konuşmak için yavaşlamak, kıvılcımlarla dolu bir bağa istikrar getirebilir.
  workUpright: >-
    İşte ya da bir projede Asa Şövalyesi cesur bir inisiyatif almaya işaret edebilir: iddialı bir fikri sunmak, bir atılıma öncülük etmek ya da bir fırsat için hızla harekete geçmek. Bu itkiyi durgunluğu kırmak için kullanırken ilk heyecan dalgasından sonraki adımlar için basit bir plan yapabilirsin.
  workReversed: >-
    Ters geldiğinde kararları aceleye getiriyor ya da tıkanmış ve sabırsız hissediyor olabilirsin. Hızın gerçekten gerekli olup olmadığını ya da planlama için kısa bir duraklamanın sana daha iyi hizmet edip etmeyeceğini kontrol edebilirsin. Hayal kırıklığını net bir sonraki adımlar listesine dönüştürmek, enerjinin kendi etrafında dönmek yerine ileri gitmesine yardım edebilir.
  growthUpright: >-
    Cesaret ve deneyime duyulan iştah, bu kartın kullanmanı istediği armağanlardır. Kendi coşkuna güvenseydin ne yapardın? Seni biraz zorlayan bir şeyi deneyip yalnızca temkinle değil, tutkuyla hareket etmenin nasıl hissettirdiğini fark edebilirsin.
  growthReversed: >-
    Ters geldiğinde dürtüyle olan ilişkini keşfedebilirsin. Kendiliğindenlik sana ne zaman sevinç getiriyor, ne zaman seni dağınık bırakıyor? Kıvılcımını kaybetmeden harekete geçmeden önce kısa bir an durmayı öğrenmek, enerjinin seni yönlendiren bir şey olmaktan çıkıp senin yönlendirdiğin bir şeye dönüşmesine yardım edebilir.
