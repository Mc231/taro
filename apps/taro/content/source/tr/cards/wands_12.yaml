imageryNote: >-
  Dörtnala giden bir binici, şaha kalkan ya da sıçrayan bir atın üzerinde öne eğilir; asası havada, pelerini arkasında dalgalanır. Önünde çöl tepeleri ya da açık ovalar uzanır; binicinin giysilerini küçük alev biçimleri ya da semenderler süsleyebilir. Sıçrayan at tutkuyu ve itkiyi, kaldırılmış asa eyleme taşınan amacı, geniş manzara ise hâlâ açılmakta olan macerayı temsil eder. Öne eğilmiş duruş hem cesareti hem de aceleciliği ima eder.
