imageryNote: >-
  Görsel, sakin bir atın üzerinde bir nehir kıyısı boyunca ya da sessiz bir vadide yavaşça ilerleyen, bir kupayı armağan gibi önüne uzatmış bir biniciyi gösterir. Zırhındaki ve pelerinindeki dalga ya da deniz kabuğu motifleri hayal gücünü ve duygusal derinliği çağrıştırabilir. Hemen yanında akan su duygunun hareketini yankılar. Bir dokunuş sıcak renkle yumuşak maviler ve gümüş tonlar romantizmi, içtenliği ve düşsel bir amaç duygusunu aktarır.
