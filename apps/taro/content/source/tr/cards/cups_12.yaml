  workReversed: >-
    Ters geldiğinde kart sunum aşamasında kalan fikirleri ya da ruh hâlinle birlikte inip çıkan bir motivasyonu yansıtabilir. Büyük bir vizyonu sürdürebileceğin daha küçük adımlara bölebilirsin. Kapasiten konusunda dürüst olmak hem ideallerini hem de başkalarının sana duyduğu güveni koruyabilir.
  growthUpright: >-
    Kişisel gelişim açısından Kupa Şövalyesi seni etkileyen şeylerin peşinden gitmeye davet eder. Yalnızca senin için önemli olduğu için yaratıcı ya da şefkatli bir etkinlik deneyebilirsin. Kalbini neyin kıpırdattığını fark etmek değerlerini netleştirebilir ve onlara göre sıradan, gündelik yollarla yaşamana yardım edebilir.
  growthReversed: >-
