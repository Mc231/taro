shortUpright: >-
  Pratik bir sıcaklık ve özen senin için hazır. Başkaları için nasıl rahatlık yarattığını ve kendini de buna katıp katmadığını fark et.
shortReversed: >-
  Özen dışarıya akarken senin gücün azalıyor olabilir. Kendi ihtiyaçlarına başkalarınınki kadar sıcak bir şekilde nasıl bakabileceğine bakabilirsin.
meaningUpright: |-
  Tılsım Kraliçesi bereketli ve işlenmiş bir alanda oturur; canlı bir şeyi kucaklıyormuş gibi kucağında bir sikke tutar. Bu kraliçe pratik bir beslemeyi temsil eder: biri geldiğinde hazır olan bir yemek, dinlendirici hissettiren bir ev, özenle tutulan bir bütçe, insanları doyuran bir bahçe. Buradaki enerji sıcak, becerikli ve ayakları yere basandır; herkesin taşıyabileceği nitelikler.
  Bunu bir haneyle ilgilenmekte, yoğun bir dönemde bir arkadaşını desteklemekte, bir çalışma alanını davetkâr kılmakta ya da herkese yetecek kadar olsun diye zamanı ve kaynakları idare etmekte tanıyabilirsin. Kendi bedenine ve çevrene gösterdiğin özeni de yansıtabilir: dinlenme, besleyici yiyecekler, temiz hava ve içinde olmanın iyi hissettirdiği alanlar.
  Bu kart, rahatlık ve istikrar yaratmanın sessiz becerisini fark etmeye davet eder. Başkalarıyla ve çevrenle nasıl ilgileniyorsun? Kendine de aynı özeni gösteriyor musun? Gündelik hayatını biraz daha besleyici kılmanın bir yolunu seçip pratik nezaketin evde başlamasına izin verebilirsin.
meaningReversed: |-
  Ters geldiğinde Tılsım Kraliçesi tek taraflı hâle gelmiş bir özeni yansıtabilir. Kendin dışında herkesle ilgileniyor, başkaları desteklendiğini hissederken sen boş depoyla ilerliyor olabilirsin. Öte yandan özen kontrole kayabilir; yardım etmek yönetmeye dönüşür ve başkalarının kendi yollarını bulmasına pek yer kalmaz.
  Bu çerçeve, özenin nasıl aktığına yeniden bakmanı ister. Beslemek değerlidir ve sen de dahil işin içindeki herkese karşı sürdürülebilir ve saygılı olduğunda iyi işler.
  Ertelediğin ve ihtiyaç duyduğun şeyin ne olduğunu sorabilirsin. Bir görevi başka biri üstlenebilir mi? Bütün ev dağılmadan bir ölçütün biraz gevşemesine izin verebilir misin? Kendi enerjine, alanına ve rahatlığına özen göstermek bencillik sayılmaz; özeninin sürmesini sağlayan şey bu olabilir.
aspects:
  relationshipsUpright: >-
    İlişkilerde bu kart sıcak ve pratik bir özeni yansıtabilir: birinin kendini evinde hissetmesini sağlamak, onu somut yollarla desteklemek, birlikte istikrarlı bir üs yaratmak. Sevgini eylemlerle nasıl ifade ettiğini ve çevrendekilerin onu nasıl almayı tercih ettiğini fark edebilirsin. Paylaşılan bir yemek ya da sessiz bir akşam çok anlam taşıyabilir.
  relationshipsReversed: >-
    Ters geldiğinde kart aldığından fazla özen verdiğini ya da yardım etmenin başka birinin seçimlerini yönetmeye dönüştüğünü düşündürebilir. Denge hakkında açıkça konuşup karşılığında destek isteyebilirsin. Başkalarının sana özen göstermesine izin vermek yakınlığı derinleştirebilir.
  workUpright: >-
    İşte Tılsım Kraliçesi sıcaklıkla birleşen bir yetkinliği anlatabilir: kaynakları iyi idare etmek, iş arkadaşlarını desteklemek, insanların iyi iş çıkarabileceği bir ortam yaratmak. İşlerin sorunsuz yürümesini sağlama yeteneğini fark edip bu beceriyi tek başına taşımadan nasıl paylaşabileceğini düşünebilirsin.
  workReversed: >-
    Burada kart işte başkaları için kendini fazla yormayı ya da işle ev hayatını dengelemekte zorlanmayı yansıtabilir. Hangi sorumlulukların gerçekten senin olduğuna bakıp zamanının çevresine sınırlar koyabilirsin. Bir ekip için sürdürülebilir özen kendine gösterilen özeni de içerir.
  growthUpright: >-
    Kişisel gelişim açısından bu kart kendini pratik olarak beslemeye davet eder: düzenli öğünler, dinlenme, açık havada zaman, rahat bir alan. Ayaklarını yere bastıran küçük bir öz bakım rutini yaratıp onu isteğe bağlı bir ek olarak değil önemli bir taahhüt olarak görebilirsin.
  growthReversed: >-
    Ters geldiğinde kart kendi ihtiyaçlarını en sona koyma ya da değerini başkaları için ne kadar çok şey yaptığınla ölçme alışkanlığını yansıtabilir. Bu örüntünün nereden geldiğini keşfedebilirsin. Başkalarına gösterdiğin sabrı kendine de göstermek hem enerjiyi hem sevinci geri getirebilir.
reflectionQuestions:
