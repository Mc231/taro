imageryNote: >-
  Görsel, çiçek açmış bir bahçenin içinde oymalı bir tahtta oturan ve kucağındaki bir sikkeyi nazikçe tutan taçlı bir figürü gösterebilir. Tahtın çevresini çiçekler, meyveler ve tavşan gibi küçük bir hayvan sarabilir; yakından bir dere akabilir. Bahçe özenle gelen bolluğu, kucaklanan sikke dikkatli bir sahiplenmeyi, hayvan ise yaratıcı zenginliği ve doğal dünyadaki rahatlığı simgeleyebilir.
