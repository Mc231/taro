imageryNote: >-
  Alacakaranlıkta bir figür, toprağa çakılmış asalardan oluşan bir halkanın içinde durur; birine yaslanmış, dikkatli gözlerle dışarı bakar. Yanında küçük bir kamp ateşi kısık yanar. Asalardan halka deneyimle kurulmuş savunmaları, kısık ateş uzun bir çabanın ardından hâlâ canlı tutulan enerjiyi, sönen ışık ise sonuna yaklaşan bir günü çağrıştırır. Tetikteki duruş hem yorgunluğu hem de devam ettiren sebatı taşır.
