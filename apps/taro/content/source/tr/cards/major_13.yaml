  relationshipsReversed: >-
    Ters geldiğinde bu kart, iki kişinin de çoktan aştığı eski bir dinamiğe tutunmaya ya da bir bağın değiştiğini kabul etmekte zorlanmaya işaret edebilir. Bu ilişkinin yeni biçimini almasına izin vermek için, o biçim ne olursa olsun, neye ihtiyaç duyacağını düşünebilirsin.
  workUpright: >-
    İşte ya da bir projede Ölüm, tamamlanmayı ve geçişi öne çıkarır. Bir rolü bitirmeyi, bir projeyi kapatmayı ya da ömrünü doldurmuş bir çalışma biçimini emekliye ayırmayı yansıtabilir. Neler öğrendiğini ve bir sonraki bölüme neyi taşımak istediğini gözden geçirebilirsin.
  workReversed: >-
    Ters geldiğinde Ölüm, artık uymadığı hâlde bir göreve, role ya da yönteme alışkanlıktan bağlı kalmayı yansıtabilir. Sonrasında gelecek olandan duyulan korkuya da işaret edebilir. Mevcut durumun sana hâlâ ne verdiğini ve neye mal olduğunu listeleyip bu dengenin sana ne söylediğini fark edebilirsin.
  growthUpright: >-
    Eski kimlikler yapraklar gibi dökülüp hâlâ şekillenmekte olana yer açabilir. Bir zamanlar kendin hakkında doğru olan ama artık doğru olmayan inançları fark edebilirsin. Onları bırakmak, dönüşmekte olduğun kişiye daha sadık bir hâline alan yaratabilir.
  growthReversed: >-
    Ters geldiğinde Ölüm, değişim korkusunun seni ihtiyaç duyduğundan daha dar bir alanda tutup tutmadığını sorabilir. Güvenini hak eden yavaş ve sabırlı bir dönüşümü yansıtabilir. Bu hafta bırakacağın küçük bir şey seçip sonrasında nasıl hissettirdiğini fark edebilirsin.
