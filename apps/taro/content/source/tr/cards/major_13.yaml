imageryNote: >-
  Taro’nun Ölüm kartı, ağır akan bir nehrin dökülen yaprakları ufukta yükselen güneşe doğru taşıdığı sessiz bir sonbahar manzarası olarak hayal edilir. Pelerinli ve telaşsız bir figür suyun kenarında yürür; elinde, biten şeyin ve büyümeyi bekleyen şeyin simgeleri olarak tek bir tohum kabuğu ya da çıplak bir dal taşır. Koyu bir zemin üzerindeki beyaz bir çiçek, bırakmanın içindeki yenilenmeyi çağrıştırabilir. Hava sakin ve saygılıdır; kayba değil dönüşüme işaret eder.
