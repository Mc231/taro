imageryNote: >-
  Özgün çizim, yırtık ve hızla ilerleyen bulutların altında rüzgârlı bir kıyıyı gösterir. Bir figür üç kılıcı gevşekçe tutup geriye bakar; iki kılıç daha kumda yatar. Diğer iki figür suya doğru uzaklaşır. Dağınık kılıçlar çözülmeden bırakılmış tartışmaları, dönük sırtlar ise çatışmanın yarattığı mesafeyi düşündürür. Huzursuz gökyüzü, sözler bittikten sonra bile hâlâ çalkalanan bir zihni yansıtır.
