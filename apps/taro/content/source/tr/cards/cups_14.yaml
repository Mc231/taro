  workUpright: >-
    İşte bu kart diplomatik bir liderliği, mentorluğu ya da baskı altında bir ekibi dengede tutabilme yeteneğini yansıtabilir. Kararlara duygusal zekâ katmaya davet edebilir. Empatiyi net sınırlarla dengelemek, insanların hem önemsendiğini hem de yönlendirildiğini hissettiği bir iş yeri yaratabilir.
  workReversed: >-
    Ters geldiğinde kart taşana kadar gizlenen stresi ya da insanları dengesiz bırakan bir liderliği yansıtabilir. Gerginliği nasıl açık ve adil bir şekilde ele alabileceğini düşünebilirsin. Destek istemek ya da bazı görevleri devretmek baskının yüzeyin altında birikmesini önleyebilir.
  growthUpright: >-
    Kişisel gelişim açısından Kupa Kralı duyguyu ve aklı bir araya getirmeye davet eder. Bir duyguyu fark etmeyi, ona ad vermeyi ve sonra değerlerine uyan bir tepki seçmeyi deneyebilirsin. Bu, işler fırtınalı hâle geldiğinde dengede kalabileceğine dair sessiz bir özgüveni adım adım inşa edebilir.
  growthReversed: >-
    Ters geldiğinde bu kart güçlü duygularla nasıl başa çıktığını keşfetmeni isteyebilir. Her şeyi içinde tutma ya da hepsini dışa vurma örüntülerini fark edebilirsin. Nefes almak için durmak ya da konuşmadan önce yazmak gibi nazik pratikler, duygulara saygı gösterilen ama onların her şeyi ele geçirmediği bir orta zemin bulmana yardım edebilir.
