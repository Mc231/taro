imageryNote: >-
  Görsel, hareketli suyun üzerinde, yıpranmış taştan bir platformda oturan taçlı bir figürü gösterir; bir elinde kupa, diğerinde kısa bir asa vardır. Çevresindeki su yükselip alçalır ama figürün omuzları gevşek, bakışları dengeli kalır. Bu karşıtlık duygusal ustalığı düşündürürken altın dokunuşlarla ısınmış koyu maviler bilgeliği ve cömertliği ima eder.
