imageryNote: >-
  Özgün çizim, ay ışığıyla aydınlanan bir tarlayı parmak uçlarında geçen, kucağında bir yığın kılıç taşıyan bir figürü gösterir; birkaç kılıç ise arkada çimenlerin arasında dikili kalır. Uzaktaki çadırlar habersizce, yumuşakça parıldar. Bir ayak izi dizisi izlenen yolu gösterir. Kucaktaki yığın sunulandan fazlasını üstlenmeyi, geride kalan kılıçlar taşınamayacak olanı, geriye dönük bakış ise görülmeden hareket etmenin tedirginliğini düşündürür.
