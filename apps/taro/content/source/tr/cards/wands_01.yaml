shortUpright: >-
  Yeni bir ilgi kıvılcımı, aleve dönüşmeden önce biraz hava ve dikkat istiyor.
shortReversed: >-
  Kıvılcım orada olabilir ama bir şey henüz tutuşmasını engelliyor; neye ihtiyaç duyduğunu fark et.
meaningUpright: |-
  Asa Ası destedeki ilk ateş pırıltısıdır: ani bir fikir, bir merak çekimi, seni doğrultup "Bunu denemek istiyorum" diye düşündüren an. Henüz bir planı olmayan ham bir enerjidir; bitmiş bir projeden çok bir heyecan tohumuna yakındır.
  Gündelik hayatta bu, bir fişin arkasına karalanmış bir eskiz, yıllardır hayranlıkla izlediğin bir enstrümanı öğrenme isteği ya da seni olasılıklarla dolup taşmış hâlde bırakan bir sohbet gibi görünebilir. Bir kenara bıraktığın bir şeye duyulan iştahın beklediğinden daha sıcak bir şekilde geri dönmesi de olabilir.
  Bu kart, enerjinin şu anda nereye gitmek istediğini, henüz kendini açıklamasını istemeden fark etmeye davet eder. Bir kıvılcımın gerekçeye değil, biraz oksijene ihtiyacı vardır. Ona bugün küçük ve somut bir çıkış yolu verebilirsin; on dakika, ilk bir not ya da aynı ilgiyi paylaşan birine tek bir mesaj gibi. Sonra nasıl karşılık verdiğine bakabilirsin.
meaningReversed: |-
  Ters geldiğinde Asa Ası, tam tutuşmamış bir kıvılcımı yansıtabilir. İlgi gerçek olabilir ama sürekli yarına ertelenebilir ya da tutunacak bir şey bulamadan parlayıp sönebilir. Bazen enerji o kadar çok başlangıca yayılır ki hiçbiri yeterince sıcaklık alamaz.
  Daha sessiz bir döneme de işaret edebilir. Her fikir gösterilmeye hazır değildir; bazıları gün ışığına çıkmadan önce kişisel notlarda ve hayallerde güç toplayarak bir süre toprağın altında kalmaya ihtiyaç duyar.
  Kıvılcımının gerçekte neye ihtiyaç duyduğunu sormak için bir an olabilir. Zamana mı, daha net bir ilk adıma mı, acemi olmaya izin verilmesine mi, yoksa başlamadan önce dinlenmeye mi? Kusursuz anın gelmesini beklemek yerine yığının içinden bir fikir seçip ona küçük ve korunaklı bir alan verebilirsin.
aspects:
  relationshipsUpright: >-
    Yakın bağlarda bu kart taze bir sıcaklık ya da merak dalgasını yansıtabilir: birlikte yeni bir şey planlamak, farklı sorular sormak ya da tanıdık bir bağa daha fazla oyun katmak istemek. Şu sıralar seni kimin heyecanlandırdığını ve küçük de olsa nasıl ortak bir maceranın bu enerjiyi aranızda dolaştırabileceğini fark edebilirsin.
  relationshipsReversed: >-
    Ters geldiğinde seninle yakın biri arasındaki kıvılcım rutin, yorgunluk ya da söylenmemiş bir tereddüt yüzünden boğuk hissettirebilir. Bu sıcaklığın gittiği anlamına gelmez; yalnızca bir aralık bekliyor olabilir. Eskiden aranızda neyin sohbet başlattığını ve küçük bir merak jestinin o canlılığın bir kısmını geri davet edip edemeyeceğini düşünebilirsin.
  workUpright: >-
    İşte ya da yaratıcı bir projede Asa Ası gerçek bir çekim gücü olan bir fikre işaret edebilir: yeni bir yaklaşım, bir yan proje, dönüp durduğun bir teklif. Ona kaba bir taslak, bir prototip ya da güvendiğin birine kısa bir sunum gibi ilk somut biçimini verebilirsin; böylece yalnızca kafanda değil, açıkta sınanabilir.
  workReversed: >-
    Ters geldiğinde motivasyon titreşiyor olabilir. Belki bir fikir onay bekliyordur ya da zamanın için yarışan çok fazla başlangıç vardır. İzleyeceğin bir ipliği seçip diğerlerini şimdilik bir kenara koymanın zamanı olabilir. Tek bir fikirde küçük ve görünür bir ilerleme, çoğu zaman birkaçını birden planlamaktan daha fazla enerji yakabilir.
  growthUpright: >-
    Merak kendi başına bir öğretmen olabilir ve bu kart onu izlemeyi önerir. Sana çekici gelen şey, çoğu zaman içinde neyin büyümek istediği hakkında bir şey söyler. Bu hafta hissettiğin kıvılcımları yargılamadan not edip sürekli geri dönen kıvılcımı arayabilirsin.
  growthReversed: >-
    Ters geldiğinde başlamadan önce hazır hissetmeyi bekliyor ya da ilham dolu hissetmediğin için kendine sert davranıyor olabilirsin. Enerji mevsimler hâlinde hareket etme eğilimindedir. Bu dönemi sessizce güç topladığın bir zaman olarak görebilirsin: dinlenmek, okumak, fark etmek ve yeni bir ilginin kendi temposunda şekillenmesine izin vermek.
reflectionQuestions:
