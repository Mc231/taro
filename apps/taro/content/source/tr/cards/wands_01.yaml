imageryNote: >-
  Çerçeveye tek bir canlı asa yükselir; yeni kesilmiş olsa da hâlâ yeşil sürgünler verir, sanki ağaç büyümekten kendini alamıyormuş gibi. Ucunda küçük bir alev ya da parıltı toplanır. Dal, hâlâ canlı ve biçimlenmemiş ham yaratıcı gücü temsil eder; yeni yapraklar ise ilhamın özen gördüğünde büyüdüğünü düşündürür. Sıcak kırmızılar ve altın tonları ateş elementini taşıyabilir; arkadaki açık gökyüzü ise keşfedilecek alanı ima eder.
