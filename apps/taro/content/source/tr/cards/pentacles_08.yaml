imageryNote: >-
  Görsel, elinde aletlerle bir tezgâhın üzerine eğilmiş, bir sikkeyi şekillendiren bir figürü gösterebilir; bitmiş sikkeler ise hemen yanda, belki bir direkte ya da duvarda düzgün bir sıra hâlinde asılıdır. Uzaktaki bir yol ya da kasaba, ustanın yoğunlaşmak için uzaklaştığı daha geniş bir dünyayı düşündürebilir. Tekrarlanan sikkeler pratiği ve tutarlılığı, kendini işe vermiş duruş ise becerili ve dikkatli bir emeğin sessiz doyumunu simgeleyebilir.
