imageryNote: >-
  Her biri bir asa tutan beş figür birbirine yakın durur; asalarını birbirini kesen açılarla kaldırmışlardır. Sahne canlı ve biraz karmaşıktır ama kimse yaralanmış görünmez; bu da sahneyi gerçek bir yarışma ile bir antrenman oyunu arasında açık bırakır. Birbirini kesen asaların karmaşası birbirine karşı itişen fikirleri ve hırsları simgeleyebilir; çevrelerindeki açık alan ise geri çekilip ortak bir ritim bulmaya yer olduğunu düşündürür.
