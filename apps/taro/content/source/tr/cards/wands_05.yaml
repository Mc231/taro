shortUpright: >-
  Pek çok ses ve enerji çatışıyor; bu sürtüşme seni yorduğu kadar fikirleri de keskinleştiriyor olabilir.
shortReversed: >-
  Bir çatışma yatışıyor ya da yer altına çekiliyor olabilir; hangi anlaşmazlıkların hâlâ adil bir dinlenmeye ihtiyacı olduğunu fark edebilirsin.
meaningUpright: |-
  Asa Beşlisi çarpışan enerjiyi gösterir. Birkaç asa birbirini keser ve birbirine çarpar; bunun gerçek bir kavga mı, bir oyun mu yoksa bir antrenman mı olduğunu söylemek zordur. Kartın özü bu belirsizliktir: aynı sürtüşme, nasıl taşındığına göre tüketici ya da canlandırıcı hissettirebilir.
  Bunu herkesin aynı anda konuştuğu bir toplantıda, ev işleri yüzünden tartışan ev arkadaşlarında, çok fazla yöne çekilen bir grup projesinde ya da yalnızca yarışan önceliklerle dolu bir zihinde tanıyabilirsin. Karışımın içinde hırs, gurur ve iyi fikirler olabilir; hepsi farklı yönlere çeker.
  Bu kart, içinde bulunduğun çatışmanın türüne bakmaya davet eder. Her fikrin güçlenmesine mi yardım ediyor, yoksa puan toplama yarışına mı dönüştü? Alışverişi yavaşlatmayı, ortak bir hedefe ad vermeyi ya da basit kurallar üzerinde anlaşmayı deneyebilirsin; böylece anlaşmazlığın enerjisi tüketici olmaktan çıkıp işe yarar hâle gelebilir. Bazen bir an geri çekilmek asıl anlaşmazlığın nerede olduğunu gösterir.
meaningReversed: |-
  Ters geldiğinde Asa Beşlisi, çatışmanın ele alınış biçimindeki bir değişime işaret edebilir. İnsanlar ortak bir zemin buldukça gerginlik yatışıyor olabilir ya da huzuru korumak için anlaşmazlıklar söylenmeden bırakılıp yalnızca gözden uzağa itilmiş olabilir.
  İçe de dönebilir; içindeki farklı yanlar arasında bir çekişme olarak: dinlenmek isteyen yanınla zorlamak isteyen yanın ya da ikisini birden izleyemeyeceğin iki plan.
  Sakinliğin gerçek mi yoksa yalnızca yüzeyde mi olduğunu fark etmenin zamanı olabilir. Her tartışmadan kaçınmak önemli ihtiyaçları duyulmadan bırakabilir; adil bir konuşma ise havayı temizleyebilir. İçindeki ya da çevrendeki hangi anlaşmazlığın sabırlı ve dürüst bir bakıştan fayda göreceğini ve onu konuşmayı neyin güvenli hissettireceğini sorabilirsin.
aspects:
  relationshipsUpright: >-
    Yakın bağlarda bu kart atışmaları, oyunbaz bir rekabeti ya da tekrarlayan küçük anlaşmazlıkları yansıtabilir. Her sürtüşme bir sorun işareti sayılmaz; iki kişinin de önemsediğini ve güçlü görüşleri olduğunu gösterebilir. Anlamak için mi dinlediğini yoksa cevap vermek için mi beklediğini fark edip oraya nasıl varacağınızı tartışmadan önce ikinizin de ne istediğine ad vermeyi deneyebilirsin.
  relationshipsReversed: >-
    Ters geldiğinde bir anlaşmazlık soğuyor olabilir ya da çözülmeden sessizleşmiş olabilir. Sessizliğin ikinize de alan mı tanıdığını yoksa önemli bir konudan mı kaçındığını düşünebilirsin. Sakin bir an, diğer kişinin bakış açısına merakla, konuya nazikçe geri dönmek için iyi bir zaman olabilir.
  workUpright: >-
    İşte ya da bir ekipte Asa Beşlisi rekabete, karmaşık beyin fırtınalarına ya da belirsiz rollere işaret edebilir. Enerji yüksektir ama dağınık olabilir. Hedefi netleştirerek, fikirleri sırayla paylaşarak ya da karar vermenin basit bir yolunu önererek bu enerjiyi yönlendirmeye yardım edebilirsin. Herkes duyulduğunu hissettiğinde sağlıklı bir tartışma daha güçlü bir plana götürebilir.
  workReversed: >-
    Ters geldiğinde işteki çatışma iş birliğine dönüşüyor olabilir ya da kibar yüzeylerin altında kaynıyor olabilir. İşleri yavaşlatan söylenmemiş anlaşmazlıkları arayabilirsin. Dürüst görüşleri davet etmek ya da küçük bir karar üzerinde ortak bir zemin bulmak, sessiz gerginliği yeniden çalışma enerjisine dönüştürmeye yardım edebilir.
  growthUpright: >-
    Zorluklar bir şeyin kanıtı olarak değil, bir pratik olarak görülebilir. Sürtüşme sana görüşlerinin nerede sağlam, nerede esnek olduğunu ve nerede kendini kanıtlama ihtiyacı duyduğunu gösterebilir. Rekabetçi yanını neyin tetiklediğini ve onun neyi korumaya çalıştığını fark edebilirsin.
  growthReversed: >-
    Ters geldiğinde mücadele içeride olabilir: tek bir rotaya karar vermeni engelleyen çatışan istekler, değerler ya da planlar. Her tarafı yazıya döküp ona adil bir söz hakkı vererek keşfedebilirsin. Onları yan yana görmek, birden fazla ihtiyacını onurlandıran bir yolu bulmayı kolaylaştırabilir.
