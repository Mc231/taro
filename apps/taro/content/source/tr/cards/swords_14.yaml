  workUpright: >-
    İşte Kılıç Kralı net düşünceyle gelen bir liderliği düşündürebilir: adil politikalar belirlemek, zor kararları şeffaf bir şekilde vermek ya da uzman yol gösterme sunmak. Yarışan görüşleri tartıp karar vermen konusunda sana güvenilebilir. Gerekçeni açıkça anlatmak ve tutarlı kalmak başkalarının seni güvenle izlemesine yardım eder.
  workReversed: >-
    Ters geldiğinde bu kart katı kuralları, etkilenenlere danışılmadan alınan kararları ya da hiçbir şey kıpırdamayana kadar aşırı çözümleme eğilimini yansıtabilir. Bir sürecin hâlâ hedefine hizmet edip etmediğini sorabilirsin. Görüş davet etmek ve belirsizliği kabul etmek yetkini azaltmak yerine güçlendirebilir.
  growthUpright: >-
