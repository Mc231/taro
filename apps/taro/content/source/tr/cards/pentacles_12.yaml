imageryNote: >-
  Görsel, sağlam ve kıpırdamayan bir atın üzerinde sakince oturan, tek bir sikke tutan ve sürülmüş tarlalara bakan bir biniciyi gösterebilir. Hareketsiz at sabrı ve dayanıklılığı, karıklı toprak çoktan yapılmış yöntemli işi, dengeli bakış ise önde olana istikrarlı bir dikkati simgeleyebilir. Koyu ve sağlam tonlar ile ağır biçimler güvenilirliği vurgulayabilir; durgunluğun bazen nasıl bir atalete dönüşebileceğine dair bir ima ile birlikte.
