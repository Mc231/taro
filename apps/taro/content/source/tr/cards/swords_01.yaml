  workReversed: >-
    Ters geldiğinde bu kart sisli hissettiren bir projeyi düşündürebilir: belirsiz hedefler, karışık mesajlar ya da aynı anda yarışan çok fazla fikir. Daha çok zorlamak geri çekilmek kadar yardımcı olmayabilir. Şu anda en önemli olan tek soruyu adlandırmayı ya da tahmin etmek yerine işin içindeki insanlardan netlik istemeyi deneyebilirsin. Bazen en net hamle neyin hâlâ bilinmediğini kabul etmektir.
  growthUpright: >-
    Kişisel gelişim açısından Kılıç Ası, kendine anlattığın hikâyeleri fark etmeye ve onları gerçekte bildiklerinle sınamaya davet eder. Taze bir bakış açısı eski bir varsayımı gevşetebilir. Düşünceleri sade sözcüklerle yakalamanın bir yolu olarak günlük yazmayı keşfedebilirsin; böylece onların içinden değil, onlara bakabilirsin. Kendi zihnine duyduğun merak sessiz bir cesaret biçimi olabilir.
  growthReversed: >-
    Ters geldiğinde bu kart, meşgul ama ilerlemeyen, aynı endişeler ya da planlar arasında dönüp duran bir zihni yansıtabilir. Düşünmenin ne zaman aşırı düşünmeye dönüştüğünü fark edebilirsin. Dinlenmek, hareket etmek ya da ortam değiştirmek düşüncelerine durulmaları için alan verebilir. Netlik kendi temposunda toplanırken bir soruyu biraz daha uzun açık tutmak sorun değil.
