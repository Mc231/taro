shortUpright: >-
  Bir anı ya da sade bir incelik bugün sıcaklık getirebilir; bu kart geçmişin sana hâlâ ne verdiğini fark etmeye davet ediyor.
shortReversed: >-
  Geçmiş her zamankinden güçlü çekiyor olabilir; hangi anıların seni beslediğini, hangilerinin şimdiden uzak tuttuğunu düşün.
meaningUpright: |-
  Kupa Altılısı anının ve nazik inceliğin kartıdır. Çoğu zaman birinin bir başkasına çiçeklerle dolu bir kupa uzattığını gösterir; sade, cömert ve hesapsız bir jest. Çocukluğu, eski arkadaşları, tanıdık yerleri ya da işlerin daha kolay geldiği bir zamanı akla getirebilir.
  Gündelik hayatta bu kart, geçmişinden biriyle yeniden bağ kurmayı, bir zamanlar sevdiğin bir hobiye dönmeyi ya da seni geriye götüren bir şarkıda, bir tarifte veya bir kokuda teselli bulmayı yansıtabilir. Karşılık beklemeden verilen ve alınan küçük inceliklere de işaret edebilir.
  Davet, geçmişin sunabileceğini sunmasına izin vermektir: sıcaklık, bakış açısı, her zaman kim olduğunu hatırlatan bir hatırlatma. Nostalji, senin için neyin önemli olduğunu hatırlamana yardım ettiğinde bir kaynak olabilir. Oyunbazlık, merak ya da rahatlık gibi önceki bir zamandan hangi niteliği şimdiye taşımak istediğini sorabilirsin.
meaningReversed: |-
  Ters geldiğinde Kupa Altılısı, anının ziyaret edilecek bir yer olmaktan çıkıp saklanılacak bir yere dönüştüğünü düşündürebilir. Şimdiyi geçmişin idealleştirilmiş bir hâliyle olumsuz biçimde kıyaslarken ya da artık uymayan eski örüntülere ve rollere tutunurken bulabilirsin kendini.
  Öbür yöne de işaret edebilir: geçmişindeki bir şeyin ötesine büyümeye, yenisi başlayabilsin diye eski bir hikâyeyi geride bırakmaya hazır olmak.
  Bu kart, geçmişe şefkat ve dürüstlükle birlikte bakmaya davet eder. Gerçekte ne oldu ve hatırlarken ona neler ekledin? Seni besleyen kısımları koruyup seni küçük tutanlar üzerindeki tutuşunu gevşetebilirsin. Büyümek şefkati kaybetmek anlamına gelmez; onu bugüne ait seçimlere birlikte taşımak anlamına gelebilir.
aspects:
  relationshipsUpright: >-
    İlişkilerde Kupa Altılısı bir kavuşmayı, ortak bir anıyı ya da kökleri derinde olan bir dostluğu yansıtabilir. Oyunbazlığa ve bir not, paylaşılan bir atıştırmalık ya da gülümseyerek gönderilen eski bir fotoğraf gibi sade jestlere davet edebilir. Ortak geçmişin nasıl güven yarattığını ve birlikte nasıl yeni anılar ekleyebileceğinizi fark edebilirsin.
  relationshipsReversed: >-
    Ters geldiğinde bu kart, esas olarak geçmişle bir arada duran bir bağa ya da birini eskiden olduğu kişiyle kıyaslamaya işaret edebilir. Şu anda karşındaki kişiyle mi yoksa onun eski bir resmiyle mi ilişki kurduğunu düşünebilirsin. Birbirinizin değişmesine izin vermek bir bağı canlı ve dürüst tutabilir.
  workUpright: >-
    İşte bu kart, başlarda keyif aldığın bir şeye dönmeyi, daha yeni birine mentorluk yapmayı ya da eski becerileri taze bir şekilde kullanmayı yansıtabilir. İş yerine sade bir iyi niyet getirmeye davet edebilir. İstenmeden yardım teklif etmek gibi küçük nezaketler çoğu zaman bir kültürü büyük açıklamalardan daha çok şekillendirir.
  workReversed: >-
    Ters geldiğinde kart, işlerin eskiden nasıl yapıldığına tutunmayı ya da eski yol daha güvenli geldiği için bir değişime direnmeyi yansıtabilir. Hangi geleneklerin işe hâlâ hizmet ettiğini, hangilerinin alışkanlıktan sürdürüldüğünü sorabilirsin. Geçmişe saygı gösterirken yeni yaklaşımlara yer açmak herkes için bir geçişi kolaylaştırabilir.
  growthUpright: >-
    Kişisel gelişim açısından Kupa Altılısı, daha genç hâlinin merakı ve keyfiyle yeniden bağ kurmaya davet eder. Çocukken sevdiğin bir etkinliğe, keyiften başka hiçbir amaç gütmeden dönebilirsin. Bir zamanlar seni hafif ve telaşsız hissettiren şeyi hatırlamak, şimdi zamanını nasıl geçireceğine dair seçimlere yol gösterebilir.
  growthReversed: >-
    Ters geldiğinde bu kart, kendin hakkındaki eski bir hikâyeyi güncellemeni isteyebilir. Belki çocukluktan kalan bir etiket hâlâ yeteneklerini nasıl gördüğünü şekillendiriyordur. Geçmişten bir inancı yazıp hâlâ ne kadar doğru olduğunu sorabilirsin. Onu bırakmak, dönüşmekte olduğun kişiye yer açabilir.
