imageryNote: >-
  Görsel, korunaklı bir avluda ya da bahçede, birinin ötekine çiçeklerle dolu bir kupa uzattığı iki küçük figürü gösterir. Yakındaki, her birinde çiçekler olan diğer kupalar, ekilmiş ve hâlâ büyüyen anıları çağrıştırır. Arka plandaki eski bir duvar ya da kapı aralığı yuvayı ve tanıdık yerlerin korumasını temsil edebilir. Sıcak ve yumuşak renkler masumiyeti, cömertliği ve önceki günlerin kolay güvenini aktarır.
