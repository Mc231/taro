shortUpright: >-
  Kendi emeğinin yetiştirdiklerinin tadını çıkarmaya hazır olabilirsin. Kendi şekillendirdiğin bir alanda durmanın sessiz özgüvenini fark et.
shortReversed: >-
  Rahatlık ulaşılmaz ya da tuhaf bir şekilde boş hissettirebilir. Zaten sahip olduklarında gerçekten dinlenmeni neyin sağlayacağını sorabilirsin.
meaningUpright: |-
  Tılsım Dokuzlusu, çevresinde meyveyle ve sikkelerle yüklü asmalar bulunan serpilmiş bir bahçede gezinen bir figürü gösterir. Rahat görünür; yalnızdır ama yalnızlık çekmez. Bu kart, kendine yetmekten ve kendi özeninin ve disiplininin büyütmeye yardım ettiği şeylerin tadını çıkarmanın keyfinden söz eder.
  Bunu rahat hâle getirdiğin bir evde, artık seni destekleyen bir beceride, kendi başına iyi geçirmeyi öğrendiğin zamanda ya da yalnızca hayatının istediğin biçimin bir kısmına sahip olduğu duygusunda tanıyabilirsin. Burada bir incelik de vardır: güzelliğe, zevke ve hak edilmiş hissettiren küçük lükslere duyulan bir takdir.
  Kart, doğrudan bir sonraki hedefe geçmek yerine durup yetiştirdiğin şeyin gerçekten tadını çıkarmaya davet eder. Bağımsızlığın senin için ne anlama geldiğini, hangi rahatlıkların seni gerçekten beslediğini ve kendi emeğini nasıl onurlandırabileceğini sorabilirsin. Kendi değerlerine dayanan bir öz değer, başkalarının onayıyla ölçülen değerden daha sağlam hissettirebilir.
meaningReversed: |-
  Ters geldiğinde Tılsım Dokuzlusu kurduğun şeyin içinde dinlenmekte zorlanmayı yansıtabilir. İş keyfi sürekli dışarıda bırakıyor olabilir ya da rahatlık sanki başka birine aitmiş gibi boş hissettirebilir. Değerli olma duygusunun işlerin nasıl hissettirdiğine değil nasıl göründüğüne bağlı olduğu, dış onaya dayanmaya da işaret edebilir.
  Bu çerçeve içe dönmekle ilgilidir. Bahçe orada olabilir ama içinde yürümene izin vermiyor olabilirsin.
  Rahatlığı kabul etmeyi neyin zorlaştırdığını keşfedebilirsin. Dinlenmenin her seferinde yeniden hak edilmesi gerektiğine dair bir inanç mı var? Bağımsızlık yalıtılmışlıkla mı karıştırılıyor? Suçluluk duymadan ve bir izleyiciye ihtiyaç duymadan tadını tamamen çıkaracağın küçük bir keyif seçmek, kendi hayatında evinde hissetmeye doğru ilk adım olabilir.
aspects:
  relationshipsUpright: >-
    İlişkilerde bu kart bağlarına taşıdığın güvenli bir benlik duygusunu yansıtabilir. Kendi arkadaşlığından keyif almak, başkalarıyla geçen zamanı bir ihtiyaç değil bir seçim hâline getirebilir. Bağımsızlığınla insanlara yakınlığının birbirini nasıl destekleyebileceğini fark edip bahçenin bir kısmını sevdiklerinle paylaşabilirsin.
  relationshipsReversed: >-
    Ters geldiğinde kart bir değer duygusu için bir ilişkiye yaslanmayı ya da bağımsızlığını korumak için insanları uzakta tutmayı düşündürebilir. Şu anda yakınlıkla kendine yetmenin hangi dengesinin doğru hissettirdiğini sorabilir ve birinin hem güçlü yanlarını hem de ihtiyaçlarını görmesine nazikçe izin verebilirsin.
  workUpright: >-
    İşte Tılsım Dokuzlusu yeteneklerine duyduğun güveni ve özerklik, saygı ya da hak edilmiş bir ritim gibi sürekli bir emeğin karşılıklarını yansıtabilir. Bir sonraki hedefi koymadan önce neler başardığını kabul etmek ve yaratmaya yardım ettiğin istikrarın tadını çıkarmak için zaman ayırabilirsin.
  workReversed: >-
    Burada kart hiçbir şeyin kıymetini bilmeye pek yer bırakmayan aşırı çalışmaya ya da beklenenden daha az doyurucu gelen başarılara işaret edebilir. Hangi karşılıkların senin için gerçekten önemli olduğunu düşünebilirsin. Zamanının çevresindeki sınırları ayarlamak işinin getirilerinin hayatının geri kalanına da ulaşmasını sağlayabilir.
  growthUpright: >-
    Kişisel gelişim açısından bu kart öz değeri ve keyif almayı yetiştirmeye davet eder. Yalnız geçen zaman, güzel bir alan, özenle kurulmuş bir rutin; bunlar kendine duyduğun saygının ifadeleri olabilir. Ne kadar yol aldığını kutlayan küçük bir ritüel yaratıp onun yalnızca senin için olmasına izin verebilirsin.
  growthReversed: >-
    Ters geldiğinde kart hiçbir şeyin hiçbir zaman tam yeterli olmadığı huzursuz bir hissi ya da içteki bir boşluğu doldurmak için peşine düşülen rahatlığı yansıtabilir. Görünüşün ötesinde gerçek bir hoşnutluğun nasıl hissettireceğini keşfedebilirsin. Ne kadar kısa olursa olsun gerçek rahatlık anlarını fark etmek onları tanımana ve onlara dönmene yardım edebilir.
