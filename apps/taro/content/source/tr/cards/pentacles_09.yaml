imageryNote: >-
  Görsel, üzüm asmaları ya da meyve ağaçları arasında duran tek bir figürü gösterebilir; dokuz sikke çevresindeki bitkilere işlenmiştir ve küçük bir kuş bir elinde sakince durur. Bereketli bahçe sabırlı bir özenin sonuçlarını, kuş disiplinli ve nazik bir zihni, telaşsız duruş ise sessiz bir özgüveni simgeleyebilir. Zengin yeşiller ve altın tonları aşırılığa kaçmayan bir inceliği, hak edilmiş ve kişisel olarak şekillendirilmiş hissettiren bir alanı düşündürebilir.
