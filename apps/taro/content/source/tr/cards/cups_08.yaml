imageryNote: >-
  Görsel, elinde yürüyüş asası olan yalnız bir figürü arkadan, kıyıda özenle istiflenmiş kupaları bırakıp giderken gösterir. Önünde ince bir hilal ayın altında yükselen tepeler ve kıvrılan bir patika uzanır. İstiflenmiş kupalardaki görünür bir boşluk eksik bir şeyi düşündürebilir. Koyu maviler ve gümüş tonlar iç gözlemi ve henüz keşfedilmemiş olana doğru sessiz çekimi çağrıştırır.
