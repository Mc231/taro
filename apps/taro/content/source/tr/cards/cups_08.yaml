shortUpright: >-
  Bir şey tamam görünse de artık seni doyurmuyor olabilir; bu kart kalbinin seni şimdi nereye çektiğini fark etmeye davet ediyor.
shortReversed: >-
  Kalmakla gitmek arasında kalmış olabilirsin; ikisinden birini seçmeden önce neyi bilmen gerektiğini düşün.
meaningUpright: |-
  Kupa Sekizlisi çoğu zaman düzgünce dizilmiş bir sıra kupadan uzaklaşan ve gece gökyüzünün altında açık araziye doğru ilerleyen bir figürü gösterir. Kupalar kırılmamış ya da dökülmemiştir. Yalnızca onlarla ilgili bir şey artık doyurmuyordur ve figür eksik olanı aramaya karar vermiştir.
  Bu kart, dışarıdan bakıldığında iyi görünen bir şeyi bırakmanın sessiz cesaretinden söz eder: doğru hissettirmeyi bırakmış bir rol, bir rutin, bir kimlik ya da bir yaşam biçimi. Bu çoğu zaman çarpıcı bir çıkıştan çok, bir şeyin sana dar geldiğinin yavaş yavaş fark edilmesidir.
  Gündelik hayatta işinden daha fazla anlam istemeyi, düşünmek için yalnız zamana ihtiyaç duymayı ya da seni tüketen bir durumdan geri çekilmeyi yansıtabilir. Kart bu özlemi ciddiye almaya davet eder. Arkanı dönüp gitmek ani ya da kalıcı olmak zorunda değil; bir deneme mesafesi, zihnin bir duraklaması olabilir. Gerçekte neyi aradığını ve onu bulmak için neyi geride bırakmaya istekli olduğunu sorabilirsin.
meaningReversed: |-
  Ters geldiğinde Kupa Sekizlisi, kalmakla gitmek arasında sıkışıp kalmayı yansıtabilir. Bir şeyin doğru gitmediğini sezip yoluna devam mı etmen yoksa yeniden mi denemen gerektiğinden emin olamayabilirsin. Bilinmeyenin korkusu ya da kurduğun şeye duyduğun bağlılık seni yerinde tutabilir.
  Zıt bir örüntüye de işaret edebilir: hiçbir şeye derinleşme şansı vermeden tekrar tekrar gitmek, bir şeyden ötekine savrulmak.
  Bu kart, yavaşlayıp seçime daha yakından bakmaya davet eder. Kalmak, kendiliğinden olan değil de seçilen bir şey olsaydı nasıl görünürdü? Gitmek neyi gerektirirdi? Bunu güvendiğin biriyle konuşabilir ya da karar vermek için kendine yumuşak bir son tarih koyabilirsin. Hangi yönü seçersen seç, seçimi bilinçli yapmak bir huzur duygusu getirebilir.
aspects:
  relationshipsUpright: >-
    İlişkilerde bu kart daha fazla derinlik isteğini ya da bir bağın şimdiki biçimiyle ömrünü doldurduğunu fark etmeyi yansıtabilir. İhtiyaç duyduğun ve eksik olan şey üzerine dürüstçe düşünmeye davet edebilir. Geri çekilmek değişim üzerine bir konuşma, daha fazla kişisel alan ya da bazen farklı türde bir bağ seçmek anlamına gelebilir.
  relationshipsReversed: >-
    Ters geldiğinde Kupa Sekizlisi, doyurucu gelmeyen bir ilişki konusundaki tereddüdü ya da yakınlık arttıkça geri çekilme örüntüsünü yansıtabilir. Sevgiden mi korkudan mı kaldığını, ihtiyaçtan mı alışkanlıktan mı gittiğini sorabilirsin. Açık ve nazik bir iletişim her iki durumda da yardımcı olabilir.
  workUpright: >-
    İşte bu kart, her şey istikrarlı görünse bile daha fazla amaç arzusunu yansıtabilir. Belki yeni bir alanı deneyerek, farklı bir şey öğrenerek ya da şu anki rolünü yeniden şekillendirerek neyin daha anlamlı hissettireceğini keşfetmeye davet edebilir. Yola devam etmek, dışa yansımadan çok önce içte bir kayma olarak başlayabilir.
  workReversed: >-
    Ters geldiğinde kart, sana dar gelmiş bir işte ya da projede takılı kalmış hissetmeyi veya yerleşmeden roller arasında atlamayı yansıtabilir. Neyi özleyeceğini ve neyi seve seve bırakacağını listeleyebilirsin. Yer değişikliği yerine bir yaklaşım değişikliğinin hissettiğin ihtiyacı karşılayıp karşılayamayacağını düşün.
  growthUpright: >-
    Kişisel gelişim açısından Kupa Sekizlisi içe doğru bir yolculuğa davet eder. Eskiden değil, şimdi hayatına neyin anlam kattığı üzerine düşünmek için zaman ayırabilirsin. Yürümek, günlük yazmak ya da rutinden kısa bir mola, neye doğru ilerlemeye hazır olduğunu duymana yardım edebilir.
  growthReversed: >-
    Ters geldiğinde bu kart, kaçınma ya da huzursuzluk örüntülerini fark etmeni isteyebilir. Rahatsızlıktan kaçmak için mi durumlardan ayrılıyorsun, yoksa değişimden kaçmak için mi kalıyorsun? Harekete geçmeden önce belirsizlikle biraz daha uzun oturmayı deneyebilirsin. Kendi örüntünü anlamak gelecekteki seçimleri daha net ve daha şefkatli kılabilir.
