imageryNote: >-
  Taro’nun Büyücüsü, şafak vakti bir kavşaktaki pazar tezgâhında, dört takım için dört mütevazı nesneyi düzenlerken hayal edilir: yeşil bir dal, toprak bir kupa, ekmek kesmek için bir bıçak ve tek bir sikke. Bir eli tezgâha uzanır, diğeri aydınlanan gökyüzünü işaret ederek fikirle eylemi birbirine bağlar. Nesneler arasında uzanan ışık iplikleri, ayrı araçları tek bir amaçta birleştiren dikkati çağrıştırır; yarım kalmış bir somun ise yaratma işinin daha yeni başladığını ima eder.
