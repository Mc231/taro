imageryNote: >-
  Görsel, on kupayı farklı yaşlardan bir grup figürün çevresinde toplar; figürler yakınında bir ev bulunan açık bir manzarayı paylaşır. Yeşil topraklardan akan su, bir topluluğu ayakta tutan duygusal beslenmeyi çağrıştırır. Açık kollar, birbirine kenetlenmiş eller ya da ortak bir dans sevinci ve rahatlığı aktarabilir. Parlak ama yumuşak renkler sıcaklığı, güveni ve güzel bir yere varmış olma hissini yansıtır.
