  workUpright: >-
    İşte bu kart destekleyici bir ekibi, ortak bir amaç duygusunu ya da insanların birbirini gerçekten önemsediği bir iş yerini yansıtabilir. Bu kültüre katkıda bulunmaya davet edebilir. Değer gördüğünü hissetmenin işini nasıl etkilediğini ve başkalarının da aynı şeyi hissetmesine nasıl yardım edebileceğini fark edebilirsin.
  workReversed: >-
