  relationshipsReversed: >-
    Ters geldiğinde bu kart, içe kapanık bir dönemin ardından yeniden bağ kurmayı önerebilir. Birinin sana söylemeye çalıştığı şeyi duymaya ya da önce senin ulaşmaya daha istekli hissedebilirsin. Hâlâ alana ihtiyacın varsa bunu nazikçe söylemek bağı koruyabilir. Bir yürüyüş ya da bir yemek gibi küçük ortak anlar geri dönüş yolunu bulmanın rahat bir yolu olabilir.
  workUpright: >-
    İşte bu kart huzursuzluğu, görevlerin artık pek bir anlam taşımadığı hissini ya da yönü yeniden değerlendirmek için bir duraklamayı yansıtabilir. Çabucak geri çevirdiğin fırsatlara yeniden bakmaya davet edebilir. Bir konuşma, yeni bir sorumluluk ya da görmezden geldiğin bir kurs, kıvılcım henüz orada olmasa bile ikinci bir bakışa değer olabilir.
  workReversed: >-
    Ters geldiğinde kart geri dönen bir motivasyona ya da yeni bir şeye evet demeye hazır olmaya işaret edebilir. Hangi projelerin yeniden ilgini çekmeye başladığını fark edebilirsin. Geri çevirme döngüsüne takılmış hissediyorsan küçük bir taahhüt deneyip ardından sana enerji mi verdiğini yoksa enerjini mi aldığını düşünebilirsin.
  growthUpright: >-
    Kişisel gelişim açısından Kupa Dörtlüsü, seni gerçekten neyin doyurduğu üzerine dürüst bir düşünmeye davet eder. Alışkanlıktan yaptığın şeyleri listeleyip hangilerinin hâlâ önemli olduğunu sorabilirsin. Sessiz zaman, takılıp kaldığın bir yer değil bir seçim olarak kaldığı sürece değerli olabilir.
  growthReversed: >-
    Ters geldiğinde bu kart, daha net önceliklerle bir iç gözlem döneminden çıkmayı yansıtabilir. Bir zamanlar olağan saydığın şeylere duyduğun minnetin geri döndüğünü fark edebilirsin. Geri çekildiğin sırada öğrendiklerini yazmak, hayat yeniden yoğunlaştıkça bu içgörünün seninle kalmasına yardım edebilir.
