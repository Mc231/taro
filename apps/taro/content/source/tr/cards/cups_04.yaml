imageryNote: >-
  Görsel, bir ağacın altında ya da durgun bir suyun kenarında, kollarını kavuşturmuş ve bakışlarını yerdeki üç kupaya indirmiş oturan bir figürü gösterir. Dördüncü bir kupa bir esintiyle ona doğru süzülür ya da suyun yüzeyinde yüzer; gözden kaçması kolaydır. Soluk renkler ve kapalı bir duruş içe dönüklüğü ve bir duraklama ihtiyacını çağrıştırabilir; uzatılan kupa ise bir olasılık ipliğini görünür tutar.
