imageryNote: >-
  Taro’nun Şeytan’ı, iki küçük figürün üzerinde tünemiş, gölgeli ve boynuzlu bir figür olarak hayal edilir; küçük figürler onun tahtına gevşek ve sarkık zincirlerle bağlıdır. Zincirlerin bileklerinde açıkça gevşek olduğu çizilir ve izleyiciyi onları çıkarabileceklerini fark etmeye davet eder. Loş meşale ışığı ve koyu toprak tonları ağır bir hava yaratırken sahnenin kenarındaki soluk, ışıklı bir kapı aralığı bulunmayı bekleyen başka bir yolu ima eder.
