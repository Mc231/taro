shortUpright: >-
  Bir alışkanlık ya da bağlılık seni sandığından daha sıkı tutuyor olabilir. Bunu fark etmek ilk adımdır.
shortReversed: >-
  Bir zamanlar sıkı tutan bir örüntü gevşiyor olabilir. Biraz daha uzaklaşmana ne yardımcı olur?
meaningUpright: |-
  Şeytan kötülükle ilgili değildir. Bizi çoğu zaman sessiz onayımızla tutan örüntüler ve bağlılıklar hakkında bir karttır. Geleneksel görüntüsünde gevşekçe zincirlenmiş iki figür vardır ve zincirler genellikle çıkarılabilecek kadar gevşektir. Kart şunu sorar: seni burada tutan ne ve bunun ne kadarı bir seçim?
  Gündelik hayatta bu kart, gece geç saatlere kadar ekranda gezinmeyi, birini hayal kırıklığına uğratma korkusuyla evet demeyi, sonrasında kendini daha boş hissettiren yollarla onay ya da rahatlık aramayı veya ayrılmak fazla belirsiz geldiği için artık işine yaramayan bir rutinde kalmayı yansıtabilir. Kıskançlık, kırgınlık ya da arzu gibi bakmamayı tercih ettiğin, görmezden gelindikçe güçlenen yanlarına da işaret edebilir.
  Bu kart, istediğinden daha fazla güce sahip olan şeyin ne olduğunu düşünmeye davet eder. Bir alışkanlığın hangi ihtiyacı karşılamaya çalıştığını ve onu karşılamanın daha şefkatli bir yolu olup olmadığını sorabilirsin. Şeytan, utanç duymadan farkındalığı öne çıkarır. Bir örüntüyü açıkça görmek çoğu zaman onun gevşemeye başladığı andır.
meaningReversed: |-
  Ters geldiğinde Şeytan bir gevşemeyi yansıtabilir. Bir zamanlar kırılmaz gibi görünen bir alışkanlık, ilişki dinamiği ya da inanç tutuşunu kaybediyor olabilir ve başka seçenekleri görmeye başlıyor olabilirsin. Bu, rahatlamayla birlikte eski örüntü olmadan kim olduğuna dair biraz belirsizlik de getirebilir.
  Bu kart, gölgenle yüzleşme çalışmasına da işaret edebilir: zor duygulara ya da güdülere dürüstçe bakmak ve onları insan olmanın bir parçası olarak kabul etmek.
  Seni tutan bir şeyden uzaklaşmak için çoktan attığın küçük adımları fark etmek isteyebilirsin. Onları ne mümkün kıldı? Bu destekleri yakınında tutmak ve çekimin hâlâ güçlü olduğu yerde yardım istemek, değişimi daha kalıcı kılabilir. Özgürlük çoğu zaman yavaş yavaş, her seferinde bir seçimle büyür.
aspects:
  relationshipsUpright: >-
    İlişkilerde Şeytan, iki taraftan birinde de olabilecek bağımlılık, kıskançlık ya da kontrol örüntülerini veya özenden çok alışkanlıkla bir arada duran bir bağı yansıtabilir. Sizi neyin bağlı tuttuğuna ve iki kişinin de kendini özgür hissedip hissetmediğine dürüstçe bakmaya davet edebilir. Bir örüntüye nazikçe ad vermek onu değiştirmeye alan açabilir.
  relationshipsReversed: >-
    Ters geldiğinde bu kart, sağlıksız bir dinamikten geri çekilmeye ya da koyması zor olmuş bir sınırı koymaya işaret edebilir. Bu sınırı korumak için hangi desteğe ihtiyaç duyduğunu düşünebilirsin. Gizli duygular açığa çıktıkça daha dürüst hâle gelen bir ilişkiyi de yansıtabilir.
  workUpright: >-
    İşte ya da bir projede Şeytan, bir şeye bağlı hissetmeyi öne çıkarır: uzun mesailer, onay ihtiyacı ya da esas olarak değişim korkusuyla içinde kaldığın bir rol. Bu durumdan ne kazandığını ve sana neye mal olduğunu, küçük değişikliklerin bir seçim duygusunu geri getirip getiremeyeceğini sorabilirsin.
  workReversed: >-
    Ters geldiğinde Şeytan, mükemmeliyetçilik ya da sürekli ulaşılabilir olmak gibi işe yaramayan bir iş alışkanlığından kurtulmayı yansıtabilir. Olağan saymaya başladığın bir baskıyı tanımaya da işaret edebilir. Bu yeni özgürlüğü, bir bitiş saati ya da mesai sonrası mesajlara bir sınır gibi net bir sınırla koruyabilirsin.
  growthUpright: >-
    Şeytan gölge çalışmasının kapısını açar: saklama eğiliminde olduğun yanlarını nazikçe keşfetmek. Zorlayıcı hissettiren bir alışkanlığı fark edip yargıyla değil merakla, onun sana ne vermeye çalıştığını sorabilirsin. Anlamak değişimden önce gelir.
  growthReversed: >-
    Ters geldiğinde Şeytan, eski bir bağlılığı gevşetmekte kaydedilen ilerlemeyi yansıtabilir. Ne kadar yol aldığını kabul etmek için bir an olabilir. Ağır alışkanlıklar ya da duygular geri gelmeye devam ederse güvendiğin biriyle ya da yetkin bir uzmanla konuşmak yol boyunca istikrarlı bir destek sunabilir.
