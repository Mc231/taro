shortUpright: >-
  Emeğin fark ediliyor olabilir; biraz takdiri kabul etmene ve buraya gelmene kimin yardım ettiğini fark etmene izin ver.
shortReversed: >-
  Takdir eksik ya da umduğundan daha az doyurucu gelebilir; başarının kendi koşullarında senin için ne anlama geldiğini sorabilirsin.
meaningUpright: |-
  Asa Altılısı bir takdir kartıdır. Beşli’nin sürtüşmesinden sonra biri asasında bir çelenkle öne doğru ilerler ve yol boyunca insanlar alkışlıyor gibidir. Emeğin görünür hâle geldiği ve başkalarının onu kabul ettiği anı yakalar.
  Bu, kendini adadığın bir iş için alınan iyi bir geri bildirim, bir arkadaşının bir durumu idare edişine hayran olduğunu söylemesi ya da bir zamanlar üstesinden gelebileceğinden şüphe ettiğin bir zorluğu tamamlamak gibi görünebilir. Daha sessiz bir özgüven de olabilir: iyi iş çıkardığını bildiğin için biraz daha dik durmak.
  Bu kart, takdiri bir kenara itmeden kabul etmeye davet eder. Takdir enerji verebilir ve bir sonraki adım için cesaret kazandırabilir. Aynı zamanda figürün insanlarla çevrili olması, pek az başarının tamamen tek başına kazanıldığını hatırlatır. Anın tadını çıkarırken seni kimin desteklediğini ve övgünün bir kısmını onlarla nasıl paylaşabileceğini düşünebilirsin.
meaningReversed: |-
  Ters geldiğinde Asa Altılısı, fark edilmeden kalan bir emeği ya da sana tam ulaşmayan bir övgüyü yansıtabilir. Bir şey başarmış olmana rağmen başka biri söyleyene kadar sayılmadığını hissedebilirsin. Tam olarak hissetmediğin bir özgüveni sergilemenin yorgunluğuna da işaret edebilir.
  Bazen ters gelen bu kart sessiz bir başarıyı anlatır; başkalarına görünmese de senin için anlamlı olan bir şeyi. Bu tür bir ilerleme de önemlidir.
  Değerli olma hissinin ne kadarının alkışa bağlı olduğuna bakmanın zamanı olabilir. Önce kendi emeğini takdir etmek nasıl olurdu? Kimsenin görmediği kısımlar da dahil, neyle gurur duyduğunu yazabilir ve bunun dışarıdan gelen onaydan daha istikrarlı bir cesaret kaynağı olmasına izin verebilirsin.
aspects:
  relationshipsUpright: >-
    İlişkilerde bu kart iki yönlü akan bir takdiri yansıtabilir: sana yakın biriyle gurur duymak ya da onun tarafından görüldüğünü ve desteklendiğini hissetmek. Birbirinizin kazanımlarını yüksek sesle kutlamaya davet edebilir. Bir arkadaşına, partnerine ya da aile üyene ona hayran olduğun bir şeyi söyleyip karşılığında onun cesaretlendirmesini kabul etmene izin verebilirsin.
  relationshipsReversed: >-
    Ters geldiğinde bir ilişkideki çabalarının fark edilmediğini ya da takdirin sessiz bir rekabete dönüştüğünü hissedebilirsin. Senin için nasıl bir takdirin önemli olduğunu açıkça söylemeyi ve aynısını diğer kişiye de sormayı düşünebilirsin. Küçük ve somut teşekkürler çoğu zaman havayı büyük jestlerden daha fazla değiştirebilir.
  workUpright: >-
    İşte ya da eğitimde Asa Altılısı görünür sonuçlara işaret edebilir: olumlu geri bildirim, iyi karşılanan bir proje, yaptıklarını sunma fırsatı. Bu özgüveni fikirlerini daha açık paylaşmak için kullanırken katkıda bulunan insanları da anabilirsin. Cömertçe paylaşılan takdir daha güçlü ekipler kurma eğilimindedir.
  workReversed: >-
    Ters geldiğinde katkıların göz ardı ediliyor gibi hissedebilir ya da başarı dışarıdan nasıl göründüğüne fazla bağlı olabilir. Neler teslim ettiğinin kısa bir özeti gibi sakin ve somut bir şekilde işini daha görünür kılabilir, ayrıca kimin fark ettiğinden bağımsız olarak hangi sonuçların senin için önemli olduğunu düşünebilirsin.
  growthUpright: >-
    Kişisel gelişim açısından bu kart, gurur duymana izin vermeye davet eder. İlerlemeni kabul etmek bir sonraki zorluğa taşınan bir özgüven inşa edebilir. Son zamanlarda iyi idare ettiğin şeylerin kısa bir listesini tutup özgüveninin zayıfladığı günlerde ona dönebilirsin.
  growthReversed: >-
    Ters geldiğinde kendinden şüphe ya da onay ihtiyacı başarı duygunu gölgeliyor olabilir. Başarı fikrinin nereden geldiğini ve sana hâlâ uyup uymadığını keşfedebilirsin. Başarıyı kendi sözlerinle tanımlamak, başkalarından gelen takdiri bağımlı olduğun bir şey olmaktan çıkarıp hoş bir ek hâline getirebilir.
