imageryNote: >-
  Sakin bir atın üzerindeki bir binici, ucunda yapraklardan bir çelenk taşıyan bir asayla küçük bir kalabalığın arasından geçer. Kaldırılmış diğer asalar bir onur kıtası gibi yolu sıralar. Çelenk emekle kazanılmış takdiri, sakin at aceleye getirilmemiş, eğitilmiş bir özgüveni, çevredeki figürler ise başarıyı paylaşan ve destekleyen topluluğu temsil eder.
