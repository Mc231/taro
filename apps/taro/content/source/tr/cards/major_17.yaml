shortUpright: >-
  Zor bir dönemin ardından daha sessiz bir umut geri dönüyor olabilir. Bu kart onu içeri almaya davet ediyor.
shortReversed: >-
  Umut şu anda uzak hissettirebilir. Küçük ve istikrarlı şeyler ona geri dönen yolu bulmana yardım edebilir.
meaningUpright: |-
  Yıldız, umudun ve yenilenmenin kartıdır. Dizide çoğu zaman Kule’nin sarsıntısının ardından gelir ve havası fırtına sonrası sakinliktir: berrak bir gece gökyüzü, serin su, sonunda rahat bir nefes verebildiğin bir an. Burada umut gürültülü bir iyimserlik sayılmaz. İşlerin düzelebileceğine ve sunmaya değer bir şeyin olduğuna dair sessiz bir güvendir.
  Gündelik hayatta bu kart, zor bir dönemin ardından kendini daha hafif hissetmeyi, yaratıcı bir hayalle yeniden bağ kurmayı ya da neden başladığını hatırlatan küçük ilerleme işaretlerini fark etmeyi yansıtabilir. Fikirlerini ya da duygularını zırhsız paylaşabildiğini hissettiğin açıklık anlarına ve dinlenmenin, doğanın ve zamanın basit, onarıcı gücüne işaret edebilir.
  Bu kart, ne kadar küçük olursa olsun şu anda sana neyin umut verdiğini düşünmeye davet eder. Hayatında neyi yenilemek istediğini ve neyin seni tazelenmiş hissettirdiğini sorabilirsin. Yıldız, hem başkalarına hem de kendine karşı cömertliği öne çıkarır. Enerjini seni besleyen şeylere aktarmayı ve gerisinin durulmasına izin vermeyi önerir.
meaningReversed: |-
  Ters geldiğinde Yıldız, umudun daha sönük hissettirdiği bir dönemi yansıtabilir. Yorgun, cesaretin kırılmış ya da çabalarının önemli olup olmadığından şüphe ediyor olabilirsin. Işık sönmedi ama bulutların arasından görmek daha zor olabilir.
  Bu kart, genellikle sana ilham veren şeylerden kopmuşluğa da işaret edebilir; belki de o kadar çok şey verdin ki kendi hayallerine pek bir şey kalmadı.
  Küçük yenilenme kaynakları aramak isteyebilirsin: açık gökyüzü altında bir yürüyüş, sana inanan biriyle bir sohbet, basit bir keyfe geri dönmek. Umut çoğu zaman bir anda değil, küçük adımlarla geri gelir. Ağırlık sürüyorsa güvendiğin birine ya da yetkin bir uzmana ulaşmak kendine özen gösteren bir adım olabilir.
aspects:
  relationshipsUpright: >-
    İlişkilerde Yıldız açıklığı, içtenliği ve yenilenmiş bir güven duygusunu yansıtabilir. Umutlarını sana yakın biriyle paylaşmaya ya da buna ihtiyacı olan birini cesaretlendirmeye davet edebilir. Zor bir dönemden geçmiş bir bağ şimdi daha sakin ve daha umutlu hissettirebilir.
  relationshipsReversed: >-
    Ters geldiğinde bu kart, bir ilişkide görülmediğini ya da cesaretinin kırıldığını hissetmeye veya kabul görmeyecekleri korkusuyla gerçek duygularını saklamaya işaret edebilir. Açık olurken kendini daha güvende hissetmene neyin yardım edeceğini ve küçük, dürüst bir jestin biraz güveni yeniden kurup kuramayacağını düşünebilirsin.
  workUpright: >-
    İşte ya da bir projede Yıldız, ilhamı ve amaç duygusunu öne çıkarır. Yaptığın işi neden yaptığınla yeniden bağ kurmayı ya da bir aksilikten sonra taze bir enerji bulmayı yansıtabilir. Uzun vadeli bir hedefe ya da seni umutlandıran yaratıcı bir fikre zaman ayırabilirsin.
  workReversed: >-
    Ters geldiğinde Yıldız, motivasyonu kaybetmeyi ya da işinin bir anlam taşımadığını hissetmeyi yansıtabilir. Seni başlangıçta bu yola neyin çektiğini ve o kıvılcımın bir parçasının hâlâ orada olup olmadığını sorabilirsin. Küçük kazanımlar ve destekleyici iş arkadaşları amaç duygusunu yeniden kurmaya yardım edebilir.
  growthUpright: >-
    Yenilenme ve kendine nazikçe özen göstermek, Yıldız’ın gelişim mesajının merkezindedir. Seni neyin onardığını fark edip ona biraz daha yer açabilirsin. Önümüzdeki aylar için, istemen gerektiğini düşündüğün şeye değil, gerçekten umduğun şeye dayanan bir niyet belirlemek ayaklarını yere bastırabilir.
  growthReversed: >-
    Ters geldiğinde Yıldız, son zamanlarda boş depoyla yol alıp almadığını sorabilir. Daha fazlasını sunabilmeden önce yeniden dolma ihtiyacını yansıtabilir. Sana sakinlik veren küçük bir günlük pratikle başlayıp onun sessizce büyümesine izin verebilirsin. Kendini yeniden doldurmak vermekten bir ara sayılmaz, vermenin bir parçasıdır.
