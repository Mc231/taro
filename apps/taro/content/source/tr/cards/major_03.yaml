shortUpright: >-
  Sende ya da çevrende bir şey büyüyor. Bu kart onu sabır ve sıcaklıkla beslemeye davet ediyor.
shortReversed: >-
  Özen dışarıya akarken kendi kuyun azalıyor olabilir. Bir kısmı sana nerede geri dönebilir?
meaningUpright: |-
  İmparatoriçe, özenle gerçekleşen büyümenin kartıdır. Başrahibe içe kulak verirken İmparatoriçe yaşayan dünyaya döner: bahçeler, yemekler, el yapımı şeyler, güzel bir ekmeğin ya da ılık güneş ışığının verdiği keyif. Bu kart besleyen türden bir yaratıcılığı temsil eder; bu bir proje, bir ev, bir dostluk ya da kendi rahatlık hissin olabilir.
  Gündelik hayatta bu kart bir üretme mevsimini yansıtabilir: arkadaşlar için yemek pişirmek, yeniden çizim yapmak, bitkilere ya da insanlara bakmak veya yalnızca bedeninde her zamankinden daha çok evinde hissettiğini fark etmek. Sabra da işaret edebilir. İmparatoriçe büyümenin kendi zamanını aldığını ve bir fideyi çekiştirmenin onu daha hızlı büyütmediğini bilir.
  Bu kart neyi yetiştirdiğini ve onu nasıl yetiştirdiğini düşünmeye davet eder. Biraz daha yumuşaklığın, güzelliğin ya da dinlenmenin bir şeyin serpilmesine nerede yardım edebileceğini sorabilirsin. Buradaki bolluk çok şeye sahip olmakla ilgili sayılmaz; çevrende zaten canlı olanı fark etmek ve ondan keyif almakla ilgilidir.
meaningReversed: |-
  Ters geldiğinde İmparatoriçe, dengesini yitirmiş bir özeni yansıtabilir. Enerjini kendin dışında herkese ve her şeye akıtıyor olabilirsin; ta ki yaratıcılık kuruyana ve hoş şeyler bile birer angarya gibi görünene kadar. Ya da özen aşırı müdahaleye dönüşüp öyle sıkı tutunabilir ki başkalarının kendi yollarıyla büyümesine pek alan kalmaz.
  Bu kart, durmuş bir yaratıcı projeye ya da seni genellikle dengede tutan basit, bedensel rahatlıklardan uzaklaşmaya da işaret edebilir.
  Özeninin nereye gittiğine ve bir kısmının eve dönüp dönemeyeceğine bakmak isteyebilirsin. Besleyici bir yemek, ağır bir yürüyüş ya da yalnızca eğlence için bir şey yapmaya ayrılan birkaç dakika gibi kendine gösterdiğin küçük bir özen, İmparatoriçe’nin cömert enerjisiyle yeniden bağ kurmanın bir yolu olabilir.
aspects:
  relationshipsUpright: >-
    İlişkilerde İmparatoriçe, sıcaklığı, sevgiyi ve ilgi gördüğünü hissetmeyi ya da başkalarına cömertçe ilgi göstermeyi yansıtabilir. Birlikte rahatlık yaratmaya davet edebilir: paylaşılan yemekler, açık havada geçen zaman, küçük şefkat jestleri. Sana yakın insanların nasıl ilgi görmekten hoşlandığını, senin de nasıl ilgi görmekten hoşlandığını fark edebilirsin.
  relationshipsReversed: >-
    Ters geldiğinde İmparatoriçe, bir ilişkide özenin tek taraflı hâle gelip gelmediğini ya da kaygının başka birinin seçimlerini yönetmeye kayıp kaymadığını sorabilir. Nerede geri çekilip diğer kişiye daha çok güvenebileceğini ve kendi ihtiyaç duyduğun özeni nerede daha açıkça isteyebileceğini düşünebilirsin.
  workUpright: >-
    İşte ya da yaratıcı bir projede İmparatoriçe verimli bir toprağa işaret eder. Fikirlerin kolayca filizlendiği, bir ekibi, bir proje bahçesini ya da yavaş ve tatmin edici bir zanaat işini besleyebildiğin bir dönemi yansıtabilir. Çalışma alanını daha rahat hâle getirmeye ve istikrarlı, sabırlı bir dikkatten doğan ilerlemeye değer vermeye davet eder.
  workReversed: >-
    Ters geldiğinde bu kart, kendi projen dışında herkesin projesiyle ilgilenmekten gelen bir tükenmişliği ya da ne kadar zorlarsan zorla kıpırdamayan yaratıcı bir tıkanıklığı yansıtabilir. İşi yeniden besleyici kılacak şeyin ne olduğunu sorabilirsin: bir ortam değişikliği, daha kısa bir yapılacaklar listesi ya da kusurlu bir şey yapmaya izin.
  growthUpright: >-
    Kişisel gelişim açısından İmparatoriçe, bedeninde ve fiziksel dünyada olmaktan keyif almaya davet eder. Dinlenmek, iyi yemek, doğada zaman geçirmek ve basit zevkler burada birer şımarıklık sayılmaz; yeniden enerji toplamanın yollarıdır. Seni ayakları yere basan ve cömert hissettiren şeyi fark edip ona biraz daha yer açabilirsin.
  growthReversed: >-
    Ters geldiğinde İmparatoriçe, başkalarına gösterdiğin sabrı senin de hak ettiğini nazikçe hatırlatıyor olabilir. Kendi ihtiyaçlarınla bağının koptuğunu hissetmeyi ya da yaratıcı değerinden şüphe etmeyi yansıtabilir. Yalnızca sana ait küçük ve şefkatli bir ritüelle başlayıp bunun haftanı nasıl değiştirdiğini görebilirsin.
reflectionQuestions:
  - "Şu anda hayatında sabrı hak eden ne büyüyor?"
  - "Nasıl ilgi görmekten hoşlanırsın ve bunu kime anlattın?"
  - "Bugün hangi basit keyfe zaman ayırabilirsin?"
imageryNote: >-
  Taro’nun İmparatoriçesi, yaz sonunda bir mutfak bahçesinde dinlenen bir figür olarak hayal edilir; çevresinde olgunlaşan sebzeler, pencere kenarında soğuyan bir somun ve yanından akan bir dere vardır. Yumuşak dokuma kumaşlar ve yeni toplanmış meyvelerle dolu bir sepet rahatlığı ve duyuların keyfini çağrıştırır; çiçekler arasında dolaşan arılar ise pek çok küçük özenle gerçekleşen büyümeyi ima eder. Hava sıcak ve telaşsızdır; izleyiciyi zaten var olan bolluğu fark etmeye davet eder.
