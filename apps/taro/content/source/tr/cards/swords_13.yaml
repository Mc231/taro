imageryNote: >-
  Özgün çizimde bir figür bulutların çok yukarısına yerleştirilmiş oymalı taş bir koltukta oturur; bir elinde kılıcı dimdik tutarken diğer eli açık ve uzanmış durumdadır. Berrak havada tek bir kuş daireler çizer. Dik kılıç sağduyuyu, açık el adaleti ve dinlemeye istekliliği, yalnız kuş ise bağımsız ve uzağı gören bir zihni ima eder.
