shortUpright: >-
  Net görüş ve nazik, dolaysız bir ses bir arada olabilir; deneyimin sana öğrettiklerine güvenebilirsin.
shortReversed: >-
  Netlik mesafeye dönüşüp sertleşmiş olabilir; dürüstlüğü kaybetmeden sıcaklığın nerede geri dönebileceğini fark edebilirsin.
meaningUpright: |-
  Kılıç Kraliçesi yüksek bir koltukta dimdik oturur; kılıcı havada, bir eli dürüstlüğe davet ediyormuş gibi uzanmıştır. Bu kart deneyimle şekillenmiş net bir algıyı, bir durumu olduğu gibi görme ve onun hakkında açıkça konuşma yeteneğini temsil eder. Bu netlik soğuk değildir; bir şeyleri yaşamış ve onlardan öğrenmiş olmaktan gelir.
  Bu enerjiyi bir sınırı özür dilemeden sağlamca koyduğunda, dürüst ve adil bir geri bildirim verdiğinde ya da hüsnükuruntu yerine gerçeklere dayanarak bir karar aldığında tanıyabilirsin. Bağımsızlığı da yansıtabilir: kendi muhakemene güvenmek ve kendin için düşünmeye alan ihtiyacı duymak. İnsanlar sana gerçeği söyleyeceğini bildikleri için gelebilir.
  Bu kart, netliğin ve şefkatin birlikte nasıl işleyebileceğini düşünmeye davet eder. Net görmek sert olmayı gerektirmez, nazik olmak da rol yapmayı gerektirmez. Geçmiş zorluklar da dahil kendi deneyiminin sana nerede güvenilmeye değer bir bakış açısı kazandırdığını sorabilirsin. Bu içgörüyü hem kendini hem başkalarını dürüstlük ve özenle desteklemek için nasıl kullanabilirsin?
meaningReversed: |-
  Ters geldiğinde Kılıç Kraliçesi soğukluğa dönüşmüş bir netliği yansıtabilir. Geçmiş kırgınlıklar seni temkinli, eleştirmeye hızlı ya da başkalarını yakına almakta isteksiz yapmış olabilir. Dürüstlük insanları uzakta tutmak için kullanıldığında bir kalkana dönüşebilir.
  Bir başka okuma tam tersidir: kendi doğrunu söylemekte zorlanmak, başkalarının muhakemeni bulandırmasına izin vermek ya da tutmayan sınırlar koymak.
  Bu kart, şu anda akılla kalbi nasıl dengelediğine bakmaya davet eder. Eski bir hayal kırıklığının bugün insanlara nasıl karşılık verdiğini şekillendirip şekillendirmediğini fark edebilirsin. Yumuşamak ölçütlerinden vazgeçmek anlamına gelmez; dürüstlüğünün yanında sıcaklığın da yol almasına izin vermek demek olabilir. Net konuşup yine de açık kalmak nasıl görünürdü?
aspects:
  relationshipsUpright: >-
    İlişkilerde Kılıç Kraliçesi açık iletişimi ve sağlıklı sınırları yansıtabilir. Neyi kabul edip neyi etmeyeceğini bilip bunu sakince söyleyebilirsin. Bu enerji dürüstlüğe değer verir ve başkalarına gerçeği söyleyecek kadar saygı duyar. Dolaysızlığı sıcaklıkla eşleştirmek insanların hem saygı gördüğünü hem de önemsendiğini hissetmesine yardım eder.
  relationshipsReversed: >-
    Ters geldiğinde bu kart temkinliliğe, iğneleyici sözlere ya da kırıldıktan sonra başkalarını belli bir mesafede tutmaya işaret edebilir. Kendini korumanın sana yakınlığa mal olmaya başlayıp başlamadığını düşünebilirsin. Yalnızca ne düşündüğünü değil, ne hissettiğini de biraz paylaşmak sınırlarından vazgeçmeden daha sıcak bir bağa davet edebilir.
  workUpright: >-
    İşte Kılıç Kraliçesi adil bir muhakemeyi, net ölçütleri ve karmaşayı yarıp geçme yeteneğini düşündürebilir. Bir toplantıda asıl sorunu adlandıran ya da başkalarının gelişmesine yardım eden geri bildirimi veren kişi sen olabilirsin. Bağımsızlığın ve deneyimin güçlü yanlarındır; gerekçeni açıkça paylaşmak başkalarının kararlarına güvenmesine yardım eder.
  workReversed: >-
    Ters geldiğinde bu kart aşırı eleştirel geri bildirimi, katı ölçütleri ya da kendini ekipten yalıtmayı yansıtabilir. Başkaları karşı çıktığında kendi muhakemenden şüphe etmeye de işaret edebilir. Açık sözlülüğü cesaretlendirmeyle dengeleyebilir ve net beklentilerin, insanlar onları karşılamakta desteklendiğini hissettiğinde daha iyi işlediğini hatırlayabilirsin.
  growthUpright: >-
    Kişisel gelişim açısından Kılıç Kraliçesi kazandığın bilgeliğe güvenmeye davet eder. Zor bir deneyim üzerine düşünüp sana neyi öğrettiğine ad verebilirsin. Kendini net tanımak, popüler olmasalar bile sınırlar koymana, dürüstçe iletişim kurmana ve değerlerinle uyumlu seçimler yapmana yardım eder.
  growthReversed: >-
    Ters geldiğinde bu kart iç eleştirmenini yumuşatma ya da eski bir kırgınlığı bırakma ihtiyacını yansıtabilir. Kendini ya da başkalarını sert bir şekilde yargıladığın anları fark edip daha yumuşak ama yine dürüst sözlerin ne olabileceğini sorabilirsin. Netlik anlayışı da içerdiğinde zayıflamaz, güçlenir.
reflectionQuestions:
