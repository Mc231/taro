imageryNote: >-
  Taro’nun Kulesi, kayalık bir zirvede yükselen uzun ve dar bir taş kule olarak hayal edilir; fırtınalı bir gökyüzünden gelen ani bir ışık huzmesi kulenin tepesini kaldırır. Kıvılcımlar ya da küçük alevler rüzgârdaki tohumlar gibi saçılır ve serbest kalanın yeni başlangıçlar taşıyabileceğini düşündürür. Sahne, koyu bulutlara karşı parlayan bir aydınlanma anı olarak çizilir; odak kimseye zarar gelmesinde değil, temizlenme ve içgörüdedir.
