shortUpright: >-
  Payına düşenden fazlasını taşıyor olabilirsin; bu kart ağırlığı ve gerçekten neyin taşınması gerektiğini fark etmeye davet ediyor.
shortReversed: >-
  Yükün bir kısmı omuzlarından inmeye hazır olabilir; neyi bırakabileceğine, paylaşabileceğine ya da reddedebileceğine bakabilirsin.
meaningUpright: |-
  Asa Onlusu, kollarını büyük bir asa demetinin çevresine sarmış, başı eğik, uzaktaki bir eve doğru yürüyen birini gösterir. Tek bir kıvılcım olarak başlayan ateş pek çok taahhüde dönüşmüştür ve her birini tutmak çaba ister.
  Bu kart çoğu zaman sorumluluklar yavaş yavaş biriktiğinde ortaya çıkar: büyüdükçe büyüyen bir proje, fazladan görevleri üstlenen bir rol ya da kendi planlarını yaşatmaya çalışırken başkalarına bakmak. Bunların çoğu coşkuyla ya da görev duygusuyla başlamış olabilir ve ne zaman bu kadar ağırlaştığını hatırlamak zor olabilir.
  Bu kart, neyi taşıdığına dürüstçe bakmaya davet eder. Hangi sorumluluklar senin, hangileri kendiliğinden sana kalmış? Hangileri hâlâ önemsediğin bir şeye bağlı? Varış noktası yakın olabilir ama yine de bunu farklı taşıyıp taşıyamayacağını sorabilirsin: daha küçük yükler hâlinde, yardımla ya da bazı şeyleri yol boyunca bırakarak.
meaningReversed: |-
  Ters geldiğinde Asa Onlusu bir bırakma anına işaret edebilir. Hiçbir zaman senin olmamış sorumlulukları bırakmaya, görev devretmeye ya da daha fazla yük ekleyecek isteklere hayır demeye başlıyor olabilirsin. Her şeyi aynı anda taşımak zorunda olmadığını fark etmenin bir rahatlığı vardır.
  İçe dönmüş zıt bir örüntüyü de yansıtabilir: yardım mümkün olsa bile, istemek mücadele etmekten daha zor geldiği için her şeyi tek başına yapmakta ısrar etmek.
  Yükünü ayıklamak için iyi bir zaman olabilir. Taşıdıklarını listeleyip paylaşılabilecek, ertelenebilecek ya da bırakılabilecek olanları işaretleyebilirsin. Devredilen tek bir görev ya da geri çevrilen tek bir davet gibi küçük değişiklikler gerçek bir fark yaratabilir. Bırakmak başarısızlık sayılmaz; enerjini en önemli olana saklamanın bir yolu olabilir.
aspects:
  relationshipsUpright: >-
    İlişkilerde bu kart, kimin neyi taşıdığı konusunda bir dengesizliği yansıtabilir: planlamanın, endişelenmenin ya da duygusal işin çoğunu tek bir kişinin üstlenmesi. Yükün adil hissettirip hissettirmediğini fark edip bunu açıkça konuşabilirsin. Ağırlığı paylaşmak insanları yakınlaştırabilir; sessizce fazlasını taşımak ise çoğu zaman sessiz kırgınlıklar doğurur.
  relationshipsReversed: >-
    Ters geldiğinde yardım istemeyi ya da başkaları için üstlendiğin rollerden geri çekilmeyi öğreniyor olabilirsin. Bu ilk başta rahatsız edici gelebilir. Hangi sorumlulukları paylaşmak istediğini ve isteyemeyecek kadar yorulmayı beklemeden, iş birliğine davet eden bir şekilde nasıl isteyebileceğini düşünebilirsin.
  workUpright: >-
    İşte ya da eğitimde Asa Onlusu aşırı taahhüde işaret edebilir: zamandan fazla görev ya da ilk hâlinin ötesine büyümüş bir proje. Taahhütlerini gözden geçirebilir, öncelikleri işin içindeki insanlarla netleştirebilir ve sadeleştirilebilecek her şeyi arayabilirsin. İyi bitirmek çoğu zaman aynı anda daha azını taşımaya bağlıdır.
  workReversed: >-
    Ters geldiğinde sınır koymaya, görev devretmeye ya da son tarihleri yeniden konuşmaya başlıyor ya da bunu yapmaya direniyor olabilirsin. Başka birinin üstlenebileceği bir görevi ya da geri çevirebileceğin bir taahhüdü belirleyebilirsin. İş yükünde yer açmak hem odağı hem de işi başlatan coşkuyu geri getirebilir.
  growthUpright: >-
    Burada sorgulamaya değer bir inanç, her şeyle kendin ilgilenmen gerektiği inancıdır. Bu inanç nereden geldi? Bedeninin ve ruh hâlinin ağır bir yüke nasıl tepki verdiğini fark edip bu işaretleri neyin değişmesi gerektiğine dair birer bilgi olarak görebilirsin.
  growthReversed: >-
    Ters geldiğinde bir şeyi bırakmanın getirdiği hafifliği keşfediyor olabilirsin. Anlam verdiği için neyi taşımaya devam etmek istediğini ve neyi bırakmaya hazır olduğunu keşfedebilirsin. Sorumluluklarını yalnızca kabul etmek yerine seçmek, sessiz bir öz saygı eylemi olabilir.
reflectionQuestions:
  - "Şu anda taşıdığın ve taşıması sana düşmeyebilecek şey ne?"
  - "Açıkça istesen bu yükün bir kısmını kim paylaşabilir?"
  - >-
    Bu hafta bırakabileceğin, erteleyebileceğin ya da geri çevirebileceğin bir şey ne?
imageryNote: >-
  Bir figür öne eğilerek yürür; kollarını yüzünü neredeyse gizleyen, on asadan oluşan uzun bir demetin çevresine sarmıştır ve ufuktaki küçük bir eve ya da kasabaya doğru ilerler. Demet birikmiş sorumlulukları, gizlenen yüz ağır bir yükün bakışı nasıl daraltabildiğini, yakındaki varış noktası ise ulaşılabilir bir sonu temsil eder. Açık yol, yükün paylaşıldığını ya da bırakıldığını hayal etmeye yer bırakır.
