imageryNote: >-
  Taro’nun Asılan Adam’ı, sağlam ve canlı bir daldan tek bileğiyle baş aşağı asılı, kolları gevşek, yüzü sakin, hatta meraklı olarak hayal edilir. Bu açıdan figür dünyayı aşağıdaki bir havuzda ters dönmüş olarak yansıyan hâliyle görür. Ağaç yeşildir ve tomurcuklanmaktadır; duraklamanın bir son olmadığını, büyümenin bir parçası olduğunu gösterir. Suyu andıran maviler ve bol, dalgalanan giysiler teslimiyeti, düş kurmayı ve yüzeyin altını görmeyi yankılar.
