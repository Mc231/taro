  relationshipsReversed: >-
    Ters geldiğinde bu kart, iki kişinin de ne istediğini söylemediği, arafta kalmış bir ilişkiye işaret edebilir. İşlerin değişeceği umuduyla adil hissettirenden fazlasını vermeyi de yansıtabilir. İkinizin de ilerleyebilmesi için neye ihtiyaç duyduğunu nazikçe söyleme zamanının gelip gelmediğini düşünebilirsin.
  workUpright: >-
    İşte ya da bir projede Asılan Adam, yeniden düşünmek için bir duraklamayı öne çıkarır. Gecikmeler can sıkıcı olabilir ama varsayımları sorgulamak, alternatifleri araştırmak ya da bir fikrin olgunlaşmasına izin vermek için zaman tanıyabilir. Yavaş bir dönemi işine bambaşka bir açıdan bakmak için kullanabilirsin.
  workReversed: >-
    Ters geldiğinde Asılan Adam, fazla uzun süredir takılıp kalmış bir projeyi ya da durmadan ertelenen bir kararı yansıtabilir. Gerçekte hangi bilgiyi ya da desteği beklediğini sorabilirsin. Kendine yumuşak bir son tarih koymak ya da bir seçeneği bırakmayı seçmek, hareketin geri dönmesine yardım edebilir.
  growthUpright: >-
    Bırakmak bir beceridir ve Asılan Adam onu denemek için bir fırsat sunar. Bıraktığın şey bir inanç, bir beklenti ya da acele etme alışkanlığı olabilir. Tanıdık bir şeyi ters sırayla ya da yeni bir açıdan yapmayı deneyip bu küçük sapmanın dünyayı genellikle nasıl gördüğün hakkında neyi ortaya çıkardığını fark edebilirsin.
  growthReversed: >-
    Ters geldiğinde Asılan Adam, dinginlikten mi kaçtığını yoksa onun içinde mi takılıp kaldığını sorabilir. Bir huzursuzluğu ya da beklemeye alınmış olma hissini yansıtabilir. Kendine sorabilirsin: bu sabrın mı zamanı, yoksa nazik bir itişin mi? Dürüst cevabın bir sonraki adımına yol gösterebilir.
