imageryNote: >-
  Bir tepenin ya da yarın üzerinde, sırtı kısmen dönük bir figür durur; çevresine emeğin işaretleri gibi üç asa dikilmiştir ve aşağıda açık sularda ya da ovalarda ilerleyen tekneleri veya yolcuları izler. Erken saatlerin ışığı yeni bir aşamanın başladığını düşündürebilir. Uzaktaki hareket çoktan yola çıkmış planları, sağlam duruş ise sonuçlar hâlâ yoldayken sabırlı bir güveni temsil eder.
