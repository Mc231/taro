imageryNote: >-
  Taro’nun Ermiş’i, alacakaranlıkta yüksek ve karlı bir sırtta, yolun yalnızca sonraki birkaç adımını aydınlatan sade bir fener taşıyan pelerinli bir figür olarak hayal edilir. Kullanıldıkça pürüzsüzleşmiş bir baston, deneyimden edinilmiş desteği çağrıştırır. Arkadaki kardaki ayak izleri figürün ne kadar yol aldığını gösterir. Soğuk maviler ve griler yalnızlığı ve berrak havayı anlatırken fenerin sıcak ışığı, içgörünün yolun en karanlık kısmına bile taşınabileceğini gösterir.
