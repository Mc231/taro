meaningUpright: |-
  Kılıç Şövalyesi tam hızla ileri atılır; kılıcı önde, rüzgâr uğuldar. Bu kart kararını vermiş ve buna göre hemen şimdi davranmak isteyen bir zihnin enerjisini taşır. Azimden, sesini yükseltme cesaretinden ve bir fikrin tereddütsüzce peşine düşmenin heyecanından söz eder.
  Bu kartı bir soruna doğrudan el atmaya, bir ilkeyi savunmaya ya da sonunda duran bir projeyi ileri itmeye hazır hissettiğinde tanıyabilirsin. Bir verimlilik dalgasını, iyi kurulmuş keskin bir argümanı ya da başkalarının kaçındığı zor şeyi söylemeye istekliliği yansıtabilir. Bu itkinin gerçek bir değeri vardır; durgunluğu kırabilir ve işleri harekete geçirebilir.
  Bu kart önündeki yolu düşünmeye de davet eder. Hız seni önemli ayrıntıların yanından geçirebilir ve güçlü görüşler daha sessiz sesleri ezebilir. İvmenin net bir hedefe hizmet edip etmediğini ve başkalarının seninle mi geldiğini yoksa geride mi kaldığını sorabilirsin. Bu enerjinin cesaretini ve dolaysızlığını korurken yönünü özenle nasıl seçebilirsin?
meaningReversed: |-
  Ters geldiğinde Kılıç Şövalyesi dağınık ya da fazla hızlı hareket eden bir enerjiyi yansıtabilir. İşlere dürtüyle başlıyor, keskin konuşuyor ya da nereye gittiğine dair net bir fikir olmadan ilerliyor olabilirsin. Sonuç sürtüşme, yorgunluk ya da geri dönmek zorunda kalmak olabilir.
  Bir başka okuma da engellenmiş bir ivmedir: koşullar ya da şüpheler yüzünden geri tutulan ve hayal kırıklığına dönüşebilen harekete geçme isteği.
  Bu kart, atı bir anlığına adım hızına indirmeye davet eder. Yönünü kontrol edebilir, sözlerinin etkisini düşünebilir ve aciliyetin gerçekten gerekli olup olmadığını sorabilirsin. Harekete geçmeden önce bir nefes almak kararlılığını zayıflatmaz; onu odaklayabilir. Acele ile değil amaçla hareket etseydin ne değişirdi?
aspects:
  relationshipsUpright: >-
    İlişkilerde Kılıç Şövalyesi dolaysızlığı yansıtabilir: ne düşündüğünü söylemek, kaçındığın bir konuşmanın peşine düşmek ya da birini savunmak. Dürüstlük havayı temizleyebilir. Hızı özenle dengeleyebilir, diğer kişiye kanaatinin gücü altında ezilmek yerine karşılık vermesi ve duyulduğunu hissetmesi için zaman tanıyabilirsin.
  relationshipsReversed: >-
    Ters geldiğinde bu kart aceleyle söylenmiş sözlere, hızla tırmanan tartışmalara ya da başka birinin temposuna karşı sabırsızlığa işaret edebilir. Başka birinin ne demek istediği konusunda aceleyle sonuca vardığın anları fark edebilirsin. Yavaşlamak, bir soru sormak ya da yanıt vermeden önce bir gün beklemek gereksiz kırgınlıkları önleyebilir.
  workUpright: >-
    İşte Kılıç Şövalyesi işleri bitirmeye yönelik bir atılımı düşündürebilir: birikmiş işlere el atmak, bir öneriyi savunmak ya da net bir fırsat için hızla harekete geçmek. Odağın başkalarına ilham verebilir. Ekip yönünü anlasın diye iletişimi açık tutabilir ve hız kaliteyi zedelemesin diye önemli ayrıntıları iki kez kontrol edebilirsin.
  workReversed: >-
    Ters geldiğinde bu kart plansızca işlere dalmayı, iş arkadaşlarıyla çatışmayı ya da yavaş süreçlerden duyulan hayal kırıklığını yansıtabilir. Öncelikleri belirlemek için durup hızlı bir çözümün kalıcı olup olmayacağını düşünebilirsin. İlerleme engellenmişse enerjini hazırlığa yöneltmek nihai hamleyi çok daha etkili kılabilir.
  growthUpright: >-
    Kişisel gelişim açısından Kılıç Şövalyesi inançlarına göre harekete geçmeye davet eder. Bir hedef seçip ona odaklanarak ilerleyebilir, bağlılıkla harcanan çabadan gelen enerjiyi fark edebilirsin. Konuşma ve hareket etme cesareti değerlidir; onu düşünmeyle eşleştirmek gerçekten istediğin yönde gelişmene yardım eder.
  growthReversed: >-
    Ters geldiğinde bu kart huzursuzluğu ya da dürtüsel seçimleri yansıtabilir. Acele etme isteğini neyin yönlendirdiğini fark edebilirsin: heyecan mı, kaygı mı, yoksa rahatsızlıktan kaçma isteği mi? Gününe küçük duraklamalar, bir karardan önce birkaç nefes bile eklemek, tepki vermek yerine düşünceli bir şekilde karşılık vermene yardım edebilir.
