imageryNote: >-
  Özgün çizim, dörtnala giden bir atın üzerinde öne eğilmiş, kılıcını uzatmış, pelerini rüzgârda çırpınan bir biniciyi gösterir. Yamaçtaki ağaçlar aynı yöne eğilir ve yırtık bulutlar tepede koşuşturur. Öne eğiliş ve koşuşan bulutlar ivmeyi ve kararlılığı düşündürürken eğilen ağaçlar böyle bir hızın çevresindeki her şeye uyguladığı gücü ima eder.
