meaningUpright: |-
  Kılıç Altılısı bir geçişin kartıdır. Küçük bir kayık suyu geçer; dalgalı suları geride bırakıp daha sakin bir kıyıya yönelir. Yolculuk çarpıcı değildir. İstikrarlıdır, bazen hüzünlü, çoğu zaman rahatlatıcıdır.
  Bu kart daha zor bir bölümden daha kolay birine doğru her türlü geçişi yansıtabilir: işte zorlu bir dönemi bitirmek, yeni bir yere taşınmak, yıpratıcı bir durumdan geri çekilmek ya da yalnızca bir fırtınanın ardından düşüncelerinin sakinleşmeye başladığını hissetmek. Kılıçlar yolcularla birlikte yolculuk eder; bu da bazı anıların ve derslerin yanında geldiğini düşündürür. İlerlemek için her şeyi geride bırakmak zorunda değilsin.
  Bu kart, ilerleme yavaş hissettirse bile zaten yöneldiğin yönü fark etmeye davet eder. Karşıya geçmene kimin ya da neyin yardım ettiğini ve bu yardımı kabul edip edemeyeceğini sorabilirsin. Geçişler çoğu zaman rahatlamayı geride bırakılan için duyulan biraz hüzünle karıştırır; iki duygu da aynı kayıkta yol alabilir. Bu geçişi senin için daha yumuşak kılacak şey ne olurdu?
meaningReversed: |-
  Ters geldiğinde Kılıç Altılısı gecikmiş ya da direnilen bir geçişi yansıtabilir. Yoluna devam etme zamanının geldiğini bilip alışkanlık, pratik bağlar ya da karşı tarafta neyin beklediğine dair belirsizlik yüzünden geri tutulduğunu hissedebilirsin. Kayık hazır olabilir, sen ise hâlâ iskelede.
  Bir başka okuma da eski kıyıdan fazlasını taşımaktır: geçişi gerektiğinden ağır kılan endişeler, roller ya da beklentiler. Bazen gerçekten ayrılabilmeden önce bir şeyi bitirmek için kısa bir süreliğine geri dönmeye de işaret edebilir.
  Hareket etmek için hâlâ neye ihtiyacın olduğunu sorabilirsin. Bilgiye mi, desteğe mi, bir kapanışa mı, yoksa kendinden bir izne mi? Değişim sen hazır olana kadar bekleyebilir ve hazır olmak da küçük adımlarla inşa edilebilir. Yola çıkmadan önce bırakabileceğin tek parça ne?
aspects:
  relationshipsUpright: >-
    İlişkilerde bu kart zorlu bir dönemden birlikte daha sakin bir zemine doğru ilerlemeye ya da artık işine yaramayan bir örüntüden nazikçe uzaklaşmaya işaret edebilir. Sana yakın birini kendi geçişinde desteklemeyi de yansıtabilir. Çözmekten çok sessiz bir yoldaşlığın, birinin karşıya geçerken kendini daha az yalnız hissetmesine nasıl yardım edebileceğini fark edebilirsin.
  relationshipsReversed: >-
    Ters geldiğinde Kılıç Altılısı eski bir dinamiği geride bırakmakta zorlanmayı ya da geçmiş kırgınlıkları yeni bir bölüme taşımayı yansıtabilir. Hangi beklentilerin bu ilişkiye değil, daha önceki bir ilişkiye ait olduğunu düşünebilirsin. İkinizin de eski kıyıda neyi bırakmak istediğini konuşmak şimdiyi daha hafif hissettirebilir.
  workUpright: >-
    İşte bu kart kademeli bir değişimi düşündürebilir: yeni bir rol, değişmiş bir ekip ya da stresli bir projeden daha sağlam bir zemine geçmek. Geçiş heyecan verici hissettirmeyebilir ama rahatlama getirebilir. Yanında getirdiğin becerileri ve dersleri gözden geçirip yalnızca dalgalı sulara ait olan alışkanlıkları bırakabilirsin.
  workReversed: >-
    Ters geldiğinde bu kart işte sürekli ertelenen bir değişikliği ya da ayrılmak istediğin bir duruma seni bağlayan yarım kalmış görevleri yansıtabilir. Gerçekten tamamlanması gerekenleri ve devredilebilecekleri listeleyebilirsin. Bazen birkaç açık ucu toparlamak sonunda kayığın iskeleden ayrılmasını sağlar.
  growthUpright: >-
    Kişisel gelişim açısından Kılıç Altılısı yavaş ilerlemeyi onurlandırmaya davet eder. Eski bir düşünme biçiminden uzaklaşmak çoğu zaman tek bir cesur sıçramayla değil, pek çok küçük günle gerçekleşir. Eskisinden zaten daha sakin ya da daha bilge olduğuna dair kanıtları fark edip kat ettiğin mesafe için kendini takdir edebilirsin.
  growthReversed: >-
    Ters geldiğinde bu kart artık yardımcı olmasalar bile tanıdık örüntülere tutunmayı ya da olanları sindirmeden aceleyle ilerlemeyi yansıtabilir. Bilinçli olarak bir kez dönüp bakmak için durabilir, yanında neyi götürdüğünü ve neyi bırakmaya hazır olduğunu adlandırabilirsin. Sonra yeniden suya dön.
