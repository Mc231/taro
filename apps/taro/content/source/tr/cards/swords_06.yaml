imageryNote: >-
  Özgün çizimde küçük bir kayık kırışık sulardan durgun ve sisli bir kıyıya doğru süzülür. Altı kılıç kayığın içinde sessiz bir yük gibi dik durur; oturan bir yolcu öne bakar. Uzun bir sırık sığ sularda istikrarlı bir şekilde iter. Değişen su çalkantıdan sakinliğe bir geçişi gösterir; kılıçlar yanında taşınan dersleri, sırık ise sabırlı ve adım adım hareketi düşündürür.
