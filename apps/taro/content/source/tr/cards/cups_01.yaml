shortUpright: >-
  Taze bir duygu yükseliyor olabilir; bu kart onu içeri almaya ve nereye akmak istediğini fark etmeye davet ediyor.
shortReversed: >-
  Kupanın dökülebilmesi için önce dolması gerekebilir; bugün seni sessizce neyin yenileyeceğini düşün.
meaningUpright: |-
  Kupa Ası, su takımının ilk kıpırtısıdır: o kadar dolu ki taşan tek bir kap. Henüz sözcüklere dökmeden gelen bir duyguyu yansıtabilir; şefkat, hayranlık, rahatlama ya da birine veya bir şeye karşı ani bir sıcaklık gibi. Henüz onunla bir şey yapmak gerekmez. Kart yalnızca orada olduğunu fark etmeni ister.
  Gündelik hayatta bu, haftalardır ilk kez gönülden gülmek, bir müzik parçasından etkilenmek ya da eski bir kırgınlığın sen hiç çabalamadan yumuşadığını fark etmek gibi görünebilir. Yeni bir yaratıcı dürtüye ya da kendine daha nazik davranma isteğine de işaret edebilir.
  Bu kart, duyguyu hemen yönetmeye çalışmak yerine açık kalmaya davet eder. Özeninin nereye gitmek istediğini ve bir kısmının sana da ulaşmasına izin verip vermediğini sorabilirsin. Açık bir kalp hiçbir şeyin vaadi sayılmaz; güne içinde biraz daha fazla yerle karşılamanın bir yoludur.
meaningReversed: |-
  Ters geldiğinde Kupa Ası, duygunun orada olduğunu ama ağzı kapalı bir kavanozdaki su gibi içerde tutulduğunu düşündürebilir. Belki başkalarıyla ilgilenmekle meşguldün ya da bir süre duyguları belli bir mesafede tutmak daha güvenli geldi. Bunda yanlış bir şey yok; kalbini korumak zorlu bir döneme verilmiş makul bir tepki olabilir.
  Bu kart boş depoyla ilerleme hissini de yansıtabilir. Küçük keyiflerin sana ulaşmadığını ya da uzun zamandır yeniden doldurulmamış bir kupadan verdiğini fark edebilirsin.
  Buradaki davet naziktir. Kendini daha çok hissetmeye zorlamak yerine seni sessizce neyin yenilediğine bakabilirsin: uyku, su kenarında bir yürüyüş, telaşsız bir sohbet ya da kimsenin sana ihtiyaç duymadığı bir saat. Bir şey kupanı yeniden doldurduğunda bunu fark etmene izin ver. Açıklık kendi temposunda geri dönebilir.
aspects:
  relationshipsUpright: >-
    Yakın bağlarda Kupa Ası, ister bir partnerle ister bir arkadaşla, ailenle ya da yeni biriyle olsun, taze bir sıcaklık dalgasını yansıtabilir. Sevgini basitçe ve hesapsızca ifade etmeye davet edebilir: onu düşündüğün için gönderilen bir mesaj, içten bir teşekkür, tam bir dikkat anı. Özen göstermenin yanı sıra özen görmenin nasıl hissettirdiğini de fark edebilirsin.
  relationshipsReversed: >-
    Ters geldiğinde bu kart, belki geçmiş kırgınlıklar belki de düpedüz yorgunluk yüzünden geri tutulan bir sevgiye işaret edebilir. Kibarca dinlerken biraz ulaşılmaz kaldığını fark edebilirsin. Zorlamaya gerek yok. Neyi takdir ettiğini söylemek gibi küçük ve güvenli bir açıklık eyleminin seninle yakın biri arasında biraz daha sıcaklığın dolaşmasına izin verip veremeyeceğini düşün.
  workUpright: >-
    İşte ya da önemsediğin herhangi bir projede bu kart yenilenmiş bir coşkuyu ya da seni gerçekten etkileyen yeni bir fikri yansıtabilir. Yaptığın işe duygu katmaya davet edebilir: hizmet ettiğin insanlara özen, zanaattan alınan keyif, neyin büyüyebileceğine dair merak. Pratik kaygılar onu şekillendirmeye başlamadan önce şu anda seni neyin heyecanlandırdığını not edebilirsin.
  workReversed: >-
    Ters geldiğinde kart, ilginin başka bir yerde beklediği, yalnızca göstermelik hareketlerle yürüttüğün mekanik hâle gelmiş bir işi yansıtabilir. Bu, uzun bir çabanın ardından sık görülür. Seni bu yola ilk başta neyin çektiğini ya da hangi küçük kısmının hâlâ canlı hissettirdiğini sorabilir ve o kısma daha fazla yer vermenin akışın bir kısmını geri getirip getirmediğine bakabilirsin.
  growthUpright: >-
    Kişisel gelişim açısından Kupa Ası, kendinle duygusal dürüstlüğe davet eder. Duyguları geldikçe onları iyi ya da kötü diye sıralamadan adlandırmayı deneyebilirsin. Günlük yazmak, su kenarında vakit geçirmek ya da yalnızca cevap vermeden önce durmak buna alan açabilir. Amaç sürekli mutluluk değil, iç dünyanla daha nazik ve daha açık bir ilişkidir.
  growthReversed: >-
    Ters geldiğinde bu kart, dışarıya daha fazlasını sunmadan önce özeni içe çevirmeyi önerebilir. Rezervlerin azalmış gibi hissediyorsa dinlenmeyi ve küçük keyifleri isteğe bağlı değil, gerekli şeyler olarak görebilirsin. Seni neyin tükettiğini ve neyin doldurduğunu fark etmek yardımcı olabilir. Ağır duygular seninle kalıyorsa güvendiğin biriyle konuşmak da faydalı bir adım olabilir.
