imageryNote: >-
  Görselin merkezinde ağzına kadar dolup taşan tek bir kap vardır; suyu birkaç ince akıntı hâlinde aşağıdaki durgun bir havuza dökülür. Yüzeydeki nilüferler ya da lotus yaprakları, yavaşça açılan ve derin yerlerde kök salan duyguları temsil edebilir. Kupanın üzerindeki yumuşak bir ışık alıcılığı, sımsıkı kavranan değil uzatılan bir sunuyu çağrıştırabilir. Genel hava sakin bir bolluktur: yeterinden fazlası, nazikçe dışarı taşan.
