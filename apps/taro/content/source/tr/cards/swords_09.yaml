imageryNote: >-
  Özgün çizim, yalnızca penceredeki ince bir ay ışığı şeridiyle aydınlanan karanlık bir odada, dizlerini kendine çekmiş, yatakta doğrulup oturan bir figürü gösterir. Arkadaki duvarda dokuz kılıç düzgün sıralar hâlinde asılıdır ve figüre hiç dokunmaz. Katlanmış bir battaniye ve küçük, yanmamış bir lamba hemen yanı başında bekler. Kılıç sıraları döngüye giren düşünceleri düşündürürken lamba ve pencere teselli ile sabahın el altında olduğunu ima eder.
