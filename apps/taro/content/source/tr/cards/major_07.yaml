imageryNote: >-
  Taro’nun Savaş Arabası, kıyı boyunca uzanan bir yolda küçük ve sağlam bir arabayı süren bir figür olarak hayal edilir; arabayı biri sakin, biri huzursuz, mizaçları birbirine zıt iki hayvan çeker. Sürücü dizginleri hafifçe tutar ve güçle değil dikkatle yönlendirir. Koltuğun üzerindeki deniz kabuğuna benzeyen tente Yengeç burcuna ve birinin güvenle ilerlemesini sağlayan korumaya gönderme yapabilir; açık yol ve uzaktaki liman ışıkları ise dayatılmamış, seçilmiş bir varış noktasını çağrıştırır.
