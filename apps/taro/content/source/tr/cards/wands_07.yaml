imageryNote: >-
  Tek bir figür kayalık bir yükseltinin üzerinde, ayakları düzensiz bir zemine basmış hâlde durur; bir asayı iki eliyle kaldırmıştır, diğer altı asa ise kenarın altından yukarı doğru itilir. Düzensiz zemin inancın her zaman rahat olmadığını, yüksek zemin ise emekle kazanılmış gerçek bir bakış noktasını gösterir. Aşağıdaki asalar zorlukları, soruları ve yarışan sesleri temsil edebilir; sağlam kavrayış ise değerlere dayanan cesareti.
