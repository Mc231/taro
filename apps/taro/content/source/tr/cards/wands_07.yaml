shortUpright: >-
  Senin için önemli bir duruşu koruyor olabilirsin; bu kart sağlam durmanın gerektirdiği cesareti onurlandırıyor.
shortReversed: >-
  Her şeyi aynı anda savunmak seni yıpratabilir; hangi zeminin gerçekten korunmaya değer olduğunu seçebilirsin.
meaningUpright: |-
  Asa Yedilisi yüksek bir zeminde, aşağıdan yükselen birkaç asaya karşı tek bir asa tutan birini gösterir. Konum kolay değildir ama bir avantaj sağlar. Bu kart inançla ilgilidir: inandığın şeyin arkasında durmak, uğruna çalıştığın bir şeyi korumak ya da başkaları karşı çıktığında ayaklarını yere sağlam basmak.
  Bir grupta popüler olmayan bir görüşü dile getirdiğinde, sürekli sınanan bir sınırı korumaya devam ettiğinde ya da başkalarının şüphe ettiği bir projeyi sürdürdüğünde ortaya çıkabilir. Belli bir başarıya ulaştıktan sonra daha fazla insanın ona meydan okumak ya da onu sorgulamak istediğini de fark edebilirsin.
  Bu kart, kendi gücünü ve ona amaç veren değerleri fark etmeye davet eder. Sağlam durmak saldırganlık gerektirmez; istikrarlı, sakin ve net olabilir. Tam olarak neyi savunduğunu ve bunun neden önemli olduğunu sorabilirsin; böylece enerjin gelip geçen her meydan okumaya değil, senin için önemli olana gider.
meaningReversed: |-
  Ters geldiğinde Asa Yedilisi, sayıca az kalmışlık ya da yıpranmışlık hissini yansıtabilir. Belki uzun süredir bir duruşu savunuyorsun ve bu çaba kendini göstermeye başlıyor. Ya da kimse gerçekten saldırmıyorken bile tetikte olduğunu fark edebilirsin.
  Bu kart bir yeniden düşünme anına da işaret edebilir. Her meydan okumanın bir cevaba ihtiyacı yoktur ve her duruşun sonsuza dek korunması gerekmez. Bir mücadeleyi bırakmak, daha önemli olanlar için enerji açabilir.
  Nerede karşı koyduğunu ve nedenini gözden geçirebilirsin. Hangi sınırlar değerlerini koruyor, hangileri savunmacılık alışkanlığına dönüştü? Destek istemek, dinlenmek için geri çekilmek ya da tepeyi tek başına tutmak yerine yükü başkalarıyla paylaşmak yardımcı olabilir.
aspects:
  relationshipsUpright: >-
    Yakın bağlarda bu kart, biraz sürtüşme yaratsa bile ihtiyaçların için sesini yükseltmeyi yansıtabilir. Önemsediğin birini savunmaya da işaret edebilir. Bir sınırı sıcaklıkla nasıl koruyabileceğini düşünebilirsin; senin için önemli olanı açıkça söylerken diğer kişinin bakış açısına da yer bırakarak.
  relationshipsReversed: >-
    Ters geldiğinde biriyle hep savunmada olduğunu ya da her konuşmanın bir tartışmaya dönüştüğünü hissedebilirsin. Kendini gerçek bir eleştiriden mi yoksa eski bir korkudan mı koruduğunu fark edebilirsin. Daha yumuşak bir yaklaşım ya da cevap vermeden önce kısa bir duraklama, daha dürüst bir alışverişe alan açabilir.
  workUpright: >-
    İşte ya da yaratıcı bir projede Asa Yedilisi, baskı altında bir ölçütü ya da fikri korumaya işaret edebilir: rekabet, eleştiri ya da değişen talepler. Sakin bir özgüvenle konuşabilmek için gerekçelerini ve kanıtlarını toplayabilirsin. Buradaki azim, neyi koruduğunu ve bunun neden önemli olduğunu net bilmekten gelir.
  workReversed: >-
    Ters geldiğinde her meydan okumaya ya da talebe hepsi eşit derecede acilmiş gibi yanıt vererek kendini fazla dağıtıyor olabilirsin. Gerçekten duruş sergilemen gereken bir iki konuyu seçip gerisini şimdilik bırakabilirsin. İş arkadaşlarından ya da birlikte çalıştığın insanlardan destek istemek de zor bir konumu korumayı kolaylaştırabilir.
  growthUpright: >-
    Kısa bir süre için bile olsa duruşunu korumak, takdir edilmeye değer bir dayanıklılığın kanıtıdır. Değerlerinin arkasında durmak için sandığından daha fazla kapasiten var. Sağlam durduğun bir zamanı hatırlayıp o zaman neyin yardım ettiğini fark edebilirsin; net bir neden, destekleyici biri ya da istikrarlı bir rutin gibi.
  growthReversed: >-
    Ters geldiğinde sürekli bir tetikte olma hissini taşıyor olabilirsin. Bunun nereden geldiğini ve sana hâlâ hizmet edip etmediğini keşfetmeye değer. Mücadelelerini seçmek pes etmek sayılmaz; cesaretin gerçekten önemli olduğunda hazır olsun diye enerjini korumanın bir yolu olabilir.
