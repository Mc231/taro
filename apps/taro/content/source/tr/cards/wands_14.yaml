imageryNote: >-
  Bir figür bir seyir noktasının kenarındaki yüksek bir koltukta oturur; çiçek açmış bir asa yanına sağlamca dikilmiştir ve sanki kalkmak üzereymiş gibi öne eğilir. Ötesinde bir yol, akşamüstü güneşinin aydınlattığı uzak tepelere doğru kıvrılır. Çiçek açan asa canlı ve büyüyen bir vizyonu, seyir noktası neyin inşa edilebileceğine dair geniş bir bakışı, öne eğilme ise fikirleri eyleme dönüştürmeye hazır olmayı çağrıştırır. Közler ya da küçük alev motifleri ateş elementini taşıyabilir.
