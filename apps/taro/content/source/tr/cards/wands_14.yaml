shortUpright: >-
  Net ve vizyoner bir enerji, amaçla yol göstermeye ve büyük fikirleri başkalarının izleyebileceği bir yöne dönüştürmeye davet ediyor.
shortReversed: >-
  Güçlü itki sabırsızlığa ya da kontrole kayıyor olabilir; vizyonunun başkalarına hâlâ yer bırakıp bırakmadığına bakabilirsin.
meaningUpright: |-
  Asa Kralı, takımın ateşini olgunluğa taşır. Bir tahtta oturan ama hafifçe öne eğilmiş, elinde asası olan bu figür harekete geçmeye hazır görünür. Enerji vizyoner ve kararlıdır: işlerin nereye gidebileceğini görebilen ve yönü belirleyecek özgüvene ve deneyime sahip biri.
  Bu nitelik, bir projenin sorumluluğunu üstlendiğinde, bir grubu bir değişimin içinden geçirdiğinde ya da net değerlere dayanan cesur bir karar verdiğinde ortaya çıkabilir. Amaç duygusu başkalarına cesaret veren bir mentoru ya da önderi de anlatabilir.
  Bu kart, kendi yetkini üstlenmeye davet eder. Buradaki liderlik kontrolden çok vizyon, dürüstlük ve sözün arkasında durmakla ilgilidir. Şu anki çabalarının hangi daha büyük amaca hizmet ettiğini ve bunu işin içindeki insanlarla nasıl açıkça paylaşabileceğini sorabilirsin. Bir yön dürüst ve iyi anlatılmış olduğunda insanlar çoğu zaman yalnızca emirlere uymak yerine ona katılmak ister.
meaningReversed: |-
  Ters geldiğinde Asa Kralı, dengesini kaybetmiş bir itkiyi yansıtabilir. Başkalarının temposuna karşı sabırsız hissedebilir, planları dinlemeden zorla geçirebilir ya da dinlenmeye hiç yer bırakmayacak kadar yüksek hedefler koyabilirsin. Öte yandan vizyonu gözden kaçırmış ve bundan sonra nereye gideceğinden emin olamayan bir önderi, belki de seni gösterebilir.
  Bu kart, etkini nasıl kullandığına bakmaya davet ediyor olabilir. Enerjin insanlara ilham mı veriyor, yoksa onları bunaltıyor mu? Vizyon senin için hâlâ canlı mı?
  Amacınla yeniden bağ kurmak için durabilir, dürüst geri bildirim isteyebilir ya da kararları daha geniş bir çevreyle paylaşabilirsin. Güçlü liderlik çoğu zaman yön vermek kadar dinlemekten de doğar.
aspects:
  relationshipsUpright: >-
    İlişkilerde bu kart özgüvenli, koruyucu ve cesaretlendirici bir varlığı yansıtabilir. Ortak planlara vizyon getirebilir ve sana yakın olanların kendi hedeflerine inanmasına yardım edebilirsin. Davet, cömertlikle yol göstermektir: istendiğinde yön sunmak, dümeni başka biri tutmak istediğinde destek olmak.
  relationshipsReversed: >-
    Ters geldiğinde bir kişi kararların kontrolünü fazlasıyla ele alıyor olabilir ya da sabırsızlık gerginlik yaratıyor olabilir. Sana yakın birini tam olarak mı dinlediğini yoksa çoktan cevabını mı planladığını fark edebilirsin. Diğer kişinin fikirlerini davet etmek tek taraflı bir planı ortak bir plana dönüştürebilir.
  workUpright: >-
    İşte ya da bir projede Asa Kralı liderliğe, stratejik vizyona ve inisiyatif alma cesaretine işaret edebilir. Net bir hedef tanımlayabilir, onu coşkuyla anlatabilir ve başkalarının güçlü yanlarına güvenerek görev devredebilirsin. Dürüstlük ve tutarlılık, insanların iddialı bir yönü izlerken kendini güvende hissetmesine yardım eder.
  workReversed: >-
    Ters geldiğinde fazla zorluyor, başkalarının senin temponu tutmasını bekliyor ya da yön konusunda kendin emin olamıyor olabilirsin. Vizyonu işin içindeki insanlarla gözden geçirmek için bir adım geri çekilebilirsin. Görüş istemek ve hedefleri ayarlamak bir planı hem daha gerçekçi hem de daha geniş bir destekle kabul görür hâle getirebilir.
  growthUpright: >-
    Kişisel gelişim açısından bu kart, yönünü sahiplenmeye davet eder. Uzun vadede ne inşa etmek istiyorsun ve ona hangi değerler yol gösteriyor? Kısa bir amaç cümlesi yazıp önündeki seçimler için onu bir başvuru noktası olarak kullanabilirsin.
  growthReversed: >-
    Ters geldiğinde kontrol ve sabırla ilişkini keşfedebilirsin. Her zaman yönetimde olman gerektiğini mi hissediyorsun, yoksa fazla geldiği için liderlikten mi kaçıyorsun? Kendi hayatına özgüven ve esneklikle yön verdiğin bir orta yol bulmak istikrarlı bir güç biçimi olabilir.
