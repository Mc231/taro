shortUpright: >-
  Kalıcı olmak üzere kurulmuş bir şey görünür hâle geliyor olabilir. Seni daha büyük bir şeyin parçası gibi hissettiren kökleri, gelenekleri ve insanları fark et.
shortReversed: >-
  Eski yapılar ya da beklentiler ağır hissettirebilir. Hangi gelenekleri koruyup hangilerini kendin için yeniden şekillendireceğini düşünebilirsin.
meaningUpright: |-
  Tılsım Onlusu takımın tek bir tohumdan koca bir haneye uzanan yolculuğunu tamamlar. Geleneksel sahnesi pek çok kuşağı tek bir yerde toplar; ortamın içine bir ev, bir kemer, hayvanlar ve sikkeler işlenmiştir. Tek bir anın ötesinde süren temellerden söz eder: aidiyet, ortak bir geçmiş ve bir yeri yuva gibi hissettiren uzun soluklu özen.
  Bunu bir aile buluşmasında, çevrende büyümüş seçilmiş bir ailede ya da toplulukta, kuşaktan kuşağa aktarılan geleneklerde ya da gündelik emeklerinin bu yılın ötesinde de önemli olabilecek bir şeye katkıda bulunduğu duygusunda tanıyabilirsin. Buradaki miras yalnızca servetle ilgili değildir. Hikâyeleri, değerleri, tarifleri, becerileri ve bir arada olma biçimlerini de kapsar.
  Kart, neyi miras aldığın ve neyi aktarmayı umduğun üzerine düşünmeye davet eder. Hangi köklerin seni beslediğini, nasıl bir temel inşa ettiğini ve zamanını kalıcı hissettiren ilişkilere ve pratiklere nasıl ayırabileceğini sorabilirsin.
meaningReversed: |-
  Ters geldiğinde Tılsım Onlusu seni çevreleyen yapıların içindeki gerginliği yansıtabilir: ağır gelen aile beklentileri, artık uymayan gelenekler ya da ortak kaynaklar ve sorumluluklar hakkındaki anlaşmazlıklar. Dayandığın temellerin göründüğünden daha az sağlam olduğu hissine de işaret edebilir.
  Bu çoğu zaman reddetmekten çok yeniden gözden geçirmeye bir davettir. Pratik ya da duygusal mirasının hangi kısımlarını ileri taşıyacağına sen karar verirsin.
  Göre yaşadığın ama hiçbir zaman gerçekten senin olmayan bir beklentiye ad verebilirsin. Köklerini onurlandırırken yuvayı kendi koşullarında şekillendirmek nasıl görünürdü? Roller ve planlar üzerine açık ve nazik konuşmalar önemli olanı güçlendirmeye ve önemli olmayanı nazikçe gevşetmeye yardım edebilir.
aspects:
  relationshipsUpright: >-
    İlişkilerde bu kart derin bir aidiyeti yansıtabilir: sana bir süreklilik duygusu veren aile, seçilmiş aile ya da uzun dostluk bağları. Çevreni bir arada tutan gelenekleri ve ortak hikâyeleri fark edip belki yeni bir ritüel başlatarak ya da eskisini koruyarak onları nasıl besleyebileceğini düşünebilirsin.
  relationshipsReversed: >-
    Ters geldiğinde kart aile rolleri, yükümlülükler ya da kuşaklar arasındaki farklı değerler çevresindeki zorlanmaya işaret edebilir. Hangi beklentileri karşılamak, hangilerini yeniden konuşmak istediğini düşünebilirsin. Özenli bir sınır koymak bazen bir ilişkiye zarar vermek yerine onu koruyabilir.
  workUpright: >-
    İşte Tılsım Onlusu uzun vadeli değeri olan bir şey inşa etmeyi düşündürebilir: bir kurum, bir eser bütünü ya da başkalarını destekleyen bir rol. Emeğinin bırakacağı mirası düşünebilirsin: başkalarının üzerine inşa edebileceği neye katkıda bulunduğunu ve bunu nasıl belgeleyip paylaşabileceğini.
  workReversed: >-
    Burada kart miras kalan bir yolu izleme baskısını, değerlerinle uyumsuz bir iş yeri kültürünü ya da dayandığın bir yapıdaki istikrarsızlığı yansıtabilir. İşinin nasıl bir temele dayanmasını istediğini ve hangi küçük değişikliklerin seni ona yaklaştırabileceğini düşünebilirsin.
  growthUpright: >-
    Kişisel gelişim açısından bu kart köklerini keşfetmeye davet eder: seni şekillendiren değerleri, alışkanlıkları ve hikâyeleri. Minnet duyduğun birkaçını yazıp onları nasıl ileri taşımak istediğini düşünebilirsin. Gelişim hem nereden geldiğini onurlandırmak hem de neyi aktaracağına karar vermek anlamına gelebilir.
  growthReversed: >-
    Ters geldiğinde kart seçmeden miras alınmış örüntüleri ya da hiçbir yere tam ait olmama hissini yansıtabilir. Hâlâ izlediğin bir aile ya da kültür senaryosunu nazikçe inceleyebilirsin. Onu açıkça tanımak, seni besleyeni koruyup beslemeyeni yeniden yazman için sana alan açabilir.
