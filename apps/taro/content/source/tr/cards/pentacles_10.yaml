imageryNote: >-
  Görsel, bir eve ya da avluya açılan bir kemerin altında farklı yaşlardan insanları toplayabilir; kenarda hayvanlar dinlenir ve on sikke sahne boyunca bir desen hâlinde dizilir. Kemer özel ile ortak hayat arasındaki bir eşiği, yaşların karışımı sürekliliği, desenli sikkeler ise zaman içinde kurulmuş bir yapıyı simgeleyebilir. Sıcak ve yerleşik renkler aidiyeti düşündürürken kalabalık kompozisyon her hanenin içindeki karmaşıklığı ima eder.
