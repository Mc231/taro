shortUpright: >-
  Sıcak ve özgüvenli bir enerji senin için hazır; yer kaplamana ve ışığını başkalarıyla paylaşmana izin verebilirsin.
shortReversed: >-
  İçindeki ateş titreşiyor ya da fazla gerilmiş olabilir; özgüvenini neyin tükettiğine ve neyin yenilediğine bakabilirsin.
meaningUpright: |-
  Asa Kraliçesi, istikrar kazanmış ve ışıl ışıl parlayan ateşi temsil eder. Parıldayan bir ocağın yanında rahatça oturan, elinde yapraklanan bir asa tutan bu figür hiçbir şeyi kanıtlamaya ihtiyaç duymadan özgüvenlidir. Buradaki enerji sıcak, çekici ve cömerttir: bir odayı aydınlatabilen ve yine de kendi merkezini koruyabilen biri.
  Bu niteliği kendinde, rahatça söz aldığında, insanları içten bir sıcaklıkla ağırladığında ya da yaratıcı bir projeyi hem tutku hem de pratiklikle sürdürdüğünde tanıyabilirsin. Hayatında özgüveniyle başkalarını da parlamaya cesaretlendiren birini de anlatabilir.
  Bu kart, yeteneklerini sahiplenmeye davet eder. Özgüven gürültülü olmak zorunda değildir; sunmaya değer bir şeyin olduğuna dair sakin bir his olabilir. Nerede geri çekilme eğiliminde olduğunu fark edip biraz daha fazla yer kaplamayı deneyebilirsin. Sıcaklığını, coşkunu ve fikirlerini paylaşmak hem senin hem de çevrendeki insanlar için bir armağan olabilir.
meaningReversed: |-
  Ters geldiğinde Asa Kraliçesi sönükleşmiş bir alevi yansıtabilir. Kendinden şüphe ediyor, enerjiyi hep getiren kişi olmaktan yorulmuş ya da dikkat çekmemek için canlılığını geri tutuyor olabilirsin.
  Bazen ters gelen Kraliçe, ateşin daha az cömert biçimlerde kullanılmasına işaret eder: kıyaslama, kıskançlık ya da ilgi odağını kontrol etme ihtiyacı. Bunlar çoğu zaman görülmediğini hissetmekten doğar.
  Kendi ateşine özen göstermenin zamanı olabilir. Özgüvenini ne tüketiyor ve eskiden onu ne yeniliyordu? Seni canlı hissettiren bir etkinliğe dönebilir, seni takdir eden insanlarla vakit geçirebilir ya da suçluluk duymadan dinlenebilirsin. Özgüven çoğu zaman nasıl göründüğünle değil, önemsediğin şeylerle yeniden bağ kurdukça yavaş yavaş geri gelir.
aspects:
  relationshipsUpright: >-
    İlişkilerde bu kart, bir bağın içinde sıcaklığı, açıklığı ve güçlü bir benlik duygusunu yansıtabilir. Kendi ihtiyaçlarına sadık kalırken önemsediğin insanlara enerji ve cesaret getirebilirsin. Bu nitelik ilişkileri canlı ve dürüst kılabilir; her bir kişinin parlamakta özgür olduğu ilişkiler.
  relationshipsReversed: >-
    Ters geldiğinde gölgede kalmış, olağan sayılmış ya da kendini başkalarıyla kıyaslamaya meyilli hissedebilirsin. Karşılığını almadan sıcaklık verip vermediğini düşünebilirsin. Neye ihtiyaç duyduğunu dile getirmek ve başkalarını beklemeden önce kendini takdir etmek, yakın bir bağda dengeyi yeniden kurmaya yardım edebilir.
  workUpright: >-
    İşte ya da yaratıcı çalışmalarda Asa Kraliçesi özgüvenli bir liderliğe ve başkalarına ilham verme yeteneğine işaret edebilir. Bir projeyi görünür bir şekilde sahiplenebilir, fikirlerini inançla paylaşabilir ve iş arkadaşlarının enerji dolu hissettiği bir ortam yaratabilirsin. Coşkun yalnızca bir ruh hâli değil, pratik bir kaynak olabilir.
  workReversed: >-
    Ters geldiğinde çok fazla role yayılmış olabilir ya da bir aksilikten sonra yeteneklerinden şüphe ediyor olabilirsin. Güçlü yanlarını gerçekten kullanan görevleri belirleyip onlar için zaman ayırabilirsin. Aynı anda her yerde olma ihtiyacından geri adım atmak doğal özgüveninin geri dönmesine yardım edebilir.
  growthUpright: >-
    Sıcaklığının başkaları üzerinde bir etkisi var ve bu kart onu sahiplenmeni istiyor. Seni en çok ne canlı ve kendinden emin hissettiriyor? Kendini özgüvenli hissettiğin ortamları fark edip o enerjinin bir kısmını genellikle geri durduğun alanlara taşıyabilirsin.
  growthReversed: >-
    Ters geldiğinde kendinden şüphenin ya da kıyaslamanın düşüncelerinde nerede yer kapladığını keşfedebilirsin. Kendi ilerlemeni ve niteliklerini başka birininkiyle ölçmeden fark etmek yardımcı olabilir. Dinlenmek ve oyun, ikisi de azalmış bir ateşi yeniden yakmanın yollarıdır.
reflectionQuestions:
