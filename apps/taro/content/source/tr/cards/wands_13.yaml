  - >-
    Kimin sıcaklığı seni cesaretlendiriyor ve o sıcaklığı başka birine nasıl sunabilirsin?
  - >-
    Bu hafta biraz daha fazla yer kaplamanın bir yolu ne olabilir?
imageryNote: >-
  Bir figür, güneşli bir açıklığa yerleştirilmiş geniş bir koltukta rahatça oturur; bir elinde yapraklanan bir asa durur, diğer eli izleyiciye doğru açıktır. Yanında bir ocak ateşi parıldar ve yakınında tetikte bir hayvan dostu uzanır. Ocak başkalarına sunulan sıcaklığı, açık el cömertliği, rahat duruş ise kendini kanıtlamaya ihtiyaç duymayan bir özgüveni çağrıştırır. Sıcak altın ve kehribar tonları en durulmuş ve parlak hâlindeki ateşi yankılayabilir.
