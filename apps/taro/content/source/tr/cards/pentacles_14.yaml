imageryNote: >-
  Görsel, boğa motifleriyle oyulmuş bir tahtta oturan, üzüm asmaları ve duvarlarla çevrili bir bahçeyle kuşatılmış, bir elinde rahatça bir sikke tutan taçlı bir figürü gösterebilir. Boğa dayanıklılığı ve dünyevi gücü, asmalar olgunluğu ve bolluğu, duvarlar ise korunan ve iyi bakılan bir alanı simgeleyebilir. Rahat duruş deneyime dayanan bir otoriteyi düşündürür; koyu yeşiller ve altın tonları ise kalıcı ve sabırlı bir sağlayışı yansıtabilir.
