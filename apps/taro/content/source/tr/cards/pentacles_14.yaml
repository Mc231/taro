shortUpright: >-
  İstikrarlı ve yetkin bir varlık senin için hazır. Deneyimini ve kaynaklarını kendin ve başkaları için istikrar yaratmakta nasıl kullanabileceğini fark et.
shortReversed: >-
  Güvenlik taşınması ağır bir yüke dönüşmüş olabilir. Kontrolün ya da görünüşün ötesinde başarının senin için ne anlama geldiğini sorabilirsin.
meaningUpright: |-
  Tılsım Kralı asmalar ve sağlam duvarlarla çevrili, rahat ve güvende oturur; bir sikke dizinin üzerinde durur. Bu kral toprak takımının tam olgunluğunu temsil eder: pratik ustalık, sabır ve başkalarının güvenebileceği istikrarlı bir şey kurabilme yeteneği. Buradaki otorite güçten değil deneyimden gelir.
  Bu enerjiyi bir haneyi ya da ekibi sakince yöneten, zaman ve kaynaklar hakkında düşünceli kararlar veren ya da kurduğu şeyi çevresindeki insanları desteklemek için kullanan birinde tanıyabilirsin. Pratik sorumlulukları iyi idare etme konusunda kendinde büyüyen özgüveni de yansıtabilir.
  Bu kart, istikrar ve sağlayışla ilişkini düşünmeye davet eder. İstikrarlı bir çabayla ne kurdun ve onu nasıl kullanıyorsun? Zamanınla, bilginle ya da desteğinle nerede cömert olabileceğini ve iyi bir emanetçiliğin nerede sahip olduğunu korumak anlamına geldiğini fark edebilirsin. Güvenlik yalnızca korunacak değil, paylaşılabilecek bir şey de olabilir.
meaningReversed: |-
  Ters geldiğinde Tılsım Kralı güvenlikle katılaşmış ya da ağırlaşmış bir ilişkiyi yansıtabilir. Kontrol sıkılaşabilir ve planlar başkalarının görüşlerine yer bırakmayabilir ya da başarı çoğunlukla görünüşle ve sahip olunanlarla ölçülebilir. Herkesin istikrarından sorumlu hissetmenin baskısına da işaret edebilir.
  Bu çerçeve fazlasıyla abartılmış bir nitelikle ilgilidir. Güvenilir ve yetkin olmak değerlidir; dinlenmeye, esnekliğe ya da başka insanların seçimlerine yer bırakmadığında bir yüke dönüşür.
  İşlerin nasıl göründüğünün ötesinde başarının senin için gerçekte ne anlama geldiğini sorabilirsin. Sorumluluğu nerede paylaşabilir ya da bir ölçütü gevşetebilirsin? Özen, güvenlik ve katkı duygusu gibi emeğinin ardındaki değerlerle yeniden bağ kurmak istikrarın kısıtlayıcı değil yeniden destekleyici hissettirmesini sağlayabilir.
aspects:
  relationshipsUpright: >-
    İlişkilerde bu kart güvenilir ve cömert bir özeni yansıtabilir: istikrar sağlayan, taahhütlerini tutan ve başkalarını güvende hissettiren biri. Biri için bu istikrarlı varlık sen olabilirsin ya da bunu onda takdir edebilirsin. Güvenilirliğin yanında kararları paylaşmak ve sıcaklığı ifade etmek bu güvenliği karşılıklı hissettirebilir.
  relationshipsReversed: >-
    Ters geldiğinde kart başkalarına pek yer bırakmayan bir kontrolü ya da duygusal bağı gölgede bırakan pratik sağlayışa yapılan bir vurguyu düşündürebilir. Sana yakın birinin desteğini nasıl deneyimlediğini ve bu bağda daha fazla söz hakkı ya da daha fazla şefkat isteyip istemediğini sorabilirsin.
  workUpright: >-
    İşte Tılsım Kralı pratik bir liderliği ve güvenilirliği anlatabilir. Kaynakları yönetmek, başkalarına yol göstermek ya da ayakları yere basan kararlar vermek konusunda sana güveniliyor olabilir. Deneyimini cömertçe nasıl kullanabileceğini, başkalarına mentorluk yapabileceğini ve sonuçlar kadar insanları da destekleyen yapılar kurabileceğini düşünebilirsin.
  workReversed: >-
    Burada kart esneksizliği, her şeyi en ince ayrıntısına kadar yönetmeyi ya da anlamlı işten çok statüye değer vermeyi yansıtabilir. Fazla sorumluluğu tek başına taşımaya da işaret edebilir. Görev devretmenin, daha çok dinlemenin ya da başarıyı yeniden tanımlamanın nerede daha sağlıklı ve sürdürülebilir bir çalışma biçimi yaratabileceğine bakabilirsin.
  growthUpright: >-
    Kişisel gelişim açısından bu kart geliştirdiğin olgunluğu ve yetkinliği tanımaya davet eder. İstikrarın senin için ne anlama geldiğini ve onu nasıl yarattığını düşünebilirsin. Kendin ve başkaları için sağlama kapasiteni kabul etmek kendine güvenini derinleştirebilir.
  growthReversed: >-
    Ters geldiğinde kart kontrole ya da başarının dış göstergelerine güçlü bir bağlılığı yansıtabilir. Tutuşunu gevşetirsen ne olacağından korktuğunu keşfedebilirsin. Güvenliği yalnızca sahip olduğun ya da yönettiğin şeylerde değil, değerlerinde ve ilişkilerinde bulmak daha fazla rahatlık getirebilir.
