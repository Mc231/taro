shortReversed: >-
  Hevesli düşünceler pek çok yöne dağılıyor olabilir; konuşmak yerine dinlemenin nerede daha iyi olacağını fark edebilirsin.
meaningUpright: |-
  Kılıç Prensi dünyayla karşılaşan genç ve hızlı bir zihindir. Rüzgârlı bir tepede kılıcını havaya kaldırmış duran Prens her şeyi izler; öğrenmeye, sorgulamaya ve fikirleri sınamaya heveslidir. Bu kart uzmanlıktan önceki merakla, yeni bir şeyi anlamanın heyecan verici başlangıcıyla ilgilidir.
  Bu kartı bir konuyu akşamın geç saatlerine kadar araştırma isteğinde, kimsenin sormadığı soruyu sormakta ya da düşünceni genişleten bir kursa, tartışmaya veya projeye başlamanın enerjisinde tanıyabilirsin. Bir görüşe bağlanmadan önce bilgi toplayan uyanık ve dikkatli bir hâli de yansıtabilir.
  Bu kart öğrenen olmanın tadını çıkarmaya davet eder. Tüm cevaplara sahip olman gerekmez; şimdilik iyi sorular sormak yeterli olabilir. Keşfettiklerini nasıl paylaştığını da fark edebilirsin. Fikirlere duyulan coşku dinlemeyle eşleştiğinde iyi karşılanır. Hangi konu ya da soru dikkatini çekiyor ve onu hem cesaretle hem alçakgönüllülükle nasıl keşfedebilirsin?
meaningReversed: |-
  Ters geldiğinde Kılıç Prensi yönünü kaybetmiş bir merakı yansıtabilir. Fikirler senin izleyebileceğinden daha hızlı dağılabilir ya da pek çok şeye başlayıp hiçbirini bitirmeyebilirsin. Zihinsel enerji yüksektir ama odak zayıftır.
  Bir başka okuma, sözlerin düşünceden hızlı ilerlemesidir: dinlemeden konuşmak, doğrulanmamış bir şeyi aktarmak ya da bir fikir sorgulandığında savunmaya geçmek. Özensiz bir keskinlik konuşmaları gerektiğinden zor hâle getirebilir.
  Bu kart düşüncelerinin temposunu biraz yavaşlatmaya davet eder. Şimdilik izleyeceğin bir ipliği seçip diğerlerinin beklemesine izin verebilirsin. Bir görüşü paylaşmadan önce bir soru daha sorabilirsin. Konuşmaya hevesli olduğun kadar dinlemeye de hevesli olsaydın ne öğrenebilirdin?
aspects:
  relationshipsUpright: >-
    İlişkilerde Kılıç Prensi canlı sohbetlere, birinin iç dünyasına duyulan merağa ya da bir durumu tam olarak anlama isteğine işaret edebilir. Merak ettiğin soruları şüpheyle değil gerçek bir ilgiyle sorabilirsin. İyi bir dinleyici olmak, sözcüklerde hızlı olmak kadar bu kartın bir parçasıdır.
  relationshipsReversed: >-
    Ters geldiğinde bu kart özensiz sözleri, aktarılan sırları ya da bağ kurmak yerine tartışma alışkanlığını yansıtabilir. Merakın meraklılığa ya da savunmacılığa dönüşüp dönüşmediğini fark edebilirsin. Sözlerinin nasıl karşılanabileceğini düşünmek için durmak güveni koruyabilir. Aceleyle söylenmiş bir söz için basit bir özür çok şey değiştirebilir.
  workUpright: >-
    İşte Kılıç Prensi bir öğrenme dönemini yansıtabilir: yeni bir beceri, taze bir araştırma ya da hızlı düşünmeni isteyen bir rol. Anlayışını genişleten görevlere gönüllü olabilir ve iş arkadaşlarından bildiklerini açıklamalarını isteyebilirsin. Not almak ve varsayımları sınamak ilk coşkuyu sağlam bir bilgiye dönüştürebilir.
  workReversed: >-
    Ters geldiğinde bu kart dağınık bir dikkati düşündürebilir: görevler arasında atlamak, yarım şekillenmiş fikirleri çok erken paylaşmak ya da eleştiriye hızlı tepki vermek. Daha fazlasını eklemeden önce derinleştireceğin bir öncelik seçebilirsin. Bilgileri sunmadan önce kontrol etmek ve sakin bir şekilde geri bildirim istemek fikirlerini daha güçlü ve daha güvenilir kılabilir.
  growthUpright: >-
    Kişisel gelişim açısından Kılıç Prensi bir acemi zihni yetiştirmeye davet eder. Hakkında pek az şey bildiğin bir konuyu seçip etkileyici olma ihtiyacı duymadan meraklı olmana izin verebilirsin. Neden diye sormak, geniş okumak ve kendi varsayımlarını fark etmek düşünceni taze ve esnek tutabilir.
  growthReversed: >-
    Ters geldiğinde bu kart bir yere konmadan atlayan huzursuz düşünceleri yansıtabilir. Bir sonrakine başlamadan önce bir fikri bitirmeyi ya da düşünmek yerine savunma isteği duyduğun anları fark etmeyi deneyebilirsin. Kendine yönelen merak, neden böyle tepki verdiğini sormak faydalı bir başlangıç noktası olabilir.
