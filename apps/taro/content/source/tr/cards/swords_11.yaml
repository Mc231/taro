imageryNote: >-
  Özgün çizimde genç bir figür çimenli bir tepenin üzerinde durur; kılıcı havada, bakışları ufka dönüktür. Rüzgâr çimenleri savurur ve küçük bir kuş sürüsünü parlak, bulut çizgili bir gökyüzüne dağıtır. Kaldırılmış kılıç fikirleri sınamaya hazır olmayı, kuşlar hızlı ve fırlayan düşünceleri, yüksek bakış noktası ise her şeyi bir anda görme isteğini ima eder.
