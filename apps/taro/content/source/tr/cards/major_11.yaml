imageryNote: >-
  Taro’nun Adalet kartı, dengeli bir teraziyi kalp hizasında ve gökyüzünü gösteren dik bir kılıcı tutan, sakin ve dik duruşlu bir figür olarak hayal edilir. Figür doğrudan izleyiciye bakar; hiçbir şeyin saklanmadığı bir dürüstlüğü çağrıştırır. Arkadaki iki sade sütun ve düz bir perde sahneyi yalın tutar; sanki dikkatli düşünmeye yer açar. Serin hava mavileri ve tek bir sıcak vurgu, akılla vicdanın buluşmasını yansıtabilir.
