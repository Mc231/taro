imageryNote: >-
  Sekiz asa, altında bir nehir ya da yol bulunan yumuşak bir manzaranın üzerinde, geniş bir gökyüzünü çapraz olarak paralel biçimde uçarak keser. Sahnede hiç insan yoktur, yalnızca hareket vardır. Ortak açı tek bir yöne hizalanmış enerjiyi, açık gökyüzü net bir yolu, aşağıdaki nehir ise olayların istikrarlı akışını çağrıştırır. Figürlerin yokluğu izleyiciyi başkasının hikâyesini izlemek yerine hareketi hissetmeye davet eder.
