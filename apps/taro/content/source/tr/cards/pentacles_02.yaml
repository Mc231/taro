imageryNote: >-
  Görsel, adım atarken iki sikkeyi havada tutan bir figürü gösterebilir; sikkeler sonsuz bir kıvrımla dönen bir kurdele ya da iple birbirine bağlıdır. Arkada dalgalanan su ya da dalgalarda inip kalkan tekneler gündelik hayatın sürekli hareketini yankılayabilir. Döngü süreklilik ve dengenin devam eden doğasını düşündürürken hafif, dans eden duruş ayar yapmanın kolaylıkla, hatta biraz oyunla yapılabileceğini ima eder.
