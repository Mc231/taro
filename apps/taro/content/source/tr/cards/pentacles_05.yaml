shortUpright: >-
  Bir dönem soğuk ya da eksik hissettirebilir. İstemek zor gelse bile yardım bazen göründüğünden daha yakın olabilir.
shortReversed: >-
  Zor bir dönem hafifliyor olabilir. Sıcaklığın ve desteğin sana yeniden nerede ulaşmaya başladığını fark edebilirsin.
meaningUpright: |-
  Tılsım Beşlisi takımın daha sessiz ve daha zor kartlarından biridir. Geleneksel sahnesi, soğuğa ve önlerindeki yola odaklanmış hâlde, ışığı yanan bir pencerenin önünden karda yürüyen insanları gösterir. Kaynakların, aidiyetin ya da enerjinin azaldığı ve herkes içerideyken senin dışarıda kaldığın hissinin oluştuğu zamanlardan söz edebilir.
  Bu, kısıtlı bütçelerle geçen bir dönemi, bir taşınmanın ardından gelen yalnız bir süreyi, bir gruptan dışlanmış hissetmeyi ya da yalnızca uzun bir çaba kışının seni yıpratmasını yansıtabilir. Kart bu duyguları yargılamaz. Onları gerçek ve insani olarak kabul eder.
  Daha yumuşak ipliği pencerededir. Destek hemen yakınında bir yerde olabilir; bir arkadaşta, bir toplum hizmetinde, bir komşuda ya da benzer bir yoldan geçmiş bir grup insanda. Zorluk çoğu zaman onu fark etmekte ya da kapıyı çalmana izin vermektedir. Senin durumunda olan birine nasıl bir yardım sunacağını ve aynı ulaşma iznini kendine de verip veremeyeceğini sorabilirsin.
meaningReversed: |-
  Ters geldiğinde Tılsım Beşlisi zor bir dönemin ardından dengenin yavaşça geri dönüşünü yansıtabilir. Pratik bir yardım, yenilenen bir bağ ya da gündelik hayatı daha az yorucu kılan küçük bir değişiklik yoluyla bir sığınak buluyor olabilirsin. Sıcaklık yavaş yavaş geri gelebilir ve mütevazı olsa bile fark etmeye değer.
  Kart, koşullar düzeldikten sonra da süren bir kaygıya işaret edebilir: kapı açıldıktan sonra bile soğuğa karşı kendini hazırlama alışkanlığı. Bu tetikte olma hâli önceden anlamlıydı. Artık yumuşatabileceğin bir şey olabilir.
  Ne kadar az da olsa neyin değiştiğini gözden geçirip seni taşıyan dayanıklılığı kabul edebilirsin. Biraz daha fazla desteği nerede kabul edebilir ya da hâlâ karda olan birine nerede destek sunabilirsin? Toparlanma çoğu zaman paylaşıldığında derinleşir.
aspects:
  relationshipsUpright: >-
    İlişkilerde bu kart dışarıda kalmış hissetmeyi yansıtabilir: arkadaşlar tarafından göz ardı edilmek, aileden uzak düşmek ya da zor bir dönemde biriyle birlikte zorlanmak. Kusurlu da olsa kimin sana ulaşmaya çalıştığını fark edebilirsin. Güvendiğin bir kişiye neler yaşadığını anlatmak paylaşılan zorluğu paylaşılan bir sıcaklığa dönüştürebilir.
  relationshipsReversed: >-
    Ters geldiğinde kart bir mesafe döneminin ardından yeniden bağ kurmayı ya da başkalarının yardım etmesine izin vermeye hazır olmayı düşündürebilir. Dışlanmış olmaya dair süren bir kırgınlığı da yansıtabilir. Bu duyguyu dürüstçe kabul ederken şu anda yanında olan insanları fark edip onları biraz daha içeri almanın bir yolunu düşünebilirsin.
  workUpright: >-
    İşte Tılsım Beşlisi kısıtlı bir dönemi yansıtabilir: sınırlı kaynaklar, takdir görmediğini hissetmek ya da kararların çemberinin dışında kalmışlık hissi. Bir iş arkadaşı, bir destek ağı ya da bir beceri programı gibi sana açık olan ışığı yanan pencereleri arayabilir ve hangi pratik adımın zorlanmayı hafifleteceğini düşünebilirsin.
  workReversed: >-
    Burada kart koşulların düzelmeye başladığını ya da ihtiyaç duyduğun desteği istemeye istekliliği yansıtabilir. Zor bir dönemin ardından kalan bir temkine de işaret edebilir. Neyin değiştiğini fark edip zor zamanların öğrettiği dersleri korurken planlarının daha sağlam zemini yansıtmasına izin verebilirsin.
  growthUpright: >-
    Kişisel gelişim açısından bu kart kısıtlı ya da yalnız zamanlarda kendine şefkat göstermeye davet eder. Zorlanmak yanlış bir şey yaptığın anlamına gelmez. Yardım istemeyi neyin zorlaştırdığını keşfedebilirsin. Ağır duygular seninle kalıyorsa güvendiğin biriyle ya da yetkin bir uzmanla konuşmak anlamlı bir destek kaynağı olabilir.
  growthReversed: >-
    Ters geldiğinde kart zor bir dönemin ardından büyüyen bir öz güveni yansıtabilir. Bu süreçten geçmene yardım eden küçük rutinleri, insanları ve seçimleri fark edebilirsin. Onlara ad vermek onlara dönmeyi kolaylaştırabilir. Zorlukla kazanılmış bu anlayışın bir kısmını benzer bir kışla karşılaşan başkalarına karşı nezakete nasıl taşıyabileceğini düşün.
reflectionQuestions:
  - >-
    Şu sıralar hayatında bir şey nerede kıt ya da ulaşılmaz hissettiriyor?
  - >-
    Fark etmene izin verdiğinden daha yakın ve yardıma daha istekli kim olabilir?
  - >-
    Bu hafta sıcaklığın ya da desteğin içeri girmesine izin vermenin küçük bir yolu ne?
imageryNote: >-
  Görsel, havaya karşı başlarını eğmiş, bir duvar boyunca karda ya da yağmurda ilerleyen iki figürü gösterebilir; yukarıda deseninin içine beş sikke yerleştirilmiş bir pencere parıldar. Soğuk yol ile ışıklı pencere arasındaki karşıtlık zorlukla birlikte yakındaki sığınağı simgeleyebilir. Pencerenin figürlerin bakış çizgisinin biraz dışında olması, var olan ama henüz fark edilmemiş ya da uzanılmamış bir desteği düşündürür.
