imageryNote: >-
  Görselin merkezinde, bir elinde dengeli bir terazi tutarken diğer eliyle yakındaki insanlara sikke sunan ayakta bir figür olabilir. Altı sikke sahnenin çevresine yerleştirilebilir; bazıları ellerde, bazıları aralarındaki havada. Terazi hakkaniyeti ve düşünceliliği, uzanan el cömertliği, figürlerin farklı konumları ise her alışverişin içinde sessizce durabilen güç sorusunu simgeleyebilir.
