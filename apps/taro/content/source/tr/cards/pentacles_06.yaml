shortUpright: >-
  Kaynaklar, zaman ve özen insanlar arasında dolaşıyor. Nasıl verdiğini, nasıl aldığını ve herkese neyin adil geldiğini fark et.
shortReversed: >-
  Bir alışveriş dengesiz hissettirebilir. Neyin verildiğine, karşılığında neyin beklendiğine ve neyin daha dengeli hissettireceğine bakabilirsin.
meaningUpright: |-
  Tılsım Altılısı, elinde terazi tutarken başkalarıyla sikkelerini paylaşan bir figürü gösterir. İnsanlar arasındaki kaynak akışı üzerine bir karttır: evet, para ama aynı zamanda zaman, dikkat, öğüt, sabır ve pratik yardım. Terazi hakkaniyete gösterilen özeni, açık el ise paylaşmaya istekliliği düşündürür.
  Şu anda verebilecek konumda olabilirsin; bir arkadaşına yardım teklif etmek, birine mentorluk yapmak ya da senin için önemli bir davayı desteklemek gibi. Ya da alan tarafta olabilirsin; bir iyiliği, bir yardım elini ya da ikinci bir şansı kabul etmek gibi. İki rolün de kendine özgü bir inceliği vardır ve çoğumuz zaman içinde ikisi arasında gidip geliriz.
  Bu kart, alışverişlerinin ruhu üzerine düşünmeye davet eder. Vermen özgürce mi geliyor, yoksa sessiz beklentilerle mi? Kendini küçük hissetmeden alabiliyor musun? Cömertliğin nerede gerçek bir bağ yarattığını ve biraz daha fazla denge ya da dürüstlüğün nerede işin içindeki herkesin saygı gördüğünü hissetmesini sağlayacağını fark edebilirsin.
meaningReversed: |-
  Ters geldiğinde Tılsım Altılısı dengesizleşmiş bir alışverişe işaret edebilir. Bir kişi aldığından çok daha fazlasını veriyor olabilir ya da yardım söylenmemiş şartlarla gelebilir: beklenen bir minnet, etkilenen seçimler, bir borçluluk hissi. Hiç alamamayı, sanki yardımı kabul etmek itibar kaybetmek anlamına geliyormuş gibi bir zorluğu da yansıtabilir.
  Bu, suçlamadan teraziyi yeniden gözden geçirmeye bir davettir. Dengesizlik çoğu zaman niyetle değil alışkanlıkla, sessizce büyür.
  Vermenin ve almanın dengesiz hissettirdiği bir ilişkiye ya da düzenlemeye bakabilirsin. Verdiğin ve tüketici hâle gelmiş bir şey var mı? Geri çevirdiğin bir destek var mı? Beklentileri açıkça adlandırmak ya da ne kadar sunduğunu ayarlamak, iki taraf için de adil ve özgürce seçilmiş hissettiren bir alışverişi yeniden kurabilir.
aspects:
  relationshipsUpright: >-
    İlişkilerde bu kart cömert ve karşılıklı bir özeni yansıtabilir: herhangi bir günde eşit olmasa bile zaman içinde iki yönde akan destek. Özeni pratik yollarla nasıl gösterdiğini ve başkalarının sana özen göstermesine nasıl izin verdiğini fark edebilirsin. Birine verdiği şey için özellikle teşekkür etmek bu akışı sıcak ve görünür tutabilir.
  relationshipsReversed: >-
    Ters geldiğinde kart bir kişinin daha fazla verdiğini hissettiği ya da yardımın bir yükümlülük taşıdığı bir bağı düşündürebilir. Hesap tutmadan dengenin sana nasıl hissettirdiğini nazikçe dile getirebilirsin. Bazen en şefkatli değişiklik neye ihtiyaç duyduğunu istemek ya da birinin hemen karşılığını ödemekte ısrar etmeden yardım teklif etmesine izin vermektir.
  workUpright: >-
    İşte bu kart bilgiyi paylaşmayı, mentorluğu, adil takdiri ya da iş birliğine dayalı desteği anlatabilir. Biri için bir kapı açabilecek ya da yol göstermeyi incelikle kabul edebilecek konumda olabilirsin. Çevrende kaynakların ve övgünün nasıl paylaşıldığını ve daha adil bir akışa nasıl katkıda bulunabileceğini fark etmeye davet eder.
  workReversed: >-
    Burada kart takdir görmeyen bir emeği, baskı yaratan iyilikleri ya da neyin borçlu olunduğuna dair belirsiz beklentileri yansıtabilir. Anlaşmaları netleştirebilir, katkıların hakkında sesini yükseltebilir ya da varsayılan olarak nerede fazladan emek verdiğini fark edebilirsin. İşteki adil alışveriş çoğu zaman görünmeyeni görünür kılmakla başlar.
  growthUpright: >-
    Kişisel gelişim açısından Tılsım Altılısı, kendi cömertlik ilişkini keşfetmeye davet eder. Vermek nerede keyifli hissettiriyor? Almak nerede rahat geliyor? Bu hafta küçük bir cömertlik eylemi ve bir alma eylemi deneyip her birinin sende neyi uyandırdığını fark edebilirsin.
  growthReversed: >-
    Ters geldiğinde kart değerli hissetmenin bir yolu olarak vermeyi ya da kontrolü elde tutmak için yardımı reddetmeyi yansıtabilir. Bu örüntülerin nerede başladığını ve hâlâ sana uyup uymadığını keşfedebilirsin. Terazinin iki tarafında da olmana izin vermek öz saygıyı ve güveni derinleştirebilir.
reflectionQuestions:
  - >-
    En özgürce nerede verme eğilimindesin ve nerede geri duruyorsun?
  - >-
    Hayatındaki hangi alışveriş dengesiz hissettiriyor ve onu ne daha adil hissettirirdi?
  - >-
