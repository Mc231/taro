imageryNote: >-
  Görselin merkezinde, işlenmiş topraklara karşı açık bir elle uzatılan tek bir sikke ya da disk olabilir: bir bahçe kapısı, alçak çitler, tepelere uzanan bir patika. Sikke somut ve mümkün olan bir şeyi temsil ederken kapı hâlâ özen isteyen bir alana açılan bir eşiği düşündürür. Soluk yeşiller ve sıcak toprak tonları sabrı, büyümeyi ve elle tutulabilen şeyin sessiz değerini vurgulayabilir.
