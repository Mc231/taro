imageryNote: >-
  Görsel, bir kemer, bir tezgâh ya da yükseltilmiş bir çerçeve gibi bitmemiş bir yapının çevresinde, her biri farklı bir işle uğraşan üç figürü yerleştirebilir. Biri planı tutar, biri malzemeyi işler, biri dengeler ya da değerlendirir. Yapının içine işlenmiş üç sikke, değerin iş birliğiyle yaratıldığını düşündürebilir. Yapının çevresindeki iskele, aletler ve açık alan işin hâlâ sürdüğünü ve geliştirmeye açık olduğunu ima eder.
