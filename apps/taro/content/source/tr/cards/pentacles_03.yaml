shortUpright: >-
  İyi işler çoğu zaman insanlar arasında büyür. Farklı becerilerin önemsediğin bir şeyde nasıl bir araya gelebileceğini fark et.
shortReversed: >-
  Ortak bir çaba farklı yönlere çekiliyor olabilir. Rolleri, planları ve birbirinizi nasıl dinlediğinizi yeniden gözden geçirmek yardımcı olabilir.
meaningUpright: |-
  Tılsım Üçlüsü başkalarıyla birlikte inşa etmenin kartıdır. Bir yapıya yerleştirilmiş üç sikke, hiçbir kişinin tek başına şekillendiremeyeceği bir işi düşündürür: biri tasarımı getirir, biri malzemeyi, bir başkası sağlam elleri. Öne çıkan şey rütbe değil, her birinin katkısına duyulan saygıdır.
  Gündelik hayatta bu, sonunda yerine oturan bir ekip projesi, bir şeyi onarmana yardım eden bir komşu, bir çalışma grubu ya da geri bildirimiyle becerini keskinleştiren bir mentor olarak ortaya çıkabilir. Kendi payın için takdir görmenin ve başkalarını kendi payları için takdir etmenin doyumunu da yansıtabilir.
  Bu kart, iş birliğinin işini tek başına başarabileceğinin ötesine nerede taşıyabileceğini düşünmeye davet eder. Kimin uzmanlığının seninkini tamamladığını, bir planı nasıl açıkça paylaşabileceğini ve görüşleri nasıl karşıladığını sorabilirsin. Zanaat, insanlar aynı plana bakıp onu birlikte geliştirmeye istekli olduğunda derinleşir.
meaningReversed: |-
  Ters geldiğinde Tılsım Üçlüsü ortak planını kaybetmiş bir ortak çabaya işaret edebilir. İnsanlar çok çalışıyor ama biraz farklı resimlere doğru ilerliyor olabilir ya da roller belirsiz olabilir; öyle ki bazı görevler iki kez yapılır, bazıları ise arada kaybolur. Belki istemek daha yavaş ya da daha az güvenli geldiği için her şeyi tek başına yapma eğilimini de yansıtabilir.
  Bu, suç aramak yerine planı yeniden gözden geçirmeye bir davettir. Uyumsuzluk yaygındır ve onu erken adlandırmak genellikle devam etmekten daha az maliyetlidir.
  Hedefler ve kimin ne yapacağı üzerine kısa bir konuşma önerebilir ya da planı herkesin görebileceği bir yere yazabilirsin. Yalnız çalışma eğilimindeysen devredebileceğin bir parçayı düşünüp başka biri becerisini seninkine eklediğinde neyin değiştiğini fark edebilirsin.
aspects:
  relationshipsUpright: >-
    Yakın bağlarda bu kart gündelik hayattaki ekip çalışmasını yansıtabilir: birlikte bir taşınmayı planlamak, ev işlerini paylaşmak, birbirinizin projelerini desteklemek. Güçlü yanlarınızın nasıl farklılaştığını ve bunun sürtüşme yerine nasıl bir armağan olabileceğini fark edebilirsin. Birinin katkısında neyi takdir ettiğini yüksek sesle söylemek birlikte kurduğunuz temeli güçlendirebilir.
  relationshipsReversed: >-
    Ters geldiğinde kart seninle yakın birinin aynı hedefin farklı resimlerine doğru çalıştığını ya da pratik yükün daha fazlasını bir kişinin taşıdığını düşündürebilir. Hesap tutmak yerine oturup beklentileri karşılaştırabilirsiniz. Kimin neyle ilgileneceğini netleştirmek gerginliği hafifletebilir ve her birinizin görüldüğünü hissetmesine yardım edebilir.
  workUpright: >-
    İşte bu kart iş birliğini ve zanaatı öne çıkarır. Açık iletişimin ve karşılıklı saygının herkesin becerisini göstermesine izin verdiği bir projeyi yansıtabilir. Geri bildirim istemek, bilgini paylaşmak ya da yetenekleri birbirine uyan insanları bir araya getirmek için fırsatlar arayabilirsin. Plan paylaşıldığında kalite çoğu zaman yükselir.
  workReversed: >-
    Burada kart belirsiz rollere, karışan iletişime ya da farklı yönlere çeken bir ekibe işaret edebilir. Başka gözlerden fayda görecek bir şey üzerinde tek başına çalışmayı da yansıtabilir. Hedefler ve sorumluluklar üzerine kısa bir uzlaşma önerebilir ya da daha ileri gitmeden önce bir iş arkadaşını yaklaşımını gözden geçirmeye davet edebilirsin.
  growthUpright: >-
    Kişisel gelişim açısından Tılsım Üçlüsü başkalarıyla birlikte ve onlardan öğrenmeye davet edebilir. Bir öğretmen, bir atölye, bir çalışma arkadaşı ya da çevrimiçi bir topluluk bir beceriyi inceltmene yardım edebilir. Daha fazlasını bilen insanlar arasında acemi olmanın nasıl hissettirdiğini ve karşılığında sunabileceğin ne kadar çok şey olduğunu fark edebilirsin.
  growthReversed: >-
    Ters geldiğinde kart hâlâ öğrenirken görülme isteksizliğini ya da geri bildirimi geçiştirme alışkanlığını yansıtabilir. Görüşleri kabul etmeyi neyin zorlaştırdığını keşfedebilirsin. Bitmemiş bir işi göstereceğin güvenilir bir kişi seçmek öğrenmeyi yalnız bir sınav olmaktan çıkarıp ortak bir sürece dönüştürebilir.
