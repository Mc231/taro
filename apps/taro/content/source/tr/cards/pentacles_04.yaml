imageryNote: >-
  Görsel, bir sikkeyi göğsüne bastırmış oturan bir figürü gösterebilir; diğer sikkeler ayaklarının altında durur ve başının üzerinde dengelenir, arkada ise uzakta bir kasaba yer alır. Kapalı duruş korumayı ve kendi içine kapanmayı, uzaktaki binalar ise çemberin dışında tutulan bir dünyayı düşündürebilir. Sağlam, köşeli biçimler ve kapalı bir siluet istikrarı vurgulayabilir; bu istikrarın neye mal olduğu sorusuyla birlikte.
