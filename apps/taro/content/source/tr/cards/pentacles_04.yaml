shortUpright: >-
  Bir şeyi güvende tutmak için kendine yakın tutuyor olabilirsin. Bu korumanın seni nerede dengelediğini ve nerede kısıtlamaya başladığını fark et.
shortReversed: >-
  Sıkı bir tutuş gevşiyor ya da gevşemeyi istiyor olabilir. Kendini güvensiz hissetmeden neyin akmasına izin verebileceğini keşfedebilirsin.
meaningUpright: |-
  Tılsım Dörtlüsü sikkelerini kendine yakın tutan birini gösterir: biri göğsüne bastırılmış, diğerleri ayaklarının altında ya da başının üzerinde sıkıca tutulmuş. Güvenlik ve sahip olduğunu koruma dürtüsü üzerine bir karttır; bu para, zaman, enerji, alan ya da duygular olabilir.
  Bunda bir bilgelik vardır. Belirsiz bir dönemin ardından sağlam bir tutuş korumak makul bir seçim olabilir. Bunu enerjinin bir kısmını kendine saklamakta, seni sakin tutan bir rutini korumakta ya da hafta sonlarının çevresine bir sınır koymakta tanıyabilirsin.
  Yine de aynı duruş katılaşabilir. Fazla uzun süre sıkıca kavrayan bir el yeni bir şey alamaz. Kart, bir şeyi önemli olduğu için tutmakla bırakmak korkutucu geldiği için tutmak arasındaki farkı fark etmeye davet eder. Neyi koruduğunu, biraz daha açıklıkla güvende hissetmek için neyin gerektiğini ve sakladıklarının bir kısmının paylaşılıp paylaşılamayacağını, sevince harcanıp harcanamayacağını ya da değişmesine izin verilip verilemeyeceğini sorabilirsin.
meaningReversed: |-
  Ters geldiğinde Tılsım Dörtlüsü gevşemeye başlayan bir tutuşu yansıtabilir. Her şeyi yerinde tutmanın ne kadar çaba gerektirdiğini fark ediyor ve biraz gevşesen ne olacağını merak ediyor olabilirsin. Bu hem özgürleştirici hem de tedirgin edici hissettirebilir.
  Kart aynı temanın diğer yüzüne de işaret edebilir: sıkı sıkıya tutunma olarak ortaya çıkan bir kıtlık kaygısı ya da tam tersine kaynakların pek dikkat edilmeden elden kaymasına izin vermek. İkisi de aynı yerden, güvenliğin kırılgan olduğu hissinden gelebilir.
  Yeterlilikle ilişkini keşfedebilirsin. Zaman, para, dikkat ya da dinlenme açısından ne yeterli hissettirirdi? Kendine ya da başkalarına yönelik küçük cömertlik denemeleri, kendi temponda yapıldığında, açıklığın nerede güvenli hissettirdiğini ve bir sınırın nerede hâlâ işine yaradığını gösterebilir.
aspects:
  relationshipsUpright: >-
    İlişkilerde bu kart korumacılığı yansıtabilir: duygularını, bağımsızlığını ya da zamanını korumak. Sağlıklı sınırlar bunun bir parçasıdır. Temkinin yakın birini belli bir mesafede tutup tutmadığını da fark edebilirsin. Kendin hakkında küçük ve gerçek bir şeyi paylaşmak, bağın biraz daha açıklığa yer olup olmadığını sınayabilir.
  relationshipsReversed: >-
    Ters geldiğinde kart bir yumuşamayı, birini içeri almaya ya da kimin neyi verdiğinin hesabını tutmayı bırakmaya hazır olmayı düşündürebilir. Birini kaybetme kaygısının kontrol olarak ortaya çıkmasını da yansıtabilir. Kendini güvende hissetmene neyin yardım edeceğini nazikçe sorabilir ve tutuşunu sıkılaştırmak yerine bunun hakkında konuşabilirsin.
  workUpright: >-
    İşte Tılsım Dörtlüsü temkinli ve korumacı bir yaklaşımı anlatabilir: ayaklarının bastığı yer gibi hissettiren bir role, bir yönteme ya da bilgiye tutunmak. İstikrar değerli olabilir. Bu temkinin hâlâ uyup uymadığını ya da bilgiyi paylaşmanın ve yeni bir yaklaşım denemenin konumunu zayıflatmak yerine güçlendirip güçlendiremeyeceğini sorabilirsin.
  workReversed: >-
    Burada kart işte katı alışkanlıkları gevşetmeyi, görev devretmeyi ya da övgüyü daha cömertçe paylaşmayı yansıtabilir. Zamanın ya da çabanın dağınık kullanımına da işaret edebilir. Enerjinin her hafta nereye gittiğine bakıp neyin dikkatli bir korumayı hak ettiğine ve neyin daha kolay akabileceğine bilinçli olarak karar verebilirsin.
  growthUpright: >-
    Kişisel gelişim açısından bu kart, güvenliğin senin için ne anlama geldiğini keşfetmeye davet eder. Tutunduğun şeylerin bazıları değerli çapalar, bazıları ise daha zor zamanlardan kalma eski güvenceler olabilir. Onları nazikçe ayıklayabilir, seni hâlâ dengede tutanları koruyup artık bu kadar sıkı korumaya ihtiyaç duymadıklarını fark edebilirsin.
  growthReversed: >-
    Ters geldiğinde kart güvenmeye, sevinç getiren şeylere enerji harcamaya ya da bir rutinin değişmesine izin vermeye yönelik büyüyen bir istekliliği yansıtabilir. Kontrolü gevşettikçe yükselen rahatsızlığı fark edip ona merakla yaklaşabilirsin. Şeyleri hafifçe tutarken güvende hissetmek yavaş yavaş inşa edilebilen bir beceridir.
