shortUpright: >-
  Hüzünlü ya da kırıcı bir an açıklanıp geçiştirilmek değil hissedilmek istiyor olabilir; hüzün nazikçe onurlandırılabilir.
shortReversed: >-
  Bir kırgınlığın en keskin yanı hafifliyor olabilir; biraz daha rahat nefes almana neyin yardım ettiğini fark edebilirsin.
meaningUpright: |-
  Kılıç Üçlüsü hüzünden söz eder: hayal kırıklığının, kaybın ya da ağır gelen sözlerin sızısından. Duygunun ne kadar süreceğini ya da neyin ona yol açtığını söylemez. Yalnızca bazı anların acıttığını ve bu acının gerçek olduğunu kabul eder.
  Bu kartı seni sarsan bir konuşmada, bir şeye bakışını değiştiren bir haberde ya da sıradan bir öğleden sonra geri dönen bir yasta tanıyabilirsin. Öyle olmamasını umduğun bir gerçeği anlamanın verdiği acıyı da yansıtabilir. Düşünen zihin çoğu zaman acıyı çözümlemek, nedenini bulmak ve onu çabucak düzeltmek ister.
  Bu kart, duygunun bir duygu olarak kalmasına izin vermeye nazikçe davet eder. Yağmur yağar ve sonra geçer; hüzün de izin verildiğinde benzer bir şekilde hareket edebilir. Kendine şefkat, zaman ve seni aceleye getirmeden dinleyebilecek insanların arkadaşlığını sunmak isteyebilirsin. Ağır duygular seninle kalıyorsa güvendiğin biriyle ya da yetkin bir uzmanla konuşmak yardımcı olabilir. Kendi hüznüne bir arkadaşının hüznüne davrandığın gibi davranmak ne anlama gelirdi?
meaningReversed: |-
  Ters geldiğinde Kılıç Üçlüsü bir kırgınlığın yavaşça hafiflemesini yansıtabilir. Zemin hâlâ ıslak olsa da fırtına uzaklaşıyor olabilir. Küçük hafiflik anlarının geri döndüğünü fark edebilir ya da olanlardan biraz daha sakin bir şekilde söz edebildiğini görebilirsin.
  Bir başka okuma da içe dönmüş bir hüzündür: belki fazla kişisel geldiği ya da başkaları senden çoktan iyi olmanı bekliyor gibi göründüğü için sıkıca tutulan ve paylaşılmayan bir acı. Sessiz tutulan kırgınlık gerektiğinden uzun sürebilir.
  Bu kart, azıcık da olsa bırakmana neyin yardım ettiğini fark etmeye davet eder. Yazmak, açık havada vakit geçirmek, güvenilir bir sohbet ya da yalnızca bir son tarih olmadan üzgün hissetmeye izin vermek olabilir. Acı veren bir andan toparlanmanın doğru bir temposu yoktur. Bugün kendine sunabileceğin nazik bir şey ne?
aspects:
  relationshipsUpright: >-
    İlişkilerde bu kart kırılmış duyguları yansıtabilir: sert bir söz, bir hayal kırıklığı ya da seninle yakın biri arasındaki acı veren bir mesafe. Kimin suçlu olduğunu söylemez. Ne anlama geldiğine karar vermeden önce duyguya alan tanımayı düşünebilirsin. Hazır olduğunda kırgınlığı sakince paylaşmak ve diğer kişinin tarafını dinlemek ikinizin de ne olduğunu anlamasına yardım edebilir.
  relationshipsReversed: >-
    Ters geldiğinde Kılıç Üçlüsü insanlar arasında hafiflemeye başlayan ya da hâlâ sessizce içte tutulan bir kırgınlığı düşündürebilir. Belki bir özür mümkündür, belki de daha sağlıklı adım yalnızca kabullenmektir. Diğer kişiyi kapsasın ya da kapsamasın, huzur içinde hissetmek için neye ihtiyaç duyduğunu sorabilirsin. Affetmek, gelirse, kendi vaktinde gelebilir.
  workUpright: >-
    İşte ya da bir projede bu kart bir hayal kırıklığını yansıtabilir: canını yakan eleştirel bir geri bildirim, bir araya gelmeyen bir plan ya da gerçek bir çabanın ardından gelen bir aksilik. Bunu hissetmek sorun değil. Yanıt vermeden önce kendine bir duraklama tanıyabilir, ilk dalga geçtikten sonra mesajın faydalı kısmını arayabilirsin. Değerin tek bir sonuçtan daha büyüktür.
  workReversed: >-
    Ters geldiğinde bu kart mesleki bir aksilikten toparlanmaya ya da sessizce taşıdığın bir hayal kırıklığına işaret edebilir. Eski bir hayal kırıklığının yeni görevlere yaklaşımını hâlâ şekillendirip şekillendirmediğini fark edebilirsin. Belki güvendiğin bir iş arkadaşı ya da mentorla ona ad vermek tutuşunu gevşetebilir ve işine taze bir enerjiyle dönmene yardım edebilir.
  growthUpright: >-
    Kişisel gelişim açısından Kılıç Üçlüsü, kendi acına karşı şefkat göstermeyi denemeye davet eder. Hüzün insan olmanın bir parçasıdır; sende bir sorun olduğunun işareti sayılmaz. Kendini kötü hissettiğinde kendine bakmanın basit yollarını keşfedebilirsin: dinlenmek, hareket etmek, tanıdık rahatlıklar ve seni olduğun gibi kabul eden insanlar.
  growthReversed: >-
    Ters geldiğinde bu kart, acıtan şeyi güvenli hissettiren bir tempoda bırakmayı öğrenmeyi yansıtabilir. Gerçek ya da mecaz anlamda nefesini nerede tuttuğunu fark edebilirsin. Bir iç çekiş, birkaç gözyaşı ya da bir günlüğe yazılmış birkaç dürüst cümle küçük bir bırakma eylemi olabilir. Toparlanma nadiren düz bir çizgidir ve bunda bir sorun yok.
