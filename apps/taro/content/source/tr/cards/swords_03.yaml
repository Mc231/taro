imageryNote: >-
  Özgün çizim, alçak ve gri bir gökyüzünün altında kalp biçimli bir taşa yaslanmış üç ince kılıcı gösterir. Çevresine yumuşak bir yağmur yağar ve bulutların kenarında belli belirsiz bir ışık aralığı belirir. Taş hüznün ağırlığını düşündürürken yağmur gözyaşlarına ve bırakmaya işaret eder. Uzaktaki ışık, ne zaman olacağını vaat etmeden fırtınaların geçip gittiğini ima eder.
