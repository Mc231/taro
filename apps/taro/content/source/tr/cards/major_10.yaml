  - "Bu hafta kontrolünde olan hangi şeye odaklanabilirsin?"
imageryNote: >-
  Taro’nun Kader Çarkı, bir kenarında şafaktan öbür kenarında geceye dönüşen bir gökyüzüne yerleştirilmiş, her evreyi aynı anda gösteren büyük ve dönen bir çark olarak hayal edilir. Kenarında küçük figürler ve yaratıklar yolculuk eder; kimi yükselir, kimi alçalır, hiçbiri yerinde durmaz. Köşelerdeki dört mevsimin sembolleri doğal döngüler fikrini çerçeveleyebilir. Göbekte sakin ve hareketsiz bir merkez, her şey dönerken bile bulunabilecek istikrarlı bakış açısını çağrıştırır.
