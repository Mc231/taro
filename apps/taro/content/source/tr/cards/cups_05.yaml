meaningUpright: |-
  Kupa Beşlisi, arkasında başka kupalar dimdik dururken dökülmüş kupalara bakan bir figürü gösterir. Hayal kırıklığı ve yas üzerine bir karttır: bir şeyin umulduğu gibi gitmemesinin verdiği his ve kaybedilenle kalma isteği.
  Bu istek insanidir. Bir plan suya düştüğünde, bir dostluk değiştiğinde ya da bir beklenti karşılanmadığında bunu sindirmek zaman alır. Bu kart acele etmeni istemez. Yas, bir şeyi önemsemenin bir parçasıdır ve bir kayba ad vermek onu onurlandırmanın bir yolu olabilir.
  Gündelik hayatta bu kart, bir konuşmayı zihninde tekrar tekrar oynatmayı, neyi farklı yapabileceğini düşünüp durmayı ya da eksik olan şey yüzünden bir şeyden keyif almakta zorlanmayı yansıtabilir. Hazır olduğunda biraz dönüp dökülmemiş olanı fark etmeye nazikçe davet eder: hâlâ orada olan ilişkiler, güçlü yanlar ya da seçenekler. İkisi aynı anda doğru olabilir: kayıp da, kalan da.
meaningReversed: |-
  Ters geldiğinde Kupa Beşlisi, bir hayal kırıklığının ardından dengenin yavaşça geri dönüşünü yansıtabilir. Kaybın daha az keskin acıttığını ya da artık bütün günü doldurmadan ondan söz edebildiğini fark edebilirsin. Kabullenmek önemli değilmiş gibi davranmak anlamına gelmez; onu başka şeylerle birlikte taşıyacak yer bulmak demektir.
  Bu kart, bir başkasını ya da kendini affetmenin biraz daha mümkün hâle geldiğine de işaret edebilir. Ya da yasın hissedilmek yerine bir kenara konduğunu ve daha sessiz bir dikkat anı istediğini düşündürebilir.
  Bu deneyimden ne öğrendiğini ve neyi ileriye taşımak istediğini sorabilirsin. Kalana dönmek, kaybedilene ihanet sayılmaz. Ağır duygular seninle kalıyorsa onları güvendiğin biriyle paylaşmak yükü daha hafif hissettirebilir.
aspects:
  relationshipsUpright: >-
    İlişkilerde bu kart, değişmiş bir bağ, karşılanmamış bir umut ya da kırıcı sözler yüzünden duyulan hüznü yansıtabilir. Bu duyguyu bir kenara itmek yerine kabul etmeye davet edebilir. Zorluk boyunca yanında kalan insanları da fark edip bunun senin için ne kadar anlamlı olduğunu onlara söyleyebilirsin.
  relationshipsReversed: >-
    Ters geldiğinde kart barışmaya ya da bir ilişkinin değişme biçimiyle huzur bulmaya doğru bir hareketi yansıtabilir. Eski bir kırgınlığı bırakmaya ya da en azından onu daha gevşek tutmaya hazır olabilirsin. Affetmenin senin için nasıl görüneceğini düşün; bunun doğru hissettirmeyen bir şeyi kabul etmeni gerektirmediğini hatırlayarak.
  workUpright: >-
    İşte Kupa Beşlisi, duran bir proje, can yakan bir geri bildirim ya da başkasına giden bir fırsat yüzünden duyulan hayal kırıklığını yansıtabilir. Bir sonraki adımı planlamadan önce bunu sindirmek için bir an ayırmaya davet edebilir. Ardından üzerine inşa edebileceğin, hâlâ senin olan becerileri, ilişkileri ve fikirleri listeleyebilirsin.
  workReversed: >-
    Ters geldiğinde kart bir aksilikten toparlanmayı ve yeni seçenekleri görmeye başlamayı yansıtabilir. Kapanmasına üzüldüğün bir kapının başka bir şeye yer bıraktığını fark edebilirsin. Olanların suçlamaya değil derslere odaklanan kısa bir değerlendirmesini yazmayı düşün; böylece daha net bir şekilde yoluna devam edebilirsin.
  growthUpright: >-
    Yas ve pişmanlık hikâyende bir yeri hak eder ve bu kart, hikâyenin geri kalanını onlara yazdırmadan onlara bu yeri nasıl vereceğini sorar. Dikkatinin neyin yanlış gittiğine tekrar tekrar döndüğü anları fark etmeyi deneyebilirsin. Her gün birkaç dakikalığına bile olsa bakışı nazikçe genişletmek, resmin tamamını görmeyi kolaylaştırabilir.
  growthReversed: >-
    Ters geldiğinde Kupa Beşlisi, zor bir dönemin ardından güçlenen bir dayanıklılığı yansıtabilir. Bu deneyimin sana kazandırdığı yeni bir bakış açısını ya da daha derin bir şefkati fark edebilirsin. Değişimi, göndermeyeceğin bir mektup yazmak gibi küçük bir ritüelle işaretlemek bir bölümü kapatıp ötekini açmana yardım edebilir.
reflectionQuestions:
