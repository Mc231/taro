    Hayatında, kısa bir süreliğine de olsa dönebileceğin, hâlâ ayakta duran ne var?
imageryNote: >-
  Görsel, devrilmiş üç kupanın üzerine başını eğmiş pelerinli bir figürü gösterir; kupaların içindekiler toprağa sızar. Figürün arkasında iki kupa dimdik durur ve kolayca gözden kaçar. Uzaktaki bir patika ya da bir geçit, zamanı geldiğinde ileriye giden bir yolu düşündürebilir. Serin ve sönük tonlar yası ifade ederken ayakta duran kupaların üzerindeki ince bir ışık çizgisi her şeyin gitmediğini ima eder.
