shortUpright: >-
  Özen gösterdiğin bir şey yavaşça büyüyor. Durup ilerlemene bakmak ve bundan sonra neyi besleyeceğini seçmek için iyi bir an olabilir.
shortReversed: >-
  İlerleme umduğundan yavaş hissettirebilir. Bu çabanın sabra mı, yeni bir yöne mi, yoksa yalnızca dinlenmeye mi ihtiyacı olduğunu sorabilirsin.
meaningUpright: |-
  Tılsım Yedilisi işinin ortasında durup bir alete yaslanmış ve sikkelerle yüklü bir bitkiye bakan bir figürü gösterir. Hasat henüz hazır değildir ama büyüme görünürdür. Bu bir durum değerlendirmesi kartıdır: emekten geri çekilip şimdiye kadar neler ürettiğine ve hâlâ neye ihtiyaç duyduğuna bakmak.
  Bunu ortasına gelmiş uzun bir projede, sen fark etmeden gelişmiş bir beceride, yıllar içinde kurulmuş bir ilişkide ya da yavaş yavaş dolan bir bahçede tanıyabilirsin. Duraklama önemlidir. O olmadan niyetle değil alışkanlıkla çalışmaya devam edebilirsin.
  Kart, emeğine sabır ve dürüstlükle bakmaya davet eder. İşinin hangi kısımları serpiliyor? Hangileri durdu? Sürdürdüğün tempo devam ettirebileceğin bir tempo mu? Bu anı bir kontrol noktası olarak görüp yalnızca devam etmek yerine bir sonraki mevsim için enerjini nereye koyacağını bilinçli olarak seçebilirsin.
meaningReversed: |-
  Ters geldiğinde Tılsım Yedilisi yavaş ilerlemeden duyulan bir bıkkınlığı yansıtabilir. Sonuç görmeden istikrarlı bir şekilde çalışıyor ve devam etmeye değip değmediğini merak ediyor olabilirsin. Çabanın o kadar çok tarlaya dağıldığına da işaret edebilir ki hiçbiri yeterince su almaz.
  Bu çerçeve, kendini yargılamak yerine planı yeniden gözden geçirmeni ister. Bazı şeyler doğası gereği yavaş büyür; diğerleri farklı bir yaklaşıma ihtiyaç duyabilir.
  Zamanının ve özeninin nereye gittiğine dürüstçe bakabilirsin. Hangi çabalar hâlâ istediğin şeyi yansıtıyor? Hangileri esas olarak zaten çok şey koymuş olduğun için devam ediyor? Enerjini yeniden yönlendirmene ya da karar vermeden önce dinlenmene izin vermek, bıkkınlığı neye özen göstereceğine dair daha net bir duyguya dönüştürebilir.
aspects:
  relationshipsUpright: >-
    İlişkilerde bu kart sabrın ve istikrarlı dikkatin değerini yansıtabilir. Güven ve yakınlık çoğu zaman pek çok küçük anla yavaşça büyür. Bir bağın zaman içinde nasıl derinleştiğini fark etmek için durup ona bundan sonra neyin gerektiğini sorabilirsin: birlikte daha fazla zaman, yeni bir ortak ilgi ya da yalnızca güvenilir özenin sürmesi.
  relationshipsReversed: >-
    Ters geldiğinde kart bir bağın gelişimine karşı sabırsızlığı ya da karşılığını görmeden çok şey verme hissini düşündürebilir. Beklentilerinin bu bağın gerçekçi olarak büyüyebileceği tempoya uyup uymadığını düşünüp her birinizin ne umduğunu açıkça konuşabilirsiniz.
  workUpright: >-
    İşte Tılsım Yedilisi uzun vadeli çabalardaki ilerlemeyi gözden geçirmek için bir duraklamaya davet eder. Neyin işe yaradığını, neyin durduğunu ve bundan sonra nereye odaklanacağını değerlendirebilirsin. Bitmiş sonuç henüz uzakta olsa bile kurduğun becerileri ve temeli takdir etmek için de bir an olabilir.
  workReversed: >-
    Burada kart yavaş sonuçlara karşı huzursuzluğu ya da yönünü kaybetmiş bir çabayı yansıtabilir. Hedeflerine yeniden bakıp günlük görevlerinin hâlâ onlara hizmet edip etmediğini kontrol edebilirsin. Planı ayarlamak, odağını daraltmak ya da geri bildirim istemek çabanın yeniden amaçlı hissettirmesine yardım edebilir.
  growthUpright: >-
    Kişisel gelişim açısından bu kart kendi gelişimine karşı sabra davet eder. Değişim çoğu zaman görünmeden önce yüzeyin altında gerçekleşir. Geçen aylara dönüp bakarak azıcık da olsa neyin büyüdüğünü fark edebilir ve bu kanıtın seni önemli olana özen göstermeye devam etmeye cesaretlendirmesine izin verebilirsin.
  growthReversed: >-
    Ters geldiğinde kart cesaret kırıklığını ya da başkalarının ilerlemesiyle kıyaslamayı yansıtabilir. Büyümeyi sana ait olmayan bir zaman çizelgesiyle ölçüp ölçmediğini keşfedebilirsin. Özenle sürdüreceğin bir pratik seçip diğerlerini şimdilik bırakmak büyümeyi daha hafif hissettirebilir.
