imageryNote: >-
  Görsel, yedi sikkenin olgunlaşan meyveler gibi asılı durduğu yapraklı bir bitkinin ya da asmanın yanında, bir çapaya veya küreğe yaslanarak duraklayan bir figürü gösterebilir. Dinlenen duruş değerlendirmeyi ve geri çekilme ihtiyacını, bitki ise kendi zamanını alan büyümeyi düşündürebilir. Toprak, yapraklar ve alet birlikte istikrarlı emekten söz eder; hasadın henüz olgunlaşmamış olması da izleyiciye işin hâlâ sürdüğünü hatırlatır.
