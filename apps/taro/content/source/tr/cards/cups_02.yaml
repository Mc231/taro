shortUpright: >-
  Özenin iki yönde aktığı yerleri ve bir bağı eşit ve canlı hissettiren şeyi fark etmek için bir an.
shortReversed: >-
  Seninle bir başkası arasındaki bir şey dengesiz hissettirebilir; her birinizin gerçekte ne istediğini düşün.
meaningUpright: |-
  Kupa İkilisi, eşit olarak buluşup birbirine bir şey sunan iki insanı ya da bir hayatın iki parçasını gösterir. Bu bir tanınma kartıdır: anlaşılmanın rahatlığı ve karşılığında birini anlamanın keyfi. Anlattığı bağ romantik olabilir ama aynı şekilde bir dostluk, yaratıcı bir iş birliği, kardeş bağı ya da bir iş ortaklığı da olabilir.
  Bu enerjiyi iki kişinin de dinlediği bir sohbette, bir yanlış anlamanın ardından gelen bir barışmada ya da birbirinin yanında olmaya devam etmeyi seçen iki insanın sessiz uzlaşmasında tanıyabilirsin. Farklı yönlere çekilen iki yanını bir araya getirmeyi de yansıtabilir.
  Bu kart, hayatında gerçek bir alışverişin olduğu yerleri fark etmeye ve onları onurlandırmaya davet eder. Karşılıklılık hesap tutmak anlamına gelmez. İki kişinin de vermekte, almakta ve neye ihtiyaç duyduğunu söylemekte özgür hissetmesi demektir.
meaningReversed: |-
  Ters geldiğinde Kupa İkilisi, dengesi bozulmuş bir bağa işaret edebilir. Bir kişi daha çok veriyor ya da daha az dinliyor olabilir veya iki kişi yalnızca birbirini duymadan konuşuyor olabilir. Bu bir şeyin kırıldığı anlamına gelmek zorunda değil; pek çok bağ böyle dönemlerden geçer.
  Kart içe de dönebilir ve kendine ne kadar iyi bir eş olduğunu sorabilir. Kendi ihtiyaçlarına karşı, bir başkasınınkine olmaya çalıştığın kadar sabırlı ve adil misin?
  Dengesiz hissettiren bir ilişkiye bakıp yüzeydeki anlaşmazlığın altında her bir kişinin gerçekte neyi umduğunu sorabilirsin. Sakin ve dürüst bir konuşma ya da daha net görmek için biraz mesafe, her şeyi bir anda düzeltmeye çalışmaktan daha faydalı olabilir. Denge, insanların her alışverişte birlikte kurduğu bir şeydir.
aspects:
  relationshipsUpright: >-
    İlişkilerde bu kart karşılıklı çekimi, dostluğu ya da iki kişinin de görüldüğünü hissettiği bir ortaklığı yansıtabilir. Bir bağı istikrarlı tutan küçük ritüelleri fark etmeye davet edebilir: hâl hatır sormak, diğer kişi için neyin önemli olduğunu hatırlamak, sadece özür dilemek. Sana yakın birinde en çok neyi takdir ettiğini ve bunu bilip bilmediğini sorabilirsin.
  relationshipsReversed: >-
    Ters geldiğinde bu kart, duygusal yükün daha fazlasını bir kişinin taşıdığı ya da bir yanlış anlamanın giderilmediği bir bağı yansıtabilir. Nazikçe duyulacağını bilseydin ne söyleyeceğini düşünebilirsin. Onarım çoğu zaman tek bir dürüst cümleyle ve hemen kendini savunmadan yanıtı dinlemeye isteklilikle başlar.
  workUpright: >-
    İşte Kupa İkilisi umut verici bir iş birliğine, güvendiğin bir iş arkadaşına ya da saygıya dayanan bir müşteri ilişkisine işaret edebilir. Övgüyü paylaşmaya, görüş istemeye ve anlaşmaları iki tarafın da kendini güvende hissedeceği kadar net yapmaya davet edebilir. İyi ortaklıklar çoğu zaman ortak becerilerden çok ortak değerlerden büyür.
  workReversed: >-
    Ters geldiğinde kart, beklentilerin söylenmediği ya da eşit olmadığı bir çalışma ilişkisini yansıtabilir. Belki bir kişi aslında olmayan bir mutabakat varsayıyordur. Her birinizin ne beklediğini sade sözcüklerle dile getirip rollerinizin hâlâ uyup uymadığını kontrol edebilirsin. Konuşma ilk başta tuhaf hissettirse bile netlik bir incelik olabilir.
  growthUpright: >-
    Buradaki gelişim teması içsel ortaklıktır; kendinin farklı yanlarını uzlaştırmak için bir fırsat: ne istediğinle neye değer verdiğin ya da pratik yanınla hassas yanın. İçindeki iki ses arasında kısa bir diyalog yazıp nerede zaten anlaştıklarını görebilirsin. Bütünleşme insanın içinde bir eş bulması gibi hissettirebilir.
  growthReversed: >-
    Ters geldiğinde bu kart, kendi içinde de kurabileceğin bir denge duygusu için başkalarına dayanıp dayanmadığını sorabilir. Kendi görüşüne güvenmeden önce nerede onay aradığını fark edebilirsin. Kendine yakın bir arkadaşına gösterdiğin adaletle davranmak, adım adım dengeleyici bir pratik olabilir.
