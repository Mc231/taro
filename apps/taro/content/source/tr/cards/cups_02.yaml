imageryNote: >-
  Görsel, küçük bir boşluğun iki yanında birbirine doğru birer kupa kaldıran iki figürü ya da iki eli eşleştirir. Aralarında iç içe geçmiş saplar ya da ikiz balıklar gibi ortak bir amblem, bu buluşmanın ikisinin de tek başına tutmadığı bir şey yarattığını düşündürebilir. İki taraftaki ayna gibi renkler eşitliği ifade edebilir; kupaların neredeyse değdiği yerdeki yumuşak bir parıltı ise sanki bağın kendisi ışık saçıyormuş gibi görünür.
