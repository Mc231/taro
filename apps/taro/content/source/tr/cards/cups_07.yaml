imageryNote: >-
  Görsel, arkadan görülen ve sürüklenen bir sisin içinde asılı duran yedi kupaya bakan bir figürü gösterir. Her kupa farklı bir sembol taşır; belki bir anahtar, bir çelenk, küçük bir ev, bir yıldız, kıvrılmış bir biçim, kapalı bir kutu ve bir ayna; bunlar erişimi, övgüyü, güvenliği, umudu, tedirginliği, sırları ve benlik imajını temsil eder. Yumuşak, düş gibi bir ışık ve değişen renkler bu görüntülerin ne kadar çekici ve belirsiz olduğunu düşündürebilir ve izleyiciyi hangisinin gerçek olduğunu merak etmeye davet eder.
