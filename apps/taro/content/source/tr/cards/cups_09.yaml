shortUpright: >-
  Zaten iyi olanın tadını çıkarmak ve bunun ne kadarını senin ortaya çıkardığını fark etmek için bir an.
shortReversed: >-
  Bir şey doyurucu görünse de öyle hissettirmiyor olabilir; içeriden hoşnutluk getirecek şeyin ne olduğunu düşün.
meaningUpright: |-
  Kupa Dokuzlusu çoğu zaman dilek kartı olarak anılır. Dolu kupaların arasında rahat bir figürü, sahip olduklarından açıkça memnun hâlde gösterir. Hoşnutluktan söz eder: yeterlilik hissinden, karşılanmış bir dilekten ya da bir sonuca ulaşmış bir umuttan.
  Bu kart, doğrudan bir sonraki hedefe geçmek yerine doyum oradayken onu fark etmeye davet eder. Belki çok çalıştığın bir şeyi bitirdin, sevdiğin insanlarla güzel bir yemeğin tadını çıkardın ya da yalnızca bir anlığına hayatında rahat hissediyorsun. Bu deneyimlerin tadını çıkarmaya değer.
  Gerçekte ne dilediğin üzerine düşünmeye de davet edebilir. Bir kupa daha doldurabilseydin içinde ne olurdu? Dileklerini net bilmek seçimlerini küçük ve pratik yollarla şekillendirebilir. Keyif ve rahatlıktan zevk almak dolu bir hayatın parçasıdır. Bu anlamda minnet, mutlu olman gerektiğini hissetmekle ilgili değildir; zaten iyi olanı fark edip onun hesaba katılmasına izin vermekle ilgilidir.
meaningReversed: |-
  Ters geldiğinde Kupa Dokuzlusu, işlerin nasıl göründüğüyle nasıl hissettirdiği arasındaki bir boşluğu yansıtabilir. İstediğini düşündüğün şeye sahip olup yine de bir eksiklik sezebilirsin. Ya da keyif aşırılığa kaymış, rahatlık hayattan zevk almanın değil duygulardan kaçmanın bir yoluna dönüşmüş olabilir.
  İçe de dönebilir ve kalıcı hoşnutluğun sahip olunan şeylerden ya da başarılardan çok kendinle ilişkinle ilgili olduğunu düşündürebilir.
  Bu kart dürüst bir düşünmeye davet eder. Bu dileğin ne getirmesini bekledin ve gerçekte ne getirdi? Doyumu sonuçların yanı sıra değerlerde, bağlarda ve anlamda da arayabilirsin. Özenle seçilmiş küçük ve içten keyifler, daha fazlasını biriktirmekten daha çok şey sunabilir. Bir şeyler istemek sorun değil; soru, neyin yeterli hissettireceğidir.
aspects:
  relationshipsUpright: >-
    İlişkilerde Kupa Dokuzlusu, çevrendeki insanlarla hoşnut ve rahat hissetmeyi yansıtabilir. Bir bağın olduğu hâliyle tadını çıkarmaya, keyifleri paylaşmaya ve neyi takdir ettiğini söylemeye davet edebilir. Doyurucu bir bağın senin için nasıl göründüğünü fark edebilirsin; böylece onu tesadüfe bırakmadan bilinçli olarak besleyebilirsin.
  relationshipsReversed: >-
    Ters geldiğinde bu kart, bir ilişkinin tüm hoşnutluğunu karşılamasını beklemeye ya da dışarıdaki uyuma rağmen bir şeylerin eksik olduğunu hissetmeye işaret edebilir. Hangi ihtiyaçlarını kendin karşılayabileceğini ve sana yakın birinden neyi daha açıkça istemek istediğini keşfedebilirsin.
  workUpright: >-
    İşte bu kart bir başarıdan duyulan memnuniyeti, emeğin takdir görmesini ya da yalnızca yaptığın işten keyif almayı yansıtabilir. Durup kaydettiğin ilerlemeyi kabul etmeye davet edebilir. Bir dönüm noktasını kendi kendine bile olsa kutlamak, sırada ne varsa onun için enerjini yenileyebilir ve işin neden önemli olduğunu hatırlatabilir.
  workReversed: >-
    Ters geldiğinde kart, boş hissettiren bir başarıyı ya da değer verdiğin şeyleri yansıtmayan başarı göstergelerinin peşinde koşmayı yansıtabilir. İşini yalnızca etkileyici değil, anlamlı hissettirecek şeyin ne olduğunu sorabilirsin. Hedefleri değerlerinle hizalamak başarıyı gerçek bir doyuma dönüştürebilir.
  growthUpright: >-
    Kişisel gelişim açısından Kupa Dokuzlusu bir minnet ve keyif pratiğine davet eder. Her günü, ne kadar küçük olursa olsun iyi hissettiren üç şeyi not ederek bitirebilirsin. Bu, dikkatini adım adım hoşnutluğa yöneltebilir ve yeterince şeye sahip olduğunda bunu fark etmeyi kolaylaştırabilir.
  growthReversed: >-
    Ters geldiğinde bu kart, keyif ile doyum arasındaki farkı incelemeni isteyebilir. Seni hep daha fazlasını ister hâlde bırakan tüketim, meşguliyet ya da kıyaslama alışkanlıklarını fark edebilirsin. Hızlı bir canlanmadan çok derin bir doyum getiren şeyi keşfetmek daha nazik ve daha kalıcı seçimlere yol gösterebilir.
