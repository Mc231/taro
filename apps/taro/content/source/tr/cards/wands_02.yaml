imageryNote: >-
  Yüksek bir duvarın ya da çıkıntının üzerinde duran bir figür, bir asayı yanına sağlamca dikmiş, ikincisini ise elinde gevşekçe tutarak uzaktaki karaya ya da denize bakar. Hemen yanında küçük bir küre, bir harita ya da bir pusula durur. Sabit asa çoktan kurulmuş olanı, kaldırılmış olan ise daha ileri gitme seçimini temsil eder. Geniş manzara, izleyiciyi tek bir belirlenmiş yol yerine pek çok olası rotayı hayal etmeye davet eder.
