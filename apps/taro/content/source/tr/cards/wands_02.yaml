meaningUpright: |-
  Asa İkilisi ilk kıvılcımın ardından bir vizyon molası verir. Fikir artık yalnızca bir his sayılmaz; şimdi biraz daha yüksek bir yerde durup manzaraya bakıyor ve bunun ne kadar uzağa uzanabileceğini merak ediyorsun. Asalardan biri, kurduğun şeyin bir işareti olarak arkanda çoktan toprağa dikilmiştir; diğeri ise elinde, yeni bir yere taşınmaya hazırdır.
  Bu kart çoğu zaman daha büyük bir adımı tarttığında ortaya çıkar: başka bir şehirde kursa gitmek, bir rolü yeniden şekillendirmek ya da senden olağan rutininden fazlasını isteyen bir projeye başlamak. Hâlâ sevdiğin bir alanın sana dar gelmeye başlamasının huzursuz hissini de yansıtabilir.
  Buradaki davet, hem iddialı hem de dürüst bir şekilde plan yapmaktır. Neyi umduğunu, bunun zaman ve enerji açısından neye mal olacağını ve hangi ilk hamlenin denemek için yeterince küçük olduğunu yazabilirsin. Uzağa bakmak faydalıdır; gerçekten atabileceğin bir sonraki adımı seçmek de.
meaningReversed: |-
  Ters geldiğinde Asa İkilisi, kâğıt üzerinde kalan bir planı yansıtabilir. Tanıdık olan daha güvenli geldiği ya da varış noktası hâlâ bulanık olduğu için bavulunu toplamadan ufka bakmaya devam ediyor olabilirsin. Bazen bu tereddüt akıllıcadır, bazen de yalnızca bir alışkanlıktır.
  Bu kart, başka birinin onayı için yapılmış planlara ya da dönüşmekte olduğun kişiye artık uymayan bir vizyona da işaret edebilir. Bir hedef heyecan verici değil de ağır geliyorsa, hâlâ sana ait olup olmadığını sormaya değer.
  Haritana taze bir gözle yeniden bakabilirsin. Bu planın daha küçük ve daha kişisel bir hâli nasıl görünürdü? Hangi korku en yüksek sesle konuşuyor ve bu korku adımın kendisiyle mi yoksa başkalarının ne düşünebileceğiyle mi ilgili? Ona ad vermek, bir sonraki hamleyi bir atlayıştan çok bir seçim gibi hissettirebilir.
aspects:
  relationshipsUpright: >-
    İlişkilerde bu kart, her birinizin hayal ettiği gelecek hakkında bir konuşmaya davet edebilir: nerede yaşamak istediğiniz, zamanınızı nasıl geçirmek istediğiniz, neyi keşfetmeyi umduğunuz. Her bir kişinin dışarı bakmakta özgür olduğu güvenli bir üs gibi hissettiren bir bağı yansıtabilir. Sana yakın birine son zamanlarda hangi ufka baktığını sorabilirsin.
  relationshipsReversed: >-
    Ters geldiğinde sen ya da sana yakın biri, yüksek sesle söylemek riskli geldiği için bir değişim isteğini saklıyor olabilirsiniz. Hiç paylaşılmayan planlar sessizce birbirinden uzaklaşabilir. Gizli tutulan umutlar hakkında, konuştuğun kadar dinleyerek konuşmanın zamanı olabilir; böylece ikiniz de yalnız başına plan yapmamış olursunuz.
  workUpright: >-
    İşte Asa İkilisi stratejik düşünmeye işaret edebilir: bir projenin bir sonraki aşamasının haritasını çıkarmak, yeni bir alanı düşünmek ya da daha uzun vadeli bir hedefi şekillendirmek. Günlük işlere dönmeden önce büyük resme biraz zaman ayırabilir, ardından planı tahtadan hareketin içine taşıyacak somut bir eylem seçebilirsin.
  workReversed: >-
    Ters geldiğinde işteki bir plan rahatlıkla hırs arasında sıkışmış ya da senin istediğinden çok beklenen şeye göre şekillenmiş olabilir. Hedefin seni hâlâ motive edip etmediğini kontrol edebilirsin. Ediyorsa, onu küçük bir ilk denemeye bölmek yardımcı olabilir; etmiyorsa, planı yeniden çizmek de ilerlemenin geçerli bir yoludur.
  growthUpright: >-
    Kişisel gelişim açısından bu kart, kendi hırslarını ciddiye almaya davet eder. Olağan sınırlarının ötesinde düşünmene izin verseydin neyi keşfederdin? Önümüzdeki bir iki yılın kaba bir taslağını çizebilirsin; değişmez bir söz olarak değil, fırsatlar ortaya çıktığında onları fark etmene yardım eden bir yön olarak.
  growthReversed: >-
    Ters geldiğinde güvenlik isteğiyle büyüme isteği farklı yönlere çekiyor olabilir. İkisi de gerçek ihtiyaçlardır. Yeni bir adımı denemek için yeterince güvenli hissettirecek şeyin ne olduğunu ve hangi destek, pratik ya da bilginin uzak bir fikri adım adım yaklaşabileceğin bir şeye dönüştürebileceğini keşfedebilirsin.
