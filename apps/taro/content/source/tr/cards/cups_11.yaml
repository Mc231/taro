shortUpright: >-
  Oyunbaz bir duygu ya da küçük yaratıcı bir fikir seni şaşırtabilir; bu kart onu merakla karşılamaya davet ediyor.
shortReversed: >-
  Narin bir duygu saklanıyor ya da sallanıyor olabilir; hissettiğini ifade etmeyi nasıl güvenli kılabileceğini düşün.
meaningUpright: |-
  Kupa Prensi su takımının en genç figürüdür; çoğu zaman bir kupanın içinden başını uzatan bir balığa bakarken gösterilir. Görüntü hafifçe tuhaftır ve asıl mesele de budur. Bu kart merakı, şaşkınlığı ve beklenmedik bir duyguyu ya da fikri keşfedecek kadar ciddiye almaya istekliliği kutlar.
  Yeni bir yaratıcı dürtüyü, birine karşı ani bir şefkati, birdenbire gelen bir önseziyi ya da sıradan şeyleri yeni hissettiren oyunbaz bir ruh hâlini yansıtabilir. Prens bunların hiçbirinin nereye varacağını bilmek zorunda değildir. Yalnızca açıktır.
  Gündelik hayatta bu, bir fikri karalamak, içten bir mesaj yazmak, yaratıcı bir hobi denemek ya da küçük bir şeyden keyif almana izin vermek gibi görünebilir. Kart, iç dünyana bir acemi açıklığıyla yaklaşmaya davet eder. Bugün seni neyin şaşırttığını fark edip pratik düşünceler araya girmeden önce ona bir an dikkat verebilirsin.
meaningReversed: |-
  Ters geldiğinde Kupa Prensi, paylaşması zor duyguları ya da göstermek için fazla kırılgan gelen yaratıcı fikirleri yansıtabilir. Saçma ya da savunmasız görünmekten endişe edip iç dünyanı saklı tutabilirsin.
  Hızla değişen ruh hâllerine ya da eyleme ilham vermek yerine onun yerini alan hayallere de işaret edebilir.
  Bu kart, duyarlı yanına sabırla yaklaşmaya davet eder. Tek bir kişiye ya da kişisel bir sayfaya bile olsa kendini ifade edecek kadar güvende hissetmene ne yardım ederdi? Hiçbir şeyin iyi olmak zorunda olmadığı bir günlük ya da eskiz defteri gibi baskısız bir çıkış yolu bulabilirsin. Duygular büyük ve dengesiz görünüyorsa onlara basitçe ad vermek taşımayı kolaylaştırabilir. Merak, biraz korunak bulduğunda yeniden filizlenebilir.
aspects:
  relationshipsUpright: >-
    İlişkilerde Kupa Prensi tatlı jestleri, oyunbaz bir flörtü, içten bir notu ya da şefkatli bir dostluğun başlangıcını yansıtabilir. Sevgiyi açıkça ve fazla düşünmeden ifade etmeye davet edebilir. Sana yakın birinin özenini küçük ve şaşırtıcı yollarla nasıl gösterdiğini de fark edip bunu gördüğünü ona söyleyebilirsin.
  relationshipsReversed: >-
    Ters geldiğinde bu kart bir bağdaki utangaçlığa, duygusal güvensizliğe ya da karışık sinyallere işaret edebilir. Senin ya da sana yakın birinin reddedilme korkusuyla duygularını geri tutup tutmadığını sorabilirsin. Rahat bir tempoda sunulan nazik bir dürüstlük iki kişinin de güvende hissetmesini kolaylaştırabilir.
  workUpright: >-
    İşte bu kart yeni bir yaratıcı fikri, taze bir yaklaşımı ya da farklı bir alana duyulan merakı yansıtabilir. Alışılmadık bir öneriyi paylaşmaya ya da bir görevle oyunbaz bir şekilde denemeler yapmaya davet edebilir. İlk fikirlerin cilalı olması gerekmez; biri onları yargılamadan önce keşfedilecek alana ihtiyaç duyarlar.
  workReversed: >-
    Ters geldiğinde kart yaratıcı bir tıkanıklığı ya da eleştirilme korkusuyla fikirleri paylaşmakta tereddüdü yansıtabilir. Önce sonuç beklentisi olmadan yalnızca kendin için bir şey üzerinde çalışmayı deneyebilirsin. Özgüveni yavaşça inşa etmek, fikirlerin görülmeye hazır hissettiğinde onları öne çıkarmana yardım edebilir.
  growthUpright: >-
    Kişisel gelişim açısından Kupa Prensi, duygularına ve önsezilerine karşı bir merak yetiştirmeye davet eder. Yalnızca örüntüleri fark etmek için rüyalara, görüntülere ya da tuhaf izlenimlere ayrılmış bir defter tutabilirsin. İç dünyana oyunbaz bir şekilde yaklaşmak kendini anlamayı daha hafif ve daha davetkâr hissettirebilir.
  growthReversed: >-
    Ters geldiğinde bu kart, kendinin daha kırılgan yanlarına nazik davranmanı isteyebilir. Kendi duygularını çocukça ya da saçma diye geçiştirdiğin anları fark edebilirsin. Genç bir arkadaşına yapacağın gibi kendini cesaretlendirmek, duyarlılığın saklanacak bir şey olmaktan çıkıp bir güce dönüşmesine yardım edebilir.
