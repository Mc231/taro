imageryNote: >-
  Görsel, bir kupayı omuz hizasında tutan ve içinden kendisine bakan küçük bir balık bulunca şaşıran genç bir figürü gösterir. Giysilerinde dalga ya da çiçek desenleri olabilir; arkasındaki kıyı şeridi fikirlerin doğduğu duygu derinliklerini ima eder. Yumuşak pastel tonlar ve hafif, meraklı bir ifade açıklığı, hayal gücünü ve içeriden gelen beklenmedik mesajların büyüleyiciliğini aktarır.
