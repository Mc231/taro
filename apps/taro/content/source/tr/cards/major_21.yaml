imageryNote: >-
  Taro’nun Dünya’sı, her mevsimden yaprak ve çiçeklerle örülmüş büyük, oval bir çelengin içinde, yıldızlı bir gökyüzünün ortasında özgürce dans eden bir figür olarak hayal edilir. Çelengin çevresinde ateş, su, hava ve toprak için dört küçük amblem sahnenin kenarlarını işaretler; dengeyi ve bütünlüğü çağrıştırır. Dansçının elinden uzanan bir kurdele başladığı yere dönerek bir halka çizer ve izleyiciyi bir varış ve tamamlanan bir yolculuk duygusunu hissetmeye davet eder.
