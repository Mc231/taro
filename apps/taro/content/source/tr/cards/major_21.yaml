shortUpright: >-
  Bir döngü tamamlanıyor olabilir. Bu kart durup tamamladığın şeyi onurlandırmaya davet ediyor.
shortReversed: >-
  Bir şey neredeyse bitmiş olabilir. Hangi son adım ya da açık uç dikkatini hak ediyor?
meaningUpright: |-
  Dünya, Büyük Arkana’nın son kartı, Deli ile başlayan yolculuğun sonudur. Tamamlanmanın ve bütünlüğün kartıdır: parçaların bir araya geldiği, bir döngünün yaşanıp bittiği ve şimdilik şu ana kadar yaşadığın hikâyede kendini evinde hissettiğin duygusu.
  Gündelik hayatta bu kart, uzun bir projeyi bitirmeyi, uğruna çalıştığın bir hedefe ulaşmayı ya da yalnızca hayatında ve bedeninde kendini evinde hissetmeyi yansıtabilir. Bütünleşmeye işaret edebilir: kolay olanlar ve zor olanlarıyla pek çok deneyimin derslerini kim olduğuna dair tek bir duyguda bir araya getirmek. Buradaki aidiyet bir topluluğa, bir yere ya da kendine ait olmak anlamına gelebilir.
  Bu kart, neler başardığını düşünmeye ve bunu kutlamaya davet eder. Bu döngü başladığından beri nasıl değiştiğini ve bir sonrakine neyi taşımak istediğini sorabilirsin. Dünya, tamamlanmanın durmak anlamında bir son olmadığını öne çıkarır. Yeni bir yolculuk başlamadan önceki bir doluluk anıdır.
meaningReversed: |-
  Ters geldiğinde Dünya, neredeyse tamamlanmış ama tam da tamamlanmamış bir döngüyü yansıtabilir. Birkaç açık uç, söylenmemiş bir veda ya da son bir görev, bitmiş hissetmeni engelliyor olabilir. Bir şey seni hâlâ yerinde tutarken ilerlemeye hazır olduğunu sezebilirsin.
  Bu kart, kapanışı başka yerlerde aramaya, kestirmeler peşinde koşmaya ya da işleri başkalarının senin yerine toparlamasını ummaya da işaret edebilir.
  Tamamlanmış hissetmene yardım edecek bir ya da iki şeyi belirlemek isteyebilirsin. Bu pratik bir görevi bitirmek, birine teşekkür etmek, bir hayal kırıklığını kabullenmek ya da yalnızca ne kadar yol aldığın için kendini takdir etmek olabilir. O son adımı bilinçli olarak atmak, neredeyse bitmiş bir şeyi gerçek bir sona dönüştürebilir.
aspects:
  relationshipsUpright: >-
    İlişkilerde Dünya, bir bağın kendi hâline kavuşmuş gibi olduğu bir doyum ve karşılıklı anlayış duygusunu yansıtabilir. Birlikte kurduğunuz şeyin kıymetini bilmeye ve ortak dönüm noktalarını kutlamaya davet edebilir. Buradaki ilişkiler hem yakınlığa hem de bireysel özgürlüğe yer olan bütünlüklü bir his verir.
  relationshipsReversed: >-
    Ters geldiğinde bu kart, bir ilişkide çözülmemiş bir şeye, bitirilmemiş bir konuşmaya ya da kapanmamış bir bölüme işaret edebilir. İkinizin de huzur bulmasına neyin yardım edeceğini düşünebilirsin; bu bir şey söylemek de olabilir, söylenmiş olanı kabullenmek de.
  workUpright: >-
    İşte ya da bir projede Dünya, tamamlanmayı ve takdir görmeyi öne çıkarır. Önemli bir işi bitirmeyi, bir dönüm noktasına ulaşmayı ya da rolünün sana iyi oturduğunu hissetmeyi yansıtabilir. Bir sonraki işe başlamadan önce senin ve başkalarının neler başardığını kabul etmek için zaman ayırabilirsin.
  workReversed: >-
    Ters geldiğinde Dünya, son aşamada takılı kalmış bir projeyi ya da bitiş çizgisine tam ulaşamama hissini yansıtabilir. Geriye kalanları listeleyip bunların gerçekten yapılması gerekip gerekmediğine ya da bırakılabileceğine karar verebilirsin. Küçük ve odaklı bir çaba işleri temiz bir şekilde kapatmaya yardım edebilir.
  growthUpright: >-
    Bir sonraki hedefe uzanmadan önce ne kadar yol aldığını görmek yardımcı olabilir. Yakın zamandaki bir bölümün derslerini, zorluklarını ve sevinçlerini düşünüp bunların kendine dair daha dolgun bir tabloda nasıl bir araya geldiğini fark edebilirsin. Bütünleşme sessiz bir başarı biçimidir.
  growthReversed: >-
    Ters geldiğinde Dünya, tamamlanmış hissetmek için neye ihtiyaç duyduğunu sorabilir. Bir huzursuzluğu ya da eksiklik hissini yansıtabilir. Bitirmeyi düşündüğün bir şeye ad verip ona tüm dikkatini verebilir, ardından o döngüyü kapatmanın nasıl hissettirdiğini fark edebilirsin.
