# Canonical card, suit, arcana and position names and key terms in the 12
# locales (01 §11 step 2; GLOSSARY.md §1, §2; RC94). Not bundled: it is an input
# of `tools/content validate` / `build` / `translate`
# (apps/taro/content/source/README.md "glossary.yaml").
#
# - Every card file's `name` must equal `cards.<cardId>.<locale>` exactly.
# - `review.<locale>` is that locale's review state (taro_core ReviewStatus):
#   `machine` = drafted by an LLM, not yet checked by a person; `reviewed` = a
#   person checked every entry of that locale (docs/content/REVIEW_CHECKLIST.md
#   "Glossary review"). `tools/content translate` needs the target locale to be
#   `reviewed` (01 §11: glossary 100 % reviewed before card translation).
# - en: card names are the traditional RWS names fixed by GLOSSARY §1; the
#   position names and key terms are an LLM draft. The owner flips `en` to
#   `reviewed` at the Batch 0 sign-off (PHASE_05 Sprint 5.3).
# - Other locales: LLM drafts of the established traditional names, for native
#   review in Phase 18. The `check first:` comment under each `review` entry
#   lists the choices a reviewer should check first (alternatives in use).
# - Position names here are for translation consistency; the names and
#   descriptions shown in the app are ARB keys
#   (spread_{spreadId}_pos_{positionId}_name/_desc) and must use these terms.
#
# Values are double-quoted, single-line strings. Locale order: en ar de es fr
# it ja ko nl pt tr uk.


review:
  en: machine        # owner sign-off at Batch 0 -> reviewed
  ar: machine        # needs native review (Phase 18)
  #   check first: Judgement = الحكم (alternatives: البعث); 2-10 use "<n> من <suit>", ace/courts the construct state; Page = تابع; Pentacles = العملات.
  de: machine        # needs native review (Phase 18)
  #   check first: Page = Bube (many RWS editions keep "Page"); Pentacles = Münzen (alt. Pentakel); Temperance = Die Mäßigkeit.
  es: machine        # needs native review (Phase 18)
  #   check first: Page = Sota; Pentacles = Oros; High Priestess = La Sacerdotisa (alt. La Suma Sacerdotisa); position self = Uno mismo.
  fr: machine        # needs native review (Phase 18)
  #   check first: RWS-style names (Le Magicien, La Grande Prêtresse, Le Hiérophant, La Tour) rather than Marseille (Le Bateleur, La Papesse, Le Pape, La Maison Dieu); Fool = Le Mat per 01 §11; Pentacles = Deniers; minor pattern "<rang> de <couleurs>" in the plural.
  it: machine        # needs native review (Phase 18)
  #   check first: Traditional Italian names La Papessa and Il Papa (alt. La Sacerdotessa, Lo Ierofante); Il Mago (alt. Il Bagatto); Page = Fante; Pentacles = Denari.
  ja: machine        # needs native review (Phase 18)
  #   check first: Standard Japanese tarot names; minor pattern "<スート>の<ランク>" with half-width digits for 2-10; Page = ペイジ.
  ko: machine        # needs native review (Phase 18)
  #   check first: Minor pattern "<슈트> <랭크>" with digits for 2-10 and transliterated court ranks (페이지, 나이트, 퀸, 킹).
  nl: machine        # needs native review (Phase 18)
  #   check first: Page = Schildknaap (alt. Page); Chariot = De Zegewagen (alt. De Wagen); Pentacles = Pentakels.
  pt: machine        # needs native review (Phase 18)
  #   check first: pt-BR (05 §9.3). Page = Valete; Pentacles = Ouros; Upright = Normal (alt. Direita); position self = Eu interior.
  tr: machine        # needs native review (Phase 18)
  #   check first: Page = Prens (alt. Uşak/Vale); Hierophant = Başrahip (alt. Aziz); Judgement = Mahkeme (alt. Yargı); Temperance = Denge; minor pattern "<Asa|Kupa|Kılıç|Tılsım> <ranked suffix>".
  uk: machine        # needs native review (Phase 18)
  #   check first: Formal "Ви" (ARB register); Page = Паж; Pentacles = Пентаклі; genitive plural in minor names (Туз Жезлів).

