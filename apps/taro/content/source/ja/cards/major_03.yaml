shortUpright: "あなたの中か周りで、何かが育っています。このカードは、忍耐とぬくもりをもってそれを世話するよう促しています。"
shortReversed: "思いやりが外へばかり流れ、自分の泉が涸れかけているのかもしれません。その一部をどこで自分に戻せるでしょうか。"
meaningUpright: |-
  女帝は、世話をすることで起こる成長のカードです。女教皇が内側に耳を傾けるのに対し、女帝は外の生きた世界へと向かいます。庭、食事、手づくりのもの、おいしいパンや暖かな日差しの喜び。このカードは、プロジェクトであれ、住まいであれ、友情であれ、自分自身の心地よさであれ、何かを育む種類の創造性を表しています。
  日常では、このカードはつくることの季節を映しているのかもしれません。友人のために料理をしたり、また絵を描き始めたり、植物や人の世話をしたり、あるいはいつもより自分の体になじんでいると感じたりすることです。忍耐を示していることもあります。女帝は、成長にはそれぞれの時間がかかること、苗を引っぱっても早く育たないことを知っています。
  このカードは、あなたが何を育てているのか、そしてどのように育てているのかを考えてみるよう促しています。もう少しのやわらかさや美しさ、休息が、何かが花開く助けになるのはどこかを問いかけてみましょう。ここでの豊かさとは、たくさん持つことよりも、すでに周りで息づいているものに気づき、楽しむことです。
meaningReversed: |-
  逆位置の女帝は、バランスを失った思いやりを映しているのかもしれません。自分以外のすべての人やものにエネルギーを注ぎ続け、創造性が涸れたように感じたり、楽しいはずのことまで雑用のように思えたりしているかもしれません。あるいは、思いやりが過度な関与に傾き、あまりにしっかり握りしめるために、相手が自分らしく育つ余地がほとんどなくなっていることもあります。
  このカードは、止まってしまった創作プロジェクトや、いつもなら自分を落ち着かせてくれる素朴で身体的な心地よさから離れてしまっている状態を示していることもあります。
  自分の思いやりがどこへ向かっているのか、そしてその一部を自分のもとに戻せないかを見つめてみるとよいでしょう。滋養のある食事、ゆっくりとした散歩、ただ楽しむために何かをつくる数分間など、自分をいたわる小さな行いが、女帝の惜しみないエネルギーとふたたびつながるきっかけになるかもしれません。
aspects:
  relationshipsUpright: >-
    人間関係において、女帝はぬくもりや愛情、大切にされている感覚、あるいは惜しみなく誰かを大切にすることを映しているのかもしれません。一緒に食事をしたり、外で時間を過ごしたり、小さなやさしいしぐさを交わしたりして、ともに心地よさをつくるよう促しています。身近な人がどんなふうに気にかけてもらいたいのか、そして自分はどうなのかに気づいてみましょう。
  relationshipsReversed: >-
    逆位置の女帝は、関係の中の思いやりが一方通行になっていないか、あるいは心配が相手の選択を管理することにすり替わっていないかを問いかけているのかもしれません。どこで一歩引いて相手をもっと信頼できるか、そして自分に必要な思いやりを、どこでもっと素直に求められるかを考えてみましょう。
  workUpright: >-
    仕事や創作において、女帝は肥沃な土壌を照らしています。アイデアがすんなり育ち、チームや、いくつものプロジェクトの庭、ゆっくりと手応えのある手仕事を育んでいける時期を映しているのかもしれません。作業の場をもっと心地よくし、着実で辛抱強い注意から生まれる進歩を大切にするよう促しています。
  workReversed: >-
    逆位置のこのカードは、自分以外の全員のプロジェクトの面倒を見て燃え尽きていることや、どれだけ押しても動かない創作の行き詰まりを映しているのかもしれません。環境を変える、やることリストを短くする、不完全なものをつくることを自分に許すなど、仕事がふたたび滋養に感じられるには何が必要かを問いかけてみましょう。
  growthUpright: >-
    自己成長において、女帝は自分の体の中に、そして身体的な世界の中にいることを楽しむよう促しています。休息、おいしい食事、自然の中で過ごす時間、ささやかな楽しみは、ここではぜいたくではなく、充電の方法です。何が自分を地に足のついた、おおらかな気持ちにしてくれるかに気づき、そのための場所を少し広げてみましょう。
  growthReversed: >-
    逆位置の女帝は、あなたも人に向けるのと同じ忍耐を受けるに値する、とそっと思い出させてくれているのかもしれません。自分のニーズとのつながりを失っている感覚や、自分の創造的な価値を疑う気持ちを映していることもあります。自分だけのための小さくてやさしい習慣を一つ始めて、それが一週間をどう変えるか見てみるとよいでしょう。
reflectionQuestions:
  - "いまあなたの人生で育っていて、少し忍耐をもって見守りたいものは何ですか？"
  - "あなたはどんなふうに大切にされたいですか？それを誰かに伝えたことはありますか？"
  - "今日、どんなささやかな楽しみのために時間をつくれそうですか？"
imageryNote: >-
  Taroの女帝は、晩夏の家庭菜園で、実りつつある野菜に囲まれてくつろぐ姿として描かれています。窓辺では焼きたてのパンが冷まされ、そばを小川が流れています。やわらかな織物と摘みたての果物の入ったかごは、心地よさと五感の喜びを感じさせ、花から花へと飛ぶミツバチは、たくさんの小さな世話の積み重ねによって起こる成長をほのめかしています。あたたかくゆったりとした雰囲気が、すでにそこにある豊かさに気づくよう見る人を誘います。
