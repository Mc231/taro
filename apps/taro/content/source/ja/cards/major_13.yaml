shortUpright: "ひとつの段階が閉じようとしているのかもしれません。何が終わり、どんな余白が残るのかに気づいてみませんか。"
shortReversed: >-
  何かが終わる準備ができているのに、自分の一部がしがみついているのかもしれません。握る手をゆるめるには何が助けになるでしょうか。
meaningUpright: |-
  その名前とは裏腹に、このカードは肉体の死についてのものではありません。日常的で人間らしい意味での終わり、つまりひとつの段階や役割、習慣、あるいは自分自身の見方が閉じていくことを語っています。新しい芽吹きの前に枝を払う秋のように、何かが始まるためには、終わる必要のあるものもあるのだと伝えています。
  日常では、このカードは住まいを離れること、講座を修了すること、プロジェクトから身を引くこと、あるいは昔の自分がもう合わなくなっていると気づくことを映しているのかもしれません。安堵、悲しみ、不確かさ、そしてわくわくする気持ちさえ入り混じることがあります。そのどれもが自然なものです。変容がきれいに進むことはめったになく、変化が何を可能にしたのかを理解するには、しばしば時間がかかります。
  このカードは、手放す準備ができているものは何かを考えてみるよう促しています。習慣からまだ抱えているものは何か、そしてそれを下ろしたらどんな余白が開けるかを問いかけてみましょう。死神は、終わりには、たとえ歓迎すべきものであっても、きちんと向き合う価値があることを照らし出しています。これまでのものを大切に見送ることで、次に来るかもしれないものへと向き直りやすくなります。
meaningReversed: |-
  逆位置の死神は、時間をかけて進んでいる終わりを映しているのかもしれません。ひとつの段階が終わったと感じながらも、まだそれにしがみついていることがあります。なじみのあるもののほうが未知のものより安全に感じられるからか、手放すことが自分の一部を失うように感じられるからかもしれません。
  このカードは、ひとつのはっきりした瞬間にではなく、表面の下でゆっくりと静かに進んでいる移行を示している場合もあります。すべての変化がきれいな区切りとともに訪れるわけではありません。
  自分が何にしがみついているのか、そしてしがみつくことが何を守っているのかに気づいてみるとよいでしょう。出さない別れの手紙を書く、引き出しを片づける、最後の日に印をつけるといった、区切りのための小さな儀式が助けになることもあります。急ぐ必要はありません。終わっていくものを悲しむことを自分に許すと、手放すことがもう少しやさしく感じられるかもしれません。
aspects:
  relationshipsUpright: >-
    人間関係において、このカードは関係のあり方の大きな変化を映しているのかもしれません。新しい段階、役割の移り変わり、あるいはもうどちらの助けにもならなくなったパターンの終わりです。誰かの身体の状態を示すものではありません。変わりつつあることを、正直さと思いやりをもって一緒に受け止めるよう促しています。
  relationshipsReversed: >-
    逆位置のこのカードは、二人ともすでに卒業した古い関係性にしがみついていることや、つながりが変わったことを受け入れにくい気持ちを示しているのかもしれません。その形がどんなものになるにせよ、関係が新しい形をとるのを許すために、自分に何が必要かを考えてみましょう。
  workUpright: >-
    仕事やプロジェクトにおいて、死神は完了と移行を照らしています。ある役割を終えること、プロジェクトを閉じること、役目を終えた働き方を引退させることを映しているのかもしれません。何を学んだのか、そして次の章へ何を持っていきたいのかを振り返ってみましょう。
  workReversed: >-
    逆位置の死神は、合わなくなったあとも、習慣から作業や役割や方法にとどまり続けていることを映しているのかもしれません。そのあとに来るものへの恐れを示している場合もあります。いまの状況がまだ与えてくれているものと、それが求めている代償を書き出して、そのバランスが何を伝えているかに気づいてみましょう。
  growthUpright: >-
    古い自己像は木の葉のように落ちていき、いままさに形づくられつつあるもののための余白をつくってくれます。かつては本当だったけれど、いまはもう当てはまらない自分についての思い込みに気づくかもしれません。それらを手放すことで、これからなろうとしている自分にもっと正直な、新しい自分のための場所が生まれます。
  growthReversed: >-
    逆位置の死神は、変化への恐れが、必要以上に狭い場所にあなたをとどめていないかを問いかけているのかもしれません。信頼に値する、ゆっくりと辛抱強い変容を映していることもあります。今週、手放す小さなものを一つ選び、そのあとでどんな気持ちになるかに気づいてみましょう。
reflectionQuestions:
  - "人生のどの章が、静かに閉じようとしているように感じますか？"
  - "親しい関係の中で、変わる準備ができていそうな古いパターンはどれですか？"
  - "どんな小さな儀式が、終わりを大切に区切る助けになりそうですか？"
imageryNote: >-
  Taroの死神は、ゆるやかな川が落ち葉を運び、地平線に昇る太陽へと向かっていく、静かな秋の風景として描かれています。マントをまとった人物が急がずに水辺を歩き、種のさやか葉の落ちた枝を一本持っています。それは終わるものと、育つのを待つものの象徴です。暗い背景に浮かぶ白い花は、解放の中にある再生を感じさせるのかもしれません。穏やかで敬意に満ちた雰囲気が、喪失ではなく変容を指し示しています。
