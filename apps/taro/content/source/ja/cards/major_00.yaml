shortUpright: "確かさよりも好奇心を携えて、新しいことへ踏み出す一歩。"
shortReversed: "崖の手前での立ち止まり。それは慎重さでしょうか、それとも愚かに見えることへの恐れでしょうか。"
meaningUpright: |-
  愚者は大アルカナのいちばん最初、番号ゼロに立っています。まだ何の教訓も学んでいない段階です。軽い荷物と晴れやかな表情で旅に出る人のエネルギーであり、道の終わりを正確に知ることよりも、道が何を見せてくれるかに関心を向けています。
  日常では、このカードは新しい土地での最初の一週間や、極めるつもりもなく始めた趣味、台詞を一つひとつ準備せずに始める会話などを映しているのかもしれません。誰にも差し出せない確かさを求める自分がいる一方で、試してみる準備ができている自分もいる、ということを示しているのかもしれません。ここでは、知らないことは欠点ではありません。どんな旅もそこから始まるのです。
  このカードは、どこにもう少し軽やかさがあると助けになるかを考えてみるよう促しています。もう一度初心者に戻り、基本的な質問をし、やりながら学ぶことを自分に許したら、何が変わるでしょうか。愚者は常識を無視するよう求めているのではありません。間違えることへの恐れが、一歩を踏み出すことそのものを妨げていないか、気づいてみるよう求めているのです。
meaningReversed: |-
  逆位置の愚者は、新しい始まりの火花がまだうまく燃え移っていない状態を表しているのかもしれません。何か新しいものに心ひかれながらも、じっと立ち止まり、考えをあれこれ転がしながら、動いても大丈夫だというサインを待っているように感じることがあるでしょう。その待機が賢明なこともあれば、いつの間にか習慣になっていることもあります。
  このポジションは、反対の傾きを映していることもあります。足元を見ずに先へ急ぎ、何にでもイエスと言って、自分がどこに着地するのかに気づく余裕がほとんどないエネルギーです。どちらの傾きにも、準備ができているか、信頼できるかという問いが共通しています。
  いまの自分にはどちらが近いか、問いかけてみるとよいかもしれません。踏みとどまっているなら、小さくて気軽に試せる方法は何でしょうか。急ぎすぎているなら、熱意はそのままに、次の跳躍の前にひと呼吸おくとしたら、どんな形になるでしょうか。
aspects:
  relationshipsUpright: >-
    人間関係において、愚者は遊び心のある、構えのない姿勢を映しているのかもしれません。台本なしで誰かと出会ったり、慣れ親しんだ関係にもう一度驚かされたりすることです。身近な人に好奇心をもって接し、答えを知っているつもりのことをあえて尋ねてみるよう促しているのかもしれません。ここでの開かれた心は無邪気さではなく、物事がどう進むべきかを前もって決めずに、その場にいようとする意志です。
  relationshipsReversed: >-
    逆位置のこのカードは、誰かを心の中に迎え入れることへのためらいや、相手がついてこられないほど速く進んでしまうことを示しているのかもしれません。曖昧なままでいることで自分を守っていないか、あるいは誰かを知っていくゆっくりとした過程を飛ばしていないか、気づいてみるとよいでしょう。自分のペースと相手のペースについて穏やかに確かめ合うことで、ふたりのための余白が生まれるかもしれません。
  workUpright: >-
    仕事やプロジェクトにおいて、愚者は不慣れな何かの始まりを映しているのかもしれません。新しい役割、講座、まだ実績のない創造的なアイデアなどです。初期の失敗を判定ではなく情報として扱うよう促しています。最初の試みが粗くてもよいとしたら何を試すか、そして途中でコツを教えてくれそうな人は誰かを考えてみるとよいでしょう。
  workReversed: >-
    逆位置の愚者は、条件が完璧に整うまで先送りされ続けているアイデアや、基本を確かめずに踏み切った跳躍を映しているのかもしれません。必要なのはもっと多くの情報なのか、それとも少しの勇気なのかを考えてみましょう。考えうるいちばん小さな最初の一歩と、現実的な備えを一つ書き出してみると、漠然とした願いが、すべてを賭けずに試せるものに変わるかもしれません。
  growthUpright: >-
    自己成長において、このカードは初心を大切にします。守るべき評判のない何かを試してみるよう促しているのかもしれません。新しいスキル、いつもと違う帰り道、声に出して尋ねる質問などです。ここでの成長は、最初から何もかもうまくやることではなく、好奇心を持ち続け、驚かされることを自分に許すことから生まれます。
  growthReversed: >-
    逆位置の愚者は、ばかに見えることへの恐れが、あなたの世界を狭め始めていないかを問いかけているのかもしれません。また、新しいことから次の新しいことへと飛び移り、どれにも根を張らせない落ち着かなさを映していることもあります。どちらのパターンに覚えがあるかに気づき、一週間ほど、その穏やかな反対を試してみるのもよいでしょう。
reflectionQuestions:
  - "初心者でいることが許されるとしたら、何を試してみたいですか？"
  - "あなたの身近で、小さなリスクを取りやすくしてくれるのは誰ですか？それはなぜでしょうか？"
  - "今週踏み出せる、気軽な最初の一歩は何ですか？"
imageryNote: >-
  Taroの愚者は、目の前に開けた空が広がる高い場所の縁で、小さな包みだけを持ち、歩みの途中にいる姿として描かれています。足元にいる小さな動物の連れは、遊び心とも用心ともとれる本能を表しているのかもしれません。一輪の白い花は無垢さと開かれた心を、広い地平線と朝の光は可能性を語っています。上を向いた顔は、この人物が何を見つめているのか、そして何をあえて持たずに来たのかを問いかけてきます。
