  growthReversed: >-
    逆位置のカードは、厳しく、喜びのないものになってしまった自己改善や、意味を失ったまま続いている習慣を映しているのかもしれません。自分は何になろうとしているのか、そしていまの習慣がいまもそれに役立っているかを問いかけてみましょう。不完全で好奇心に満ちた学び手でいることを自分に許すほうが、プレッシャーよりも長く成長を支えてくれることが多いものです。
