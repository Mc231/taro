  relationshipsReversed: >-
    逆位置のカードは、日々のくり返しで動いていて、思いやりが注意よりも習慣で表されている関係を示しているのかもしれません。うまくやろうとしすぎて、気楽さがなくなっていることを映している場合もあります。新しいことを尋ねる、違う時間の過ごし方を試す、物事がどう見えるべきかの基準をゆるめるなどして、少しの好奇心を取り戻してみましょう。
  workUpright: >-
    仕事において、ペンタクルの8は勤勉さとスキルの向上を照らしています。学びの段階、いわば見習い期間にいるのかもしれませんし、よい仕事をすることの満足をただ楽しんでいるのかもしれません。フィードバックを求め、深く集中するための時間を守り、着実な練習を通して自分の力がどれほど育ったかに気づいてみましょう。
  workReversed: >-
    ここでのカードは、機械的にこなされる作業や、プレッシャーの下で落ちていく質、すべてを遅らせる完璧主義を映しているのかもしれません。締め切り、期待、自分のエネルギーなど、仕事を取り巻く条件を見つめてみましょう。そのうちの一つを調整したり、役割の中に新しい挑戦を見つけたりすることで、技の感覚が戻ってくるかもしれません。
  growthUpright: >-
