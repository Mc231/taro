shortUpright: "まだすべてがはっきりしていなくても大丈夫です。ゆっくり進み、自分の感覚を信頼してみませんか。"
shortReversed: "霧が晴れ始めているのかもしれません。以前よりはっきり見えるようになったものは何でしょうか。"
meaningUpright: |-
  月は、あいだにあるもののカードです。輪郭までは見せずに形だけを浮かび上がらせる光。このやわらかな光の中では、物事は昼の光で見るよりも大きく、奇妙に、あるいは不思議に見えることがあります。このカードは、夢、気分、想像力、そして自分がどこに立っているのかよくわからない、落ち着かない感覚について語っています。
  日常では、このカードは欠けたピースのある状況や、名前をつけられない気持ち、朝よりも夜のほうが大きく感じられる心配事を映しているのかもしれません。論理だけではあまり助けにならず、直感や夢、創作が手がかりを与えてくれるかもしれない時期を示していることもあります。ここでの不確かさは警告ではありません。まだ全体を見渡せない道を歩むことの、ごく自然な一部なのです。
  このカードは、何が現実で、何が想像かもしれないかを考えてみるよう促しています。自分の恐れのうち、どれが事実にもとづいていて、どれが自分に言い聞かせてきた物語にもとづいているのかを問いかけてみましょう。月は、曖昧さとともにいる忍耐を照らしています。霧の中にいるときは、ゆっくり進み、自分の本能に耳を傾け、大きな決断の前にもう少し光が差すのを待つことが、賢明な歩み方になりえます。
meaningReversed: |-
  逆位置の月は、混乱が晴れ始めていることを映しているのかもしれません。ぼんやりしていたものが焦点を結び始めていたり、避けてきた心配事にまっすぐ目を向ける準備ができていたりすることがあります。見えてくる姿が心地よいものばかりではないとしても、それは安堵をもたらしてくれるかもしれません。
  このカードは、心が仕掛けるいたずらを示している場合もあります。自分に都合のよい物語を言い聞かせたり、不安な考えを堂々巡りさせたりすることです。こうしたパターンに気づくこと自体が、明晰さへの一歩です。
  確かにわかっていることと、推測していることを書き出してみるとよいでしょう。紙の上でその違いを見ると、心配事が本来の大きさに縮むことがあります。道を信頼するのに、道のすべてが見えている必要はありません。次の一歩が見えていて、それを丁寧に踏み出せれば十分なこともあります。
aspects:
  relationshipsUpright: >-
    人間関係において、月は自分の立ち位置や、相手の気持ちについての不確かさを映しているのかもしれません。わからない部分を思い込みで埋めていないか気づくよう促しています。やさしく率直な問いかけと忍耐が助けになり、結論を急がずに自分の感情の反応に目を向けることも役立ちます。
  relationshipsReversed: >-
    逆位置のこのカードは、誤解が解け始めていることや、誰かについて自分が語ってきた役に立たない物語に気づくことを示しているのかもしれません。実際に何が本当なのかを確かめるために正直に話し合い、相手の側の言い分にも場所をあけることを考えてみましょう。明晰さはたいてい少しずつ訪れ、正直なやりとりのたびに、ひとかけらずつ増えていきます。
  workUpright: >-
    仕事やプロジェクトにおいて、月は曖昧さを照らしています。目標が不明確だったり、情報が揺れ動いていたり、創作の過程がまだ形を見つけていなかったりする状態です。しばらくのあいだ、わからないままでいることに耐えるよう促しているのかもしれません。想像力豊かなブレインストーミングはここでよく育ちますが、確かな約束は、もっとはっきりするまで待ったほうがよいかもしれません。
  workReversed: >-
    逆位置の月は、新しい情報が届いて混乱が晴れていくことや、誤解に向き合う機会を映しているのかもしれません。未解決の問いを書き出し、はっきりとした答えを求めてみましょう。最悪の事態ばかり考えている自分に気づき、もっと穏やかな見方を選ぶことを示している場合もあります。はっきりとした事実は、次の決断を軽くしてくれることが多いものです。
  growthUpright: >-
    月のもとでは、夢や想像力、心のあまり理屈っぽくない部分を探ってみる価値があります。ジャーナルを書いたり、遊ぶように創作したりすることは、それらに耳を傾ける助けになります。自分の気分とそのパターンに気づき、それらを命令ではなく情報として扱ってみましょう。
  growthReversed: >-
    逆位置の月は、事実よりも不安があなたの見方を形づくっていなかったかを問いかけているのかもしれません。心配事を見通す力が育ちつつあることを映している場合もあります。恐れを抱かせる考えが浮かんだら立ち止まり、もっと落ち着いた友人ならかわりに何に気づくだろうかと問いかける練習をしてみましょう。時間とともに、その立ち止まりが、より落ち着いた習慣になっていきます。
reflectionQuestions:
  - "いまの心配事のうち、事実にもとづいているのはどれで、推測にもとづいているのはどれですか？"
  - "どこで、誰かについての思い込みで沈黙を埋めているかもしれませんか？"
  - "ほかが霧に包まれていても、はっきり見えている次の小さな一歩は何ですか？"
imageryNote: >-
  Taroの月は、岸辺の背の高い葦の間を抜ける小道の上に、流れる雲に半ば隠れた淡い月が浮かぶ姿として描かれています。小道はところどころできらめき、ところどころで消えているため、旅人はゆっくりと進みます。浅瀬にじっと立つサギは辛抱強い注意を表しているのかもしれず、水面のさざ波は、深いところから湧き上がる感情をほのめかしています。銀色の光、やわらかな影、ぼやけた輪郭が、不確かな旅路で自分の感覚を信頼するよう見る人を誘います。
