imageryNote: >-
  絵には、家か中庭へと続くアーチの下に集まった、さまざまな年齢の人々が描かれているのかもしれません。近くには動物たちが休み、十枚の硬貨が場面全体に模様のように配されています。アーチは私的な暮らしと分かち合う暮らしの境目を、年齢の混ざり合いは連続性を、模様を描く硬貨は時間をかけて築かれた仕組みを象徴しているのかもしれません。あたたかく落ち着いた色が居場所を感じさせる一方で、にぎやかな構図は、どの家庭の内側にもある複雑さをほのめかしています。
