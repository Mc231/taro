shortUpright: "あなたにとって大切な立場を守っているのかもしれません。このカードは、しっかり立ち続けるための勇気をたたえています。"
shortReversed: "すべてを一度に守ろうとすると、疲れ果ててしまいます。本当に守る価値のある場所はどこか選んでみませんか。"
meaningUpright: |-
  ワンドの7は、高い場所に立つ人物が、下から突き上げてくる何本もの杖に対して一本の杖で立ち向かう姿を描いています。楽な立場ではありませんが、有利な点もあります。このカードは信念についてのカードです。信じることのために立ち上がること、努力して得たものを守ること、周りから押し返されても足場を保つこと。
  グループの中で人気のない意見を口にするとき、何度も試してくる相手との境界線を守るとき、周りが疑っているプロジェクトを続けるときなどに、このカードは現れるかもしれません。ある程度の成功にたどり着いたことで、それに挑んだり疑問を投げかけたりしたがる人が増えたと気づくこともあるでしょう。
  このカードは、自分自身の強さと、その強さに目的を与えている価値観に気づくよう促しています。しっかり立つことに攻撃性は必要ありません。それは落ち着いていて、穏やかで、明確なものでありえます。自分が具体的に何を守っているのか、それはなぜ大切なのかを問いかけてみましょう。そうすれば、エネルギーは通りすがりのあらゆる挑戦にではなく、自分にとって大切なものに向かいます。
meaningReversed: |-
  逆位置のワンドの7は、多勢に無勢だと感じていることや、疲れ果てていることを映しているのかもしれません。長いあいだ一つの立場を守ってきて、その努力の疲れが見え始めているのかもしれません。あるいは、本当は誰も攻撃していないときでさえ、身構えている自分に気づくかもしれません。
  このカードは、考え直すときを示している場合もあります。すべての挑戦に答える必要はなく、すべての立場を永遠に守る必要もありません。一つの戦いを手放すことで、より大切な戦いのためのエネルギーが生まれることがあります。
  どこで、なぜ押し返しているのかを見直してみるとよいでしょう。どの境界線が自分の価値観を守っていて、どれが防御的な習慣になっているでしょうか。支えを求めたり、休むために一歩引いたり、ひとりで丘を守るのではなく、周りの人と重荷を分かち合ったりすることが助けになるかもしれません。
aspects:
  relationshipsUpright: >-
    親しい関係において、このカードは、多少の摩擦が生じても自分のニーズのために声を上げることを映しているのかもしれません。大切な人を守ることを示している場合もあります。ぬくもりをもって境界線を保つ方法を考えてみましょう。自分にとって大切なことをはっきり伝えながらも、相手の視点のための余白を残しておくことです。
  relationshipsReversed: >-
    逆位置では、ある人に対していつも身構えていると感じていたり、どの会話も議論になってしまったりしているのかもしれません。自分が守っているのは、本当の批判からなのか、それとも古い恐れからなのかに気づいてみましょう。もう少しやわらかな接し方や、応じる前のひと呼吸が、より正直なやりとりのための余白を開いてくれるかもしれません。
  workUpright: >-
    仕事や創作のプロジェクトにおいて、ワンドの7は、競争や批判、変わりゆく要求といった重圧の中で、基準やアイデアを守り抜くことを示しているのかもしれません。落ち着いた自信をもって話せるよう、理由と根拠をまとめておきましょう。ここでの粘り強さは、自分が何を守っていて、なぜそれが大切なのかが明確であることから生まれます。
  workReversed: >-
    逆位置では、すべての挑戦や依頼がどれも同じくらい緊急であるかのように応じて、手一杯になっているのかもしれません。本当に自分が立ち向かう必要のある問題を一つか二つ選び、ほかはひとまず手放してみましょう。同僚や協力者に後押しを頼むことで、難しい立場も守りやすくなります。
  growthUpright: >-
    たとえ短いあいだでも自分の立場を守れたことは、認める価値のある回復力の証です。あなたには、思っている以上に自分の価値観を貫く力があります。しっかり立ち続けられたときのことを思い出し、明確な理由や支えてくれる人、安定した日課など、そのとき何が助けになったかに気づいてみましょう。
  growthReversed: >-
    逆位置では、常に警戒し続けている感覚を抱えているのかもしれません。それがどこから来ているのか、そしていまも自分の役に立っているのかを探ってみる価値があります。戦う場を選ぶことはあきらめではありません。本当に大切なときに勇気を発揮できるよう、エネルギーを守る方法なのです。
reflectionQuestions:
  - "いま、あなたは何のために立ち上がっていますか？それはなぜ大切なのでしょうか？"
  - "より大きな戦いのためにエネルギーを守るとしたら、どの小さな戦いを手放せそうですか？"
  - "この立場をひとりで守らなくてすむよう、誰がそばに立ってくれそうですか？"
imageryNote: >-
  岩場の小高い場所にひとりの人物が立ち、足場は不ぞろいなまま両足を踏みしめ、一本の杖を両手で掲げています。崖の縁の下からは六本の杖が突き上げています。不ぞろいな足場は、信念がいつも心地よいとは限らないことを、高い場所は努力によって得た確かな見晴らしを表しています。下の杖は挑戦や疑問、ぶつかり合う声を、揺るがない握りは価値観に根ざした勇気を表しているのかもしれません。
