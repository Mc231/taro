shortUpright: "大切にしているものに沿って、心と頭の両方で選ぶ選択。"
shortReversed: "自分の一部はあるものを望み、別の一部は違うものを望んでいるのかもしれません。選ぶ前に、両方の声に耳を傾けてみませんか。"
meaningUpright: |-
  恋人のカードはロマンスのカードとして読まれることが多いですが、その奥にあるテーマは調和です。二つの部分、二人の人、二つの道が、ひとつにまとまったと感じられる形で出会うこと。このカードは、あなたが何をいちばん大切にしているのか、そして目の前の選択がそれを映しているかを問いかけます。ここでのつながりは、他者とのつながりであると同時に、自分自身とのつながりでもあります。
  日常では、このカードは本当に理解されていると感じられる関係や、アイデアがすんなり流れる仕事上のパートナーシップ、あるいは自分にとって何が大切かをはっきり言葉にする必要のある決断を映しているのかもしれません。明らかな正解はなく、これからなろうとしている自分に合うものがあるだけの、二つのよい選択肢から選ぶ瞬間を示していることもあります。
  このカードは、自分自身や他者に対してどれほど正直でいるかを考えてみるよう促しています。自分が何にひかれているのか、それはなぜか、そして何に本気で取り組むつもりがあるのかを問いかけてみましょう。恋人のカードは、意味のある選択が完璧さの問題であることはめったにないと照らし出しています。大切なのは、心と判断力を同じ部屋に招き入れ、互いに話をさせることなのです。
meaningReversed: |-
  逆位置の恋人は、二つの方向に引っぱられている感覚を映しているのかもしれません。望んでいることと、望むべきだと思っていることが一致していなかったり、親しい関係がどこか少しずれていて、互いに口に出さないまま違うものを大切にしていたりすることがあります。
  このカードは、先送りされ続けている決断を示していることもあります。一つを選ぶことが、もう一つを手放すことを意味するからかもしれません。選択を避けることは、短期的には楽に感じられても、静かにエネルギーを奪っていきます。
  それぞれの選択肢が正直なところ何を与えてくれて、何を求めてくるのか、そしてあなたのどの価値観を支えるのかを書き出してみるとよいでしょう。いちばん自分らしくいられると感じるのはどこかに気づくことも助けになります。調和を取り戻すことは、多くの場合、まず自分に、そしてしっくりくるなら誰かに、小さな本音を認めることから始まります。
aspects:
  relationshipsUpright: >-
    人間関係において、恋人のカードは、恋愛でも友情でも家族でも、深い相互理解と、互いを選び合う喜びを映しているのかもしれません。自分が本当に大切にしていることを伝え、相手が大切にしていることにも耳を傾けるよう促しています。親密さは、お互いが正直でいながら、なお受け入れられていると感じられるときに育ちます。
  relationshipsReversed: >-
    逆位置のこのカードは、二人の願いや優先順位のずれや、まだ口にされていない気持ちを示しているのかもしれません。波風を立てないために合わせすぎていないか、あるいは自分に必要なことを相手が察してくれるのを期待していないか考えてみましょう。価値観についてオープンでやさしい会話をすることで、互いの立ち位置が見えてくるかもしれません。
  workUpright: >-
    仕事やプロジェクトにおいて、恋人のカードは協力と、価値観に根ざした選択を照らしています。お互いのよさを引き出すパートナーシップや、どの方向に進むかについての決断を映しているのかもしれません。どの選択肢が現実的であると同時に意味があると感じられるかを問いかけ、その両方を選択の判断材料にしてみましょう。
  workReversed: >-
    逆位置の恋人は、パートナーシップの摩擦や、自分の仕事が大切にしていることと合っていないという感覚を映しているのかもしれません。二つの道のどちらを選ぶかのためらいを示していることもあります。それぞれの道があなたに何を求めるかを書き出し、どちらにならそれを差し出してもよいと思えるかに気づいてみましょう。
  growthUpright: >-
    自分の価値観をよりはっきり知ることが、このカードの示す内面の取り組みです。何が自分にとって大切かがわかると、選択は人を喜ばせることよりも、自分に正直でいることに近づいていきます。三つの価値観を書き出して、それらがすでに日々をどこで導いているかに気づいてみましょう。
  growthReversed: >-
    逆位置の恋人は、内なる葛藤を映しているのかもしれません。変化を望む自分と、心地よさを望む自分がいるのです。どちらも間違ってはいません。紙の上でも会話の中でも、それぞれに声を与え、たとえ部分的にでも両方を大切にできる選択がないか探ってみましょう。
reflectionQuestions:
  - "いま、いちばん大切にしたい価値観はどれですか？"
  - "親しい関係の中で、自分の望みについてもう少し正直になれるのはどこですか？"
  - "先送りしてきた選択は何ですか？それを決めるには何が助けになりそうですか？"
imageryNote: >-
  Taroの恋人は、細い小川の両岸に立つ二人の人物が、流れ越しに手を取り合おうとしている姿として描かれています。誰もがどちらの人物にも自分を重ねられるように描かれています。頭上では、二羽の鳥が同じ明るい空を旋回しています。片方の岸には果樹が、もう片方には花をつけたつる草が育ち、二つの異なる恵みが真ん中で出会っています。小川は、本当のつながりが二人に求める選択と努力を表しているのかもしれません。
