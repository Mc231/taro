shortUpright: "ある習慣や執着が、思っている以上に強くあなたをとらえているのかもしれません。それに気づくことが最初の一歩です。"
shortReversed: "かつて強くとらえていたパターンが、ゆるみ始めているのかもしれません。さらに距離をとるには、何が助けになるでしょうか。"
meaningUpright: |-
  悪魔は悪についてのカードではありません。私たちをとらえうるパターンや執着、しかも多くの場合、自分自身が黙って同意しているそれらについてのカードです。伝統的な絵では、二人の人物がゆるく鎖につながれていて、その鎖はたいてい、するりと外せるほどゆるいのです。このカードは問いかけます。あなたをここにとどめているものは何か、そしてそのうちどれだけが自分の選択なのか、と。
  日常では、このカードは夜遅くまでスクロールし続けること、誰かをがっかりさせるのが怖くてイエスと言うこと、あとでかえってむなしくなるような形で承認や心地よさを追い求めること、離れるのが不確かに思えるからという理由で、もう役に立たない日課にとどまることを映しているのかもしれません。嫉妬や恨み、欲望など、目を向けたくない自分の一部を示していることもあり、それらは無視されるほど強くなりがちです。
  このカードは、望む以上にあなたに力を及ぼしているものは何かを考えてみるよう促しています。ある習慣がどんなニーズを満たそうとしているのか、そしてそれを満たすもっとやさしい方法はないかを問いかけてみましょう。悪魔は、恥じることなく自覚することを照らし出しています。パターンをはっきり見つめた瞬間こそ、それがゆるみ始める瞬間であることが多いのです。
meaningReversed: |-
  逆位置の悪魔は、ゆるみを映しているのかもしれません。かつては断ち切れないと感じていた習慣や関係性、思い込みが、その力を失いつつあり、ほかの選択肢が見え始めているのかもしれません。それは安堵をもたらすと同時に、古いパターンのない自分は何者なのかという不確かさも伴うことがあります。
  このカードは、自分の影と向き合う取り組み、つまり難しい感情や動機を正直に見つめ、それを人間であることの一部として受け入れることを示している場合もあります。
  あなたをとらえていたものから、すでに踏み出した小さな一歩に気づいてみるとよいでしょう。何がそれを可能にしたのでしょうか。そうした支えをそばに置き、まだ引力が強いところでは助けを求めることで、変化がより長続きするかもしれません。自由は多くの場合、一つの選択ずつ、ゆっくりと育っていきます。
aspects:
  relationshipsUpright: >-
    人間関係において、悪魔は、どちらの側であれ、依存や嫉妬や支配のパターン、あるいは思いやりよりも習慣でつながっている関係を映しているのかもしれません。何が二人をつないでいるのか、そしてお互いが自由だと感じられているかを正直に見つめるよう促しています。パターンにやさしく名前をつけることが、それを変える余地を開いてくれます。
  relationshipsReversed: >-
    逆位置のこのカードは、不健全な関係性から一歩引くことや、これまで引きにくかった境界線を引くことを示しているのかもしれません。その境界線を保つためにどんな支えが必要かを考えてみましょう。隠れていた気持ちが表に出てきて、関係がより正直なものになっていくことを映している場合もあります。
  workUpright: >-
    仕事やプロジェクトにおいて、悪魔は何かに縛られている感覚を照らしています。長時間労働、承認されたいという欲求、あるいは主に変化への恐れからとどまっている役割などです。その状況から何を得ていて、何を代償にしているのか、そして小さな変化で選択の感覚を取り戻せないかを問いかけてみましょう。
  workReversed: >-
    逆位置の悪魔は、完璧主義や常に連絡がつく状態など、役に立たない仕事の習慣から抜け出すことを映しているのかもしれません。当たり前になっていたプレッシャーに気づくことを示している場合もあります。終業時刻や、時間外のメッセージに関する決まりなど、明確な境界線でこの新しい自由を守ってみましょう。
  growthUpright: >-
    悪魔は、シャドウワーク、つまり隠しがちな自分の一部をやさしく探っていく取り組みへの扉を開きます。やめられないと感じる習慣に気づいたら、裁くのではなく好奇心をもって、それが自分に何を与えようとしているのかを問いかけてみましょう。変化の前には、まず理解があります。
  growthReversed: >-
    逆位置の悪魔は、古い執着をゆるめることにおける前進を映しているのかもしれません。ここまでどれだけ歩んできたかを認めるときなのかもしれません。重い習慣や感情が何度も戻ってくるなら、信頼できる人や資格を持つ専門家に話すことが、道のりを着実に支えてくれることがあります。
reflectionQuestions:
  - "望む以上にあなたをとらえている習慣はどれですか？それはどんなニーズを満たしていますか？"
  - "親しい関係の中で、望むほど自由に感じられていないのはどこですか？"
  - "今週、古いパターンから一歩離れるために、どんな小さな一歩を踏み出せそうですか？"
imageryNote: >-
  Taroの悪魔は、角のある影のような人物が高い座にとまり、その座に、だらりとゆるんだ鎖で二人の小さな人物がつながれている姿として描かれています。鎖は二人の手首の周りではっきりとゆるく描かれていて、それを持ち上げて外せることに見る人が気づくよう誘っています。ほの暗い松明の明かりと深い土の色調が重い雰囲気をつくる一方で、場面の端にかすかに見える光の戸口は、別の道が見つかるのを待っていることをほのめかしています。
