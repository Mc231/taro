shortUpright: "小休止も仕事の一部です。いまは物事を下ろして、心を静かにするときなのかもしれません。"
shortReversed: >-
  休息が先延ばしにされ続けているのかもしれませんし、静かな時期が終わりを迎えようとしているのかもしれません。どちらがしっくりくるか気づいてみましょう。
meaningUpright: |-
  ソードの4は、意図的な休息のカードです。刃は失われたのでも壊れたのでもなく、ただしばらくのあいだしまわれています。努力や対立、長いあいだ懸命に考え続けたあとには、心にも横になる場所が必要なのです。
  それは予定のない週末、画面を見ない夜、あるいはもう一つの約束を断ることとして現れるかもしれません。大変なことのあとの回復期、つまり何もしないことが最も役立つ時期を映していることもあります。静かな振り返り、つまり世界に戻る前に、ひとりで考えを整理する時間を示している場合もあります。
  立ち止まると感情や問いが浮かんでくるため、多くの人にとって休むことは働くことより難しいものです。このカードは、休息を、勝ち取らなければならないご褒美ではなく、ひとつの技術として考えてみるよう促しています。短いあいだでも、本当の静けさを自分に与えるとしたら、どんな形になるでしょうか。どんな休み方がすっきりさせてくれて、どんな休み方が気を散らすだけなのかに気づいてみましょう。本当に立ち止まることを自分に許したあとなら、世界に戻ることも、よりはっきりとしたものに感じられるはずです。
meaningReversed: |-
  逆位置のソードの4は、先延ばしにされ続けている休息を映しているのかもしれません。あと一つ作業を終えたらペースを落とそうと自分に言い聞かせながら、蓄えを削って走っているのかもしれません。落ち着かなさ、気持ちを切り替えられないこと、眠ったあとでも疲れていることは、耳を傾ける価値のあるサインかもしれません。
  反対の読み方もあります。十分に続いた休養と、活動に戻るためのやさしい準備です。かつては自分を回復させてくれた静けさが、いまは回避のように感じられ、世界に小さく一歩戻ることが、エネルギーを奪うのではなく与えてくれるのかもしれません。
  今日の自分の状況にどちらが当てはまるかを問いかけてみましょう。まだとっていない小休止が必要なのでしょうか、それともとってきた小休止から立ち上がる準備ができているのでしょうか。いずれにしても、誰かのペースではなく自分のペースに耳を傾けることが、次の一歩を導いてくれます。
aspects:
  relationshipsUpright: >-
    人間関係において、このカードは小休止を促しているのかもしれません。考えるために離れる時間、熱くなった話題からの休憩、あるいは話し合う必要のない静かな寄り添いです。言葉にされ、合意された距離は、思いやりになりえます。自分の静けさが引きこもりではなく充電だと理解してもらえるよう、少し休みが必要だと身近な人に伝えてみましょう。
  relationshipsReversed: >-
    逆位置のソードの4は、距離になってしまった小休止や、誰も息をつく余地のない関係を映しているのかもしれません。静かな時期のあとで、ふたたびつながるときなのか、それとも少し余白を求める必要があるのかを考えてみましょう。どちらのお願いも、やさしく、責めることなく伝えられます。
  workUpright: >-
    仕事において、このカードは計画的な小休止を示しているのかもしれません。休暇、軽めの一週間、大変なプロジェクトを終えたあとに一歩引くことなどです。休息は、続けられる努力の一部です。アイデアがひとりでに落ち着くよう、予定のない時間を守ってみましょう。押し続けている間には見つからなかった解決策が、まっすぐ見つめるのをやめたとたんに見えてくることはよくあります。
  workReversed: >-
    逆位置のこのカードは、疲れ果てたまま働き続けていることや、気持ちを切り替えられないことを映しているのかもしれません。休息がどこでリストの下へ下へと滑り落ちているかに気づいてみましょう。あるいは、休みのあとで新しい視点を持って戻る準備ができたことを示している場合もあります。小さく取り組みやすい作業から始めることで、無理なく少しずつ戻っていけます。
  growthUpright: >-
    自己成長において、ソードの4は休息の習慣を築くよう促しています。定期的な小休止、静かな朝、自然の中で過ごす時間などです。静けさは、考えがひとりでに整理される機会を与えてくれます。数分間、何もしないことを試してみて、何が浮かんでくるかに気づいてみましょう。休息は怠けではありません。エネルギーが戻ってくるための方法なのです。
  growthReversed: >-
    逆位置のこのカードは、立ち止まることに抵抗する落ち着かない心や、いつの間にか隠れ場所になっていた休養を映しているのかもしれません。この小休止が、いまも何かを与えてくれているか、やさしく自分に確かめてみましょう。休むことが不可能に感じられるなら、短い散歩や、ゆっくりとした呼吸から始めてもかまいません。動く準備ができているなら、やわらかく始めましょう。
reflectionQuestions:
  - "ただ時間を埋めるのではなく、本当にあなたを回復させてくれる休息とはどんなものですか？"
  - "静かな一日がほしいと頼んだら、理解してくれそうなのは誰ですか？"
  - "今週、静けさのための場所をつくるために、どんな約束を一つ脇に置けそうですか？"
imageryNote: >-
  このオリジナルの絵には、静かな丸天井の空間で、低い石のベンチに横たわって休む人物が描かれています。上の壁には三本の刃が静かに掛けられ、四本目はベンチの下に平らに置かれていて、どれもしまわれています。小さな窓からやわらかな光が差し込んでいます。閉ざされた部屋は安全な休み場所を、しまわれた刃はいまは脇に置かれた考えを感じさせ、やさしい光は、外の世界が辛抱強く待っていることをほのめかしています。
