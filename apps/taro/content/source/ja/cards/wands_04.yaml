imageryNote: >-
  まっすぐに立つ四本の杖が、葉や花やリボンの花綱で結ばれ、開かれた門をつくっています。その向こうでは人々が手を挙げて集まり、遠くには素朴な家か城壁に囲まれた町が見えます。四本の枠は努力によって築かれた安定した土台を、花綱は分かち合う喜びの実りを、そして開かれた門は、人を締め出すのではなく迎え入れる歓迎を表しています。
