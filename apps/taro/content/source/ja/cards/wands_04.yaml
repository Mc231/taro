  workReversed: >-
    逆位置では、節目が誰にも認められないまま過ぎてしまったり、チームが見かけほど落ち着いていなかったりするのかもしれません。誰かが言ってくれるのを待つのではなく、自分で前進に名前をつけてみましょう。あるいは、役割の明確化、共有の場、ここまで一緒に歩んできた道のりを振り返るひとときなど、チームがより安心できるには何が助けになるかを見てみましょう。
  growthUpright: >-
