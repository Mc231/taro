imageryNote: >-
  絵には、さまざまな年齢の人々のまわりに集まった十の杯が描かれ、人々は近くに家のある開けた風景を分かち合っています。緑の大地を流れる水は、共同体を支える心の滋養を感じさせます。広げた腕、つないだ手、一緒に踊る姿が、喜びとくつろぎを伝えています。明るくもやわらかな色が、ぬくもり、安心、そしてどこかよい場所にたどり着いたという感覚を映しています。
