shortUpright: "たくさんの可能性が一度にきらめいているのかもしれません。想像を楽しんだら、一つひとつをじっくり見てみませんか。"
shortReversed: "選択肢の霧が晴れつつあるのかもしれません。想像の輝きが薄れても、どの選択がまだ現実に感じられるか考えてみましょう。"
meaningUpright: |-
  カップの7ではよく、宙に浮かぶ杯の列に向き合う人物が描かれ、杯にはそれぞれ違う幻が入っています。これは想像力と可能性、そして選択肢が多すぎるときに訪れるめまいのような感覚のカードです。
  想像力は贈り物です。まだ生きていない人生や、誰も思いつかなかったアイデアを思い描かせてくれます。けれどもこのカードは、空想と計画がいかにたやすく混ざり合うかにも気づいています。杯の中には本当の機会もあれば、願いもあり、可能性の衣をまとった心配もあります。
  日常では、プロジェクトからプロジェクトへ飛び移ること、選ばないまま選択肢を延々とスクロールすること、最初の一歩のない夢に引き寄せられることなどの形で現れるかもしれません。このカードは、夢見ることを楽しみ、そのうえでもっと近くで見てみるよう促しています。どの選択肢が自分の価値観と実際の状況に合っているでしょうか。最初の小さな行動は何でしょうか。一つを選ぶことは、ほかを永遠に失うことではありません。何かに現実になる機会を与えることなのです。
meaningReversed: |-
  逆位置のカップの7は、混乱の時期のあとに訪れる明晰さを映しているのかもしれません。浮かんでいた杯が落ち着き始め、どれに中身があり、どれがほとんど霧だったのかが見えてくるかもしれません。それは安堵のようにも、いくつかの空想が色あせていく小さな落胆のようにも感じられるでしょう。
  逆のことを示している場合もあります。あらゆる可能性を開いたままにして選ぶことを避けたり、現実的であるという名目で想像力をすっかり退けたりすることです。
  ここでの誘いは、地に足のついた中間地点を見つけることです。選択肢を一つ選び、小さく気負わない形で試してみましょう。理屈の上でではなく、実際にやってみて何にわくわくするかに気づいてみましょう。空想を手放すことで、本当に生きられる計画のための場所が開け、夢見ることは、ひらめきを求めて立ち返る場所であり続けられます。
aspects:
  relationshipsUpright: >-
    人間関係において、このカードは誰かを理想化することや、ある人と一緒の、あるいはその人のいない、たくさんの未来を思い描くことを映しているのかもしれません。その人が実際にどんな人かと、こうであってほしいと願う姿との違いに気づくよう促しています。想像を楽しみながらも、それぞれが何を望んでいるかについての現実の会話に根を下ろしてみましょう。
  relationshipsReversed: >-
    逆位置のカップの7は、ロマンチックなもやが晴れたあとなどに、関係をよりはっきり見つめることを示しているのかもしれません。この明晰さは、現実にあるものの上に築いていく機会になりえます。最初に思い描いていたことではなく、いまその関係の何を本当に大切にしているのかを問いかけ、それを率直に伝えてみましょう。
  workUpright: >-
    仕事において、このカードはアイデアや選択肢があふれている状態を映しているのかもしれません。いくつものプロジェクトや進路、申し出が注意を奪い合っているのです。それぞれを、自分の優先順位、時間、エネルギーと照らし合わせて比べるよう促しています。並べて書き出してみると助けになります。想像力はアイデア出しには役立ちますが、決断にはもっと確かな足場が必要なことが多いものです。
  workReversed: >-
    逆位置のカードは、はっきりとした方向へ絞り込むことや、ついに一つのプロジェクトに本腰を入れることを映しているのかもしれません。集中力が戻ってくるのを感じるかもしれません。幻想から覚めたように感じるなら、もとのビジョンのどの部分が、より現実的で、より自分らしいものへと持っていく価値があるかを考えてみましょう。
  growthUpright: >-
    自己成長において、カップの7は自分の空想を理解するよう促しています。それぞれの空想は、どんな願いを表しているのでしょうか。くり返し浮かぶ空想についてジャーナルを書き、その下にある、自由や承認や休息といったニーズを探してみましょう。そのニーズを小さく現実的な形で満たすことは、夢そのものよりも満たされた気持ちをもたらしてくれることがあります。
  growthReversed: >-
    逆位置のこのカードは、願いと意図を見分ける力が育っていることを映しているのかもしれません。どんなに小さくても、毎日一つはっきりとした決断をする練習をしてみましょう。時間とともに、それは自分の判断への信頼を育て、想像力が気を散らすものではなく、ひらめきを与えるものであり続ける余地を残してくれます。
reflectionQuestions:
  - "いまの選択肢の中で、実際の一歩を踏み出すところを想像したときに、いちばん生き生きと感じられるのはどれですか？"
  - "何度も戻っていく空想の下に、どんな願いが隠れているのでしょうか？"
  - "想像することから行動することへ移るために、今週どんな小さな選択ができそうですか？"
imageryNote: >-
  絵には、後ろ姿の人物が、漂う霧の中に浮かぶ七つの杯に向き合う姿が描かれています。杯にはそれぞれ違う象徴が入っています。鍵、花冠、小さな家、星、とぐろを巻いた形、閉じた箱、鏡などで、それぞれ入り口、称賛、安心、希望、不安、秘密、自己像を表しているのかもしれません。夢のようなやわらかな光と移ろう色が、これらの幻がどれほど魅惑的で不確かであるかを感じさせ、どれが本物なのかと見る人に思いを巡らせます。
