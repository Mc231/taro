shortUpright: "ぬくもりと明晰さに満ちたひととき。人生の明るく開かれた部分を味わってみませんか。"
shortReversed: "雲が通り過ぎていても、光はそこにあります。あなたがあたたかく晴れやかな気持ちになれるのは、どんなときでしょうか。"
meaningUpright: |-
  太陽は、デッキの中でもとりわけ素直に喜びにあふれたカードのひとつです。晴れた朝、庭で遊ぶ子ども、何も隠す必要のない、まるごと自分でいられる感覚のエネルギーです。月の不確かさのあとに、このカードは明晰さをもたらします。物事をありのままに見ることができ、多くの場合それは、恐れていたよりも単純で、あたたかいものです。
  日常では、このカードは何もかもが少し楽に感じられる日や、自分がやり遂げたことへの誇り、気分を明るくしてくれる外での時間、受け入れられてくつろげる関係を映しているのかもしれません。大声で主張する必要のない自信や、笑い、日差し、遊びといった、人生を心地よくしてくれる素朴な楽しみを示していることもあります。
  このカードは、何が自分に心からの喜びをもたらしてくれるのか、そしてそのための場所をどう広げられるかを考えてみるよう促しています。どこでならもっと自分をまるごと見せられるかを問いかけてみましょう。太陽は、いまこの瞬間に根ざした楽観を照らしています。うまくいっていることを祝い、自分のぬくもりを分かち合い、それが自分に返ってくるのを受け取ってもいいのだと思い出させてくれます。
meaningReversed: |-
  逆位置の太陽は、喜びが少しくぐもって感じられる時期を映しているのかもしれません。ぬくもりは消えていません。忙しい予定や疲れ、自信のなさの陰に隠れているだけなのかもしれません。いつもより、よいひとときを楽しんだり、自分を誇らしく思ったりするのが難しく感じられることがあります。
  このカードは、明るさが過剰であることを示している場合もあります。本当は違う気持ちなのに明るい顔をしていたり、いつも前向きでいようと自分を追い立てたりすることです。
  外で過ごす時間や遊び心のある活動、笑わせてくれる人など、小さく素朴なぬくもりの源を探してみるとよいでしょう。感じるべきだと思う気持ちではなく、実際に感じている気持ちを感じることを自分に許すことも助けになります。心からの喜びは、無理に出そうとしないときのほうが戻ってきやすいものです。
aspects:
  relationshipsUpright: >-
    人間関係において、太陽はぬくもり、開かれた心、分かち合う幸せを映しているのかもしれません。笑ったり、遊んだり、外で過ごしたりして、大切な人たちと気負わない時間を楽しむよう促しています。お互いが自分らしくいられ、相手を祝福できると感じられるとき、関係は軽やかになります。
  relationshipsReversed: >-
    逆位置のこのカードは、ストレスや日々のくり返しの中で、関係が軽やかさを少し失っていることを示しているのかもしれません。一緒にシンプルで楽しいことを計画したり、誰かが明るい表情の陰に本当の気持ちを隠していないか確かめたりすることを考えてみましょう。軽やかさは、分かち合う小さなひとときを通して戻ってくることがあります。
  workUpright: >-
    仕事やプロジェクトにおいて、太陽は明晰さ、注目されること、熱意を照らしています。努力が認められる瞬間や、仕事がエネルギーを奪うのではなく与えてくれると感じられる時期を映しているのかもしれません。自信をもってアイデアを共有し、途中の進歩も楽しむことを自分に許してみましょう。
  workReversed: >-
    逆位置の太陽は、見過ごされていると感じることや、仕事への熱意を見つけにくいことを映しているのかもしれません。成果を求められるプレッシャーが強すぎるなど、まぶしすぎる状態を示している場合もあります。どんな小さな変化が、働く日々にもっとエネルギーとぬくもりをもたらしてくれるかを問いかけてみましょう。
  growthUpright: >-
    自己成長において、このカードは生まれ持った熱意や好奇心とふたたびつながるよう促しています。子どものころに好きだったことにもう一度触れてみたり、ただ楽しむために新しいことを試してみたりするのもよいでしょう。自信は、達成からだけでなく、喜びからも育っていきます。
  growthReversed: >-
    逆位置の太陽は、自分に厳しすぎたり、長いあいだ真面目すぎたりしなかったかを問いかけているのかもしれません。遊び、休息、軽やかさが必要であることを映している場合もあります。今週、楽しむこと以外に目的のない、小さな楽しい活動を一つ予定に入れてみましょう。
reflectionQuestions:
  - "どんなに小さくても、最近あなたに心からの喜びをもたらしてくれたものは何ですか？"
  - "誰と一緒にいるとき、いちばん自由に自分らしくいられますか？"
  - "今週、ただ楽しむためだけにできることは何でしょうか？"
imageryNote: >-
  Taroの太陽は、真昼の広い夏の野原として描かれています。大きくあたたかな太陽の下で、さまざまな年齢の友人たちが敷物の上で食べ物を分け合っています。凧がそよ風に舞い上がり、長い影はどこにも見当たらず、何も隠すもののないひとときを感じさせます。明るい黄色とあたたかなオレンジが場面を満たし、草の中を駆ける犬が遊び心を添えています。この絵は、ぬくもりと明晰さ、そして気負いのない喜びを感じるよう見る人を誘います。
