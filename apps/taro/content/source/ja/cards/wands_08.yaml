shortUpright: >-
  いま物事がすばやく動いているのかもしれません。滞っていたエネルギーがはっきりした方向を見つけています。丁寧に、その勢いに乗ってみましょう。
shortReversed: >-
  ペースやタイミングが、遅れや急ぎすぎでずれているように感じられるのかもしれません。立ち止まって、エネルギーがどこに向いているか確かめてみましょう。
meaningUpright: |-
  ワンドの8は、デッキの中で人物が描かれていない数少ないカードのひとつです。八本の杖が平行に開けた空を飛び、すべてが同じ方向へ向かっています。純粋な動き、つまりエネルギーが解き放たれ、物事がスピードをもって動き始める瞬間をとらえています。
  日常では、長い沈黙のあとで返事が次々と届くことや、計画のいくつもの部分が急にかみ合うこと、何時間も気づかないうちに過ぎていく集中の高まりのように感じられるかもしれません。旅や、テンポの速い会話、アイデアがすばやく積み重なっていくことを表す場合もあります。
  このカードは、勢いがあるうちにそれを生かすよう促しています。方向がはっきりしているときは、一歩一歩を考えすぎずに行動することが、心を自由にしてくれます。同時に、スピードには狙いが必要です。自分の努力がすべて本当に行きたい方向に向いているかを確かめ、返すべきものには返事をし、残りのエネルギーはあちこちに散らばらせるのではなく、自分を前へ運ぶのに任せてみましょう。
meaningReversed: |-
  逆位置のワンドの8は、止まってしまったり、もつれてしまったりした動きを映しているのかもしれません。返事が遅かったり、何かほかのことが起きるのを待って計画が積み上がっていたり、メッセージが途中で誤解されたりすることがあります。
  その反対を表している場合もあります。細部がこぼれ落ちるほど急いで先へ進んだり、何にでもイエスと言って、エネルギーがあらゆる方向に飛び散ってしまったりすることです。どちらにしても、タイミングが少しずれているように感じられます。
  意図的にペースを落とすときなのかもしれません。本当に急ぎなのは何で、急ぎに感じられるだけなのは何でしょうか。誤解されたかもしれないメッセージを一つはっきりさせたり、小休止を準備に使ったりしてみましょう。そうすれば、物事がふたたび動き出したとき、エネルギーは散らばらずに狙いを定められます。
aspects:
  relationshipsUpright: >-
    人間関係において、このカードは活発なコミュニケーションを映しているのかもしれません。頻繁なメッセージ、思いつきの予定、すんなり流れる会話です。勢いを増していく関係や、離れていた時間のあとで近況を伝え合うことを示している場合もあります。そのペースを楽しみながらも、大切なことは速くだけでなく、はっきりと伝えられるようにしましょう。
  relationshipsReversed: >-
    逆位置では、メッセージが行き違ったり、返事がなかったり、一方がもう一方よりも速く進みたがっていたりするのかもしれません。誤解が入り込んでいないか確かめ、推測するのではなく直接尋ねてみましょう。お互いに合うペースについて合意することで、口にされないプレッシャーがずいぶんやわらぐことがあります。
  workUpright: >-
    仕事や学びにおいて、ワンドの8は生産的な時期を示しているのかもしれません。作業が進み、承認が下り、プロジェクトが加速していく時期です。勢いを保つための少数のことに集中し、連絡にはすばやく対応してみましょう。明確な優先順位があれば、スピードはただのめまぐるしい忙しさではなく、前進になります。
  workReversed: >-
    逆位置では、仕事が遅れで止まっているように感じられたり、ミスを生むほど急かされていたりするのかもしれません。リストを見直し、本当に急ぎのものと、急ぎに見えるだけのものを分けてみましょう。周りの人と期待をすり合わせたり、重要な作業にもう少し時間をかけたりすることで、小さなつまずきが積み重なるのを防げます。
  growthUpright: >-
    自己成長において、このカードはエネルギーがすんなり流れるときに気づき、何がそれを可能にしているのかを見つけるよう促しています。それは明確な目標かもしれませんし、一日のある時間帯や、支えになる環境かもしれません。しばらくその流れに身をまかせ、努力と方向がそろったときにどれだけのことが起こりうるかを見てみましょう。
  growthReversed: >-
    逆位置では、変化の遅さにもどかしさを感じていたり、あまりにたくさんの方向に引っぱられていると感じていたりするのかもしれません。いまの自分にとって続けられるペースはどれくらいかを探ってみましょう。休んだり意図を整え直したりするために意図的に立ち止まることが、絶え間なく動き続けるよりも、着実に前へ進む助けになることもあります。
reflectionQuestions:
