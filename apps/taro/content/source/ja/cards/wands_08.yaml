  - "速さだけでなく、はっきりさせることが役立ちそうなメッセージや会話はどれですか？"
  - "エネルギーを最も大切なところへ向けるために、何をいったん止められそうですか？"
imageryNote: >-
  八本の杖が広い空を斜めに駆け抜けていきます。杖は平行に飛び、下には穏やかな風景と川か道が広がっています。場面には人の姿はなく、あるのは動きだけです。そろった角度は一つの方向にまとまったエネルギーを、開けた空ははっきりとした道筋を、下を流れる川は出来事の着実な流れを感じさせます。人物がいないことで、誰かの物語を眺めるのではなく、その動きを感じるよう見る人を誘っています。
