shortUpright: "小さく確かな始まりが、あなたの注意を求めています。現実的な何かを植えて、世話をする準備ができているのかもしれません。"
shortReversed: "有望な始まりに、もっと確かな地面が必要なのかもしれません。その上に築く前に、どんな支えが必要かを確かめてみましょう。"
meaningUpright: |-
  ペンタクルのエースは、地のスートの最もシンプルな形です。開いた手から差し出されたかのような、一枚の硬貨。それは手で触れられる始まりについて語っています。練習できるスキル、日々を安定させてくれる習慣、ようやく居場所を得たプロジェクトなどです。ここにはまだ壮大なものは何もありません。その価値は、手に持てるほど現実的であることにあるのです。
  日常では、このカードは仕事の新しい担当、実際に使う初めての予算、花壇、申し込んだ講座、あるいはもっと規則正しい睡眠と食事で体をいたわろうという決意を映しているのかもしれません。時間、道具、友情、静かな一角など、すでに持っているのにまだ気づいていない資源を示していることもあります。
  ここでの誘いは、小さなものへの忍耐です。種には土と水と季節が必要です。この始まりに公平な機会を与えるには、どんな現実的な一歩が一つあればよいか、そして最初の高揚が薄れたあとも、何を世話し続けるつもりがあるかを問いかけてみましょう。
meaningReversed: |-
  逆位置のペンタクルのエースは、よい始まりはそこにあるのに、まだ足場を見つけていないことを示しているのかもしれません。アイデアがノートの中にとどまっていたり、スケジュール、場所、必要な助けといった基本が整う前に計画が始まっていたりするのかもしれません。
  これは損失というよりも、下準備についてのカードです。逃したように感じられる機会は、もっと確かな土を待っているだけなのかもしれません。何もかもを生み出すものの量で測りたくなり、控えめな始まりなど始める価値がないように思えてしまう、という引力に気づくこともあるかもしれません。
  土台を確かめられるくらい、ペースを落としてみましょう。これを、急いだものではなく安定したものにするには何が必要でしょうか。どの部分を簡単にしたり、延期したり、誰かに尋ねたりできるでしょうか。ときには、たくさんの種を一度にまくよりも、一つをきちんと植えることがいちばん役に立つ一手です。
aspects:
  relationshipsUpright: >-
    親しい関係において、このカードはシンプルで目に見える思いやりの価値を示しているのかもしれません。一緒に料理をすること、誰かのために何かを直すこと、行くと言ったときに顔を出すことです。つながりが、より安定したリズムを持つ準備ができていると感じられるのかもしれません。どんな小さく頼れるしぐさが二人を安心させてくれるかに気づき、特別な機会を待たずに、その一つを差し出してみましょう。
  relationshipsReversed: >-
    逆位置のカードは、よい心がけのままとどまり、日々の暮らしにまでは届いていない思いやりを映しているのかもしれません。一緒に過ごす予定がずれ込み続けていたり、現実的な事柄が口にされないままだと感じられたりするのかもしれません。一緒に過ごす夜や、家事についてのはっきりした取り決めなど、助けになりそうな具体的なことを一つ言葉にして、やさしく提案してみましょう。
  workUpright: >-
    仕事やあらゆるプロジェクトにおいて、ペンタクルのエースは現実的な始まりを示しているのかもしれません。新しい責任、初めての顧客、講座、学べる道具などです。その始まりを、丁寧に築いていくものとして扱うよう促しています。この始まりがアイデアのままでとどまらずに根づくには、どんな仕組みや習慣や資源が必要でしょうか。
  workReversed: >-
    ここでのカードは、もっと準備が必要な始まりや、どう使えばよいかわからない機会を示しているのかもしれません。押し進めるのではなく、必要な時間、関わるスキル、周りの支えなど、計画そのものを見てみましょう。いま下準備を調整するのは遅く感じられるかもしれませんが、あとの労力を省いてくれることがあります。
  growthUpright: >-
    自己成長において、このカードは、日々の暮らしにもっと根を下ろしたいという願いを映しているのかもしれません。昼食後の散歩、10分間の読書、朝を始めるための整った場所など、小さなものでも新しい習慣は土台になりえます。地に足をつけるための習慣を一つ選び、続けられるくらい平凡なものにしておきましょう。
  growthReversed: >-
    逆位置のカードは、熱意をもって始めたのに静かに途切れてしまった習慣や、小さな一歩は数に入らないという感覚を示しているのかもしれません。その習慣を続けにくくしていたものを見直し、実際の日々に合う形につくり直してみましょう。現実的な日課に根ざした成長は、プレッシャーに押された成長よりも長続きすることが多いものです。
reflectionQuestions:
