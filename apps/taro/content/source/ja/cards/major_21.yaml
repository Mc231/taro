shortUpright: "ひとつの周期が一巡しようとしているのかもしれません。立ち止まって、成し遂げたことをねぎらってみませんか。"
shortReversed: "何かがもう少しで終わろうとしているのかもしれません。どんな最後の一歩や残った糸に目を向けるとよいでしょうか。"
meaningUpright: |-
  世界は大アルカナの最後のカードであり、愚者とともに始まった旅の終わりです。完成と全体性のカードです。ばらばらだったピースがひとつにまとまり、ひとつの周期を生き抜き、いまこの瞬間、これまで生きてきた物語の中でくつろいでいるという感覚です。
  日常では、このカードは長いプロジェクトを終えることや、努力してきた目標に到達すること、あるいはただ自分の人生や体の中にくつろいでいると感じることを映しているのかもしれません。統合、つまりたやすかった部分もつらかった部分も含めて、たくさんの経験から得た教訓をひとつにまとめ、自分が何者であるかという感覚にしていくことを示していることもあります。ここでの居場所とは、共同体や場所への帰属であることもあれば、自分自身への帰属であることもあります。
  このカードは、自分が成し遂げたことを振り返り、それを祝うよう促しています。この周期が始まってから自分がどう変わったか、そして次の周期に何を持っていきたいかを問いかけてみましょう。世界は、完成とは止まるという意味での終わりではないことを照らしています。それは新しい旅が始まる前の、満ち足りたひとときなのです。
meaningReversed: |-
  逆位置の世界は、ほとんど完成しているけれど、あと少し届いていない周期を映しているのかもしれません。いくつかのほつれた糸や、言えていない別れ、最後の作業が、終わったという感覚を妨げているのかもしれません。先へ進む準備はできていると感じながらも、何かがまだあなたをその場にとどめていることがあります。
  このカードは、区切りをどこか別のところに求め、近道を探したり、誰かが片をつけてくれるのを期待したりしていることを示している場合もあります。
  完結したと感じるために役立ちそうなことを、一つか二つ見つけてみるとよいでしょう。実務的な作業を終えること、誰かに感謝を伝えること、落胆を認めること、あるいはここまで歩んできた自分をただ認めることかもしれません。その最後の一歩を意図をもって踏み出すことで、ほぼ終わりかけていたものを、本当の終わりに変えることができます。
aspects:
  relationshipsUpright: >-
    人間関係において、世界は満たされた感覚と相互理解を映しているのかもしれません。まるで関係が本来の姿にたどり着いたかのようです。一緒に築いてきたものに感謝し、分かち合った節目を祝うよう促しています。ここでの関係は全体として満ちていて、親密さとそれぞれの自由の両方のための余白があります。
  relationshipsReversed: >-
    逆位置のこのカードは、関係の中で解決していないこと、終わっていない会話や閉じられていない章を示しているのかもしれません。何かを伝えることであれ、もう伝えられたと受け入れることであれ、二人が心穏やかでいるために何が助けになるかを考えてみましょう。
  workUpright: >-
    仕事やプロジェクトにおいて、世界は完成と評価を照らしています。大きな仕事を仕上げること、節目に到達すること、あるいは自分の役割が自分によく合っていると感じることを映しているのかもしれません。次のことを始める前に、自分や周りの人が成し遂げたことを認める時間をとってみましょう。
  workReversed: >-
    逆位置の世界は、最終段階で止まっているプロジェクトや、ゴールラインにあと少し届かない感覚を映しているのかもしれません。残っていることを書き出し、それが本当に必要なのか、それとも手放してよいのかを見極めてみましょう。小さく集中した努力が、物事をきれいに締めくくる助けになります。
  growthUpright: >-
    次の目標に手を伸ばす前に、ここまでどれだけ歩んできたかを認めることが助けになります。最近の章の教訓、困難、喜びを振り返り、それらがどのように組み合わさって、より豊かな自分の姿をつくっているかに気づいてみましょう。統合は、静かな形の達成です。
  growthReversed: >-
    逆位置の世界は、完結したと感じるために何が必要かを問いかけているのかもしれません。落ち着かなさや、何かが欠けている感覚を映している場合もあります。終わらせようと思っていたことを一つ挙げて全力で向き合い、その輪を閉じたときにどんな気持ちになるかに気づいてみましょう。
reflectionQuestions:
  - "人生のどの周期が、一巡しようとしているように感じますか？"
  - "いまの場所にたどり着く助けになってくれた人の中で、誰に感謝を伝えたいですか？"
  - "何かが本当に完結したと感じるために、どんな最後の一歩が助けになりそうですか？"
imageryNote: >-
  Taroの世界は、あらゆる季節の葉と花でできた大きな楕円の輪の中で、星空の中心を自由に舞う人物として描かれています。輪の周りには、火、水、風、地を表す四つの小さな紋章が場面の縁を飾り、バランスと全体性を感じさせます。踊り手の手からたなびくリボンは、始まった場所へと輪を描いて戻り、到着の感覚と、一巡した旅を感じるよう見る人を誘います。
