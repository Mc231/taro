shortUpright: "荒れた水から穏やかな岸へと進んでいるのかもしれません。変化は静かでゆっくりでも、確かなものでありえます。"
shortReversed: "何かがあなたを古い岸にとどめているのかもしれません。まだ離れる準備ができていないものは何か、気づいてみましょう。"
meaningUpright: |-
  ソードの6は、渡りのカードです。小さな舟が水を渡り、荒れた波を後にして、より静かな岸へと向かっています。その旅は劇的なものではありません。着実で、ときに悲しく、多くの場合ほっとさせてくれるものです。
  このカードは、よりつらい章から、より楽な章への、あらゆる移行を映しているのかもしれません。仕事の大変な時期を終えること、新しい場所に移ること、消耗させる状況から一歩引くこと、あるいはただ嵐のあとに考えが落ち着き始めるのを感じることです。刃は乗っている人と一緒に運ばれていて、いくつかの思い出や教訓は一緒についてくることを感じさせます。前に進むために、すべてを後に残す必要はないのです。
  このカードは、たとえ前進がゆっくりに感じられても、すでに向かっている方向に気づくよう促しています。誰が、あるいは何がこの渡りを助けてくれているのか、そしてその助けを受け入れられるかを問いかけてみましょう。移行には、安堵と、後にしていくものへの少しの悲しみが混ざっていることが多いものです。どちらの気持ちも、同じ舟に乗っていてよいのです。この渡りをもっとやさしいものにするには、何があればよいでしょうか。
meaningReversed: |-
  逆位置のソードの6は、遅れていたり、抵抗されていたりする移行を映しているのかもしれません。先へ進むときだとわかっていながら、習慣や現実的なしがらみ、向こう岸で何が待っているのかという不確かさに引き止められているのかもしれません。舟の準備はできているのに、あなたはまだ桟橋に立っているのかもしれません。
  古い岸から持ち出しすぎていると読むこともできます。心配事、役割、期待が、渡りを必要以上に重くしているのです。本当に離れる前に何かを終わらせるために、少しのあいだ戻ることを示している場合もあります。
  動くために、まだ何が必要かを問いかけてみましょう。情報でしょうか、支えでしょうか、区切りでしょうか、それとも自分自身からの許可でしょうか。変化は準備ができるまで待ってくれますし、準備は小さな一歩ずつ整えていくこともできます。出発する前に、下ろせるものを一つ挙げるとしたら何でしょうか。
aspects:
  relationshipsUpright: >-
    人間関係において、このカードは、大変な時期を二人で乗り越えて穏やかな場所へ向かうことや、もう役に立たなくなったパターンからそっと離れることを示しているのかもしれません。身近な人の移行を支えることを映している場合もあります。解決しようとするのではなく静かに寄り添うことが、渡っていく人の孤独をやわらげる助けになることに気づいてみましょう。
  relationshipsReversed: >-
    逆位置のソードの6は、古い関係性を後にしにくいことや、過去の傷を新しい章に持ち込んでしまうことを映しているのかもしれません。どの期待が以前の関係のもので、この関係のものではないのかを考えてみましょう。古い岸に何を置いていきたいかを二人で話し合うことで、いまがより軽く感じられるかもしれません。
  workUpright: >-
    仕事において、このカードはゆるやかな移り変わりを示しているのかもしれません。新しい役割、変わったチーム、あるいはストレスの多いプロジェクトを離れて、より安定した場所へ移ることなどです。わくわくするような移行ではないかもしれませんが、安堵をもたらしてくれます。持っていくスキルや教訓を見直し、荒れた水の中でだけ必要だった習慣は手放してみましょう。
  workReversed: >-
    逆位置のこのカードは、先延ばしにされ続けている職場での変化や、離れたい状況にあなたを縛りつけているやり残しを映しているのかもしれません。本当に完了させる必要があることと、引き継げることを書き出してみましょう。ときには、いくつかのやり残しを片づけることが、ついに舟を桟橋から離れさせてくれます。
  growthUpright: >-
    自己成長において、ソードの6はゆっくりとした前進を大切にするよう促しています。古い考え方から離れることは、一度の大胆な跳躍ではなく、たくさんの小さな日々を通して起こることが多いものです。すでに以前より落ち着いていたり、賢くなっていたりする証拠に気づき、ここまで進んできた道のりを自分で認めてあげましょう。
  growthReversed: >-
    逆位置のこのカードは、もう助けにならなくなっても慣れたパターンにしがみつくことや、起きたことを消化しないまま急いで先へ進むことを映しているのかもしれません。一度だけ意図的に立ち止まって振り返り、持っていくものと手放す準備ができているものに名前をつけてみましょう。そしてふたたび、水のほうへ向き直りましょう。
reflectionQuestions:
