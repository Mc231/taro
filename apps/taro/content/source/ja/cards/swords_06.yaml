  - "この変化の中で誰があなたを助けてくれていますか？どう感謝を伝えられそうですか？"
  - "旅を軽くするために、後に残していけるものを一つ挙げるとしたら何ですか？"
imageryNote: >-
  このオリジナルの絵では、小さな舟が波立つ水から、霧に包まれた静かな岸へとすべるように進んでいます。舟の中には六本の刃が静かな積み荷のようにまっすぐ立ち、座った乗り手は前を向いています。長い竿が浅瀬を着実に押し進めています。移り変わる水は混乱から穏やかさへの変化を示し、刃は一緒に運ばれる教訓を、竿は一歩ずつの辛抱強い動きを表しています。
