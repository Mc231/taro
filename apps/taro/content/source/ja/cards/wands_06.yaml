shortUpright: >-
  あなたの努力が認められつつあるのかもしれません。評価を受け取ることを自分に許し、ここまで支えてくれた人に目を向けてみましょう。
shortReversed: >-
  評価が得られていない、あるいは思ったほど満たされないと感じているのかもしれません。自分にとっての成功とは何かを問いかけてみませんか。
meaningUpright: |-
  ワンドの6は、評価のカードです。ワンドの5の摩擦のあと、ある人物が杖に月桂冠を掲げて進み、沿道の人々が声援を送っているように見えます。努力が目に見えるものになり、周りがそれを認める瞬間をとらえています。
  それは、全力を注いだ仕事へのよいフィードバックや、何かへの対処の仕方を尊敬していると友人に言われること、かつては向き合えるか自信のなかった挑戦をやり遂げることなどの形をとるかもしれません。もっと静かな種類の自信である場合もあります。うまくやれたとわかっているから、少し背筋が伸びるという感覚です。
  このカードは、感謝や称賛を払いのけずに受け取るよう促しています。評価はエネルギーを与え、次の一歩への勇気をくれます。同時に、この人物は人々に囲まれていて、完全にひとりで成し遂げられることはほとんどないと思い出させてくれます。この瞬間を味わいながら、誰が支えてくれたのか、そしてどうすれば手柄の一部を分かち合えるかも考えてみましょう。
meaningReversed: |-
  逆位置のワンドの6は、気づかれずにいる努力や、どこか心まで届かない称賛を映しているのかもしれません。何かを成し遂げたのに、誰かに言ってもらうまでは数に入らないように感じているのかもしれません。本当は感じきれていない自信を演じ続けることへの疲れを示している場合もあります。
  この逆位置のカードは、ときに静かな成功を表します。ほかの人には見えなくても、自分にとっては意味のある成功です。そうした前進もまた大切です。
  自分の価値の感覚が、どれだけ拍手に左右されているかを見つめるときなのかもしれません。まず自分で自分の努力を認めたら、どんな感じがするでしょうか。誰も見ていなかった部分も含めて、誇りに思っていることを書き出し、それを外からの承認よりも安定した励ましの源にしてみましょう。
aspects:
  relationshipsUpright: >-
    人間関係において、このカードは双方向に流れる感謝を映しているのかもしれません。身近な人を誇らしく思うこと、あるいはその人に見てもらえて支えられていると感じることです。互いの成功を声に出して祝うよう促しています。友人やパートナー、家族に、その人の尊敬しているところを伝え、お返しにもらう励ましを素直に受け取ってみましょう。
  relationshipsReversed: >-
    逆位置では、関係の中での自分の努力が気づかれていないと感じていたり、評価が静かな競争になっていたりするのかもしれません。自分にとってどんな感謝が大切なのかをはっきり伝え、相手にも同じことを尋ねてみましょう。大げさなふるまいよりも、小さく具体的な「ありがとう」のほうが、雰囲気を変えてくれることがよくあります。
  workUpright: >-
    仕事や学びにおいて、ワンドの6は目に見える成果を示しているのかもしれません。肯定的なフィードバック、好評を得たプロジェクト、取り組んできたことを発表する機会などです。この自信を生かしてアイデアをもっとオープンに共有しながら、貢献してくれた人たちの名前も挙げてみましょう。惜しみなく分かち合われた評価は、より強いチームを育てます。
  workReversed: >-
    逆位置では、自分の貢献が見過ごされていると感じていたり、成功が外からどう見えるかに頼りすぎていたりするのかもしれません。届けた成果を短くまとめるなど、落ち着いた事実ベースの方法で自分の仕事を見えやすくしつつ、誰が気づくかにかかわらず自分にとって大切な成果はどれかも振り返ってみましょう。
  growthUpright: >-
    自己成長において、このカードは誇らしさを感じることを自分に許すよう促しています。自分の前進を認めることで、次の挑戦にも持っていける自信が育ちます。最近うまく対処できたことを短いリストにして、自信が薄く感じられる日に読み返してみましょう。
  growthReversed: >-
    逆位置では、自信のなさや承認への欲求が、達成感をかすませているのかもしれません。自分の成功のイメージがどこから来たのか、そしてそれがいまも自分に合っているのかを探ってみましょう。成功を自分の言葉で定義することで、人からの評価は頼りにするものではなく、うれしいおまけになっていきます。
reflectionQuestions:
  - "最近成し遂げたことで、まだ十分に認めていないものは何ですか？"
  - "途中で誰が助けてくれましたか？その人とどう手柄を分かち合えそうですか？"
  - "誰も見ていないとしたら、成功とはどんな姿でしょうか？"
imageryNote: >-
  落ち着いた馬に乗った人物が小さな人だかりの中を進み、葉の冠を戴いた杖を掲げています。掲げられたほかの杖が、儀仗兵のように道の両側に並んでいます。冠は努力によって得た評価を、落ち着いた馬は急がずに鍛えられてきた自信を、そして周りの人々は、その達成を分かち合い、支える共同体を表しています。
