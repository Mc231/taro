shortUpright: "勇気はいつも大声で叫ぶとは限りません。忍耐や優しさ、困難なことにとどまり続ける姿をとることもあります。"
shortReversed: "いまは内なる落ち着きが薄く感じられるのかもしれません。自分へのやさしさは、力強い出発点になりえます。"
meaningUpright: |-
  力は勇気のカードですが、声高な勇気ではありません。伝統的な絵では、人物が落ち着いてライオンに手を添えています。力でねじ伏せるのではなく、なだめているのです。ここでの力は、忍耐、ぬくもり、そして他人のものであれ自分のものであれ、荒々しいエネルギーにうろたえずに向き合える、落ち着いた存在感から生まれます。
  日常では、このカードは、張りつめた会話の中で冷静さを保つことや、都合が悪くなっても約束を守ること、強い感情にすぐ反応するのではなく、理解できるまでその感情とともにとどまることを映しているのかもしれません。何も証明する必要のない人の、静かな自信を示していることもあります。ライオンを手なずけることは、それを抑え込むことよりも、それと友だちになることに近いのです。
  このカードは、プレッシャーにどう応じているかを考えてみるよう促しています。自分自身への思いやりも含めて、力よりも思いやりのほうが効果的なのはどこかを問いかけてみましょう。力のカードは、やわらかさと強さはともに存在できること、そして最も長続きする勇気は、たいてい落ち着いていて、やさしく、粘り強いものだと伝えています。
meaningReversed: |-
  逆位置の力は、いつもの落ち着きを見つけにくくなっている時期を映しているのかもしれません。忍耐がすぐに尽きてしまったり、内なる声がいつもより鋭く批判的に聞こえたりすることがあります。ライオンは落ち着かず、あなたもまた落ち着かないのです。
  このカードは、内側に向いたまま、まだ表に出ていない勇気を示していることもあります。実際には感じているよりも強いのに、自分を疑うことで、それを見せにくくなっているのかもしれません。あるいは、意志の力だけですべてをまとめようとする努力を映していることもあり、それはすり減っていきがちです。
  つらいときに、自分にどんな言葉をかけているかに気づいてみるとよいでしょう。おびえている友人にかけるような口調を使ったら、何が変わるでしょうか。勇気を取り戻すことは、多くの場合、自分への小さなやさしさと、荷が重いときに支えを求めることから始まります。
aspects:
  relationshipsUpright: >-
    人間関係において、力は、人があなたのそばで安心できるような忍耐とぬくもりを映しているのかもしれません。相手の難しい気分に、同じ激しさで応じるのではなく落ち着いて向き合いながらも、自分の境界線は保つよう促しています。やさしい芯の強さは、時間をかけて信頼を築いていきます。
  relationshipsReversed: >-
    逆位置のこのカードは、怒りっぽさや、衝突を避けるために誰かが気持ちをのみ込んでいることを示しているのかもしれません。自分や身近な人に厳しくしすぎていないか考えてみましょう。いらだちが積もる前にやさしく声に出すことが、つながりとあなた自身の落ち着きを守ってくれるかもしれません。
  workUpright: >-
    仕事やプロジェクトにおいて、力は粘り強さと感情の成熟を照らしています。手のかかる作業や人に忍耐と品位をもって向き合うことや、プレッシャーではなく励ましによって導くことを映しているのかもしれません。誰も見ていないときでも、着実で一貫した努力には意味があると信じてみましょう。
  workReversed: >-
    逆位置の力は、プレッシャーで疲れ果てている感覚や、困難に対処する自分の力を疑う気持ちを映しているのかもしれません。ストレスの下で鋭く反応してしまうことを示していることもあります。足場を取り戻すにはどんな支えや休息が助けになるか、そして続けられるペースをどう設定するかを問いかけてみましょう。
  growthUpright: >-
    力のカードは、自分の内なるライオン、つまりあなたをあなたたらしめる強い感情や欲求や本能を、檻に閉じ込めるのではなく、友だちになるよう促しています。それらと戦うのではなく、それらが何を必要としているのかに興味を向けてみましょう。ここでの自分への思いやりは弱さではなく、勇気をより長続きさせるための習慣です。
  growthReversed: >-
    逆位置の力は、自信は下がることもあれば戻ってくることもある、と思い出させてくれているのかもしれません。自信をなくしている時期や、厳しい自己批判を映していることもあります。うまく乗り越えられた場面を短いリストにしておき、つらい日に読み返して、すでに持っている落ち着きの証にしてみましょう。
reflectionQuestions:
  - "いま気になっている状況で、やさしい勇気とはどんな姿でしょうか？"
  - "あなたは誰の難しい気分に向き合っていて、どうすれば落ち着いてそばにいられそうですか？"
  - "今日、自分にどんなやさしい言葉をかけられますか？"
imageryNote: >-
  Taroの力は、日の差す草原で大きなライオンのそばにひざまずく、穏やかな人物として描かれています。片手はたてがみに添えられ、ライオンはくつろいで信頼したように身を寄せています。ロープも鎖もなく、絆は近さと安らぎによって表されています。両者の周りに咲く野の花は、忍耐がよりやさしいものを花開かせることを感じさせます。あたたかな金色の光が穏やかな雰囲気を保ち、力とやさしさが並び立つ姿を見せています。
