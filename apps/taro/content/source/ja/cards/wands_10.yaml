shortUpright: "自分の分以上を背負っているのかもしれません。その重さと、本当に運ぶ必要のあるものに気づいてみましょう。"
shortReversed: "荷物の一部は、肩から下ろす準備ができているのかもしれません。何を下ろし、分かち合い、断れるかを見てみましょう。"
meaningUpright: |-
  ワンドの10は、大きな杖の束を両腕で抱え、頭を垂れて、遠くの家へ向かって歩く人物を描いています。一つの火花として始まった火が、たくさんの約束へと増え、そのどれもが抱えておくのに力を要するのです。
  このカードは、責任が少しずつ積み重なってきたときによく現れます。どんどん大きくなっていったプロジェクト、追加の仕事を吸い込んでいった役割、自分の計画も守ろうとしながら人の世話もすることなどです。その多くは熱意や義務感から始まったのかもしれず、いつからこんなに重くなったのか思い出すのは難しいかもしれません。
  このカードは、自分が抱えているものを正直に見つめるよう促しています。どの責任が本当に自分のもので、どれがなんとなく自分のところに来たものでしょうか。どれがいまも、大切にしている何かとつながっているでしょうか。目的地は近いのかもしれませんが、それでも、もっと小分けにする、助けを借りる、途中でいくつかを下ろすなど、違う運び方ができないかを問いかけてみましょう。
meaningReversed: |-
  逆位置のワンドの10は、手放す瞬間を示しているのかもしれません。もともと自分のものではなかった責任を下ろし始めたり、人に任せたり、さらに重さを増やす依頼を断ったりしているのかもしれません。すべてを一度に抱える必要はないと気づくことには、安堵があります。
  その反対のパターンが内側に向かっていることを映している場合もあります。助けがあるのに、頼むことのほうが苦労するよりつらく感じられるために、何もかもひとりでやると言い張ることです。
  荷物を整理するのによいときなのかもしれません。抱えているものを書き出し、分かち合えるもの、延期できるもの、やめられるものに印をつけてみましょう。一つの作業を任せる、一つの誘いを断るといった小さな変化が、確かな違いを生むことがあります。手放すことは失敗ではありません。最も大切なことのためにエネルギーをとっておく方法になりえます。
aspects:
  relationshipsUpright: >-
    人間関係において、このカードは誰が何を担っているかの偏りを映しているのかもしれません。計画や心配事、気持ちの面のケアの大部分を一方が引き受けている状態です。その負担が公平に感じられるかに気づき、率直に話し合ってみましょう。重さを分かち合うことで人は近づくことができますが、黙って抱え込みすぎると、静かな不満が育ちがちです。
  relationshipsReversed: >-
    逆位置では、助けを求めることや、人のために引き受けてきた役割から一歩引くことを学びつつあるのかもしれません。はじめは居心地が悪く感じられることもあります。どの責任を分かち合いたいか、そして疲れきって頼むことすらできなくなる前に、協力を引き出せるような頼み方を考えてみましょう。
  workUpright: >-
    仕事や学びにおいて、ワンドの10は引き受けすぎを示しているのかもしれません。時間よりも作業が多かったり、プロジェクトが最初の形を超えて大きくなっていたりする状態です。自分が引き受けていることを見直し、関わる人と優先順位をはっきりさせ、簡単にできることがないか探してみましょう。うまく仕上げられるかどうかは、一度に抱える量を減らせるかにかかっていることがよくあります。
  workReversed: >-
    逆位置では、境界線を引いたり、人に任せたり、締め切りを交渉し直したりし始めているのかもしれませんし、そうすることに抵抗しているのかもしれません。ほかの人が対応できる作業を一つ、あるいは断れる約束を一つ見つけてみましょう。仕事量に余白をつくることで、集中力と、仕事を始めたときの熱意の両方が戻ってくることがあります。
  growthUpright: >-
    ここで問い直してみるとよい思い込みは、何もかも自分でやらなければならない、というものです。その思い込みはどこから来たのでしょうか。重い荷物を抱えたとき、体や気分がどう反応するかに気づき、そのサインを、何を変える必要があるかを教えてくれる情報として受け止めてみましょう。
  growthReversed: >-
    逆位置では、何かを下ろしたときに訪れる軽さを発見しつつあるのかもしれません。意味を与えてくれるからこそ抱え続けたいものと、手放す準備ができているものを探ってみましょう。責任をただ受け入れるのではなく、自分で選ぶことは、静かな自尊の行いになりえます。
reflectionQuestions:
  - "いま抱えているもので、本当は自分が運ぶものではないかもしれないものは何ですか？"
  - "はっきり頼めば、この荷物の一部を分かち合ってくれそうなのは誰ですか？"
  - "今週、下ろす、延期する、あるいは断ることのできるものを一つ挙げるとしたら何ですか？"
imageryNote: >-
  人物が前かがみになって歩いています。十本の杖の高い束を両腕で抱え、その束で顔がほとんど隠れたまま、地平線の小さな家か町へ向かっています。束は積み重なった責任を、隠れた顔は重い荷物が視野を狭めてしまうさまを、そして近くの目的地は手の届くところにある終わりを表しています。開けた道は、荷物が分かち合われたり下ろされたりする姿を思い描く余地を残しています。
