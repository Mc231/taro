shortUpright: "動かし始めたものが、遠くへ旅立ち始めています。何が返ってくるかを見守りながら、次の段階に備えましょう。"
shortReversed: "前進が思っていたより遅く感じられるのかもしれません。あきらめるのではなく、期待を調整するときなのかもしれません。"
meaningUpright: |-
  ワンドの2が計画についてのカードだったのに対し、ワンドの3はすでに動き出した計画を描いています。いわば船は港を出たのです。メッセージは送られ、申し込みは提出され、最初の一歩は踏み出されました。いまは、自分が直接コントロールできないところで物事が展開していく間、地平線を見守る時期です。
  このカードは、最初の前進がもたらす手応えを映しているのかもしれません。プロジェクトが最初の支持者を得ること、新しい習慣がなじんでくること、協力関係が思っていた以上に広がることなどです。準備の価値を照らしていることもあります。十分な下地を整えてきたからこそ、一歩下がって、さらに先を見渡すことができるのです。
  ここでの誘いは、二つのことを同時に抱えることです。始めたことへの自信と、それがどう展開していくかへの開かれた姿勢。自分の努力が、どこで人とつながり始めているかに気づき、次の段階があなたに何を求めるかを考えてみましょう。広がっていくためには、多くの場合、新しいスキルや新しい仲間、あるいは自分が築いているものについての少し大きな全体像が必要です。
meaningReversed: |-
  逆位置のワンドの3は、待つことが落ち着かなさに変わっている状態を映しているのかもしれません。やるべきことはやったのに、返ってくるものがほとんどなかったり、思い描いていたのとは違う結果に見えたりしているのかもしれません。物事がただ時間をかけているだけのときでも、遅さを失敗と読み取ってしまいがちです。
  このカードは、狭い視野を示していることもあります。一つの結果ばかりに目を向けて、周りで起きている小さな動きのしるしを見逃したり、先のことばかり計画して、いまが空っぽに感じられたりすることです。
  自分の期待を見直すのによいときなのかもしれません。スケジュールは現実的だったでしょうか。足りない情報や、まだ助けを求めていない相手はいないでしょうか。計画を捨てずに調整し、すでに静かに起きている前進に目を留めてみましょう。
aspects:
  relationshipsUpright: >-
    親しい関係において、このカードは最初の章を越えて育っていくつながりを映しているのかもしれません。信頼が深まり、新しい計画を共有し、ほかの人を迎え入れる余裕が生まれていることです。二人でここまで歩んできたことに感謝し、それぞれの地平線のための余白を残しながら、次にどこへ向かいたいかを話し合うよう促しています。
  relationshipsReversed: >-
    逆位置では、相手が歩み寄ってくれるのを待っているように感じたり、関係が望むペースで深まっていないと感じたりしているのかもしれません。黙って進み具合を測るのではなく、自分の期待を率直に伝えることが助けになります。お互いのスケジュール感がただ違うだけかもしれないので、相手が何を望んでいるのかも尋ねてみましょう。
  workUpright: >-
    仕事や学びにおいて、ワンドの3は広がりを得ていくプロジェクトを示しているのかもしれません。ローンチ、外部への働きかけ、チームや拠点をまたいだ協力などです。フォローアップをする、人脈を広げる、次の段階が来る前に備えるなどして、その勢いをどう支えるかを考えてみましょう。そうすれば、自分自身の前進に不意をつかれずにすみます。
  workReversed: >-
    逆位置では、成果がなかなか現れなかったり、自分ではどうにもできない遅れに計画が見舞われたりしているのかもしれません。同じ方向にもっと強く押すのではなく、これまでに学んだことを振り返り、道筋を調整してみましょう。関わっている人たちに状況を確かめると、いまの位置からは見落としやすい障害や、静かな成功が見えてくることがあります。
  growthUpright: >-
    すでに注いできた努力を信頼することは、静かな形の成長です。成長は、最初の一歩のあとも目に見えないところで続いていることが多いものです。数か月前に始めた地点を振り返り、何が変わったかに気づいたうえで、その広い視野をもって次に何を探りたいかを選んでみましょう。
  growthReversed: >-
    逆位置では、自分へのせっかちさが、本当の前進を見えにくくしているのかもしれません。どこですぐに変化することを期待していて、どこならもっとゆっくりしたリズムのほうがやさしいかを探ってみましょう。小さな一歩をシンプルに記録しておくと、地平線がまだ空っぽに見えるときでも、成長が見えやすくなります。
