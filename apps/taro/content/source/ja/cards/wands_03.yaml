  - "始めたことの次の段階に向けて、いまどんな準備ができそうですか？"
imageryNote: >-
  丘か崖の上に、人物が半ば背を向けて立っています。周りには努力の目印のように三本の杖が立てられ、下に広がる海原か平原を進んでいく船や旅人を見守っています。早朝の光は、新しい段階の始まりを感じさせるのかもしれません。遠くの動きはすでに進行中の計画を、揺るがない立ち姿は、成果がまだ旅の途中にある間の辛抱強い自信を表しています。
