shortUpright: "少しのあいだ離れて過ごすことで、自分の考えがもっとはっきり聞こえてくるかもしれません。"
shortReversed: >-
  ひとりの時間が孤立に傾いていたり、静けさそのものを避けていたりするのかもしれません。どんなバランスがしっくりくるでしょうか。
meaningUpright: |-
  隠者は、ほんの数歩先だけを照らすランタンを手に、ひとりで山道を歩いています。このカードは、騒がしさから一歩引いて、自分自身の答えを探すことについてのカードです。隠者は孤独というより、目的をもっています。身を引くことには理由があり、光は待つものではなく、自分で運ぶものなのです。
  日常では、このカードは、にぎやかな夜より静かな夜を選ぶことや、決断についてじっくり考えるためにひとりで散歩すること、集中を要する本やノートや手仕事とともに時間を過ごすことを映しているのかもしれません。他人の意見よりも、自分にとって何が本当かという、ゆっくり形になりつつある感覚のほうが大切になる、優先順位を見直す季節を示していることもあります。
  このカードは、あなたが何を探しているのか、そしてそれを見つけるための十分な余白を自分に与えているかを考えてみるよう促しています。長い散歩に持っていく問いを一つ選ぶとしたら何かを問いかけてみましょう。隠者は、知恵はたいてい、ランタンが一歩ずつ道を照らすように、小さく着実なひらめきとして訪れること、そしてそれだけで歩き続けるには十分だということを伝えています。
meaningReversed: |-
  逆位置の隠者は、助けになる期間を超えて続いているひとりの時間を映しているのかもしれません。ひとりで過ごす時間は、少しずつ引きこもりへと変わり、誰かに連絡することが日に日に難しく感じられることがあります。何かに向かって考えるのではなく、同じところをぐるぐると考えている自分に気づくかもしれません。
  このカードは、その反対を示していることもあります。あまりに忙しくしていたり、いつも誰かに囲まれていたりして、振り返る余地がまったくない状態です。静けさを避けることは、まだ向き合う準備のできていない問いを避ける方法なのかもしれません。
  どちらの側が近く感じられるかを見つめてみるとよいでしょう。ひとりの時間が多かったなら、誰かとふたたびつながるための、小さく気負わない方法は何でしょうか。静けさを避けてきたなら、自分の考えとともにひとりで過ごす10分間から、何を学べるでしょうか。ランタンを掲げるのは、いまもあなた自身です。
aspects:
  relationshipsUpright: >-
    人間関係において、隠者は考えるための余白が必要であることと、その必要を尊重してくれる人の大切さを映しているのかもしれません。一歩引くのは拒絶ではなく内省のためだと、やさしく説明するよう促しています。ひとりの時間は、自分が何を望み、何を差し出せるのかをより明確にして、人のもとへ戻る助けになります。
  relationshipsReversed: >-
    逆位置のこのカードは、周りの人に距離として感じられている引きこもりや、口にしていない寂しさを示しているのかもしれません。誰かのほうから連絡してくれるのを待っていなかったか考えてみましょう。そのあとでまだ静かな時間が必要だとしても、短く正直なメッセージがふたたび扉を開いてくれることがあります。
  workUpright: >-
    仕事や学びにおいて、隠者は深く集中した作業と、自分の頭で考えることを照らしています。調査、執筆、計画、あるいは何かを徹底的に学ぶのによい時期かもしれません。邪魔の入らない時間を守り、絶えず人に応答していないときにどんな気づきが訪れるかに目を向けてみましょう。
  workReversed: >-
    逆位置の隠者は、長く孤立して作業しすぎていることや、助けになる意見を取り入れ損ねていることを映しているのかもしれません。決断について考えすぎていることを示している場合もあります。信頼できる同僚や指導者に新しい視点を求め、アイデアを共有することでそれがどれほど磨かれるかに気づいてみましょう。
  growthUpright: >-
    自己成長において、このカードはひとりの時間と自分への問いかけの習慣を促しています。ジャーナルを書く、歩く、あるいは問いを抱えてただ静かに座ることは、自分をよりよく理解する助けになります。最近得た一つの気づきを自分のランタンと考えて、次の一歩を照らしてもらいましょう。
  growthReversed: >-
    逆位置の隠者は、自分自身から、あるいは他人から隠れていないかを問いかけているのかもしれません。内省とつながりのバランスをとる必要を映していることもあります。今週、静かな習慣を一つと、人と過ごす小さな時間を一つ計画して、それぞれがどう感じられるかに気づいてみましょう。ここでのバランスは人それぞれで、ちょうどよい配分がわかるのはあなただけです。
reflectionQuestions:
