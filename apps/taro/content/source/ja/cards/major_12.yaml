meaningUpright: |-
  吊るされた男は、生きた木から逆さまに吊るされていますが、その顔は穏やかで、ときには輝いてさえいます。これは罰のカードではありません。意図的な宙づりのカード、つまり物事を違うふうに見るために、いつもの「やること」の流れから一歩外へ出ることのカードです。世界を逆さまにしてみると、当然に思えたことが急に不思議に見え、不可能に思えたことが手の届くところに来ることがあります。
  日常では、このカードは保留中のプロジェクトや、事情によって遅れている計画、あるいはこれ以上押しても助けにならないと気づく瞬間を映しているのかもしれません。物事がどう展開すべきかという固定観念を手放すことの価値を示していることもあります。ときには、動くのをやめてただ見つめることが、いちばん役に立つ一手なのです。
  このカードは、立ち止まることがあなたに何を差し出してくれているのかを考えてみるよう促しています。自分の状況を反対側から見たら何に気づくかを問いかけてみましょう。吊るされた男は、コントロールしたいという欲求を手放すという意味でのゆだねることが気づきの余地を生むこと、そして注意を伴うなら、待つことも能動的でありうることを伝えています。
meaningReversed: |-
  逆位置の吊るされた男は、目的を超えて長く続いている小休止を映しているのかもしれません。何を待っているのかもよくわからないまま、何かが変わるのを待ちながら、宙ぶらりんの状態にいると感じることがあります。決めないことのほうが、選ぶことより安全に感じられ始めることもあります。
  このカードは、必要な休止に抵抗していることを示している場合もあります。静けさの居心地の悪さを避けるためにあらゆる瞬間を埋めたり、もう誰の役にも立たない形で自分のニーズを犠牲にしたりすることです。
  待つことが何を守っているのかを問いかけてみるとよいでしょう。動くときなら、行き詰まりから抜け出すためのいちばん小さな一歩は何でしょうか。止まる必要があるなら、罪悪感なしに休むために、自分にどんな許可を出せるでしょうか。どちらにしても、選ぶのはあなたであり、選ぶことで方向の感覚が戻ってくるかもしれません。
aspects:
  relationshipsUpright: >-
    人間関係において、吊るされた男は一歩引いて、相手の視点から状況を見つめるときを映しているのかもしれません。言い争いに勝つことや、いますぐすべてを解決することへのこだわりを手放すよう促しています。忍耐と、違うふうに見ようとする姿勢が、思いがけない理解を開いてくれることがあります。
  relationshipsReversed: >-
    逆位置のこのカードは、どちらも自分の望みを口にしないまま宙ぶらりんになっている関係を示しているのかもしれません。状況が変わることを願って、公平だと感じる以上に与え続けていることを映している場合もあります。二人が前に進めるように、自分に必要なことをやさしく伝えるときではないか考えてみましょう。
  workUpright: >-
    仕事やプロジェクトにおいて、吊るされた男は考え直すための小休止を照らしています。遅れはもどかしいものですが、前提を問い直したり、別の方法を調べたり、アイデアを熟成させたりする時間を与えてくれるかもしれません。ゆっくりした時期を使って、自分の仕事をまったく違う角度から見つめてみましょう。
  workReversed: >-
    逆位置の吊るされた男は、長く止まったままのプロジェクトや、いつまでも先送りされている決断を映しているのかもしれません。本当に待っているのはどんな情報や支えなのかを問いかけてみましょう。自分にゆるやかな期限を設けたり、一つの選択肢を手放すと決めたりすることで、ふたたび動き出せるかもしれません。
  growthUpright: >-
    手放すことはひとつの技術であり、吊るされた男はそれを練習する機会を差し出しています。手放すのは信念かもしれませんし、期待や、急いでしまう習慣かもしれません。慣れたことを一つ、逆の順番や新しい角度でやってみて、その小さな揺さぶりが、ふだんの世界の見方について何を見せてくれるかに気づいてみましょう。
  growthReversed: >-
    逆位置の吊るされた男は、静けさを避けていないか、あるいはその中で動けなくなっていないかを問いかけているのかもしれません。落ち着かなさや、保留にされている感覚を映していることもあります。自分の気持ちを確かめてみましょう。いまは忍耐のときでしょうか、それともそっと背中を押すときでしょうか。正直な答えが、次の一歩を導いてくれます。
reflectionQuestions:
  - "自分の状況を反対側から見たら、何が見えるでしょうか？"
  - "どこで、誰かが先に動くのを待っていますか？"
  - "新しいもののための余白をつくるために、今週何を手放せそうですか？"
imageryNote: >-
  Taroの吊るされた男は、生きた頑丈な枝から片足首で逆さまに吊られ、腕の力を抜いて、穏やかで、むしろ興味深そうな表情をしている姿として描かれています。この角度から、人物は下の池に逆さまに映る世界を見ています。木は青々として芽吹いており、この休止が成長の終わりではなく、その一部であることを示しています。水のような青と、ゆったりと流れる衣服は、ゆだねること、夢見ること、表面の下を見ることを響かせています。
