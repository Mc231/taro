shortUpright: "誰があなたの喜びを分かち合ってくれるのか、そしてあなたもその人の喜びをどう分かち合えるかに気づくとき。"
shortReversed: >-
  いまはつながりが薄く感じられたり、疲れるものになっていたりするのかもしれません。どの集まりが自分を満たし、どれがただ時間を埋めているだけか考えてみましょう。
meaningUpright: |-
  カップの3は、友人たちがともに杯を掲げるカードです。理由のいらないつながりを祝福しています。台所のテーブルでの笑い声、よい知らせで盛り上がるグループチャット、頼まれなくても手を貸してくれるご近所さん。カップの2が一つの絆に目を向けるのに対し、このカードは輪全体に目を向けます。
  集まりの多い季節や、祝う価値のある節目、あるいはただ自分を見てくれる仲間に属しているという感覚を映しているのかもしれません。すでに周りにある支え、もしかすると気づいていた以上の支えを示していることもあります。
  このカードは、喜びをあとにとっておくのではなく、分かち合うよう促しています。会いたいと思っていた人に連絡したり、誘いに応じたり、自分で小さな機会をつくったりしてみましょう。お祝いは盛大である必要はありません。何かよいことが起きた、あるいはつらいことを乗り越えたと、一緒に認め合うだけでよいこともあります。
meaningReversed: |-
  逆位置のカップの3は、どこか調子の合わない人づきあいを映しているのかもしれません。かつては自分もその一員だと感じていたグループの端にいるように感じたり、生活の変化とともに友情が離れていったことに気づいたりするかもしれません。あるいは、よいことが多すぎる状態なのかもしれません。休む余地のない予定や、静かな気持ちから目をそらす手段になってしまったお祝いです。
  これは、あなたの友情への判定ではありません。輪は形を変えるものであり、ある集まりを卒業し、別の集まりを求めるようになるのは自然なことです。
  ここでの誘いは、つながりの数ではなく、質に目を向けることです。どの人といると、より自分らしくいられるでしょうか。どこで習慣からイエスと言っているかもしれないでしょうか。一人の友人との正直な近況報告のほうが、予定でいっぱいのカレンダーよりも多くを与えてくれるかもしれません。
aspects:
  relationshipsUpright: >-
    人間関係において、このカードは一つの関係を取り巻く、より広い網の目を照らしています。友人、家族、自分で選んだ家族です。支えてくれる人たちとよいひとときを分かち合ったり、大切な人を自分の輪に迎え入れたりするよう促しているのかもしれません。友情がどれほど自分を支えてくれているかに気づき、ふだんは一つの関係にだけ向けている注意の一部を、友情にも向けてみましょう。
  relationshipsReversed: >-
    逆位置のこのカードは、グループ内の緊張や、取り残されている感覚を映しているのかもしれません。どんな形であれ、外からの影響が関係に及んでいることを示している場合もあります。推測するのではなく、いまどうなっているかを率直に尋ねてみましょう。取り繕ったり無理についていったりしなくてよい人たちと時間を過ごすことも助けになります。
  workUpright: >-
    仕事において、カップの3はチームの一体感や、分かち合う成功、一緒に働くことを心から楽しんでいる仲間を示しているのかもしれません。ゴールのときだけでなく、途中の前進も祝うよう促しています。名前を挙げて感謝を伝える、手柄を分かち合う、小さな節目に区切りをつけることで、チームは強くなり、仕事はより満ち足りたものになります。
  workReversed: >-
    逆位置のカードは、うわさ話や派閥、あるいは単純な忙しさのために、ぬくもりを失ったチームを映しているのかもしれません。なじむために遅くまで残るなど、周りからのプレッシャーが自分の選択を形づくっていないか気づいてみましょう。自分にとって健全な職場の仲間関係とはどんなものか、そしてどこで小さくその手本を示せるかを考えてみましょう。
  growthUpright: >-
    自己成長において、このカードは喜びを、まず勝ち取らなければならないご褒美ではなく、バランスのとれた生活の一部として大切にするよう促しています。一週間、分かち合ったささやかな楽しみを書き留めてみましょう。それに気づくことで、すでに持っている仲間の存在を認めやすくなり、どこでその輪を広げたいかも見えてくるかもしれません。
  growthReversed: >-
    逆位置のこのカードは、忙しさや人との時間を、自分の考えとひとりで向き合うことを避けるために使っていないかを問いかけているのかもしれません。認めにくい寂しさを映している場合もあります。人と過ごす時間とひとりの時間のバランスをとり、どちらがより足りていないかに気づいてみましょう。一人に連絡してみることは、やさしい始め方になりえます。
reflectionQuestions:
