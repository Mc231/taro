imageryNote: >-
  絵には、ゆるやかな輪になった三人の人物が描かれ、掲げられた杯が真ん中で触れ合っています。足元には果物や花やぶどうのつるなどの実りがあり、分かち合った努力から育つ豊かさを感じさせます。それぞれ異なる衣服や姿勢や色は、一緒にいながらもそれぞれの個性を保っている友人たちを表しているのかもしれません。踊るような足取りやひるがえる裾など、場面の中の動きが、気負いのない自然な喜びを伝えています。
