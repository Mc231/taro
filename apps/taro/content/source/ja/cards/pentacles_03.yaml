shortUpright: >-
  よい仕事は、人と人の間で育つことが多いものです。大切にしている何かの上で、異なるスキルがどう組み合わさるかに気づいてみましょう。
shortReversed: "共同の取り組みが、違う方向に引っぱられているのかもしれません。役割や計画、互いの聴き方を見直すと助けになりそうです。"
meaningUpright: |-
  ペンタクルの3は、人とともに築くカードです。建物に組み込まれた三枚の硬貨は、ひとりでは形にできない仕事を感じさせます。ある人は設計を、ある人は材料を、ある人は確かな手を持ち寄ります。際立っているのは地位ではなく、それぞれが差し出すものへの敬意です。
  日常では、ついにかみ合ったチームのプロジェクトや、何かの修理を手伝ってくれるご近所さん、勉強会、フィードバックで技を磨いてくれる指導者などの形で現れるかもしれません。自分の役割を認められること、そして人の役割を認めることの満足を映していることもあります。
  このカードは、どこで協力することが、ひとりでできる以上のところへ仕事を引き上げてくれるかを考えてみるよう促しています。誰の専門性が自分のものを補ってくれるのか、計画をどうはっきり共有できるか、そして意見をどう受け止めているかを問いかけてみましょう。技は、人々が同じ設計図を見つめ、一緒によりよくしようとするときに深まっていきます。
meaningReversed: |-
  逆位置のペンタクルの3は、共通の計画を見失った共同の取り組みを示しているのかもしれません。皆が懸命に働いているのに、少しずつ違う完成図に向かっていたり、役割が曖昧なために重複する作業もあれば、こぼれ落ちる作業もあったりするのかもしれません。頼むほうが遅く感じられたり、不安に感じられたりするために、何もかもひとりでやりたくなる引力を映していることもあります。
  これは誰かのせいにするのではなく、設計図を見直すための誘いです。ずれはよくあることで、早めに言葉にするほうが、そのまま押し進めるよりもたいてい負担が少なくてすみます。
  目標と役割分担について短く話し合うことを提案したり、計画を皆が見られる場所に書き出したりしてみましょう。ひとりで働きがちなら、任せられる部分を一つ考え、誰かが自分のスキルを加えてくれたときに何が変わるかに気づいてみましょう。
aspects:
  relationshipsUpright: >-
    親しい関係において、このカードは日々の暮らしの中のチームワークを映しているのかもしれません。一緒に引っ越しを計画する、家事を分担する、互いのプロジェクトを応援することなどです。お互いの強みがどう違うか、そしてそれが摩擦ではなく贈り物になりうることに気づいてみましょう。相手の貢献の仕方のどこに感謝しているかを言葉にすることで、二人で築いている土台が強くなります。
  relationshipsReversed: >-
    逆位置のカードは、あなたと身近な人が、同じ目標について違う完成図に向かっていることや、一方が現実的な負担を多く担っていることを示しているのかもしれません。貸し借りを数えるのではなく、座って期待をすり合わせてみましょう。誰が何を担うかをはっきりさせることで、緊張がやわらぎ、お互いが見てもらえていると感じられるかもしれません。
  workUpright: >-
    仕事において、このカードは協力と技を照らしています。はっきりとしたコミュニケーションと互いへの敬意によって、一人ひとりのスキルが発揮されるプロジェクトを映しているのかもしれません。フィードバックを求めたり、知識を共有したり、能力がうまくかみ合う人たちを引き合わせたりする機会を探してみましょう。計画が共有されているとき、質は高まることが多いものです。
  workReversed: >-
    ここでのカードは、曖昧な役割や行き違い、違う方向に引っぱり合うチームを示しているのかもしれません。ほかの目があれば役立つことを、ひとりで抱えていることを映している場合もあります。目標と責任について簡単にすり合わせることを提案したり、さらに進める前に、同僚の一人に自分のやり方を見てもらったりしてみましょう。
  growthUpright: >-
    自己成長において、ペンタクルの3は、人とともに、人から学ぶよう促しているのかもしれません。先生、ワークショップ、練習仲間、オンラインの仲間などが、スキルを磨く助けになるかもしれません。自分よりよく知っている人たちの中で初心者でいることがどんな感じか、そしてお返しにどれほど多くを差し出せるかに気づいてみましょう。
  growthReversed: >-
    逆位置のカードは、まだ学んでいる途中の姿を見られることへのためらいや、フィードバックを退けてしまう習慣を映しているのかもしれません。何が意見を受け取りにくくしているのかを探ってみましょう。未完成の作品を見せられる信頼できる人を一人選ぶことで、学びを孤独な試験ではなく、分かち合う過程に変えられます。
reflectionQuestions:
  - "あなたのスキルの中で、共同の取り組みに喜んで差し出せるものはどれですか？"
  - "いま築いているものを、誰の視点が強くしてくれそうですか？"
  - "計画のどの部分を書き出して共有すると役立ちそうですか？"
imageryNote: >-
  絵には、アーチや作業台、組み上げられた枠など、未完成の建造物の周りに三人の人物が配され、それぞれが違う作業に取り組んでいる姿が描かれているのかもしれません。一人は設計図を持ち、一人は素材を加工し、一人は支えたり確かめたりしています。建造物そのものに組み込まれた三枚の硬貨は、価値が協力を通して生み出されることを感じさせます。足場や道具、作業の周りの開けた空間は、仕事がまだ進行中で、よりよくする余地があることをほのめかしています。
