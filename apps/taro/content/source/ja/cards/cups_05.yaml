  - "少しのあいだだけでも目を向けられる、あなたの人生でまだ立っているものは何ですか？"
imageryNote: >-
  絵には、マントをまとった人物が、倒れた三つの杯の上に頭を垂れている姿が描かれ、杯の中身は地面にしみ込んでいます。人物の背後には、見落としやすい二つの杯が立ったまま残っています。遠くの道か渡し場は、時が来れば先へ進む道があることを感じさせるのかもしれません。冷たく沈んだ色調が悼む気持ちを表す一方で、立っている杯に差すひと筋の光が、すべてが失われたわけではないことをほのめかしています。
