shortUpright: "失ったものが視界を占めているのかもしれません。正直に悲しみ、時が来たら、まだ立っているものに気づいてみませんか。"
shortReversed: "落胆の重さがやわらぎつつあるのかもしれません。何があなたのもとに残り、次にどこへ向かいたいか考えてみましょう。"
meaningUpright: |-
  カップの5は、こぼれた杯を見下ろしている人物を描いています。その背後には、倒れずに立っている杯もあります。これは落胆と悲しみのカードです。望んでいたようにはならなかったという感覚と、失ったもののそばにとどまりたいという引力です。
  その引力は人として自然なものです。計画がうまくいかなかったとき、友情が変わったとき、期待が満たされなかったとき、それを受け止めるには時間がかかります。このカードは急ぐよう求めてはいません。悼むことは何かを大切に思うことの一部であり、喪失に名前をつけることは、それを大切にするひとつの方法になりえます。
  日常では、このカードは会話を何度も思い返すことや、違うふうにできたことはなかったかと考え続けること、欠けているもののために何かを楽しみにくいことを映しているのかもしれません。準備ができたら、少しだけ向きを変えて、こぼれていないものに気づいてみるよう、やさしく促しています。人間関係、強み、まだ残っている選択肢です。失ったものと残っているもの、その両方が同時に本当でありうるのです。
meaningReversed: |-
  逆位置のカップの5は、落胆のあとでゆっくりと落ち着きが戻ってくることを映しているのかもしれません。喪失の痛みが前ほど鋭くなくなっていたり、それが一日じゅうを占めることなく話せるようになっていたりすることに気づくかもしれません。受け入れるとは、それが大切ではなかったふりをすることではありません。それをほかのものと一緒に抱えていける余地を見つけることです。
  このカードは、誰かを、あるいは自分を許すことが、少しずつ可能になってきていることを示している場合もあります。あるいは、悲しみが感じられないまま脇に置かれていて、もっと静かに目を向けるひとときを求めていることを示唆している場合もあります。
  この経験から何を学び、何をこれから持っていきたいかを問いかけてみましょう。残っているものに目を向けることは、失ったものへの裏切りではありません。重い気持ちが続くようなら、信頼できる人と分かち合うことで、荷が軽く感じられることがあります。
aspects:
  relationshipsUpright: >-
    人間関係において、このカードは変わってしまった関係や、満たされなかった願い、傷ついた言葉への悲しみを映しているのかもしれません。その気持ちを払いのけるのではなく、認めるよう促しています。困難な時期にもそばにいてくれた人たちに気づき、それがどれほど自分にとって大切かを伝えてみましょう。
  relationshipsReversed: >-
    逆位置のカードは、和解へ向かう動きや、関係の変化と穏やかに折り合いをつけていく動きを映しているのかもしれません。古いわだかまりを手放す、あるいは少なくともそれをもう少しゆるく抱える準備ができているのかもしれません。自分にとって許しとはどんなものかを考えてみましょう。許すことは、納得できないことまで受け入れることを意味するわけではありません。
  workUpright: >-
    仕事において、カップの5は、止まってしまったプロジェクトや、胸に刺さったフィードバック、ほかへ回ってしまった機会への落胆を映しているのかもしれません。次の一歩を計画する前に、少し時間をとってそれを受け止めるよう促しています。そのあとで、これからも生かせる自分のスキル、人間関係、アイデアを書き出してみましょう。
  workReversed: >-
    逆位置のカードは、つまずきから立ち直り、新しい選択肢が見え始めていることを映しているのかもしれません。閉じてしまったことを嘆いていた扉が、別の何かのための余白を残してくれていたと気づくかもしれません。責めるのではなく教訓に焦点を当てて、起きたことを簡単に振り返って書いてみると、より明確な気持ちで先へ進めるかもしれません。
  growthUpright: >-
    悲しみや後悔には、あなたの物語の中に居場所がふさわしいものです。このカードは、それらにその居場所を与えながらも、物語の残りを書かせないようにするにはどうすればよいかを問いかけています。うまくいかなかったことに、何度も注意が戻っていくときに気づく練習をしてみましょう。一日数分でも、やさしく視野を広げることで、全体像が見えやすくなります。
  growthReversed: >-
    逆位置のカップの5は、つらい時期のあとに回復力が育っていくことを映しているのかもしれません。その経験が与えてくれた新しい視点や、より深い思いやりに気づくかもしれません。出さない手紙を書くなど、小さな儀式でその変化に区切りをつけることで、一つの章を閉じ、次の章を開く助けになります。
reflectionQuestions:
