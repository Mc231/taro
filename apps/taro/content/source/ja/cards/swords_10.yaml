  growthReversed: >-
    逆位置のこのカードは、希望とエネルギーが静かに戻ってくることを映しているのかもしれません。少しずつ、また余力が育っていることに気づくかもしれません。後戻りのように感じられる日にも忍耐強くいましょう。回復がまっすぐ進むことはめったにありません。どの教訓をこれから持っていきたいか、そしてどの古い物語を永遠に下ろす準備ができているかを考えてみましょう。
