shortUpright: >-
  思い出や素朴な親切が、今日ぬくもりをもたらしてくれるのかもしれません。過去がいまも与えてくれているものに気づいてみませんか。
shortReversed: >-
  過去がいつもより強く引き寄せているのかもしれません。どの思い出が自分を満たし、どれがいまから遠ざけているか考えてみましょう。
meaningUpright: |-
  カップの6は、思い出とやさしい親切のカードです。よく、一人の人物が花の入った杯をもう一人に差し出している姿が描かれます。シンプルで惜しみなく、計算のないしぐさです。子どものころや昔の友人、なじみのある場所、物事がもっと楽に感じられた時期を思い起こさせるかもしれません。
  日常では、このカードは過去の誰かとふたたびつながることや、かつて大好きだった趣味に戻ること、昔へと運んでくれる歌やレシピや香りに慰めを見いだすことを映しているのかもしれません。見返りを期待せずに与え、受け取る小さな親切を示していることもあります。
  ここでの誘いは、過去が差し出せるものを受け取ることです。ぬくもり、視点、そしてあなたがずっとどんな人だったかを思い出させてくれるもの。懐かしさは、自分にとって何が大切かを思い出す助けになるとき、ひとつの資源になりえます。遊び心、好奇心、気楽さなど、以前の時期のどんな資質をいまに持ち込みたいかを問いかけてみましょう。
meaningReversed: |-
  逆位置のカップの6は、思い出が訪れる場所ではなく、隠れる場所になっていることを示しているのかもしれません。美化された過去と比べて、いまを劣ったものに感じていたり、もう合わなくなった古いパターンや役割にしがみついていたりするかもしれません。
  逆の方向を示している場合もあります。自分の歩みの中の何かを越えて成長し、新しい物語が始まるように古い物語を後に残す準備ができていることです。
  このカードは、やさしさと正直さの両方をもって過去を見つめるよう促しています。本当は何が起きて、思い出す中で何を付け加えてきたでしょうか。自分を満たしてくれる部分は残し、自分を小さくとどめている部分からは手をゆるめてみましょう。大人になることは、やわらかさを失うことではありません。それを携えて、いまの自分のための選択をしていくことでもあるのです。
aspects:
  relationshipsUpright: >-
    人間関係において、カップの6は再会や分かち合った思い出、深く根を張った友情を映しているのかもしれません。遊び心とシンプルなしぐさを促しています。短い手紙、一緒に食べるおやつ、笑顔とともに送る昔の写真などです。共有してきた歴史がどう信頼を生むのか、そしてどうすれば一緒に新しい思い出を加えていけるかに気づいてみましょう。
  relationshipsReversed: >-
    逆位置のこのカードは、主に過去によってつながっている関係や、誰かを昔のその人と比べてしまうことを示しているのかもしれません。いま目の前にいる人と向き合っているのか、それとも昔のその人の姿と向き合っているのかを考えてみましょう。互いが変わっていくことを許し合うことで、つながりを生き生きと正直なものに保てます。
  workUpright: >-
    仕事において、このカードは、初期に楽しんでいたことに戻ることや、後輩の指導、昔のスキルを新しい形で生かすことを映しているのかもしれません。職場に素朴な善意を持ち込むよう促しています。頼まれる前に手を貸すといった小さな気づかいが、大きな宣言よりも職場の文化を形づくることがよくあります。
  workReversed: >-
    逆位置のカードは、以前のやり方にしがみつくことや、古いやり方のほうが安全に感じられるために変化に抵抗することを映しているのかもしれません。どの慣習がいまも仕事の役に立っていて、どれが習慣から続けられているだけなのかを問いかけてみましょう。過去を尊重しながら新しいやり方のための場所をつくることで、皆にとって移行が楽になります。
  growthUpright: >-
    自己成長において、カップの6は、若いころの自分の好奇心と喜びにふたたびつながるよう促しています。子どものころに大好きだった活動に、楽しむこと以外の目的を持たずに、もう一度触れてみましょう。かつて何が自分を軽やかで、急がない気持ちにしてくれたかを思い出すことが、いま時間をどう過ごすかの選択を導いてくれます。
  growthReversed: >-
    逆位置のこのカードは、自分についての古い物語を書き換えるよう求めているのかもしれません。子どものころに貼られたレッテルが、いまも自分の能力の見方を形づくっているのかもしれません。過去から来た思い込みを一つ書き出し、それがいまも本当かどうかを問いかけてみましょう。それを手放すことで、これからなろうとしている自分のための場所が生まれます。
reflectionQuestions:
  - "どの思い出があなたに慰めを与えてくれますか？それは何を大切にするよう思い出させてくれますか？"
  - "過去の人の中で、誰とふたたびつながりたいですか？それはなぜでしょうか？"
  - "自分についての古い物語のうち、変わる準備ができていそうなのはどの部分ですか？"
imageryNote: >-
  絵には、守られた中庭か庭にいる二人の小さな人物が描かれ、一人が花でいっぱいの杯をもう一人に差し出しています。近くにあるほかの杯にもそれぞれ花が入っていて、植えられて、いまも育ち続けている思い出を感じさせます。背景の古い壁や戸口は、家となじみのある場所の守りを表しているのかもしれません。あたたかくやわらかな色が、無邪気さ、惜しみなさ、そして以前の日々の気負いのない信頼を伝えています。
