shortUpright: >-
  静かな時間には、心配が大きく見えることがあります。どの恐れが「いま」についてで、どれが「もしも」についてなのか気づいてみましょう。
shortReversed: >-
  心配の重さが晴れ始めているのかもしれません。あるいは、ひとりで抱えるのではなく、分かち合われることを求めているのかもしれません。
meaningUpright: |-
  ソードの9は、夜更けの心のカードです。周りの部屋はすっかり静まり返っているのに、ある人が暗闇の中で身を起こし、考えが駆け巡っています。心配はとても大きく感じられますが、その多くはまだ起きていないこと、そしてこれからも起きないかもしれないことについてです。
  眠れずに会話を思い返していることや、計画について最悪の事態を想像していること、小さなことへの罪悪感が時間とともに重くなっていくことの中に、このカードを見いだすかもしれません。ストレスが積み重なり、心がどこにも着地せずにぐるぐる回り続けている時期を映していることもあります。刃は人物に触れることなく壁に掛けられていて、その重さの多くが考えの中にあることを感じさせます。
  このカードは、心配する心にやさしくするよう促しています。恐れを書き出し、そのうちどれには行動を起こせて、どれはゆるく抱えておくしかないのかを問いかけてみましょう。朝の光、信頼できる人の声、小さく現実的な一歩が、暗闇の中で圧倒的に思えたものを小さくしてくれることがよくあります。心配が長く重く続くようなら、信頼できる人や資格を持つ専門家に話すことが助けになります。すべての考えをひとりで抱える必要はありません。
meaningReversed: |-
  逆位置のソードの9は、心配が晴れ始めていることを映しているのかもしれません。少しよく眠れるようになっていたり、恐れていた状況が想像していたより対処しやすいとわかったりしているのかもしれません。いくらかの不安は残っていても、視点が戻ってきています。
  内側に向かって隠されたストレスとして読むこともできます。人には落ち着いた顔を見せながら、ひそかに余裕がなくなっていると感じている状態です。心配を秘密にしておくと、それはより大きく、より孤独なものに感じられることがあります。
  このカードは、心にあることを信頼できる人と分かち合うことを考えてみるよう促しています。恐れを声に出して言うと、その本当の大きさが見えてくることがよくあります。散歩、ゆっくりとした呼吸、寝る前に書くことなど、どんな習慣が考えを落ち着かせてくれるかに気づき、そのための場所をつくってみましょう。抱えているものとともにいて、孤独を感じずにいられるには、何が助けになるでしょうか。
aspects:
  relationshipsUpright: >-
    人間関係において、このカードは身近な人についての不安な考えを映しているのかもしれません。相手が言ったことを思い返したり、関係がどうなっているのか心配したり、相手が自分をどう見ているか想像したりすることです。こうした物語は、夜には説得力をもって感じられます。そのうちの一つを、昼間にシンプルな問いかけでやさしく確かめてみましょう。はっきりとしたやさしいコミュニケーションは、想像が大きくしたものをやわらげてくれることが多いものです。
  relationshipsReversed: >-
    逆位置のソードの9は、身近な人に心配を打ち明けることや、恐れていた亀裂が思っていたより小さかったと気づくことを示しているのかもしれません。負担をかけたくなくて、人にストレスを隠していることを映している場合もあります。人に支えてもらうことは、人を遠ざけるのではなく、より近づけてくれることがあると思い出してみましょう。
  workUpright: >-
    仕事において、このカードは家まで持ち帰ってしまうストレスを映しているのかもしれません。眠れなくなる締め切り、ミスへの恐れ、自分の努力がどう見られているかという心配などです。夜に仕事を終える前に、明日の最初の一歩を書いておきましょう。そうすれば、心に休む許可を与えられます。大きな心配を小さな作業に分けることで、より対処しやすく感じられます。
  workReversed: >-
    逆位置のこのカードは、職場でのプレッシャーがやわらいでいることや、重すぎると感じる荷物について、ついに誰かに話すと選ぶことを示しているのかもしれません。不確かさが心配を膨らませているところでは、はっきりさせてもらうよう求めてみましょう。同僚や上司に懸念を言葉にすることで、ひとりで抱えていた重荷を、現実的な選択肢のある共通の問題に変えられます。
  growthUpright: >-
    自己成長において、ソードの9は心配との自分の関係に気づくよう促しています。心がぐるぐると回り始めるのはどんなときで、何がそれをゆるやかにしてくれるでしょうか。一日の終わりを告げる短い夜の習慣を試してみましょう。不安な考えと戦うのではなく、やさしく接することで、その力がゆるむことがあります。
  growthReversed: >-
    逆位置のこのカードは、考えがいつも事実とは限らないと学んでいることを映しているのかもしれません。心配が始まった瞬間に気づき、それを「心配」とやさしく名づけてみましょう。時間とともに、この小さな立ち止まりが、あなたと恐れの間に余白をつくってくれます。支えを求めて手を伸ばすことは、この成長の一部であり、弱さのしるしではありません。
reflectionQuestions:
  - "いまの心配のうち、どれがいま起きていることについてで、どれが「もしも」についてですか？"
  - "夜眠れなくさせていることについて、誰に話せそうですか？"
  - "眠る前に心を落ち着かせるために、どんな小さな習慣が助けになりそうですか？"
imageryNote: >-
  このオリジナルの絵には、窓から差し込む細い月明かりだけに照らされた暗い部屋で、ひざを引き寄せてベッドの上に身を起こしている人物が描かれています。背後の壁には九本の刃がきちんと並んで掛けられていますが、どれも人物には触れていません。たたまれた毛布と、まだ灯されていない小さなランプがそばで待っています。並んだ刃はぐるぐると巡る考えを感じさせ、ランプと窓は、慰めと朝がすぐそこにあることをほのめかしています。
