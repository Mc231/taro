  workUpright: >-
    仕事において、ペンタクルの9は自分の能力への自信と、自律性や敬意や自分の力で得たリズムなど、続けてきた努力の報いを映しているのかもしれません。次の目標を立てる前に、成し遂げたことを認め、自分が築く手助けをしてきた安定を味わう時間をとってみましょう。
  workReversed: >-
    ここでのカードは、何かを味わう余地がほとんどなくなるほどの働きすぎや、期待していたほど満たされない達成を示しているのかもしれません。どんな報いが自分にとって本当に大切かを振り返ってみましょう。時間についての境界線を調整することで、仕事の恩恵が生活のほかの部分にも届くようになるかもしれません。
  growthUpright: >-
    自己成長において、このカードは自己肯定感と楽しむことを育てるよう促しています。ひとりの時間、美しい空間、丁寧に整えた日課は、自分への敬意の表れになりえます。ここまで歩んできた道のりを祝う小さな儀式を一つつくり、それをただ自分のためだけのものにしてみましょう。
  growthReversed: >-
    逆位置のカードは、何ひとつ十分ではないという落ち着かない感覚や、内側のすき間を埋めるために求められる心地よさを映しているのかもしれません。見た目を超えて、本当の満足とはどんな感じかを探ってみましょう。たとえ短くても、本当にくつろげたひとときに気づくことで、それを見分け、また戻っていけるようになります。
reflectionQuestions:
  - "あなたが人生で育んできたもので、立ち止まって味わうことの少ないものは何ですか？"
  - "あなたの自立は、身近な人とのつながり方をどう形づくっていますか？"
  - "今週、勝ち取る必要なしに、まるごと自分に与えられる小さな楽しみは何ですか？"
imageryNote: >-
  絵には、ぶどうのつるや果樹の間にひとりで立つ人物が描かれているのかもしれません。周りの茂みには九枚の硬貨が織り込まれ、片手には小鳥が静かにとまっています。豊かな庭は辛抱強い世話の実りを、鳥は自律したやさしい心を、そして急がない立ち姿は静かな自信を象徴しているのかもしれません。深い緑と金色が、行き過ぎのない洗練、つまり自分の力で得て、自分らしく形づくった空間を感じさせます。
