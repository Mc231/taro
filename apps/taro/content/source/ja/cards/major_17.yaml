shortUpright: "つらい時期を経て、静かな希望が戻ってきているのかもしれません。それを迎え入れてみませんか。"
shortReversed: "いまは希望が遠く感じられるのかもしれません。小さく着実なことが、そこへ戻る道を見つける助けになりそうです。"
meaningUpright: |-
  星は、希望と再生のカードです。順番の上では塔の動揺のあとに続くことが多く、その雰囲気は嵐のあとの静けさです。澄んだ夜空、冷たい水、ようやく息を吐ける瞬間。ここでの希望は、声高な楽観ではありません。物事はよくなりうること、そして自分には差し出す価値のあるものがあることへの、静かな信頼です。
  日常では、このカードは、つらい時期のあとに気持ちが軽くなることや、創作の夢とふたたびつながること、始めた理由を思い出させてくれる小さな前進のしるしに気づくことを映しているのかもしれません。鎧をまとわずに自分のアイデアや気持ちを分かち合えると感じられる、開かれた瞬間や、休息、自然、時間がもつ素朴な回復の力を示していることもあります。
  このカードは、どんなに小さくても、いまあなたに希望を与えてくれるものは何かを考えてみるよう促しています。人生で何を新たにしたいか、そして何が自分をすっきりさせてくれるかを問いかけてみましょう。星は、人に対しても自分に対しても、惜しみなく与えることを照らし出しています。自分を養ってくれるものにエネルギーを注ぎ、残りのことは自然に落ち着くのに任せるよう伝えています。
meaningReversed: |-
  逆位置の星は、希望がかすんで感じられる時期を映しているのかもしれません。疲れていたり、落胆していたり、自分の努力に意味があるのかと疑っていたりすることがあります。光は消えていませんが、雲を通して見るのが難しくなっているのかもしれません。
  このカードは、いつもならひらめきを与えてくれるものとのつながりが途切れていることを示している場合もあります。人に多くを与えすぎて、自分の夢のための余力がほとんど残っていないからかもしれません。
  小さな再生のきっかけを探してみるとよいでしょう。開けた空の下を歩くこと、あなたを信じてくれる人との会話、ささやかな楽しみへの立ち返り。希望は一度に戻ってくるのではなく、少しずつ戻ってくることが多いものです。重さが続くようなら、信頼できる人や資格を持つ専門家に連絡することは、自分をいたわる一歩になります。
aspects:
  relationshipsUpright: >-
    人間関係において、星は開かれた心、誠実さ、そして新たにした信頼の感覚を映しているのかもしれません。自分の希望を身近な人に打ち明けたり、励ましを必要としている人に言葉をかけたりするよう促しています。つらい時期を乗り越えてきたつながりが、いまは穏やかで希望に満ちたものに感じられるかもしれません。
  relationshipsReversed: >-
    逆位置のこのカードは、関係の中で見てもらえていない、あるいは落胆していると感じていることや、受け入れてもらえないのではと恐れて本当の気持ちを抑えていることを示しているのかもしれません。心を開くことをもっと安心して感じるには何が助けになるか、そして小さく正直なふるまいが信頼を少しずつ取り戻せないかを考えてみましょう。
  workUpright: >-
    仕事やプロジェクトにおいて、星はひらめきと目的意識を照らしています。自分がしていることの理由とふたたびつながることや、つまずきのあとで新しいエネルギーを見つけることを映しているのかもしれません。希望を感じさせてくれる長期的な目標や創作のアイデアに、時間を割いてみましょう。
  workReversed: >-
    逆位置の星は、やる気を失っていることや、自分の仕事に意味が欠けていると感じていることを映しているのかもしれません。そもそも何がこの道にひきつけたのか、そしてその火花の一部がまだ残っていないかを問いかけてみましょう。小さな成功と支えてくれる同僚が、目的意識を取り戻す助けになります。
  growthUpright: >-
    再生とやさしいセルフケアが、星の伝える成長のメッセージの中心にあります。何が自分を回復させてくれるかに気づき、そのための場所を少し広げてみましょう。これからの数か月に向けて、望むべきだと感じることではなく、心から願うことに根ざした意図を定めることは、地に足をつける助けになります。
  growthReversed: >-
    逆位置の星は、空っぽのまま走り続けていなかったかを問いかけているのかもしれません。さらに何かを差し出す前に、まず補充する必要があることを映している場合もあります。心を落ち着かせてくれる小さな日々の習慣を一つ始めて、時間をかけて静かに積み重ねていきましょう。自分を満たすことは与えることの一部であり、与えることからの休止ではありません。
reflectionQuestions:
  - "どんなに小さくても、いまあなたに希望を感じさせてくれるものは何ですか？"
  - "今週、誰と希望や夢を分かち合えそうですか？"
  - "毎日すっきりした気持ちになるために、どんな小さな習慣が助けになりそうですか？"
imageryNote: >-
  Taroの星は、屋上庭園の夜の場面として描かれています。人物が水差しで若い植物に水をやり、雲の切れ間から明るい星が輝いています。雨水をためる樽と小さな池が、空が返してくれるものを受け止めています。ランタンの周りを舞う蛾は、光に引き寄せられる思いを表しているのかもしれません。冷たい青と銀色の色調が、嵐が過ぎ去ったあとの穏やかさ、開かれた心、やさしい再生の感覚を生み出しています。
