shortUpright: >-
  好奇心にあふれた遊び心のあるエネルギーが、探求したがっています。わくわくするものに従い、初心者でいることを自分に許してみましょう。
shortReversed: >-
  熱意がいくつものことの間でちらついていたり、迷いに引き止められていたりするのかもしれません。一つ選んで、やさしく探ってみましょう。
meaningUpright: |-
  ワンドのペイジは、火の熱心な学び手です。芽吹いた杖を持ち、それを魅入られたように見つめるこの人物は、専門知識を得る前の好奇心を表しています。新しい何かを発見し、もっと知りたいと思う喜びです。
  このエネルギーは、思いつきで講座に申し込むことや、新しい関心事について見つけられる限りのものを読むこと、思いついたばかりのアイデアを友人に話すことなどの形で現れるかもしれません。なじみのない何かへの扉を開くメッセージや誘いであることもあります。ここには遊び心と、試している姿を人に見られてもかまわないという気持ちがあります。
  このカードは、初心者のような開かれた心で人生に向き合うよう促しています。ある関心がどこへ向かうのかわからなくても、それを探ってよいのです。すぐに上手になるというプレッシャーなしに試してみることを自分に許し、その自由がどんな感じかに気づいてみましょう。ときには、最も長く続く情熱が、小さく遊び心のある問いから始まります。
meaningReversed: |-
  逆位置のワンドのペイジは、着地する場所のない好奇心を映しているのかもしれません。関心から関心へと飛び移り、喜び勇んでプロジェクトを始めては、新鮮さが薄れると手放してしまうことがあるかもしれません。あるいは、好奇心はあるのに、経験が浅く見えることへの心配に引き止められているのかもしれません。
  このカードは、まだ形になりつつあるアイデア、つまり人に見せる準備が整うまでもう少し時間が必要な火花を表すこともあります。
  その落ち着かなさやためらいの裏に何があるのかを探ってみましょう。退屈でしょうか、本気で取り組むことへの恐れでしょうか、それともまだうまくできないことへの恐れでしょうか。前に進む一つの方法は、関心を一つ選んで、小さく気負わない目標を立てることです。もう一つは、どこかにつながる必要はないものとして、探求すること自体を楽しむことを自分に許すことです。
aspects:
  relationshipsUpright: >-
    人間関係において、このカードは誰かに対する新鮮な好奇心を映しているのかもしれません。その人のことをもっと知りたい、一緒に新しいことを試したい、遊び心のあるエネルギーを分かち合いたいという気持ちです。なじみのある関係にも軽やかさをもたらしてくれます。身近な人に、一度も尋ねたことのない質問をしてみたり、どちらも試したことのない活動を提案してみたりしましょう。
  relationshipsReversed: >-
    逆位置では、関係の中のわくわくする気持ちが一気にわいてはすぐに消えていったり、熱意を見せることに照れくささを感じていたりするのかもしれません。深さよりも新しさを求めていないかに気づいてみましょう。小さな形でも本当の関心を見せることで、相手も同じように心を開いて応えてくれるかもしれません。
  workUpright: >-
    仕事や学びにおいて、ワンドのペイジは学びの段階を示しているのかもしれません。新しいスキル、新しい役割、試してみたくてたまらないアイデアなどです。ここでは熱意が強みになります。遠慮なく質問し、なじみのないことに手を挙げ、最初の失敗を能力への判定ではなく、過程の一部として扱ってみましょう。
  workReversed: >-
    逆位置では、アイデアはたくさんあるのに最後までやり遂げられなかったり、エネルギーをどこに向ければよいかわからなかったりするのかもしれません。プロジェクトを一つ選び、いつもより一歩先まで進めてみましょう。指導者や同僚と話すことも、散らばった火花をよりはっきりした方向に変える助けになります。
  growthUpright: >-
    ワンドのペイジは、あなたにシンプルな課題を手渡します。自分の好奇心とふたたびつながることです。何かを成し遂げるプレッシャーがなかったころ、何を探るのが好きでしたか。今週、遊び心のある実験のための時間をとり、そこで見つけたことを、何が自分にエネルギーを与えてくれるかを知るための役立つ情報として扱ってみましょう。
  growthReversed: >-
    逆位置では、人目を気にする気持ちや落ち着かない心が、さらに深く進むのを妨げているのかもしれません。一つの関心に、自然に感じられるより少しだけ長くとどまり、それに慣れていない姿を人に見せることを自分に許すとしたらどうなるかを探ってみましょう。深まりは、いつもなら次へ移ってしまう瞬間のすぐあとに訪れることが多いものです。
reflectionQuestions:
  - "現実的でないように思えても、いまあなたが興味を持っていることは何ですか？"
  - "身近な人の中で、新しいことに挑戦するよう励ましてくれるのは誰ですか？その人とどう時間を過ごせそうですか？"
  - "どうなるかを見るためだけに、今週始められる小さな実験は何でしょうか？"
imageryNote: >-
  若々しい人物が開けた風景の中に立ち、杖をまっすぐに持って、その木から芽吹いた新芽を、心を開いて魅入られたように見つめています。衣服には小さな炎やサラマンダーの模様があしらわれ、火のエレメントをほのめかしているのかもしれません。芽吹いた杖は生きて育っているアイデアを、不思議そうなまなざしは好奇心を、そして開けた土地は、まだ探られるのを待っているたくさんの方向を表しています。
