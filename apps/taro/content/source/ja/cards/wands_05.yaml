shortUpright: >-
  たくさんの声やエネルギーがぶつかり合っています。その摩擦は、あなたを疲れさせると同時に、アイデアを磨いてもいるのかもしれません。
shortReversed: >-
  ぶつかり合いが静まりつつあるのか、それとも水面下にもぐっているのかもしれません。どの意見の違いがまだ公平に聞いてもらう必要があるか、気づいてみましょう。
meaningUpright: |-
  ワンドの5は、ぶつかり合うエネルギーを描いています。何本もの杖が交差し、互いに打ち合っていて、それが本当の争いなのか、遊びなのか、練習なのか見分けにくくなっています。その曖昧さこそがこのカードの核心です。同じ摩擦でも、どう受け止めるかによって、消耗させるものにも、活力を与えるものにもなるのです。
  全員が一度に話す会議、家事をめぐって言い合うシェアハウス、方向性が多すぎるグループ課題、あるいはせめぎ合う優先事項でいっぱいの頭の中に、このカードを見いだすかもしれません。そこには意欲もプライドもよいアイデアも混ざっていて、それぞれが別々の方向に引っぱっています。
  このカードは、自分がどんな種類の対立の中にいるのかを見つめるよう促しています。それはそれぞれのアイデアを強くする助けになっているでしょうか、それとも点の取り合いになっているでしょうか。やりとりのペースを落としたり、共通の目標を言葉にしたり、簡単なルールに合意したりして、意見の違いのエネルギーを、消耗ではなく役に立つものに変えてみましょう。ときには、少し一歩引いてみることで、本当の意見の違いがどこにあるのかが見えてきます。
meaningReversed: |-
  逆位置のワンドの5は、対立の扱われ方の変化を示しているのかもしれません。人々が共通点を見つけて緊張がほぐれつつあるのかもしれませんし、波風を立てないために意見の違いが口にされないまま、ただ見えないところへ押しやられているだけなのかもしれません。
  このカードは内側に向かい、あなたの中の異なる部分どうしの綱引きとして現れることもあります。休みたい自分と押し進めたい自分、あるいは両方は追えない二つの計画です。
  その穏やかさが本物なのか、表面だけなのかに気づくときなのかもしれません。あらゆる言い争いを避けていると、大切なニーズが聞かれないままになることがあります。一方で、公平な話し合いはわだかまりを晴らしてくれます。自分の内側や周りで、辛抱強く正直に見つめることが役立ちそうな意見の違いはどれか、そしてそれを安心して話し合うには何が必要かを問いかけてみましょう。
aspects:
  relationshipsUpright: >-
    親しい関係において、このカードは口げんかや、遊び心のある張り合い、くり返される小さな意見の違いを映しているのかもしれません。摩擦のすべてが問題のしるしではありません。お互いが大切に思い、しっかりとした考えを持っていることの表れでもあります。理解するために聴いているのか、それとも言い返す番を待っているのかに気づき、どうやってそこへ行くかを議論する前に、二人が何を望んでいるかを言葉にしてみましょう。
  relationshipsReversed: >-
    逆位置では、意見の違いが落ち着きつつあるのかもしれませんし、解決されないまま静かになっているだけなのかもしれません。その沈黙が二人に余白を与えているのか、それとも大切な話題を避けているだけなのかを考えてみましょう。落ち着いたときこそ、相手の言い分への好奇心をもって、その話題にやさしく戻るよい機会になりえます。
  workUpright: >-
    仕事やチームにおいて、ワンドの5は競争、ブレインストーミングの混沌、曖昧な役割を示しているのかもしれません。エネルギーは高いのに、散らばっている可能性があります。目標をはっきりさせる、順番にアイデアを出す、シンプルな決め方を提案するなどして、そのエネルギーを方向づける手助けをしてみましょう。全員が聞いてもらえたと感じられれば、健全な議論はより強い計画につながります。
  workReversed: >-
    逆位置では、職場の対立が協力へと落ち着きつつあるのかもしれませんし、礼儀正しい表面の下でくすぶっているのかもしれません。物事を遅らせている、口にされない意見の違いを探してみましょう。正直な意見を求めたり、小さな決定一つについて共通点を見つけたりすることで、静かな緊張をふたたび仕事のエネルギーに変えられるかもしれません。
  growthUpright: >-
    困難は、何かの証明ではなく、練習として扱うことができます。摩擦は、自分の考えのどこが揺るがず、どこが柔軟で、どこで自分を証明しなければと感じるのかを教えてくれます。何があなたの負けず嫌いな面に火をつけるのか、そしてそれが何を守ろうとしているのかに気づいてみましょう。
  growthReversed: >-
    逆位置では、葛藤が内側にあるのかもしれません。相反する願いや価値観や計画が、一つの道に落ち着くのを妨げているのです。それぞれの側を書き出して、公平に声を与えてみましょう。並べて見てみると、自分のニーズを一つ以上大切にできる道を見つけやすくなるかもしれません。
reflectionQuestions:
  - "周りの意見の違いのうち、いちばん疲れるのはどれで、いちばん役に立っているのはどれですか？"
  - "どうすれば誰かを、より公平で落ち着いた意見交換に誘えそうですか？"
  - "あなたの中のどの部分が別の部分と言い合っていて、それぞれの側には何が必要でしょうか？"
imageryNote: >-
  杖を一本ずつ持った五人の人物が近くに集まり、交差する角度で杖を掲げています。場面は活気があって少し混沌としていますが、誰もけがをしている様子はなく、本当の勝負とも練習試合ともとれるままになっています。交差する杖のもつれは、互いに押し合うアイデアや大志を象徴しているのかもしれず、周りの開けた地面は、一歩引いて共通のリズムを見つける余地を感じさせます。
