shortUpright: "異なる衝動をひとつにまとめて同じ方向へ向けたとき、勢いが生まれます。"
shortReversed: "エネルギーがいくつもの方向に同時に引っぱられているのかもしれません。どこでそっと手綱を取り戻せるでしょうか。"
meaningUpright: |-
  戦車は、目的をもって前へ進むカードです。伝統的な絵では、二頭の動物が乗り物を引いていて、多くの場合それぞれ色が違い、まるでめいめい自分の行きたい方へ向かおうとしているかのようです。御者の役目は動物たちと戦うことではなく、ともに導くことです。それがこのカードの核心です。内なる緊張を、揺るがない方向性へと変えていくこと。
  日常では、このカードは、ついに目標に本気で取り組み、気が散ることがあっても続ける一週間を映しているのかもしれません。大会に向けたトレーニング、大きな課題の仕上げ、引っ越し、長いあいだ口にしてきた変化を実行に移すことなどです。どちらか一方を完全に勝たせるのではなく、意欲と休息、高揚と慎重さといった、せめぎ合うニーズのバランスをとる自律を示していることもあります。
  このカードは、あなたがどこへ向かいたいのか、そして何があなたを進路からそらしているのかを考えてみるよう促しています。複雑な気持ちをブレーキではなく燃料として使うにはどうすればよいかを問いかけてみましょう。戦車は集中と意志を照らし出すと同時に、舵を取れるほど自分をよく知っていることがもたらす、静かな守りも示しています。
meaningReversed: |-
  逆位置の戦車は、止まってしまったり、散らばってしまったりした勢いを映しているのかもしれません。忙しいのにうまく前に進んでいない、たくさんの目標の間で引っぱられている、どの方向が本当に自分のものなのかわからない、と感じることがあるでしょう。手綱はそこにあるのに、ゆるんでいるように感じられるのかもしれません。
  このカードは、押しすぎていることを示している場合もあります。進路の調整が必要だというサインを無視して、力ずくで前進しようとすることです。意志の力だけでも遠くまで行けますが、明確さが伴わなければ、疲れやすくなるものです。
  立ち止まって、自分を引っぱっている力に名前をつけてみるとよいでしょう。いま最も大切なのはどれで、後回しにできるのはどれでしょうか。これからの数日のために明確な方向を一つ選び、ほかのことはしばらく脇に置くことを自分に許せば、ふたたび御者の席で落ち着きを感じられるかもしれません。
aspects:
  relationshipsUpright: >-
    人間関係において、戦車は共有された方向感覚を映しているのかもしれません。忙しい時期や大変な時期をともに乗り越え、互いの目標を支え合うことです。二人がどこへ向かっているのか、そしてどうすれば歩調を合わせられるかを話し合うよう促しています。ここでの献身とは、着実な努力と互いへの励ましです。
  relationshipsReversed: >-
    逆位置のこのカードは、二人が違う方向に引っぱり合っていることや、一方が舵を取り、もう一方はただ運ばれているように感じていることを示しているのかもしれません。二人の準備が整う前に、関係をある目標へと押し進めていないか考えてみましょう。ペースを落として行き先について合意すれば、張りつめたものがやわらぐかもしれません。
  workUpright: >-
    仕事やプロジェクトにおいて、戦車は推進力と集中した努力を照らしています。プロジェクトをゴールまで押し上げる段階や、健全な形で競い合う時期、チームを一緒に前に進める時期を映しているのかもしれません。明確な目標を定め、資源を集め、自分で選んだ現実的なスケジュールを立ててみましょう。
  workReversed: >-
    逆位置の戦車は、勢いを失いつつあるプロジェクトや、明確な計画がないまま急いでいる感覚を映しているのかもしれません。異なる人たちから寄せられる相反する優先事項を示していることもあります。一歩引いて、成功とは実際にどんな姿なのかをはっきりさせ、どの作業がそこへ近づけてくれて、どれがただ忙しくさせているだけなのかを見極めてみましょう。
  growthUpright: >-
    自己成長において、このカードは自分で自分の舵を取る練習を促しています。自分が何を望んでいるかを知り、さまざまな気分や動機をひとつにまとめておくことは、ひとつの技術です。意味のある目標を一つ選び、どのようにして自分を進路に保っているかに気づき、進んだ道のりを少しずつ喜んでみましょう。
  growthReversed: >-
    逆位置の戦車は、自分を追い立てすぎていないか、あるいは他人に進路を決めさせていないかを問いかけているのかもしれません。いま向かっている場所へ行く、自分自身の理由とふたたびつながるよう誘っています。毎朝自分の気持ちを確かめ、今日はどの方向が本当に自分のものと感じられるかを問いかけてみましょう。
reflectionQuestions:
  - "いま、あなたの中のどの二つの部分が違う方向に引っぱり合っていますか？"
  - "誰があなたと並んで歩んでいて、互いにどのように支え合っていますか？"
  - "これからの数日、どんな方向にひとつ絞って取り組めそうですか？"
imageryNote: >-
  Taroの戦車は、海沿いの道を、小さく頑丈な荷車で進む人物として描かれています。荷車を引くのは、一頭は落ち着き、もう一頭は落ち着かないという、対照的な気質の二頭の動物です。御者は手綱を軽く持ち、力ではなく注意深さで舵を取っています。座席の上の貝殻のような天蓋は、蟹座と、人が安心して前へ進めるようにする守りを示しているのかもしれません。開けた道と遠くの港の灯りは、押しつけられたのではなく、自分で選んだ行き先を感じさせます。
