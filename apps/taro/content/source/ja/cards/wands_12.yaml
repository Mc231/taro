shortUpright: "大胆で冒険好きなエネルギーが、動き出す準備をしています。道から目を離さずに、情熱に従ってみましょう。"
shortReversed: "エネルギーが方向性より先に走っているのかもしれません。勢いをゆるめて、どこを目指すか選ぶときなのかもしれません。"
meaningUpright: |-
  ワンドのナイトは、動いている火です。元気な馬にまたがり、杖を高く掲げたこの人物は、情熱と自信と冒険心をもって突き進みます。ペイジが思いを巡らせるところで、ナイトは行動します。
  このエネルギーは、突然旅に出ると決めることや、ようやくあのプロジェクトを始めようという意欲の高まり、かつては大胆すぎると感じたリスクを取ってみようとする気持ちとして現れるかもしれません。魅力や勇気、そして周りの人を巻き込むような伝染する熱意をもたらすこともあります。
  このカードは、自分の推進力を信頼し、それに新しい領域へと運んでもらうよう促しています。勢いは貴重なものであり、道がどこへ続くかを知るには、出発するしかないこともあります。同時に、駆ける馬には、だいたいどこへ向かっているのかを知っている乗り手が必要です。このエネルギーを一つの明確な冒険に注ぎ、足元の地面が変わったときに調整できるだけの注意も保っておきましょう。
meaningReversed: |-
  逆位置のワンドのナイトは、方向性を追い越してしまったエネルギーを映しているのかもしれません。勢いで物事を始めては途中で興味を失ったり、衝動で動いてはその結果に対処しなければならなくなったり、推進力の行き場がなくてもどかしく感じたりしているのかもしれません。
  抑えられた情熱を示している場合もあります。状況に待たされ続けて、落ち着かなさが積もっていくのです。
  自分の火がどこへ向かいたがっているのか、そして燃え尽きずにそこへたどり着くには何が助けになるかを問いかけるときなのかもしれません。大きな決断の前にひと呼吸おく、次を始める前に一つを終わらせる、あるいは体を動かす、創作に取り組む、行き詰まっていると感じることについて正直に話すなど、落ち着かないエネルギーの健全なはけ口を見つけてみましょう。
aspects:
  relationshipsUpright: >-
    人間関係において、このカードはわくわくする気持ち、惹かれ合う気持ち、冒険心を映しているのかもしれません。思いつきの予定、熱のこもった会話、一緒に何かをしたいという気持ちです。そのエネルギーを楽しみながらも、そのペースが関わる皆に合っているかを確かめてみましょう。共通の冒険は、お互いが方向について意見を言えるときのほうが、豊かに感じられるものです。
  relationshipsReversed: >-
    逆位置では、強い気持ちがコミュニケーションよりも先に進んでしまったり、熱意がわいたときと同じくらい早く冷めてしまったりするのかもしれません。あなたか身近な人が、確かめ合わずに衝動で動いていないか気づいてみましょう。ペースを落として、それぞれが本当に何を望んでいるかを話し合うことで、火花に満ちたつながりに安定がもたらされます。
  workUpright: >-
    仕事やプロジェクトにおいて、ワンドのナイトは大胆に主導権を取ることを示しているのかもしれません。意欲的なアイデアを提案する、勢いをつける役を担う、機会にすばやく動くことなどです。この推進力を生かして停滞を打ち破りながら、最初のわくわくする勢いのあとの手順について、シンプルな計画も立てておきましょう。
  workReversed: >-
    逆位置では、決断を急ぎすぎていたり、行き詰まってせっかちになっていたりするのかもしれません。本当にスピードが必要なのか、それとも計画のために少し立ち止まるほうが役立つのかを確かめてみましょう。もどかしさを、次にとる行動のはっきりしたリストに変えることで、エネルギーが同じところを回るのではなく、前へ進むようになります。
  growthUpright: >-
    勇気と経験への意欲は、このカードがあなたに生かすよう求めている贈り物です。自分の熱意を信頼したら、何をするでしょうか。自分を少し広げてくれることを試し、慎重さからだけでなく情熱から行動するのがどんな感じかに気づいてみましょう。
  growthReversed: >-
    逆位置では、自分と衝動との関係を探ってみるとよいかもしれません。思いつきで動くことが喜びをもたらすのはどんなときで、気持ちを散らしてしまうのはどんなときでしょうか。火花を失わずに、行動の前に少しだけ立ち止まることを身につけると、エネルギーはあなたを操るものではなく、あなたが舵を取るものになっていきます。
reflectionQuestions:
