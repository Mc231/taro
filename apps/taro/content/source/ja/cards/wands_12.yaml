  - "出発する前にエネルギーの狙いを定めるには、何が助けになるでしょうか？"
imageryNote: >-
  疾走する乗り手が、前脚を上げて跳ねる馬の上で前のめりになり、杖を高く掲げ、マントを後ろになびかせています。前方には砂漠の丘か開けた平原が広がり、乗り手の衣服は小さな炎の形やサラマンダーで飾られているのかもしれません。跳ねる馬は情熱と推進力を、掲げられた杖は行動へと運ばれる目的を、広い風景はまだ展開していく冒険を表しています。前のめりの姿勢は、勇気と性急さの両方をほのめかしています。
