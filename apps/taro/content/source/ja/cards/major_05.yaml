shortUpright: "先人が歩んできた道には知恵があるのかもしれません。いま、どんな伝統や師が助けになるでしょうか。"
shortReversed: "受け継いだルールが、もう合わなくなっているのかもしれません。本当に大切にしている価値観に照らして確かめてみませんか。"
meaningUpright: |-
  教皇は、共有された知識のカードです。つまり、ある共同体が世代から世代へと受け渡していく物事のやり方です。教師、指導者、組織、儀式、行動規範など、人々がともに学び、自分より大きな何かに属していると感じる助けになるあらゆるものを表しています。
  日常では、このカードは講座に参加すること、家族に代々伝わるレシピに従うこと、経験豊かな同僚に助言を求めること、なじみのある儀式で節目を祝うことなどを映しているのかもしれません。何もかもひとりで考え出さなくてよいという安心感を示していることもあります。伝統には多くの人の教訓が込められていて、そこには理にかなったことがたくさんあります。
  このカードは、あなたが受け継いだものと自分で選んだものについて考えてみるよう促しています。どんな共有された価値観があなたの人生に安定をもたらしているか、そしていま誰から学べるかを問いかけてみましょう。教皇は盲目的な服従を表すものではありません。それをそのまま守るにせよ、変えていくにせよ、いつか自分の言葉で伝えていくにせよ、ひとつの型をしっかり学ぶことの価値を照らし出しているのです。
meaningReversed: |-
  逆位置の教皇は、育ってきた中で身につけたルールや期待から、距離が広がりつつある状態を映しているのかもしれません。かつては正しいと感じていたものが、いまは窮屈に思えたり、確信からというより習慣で台本に従ってきたと感じたりしているかもしれません。
  このカードは、反対の傾きを示していることもあります。あらゆる慣習をあまりにきっぱりと拒むあまり、そこにまだ役立つものがあるのを見逃してしまうことです。問い直すことは健全なことであり、反発からではなく好奇心から行うときに、うまくいきやすいものです。
  重く感じる期待を一つ取り上げて、それがどこから来たのかを問いかけてみるとよいでしょう。それはいまもあなたの価値観を映していますか、それとも誰か別の人の価値観でしょうか。自分の道を見つけることには、まだ役立つ部分を残し、もう合わなくなった部分を敬意をもって手放すことも含まれます。
aspects:
  relationshipsUpright: >-
    人間関係において、教皇は共有された価値観や約束、そして人々を結びつける儀式を映しているのかもしれません。家族の伝統、記念日、毎週の電話などです。あなたと身近な人がともに大切にしていること、そしてそれをどう大切にしているかに気づくよう促しています。信頼できる友人や年長者からの助言も、いまは助けになるかもしれません。
  relationshipsReversed: >-
    逆位置のこのカードは、関係に対して期待されていることと、その関係にいる人たちが本当にしっくりくると感じていることとの間の緊張を示しているのかもしれません。自分たちの状況に合わない外の基準に従っていないか考えてみましょう。ふたりが望む関係のあり方について正直に話し合えば、自分たちなりのやり方のための場所が生まれるかもしれません。
  workUpright: >-
    仕事や学びにおいて、教皇は技術をきちんと身につけること、確立された方法を尊重すること、指導者を見つけることを照らしています。講座を受けたり、資格を取ったり、経験のある人にコツを教えてもらったりするのによい時期かもしれません。チームや組織の一員であることは、構造だけでなく支えも与えてくれます。
  workReversed: >-
    逆位置の教皇は、これまでのやり方へのいらだちや、公式の道は自分に合わないという感覚を映しているのかもしれません。どのルールが質を守っていて、どのルールがただ変化に抵抗しているだけなのかを問いかけてみましょう。仕組みを迂回するよりも、落ち着いて根拠を示しながらよりよい方法を提案するほうが、効果的なこともあります。
  growthUpright: >-
    自己成長において、このカードは先人から学ぶよう促しています。本、教師、共同体、実践は、あなたの成長を支える枠組みを与えてくれます。一つの分野や伝統を選んで辛抱強く学び、それをどう受け止めるか決める前に、それが何を差し出してくれるかに気づいてみましょう。
  growthReversed: >-
    逆位置の教皇は、自分自身の指針を書いてみるよう、そっと背中を押しているのかもしれません。ある信念や古い役割から卒業するときを映していることもあります。いま本当に大切にしている価値観を自分の言葉で書き出し、教えられてきたことと重なるところ、そしてそっと分かれていくところに気づいてみましょう。
reflectionQuestions:
  - "あなたが受け継いだ価値観はどれで、自分で選んだ価値観はどれですか？"
  - "誰があなたに大切なことを教えてくれましたか？その教え方から何を学びましたか？"
  - "今週、もう少し詳しく見つめてみたい期待は何ですか？"
imageryNote: >-
  Taroの教皇は、静かな中庭で古い木の下のすり減った石のベンチに座り、さまざまな年齢の聞き手の小さな輪に囲まれた教師として描かれています。教師の腰帯には重い鍵が下がり、学びと実践を通して受け継がれる理解を象徴しています。ベンチに積まれた本と、頭上のアーチに吊るされた鐘は、共有された儀式と学びを感じさせます。中庭の奥の開いた門は、どんな教えも新しい場所へとつながりうることをほのめかしています。
