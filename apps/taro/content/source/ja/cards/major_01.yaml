shortUpright: >-
  必要なものの多くは、思っている以上にすでに手の中にあるのかもしれません。それで何をつくりたいかを、このカードは問いかけています。
shortReversed: "道具はテーブルの上にそろっているのに、意識は別のところにあるのかもしれません。それを集めるには何が助けになるでしょうか。"
meaningUpright: |-
  魔術師は、アイデアを現実のものに変えるカードです。愚者が何の計画もなく踏み出すのに対し、魔術師は立ち止まり、手の届く範囲にあるものを見つめ、それを使うことを決めます。片手を上に掲げ、もう片方の手で下を指す伝統的な姿は、意図と行動、思い描くことと今日実際にできることとの間の架け橋を示しています。
  日常では、このカードは、計画にようやく日付や使える時間、最初の下書きができる瞬間を映しているのかもしれません。たやすくできるために見過ごしがちなスキル、たとえば物事を説明する才能や、小さな問題を解決する力、人と人をつなぐ力を示していることもあります。ここでの機転とは、必要な材料がすでにテーブルの上にあると気づくことです。
  このカードは、あなたの意識がどこへ向かっているかを考えてみるよう促しています。集中はひとつの技術であり、練習することができます。形にしたいことを一つ挙げるとしたら何か、そしてすでに持っている道具のどれがそれを一歩近づけてくれるかを問いかけてみましょう。魔術師は結果を約束するものではありません。意図をもってその場に立ち、手持ちのものを使うことの力を照らし出しているのです。
meaningReversed: |-
  逆位置の魔術師は、能力はあるのにまだ使われていない状態を映しているのかもしれません。スキルもアイデアもあるのに、エネルギーがあちこちに漏れ出しているように感じたり、自分の貢献に意味があるのかと疑ったりしているかもしれません。テーブルは整っているのに、手がまだうまく動いていないのです。
  このカードは、少し横道にそれた器用さを示していることもあります。退屈に感じる作業を、魅力や口のうまさで飛ばしてしまったり、内心は自信がないのに自信ありげな表面を見せたりすることです。どちらも道徳的な欠点ではありません。どちらも、意図と行動が離れてしまったサインなのかもしれません。
  自分の集中がどこで分かれているかを見つめてみるとよいでしょう。小さく具体的な作業を一つ選んでやり遂げることで、自分の手への信頼を取り戻せることがあります。誰も見ていなかったら何を違うふうにするかを問いかけてみるのも、助けになるかもしれません。
aspects:
  relationshipsUpright: >-
    人間関係において、魔術師は明確で率直なコミュニケーションの力を映しているのかもしれません。思っていることを言葉にし、その言葉に見合った行動をとるよう促しています。心のこもったメッセージ、最後までやり遂げた約束、気を散らさずに向ける注意など、小さく意図的なふるまいによって、つながりの雰囲気をどれほど形づくれるかに気づくかもしれません。
  relationshipsReversed: >-
    逆位置のこのカードは、親しい関係の中で、あなたや相手の言葉と行動がかみ合っているかを問いかけているのかもしれません。本当に思っていることを抑えていたり、好かれると思う自分を演じていたりする状態を映していることもあります。たとえ迷いのある意図であっても、本当の気持ちを相手に見せたら何が変わるかを考えてみましょう。
  workUpright: >-
    仕事やプロジェクトにおいて、魔術師はスキルと機会が出会う場面を照らしています。自分の能力、人脈、資源を見直し、それらを一つの明確な目標に向けるよう促しているのかもしれません。始めること、提案すること、試作品をつくること、ついに企画書を書くことのカードです。ここでは、あらかじめすべての答えを持っていることよりも、集中してやり遂げることが大切です。
  workReversed: >-
    逆位置の魔術師は、十分に生かされていない才能や、薄く広がりすぎて何も実を結ばない努力を映しているのかもしれません。誇張したり手を抜いたりしたくなる気持ちを示していることもあります。いま本当にエネルギーを注ぐべき作業はどれか、そしてこの数日間それに誠実に着実に取り組むとしたらどんな形になるかを問いかけてみましょう。
  growthUpright: >-
    自己成長において、このカードは自分自身の主体性に気づくよう促しています。すでに持っているスキル、習慣、支えを書き出し、それらが大切にしている何かにどう役立つかに気づいてみるとよいでしょう。練習、繰り返し、明確な意図は魔術師の静かな道具です。日々の小さな選択が、時間をかけて本当の変化へと積み重なっていきます。
  growthReversed: >-
    逆位置の魔術師は、なれるとわかっている自分と、いま送っている習慣との間のずれを映しているのかもしれません。自信のなさから、誰かの許可を待ってしまっているところはないかと問いかけています。一つのスキルを選び、人前で、不完全なまま練習してみましょう。自信は準備ができたと感じるのを待つことではなく、やってみることから育つと気づくかもしれません。
reflectionQuestions:
  - "あなたのスキルの中で、当たり前だと思いがちなものは何ですか？"
  - "いま、自分の言葉と行動が少しかみ合っていないのはどこですか？"
  - "すでに持っているもので、今日行動に移せる意図は何でしょうか？"
imageryNote: >-
  Taroの魔術師は、夜明けの十字路の市場の露店で、四つのスートを表す四つの素朴な品を並べている姿として描かれています。緑の枝、素焼きの杯、パンを切るためのナイフ、そして一枚の硬貨です。片手は露店に伸び、もう片方の手は明るくなっていく空を指して、アイデアと行動を結びつけています。品々の間を走る光の糸は、別々の道具を一つの目的へとまとめる意識を表し、焼きかけのパンは、つくることがまだ始まったばかりであることをほのめかしています。
