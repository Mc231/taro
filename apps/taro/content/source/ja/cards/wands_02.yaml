shortUpright: "知っている世界の端に立ち、外を見渡しています。どこへ行きたいかを描いてみるのによいときです。"
shortReversed: >-
  心地よさと慎重さが、より大きな計画を棚に置いたままにしているのかもしれません。何があなたをそこにとどめているのか、見直してみましょう。
meaningUpright: |-
  ワンドの2は、最初の火花に続いて、ビジョンのための小休止をもたらします。アイデアはもう単なる感覚ではありません。いまあなたは少し高い場所に立ち、景色を眺めながら、それがどこまで届きうるのかと思いを巡らせています。一本の杖はすでに背後に立てられていて、それはあなたが築いてきたもののしるしです。もう一本は手の中にあり、どこか新しい場所へ運ばれるのを待っています。
  このカードは、より大きな一歩を検討しているときによく現れます。ほかの街での講座を受けること、役割を見直すこと、いつもの日課以上のものを求めるプロジェクトを始めることなどです。まだ愛着はあるけれど、ある場所からもう一回り大きくなってしまった、という落ち着かない感覚を映していることもあります。
  ここでの誘いは、意欲的であると同時に正直に計画することです。何を望んでいるのか、それに時間とエネルギーがどれだけかかるのか、そしてどの最初の一手なら試せるほど小さいかを書き出してみましょう。遠くを見ることは役に立ちます。実際に踏み出せる次の一歩を選ぶことも、同じように役に立ちます。
meaningReversed: |-
  逆位置のワンドの2は、紙の上にとどまったままの計画を映しているのかもしれません。慣れたものが安全に感じられるからか、行き先がまだぼんやりしているからか、荷造りをしないまま地平線を眺め続けているのかもしれません。そのためらいが賢明なこともあれば、ただの習慣であることもあります。
  このカードは、誰かに認めてもらうために立てた計画や、これからなろうとしている自分にもう合わないビジョンを示している場合もあります。目標がわくわくするものではなく重く感じられるなら、それがいまも自分のものなのかを問いかけてみる価値があります。
  新しい目で地図を見直してみるとよいでしょう。この計画をもっと小さく、もっと自分らしくしたら、どんな形になるでしょうか。どの恐れがいちばん大きく、それは一歩そのものへの恐れでしょうか、それとも人にどう思われるかへの恐れでしょうか。それに名前をつけることで、次の一手が跳躍というより、ひとつの選択に感じられるようになるかもしれません。
aspects:
  relationshipsUpright: >-
    人間関係において、このカードはそれぞれが思い描いている未来について話し合うよう促しているのかもしれません。どこに住みたいか、どう時間を過ごしたいか、何を探ってみたいか。それぞれが安心して外の世界へ目を向けられる、確かな拠りどころのような関係を映していることもあります。身近な人に、最近どんな地平線を見つめているのか尋ねてみましょう。
  relationshipsReversed: >-
    逆位置では、あなたか身近な人が、口に出すのはリスクがあると感じて、変化への願いを抑えているのかもしれません。共有されないままの計画は、静かにすれ違っていくことがあります。どちらもひとりで計画することがないよう、話すのと同じくらい耳を傾けながら、胸にしまってきた願いについて話すときなのかもしれません。
  workUpright: >-
    仕事において、ワンドの2は戦略的な思考を示しているのかもしれません。プロジェクトの次の段階を描くこと、新しい分野を検討すること、より長期的な目標を形づくることなどです。日々の作業に戻る前に全体像について考える時間をとり、計画をホワイトボードの上から動き出させるための具体的な行動を一つ選んでみましょう。
  workReversed: >-
    逆位置では、仕事上の計画が心地よさと意欲の間で止まっていたり、自分の望みより、期待されているらしいことによって形づくられていたりするのかもしれません。その目標がいまもあなたのやる気を引き出しているか確かめてみましょう。そうであれば、最初の小さな実験に分けることが助けになります。そうでなければ、計画を描き直すこともまた、前に進むための正当な方法です。
  growthUpright: >-
    自己成長において、このカードは自分自身の大志を真剣に受け止めるよう促しています。いつもの限界を超えて考えることを自分に許したら、何を探ってみたいでしょうか。これからの1、2年の大まかな姿を描いてみましょう。決まった約束としてではなく、機会が現れたときにそれに気づく助けになる方向として。
  growthReversed: >-
    逆位置では、安心したい気持ちと成長したい気持ちが、違う方向に引っぱり合っているのかもしれません。どちらも本物のニーズです。新しい一歩を試せるほど安心できるには何が必要か、そしてどんな支えや練習や情報があれば、遠いアイデアを少しずつ近づけるものに変えられるかを探ってみましょう。
reflectionQuestions:
  - "いつもの日課の先に目を向けたとき、何を探ってみたいと感じますか？"
  - "誰の支えがあれば、より大きな一歩が現実的に感じられそうですか？そのことをその人に伝えましたか？"
  - "この計画を現実の中で試すための、いちばん小さな最初の一手は何でしょうか？"
imageryNote: >-
  高い壁か岩棚の上に人物が立ち、一本の杖をそばにしっかりと立て、もう一本を軽く手に持って、遠くの陸地か海を見つめています。近くには小さな地球儀か地図、あるいは羅針盤が置かれています。立てられた杖はすでに築いたものを、掲げられた杖はさらに先へ進むという選択を表しています。広い眺めは、決まった一本の道ではなく、たくさんのありうる道筋を思い描くよう見る人を誘います。
