imageryNote: >-
  絵には二人の人物、あるいは二つの手が描かれ、それぞれが小さな空間をはさんで、相手に向かって杯を掲げています。二人の間には、絡み合う茎や二匹の魚などの共通の紋章があり、この出会いが、どちらか一方だけでは持てない何かを生み出していることを感じさせます。左右で鏡のように対応する色は対等さを表し、杯がほとんど触れ合うところでは、つながりそのものが光を放っているかのように、やわらかな輝きが生まれています。
