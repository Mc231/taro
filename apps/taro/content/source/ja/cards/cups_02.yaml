  workUpright: >-
    仕事において、カップの2は有望な協力関係や信頼できる同僚、敬意の上に築かれた顧客との関係を示しているのかもしれません。手柄を分かち合い、意見を求め、双方が安心できるくらい取り決めを明確にするよう促しています。よいパートナーシップは、共通のスキルよりも共通の価値観から育つことが多いものです。
  workReversed: >-
    逆位置のカードは、期待が口にされていなかったり、偏っていたりする仕事上の関係を映しているのかもしれません。一方が、合意がないところに合意があると思い込んでいるのかもしれません。それぞれが何を期待しているかを平易な言葉で伝え合い、役割がいまも合っているかを確かめてみましょう。最初はぎこちなく感じられる会話でも、明確さはひとつの思いやりになりえます。
  growthUpright: >-
    ここでの成長のテーマは内なるパートナーシップ、つまり自分の中のいくつかの部分を和解させる機会です。望むことと大切にしていること、あるいは現実的な面とやわらかな面。自分の中の二つの声の短い対話を書いて、すでにどこで意見が一致しているかを見てみましょう。統合とは、内側にパートナーを見つけるような感覚なのかもしれません。
  growthReversed: >-
    逆位置のこのカードは、自分の内側にも築けるはずのバランスの感覚を、人に頼っていないかを問いかけているのかもしれません。自分の見方を信頼する前に、人の承認を求めているところに気づいてみましょう。親しい友人に向けるのと同じ公平さで自分に接することは、一つひとつの小さな選択を通して、心を落ち着かせてくれる習慣になります。
