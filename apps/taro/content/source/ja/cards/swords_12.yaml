shortUpright: "勢いがここにあります。そばに誰がいるかに目を配りながら、すばやい思考を目的のある行動へと向けてみましょう。"
shortReversed: >-
  スピードが考えを追い越しているのかもしれません。少しペースを落とすことで、本当に目指している場所にたどり着けるかもしれません。
meaningUpright: |-
  ソードのナイトは、刃を突き出し、風をうならせながら、全速力で突き進みます。このカードには、決断を下し、いますぐそれを行動に移したいと思う心のエネルギーがあります。決意、声を上げる勇気、そしてためらわずにアイデアを追いかける高揚について語っています。
  問題に真正面から取り組む準備ができたと感じるとき、原則を守るとき、止まっていたプロジェクトをようやく前へ押し進めるときに、このカードを見いだすかもしれません。生産性の高まりや、うまく組み立てられた鋭い主張、ほかの人が避けている難しいことを言おうとする姿勢を映している場合もあります。この推進力には本当の価値があります。停滞を打ち破り、物事を動かしてくれるのです。
  このカードは同時に、前方の道について考えてみるよう促しています。スピードは大切な細部を通り過ぎさせてしまうことがあり、強い意見は静かな声を押し流してしまうことがあります。自分の勢いが明確な目標のためになっているか、そして周りの人が一緒についてきているのか、それとも置き去りにされているのかを問いかけてみましょう。このエネルギーの勇気と率直さを保ちながら、丁寧に方向を選ぶにはどうすればよいでしょうか。
meaningReversed: |-
  逆位置のソードのナイトは、散らばっていたり、速すぎたりするエネルギーを映しているのかもしれません。衝動的に物事を始めたり、とげのある言い方をしたり、どこへ向かっているのかはっきりしないまま押し進めたりしているのかもしれません。その結果、摩擦や疲れが生じたり、引き返す必要が出てきたりすることがあります。
  妨げられた勢いとして読むこともできます。行動したいのに、状況や迷いに引き止められ、それがもどかしさとして積もっていくのです。
  このカードは、少しのあいだ馬を並足に落とすよう促しています。方向を確かめ、自分の言葉の影響を考え、本当に急ぐ必要があるのかを問いかけてみましょう。行動の前にひと呼吸おくことは決意を弱めるのではなく、それを研ぎ澄ましてくれます。急ぐのではなく、目的をもって動いたら、何が変わるでしょうか。
aspects:
  relationshipsUpright: >-
    人間関係において、ソードのナイトは率直さを映しているのかもしれません。思っていることを言うこと、避けてきた会話に踏み込むこと、誰かのために立ち上がることです。正直さはわだかまりを晴らしてくれます。スピードと思いやりのバランスをとり、相手があなたの確信の勢いに圧倒されるのではなく、応える時間を持ち、聞いてもらえたと感じられるようにしてみましょう。
  relationshipsReversed: >-
    逆位置のこのカードは、急いで口にした言葉や、すぐに激しくなる言い争い、相手のペースへのいらだちを示しているのかもしれません。相手の言いたいことについて、急いで結論を出してしまうときに気づいてみましょう。ペースを落とす、問いかける、あるいは返事をする前に一日待つことで、不必要に傷つけ合うのを防げます。
  workUpright: >-
    仕事において、ソードのナイトは物事を片づけるための追い込みを示しているのかもしれません。たまった作業に取り組む、提案を推し進める、明確な機会にすばやく動くことなどです。あなたの集中は周りの人を奮い立たせます。チームがあなたの方向を理解できるよう連絡を密にし、スピードが質を損なわないよう、重要な細部を再確認しておきましょう。
  workReversed: >-
    逆位置のこのカードは、計画なしに作業に飛び込むことや、同僚とのぶつかり合い、遅い手続きへのいらだちを映しているのかもしれません。立ち止まって優先順位を決め、その場しのぎの解決が持ちこたえるかを考えてみましょう。前進が妨げられているなら、エネルギーを準備に向けることで、いざ動くときにずっと効果的になります。
  growthUpright: >-
    自己成長において、ソードのナイトは自分の確信にもとづいて行動するよう促しています。目標を一つ選んで集中して追いかけ、本気の努力から生まれるエネルギーに気づいてみましょう。話し、動く勇気は貴重なものです。それに振り返りを組み合わせることで、本当に望む方向へと成長していけます。
  growthReversed: >-
    逆位置のこのカードは、落ち着かなさや衝動的な選択を映しているのかもしれません。急ぎたくなる衝動を動かしているのは何か、わくわく感なのか、不安なのか、居心地の悪さを避けたい気持ちなのかに気づいてみましょう。決断の前に数回呼吸するだけでも、一日の中に小さな立ち止まりを組み込むことで、反射的に反応するのではなく、思慮深く応じられるようになります。
reflectionQuestions:
  - "いま何を追いかけたいと思っていますか？それはなぜ急ぎに感じられるのでしょうか？"
  - "あなたについてこられるよう、ペースを落としてほしいと思っていそうなのは誰ですか？"
  - "今週、もっとじっくりと下せそうな決断を一つ挙げるとしたら何ですか？"
imageryNote: >-
  このオリジナルの絵には、疾走する馬の上で前のめりになり、刃を突き出し、マントを風にはためかせる乗り手が描かれています。丘の斜面の木々は同じ方向にしなり、ちぎれた雲が頭上を駆けていきます。前のめりの姿勢と駆ける雲は勢いと確信を感じさせ、しなる木々は、そうしたスピードが周りのすべてに及ぼす力をほのめかしています。
