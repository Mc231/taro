shortUpright: "強い流れの中でも揺るがずにいて、感情と明晰な思考の両方で導くよう、このカードは促しています。"
shortReversed: >-
  感情をきつく抑えすぎていたり、不ぞろいにあふれ出たりしているのかもしれません。落ち着いて感情に向き合うには何が助けになるか考えてみましょう。
meaningUpright: |-
  カップのキングは、動く水に囲まれながらも、流れが移り変わる中で穏やかでいる、揺るがない人物として描かれています。このカードは、能動的な形での感情の熟達を表しています。深く感じながらも、知恵と公正さとやさしさをもって応える力です。
  困難な状況の中で、人を導いたり、間を取り持ったり、支えたりするよう求められる瞬間を映しているのかもしれません。カップのキングは感情を否定しません。そうではなく、感情を認めたうえでどう行動するかを選び、心と頭の両方を対話の中に保っているのです。
  日常では、張りつめた会議で落ち着きを保つことや、友人に思慮深い助言をすること、思いやりと現実性のバランスをとった決断をすることなどの形で現れるかもしれません。支配することなく守る、成熟した惜しみない思いやりを示していることもあります。
  このカードは、強い流れにも落ち着いて向き合えると信頼するよう促しています。心をかき乱される状況で、穏やかで思いやりのある応じ方とはどんなものか、そしてそれを差し出すにはどんな支えが助けになるかを問いかけてみましょう。
meaningReversed: |-
  逆位置のカップのキングは、きつく抑えられすぎている感情や、不ぞろいにあふれ出ている感情を映しているのかもしれません。内心は荒れているのに穏やかに見せていたり、状況が求める以上に強く反応してしまったりする自分に気づくかもしれません。
  感情への理解を、人を支えるためではなく、人を操るために使っていることや、自分自身が操られていることを示している場合もあります。責めることなくそれに気づくことが、よりやさしいパターンへの最初の一歩になりえます。
  このカードは、感情を抑え込むのではなく、感情を含んだ落ち着きを見つけるよう促しています。何を感じることを避けているのかもしれないでしょうか。ひそかに感情に名前をつけてみる、応じる前にひと呼吸おく、信頼できる人と話し合うなどを試してみましょう。バランスは、完璧な統制からではなく、正直に認めることから育っていきます。
aspects:
  relationshipsUpright: >-
    人間関係において、カップのキングは、揺るがない成熟した思いやりと、感情が高まる瞬間の穏やかな存在感を映しているのかもしれません。すばやく応じるのではなく、深く耳を傾け、思慮深く応えるよう促しています。自分がどのように人に安心を与えているか、そしてお返しにどのように支えてもらいたいかに気づいてみましょう。
  relationshipsReversed: >-
    逆位置のこのカードは、関係の中の感情的な距離、突然の気分の変化、あるいは主導権をめぐる静かな葛藤を示しているのかもしれません。感情が率直に分かち合われているのか、それとも見えないところで管理されているのかを問いかけてみましょう。正直で落ち着いたコミュニケーションが、信頼と二人の間のバランスの感覚を取り戻す助けになります。
  workUpright: >-
    仕事において、このカードは調整力のあるリーダーシップや後進の指導、プレッシャーの中でチームを落ち着かせておく力を映しているのかもしれません。決断に感情の知性を持ち込むよう促しています。共感と明確な境界線のバランスをとることで、人々が大切にされていると同時に導かれていると感じられる職場が生まれます。
  workReversed: >-
    逆位置のカードは、あふれ出すまで隠されているストレスや、人を落ち着かない状態にさせるリーダーシップを映しているのかもしれません。緊張にどうすればオープンかつ公正に向き合えるかを考えてみましょう。支えを求めたり、作業の一部を任せたりすることで、プレッシャーが水面下で積み重なるのを防げます。
  growthUpright: >-
    自己成長において、カップのキングは感情と理性をひとつにするよう促しています。感情に気づき、名前をつけ、そのうえで自分の価値観に合った応じ方を選ぶ練習をしてみましょう。時間とともに、嵐のようなときにもバランスを保てるという静かな自信が育っていきます。
  growthReversed: >-
    逆位置のこのカードは、強い感情をどう扱っているかを探るよう求めているのかもしれません。すべてを内に抱え込むか、すべてを吐き出すかというパターンに気づくかもしれません。呼吸のためにひと息つく、話す前に書いてみるなどのやさしい習慣が、感情を尊重しつつも感情に支配されない中間地点を見つける助けになります。
reflectionQuestions:
  - "強い感情がわき上がったとき、あなたはどう応じがちですか？"
  - "人生の中で、誰に穏やかで思いやりのある導きを差し出せそうですか？"
  - "いま心をかき乱されている状況で、落ち着いていられるには何が助けになりそうですか？"
imageryNote: >-
  絵には、風化した石の台の上、動く水の上方に座る冠を戴いた人物が描かれ、片手に杯を、もう片方の手に短い杖を持っています。周りの水は上下に揺れていますが、人物の肩の力は抜けたままで、まなざしはまっすぐに保たれています。この対比が感情の熟達を感じさせ、金色の差し色であたためられた深い青が、知恵と惜しみなさをほのめかしています。
