shortUpright: "過去を正直に振り返り、許せることを許し、自分を前へと呼んでいるものに応えるとき。"
shortReversed: "内なる批判の声が、いつもより大きくなっているのかもしれません。公正でやさしい目で過去を見たら、何が見えるでしょうか。"
meaningUpright: |-
  審判は、目覚めと再生のカードです。人から裁かれることよりも、正直に自分を振り返る地点にたどり着くことについてのカードです。これまで歩んできた場所を見つめ、学んだことを受け取り、新しい章へと立ち上がる準備ができたと感じること。そこにはしばしば、呼びかけのような感覚、いまがそのときだと告げる内なる促しがあります。
  日常では、このカードは長い混乱のあとに訪れる明晰な瞬間や、先延ばしにしてきたことにようやく取り組むという決断、あるいは前に進む助けになる、過去の選択との向き合いを映しているのかもしれません。自分自身や誰かを許すことや、自分の物語をより広く公正な光の中で見たときの安堵を示していることもあります。
  このカードは、いま何があなたを呼んでいるのかを考えてみるよう促しています。これまでの経験がそのための準備になっていたと信じられたら、何をするかを問いかけてみましょう。審判は、理解を通した再生を照らしています。自分の歩みを正直さと思いやりをもって見つめられたとき、次に来るものをより自由に選べるようになるかもしれません。
meaningReversed: |-
  逆位置の審判は、厳しい内なる批判者を映しているのかもしれません。昔の失敗を何度も思い返したり、自分の価値を疑ったり、過去の何かのために前に進むのをためらったりしていることがあります。呼びかけはそこにあるのに、罪悪感や恐れがそれをかき消しているのかもしれません。
  このカードは、振り返ることそのものを避けていることを示している場合もあります。起きたことから学ぶために立ち止まることなく、次から次へと移っていくことです。
  友人に向けるのと同じ公正さで、自分の過去を見つめてみるとよいでしょう。何を学び、何を下ろす準備ができているでしょうか。若いころの自分に宛てて、理解のこもった手紙を書くことも、ひとつの始め方です。呼びかけに応えるのに完璧さは必要ありません。正直な一歩から始められます。
aspects:
  relationshipsUpright: >-
    人間関係において、審判は転機を映しているのかもしれません。古いわだかまりが解けること、あらためて関係に向き合う決意、あるいは二人の距離を縮める互いの振り返りです。過去について正直に話し合い、これから何を望むかを一緒に決めるよう促しています。しっくりくるなら、許すことが新しいスタートのための場所をつくってくれます。
  relationshipsReversed: >-
    逆位置のこのカードは、関係の中で、一方あるいは双方に残っている責めや裁きの気持ちを示しているのかもしれません。古い傷にしがみつくことが、いまもあなたを守っているのか、それとも動けなくしているのかを考えてみましょう。オープンで落ち着いた会話が、お互いに物事をより公正に見る助けになるかもしれません。
  workUpright: >-
    仕事やプロジェクトにおいて、審判は天職の感覚を照らしています。どんな仕事に意味を感じるのかに気づくことや、次に何をするか決めるために過去のプロジェクトを振り返ることを映しているのかもしれません。何に心が躍るのかに耳を澄まし、自分のスキルをその方向にどう生かせるかを問いかけてみましょう。
  workReversed: >-
    逆位置の審判は、批判への恐れに引き止められていることや、変化のときだという感覚を無視していることを映しているのかもしれません。過去の成果に対して批判的になりすぎていることを示している場合もあります。学んだことを書き出し、それが次の一歩をどう導いてくれるかを考えてみましょう。
  growthUpright: >-
    これまでの歩みを丁寧に振り返ること自体が、転機になりえます。大切な時期を振り返り、どのように成長し、何を手放してきたかに気づいてみましょう。その視点が、新しい呼びかけに自信と明晰さをもって応える助けになります。
  growthReversed: >-
    逆位置の審判は、不必要な罪悪感や自責の念を抱えていないかを問いかけているのかもしれません。自分についての古い物語を手放す必要を映している場合もあります。内なる声が厳しくなったときに気づき、もっと公正な見方をそっと自分に差し出す練習をしてみましょう。より公正な内なる声は、成長をより軽く、より可能なものに感じさせてくれます。
reflectionQuestions:
  - "いま、何があなたを前へと呼んでいるように感じますか？"
  - "自分自身も含めて、もっと公正な目で見る準備ができている人はいますか？"
  - "過去から学んだことのうち、次の章へ持っていきたいものは何ですか？"
imageryNote: >-
  Taroの審判は、長い冬が明けた広い夜明けの風景として描かれています。丘の上から澄んだ鐘の音が響き、人々が家から最初の光の中へ出てきて、伸びをしながら空を見上げています。溶けていく雪の下からは、緑の芽がのぞいています。カーテンが外へとなびく開いた窓は、内なる呼びかけに応えていることを感じさせます。遠くの山々は正直な振り返りがもたらす視野をほのめかし、淡い朝の色が再生を語っています。
