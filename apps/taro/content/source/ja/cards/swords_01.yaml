shortUpright: "はっきりとした考えが訪れています。それを平易な言葉にしたとき、何がシンプルになるかに気づいてみましょう。"
shortReversed: "明晰さは近くにあっても、まだ手が届かないのかもしれません。決める前に、霧が落ち着くのを待つ余地があります。"
meaningUpright: |-
  ソードのエースは、考えが焦点を結ぶ瞬間です。騒がしさや混乱の時期のあとで、白紙に引かれた一本の線のように、一つのアイデアがくっきりと際立ちます。このカードは、以前よりもはっきり見えるようになったことは何か、そしてその明晰さが何を可能にするかを考えてみるよう促しています。
  日常では、何週間も考えあぐねてきた気持ちに、ようやく言葉が見つかることや、複雑だと思っていた問題に、ひとつの正直な核があると気づくことなどの形で現れるかもしれません。新しい計画の始まりや、声に出して尋ねる準備のできた問い、もう言葉を濁さずに言える決断であることもあります。ときには、ただ理解できたという安堵であることもあります。
  明晰な思考はひとつの道具であり、どんな道具もそうであるように、丁寧に扱うときにうまく働きます。この新しい明晰さを、真実と、それが触れる人々の両方を尊重する形でどう使えるかを問いかけてみましょう。シンプルなことをやさしく伝え、一つのはっきりとした考えに次の小さな一歩を導いてもらうとしたら、どんな形になるでしょうか。
meaningReversed: |-
  逆位置のソードのエースは、妨げられていたり遅れていたりする明晰さを映しているのかもしれません。アイデアはあるのに、するりと逃げてしまったり、ほかのたくさんの考えと絡まったまま訪れたりするのです。頭の中で同じ議論を何度も繰り返していたり、メッセージを何度も書き直しながら送れずにいたりする自分に気づくかもしれません。
  思いやりを失った鋭さとして読むこともできます。聞き入れるのが難しいほど率直すぎる伝え方の真実や、ほかの見方を締め出してしまう確信です。明晰さは、理解するためではなく勝つために使われると、もろくなってしまうことがあります。
  このカードは、考えに余白を与えるよう促しています。書き出してみる、散歩する、信頼できる人と話すことで、霧はひとりでに薄れていくことがあります。今日、答えのすべてが必要なわけではないかもしれません。すでにわかっている小さなことを一つ挙げるとしたら何でしょうか。そこから始めてみませんか。
aspects:
  relationshipsUpright: >-
    人間関係において、ソードのエースはわだかまりを晴らす会話を示しているのかもしれません。ようやく自分に必要なことを言葉にできたり、身近な人がずっと伝えようとしてきたことを聞き取れたりするのかもしれません。ぬくもりをもって差し出される正直さは、関係を軽やかにしてくれます。真実が壁ではなく橋になるよう、はっきりしていながら鋭すぎない言葉を選んでみましょう。
  relationshipsReversed: >-
    逆位置のこのカードは、言われないままの言葉や、鋭すぎる言い方で言われた言葉を映しているのかもしれません。お互いが相手の意図を推測し合っているために、誤解が大きくなっているのかもしれません。難しい会話の前にペースを落としてみましょう。相手に本当に理解してほしいことは何で、相手がそれを受け止めるには何が助けになるでしょうか。鋭い答えよりも、やさしい問いのほうが多くを開いてくれることがあります。
  workUpright: >-
    仕事やプロジェクトにおいて、ソードのエースは理解の突破口を示しているのかもしれません。ようやく筋の通った課題設定、すっきりとした計画、試す価値のある新しいアイデアなどです。新鮮なうちにアイデアを書き留め、それを磨くのを手伝ってくれる人と共有するのによいときかもしれません。目標がはっきりすると、次の手順も見えやすくなることが多いものです。
  workReversed: >-
    逆位置のこのカードは、霧がかかったように感じられるプロジェクトを示しているのかもしれません。不明確な目標、食い違うメッセージ、一度にせめぎ合うたくさんのアイデアなどです。もっと強く押すより、一歩引くほうが役立つかもしれません。いま最も大切な問いを一つ言葉にしてみたり、推測するのではなく関わる人たちに確認したりしてみましょう。ときには、まだわからないことを認めるのが、最も明確な一手になります。
  growthUpright: >-
    自己成長において、ソードのエースは、自分に語っている物語に気づき、それを実際にわかっていることと照らし合わせるよう促しています。新鮮な視点は、古い思い込みをゆるめてくれます。考えを平易な言葉でとらえる方法としてジャーナルを書いてみましょう。そうすれば、考えを通して見るのではなく、考えそのものを見つめることができます。自分の心への好奇心は、静かな形の勇気になりえます。
  growthReversed: >-
    逆位置のこのカードは、忙しく働いているのに前に進んでいない心、同じ心配や計画をぐるぐると繰り返している状態を映しているのかもしれません。考えることが考えすぎに変わったときに気づいてみましょう。休息や体を動かすこと、場所を変えることが、考えが落ち着くための余白を与えてくれます。明晰さがそれ自身のペースで集まってくるまで、問いをもう少し開いたままにしておいてもかまいません。
reflectionQuestions:
  - "1か月前には言葉にできなかったことで、いまは理解していることは何ですか？"
  - "どこで、はっきりとしたやさしいひとことが、関係を軽くしてくれそうですか？"
  - "消えてしまう前に書き留めておきたいアイデアは何ですか？"
imageryNote: >-
  このオリジナルの絵の中心には、分かれていく雲を貫いてまっすぐにそびえる一本の刃があり、その刃先が最初の光をとらえています。上部近くには細い輪がかかっていて、はっきりとした考えが導きとなる原則になりうることを感じさせます。周りを開けた空と流れる空気、つまり思考と呼吸のエレメントが包んでいます。冷たい朝の空気のように、すっきりと目覚めた雰囲気が、散らばっていた心がたどるべき一本のくっきりとした線を見つける瞬間を指し示しています。
