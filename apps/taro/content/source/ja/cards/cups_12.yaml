  relationshipsReversed: >-
    逆位置のこのカードは、ちぐはぐなメッセージや気分の波、誰かを理想化することを示しているのかもしれません。あなたも相手も、気持ちがはっきりと一貫して伝えられているかを問いかけてみましょう。小さな約束を守るなど、日々の頼もしさにロマンスを根づかせることで、時間とともに、より深い信頼が築かれていきます。
  workUpright: >-
    仕事において、このカードは創作の提案や、情熱に突き動かされたアイデア、想像力と共感を生かせる役割を映しているのかもしれません。大切に思っていることを提案したり、いまの作業にもっと心を込めたりするよう促しています。熱意は、やり遂げる力と組み合わさったとき、周りにも伝わっていきます。
  workReversed: >-
    逆位置のカードは、提案の段階で止まったままのアイデアや、気分によって上下するやる気を映しているのかもしれません。大きなビジョンを、続けられる小さな手順に分けてみましょう。自分の余力について正直でいることは、あなたの理想と、人があなたに寄せる信頼の両方を守ってくれます。
  growthUpright: >-
    自己成長において、カップのナイトは、心を動かすものに従うよう促しています。それが自分にとって大切だというだけの理由で、創作や思いやりの活動を試してみましょう。何が心を揺さぶるのかに気づくことで、自分の価値観がはっきりし、何気ない日々の中でそれに沿って生きる助けになります。
  growthReversed: >-
    逆位置のこのカードは、思い描く自分と実際の行動との間のずれを探るよう求めているのかもしれません。熱意をもって始めては、しだいに薄れていくパターンに気づくかもしれません。情熱を注ぐものの周りにやさしい習慣を築くことで、最初の気持ちの高まりを越えて長続きさせることができます。
reflectionQuestions:
