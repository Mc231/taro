imageryNote: >-
  絵には、落ち着いた馬に乗った人物が、川岸か静かな谷をゆっくりと進み、捧げもののように杯を前に差し出している姿が描かれています。鎧やマントにあしらわれた波や貝殻の模様は、想像力と感情の深さを感じさせるのかもしれません。近くを流れる水は、感情の動きを響かせています。やわらかな青と銀色に、あたたかな色をひとさし添えた色調が、ロマンス、誠実さ、そして夢見るような目的意識を伝えています。
