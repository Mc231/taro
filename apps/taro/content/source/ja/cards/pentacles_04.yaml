shortUpright: >-
  何かを守るために、しっかりと抱えているのかもしれません。その守りがどこで支えになり、どこで窮屈になり始めているか気づいてみましょう。
shortReversed: >-
  きつく握った手がゆるみつつある、あるいはゆるめたがっているのかもしれません。不安を感じずに流れに任せられるものを探ってみましょう。
meaningUpright: |-
  ペンタクルの4は、硬貨をしっかり抱えている人物を描いています。一枚は胸に押し当て、ほかは足の下や頭の上にしっかりと保っています。これは安心と、持っているものを守りたいという衝動についてのカードです。それはお金であることもあれば、時間、エネルギー、空間、感情であることもあります。
  そこには知恵があります。不確かな時期のあとでは、しっかり抱えておくことは理にかなった選択でありえます。自分のためにエネルギーの一部をとっておくこと、心を落ち着かせてくれる日課を守ること、週末の周りに境界線を引くことの中に、このカードを見いだすかもしれません。
  けれども、同じ姿勢がこわばってしまうこともあります。長く握りしめすぎた手は、新しいものを受け取ることができません。このカードは、大切だから抱えていることと、手放すのが怖いから抱えていることの違いに気づくよう促しています。自分が何を守っているのか、もう少し開かれた状態でも安心できるには何が必要か、そして抱えているものの中に、分かち合ったり、喜びのために使ったり、変わるのを許したりできるものがないかを問いかけてみましょう。
meaningReversed: |-
  逆位置のペンタクルの4は、ゆるみ始めた握る手を映しているのかもしれません。すべてをその場に保っておくのにどれほどの労力がかかっているかに気づき、少し力を抜いたらどうなるだろうと思い始めているのかもしれません。それは自由にも、落ち着かなくも感じられるでしょう。
  同じテーマの反対側を示している場合もあります。不足への心配がしがみつく形で表れることや、対照的に、あまり注意を払わないまま資源がこぼれていくことです。どちらも、安心はもろいものだという同じ感覚から来ていることがあります。
  「十分」との自分の関係を探ってみましょう。時間、お金、注意、休息において、何があれば十分だと感じられるでしょうか。自分のペースで、自分や人への惜しみなさを小さく試してみることで、どこでなら開かれていても安心でき、どこではまだ境界線が役立っているのかが見えてきます。
aspects:
  relationshipsUpright: >-
    人間関係において、このカードは守ろうとする気持ちを映しているのかもしれません。自分の気持ちや自立、時間を守ることです。健全な境界線はその一部です。用心深さが、身近な人を遠ざけていないかにも気づいてみましょう。自分についての小さく本当のことを一つ分かち合うことで、そのつながりにもう少し開かれる余地があるかを確かめられます。
  relationshipsReversed: >-
    逆位置のカードは、やわらいでいくこと、つまり誰かを迎え入れたり、誰が何を与えたかを慎重に記録するのをやめたりする準備ができていることを示しているのかもしれません。誰かを失うことへの心配が、コントロールとして表れていることを映している場合もあります。何があれば安心できるのかをやさしく問いかけ、握る手を強めるかわりに、それについて話してみましょう。
  workUpright: >-
    仕事において、ペンタクルの4は慎重で守りの姿勢を表しているのかもしれません。足場のように感じられる役割や方法や情報を手放さずにいることです。安定には価値があります。その慎重さがいまも合っているのか、それとも知識を共有したり新しいやり方を試したりすることで、自分の立場がむしろ強く感じられるようにならないかを問いかけてみましょう。
  workReversed: >-
    ここでのカードは、職場での硬直した習慣をゆるめること、人に任せること、手柄をもっと気前よく分かち合うことを映しているのかもしれません。時間や努力が散らばって使われていることを示している場合もあります。毎週エネルギーがどこへ向かっているかを見て、何を慎重に守るべきで、何をもっと楽に流してよいかを、意図的に決めてみましょう。
  growthUpright: >-
    自己成長において、このカードは自分にとって安心とは何かを探るよう促しています。抱えているものの中には大切な錨もあれば、つらかった時期の古い備えもあるかもしれません。それらをやさしく仕分けし、いまも自分を支えてくれるものは残し、もうそれほど厳重に守らなくてよいものに気づいてみましょう。
  growthReversed: >-
    逆位置のカードは、信頼すること、喜びをもたらすものにエネルギーを使うこと、日課が変わるのを許すことへの意欲が育っていることを映しているのかもしれません。コントロールをゆるめるときにわき上がる居心地の悪さに気づき、好奇心をもってそれを扱ってみましょう。物事を軽く抱えながら安心していられることは、少しずつ育てていける技術です。
reflectionQuestions:
  - "いま何をしっかり抱えていますか？それはあなたを何から守っていますか？"
  - "どこで、もう少し開かれることが、誰かとの距離を縮めてくれそうですか？"
  - "今月、時間やエネルギーや資源において、何があれば十分だと感じられますか？"
imageryNote: >-
  絵には、一枚の硬貨を胸に抱えて座る人物が描かれているのかもしれません。ほかの硬貨は足の下に置かれ、頭の上でバランスをとっていて、背後の遠くには町が見えます。閉じた姿勢は守りと自己完結を、遠くの建物は輪の外に置かれた世界を感じさせます。どっしりとした角ばった形と閉じたシルエットが安定を強調すると同時に、その安定にどんな代償があるのかという問いも投げかけています。
