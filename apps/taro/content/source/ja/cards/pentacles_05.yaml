imageryNote: >-
  絵には、壁に沿って雪や雨の中を進む二人の人物が、悪天候に頭を垂れている姿が描かれているのかもしれません。その上では、五枚の硬貨が模様に組み込まれた窓が明るく輝いています。冷たい道と明かりのともる窓の対比は、すぐ近くの居場所と並んでいる苦難を象徴しているのかもしれません。窓が人物たちの視線から少し外れたところにあることは、支えがそこにあるのに、まだ気づかれず、手を伸ばされていないことを感じさせます。
