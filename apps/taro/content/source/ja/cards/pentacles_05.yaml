  workUpright: >-
    仕事において、ペンタクルの5は、資源が限られている、認められていないと感じる、決定の輪の外にいると感じるといった、苦しい時期を映しているのかもしれません。同僚、支援のネットワーク、スキルアップの制度など、あなたが利用できる明かりのともった窓を探し、どんな現実的な一歩が負担をやわらげてくれるかを考えてみましょう。
  workReversed: >-
    ここでのカードは、状況がよくなり始めていることや、必要な支えを求めようとする気持ちを映しているのかもしれません。つらい時期のあとに残る慎重さを示している場合もあります。何が変わったかに気づき、つらい時期が教えてくれた教訓は残しつつ、より安定した足場を計画に反映させてみましょう。
  growthUpright: >-
