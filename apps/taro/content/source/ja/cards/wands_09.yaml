shortUpright: "たくさんのことを乗り越えて、いまも立っています。このカードは、最後のひと踏ん張りにあるあなたの回復力をたたえています。"
shortReversed: "長く身構え続けるのは疲れるものです。どこでなら安心して休み、人を迎え入れられるか気づいてみましょう。"
meaningUpright: |-
  ワンドの9は、困難をくぐり抜けて、いまも自分の足で立っている人物を描いています。その人は一本の杖にもたれ、少し疲れながらも用心深く、自分で築いた柵のように立てられたほかの杖の輪の中にいます。これは経験の傷をいくらか負った回復力です。無傷ではないけれど、打ち負かされてもいないのです。
  長いプロジェクトが終わりに近づいているとき、介護や勉強の大変な時期を乗り越えようとしているとき、あるいはつまずきに直面しながらも続けることを選んだときに、このカードはあなたに語りかけるかもしれません。いまのあなたは、始めたときよりも多くのことを知っています。自分の限界がどこにあるかも含めて。
  このカードは、ここまでどれだけ歩んできたかを認め、学んだことを生かすよう促しています。粘り強さは大切ですが、ペース配分もまた大切です。はっきりしたゴールライン、数時間の休息、現実的な境界線、あるいは感じているよりもゴールに近いという気づきなど、この最後のひと踏ん張りを乗り越えるには何が助けになるかを問いかけてみましょう。
meaningReversed: |-
  逆位置のワンドの9は、時間とともに積み重なった疲れを映しているのかもしれません。あまりに長く自分やプロジェクトを守ってきたために、力を抜くことなどできないように感じているのかもしれません。過去の困難から学んだ用心深さが、あらゆる新しい状況への疑いに変わってしまうこともあります。
  このカードは、限界に達しつつあることを示している場合もあります。押し切ることがいつも最も強い選択とは限りません。ときには、休みや助けが必要だと認めることこそが強さなのです。
  自分の守りがどこではまだ役に立っていて、どこでは困難だけでなく支えまで締め出しているのかを探ってみましょう。頼れる人や、任せられる作業、自分に許せる小休止はないでしょうか。安心できる場所で少しだけ守りをゆるめることは、これまで築いてきた回復力をいたわる方法になりえます。
aspects:
  relationshipsUpright: >-
    親しい関係において、このカードはつらい時期を乗り越えて、いまも続いている関係を映しているのかもしれません。過去の傷から学んだ用心深さを示している場合もあります。二人で築いてきた安定に感謝しながら、信頼できると示してくれた相手に対して、古い警戒心がまだ必要なのかどうかにも気づいてみましょう。
  relationshipsReversed: >-
    逆位置では、またがっかりさせられるのを避けるために人と距離を置いていたり、疲れすぎていつもほど与えられないと感じていたりするのかもしれません。身近な人に、余力が少なくなっていると伝えることを考えてみましょう。支えてもらうことを自分に許すと、関係は弱まるのではなく、深まることがあります。
  workUpright: >-
    仕事や学びにおいて、ワンドの9は長い取り組みの最後のひと押しを示しているのかもしれません。経験によって、障害についてより現実的に見られるようになっていて、その知識は役に立ちます。残りの手順を丁寧に計画し、集中を守り、始めた理由を思い出してみましょう。そうすれば、最後のひと踏ん張りが、ただ消耗するものではなく目的のあるものに感じられます。
  workReversed: >-
    逆位置では、限界に近づいていたり、守りに入った働き方をしていたり、何もかもひとりで抱えなければと感じていたりするのかもしれません。人に任せられること、延期できること、簡単にできることを見てみましょう。自分の余力について正直に話すことは、あなたと仕事の両方を守る、責任ある選択になりえます。
  growthUpright: >-
    あなたは、自分で思っている以上にたくましいのかもしれません。これまで向き合ってきた困難の一つひとつが、自分に何が乗り越えられるのかを教えてくれました。最近の困難から得た教訓をいくつか書き出し、それがもう少しの自信と、もう少しの余裕をもって自分を導いてくれる方法を考えてみましょう。
  growthReversed: >-
    逆位置では、絶え間ない警戒が負担になっているのかもしれません。あなたにとっての休息とはどんなものか、そして自分にそれを十分に許しているかを探ってみましょう。静かな夜や正直な会話など、小さく安全な形で守りをやわらげることで、強さが鎧のように感じられることが少なくなるかもしれません。
reflectionQuestions:
