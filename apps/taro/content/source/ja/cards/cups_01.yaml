shortUpright: "新しい感情がわき上がっているのかもしれません。それを迎え入れ、どこへ流れていきたがっているのか気づいてみませんか。"
shortReversed: "注ぐ前に、まずあなたの杯を満たす必要があるのかもしれません。今日、何が静かにあなたを満たしてくれるか考えてみましょう。"
meaningUpright: |-
  カップのエースは、水のスートの最初のさざめきです。満ちあふれてこぼれ出すほどの、ひとつの器。それは、言葉にする前に訪れる感情を映しているのかもしれません。やさしさ、畏敬の念、安堵、あるいは誰かや何かへのふとしたぬくもりです。まだそれをどうにかする必要はありません。このカードはただ、それがそこにあることに気づくよう求めています。
  日常では、何週間ぶりかに心から笑うことや、音楽に心を動かされること、何もしていないのに昔のわだかまりがやわらいでいると気づくことなどの形で現れるかもしれません。新しい創作の衝動や、自分にもっとやさしくしたいという願いを示していることもあります。
  このカードは、感情をすぐに整理しようとするのではなく、開かれたままでいるよう促しています。あなたの思いやりがどこへ向かいたがっているのか、そしてその一部を自分自身にも届けているかを問いかけてみましょう。開かれた心は何かを約束するものではありません。内側に少し多くの余白をもって一日を迎える、ひとつの方法なのです。
meaningReversed: |-
  逆位置のカップのエースは、感情はあるのに、蓋をした壺の中の水のように、胸の内にしまわれていることを示しているのかもしれません。人の世話で忙しかったのかもしれませんし、しばらく感情から距離を置くほうが安全に感じられたのかもしれません。それは何も悪いことではありません。心を守ることは、大変な時期への賢明な応じ方でありえます。
  このカードは、空っぽのまま走っている感覚を映していることもあります。ささやかな楽しみが心に響かなかったり、しばらく満たされていない杯から与え続けていたりすることに気づくかもしれません。
  ここでの誘いはやさしいものです。もっと感じようと無理をするのではなく、睡眠、水辺の散歩、急がない会話、誰にも必要とされない1時間など、静かに自分を回復させてくれるものに目を向けてみましょう。何かが杯を満たしてくれたら、そのことに気づくのを自分に許しましょう。開かれた心は、それ自身のペースで戻ってきます。
aspects:
  relationshipsUpright: >-
    親しい関係において、カップのエースは、パートナーでも友人でも家族でも新しく出会った人でも、新たに押し寄せるぬくもりを映しているのかもしれません。思い浮かんだから送るメッセージ、正直な「ありがとう」、まるごと向ける注意のひとときなど、計算せずにシンプルに愛情を表すよう促しています。思いやりを与えるだけでなく、受け取るのがどんな感じかにも気づいてみましょう。
  relationshipsReversed: >-
    逆位置のこのカードは、過去の傷か単なる疲れのために、愛情が抑えられていることを示しているのかもしれません。礼儀正しく耳を傾けながらも、少し手の届かないところにいる自分に気づくかもしれません。無理をする必要はありません。感謝していることを伝えるなど、安心してできる小さな一歩が、あなたと身近な人の間にもう少しぬくもりを通わせられないか考えてみましょう。
  workUpright: >-
    仕事や大切にしているプロジェクトにおいて、このカードは新たな熱意や、本当に心を動かす新しいアイデアを映しているのかもしれません。自分のしていることに気持ちを込めるよう促しています。関わる人への思いやり、技を磨く喜び、何が育ちうるかへの好奇心です。現実的な事情がそれを形づくり始める前に、いま何にわくわくしているかを書き留めてみましょう。
  workReversed: >-
    逆位置のカードは、関心はどこか別のところで待っていて、手だけが動いているような、機械的になった仕事を映しているのかもしれません。長い努力のあとにはよくあることです。そもそも何がこの道にひきつけたのか、あるいはその中のどの小さな部分がまだ生き生きと感じられるかを問いかけ、その部分にもっと場所を与えることで流れが戻ってこないか見てみましょう。
  growthUpright: >-
    自己成長において、カップのエースは自分自身に対して感情に正直であるよう促しています。感情が訪れたときに、よい悪いと順位をつけずに名前をつけてみる練習をしてみましょう。ジャーナルを書く、水辺で過ごす、あるいは応じる前に一拍おくことが、そのための余白をつくってくれます。目指すのはいつも幸せでいることではなく、自分の内面との、よりやさしく開かれた関係です。
  growthReversed: >-
    逆位置のこのカードは、外へもっと差し出す前に、思いやりを内側に向けることを示しているのかもしれません。蓄えが少なく感じられるなら、休息やささやかな楽しみを、あってもなくてもよいものではなく、必要なものとして扱ってみましょう。何が自分を消耗させ、何が満たしてくれるのかに気づくことも助けになります。重い気持ちが続くようなら、信頼できる人に話すことも役立つ一歩です。
reflectionQuestions:
  - "最近、どんな感情があなたの注意を引こうとしていますか？"
  - "最近、誰が、あるいは何があなたの杯を満たしてくれましたか？どう感謝を伝えられそうですか？"
  - "今週、もう少しぬくもりを迎え入れるための小さな方法は何でしょうか？"
imageryNote: >-
  絵の中心には、なみなみとあふれるひとつの器があり、その水が何本もの細い流れとなって、下の静かな池に落ちています。水面に浮かぶスイレンやハスの葉は、ゆっくりと開き、深いところに根を張る感情を表しているのかもしれません。杯の上のやわらかな光は、受け取る力、つまりつかみ取るのではなく差し出された捧げものを感じさせます。全体の雰囲気は穏やかな豊かさです。十分すぎるほどのものが、そっと外へとあふれ出しています。
