shortUpright: >-
  着実で頼れる努力が、物事を前へ進めています。進み具合がゆっくりに感じられても、変わらず取り組み続けることの価値に気づいてみましょう。
shortReversed: >-
  一貫性が、マンネリに変わってしまったのかもしれません。どこでペースを少し変えれば、エネルギーが戻ってきそうか考えてみましょう。
meaningUpright: |-
  ペンタクルのナイトは、突進するのではなく静かに立ち止まる、重く辛抱強い馬に乗っています。コートカードの中で、このナイトはいちばん急がず、いちばん頼りになる存在です。着実な前進、丁寧な計画、そして言ったことをやり遂げる静かな強さについて語っています。
  何か月も日課を続けること、ほかの人が興味を失った作業を終わらせること、長いプロジェクトのために毎日少しずつ時間をとっておくこと、何か実際的なことが必要なときに友人に頼りにされる存在であることの中に、このカードを見いだすかもしれません。そのペースはわくわくするものではないかもしれませんが、続けられるものであり、それが大切なのです。
  このカードは、一貫性を強みとして認めるよう促しています。何に取り組むと決めていて、定期的に顔を出すことがそれをどう前へ進めているでしょうか。計画が現実的かを確かめ、それを支える日課を守り、やり遂げるたびに自分や人の中に築かれていく信頼に気づいてみましょう。目標の中には、勢いではなく粘り強さによってたどり着くものもあります。
meaningReversed: |-
  逆位置のペンタクルのナイトは、停滞へと変わってしまった着実さを映しているのかもしれません。役に立たなくなってからも日課が続いていたり、慎重さのために新しいことを何も試せなかったりするのかもしれません。毎日が同じように感じられ始め、方向感覚や喜びがあまりないまま仕事が続いていくこともあります。
  ここでは、行き過ぎてしまった資質が示されています。頼もしさはいまも価値があります。ただ、少し風を通す必要があるのかもしれません。
  主に習慣で続けている日課はどれかを問いかけてみましょう。新しい道順、作業の順番を変える、新しい目標など、小さな変化を一つ加えることで、動きが戻ってこないでしょうか。慎重さに引き止められているなら、小さくリスクの低い実験とはどんなものかを考えてみましょう。丁寧に選ばれた変化であれば、着実さの中にも変化を含められます。
aspects:
  relationshipsUpright: >-
    人間関係において、このカードは頼りになる辛抱強い思いやりを映しているのかもしれません。変わらずそばにいること、約束を守ること、ゆっくりと信頼を築くことです。関係の中で安定した存在があなたなのかもしれませんし、そういう人に感謝しているのかもしれません。頼もしさがどう安心を生んでいるかに気づき、その感謝を言葉にしてみましょう。
  relationshipsReversed: >-
    逆位置のカードは、決まりきったものに感じられる関係や、気持ちを表すのを妨げる慎重さを示しているのかもしれません。一緒に過ごす時間に小さな変化を加えたり、ふだんは実際的な話で済ませて口にしないことを分かち合ったりしてみましょう。予測できることとぬくもりは、お互いが手をかければ、ともにありえます。
  workUpright: >-
    仕事において、ペンタクルのナイトは勤勉で計画的な前進を表しているのかもしれません。あなたは、最後までやり遂げ、細部を確かめ、プロジェクトを動かし続ける人なのかもしれません。この貢献の価値を認め、自分のペースと仕事量が長く続けられるものであるよう気を配ってみましょう。
  workReversed: >-
    ここでのカードは、くり返しに感じられる仕事や、自ら動き出すことへのためらいを映しているのかもしれません。改善を提案したり、何か新しいことを学んだりできる小さな領域を探してみましょう。頼もしさと好奇心のバランスをとることで、仕事は信頼でき、しかも張り合いのあるものであり続けます。
  growthUpright: >-
    自己成長において、このカードはゆっくりと着実な努力を大切にするよう促しています。一日ずつ築かれた習慣は、劇的な決意よりも長続きすることが多いものです。自分を支えてくれるシンプルな日課を一つ選んで決めた期間続け、一貫性が自分への信頼の感覚をどう形づくるかに気づいてみましょう。
  growthReversed: >-
    逆位置のカードは、行き詰まりややる気のなさ、不確かさを避けるために日課にしがみつくことを映しているのかもしれません。どんな変化を先延ばしにしてきたのか、そしてそれはなぜかを探ってみましょう。小さく取り組みやすい形で変化を取り入れることで、地に足がつきながらも生き生きとした感覚を得られます。
reflectionQuestions:
  - "何に取り組むと決めていますか？それに向き合い続けるのを助けてくれるものは何ですか？"
  - "どこで人に頼りにされていますか？いまそれをどう感じていますか？"
  - "今週、どの日課に小さなペースの変化を加えられそうですか？"
imageryNote: >-
  絵には、どっしりと動かない馬に落ち着いて座り、一枚の硬貨を持って、耕された畑を見渡す乗り手が描かれているのかもしれません。静止した馬は忍耐と持久力を、畝の刻まれた土地はすでになされた計画的な仕事を、そしてまっすぐなまなざしは前方への揺るがない注意を象徴しているのかもしれません。暗くどっしりとした色調と重い形が頼もしさを際立たせる一方で、静止がときに惰性になりうることもほのめかしています。
