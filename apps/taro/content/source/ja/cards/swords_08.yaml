shortUpright: >-
  囲い込まれているように感じても、限界の中には主に考えの中にあるものもあります。小さく一歩動くだけで、思ったより余地があるとわかるかもしれません。
shortReversed: "縛りがゆるみつつあるのかもしれません。以前ほどきつくあなたをとらえなくなった思い込みに気づいてみましょう。"
meaningUpright: |-
  ソードの8は、刃に囲まれ、目を覆われ、手をゆるく縛られた人物を描いています。よく見ると、輪にはすき間があり、縛りもそれほどきつくありません。このカードは、閉じ込められていると感じているとき、その罠の一部が考えでできている、という体験について語っています。
  どの選択肢もふさがれているように見える状況や、試す前から「できない」と言ってしまう状況、間違えることへの恐れで身動きがとれなくなっている状況の中に、このカードを見いだすかもしれません。現実の制約は存在しますし、このカードはそれを軽んじてはいません。ただ、壁の中には、まだ問い直していない思い込みがあるのではないかと問いかけているのです。選択肢がない、誰も助けてくれない、変わるにはもう遅すぎる、といった思い込みです。
  このカードは、一つの限界をやさしく試してみるよう促しています。自分をその場にとどめている考えを書き出し、どれが事実でどれが恐れなのかを問いかけてみましょう。ときには、思い込みに名前をつけるだけで、それがゆるむことがあります。思っているよりも少し余地があると仮定したら、どんな小さな一歩を踏み出すでしょうか。
meaningReversed: |-
  逆位置のソードの8は、解放の感覚を映しているのかもしれません。目隠しがずれ、輪は以前ほど閉じていないように見えます。以前は見えなかった選択肢に気づいたり、行き詰まらせていた状況から抜け出す準備ができたと感じたりしているのかもしれません。
  古いパターンの引力として読むこともできます。動き始めたちょうどそのときに、おなじみの迷いが戻ってきて、あなたを輪の中へ引き戻そうとするのです。これは変化によくある一部であり、失敗ではありません。
  何が少しでも自由を得る助けになったのか、そしてどうすればそれをもっと増やせるかを問いかけてみましょう。人からの支え、新しい情報、あるいはただの練習が、縛りをゆるく保ってくれます。どんな思い込みを下ろす準備ができていて、そのかわりに何を置きたいでしょうか。
aspects:
  relationshipsUpright: >-
    人間関係において、このカードは行き詰まった感覚を映しているのかもしれません。自分に必要なことを言えなかったり、もう卒業した役割に縛られていたりする状態です。相手がどう思うかという思い込みが、あなたを黙らせていることを示している場合もあります。その思い込みの一つを、やさしい問いかけで直接確かめてみましょう。人は、私たちの恐れが思わせるよりも、変化に開かれていることが多いものです。
  relationshipsReversed: >-
    逆位置のソードの8は、関係の中の新しい自由を示しているのかもしれません。ついに声を上げること、境界線を引くこと、あるいはおなじみの関係性を新鮮な目で見ることです。古い恐れが、いまもあなたを黙らせようとしているところに気づいてみましょう。小さな正直さを重ねる練習をすることで、新しい視点が、人との関わり方の確かな一部になっていきます。
  workUpright: >-
    仕事において、このカードは、期待やルール、あるいは状況を変えるだけのスキルがないという思い込みに、箱に閉じ込められているように感じていることを映しているのかもしれません。現実の限界もあるでしょう。退けてきた選択肢を書き出し、そのうちの一つをもう一度見てみましょう。指導者や友人との会話が、考えたこともなかった道を見せてくれることがあります。
  workReversed: >-
    逆位置のこのカードは、マンネリから抜け出すことを示しているのかもしれません。新しいやり方を試す、違う責任を求める、自分に何ができるかについての古い物語を手放すことなどです。動き出すと、自信のなさがちらりと顔を出すかもしれません。それを立ち止まる理由ではなく、成長のしるしとして受け止めてみましょう。
  growthUpright: >-
    自己成長において、ソードの8は「あなたにはできない」と言う内なる声に気づくよう促しています。その声がどこでそのルールを学んだのか、やさしく問いかけてみましょう。思い込みを問い直すことは、あらゆる恐れを無理に乗り越えることではありません。輪のすき間を探すことを、自分に許すことなのです。
  growthReversed: >-
    逆位置のこのカードは、自分を縛る考えが本当にゆるんでいることを映しているのかもしれません。どんなに小さくても、これまでの前進に印をつけ、新しい見方が強くなるよう、定期的に練習してみましょう。古い迷いが戻ってきたら、降参するのではなく、好奇心をもって迎えることができます。
reflectionQuestions:
  - "あなたの限界のうち、どれが事実で、どれが事実の装いをした恐れかもしれませんか？"
  - "誰の意見があなたを引き止めていると想像していますか？その人に尋ねてみたことはありますか？"
  - "今週、輪の外へ踏み出せる小さな一歩を一つ挙げるとしたら何ですか？"
imageryNote: >-
  このオリジナルの絵では、地面に立てられた刃のゆるやかな輪の中で、やわらかな湿地に人物が立っています。細いリボンが目を覆い、もう一本のリボンは結ばれないまま手首にかかっています。人物の背後で輪は開いていて、遠くの丘へと続く道があります。リボンはゆるめることのできる限界を、開いたすき間はまだ見えていない選択肢を表しています。
