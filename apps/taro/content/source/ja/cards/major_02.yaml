meaningUpright: |-
  女教皇は二本の柱の間、知られていることとまだ隠されていることの境目に座っています。この人物は行動も説明もしません。その贈り物は注意を向けること、つまり状況や会話や感情の表面の下にあるものに気づく、深く辛抱強い聴き方です。
  日常では、このカードは、うまく説明できない予感や、何かが語られていないという感覚、午後になっても余韻の残る夢を映しているのかもしれません。答えが、さらに情報を集めることではなく、すでに持っているものと静かに向き合うことで見つかる瞬間を示していることもあります。はっきりさせようと押すのをやめたときに、はじめて見えてくるものもあるのです。
  このカードは、自分の中のゆっくりとした、言葉になりにくい部分を信頼するよう促しています。ジャーナルを書く時間や、イヤホンをつけずに歩く時間、あるいは返事をする前にひと呼吸おく時間をつくってみるとよいかもしれません。内なる知恵は事実の代わりになるものではなく、事実と並んで存在できるものです。女教皇は、静かな声がずっと伝えようとしてきたことに気づき、何をするか決める前に、その声に少し場所をあけてあげるよう求めています。
meaningReversed: |-
  逆位置の女教皇は、内なる声はあるのに聞き取りにくくなっている状態を示しているのかもしれません。忙しい日々、他人の意見、絶え間なく流れる画面が、このカードに必要な静けさを押しのけてしまうことがあります。半分はもうわかっていることについて、何度も人にどうすればいいか尋ねている自分に気づくかもしれません。
  このカードは、何かを長く胸にしまい込みすぎていることを示していることもあります。感情や問い、あるいは隠れたままの真実が、いまは重く感じられているのかもしれません。プライバシーは健全なものですが、あなたを孤立させる秘密は、もう一度見直してみる価値があるかもしれません。
  小さな静けさのポケットをつくり、何が浮かんでくるか見てみるとよいでしょう。推敲せずに書いてみたり、自分にシンプルな問いを一つ投げかけて、最初に出てくる正直な答えを待ったりするのも助けになります。感じていながら、まだ口にすることを自分に許していないことは何でしょうか。
aspects:
  relationshipsUpright: >-
    人間関係において、女教皇は言葉がなくても多くが通じ合う関係や、話すことよりも聴くことが大切な瞬間を映しているのかもしれません。底に流れるものに気づくよう促しています。友人の沈黙が何を意味しているのか、あるいは自分のためらいが何を守っているのか。身近な人に、急がずに向ける注意という贈り物を差し出してみるのもよいでしょう。
  relationshipsReversed: >-
    逆位置のこのカードは、あなたと身近な人の間で言われないままになっていることや、直接尋ねるかわりに行間を読もうとする習慣を示しているのかもしれません。推測のかわりに、穏やかで正直な問いを一つ投げかけられないか考えてみましょう。自分の内面を守りながらも、相手にもう少しだけそれを見せる必要があることを映している場合もあります。
  workUpright: >-
    仕事やプロジェクトにおいて、女教皇は、すべての決断を今日下す必要はないと伝えているのかもしれません。観察し、印象を集め、自分のタイミングの感覚を信頼するよう促しています。調査、執筆、計画、メンタリングといった内省的な仕事はこのカードとよくなじみます。静かな有能さと慎み深さは、思っている以上に評価されているかもしれません。
  workReversed: >-
    逆位置の女教皇は、周りの声が大きいために、確かな直感を疑ってしまうことや、チームの中で情報が伏せられている状態を映しているのかもしれません。状況について知っているのに、まだ口にしていないことは何かを問いかけてみましょう。落ち着いた適切な方法でそれを共有すれば、あなたを含む皆にとって仕事がわかりやすくなるかもしれません。
  growthUpright: >-
    女教皇とともにある成長は、たいてい静けさから始まります。毎日数分、何かを正そうとせずに、ただ自分の思考や呼吸、周りの様子に気づく時間を試してみるとよいかもしれません。こうした注意を続けるうちに、不安なおしゃべりと、より落ち着いた内なる感覚との違いがわかるようになっていくでしょう。
  growthReversed: >-
    逆位置の女教皇は、このところ表面だけで暮らし、振り返るよりも反応してばかりいなかったかを問いかけているのかもしれません。すぐに答えを見つけなければというプレッシャーなしに、もう一度内側へ向かうよう、そっと背中を押しています。今週、静かな習慣を一つ取り入れて、耳を傾ける余白を自分に与えたときに何が変わるか気づいてみましょう。
reflectionQuestions:
  - "自分の状況について感じていながら、まだ口に出していないことは何ですか？"
  - "自分自身も含めて、誰の沈黙にもっと耳を傾けてみる価値がありそうですか？"
  - "今週、自分のために静かな10分間をどこでつくれそうですか？"
imageryNote: >-
  Taroの女教皇は、月明かりに照らされた戸口の敷居に、半分は光の中、半分は影の中に座り、閉じた本を膝に置いている姿として描かれています。人物の背後では、その向こうで何かが待っているかのようにカーテンが揺れています。静かな水盤に映る三日月は周期と直感を響かせ、深い青の色調は、表面の穏やかさとその下の深さを感じさせます。この絵の中心にあるのは、人物の静かで注意深いたたずまいです。
