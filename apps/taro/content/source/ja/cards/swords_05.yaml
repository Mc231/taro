  relationshipsReversed: >-
    逆位置のソードの5は、仲違いのあとの修復や、礼儀正しい言葉の下でまだくすぶっている緊張を示しているのかもしれません。謝罪や、誤解を解く話し合い、あるいはただのやさしさが、状況をやわらげられないか考えてみましょう。関係が何度も同じ争いに戻ってしまうなら、何がそれを繰り返させているのかを探ってみる価値があるかもしれません。
  workUpright: >-
    仕事において、このカードは競争や職場の緊張を映しているのかもしれません。手柄を奪われたり、アイデアを退けられたり、人々が傷ついた議論だったりします。自分の勝利が共通の目標の役に立つのかを問いかけてみましょう。協力のためには、仕事を前に進めるために一つの主張を手放すことが求められることもあります。戦う場を選ぶことで、エネルギーと仕事上の関係の両方を守れます。
  workReversed: >-
    逆位置のこのカードは、職場の摩擦のあとでわだかまりを晴らすことや、消耗させる言い争いから身を引くと決めることを示しているのかもしれません。古い対立が、いまもあなたと同僚のやりとりに影響していないか気づいてみましょう。誰が正しかったかを蒸し返すよりも、これからに焦点を当てた短く落ち着いた会話のほうが、多くをもたらしてくれることがあります。
  growthUpright: >-
    自己成長において、ソードの5は、勝つことと負けることとの自分の関係を見つめるよう促しています。対立はあなたの中に何をかき立てるでしょうか。自分を証明したいという欲求でしょうか、見過ごされることへの恐れでしょうか。熱くなった瞬間に応じる前に立ち止まり、反射的に反応するのではなく言葉を選ぶためのひと呼吸を自分に与える練習をしてみましょう。
  growthReversed: >-
    逆位置のこのカードは、昔の恨みや、過去の言い争いを再生したくなる衝動を手放すことを映しているのかもしれません。手放すことは負けのように感じられるかもしれませんが、多くの場合、いま大切にしているもののためのエネルギーを自由にしてくれます。言えるとしたら何を言うかを書き出し、それを声に出す必要があるのか、それともただ下ろせばよいのかを決めてみましょう。
reflectionQuestions:
