  - "一つの主張を手放したら、どの関係がよくなりそうですか？"
  - "今週、あえて戦わないと選べる戦いを一つ挙げるとしたら何ですか？"
imageryNote: >-
  このオリジナルの絵には、ちぎれた雲が速く流れる、風の吹きすさぶ岸辺が描かれています。一人の人物が三本の刃をゆるく持って振り返り、さらに二本の刃が砂の上に落ちています。ほかの二人の人物は水辺へと歩き去っていきます。散らばった刃は解決されないまま残された言い争いを、向けられた背中は対立が生んだ距離を表しています。落ち着かない空は、言葉がやんだあとも、まだかき乱されたままの心を映しています。
