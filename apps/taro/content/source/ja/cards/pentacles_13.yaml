shortUpright: >-
  実際的なぬくもりと思いやりが、あなたのそばにあります。人のために心地よさをどうつくっているか、そしてそこに自分も含めているかに気づいてみましょう。
shortReversed: >-
  思いやりが外へ流れる一方で、自分は消耗しているのかもしれません。人のニーズと同じくらいあたたかく、自分のニーズを世話する方法を探ってみましょう。
meaningUpright: |-
  ペンタクルのクイーンは、緑豊かに手入れされた場所に座り、生きているものを抱くように、ひざの上に硬貨を抱えています。このクイーンは実際的な慈しみを表しています。誰かが着いたときに用意されている食事、くつろげる住まい、丁寧に管理された家計、人を養う庭。ここにあるエネルギーは、あたたかく、才覚があり、地に足がついていて、誰もが持ちうる資質です。
  家庭を切り盛りすることや、忙しい時期の友人を支えること、作業場を居心地よくすること、皆に行き渡るよう時間や資源をやりくりすることの中に、このカードを見いだすかもしれません。休息、滋養のある食事、新鮮な空気、居心地のよい空間など、自分の体と周りの環境をいたわることを映している場合もあります。
  このカードは、心地よさと安定を生み出す静かな技に気づくよう促しています。あなたは人や環境をどのように世話しているでしょうか。自分にも同じ思いやりを向けているでしょうか。日々の暮らしをもう少し満たされたものにする方法を一つ選び、実際的なやさしさを、まず家から始めてみましょう。
meaningReversed: |-
  逆位置のペンタクルのクイーンは、偏ってしまった思いやりを映しているのかもしれません。自分以外の皆の世話をして、人が支えられていると感じている一方で、自分は空っぽのまま走っているのかもしれません。あるいは、思いやりが支配に傾き、助けることが管理することになって、人が自分なりの道を見つける余地がほとんどなくなっていることもあります。
  ここでは、思いやりがどう流れているかを見直すよう求められています。慈しみは価値あるものであり、あなたを含め、関わる皆を尊重し、無理なく続けられるときにうまく働きます。
  先延ばしにしてきた、自分に必要なものは何かを問いかけてみましょう。誰か別の人に作業を引き受けてもらえないでしょうか。基準を少しゆるめても、家庭全体が崩れることはないのではないでしょうか。自分のエネルギーや空間や心地よさを世話することはわがままではありません。それこそが、あなたの思いやりを長続きさせてくれるのかもしれません。
aspects:
  relationshipsUpright: >-
    人間関係において、このカードはあたたかく実際的な思いやりを映しているのかもしれません。誰かをくつろがせること、目に見える形で支えること、ともに安定した拠りどころをつくることです。自分が行動を通してどう愛情を表しているか、そして周りの人がどう受け取るのを好むかに気づいてみましょう。一緒の食事や静かな夜には、たくさんの意味が込められることがあります。
  relationshipsReversed: >-
    逆位置のカードは、受け取る以上に思いやりを与えていることや、助けることが誰かの選択を管理することに変わっていることを示しているのかもしれません。バランスについて率直に話し合い、お返しに支えを求めてみましょう。人に世話をしてもらうことを自分に許すと、親密さが深まります。
  workUpright: >-
    仕事において、ペンタクルのクイーンは、有能さとぬくもりが組み合わさった姿を表しているのかもしれません。資源をうまくやりくりし、同僚を支え、人がよい仕事をできる環境をつくることです。物事を円滑に進める自分の才能を認め、ひとりで抱え込まずにそのスキルを分かち合う方法を考えてみましょう。
  workReversed: >-
    ここでのカードは、職場で人のために無理をしすぎていることや、仕事と家庭の生活のバランスをとるのに苦労していることを映しているのかもしれません。どの責任が本当に自分のものかを見て、時間の周りに境界線を引いてみましょう。チームへの持続可能な思いやりには、自分への思いやりも含まれます。
  growthUpright: >-
    自己成長において、このカードは実際的に自分を慈しむよう促しています。規則正しい食事、休息、外で過ごす時間、心地よい空間などです。地に足のつくような、小さなセルフケアの日課を一つつくり、それをあってもなくてもよいものではなく、大切な約束として扱ってみましょう。
  growthReversed: >-
    逆位置のカードは、自分のニーズを後回しにする習慣や、人のためにどれだけしたかで自分の価値を測る習慣を映しているのかもしれません。そのパターンがどこから来ているのかを探ってみましょう。人に向けるのと同じ忍耐を自分にも差し出すことで、エネルギーと喜びの両方が戻ってきます。
reflectionQuestions:
  - "あなたは実際的な行動を通してどう思いやりを示していますか？いちばんよく受け取っているのは誰ですか？"
  - "あなたが人を支えているように、どこで誰かにあなたを支えてもらえそうですか？"
  - "今週、日々の空間をもう少し満たされたものにする方法を一つ挙げるとしたら何ですか？"
imageryNote: >-
  絵には、花咲く庭の中で彫刻の施された玉座に座り、ひざの上に硬貨をやさしく抱える、冠を戴いた人物が描かれているのかもしれません。玉座の周りには花や果実、ウサギのような小さな動物がいて、近くを小川が流れているのかもしれません。庭は世話による豊かさを、抱えられた硬貨は注意深い管理を、そして動物は自然の世界の中にある創造的な豊かさと心地よさを象徴しているのかもしれません。
