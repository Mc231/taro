shortUpright: "好奇心が目覚めています。新鮮な目で一つの問いを追いかけ、それが考えをどこへ運んでいくか見てみましょう。"
shortReversed: "意欲的な考えが、あちこちに散らばっているのかもしれません。話すより聴くほうが役立つところに気づいてみましょう。"
meaningUpright: |-
  ソードのペイジは、世界と出会う、若くすばやい心です。風の吹く丘に立ち、刃を高く掲げたペイジは、あらゆるものを見つめ、学び、問い、アイデアを試したくてたまりません。このカードは、専門知識を得る前の好奇心、つまり何か新しいことを理解し始めるわくわくする始まりについてのカードです。
  夜遅くまであるテーマを調べたくなる衝動や、誰も尋ねない質問をすること、考えを広げてくれる講座や議論やプロジェクトを始めるときのエネルギーの中に、このカードを見いだすかもしれません。ある見方に決める前に、注意深く油断なく情報を集めていることを映している場合もあります。
  このカードは、学ぶ人であることを楽しむよう促しています。すべての答えを持っている必要はありません。いまは、よい問いを投げかけるだけで十分なこともあります。見つけたことをどう分かち合うかにも気づいてみましょう。アイデアへの熱意は、耳を傾けることと組み合わさったとき、よく伝わります。どんなテーマや問いがあなたの注意を呼んでいて、大胆さと謙虚さの両方をもって、それをどう探っていけそうでしょうか。
meaningReversed: |-
  逆位置のソードのペイジは、方向を見失った好奇心を映しているのかもしれません。アイデアが追いつけないほどの速さで散らばっていったり、たくさんのことを始めては一つも終わらせられなかったりするのかもしれません。頭のエネルギーは高いのに、集中は薄くなっています。
  考えよりも言葉が先に動いていると読むこともできます。聴く前に話すこと、確かめていないことを伝えること、アイデアに疑問を投げかけられると身構えてしまうことです。思いやりのない鋭さは、会話を必要以上に難しくしてしまうことがあります。
  このカードは、考えるペースを少し落とすよう促しています。いまは一本の糸を選んでたどり、ほかの糸には待ってもらいましょう。意見を伝える前に、もう一つ質問をしてみてもよいでしょう。話したいのと同じくらい熱心に耳を傾けたら、何を学べるでしょうか。
aspects:
  relationshipsUpright: >-
    人間関係において、ソードのペイジは活発な会話や、誰かの内面への好奇心、状況を十分に理解したいという願いを示しているのかもしれません。疑いではなく本当の関心をもって、気になっていたことを尋ねてみましょう。よい聴き手であることは、言葉が達者であることと同じくらい、このカードの一部です。
  relationshipsReversed: >-
    逆位置のこのカードは、不用意な言葉や、伝え回された秘密、つながるよりも議論してしまう習慣を映しているのかもしれません。好奇心が詮索や防御的な態度に変わっていないか気づいてみましょう。自分の言葉がどう受け止められるかを考えるために立ち止まることで、信頼を守れます。急いで言ってしまったひとことへのシンプルな謝罪が、大きな違いを生むことがあります。
  workUpright: >-
    仕事において、ソードのペイジは学びの段階を映しているのかもしれません。新しいスキル、新たな調査、あるいは臨機応変に考えることを求められる役割です。理解を広げてくれる作業に手を挙げ、同僚に知っていることを説明してもらいましょう。メモをとり、前提を確かめることで、初期の熱意を確かな知識に変えられます。
  workReversed: >-
    逆位置のこのカードは、散漫な注意を示しているのかもしれません。作業から作業へ飛び移ったり、生煮えのアイデアを早すぎる段階で共有したり、批判にすばやく反応したりすることです。さらに増やす前に、深める優先事項を一つ選んでみましょう。提示する前に事実を確かめ、落ち着いてフィードバックを求めることで、アイデアはより強く、より信頼されるものになります。
  growthUpright: >-
    自己成長において、ソードのペイジは初心者の心を育てるよう促しています。あまり知らない分野を手に取り、すごいと思われる必要なしに好奇心を持つことを自分に許してみましょう。「なぜ」と問うこと、幅広く読むこと、自分の思い込みに気づくことが、考えを新鮮で柔軟に保ってくれます。
  growthReversed: >-
    逆位置のこのカードは、着地する前に飛び移ってしまう落ち着かない考えを映しているのかもしれません。次のアイデアを始める前に一つのアイデアを終わらせる練習や、考えるよりも身構えたくなる衝動に気づく練習をしてみましょう。自分に向けた好奇心、つまり自分がなぜそう反応するのかと問うことが、役に立つ出発点になりえます。
reflectionQuestions:
  - "ずっと気になっていて、もっと探ってみたい問いは何ですか？"
  - "どの会話で、答える前にもう少し長く耳を傾けられそうですか？"
  - "今週、ただ楽しむために学んでみたいことを一つ挙げるとしたら何ですか？"
imageryNote: >-
  このオリジナルの絵では、若々しい人物が草におおわれた丘の上に立ち、刃を掲げて地平線のほうへ視線を向けています。風が草を揺らし、雲の筋が走る明るい空へと小鳥の群れを散らしています。掲げられた刃はアイデアを試す準備を、鳥たちはすばやく飛び交う考えを、そして高い見晴らしは、すべてを一度に見たいという願いをほのめかしています。
