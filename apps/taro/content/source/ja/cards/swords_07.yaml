shortUpright: "巧みな計画や、ひそかな回り道が進行中なのかもしれません。それがなりたい自分に合っているか問いかけてみましょう。"
shortReversed: >-
  隠された計画が魅力を失いつつあるのかもしれません。自分や人に正直になるほうが、隠し続ける労力より軽く感じられるかもしれません。
meaningUpright: |-
  ソードの7は、与えられた以上のものを持ってこっそり立ち去り、誰かに気づかれていないか振り返る人物を描いています。これは戦略と機転、そして単独で動くことのカードです。それが才覚であることもあれば、より困難で正直な道を避ける方法であることもあります。
  つい使いたくなる近道や、誰かをひそかに迂回することで避けている会話、自分の胸にだけしまっている計画の中に、このカードを見いだすかもしれません。人に頼むのはややこしすぎるから、自分ひとりで対処しなければならないという感覚を映していることもあります。確信はないものの、周りの状況で何かがあまりオープンではないと感じていることを示している場合もあります。
  このカードは、その秘密や単独の努力が何を守っているのかを考えてみるよう促しています。自立は賢明でありえますし、すべての計画に観客が必要なわけではありません。それでも、この道が自分の価値観に合っているか、そしてそれを隠しておくのにどんな代償がかかっているかを問いかけてみましょう。同じ目標に、率直に話せる方法でたどり着くことはできないでしょうか。
meaningReversed: |-
  逆位置のソードの7は、隠された計画がその力を失いつつあることを映しているのかもしれません。何かを秘密にしておくことが、その価値以上に疲れるものになっていたり、ひとりで抱えてきたことを分かち合う準備ができていたりするのかもしれません。部分的にでも打ち明けることは、思いがけない安堵をもたらしてくれることがあります。
  内側に向けて読むこともできます。居心地の悪い真実を避けるために、自分に語っている物語です。問題は誰か別の人が解決すべきものだと自分を納得させるなど、自分へのごまかしはさりげないものでありえます。
  どこでもう少しオープンになれば状況がシンプルになるかを問いかけてみましょう。それは失敗を認めることかもしれませんし、頼むのを避けてきた助けを求めることかもしれませんし、誰にも気づかれないことに頼った戦略を考え直すことかもしれません。信頼できる人に全体像を見せたら、何が変わるでしょうか。
aspects:
  relationshipsUpright: >-
    人間関係において、このカードは口にされていない何かを映しているのかもしれません。ひそかに下された決断、ほかの場所で満たされているニーズ、あるいはすべてが分かち合われているわけではないという落ち着かない感覚です。誰かを責めているわけではありません。どこでオープンになることがリスクに感じられるのか、そしてそれはなぜかを考えてみましょう。疑いではなくやさしい好奇心のほうが、人からも自分からも正直さを引き出しやすいものです。
  relationshipsReversed: >-
    逆位置のソードの7は、真実が明らかになってくることや、身近な人にもっと透明でありたいという願いを示しているのかもしれません。抑えてきたことを言う準備ができたと感じているのかもしれません。誰かがあなたに心を開いてくれたら、すぐに判断せずに耳を傾けることで、修復の可能性が生まれます。信頼は多くの場合、正直さが思いやりで受け止められたときに育ちます。
  workUpright: >-
    仕事において、このカードは、仕組みを通すのではなく迂回すること、ひそかに手柄を取ること、人と調整するのを避けるために作業をひとりで抱えることを映しているのかもしれません。才覚には価値があります。全員に見られても、自分のやり方が通用するか、そして率直な会話のほうが、より少ない負担でより遠くまで行けないかを問いかけてみましょう。
  workReversed: >-
    逆位置のこのカードは、目立たないことに頼った戦略を考え直すことや、胸にしまってきた情報をついに共有することを示しているのかもしれません。ひとりで苦労してきたことについて助けを求めてみましょう。近道や失敗について早めにオープンにすることは、あとで対処するよりもずっと楽なことがあります。
  growthUpright: >-
    自己成長において、ソードの7は、自分がどんなときに、なぜ単独で動くのかを見つめるよう促しています。自分に頼ることは強みになりえますが、弱さを見せることを避ける方法にもなりえます。率直さよりも機転を選んでしまう場面に気づき、望むことを素直に頼んでみることを試してみましょう。
  growthReversed: >-
    逆位置のこのカードは、自分自身への正直さが育っていることを映しているのかもしれません。自分に語ってきた都合のよい物語に気づき、それをやさしく問い直してみましょう。自分に正直であることに厳しさは必要ありません。ただ、はっきり見ることを自分に許すことです。この状況を言い訳で片づけるのをやめたら、何を違うふうにするでしょうか。
reflectionQuestions:
  - "ひとりで抱えていることの中で、分かち合えるかもしれないものは何ですか？"
  - "どこで、ひそかな回り道より率直な会話のほうがうまくいきそうですか？"
  - "今週、声に出して言える小さな真実を一つ挙げるとしたら何ですか？"
imageryNote: >-
  このオリジナルの絵には、月明かりの野原をつま先立ちで横切る人物が描かれています。腕いっぱいに刃を抱え、背後の草むらには数本の刃が立ったまま残されています。遠くのテントはやわらかく灯り、何も気づいていません。足跡の列がたどった道を示しています。腕いっぱいの刃は差し出された以上のものを抱え込むことを、残された刃は運びきれないものをほのめかし、振り返るしぐさは人目を避けて動くことの落ち着かなさを示しています。
