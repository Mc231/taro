shortUpright: >-
  完成しているように見えても、もう心を満たしてくれないものがあるのかもしれません。心が次にどこへ引かれているか気づいてみませんか。
shortReversed: "とどまるか去るかの間で揺れているのかもしれません。どちらかを選ぶ前に、何を知っておく必要があるか考えてみましょう。"
meaningUpright: |-
  カップの8ではよく、きちんと並んだ杯から離れ、夜空の下の開けた土地へと歩いていく人物が描かれます。杯は壊れても、こぼれてもいません。ただ、その杯の何かがもう満たしてくれなくなり、人物は欠けているものを探しに行こうと決めたのです。
  このカードは、外から見れば問題なさそうに見えるものから離れる、静かな勇気について語っています。役割、日課、自己像、あるいはもう本当だと感じられなくなった生き方です。多くの場合それは劇的な退場ではなく、何かから自分が一回り大きくなってしまったという、ゆっくりとした気づきです。
  日常では、仕事にもっと意味を求めることや、考えるためにひとりの時間が必要になること、自分を消耗させる状況から一歩引くことを映しているのかもしれません。このカードは、その願いを真剣に受け止めるよう促しています。立ち去ることは、突然でも永遠でもなくてよいのです。試しに距離を置いてみることや、心の中の小休止でもかまいません。自分が本当は何を探しているのか、そしてそれを見つけるために何を後に残してもよいと思えるかを問いかけてみましょう。
meaningReversed: |-
  逆位置のカップの8は、とどまるか去るかの間で動けずにいることを映しているのかもしれません。何かがしっくりこないと感じながらも、先へ進むべきか、もう一度やってみるべきか迷っているのかもしれません。未知への恐れや、築いてきたものへの思い入れが、あなたをその場にとどめることがあります。
  逆のパターンを示している場合もあります。何度も何度も去り、何にも深まる機会を与えないまま、次から次へと漂っていくことです。
  このカードは、ペースを落として、その選択をもっとじっくり見るよう促しています。なんとなくではなく、自分で選んでとどまるとしたら、どんな形になるでしょうか。去るには何が必要でしょうか。信頼できる人と話し合ったり、決めるためのゆるやかな期限を設けたりしてみましょう。どちらの方向を選ぶにしても、意図をもって選ぶことが、心の平穏をもたらしてくれるかもしれません。
aspects:
  relationshipsUpright: >-
    人間関係において、このカードはもっと深さを求める気持ちや、関係がいまの形では一区切りを迎えたという気づきを映しているのかもしれません。自分に必要なのに欠けているものは何かを、正直に振り返るよう促しています。一歩引くことは、変化についての会話や、もっと自分の時間を持つこと、あるいはときに、違う種類のつながりを選ぶことを意味するかもしれません。
  relationshipsReversed: >-
    逆位置のカップの8は、満たされないと感じる関係へのためらいや、親しくなるたびに身を引いてしまうパターンを映しているのかもしれません。とどまっているのは愛からなのか恐れからなのか、去るのは必要からなのか習慣からなのかを問いかけてみましょう。どちらにしても、はっきりとしたやさしいコミュニケーションが助けになります。
  workUpright: >-
    仕事において、このカードは、すべてが安定しているように見えても、もっと目的を求める気持ちを映しているのかもしれません。新しい分野を試す、違うことを学ぶ、いまの役割を作り変えるなどして、何がより意味のあるものに感じられるかを探るよう促しています。先へ進むことは、外の変化になるずっと前に、内側の変化として始まることがあります。
  workReversed: >-
    逆位置のカードは、一回り大きくなってしまった仕事やプロジェクトから抜け出せずにいることや、落ち着かずに役割から役割へ移っていることを映しているのかもしれません。手放したら恋しくなるものと、喜んで後にするものを書き出してみましょう。場所を変えるのではなく、取り組み方を変えることで、感じているニーズを満たせないか考えてみましょう。
  growthUpright: >-
    自己成長において、カップの8は内側への旅を促しています。以前ではなく、いま何が人生に意味を与えてくれているのかを振り返る時間をとってみましょう。歩くこと、ジャーナルを書くこと、日課から少し離れることが、自分が何に向かう準備ができているのかを聞き取る助けになります。
  growthReversed: >-
    逆位置のこのカードは、回避や落ち着かなさのパターンに気づくよう求めているのかもしれません。居心地の悪さから逃れるために状況から去っているのでしょうか、それとも変化を避けるためにとどまっているのでしょうか。行動する前に、もう少し長く不確かさとともにいる練習をしてみましょう。自分のパターンを理解することで、これからの選択がより明確で、よりやさしいものになります。
reflectionQuestions:
  - "あなたの人生で、完成しているように見えるのに、もう満たされないと感じるものは何ですか？"
  - "いまの状況が与えてくれない、あなたが探しているものは何ですか？"
  - "まだ決めてしまわずに変化を探ってみるために、どんな小さな一歩が助けになりそうですか？"
imageryNote: >-
  絵には、杖をついたひとりの人物が、岸辺に丁寧に積まれた杯を後にして去っていく後ろ姿が描かれています。前方には、細い三日月の下に、なだらかに高まる丘と曲がりくねった道が続いています。積まれた杯に見えるすき間は、何かが完成していないことを感じさせるのかもしれません。深い青と銀色が、内省と、まだ探られていないものへの静かな引力を呼び起こします。
