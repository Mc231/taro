  - "誰かがあなたに差し出しているもので、まだ十分に気づいていないものは何でしょうか？"
  - "どんな感じがするかを確かめるためだけに、イエスと言えそうな小さな誘いは何ですか？"
imageryNote: >-
  絵には、木の下か静かな水辺に座り、腕を組んで、地面に置かれた三つの杯に視線を落としている人物が描かれています。四つ目の杯がそよ風に乗って、あるいは水面に浮かんでその人のほうへ漂ってきていますが、見落としやすいものです。くすんだ色と閉じた姿勢は内向きの心と小休止の必要を感じさせ、差し出された杯は、可能性の糸を視界の中にとどめています。
