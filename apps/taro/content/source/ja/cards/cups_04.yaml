  relationshipsReversed: >-
    逆位置のこのカードは、身を引いていた時期のあとで、ふたたびつながることを示しているのかもしれません。誰かがずっと伝えようとしてきたことに耳を傾けたり、自分から連絡したりする気持ちが強まっているのかもしれません。まだ余白が必要なら、それをやさしく伝えることが関係を守ってくれます。散歩や食事など、一緒に過ごす小さな時間が、心地よく戻っていく方法になりえます。
  workUpright: >-
    仕事において、このカードは落ち着かなさや、作業にあまり意味を感じられなくなっている感覚、あるいは方向を見直すための小休止を映しているのかもしれません。すぐに退けてしまった機会を、もう一度見てみるよう促しています。まだ火花は感じられなくても、ある会話や新しい責任、見過ごしていた講座は、見直してみる価値があるかもしれません。
  workReversed: >-
    逆位置のカードは、やる気が戻ってきていることや、新しいことにイエスと言う準備ができていることを示しているのかもしれません。どのプロジェクトがふたたび興味を引き始めているかに気づいてみましょう。断り続けるループにはまっていると感じるなら、小さな約束を一つ試してみて、それがエネルギーを与えてくれたか奪ったかを、あとで振り返ってみましょう。
  growthUpright: >-
    自己成長において、カップの4は、何が本当に自分を満たしてくれるのかを正直に振り返るよう促しています。習慣でしていることを書き出し、そのうちどれがいまも大切かを問いかけてみましょう。静かな時間は貴重なものになりえます。ただし、それが自分で選んだものであり続け、抜け出せない場所にならない限りにおいてです。
  growthReversed: >-
    逆位置のこのカードは、振り返りの時期を経て、より明確な優先順位を持って戻ってくることを映しているのかもしれません。かつて当たり前だと思っていたものへの感謝が戻ってくるのに気づくかもしれません。身を引いていた間に学んだことを書き留めておくと、生活がふたたび忙しくなっても、その気づきがあなたのそばに残ってくれます。
reflectionQuestions:
