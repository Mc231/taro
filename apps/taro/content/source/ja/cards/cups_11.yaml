shortUpright: "遊び心のある気持ちや小さな創作のアイデアが、あなたを驚かせるかもしれません。好奇心をもって迎えてみませんか。"
shortReversed: >-
  やわらかな気持ちが隠れていたり、揺らいでいたりするのかもしれません。感じていることを安心して表せるようにするにはどうすればよいか考えてみましょう。
meaningUpright: |-
  カップのペイジは水のスートでいちばん若い人物で、よく杯からのぞく魚を見つめている姿で描かれます。その絵はどこかやさしくおかしみがあり、そこにこそ意味があります。このカードは、好奇心、驚き、そして思いがけない感情やアイデアを、探ってみる価値があるものとして真剣に受け止める姿勢をたたえています。
  新しい創作の衝動や、誰かへの突然のやさしい気持ち、どこからともなく訪れる予感、ありふれたものを新鮮に感じさせる遊び心のある気分を映しているのかもしれません。ペイジは、それがどこへつながるのかを知る必要がありません。ただ開かれているのです。
  日常では、アイデアを落書きすること、心のこもったメッセージを書くこと、創作の趣味を試すこと、小さなものに喜ぶことを自分に許すことなどの形で現れるかもしれません。このカードは、初心者のような開かれた心で自分の内面に向き合うよう促しています。今日何に驚かされるかに気づき、現実的な考えが押し寄せる前に、少しのあいだそれに注意を向けてみましょう。
meaningReversed: |-
  逆位置のカップのペイジは、分かち合いにくい感情や、見せるにはもろすぎると感じる創作のアイデアを映しているのかもしれません。ばかげて見えたり、弱く見えたりすることを心配して、自分の内面をしまい込んでいるのかもしれません。
  すぐに揺れ動く気分や、行動のひらめきになるのではなく、行動の代わりになってしまっている空想を示している場合もあります。
  このカードは、繊細な面に忍耐強く接するよう促しています。たった一人に対してでも、自分だけのページの上でもかまいません。自分を表現できるほど安心するには何が助けになるでしょうか。日記やスケッチブックなど、うまくなくてもよい、気負わない表現の場を見つけてみましょう。感情が大きく不安定に思えるなら、シンプルに名前をつけることで抱えやすくなります。好奇心は、少し守られる場所があれば、また育っていきます。
aspects:
  relationshipsUpright: >-
    人間関係において、カップのペイジは、かわいらしいしぐさ、遊び心のあるやりとり、心のこもった手紙、やさしい友情の始まりを映しているのかもしれません。考えすぎずに、素直に愛情を表すよう促しています。身近な人が小さく思いがけない形で思いやりを示していることに気づき、それに気づいたと伝えてみましょう。
  relationshipsReversed: >-
    逆位置のこのカードは、内気さや感情面の不安、あるいは関係の中のちぐはぐなサインを示しているのかもしれません。あなたか身近な人が、拒まれることを恐れて気持ちを抑えていないか問いかけてみましょう。心地よいペースで差し出されるやさしい正直さが、お互いに安心できる助けになります。
  workUpright: >-
    仕事において、このカードは新しい創作のアイデアや、新鮮な取り組み方、違う分野への好奇心を映しているのかもしれません。型にはまらない提案をしてみたり、遊び心をもって作業を試してみたりするよう促しています。初期のアイデアは磨き上げられている必要はありません。誰かが評価する前に、探られるための余地が必要なのです。
  workReversed: >-
    逆位置のカードは、創作の行き詰まりや、批判を恐れてアイデアを共有するのをためらう気持ちを映しているのかもしれません。結果を期待せずに、まず自分のためだけに何かに取り組んでみましょう。ゆっくり自信を育てることで、見せる準備ができたと感じたときに、アイデアを前に出しやすくなります。
  growthUpright: >-
    自己成長において、カップのペイジは、自分の感情や予感への好奇心を育てるよう促しています。夢やイメージ、ちょっと不思議な印象を書き留めるノートを用意し、時間とともにパターンに気づくのを楽しんでみましょう。遊び心をもって内面に向き合うことで、自分を理解することがより軽やかで、心ひかれるものに感じられます。
  growthReversed: >-
    逆位置のこのカードは、自分のより傷つきやすい部分にやさしくするよう求めているのかもしれません。自分の感情を、子どもっぽい、ばかげていると片づけてしまうときに気づいてみましょう。年下の友人にするように自分を励ますことで、感受性は隠すものではなく、強みになっていきます。
reflectionQuestions:
  - "最近、どんな小さな驚きやアイデアがあなたの注意を引きましたか？"
  - "信頼できる人と、やさしい気持ちをどう分かち合えそうですか？"
  - "今週、ただ楽しむために、どんな遊び心のある創作を試せそうですか？"
imageryNote: >-
  絵には、肩の高さに杯を掲げた若い人物が、その中から小さな魚がこちらを見返しているのに気づいて驚いている姿が描かれています。衣服には波や花の模様があしらわれているのかもしれず、背後の岸辺は、アイデアが生まれてくる感情の深みをほのめかしています。やわらかなパステルカラーと、軽やかで好奇心に満ちた表情が、開かれた心、想像力、そして内側から届く思いがけないメッセージの魅力を伝えています。
