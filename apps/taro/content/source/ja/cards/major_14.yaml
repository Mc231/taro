meaningUpright: |-
  節制は、物事をちょうどよい分量で混ぜ合わせるカードです。その絵では、二つの器の間で水が注がれていることが多く、ほとんどこぼれないよう慎重に注がれています。大切なのは、どちらか一方を選ぶことではなく、混ぜ合わせることです。仕事と休息、行動と忍耐、いま望むことと、あとで望むこと。
  日常では、このカードはうまくいくリズムを見つけることを映しているのかもしれません。十分な余白のあるスケジュール、双方を尊重した歩み寄り、しっくりくるまで少しずつ調整した習慣などです。極端さほど刺激的ではないけれど、多くの場合より長続きする、ほどほどであることの静かな満足を示していることもあります。
  このカードは、生活のどこにもう少しバランスがあるとよいかを考えてみるよう促しています。どの部分が詰め込みすぎで、どの部分がおろそかになっているか、そしてどんな小さな調整がそれらを近づけてくれるかを問いかけてみましょう。節制は忍耐を照らしています。よい調和には時間がかかり、やさしく試してみることは、急な大改造よりも多くを教えてくれることがあります。
meaningReversed: |-
  逆位置の節制は、バランスが崩れている感覚を映しているのかもしれません。仕事や人間関係や心配事など、生活のある一つの領域に注ぎすぎて、別の領域が涸れかけていることがあります。あるいは、全か無か、忙しいか疲れ果てているか、厳しいか投げやりか、といった極端の間を揺れ動いていることに気づくかもしれません。
  このカードは、時間を必要とする過程へのせっかちさや、自然になじむのを待つかわりに結果を無理に出そうとする気持ちを示している場合もあります。
  簡単な棚卸しをしてみるとよいでしょう。どこでやりすぎていて、どこで足りていないでしょうか。劇的な解決策ではなく、穏やかな調整を一つ選ぶことが、整え直す助けになります。バランスは一度たどり着けば終わりという場所ではなく、小さな修正を重ねながら、何度でも戻っていくものなのです。
aspects:
  relationshipsUpright: >-
    人間関係において、節制は歩み寄りと理解によって築かれる調和を映しているのかもしれません。相手と中間地点で会い、互いの違うスタイルやニーズを混ぜ合わせ、お互いのリズムを知っていく中で忍耐強くいるよう促しています。穏やかで着実な思いやりが、関係を居心地のよいものにしてくれます。
  relationshipsReversed: >-
    逆位置のこのカードは、一方のニーズばかりが優先される関係や、衝突がすぐに激しくなる関係を示しているのかもしれません。会話のペースを落とす、熱くなったら休憩をとる、互いの望みが重なるところを探すなど、どうすれば激しさを和らげられるかを考えてみましょう。
  workUpright: >-
    仕事やプロジェクトにおいて、節制は着実な進歩とよい協力関係を照らしています。異なるスキルやアイデアを組み合わせてうまく機能するものにすることや、エネルギーが続くようにペース配分することを映しているのかもしれません。意欲的でありながら、無理なく続けられる計画の形を探してみましょう。
  workReversed: >-
    逆位置の節制は、働きすぎや急いだ決断、やり方の違う人どうしの摩擦を映しているのかもしれません。どこでペースが現実的でなくなっているのか、何を簡単にできるかを問いかけてみましょう。せめぎ合う優先事項の間に中間の道を見つけることで、関わる皆のストレスを減らせるかもしれません。会議のない午後を一度つくるだけでも、落ち着いたペースがどんなものか感じられることがあります。
  growthUpright: >-
    自己成長において、このカードは堅苦しくならずにほどほどを練習するよう促しています。休息、活動、ひとりの時間、人と過ごす時間が、それぞれどれくらいあると自分が落ち着いていられるのか、そのバランスの点に気づいてみましょう。大きな決意よりも、小さく一貫した調整のほうが楽になれることがあります。
  growthReversed: >-
    逆位置の節制は、極端な状態で走り続けていなかったかを問いかけているのかもしれません。ペースを落としたり、休んだり、日々に欠けていた要素をふたたび取り入れたりする必要を映していることもあります。穏やかに整え直す領域を一つ選び、それがどう落ち着いていくかを見守る時間を自分に与えてみましょう。
reflectionQuestions:
  - "生活のどの部分が詰め込みすぎで、どの部分がおろそかになっていると感じますか？"
  - "今週、身近な人とどこで歩み寄れそうですか？"
  - "どんな小さな調整が一つあれば、日々がもう少し楽になるでしょうか？"
imageryNote: >-
  Taroの節制は、ゆるやかな川のほとりで、素焼きとガラスという二つの異なる器の間で慎重に液体を注いでいる、翼のある人物として描かれています。二つの器の間を流れる水はゆるやかな弧を描き、まるでいまこの瞬間にバランスが見つけられているかのようです。川を渡る飛び石は、一方の岸からもう一方の岸への中間の道を感じさせ、遠くの丘にかかるやわらかな朝焼けの色が、穏やかで希望に満ちた雰囲気を保っています。
