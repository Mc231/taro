shortUpright: "世話をしてきたものが、ゆっくり育っています。立ち止まって前進を見つめ、次に何を育てるか選ぶのによいときかもしれません。"
shortReversed: >-
  前進が望んでいたより遅く感じられるのかもしれません。その努力に必要なのは、忍耐か、新しい方向か、それともただの休息かを問いかけてみましょう。
meaningUpright: |-
  ペンタクルの7は、作業の途中で手を止め、道具にもたれて、硬貨をたわわに実らせた植物を見つめる人物を描いています。収穫の時はまだですが、成長は目に見えています。これは振り返りのカードです。努力から一歩下がって、これまでに何を生み出し、まだ何が必要かを見つめるのです。
  中間地点にある長いプロジェクトや、気づかないうちに上達していたスキル、何年もかけて築いてきた関係、少しずつ茂っていく庭の中に、このカードを見いだすかもしれません。この立ち止まりが大切です。それがなければ、意図ではなく習慣から働き続けてしまうかもしれません。
  このカードは、忍耐と正直さをもって自分の努力を見つめるよう促しています。仕事のどの部分がよく育っていて、どの部分が止まっているでしょうか。いまのペースは続けられるものでしょうか。このひとときを中間チェックとして扱い、ただ押し進めるのではなく、次の季節にどこへエネルギーを注ぐかを意図的に選んでみましょう。
meaningReversed: |-
  逆位置のペンタクルの7は、遅い進み具合へのもどかしさを映しているのかもしれません。着実に取り組んできたのに成果が見えず、続ける価値があるのかと思い始めているのかもしれません。努力をあまりにたくさんの畑に分散させていて、どれにも十分な水が行き渡っていないことを示している場合もあります。
  ここでは、自分を裁くのではなく、計画を見直すよう求められています。もともとゆっくり育つものもあれば、違うやり方が必要なものもあるかもしれません。
  時間と世話がどこへ向かっているかを正直に見てみましょう。どの努力がいまも自分の望みを映していて、どれはすでにたくさん注いできたからという理由で主に続いているのでしょうか。エネルギーを向け直すこと、あるいは決める前に休むことを自分に許すことで、もどかしさを、何を世話すべきかというより明確な感覚に変えられます。
aspects:
  relationshipsUpright: >-
    人間関係において、このカードは忍耐と着実な注意の価値を映しているのかもしれません。信頼と親密さは多くの場合、たくさんの小さなひとときを通してゆっくりと育ちます。立ち止まって、時間とともに関係がどう深まってきたかに気づき、次に何が必要かを問いかけてみましょう。一緒に過ごす時間を増やすこと、新しい共通の関心、あるいはただ変わらず頼れる思いやりかもしれません。
  relationshipsReversed: >-
    逆位置のカードは、つながりの育ち方へのせっかちさや、たくさん与えているのに返ってくるものが見えないという感覚を示しているのかもしれません。自分の期待が、この関係が現実的に育ちうるペースに合っているかを振り返り、それぞれが何を望んでいるかを率直に話し合ってみましょう。
  workUpright: >-
    仕事において、ペンタクルの7は、長期的な取り組みの進み具合を見直すための立ち止まりを促しています。何がうまくいっていて、何が止まっていて、次にどこに集中するかを見極めてみましょう。完成した成果がまだ少し先であっても、これまでに築いてきたスキルと下地をありがたく思うときでもあります。
  workReversed: >-
    ここでのカードは、ゆっくりとした成果への落ち着かなさや、方向を見失った努力を映しているのかもしれません。目標を見直し、日々の作業がいまもそれに役立っているかを確かめてみましょう。計画を調整したり、焦点を絞ったり、フィードバックを求めたりすることで、努力がふたたび目的のあるものに感じられるようになります。
  growthUpright: >-
    自己成長において、このカードは自分の成長に忍耐強くあるよう促しています。変化は、目に見える前に表面の下で起きていることが多いものです。この数か月を振り返り、わずかでも何が育ったかに気づいて、その証拠に励まされながら、大切なものの世話を続けてみましょう。
  growthReversed: >-
    逆位置のカードは、落胆や、人の進み具合との比較を映しているのかもしれません。自分のものではないスケジュールで成長を測っていないかを探ってみましょう。丁寧に続ける習慣を一つ選び、ほかはいったん手放すことで、成長がもっと軽く感じられるかもしれません。
reflectionQuestions:
  - "しばらく世話をしてきたものは何ですか？それは静かに何へと育ってきましたか？"
  - "どこで、前進への期待が、物事に必要なペースとずれているかもしれませんか？"
  - "次の季節、どの努力にもっと手をかけ、どれを手放せそうですか？"
imageryNote: >-
  絵には、七枚の硬貨が実りかけの果実のように下がる、葉の茂った植物かつるのそばで、くわかすきにもたれて手を止めている人物が描かれているのかもしれません。休むような姿勢は見極めることと一歩下がる必要を象徴し、植物はそれ自身の時間をかけて進む成長を感じさせます。土、葉、道具が一緒になって着実な労働を語り、まだ熟していない収穫が、仕事がなお進行中であることを見る人に思い出させてくれます。
