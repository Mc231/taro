shortUpright: "このカードは、穏やかで思いやりのある存在として、人にも自分にも深く耳を傾けるよう促しています。"
shortReversed: "抱えきれる以上のものを吸い込んでいるのかもしれません。どんなケアと境界線があれば落ち着いていられるか考えてみましょう。"
meaningUpright: |-
  カップのクイーンは水辺に座り、杯を手にして、静かな注意をもってそれを見つめています。この人物は、受け止める形での感情の成熟を表しています。深く感じ、人が何を必要としているかを察し、自分を見失うことなく思いやりをもって応える力です。
  このカードは、誰かが必要としている穏やかな存在にあなたがなっている瞬間や、自分の直感にもっと耳を傾けたくなる瞬間を映しているのかもしれません。共感、忍耐、そしてプレッシャーではなく安心を生み出すような思いやりを照らしています。
  日常では、急いで解決しようとせずに友人の話を聴くことや、ある状況についての静かな感覚を信頼すること、人が自分らしくいられるやさしい場所を家につくることなどの形で現れるかもしれません。自分の内面を生かした創作や内省的な仕事を示していることもあります。
  このカードは、感受性を強みとして大切にするよう促しています。人を思いやりながらも、自分自身のための思いやりの杯をどう満たしておけるかを問いかけてみましょう。
meaningReversed: |-
  逆位置のカップのクイーンは、縁からあふれ出してしまった思いやりを映しているのかもしれません。人の感情をあまりに深く吸い込んでいるために、自分の感情が見つけにくくなっていたり、与えすぎて自分のための余力がほとんど残っていなかったりするのかもしれません。
  内側を示している場合もあります。主に人の声に耳を傾けてきたあとで、自分の直感とふたたびつながる必要があることや、脇に置かれるのではなく注意を向けてほしいと求めている感情です。
  このカードは、境界線を思いやりのひとつの形として扱うよう促しています。すべてを背負わずに思いやるとしたら、どんな形になるでしょうか。自分の気持ちを確かめる静かな時間をとったり、依頼を一つ断ったり、荷物の一部を誰かに持ってもらったりしてみましょう。自分の杯が満たされていると、差し出す思いやりも、無理なく、より自由に流れていきます。
aspects:
  relationshipsUpright: >-
    人間関係において、カップのクイーンは深く耳を傾けること、心の支え、理解を映しているのかもしれません。感情が歓迎される関係をつくるよう促しています。自分が人をどう慰めているか、そして自分はどう慰められたいかに気づき、それを身近な人に伝えて、思いやりが双方向に流れるようにしてみましょう。
  relationshipsReversed: >-
    逆位置のこのカードは、誰かの気持ちの重さを背負いすぎていることや、関係の中で自分のニーズを見失っていることを示しているのかもしれません。どこにやさしい境界線を引けば、あなたと関係の両方を守れるかを問いかけてみましょう。自分を大切にすることは、誰かを大切にすることの一部になりえます。
  workUpright: >-
    仕事において、このカードは、ケア、教育、創作、サポートなど共感を求められる役割や、ただ周りから信頼される同僚であることを映しているのかもしれません。感情の知性を本物のスキルとして大切にするよう促しています。よく聴くことは、どんな戦略にも劣らず結果を形づくります。
  workReversed: >-
    逆位置のカードは、職場で皆の支えになっていることからくる心の疲れを映しているのかもしれません。人のストレスを自分のものとして引き受けているところに気づいてみましょう。何が自分の抱えるべきもので、何がそうでないかをはっきりさせ、一日の中でエネルギーを取り戻す小さな方法を見つけてみましょう。
  growthUpright: >-
    自己成長において、カップのクイーンは直感や感情との関係を深めるよう促しています。問いを抱えて静かに座り、考えをまとめる前に何が浮かんでくるかに気づいてみましょう。ジャーナルを書くことや水辺で過ごす時間が、内側に耳を傾ける助けになります。
  growthReversed: >-
    逆位置のこのカードは、自分自身にも思いやりを向けるよう求めているのかもしれません。友人には決して向けないような自己批判に気づくかもしれません。やさしい習慣、休息、境界線が、落ち着きを感じる助けになります。感情に押し流されそうになったら、信頼できる人に連絡することが支えになります。
reflectionQuestions:
  - "いまの状況について、直感はあなたに静かに何を伝えていますか？"
  - "自分を見失わずに誰かを思いやるために、どこでやさしい境界線が役立ちそうですか？"
  - "今週、人に向けているのと同じ思いやりを、どう自分にも向けられそうですか？"
imageryNote: >-
  絵には、水辺に座り、両手で杯を抱える人物が描かれ、その水面には空が映っています。座に彫られた貝殻や波、水の生き物は、感情の世界との深い結びつきを感じさせるのかもしれません。静かな水とやわらかな空が穏やかに受け止める姿勢を映し、杯を大切に持つその手つきは、敬意をもって扱われる内なる深みをほのめかしています。
