shortUpright: "揺るがない思考と公正な原則があなたを導いてくれます。楽なことではなく、本当のことにもとづいて決めてみましょう。"
shortReversed: >-
  理屈が硬直したり、人から離れたものになったりしているのかもしれません。自分の原則に、まだ人のための余地があるか問いかけてみましょう。
meaningUpright: |-
  ソードのキングは、刃をまっすぐに立て、揺るがないまなざしで、高い玉座に落ち着いて座っています。この人物は成熟した思考を表しています。根拠を比べ、原則を一貫して当てはめ、心地よくはなくても公正な決断を下す力です。これは、ひとつのリーダーシップとなった明晰さです。
  状況を公平に判断するよう求められるとき、複雑な事柄をシンプルに説明するとき、プレッシャーの中で自分の原則を守るときに、このエネルギーを見いだすかもしれません。熱くなった場面で理性の声になることや、その明晰な思考を尊敬している人を頼ることを映している場合もあります。このカードは誠実さ、つまり自分が信じていると言うことに沿って行動することを大切にしています。
  このカードは、自分がどのように決断を下しているかを考えてみるよう促しています。事実を集め、さまざまな見方に耳を傾けたうえで、確信をもって選んでいるでしょうか。感情やプレッシャーが自分の基準から引き離そうとするところと、落ち着いた筋道立った取り組み方が助けになりそうなところに気づいてみましょう。同時に、知恵には、人は解決すべき問題以上の存在だと知ることも含まれます。あなたの明晰な思考が、公正さと理解の両方に役立つにはどうすればよいでしょうか。
meaningReversed: |-
  逆位置のソードのキングは、硬直したり、人から離れたりしてしまった思考を映しているのかもしれません。影響を受ける人のことを顧みずにルールが当てはめられたり、知性が物事をはっきりさせるためではなく、人を支配するために使われたりすることがあります。議論には勝っても、信頼を失うこともあります。
  不確かな権威として読むこともできます。自分の判断を疑ったり、わかっているのに人に従ったり、決められないと感じたりすることです。
  このカードは、理屈と人間らしさをふたたび結びつけるよう促しています。自分の原則がいまもその目的を果たしているのか、それとも習慣へと固まってしまったのかを問いかけてみましょう。決断が人にどう受け止められるかに耳を傾けることは、その決断を弱めるのではなく、より賢明なものにしてくれます。自分の信じることを貫きながら、どこで共感に思考を導いてもらえるでしょうか。
aspects:
  relationshipsUpright: >-
    人間関係において、ソードのキングは揺るがない公正な存在を映しているのかもしれません。落ち着いて話し合い、約束を守り、人が状況をはっきり見られるよう手助けする人です。事実と共通の価値観に焦点を当てることで、意見の対立にこのエネルギーを持ち込めます。明晰さが距離として受け取られないよう、気持ちにも名前をつけることを忘れないでおきましょう。
  relationshipsReversed: >-
    逆位置のこのカードは、冷たさや説教、理屈を使って誰かの気持ちを退けてしまうことを示しているのかもしれません。はっきりとした立場をとりにくいことを映している場合もあります。弱さを見せることを避けるために理屈に逃げ込んでいるときに気づいてみましょう。頭だけでなく心も見せることで、信頼と理解が深まります。
  workUpright: >-
    仕事において、ソードのキングは明晰な思考によるリーダーシップを示しているのかもしれません。公正な方針を定める、難しい判断を透明性をもって下す、専門的な助言をすることなどです。せめぎ合う意見を比べて決めることを任されているのかもしれません。考えの筋道をオープンに説明し、一貫性を保つことで、人は自信をもってあなたについていけます。
  workReversed: >-
    逆位置のこのカードは、硬直したルールや、影響を受ける人に相談せずに下された決断、何も動かなくなるまで分析しすぎる傾向を映しているのかもしれません。その手続きがいまも目的に役立っているかを問いかけてみましょう。意見を求め、不確かさを認めることは、あなたの権威を損なうのではなく、強めてくれます。
  growthUpright: >-
    自己成長において、ソードのキングは、自分の原則を定め、それに沿って生きるよう促しています。選択を導いている価値観を書き出し、最近の決断をそれと照らし合わせてみましょう。明晰な思考は練習できる技術です。事実を集め、さまざまな視点を考え、そのうえで思慮深く道を決めるのです。
  growthReversed: >-
    逆位置のこのカードは、分析に頼りすぎることや、自分への厳しい判断を映しているのかもしれません。自分に完璧な論理を求めて、失敗の余地を残していないときに気づいてみましょう。理性と自分への思いやりのバランスをとることで、より自由に決められるようになり、思いがけない結果からも、よりやさしく学べるようになります。
reflectionQuestions:
  - "あなたの決断に、どんな原則をいちばん映したいですか？"
  - "あなたの考えの筋道が、誰かの気持ちを見落としているかもしれないのはどこですか？"
  - "今週、落ち着いて事実を比べながら下せそうな決断を一つ挙げるとしたら何ですか？"
imageryNote: >-
  このオリジナルの絵には、山の尾根に据えられた高い石の玉座に座り、刃を完全にまっすぐ掲げ、顔をまっすぐ見る人に向けた人物が描かれています。淡い空には細く整った雲がたなびき、頭上では二羽の鳥が平行に飛んでいます。まっすぐな刃は確かな原則を、まっすぐなまなざしは正直さを、そして整った空は、落ち着きを見いだした心をほのめかしています。
