shortUpright: "新しい関心の火花が、炎になる前に、少しの空気と注意を求めています。"
shortReversed: "火花はあるのに、何かがまだ燃え移るのを妨げているのかもしれません。それに何が必要か気づいてみましょう。"
meaningUpright: |-
  ワンドのエースは、デッキの中で最初にゆらめく火です。突然のアイデア、好奇心の引力、思わず身を乗り出して「やってみたい」と思う瞬間。計画を持つ前の生のエネルギーであり、完成したプロジェクトというより、わくわくする気持ちの種に近いものです。
  日常では、レシートの裏に走り書きしたスケッチや、何年も憧れてきた楽器を習いたいという衝動、可能性に胸がざわめく会話といった形で現れるかもしれません。脇に置いていた何かへの意欲が、思っていた以上の熱を帯びて戻ってくることもあります。
  このカードは、いまあなたのエネルギーがどこへ向かいたがっているかに、まだ理由づけを求めずに気づいてみるよう促しています。火花に事業計画は要りません。必要なのは少しの酸素です。10分間、最初のメモ、同じ関心を持つ人へのメッセージ一通など、今日、小さく具体的なはけ口を与えてみて、それがどう応えるかを見てみましょう。
meaningReversed: |-
  逆位置のワンドのエースは、まだうまく燃え移っていない火花を映しているのかもしれません。関心は本物なのに、明日へと先送りされ続けたり、つかまるものを見つける前に燃え上がっては消えたりしているのかもしれません。ときには、エネルギーがあまりにたくさんの始まりに分散して、どれにも十分な熱が届かないこともあります。
  もっと静かな時期を示している場合もあります。すべてのアイデアが人に見せる準備ができているわけではありません。中には、日の光を浴びる準備が整うまで、個人的なメモや空想の中で、土の下で力を蓄える時間が必要なものもあります。
  自分の火花が本当に必要としているものは何かを問いかけるときなのかもしれません。時間でしょうか、より明確な最初の一歩でしょうか、初心者でいることへの許可でしょうか、それとも始める前の休息でしょうか。完璧なタイミングが来るのを待つのではなく、山の中からアイデアを一つ選んで、小さく守られた場所を与えてみましょう。
aspects:
  relationshipsUpright: >-
    親しい関係において、このカードは新たにわき上がるぬくもりや好奇心を映しているのかもしれません。一緒に新しいことを計画したい、いつもと違う質問をしてみたい、なじみのあるつながりにもっと遊び心を持ち込みたい、という気持ちです。いま誰があなたを明るくしてくれるのか、そしてどんな共通の冒険が、たとえ小さなものでも、そのエネルギーを二人の間で巡らせてくれるかに気づいてみましょう。
  relationshipsReversed: >-
    逆位置では、あなたと身近な人の間の火花が、日々のくり返しや疲れ、口にされないためらいによってくぐもって感じられるのかもしれません。それはぬくもりが消えたという意味ではなく、きっかけを待っているだけなのかもしれません。以前は何が二人の会話に火をつけていたか、そして好奇心から生まれる小さなふるまいが、その生き生きとした感じを呼び戻せないか考えてみましょう。
  workUpright: >-
    仕事や創作のプロジェクトにおいて、ワンドのエースは本当に引きつける力のあるアイデアを示しているのかもしれません。新しいアプローチ、副業的なプロジェクト、何度も立ち返ってしまう提案などです。大まかな構成、試作品、信頼できる人への短い提案など、最初の具体的な形を与えてみましょう。そうすれば、頭の中だけでなく、外の世界で試すことができます。
  workReversed: >-
    逆位置では、やる気がちらついているのかもしれません。アイデアが承認を待ち続けていたり、あまりにたくさんの始まりがあなたの時間を奪い合っていたりするのかもしれません。たどる糸を一本選び、ほかはひとまず脇に置くときなのかもしれません。一つのアイデアで小さくても目に見える前進をすることは、いくつも同時に計画するよりも多くのエネルギーをふたたび灯してくれることがよくあります。
  growthUpright: >-
    好奇心はそれ自体がひとつの先生になりえます。このカードは、その好奇心に従ってみるよう促しています。あなたが何にひかれるかは、あなたの中で何が育ちたがっているかを物語っていることが多いものです。今週感じた火花を、評価せずにメモしておき、何度も戻ってくるものを探してみましょう。
  growthReversed: >-
    逆位置では、始める前に準備ができたと感じるのを待っていたり、ひらめきを感じられない自分に厳しくなっていたりするのかもしれません。エネルギーには季節のようなものがあります。いまを静かに蓄える時期と考えて、休み、読み、気づき、新しい関心が自分のペースで形をとっていくのに任せてみましょう。
reflectionQuestions:
  - "最近、どんなアイデアや関心があなたの注意を引いていますか？"
  - "この火花を誰と分かち合えば、一緒に育ててくれる相手ができるでしょうか？"
  - "今週、この火花に空気を送るための小さな行動を一つ挙げるとしたら何ですか？"
imageryNote: >-
  一本の生きた杖が画面にそびえ立っています。切られたばかりなのに、まだ緑の芽を出していて、木が育つのをやめられないかのようです。その先端には小さな炎か光が集まっています。この枝は、まだ生きていて形の定まらない生の創造力を表し、新しい葉は、ひらめきは手をかけることで育つことを感じさせます。あたたかな赤と金色が火のエレメントを運び、背後の開けた空は、まだ探る余地のある広がりをほのめかしています。
