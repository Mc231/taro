imageryNote: >-
  Taroの運命の輪は、片方の端では夜明け、もう片方の端では夜へと移り変わる空に据えられた、大きく回る輪として描かれ、すべての段階を一度に見せています。その縁には小さな人物や生き物たちが乗り、上っていくものもあれば下っていくものもあり、じっとしているものはいません。四隅に置かれた四季の象徴は、自然の周期という考えを縁取っているのかもしれません。中心には、穏やかで動かない軸があり、すべてが巡る中でも見つけられる落ち着いた視点を感じさせます。
