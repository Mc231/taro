shortUpright: "物事は巡っています。このカードは、あなたがいまどんな周期の中にいて、それとどう歩んでいきたいかに気づくよう促しています。"
shortReversed: "見慣れたパターンが、また巡ってきているのかもしれません。今回は何を違うふうにできるでしょうか。"
meaningUpright: |-
  運命の輪は、周期のカードです。季節は巡り、気分は上がったり下がったりし、忙しい時期は静かな時期へと移り変わります。いつまでも頂点や底にとどまり続けるものはありません。このカードは、変化は人生のごく自然な一部であり、その中には誰にもどうにもできないものもあれば、あなたの向き合い方に応じて変わるものもあることを思い出させてくれます。
  日常では、このカードは転機を映しているのかもしれません。ひとつの章が終わり、別の章が始まること、計画を変える思いがけない幸運、ペースを変える予想外のつまずきなどです。以前にも現れたパターン、たとえば同じような状況が新しい形でやってくることに気づき、それを新鮮な目で見ることを示している場合もあります。
  このカードは、いま自分が自分自身の輪のどのあたりにいるかを考えてみるよう促しています。この時期があなたに何を求めているのか、そして何を教えてくれているのかを問いかけてみましょう。運命の輪があなたの人生を決めるわけではありません。柔軟さ、広い視野、ユーモアのセンスが転機を乗りこなす助けになること、そしてつらい季節は季節であって、永遠に続く状態ではないことを照らし出しているのです。
meaningReversed: |-
  逆位置の運命の輪は、同じところをぐるぐる回っている感覚や、すでに始まっている変化に抵抗している状態を映しているのかもしれません。出来事が自分の身にただ降りかかってくるように感じたり、同じもどかしいパターンが装いを変えて何度も戻ってくることに気づいたりすることがあります。
  このカードは、よい時期にしがみつき、それが続かないのではと恐れていることを示している場合もあります。しがみつくほど、自然な移り変わりはつらく感じられます。
  自分の手の届く範囲に何があるかを見つめてみるとよいでしょう。パターンはたいてい、私たちの応じ方の何かが、ほんの少しでも変わるまで繰り返されます。自分に見えている周期に名前をつけ、責めることなくその中での自分の役割に気づき、違うふうにやってみることを一つ選ぶと助けになるかもしれません。輪を止めることはできませんが、その上でより確かな足場を見つけることはできます。
aspects:
  relationshipsUpright: >-
    人間関係において、運命の輪は新しい段階を映しているのかもしれません。より親しくなること、別のステージへ進むこと、あるいは変わりゆく状況にただ合わせていくことです。柔軟さを保ち、物事がどう変わってきているかを率直に話し合うよう促しています。関係にも季節のようなリズムがあり、それに名前をつけることで、ともに乗り越えていきやすくなります。
  relationshipsReversed: >-
    逆位置のこのカードは、何度も戻ってくるおなじみの衝突や、関係の形が変わることへの抵抗を示しているのかもしれません。あなたと身近な人がどんなパターンを繰り返しがちか、そしてそれぞれが何を違うふうに試せるかを考えてみましょう。変化は喪失を意味するとは限らず、成長を意味することもあります。
  workUpright: >-
    仕事やプロジェクトにおいて、運命の輪は移り変わる状況と新しい機会を照らしています。計画の変更や新しいチーム、急に前へ進み始めたプロジェクトを映しているのかもしれません。機会に目を配りながらも、忙しい時期にもゆっくりした時期にも、それぞれに得られるものがあることを心に留めておきましょう。
  workReversed: >-
    逆位置の運命の輪は、遅れへのもどかしさや、努力が報われていないという感覚を映しているのかもしれません。同じやり方を繰り返しながら、違う結果を期待していることを示している場合もあります。これまで何がうまくいき、何がうまくいかなかったかを振り返り、方法を少し変えることでパターンを動かせるところはどこかを見てみましょう。
  growthUpright: >-
    自分の人生を一本のまっすぐな線ではなく、いくつもの周期の連なりとして見ることは、心を自由にしてくれることがあります。元気が出るときや休息が必要なときなど、自分のリズムに気づくことで、それに逆らうのではなく沿った計画を立てやすくなります。この一年を振り返って、その転機を書き出してみるのもよいでしょう。
  growthReversed: >-
