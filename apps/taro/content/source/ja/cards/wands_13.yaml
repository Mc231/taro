shortUpright: "あたたかく自信に満ちたエネルギーが、あなたのそばにあります。自分の居場所を広く取り、その光を人と分かち合ってみましょう。"
shortReversed: >-
  内なる火がちらついていたり、薄く引き延ばされていたりするのかもしれません。何が自信を奪い、何がそれを新たにしてくれるかを見てみましょう。
meaningUpright: |-
  ワンドのクイーンは、落ち着いて輝く火を体現しています。あかあかと燃える炉のそばにくつろいで座り、葉をつけた杖を手にしたこの人物は、何かを証明する必要もなく自信に満ちています。ここにあるのは、あたたかく、人を惹きつけ、惜しみないエネルギーです。部屋を明るくしながらも、自分の中心を保っていられる人です。
  気負わずに発言するとき、心からのぬくもりで人をもてなすとき、情熱と現実感の両方をもって創作プロジェクトに取り組むときに、自分の中にこの資質を見いだすかもしれません。その自信によって周りの人を輝かせてくれる、身近な誰かを表していることもあります。
  このカードは、自分の才能を自分のものとして受け止めるよう促しています。自信は大きな声である必要はありません。自分には差し出す価値のあるものがある、という穏やかな感覚でもよいのです。自分がどこで縮こまりがちかに気づき、もう少しだけ場所を取ってみることを試してみましょう。あなたのぬくもり、熱意、アイデアを分かち合うことは、あなたにとっても周りの人にとっても贈り物になりえます。
meaningReversed: |-
  逆位置のワンドのクイーンは、かげってしまった炎を映しているのかもしれません。自分を疑っていたり、いつもエネルギーを持ち込む役であることに疲れていたり、注目を避けるために活力を抑えていたりするのかもしれません。
  ときにこの逆位置のクイーンは、あまり惜しみない形ではない火の使い方を示します。比較、ねたみ、あるいはスポットライトを独り占めしたいという欲求です。こうしたものは、見てもらえていないという感覚から育つことが多いものです。
  自分自身の火を世話するときなのかもしれません。何が自信を奪っていて、以前は何がそれを新たにしてくれていたでしょうか。生き生きとした気持ちにさせてくれる活動に戻ったり、あなたを大切に思ってくれる人と過ごしたり、罪悪感なしに休んだりしてみましょう。自信はたいてい、どう見えるかではなく、自分が大切にしているものとふたたびつながる中で、少しずつ戻ってきます。
aspects:
  relationshipsUpright: >-
    人間関係において、このカードは関係の中でのぬくもり、開かれた心、しっかりとした自分らしさを映しているのかもしれません。自分のニーズに正直でいながら、大切な人にエネルギーと励ましをもたらすことができます。この資質は、それぞれが自由に輝ける、生き生きとした正直な関係をつくってくれます。
  relationshipsReversed: >-
    逆位置では、かすんでしまっている、当たり前のように扱われている、あるいは人と自分を比べたくなると感じているのかもしれません。ぬくもりを受け取らずに与えるばかりになっていなかったか考えてみましょう。自分に必要なことを伝え、人に認められるのを待つ前に自分で自分を認めることが、親しい関係のバランスを取り戻す助けになります。
  workUpright: >-
    仕事や創作において、ワンドのクイーンは自信に満ちたリーダーシップと、人に刺激を与える才能を示しているのかもしれません。プロジェクトへの責任を目に見える形で引き受け、確信をもってアイデアを共有し、同僚が活気づくような雰囲気をつくってみましょう。あなたの熱意は、単なる気分ではなく、実際に役立つ資源になりえます。
  workReversed: >-
    逆位置では、あまりに多くの役割に引き延ばされていたり、つまずきのあとで自分の能力を疑っていたりするのかもしれません。本当に自分の強みを生かせる作業を見極め、そのための時間を守ってみましょう。どこにでも同時にいなければという思いから一歩引くことで、本来の自信が戻ってくるかもしれません。
  growthUpright: >-
    あなたのぬくもりは周りの人に影響を与えていて、このカードはそれを自分のものとして受け止めるよう求めています。何があなたをいちばん生き生きと、自信に満ちた気持ちにしてくれますか。自信を感じられる場面に気づき、ふだんは控えめになってしまう領域に、そのエネルギーを少し持ち込んでみましょう。
  growthReversed: >-
    逆位置では、自信のなさや比較が、どこで頭の中の場所を占めているかを探ってみるとよいかもしれません。誰かと比べることなく、自分の前進や資質に気づくことが助けになります。休息と遊びはどちらも、小さくなった火をふたたび燃え立たせる方法です。
reflectionQuestions:
  - "どこにいるとき、いちばん自信を感じ、まるごと自分らしくいられますか？"
  - "誰のぬくもりがあなたを励ましてくれますか？そのぬくもりを、どうすれば別の誰かに差し出せるでしょうか？"
  - "今週、もう少しだけ自分の場所を広げるための方法を一つ挙げるとしたら何ですか？"
imageryNote: >-
  日の差す空き地に置かれた広い座に、人物がくつろいで座っています。葉をつけた杖を片手に休ませ、もう片方の手は見る人に向かって開かれています。そばでは炉の火があかあかと燃え、用心深い動物の連れが近くに寝そべっています。炉は人に差し出すぬくもりを、開いた手は惜しみなさを、くつろいだ姿勢は自分を証明する必要のない自信を感じさせます。あたたかな金色と琥珀色が、最も落ち着いて輝く火を響かせているのかもしれません。
