shortUpright: "澄んだ視点と、やさしく率直な声はともにありえます。経験が教えてくれたことを信頼してみましょう。"
shortReversed: "明晰さが、距離へと固まってしまったのかもしれません。正直さを失わずに、どこにぬくもりを取り戻せるか気づいてみましょう。"
meaningUpright: |-
  ソードのクイーンは高い座に背筋を伸ばして座り、刃を掲げ、正直さを招き入れるかのように片手を差し出しています。このカードは、経験によって形づくられた澄んだ認識、つまり状況をありのままに見て、それについて率直に語る力を表しています。この明晰さは冷たいものではありません。さまざまなことをくぐり抜け、そこから学んできたことから生まれているのです。
  謝ることなくしっかりとした境界線を引くとき、正直で公正なフィードバックを伝えるとき、希望的観測ではなく事実にもとづいて決断を下すときに、このエネルギーを見いだすかもしれません。自立、つまり自分の判断を信頼し、自分の頭で考えるための余白を必要とすることを映している場合もあります。本当のことを言ってくれるとわかっているからこそ、人があなたのもとを訪れるのかもしれません。
  このカードは、明晰さと思いやりがどのように協力し合えるかを考えてみるよう促しています。はっきり見ることに厳しさは必要なく、やさしくあることに偽りは必要ありません。過去の困難も含めた自分の経験が、どこで信頼に値する視点を与えてくれたかを問いかけてみましょう。その洞察を、正直さと思いやりの両方をもって、自分や人を支えるためにどう使えるでしょうか。
meaningReversed: |-
  逆位置のソードのクイーンは、冷たさへと変わった明晰さを映しているのかもしれません。過去の傷のために身構えたり、すぐに批判したり、人を近づけたがらなかったりしているのかもしれません。正直さは、人を遠ざけるために使われると、盾になってしまうことがあります。
  その反対として読むこともできます。自分の本当の思いを口にしにくかったり、人に判断を曇らされたり、引いた境界線が持ちこたえなかったりすることです。
  このカードは、いま頭と心のバランスをどうとっているかを見つめるよう促しています。昔の落胆が、今日の人への応じ方を形づくっていないか気づいてみましょう。やわらぐことは、自分の基準を手放すことではありません。正直さと並んで、ぬくもりも旅をさせることなのです。はっきりと話しながらも開かれたままでいるとしたら、どんな形になるでしょうか。
aspects:
  relationshipsUpright: >-
    人間関係において、ソードのクイーンははっきりとしたコミュニケーションと健全な境界線を映しているのかもしれません。何を受け入れ、何を受け入れないかを知っていて、それを落ち着いて伝えられるのかもしれません。このエネルギーは正直さを大切にし、相手を尊重しているからこそ本当のことを伝えます。率直さにぬくもりを添えることで、人は尊重されていると同時に、大切にされていると感じられます。
  relationshipsReversed: >-
    逆位置のこのカードは、身構えやとげのある言葉、傷ついたあとで人を遠ざけておくことを示しているのかもしれません。自分を守ることが、親密さを犠牲にし始めていないか考えてみましょう。考えていることだけでなく、感じていることも少し分かち合うことで、境界線を手放すことなく、よりあたたかなつながりを招き入れられます。
  workUpright: >-
    仕事において、ソードのクイーンは公正な判断、明確な基準、混乱を切り分ける力を示しているのかもしれません。会議で本当の課題を言葉にしたり、人の成長を助けるフィードバックを伝えたりする存在なのかもしれません。あなたの自立と経験は強みです。自分の考えの筋道をオープンに共有することで、人はあなたの判断を信頼しやすくなります。
  workReversed: >-
    逆位置のこのカードは、批判的すぎるフィードバックや、硬直した基準、チームから孤立してしまうことを映しているのかもしれません。周りから反発されると自分の判断を疑ってしまうことを示している場合もあります。率直さと励ましのバランスをとり、はっきりとした期待は、人がそれに応えられるよう支えられていると感じるときにこそうまく働くと心に留めておきましょう。
  growthUpright: >-
    自己成長において、ソードのクイーンは、自分が手にしてきた知恵を信頼するよう促しています。困難な経験を一つ振り返り、それが何を教えてくれたかに名前をつけてみましょう。自分をはっきり知っていることは、たとえ人気のある選択でなくても、境界線を引き、正直にコミュニケーションをとり、自分の価値観に沿った選択をする助けになります。
  growthReversed: >-
    逆位置のこのカードは、内なる批判者をやわらげる必要や、古い恨みを手放す必要を映しているのかもしれません。自分や人を厳しく裁いているときに気づき、正直さを保ちながらも、もっとやさしい言葉とはどんなものかを問いかけてみましょう。明晰さは、理解を含むことで、弱くなるのではなく強くなります。
reflectionQuestions:
  - "過去の困難が教えてくれたことで、いまは信頼していることは何ですか？"
  - "どこで、正直なことを、やさしくも感じられる形で伝えられそうですか？"
  - "今週、もっとはっきり伝えたい境界線は何ですか？"
imageryNote: >-
  このオリジナルの絵では、雲の上高くに据えられた彫刻の施された石の座に人物が座り、片手で刃をまっすぐ上に掲げ、もう片方の手は開いて差し出しています。澄んだ空の上では、一羽の鳥が旋回しています。まっすぐな刃は見極める力を、開いた手は公正さと耳を傾けようとする姿勢を、そして一羽の鳥は、自立して遠くを見通す心をほのめかしています。
