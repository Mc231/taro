  - "どこで人と人の間の慎重な平和を保っていますか？それはあなたにどんな負担をかけていますか？"
  - "今週、目を向けることを自分に許せる事実や気持ちを一つ挙げるとしたら何ですか？"
imageryNote: >-
  このオリジナルの絵では、座った人物が交差させた二本の刃を胸もとに引き寄せ、目にはやわらかな布がかけられています。石の点在する穏やかで浅い水の上に、淡い三日月が低くかかっています。交差した刃は閉ざされた扉のような身構えた形をつくっています。静かな水と夜の光は水面下で休んでいる感情を感じさせ、覆われた目は、まだ見ないでおくという選択を示しています。
