meaningUpright: |-
  ソードの2は、二つの道の間で保たれている姿勢を描いています。どちらの選択肢も明らかに正しいとは言えないので、腕を組み、待ちながら、両方の釣り合いを保っているのです。それは賢明な小休止、選ぶ前にひと息つくためのひとときでありえます。一方で、選択をはっきりさせてくれる何かを見ないでおくための方法でもありえます。
  先延ばしにし続けている決断や、あえてどちらの側にもつかないでいる意見の対立、まだ向き合いたくない問いについての自分との休戦の中に、このカードを見いだすかもしれません。表面の穏やかさは、その下にある大きな努力を隠していることがあります。重いものを二つ静止させておくのは、疲れることなのです。
  このカードは、その静けさが何を守っているのかを考えてみるよう促しています。それは情報を集める時間を与えてくれているのでしょうか、それともすでに持っている情報から目をそらさせているのでしょうか。それぞれの選択肢を、どう考えるかだけでなく、どう感じるかも含めて、平易な言葉にしてみましょう。隠れていた気持ちが一つ光の中に出てきただけで、釣り合いが変わり、次の一歩が踏み出しやすくなることもあります。
meaningReversed: |-
  逆位置のソードの2は、ほどけ始めた膠着状態を映しているのかもしれません。目隠しがずれ、準備ができていてもいなくても、避けてきたものが視界に入ってきているのかもしれません。それは安堵をもたらすこともあれば、脇に置いていた感情を一気に押し寄せさせることもあります。
  釣り合いが、動きが少なすぎる状態からプレッシャーが大きすぎる状態へと傾いていると読むこともできます。考える時間もないうちに周りから選ぶよう迫られたり、待つことの居心地の悪さを終わらせたいだけで急いで決断したりすることです。
  以前は自分に知ることを許さなかったけれど、いまはわかっていることは何かを問いかけてみましょう。飛び込む必要はありません。新しい景色はゆっくり受け止めればよいのです。しっかり見ることを自分に許したとき、どの選択が違って見えるでしょうか。そして、ここからの思慮深い次の一歩はどんなものでしょうか。
aspects:
  relationshipsUpright: >-
    人間関係において、このカードは静かなにらみ合いを示しているのかもしれません。穏やかさを保つために二人がある話題を避けていたり、周りの人の間で中立でいるために、あなたが自分の考えを抑えていたりする状態です。こうして保たれる平和はもろく感じられることがあります。やさしく正直な会話が慎重な沈黙に代われないか、そして両方の側を同時に守らなくてよいとしたら何を言いたいかを考えてみましょう。
  relationshipsReversed: >-
    逆位置のソードの2は、休戦の終わりを映しているのかもしれません。しまい込まれていた感情が浮かび上がってきたり、誰かがついにあなたの立場を言葉にするよう求めてきたりするかもしれません。それは居心地が悪く感じられるかもしれませんが、より正直になるための余地も生んでくれます。抱えてきたことを一度にではなく、小さくはっきりとしたかけらにして伝えてみましょう。
  workUpright: >-
    仕事において、このカードは保留中の決断を映しているのかもしれません。二つのやり方、時間を求める二つの依頼、同じくらい差し迫って見える二つの優先事項です。もっと事実が必要なら、待つことは理にかなっているかもしれません。それぞれの選択肢が自分に求めるものと与えてくれるものを書き出し、どちらのリストを見るのを避けているかに気づいてみましょう。そのためらいも、役に立つ情報になりえます。
  workReversed: >-
    逆位置では、止まっていた選択がふたたび動き出しているのかもしれません。締め切りや新しい事実が問いを迫ってくるからということもあります。急かされているように感じるかもしれません。今日本当に決める必要があることと、もう少し待てることを分けると助けになります。ある情報を避けてきたのなら、いまこそそれをまっすぐ見て、導きにするときなのかもしれません。
  growthUpright: >-
    自己成長において、ソードの2は、じっとしていることでつらい気持ちから自分を守っているやり方に気づくよう促しています。静けさは休息になりますが、感じないための方法にもなりえます。それぞれの選択肢と数分ずつ向き合い、理屈だけでなく体の反応にも注意を向けてみましょう。どちらの知り方も大切です。
  growthReversed: >-
    逆位置のこのカードは、自分に正直になることの転機を映しているのかもしれません。遠ざけてきたものが、いまは近くにあります。裁くのではなく好奇心をもって、自分のペースでそれを受け止めてみましょう。目を開くことは、すぐに行動しなければならないという意味ではありません。決める前に、はっきり見ることを選ぶという意味なのです。
reflectionQuestions:
