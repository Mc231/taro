shortUpright: >-
  資源や時間や思いやりが、人と人の間を行き交っています。自分がどう与え、どう受け取り、何が皆にとって公平に感じられるかに気づいてみましょう。
shortReversed: >-
  やりとりが偏っているように感じられるのかもしれません。何が与えられ、何が見返りとして期待され、何があればもっと釣り合うかを見てみましょう。
meaningUpright: |-
  ペンタクルの6は、天秤を手にしながら、人々に硬貨を分け与える人物を描いています。これは人と人の間の資源の流れについてのカードです。お金もそうですが、時間、注意、助言、忍耐、実際的な手助けもまた含まれます。天秤は公平さへの心配りを、開いた手は分かち合おうとする気持ちを感じさせます。
  いまのあなたは与える立場にいるのかもしれません。友人に手を貸したり、誰かを指導したり、大切にしている活動を支えたりしていることです。あるいは受け取る側にいて、好意や手助けや二度目のチャンスを受け入れているのかもしれません。どちらの役割にもそれぞれの美しさがあり、私たちの多くは時とともにその間を行き来しています。
  このカードは、自分のやりとりにどんな気持ちが込められているかを振り返るよう促しています。あなたの与え方は自由なものでしょうか、それとも静かな期待を伴っているでしょうか。卑屈にならずに受け取れるでしょうか。惜しみなさが本当のつながりを生み出しているところと、もう少しのバランスや正直さがあれば関わる皆が尊重されていると感じられるところに気づいてみましょう。
meaningReversed: |-
  逆位置のペンタクルの6は、偏ってしまったやりとりを示しているのかもしれません。一方が受け取るよりもはるかに多く与えていたり、助けに口にされない見返りがついていたりするのかもしれません。感謝を期待されること、選択に影響を及ぼされること、借りがあるという感覚です。受け取ること自体が難しく、助けを受け入れると立場を失うかのように感じていることを映している場合もあります。
  これは、誰かを責めることなく天秤を見直すための誘いです。不均衡は多くの場合、意図ではなく習慣によって、静かに大きくなっていきます。
  与えることと受け取ることがずれているように感じられる関係や取り決めを一つ見てみましょう。与え続けてきたもので、消耗させるものになっているものはないでしょうか。断り続けてきた支えはないでしょうか。期待をはっきり言葉にしたり、差し出す量を調整したりすることで、双方にとって公平で、自由に選ばれたやりとりを取り戻せます。
aspects:
  relationshipsUpright: >-
    人間関係において、このカードは惜しみない、互いの思いやりを映しているのかもしれません。ある一日には釣り合っていなくても、時間とともに双方向に流れる支えです。自分が実際的な形でどう思いやりを示しているか、そして人にどう思いやらせているかに気づいてみましょう。相手が与えてくれているものに具体的に感謝を伝えることで、その流れをあたたかく、目に見えるものに保てます。
  relationshipsReversed: >-
    逆位置のカードは、一方が多く与えていると感じている関係や、助けが義務を伴っている関係を示しているのかもしれません。貸し借りを数えずに、バランスについて自分がどう感じているかを、やさしく話題にしてみましょう。ときには、自分に必要なことを頼むことや、すぐに返さなければと思わずに、誰かが手を差し伸べてくれるのを受け入れることが、いちばんやさしい変化です。
  workUpright: >-
    仕事において、このカードは知識の共有、指導、公正な評価、協力的な支えを表しているのかもしれません。誰かのために扉を開く立場にいるのかもしれませんし、導きを素直に受け入れる立場にいるのかもしれません。周りで資源や手柄がどう分かち合われているかに気づき、より公平な流れにどう貢献できるかを考えるよう促しています。
  workReversed: >-
    ここでのカードは、認められない努力や、プレッシャーを生む好意、何を返すべきかについての曖昧な期待を映しているのかもしれません。取り決めをはっきりさせたり、自分の貢献について声を上げたり、当然のように余分な労力を差し出しているところに気づいたりしてみましょう。職場の公平なやりとりは、多くの場合、見えないものを見えるようにすることから始まります。
  growthUpright: >-
    自己成長において、ペンタクルの6は、惜しみなさと自分との関係を探るよう促しています。どこで与えることが喜びに感じられるでしょうか。どこで受け取ることが心地よく感じられるでしょうか。今週、小さな惜しみない行いを一つと、受け取る行いを一つ練習し、それぞれが自分の中に何を呼び起こすかに気づいてみましょう。
  growthReversed: >-
    逆位置のカードは、価値ある存在だと感じるために与えることや、コントロールを保つために助けを断ることを映しているのかもしれません。こうしたパターンがどこで始まったのか、そしていまも合っているのかを探ってみましょう。天秤の両側に立つことを自分に許すことで、自尊心と信頼が深まります。
reflectionQuestions:
  - "あなたはどこでいちばん自由に与え、どこで控えてしまいますか？"
  - "人生の中で偏っていると感じるやりとりはどれですか？何があればもっと公平に感じられるでしょうか？"
  - "今週、借りがあると感じずに、誰かからの助けを受け取るにはどうすればよいでしょうか？"
imageryNote: >-
  絵の中心には、片手に釣り合った天秤を持ち、もう片方の手で近くの人々に硬貨を差し出す、立っている人物が描かれているのかもしれません。六枚の硬貨が場面のあちこちに配され、手の中にあるものもあれば、人と人の間の宙にあるものもあります。天秤は公平さと配慮を、差し出された手は惜しみなさを、そして人物たちの異なる位置は、どんなやりとりの中にも静かに潜みうる力関係という問いを象徴しているのかもしれません。
