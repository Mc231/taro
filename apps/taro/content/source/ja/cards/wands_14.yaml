shortUpright: "明確なビジョンを持つエネルギーが、目的をもって導き、大きなアイデアを人がついていける方向へと変えるよう誘っています。"
shortReversed: >-
  強い推進力が、せっかちさや支配へと傾いているのかもしれません。自分のビジョンに、まだ人のための余地があるか確かめてみましょう。
meaningUpright: |-
  ワンドのキングは、このスートの火を成熟へと導きます。玉座に座りながらも少し前に身を乗り出し、杖を手にしたこの人物は、いつでも行動できる様子です。そのエネルギーはビジョンにあふれ、決断力があります。物事がどこへ向かいうるかを見通し、方向を定める自信と経験を持った人です。
  この資質は、プロジェクトの舵を取るとき、変化の中でグループを導くとき、明確な価値観にもとづいて大胆な決断を下すときに現れるかもしれません。その目的意識によって周りの人に勇気を与える指導者やリーダーを表していることもあります。
  このカードは、自分自身の権限に足を踏み入れるよう促しています。ここでのリーダーシップは、支配というよりも、ビジョン、誠実さ、そして最後までやり遂げることです。いまの努力がどんな大きな目的のためにあるのか、そしてそれを関わる人たちにどうはっきり伝えられるかを問いかけてみましょう。方向が誠実で、よく伝わっていれば、人はただ指示に従うのではなく、自ら加わりたいと思うことが多いものです。
meaningReversed: |-
  逆位置のワンドのキングは、バランスを失った推進力を映しているのかもしれません。人のペースにいらだったり、耳を傾けずに計画を押し通したり、休む余地がなくなるほど高い目標を立てたりしているのかもしれません。反対に、ビジョンを見失い、次にどこへ向かえばいいのかわからなくなっているリーダー、もしかするとあなた自身を示している場合もあります。
  このカードは、自分の影響力をどう使っているかを見つめるよう誘っているのかもしれません。あなたのエネルギーは人を鼓舞しているでしょうか、それとも圧倒しているでしょうか。そのビジョンは、いまもあなたの中で生きているでしょうか。
  立ち止まって自分の目的とふたたびつながったり、正直なフィードバックを求めたり、決定をより広く分かち合ったりしてみましょう。強いリーダーシップは、指示することと同じくらい、耳を傾けることから育つものです。
aspects:
  relationshipsUpright: >-
    人間関係において、このカードは自信に満ち、守ろうとし、励ましてくれる存在を映しているのかもしれません。共有する計画にビジョンをもたらし、身近な人が自分の目標を信じられるよう手助けすることができます。ここでの誘いは、惜しみなく導くことです。歓迎されるときには方向を示し、ほかの誰かが舵を取りたいときには支えに回るのです。
  relationshipsReversed: >-
    逆位置では、一方が決定の主導権を握りすぎていたり、せっかちさが緊張を生んでいたりするのかもしれません。身近な人の話を最後まで聴いているか、それともすでに答えを考えているかに気づいてみましょう。相手のアイデアを招き入れることで、一方的な計画を、二人で分かち合う計画に変えることができます。
  workUpright: >-
    仕事やプロジェクトにおいて、ワンドのキングはリーダーシップ、戦略的なビジョン、主導権を取る勇気を示しているのかもしれません。明確な目標を定め、熱意をもってそれを伝え、人の強みを信頼する形で仕事を任せてみましょう。誠実さと一貫性があれば、人は意欲的な方向にも安心してついていけます。
  workReversed: >-
    逆位置では、押しすぎていたり、人に自分のペースに合わせることを期待していたり、自分自身が方向に確信を持てずにいたりするのかもしれません。一歩引いて、関わる人たちとビジョンを見直してみましょう。意見を求め、目標を調整することで、計画はより現実的になり、より広い支持を得られるかもしれません。
  growthUpright: >-
    自己成長において、このカードは自分の方向性を自分のものとして引き受けるよう促しています。長い目で見て何を築きたいのか、そしてそれを導く価値観は何でしょうか。短い目的の言葉を書いて、これからの選択の拠りどころにしてみましょう。
  growthReversed: >-
    逆位置では、自分と、コントロールや忍耐との関係を探ってみるとよいかもしれません。いつも主導権を握っていなければと感じるでしょうか、それとも荷が重く感じられてリーダーシップを避けているでしょうか。自信と柔軟さをもって自分の人生を導く中間の道を見つけることは、揺るがない強さのひとつの形です。
reflectionQuestions:
  - "どんなビジョンに向かって取り組んでいますか？それをほかの人にどれだけはっきり説明できそうですか？"
  - "人が自分の強みを持ち寄りたくなるような導き方とは、どんなものでしょうか？"
  - "どこでもう少し忍耐を持てば、あなたの推進力がより生かされそうですか？"
imageryNote: >-
  見晴らし台の縁に置かれた高い座に人物が座り、前に身を乗り出しています。そばには花をつけた杖がしっかりと立てられ、まるでいまにも立ち上がろうとしているかのようです。その先には、夕方の日差しに照らされた遠くの丘へと道が曲がりくねって続いています。花をつけた杖は生きて育つビジョンを、見晴らし台は築きうるものを広く見渡す視野を、そして前のめりの姿勢はアイデアを行動に移す準備を感じさせます。燃えさしや小さな炎の模様が、火のエレメントを運んでいるのかもしれません。
