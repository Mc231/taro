  - "直してもらう必要なしに、自分の悲しみを見せられる相手は誰ですか？"
  - "今日、自分のためにできるやさしいことを一つ挙げるとしたら何ですか？"
imageryNote: >-
  このオリジナルの絵には、低く垂れこめた灰色の空の下、ハートの形をした石に立てかけられた三本の細い刃が描かれています。周りにはやわらかな雨が降り、雲の端にはかすかな光の切れ間がのぞいています。石は悲しみの重さを、雨は涙と解放を感じさせます。遠くの光は、いつとは約束せずに、嵐は過ぎていくものだとほのめかしています。
