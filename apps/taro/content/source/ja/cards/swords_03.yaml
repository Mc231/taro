shortUpright: >-
  悲しい瞬間や傷ついた瞬間が、言い訳で片づけられるのではなく、感じられることを求めているのかもしれません。悲しみはやさしく受け止めてよいものです。
shortReversed: "傷のいちばん鋭い部分がやわらぎつつあるのかもしれません。何が少しでも楽に息をさせてくれるか気づいてみましょう。"
meaningUpright: |-
  ソードの3は悲しみについて語っています。落胆や喪失の痛み、あるいは強く胸に刺さった言葉です。この気持ちがどれくらい続くのか、何が原因なのかは語りません。ただ、つらい瞬間があること、そしてその痛みが本物であることを認めています。
  あなたを揺さぶった会話や、物事の見方を変えた知らせ、何気ない午後にふと戻ってくる悲しみの中に、このカードを見いだすかもしれません。そうでなければいいと願っていた真実を理解したときの痛みを映していることもあります。考える頭は、痛みを分析し、理由を見つけ、すぐに直したがることが多いものです。
  このカードは、気持ちを気持ちのままにしておくよう、やさしく促しています。雨は降り、そして過ぎていきます。悲しみも、許されれば同じように動いていくことがあります。自分にやさしさと時間を与え、急かさずに話を聴いてくれる人と一緒にいてみましょう。重い気持ちが続くようなら、信頼できる人や資格を持つ専門家に話すことが助けになります。友人の悲しみに接するように自分の悲しみに接するとしたら、どうなるでしょうか。
meaningReversed: |-
  逆位置のソードの3は、傷がゆっくりとやわらいでいくことを映しているのかもしれません。地面はまだ濡れていても、嵐は過ぎ去りつつあるのかもしれません。小さな軽やかさのひとときが戻ってきたり、起きたことについて少し落ち着いて話せるようになったりしていることに気づくかもしれません。
  内側に向かった悲しみとして読むこともできます。あまりに個人的なことに感じられるから、あるいは周りがもう大丈夫だろうと思っているように見えるからといって、分かち合われずにきつく抱えられている痛みです。黙って抱えられた傷は、必要以上に長く残ることがあります。
  このカードは、少しでも手放す助けになるものに気づくよう促しています。書くこと、外で過ごす時間、信頼できる人との会話、あるいはただ期限なしに悲しむことを自分に許すことかもしれません。つらい出来事から回復するのに、正しいペースはありません。今日、自分に差し出せるやさしいことを一つ挙げるとしたら何でしょうか。
aspects:
  relationshipsUpright: >-
    人間関係において、このカードは傷ついた気持ちを映しているのかもしれません。厳しい言葉、落胆、あるいはあなたと身近な人の間のつらい距離です。誰が悪いのかは語りません。それが何を意味するのかを決める前に、その気持ちに場所を与えてみましょう。準備ができたら、傷ついたことを落ち着いて伝え、相手の側の話にも耳を傾けることで、何が起きたのかを二人で理解する助けになります。
  relationshipsReversed: >-
    逆位置のソードの3は、人と人の間の傷がやわらぎ始めていることや、まだ内側で静かに抱えられている傷を示しているのかもしれません。謝罪ができるかもしれませんし、より健やかな一歩は、ただ受け入れることなのかもしれません。相手が関わるかどうかにかかわらず、心穏やかでいるために自分に何が必要かを問いかけてみましょう。許しは、訪れるとしても、それ自身の時を選んでやってきます。
  workUpright: >-
    仕事やプロジェクトにおいて、このカードは落胆を映しているのかもしれません。胸に刺さった厳しいフィードバック、まとまらなかった計画、本気の努力のあとのつまずきなどです。それを感じてかまいません。応じる前に少し間をとり、最初の波が過ぎてから、その中の役に立つ部分を探してみましょう。あなたの価値は、一つの結果よりもずっと大きいものです。
  workReversed: >-
    逆位置のこのカードは、仕事上のつまずきからの回復や、黙って抱えてきたもどかしさを示しているのかもしれません。昔の落胆が、いまも新しい作業への向き合い方を形づくっていないか気づいてみましょう。信頼できる同僚や指導者と一緒に、それに名前をつけてみることで、その力がゆるみ、新たなエネルギーで仕事に戻る助けになります。
  growthUpright: >-
    自己成長において、ソードの3は自分の痛みにやさしくする練習を促しています。悲しみは人間であることの一部であり、あなたに何か問題があるというしるしではありません。休息、体を動かすこと、なじみのある心地よさ、ありのままでいさせてくれる人など、気持ちが沈んだときに自分をいたわるシンプルな方法を探ってみましょう。
  growthReversed: >-
    逆位置のこのカードは、安心できるペースで、傷つくものを手放すことを学んでいることを映しているのかもしれません。文字どおりにも比喩的にも、どこで息を止めていたかに気づいてみましょう。ため息をつく、少し涙を流す、ジャーナルに正直な言葉を数行書くことは、小さな手放しの行いになりえます。回復がまっすぐな線を描くことはめったにありません。それでいいのです。
reflectionQuestions:
