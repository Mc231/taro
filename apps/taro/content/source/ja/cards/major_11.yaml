shortUpright: "物事を正直に量り、あとで説明するときにも胸を張れるような行動をとるとき。"
shortReversed: "何かのバランスが崩れていると感じられるのかもしれません。自分の役割も含めて、はっきり見つめてみませんか。"
meaningUpright: |-
  正義は片手に天秤を、もう片方の手に剣を持っています。天秤は物事を注意深く量ることを、剣は量り終えたあとに行動する明晰さを表しています。このカードは、公正さ、誠実さ、そして自分の選択に責任を持つことについてのカードです。行動には結果が伴うこと、そしてその行動は心を込めて選べることを理解するのです。
  日常では、このカードは、作業を公平に分担する、正直なフィードバックを伝える、間違いを認めて償うといった、冷静な頭を必要とする決断を映しているのかもしれません。応じる前に状況をあらゆる側面から見つめ、人に対してそうありたいと願うのと同じように、自分に対しても公正でいることを求められる瞬間を示していることもあります。
  このカードは、バランスのとれた応じ方とはどんなものかを考えてみるよう促しています。どの事実が重要なのか、関わる一人ひとりが何を必要としているのか、そして自分は何に責任を持てるのかを問いかけてみましょう。正義は、正式な手続きがどんな結末になるかを予測するものではありません。誠実さ、つまり自分が正しいと信じることに沿って行動し、その結果を落ち着いた心で受け止めることを照らし出しているのです。
meaningReversed: |-
  逆位置の正義は、何かが不公平だという感覚や、ある状況の天秤が傾いてしまっていることを映しているのかもしれません。自分の分以上を背負っていると感じたり、困難の中での自分の役割を見ないで済ませたくなる気持ちに気づいたりすることがあります。
  このカードは、自分を厳しく裁きすぎて、あらゆる選択を不可能な基準で量っていることを示している場合もあります。責任を持つことは役に立ちますが、絶え間ない自己批判はそれと同じではありません。
  公平な見方をする友人に説明するつもりで、状況をできるだけ中立的に書き出してみるとよいでしょう。何が自分の引き受けるべきもので、何がそうでないのでしょうか。公正さを求めることは、声を上げること、関係を修復すること、あるいは背負うには重くなりすぎた判断を手放すことなのかもしれません。
aspects:
  relationshipsUpright: >-
    人間関係において、正義はバランスと互いへの敬意を映しているのかもしれません。お互いが公平だと感じられる形で与え、受け取っている状態です。責任や気づかいがどのように分かち合われているかを、正直に見つめるよう促しています。期待についてのはっきりとしたやさしい会話は、信頼を強め、静かな不満がたまるのを防いでくれます。
  relationshipsReversed: >-
    逆位置のこのカードは、不均衡を示しているのかもしれません。たとえば、気持ちの面や実務の面で一方がより多くを担っていたり、責めが一方的に感じられる衝突があったりすることです。双方の視点から見て公正とはどんな姿か、そして謝罪やより明確な取り決めがバランスを取り戻す助けになるかを考えてみましょう。
  workUpright: >-
    仕事やプロジェクトにおいて、正義は誠実さ、公正な手続き、慎重な決断を照らしています。互いに期待していることを見直したり、バランスのとれたフィードバックを伝えたり、選択肢をその中身で比べたりすることを映しているのかもしれません。影響を受けるすべての人に、どの選択なら率直に説明しても心地よくいられるかを問いかけてみましょう。
  workReversed: >-
    逆位置の正義は、不公平な扱いや曖昧なルールへのいらだちを映しているのかもしれません。プレッシャーの下で手を抜いてしまうことを示している場合もあります。事実を落ち着いて書き留め、必要なら適切な支えを求め、自分の行動が人に求めたい基準に見合っているかを確かめてみましょう。
  growthUpright: >-
    自己成長において、このカードは自分の価値観に沿って生き、自分の選択に責任を持つよう促しています。厳しくなりすぎずに自分の行動の影響を振り返ることは、成長の助けになります。最近の決断を一つ取り上げて、何を続け、次は何を違うふうにするかを問いかけてみましょう。
  growthReversed: >-
    逆位置の正義は、他人に対してよりも、自分にずっと厳しい基準を課していないかを問いかけているのかもしれません。教訓はもう学んだのに、罪悪感が残り続けていることを映している場合もあります。うまくいかなかったことと、うまくいったことの両方に名前をつける、公正な自己評価を練習してみましょう。
reflectionQuestions:
  - "人に対しても自分に対しても、ここでの公正な応じ方とはどんなものでしょうか？"
  - "親しい関係の中で、責任のバランスを見直したほうがよさそうなのはどこですか？"
  - "今週、責任を持って引き受ける準備ができていることは何ですか？"
imageryNote: >-
  Taroの正義は、落ち着いて背筋を伸ばした人物として描かれ、胸の高さで釣り合った天秤を持ち、まっすぐ空に向けた刃を掲げています。人物は見る人をまっすぐに見つめ、何も隠していない誠実さを感じさせます。背後の二本の簡素な柱と飾りのないカーテンが場面をすっきりと保ち、慎重に考えるための場所をあけているかのようです。冷たい空色に一点だけ添えられたあたたかな色は、理性と良心の出会いを映しているのかもしれません。
