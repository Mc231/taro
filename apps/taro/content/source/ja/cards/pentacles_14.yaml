  - "どこで、時間や知識や思いやりを、もっと惜しみなく人と分かち合えそうですか？"
  - "外からどう見えるかを脇に置いたとき、あなたにとって成功とは何ですか？"
imageryNote: >-
  絵には、雄牛の模様が彫られた玉座に座り、ぶどうのつると城壁に囲まれた庭に包まれて、片手に硬貨をゆったりと休ませる、冠を戴いた人物が描かれているのかもしれません。雄牛は持久力と大地の強さを、ぶどうのつるは成熟と豊かさを、そして壁は守られ、よく手入れされた領域を象徴しているのかもしれません。くつろいだ姿勢は経験に根ざした権威を感じさせ、深い緑と金色が、長く続く辛抱強い備えを映しているのかもしれません。
