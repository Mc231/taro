shortUpright: >-
  揺るがない、頼れる存在があなたのそばにあります。経験と資源を使って、自分と人のための安定をどう生み出せるかに気づいてみましょう。
shortReversed: >-
  安心が、背負うには重いものになっているのかもしれません。コントロールや見た目を超えて、自分にとって成功とは何かを問いかけてみましょう。
meaningUpright: |-
  ペンタクルのキングは、ぶどうのつると頑丈な壁に囲まれ、ゆったりと安心した様子で座り、片ひざに硬貨を休ませています。このキングは地のスートが完全に成熟した姿を表しています。実際的なことの熟達、忍耐、そして人が頼れる安定したものを築く力です。ここでの権威は、力ではなく経験から生まれています。
  家庭やチームを落ち着いて切り盛りする人、時間や資源について思慮深い決断を下す人、築いてきたものを使って周りの人を支える人の中に、このエネルギーを見いだすかもしれません。実際的な責任をうまくこなしていく、あなた自身の育ちつつある自信を映している場合もあります。
  このカードは、安定と備えとの自分の関係を考えてみるよう促しています。着実な努力を通して何を築いてきて、それをどう使っているでしょうか。時間や知識や支えを惜しみなく差し出せるところと、よい管理とは持っているものを守ることを意味するところに気づいてみましょう。安心は、守るだけのものではなく、分かち合えるものにもなりえます。
meaningReversed: |-
  逆位置のペンタクルのキングは、硬直したり重くなったりした、安心との関係を映しているのかもしれません。コントロールが強まって、計画に人の意見が入る余地がなくなったり、成功が主に見た目や持ち物で測られたりすることがあります。皆の安定に責任を感じることのプレッシャーを示している場合もあります。
  ここでは、行き過ぎてしまった資質が示されています。頼りになり、有能であることは価値あるものです。それが重荷になるのは、休息や柔軟さ、人の選択のための余地を残さなくなったときです。
  見た目を超えて、自分にとって成功とは本当は何かを問いかけてみましょう。どこで責任を分かち合ったり、基準をゆるめたりできるでしょうか。思いやり、安心、貢献しているという感覚など、努力の背後にある価値観とふたたびつながることで、安定は窮屈なものではなく、ふたたび支えになるものに感じられるかもしれません。
aspects:
  relationshipsUpright: >-
    人間関係において、このカードは頼りになる惜しみない思いやりを映しているのかもしれません。安定をもたらし、約束を守り、人に安心を感じさせてくれる人です。あなたが誰かにとってその揺るがない存在なのかもしれませんし、相手のそういうところに感謝しているのかもしれません。決定を分かち合い、頼もしさと並んでぬくもりも表すことで、その安心は互いのものに感じられるようになります。
  relationshipsReversed: >-
    逆位置のカードは、人のための余地をほとんど残さないコントロールや、実際的な備えを重んじるあまり、気持ちのつながりがかすんでいることを示しているのかもしれません。身近な人があなたの支えをどう受け止めているか、そして関係の中でもっと意見を言いたいのか、もっとやさしさがほしいのかを尋ねてみましょう。
  workUpright: >-
    仕事において、ペンタクルのキングは実際的なリーダーシップと頼もしさを表しているのかもしれません。資源を管理し、人を導き、地に足のついた決断を下すことを任されているのかもしれません。後進を指導し、成果だけでなく人を支える仕組みを築くなど、経験を惜しみなく生かす方法を考えてみましょう。
  workReversed: >-
    ここでのカードは、柔軟さのなさ、細かすぎる管理、意味のある仕事よりも地位を重んじることを映しているのかもしれません。ひとりで責任を背負いすぎていることを示している場合もあります。どこで人に任せたり、もっと耳を傾けたり、成功を定義し直したりすれば、より健全で続けられる働き方が生まれるかを見てみましょう。
  growthUpright: >-
    自己成長において、このカードは自分が育んできた成熟と能力を認めるよう促しています。自分にとって安定とは何か、そしてそれをどう生み出してきたかを振り返ってみましょう。自分と人のために備えることのできる力を認めることで、自分への信頼が深まります。
  growthReversed: >-
    逆位置のカードは、コントロールや、外から見える達成の目印への強いこだわりを映しているのかもしれません。握る手をゆるめたら何が起こると恐れているのかを探ってみましょう。持っているものや管理しているものだけでなく、自分の価値観や人間関係の中に安心を見いだすことで、より大きなゆとりが生まれます。
reflectionQuestions:
