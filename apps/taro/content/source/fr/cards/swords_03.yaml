shortUpright: >-
  Un moment triste ou blessant demande peut-être à être ressenti plutôt qu’expliqué ; la tristesse peut être accueillie avec douceur.
shortReversed: >-
  Le plus vif d’une peine s’apaise peut-être ; vous pourriez remarquer ce qui vous aide à respirer un peu plus librement.
meaningUpright: |-
  Le Trois d’Épées parle de tristesse : la douleur d’une déception, d’une perte ou de mots qui ont frappé fort. Il ne dit pas combien de temps dure ce sentiment ni ce qui l’a causé. Il reconnaît simplement que certains moments font mal, et que cette peine est réelle.
  Vous reconnaîtrez peut-être cette carte dans une conversation bouleversante, une nouvelle qui a changé votre regard sur quelque chose, ou un chagrin qui revient lors d’un après-midi ordinaire. Elle peut aussi refléter la piqûre de comprendre une vérité que vous espériez fausse. Souvent, l’esprit veut analyser la peine, en trouver la raison et la régler vite.
  Cette carte vous invite doucement à laisser l’émotion être une émotion. La pluie tombe, puis elle passe ; la tristesse peut suivre un mouvement semblable quand on la laisse faire. Vous voudrez peut-être vous offrir de la bienveillance, du temps et la compagnie de personnes capables d’écouter sans vous presser. Si des émotions lourdes persistent, en parler à une personne de confiance ou à un professionnel qualifié peut aider. Que signifierait traiter votre propre tristesse comme vous traiteriez celle d’un ami ?
meaningReversed: |-
  Renversé, le Trois d’Épées peut refléter l’apaisement progressif d’une peine. L’orage s’éloigne peut-être, même si le sol est encore mouillé. Vous remarquerez peut-être le retour de petits moments de légèreté, ou la possibilité de parler de ce qui s’est passé avec un peu plus de stabilité.
  Une autre lecture est celle d’une tristesse tournée vers l’intérieur : une peine gardée serrée et non partagée, peut-être parce qu’elle semble trop intime ou parce que les autres paraissent attendre que vous alliez déjà mieux. Une peine gardée sous silence peut s’attarder plus longtemps que nécessaire.
  Cette carte vous invite à remarquer ce qui vous aide à lâcher prise, même un peu. Ce peut être l’écriture, du temps dehors, une conversation de confiance, ou simplement la permission d’être triste sans échéance. Il n’y a pas de bon rythme pour se remettre d’un moment douloureux. Quel geste doux pourriez-vous vous offrir aujourd’hui ?
aspects:
  relationshipsUpright: >-
    Dans les relations, cette carte peut refléter des sentiments blessés : une parole dure, une déception, ou une distance douloureuse entre vous et un proche. Elle ne dit pas qui est en tort. Vous pourriez laisser de la place à l’émotion avant de décider de ce qu’elle signifie. Quand le moment sera venu, partager la peine calmement et écouter le point de vue de l’autre personne peut vous aider tous les deux à comprendre ce qui s’est passé.
  relationshipsReversed: >-
    Renversé, le Trois d’Épées peut suggérer une peine qui commence à s’apaiser entre deux personnes, ou une peine encore gardée en silence. Des excuses sont peut-être possibles, ou peut-être que l’étape la plus saine est simplement l’acceptation. Vous pourriez vous demander de quoi vous avez besoin pour trouver la paix, que cela inclue l’autre personne ou non. Le pardon, s’il vient, peut arriver en son temps.
  workUpright: >-
    Au travail ou dans un projet, cette carte peut refléter une déception : une critique qui a piqué, un projet qui n’a pas abouti, ou un revers après un vrai effort. Il est normal de le ressentir. Vous pourriez vous accorder une pause avant de répondre, puis chercher la partie utile du message une fois la première vague passée. Votre valeur dépasse un seul résultat.
  workReversed: >-
    Renversé, cette carte peut désigner le fait de se remettre d’un revers professionnel, ou une frustration portée en silence. Vous pourriez remarquer si une ancienne déception influence encore votre façon d’aborder de nouvelles tâches. La nommer, peut-être avec un collègue ou un mentor de confiance, peut desserrer son emprise et vous aider à revenir à votre travail avec une énergie nouvelle.
  growthUpright: >-
    Pour l’épanouissement personnel, le Trois d’Épées vous invite à pratiquer la tendresse envers votre propre peine. La tristesse fait partie de l’expérience humaine ; elle n’est pas le signe que quelque chose ne va pas chez vous. Vous pourriez explorer des façons simples de prendre soin de vous quand le moral est bas : le repos, le mouvement, les réconforts familiers et les personnes qui vous laissent être comme vous êtes.
  growthReversed: >-
    Renversé, cette carte peut refléter l’apprentissage du relâchement de ce qui fait mal, à un rythme qui semble sûr. Vous pourriez remarquer où vous retenez votre souffle, au sens propre comme au sens figuré. Laisser échapper un soupir, quelques larmes ou quelques phrases sincères dans un journal peut être un petit acte de libération. Le rétablissement est rarement une ligne droite, et c’est normal.
