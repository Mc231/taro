imageryNote: >-
  L’illustration originale montre trois lames fines appuyées contre une pierre en forme de cœur, sous un ciel gris et bas. Une pluie douce tombe tout autour, et une faible éclaircie apparaît au bord des nuages. La pierre suggère le poids de la tristesse, tandis que la pluie évoque les larmes et la libération. La lumière lointaine laisse entendre que les orages passent, sans promettre quand.
