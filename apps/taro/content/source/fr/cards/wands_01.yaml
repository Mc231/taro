imageryNote: >-
  Un seul bâton vivant s’élève dans le cadre, fraîchement coupé mais portant encore de jeunes pousses vertes, comme si le bois ne pouvait pas s’arrêter de grandir. Une petite flamme ou une lueur se rassemble à son extrémité. La branche représente une force créative brute, encore vivante et sans forme définie, et les nouvelles feuilles suggèrent que l’inspiration grandit quand on en prend soin. Des rouges et des ors chauds peuvent porter l’élément feu, avec un ciel ouvert à l’arrière-plan pour évoquer un espace encore à explorer.
