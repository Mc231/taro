  workUpright: >-
    Au travail ou dans un projet créatif, l’As de Bâtons peut désigner une idée qui attire vraiment : une nouvelle approche, un projet parallèle, une proposition à laquelle vous revenez sans cesse. Vous pourriez lui donner une première forme tangible, comme un plan sommaire, un prototype ou une courte présentation à une personne de confiance, pour qu’elle puisse être testée au grand jour et pas seulement dans votre tête.
