imageryNote: >-
  L’illustration est centrée sur une seule coupe qui déborde, son eau tombant en plusieurs filets fins dans un bassin immobile en contrebas. Des nénuphars ou des feuilles de lotus à la surface peuvent représenter des émotions qui s’ouvrent lentement et prennent racine en profondeur. Une douce lumière au-dessus de la coupe peut suggérer la réceptivité, une offrande tendue plutôt qu’agrippée. L’ambiance générale est celle d’une abondance calme : plus qu’assez, qui se répand doucement vers l’extérieur.
