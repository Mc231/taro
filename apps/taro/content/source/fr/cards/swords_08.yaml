  relationshipsReversed: >-
    Renversé, le Huit d’Épées peut désigner une liberté nouvelle dans un lien : prendre enfin la parole, poser une limite, ou voir une dynamique familière d’un œil neuf. Vous pourriez remarquer où d’anciennes peurs tentent encore de vous faire taire. Pratiquer de petits actes d’honnêteté peut aider ce nouveau regard à s’installer durablement dans votre façon d’être en relation.
  workUpright: >-
