imageryNote: >-
  Dans l’illustration originale, une figure se tient sur un sol de marais meuble, à l’intérieur d’un cercle lâche de lames plantées dans la terre. Un ruban fin lui couvre les yeux et un autre est drapé sur ses poignets sans être noué. Derrière elle, le cercle est ouvert, et un chemin mène vers des collines lointaines. Les rubans suggèrent des limites qui peuvent se desserrer, et l’ouverture évoque des options pas encore vues.
