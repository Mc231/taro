  growthUpright: >-
    Pour l’épanouissement personnel, le Huit d’Épées vous invite à remarquer la voix intérieure qui dit que vous ne pouvez pas. Vous pourriez vous demander doucement où cette voix a appris ses règles. Questionner une croyance ne signifie pas vous forcer à dépasser chaque peur ; cela signifie vous autoriser à chercher l’ouverture dans le cercle.
