imageryNote: >-
  L’Empereur de Taro est imaginé assis à une solide table de pierre encastrée dans une colline, avec une carte, une règle de mesure et une lampe disposées avec soin. Des murets de pierre sèche qui traversent les champs derrière lui montrent des limites bâties à la main, pierre après pierre. Un bélier qui broute non loin peut faire signe au Bélier et à l’élan du commencement. Les rouges chauds suggèrent la vitalité, et un petit portail resté ouvert dans un muret laisse entendre que des structures fermes peuvent encore laisser passer les gens.
