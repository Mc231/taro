shortUpright: >-
  Ce que vous avez mis en mouvement commence à voyager ; vous pouvez guetter ce qui revient et préparer l’étape suivante.
shortReversed: >-
  Les progrès semblent peut-être plus lents qu’espéré ; c’est peut-être le moment d’ajuster vos attentes sans renoncer.
meaningUpright: |-
  Là où le Deux de Bâtons parlait de planification, le Trois de Bâtons montre des projets déjà en mouvement. Les navires ont quitté le port, pour ainsi dire : les messages sont envoyés, les candidatures déposées, les premiers pas faits. Vient maintenant un temps où l’on observe l’horizon pendant que les choses se déroulent au-delà de votre contrôle direct.
  Cette carte peut refléter la satisfaction des premiers progrès, comme un projet qui gagne ses premiers soutiens, une nouvelle habitude qui s’installe, ou une collaboration qui porte plus loin que prévu. Elle peut aussi mettre en lumière la valeur de la préparation : vous avez posé assez de bases pour pouvoir prendre du recul et regarder plus loin.
  L’invitation est de tenir deux choses à la fois : la confiance en ce que vous avez lancé et l’ouverture à la façon dont cela évolue. Vous pourriez remarquer où vos efforts commencent à rejoindre d’autres personnes, et réfléchir à ce que la prochaine étape pourrait vous demander. L’expansion demande souvent de nouvelles compétences, de nouveaux partenaires ou une vision un peu plus large de ce que vous construisez.
meaningReversed: |-
  Renversé, le Trois de Bâtons peut refléter une attente devenue agitation. Vous avez peut-être fait le travail sans voir grand-chose revenir, ou les résultats ne ressemblent pas à ce que vous imaginiez. Il est facile de prendre la lenteur pour un échec, même quand les choses prennent simplement leur temps.
  Parfois, cette carte désigne aussi une vision étroite : se concentrer sur un seul résultat en passant à côté des petits signes de mouvement autour de vous, ou planifier si loin que le présent paraît vide.
  C’est peut-être le bon moment pour regarder vos attentes. Vos délais étaient-ils réalistes ? Vous manque-t-il une information, ou une personne à qui vous n’avez pas encore demandé de l’aide ? Vous pourriez ajuster le projet sans l’abandonner, et prendre note des progrès qui ont déjà eu lieu discrètement.
aspects:
  relationshipsUpright: >-
    Dans les liens proches, cette carte peut refléter une relation qui grandit au-delà de son premier chapitre, avec plus de confiance, de nouveaux projets communs ou une ouverture à d’autres personnes. Elle peut vous inviter à apprécier le chemin parcouru ensemble et à parler de la direction que vous aimeriez prendre ensuite, tout en laissant de la place à l’horizon propre à chacun.
  relationshipsReversed: >-
    Renversée, cette carte peut refléter le sentiment d’attendre que quelqu’un fasse sa part du chemin, ou qu’une relation n’évolue pas au rythme espéré. Il peut être utile de partager vos attentes ouvertement au lieu de mesurer les progrès en silence. Vous pourriez aussi demander à l’autre personne ce qu’elle espère, car vos rythmes sont peut-être simplement différents.
  workUpright: >-
    Au travail ou dans les études, le Trois de Bâtons peut désigner des projets qui gagnent en portée : un lancement, une démarche vers l’extérieur, une collaboration entre équipes ou entre lieux. Vous pourriez réfléchir à la manière de soutenir cet élan, en relançant, en élargissant votre réseau ou en préparant la phase suivante avant qu’elle n’arrive, pour que vos propres progrès ne vous prennent pas de court.
  workReversed: >-
    Carte renversée, les résultats tardent peut-être à venir, ou un projet a rencontré des retards indépendants de votre volonté. Sans pousser plus fort dans la même direction, vous pourriez revoir ce que vous avez appris jusqu’ici et ajuster l’itinéraire. Faire le point avec les personnes concernées peut révéler des obstacles, ou des réussites discrètes, faciles à manquer depuis votre position.
  growthUpright: >-
    Faire confiance aux efforts déjà fournis est une forme discrète d’épanouissement. La croissance continue souvent hors de vue après les premiers pas. Vous pourriez regarder où vous en étiez il y a quelques mois et remarquer ce qui a changé, puis choisir ce que vous aimeriez explorer ensuite avec ce regard plus large.
  growthReversed: >-
    Carte renversée, l’impatience envers vous-même voile peut-être la vue sur des progrès bien réels. Vous pourriez repérer où vous attendez un changement immédiat et où un rythme plus lent serait plus doux. Garder une simple trace des petits pas peut rendre la croissance plus visible quand l’horizon semble encore vide.
