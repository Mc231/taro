meaningUpright: |-
  Le Six de Bâtons est une carte de reconnaissance. Après la friction du Cinq, une personne s’avance à cheval avec une couronne de feuilles sur son bâton, et les gens sur son passage semblent l’acclamer. Il saisit le moment où l’effort devient visible et où les autres le reconnaissent.
  Cela peut ressembler à un retour positif sur un travail dans lequel vous avez mis beaucoup de vous-même, à un ami qui vous dit qu’il admire la façon dont vous avez géré quelque chose, ou à la réussite d’un défi que vous doutiez autrefois de pouvoir relever. Ce peut aussi être une confiance plus discrète : se tenir un peu plus droit parce que l’on sait avoir bien fait.
  Cette carte vous invite à accepter l’appréciation sans la balayer d’un revers de main. La reconnaissance peut donner de l’énergie et du courage pour l’étape suivante. En même temps, la figure est entourée de monde, ce qui rappelle que peu de réussites sont entièrement solitaires. Vous pourriez savourer le moment tout en pensant aux personnes qui vous ont apporté leur soutien, et à la façon de partager une part du mérite.
meaningReversed: |-
  Renversé, le Six de Bâtons peut refléter des efforts passés inaperçus, ou des éloges qui ne vous atteignent pas vraiment. Vous avez peut-être réalisé quelque chose tout en ayant l’impression que cela ne compte pas tant que quelqu’un d’autre ne l’a pas dit. Il peut aussi désigner la fatigue d’afficher une assurance que vous ne ressentez pas entièrement.
  Parfois, cette carte renversée décrit une réussite discrète, importante pour vous même si elle reste invisible aux autres. Ce type de progrès compte aussi.
  C’est peut-être le moment de regarder à quel point votre sentiment de valeur dépend des applaudissements. Que se passerait-il si vous reconnaissiez d’abord vous-même vos efforts ? Vous pourriez noter ce qui vous inspire de la fierté, y compris ce que personne d’autre n’a vu, et en faire une source d’encouragement plus stable que l’approbation extérieure.
aspects:
  relationshipsUpright: >-
    Dans les relations, cette carte peut refléter une appréciation qui circule dans les deux sens : ressentir de la fierté pour un proche, ou recevoir son regard et son soutien. Elle peut vous inviter à célébrer à voix haute les réussites de chacun. Vous pourriez dire à un ami, à un partenaire ou à un membre de votre famille ce que vous admirez chez lui, et vous laisser recevoir ses encouragements en retour.
  relationshipsReversed: >-
    Renversée, cette carte peut refléter le sentiment que vos efforts dans une relation passent inaperçus, ou que la reconnaissance est devenue une compétition silencieuse. Vous pourriez dire clairement quel type d’appréciation compte pour vous, et poser la même question à l’autre personne. Un merci simple et concret change souvent l’ambiance davantage qu’un grand geste.
  workUpright: >-
    Au travail ou dans les études, le Six de Bâtons peut désigner des résultats visibles : un retour positif, un projet bien accueilli, l’occasion de présenter ce que vous avez fait. Vous pourriez utiliser cette confiance pour partager vos idées plus ouvertement, tout en reconnaissant les personnes qui y ont contribué. Une reconnaissance partagée avec générosité renforce souvent les équipes.
  workReversed: >-
    Carte renversée, vos contributions semblent peut-être négligées, ou la réussite dépend trop de l’apparence extérieure. Vous pourriez rendre votre travail plus visible de façon calme et factuelle, par exemple avec un court résumé de ce que vous avez livré, et réfléchir aussi aux résultats qui comptent pour vous, que quelqu’un les remarque ou non.
  growthUpright: >-
    Pour l’épanouissement personnel, cette carte vous invite à vous autoriser à ressentir de la fierté. Reconnaître vos progrès peut construire une confiance qui vous accompagnera dans le défi suivant. Vous pourriez garder une courte liste de ce que vous avez bien géré récemment, à relire les jours où votre confiance semble plus mince.
  growthReversed: >-
    Carte renversée, le doute de soi ou le besoin d’approbation atténuent peut-être votre sentiment d’accomplissement. Vous pourriez explorer d’où vient votre idée de la réussite et si elle vous correspond encore. Définir la réussite avec vos propres mots peut faire de la reconnaissance des autres un agréable bonus, et non quelque chose dont vous dépendez.
reflectionQuestions:
  - >-
    Qu’avez-vous accompli récemment sans l’avoir pleinement reconnu ?
  - >-
    Qui vous a apporté de l’aide en chemin, et comment pourriez-vous partager le mérite avec cette personne ?
  - >-
    À quoi ressemblerait la réussite si personne d’autre ne regardait ?
imageryNote: >-
  Une personne à cheval, sur une monture calme, traverse une petite foule en tenant un bâton couronné d’une guirlande de feuilles. D’autres bâtons levés bordent le chemin comme une haie d’honneur. La couronne représente une reconnaissance gagnée par l’effort, le cheval tranquille une confiance acquise par l’entraînement et non par la précipitation, et les figures qui l’entourent la communauté qui partage et soutient la réussite.
