shortUpright: >-
  Un moment pour remarquer où l’attention circule dans les deux sens, et ce qui rend un lien équilibré et vivant.
shortReversed: >-
  Quelque chose entre vous et une autre personne semble peut-être déséquilibré ; que demande vraiment chacun de vous ?
meaningUpright: |-
  Le Deux de Coupes montre deux personnes, ou deux parts d’une vie, qui se rencontrent d’égal à égal et s’offrent quelque chose. C’est une carte de reconnaissance mutuelle : le soulagement de trouver de la compréhension, et le plaisir de comprendre quelqu’un en retour. Le lien qu’elle décrit peut être amoureux, mais il peut tout aussi bien s’agir d’une amitié, d’une collaboration créative, d’un lien fraternel ou d’un partenariat professionnel.
  Vous reconnaîtrez peut-être cette énergie dans une conversation où chacun écoute, dans une réconciliation après un malentendu, ou dans l’accord tranquille de deux personnes qui choisissent de continuer à être là l’une pour l’autre. Cette carte peut aussi refléter le rapprochement de deux facettes de vous qui tiraient dans des directions différentes.
  Cette carte vous invite à remarquer où il y a un véritable échange dans votre vie, et à l’honorer. La réciprocité ne consiste pas à tenir des comptes. Elle signifie que chacun se sent libre d’offrir, de recevoir et de dire ce dont il a besoin.
meaningReversed: |-
  Renversé, le Deux de Coupes peut désigner un lien qui a perdu son équilibre. Une personne donne peut-être davantage, ou écoute moins, ou deux personnes ne font simplement que se parler sans se rejoindre. Cela ne veut pas forcément dire que quelque chose est cassé ; beaucoup de liens traversent de telles saisons.
  La carte peut aussi se tourner vers l’intérieur et demander dans quelle mesure vous savez vous accompagner vous-même. Faites-vous preuve d’autant de patience et d’équité envers vos propres besoins qu’envers ceux de quelqu’un d’autre ?
  Vous pourriez regarder une relation qui semble déséquilibrée et vous demander ce que chacun espère vraiment, sous le désaccord apparent. Une conversation calme et sincère, ou un peu de distance pour y voir plus clair, peut être plus utile que de vouloir tout régler d’un coup. L’équilibre se construit à deux, un échange après l’autre.
aspects:
  relationshipsUpright: >-
    Dans les relations, cette carte peut refléter une attirance mutuelle, une amitié ou un partenariat où chacun se sent vu. Elle peut vous inviter à remarquer les petits rituels qui gardent un lien stable : prendre des nouvelles, se souvenir de ce qui compte pour l’autre, s’excuser simplement. Vous pourriez vous demander ce que vous appréciez le plus chez un proche, et si cette personne le sait.
  relationshipsReversed: >-
    Renversée, cette carte peut refléter un lien où une personne porte davantage le poids émotionnel, ou un malentendu qui n’a pas été dissipé. Vous pourriez vous demander ce que vous diriez si vous saviez que cela serait accueilli avec bienveillance. La réparation commence souvent par une phrase sincère et la volonté d’entendre la réponse sans se défendre tout de suite.
  workUpright: >-
    Au travail, le Deux de Coupes peut désigner une collaboration prometteuse, un collègue de confiance ou une relation client fondée sur le respect. Il peut vous inviter à partager le mérite, à demander des avis et à formuler des accords assez clairs pour que chaque partie se sente en sécurité. Les bons partenariats naissent souvent de valeurs communes davantage que de compétences communes.
  workReversed: >-
    Renversé, le Deux de Coupes peut refléter une relation de travail où les attentes sont non dites ou inégales. Une personne suppose peut-être un accord là où il n’y en a pas. Vous pourriez nommer ce que chacun attend, avec des mots simples, et vérifier si vos rôles vous conviennent encore. La clarté peut être une forme de bienveillance, même quand la conversation semble gênante au début.
  growthUpright: >-
    L’alliance intérieure est ici le thème de l’épanouissement, une occasion de réconcilier des parts de vous-même : ce que vous voulez et ce à quoi vous tenez, ou votre côté pratique et votre côté tendre. Vous pourriez écrire un court dialogue entre deux voix intérieures et voir sur quoi elles s’accordent déjà. L’intégration peut ressembler à la découverte d’un soutien en soi.
  growthReversed: >-
    Renversé, le Deux de Coupes peut demander si vous comptez sur les autres pour un équilibre que vous pourriez aussi construire en vous. Vous pourriez remarquer où vous cherchez l’approbation avant de faire confiance à votre propre regard. Vous traiter avec la même équité que celle que vous offrez à un ami proche peut être une pratique apaisante, un petit choix à la fois.
