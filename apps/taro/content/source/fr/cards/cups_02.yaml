imageryNote: >-
  L’illustration réunit deux figures, ou deux mains, qui lèvent chacune une coupe vers l’autre par-dessus un petit espace. Entre elles, un emblème partagé, comme des tiges entrelacées ou deux poissons, peut suggérer que la rencontre crée quelque chose qu’aucune ne possède seule. Des couleurs en miroir de chaque côté peuvent exprimer l’égalité, avec une douce lueur là où les coupes se touchent presque, comme si le lien lui-même rayonnait.
