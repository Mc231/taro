shortUpright: >-
  Une phase se termine peut-être. Cette carte vous invite à remarquer ce qui s’achève et l’espace que cela laisse.
shortReversed: >-
  Quelque chose est peut-être prêt à finir alors qu’une part de vous s’y accroche. Qu’est-ce qui vous aiderait à desserrer l’étreinte ?
meaningUpright: |-
  Malgré son nom, cette carte ne parle pas de la mort physique. Elle évoque les fins au sens ordinaire et humain : la clôture d’une phase, d’un rôle, d’une habitude ou d’une manière de se voir. Comme l’automne qui dégarnit les branches avant une nouvelle pousse, elle suggère que certaines choses doivent se terminer pour que d’autres puissent commencer.
  Dans la vie de tous les jours, cette carte peut refléter un déménagement, la fin d’une formation, le fait de se retirer d’un projet, ou le constat qu’une ancienne version de vous ne vous correspond plus. Elle peut apporter un mélange d’émotions : soulagement, tristesse, incertitude, voire enthousiasme. Toutes sont naturelles. Une transformation est rarement nette, et il faut souvent du temps pour comprendre ce qu’un changement a rendu possible.
  Cette carte vous invite à regarder ce qui est prêt à être relâché. Vous pourriez vous demander ce que vous portez encore par habitude, et quel espace pourrait s’ouvrir si vous le posiez. La Mort rappelle que les fins, même bienvenues, méritent d’être reconnues. Honorer ce qui a été peut aider à se tourner vers ce qui pourrait suivre.
meaningReversed: |-
  Renversée, la Mort peut refléter une fin qui prend son temps. Vous sentez peut-être qu’une phase est terminée tout en vous y accrochant encore, parce que le familier semble plus sûr que l’inconnu, ou parce que lâcher prise ressemble à perdre une part de vous-même.
  Cette carte peut aussi désigner une transition qui se fait lentement et discrètement, sous la surface, et non en un moment clair. Tous les changements n’arrivent pas avec une coupure nette.
  Vous pourriez remarquer ce à quoi vous vous cramponnez et ce que cela protège. De petits rituels de clôture, comme écrire une lettre d’adieu que vous n’enverrez pas, vider un tiroir ou marquer un dernier jour, peuvent aider. Rien ne presse. Vous autoriser à faire le deuil de ce qui se termine peut rendre la libération plus douce.
aspects:
  relationshipsUpright: >-
    Dans les relations, cette carte peut refléter un changement important dans le fonctionnement d’un lien : une nouvelle étape, un changement de rôles, ou la fin d’un schéma qui n’aidait plus personne. Elle ne dit rien du bien-être physique de qui que ce soit. Elle peut vous inviter à reconnaître ensemble ce qui change, avec honnêteté et attention.
  relationshipsReversed: >-
    Renversée, cette carte peut désigner l’attachement à une ancienne dynamique devenue trop petite pour les deux personnes, ou la difficulté d’accepter qu’un lien a changé. Vous pourriez vous demander de quoi vous auriez besoin pour laisser la relation prendre sa nouvelle forme, quelle qu’elle soit.
  workUpright: >-
    Au travail ou dans un projet, la Mort met en avant l’achèvement et la transition. Elle peut refléter la fin d’un rôle, la clôture d’un projet ou l’abandon d’une façon de travailler qui a fait son temps. Vous pourriez faire le point sur ce que vous avez appris et sur ce que vous voulez emporter dans le prochain chapitre.
  workReversed: >-
    Renversée, la Mort peut refléter le fait de rester par habitude dans une tâche, un rôle ou une méthode qui ne convient plus. Elle peut aussi désigner la peur de ce qui viendra après. Vous pourriez lister ce que la situation actuelle vous apporte encore et ce qu’elle vous coûte, et remarquer ce que ce bilan vous dit.
  growthUpright: >-
    Les anciennes identités peuvent tomber comme des feuilles, laissant de la place à ce qui est encore en train de se former. Vous pourriez remarquer des croyances sur vous-même qui étaient vraies autrefois mais ne le sont plus. Les relâcher peut créer de l’espace pour une version de vous plus fidèle à la personne que vous devenez.
  growthReversed: >-
    Renversée, la Mort peut demander si la peur du changement vous maintient dans un espace plus petit que celui dont vous avez besoin. Elle peut refléter une transformation lente et patiente qui mérite votre confiance. Vous pourriez choisir une petite chose à laisser partir cette semaine et remarquer ce que vous ressentez ensuite.
