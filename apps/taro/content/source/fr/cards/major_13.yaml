imageryNote: >-
  La Mort de Taro est imaginée comme un paysage d’automne paisible où une rivière lente emporte des feuilles mortes vers un soleil qui se lève à l’horizon. Une figure encapuchonnée et sans hâte marche le long de l’eau, portant une seule gousse de graines ou une branche nue, symboles de ce qui finit et de ce qui attend de pousser. Une fleur blanche sur un fond sombre peut suggérer le renouveau au sein même de la libération. L’ambiance est calme et respectueuse, et parle de transformation, non de perte.
