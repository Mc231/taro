meaningUpright: |-
  L’Ermite marche sur un sentier de montagne, une lanterne à la main qui n’éclaire que les quelques pas suivants. Cette carte parle de prendre du recul face au bruit pour chercher vos propres réponses. L’Ermite n’est pas tant isolé que guidé par un but : le retrait a une raison, et la lumière est portée, pas attendue.
  Dans la vie de tous les jours, cette carte peut refléter le choix d’une soirée calme, loin de l’agitation, une promenade en solitaire pour réfléchir à une décision, ou du temps passé avec un livre, un carnet ou un ouvrage manuel qui demande de la concentration. Elle peut désigner une période où vous réévaluez vos priorités, où l’avis des autres compte moins que votre propre sentiment, encore en formation, de ce qui est vrai pour vous.
  Cette carte vous invite à regarder ce que vous cherchez et si vous vous accordez assez d’espace pour le trouver. Vous pourriez vous demander quelle question vous emporteriez lors d’une longue marche. L’Ermite suggère que la sagesse arrive souvent par petites lueurs régulières, comme une lanterne qui montre le chemin un pas à la fois, et que cela suffit pour continuer.
meaningReversed: |-
  Renversé, l’Ermite peut refléter une solitude qui dure plus longtemps qu’elle n’aide. Le temps passé à l’écart peut glisser peu à peu vers le retrait, où tendre la main devient chaque jour plus difficile. Vous remarquerez peut-être que vos pensées tournent en rond au lieu d’avancer vers quelque chose.
  Cette carte peut aussi désigner l’inverse : remplir ses journées et s’entourer au point qu’il ne reste plus aucune place pour la réflexion. Éviter le silence peut être une façon d’éviter une question que vous ne vous sentez pas encore en mesure d’affronter.
  Vous pourriez regarder quel côté vous semble le plus proche. Si vous avez passé beaucoup de temps à l’écart, quelle petite façon, confortable, vous permettrait de renouer avec quelqu’un ? Si vous avez évité le calme, que pourriez-vous apprendre de dix minutes passées avec vos pensées ? La lanterne est toujours à vous de la lever.
aspects:
  relationshipsUpright: >-
    Dans les relations, l’Ermite peut refléter un besoin d’espace pour réfléchir, et la valeur des personnes qui respectent ce besoin. Il peut vous inviter à expliquer doucement que prendre du recul relève de la réflexion, et non du rejet. Le temps passé à l’écart peut vous aider à revenir vers les autres avec plus de clarté sur ce que vous voulez et pouvez offrir.
  relationshipsReversed: >-
    Renversée, cette carte peut désigner un retrait que les autres ressentent comme de la distance, ou une solitude dont vous n’avez pas parlé. Vous pourriez vous demander si vous attendez que quelqu’un d’autre fasse le premier pas. Un message court et sincère peut rouvrir une porte, même si vous avez encore besoin d’un peu de calme ensuite.
  workUpright: >-
    Au travail ou dans les études, l’Ermite met en avant un travail profond et concentré, et une pensée indépendante. C’est peut-être un bon moment pour la recherche, l’écriture, la planification ou l’apprentissage approfondi d’un sujet. Vous pourriez protéger un temps sans interruption et remarquer les idées qui viennent quand vous ne répondez pas sans cesse aux autres.
  workReversed: >-
    Renversé, l’Ermite peut refléter un travail mené trop longtemps dans l’isolement, ou un manque de retours qui pourraient aider. Il peut aussi désigner le fait de trop réfléchir à une décision. Vous pourriez demander un regard neuf à un collègue ou à un mentor de confiance, et remarquer combien partager vos idées peut les affiner.
  growthUpright: >-
    Pour l’épanouissement personnel, cette carte invite à une pratique de la solitude et de l’introspection. Écrire, marcher ou simplement rester tranquillement avec une question peut vous aider à mieux vous comprendre. Vous pourriez voir votre propre lanterne comme une prise de conscience récente, et la laisser éclairer votre prochain pas.
  growthReversed: >-
    Renversé, l’Ermite peut demander si vous vous cachez de vous-même ou des autres. Il peut refléter un besoin d’équilibrer la réflexion et le lien. Vous pourriez prévoir un petit rituel calme et un petit moment avec d’autres cette semaine, et remarquer ce que chacun vous fait ressentir. L’équilibre est ici personnel ; c’est à vous seulement de sentir le bon dosage.
reflectionQuestions:
  - >-
    Quelle question emporteriez-vous lors d’une longue marche tranquille ?
  - >-
    Qui respecte votre besoin d’espace, et comment pourriez-vous lui dire que vous y tenez ?
  - >-
    Où pourriez-vous protéger une heure sans interruption pour vous cette semaine ?
imageryNote: >-
  L’Ermite de Taro est imaginé comme une figure encapuchonnée sur une haute crête enneigée au crépuscule, tenant une simple lanterne qui n’éclaire que les quelques pas suivants du chemin. Un bâton de marche poli par l’usage suggère un soutien puisé dans l’expérience. Des traces de pas dans la neige montrent le chemin déjà parcouru. Les bleus et les gris froids parlent de solitude et d’air pur, tandis que la lueur chaude de la lanterne montre qu’une prise de conscience peut être portée jusque dans le passage le plus sombre de la route.
