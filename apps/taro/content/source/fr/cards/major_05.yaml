imageryNote: >-
  Le Hiérophant de Taro est imaginé comme un enseignant dans une cour paisible, assis sur un banc de pierre usé sous un vieil arbre, entouré d’un petit cercle d’auditeurs de tous âges. Une lourde clé pend à sa ceinture, symbole d’une compréhension transmise par l’étude et la pratique. Des livres empilés sur le banc et une cloche dans l’arche au-dessus suggèrent le rituel partagé et l’apprentissage. Un portail ouvert au fond de la cour laisse entendre que tout enseignement peut mener vers du nouveau.
