imageryNote: >-
  La Justice de Taro est imaginée comme une figure posée et droite, tenant une balance en équilibre à hauteur du cœur et une lame dressée vers le ciel. Elle regarde droit vers le spectateur, ce qui suggère une honnêteté sans rien de caché. Deux colonnes simples et un rideau uni à l’arrière-plan gardent la scène dépouillée, comme pour faire de la place à une réflexion attentive. Des bleus aériens et froids et une seule touche chaude peuvent refléter la rencontre de la raison et de la conscience.
