meaningUpright: |-
  La Justice tient une balance d’une main et une épée de l’autre. La balance représente le fait de peser les choses avec soin ; l’épée, la clarté nécessaire pour agir une fois la pesée faite. Cette carte parle d’équité, d’honnêteté et de responsabilité envers vos choix, en comprenant que les actes ont des conséquences et que vous pouvez les choisir avec soin.
  Dans la vie de tous les jours, cette carte peut refléter une décision qui demande la tête claire, comme répartir équitablement les tâches, donner un retour honnête, ou reconnaître une erreur et la réparer. Elle peut désigner des moments où l’on vous demande d’examiner une situation sous tous ses angles avant de répondre, et d’être aussi juste envers vous-même que vous essayez de l’être envers les autres.
  Cette carte vous invite à regarder à quoi ressemblerait une réponse équilibrée. Vous pourriez vous demander quels faits comptent, de quoi chaque personne concernée a besoin, et ce dont vous pouvez assumer la responsabilité. La Justice ne prédit pas l’issue d’une démarche officielle. Elle met en lumière l’intégrité : agir en accord avec ce que vous croyez juste, et accueillir la suite avec un esprit serein.
meaningReversed: |-
  Renversée, la Justice peut refléter le sentiment que quelque chose est injuste, ou que la balance d’une situation a penché. Vous avez peut-être l’impression de porter plus que votre part, ou vous remarquez la tentation d’éviter de regarder votre propre rôle dans une difficulté.
  Cette carte peut aussi désigner le fait de vous juger trop sévèrement, en mesurant chaque choix à une exigence impossible. Assumer ses responsabilités est utile ; l’autocritique permanente est autre chose.
  Vous pourriez écrire la situation aussi neutrement que possible, comme si vous l’expliquiez à un ami à l’esprit juste. Qu’est-ce qui vous revient, et qu’est-ce qui ne vous revient pas ? Chercher l’équité peut vouloir dire prendre la parole, réparer quelque chose, ou simplement laisser partir un jugement devenu lourd à porter.
aspects:
  relationshipsUpright: >-
    Dans les relations, la Justice peut refléter l’équilibre et le respect mutuel : chacun donne et reçoit d’une manière qui semble équitable. Elle peut vous inviter à regarder honnêtement comment les responsabilités et l’attention sont partagées. Des conversations claires et bienveillantes sur les attentes peuvent renforcer la confiance et éviter les rancœurs silencieuses.
  relationshipsReversed: >-
    Renversée, cette carte peut désigner un déséquilibre, comme une personne qui assume davantage la charge émotionnelle ou pratique, ou un conflit où le reproche semble à sens unique. Vous pourriez vous demander à quoi ressemblerait l’équité des deux points de vue, et si des excuses ou un accord plus clair pourraient rétablir l’équilibre.
  workUpright: >-
    Au travail ou dans un projet, la Justice met en avant l’intégrité, des processus équitables et des décisions réfléchies. Elle peut refléter le fait de revoir les attentes de chacun, de donner un retour équilibré ou de peser des options sur leurs mérites. Vous pourriez vous demander quel choix vous seriez à l’aise d’expliquer ouvertement à toutes les personnes concernées.
  workReversed: >-
    Renversée, la Justice peut refléter une frustration face à un traitement injuste ou à des règles floues. Elle peut aussi désigner la tentation de bâcler certaines étapes sous la pression. Vous pourriez noter les faits calmement, chercher un soutien approprié si nécessaire, et vérifier que vos propres actes correspondent à l’exigence que vous aimeriez voir chez les autres.
  growthUpright: >-
    Pour l’épanouissement personnel, cette carte vous invite à vivre selon vos valeurs et à assumer vos choix. Réfléchir aux effets de vos actes, sans dureté, peut vous aider à grandir. Vous pourriez regarder une décision récente et vous demander ce que vous garderiez, et ce que vous pourriez faire autrement la prochaine fois.
  growthReversed: >-
    Renversée, la Justice peut demander si vous vous imposez une exigence bien plus stricte que celle que vous attendez des autres. Elle peut refléter une culpabilité qui persiste alors que la leçon a déjà été apprise. Vous pourriez vous exercer à une évaluation juste de vous-même : nommer à la fois ce qui n’a pas fonctionné et ce qui a fonctionné.
