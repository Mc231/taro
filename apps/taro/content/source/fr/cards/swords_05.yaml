imageryNote: >-
  L’illustration originale montre un rivage balayé par le vent sous des nuages déchirés qui filent vite. Une figure tient mollement trois lames en regardant en arrière, tandis que deux autres lames gisent sur le sable. Deux autres figures s’éloignent vers l’eau. Les lames éparpillées suggèrent des disputes non résolues, et les dos tournés évoquent la distance créée par le conflit. Le ciel agité reflète un esprit encore remué alors que les mots se sont tus.
