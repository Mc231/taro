  relationshipsReversed: >-
    Renversée, cette carte peut refléter une tension dans un groupe, ou un sentiment de mise à l’écart. Elle peut aussi désigner une influence extérieure sur un lien, quelle que soit sa forme. Au lieu de deviner, vous pourriez demander simplement où en sont les choses. Il peut aussi être utile de passer du temps avec des personnes auprès desquelles vous n’avez pas à jouer un rôle ni à suivre le rythme.
  workUpright: >-
