imageryNote: >-
  Quatre bâtons dressés sont reliés par une guirlande de feuilles, de fleurs et de rubans, formant un portail ouvert. Au-delà, des figures se rassemblent les mains levées, et une maison simple ou une ville entourée de remparts se dessine au loin. Le cadre de quatre suggère des fondations stables bâties par l’effort, la guirlande une récolte de joie partagée, et le portail ouvert un accueil qui invite les autres à entrer au lieu de les tenir à distance.
