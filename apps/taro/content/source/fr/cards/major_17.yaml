imageryNote: >-
  L’Étoile de Taro est imaginée comme une scène nocturne dans un jardin sur un toit, où une figure arrose de jeunes plantes avec une cruche tandis qu’une étoile brillante perce une trouée dans les nuages. Des tonneaux de pluie et un petit bassin recueillent ce que le ciel rend. Des papillons de nuit qui tournent autour d’une lanterne peuvent représenter des pensées attirées par la lumière. Les bleus froids et les tons argentés créent une impression de calme, d’ouverture et de doux renouveau après le passage d’une tempête.
