shortUpright: >-
  Après une période difficile, un espoir plus calme revient peut-être. Cette carte vous invite à le laisser entrer.
shortReversed: >-
  L’espoir semble peut-être lointain en ce moment. De petites choses régulières pourraient vous aider à retrouver son chemin.
meaningUpright: |-
  L’Étoile est une carte d’espoir et de renouveau. Elle suit souvent le bouleversement de la Tour dans la séquence, et son ambiance est celle du calme après la tempête : un ciel nocturne dégagé, une eau fraîche, un moment où vous pouvez enfin expirer. Ici, l’espoir n’est pas un optimisme bruyant. C’est une confiance tranquille dans le fait que les choses peuvent s’améliorer et que vous avez quelque chose de précieux à offrir.
  Dans la vie de tous les jours, cette carte peut refléter un sentiment de légèreté après une période difficile, des retrouvailles avec un rêve créatif, ou de petits signes de progrès qui vous rappellent pourquoi vous avez commencé. Elle peut désigner des moments d’ouverture, où vous pouvez partager vos idées ou vos émotions sans armure, et le pouvoir simple et réparateur du repos, de la nature et du temps.
  Cette carte vous invite à regarder ce qui vous donne de l’espoir en ce moment, même un peu. Vous pourriez vous demander ce que vous aimeriez renouveler dans votre vie, et ce qui vous aide à vous ressourcer. L’Étoile met en lumière la générosité, envers les autres comme envers vous-même. Elle suggère de mettre votre énergie dans ce qui vous nourrit, et de laisser le reste se déposer.
meaningReversed: |-
  Renversée, l’Étoile peut refléter une période où l’espoir semble plus pâle. La fatigue ou le découragement sont peut-être là, ou le doute sur l’importance de vos efforts. La lumière ne s’est pas éteinte, mais elle est peut-être plus difficile à voir à travers les nuages.
  Cette carte peut aussi désigner une déconnexion de ce qui vous inspire d’habitude, peut-être parce que vous avez tant donné qu’il reste peu de place pour vos propres rêves.
  Vous pourriez chercher de petites sources de renouveau : une promenade sous un ciel ouvert, une conversation avec quelqu’un qui croit en vous, le retour à un plaisir simple. L’espoir revient souvent par petites touches, et non d’un seul coup. Si la lourdeur persiste, vous tourner vers une personne de confiance ou un professionnel qualifié peut être un geste de soin envers vous-même.
aspects:
  relationshipsUpright: >-
    Dans les relations, l’Étoile peut refléter l’ouverture, la sincérité et une confiance retrouvée. Elle peut vous inviter à partager vos espoirs avec un proche, ou à encourager quelqu’un qui en a besoin. Un lien qui a traversé une période difficile peut sembler plus calme et plus porteur d’espoir aujourd’hui.
  relationshipsReversed: >-
    Renversée, cette carte peut désigner le sentiment que l’on ne vous voit pas, ou un découragement dans une relation, ou le fait de retenir vos vrais sentiments par peur qu’ils ne soient pas bien accueillis. Vous pourriez vous demander ce qui vous aiderait à vous ouvrir en vous sentant plus en sécurité, et si un petit geste sincère pourrait reconstruire un peu de confiance.
  workUpright: >-
    Au travail ou dans un projet, l’Étoile met en avant l’inspiration et le sens. Elle peut refléter des retrouvailles avec les raisons pour lesquelles vous faites ce que vous faites, ou une énergie nouvelle après un revers. Vous pourriez consacrer du temps à un objectif à long terme ou à une idée créative qui vous donne de l’espoir.
  workReversed: >-
    Renversée, l’Étoile peut refléter une perte de motivation ou le sentiment que votre travail manque de sens. Vous pourriez vous demander ce qui vous attirait au départ sur ce chemin, et si une part de cette étincelle est encore là. Les petites réussites et des collègues bienveillants peuvent aider à retrouver le sens.
  growthUpright: >-
    Le renouveau et le soin bienveillant de soi sont au cœur du message de l’Étoile. Vous pourriez remarquer ce qui vous ressource et lui faire un peu plus de place. Formuler une intention pour les mois à venir, enracinée dans ce que vous espérez sincèrement et non dans ce que vous pensez devoir vouloir, peut vous aider à vous ancrer.
  growthReversed: >-
    Renversée, l’Étoile peut demander si vous fonctionnez sur la réserve depuis un moment. Elle peut refléter le besoin de vous ressourcer avant de pouvoir offrir davantage. Vous pourriez commencer par une petite pratique quotidienne qui vous apporte du calme, et la laisser grandir tranquillement avec le temps. Prendre soin de vous fait partie du don, ce n’est pas une pause dans le don.
