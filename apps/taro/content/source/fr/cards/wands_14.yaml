shortUpright: >-
  Une énergie claire et visionnaire vous invite à guider avec un but et à transformer de grandes idées en une direction que d’autres peuvent suivre.
shortReversed: >-
  Une forte volonté bascule peut-être dans l’impatience ou le contrôle ; vous pourriez vérifier si votre vision laisse encore de la place aux autres.
meaningUpright: |-
  Le Roi de Bâtons porte le feu de la série à maturité. Assis sur un trône mais légèrement penché en avant, le bâton à la main, il semble prêt à agir. L’énergie est visionnaire et décidée : quelqu’un qui voit où les choses pourraient aller et qui a la confiance et l’expérience nécessaires pour fixer le cap.
  Cette qualité peut apparaître quand vous prenez un projet en main, accompagnez un groupe à travers un changement, ou prenez une décision audacieuse fondée sur des valeurs claires. Elle peut aussi décrire un mentor ou une personne de référence dont le sens du but donne du courage aux autres.
  Cette carte vous invite à assumer votre propre autorité. Guider tient ici moins du contrôle que de la vision, de l’intégrité et de la constance. Vous pourriez vous demander à quel objectif plus large servent vos efforts actuels, et comment le partager clairement avec les personnes concernées. Quand une direction est honnête et bien expliquée, les autres ont souvent envie de s’y joindre au lieu de simplement suivre des ordres.
meaningReversed: |-
  Renversé, le Roi de Bâtons peut refléter un élan qui a perdu son équilibre. Le rythme des autres vous impatiente peut-être, vous faites passer des projets en force sans écouter, ou vous fixez des objectifs si élevés qu’ils ne laissent aucune place au repos. À l’inverse, il peut désigner une personne qui guide, peut-être vous, et qui a perdu de vue sa vision au point de ne plus savoir où aller.
  Cette carte vous invite peut-être à regarder comment vous utilisez votre influence. Votre énergie inspire-t-elle les gens, ou les submerge-t-elle ? La vision est-elle encore vivante pour vous ?
  Vous pourriez faire une pause pour renouer avec votre but, demander un retour sincère ou partager plus largement les décisions. Un leadership solide naît souvent autant de l’écoute que de la direction.
aspects:
  relationshipsUpright: >-
    Dans les relations, cette carte peut refléter une présence confiante, protectrice et encourageante. Vous pourriez apporter une vision aux projets communs et aider vos proches à croire en leurs propres objectifs. L’invitation est de guider avec générosité, en proposant une direction quand elle est bienvenue et un soutien quand quelqu’un d’autre veut tenir la barre.
  relationshipsReversed: >-
    Renversée, cette carte peut indiquer qu’une personne prend trop la main sur les décisions, ou que l’impatience crée des tensions. Vous pourriez remarquer si vous écoutez pleinement un proche ou si vous préparez déjà votre réponse. Inviter les idées de l’autre personne peut transformer un projet unilatéral en projet partagé.
  workUpright: >-
    Au travail ou dans un projet, le Roi de Bâtons peut désigner le leadership, une vision stratégique et le courage de prendre l’initiative. Vous pourriez définir un objectif clair, le communiquer avec enthousiasme et déléguer en faisant confiance aux forces des autres. L’intégrité et la constance aident chacun à suivre sereinement une direction ambitieuse.
  workReversed: >-
    Carte renversée, vous poussez peut-être trop fort, en attendant des autres qu’ils suivent votre rythme, ou c’est la direction elle-même qui vous semble incertaine. Vous pourriez prendre du recul pour revoir la vision avec les personnes concernées. Demander des avis et ajuster les objectifs peut rendre un projet à la fois plus réaliste et plus largement soutenu.
  growthUpright: >-
    Pour l’épanouissement personnel, cette carte vous invite à prendre en main votre direction. Que voulez-vous construire à plus long terme, et quelles valeurs vous guident ? Vous pourriez écrire une courte déclaration d’intention et vous en servir comme repère pour les choix à venir.
  growthReversed: >-
    Carte renversée, vous pourriez explorer votre rapport au contrôle et à la patience. Avez-vous l’impression de devoir toujours tout diriger, ou évitez-vous de guider parce que cela semble trop lourd ? Trouver une voie du milieu, où vous menez votre propre vie avec confiance et souplesse, peut être une forme de force stable.
reflectionQuestions:
  - >-
    Vers quelle vision travaillez-vous, et avec quelle clarté pourriez-vous la décrire à quelqu’un ?
  - >-
    Comment pourriez-vous guider d’une façon qui invite les autres à apporter leurs forces ?
  - >-
    Où un peu plus de patience rendrait-elle votre élan plus efficace ?
imageryNote: >-
  Une figure est assise sur un siège élevé au bord d’un belvédère, penchée en avant, un bâton fleuri solidement planté à ses côtés, comme sur le point de se lever. Au-delà, une route serpente vers des collines lointaines éclairées par le soleil de fin de journée. Le bâton fleuri suggère une vision vivante qui grandit, le belvédère une vue large sur ce qui pourrait être construit, et la posture penchée la disposition à transformer les idées en actes. Des braises ou de petits motifs de flammes peuvent porter l’élément feu.
