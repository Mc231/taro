imageryNote: >-
  L’illustration originale montre dix lames posées côte à côte sur un sol plat au bord d’un lac sombre, comme des outils déposés à la fin d’une longue journée. Le ciel nocturne au-dessus est lourd, et pourtant une bande claire de lumière dorée s’étend le long de l’horizon lointain. La rangée de lames suggère un cycle achevé, l’eau immobile évoque l’épuisement et le repos, et l’aube laisse entendre qu’un autre jour commence.
