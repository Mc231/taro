imageryNote: >-
  Une figure se tient sur un haut mur ou une corniche, un bâton solidement fixé à ses côtés et un second tenu sans serrer à la main, le regard tourné vers une terre ou une mer lointaine. Un petit globe, une carte ou une boussole repose à proximité. Le bâton fixé représente ce qui a déjà été construit, celui qui est levé le choix d’aller plus loin. La vue dégagée invite à imaginer de nombreux itinéraires possibles plutôt qu’un seul chemin tracé.
