imageryNote: >-
  L’illustration originale montre une figure assise dans son lit, les genoux repliés, dans une pièce sombre éclairée seulement par un mince rayon de lune à la fenêtre. Neuf lames sont suspendues en rangées soignées au mur derrière, sans jamais toucher la figure. Une couverture pliée et une petite lampe attendent tout près, éteintes. Les rangées de lames suggèrent des pensées qui tournent en boucle, tandis que la lampe et la fenêtre laissent entendre que le réconfort et le matin sont à portée de main.
