  L’illustration peut montrer une figure assise calmement sur un cheval robuste et immobile, tenant une seule pièce et regardant au loin des champs labourés. Le cheval immobile peut symboliser la patience et l’endurance, la terre sillonnée un travail méthodique déjà accompli, et le regard posé une attention stable à ce qui vient. Des tons sombres et solides et des formes massives peuvent souligner la fiabilité, avec une touche suggérant que l’immobilité peut parfois devenir inertie.
