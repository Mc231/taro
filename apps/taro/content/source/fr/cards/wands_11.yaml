imageryNote: >-
  Une jeune figure se tient dans un paysage ouvert, tenant un bâton dressé et contemplant avec une fascination non dissimulée une jeune pousse qui jaillit du bois. Ses vêtements peuvent porter de petits motifs de flammes ou de salamandres pour évoquer l’élément feu. Le bâton qui bourgeonne représente une idée vivante qui grandit, le regard émerveillé la curiosité, et la terre ouverte les nombreuses directions qui attendent encore d’être explorées.
