imageryNote: >-
  Huit bâtons filent en diagonale à travers un vaste ciel, parallèles et en plein vol, au-dessus d’un paysage paisible traversé en contrebas par une rivière ou une route. Il n’y a personne dans la scène, seulement du mouvement. L’angle commun suggère une énergie alignée dans une seule direction, le ciel ouvert un chemin dégagé, et la rivière le cours régulier des événements. L’absence de figures invite à ressentir le mouvement plutôt qu’à regarder l’histoire de quelqu’un d’autre.
