  relationshipsReversed: >-
    Renversée, cette carte peut refléter l’impression de rester dans l’ombre, que votre présence va de soi pour les autres, ou la tentation de vous comparer aux autres. Vous pourriez vous demander si vous donnez de la chaleur sans en recevoir. Exprimer ce dont vous avez besoin, et vous apprécier vous-même sans attendre que les autres le fassent, peut aider à rétablir l’équilibre dans un lien proche.
  workUpright: >-
    Au travail ou dans les projets créatifs, la Reine de Bâtons peut désigner un leadership confiant et un don pour inspirer les autres. Vous pourriez prendre ouvertement en main un projet, partager vos idées avec conviction et créer une atmosphère qui donne de l’énergie à vos collègues. Votre enthousiasme peut être une ressource concrète, et pas seulement une humeur.
  workReversed: >-
    Carte renversée, vous vous partagez peut-être entre trop de rôles, ou vous doutez de vos capacités après un revers. Vous pourriez repérer les tâches qui font vraiment appel à vos forces et leur réserver du temps. Renoncer au besoin d’être partout à la fois peut aider votre confiance naturelle à revenir.
  growthUpright: >-
    Votre chaleur a un effet sur les autres, et cette carte vous invite à l’assumer. Qu’est-ce qui vous donne le plus un sentiment de vitalité et d’assurance ? Vous pourriez remarquer les contextes où vous avez confiance en vous, et apporter un peu de cette énergie dans les domaines où vous vous retenez habituellement.
  growthReversed: >-
