imageryNote: >-
  Une figure est assise à son aise sur un large siège au milieu d’une clairière ensoleillée, un bâton feuillu posé dans une main, l’autre ouverte vers le spectateur. Un feu de foyer rougeoie à côté d’elle, et un animal compagnon attentif est couché tout près. Le foyer suggère la chaleur offerte aux autres, la main ouverte la générosité, et la posture détendue une confiance qui n’a pas besoin de faire ses preuves. Les ors et les ambres chauds peuvent faire écho au feu dans son état le plus apaisé et rayonnant.
