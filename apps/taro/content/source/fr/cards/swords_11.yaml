imageryNote: >-
  Dans l’illustration originale, une jeune figure se tient au sommet d’une colline herbeuse, la lame levée et le regard tourné vers l’horizon. Le vent agite l’herbe et disperse une volée de petits oiseaux dans un ciel lumineux strié de nuages. La lame levée suggère la disposition à mettre les idées à l’épreuve, les oiseaux évoquent des pensées rapides et vives, et la hauteur du point de vue traduit le désir de tout voir à la fois.
