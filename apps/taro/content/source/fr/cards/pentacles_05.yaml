imageryNote: >-
  L’illustration peut montrer deux figures qui avancent dans la neige ou la pluie le long d’un mur, la tête baissée face aux intempéries, tandis qu’au-dessus d’elles une fenêtre brille, cinq pièces intégrées à son motif. Le contraste entre le chemin froid et la fenêtre éclairée peut symboliser l’épreuve aux côtés d’un abri tout proche. La position de la fenêtre, un peu en dehors de leur champ de vision, suggère un soutien présent mais pas encore remarqué ni sollicité.
