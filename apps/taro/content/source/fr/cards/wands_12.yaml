  workReversed: >-
    Carte renversée, vous précipitez peut-être des décisions, ou un sentiment de blocage et d’impatience vous gagne. Vous pourriez vérifier si la vitesse est vraiment nécessaire ou si une courte pause pour planifier vous servirait mieux. Transformer la frustration en une liste claire de prochaines actions peut aider votre énergie à avancer au lieu de tourner en rond.
  growthUpright: >-
    Le courage et l’appétit d’expériences sont des dons que cette carte vous invite à utiliser. Que feriez-vous si vous faisiez confiance à votre propre enthousiasme ? Vous pourriez essayer quelque chose qui vous pousse un peu plus loin, et remarquer ce que l’on ressent en agissant par passion et pas seulement par prudence.
