imageryNote: >-
  Une figure en plein galop se penche en avant sur un cheval qui se cabre ou bondit, le bâton levé haut, la cape flottant derrière elle. Des collines désertiques ou des plaines ouvertes s’étendent devant, et de petites formes de flammes ou des salamandres peuvent orner ses vêtements. Le cheval qui bondit représente la passion et l’élan, le bâton levé un but porté jusqu’à l’action, et le vaste paysage une aventure encore en train de se déployer. La posture penchée vers l’avant évoque à la fois le courage et la hâte.
