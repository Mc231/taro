imageryNote: >-
  Le Magicien de Taro est imaginé à l’aube, devant un étal de marché à un carrefour, disposant quatre objets modestes pour les quatre couleurs : une branche verte, une coupe d’argile, un couteau à pain et une seule pièce. Une main se tend vers l’étal, l’autre désigne le ciel qui s’éclaircit, reliant l’idée et l’action. Des fils de lumière entre les objets suggèrent l’attention qui unit des outils séparés autour d’un même but, et une miche inachevée laisse entendre que l’ouvrage ne fait que commencer.
