shortUpright: >-
  Quelque chose grandit, en vous ou autour de vous. Cette carte vous invite à en prendre soin avec patience et chaleur.
shortReversed: >-
  Le soin part peut-être vers les autres pendant que votre propre source s’épuise. Où pourrait-il vous revenir ?
meaningUpright: |-
  L’Impératrice est la carte de la croissance qui naît du soin. Là où la Grande Prêtresse écoute vers l’intérieur, l’Impératrice se tourne vers le monde vivant : les jardins, les repas, les objets faits main, le plaisir d’un bon pain ou d’un soleil tiède. Cette carte représente une créativité qui nourrit, qu’il s’agisse d’un projet, d’un foyer, d’une amitié ou de votre propre sentiment de bien-être.
  Dans la vie quotidienne, cette carte peut refléter une saison de création : cuisiner pour des amis, se remettre au dessin, s’occuper de plantes ou de personnes, ou simplement remarquer que vous vous sentez plus à l’aise dans votre corps que d’habitude. Elle peut aussi désigner la patience. L’Impératrice sait que la croissance prend son temps, et que tirer sur une jeune pousse ne la fait pas grandir plus vite.
  Cette carte vous invite à regarder ce que vous cultivez et la manière dont vous le cultivez. Vous pourriez vous demander où un peu plus de douceur, de beauté ou de repos pourrait aider quelque chose à s’épanouir. L’abondance tient ici moins au fait d’avoir beaucoup qu’à celui de remarquer et d’apprécier ce qui est déjà vivant autour de vous.
meaningReversed: |-
  Renversée, l’Impératrice peut refléter un soin qui a perdu son équilibre. Vous mettez peut-être votre énergie dans tout et tous, sauf vous-même, jusqu’à ce que la créativité se tarisse et que même les choses agréables ressemblent à des corvées. Ou bien le soin peut basculer dans une implication excessive, une prise si serrée qu’elle laisse peu de place aux autres pour grandir à leur façon.
  Cette carte peut aussi désigner un projet créatif à l’arrêt, ou une déconnexion des plaisirs simples et physiques qui, d’habitude, vous apaisent.
  Vous pourriez regarder où va votre soin et si une part pourrait vous revenir. Un petit geste envers vous-même, comme un repas nourrissant, une promenade lente ou quelques minutes à créer quelque chose juste pour le plaisir, peut être une façon de renouer avec l’énergie généreuse de l’Impératrice.
aspects:
  relationshipsUpright: >-
    Dans les relations, l’Impératrice peut refléter la chaleur, l’affection et le sentiment de recevoir des soins attentifs, ou de prendre soin des autres avec générosité. Elle peut vous inviter à créer du réconfort ensemble : des repas partagés, du temps dehors, de petits gestes de tendresse. Vous pourriez remarquer comment vos proches aiment qu’on prenne soin d’eux, et comment vous aimez qu’on prenne soin de vous.
  relationshipsReversed: >-
    Renversée, l’Impératrice peut demander si le soin dans une relation est devenu à sens unique, ou si l’inquiétude a glissé vers la gestion des choix de quelqu’un d’autre. Vous pourriez vous demander où vous pourriez prendre du recul et faire davantage confiance à l’autre personne, et où vous pourriez demander plus ouvertement le soin dont vous avez besoin.
  workUpright: >-
    Au travail ou dans un projet créatif, l’Impératrice désigne un terrain fertile. Elle peut refléter une période où les idées poussent facilement, où vous pouvez faire grandir une équipe, un jardin de projets ou un ouvrage lent et gratifiant. Elle vous invite à rendre votre espace de travail plus confortable et à valoriser les progrès qui naissent d’une attention régulière et patiente.
  workReversed: >-
    Renversée, cette carte peut refléter l’épuisement de s’occuper des projets de tout le monde sauf des vôtres, ou un blocage créatif qu’aucun effort ne semble faire bouger. Vous pourriez vous demander ce qui rendrait le travail à nouveau nourrissant : un changement de cadre, une liste de tâches plus courte, ou la permission de créer quelque chose d’imparfait.
  growthUpright: >-
    Pour l’épanouissement personnel, l’Impératrice vous invite à apprécier le fait d’habiter votre corps et le monde physique. Le repos, la bonne nourriture, le temps passé dans la nature et les plaisirs simples ne sont pas ici des excès ; ce sont des façons de recharger vos forces. Vous pourriez remarquer ce qui vous aide à trouver ancrage et générosité, et lui faire un peu plus de place.
  growthReversed: >-
    Renversée, l’Impératrice peut être un doux rappel que vous méritez la même patience que celle que vous offrez aux autres. Elle peut refléter une perte de contact avec vos propres besoins ou un doute sur votre valeur créative. Vous pourriez commencer par un petit rituel bienveillant qui n’appartient qu’à vous, et voir comment il change votre semaine.
reflectionQuestions:
  - >-
    Qu’est-ce qui grandit dans votre vie en ce moment et mérite un peu de patience ?
  - >-
    Comment aimez-vous que l’on prenne soin de vous, et l’avez-vous dit à quelqu’un ?
  - >-
    Quel plaisir simple pourriez-vous vous accorder aujourd’hui ?
imageryNote: >-
  L’Impératrice de Taro est imaginée au repos dans un potager à la fin de l’été, entourée de légumes qui mûrissent, d’une miche qui refroidit sur un rebord de fenêtre et d’un ruisseau qui passe. Des tissus doux et tressés et un panier de fruits tout juste cueillis suggèrent le réconfort et le plaisir des sens, tandis que les abeilles qui vont de fleur en fleur évoquent une croissance née de nombreux petits gestes de soin. L’ambiance est chaleureuse et sans hâte, et invite à remarquer l’abondance déjà présente.
