  L’illustration peut montrer une figure qui fait une pause à côté d’une plante feuillue ou d’une vigne où sept pièces pendent comme des fruits en train de mûrir, appuyée sur une houe ou une bêche. La posture de repos peut symboliser l’évaluation et le besoin de prendre du recul, tandis que la plante suggère une croissance qui prend son temps. La terre, les feuilles et l’outil peuvent ensemble parler d’un labeur régulier, et le caractère encore vert de la récolte rappelle que l’ouvrage est toujours en cours.
