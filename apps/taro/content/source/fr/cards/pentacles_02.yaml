imageryNote: >-
  L’illustration peut montrer une figure en plein pas, maintenant deux pièces en l’air, reliées par un ruban ou une cordelette qui forme une boucle sans fin. Derrière elle, une eau ondulante ou des bateaux qui montent et descendent sur les vagues peuvent faire écho au mouvement constant de la vie quotidienne. La boucle suggère la continuité et la nature permanente de l’équilibre, tandis que la posture légère et dansante laisse entendre que l’ajustement peut se faire avec aisance, et même un peu de jeu.
