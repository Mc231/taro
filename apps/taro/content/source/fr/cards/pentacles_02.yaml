  relationshipsReversed: >-
    Renversée, cette carte peut désigner un lien qui reçoit les restes d’attention une fois tout le reste fait. Des projets annulés ou des conversations distraites s’accumulent peut-être. Sans essayer de faire plus d’efforts partout, vous pourriez parler ouvertement de ce que chacun peut réalistement offrir en ce moment, et protéger un petit moment rien que pour vous deux.
  workUpright: >-
    Au travail, le Deux de Deniers peut décrire un mode multitâche mené avec une certaine grâce : passer d’un rôle à l’autre, répondre à des priorités changeantes, adapter un plan en cours de route. Vous pourriez remarquer quels outils ou quelles habitudes vous aident à basculer en douceur. Il peut valoir la peine de reconnaître cette souplesse comme une vraie compétence, tout en gardant un œil sur la tenabilité du rythme.
  workReversed: >-
    Ici, la carte peut suggérer que trop de tâches se disputent les mêmes heures, ou qu’un plan rigide peine à affronter les conditions réelles. Vous pourriez chercher ce qui peut être enchaîné au lieu d’être fait en même temps. Demander des priorités plus claires, ou nommer ce qui ne peut pas tenir cette semaine, peut apporter plus de stabilité que de travailler plus longtemps.
  growthUpright: >-
