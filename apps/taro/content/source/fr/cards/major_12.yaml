shortUpright: >-
  Une pause, choisie ou non, peut offrir un point de vue qu’on ne verrait jamais en fonçant droit devant.
shortReversed: >-
  L’attente s’est peut-être changée en immobilisme. Qu’est-ce qui vous aiderait à décider s’il vaut mieux rester ou bouger ?
meaningUpright: |-
  Le Pendu est suspendu la tête en bas à un arbre vivant, et pourtant son visage est calme, parfois même lumineux. Ce n’est pas une carte de punition. C’est une carte de suspension délibérée : sortir du flot habituel de l’action pour voir les choses autrement. Quand on retourne le monde, ce qui semblait évident peut soudain paraître étrange, et ce qui semblait impossible peut devenir accessible.
  Dans la vie de tous les jours, cette carte peut refléter un projet en suspens, un plan retardé par les circonstances, ou un moment où vous comprenez que pousser plus fort n’aide pas. Elle peut désigner la valeur qu’il y a à lâcher une idée figée sur la façon dont quelque chose devrait se dérouler. Parfois, le geste le plus utile est d’arrêter de bouger et simplement de regarder.
  Cette carte vous invite à regarder ce qu’une pause pourrait vous offrir. Vous pourriez vous demander ce que vous remarqueriez en regardant votre situation sous l’angle opposé. Le Pendu suggère que le lâcher-prise, au sens de renoncer au besoin de tout contrôler, peut faire place à une prise de conscience, et que l’attente peut être active lorsqu’elle s’accompagne d’attention.
meaningReversed: |-
  Renversé, le Pendu peut refléter une pause qui a duré au-delà de son utilité. Vous avez peut-être l’impression d’être dans l’entre-deux, en attendant que quelque chose change sans trop savoir ce que vous attendez. L’indécision peut commencer à sembler plus sûre que le choix.
  Cette carte peut aussi désigner une résistance à une pause dont vous avez besoin, le fait de remplir chaque instant pour éviter l’inconfort de l’immobilité, ou de sacrifier vos propres besoins d’une manière qui ne sert plus personne.
  Vous pourriez vous demander ce que l’attente protège. S’il est temps de bouger, quel est le plus petit pas qui vous remettrait en mouvement ? S’il vous faut vous arrêter, quelle permission pourriez-vous vous donner pour vous reposer sans culpabilité ? Dans les deux cas, le choix vous appartient, et le faire peut redonner un sens de la direction.
aspects:
  relationshipsUpright: >-
    Dans les relations, le Pendu peut refléter un moment pour prendre du recul et voir une situation du point de vue de l’autre personne. Il peut vous inviter à lâcher le besoin de gagner une dispute ou de tout régler tout de suite. La patience et l’envie de voir autrement peuvent ouvrir une compréhension inattendue.
  relationshipsReversed: >-
    Renversée, cette carte peut désigner une relation dans l’entre-deux, où personne ne nomme ce qu’il souhaite. Elle peut aussi refléter le fait de donner plus qu’il ne semble juste, dans l’espoir que les choses changent. Vous pourriez vous demander s’il est temps de dire doucement ce dont vous avez besoin, pour que vous puissiez avancer tous les deux.
  workUpright: >-
    Au travail ou dans un projet, le Pendu met en avant une pause pour repenser les choses. Les retards peuvent être frustrants, mais ils offrent peut-être le temps de questionner des suppositions, d’explorer d’autres pistes ou de laisser mûrir une idée. Vous pourriez profiter d’une période plus lente pour regarder votre travail sous un angle complètement différent.
  workReversed: >-
    Renversé, le Pendu peut refléter un projet bloqué depuis trop longtemps ou une décision sans cesse repoussée. Vous pourriez vous demander quelle information ou quel soutien vous attendez vraiment. Vous fixer une échéance douce, ou choisir de renoncer à une option, peut aider le mouvement à revenir.
  growthUpright: >-
    Lâcher prise est une compétence, et le Pendu offre l’occasion de la pratiquer. Ce que vous laissez partir peut être une croyance, une attente ou une habitude de vous précipiter. Vous pourriez essayer de faire une chose familière dans l’ordre inverse ou sous un nouvel angle, et remarquer ce que ce petit dérangement révèle de votre façon habituelle de voir le monde.
  growthReversed: >-
    Renversé, le Pendu peut demander si vous fuyez l’immobilité ou si vous vous y enlisez. Il peut refléter une agitation ou l’impression d’être en attente. Vous pourriez faire le point avec vous-même : est-ce un temps pour la patience, ou pour une douce poussée ? Votre réponse sincère peut guider l’étape suivante.
