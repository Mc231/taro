imageryNote: >-
  Le Pendu de Taro est imaginé suspendu la tête en bas par une cheville à une branche robuste et vivante, les bras détendus et le visage calme, presque curieux. Sous cet angle, la figure voit le monde reflété dans un bassin en contrebas, retourné dans l’autre sens. L’arbre est vert et en bourgeons, ce qui montre que la pause fait partie de la croissance au lieu d’y mettre fin. Les bleus aquatiques et les vêtements amples et fluides font écho au lâcher-prise, à la rêverie et au regard qui plonge sous la surface.
