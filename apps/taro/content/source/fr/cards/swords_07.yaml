imageryNote: >-
  L’illustration originale montre une figure qui traverse sur la pointe des pieds un champ éclairé par la lune, portant une brassée de lames tandis que quelques-unes restent plantées dans l’herbe derrière elle. Des tentes au loin luisent doucement, sans rien remarquer. Une trace de pas montre le chemin parcouru. La brassée suggère le fait de prendre plus que ce qui était offert, les lames restantes évoquent ce qui ne peut être emporté, et le regard en arrière traduit le malaise d’agir sans être vu.
