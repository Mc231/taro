  relationshipsReversed: >-
    Renversé, cette carte peut désigner des mots prononcés à la hâte, des disputes qui s’enveniment vite, ou de l’impatience face au rythme de quelqu’un d’autre. Vous pourriez remarquer quand vous tirez des conclusions hâtives sur ce que veut dire une autre personne. Ralentir, poser une question ou simplement attendre un jour avant de répondre peut éviter des blessures inutiles.
  workUpright: >-
    Au travail, le Cavalier d’Épées peut suggérer un effort pour faire avancer les choses : rattraper un retard, défendre une proposition, ou saisir vite une occasion claire. Votre concentration peut inspirer les autres. Vous pourriez garder une communication ouverte pour que l’équipe comprenne votre direction, et vérifier deux fois les détails importants pour que la vitesse ne nuise pas à la qualité.
  workReversed: >-
    Renversé, cette carte peut refléter des tâches abordées sans plan, des heurts avec des collègues, ou la frustration face à des processus lents. Vous pourriez faire une pause pour fixer des priorités et vous demander si une solution rapide tiendra. Si l’avancée est bloquée, diriger votre énergie vers la préparation peut rendre le moment venu bien plus efficace.
  growthUpright: >-
    Pour l’épanouissement personnel, le Cavalier d’Épées vous invite à agir selon vos convictions. Vous pourriez choisir un objectif et le poursuivre avec concentration, en remarquant l’énergie qui naît d’un effort engagé. Le courage de parler et d’agir est précieux ; l’associer à la réflexion vous aide à grandir dans une direction que vous voulez vraiment.
