imageryNote: >-
  L’illustration originale montre une figure penchée en avant sur un cheval au galop, la lame tendue, la cape claquant au vent. Les arbres sur la colline ploient dans la même direction, et des nuages déchirés filent au-dessus. La posture penchée et les nuages pressés suggèrent l’élan et la conviction, tandis que les arbres courbés évoquent la force qu’une telle vitesse exerce sur tout ce qui l’entoure.
