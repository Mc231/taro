imageryNote: >-
  La Roue de Fortune de Taro est imaginée comme une grande roue qui tourne dans un ciel passant de l’aube d’un côté à la nuit de l’autre, montrant toutes les phases à la fois. De petites figures et créatures voyagent sur sa jante, certaines montant, d’autres descendant, aucune ne restant immobile. Les symboles des quatre saisons dans les coins peuvent encadrer l’idée des cycles naturels. Au moyeu, un centre calme et immobile suggère le recul stable que l’on peut trouver même quand tout tourne.
