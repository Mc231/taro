shortUpright: >-
  Les choses tournent. Cette carte vous invite à remarquer le cycle que vous traversez et la façon dont vous voulez l’accompagner.
shortReversed: >-
  Un schéma familier revient peut-être. Que pourriez-vous faire autrement cette fois-ci ?
meaningUpright: |-
  La Roue de Fortune est la carte des cycles. Les saisons tournent, les humeurs montent et descendent, les périodes chargées laissent place à des moments calmes. Rien ne reste éternellement en haut ni en bas. Cette carte rappelle que le changement fait naturellement partie de la vie, qu’une part échappe au contrôle de quiconque et qu’une autre dépend de la manière dont vous l’accueillez.
  Dans la vie de tous les jours, cette carte peut refléter un tournant : un chapitre qui se ferme et un autre qui s’ouvre, un heureux hasard qui modifie vos projets, ou un contretemps inattendu qui change votre rythme. Elle peut aussi désigner la reconnaissance d’un schéma déjà rencontré, comme un même type de situation qui revient sous une nouvelle forme, et le fait de le voir d’un œil neuf.
  Cette carte vous invite à regarder où vous en êtes sur votre propre roue en ce moment. Vous pourriez vous demander ce que cette phase attend de vous, et ce qu’elle pourrait vous apprendre. La Roue ne décide pas de votre vie à votre place. Elle met en lumière la souplesse, le recul et l’humour qui peuvent aider à négocier les virages, et rappelle qu’une saison difficile reste une saison, pas un état permanent.
meaningReversed: |-
  Renversée, la Roue de Fortune peut refléter l’impression de tourner en boucle ou une résistance à un changement déjà en cours. Vous avez peut-être le sentiment de subir les événements, ou vous remarquez que le même schéma frustrant revient sous d’autres habits.
  Cette carte peut aussi désigner le fait de s’accrocher à une bonne période, par peur qu’elle ne puisse pas durer. Se cramponner rend le mouvement naturel de la roue plus difficile à vivre.
  Vous pourriez regarder ce qui est à votre portée. Les schémas se répètent souvent jusqu’à ce que quelque chose change dans notre manière d’y répondre, même légèrement. Il peut être utile de nommer le cycle que vous voyez, de remarquer votre part sans vous blâmer, et de choisir une petite chose à faire autrement. Vous ne pouvez pas arrêter la roue, mais vous pouvez y trouver un appui plus ferme.
aspects:
  relationshipsUpright: >-
    Dans les relations, la Roue peut refléter une nouvelle phase : se rapprocher, passer à une autre étape ou simplement s’adapter à des circonstances changeantes. Elle peut vous inviter à rester souple et à parler ouvertement de ce qui évolue. Les relations, comme les saisons, ont leurs rythmes, et les nommer peut vous aider à les traverser ensemble.
  relationshipsReversed: >-
    Renversée, cette carte peut désigner des conflits familiers qui reviennent sans cesse, ou une résistance au fait qu’une relation change de forme. Vous pourriez vous demander quel schéma un proche et vous avez tendance à répéter, et ce que chacun pourrait essayer de faire autrement. Le changement ne signifie pas forcément une perte ; il peut aussi signifier une croissance.
  workUpright: >-
    Au travail ou dans un projet, la Roue met en avant des circonstances changeantes et de nouvelles ouvertures. Elle peut refléter un changement de programme, une nouvelle équipe ou un projet qui avance soudain. Vous pourriez rester à l’affût des occasions tout en vous rappelant que chaque phase, chargée ou lente, a quelque chose à offrir.
  workReversed: >-
    Renversée, la Roue peut refléter une frustration face aux retards ou le sentiment que les efforts ne portent pas leurs fruits. Elle peut aussi désigner le fait de répéter la même approche en espérant un résultat différent. Vous pourriez revoir ce qui a fonctionné, ce qui n’a pas fonctionné, et où un petit changement de méthode pourrait faire bouger le schéma.
  growthUpright: >-
    Voir votre vie comme une suite de cycles, et non comme une ligne droite, peut être libérateur. Remarquer vos propres rythmes, par exemple les moments où l’énergie est là et ceux où vous avez besoin de repos, peut vous aider à vous organiser avec eux et non contre eux. Vous pourriez retracer l’année écoulée et en repérer les tournants.
  growthReversed: >-
    Renversée, la Roue peut demander si vous essayez de contrôler ce qui ne peut pas l’être. Elle peut refléter un besoin de certitude en période de changement. Vous pourriez vous exercer à lâcher prise sur une chose sur laquelle vous n’avez pas d’influence, et à mettre cette énergie dans une chose sur laquelle vous en avez.
