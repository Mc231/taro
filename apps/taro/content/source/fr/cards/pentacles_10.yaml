imageryNote: >-
  L’illustration peut réunir des personnes de tous âges sous une arche menant à une maison ou à une cour, avec des animaux qui se reposent à proximité et dix pièces disposées en motif à travers la scène. L’arche peut symboliser un seuil entre vie privée et vie partagée, le mélange des âges la continuité, et les pièces en motif une structure construite au fil du temps. Des couleurs chaudes et posées peuvent suggérer l’appartenance, tandis que la composition foisonnante évoque la complexité de toute maisonnée.
