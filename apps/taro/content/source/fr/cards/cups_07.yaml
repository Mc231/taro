imageryNote: >-
  L’illustration montre une figure, vue de dos, face à sept coupes qui flottent dans une brume mouvante. Chaque coupe contient un symbole différent, peut-être une clé, une guirlande, une petite maison, une étoile, une forme enroulée, une boîte fermée et un miroir, qui représentent l’accès, les éloges, la sécurité, l’espoir, le malaise, les secrets et l’image de soi. Une lumière douce et onirique et des couleurs changeantes peuvent suggérer à quel point ces visions sont séduisantes et incertaines, invitant à se demander laquelle est réelle.
