imageryNote: >-
  Les Amoureux de Taro sont imaginés comme deux figures debout de part et d’autre d’un étroit ruisseau, tendant la main pour se rejoindre par-dessus, dessinées de sorte que chacun puisse se reconnaître dans l’une ou l’autre. Au-dessus d’elles, deux oiseaux tournent dans le même ciel lumineux. Sur une rive pousse un arbre fruitier, sur l’autre une vigne en fleur : deux dons différents qui se rencontrent au milieu. Le ruisseau évoque le choix et l’effort qu’un lien véritable demande aux deux personnes.
