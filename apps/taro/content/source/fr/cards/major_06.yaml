meaningUpright: |-
  Les Amoureux sont souvent lus comme une carte de romance, mais leur thème profond est l’alignement : la rencontre de deux parts, de deux personnes ou de deux chemins d’une manière qui forme un tout. Cette carte demande ce qui compte le plus pour vous, et si les choix qui s’offrent à vous le reflètent. Le lien concerne ici les autres autant que vous-même.
  Dans la vie de tous les jours, cette carte peut refléter une relation où vous avez le sentiment qu’on vous voit vraiment, un partenariat de travail où les idées circulent facilement, ou une décision qui vous demande de dire clairement ce qui compte pour vous. Elle peut désigner un moment de choix entre deux bonnes options, où il n’y a pas de bonne réponse évidente, seulement celle qui correspond à la personne que vous devenez.
  Cette carte vous invite à regarder à quel point vous êtes honnête avec vous-même et avec les autres. Vous pourriez vous demander ce qui vous attire et pourquoi, et ce à quoi vous voulez vraiment vous engager. Les Amoureux rappellent que les choix porteurs de sens tiennent rarement de la perfection. Il s’agit de réunir votre cœur et votre jugement dans la même pièce et de les laisser se parler.
meaningReversed: |-
  Renversée, la carte des Amoureux peut refléter un tiraillement entre deux directions. Ce que vous voulez et ce que vous pensez devoir vouloir ne concordent peut-être pas, ou un lien proche peut sembler légèrement désaccordé, chacun tenant à des choses différentes sans le dire.
  Cette carte peut aussi désigner une décision sans cesse repoussée, peut-être parce que choisir une option signifie renoncer à une autre. Éviter le choix peut sembler plus facile à court terme tout en épuisant discrètement l’énergie.
  Vous pourriez noter ce que chaque option vous offre et vous demande honnêtement, et quelles valeurs elle soutient. Il peut être utile de remarquer où vous vous sentez le plus vous-même. Le réalignement commence souvent par un petit aveu sincère, d’abord à vous-même puis, si cela vous semble juste, à quelqu’un d’autre.
aspects:
  relationshipsUpright: >-
    Dans les relations, les Amoureux peuvent refléter une compréhension mutuelle profonde et le plaisir de se choisir l’un l’autre, que ce soit en amour, en amitié ou en famille. Cette carte peut vous inviter à partager ce qui compte vraiment pour vous et à écouter aussi ce qui compte pour l’autre personne. La proximité grandit quand chacun peut être honnête tout en se sentant accueilli.
  relationshipsReversed: >-
    Renversée, cette carte peut désigner un écart entre les espoirs ou les priorités de deux personnes, ou des sentiments qui n’ont pas été exprimés. Vous pourriez vous demander si vous vous adaptez trop pour préserver la paix, ou si vous attendez de quelqu’un qu’il devine ce dont vous avez besoin. Une conversation ouverte et bienveillante sur vos valeurs pourrait vous aider tous les deux à voir où vous en êtes.
  workUpright: >-
    Au travail ou dans un projet, les Amoureux mettent en avant la collaboration et les choix ancrés dans vos valeurs. Cette carte peut refléter un partenariat qui fait ressortir le meilleur de chacun, ou une décision sur la direction à suivre. Vous pourriez vous demander quelle option a du sens tout en étant concrète, et laisser ces deux aspects compter dans votre choix.
  workReversed: >-
    Renversée, cette carte peut refléter des frictions dans un partenariat ou le sentiment que votre travail ne correspond pas à ce qui vous tient à cœur. Elle peut aussi désigner une hésitation entre deux chemins. Vous pourriez lister ce que chaque chemin vous demanderait, et remarquer auquel vous auriez le plus envie de le donner.
  growthUpright: >-
    Connaître plus clairement vos propres valeurs, voilà le travail intérieur que désigne cette carte. Quand vous comprenez ce qui compte pour vous, vos choix visent moins à plaire aux autres et davantage à rester fidèles à vous-même. Vous pourriez écrire trois valeurs et remarquer où elles guident déjà vos journées.
  growthReversed: >-
    Renversée, cette carte peut refléter un conflit intérieur : une part de vous veut du changement, une autre du confort. Aucune n’a tort. Vous pourriez donner la parole à chacune, sur le papier ou dans une conversation, et voir s’il existe un choix qui les respecte toutes les deux, même en partie.
reflectionQuestions:
