  relationshipsReversed: >-
    Renversé, le Quatre d’Épées peut refléter une pause devenue distance, ou une relation où personne n’a d’espace pour respirer. Vous pourriez vous demander s’il est temps de renouer après une période calme, ou si vous avez besoin de demander un peu d’espace. L’une ou l’autre demande peut se faire avec douceur et sans reproche.
  workUpright: >-
    Au travail, cette carte peut désigner une pause planifiée : des vacances, une semaine plus légère, ou un recul après un projet exigeant. Le repos fait partie d’un effort durable. Vous pourriez protéger un peu de temps non planifié pour que les idées se posent d’elles-mêmes. Souvent, la solution que vous ne trouviez pas en forçant devient visible quand vous cessez de la chercher directement.
  workReversed: >-
    Renversé, cette carte peut refléter un travail mené malgré l’épuisement, ou une difficulté à décrocher. Vous pourriez remarquer où le repos ne cesse de glisser en bas de la liste. Elle peut aussi marquer une disponibilité à revenir après une pause, avec un regard neuf. Commencer par de petites tâches faciles à gérer peut aider à reprendre en douceur sans vous submerger.
  growthUpright: >-
    Pour l’épanouissement personnel, le Quatre d’Épées vous invite à construire des habitudes de repos : des pauses régulières, des matins calmes ou du temps dans la nature. Le calme laisse à vos pensées une chance de se trier d’elles-mêmes. Vous pourriez essayer de ne rien faire du tout pendant quelques minutes et remarquer ce qui émerge. Le repos n’est pas de la paresse ; c’est ainsi que l’énergie revient.
  growthReversed: >-
    Renversé, cette carte peut refléter un esprit agité qui résiste à l’arrêt, ou une retraite devenue discrètement une cachette. Vous pourriez faire doucement le point avec vous-même : cette pause vous apporte-t-elle encore quelque chose ? Si le repos semble impossible, une courte marche ou une respiration plus lente peuvent être un début. Si vous avez envie de bouger, commencez en douceur.
