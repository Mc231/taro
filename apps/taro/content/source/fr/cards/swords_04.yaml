imageryNote: >-
  L’illustration originale montre une figure qui se repose sur un banc de pierre bas dans un espace voûté et paisible. Trois lames sont suspendues calmement au mur au-dessus, et une quatrième est posée à plat sous le banc, toutes rangées. Une lumière douce entre par une petite fenêtre. La pièce close suggère un refuge sûr, les lames rangées des pensées mises de côté pour l’instant, et la lumière douce un monde extérieur qui attend patiemment.
