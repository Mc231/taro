  - >-
    Quelle leçon du passé aimeriez-vous emporter dans votre prochain chapitre ?
imageryNote: >-
  Le Jugement de Taro est imaginé comme un vaste paysage à l’aube après un long hiver, où une cloche claire sonne depuis le sommet d’une colline tandis que des gens sortent de chez eux dans la première lumière, s’étirent et lèvent les yeux. La neige qui fond laisse apparaître de jeunes pousses vertes. Une fenêtre ouverte aux rideaux soulevés vers l’extérieur suggère un appel intérieur auquel on répond. Les montagnes lointaines évoquent le recul qu’apporte une réflexion honnête, et les couleurs pâles du matin parlent de renouveau.
