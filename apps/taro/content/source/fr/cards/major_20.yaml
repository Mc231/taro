shortUpright: >-
  Un moment pour regarder en arrière avec honnêteté, pardonner ce que vous pouvez et répondre à ce qui vous appelle à avancer.
shortReversed: >-
  Votre critique intérieur parle peut-être plus fort que d’habitude. Que vous montrerait un regard juste et bienveillant sur votre passé ?
meaningUpright: |-
  Le Jugement est une carte d’éveil et de renouveau. Il parle moins du fait d’être jugé par les autres que d’un moment d’introspection honnête : regarder le chemin parcouru, tirer parti de ce que vous avez appris et sentir que le moment est venu de vous élever vers un nouveau chapitre. Il y a souvent le sentiment d’un appel, une impulsion intérieure qui dit qu’il est temps.
  Dans la vie de tous les jours, cette carte peut refléter un moment de clarté après une longue période de confusion, la décision de vous lancer enfin dans quelque chose que vous repoussiez, ou un bilan sur un choix passé qui vous aide à tourner la page. Elle peut désigner le pardon, envers vous-même ou envers quelqu’un d’autre, et le soulagement de voir votre histoire sous un jour plus complet et plus juste.
  Cette carte vous invite à regarder ce qui vous appelle maintenant. Vous pourriez vous demander ce que vous feriez si vous considériez vos expériences passées comme une préparation à cela. Le Jugement met en lumière un renouveau qui passe par la compréhension : quand vous pouvez regarder votre histoire avec honnêteté et compassion, vous découvrez peut-être une plus grande liberté pour choisir la suite.
meaningReversed: |-
  Renversé, le Jugement peut refléter un critique intérieur sévère. Vous repassez peut-être d’anciennes erreurs en boucle, doutez de votre valeur ou hésitez à avancer à cause de quelque chose du passé. L’appel est là, mais la culpabilité ou la peur le couvrent peut-être.
  Cette carte peut aussi désigner le fait d’éviter toute réflexion : passer d’une chose à l’autre sans prendre le temps d’apprendre de ce qui s’est passé.
  Vous pourriez regarder votre passé avec la justesse que vous offririez à un ami. Qu’avez-vous appris, et que vous sentez-vous en mesure de déposer ? Écrire une lettre de compréhension à la personne que vous étiez plus jeune peut être une façon de commencer. Répondre à l’appel n’exige pas la perfection ; cela peut commencer par un seul pas sincère.
aspects:
  relationshipsUpright: >-
    Dans les relations, le Jugement peut refléter un tournant : l’apaisement d’anciens griefs, un engagement renouvelé ou un bilan commun qui vous rapproche. Il peut vous inviter à parler honnêtement du passé et à décider ensemble de ce que vous voulez pour la suite. Le pardon, quand il semble juste, peut faire place à un nouveau départ.
  relationshipsReversed: >-
    Renversée, cette carte peut désigner des reproches ou des jugements qui persistent dans une relation, d’un côté ou des deux. Vous pourriez vous demander si le fait de garder d’anciennes blessures vous protège encore, ou s’il vous empêche d’avancer. Une conversation ouverte et calme pourrait aider chacun à voir les choses plus équitablement.
  workUpright: >-
    Au travail ou dans un projet, le Jugement met en avant le sentiment d’une vocation. Il peut refléter la prise de conscience du type de travail qui a du sens pour vous, ou un retour sur des projets passés pour décider de la suite. Vous pourriez être à l’écoute de ce qui vous enthousiasme et vous demander comment vos compétences pourraient servir cette direction.
  workReversed: >-
    Renversé, le Jugement peut refléter la peur de la critique qui vous retient, ou le fait d’ignorer le sentiment qu’il est temps de changer. Il peut aussi désigner une trop grande sévérité envers vos résultats passés. Vous pourriez lister ce que vous avez appris et la façon dont cela pourrait guider votre prochaine étape.
  growthUpright: >-
    Un regard attentif sur le chemin parcouru peut être un tournant en soi. Vous pourriez revenir sur une période importante, en remarquant comment vous avez grandi et ce que vous avez laissé derrière vous. Ce recul peut vous aider à répondre à un nouvel appel avec confiance et clarté.
  growthReversed: >-
    Renversé, le Jugement peut demander si vous portez une culpabilité ou des reproches envers vous-même dont vous n’avez pas besoin. Il peut refléter un besoin de vous défaire d’anciennes histoires sur vous-même. Vous pourriez vous exercer à remarquer quand votre voix intérieure devient dure, et à vous offrir doucement un regard plus juste. Une voix intérieure plus juste peut rendre l’épanouissement plus léger et plus accessible.
reflectionQuestions:
