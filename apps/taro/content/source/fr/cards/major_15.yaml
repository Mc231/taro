imageryNote: >-
  Le Diable de Taro est imaginé comme une figure cornue et sombre, perchée au-dessus de deux figures plus petites reliées à son siège par des chaînes lâches et détendues. Les chaînes sont clairement dessinées lâches autour de leurs poignets, invitant à remarquer qu’elles pourraient les retirer. Une lumière de torche faible et des tons de terre profonds créent une ambiance lourde, tandis qu’une faible ouverture lumineuse au bord de la scène laisse entendre qu’un autre chemin est là, prêt à être trouvé.
