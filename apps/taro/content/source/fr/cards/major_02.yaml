imageryNote: >-
  La Grande Prêtresse de Taro est imaginée assise sur le seuil d’une porte éclairée par la lune, mi-lumière, mi-ombre, un livre fermé posé sur les genoux. Derrière elle, un rideau frémit comme si quelque chose attendait de l’autre côté. Un croissant de lune reflété dans un bassin immobile peut faire écho aux cycles et à l’intuition, et les tons bleu profond suggèrent le calme en surface et la profondeur dessous. L’immobilité tranquille et attentive de la figure est au centre de l’image.
