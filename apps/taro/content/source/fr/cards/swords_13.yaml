imageryNote: >-
  Dans l’illustration originale, une figure est assise sur un siège de pierre sculptée placé bien au-dessus des nuages, la lame tenue droite dans une main, l’autre main ouverte et tendue. Un seul oiseau tournoie dans l’air limpide au-dessus. La lame dressée suggère le discernement, la main ouverte évoque l’équité et la disposition à écouter, et l’oiseau solitaire laisse deviner un esprit indépendant qui voit loin.
