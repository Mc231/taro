  relationshipsReversed: >-
    Renversée, cette carte peut désigner une relation où les besoins d’une personne dominent, ou où les conflits s’enveniment vite. Vous pourriez réfléchir à la manière de faire baisser l’intensité : ralentir les conversations, faire des pauses quand le ton monte, et chercher ce que vos souhaits ont en commun.
  workUpright: >-
    Au travail ou dans un projet, la Tempérance met en avant un progrès régulier et une bonne collaboration. Elle peut refléter l’association de compétences ou d’idées différentes en quelque chose qui fonctionne bien, ou le fait de doser vos efforts pour que l’énergie dure. Vous pourriez chercher la version du plan qui est ambitieuse tout en restant tenable.
  workReversed: >-
    Renversée, la Tempérance peut refléter une surcharge de travail, des décisions précipitées ou des frictions entre personnes aux approches différentes. Vous pourriez vous demander où le rythme est devenu irréaliste et ce qui pourrait être simplifié. Trouver une voie du milieu entre des priorités concurrentes peut réduire le stress de tout le monde. Même un après-midi sans réunion peut montrer à quoi ressemble un rythme plus stable.
  growthUpright: >-
    Pour l’épanouissement personnel, cette carte vous invite à pratiquer la modération sans rigidité. Vous pourriez remarquer vos propres points d’équilibre : la quantité de repos, d’activité, de temps pour soi et de temps avec les autres qui vous aide à vous sentir stable. De petits ajustements réguliers peuvent apporter plus d’aisance que de grandes résolutions.
  growthReversed: >-
    Renversée, la Tempérance peut demander si vous fonctionnez dans les extrêmes depuis un moment. Elle peut refléter un besoin de ralentir, de vous reposer ou de réintroduire un ingrédient manquant dans vos journées. Vous pourriez choisir un domaine à rééquilibrer en douceur, et vous laisser le temps de voir comment il se stabilise.
