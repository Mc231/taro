imageryNote: >-
  La Tempérance de Taro est imaginée comme une figure ailée au bord d’une rivière lente, versant avec soin un liquide entre deux récipients différents, l’un d’argile, l’autre de verre. Le filet qui les relie s’incurve doucement, comme si l’équilibre se trouvait en temps réel. Des pierres de gué qui traversent la rivière suggèrent une voie du milieu d’une rive à l’autre, et les douces couleurs d’un lever de soleil sur des collines lointaines gardent une ambiance calme et pleine d’espoir.
