imageryNote: >-
  Le Mat de Taro est imaginé au bord d’un lieu élevé, le ciel ouvert devant lui, en plein élan, ne portant qu’un petit baluchon. Un petit animal compagnon à ses talons peut représenter l’instinct, joueur ou prudent. Une seule fleur blanche peut évoquer l’innocence et l’ouverture, tandis que le large horizon et la lumière du matin parlent de possibles. Le visage levé du personnage invite à se demander vers quoi il regarde, et ce qu’il a choisi de ne pas emporter.
