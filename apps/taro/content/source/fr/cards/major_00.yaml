shortUpright: >-
  Un pas vers la nouveauté, fait avec plus de curiosité que de certitude.
shortReversed: >-
  Une pause au bord du chemin : est-ce de la prudence, ou la peur du ridicule ?
meaningUpright: |-
  Le Mat se tient tout au début des Arcanes majeurs, numéroté zéro, avant que la moindre leçon ait été apprise. C’est l’énergie de quelqu’un qui se met en route avec un sac léger et un visage ouvert, plus intéressé par ce que la route pourrait montrer que par l’endroit où elle s’arrête.
  Dans la vie de tous les jours, cette carte peut refléter la première semaine dans un nouveau lieu, un loisir commencé sans projet de le maîtriser, ou une conversation lancée sans en répéter chaque phrase. Elle peut désigner une part de vous qui a envie d’essayer, même quand une autre part réclame une certitude que personne ne peut offrir. Ici, ne pas savoir n’est pas un défaut ; c’est simplement là que commence tout voyage.
  Cette carte vous invite à regarder où un peu plus de légèreté pourrait aider. Que changerait le fait de vous autoriser à retrouver un regard neuf, à poser des questions simples et à apprendre en faisant ? Le Mat ne vous demande pas d’ignorer le bon sens. Il vous invite à remarquer si la peur de vous tromper vous empêche de faire le moindre pas.
meaningReversed: |-
  Renversé, le Mat peut montrer l’étincelle d’un nouveau départ qui n’a pas tout à fait pris. Quelque chose de neuf vous attire peut-être, alors même que vous restez immobile, à retourner l’idée dans tous les sens en attendant un signe qu’il est sans risque d’avancer. Parfois, cette attente est sage ; parfois, elle est discrètement devenue une habitude.
  Cette position peut aussi refléter l’inclinaison inverse : une énergie qui fonce sans regarder, qui dit oui à tout et laisse peu de place pour remarquer où l’on pose les pieds. Les deux penchants partagent une même question sur la disponibilité intérieure et la confiance.
  Vous pouvez vous demander lequel des deux vous parle le plus en ce moment. Si vous vous retenez, quelle petite façon, sans grand enjeu, vous permettrait de tâter le terrain ? Si vous foncez, à quoi ressemblerait le fait de garder votre enthousiasme en ajoutant un temps de pause avant le prochain saut ?
aspects:
  relationshipsUpright: >-
    Dans les relations, le Mat peut refléter une qualité joueuse et sans armure : rencontrer quelqu’un sans scénario, ou laisser un lien familier vous surprendre à nouveau. Il peut vous inviter à porter un regard curieux sur vos proches, en posant des questions dont vous croyez déjà connaître les réponses. L’ouverture n’est pas ici de la naïveté ; c’est une volonté d’être pleinement là sans décider à l’avance de la façon dont les choses devraient se passer.
  relationshipsReversed: >-
    Renversée, cette carte peut désigner une hésitation à laisser quelqu’un s’approcher, ou un rythme si rapide que l’autre personne a peu de place pour suivre. Vous pourriez observer si vous vous protégez en restant dans le vague, ou si vous sautez les étapes plus lentes où l’on apprend à se connaître. Une conversation douce sur le rythme, le vôtre et le sien, pourrait ouvrir de l’espace pour vous deux.
  workUpright: >-
    Au travail ou dans tout projet, le Mat peut refléter le début de quelque chose d’inconnu : un nouveau poste, une formation, une idée créative encore sans historique. Il vous invite à voir les premières erreurs comme des informations et non comme des verdicts. Vous pourriez vous demander ce que vous tenteriez si le premier essai avait le droit d’être brouillon, et qui pourrait vous aider à apprendre les ficelles en chemin.
  workReversed: >-
    Renversé, le Mat peut refléter une idée sans cesse repoussée en attendant des conditions parfaites, ou un saut fait sans vérifier l’essentiel. Vous pourriez vous demander s’il vous faut plus d’informations ou simplement plus de courage. Noter la plus petite première étape possible, et une précaution concrète, peut transformer un vague souhait en quelque chose que vous pouvez tester sans tout miser dessus.
  growthUpright: >-
    Pour l’épanouissement personnel, cette carte célèbre l’esprit de débutant. Elle peut vous inviter à essayer quelque chose où vous n’avez aucune réputation à défendre : une nouvelle compétence, un autre chemin pour rentrer, une question posée à voix haute. Ici, on grandit en gardant sa curiosité et en se laissant surprendre, sans chercher à tout réussir du premier coup.
  growthReversed: >-
    Renversé, le Mat peut vous demander si la peur de paraître ridicule a commencé à rétrécir votre monde. Il peut aussi refléter une agitation qui saute d’une nouveauté à l’autre sans laisser aucune prendre racine. Vous pourriez remarquer quel schéma vous semble familier, et expérimenter son doux contraire pendant une semaine.
