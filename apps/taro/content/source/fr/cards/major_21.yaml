imageryNote: >-
  Le Monde de Taro est imaginé comme une figure qui danse dans une grande couronne ovale de feuilles et de fleurs de toutes les saisons, se mouvant librement au centre d’un ciel étoilé. Autour de la couronne, quatre petits emblèmes du feu, de l’eau, de l’air et de la terre marquent les bords de la scène, suggérant l’équilibre et la plénitude. Un ruban qui s’échappe de la main de la figure revient à son point de départ, invitant à ressentir un sentiment d’arrivée et un voyage qui boucle la boucle.
