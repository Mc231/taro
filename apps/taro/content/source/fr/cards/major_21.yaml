shortUpright: >-
  Un cycle boucle peut-être la boucle. Cette carte vous invite à faire une pause pour honorer ce que vous avez accompli.
shortReversed: >-
  Quelque chose est peut-être presque terminé. Quelle dernière étape ou quel détail mérite votre attention ?
meaningUpright: |-
  Le Monde est la dernière carte des Arcanes majeurs, la fin du voyage commencé avec le Mat. C’est une carte d’accomplissement et de plénitude : le sentiment que les pièces se sont assemblées, qu’un cycle a été vécu jusqu’au bout, et que vous êtes, pour ce moment, chez vous dans l’histoire que vous avez vécue jusqu’ici.
  Dans la vie de tous les jours, cette carte peut refléter l’aboutissement d’un long projet, l’atteinte d’un objectif vers lequel vous avez travaillé, ou simplement le sentiment d’être bien dans votre vie et dans votre corps. Elle peut désigner l’intégration : rassembler les leçons de nombreuses expériences, les faciles comme les difficiles, en une perception de qui vous êtes. L’appartenance peut ici signifier appartenir à une communauté, à un lieu ou à soi-même.
  Cette carte vous invite à regarder ce que vous avez réalisé et à le célébrer. Vous pourriez vous demander comment vous avez changé depuis le début de ce cycle, et ce que vous aimeriez emporter dans le suivant. Le Monde rappelle que l’accomplissement n’est pas une fin au sens d’un arrêt. C’est un moment de plénitude avant qu’un nouveau voyage commence.
meaningReversed: |-
  Renversé, le Monde peut refléter un cycle presque achevé, mais pas tout à fait. Quelques détails à régler, un au revoir non dit ou une dernière tâche vous empêchent peut-être d’avoir le sentiment d’en avoir fini. Vous sentez peut-être que le moment de passer à autre chose est venu, alors que quelque chose vous retient encore.
  Cette carte peut aussi désigner la recherche d’une conclusion ailleurs, en cherchant des raccourcis ou en espérant que d’autres boucleront les choses à votre place.
  Vous pourriez identifier la ou les deux choses qui vous aideraient à vous sentir au bout du chemin. Il peut s’agir de terminer une tâche concrète, de remercier quelqu’un, de reconnaître une déception ou simplement de vous accorder le mérite du chemin parcouru. Faire ce dernier pas avec intention peut transformer une presque-fin en une vraie fin.
aspects:
  relationshipsUpright: >-
    Dans les relations, le Monde peut refléter un sentiment d’épanouissement et de compréhension mutuelle, comme si un lien avait trouvé sa pleine forme. Il peut vous inviter à apprécier ce que vous avez construit ensemble et à célébrer les étapes partagées. Les relations semblent ici complètes, avec de la place à la fois pour la proximité et pour la liberté de chacun.
  relationshipsReversed: >-
    Renversée, cette carte peut désigner quelque chose de non résolu dans une relation, une conversation inachevée ou un chapitre qui n’a pas été refermé. Vous pourriez vous demander ce qui vous aiderait tous les deux à trouver la paix, qu’il s’agisse de dire quelque chose ou d’accepter que cela a déjà été dit.
  workUpright: >-
    Au travail ou dans un projet, le Monde met en avant l’accomplissement et la reconnaissance. Il peut refléter l’achèvement d’un travail important, une étape franchie ou le sentiment que votre rôle vous correspond bien. Vous pourriez prendre le temps de reconnaître ce que vous et les autres avez réalisé avant de passer à la suite.
  workReversed: >-
    Renversé, le Monde peut refléter un projet bloqué à la dernière étape ou l’impression de ne pas tout à fait franchir la ligne d’arrivée. Vous pourriez lister ce qui reste à faire et décider si c’est vraiment nécessaire ou si vous pouvez y renoncer. Un petit effort concentré peut aider à conclure proprement.
  growthUpright: >-
    Avant de viser l’objectif suivant, il peut être utile de reconnaître le chemin parcouru. Vous pourriez réfléchir aux leçons, aux défis et aux joies d’un chapitre récent, et remarquer comment ils s’assemblent en une image plus complète de vous-même. L’intégration est une forme discrète d’accomplissement.
  growthReversed: >-
    Renversé, le Monde peut demander ce dont vous avez besoin pour vous sentir au bout du chemin. Il peut refléter un sentiment d’agitation ou d’inachevé. Vous pourriez nommer une chose que vous comptiez terminer depuis un moment et lui accorder toute votre attention, puis remarquer ce que vous ressentez en bouclant la boucle.
