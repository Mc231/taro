imageryNote: >-
  Cinq figures, chacune tenant un bâton, se tiennent tout près les unes des autres, leurs bâtons levés et entrecroisés. La scène est animée et un peu chaotique, et pourtant personne ne semble blessé, ce qui laisse planer le doute entre une vraie compétition et un jeu d’entraînement. L’enchevêtrement des bâtons peut symboliser des idées et des ambitions qui se poussent mutuellement, et l’espace ouvert autour d’elles suggère la possibilité de prendre du recul et de trouver un rythme commun.
