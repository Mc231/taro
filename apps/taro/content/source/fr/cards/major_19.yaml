imageryNote: >-
  Le Soleil de Taro est imaginé comme un vaste champ d’été à midi, où des amis de tous âges partagent un repas sur une couverture sous un immense soleil chaleureux. Des cerfs-volants montent dans la brise et aucune ombre longue n’est visible, suggérant un moment où il n’y a rien à cacher. Les jaunes vifs et les oranges chauds remplissent la scène, tandis qu’un chien qui court dans l’herbe ajoute une note de jeu. L’image invite à ressentir la chaleur, la clarté et une joie sans complication.
