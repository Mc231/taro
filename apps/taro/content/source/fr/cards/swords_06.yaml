imageryNote: >-
  Dans l’illustration originale, une petite barque glisse d’une eau ridée vers une rive calme et brumeuse. Six lames se dressent dans la barque comme une cargaison tranquille, et un passager assis regarde vers l’avant. Une longue perche pousse régulièrement à travers les hauts-fonds. L’eau changeante montre le passage de l’agitation au calme, les lames suggèrent des leçons emportées, et la perche évoque un mouvement patient, pas à pas.
