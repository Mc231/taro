imageryNote: >-
  L’illustration peut être centrée sur une seule pièce ou un disque tendu par une main ouverte, devant une terre cultivée : un portail de jardin, des haies basses, un chemin qui mène vers des collines. La pièce représente quelque chose de tangible et de possible, tandis que le portail suggère un seuil vers un espace qui demande encore des soins. Les verts doux et les tons de terre chauds peuvent souligner la patience, la croissance et la valeur tranquille de ce que l’on peut tenir.
