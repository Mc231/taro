imageryNote: >-
  Une figure marche penchée en avant, les bras serrés autour d’un haut fagot de dix bâtons qui lui cache presque le visage, en direction d’une petite maison ou d’un village à l’horizon. Le fagot représente les responsabilités accumulées, le visage caché la façon dont une lourde charge peut rétrécir le regard, et la destination proche une fin à portée de main. La route ouverte laisse imaginer que la charge puisse être partagée ou posée.
