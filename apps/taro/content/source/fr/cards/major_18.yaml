imageryNote: >-
  La Lune de Taro est imaginée comme une lune pâle à demi cachée par des nuages qui passent, au-dessus d’un sentier traversant de hauts roseaux au bord de l’eau. Le sentier scintille par endroits et disparaît ailleurs, si bien que l’on y avance lentement. Un héron immobile dans les eaux peu profondes peut suggérer une attention patiente, tandis que les rides à la surface de l’eau évoquent des émotions qui montent des profondeurs. La lumière argentée, les ombres douces et les contours flous invitent à faire confiance à ses sens lors d’un voyage incertain.
