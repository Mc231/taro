  Une figure se tient au crépuscule à l’intérieur d’un cercle de bâtons plantés dans le sol, appuyée sur l’un d’eux et regardant au loin d’un œil attentif. Un petit feu de camp brûle doucement à côté d’elle. Le cercle de bâtons suggère les défenses construites par l’expérience, le feu bas l’énergie encore entretenue après un long effort, et la lumière déclinante une journée qui touche à sa fin. La posture vigilante porte à la fois la lassitude et la persévérance qui continue d’avancer.
