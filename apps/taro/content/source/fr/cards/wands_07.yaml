imageryNote: >-
  Une seule figure se tient sur un terrain rocheux surélevé, les pieds posés de manière inégale, un bâton levé à deux mains tandis que six autres surgissent d’en bas. L’appui inégal suggère que la conviction n’est pas toujours confortable, et la hauteur montre un véritable point de vue gagné par l’effort. Les bâtons d’en bas peuvent représenter les défis, les questions et les voix concurrentes, et la prise ferme un courage ancré dans des valeurs.
