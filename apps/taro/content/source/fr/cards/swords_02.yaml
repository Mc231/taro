imageryNote: >-
  Dans l’illustration originale, une figure assise tient deux lames croisées contre sa poitrine, un tissu doux sur les yeux. Un pâle croissant de lune est suspendu bas au-dessus d’une eau calme et peu profonde parsemée de pierres. Les lames croisées forment une silhouette défensive, comme une porte gardée fermée. L’eau immobile et la lumière nocturne suggèrent des émotions qui reposent sous la surface, et les yeux couverts évoquent le choix de ne pas encore regarder.
