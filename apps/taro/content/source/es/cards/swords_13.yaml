imageryNote: >-
  En la ilustración original, una figura se sienta en un asiento de piedra tallada situado muy por encima de las nubes, con la espada recta en una mano y la otra abierta y tendida. Un único pájaro vuela en círculos en el aire despejado. La espada erguida sugiere discernimiento; la mano abierta, la justicia y la disposición a escuchar, y el pájaro solitario, una mente independiente que ve lejos.
