imageryNote: >-
  La Justicia de Taro se imagina como una figura serena y erguida que sostiene una balanza equilibrada a la altura del corazón y una hoja recta que apunta al cielo. La figura mira de frente a quien la observa, sugiriendo una honestidad sin nada oculto. Dos columnas sencillas y una cortina lisa al fondo mantienen la escena despejada, como si se abriera espacio para pensar con cuidado. Los azules fríos del aire y un único acento cálido pueden reflejar el encuentro entre la razón y la conciencia.
