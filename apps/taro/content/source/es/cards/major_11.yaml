shortUpright: >-
  Un momento para sopesar las cosas con honestidad y actuar de un modo que luego te guste poder explicar.
shortReversed: >-
  Quizá algo parezca desequilibrado. Esta carta te invita a mirarlo con claridad, incluida tu propia parte.
meaningUpright: |-
  La Justicia sostiene una balanza en una mano y una espada en la otra. La balanza representa sopesar las cosas con cuidado; la espada, la claridad para actuar una vez hecho. Esta carta habla de equidad, honestidad y responsabilidad sobre tus decisiones: comprender que los actos tienen consecuencias y que puedes elegirlos con cuidado.
  En la vida cotidiana, esta carta puede reflejar una decisión que pide la cabeza clara, como repartir tareas de forma justa, dar una opinión sincera o reconocer un error y repararlo. Puede señalar momentos en los que se te pide mirar una situación desde todos los ángulos antes de responder, y tratarte con la misma justicia con la que intentas tratar a los demás.
  Esta carta te invita a considerar cómo sería una respuesta equilibrada. Puedes preguntarte qué hechos importan, qué necesita cada persona implicada y de qué puedes hacerte responsable. La Justicia no predice cómo terminará ningún asunto formal. Destaca la integridad: actuar de acuerdo con lo que crees correcto y aceptar lo que venga después con la mente serena.
meaningReversed: |-
  Invertida, la Justicia puede reflejar la sensación de que algo es injusto o de que la balanza de una situación se ha inclinado. Quizá sientas que cargas con más de lo que te corresponde, o notes la tentación de no mirar tu propia parte en una dificultad.
  Esta carta también puede señalar que te juzgas con demasiada dureza, midiendo cada elección con un listón imposible. Asumir responsabilidades es útil; la autocrítica constante no es lo mismo.
  Quizá quieras escribir la situación de la forma más neutral posible, como si se la explicaras a una amistad ecuánime. ¿Qué te corresponde a ti y qué no? Buscar la equidad puede significar alzar la voz, reparar algo o simplemente soltar un juicio que se ha vuelto pesado de cargar.
aspects:
  relationshipsUpright: >-
    En las relaciones, la Justicia puede reflejar equilibrio y respeto mutuo: ambas personas dan y reciben de una forma que se siente justa. Puede invitarte a mirar con honestidad cómo se reparten las responsabilidades y los cuidados. Las conversaciones claras y amables sobre las expectativas pueden reforzar la confianza y evitar resentimientos silenciosos.
  relationshipsReversed: >-
    Invertida, esta carta puede señalar un desequilibrio, como que una persona asuma más trabajo emocional o práctico, o un conflicto en el que la culpa parece recaer en un solo lado. Puedes considerar cómo sería la equidad desde ambos puntos de vista y si una disculpa o un acuerdo más claro podría devolver el equilibrio.
  workUpright: >-
    En el trabajo o en un proyecto, la Justicia destaca la integridad, los procesos justos y las decisiones cuidadosas. Puede reflejar la revisión de un acuerdo de expectativas, dar una opinión equilibrada o sopesar las opciones por sus méritos. Puedes preguntarte qué elección podrías explicar abiertamente y con tranquilidad a todas las personas afectadas.
  workReversed: >-
    Invertida, la Justicia puede reflejar frustración ante un trato injusto o reglas poco claras. También puede señalar que se toman atajos bajo presión. Puedes anotar los hechos con calma, buscar el apoyo adecuado si hace falta y comprobar que tus propios actos están a la altura del estándar que te gustaría que otros cumplieran.
  growthUpright: >-
    Para el crecimiento personal, esta carta te invita a vivir según tus valores y a hacerte cargo de tus decisiones. Reflexionar sobre los efectos de tus actos, sin dureza, puede ayudarte a crecer. Puedes mirar una decisión reciente y preguntarte qué conservarías y qué podrías hacer de otra manera la próxima vez.
  growthReversed: >-
    Invertida, la Justicia puede preguntarte si te exiges un nivel mucho más estricto que el que exiges a los demás. Puede reflejar una culpa que persiste cuando la lección ya se ha aprendido. Puedes practicar una autoevaluación justa: nombrar tanto lo que salió mal como lo que salió bien.
