  relationshipsReversed: >-
    Invertida, la carta puede sugerir buenas intenciones que no se expresan, o distracciones que hacen que alguien cercano sienta menos tu atención. Puedes notar dónde se ha desviado tu atención. Un gesto pequeño y constante, como recordar un detalle o retomar una conversación, puede mostrar interés con más claridad que los grandes planes.
  workUpright: >-
    En el trabajo, la Sota de Oros puede describir una fase de aprendizaje: un puesto nuevo, una formación, un proyecto que amplía tus habilidades. Te invita a abordarla con diligencia y apertura. Puedes hacer preguntas meditadas, tomar notas y tratar cada tarea como práctica para la pericia que estás construyendo.
  workReversed: >-
    Aquí la carta puede reflejar procrastinación, falta de enfoque o dudas a la hora de asumir algo nuevo porque no te sientes con la preparación suficiente. Puedes dividir una meta que intimida en partes más pequeñas y elegir la siguiente. Pedir orientación o una primera tarea clara puede hacer que aprender resulte más llevadero.
  growthUpright: >-
    Para el crecimiento personal, esta carta te invita a seguir una curiosidad práctica. Aprender algo con las manos, como cocinar, reparar, dibujar o plantar, puede dar mucho arraigo. Puedes elegir un interés y darle un pequeño lugar regular en tu semana, notando qué se siente al crecer de forma constante.
