    Invertida, la carta puede reflejar la costumbre de esperar a sentir que es el momento, o de abandonar los intereses cuando se vuelven difíciles. Puedes volver a algo que dejaste a un lado y probar una versión más suave y más corta. Crecer no exige velocidad, solo la disposición a seguir volviendo.
