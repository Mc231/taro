imageryNote: >-
  El Loco de Taro se imagina al borde de un lugar elevado, con el cielo abierto por delante, en pleno paso y cargando solo un pequeño hatillo. Un pequeño animal que le sigue de cerca puede representar el instinto, juguetón o prudente. Una única flor blanca puede sugerir inocencia y apertura, mientras que el amplio horizonte y la luz de la mañana hablan de posibilidad. El rostro alzado de la figura invita a preguntarse hacia dónde mira y qué ha decidido no llevar consigo.
