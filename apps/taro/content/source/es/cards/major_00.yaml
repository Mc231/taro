shortUpright: >-
  Un paso hacia algo nuevo, dado con más curiosidad que certeza.
shortReversed: >-
  Una pausa al borde: ¿es prudencia o miedo a hacer el ridículo?
meaningUpright: |-
  El Loco está al comienzo mismo de los Arcanos mayores, con el número cero, antes de haber aprendido ninguna lección. Es la energía de quien se pone en camino con un equipaje ligero y el rostro abierto, con más interés por lo que el camino pueda mostrarle que por saber dónde termina.
  En la vida cotidiana, esta carta puede reflejar la primera semana en un lugar nuevo, una afición que empiezas sin intención de dominarla o una conversación que inicias sin ensayar cada frase. Puede señalar una parte de ti que tiene ganas de probar, aunque otra parte pida una certeza que nadie puede ofrecer. Aquí, no saber no es un defecto; es simplemente el punto donde empieza todo viaje.
  Esta carta te invita a considerar dónde te ayudaría un poco más de ligereza. ¿Qué cambiaría si te permitieras volver a ser principiante, hacer preguntas básicas y aprender haciendo? El Loco no te pide que ignores el sentido común. Te pide que notes si el miedo a equivocarte te está impidiendo dar cualquier paso.
meaningReversed: |-
  Invertido, el Loco puede mostrar la chispa de un nuevo comienzo que todavía no ha prendido del todo. Quizá sientas el impulso de algo nuevo mientras algo en ti permanece inmóvil, dándole vueltas a la idea y esperando una señal de que moverte es seguro. A veces esa espera es sabia; otras, se ha convertido en costumbre sin que te des cuenta.
  También puede reflejar la inclinación contraria: una energía que se lanza hacia delante sin mirar, que dice que sí a todo y deja poco espacio para notar dónde pisas. Ambas inclinaciones comparten una pregunta sobre la disposición y la confianza.
  Quizá quieras preguntarte cuál de las dos te resulta más cercana ahora. Si te estás conteniendo, ¿cuál sería una forma pequeña y de poco riesgo de tantear el terreno? Si vas a toda prisa, ¿cómo sería conservar tu entusiasmo y añadir un momento de pausa antes del próximo salto?
aspects:
  relationshipsUpright: >-
    En las relaciones, el Loco puede reflejar una cualidad juguetona y sin defensas: conocer a alguien sin guion o dejar que un vínculo conocido vuelva a sorprenderte. Puede invitarte a acercarte con curiosidad a las personas cercanas y a hacer preguntas cuya respuesta crees saber ya. Aquí la apertura no es ingenuidad; es la disposición a estar presente sin decidir de antemano cómo deben ir las cosas.
  relationshipsReversed: >-
    Invertida, esta carta puede señalar dudas a la hora de dejar entrar a alguien, o un ritmo tan rápido que la otra persona apenas puede seguirlo. Puedes observar si te proteges manteniéndote en lo vago o si te saltas las partes más lentas de conocer a alguien. Una conversación suave sobre el ritmo, el tuyo y el de la otra persona, podría abrir espacio para ambos.
  workUpright: >-
    En el trabajo o en cualquier proyecto, el Loco puede reflejar el inicio de algo desconocido: un nuevo puesto, un curso, una idea creativa que aún no tiene trayectoria. Te invita a tratar los primeros errores como información, no como veredictos. Puedes preguntarte qué probarías si el primer intento pudiera ser imperfecto, y quién podría ayudarte a aprender por el camino.
  workReversed: >-
    Invertido, el Loco puede reflejar una idea que se sigue aplazando hasta que las condiciones parezcan perfectas, o un salto dado sin comprobar lo básico. Puedes considerar si necesitas más información o simplemente más valor. Escribir el primer paso más pequeño posible, junto con una medida práctica de protección, puede convertir un deseo vago en algo que puedes poner a prueba sin jugártelo todo.
  growthUpright: >-
    Para el crecimiento personal, esta carta celebra la mente de principiante. Puede invitarte a probar algo en lo que no tengas ninguna reputación que proteger: una habilidad nueva, otro camino de vuelta a casa, una pregunta hecha en voz alta. Aquí el crecimiento viene de mantener la curiosidad y dejarte sorprender, no de hacerlo todo bien a la primera.
  growthReversed: >-
    Invertido, el Loco puede preguntarte si el miedo a parecer ridículo ha empezado a encoger tu mundo. También puede reflejar una inquietud que salta de una novedad a otra sin dejar que ninguna eche raíces. Puedes observar qué patrón te resulta familiar y experimentar durante una semana con su opuesto más amable.
