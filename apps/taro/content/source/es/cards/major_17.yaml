imageryNote: >-
  La Estrella de Taro se imagina como una escena nocturna en un jardín sobre una azotea, donde una figura riega plantas jóvenes con una jarra mientras una estrella brillante asoma por un hueco entre las nubes. Unos barriles de lluvia y un pequeño estanque recogen lo que el cielo devuelve. Las polillas que rodean un farol pueden representar pensamientos atraídos por la luz. Los azules fríos y los tonos plateados crean una sensación de calma, apertura y suave renovación después de la tormenta.
