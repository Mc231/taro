shortUpright: >-
  Quizá ya tengas más de lo que necesitas de lo que crees; esta carta pregunta qué quieres crear con ello.
shortReversed: >-
  Tus herramientas están sobre la mesa, pero tu atención quizá esté en otra parte. ¿Qué te ayudaría a reunirla?
meaningUpright: |-
  El Mago es la carta de convertir una idea en algo real. Donde el Loco sale sin nada planeado, el Mago se detiene, mira lo que tiene a su alcance y decide usarlo. La imagen tradicional de una mano alzada y otra señalando hacia abajo sugiere un puente entre la intención y la acción, entre lo que imaginas y lo que de verdad puedes hacer hoy.
  En la vida diaria, esta carta puede reflejar el momento en que un plan por fin tiene fecha, un tiempo reservado, un primer borrador. Puede señalar habilidades que sueles pasar por alto porque te salen con facilidad: un talento para explicar las cosas, para resolver pequeños problemas, para reunir a la gente. Aquí, el ingenio consiste en darte cuenta de que las piezas ya están sobre la mesa.
  Esta carta te invita a considerar adónde va tu atención. Enfocarse es un oficio; se puede practicar. Puedes preguntarte qué cosa te gustaría hacer realidad y cuál de las herramientas que ya tienes podría acercarla un paso. El Mago no promete resultados. Destaca el poder de presentarte con intención y de usar lo que tienes.
meaningReversed: |-
  Invertido, el Mago puede reflejar una capacidad que está presente pero aún sin usar. Quizá tengas las habilidades y las ideas, y aun así sientas que tu energía se escapa en demasiadas direcciones, o dudes de que tu aportación cuente. La mesa está puesta; las manos todavía no se mueven del todo.
  Esta carta también puede señalar un ingenio ligeramente desviado: usar el encanto o la palabra rápida para saltarte la parte del trabajo que parece aburrida, o mostrar una superficie de confianza mientras por dentro hay inseguridad. Ninguna de las dos cosas es un fallo moral. Ambas pueden ser señales de que la intención y la acción se han distanciado.
  Quizá quieras mirar dónde se está dividiendo tu atención. Elegir una tarea pequeña y concreta y terminarla puede reconstruir la confianza en tus propias manos. También puede ayudarte preguntarte qué harías de otra manera si nadie te estuviera mirando.
aspects:
  relationshipsUpright: >-
    En las relaciones, el Mago puede reflejar el poder de una comunicación clara y directa. Puede invitarte a decir lo que piensas y a actuar de forma coherente con tus palabras. Quizá notes cuánto puedes influir en el tono de un vínculo con pequeños gestos deliberados: un mensaje atento, un plan cumplido, una atención sin distracciones.
  relationshipsReversed: >-
    Invertida, esta carta puede preguntarte si las palabras y los actos encajan en un vínculo cercano, los tuyos o los de la otra persona. También puede reflejar que te guardas lo que de verdad piensas o que interpretas una versión de ti que crees que gustará. Puedes considerar qué cambiaría si dejaras que alguien viera tus intenciones reales, incluso las inciertas.
  workUpright: >-
    En el trabajo o en un proyecto, el Mago señala el encuentro entre la habilidad y la oportunidad. Puede invitarte a hacer inventario de tus capacidades, contactos y recursos, y a dirigirlos hacia un objetivo claro. Es una carta de empezar, presentar una idea, construir un prototipo o escribir por fin esa propuesta. Aquí importan el enfoque y la constancia, no tener todas las respuestas de antemano.
  workReversed: >-
    Invertido, el Mago puede reflejar un talento poco aprovechado, o un esfuerzo tan repartido que nada llega a cuajar. También puede señalar la tentación de exagerar o de tomar atajos. Puedes preguntarte qué tarea merece de verdad tu energía ahora y cómo sería trabajar en ella de forma honesta y constante durante los próximos días.
  growthUpright: >-
    Para el crecimiento personal, esta carta te invita a reconocer tu propia capacidad de acción. Puedes hacer una lista de las habilidades, los hábitos y los apoyos que ya tienes, y notar cómo podrían servir a algo que te importa. La práctica, la repetición y la intención clara son las herramientas discretas del Mago; las pequeñas decisiones diarias pueden sumar un cambio real con el tiempo.
  growthReversed: >-
    Invertido, el Mago puede reflejar una distancia entre la persona que sabes que podrías ser y los hábitos que estás viviendo. Puede preguntarte dónde la inseguridad te hace esperar un permiso. Puedes elegir una habilidad para practicarla abiertamente, aunque sea de forma imperfecta, y notar cómo la confianza crece al hacer, no al esperar a que llegue el momento ideal.
reflectionQuestions:
  - "¿Qué habilidades tuyas sueles dar por sentadas?"
  - >-
    ¿Dónde no terminan de coincidir ahora tus palabras y tus actos?
  - >-
    ¿Qué intención podrías poner en práctica hoy con lo que ya tienes?
imageryNote: >-
  El Mago de Taro se imagina al amanecer, en un puesto de mercado en un cruce de caminos, colocando cuatro objetos humildes para los cuatro palos: una rama verde, una copa de barro, un cuchillo para cortar pan y una sola moneda. Una mano se extiende hacia el puesto y la otra señala el cielo que se aclara, uniendo idea y acción. Hilos de luz entre los objetos sugieren la atención que une herramientas distintas en un solo propósito, y una hogaza a medio hacer insinúa que la creación acaba de empezar.
