meaningUpright: |-
  El Ermitaño camina sin compañía por un sendero de montaña, con un farol que ilumina solo los próximos pasos. Esta carta trata de apartarse del ruido para buscar tus propias respuestas. El Ermitaño no tanto se siente abandonado como tiene un propósito: el retiro tiene un motivo, y la luz se lleva consigo, no se espera.
  En la vida cotidiana, esta carta puede reflejar elegir una tarde tranquila frente a una ajetreada, dar un paseo sin compañía para pensar una decisión o pasar tiempo con un libro, un cuaderno o una labor que pide concentración. Puede señalar una etapa de revisar prioridades, en la que las opiniones ajenas importan menos que tu propia idea, lenta en formarse, de lo que es verdad para ti.
  Esta carta te invita a considerar qué estás buscando y si te has dado suficiente espacio para encontrarlo. Puedes preguntarte qué pregunta te llevarías a un largo paseo. El Ermitaño sugiere que la sabiduría suele llegar en destellos pequeños y constantes, como un farol que muestra el camino paso a paso, y que eso basta para seguir adelante.
meaningReversed: |-
  Invertido, el Ermitaño puede reflejar una soledad que ha durado más de lo que ayuda. El tiempo a solas puede ir convirtiéndose en retraimiento, y tender la mano a alguien se vuelve cada día más difícil. Quizá notes que tus pensamientos dan vueltas en círculo y no avanzan hacia nada.
  Esta carta también puede señalar lo contrario: llenar tanto tus días de tareas o de gente que no queda espacio para reflexionar. Evitar el silencio puede ser una forma de evitar una pregunta que aún no quieres afrontar.
  Quizá quieras ver cuál de los dos lados te resulta más cercano. Si has pasado mucho tiempo a solas, ¿cuál sería una forma pequeña y cómoda de volver a conectar con alguien? Si has estado evitando la quietud, ¿qué podrías aprender de diez minutos a solas con tus pensamientos? El farol sigue siendo tuyo para alzarlo.
aspects:
  relationshipsUpright: >-
    En las relaciones, el Ermitaño puede reflejar la necesidad de espacio para pensar y el valor de las personas que respetan esa necesidad. Puede invitarte a explicar con suavidad que apartarte es para reflexionar, no un rechazo. El tiempo a solas puede ayudarte a volver a los demás con más claridad sobre lo que quieres y lo que puedes ofrecer.
  relationshipsReversed: >-
    Invertida, esta carta puede señalar un retraimiento que otras personas viven como distancia, o una soledad de la que no has hablado. Puedes considerar si has estado esperando a que otra persona dé el primer paso. Un mensaje breve y sincero puede volver a abrir una puerta, aunque después sigas necesitando algo de calma.
  workUpright: >-
    En el trabajo o en los estudios, el Ermitaño destaca el trabajo profundo y concentrado y el pensamiento independiente. Puede ser un buen momento para investigar, escribir, planificar o aprender algo a fondo. Puedes proteger un tiempo sin interrupciones y notar qué ideas surgen cuando no estás respondiendo constantemente a los demás.
  workReversed: >-
    Invertido, el Ermitaño puede reflejar demasiado tiempo trabajando de forma aislada, o la falta de aportaciones que podrían ayudarte. También puede señalar que le das demasiadas vueltas a una decisión. Puedes pedir una mirada nueva a un colega o mentor de confianza y notar cómo compartir tus ideas puede afinarlas.
  growthUpright: >-
    Para el crecimiento personal, esta carta invita a practicar la soledad y la indagación interior. Escribir un diario, caminar o simplemente sentarte en calma con una pregunta puede ayudarte a entenderte mejor. Puedes pensar en tu propio farol como una comprensión que has ganado hace poco y dejar que ilumine tu próximo paso.
  growthReversed: >-
    Invertido, el Ermitaño puede preguntarte si te estás escondiendo de ti o de los demás. Puede reflejar la necesidad de equilibrar la reflexión con la conexión. Puedes planear esta semana un pequeño ritual de calma y un pequeño momento social, y notar cómo se siente cada uno. Aquí el equilibrio es personal; solo tú puedes sentir la mezcla adecuada.
