imageryNote: >-
  El Ermitaño de Taro se imagina como una figura con capa en una cresta alta y nevada al anochecer, sosteniendo un farol sencillo que ilumina solo los próximos pasos del sendero. Un bastón pulido por el uso sugiere el apoyo que da la experiencia. Las huellas en la nieve detrás muestran cuánto camino ha recorrido ya la figura. Los azules y grises fríos hablan de soledad y de aire limpio, mientras que el brillo cálido del farol muestra que la comprensión puede llevarse incluso al tramo más oscuro del camino.
