imageryNote: >-
  La ilustración original muestra diez espadas colocadas una junto a otra sobre el suelo llano, a la orilla de un lago oscuro, como herramientas dejadas al final de una larga jornada. El cielo nocturno pesa, pero una franja clara de luz dorada se extiende por el horizonte lejano. La hilera de espadas sugiere un ciclo terminado; el agua quieta, el agotamiento y el descanso, y el amanecer, que empieza otro día.
