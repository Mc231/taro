  - >-
    ¿Cómo podrías mostrar tu aprecio a alguien que sigue estando ahí para ti?
imageryNote: >-
  La ilustración empareja dos figuras, o dos manos, que alzan cada una una copa hacia la otra a través de un pequeño espacio. Entre ellas, un emblema compartido, como tallos entrelazados o dos peces, puede sugerir que el encuentro crea algo que ninguna de las dos sostiene en soledad. Los colores reflejados a cada lado pueden expresar igualdad, con un brillo suave donde las copas casi se tocan, como si la propia conexión desprendiera luz.
