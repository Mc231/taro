shortUpright: >-
  Un momento para notar dónde el cuidado fluye en ambas direcciones y qué hace que un vínculo se sienta equilibrado y vivo.
shortReversed: >-
  Quizá algo entre tú y otra persona se sienta desequilibrado; piensa qué pide de verdad cada parte.
meaningUpright: |-
  El Dos de Copas muestra a dos personas, o dos partes de una vida, que se encuentran de igual a igual y se ofrecen algo. Es una carta de reconocimiento: el alivio de sentir que te comprenden y el placer de comprender a alguien a cambio. El vínculo que describe puede ser romántico, pero también una amistad, una colaboración creativa, un lazo entre hermanos o una alianza de trabajo.
  Quizá reconozcas esta energía en una conversación en la que ambas personas escuchan, en una reconciliación tras un malentendido o en el acuerdo silencioso de dos personas que eligen seguir estando ahí la una para la otra. También puede reflejar la unión de dos partes de ti que tiraban en direcciones distintas.
  Esta carta te invita a notar dónde hay un dar y recibir genuino en tu vida y a honrarlo. La reciprocidad no significa llevar la cuenta. Significa que ambas personas se sienten libres de ofrecer, de recibir y de decir lo que necesitan.
meaningReversed: |-
  Invertido, el Dos de Copas puede señalar un vínculo que ha perdido el equilibrio. Quizá una persona dé más, o escuche menos, o simplemente dos personas hablen sin entenderse. No tiene por qué significar que algo esté roto; muchos vínculos pasan por etapas así.
  La carta también puede volverse hacia dentro y preguntarte cómo te alías contigo. ¿Tienes con tus propias necesidades la misma paciencia y justicia que intentas tener con las de otra persona?
  Puedes mirar una relación que se siente desigual y preguntarte qué espera de verdad cada persona, bajo el desacuerdo de la superficie. Una conversación tranquila y honesta, o un poco de distancia para ver con más claridad, puede ser más útil que intentar arreglarlo todo a la vez. El equilibrio es algo que las personas construyen juntas, intercambio a intercambio.
aspects:
  relationshipsUpright: >-
    En las relaciones, esta carta puede reflejar atracción mutua, amistad o una alianza en la que ambas personas se sienten vistas. Puede invitarte a notar los pequeños rituales que mantienen estable un vínculo: preguntar cómo está la otra persona, recordar lo que le importa, pedir perdón con sencillez. Puedes preguntarte qué es lo que más valoras de alguien cercano y si esa persona lo sabe.
  relationshipsReversed: >-
    Invertida, esta carta puede reflejar un vínculo en el que una persona carga con más peso emocional, o en el que un malentendido no se ha aclarado. Puedes considerar qué dirías si supieras que te van a escuchar con amabilidad. La reparación suele empezar con una frase sincera y la disposición a escuchar la respuesta sin defenderte de inmediato.
  workUpright: >-
    En el trabajo, el Dos de Copas puede señalar una colaboración prometedora, un colega de confianza o una relación con un cliente basada en el respeto. Puede invitarte a compartir el mérito, pedir opiniones y dejar los acuerdos lo bastante claros para que ambas partes se sientan seguras. Las buenas alianzas suelen crecer más de los valores compartidos que de las habilidades compartidas.
  workReversed: >-
    Invertido, la carta puede reflejar una relación de trabajo con expectativas no dichas o desiguales. Quizá una persona dé por hecho un acuerdo que no existe. Puedes nombrar lo que cada parte espera, con palabras sencillas, y comprobar si sus papeles siguen encajando. La claridad puede ser una amabilidad, aunque al principio la conversación resulte incómoda.
  growthUpright: >-
    Aquí el tema del crecimiento es la alianza interior, una ocasión para reconciliar partes de ti: lo que quieres y lo que valoras, o tu lado práctico y tu lado tierno. Puedes escribir un breve diálogo entre dos voces dentro de ti y ver en qué coinciden ya. La integración puede sentirse como encontrar alianza dentro de ti.
  growthReversed: >-
    Invertido, esta carta puede preguntarte si dependes de otras personas para un equilibrio que también podrías construir por dentro. Puedes notar dónde buscas aprobación antes de confiar en tu propio criterio. Tratarte con la misma justicia que ofreces a una amistad cercana puede ser una práctica que da estabilidad, una pequeña elección cada vez.
reflectionQuestions:
