shortUpright: >-
  El buen trabajo suele crecer entre personas. Nota cómo podrían encajar distintas habilidades en algo que te importa.
shortReversed: >-
  Quizá un esfuerzo compartido tire en direcciones distintas. Podría ayudar revisar funciones, planes y cómo se escuchan.
meaningUpright: |-
  El Tres de Oros es una carta de construir con otras personas. Tres monedas encajadas en una estructura sugieren una obra que nadie podría dar forma en solitario: una persona aporta el diseño, otra los materiales, otra unas manos firmes. Lo que destaca no es el rango, sino el respeto por lo que aporta cada cual.
  En la vida cotidiana, esto puede aparecer como un proyecto de equipo que por fin encaja, un vecino que te ayuda a arreglar algo, un grupo de estudio o un mentor cuyas observaciones afinan tu habilidad. También puede reflejar la satisfacción de que se reconozca tu parte y de reconocer la de los demás.
  Esta carta te invita a considerar dónde la colaboración podría llevar tu trabajo más allá de lo que lograrías por tu cuenta. Puedes preguntarte qué conocimientos complementan los tuyos, cómo podrías compartir un plan con claridad y cómo recibes las aportaciones. El oficio se profundiza cuando la gente está dispuesta a mirar el mismo plano y mejorarlo en equipo.
meaningReversed: |-
  Invertido, el Tres de Oros puede señalar un esfuerzo compartido que ha perdido su plan común. Quizá la gente trabaje mucho, pero hacia imágenes ligeramente distintas, o las funciones sean vagas, de modo que algunas tareas se duplican y otras se quedan sin hacer. También puede reflejar la tendencia a hacerlo todo sin ayuda, quizá porque pedirla parece más lento o menos seguro.
  Es una invitación a revisar el plano, no a buscar culpables. El desajuste es habitual, y nombrarlo pronto suele costar menos que seguir adelante sin más.
  Puedes proponer una conversación breve sobre los objetivos y quién hace qué, o escribir el plan donde todo el mundo pueda verlo. Si tiendes a trabajar sin contar con el resto, piensa en una parte que podrías delegar y nota qué cambia cuando otra persona suma su habilidad a la tuya.
aspects:
  relationshipsUpright: >-
    En los vínculos cercanos, esta carta puede reflejar el trabajo en equipo de la vida diaria: planear una mudanza, repartir las tareas de casa, apoyar los proyectos de cada cual. Puedes notar en qué se diferencian sus fortalezas y cómo eso puede ser un regalo y no un roce. Decir en voz alta lo que valoras de cómo contribuye alguien puede reforzar la base que están construyendo.
  relationshipsReversed: >-
    Invertida, la carta puede sugerir que tú y alguien cercano trabajan hacia imágenes distintas de una misma meta, o que una persona carga con más parte de lo práctico. En vez de llevar la cuenta, podrían sentarse a comparar expectativas. Aclarar quién se ocupa de qué puede aliviar la tensión y ayudar a que ambas personas se sientan vistas.
  workUpright: >-
    En el trabajo, esta carta destaca la colaboración y el oficio. Puede reflejar un proyecto en el que una comunicación clara y un respeto mutuo dejan ver las habilidades de cada persona. Puedes buscar ocasiones de pedir opiniones, compartir lo que sabes o reunir a personas cuyas capacidades encajan bien. La calidad suele subir cuando el plan se comparte.
  workReversed: >-
    Aquí la carta puede señalar funciones poco claras, malentendidos o un equipo que tira en direcciones distintas. También puede reflejar que trabajas sin apoyo en algo que se beneficiaría de otras miradas. Puedes proponer una breve puesta en común de objetivos y responsabilidades, o pedir a un colega que revise tu enfoque antes de seguir.
  growthUpright: >-
    Para el crecimiento personal, el Tres de Oros puede invitarte a aprender con otras personas y de ellas. Un maestro, un taller, alguien con quien practicar o una comunidad en línea podrían ayudarte a afinar una habilidad. Puedes notar qué se siente al ser principiante entre gente que sabe más y cuánto tienes tú que ofrecer a cambio.
  growthReversed: >-
    Invertido, la carta puede reflejar reticencia a que te vean mientras aún aprendes, o la costumbre de descartar las opiniones ajenas. Puedes explorar qué hace difícil recibir aportaciones. Elegir a una persona de confianza a quien enseñar un trabajo sin terminar puede convertir el aprendizaje en un proceso compartido y no en un examen solitario.
reflectionQuestions:
  - >-
    ¿Qué habilidades tuyas disfrutas ofreciendo a un esfuerzo compartido?
  - >-
    ¿La mirada de quién podría reforzar algo que estás construyendo ahora?
  - >-
    ¿Qué parte del plan se beneficiaría de escribirse y compartirse?
imageryNote: >-
  La ilustración puede situar a tres figuras alrededor de una estructura sin terminar, como un arco, un banco de trabajo o un armazón elevado, cada una ocupada en una tarea distinta. Una sostiene un plano, otra trabaja el material, otra sujeta o evalúa. Tres monedas integradas en la propia estructura pueden sugerir que el valor se crea mediante la cooperación. Los andamios, las herramientas y el espacio abierto alrededor de la obra insinúan que el trabajo sigue en marcha y abierto a mejoras.
