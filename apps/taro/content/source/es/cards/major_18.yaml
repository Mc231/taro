imageryNote: >-
  La Luna de Taro se imagina como una luna pálida, medio oculta por nubes a la deriva, sobre un sendero entre juncos altos junto a la orilla. El sendero brilla en algunos tramos y desaparece en otros, así que quien camina avanza despacio. Una garza inmóvil en las aguas poco profundas puede sugerir una atención paciente, mientras que las ondas en el agua insinúan sentimientos que suben desde abajo. La luz plateada, las sombras suaves y los bordes difuminados invitan a confiar en los sentidos en un viaje incierto.
