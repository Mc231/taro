imageryNote: >-
  Una figura joven está de pie en un paisaje abierto, sosteniendo un bastón erguido y mirando con fascinación un brote fresco que nace de su madera. La ropa puede llevar pequeños motivos de llamas o salamandras que aluden al elemento fuego. El bastón con brotes representa una idea viva que crece; la mirada de asombro, la curiosidad, y la tierra abierta, las muchas direcciones que aún esperan ser exploradas.
