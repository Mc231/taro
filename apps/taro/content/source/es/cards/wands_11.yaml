shortUpright: >-
  Una energía curiosa y juguetona quiere explorar; sigue lo que te entusiasma y permítete ser principiante.
shortReversed: >-
  Quizá el entusiasmo salte entre muchas cosas o lo frene la duda; podrías elegir una y explorarla con calma.
meaningUpright: |-
  La Sota de Bastos es la aprendiz entusiasta del fuego. Sostiene un bastón con brotes y lo mira con fascinación; representa la curiosidad antes de la pericia: la alegría de descubrir algo nuevo y querer saber más.
  Esta energía puede aparecer como apuntarte a una clase por capricho, leer todo lo que encuentras sobre un nuevo interés o contar a tus amistades una idea que acabas de tener. También puede ser un mensaje o una invitación que abre la puerta a algo desconocido. Aquí hay juego y disposición a que te vean intentarlo.
  Esta carta te invita a acercarte a la vida con la apertura de quien empieza. No necesitas saber adónde lleva un interés para explorarlo. Puedes darte permiso para experimentar sin la presión de hacerlo bien desde el principio y notar cómo se siente esa libertad. A veces las pasiones más duraderas empiezan como preguntas pequeñas y juguetonas.
meaningReversed: |-
  Invertida, la Sota de Bastos puede reflejar una curiosidad que no encuentra dónde posarse. Quizá saltes de un interés a otro, empezando proyectos con ilusión y dejándolos cuando pasa la novedad. O quizá la curiosidad esté ahí, pero la frene el miedo a mostrar inexperiencia.
  Esta carta también puede describir ideas que aún se están formando: chispas que necesitan más tiempo antes de compartirse.
  Puedes explorar qué hay detrás de la inquietud o de la duda. ¿Aburrimiento, miedo al compromiso o miedo a no estar todavía a la altura? Un camino puede ser elegir un solo interés y ponerle una meta pequeña y sin presión. Otro es permitirte disfrutar de explorar sin necesidad de que lleve a ninguna parte en concreto.
aspects:
  relationshipsUpright: >-
    En las relaciones, esta carta puede reflejar una curiosidad nueva por alguien: ganas de conocer más a esa persona, probar cosas nuevas en compañía o compartir una energía juguetona. También puede traer ligereza a un vínculo conocido. Puedes hacerle a alguien cercano una pregunta que nunca le has hecho, o proponer una actividad que ninguna de las dos personas haya probado.
  relationshipsReversed: >-
    Invertida, la ilusión en una relación quizá llegue a ráfagas y se apague rápido, o quizá te dé vergüenza mostrar entusiasmo. Puedes notar si buscas novedad más que profundidad. Dejar ver tu interés genuino, aunque sea en pequeños gestos, puede invitar a la otra persona a responder con la misma apertura.
  workUpright: >-
    En el trabajo o en los estudios, la Sota de Bastos puede señalar una fase de aprendizaje: una habilidad nueva, un puesto reciente o una idea que tienes ganas de probar. Aquí el entusiasmo es un activo. Puedes hacer preguntas con libertad, ofrecerte para algo desconocido y tratar los primeros errores como parte del proceso y no como un veredicto sobre tu capacidad.
  workReversed: >-
    Invertida, quizá tengas muchas ideas y poca continuidad, o no sepas bien hacia dónde dirigir tu energía. Puedes elegir un proyecto y llevarlo un paso más lejos de lo habitual. Hablar con un mentor o un colega también puede ayudar a convertir una chispa dispersa en una dirección más clara.
  growthUpright: >-
    La Sota de Bastos te propone una tarea sencilla: reconectar con tu curiosidad. ¿Qué te encantaba explorar cuando no había presión por lograr nada? Puedes reservar tiempo esta semana para un experimento lúdico y tratar lo que descubras como información útil sobre lo que te da energía.
  growthReversed: >-
    Invertida, la timidez o una mente inquieta quizá te impidan profundizar. Puedes explorar qué significaría quedarte con un interés un poco más de lo que te resulta natural y permitirte que se note que eres principiante. La profundidad a menudo llega justo después del momento en que normalmente pasarías a otra cosa.
