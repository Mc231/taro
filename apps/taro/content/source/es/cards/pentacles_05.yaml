imageryNote: >-
  La ilustración puede mostrar a dos figuras que avanzan bajo la nieve o la lluvia junto a un muro, con la cabeza inclinada contra el mal tiempo, mientras sobre ellas brilla una ventana con cinco monedas integradas en su diseño. El contraste entre el camino frío y la ventana iluminada puede simbolizar la dificultad junto a un refugio cercano. La posición de la ventana, algo fuera de la vista de las figuras, sugiere un apoyo que está presente pero que aún no se ha notado ni buscado.
