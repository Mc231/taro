shortUpright: >-
  El valor no siempre ruge. A veces se parece a la paciencia, la amabilidad y quedarse con algo difícil.
shortReversed: >-
  Quizá tu firmeza interior se sienta frágil ahora. La amabilidad contigo podría ser un buen punto de partida.
meaningUpright: |-
  La Fuerza es una carta de valor, pero no del valor ruidoso. Su imagen tradicional muestra a una figura que apoya con calma la mano sobre un león, sin someterlo, calmándolo. Aquí la fuerza nace de la paciencia, la calidez y una presencia firme capaz de recibir una energía salvaje, ajena o propia, sin entrar en pánico.
  En la vida cotidiana, esta carta puede reflejar mantener la calma en una conversación tensa, cumplir una promesa cuando se ha vuelto incómoda o quedarte con un sentimiento intenso el tiempo suficiente para entenderlo antes de actuar. Puede señalar la confianza serena de quien no necesita demostrar nada. Domar al león tiene menos que ver con reprimirlo y más con ganarse su amistad.
  Esta carta te invita a considerar cómo respondes a la presión. Puedes preguntarte dónde la compasión, también hacia ti, podría ser más eficaz que la fuerza. La Fuerza sugiere que la suavidad y la firmeza pueden convivir, y que el valor más duradero suele ser constante, amable y persistente.
meaningReversed: |-
  Invertida, la Fuerza puede reflejar un momento en que tu estabilidad habitual cuesta más de encontrar. Quizá la paciencia se agote enseguida, o quizá oigas una voz interior más afilada y crítica de lo normal. El león está inquieto, y tú también.
  Esta carta también puede señalar un valor que se ha vuelto hacia dentro y aún no se expresa: quizá tengas más fuerza de la que sientes, pero las dudas te han dificultado mostrarla. O puede reflejar el esfuerzo de sostenerlo todo a base de pura voluntad, algo que tiende a desgastarse.
  Quizá quieras notar cómo te hablas cuando las cosas se ponen difíciles. ¿Qué cambiaría si usaras el tono que usarías con una amistad asustada? Reconstruir el valor suele empezar con pequeños gestos de amabilidad hacia ti y con pedir apoyo cuando la carga pesa.
aspects:
  relationshipsUpright: >-
    En las relaciones, la Fuerza puede reflejar una paciencia y una calidez que ayudan a que la gente se sienta segura contigo. Puede invitarte a recibir los estados de ánimo difíciles de alguien con calma, sin igualar su intensidad, mientras mantienes tus propios límites. Una firmeza amable puede construir confianza con el tiempo.
  relationshipsReversed: >-
    Invertida, esta carta puede señalar poca paciencia, o a alguien que se traga sus sentimientos para evitar el conflicto. Puedes considerar si te estás tratando con demasiada dureza, a ti o a alguien cercano. Hablar con amabilidad, antes de que la frustración se acumule, puede proteger el vínculo y tu propia estabilidad.
  workUpright: >-
    En el trabajo o en un proyecto, la Fuerza destaca la perseverancia y la madurez emocional. Puede reflejar el manejo de una tarea o una persona exigente con paciencia y elegancia, o liderar a base de ánimo, no de presión. Puedes confiar en que el esfuerzo constante y regular cuenta, aunque nadie esté mirando.
  workReversed: >-
    Invertida, la Fuerza puede reflejar el desgaste de la presión, o dudas sobre tu capacidad para afrontar un reto. También puede señalar reacciones bruscas bajo estrés. Puedes preguntarte qué apoyo o descanso te ayudaría a recuperar el equilibrio y cómo marcar un ritmo que puedas sostener.
  growthUpright: >-
    La Fuerza sugiere hacer amistad con tu propio león interior en vez de enjaularlo: los sentimientos intensos, los deseos y los instintos que te hacen ser quien eres. Sin luchar contra ellos, puedes sentir curiosidad por lo que necesitan. Aquí la autocompasión no es debilidad; es una práctica que hace el valor más sostenible.
  growthReversed: >-
    Invertida, la Fuerza puede recordarte que la confianza puede bajar y volver. Puede reflejar una racha de inseguridad o de dura crítica interior. Puedes guardar una breve lista de momentos en los que supiste afrontar las cosas y leerla en los días difíciles, como prueba de la estabilidad que ya tienes.
