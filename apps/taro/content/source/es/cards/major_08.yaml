imageryNote: >-
  La Fuerza de Taro se imagina como una figura serena arrodillada en un prado soleado junto a un gran león, con una mano apoyada en su melena mientras el animal se inclina hacia ella, relajado y confiado. No aparecen cuerdas ni cadenas; el vínculo se muestra a través de la cercanía y la tranquilidad. Las flores silvestres que crecen alrededor de ambos sugieren que la paciencia deja florecer cosas más delicadas. Una cálida luz dorada mantiene la escena en paz, mostrando el poder y la delicadeza uno junto al otro.
