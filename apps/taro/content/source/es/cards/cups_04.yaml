imageryNote: >-
  La ilustración sitúa a una figura sentada bajo un árbol o junto a un agua quieta, con los brazos cruzados y la mirada baja hacia tres copas en el suelo. Una cuarta copa se acerca llevada por la brisa o flota en la superficie del agua, fácil de pasar por alto. Los colores apagados y la postura cerrada pueden sugerir introspección y necesidad de pausa, mientras la copa ofrecida mantiene a la vista un hilo de posibilidad.
