  relationshipsReversed: >-
    Invertida, el Siete de Espadas puede señalar verdades que salen a la luz o el deseo de más transparencia con alguien cercano. Quizá sientas que es momento de decir lo que te has guardado. Si otra persona se abre contigo, escuchar sin juzgar de inmediato puede hacer posible la reparación. La confianza suele crecer cuando la honestidad se recibe con cuidado.
  workUpright: >-
    En el trabajo, esta carta puede reflejar que sorteas un sistema en vez de pasar por él, que te atribuyes méritos en silencio o que cargas con una tarea sin ayuda para no coordinarte con otras personas. El ingenio tiene valor. Puedes preguntarte si tu enfoque se sostendría si todo el mundo pudiera verlo, y si una conversación directa te llevaría más lejos con menos esfuerzo.
  workReversed: >-
    Invertido, esta carta puede sugerir replantear una estrategia que depende de que nadie se dé cuenta, o compartir por fin una información que te guardabas. Puedes pedir ayuda con algo que has sacado adelante a duras penas sin apoyo. Hablar pronto de un atajo o de un error puede ser mucho más fácil que gestionarlo más tarde.
  growthUpright: >-
    Para el crecimiento personal, el Siete de Espadas te invita a mirar cuándo vas por libre y por qué. La autosuficiencia puede ser una fortaleza, y también una forma de evitar la vulnerabilidad. Puedes notar las situaciones en las que eliges la astucia frente a la franqueza, y experimentar con pedir con sencillez lo que quieres.
