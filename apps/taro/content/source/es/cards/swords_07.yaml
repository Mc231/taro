imageryNote: >-
  La ilustración original muestra a una figura que cruza de puntillas un campo iluminado por la luna, cargando un montón de espadas mientras unas pocas quedan clavadas en la hierba detrás. A lo lejos brillan suavemente unas tiendas, ajenas a todo. Un rastro de huellas muestra el camino recorrido. La brazada de espadas sugiere asumir más de lo que se ofrecía; las que quedan, lo que no se puede cargar, y la mirada atrás, la inquietud de actuar sin que nadie mire.
