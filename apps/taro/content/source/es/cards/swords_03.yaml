imageryNote: >-
  La ilustración original muestra tres hojas finas apoyadas contra una piedra con forma de corazón, bajo un cielo gris y bajo. Una lluvia suave cae a su alrededor, y un tenue claro de luz aparece en el borde de las nubes. La piedra sugiere el peso de la pena, mientras la lluvia apunta a las lágrimas y a la liberación. La luz lejana insinúa que las tormentas pasan, sin prometer cuándo.
