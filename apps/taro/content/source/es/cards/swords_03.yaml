shortUpright: >-
  Quizá un momento triste o doloroso pida ser sentido y no explicado; la pena puede honrarse con suavidad.
shortReversed: >-
  Quizá la parte más aguda de una herida esté cediendo; puedes notar qué te ayuda a respirar con un poco más de libertad.
meaningUpright: |-
  El Tres de Espadas habla de la pena: el dolor de una decepción, una pérdida o unas palabras que cayeron con fuerza. No dice cuánto dura el sentimiento ni qué lo causó. Simplemente reconoce que algunos momentos duelen y que ese dolor es real.
  Quizá reconozcas esta carta en una conversación que te dejó con el ánimo sacudido, en una noticia que cambió tu forma de ver algo o en un duelo que vuelve una tarde cualquiera. También puede reflejar el escozor de entender una verdad que esperabas que no fuera así. A menudo la mente pensante quiere analizar el dolor, encontrar la razón y arreglarlo rápido.
  Esta carta te invita con suavidad a dejar que el sentimiento sea un sentimiento. La lluvia cae y luego pasa; la tristeza puede moverse de forma parecida cuando se le permite. Quizá quieras darte amabilidad, tiempo y la compañía de personas que sepan escuchar sin meterte prisa. Si los sentimientos pesados persisten, hablar con alguien de confianza o con un profesional cualificado puede ayudar. ¿Qué significaría tratar tu propia pena como tratarías la de una amistad?
meaningReversed: |-
  Invertido, el Tres de Espadas puede reflejar el lento alivio de una herida. Quizá la tormenta se esté alejando, aunque el suelo siga mojado. Quizá notes que vuelven pequeños momentos de ligereza, o que puedes hablar de lo que pasó con algo más de serenidad.
  Otra lectura es una pena vuelta hacia dentro: un dolor sostenido con fuerza y sin compartir, quizá porque parece demasiado íntimo o porque los demás parecen esperar que ya estés bien. El dolor que se calla puede durar más de lo necesario.
  Esta carta te invita a notar qué te ayuda a soltar, aunque sea un poco. Puede ser escribir, pasar tiempo al aire libre, una conversación de confianza o simplemente permitirte sentir tristeza sin fecha límite. No hay un ritmo correcto para recuperarse de un momento doloroso. ¿Qué gesto amable podrías ofrecerte hoy?
aspects:
  relationshipsUpright: >-
    En las relaciones, esta carta puede reflejar sentimientos heridos: una palabra dura, una decepción o una distancia dolorosa entre tú y alguien cercano. No dice de quién es la culpa. Puedes considerar dar espacio al sentimiento antes de decidir qué significa. Cuando sientas que es el momento, compartir la herida con calma y escuchar la versión de la otra persona puede ayudar a ambas personas a entender lo que pasó.
  relationshipsReversed: >-
    Invertida, el Tres de Espadas puede sugerir una herida que empieza a aliviarse entre personas, o una que aún se guarda en silencio. Quizá sea posible una disculpa, o quizá el paso más sano sea simplemente aceptar. Puedes preguntarte qué necesitas para sentir paz, incluya o no a la otra persona. El perdón, si llega, puede llegar a su propio tiempo.
  workUpright: >-
    En el trabajo o en un proyecto, esta carta puede reflejar una decepción: una crítica que dolió, un plan que no salió adelante o un contratiempo tras un esfuerzo real. Está bien sentirlo. Puedes permitirte una pausa antes de responder y, cuando pase la primera ola, buscar la parte útil del mensaje. Tu valía es mayor que un solo resultado.
  workReversed: >-
    Invertido, esta carta puede señalar la recuperación de un contratiempo profesional, o una frustración que llevas en silencio. Puedes notar si una vieja decepción sigue influyendo en cómo afrontas las tareas nuevas. Nombrarla, quizá con un colega o mentor de confianza, puede aflojar su peso y ayudarte a volver a tu trabajo con energía renovada.
  growthUpright: >-
    Para el crecimiento personal, el Tres de Espadas te invita a practicar la ternura hacia tu propio dolor. La pena forma parte de ser humano, no es una señal de que algo vaya mal en ti. Puedes explorar formas sencillas de cuidarte cuando tengas el ánimo bajo: descanso, movimiento, consuelos conocidos y personas que te dejen ser como eres.
  growthReversed: >-
    Invertido, esta carta puede reflejar que aprendes a soltar lo que duele a un ritmo que se siente seguro. Puedes notar dónde has estado conteniendo la respiración, literal o figuradamente. Soltar un suspiro, unas lágrimas o unas frases sinceras en un diario puede ser un pequeño acto de liberación. La recuperación rara vez es una línea recta, y no pasa nada.
reflectionQuestions:
