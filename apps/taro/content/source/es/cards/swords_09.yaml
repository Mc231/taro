imageryNote: >-
  La ilustración original muestra a una figura incorporada en la cama, con las rodillas recogidas, en una habitación oscura iluminada solo por una fina franja de luz de luna en la ventana. Nueve espadas cuelgan en filas ordenadas en la pared de detrás, sin tocar nunca a la figura. Una manta doblada y una pequeña lámpara esperan cerca, apagadas. Las filas de espadas sugieren pensamientos que dan vueltas, mientras que la lámpara y la ventana insinúan que el consuelo y la mañana están cerca.
