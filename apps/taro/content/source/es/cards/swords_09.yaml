    Invertido, esta carta puede sugerir que la presión en el trabajo cede, o la decisión de hablar por fin con alguien sobre una carga que pesa demasiado. Puedes pedir claridad donde la incertidumbre alimenta tu preocupación. Contar una inquietud a un colega o a tu responsable puede convertir una carga privada en un problema compartido con opciones prácticas.
  growthUpright: >-
    Para el crecimiento personal, el Nueve de Espadas te invita a notar tu relación con la preocupación. ¿Cuándo empieza tu mente a entrar en espiral y qué la ayuda a frenar? Puedes experimentar con una breve rutina de noche que marque el final del día. La amabilidad con tus pensamientos ansiosos, en vez de luchar contra ellos, puede aflojar su fuerza.
