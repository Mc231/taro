shortUpright: >-
  Dos opciones se equilibran por ahora; puedes notar qué estás dejando fuera de la vista para mantener la paz.
shortReversed: >-
  Quizá la pausa esté terminando; algo que evitaste mirar podría estar pidiendo una mirada suave y honesta.
meaningUpright: |-
  El Dos de Espadas describe una posición sostenida entre dos caminos. Ninguna opción es claramente la correcta, así que las mantienes en equilibrio, con los brazos cruzados, esperando. Puede ser una pausa sabia, un momento para respirar antes de elegir. También puede ser una forma de no mirar algo que aclararía la elección.
  Quizá reconozcas esta carta en una decisión que sigues aplazando, en un desacuerdo en el que has decidido no tomar partido o en una tregua contigo sobre una pregunta que aún no quieres afrontar. La calma en la superficie puede esconder mucho esfuerzo debajo; mantener quietas dos cosas pesadas cansa.
  Esta carta te invita a considerar qué está protegiendo esa quietud. ¿Te da tiempo para reunir información, o te aparta de información que ya tienes? Quizá quieras nombrar cada opción con sencillez, incluido lo que sientes por ella, no solo lo que piensas. A veces el equilibrio cambia en cuanto se deja salir a la luz un sentimiento oculto, y el siguiente paso resulta más fácil.
meaningReversed: |-
  Invertido, el Dos de Espadas puede reflejar un punto muerto que empieza a aflojarse. La venda se desliza; algo que evitabas quizá esté apareciendo a la vista, te sientas con fuerzas o no. Esto puede traer alivio, y también una oleada de sentimientos que habías dejado a un lado.
  Otra lectura es que el equilibrio pase de muy poco movimiento a demasiada presión: otras personas que te empujan a elegir antes de que hayas tenido tiempo de pensar, o una decisión tomada deprisa solo para acabar con la incomodidad de esperar.
  Puedes preguntarte qué sabes ahora que antes no te permitías saber. No hace falta saltar; puedes asimilar la nueva vista despacio. ¿Qué elección se ve distinta cuando te permites verla del todo, y cómo sería un siguiente paso meditado desde aquí?
aspects:
  relationshipsUpright: >-
    En las relaciones, esta carta puede señalar un pulso silencioso: dos personas que evitan un tema para mantener la calma, o tú guardándote tu opinión para mantenerte neutral entre otras. Una paz mantenida así puede sentirse frágil. Puedes considerar si una conversación amable y honesta podría sustituir al silencio cuidadoso, y qué te gustaría decir si no tuvieras que vigilar ambos lados a la vez.
  relationshipsReversed: >-
    Invertida, el Dos de Espadas puede reflejar el fin de una tregua. Quizá afloren sentimientos que estaban guardados, o alguien te pida que digas por fin dónde estás. Puede resultar incómodo, y también puede abrir espacio a más honestidad. Quizá quieras compartir lo que has estado guardando en partes pequeñas y claras, no todo de golpe.
  workUpright: >-
    En el trabajo, esta carta puede reflejar una decisión en pausa: dos enfoques, dos ofertas que piden tu tiempo o dos prioridades que parecen igual de urgentes. Esperar puede ser sensato si necesitas más datos. Puedes hacer una lista de lo que te pediría y te daría cada opción, y notar qué lista evitas mirar. Esa reticencia también puede ser información útil.
  workReversed: >-
    Invertido, la elección estancada quizá vuelva a moverse, a veces porque un plazo o un detalle nuevo obliga a plantear la pregunta. Quizá sientas prisa. Puede ayudar separar lo que de verdad hay que decidir hoy de lo que puede esperar un poco más. Si has estado evitando una información, este puede ser el momento de mirarla de frente y dejar que te guíe.
  growthUpright: >-
    Para el crecimiento personal, el Dos de Espadas te invita a notar cómo te proteges de los sentimientos difíciles quedándote en quietud. La quietud puede ser reparadora; también puede ser una forma de no sentir. Puedes probar a quedarte unos minutos con cada opción y prestar atención a la respuesta de tu cuerpo además de a tu razonamiento. Ambas formas de saber importan.
  growthReversed: >-
    Invertido, esta carta puede reflejar un punto de inflexión en la honestidad contigo. Algo que mantenías a distancia está ahora más cerca. Puedes acercarte con curiosidad y sin juicio, asimilándolo a tu ritmo. Abrir los ojos no significa que debas actuar enseguida; significa que eliges ver con claridad antes de decidir.
reflectionQuestions:
  - >-
    ¿Qué estás dejando fuera de la vista para que una decisión siga en equilibrio?
  - >-
    ¿Dónde mantienes una paz cuidadosa entre personas y qué te cuesta?
  - >-
    ¿Qué hecho o sentimiento podrías permitirte mirar esta semana?
imageryNote: >-
  En la ilustración original, una figura sentada sostiene dos hojas cruzadas junto al pecho, con un paño suave sobre los ojos. Una luna creciente pálida cuelga baja sobre un agua tranquila y poco profunda salpicada de piedras. Las hojas cruzadas forman una figura defensiva, como una puerta que se mantiene cerrada. El agua quieta y la luz nocturna sugieren emociones que descansan bajo la superficie, y los ojos cubiertos apuntan a la elección de no mirar todavía.
