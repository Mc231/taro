  relationshipsReversed: >-
    Invertida, esta carta puede señalar frialdad, sermones o el uso de la lógica para restar importancia a los sentimientos de alguien. También puede reflejar la dificultad para tomar una postura clara. Puedes notar cuándo te refugias en el razonamiento para evitar la vulnerabilidad. Dejar que los demás vean tu corazón además de tu mente puede profundizar la confianza y el entendimiento.
  workUpright: >-
    En el trabajo, el Rey de Espadas puede sugerir un liderazgo basado en el pensamiento claro: fijar políticas justas, tomar decisiones difíciles con transparencia u ofrecer una orientación experta. Quizá confíen en ti para sopesar puntos de vista enfrentados y decidir. Explicar tu razonamiento abiertamente y mantener la coherencia ayuda a que otros sigan tu ejemplo con confianza.
  workReversed: >-
    Invertido, esta carta puede reflejar reglas rígidas, decisiones tomadas sin consultar a quienes afectan o una tendencia a analizar en exceso hasta que nada avanza. Puedes preguntarte si un proceso todavía sirve a su objetivo. Invitar a aportar y reconocer la incertidumbre puede reforzar tu autoridad en vez de restarle fuerza.
  growthUpright: >-
    Para el crecimiento personal, el Rey de Espadas te invita a definir tus principios y vivir según ellos. Puedes anotar los valores que guían tus decisiones y contrastar con ellos tus decisiones recientes. Pensar con claridad es una habilidad que se puede practicar: reunir hechos, considerar perspectivas y luego comprometerte con un rumbo de forma meditada.
  growthReversed: >-
    Invertido, esta carta puede reflejar una dependencia excesiva del análisis o un juicio duro sobre ti. Puedes notar cuándo te exiges una lógica perfecta y no dejas espacio a los errores. Equilibrar la razón con la autocompasión puede ayudarte a decidir con más libertad y a aprender con más suavidad de los resultados que te sorprenden.
