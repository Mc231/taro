imageryNote: >-
  La ilustración original muestra a una figura sentada en un alto trono de piedra sobre una cresta de montaña, con la espada perfectamente erguida y el rostro vuelto de frente hacia quien mira. Nubes finas y ordenadas se extienden por un cielo pálido, y dos pájaros vuelan en líneas paralelas. La espada erguida sugiere principios firmes; la mirada directa, la honestidad, y el cielo ordenado, una mente que ha encontrado su calma.
