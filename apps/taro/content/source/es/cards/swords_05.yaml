  relationshipsReversed: >-
    Invertida, el Cinco de Espadas puede señalar una reparación tras una ruptura, o una tensión que sigue hirviendo bajo palabras educadas. Puedes considerar si una disculpa, una charla aclaratoria o simplemente algo de amabilidad podrían aliviar las cosas. Si un vínculo vuelve una y otra vez a la misma pelea, puede valer la pena explorar qué la reinicia.
  workUpright: >-
