  growthUpright: >-
    Para el crecimiento personal, el Cinco de Espadas te invita a mirar tu relación con ganar y perder. ¿Qué despierta en ti el conflicto: la necesidad de demostrar algo, el miedo a pasar desapercibido? Puedes practicar una pausa antes de responder en un momento acalorado, regalándote una respiración para elegir tus palabras en vez de reaccionar.
