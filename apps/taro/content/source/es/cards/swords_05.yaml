imageryNote: >-
  La ilustración original muestra una orilla azotada por el viento bajo nubes rotas que se mueven deprisa. Una figura sostiene sin fuerza tres espadas y mira hacia atrás, mientras otras dos yacen en la arena. Otras dos figuras se alejan hacia el agua. Las espadas esparcidas sugieren discusiones sin resolver, y las espaldas vueltas apuntan a la distancia que crea el conflicto. El cielo inquieto refleja una mente todavía agitada cuando las palabras ya han cesado.
