  growthUpright: >-
    Para el crecimiento personal, esta carta te invita a soltar creencias que ya no se sostienen. Una comprensión repentina puede desorientar, pero a menudo marca un avance real. Puedes anotar lo que ahora ves de otra manera y cómo te gustaría que esa nueva comprensión diera forma a tus decisiones.
  growthReversed: >-
