  relationshipsReversed: >-
    Invertida, esta carta puede señalar una tensión que se ha ido acumulando en silencio, o el evitar una verdad difícil para mantener la paz. Puedes considerar si nombrar algo con suavidad ahora podría evitar una ruptura mayor más adelante. También puede reflejar un vínculo que se reconstruye sobre un terreno más honesto después de una etapa difícil.
  workUpright: >-
    En el trabajo o en un proyecto, la Torre destaca giros inesperados: un cambio de planes, de estructuras o de prioridades que te pide adaptarte. También puede reflejar una idea innovadora que altera la forma habitual de hacer las cosas. Puedes centrarte en lo que puedes influir y en aquello para lo que el cambio abre espacio.
  workReversed: >-
