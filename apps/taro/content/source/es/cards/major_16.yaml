imageryNote: >-
  La Torre de Taro se imagina como una torre de piedra alta y estrecha sobre un pico rocoso, cuya corona salta por un repentino haz de luz de un cielo tormentoso. Chispas o pequeñas llamas se dispersan como semillas al viento, sugiriendo que lo que se libera puede llevar consigo nuevos comienzos. La escena se dibuja como un momento de iluminación, brillante contra las nubes oscuras, con el foco en el despeje y la comprensión y no en daño alguno a nadie.
