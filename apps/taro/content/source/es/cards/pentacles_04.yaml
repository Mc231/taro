meaningUpright: |-
  El Cuatro de Oros muestra a alguien que sujeta sus monedas muy cerca: una apretada contra el pecho y otras bien sujetas bajo los pies o sobre la cabeza. Es una carta sobre la seguridad y el impulso de proteger lo que tienes, ya sea dinero, tiempo, energía, espacio o sentimientos.
  Hay sabiduría en esto. Tras una etapa de incertidumbre, sujetar las cosas con firmeza puede ser una elección razonable. Quizá lo reconozcas en reservar parte de tu energía para ti, en proteger una rutina que te da calma o en poner un límite alrededor de tus fines de semana.
  Pero la misma postura puede volverse rígida. Una mano que aprieta demasiado tiempo no puede recibir nada nuevo. La carta te invita a notar la diferencia entre sujetar algo porque importa y sujetarlo porque soltarlo da miedo. Puedes preguntarte qué estás protegiendo, qué haría falta para sentir seguridad con un poco más de apertura y si algo de lo que guardas podría compartirse, dedicarse a la alegría o permitirse cambiar.
meaningReversed: |-
  Invertido, el Cuatro de Oros puede reflejar una mano que empieza a aflojarse. Quizá estés notando cuánto esfuerzo cuesta mantenerlo todo en su sitio y te preguntes qué pasaría si te relajaras un poco. Esto puede sentirse a la vez liberador e inquietante.
  La carta también puede señalar la otra cara del mismo tema: una preocupación por la escasez que se manifiesta como aferrarse o, al contrario, dejar que los recursos se escapen sin mucha atención. Ambas cosas pueden venir del mismo lugar, la sensación de que la seguridad es frágil.
  Puedes explorar tu relación con lo suficiente. ¿Qué te parecería suficiente, en tiempo, dinero, atención o descanso? Pequeños experimentos de generosidad contigo o con otras personas, a tu ritmo, pueden mostrarte dónde la apertura se siente segura y dónde un límite todavía te sirve.
aspects:
  relationshipsUpright: >-
    En las relaciones, esta carta puede reflejar una actitud protectora: guardar tus sentimientos, tu independencia o tu tiempo. Los límites sanos forman parte de esto. También puedes notar si la cautela mantiene a distancia a alguien cercano. Compartir algo pequeño y real de ti puede poner a prueba si el vínculo tiene espacio para un poco más de apertura.
  relationshipsReversed: >-
    Invertida, la carta puede sugerir un ablandamiento, la disposición a dejar entrar a alguien o a dejar de llevar una cuenta cuidadosa de quién dio qué. También puede reflejar el miedo a perder a alguien, que se manifiesta como control. Puedes preguntarte con suavidad qué te ayudaría a sentir seguridad y hablarlo en vez de apretar más.
  workUpright: >-
    En el trabajo, el Cuatro de Oros puede describir un enfoque cauteloso y protector: aferrarte a un puesto, un método o una información que sientes como tu suelo. La estabilidad puede ser valiosa. Puedes preguntarte si esta cautela todavía encaja, o si compartir lo que sabes y probar un enfoque nuevo podría hacer que tu posición se sintiera más fuerte y no más débil.
  workReversed: >-
    Aquí la carta puede reflejar que aflojas hábitos rígidos en el trabajo, delegas o compartes el mérito con más libertad. También puede señalar un uso disperso del tiempo o del esfuerzo. Puedes mirar adónde va tu energía cada semana y decidir, a propósito, qué merece una protección cuidadosa y qué podría fluir con más facilidad.
  growthUpright: >-
    Para el crecimiento personal, esta carta te invita a explorar qué significa para ti la seguridad. Parte de aquello a lo que te aferras puede ser un ancla valiosa; otra parte, viejas protecciones de tiempos más duros. Puedes ordenarlas con suavidad, conservando lo que todavía te da estabilidad y notando lo que ya no necesitas proteger tan de cerca.
  growthReversed: >-
    Invertido, la carta puede reflejar una disposición creciente a confiar, a dedicar energía a lo que te da alegría o a dejar que una rutina cambie. Puedes notar la incomodidad que surge al soltar el control y tratarla con curiosidad. Sentir seguridad mientras sostienes las cosas con ligereza es una habilidad que puede construirse poco a poco.
reflectionQuestions:
  - >-
    ¿Qué estás sujetando con fuerza ahora mismo y de qué te protege?
  - "¿Dónde podría un poco más de apertura acercarte a alguien?"
  - >-
    ¿Qué te parecería suficiente este mes, en tiempo, energía o recursos?
imageryNote: >-
  La ilustración puede mostrar a una figura sentada que sostiene una moneda contra el pecho, con otras descansando bajo sus pies y en equilibrio sobre su cabeza, mientras una ciudad se alza a cierta distancia detrás. La postura cerrada puede sugerir protección y contención, y los edificios lejanos, un mundo que queda fuera del círculo. Las formas sólidas y macizas y una silueta cerrada pueden subrayar la estabilidad, junto con la pregunta de cuánto cuesta esa estabilidad.
