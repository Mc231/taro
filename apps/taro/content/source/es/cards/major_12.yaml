imageryNote: >-
  El Colgado de Taro se imagina suspendido cabeza abajo, sujeto por un tobillo a una rama robusta y viva, con los brazos relajados y el rostro sereno, incluso curioso. Desde este ángulo, la figura ve el mundo reflejado en un estanque bajo ella, del revés. El árbol está verde y con brotes, mostrando que la pausa forma parte del crecimiento y no es su final. Los azules acuáticos y la ropa suelta y fluida evocan la entrega, el sueño y la mirada bajo la superficie.
