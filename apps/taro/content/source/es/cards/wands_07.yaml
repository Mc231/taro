shortUpright: >-
  Quizá estés defendiendo una postura que te importa; esta carta honra el valor que hace falta para mantenerse firme.
shortReversed: >-
  Defenderlo todo a la vez puede agotarte; podrías elegir qué terreno merece de verdad mantenerse.
meaningUpright: |-
  El Siete de Bastos muestra a alguien en un terreno más alto, sosteniendo un bastón frente a varios que se alzan desde abajo. La posición no es fácil, pero ofrece una ventaja. Esta carta trata de la convicción: defender lo que crees, proteger algo por lo que has trabajado o mantener el equilibrio cuando otras personas te presionan.
  Puede aparecer cuando expresas una opinión impopular en un grupo, mantienes un límite con alguien que no deja de ponerlo a prueba o sigues con un proyecto del que otros dudan. Tras alcanzar cierto éxito, quizá también descubras que más gente quiere cuestionarlo o desafiarlo.
  Esta carta te invita a notar tu propia fuerza y los valores que le dan sentido. Mantenerse firme no exige agresividad; puede hacerse con serenidad, calma y claridad. Puedes preguntarte qué estás defendiendo en concreto y por qué importa, para que tu energía vaya hacia lo que te importa y no hacia cada desafío pasajero.
meaningReversed: |-
  Invertido, el Siete de Bastos puede reflejar la sensación de estar en minoría o de desgaste. Quizá lleves mucho tiempo defendiendo una postura y el esfuerzo empiece a notarse. O quizá notes que estás en guardia incluso cuando nadie te está atacando de verdad.
  Esta carta también puede señalar un momento de replanteamiento. No todo desafío necesita respuesta, ni toda postura tiene que mantenerse para siempre. Soltar una lucha puede liberar energía para las que importan más.
  Puedes hacer balance de dónde te estás resistiendo y por qué. ¿Qué límites protegen tus valores y cuáles se han convertido en hábitos defensivos? Puede ayudar pedir apoyo, retirarte a descansar o dejar que otras personas compartan la carga, en vez de defender la colina sin compañía.
aspects:
  relationshipsUpright: >-
    En los vínculos cercanos, esta carta puede reflejar que defiendes tus necesidades, aunque eso genere algo de fricción. También puede señalar que defiendes a alguien que te importa. Puedes considerar cómo mantener un límite con calidez, diciendo con claridad lo que te importa y dejando espacio al punto de vista de la otra persona.
  relationshipsReversed: >-
    Invertida, quizá sientas que siempre estás a la defensiva con alguien, o que cada conversación se convierte en un debate. Puedes notar si te proteges de una crítica real o de un miedo antiguo. Un enfoque más suave, o una pausa antes de responder, puede abrir espacio a un intercambio más sincero.
  workUpright: >-
    En el trabajo o en un proyecto creativo, el Siete de Bastos puede señalar que mantienes un estándar o una idea bajo presión: competencia, críticas o exigencias cambiantes. Puedes reunir tus razones y tus datos para hablar con una confianza tranquila. Aquí la perseverancia nace de tener claro qué proteges y por qué importa.
  workReversed: >-
    Invertido, quizá estés al límite, respondiendo a cada desafío o petición como si todos fueran igual de urgentes. Puedes elegir los uno o dos asuntos que de verdad necesitan tu postura y dejar el resto por ahora. Pedir respaldo a colegas o colaboradores también puede hacer más llevadera una posición difícil.
  growthUpright: >-
    Mantener tu postura, aunque sea por poco tiempo, es una muestra de resiliencia que merece reconocerse. Tienes más capacidad de defender tus valores de lo que quizá crees. Puedes recordar una ocasión en que te mantuviste firme y notar qué te ayudó entonces, como una razón clara, una persona que te apoyaba o una rutina estable.
  growthReversed: >-
    Invertido, quizá cargues con una sensación de vigilancia constante. Puede valer la pena explorar de dónde viene y si todavía te sirve. Elegir tus batallas no es rendirte; puede ser una forma de proteger tu energía para que tu valor esté disponible cuando de verdad cuente.
reflectionQuestions:
  - "¿Qué estás defendiendo ahora mismo y por qué te importa?"
  - >-
    ¿Dónde podrías soltar una lucha pequeña para proteger tu energía para una mayor?
  - >-
    ¿Quién podría estar a tu lado, para que no sostengas esta postura sin compañía?
imageryNote: >-
  Una sola figura está de pie sobre un promontorio rocoso, con los pies apoyados en un suelo desigual, un bastón alzado con ambas manos mientras otros seis asoman desde debajo del borde. El suelo irregular sugiere que la convicción no siempre es cómoda, y el terreno elevado muestra una posición real ganada con esfuerzo. Los bastones de abajo pueden representar desafíos, preguntas y voces que compiten, y el agarre firme, un valor arraigado en los valores propios.
