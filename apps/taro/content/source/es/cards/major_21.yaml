imageryNote: >-
  El Mundo de Taro se imagina como una figura que baila dentro de una gran guirnalda ovalada de hojas y flores de todas las estaciones, moviéndose con libertad en el centro de un cielo estrellado. Alrededor de la guirnalda, cuatro pequeños emblemas del fuego, el agua, el aire y la tierra marcan los bordes de la escena, sugiriendo equilibrio y plenitud. Una cinta que cae de la mano de quien baila vuelve en un lazo al punto de partida, invitando a sentir una llegada y un viaje que cierra el círculo.
