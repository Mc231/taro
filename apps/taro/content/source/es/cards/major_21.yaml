shortUpright: >-
  Quizá un ciclo esté cerrando el círculo. Esta carta te invita a detenerte y honrar lo que has completado.
shortReversed: >-
  Quizá algo esté a punto de terminar. ¿Qué último paso o cabo suelto merece tu atención?
meaningUpright: |-
  El Mundo es la última carta de los Arcanos mayores, el final del viaje que empezó con el Loco. Es una carta de culminación y plenitud: la sensación de que las piezas encajan, de que se ha vivido un ciclo completo y de que, en este momento, estás en casa dentro de la historia que has vivido hasta ahora.
  En la vida cotidiana, esta carta puede reflejar terminar un proyecto largo, alcanzar una meta por la que has trabajado o simplemente sentirte en casa en tu vida y en tu cuerpo. Puede señalar la integración: reunir las lecciones de muchas experiencias, las fáciles y las difíciles, en una idea de quién eres. Aquí la pertenencia puede ser a una comunidad, a un lugar o a ti.
  Esta carta te invita a considerar lo que has logrado y a celebrarlo. Puedes preguntarte cómo has cambiado desde que empezó este ciclo y qué te gustaría llevar al siguiente. El Mundo destaca que culminar no es un final en el sentido de detenerse. Es un momento de plenitud antes de que empiece un nuevo viaje.
meaningReversed: |-
  Invertido, el Mundo puede reflejar un ciclo casi completo, pero no del todo. Unos cuantos cabos sueltos, una despedida no dicha o una última tarea quizá te impidan sentir que has terminado. Quizá sientas que es hora de seguir adelante mientras algo todavía te retiene.
  Esta carta también puede señalar que buscas el cierre en otra parte, que buscas atajos o esperas que otras personas lo cierren todo por ti.
  Quizá quieras identificar la una o dos cosas que te ayudarían a sentir que has completado el ciclo. Puede ser terminar una tarea práctica, dar las gracias a alguien, reconocer una decepción o simplemente reconocerte el mérito de todo lo que has avanzado. Dar ese último paso con intención puede convertir un casi final en un final de verdad.
aspects:
  relationshipsUpright: >-
    En las relaciones, el Mundo puede reflejar una sensación de plenitud y entendimiento mutuo, como si un vínculo hubiera alcanzado su propia forma. Puede invitarte a valorar lo que han construido en compañía y a celebrar los hitos compartidos. Aquí las relaciones se sienten completas, con espacio para la cercanía y para la libertad de cada persona.
  relationshipsReversed: >-
    Invertida, esta carta puede señalar algo sin resolver en una relación, una conversación que no ha terminado o un capítulo que no se ha cerrado. Puedes considerar qué ayudaría a ambas personas a sentirse en paz, tanto si eso significa decir algo como aceptar que ya se ha dicho.
  workUpright: >-
    En el trabajo o en un proyecto, el Mundo destaca la culminación y el reconocimiento. Puede reflejar terminar un trabajo importante, alcanzar un hito o sentir que tu papel encaja bien contigo. Puedes tomarte un tiempo para reconocer lo que tú y otras personas han logrado antes de empezar lo siguiente.
  workReversed: >-
    Invertido, el Mundo puede reflejar un proyecto atascado en la fase final o la sensación de no llegar del todo a la meta. Puedes anotar lo que queda y decidir si de verdad hace falta hacerlo o si se puede soltar. Un esfuerzo pequeño y enfocado puede ayudar a cerrar las cosas con limpieza.
  growthUpright: >-
    Antes de buscar la siguiente meta, puede ayudar reconocer cuánto has avanzado. Puedes reflexionar sobre las lecciones, los retos y las alegrías de un capítulo reciente y notar cómo encajan en una imagen más completa de ti. La integración es una forma discreta de logro.
  growthReversed: >-
    Invertido, el Mundo puede preguntarte qué necesitas para sentir que algo está completo. Puede reflejar inquietud o una sensación de algo inacabado. Puedes nombrar una cosa que llevas tiempo queriendo terminar y darle toda tu atención, y luego notar cómo se siente cerrar ese círculo.
