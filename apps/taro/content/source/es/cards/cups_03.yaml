imageryNote: >-
  La ilustración muestra tres figuras en un círculo suelto, con las copas alzadas que se encuentran en el centro. A sus pies, una cosecha de frutas, flores o vides puede sugerir una abundancia que nace del esfuerzo compartido. Sus ropas, posturas y colores distintos pueden representar amistades que siguen siendo diferentes mientras se pertenecen. El movimiento de la escena, como un paso de baile o un dobladillo que gira, transmite una alegría fácil y espontánea.
