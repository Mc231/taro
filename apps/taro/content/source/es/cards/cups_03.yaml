shortUpright: >-
  Un momento para notar quién comparte tus alegrías y cómo podrías compartir las suyas a cambio.
shortReversed: >-
  Quizá ahora la conexión se sienta escasa o cansada; piensa qué encuentros te nutren y cuáles solo llenan el tiempo.
meaningUpright: |-
  El Tres de Copas es una carta de amistades que alzan sus copas en compañía. Celebra esa conexión que no necesita motivo: risas alrededor de la mesa de la cocina, un chat de grupo que se ilumina con buenas noticias, vecinos que ayudan sin que se lo pidan. Donde el Dos de Copas mira un vínculo, esta carta mira el círculo.
  Puede reflejar una temporada de reuniones, un hito que merece celebrarse o simplemente la sensación de pertenecer a un grupo que te ve. También puede señalar el apoyo que ya tienes alrededor, quizá más del que has estado notando.
  Esta carta te invita a dejar que la alegría se comparta en vez de guardarla para más tarde. Puedes escribir a alguien a quien llevas tiempo queriendo ver, aceptar una invitación o crear una pequeña ocasión propia. Celebrar no tiene por qué ser algo grande. A veces es solo reconocer, en compañía, que pasó algo bueno o que superaron algo difícil.
meaningReversed: |-
  Invertido, el Tres de Copas puede reflejar una vida social que no termina de sonar bien. Quizá te sientas al margen de un grupo del que antes formabas parte, o notes que algunas amistades se han distanciado a medida que las vidas cambiaban. O quizá haya demasiado de algo bueno: planes que no dejan espacio para descansar, o celebraciones que se han convertido en una forma de evitar sentimientos más callados.
  Nada de esto es un veredicto sobre tus amistades. Los círculos cambian de forma, y es natural dejar atrás algunos encuentros y echar de menos otros.
  La invitación es mirar la calidad de tus conexiones y no su número. ¿Con qué personas te sientes más tú? ¿Dónde podrías estar diciendo que sí por costumbre? Un solo encuentro sincero con una amistad puede ofrecer más que una agenda llena.
aspects:
  relationshipsUpright: >-
    En las relaciones, esta carta destaca la red más amplia que rodea a un vínculo: amistades, familia, familia elegida. Puede invitarte a compartir los buenos momentos con las personas que te apoyan, o a dar la bienvenida a alguien cercano en tu círculo. También puedes notar cuánto te sostienen tus amistades y darles parte de la atención que sueles reservar a una sola relación.
  relationshipsReversed: >-
    Invertida, esta carta puede reflejar tensión en un grupo o la sensación de quedarte fuera. También puede señalar una influencia externa sobre un vínculo, tome la forma que tome. En vez de adivinar, puedes preguntar con sencillez cómo están las cosas. También puede ayudar pasar tiempo con personas con las que no tienes que aparentar ni estar a la altura.
  workUpright: >-
    En el trabajo, el Tres de Copas puede señalar espíritu de equipo, un logro compartido o colaboradores que de verdad disfrutan trabajando en conjunto. Puede invitarte a celebrar los avances por el camino, no solo al final. Dar las gracias a las personas por su nombre, compartir el mérito y señalar los pequeños hitos puede fortalecer un grupo y hacer el trabajo más satisfactorio.
  workReversed: >-
    Invertido, la carta puede reflejar un equipo que ha perdido su calidez, quizá por los chismes, los grupitos o la simple sobrecarga. Puedes notar si la presión social está influyendo en tus decisiones, como quedarte hasta tarde para encajar. Piensa cómo sería para ti una buena relación entre colegas y dónde podrías dar ejemplo de ella en algo pequeño.
  growthUpright: >-
    Para el crecimiento personal, esta carta te invita a valorar la alegría como parte de una vida equilibrada, no como un premio que primero hay que ganar. Puedes anotar durante una semana los pequeños placeres compartidos. Notarlos puede ayudarte a reconocer la comunidad que ya tienes y a ver dónde te gustaría ampliarla.
  growthReversed: >-
