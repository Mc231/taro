imageryNote: >-
  La Muerte de Taro se imagina como un sereno paisaje otoñal en el que un río lento lleva hojas caídas hacia un sol que sale en el horizonte. Una figura con capa, sin prisa, camina junto al agua llevando una sola vaina de semillas o una rama desnuda, símbolos de lo que termina y de lo que espera para crecer. Una flor blanca sobre un fondo oscuro puede sugerir renovación dentro de la liberación. El ambiente es tranquilo y respetuoso, y apunta a la transformación, no a la pérdida.
