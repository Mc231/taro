shortUpright: >-
  Quizá una etapa se esté cerrando. Esta carta te invita a notar lo que termina y el espacio que deja.
shortReversed: >-
  Quizá algo esté listo para terminar mientras una parte de ti se aferra. ¿Qué te ayudaría a soltar un poco?
meaningUpright: |-
  A pesar de su nombre, esta carta no habla de la muerte física. Habla de finales en el sentido humano y cotidiano: el cierre de una etapa, un papel, un hábito o una forma de verte. Como el otoño que despeja las ramas antes de un nuevo crecimiento, sugiere que algunas cosas necesitan terminar para que otras empiecen.
  En la vida cotidiana, esta carta puede reflejar dejar un hogar, terminar un curso, apartarte de un proyecto o notar que una versión antigua de ti ya no encaja. Puede traer una mezcla de sentimientos: alivio, tristeza, incertidumbre, incluso ilusión. Todos son naturales. La transformación rara vez es ordenada, y a menudo lleva tiempo entender qué ha hecho posible un cambio.
  Esta carta te invita a considerar qué está listo para soltarse. Puedes preguntarte qué sigues cargando por costumbre y qué espacio podría abrirse si lo dejaras en el suelo. La Muerte destaca que los finales, incluso los bienvenidos, merecen reconocimiento. Honrar lo que ha sido puede facilitar volverse hacia lo que podría venir.
meaningReversed: |-
  Invertida, la Muerte puede reflejar un final que se está tomando su tiempo. Quizá sientas que una etapa ha terminado y aun así te aferres a ella, tal vez porque lo conocido parece más seguro que lo desconocido, o porque soltar se siente como perder una parte de ti.
  Esta carta también puede señalar una transición que ocurre despacio y en silencio, bajo la superficie, y no en un momento claro. No todos los cambios llegan con una ruptura limpia.
  Quizá quieras notar a qué te aferras y qué protege ese aferrarse. Pequeños rituales de cierre, como escribir una carta de despedida que no envías, vaciar un cajón o señalar un último día, pueden ayudar. No hay ninguna prisa. Permitirte despedir con tristeza lo que termina puede hacer que soltar se sienta más suave.
aspects:
  relationshipsUpright: >-
    En las relaciones, esta carta puede reflejar un cambio importante en el funcionamiento de un vínculo: una nueva etapa, un cambio de papeles o el fin de un patrón que ya no ayudaba a ninguna de las dos personas. No señala el bienestar físico de nadie. Puede invitarte a reconocer en compañía lo que está cambiando, con honestidad y cuidado.
  relationshipsReversed: >-
    Invertida, esta carta puede señalar el apego a una dinámica antigua que ambas personas han superado, o la dificultad para aceptar que un vínculo ha cambiado. Puedes considerar qué necesitarías para dejar que la relación tome su nueva forma, sea cual sea esa forma.
  workUpright: >-
    En el trabajo o en un proyecto, la Muerte destaca la conclusión y la transición. Puede reflejar el final de un puesto, el cierre de un proyecto o el retiro de una forma de trabajar que ya ha cumplido su ciclo. Puedes hacer balance de lo que has aprendido y de lo que quieres llevar contigo al siguiente capítulo.
  workReversed: >-
    Invertida, la Muerte puede reflejar que sigues con una tarea, un puesto o un método por costumbre cuando ya ha dejado de encajar. También puede señalar miedo a lo que viene después. Puedes anotar lo que la situación actual aún te da y lo que te cuesta, y notar qué te dice ese balance.
  growthUpright: >-
    Las identidades antiguas pueden caer como hojas y dejar sitio a lo que aún se está formando. Quizá notes creencias sobre ti que fueron ciertas en su momento pero ya no lo son. Soltarlas puede abrir espacio a una versión de ti más fiel a la persona en la que te estás convirtiendo.
  growthReversed: >-
    Invertida, la Muerte puede preguntarte si el miedo al cambio te mantiene en un espacio más pequeño del que necesitas. Puede reflejar una transformación lenta y paciente que merece tu confianza. Puedes elegir una pequeña cosa que soltar esta semana y notar cómo te sientes después.
