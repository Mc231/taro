imageryNote: >-
  La ilustración puede mostrar a una figura sentada con calma sobre un caballo robusto e inmóvil, con una sola moneda en la mano y la mirada sobre campos arados. El caballo quieto puede simbolizar la paciencia y la resistencia; la tierra surcada, el trabajo metódico ya hecho, y la mirada serena, una atención constante a lo que está por venir. Los tonos oscuros y sólidos y las formas pesadas pueden subrayar la fiabilidad, con un matiz de cómo la quietud a veces puede volverse inercia.
