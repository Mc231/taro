imageryNote: >-
  Una figura está de pie al anochecer dentro de un círculo de bastones clavados en el suelo, apoyada en uno de ellos y mirando a lo lejos con ojos atentos. A su lado arde bajo una pequeña hoguera. El círculo de bastones sugiere las defensas construidas con la experiencia; el fuego bajo, la energía que aún se mantiene viva tras un largo esfuerzo, y la luz que se apaga, un día que llega a su fin. La postura vigilante sostiene a la vez el cansancio y la persistencia que sigue adelante.
