shortUpright: >-
  Has pasado por mucho y sigues en pie; esta carta honra tu resiliencia en el último tramo.
shortReversed: >-
  Estar en guardia tanto tiempo puede cansar; podrías notar dónde es seguro descansar y dejar entrar a los demás.
meaningUpright: |-
  El Nueve de Bastos muestra a alguien que ha atravesado desafíos y sigue en pie. Se apoya en un bastón, algo cansado y en guardia, dentro de un círculo de otros clavados como una valla que ha levantado. Es una resiliencia que lleva algunas marcas de la experiencia: no intacta, pero tampoco vencida.
  Puede hablarte cuando un proyecto largo está casi terminado, cuando atraviesas una temporada exigente de cuidados o de estudio, o cuando has afrontado contratiempos y has decidido seguir. Ahora sabes más que al principio, también sobre dónde están tus límites.
  Esta carta te invita a reconocer cuánto has avanzado y a usar lo que has aprendido. La persistencia es valiosa, y también lo es dosificarse. Puedes preguntarte qué te ayudaría en este último tramo: una meta clara, unas horas de descanso, un límite práctico o recordar que estás más cerca del final de lo que parece.
meaningReversed: |-
  Invertido, el Nueve de Bastos puede reflejar un cansancio acumulado con el tiempo. Quizá sientas que llevas tanto tiempo protegiéndote a ti o a tus proyectos que relajarte parece imposible. La prudencia aprendida de dificultades pasadas puede convertirse en recelo ante cada situación nueva.
  Esta carta también puede señalar que se está llegando a un límite. Seguir empujando no siempre es la opción más fuerte; a veces la fuerza consiste en admitir que necesitas un descanso o una mano.
  Puedes explorar dónde tus defensas siguen siendo útiles y dónde ahora dejan fuera el apoyo además de las dificultades. ¿Hay alguien en quien podrías apoyarte, una tarea que podrías delegar o una pausa que podrías permitirte? Bajar un poco la guardia, en un lugar seguro, puede ser una forma de cuidar la resiliencia que has construido.
aspects:
  relationshipsUpright: >-
    En los vínculos cercanos, esta carta puede reflejar una relación que ha capeado tiempos difíciles y sigue en pie. También puede señalar una cautela aprendida de heridas pasadas. Puedes valorar la estabilidad que han construido en compañía, notando a la vez si el viejo recelo sigue haciendo falta con alguien que ha demostrado que merece confianza.
  relationshipsReversed: >-
    Invertida, quizá mantengas a los demás a distancia para que no vuelvan a decepcionarte, o sientas demasiado cansancio para dar tanto como de costumbre. Puedes considerar decirle a alguien cercano que te estás quedando sin fuerzas. Permitirte recibir apoyo puede profundizar un vínculo en vez de debilitarlo.
  workUpright: >-
    En el trabajo o en los estudios, el Nueve de Bastos puede señalar el empujón final de un esfuerzo largo. La experiencia te ha hecho más realista ante los obstáculos, y ese conocimiento es útil. Puedes planear con cuidado los pasos que quedan, proteger tu concentración y recordar las razones por las que empezaste, para que el último tramo tenga sentido y no solo agote.
  workReversed: >-
    Invertido, quizá estés cerca de tu límite, trabajando a la defensiva o sintiendo que debes encargarte de todo sin ayuda. Puedes mirar qué podría delegarse, aplazarse o simplificarse. Hablar con honestidad de tu capacidad puede ser una elección responsable que te protege a ti y al trabajo.
  growthUpright: >-
    Quizá tengas más aguante del que te reconoces. Cada dificultad que has afrontado te ha enseñado algo sobre lo que puedes sobrellevar. Puedes anotar algunas lecciones de los retos recientes y considerar cómo podrían guiarte con un poco más de confianza y un poco menos de tensión.
  growthReversed: >-
    Invertido, la vigilancia constante quizá te esté pasando factura. Puedes explorar cómo es el descanso para ti y si te permites suficiente. Suavizar tu guardia de formas pequeñas y seguras, como una tarde tranquila o una conversación sincera, puede ayudar a que tu fuerza se parezca menos a una armadura.
reflectionQuestions:
