shortUpright: >-
  Quizá un hábito o un apego te sujete con más fuerza de lo que crees. Notarlo es el primer paso.
shortReversed: >-
  Un patrón que antes te sujetaba con fuerza quizá se esté aflojando. ¿Qué te ayudaría a alejarte un poco más?
meaningUpright: |-
  El Diablo no habla del mal. Es una carta sobre los patrones y los apegos que pueden atarnos, a menudo con nuestro consentimiento silencioso. Su imagen tradicional muestra dos figuras con cadenas flojas, y esas cadenas suelen estar lo bastante sueltas como para quitárselas. La carta pregunta: ¿qué te mantiene aquí y cuánto de ello es elección?
  En la vida cotidiana, esta carta puede reflejar deslizar el dedo por la pantalla hasta altas horas, decir que sí por miedo a decepcionar a alguien, buscar aprobación o consuelo de formas que después te dejan con más vacío, o seguir en una rutina que ya no te sirve porque salir de ella parece demasiado incierto. También puede señalar las partes de ti que prefieres no mirar, como la envidia, el resentimiento o el deseo, que tienden a crecer cuando se ignoran.
  Esta carta te invita a considerar qué tiene más poder sobre ti del que te gustaría. Puedes preguntarte qué necesidad intenta cubrir un hábito y si hay una forma más amable de cubrirla. El Diablo destaca la conciencia sin vergüenza. Ver un patrón con claridad suele ser el momento en que empieza a aflojarse.
meaningReversed: |-
  Invertido, el Diablo puede reflejar un aflojamiento. Un hábito, una dinámica de relación o una creencia que parecía irrompible quizá esté perdiendo fuerza, y quizá empieces a ver otras opciones. Esto puede traer alivio junto con cierta incertidumbre sobre quién eres sin el viejo patrón.
  Esta carta también puede señalar el trabajo de mirar tu sombra: observar con honestidad sentimientos o motivos difíciles y aceptarlos como parte de ser humano.
  Quizá quieras notar los pequeños pasos que ya has dado para alejarte de algo que te ataba. ¿Qué los hizo posibles? Mantener cerca esos apoyos, y pedir ayuda donde la atracción sigue siendo fuerte, puede hacer el cambio más duradero. La libertad suele crecer despacio, una elección cada vez.
aspects:
  relationshipsUpright: >-
    En las relaciones, el Diablo puede reflejar patrones de dependencia, celos o control, por cualquiera de las dos partes, o un vínculo que se mantiene más por costumbre que por cariño. Puede invitarte a mirar con honestidad qué los mantiene unidos y si ambas personas se sienten libres. Nombrar un patrón con amabilidad puede abrir espacio para cambiarlo.
  relationshipsReversed: >-
    Invertida, esta carta puede señalar que te apartas de una dinámica poco sana o que pones un límite que te ha costado poner. Puedes considerar qué apoyo necesitas para mantener ese límite. También puede reflejar una relación que se vuelve más honesta a medida que salen a la luz sentimientos ocultos.
  workUpright: >-
    En el trabajo o en un proyecto, el Diablo destaca la sensación de estar atado a algo: jornadas largas, una necesidad de aprobación o un puesto en el que sigues sobre todo por miedo al cambio. Puedes preguntarte qué obtienes de la situación y qué te está costando, y si pequeños cambios podrían devolverte la sensación de elegir.
  workReversed: >-
    Invertido, el Diablo puede reflejar que te liberas de un hábito de trabajo poco útil, como el perfeccionismo o estar siempre disponible. También puede señalar que reconoces una presión que habías normalizado. Puedes proteger esta nueva libertad con un límite claro, como una hora de terminar o un tope de mensajes fuera del horario.
  growthUpright: >-
    El Diablo abre la puerta al trabajo con la sombra: explorar con suavidad las partes de ti que tiendes a esconder. Puedes notar un hábito que se siente compulsivo y preguntarte, con curiosidad y sin juicio, qué intenta darte. La comprensión llega antes que el cambio.
  growthReversed: >-
    Invertido, el Diablo puede reflejar avances al aflojar un viejo apego. Puede ser un momento para reconocer cuánto camino has recorrido. Si los hábitos o los sentimientos pesados siguen volviendo, hablar con alguien de confianza o con un profesional cualificado puede ofrecerte un apoyo estable en el camino.
reflectionQuestions:
  - >-
    ¿Qué hábito te sujeta más de lo que te gustaría y qué necesidad cubre?
  - >-
    ¿En qué relación cercana te sientes menos libre de lo que quisieras?
  - >-
    ¿Qué pequeño paso para alejarte de un viejo patrón podrías dar esta semana?
imageryNote: >-
  El Diablo de Taro se imagina como una figura sombría y con cuernos, encaramada sobre dos figuras más pequeñas unidas a su asiento por cadenas flojas y destensadas. Las cadenas se dibujan claramente sueltas alrededor de sus muñecas, invitando a notar que podrían quitárselas. La tenue luz de las antorchas y los tonos tierra profundos crean un ambiente pesado, mientras que una débil puerta de luz en el borde de la escena insinúa que hay otro camino por encontrar.
