  relationshipsReversed: >-
    Invertida, quizá te sientas un poco fuera de un círculo que te importa, o notes tensión en torno a una reunión o un espacio compartido. No toda ocasión tiene que ser perfecta para tener sentido. Puedes considerar un paso pequeño y sincero hacia el reencuentro, como una invitación, una conversación tranquila o una oferta de ayuda con algo que le importa a la otra persona.
  workUpright: >-
    En el trabajo o en un proyecto, el Cuatro de Bastos puede señalar un hito que merece reconocerse: un lanzamiento, una fase terminada, un equipo que ha encontrado su ritmo. Puedes tomarte un tiempo para celebrarlo con las personas que lo hicieron posible. Reconocer el esfuerzo compartido puede reforzar la confianza y dar una base más firme a la siguiente etapa.
  workReversed: >-
    Invertido, un hito quizá pase sin reconocimiento, o un equipo esté menos asentado de lo que parece. Puedes nombrar tú el avance sin esperar a que lo haga otra persona, o mirar qué ayudaría al grupo a sentir más seguridad: funciones más claras, un espacio compartido o un momento para reflexionar sobre el camino recorrido en equipo.
  growthUpright: >-
    Para el crecimiento personal, esta carta te invita a dejar que los logros se asienten antes de seguir. Señalar un paso completado puede construir una estabilidad interior que te acompañe en los momentos más difíciles. Puedes crear un pequeño ritual propio, como un paseo, una nota escrita o tu comida favorita, para honrar un avance reciente.
  growthReversed: >-
    Invertido, quizá estés pasando de largo por tus propios hitos o sientas que nada está lo bastante terminado para celebrarlo. Puedes explorar qué significa el hogar para ti por dentro: qué hábitos, lugares o personas te ayudan a sentir arraigo. Reforzar uno de ellos puede hacer que el suelo bajo tus pies se sienta más tuyo.
