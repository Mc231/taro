imageryNote: >-
  Cuatro bastones erguidos se unen con una guirnalda de hojas, flores y cintas, formando una puerta abierta. Más allá, unas figuras se reúnen con las manos alzadas, y una casa sencilla o un pueblo amurallado se ve a lo lejos. El marco de cuatro sugiere unos cimientos estables construidos con esfuerzo; la guirnalda, una cosecha de alegría compartida, y la puerta abierta, una bienvenida que invita a entrar en vez de dejar fuera.
