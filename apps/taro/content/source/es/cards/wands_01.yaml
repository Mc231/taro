shortUpright: >-
  Una nueva chispa de interés pide un poco de aire y atención antes de poder convertirse en llama.
shortReversed: >-
  Quizá la chispa esté ahí, pero algo le impide prender todavía; nota qué necesita.
meaningUpright: |-
  El As de Bastos es el primer destello de fuego de la baraja: una idea repentina, un tirón de curiosidad, el momento en que algo te hace incorporarte y pensar «quiero probar eso». Es energía en bruto antes de tener un plan, más cerca de una semilla de entusiasmo que de un proyecto terminado.
  En la vida diaria, esto puede ser un boceto garabateado en un tique, las ganas de aprender a tocar un instrumento que admiras desde hace años o una conversación que te deja vibrando de posibilidades. También puede ser un apetito renovado por algo que habías dejado de lado y que vuelve con más calidez de la esperada.
  Esta carta te invita a notar hacia dónde quiere ir tu energía ahora, sin pedirle todavía que se justifique. Una chispa no necesita un plan de negocio; necesita un poco de oxígeno. Puedes darle hoy una salida pequeña y concreta, como diez minutos, una primera nota o un mensaje a alguien que comparte ese interés, y ver cómo responde.
meaningReversed: |-
  Invertido, el As de Bastos puede reflejar una chispa que aún no ha prendido del todo. El interés puede ser real y, aun así, se sigue aplazando a mañana, o se aviva y se apaga antes de encontrar algo a lo que agarrarse. A veces la energía se reparte entre tantos comienzos que ninguno recibe suficiente calor.
  También puede señalar una fase más tranquila. No todas las ideas están listas para mostrarse; algunas necesitan tiempo bajo tierra, cobrando fuerza en notas privadas y ensoñaciones antes de salir a la luz.
  Puede ser un momento para preguntarte qué necesita de verdad tu chispa. ¿Tiempo, un primer paso más claro, permiso para ser principiante o simplemente descanso antes de empezar? Puedes elegir una idea del montón y darle un espacio pequeño y protegido, sin esperar a que llegue el momento perfecto.
aspects:
  relationshipsUpright: >-
    En los vínculos cercanos, esta carta puede reflejar un nuevo arranque de calidez o curiosidad: ganas de planear algo nuevo en compañía, de hacer preguntas distintas o de llevar más juego a una conexión conocida. Puedes notar quién te ilumina en este momento y qué tipo de aventura compartida, aunque sea pequeña, podría dejar que esa energía circule entre ambas personas.
  relationshipsReversed: >-
    Invertida, la chispa entre tú y alguien cercano quizá se sienta apagada por la rutina, el cansancio o una vacilación no dicha. No significa que la calidez se haya ido; quizá solo espere una ocasión. Puedes considerar qué solía encender la conversación entre ustedes y si un pequeño gesto de curiosidad podría invitar a que vuelva parte de esa viveza.
  workUpright: >-
    En el trabajo o en un proyecto creativo, el As de Bastos puede señalar una idea con verdadera fuerza: un enfoque nuevo, un proyecto paralelo, una propuesta a la que sigues volviendo. Puedes darle una primera forma tangible, como un esquema, un prototipo o una breve presentación a alguien de confianza, para ponerla a prueba a la vista y no solo en tu cabeza.
  workReversed: >-
    Invertido, la motivación quizá parpadee. Quizá una idea lleve tiempo esperando aprobación, o demasiados comienzos compitan por tu tiempo. Puede ser un momento para elegir un hilo que seguir y dejar los demás a un lado por ahora. Un avance pequeño y visible en una sola idea a menudo reaviva más energía que planear varias a la vez.
  growthUpright: >-
    La curiosidad puede ser una maestra por derecho propio, y esta carta sugiere seguirla. Aquello que te atrae suele decir algo de lo que quiere crecer en ti. Puedes anotar las chispas que sientas esta semana, sin juzgarlas, y buscar la que vuelve una y otra vez.
  growthReversed: >-
    Invertido, quizá estés esperando a sentir que es el momento antes de empezar, o te estés juzgando con dureza por no sentir inspiración. La energía suele moverse por estaciones. Puedes tratar esta etapa como un tiempo de recogimiento sereno: descansar, leer, observar y dejar que un nuevo interés tome forma a su ritmo.
reflectionQuestions:
  - >-
    ¿Qué idea o interés ha estado tirando de tu atención últimamente?
  - >-
    ¿Con quién podrías compartir esta chispa para que tenga con quién crecer?
  - >-
    ¿Qué pequeña acción podría darle aire a esta chispa esta semana?
imageryNote: >-
  Un único bastón vivo se alza en la imagen, recién cortado pero aún con brotes verdes, como si la madera no pudiera dejar de crecer. Una pequeña llama o un resplandor se reúne en su punta. La rama representa una fuerza creativa en bruto, todavía viva y sin forma, y las hojas nuevas sugieren que la inspiración crece cuando se cuida. Los rojos y dorados cálidos pueden evocar el elemento fuego, con el cielo abierto detrás insinuando un espacio aún por explorar.
