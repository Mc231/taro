imageryNote: >-
  El Hierofante de Taro se imagina como un maestro en un patio tranquilo, sentado en un banco de piedra gastado bajo un árbol viejo, con un pequeño círculo de oyentes de distintas edades. Del cinturón le cuelga una llave pesada, símbolo de una comprensión que se transmite con el estudio y la práctica. Los libros apilados en el banco y una campana en el arco de arriba sugieren ritual y aprendizaje compartidos. Una puerta abierta al otro lado del patio insinúa que toda enseñanza puede llevar a algún lugar nuevo.
