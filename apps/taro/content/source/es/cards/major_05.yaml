shortUpright: >-
  Quizá haya sabiduría en lo que otras personas recorrieron antes. ¿Qué tradición o maestro podría ayudarte ahora?
shortReversed: >-
  Una regla heredada quizá ya no encaje. Esta carta te invita a contrastarla con lo que de verdad valoras.
meaningUpright: |-
  El Hierofante es la carta del conocimiento compartido: las maneras de hacer las cosas que una comunidad transmite de una generación a otra. Puede representar a maestros, mentores, instituciones, rituales y códigos de práctica, todo aquello que ayuda a las personas a aprender en compañía y a sentir que pertenecen a algo más grande.
  En la vida cotidiana, esta carta puede reflejar apuntarte a una clase, seguir una receta que se ha transmitido en la familia, pedir orientación a un colega con experiencia o celebrar un hito con una ceremonia conocida. Puede señalar el alivio de no tener que inventarlo todo por tu cuenta. Las tradiciones llevan consigo las lecciones de muchas personas, y a menudo tienen sentido.
  Esta carta te invita a considerar qué has heredado y qué has elegido. Puedes preguntarte qué valores compartidos dan estabilidad a tu vida y de quién podrías aprender ahora. El Hierofante no habla de obediencia ciega; destaca el valor de aprender bien una forma, tanto si la conservas como si la adaptas o con el tiempo la transmites con tus propias palabras.
meaningReversed: |-
  Invertido, el Hierofante puede reflejar una distancia creciente respecto a las reglas o las expectativas con las que creciste. Algo que antes parecía correcto quizá ahora resulte demasiado estrecho, o quizá sientas que has seguido un guion más por costumbre que por convicción.
  Esta carta también puede señalar la inclinación contraria: rechazar toda convención con tanta firmeza que se pierde lo que aún podría ser útil en ella. Cuestionar es sano; suele funcionar bien cuando nace de la curiosidad y no de la reacción.
  Quizá quieras mirar una expectativa que te pesa y preguntarte de dónde viene. ¿Sigue reflejando tus valores o los de otra persona? Encontrar tu propio camino puede incluir conservar lo que todavía te sirve y soltar, con respeto, lo que ya no.
aspects:
  relationshipsUpright: >-
    En las relaciones, el Hierofante puede reflejar valores compartidos, compromisos y los rituales que mantienen unidas a las personas: tradiciones familiares, aniversarios, llamadas semanales. Puede invitarte a notar en qué creen tanto tú como alguien cercano y cómo lo honran. La orientación de una amistad de confianza o de una persona mayor también podría ayudarte ahora.
  relationshipsReversed: >-
    Invertida, esta carta puede señalar una tensión entre lo que se espera de una relación y lo que de verdad se siente auténtico para quienes forman parte de ella. Puedes considerar si sigues normas externas que no encajan con tu situación. Una conversación honesta sobre el tipo de vínculo que ambas personas quieren puede abrir espacio a su propia manera de hacer las cosas.
  workUpright: >-
    En el trabajo o en los estudios, el Hierofante destaca aprender bien un oficio, respetar los métodos establecidos y encontrar a alguien que te guíe. Puede ser buen momento para hacer un curso, obtener una titulación o pedir a alguien con experiencia que te enseñe cómo funcionan las cosas. Formar parte de un equipo o de una institución puede ofrecer apoyo además de estructura.
  workReversed: >-
    Invertido, el Hierofante puede reflejar frustración con la forma en que siempre se han hecho las cosas, o la sensación de que el camino oficial no va contigo. Puedes preguntarte qué reglas protegen la calidad y cuáles solo se resisten al cambio. Proponer un enfoque mejor, con calma y con datos, puede ser más eficaz que sortear el sistema.
  growthUpright: >-
    Para el crecimiento personal, esta carta te invita a aprender de quienes vinieron antes. Los libros, los maestros, las comunidades y las prácticas pueden ofrecer marcos que apoyen tu desarrollo. Puedes elegir una disciplina o tradición para estudiarla con paciencia, notando lo que ofrece antes de decidir qué hacer con ella.
  growthReversed: >-
    Invertido, el Hierofante puede ser un empujón para escribir tus propias pautas. Puede reflejar un momento en que una creencia o un papel antiguo se te ha quedado pequeño. Puedes anotar con tus propias palabras los valores que de verdad tienes hoy y notar dónde coinciden con lo que te enseñaron y dónde se separan con suavidad.
reflectionQuestions:
