  La ilustración puede mostrar a una figura coronada sentada en un trono tallado dentro de un jardín en flor, con una moneda sostenida con suavidad en el regazo. Flores, frutas y un pequeño animal, como un conejo, pueden rodear el trono, y un arroyo puede correr cerca. El jardín puede simbolizar la abundancia que nace del cuidado; la moneda acunada, una administración atenta, y el animal, la riqueza creativa y el bienestar del mundo natural.
