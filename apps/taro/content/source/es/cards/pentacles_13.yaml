  relationshipsReversed: >-
    Invertida, la carta puede sugerir que das más cuidado del que recibes, o que ayudar se ha convertido en gestionar las decisiones de otra persona. Puedes hablar abiertamente del equilibrio y pedir apoyo a cambio. Dejar que otras personas te cuiden puede profundizar la cercanía.
  workUpright: >-
    En el trabajo, la Reina de Oros puede describir competencia unida a calidez: gestionar bien los recursos, apoyar a tus colegas, crear un entorno en el que la gente pueda hacer un buen trabajo. Puedes reconocer tu talento para que las cosas funcionen con fluidez y pensar cómo compartir esa habilidad sin cargar con ella sin ayuda.
  workReversed: >-
    Aquí la carta puede reflejar que te excedes por los demás en el trabajo, o que te cuesta equilibrar el trabajo con la vida en casa. Puedes mirar qué responsabilidades son de verdad tuyas y poner límites a tu tiempo. Cuidar de un equipo de forma sostenible incluye cuidarte.
  growthUpright: >-
    Para el crecimiento personal, esta carta te invita a cuidarte de forma práctica: comidas regulares, descanso, tiempo al aire libre, un espacio cómodo. Puedes crear una pequeña rutina de autocuidado que te dé arraigo y tratarla como un compromiso importante y no como un extra opcional.
