imageryNote: >-
  Una figura está de pie en lo alto de una colina o un acantilado, medio de espaldas, con tres bastones clavados a su alrededor como marcas del esfuerzo, observando barcos o viajeros que cruzan el agua abierta o las llanuras de abajo. La primera luz puede sugerir el comienzo de una nueva etapa. El movimiento lejano representa planes ya en curso, y la postura firme, una confianza paciente mientras los resultados siguen su viaje.
