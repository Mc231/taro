    Invertido, los resultados quizá tarden en aparecer, o un plan haya sufrido retrasos que no podías controlar. En vez de empujar más fuerte en la misma dirección, puedes repasar lo aprendido hasta ahora y ajustar la ruta. Hablar con las personas implicadas puede revelar obstáculos, o éxitos discretos, que es fácil pasar por alto desde donde estás.
  growthUpright: >-
    Confiar en el esfuerzo que ya has puesto es una forma discreta de crecer. El crecimiento a menudo continúa fuera de la vista después de los primeros pasos. Puedes mirar atrás a dónde empezaste hace unos meses y notar qué ha cambiado, y luego elegir qué te gustaría explorar después con esa mirada más amplia.
