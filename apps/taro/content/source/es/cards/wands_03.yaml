  relationshipsReversed: >-
    Invertida, quizá sientas que esperas a que alguien te encuentre a medio camino, o que una relación no avanza al ritmo que esperabas. Puede ayudar compartir abiertamente tus expectativas en vez de medir el avance en silencio. También puedes preguntar qué espera la otra persona, porque quizá sus plazos simplemente sean distintos.
  workUpright: >-
    En el trabajo o en los estudios, el Tres de Bastos puede señalar proyectos que ganan alcance: un lanzamiento, una labor de difusión, una colaboración entre equipos o lugares. Puedes considerar cómo sostener ese impulso, quizá haciendo seguimiento, ampliando tu red o preparando la siguiente fase antes de que llegue, para que tu propio avance no te pille por sorpresa.
