imageryNote: >-
  La ilustración original muestra a una figura que descansa sobre un banco bajo de piedra en un espacio abovedado y tranquilo. Tres espadas cuelgan en calma de la pared y una cuarta yace bajo el banco, todas guardadas. Una luz suave entra por una pequeña ventana. La sala cerrada sugiere un refugio seguro; las espadas guardadas, pensamientos apartados por ahora, y la luz suave, que el mundo de fuera espera con paciencia.
