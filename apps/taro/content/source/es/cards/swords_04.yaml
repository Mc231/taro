  relationshipsReversed: >-
    Invertida, el Cuatro de Espadas puede reflejar una pausa que se ha convertido en distancia, o una relación en la que nadie tiene espacio para respirar. Puedes considerar si es momento de reconectar tras una etapa tranquila, o si necesitas pedir algo de espacio. Ambas peticiones pueden hacerse con suavidad y sin culpas.
  workUpright: >-
