imageryNote: >-
  En la ilustración original, una pequeña barca se desliza desde un agua rizada hacia una orilla quieta y brumosa. Seis espadas están erguidas en la barca como una carga silenciosa, y una figura sentada mira hacia delante. Una larga pértiga empuja con constancia por el agua poco profunda. El agua cambiante muestra el paso de la agitación a la calma; las espadas sugieren lecciones que viajan consigo, y la pértiga, un avance paciente, paso a paso.
