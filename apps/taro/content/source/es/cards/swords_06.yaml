    Invertido, esta carta puede reflejar el apego a patrones conocidos incluso cuando ya no ayudan, o avanzar a toda prisa sin procesar lo ocurrido. Puedes detenerte a mirar atrás una vez, a propósito, y nombrar lo que llevas contigo y lo que estás en condiciones de soltar. Luego, vuelve a mirar hacia el agua.
