  relationshipsReversed: >-
    Invertida, el Seis de Espadas puede reflejar la dificultad para dejar atrás una vieja dinámica, o llevar heridas pasadas a un nuevo capítulo. Puedes considerar qué expectativas pertenecen a una relación anterior y no a esta. Hablar de lo que ambas personas quieren dejar en la orilla de antes puede aligerar el presente.
  workUpright: >-
    En el trabajo, esta carta puede sugerir un cambio gradual: un puesto nuevo, un equipo distinto o dejar un proyecto estresante por un terreno más estable. Quizá la transición no resulte emocionante, pero puede traer alivio. Puedes hacer balance de las habilidades y lecciones que llevas contigo y soltar los hábitos que solo pertenecían a las aguas agitadas.
  workReversed: >-
    Invertido, esta carta puede reflejar un cambio en el trabajo que se sigue aplazando, o tareas pendientes que te atan a una situación que quieres dejar. Puedes hacer una lista de lo que de verdad hay que terminar y de lo que podría traspasarse. A veces cerrar unos cuantos cabos sueltos es lo que por fin permite a la barca salir del muelle.
  growthUpright: >-
    Para el crecimiento personal, el Seis de Espadas te invita a honrar el avance lento. Alejarse de una vieja forma de pensar suele ocurrir a lo largo de muchos días pequeños, no en un solo salto audaz. Puedes notar señales de que ya tienes más calma o más sabiduría que antes, y reconocerte la distancia recorrida.
