shortUpright: >-
  Algo está creciendo, en ti o a tu alrededor. Esta carta te invita a cuidarlo con paciencia y calidez.
shortReversed: >-
  Quizá tu cuidado fluya hacia fuera mientras tu propio pozo se vacía. ¿Por dónde podría volver algo de él a ti?
meaningUpright: |-
  La Emperatriz es la carta del crecimiento que nace del cuidado. Donde la Sacerdotisa escucha hacia dentro, la Emperatriz se vuelve hacia el mundo vivo: huertos, comidas, cosas hechas a mano, el placer de un buen pan o de la luz cálida del sol. Esta carta representa la creatividad que nutre, ya sea un proyecto, un hogar, una amistad o tu propia sensación de bienestar.
  En la vida diaria, esta carta puede reflejar una temporada de creación: cocinar para tus amistades, volver a dibujar, cuidar plantas o personas, o simplemente notar que te sientes en tu cuerpo más a gusto de lo habitual. También puede señalar la paciencia. La Emperatriz sabe que el crecimiento tiene su propio ritmo y que tirar de un brote no lo hace crecer más rápido.
  Esta carta te invita a considerar qué estás cultivando y cómo lo cultivas. Puedes preguntarte dónde un poco más de suavidad, belleza o descanso podría ayudar a que algo florezca. Aquí la abundancia tiene menos que ver con tener mucho y más con notar y disfrutar lo que ya está vivo a tu alrededor.
meaningReversed: |-
  Invertida, la Emperatriz puede reflejar un cuidado que ha perdido el equilibrio. Quizá estés volcando tu energía en todo y en todos excepto en ti, hasta que la creatividad se siente seca y hasta lo agradable parece una obligación. O el cuidado puede inclinarse hacia la implicación excesiva, que sujeta con tanta fuerza que deja poco espacio para que otras personas crezcan a su manera.
  Esta carta también puede señalar un proyecto creativo estancado, o una desconexión de las comodidades sencillas y físicas que normalmente te dan estabilidad.
  Quizá quieras mirar hacia dónde va tu cuidado y si una parte podría volver a casa. Un pequeño gesto de cuidado hacia ti, como una comida nutritiva, un paseo lento o unos minutos creando algo solo por diversión, puede ser una forma de reconectar con la energía generosa de la Emperatriz.
aspects:
  relationshipsUpright: >-
    En las relaciones, la Emperatriz puede reflejar calidez, afecto y la sensación de recibir cuidado, o de cuidar a otras personas con generosidad. Puede invitarte a crear bienestar compartido: comidas juntos, tiempo al aire libre, pequeños gestos de ternura. Quizá notes cómo les gusta a las personas cercanas que las cuiden, y cómo te gusta a ti también.
  relationshipsReversed: >-
    Invertida, la Emperatriz puede preguntarte si el cuidado en una relación se ha vuelto unilateral, o si la preocupación se ha deslizado hacia gestionar las decisiones de otra persona. Puedes considerar dónde podrías dar un paso atrás y confiar más en la otra persona, y dónde podrías pedir con más claridad el cuidado que tú necesitas.
  workUpright: >-
    En el trabajo o en un proyecto creativo, la Emperatriz señala un terreno fértil. Puede reflejar un momento en que las ideas crecen con facilidad, en que puedes cuidar de un equipo, de un jardín de proyectos o de una obra artesanal lenta y gratificante. Te invita a hacer más cómodo tu espacio de trabajo y a valorar el progreso que nace de una atención constante y paciente.
  workReversed: >-
    Invertida, esta carta puede reflejar el agotamiento de cuidar los proyectos de todo el mundo menos los tuyos, o un bloqueo creativo que no cede por mucho que empujes. Puedes preguntarte qué haría que el trabajo volviera a nutrirte: un cambio de entorno, una lista de tareas más corta o el permiso para crear algo imperfecto.
  growthUpright: >-
    Para el crecimiento personal, la Emperatriz te invita a disfrutar de estar en tu cuerpo y en el mundo físico. Aquí el descanso, la buena comida, el tiempo en la naturaleza y los placeres sencillos no son caprichos; son formas de recargar energía. Puedes notar qué te ayuda a sentirte con los pies en la tierra y con ganas de dar, y hacerle un poco más de sitio.
  growthReversed: >-
    Invertida, la Emperatriz puede ser un recordatorio amable de que mereces la misma paciencia que das a los demás. Puede reflejar una desconexión de tus propias necesidades o dudas sobre tu valor creativo. Puedes empezar con un pequeño ritual amable que sea solo tuyo y ver cómo cambia tu semana.
reflectionQuestions:
  - >-
    ¿Qué está creciendo ahora en tu vida que merece algo de paciencia?
  - "¿Cómo te gusta que te cuiden, y se lo has dicho a alguien?"
  - "¿Para qué placer sencillo podrías hacer tiempo hoy?"
imageryNote: >-
  La Emperatriz de Taro se imagina como una figura en reposo en un huerto a finales del verano, rodeada de hortalizas que maduran, un pan enfriándose en el alféizar y un arroyo que pasa cerca. Telas suaves y tejidas y una cesta de fruta recién cogida sugieren bienestar y el placer de los sentidos, mientras las abejas que van de flor en flor insinúan un crecimiento hecho de muchos pequeños actos de cuidado. El ambiente es cálido y sin prisas, e invita a notar la abundancia que ya está presente.
