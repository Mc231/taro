imageryNote: >-
  La ilustración puede mostrar a una sola figura entre parras o árboles frutales, con nueve monedas entretejidas en la vegetación y un pajarillo posado tranquilamente en una mano. El jardín abundante puede simbolizar los frutos del cuidado paciente; el pájaro, una mente disciplinada y amable, y la postura sin prisas, una confianza serena. Los verdes intensos y el dorado pueden sugerir refinamiento sin exceso, un espacio que se siente merecido y hecho a la propia medida.
