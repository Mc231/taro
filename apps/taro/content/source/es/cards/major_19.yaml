shortUpright: >-
  Un momento de calidez y claridad. Esta carta te invita a disfrutar de lo que hay de luminoso y abierto en tu vida.
shortReversed: >-
  La luz sigue ahí, aunque pasen nubes. ¿Qué te ayuda a sentir calidez y claridad?
meaningUpright: |-
  El Sol es una de las cartas más abiertamente alegres de la baraja. Es la energía de una mañana despejada, de una criatura que juega en un jardín, de la sensación de ser plenamente tú sin necesidad de esconderte. Después de la incertidumbre de la Luna, esta carta trae claridad: las cosas pueden verse como son, y a menudo son más sencillas y más cálidas de lo que se temía.
  En la vida cotidiana, esta carta puede reflejar un día en que todo parece un poco más fácil, el orgullo por algo que has hecho, un rato al aire libre que te levanta el ánimo o una relación en la que te sientes con aceptación y tranquilidad. Puede señalar una confianza que no necesita gritar, y los placeres sencillos que hacen que la vida se sienta bien: la risa, el sol, el juego.
  Esta carta te invita a considerar qué te da una alegría auténtica y cómo podrías hacerle más sitio. Puedes preguntarte dónde podrías dejarte ver más plenamente. El Sol destaca un optimismo anclado en el presente, un recordatorio de que está bien celebrar lo que va bien, compartir tu calidez y dejar que vuelva a ti.
meaningReversed: |-
  Invertido, el Sol puede reflejar un momento en que la alegría se siente algo apagada. La calidez no se ha ido; quizá solo esté escondida tras una agenda llena, el cansancio o las dudas. Quizá te cueste más de lo habitual disfrutar de los buenos momentos o sentir orgullo de ti.
  Esta carta también puede señalar un exceso de brillo: poner buena cara cuando sientes otra cosa, o exigirte una actitud positiva todo el tiempo.
  Quizá quieras buscar fuentes pequeñas y sencillas de calidez, como un rato fuera, una actividad lúdica o alguien que te haga reír. También puede ayudar permitirte sentir lo que de verdad sientes y no lo que crees que deberías sentir. La alegría auténtica suele volver con más facilidad cuando no se fuerza.
aspects:
  relationshipsUpright: >-
    En las relaciones, el Sol puede reflejar calidez, apertura y felicidad compartida. Puede invitarte a disfrutar de un tiempo sin complicaciones con las personas que te importan: reír, jugar, estar al aire libre. Las relaciones pueden sentirse más ligeras cuando ambas personas se sienten libres de ser quienes son y de celebrarse mutuamente.
  relationshipsReversed: >-
    Invertida, esta carta puede señalar una relación que ha perdido parte de su ligereza, quizá por el estrés o la rutina. Puedes considerar planear algo sencillo y divertido en compañía, o comprobar si alguien esconde cómo se siente de verdad tras una superficie alegre. La ligereza puede volver a través de pequeños momentos compartidos.
  workUpright: >-
    En el trabajo o en un proyecto, el Sol destaca la claridad, la visibilidad y el entusiasmo. Puede reflejar un momento en que se reconocen tus esfuerzos, o en que el trabajo da energía en vez de quitarla. Puedes compartir tus ideas con confianza y permitirte disfrutar del avance por el camino.
  workReversed: >-
    Invertido, el Sol puede reflejar la sensación de pasar desapercibido, o dificultades para encontrar entusiasmo en tu trabajo. También puede señalar una sobreexposición, como demasiada presión por rendir. Puedes preguntarte qué pequeño cambio traería más energía y calidez a tus días de trabajo.
  growthUpright: >-
    Para el crecimiento personal, esta carta te invita a reconectar con tu entusiasmo y tu curiosidad naturales. Puedes volver a algo que te encantaba en la infancia o probar algo nuevo solo por diversión. La confianza puede crecer tanto de la alegría como de los logros.
  growthReversed: >-
    Invertido, el Sol puede preguntarte si te has exigido demasiado o si has estado demasiado tiempo en modo serio. Puede reflejar una necesidad de juego, descanso y ligereza. Puedes reservar esta semana una pequeña actividad alegre, sin más objetivo que disfrutarla.
reflectionQuestions:
  - >-
    ¿Qué te ha dado últimamente una alegría auténtica, por pequeña que sea?
  - "¿Con quién te sientes con más libertad para ser tú?"
  - >-
    ¿Qué podrías hacer esta semana solo por el placer de hacerlo?
imageryNote: >-
  El Sol de Taro se imagina como un amplio campo en verano al mediodía, con amistades de distintas edades compartiendo comida sobre una manta bajo un sol enorme y cálido. Las cometas suben con la brisa y no se ve ninguna sombra alargada, lo que sugiere un momento sin nada que ocultar. Amarillos brillantes y naranjas cálidos llenan la escena, mientras un perro que corre por la hierba añade una nota de juego. La imagen invita a sentir calidez, claridad y una alegría sin complicaciones.
