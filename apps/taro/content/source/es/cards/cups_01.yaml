  relationshipsReversed: >-
    Invertida, esta carta puede señalar un cariño contenido, quizá por heridas pasadas o por simple cansancio. Quizá notes que escuchas con educación mientras te mantienes un poco fuera de alcance. No hace falta forzar nada. Considera si un pequeño gesto seguro de apertura, como decir lo que valoras, podría dejar que circule un poco más de calidez entre tú y alguien cercano.
  workUpright: >-
