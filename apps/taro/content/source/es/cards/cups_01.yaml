  workReversed: >-
    Invertido, la carta puede reflejar un trabajo que se ha vuelto mecánico, en el que cumples con los gestos mientras tu interés espera en otra parte. Es algo habitual tras un esfuerzo largo. Puedes preguntarte qué te atrajo al principio de este camino, o qué pequeña parte de él sigue viva, y ver si darle más espacio devuelve algo de fluidez.
  growthUpright: >-
    Para el crecimiento personal, el As de Copas invita a la honestidad emocional contigo. Puedes practicar nombrar los sentimientos a medida que llegan, sin clasificarlos como buenos o malos. Escribir un diario, pasar tiempo cerca del agua o simplemente hacer una pausa antes de responder puede abrir espacio para ello. El objetivo no es una felicidad constante, sino una relación más amable y abierta con tu vida interior.
