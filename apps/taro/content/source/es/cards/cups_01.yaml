imageryNote: >-
  La ilustración se centra en una sola copa que rebosa, con su agua cayendo en varios hilos finos sobre un estanque quieto. Los nenúfares o las hojas de loto en la superficie pueden representar sentimientos que se abren despacio y echan raíces en lugares profundos. Una luz suave sobre la copa puede sugerir receptividad, una ofrenda tendida y no agarrada. El ambiente general es de abundancia serena: más que suficiente, desbordándose con suavidad hacia fuera.
