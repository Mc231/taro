shortUpright: >-
  Llega un pensamiento claro; puedes notar qué se vuelve sencillo en cuanto lo nombras sin rodeos.
shortReversed: >-
  Quizá la claridad esté cerca pero aún no al alcance; hay espacio para dejar que la niebla se asiente antes de decidir.
meaningUpright: |-
  El As de Espadas es el momento en que un pensamiento se enfoca. Tras una racha de ruido o confusión, una idea destaca con nitidez, como una sola línea trazada en una página en blanco. Esta carta te invita a considerar qué ves ahora con más claridad que antes y qué hace posible esa claridad.
  En la vida diaria, esto puede ser encontrar por fin las palabras para un sentimiento al que llevabas semanas dando vueltas, o darte cuenta de que un problema que creías complicado tiene un centro honesto. Puede ser el inicio de un plan nuevo, una pregunta que te sientes con ánimo de hacer en voz alta o una decisión que ahora puedes expresar sin rodeos. A veces es simplemente el alivio de entender.
  Pensar con claridad es una herramienta, y como cualquier herramienta funciona bien cuando se sostiene con cuidado. Puedes preguntarte cómo usar esta nueva claridad de una forma que respete tanto la verdad como a las personas a las que afecta. ¿Cómo sería decir lo sencillo con amabilidad y dejar que una idea clara guíe tu siguiente paso pequeño?
meaningReversed: |-
  Invertido, el As de Espadas puede reflejar una claridad bloqueada o retrasada. La idea quizá esté ahí, pero se escapa una y otra vez, o llega enredada entre demasiados pensamientos. Quizá notes que ensayas el mismo argumento en tu cabeza o redactas un mensaje muchas veces sin enviarlo.
  Otra lectura es un filo que ha perdido el cuidado: una verdad dicha con tanta brusquedad que cuesta escucharla, o una certeza que deja fuera otros puntos de vista. La claridad puede volverse quebradiza cuando se usa para ganar y no para entender.
  Esta carta te invita a dar algo de espacio a tu pensamiento. Escribir las cosas, dar un paseo o hablar con alguien de confianza puede dejar que la niebla se disipe sola. Quizá no necesites hoy la respuesta completa. ¿Qué es algo pequeño que ya sabes, y podrías empezar desde ahí?
aspects:
  relationshipsUpright: >-
    En las relaciones, el As de Espadas puede señalar una conversación que despeja el ambiente. Quizá por fin puedas nombrar lo que necesitas, u oír lo que alguien cercano ha intentado decirte. La honestidad ofrecida con calidez puede aligerar un vínculo. Quizá quieras elegir palabras claras sin ser hirientes, para que la verdad sea un puente y no un muro.
  relationshipsReversed: >-
    Invertida, esta carta puede reflejar palabras que quedan sin decir, o palabras dichas con demasiada dureza. Quizá un malentendido haya crecido porque cada persona adivina lo que quiere decir la otra. Puedes considerar ir más despacio antes de una conversación difícil: ¿qué quieres de verdad que entienda la otra persona y qué le ayudaría a escucharlo? Una pregunta amable puede abrir más que una respuesta tajante.
  workUpright: >-
    En el trabajo o en un proyecto, el As de Espadas puede marcar un avance en la comprensión: un planteamiento del problema que por fin tiene sentido, un plan limpio o una idea nueva que merece probarse. Puede ser buen momento para anotar la idea mientras está fresca y compartirla con alguien que pueda ayudar a afinarla. Tener claro el objetivo a menudo hace más visibles los siguientes pasos.
  workReversed: >-
    Invertido, esta carta puede sugerir un proyecto envuelto en niebla: objetivos poco claros, mensajes contradictorios o demasiadas ideas compitiendo a la vez. Empujar más fuerte quizá ayude menos que dar un paso atrás. Puedes probar a nombrar la pregunta que más importa ahora, o pedir claridad a las personas implicadas en vez de adivinar. A veces el movimiento más claro es admitir lo que todavía no se sabe.
  growthUpright: >-
    Para el crecimiento personal, el As de Espadas te invita a notar las historias que te cuentas y a contrastarlas con lo que de verdad sabes. Una mirada fresca puede aflojar un viejo supuesto. Puedes explorar la escritura como forma de atrapar los pensamientos en palabras sencillas, para poder mirarlos en vez de mirar a través de ellos. La curiosidad por tu propia mente puede ser una forma callada de valor.
  growthReversed: >-
    Invertido, esta carta puede reflejar una mente ocupada que no avanza, que da vueltas a las mismas preocupaciones o planes. Puedes notar cuándo pensar se ha convertido en pensar demasiado. El descanso, el movimiento o un cambio de escenario pueden dar espacio a tus pensamientos para asentarse. Está bien mantener una pregunta abierta un poco más mientras la claridad llega a su ritmo.
