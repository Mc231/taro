imageryNote: >-
  La ilustración original se centra en una sola hoja erguida que se alza entre nubes que se abren, con el filo captando la primera luz. Cerca de la punta cuelga un fino aro, que sugiere que una idea clara puede convertirse en un principio que guía. La rodean el cielo abierto y el aire en movimiento, elemento del pensamiento y del aliento. El ambiente es nítido y despierto, como el aire frío de la mañana, y apunta al instante en que una mente dispersa encuentra una línea limpia que seguir.
