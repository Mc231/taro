    ¿Qué opinión imaginas que te frena y se lo has preguntado alguna vez a esa persona?
  - "¿Qué pequeño paso fuera del círculo podrías dar esta semana?"
imageryNote: >-
  En la ilustración original, una figura está de pie sobre un suelo blando de marisma, dentro de un anillo suelto de espadas clavadas en la tierra. Una cinta fina le cubre los ojos y otra le cae sobre las muñecas sin estar anudada. Detrás de la figura, el anillo está abierto y un sendero lleva hacia colinas lejanas. Las cintas sugieren límites que pueden aflojarse, y el hueco abierto apunta a opciones aún no vistas.
