shortUpright: >-
  Quizá te sientas sin salida, pero algunos límites viven sobre todo en el pensamiento; un pequeño movimiento podría mostrar más espacio del que parece.
shortReversed: >-
  Quizá las ataduras se estén aflojando; puedes notar una creencia que ya no te sujeta con tanta fuerza como antes.
meaningUpright: |-
  El Ocho de Espadas muestra a una figura rodeada de espadas, con los ojos cubiertos y las manos atadas sin fuerza. Si se mira con atención, hay un hueco en el círculo y las ataduras no están muy apretadas. Esta carta habla de la experiencia de sentir que no hay salida cuando parte de la trampa está hecha de pensamientos.
  Quizá la reconozcas en una situación en la que todas las opciones parecen bloqueadas, en la que dices «no puedo» antes de intentarlo o en la que el miedo a equivocarte te mantiene en completa quietud. Las limitaciones reales existen, y esta carta no las descarta. Simplemente pregunta si algunas de las paredes son creencias que no has cuestionado: que no tienes elección, que nadie te ayudaría, que es demasiado tarde para cambiar.
  Esta carta te invita a poner a prueba un límite con suavidad. Puedes escribir los pensamientos que te mantienen donde estás y preguntarte cuáles son hechos y cuáles miedos. A veces basta con nombrar una creencia para aflojarla. ¿Qué pequeño paso darías si supusieras que hay un poco más de espacio del que crees?
meaningReversed: |-
  Invertido, el Ocho de Espadas puede reflejar una sensación de liberación. La venda se desliza y el círculo parece menos cerrado que antes. Quizá estés notando opciones que antes no veías, o sientas que es momento de salir de una situación que te tenía sin avanzar.
  Otra lectura es el tirón de los viejos patrones: justo cuando empiezas a moverte, vuelven dudas conocidas que intentan arrastrarte de nuevo al círculo. Esto es parte habitual del cambio, no un fracaso.
  Puedes preguntarte qué te ha ayudado a ganar aunque sea un poco de libertad y cómo hacer más de eso. El apoyo de otras personas, información nueva o simplemente la práctica pueden mantener flojas las ataduras. ¿Qué creencia te sientes con ánimo de dejar y qué te gustaría poner en su lugar?
aspects:
  relationshipsUpright: >-
    En las relaciones, esta carta puede reflejar una sensación de bloqueo: no poder decir lo que necesitas, o la atadura de un papel que se te ha quedado pequeño. También puede mostrar cómo las suposiciones sobre lo que piensan otras personas te mantienen en silencio. Puedes comprobar una de esas suposiciones directamente, con una pregunta amable. A menudo la gente está más abierta al cambio de lo que sugieren nuestros miedos.
  relationshipsReversed: >-
    Invertida, el Ocho de Espadas puede señalar una libertad nueva en un vínculo: hablar por fin, poner un límite o ver una dinámica conocida con ojos nuevos. Puedes notar dónde los viejos miedos todavía intentan silenciarte. Practicar pequeños actos de honestidad puede ayudar a que la nueva perspectiva se convierta en parte estable de tu forma de relacionarte.
  workUpright: >-
    En el trabajo, esta carta puede reflejar la sensación de encierro entre expectativas, reglas o la creencia de que te faltan habilidades para cambiar tu situación. Algunos límites pueden ser reales. Puedes hacer una lista de las opciones que has descartado y volver a mirar una de ellas. Una conversación con un mentor o una amistad puede revelar caminos que no habías considerado.
  workReversed: >-
    Invertido, esta carta puede sugerir salir de la rutina: probar un enfoque nuevo, pedir otras responsabilidades o soltar una vieja historia sobre lo que eres capaz de hacer. Quizá notes un destello de inseguridad al moverte. Trátalo como una señal de crecimiento y no como un motivo para detenerte.
  growthUpright: >-
    Para el crecimiento personal, el Ocho de Espadas te invita a notar la voz interior que dice que no puedes. Puedes preguntarte con suavidad dónde aprendió esa voz sus reglas. Cuestionar una creencia no significa forzarte a superar cada miedo; significa darte permiso para buscar el hueco en el círculo.
  growthReversed: >-
    Invertido, esta carta puede reflejar un aflojamiento real de los pensamientos limitantes. Puedes señalar el avance que has hecho, por pequeño que sea, y practicar la nueva mirada con regularidad para que se fortalezca. Cuando vuelvan las viejas dudas, puedes recibirlas con curiosidad y no con rendición.
reflectionQuestions:
  - >-
    ¿Cuál de tus límites es un hecho y cuál podría ser un miedo disfrazado de hecho?
