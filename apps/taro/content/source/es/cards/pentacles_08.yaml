imageryNote: >-
  La ilustración puede mostrar a una figura inclinada sobre un banco de trabajo, con herramientas en la mano, dando forma a una moneda mientras las monedas terminadas cuelgan en una fila ordenada cerca, quizá en un poste o una pared. Un camino o una ciudad a lo lejos pueden sugerir un mundo más amplio del que quien trabaja se ha apartado para concentrarse. Las monedas repetidas pueden simbolizar la práctica y la constancia, y la postura absorta, la satisfacción serena de un trabajo hábil y atento.
