imageryNote: >-
  La ilustración muestra a una figura con capa, con la cabeza inclinada sobre tres copas volcadas cuyo contenido se filtra en la tierra. Detrás de ella, dos copas siguen en pie y son fáciles de pasar por alto. Un camino o un cruce a lo lejos puede sugerir una forma de seguir cuando llegue el momento. Los tonos fríos y apagados expresan el duelo, mientras que una fina línea de luz sobre las copas en pie insinúa que no todo se ha perdido.
