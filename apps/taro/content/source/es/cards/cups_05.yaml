  workReversed: >-
    Invertido, la carta puede reflejar la recuperación tras un contratiempo y el comienzo de nuevas opciones a la vista. Quizá notes que una puerta cuyo cierre lamentaste ha dejado espacio para otra cosa. Considera escribir un breve repaso de lo ocurrido, centrado en las lecciones y no en la culpa, para seguir adelante con más claridad.
  growthUpright: >-
    El duelo y el arrepentimiento merecen un lugar en tu historia, y esta carta pregunta cómo dárselo sin dejar que escriban el resto. Puedes practicar notar cuándo tu atención vuelve una y otra vez a lo que salió mal. Ampliar la mirada con suavidad, aunque sea unos minutos al día, puede ayudarte a ver el panorama completo.
