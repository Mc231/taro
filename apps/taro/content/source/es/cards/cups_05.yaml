  relationshipsReversed: >-
    Invertida, la carta puede reflejar un movimiento hacia la reconciliación, o hacia la paz con cómo ha cambiado una relación. Quizá te sientas con ánimo de soltar un viejo agravio, o al menos de sostenerlo con menos fuerza. Piensa cómo sería el perdón para ti, recordando que no te obliga a aceptar lo que no te parece bien.
  workUpright: >-
