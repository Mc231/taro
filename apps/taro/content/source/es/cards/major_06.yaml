shortUpright: >-
  Una elección hecha con el corazón y la cabeza a la vez, en sintonía con lo que de verdad valoras.
shortReversed: >-
  Quizá una parte de ti quiera una cosa y otra parte otra. Esta carta te invita a escuchar a ambas antes de elegir.
meaningUpright: |-
  Los Enamorados suele leerse como una carta de romance, pero su tema más profundo es la alineación: el encuentro de dos partes, dos personas o dos caminos de una forma que se siente completa. Pregunta qué es lo que más valoras y si las decisiones que tienes delante lo reflejan. Aquí la conexión es con otras personas y también contigo.
  En la vida cotidiana, esta carta puede reflejar una relación en la que alguien te ve de verdad, una colaboración de trabajo en la que las ideas fluyen con facilidad o una decisión que te pide decir con claridad qué te importa. Puede señalar un momento de elegir entre dos buenas opciones, sin una respuesta correcta evidente, solo la que encaja con la persona en la que te estás convirtiendo.
  Esta carta te invita a considerar cuánta honestidad hay contigo y con los demás. Puedes preguntarte qué te atrae y por qué, y con qué te comprometerías de verdad. Los Enamorados destaca que las elecciones con sentido rara vez tienen que ver con la perfección. Se trata de reunir tu corazón y tu juicio en la misma habitación y dejar que hablen.
meaningReversed: |-
  Invertida, los Enamorados puede reflejar la sensación de tirar en dos direcciones. Lo que quieres y lo que crees que deberías querer quizá no coincidan, o un vínculo cercano puede sonar ligeramente desafinado, con cada persona valorando cosas distintas sin decirlo.
  Esta carta también puede señalar una decisión que se sigue aplazando, quizá porque elegir una opción implica soltar otra. Evitar la elección puede parecer más fácil a corto plazo mientras va gastando energía en silencio.
  Quizá quieras anotar lo que cada opción te ofrece y te pide honestamente, y qué valores tuyos apoya. Puede ayudarte notar dónde te sientes más tú. La realineación a menudo empieza con una pequeña confesión sincera, primero a ti y después, si lo sientes adecuado, a otra persona.
aspects:
  relationshipsUpright: >-
    En las relaciones, los Enamorados puede reflejar un entendimiento mutuo profundo y el placer de elegirse, ya sea en el amor, la amistad o la familia. Puede invitarte a compartir lo que de verdad valoras y a escuchar también lo que valora la otra persona. La cercanía crece cuando ambas personas pueden ser honestas y seguir sintiéndose bienvenidas.
  relationshipsReversed: >-
    Invertida, esta carta puede señalar una distancia entre las esperanzas o prioridades de dos personas, o sentimientos que no se han expresado. Puedes considerar si te estás adaptando demasiado para mantener la paz o si esperas que alguien adivine lo que necesitas. Una conversación abierta y amable sobre valores podría ayudar a ambas personas a ver dónde están.
  workUpright: >-
    En el trabajo o en un proyecto, los Enamorados destaca la colaboración y las elecciones arraigadas en tus valores. Puede reflejar una alianza que saca lo mejor de ambas personas, o una decisión sobre qué dirección seguir. Puedes preguntarte qué opción tiene sentido además de ser práctica, y dejar que ambas cosas cuenten en tu elección.
  workReversed: >-
    Invertida, los Enamorados puede reflejar fricción en una colaboración o la sensación de que tu trabajo no encaja con lo que te importa. También puede señalar dudas ante una elección entre dos caminos. Puedes anotar lo que cada camino te pediría y notar a cuál te sientes con más disposición de dárselo.
  growthUpright: >-
    Conocer con más claridad tus propios valores es el trabajo interior al que apunta esta carta. Cuando entiendes lo que te importa, las elecciones dejan de girar en torno a complacer a los demás y pasan a ser una forma de ser fiel a ti. Puedes anotar tres valores y notar dónde guían ya tus días.
  growthReversed: >-
    Invertida, los Enamorados puede reflejar un conflicto interior: una parte de ti quiere cambio y otra quiere comodidad. Ninguna de las dos se equivoca. Puedes dar voz a cada una, en papel o en una conversación, y ver si hay una elección que respete a ambas, aunque sea en parte.
reflectionQuestions:
