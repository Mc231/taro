imageryNote: >-
  Los Enamorados de Taro se imaginan como dos figuras a ambos lados de un arroyo estrecho, extendiendo las manos para unirlas por encima del agua, dibujadas de modo que cualquiera pueda verse en una u otra. Sobre ellas, dos pájaros vuelan en círculo en el mismo cielo luminoso. En una orilla crece un árbol frutal y en la otra una enredadera en flor: dos dones distintos que se encuentran en el centro. El arroyo sugiere la elección y el esfuerzo que una conexión real pide a ambas personas.
