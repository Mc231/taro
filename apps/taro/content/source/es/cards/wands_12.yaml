imageryNote: >-
  Una figura a caballo, en pleno galope, se inclina hacia delante sobre un caballo que se encabrita o salta, con el bastón en alto y la capa ondeando detrás. Colinas desérticas o llanuras abiertas se extienden por delante, y pequeñas formas de llamas o salamandras pueden adornar su ropa. El caballo que salta representa la pasión y el empuje; el bastón alzado, el propósito llevado a la acción, y el amplio paisaje, una aventura que aún se despliega. La inclinación hacia delante insinúa a la vez valor y prisa.
