shortUpright: >-
  Una energía audaz y aventurera está lista para moverse; puedes seguir tu pasión sin perder de vista el camino.
shortReversed: >-
  Quizá la energía vaya por delante del rumbo; puede ser un momento para frenar la carga y elegir hacia dónde apuntar.
meaningUpright: |-
  El Caballero de Bastos es el fuego en movimiento. Montado en un caballo brioso y con un bastón en alto, esta figura avanza con pasión, confianza y gusto por la aventura. Donde la Sota se asombra, el Caballero actúa.
  Esta energía puede aparecer como una decisión repentina de viajar, un arranque de motivación para empezar por fin ese proyecto o la disposición a asumir un riesgo que antes habría parecido demasiado audaz. Puede traer encanto, valor y un entusiasmo contagioso que arrastra a otras personas.
  Esta carta te invita a confiar en tu impulso y dejar que te lleve a territorio nuevo. El impulso es valioso, y a veces la única forma de descubrir adónde lleva un camino es ponerse en marcha. Al mismo tiempo, un caballo al galope necesita a alguien que sepa más o menos adónde va. Puedes canalizar esta energía en una aventura clara y mantener la atención suficiente para ajustarte si el terreno cambia bajo tus pies.
meaningReversed: |-
  Invertido, el Caballero de Bastos puede reflejar una energía que va más rápido que su dirección. Quizá empieces las cosas a toda prisa y pierdas el interés a medio camino, actúes por impulso y luego tengas que lidiar con las consecuencias, o sientas frustración porque tu empuje no tiene adónde ir.
  También puede señalar una pasión contenida, con una inquietud que crece porque las circunstancias te hacen esperar.
  Puede ser un momento para preguntarte adónde quiere ir tu fuego y qué le ayudaría a llegar sin consumirse. Puedes hacer una pausa antes de una gran decisión, terminar una cosa antes de empezar la siguiente o encontrar una salida sana para la energía inquieta, como el movimiento, una tarea creativa o una conversación sincera sobre lo que se siente bloqueado.
aspects:
  relationshipsUpright: >-
    En las relaciones, esta carta puede reflejar ilusión, atracción y sentido de aventura: planes espontáneos, conversaciones intensas, ganas de hacer cosas en compañía. Puedes disfrutar de la energía comprobando también que el ritmo le va bien a todo el mundo. Las aventuras compartidas suelen ser más ricas cuando ambas personas opinan sobre la dirección.
  relationshipsReversed: >-
    Invertida, los sentimientos intensos quizá vayan más rápido que la comunicación, o el entusiasmo se enfríe tan deprisa como llegó. Puedes notar si tú o alguien cercano actúan por impulso sin consultar. Bajar el ritmo para hablar de lo que cada persona quiere de verdad puede dar estabilidad a un vínculo lleno de chispas.
  workUpright: >-
    En el trabajo o en un proyecto, el Caballero de Bastos puede señalar una iniciativa audaz: presentar una idea ambiciosa, liderar un empujón o actuar rápido ante una oportunidad. Puedes usar este impulso para vencer la inercia, haciendo a la vez un plan sencillo para los pasos posteriores al primer arranque emocionante.
  workReversed: >-
    Invertido, quizá estés precipitando decisiones o sientas bloqueo e impaciencia. Puedes comprobar si de verdad hace falta velocidad o si una breve pausa para planificar te serviría mejor. Convertir la frustración en una lista clara de próximas acciones puede ayudar a que tu energía avance en vez de dar vueltas.
  growthUpright: >-
    El valor y el apetito de experiencias son dones que esta carta te pide usar. ¿Qué harías si confiaras en tu propio entusiasmo? Puedes probar algo que te exija estirarte y notar cómo se siente actuar desde la pasión y no solo desde la prudencia.
  growthReversed: >-
    Invertido, puedes explorar tu relación con el impulso. ¿Cuándo te da alegría la espontaneidad y cuándo te dispersa? Aprender a hacer una breve pausa antes de actuar, sin perder tu chispa, puede ayudar a que tu energía sea algo que diriges y no algo que te dirige.
reflectionQuestions:
