shortUpright: >-
  Estás al borde de lo que conoces, mirando hacia fuera; es un buen momento para esbozar adónde te gustaría ir.
shortReversed: >-
  Quizá la comodidad y la prudencia mantengan un plan mayor en la estantería; podrías mirar de nuevo qué te retiene.
meaningUpright: |-
  El Dos de Bastos sigue a la primera chispa con una pausa para la visión. La idea ya no es solo un sentimiento; ahora estás en un lugar un poco más alto, mirando el paisaje y preguntándote hasta dónde podría llegar. Un bastón ya está plantado detrás de ti, señal de lo que has construido, y el otro está en tu mano, listo para llevarlo a algún lugar nuevo.
  Esta carta suele aparecer cuando sopesas un paso mayor: hacer un curso en otra ciudad, rediseñar un puesto, empezar un proyecto que te pide más que tu rutina habitual. También puede reflejar la inquietud de haber dejado pequeño un espacio al que todavía tienes cariño.
  Aquí la invitación es planear con ambición y honestidad a la vez. Puedes escribir lo que esperas, lo que costaría en tiempo y energía y qué primer movimiento es lo bastante pequeño para probarlo. Mirar lejos es útil; también lo es elegir el siguiente paso que de verdad puedes dar.
meaningReversed: |-
  Invertido, el Dos de Bastos puede reflejar un plan que se queda en el papel. Quizá sigas contemplando el horizonte sin hacer la maleta, porque lo conocido parece más seguro o porque el destino aún se ve borroso. A veces la duda es sabia, y a veces es simple costumbre.
  Esta carta también puede señalar planes hechos para obtener la aprobación de otra persona, o una visión que ya no encaja con quien estás llegando a ser. Cuando una meta pesa en vez de ilusionar, puede valer la pena preguntarte si sigue siendo tuya.
  Puedes revisar tu mapa con ojos nuevos. ¿Cómo sería una versión más pequeña y personal de este plan? ¿Qué miedo suena más fuerte, y tiene que ver con el paso en sí o con lo que puedan pensar los demás? Nombrarlo puede hacer que el siguiente movimiento se sienta menos como un salto y más como una elección.
aspects:
  relationshipsUpright: >-
    En las relaciones, esta carta puede invitar a una conversación sobre el futuro que imagina cada persona: dónde quieren vivir, cómo quieren pasar el tiempo, qué esperan explorar. Puede reflejar un vínculo que se siente como una base segura desde la que cada cual es libre de mirar hacia fuera. Puedes preguntar a alguien cercano hacia qué horizonte mira últimamente.
  relationshipsReversed: >-
    Invertida, quizá tú o alguien cercano se estén guardando un deseo de cambio porque decirlo en voz alta parece arriesgado. Los planes pueden distanciarse en silencio cuando nunca se comparten. Puede ser un momento para hablar de esperanzas que se han mantenido en privado, escuchando tanto como hablando, para que nadie planee sin la otra persona.
  workUpright: >-
    En el trabajo, el Dos de Bastos puede señalar un pensamiento estratégico: trazar la siguiente etapa de un proyecto, considerar un campo nuevo o dar forma a una meta a más largo plazo. Puedes dedicar algo de tiempo a la visión general antes de volver a las tareas diarias, y luego elegir una acción concreta que saque el plan de la pizarra y lo ponga en marcha.
  workReversed: >-
    Invertido, un plan de trabajo quizá esté atascado entre la comodidad y la ambición, o se haya formado más por lo que parece esperado que por lo que quieres. Puedes comprobar si la meta todavía te motiva. Si es así, dividirla en un primer pequeño experimento puede ayudar; si no, redibujar el plan también es una forma válida de avanzar.
  growthUpright: >-
    Para el crecimiento personal, esta carta te invita a tomarte en serio tus propias ambiciones. ¿Qué explorarías si te dieras permiso para pensar más allá de tus límites habituales? Puedes esbozar una imagen aproximada del próximo año o dos, no como una promesa fija, sino como una dirección que te ayude a notar las oportunidades cuando aparezcan.
  growthReversed: >-
    Invertido, el deseo de seguridad y el deseo de crecer quizá tiren en direcciones distintas. Ambos son necesidades reales. Puedes explorar qué haría que un paso nuevo se sintiera lo bastante seguro para intentarlo, y qué apoyo, práctica o información podría convertir una idea lejana en algo a lo que acercarte poco a poco.
reflectionQuestions:
  - >-
    Cuando miras más allá de tu rutina actual, ¿qué anhelas explorar?
  - >-
    ¿Qué apoyo haría que un paso mayor pareciera más posible, y se lo has contado a esa persona?
  - >-
    ¿Cuál es el primer movimiento más pequeño que pondría a prueba este plan en la vida real?
imageryNote: >-
  Una figura está de pie sobre un muro alto o una cornisa, con un bastón firmemente clavado a su lado y un segundo sostenido con ligereza en la mano, mirando hacia tierras o mares lejanos. Cerca descansa un pequeño globo terráqueo, un mapa o una brújula. El bastón fijo representa lo ya construido, y el alzado, la elección de ir más lejos. La amplia vista invita a imaginar muchas rutas posibles y no un único camino marcado.
