shortUpright: >-
  Tienes a tu alcance una energía cálida y segura; puedes permitirte ocupar espacio y compartir tu luz.
shortReversed: >-
  Quizá tu fuego interior parpadee o esté al límite; podrías mirar qué agota tu confianza y qué la renueva.
meaningUpright: |-
  La Reina de Bastos encarna un fuego que se ha vuelto estable y radiante. Sentada con soltura junto a un hogar encendido, con un bastón con hojas en la mano, esta figura tiene confianza sin necesidad de demostrar nada. Aquí la energía es cálida, magnética y generosa: alguien capaz de iluminar una habitación y aun así conservar su propio centro.
  Quizá reconozcas esta cualidad en ti cuando hablas con soltura, recibes a la gente con calidez genuina o te dedicas a un proyecto creativo con pasión y sentido práctico a la vez. También puede describir a alguien de tu vida cuya confianza anima a los demás a brillar.
  Esta carta te invita a reconocer tus dones. La confianza no tiene por qué ser ruidosa; puede ser la sensación serena de que tienes algo valioso que ofrecer. Puedes notar dónde tiendes a encogerte y experimentar con ocupar un poco más de espacio. Compartir tu calidez, tu entusiasmo y tus ideas puede ser un regalo para ti y para quienes te rodean.
meaningReversed: |-
  Invertida, la Reina de Bastos puede reflejar una llama que se ha atenuado. Quizá estés dudando de ti, con el cansancio de ser siempre quien pone la energía, o guardándote tu vitalidad para no llamar la atención.
  A veces la Reina invertida señala un fuego usado de formas menos generosas: la comparación, la envidia o la necesidad de controlar el foco. Esto suele nacer de sentir que nadie te ve.
  Puede ser un momento para cuidar tu propio fuego. ¿Qué ha estado agotando tu confianza y qué solía renovarla? Puedes volver a una actividad que te haga sentir vida, pasar tiempo con personas que te valoran o descansar sin culpa. La confianza suele volver poco a poco, a medida que reconectas con lo que te importa y no con cómo te ven.
aspects:
  relationshipsUpright: >-
    En las relaciones, esta carta puede reflejar calidez, apertura y un fuerte sentido de ti dentro de un vínculo. Puedes aportar energía y ánimo a las personas que quieres sin dejar de ser fiel a tus propias necesidades. Esta cualidad puede hacer que las relaciones se sientan vivas y sinceras, con libertad para que cada persona brille.
  relationshipsReversed: >-
    Invertida, quizá te sientas a la sombra de alguien, sin que se valore lo que das, o con la tentación de compararte. Puedes considerar si has estado dando calidez sin recibirla. Expresar lo que necesitas, y valorarte antes de esperar a que otros lo hagan, puede ayudar a recuperar el equilibrio en un vínculo cercano.
  workUpright: >-
    En el trabajo o en los esfuerzos creativos, la Reina de Bastos puede señalar un liderazgo seguro y el don de inspirar a otras personas. Puedes asumir de forma visible un proyecto, compartir tus ideas con convicción y crear un ambiente en el que tus colegas sientan energía. Tu entusiasmo puede ser un recurso práctico, no solo un estado de ánimo.
  workReversed: >-
    Invertida, quizá estés repartiendo tu energía entre demasiados papeles o dudes de tus capacidades tras un contratiempo. Puedes identificar las tareas que de verdad aprovechan tus fortalezas y proteger tiempo para ellas. Soltar la necesidad de estar en todas partes a la vez puede ayudar a que vuelva tu confianza natural.
  growthUpright: >-
    Tu calidez tiene un efecto en los demás, y esta carta te pide reconocerlo. ¿Qué te hace sentir más vida y más seguridad en ti? Puedes notar los entornos en los que sientes confianza y llevar un poco de esa energía a las áreas en las que normalmente te contienes.
  growthReversed: >-
    Invertida, puedes explorar dónde la inseguridad o la comparación ocupan espacio en tus pensamientos. Puede ayudar notar tus propios avances y cualidades sin medirlos con los de nadie más. El descanso y el juego son dos formas de reavivar un fuego que ha bajado.
reflectionQuestions:
