  - >-
    ¿De qué forma podrías ocupar un poco más de espacio esta semana?
imageryNote: >-
  Una figura está sentada con soltura en un amplio asiento en un claro soleado, con un bastón con hojas apoyado en una mano y la otra abierta hacia quien mira. A su lado brilla el fuego de un hogar, y un animal atento descansa cerca. El hogar sugiere la calidez ofrecida a los demás; la mano abierta, la generosidad, y la postura relajada, una confianza que no necesita demostrarse. Los dorados y ámbares cálidos pueden evocar el fuego en su forma más asentada y radiante.
