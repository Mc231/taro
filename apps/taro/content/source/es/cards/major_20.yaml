shortUpright: >-
  Un momento para mirar atrás con honestidad, perdonar lo que puedas y responder a lo que te llama hacia delante.
shortReversed: >-
  Quizá tu crítico interior suene más fuerte de lo habitual. ¿Qué te mostraría una mirada justa y amable a tu pasado?
meaningUpright: |-
  El Juicio es una carta de despertar y renovación. Tiene menos que ver con que otras personas te juzguen que con llegar a un punto de autorreflexión honesta: mirar dónde has estado, tomar lo aprendido y sentir que es el momento de alzarte hacia un nuevo capítulo. A menudo hay una sensación de llamada, un impulso interior que dice que ha llegado la hora.
  En la vida cotidiana, esta carta puede reflejar un momento de claridad tras un largo periodo de confusión, la decisión de dedicarte por fin a algo que habías aplazado o un ajuste de cuentas con una elección pasada que te ayuda a seguir adelante. Puede señalar el perdón, a ti o a otra persona, y el alivio de ver tu historia bajo una luz más completa y más justa.
  Esta carta te invita a considerar qué te está llamando ahora. Puedes preguntarte qué harías si confiaras en que tus experiencias pasadas te han preparado para ello. El Juicio destaca la renovación a través de la comprensión: cuando puedes mirar tu historia con honestidad y compasión, quizá descubras más libertad para elegir lo que viene después.
meaningReversed: |-
  Invertido, el Juicio puede reflejar un crítico interior duro. Quizá estés repasando viejos errores, dudando de tu valía o dudando en avanzar por algo del pasado. La llamada está ahí, pero la culpa o el miedo quizá la estén ahogando.
  Esta carta también puede señalar que evitas por completo la reflexión: pasar de una cosa a otra sin detenerte a aprender de lo ocurrido.
  Quizá quieras mirar tu pasado con la misma justicia que ofrecerías a una amistad. ¿Qué aprendiste y qué te sientes con ánimo de dejar atrás? Escribir una carta de comprensión a tu yo más joven puede ser una forma de empezar. Responder a la llamada no exige perfección; puede empezar con un solo paso honesto.
aspects:
  relationshipsUpright: >-
    En las relaciones, el Juicio puede reflejar un punto de inflexión: dejar atrás viejos agravios, renovar un compromiso o un ajuste de cuentas mutuo que acerca a las dos personas. Puede invitarte a hablar con honestidad del pasado y decidir en compañía lo que quieren a partir de ahora. El perdón, cuando se siente adecuado, puede abrir espacio a un nuevo comienzo.
  relationshipsReversed: >-
    Invertida, esta carta puede señalar culpas o juicios que persisten en una relación, por una parte o por ambas. Puedes considerar si aferrarte a viejas heridas aún te protege o si te mantiene en el mismo sitio. Una conversación abierta y tranquila podría ayudar a ambas personas a ver las cosas con más justicia.
  workUpright: >-
    En el trabajo o en un proyecto, el Juicio destaca el sentido de vocación. Puede reflejar que descubres qué tipo de trabajo tiene sentido para ti, o que revisas proyectos pasados para decidir qué viene después. Puedes escuchar lo que te entusiasma y preguntarte cómo podrían servir tus habilidades a esa dirección.
  workReversed: >-
    Invertido, el Juicio puede reflejar que el miedo a la crítica te frena, o que ignoras la sensación de que es hora de un cambio. También puede señalar una mirada demasiado crítica sobre tu desempeño pasado. Puedes anotar lo que has aprendido y cómo podría guiar tu siguiente paso.
  growthUpright: >-
    Una revisión reflexiva de tu recorrido hasta ahora puede ser en sí misma un punto de inflexión. Puedes mirar atrás a una etapa importante y notar cómo has crecido y qué has soltado. Esa perspectiva puede ayudarte a responder a una nueva llamada con confianza y claridad.
  growthReversed: >-
    Invertido, el Juicio puede preguntarte si cargas con una culpa innecesaria o con reproches hacia ti. Puede reflejar la necesidad de soltar viejas historias sobre ti. Puedes practicar notar cuándo tu voz interior se vuelve dura y ofrecerte con suavidad una mirada más justa. Una voz interior más justa puede hacer que crecer se sienta más ligero y más posible.
reflectionQuestions:
  - "¿Qué sientes que te está llamando hacia delante ahora mismo?"
  - >-
    ¿Hay alguien, incluida tu propia persona, a quien te sientas con ánimo de mirar con más justicia?
  - >-
    ¿Qué lección del pasado te gustaría llevar a tu próximo capítulo?
imageryNote: >-
  El Juicio de Taro se imagina como un amplio paisaje al amanecer tras un largo invierno, donde una campana clara suena desde lo alto de una colina y la gente sale de sus casas a la primera luz, estirándose y mirando hacia arriba. La nieve que se derrite deja ver brotes verdes. Una ventana abierta, con las cortinas ondeando hacia fuera, sugiere una llamada interior que recibe respuesta. Las montañas lejanas insinúan la perspectiva que trae la reflexión honesta, y los colores pálidos de la mañana hablan de renovación.
