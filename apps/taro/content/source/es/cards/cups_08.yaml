imageryNote: >-
  La ilustración muestra a una figura que camina sin compañía con un bastón, vista de espaldas mientras deja en la orilla una pila cuidadosa de copas. Por delante se alzan colinas y un sendero sinuoso bajo una fina luna creciente. Un hueco visible en la pila de copas puede sugerir algo incompleto. Los azules profundos y los plateados evocan la introspección y la atracción serena hacia lo que aún no se ha explorado.
