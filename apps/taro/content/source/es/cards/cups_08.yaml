  relationshipsReversed: >-
    Invertida, esta carta puede reflejar dudas ante una relación que no llena, o el patrón de retirarte cada vez que crece la cercanía. Puedes preguntarte si te quedas por amor o por miedo, y si te vas por necesidad o por costumbre. Una comunicación clara y amable puede ayudar en ambos casos.
  workUpright: >-
    En el trabajo, esta carta puede reflejar el deseo de más propósito, incluso cuando todo parece estable. Puede invitarte a explorar qué te resultaría más significativo, quizá probando un área nueva, aprendiendo algo distinto o rediseñando tu puesto actual. Pasar página puede ser un cambio interior mucho antes de convertirse en uno exterior.
  workReversed: >-
    Invertido, la carta puede reflejar la sensación de estancarte en un trabajo o un proyecto que se te ha quedado pequeño, o de saltar de un puesto a otro sin asentarte. Puedes hacer una lista de lo que echarías de menos y de lo que dejarías con gusto. Piensa si un cambio de enfoque, y no de lugar, podría cubrir la necesidad que sientes.
  growthUpright: >-
    Para el crecimiento personal, el Ocho de Copas invita a un viaje interior. Puedes reservar tiempo para reflexionar sobre lo que da sentido a tu vida ahora, frente a lo que se lo daba antes. Caminar, escribir un diario o una breve pausa en la rutina pueden ayudarte a oír hacia dónde te sientes con ganas de avanzar.
  growthReversed: >-
    Invertido, esta carta puede pedirte que notes patrones de evitación o de inquietud. ¿Dejas situaciones para escapar de la incomodidad, o te quedas para evitar el cambio? Puedes practicar quedarte con la incertidumbre un poco más antes de actuar. Entender tu propio patrón puede hacer que las decisiones futuras sean más claras y más amables.
