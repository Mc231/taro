  - >-
    ¿Qué cosa bajo tu control podrías tener como foco esta semana?
imageryNote: >-
  La Rueda de la Fortuna de Taro se imagina como una gran rueda que gira en un cielo que pasa del amanecer en un extremo a la noche en el otro, mostrando todas las fases a la vez. Pequeñas figuras y criaturas recorren su borde, unas subiendo y otras bajando, ninguna quieta. Los símbolos de las cuatro estaciones en las esquinas pueden enmarcar la idea de los ciclos naturales. En el eje, un centro sereno e inmóvil sugiere la perspectiva estable que puede encontrarse incluso mientras todo gira.
