shortUpright: >-
  Las cosas están girando. Esta carta te invita a notar el ciclo en el que estás y cómo quieres moverte con él.
shortReversed: >-
  Quizá un patrón conocido esté volviendo. ¿Qué podrías hacer de otra manera esta vez?
meaningUpright: |-
  La Rueda de la Fortuna es la carta de los ciclos. Las estaciones cambian, el ánimo sube y baja, los periodos ajetreados dan paso a otros tranquilos. Nada se queda para siempre arriba ni abajo. Esta carta te recuerda que el cambio es una parte normal de la vida, y que una parte escapa al control de cualquiera mientras que otra responde a la forma en que lo recibes.
  En la vida cotidiana, esta carta puede reflejar un punto de inflexión: un capítulo que se cierra y otro que se abre, un golpe de suerte que cambia tus planes o un contratiempo inesperado que cambia tu ritmo. También puede señalar que reconoces un patrón que ya ha aparecido antes, como el mismo tipo de situación que llega con otra forma, y que lo miras con ojos nuevos.
  Esta carta te invita a considerar en qué punto de tu propia rueda estás ahora. Puedes preguntarte qué te pide esta etapa y qué podría estar enseñándote. La Rueda no decide tu vida por ti. Destaca que la flexibilidad, la perspectiva y el sentido del humor pueden ayudarte a tomar las curvas, y que una temporada difícil es una temporada, no un estado permanente.
meaningReversed: |-
  Invertida, la Rueda de la Fortuna puede reflejar la sensación de un bucle del que no se sale o de resistirte a un cambio que ya está en marcha. Quizá sientas que los acontecimientos te pasan por encima, o notes que el mismo patrón frustrante vuelve una y otra vez con otro disfraz.
  Esta carta también puede señalar el aferrarse a una buena etapa por miedo a que no dure. Aferrarse hace que el giro natural se sienta más difícil.
  Quizá quieras mirar lo que está a tu alcance. Los patrones suelen repetirse hasta que algo en nuestra forma de responder cambia, aunque sea un poco. Puede ayudarte nombrar el ciclo que ves, notar tu parte en él sin culparte y elegir una pequeña cosa que hacer de otra manera. No puedes detener la rueda, pero puedes encontrar en ella un punto de apoyo más firme.
aspects:
  relationshipsUpright: >-
    En las relaciones, la Rueda puede reflejar una nueva etapa: acercarse, pasar a otra fase o simplemente adaptarse a circunstancias cambiantes. Puede invitarte a mantener la flexibilidad y a hablar abiertamente de cómo están cambiando las cosas. Las relaciones, como las estaciones, tienen ritmos, y nombrarlos puede ayudar a atravesarlos en compañía.
  relationshipsReversed: >-
    Invertida, esta carta puede señalar conflictos conocidos que vuelven una y otra vez, o una resistencia a que la relación cambie de forma. Puedes considerar qué patrón tienden a repetir tú y alguien cercano, y qué podría probar cada persona de otra manera. El cambio no tiene por qué significar pérdida; puede significar crecimiento.
  workUpright: >-
    En el trabajo o en un proyecto, la Rueda destaca circunstancias cambiantes y nuevas oportunidades. Puede reflejar un cambio de planes, un equipo nuevo o un proyecto que de repente avanza. Puedes prestar atención a las oportunidades sin olvidar que cada etapa, ajetreada o lenta, tiene algo que ofrecer.
  workReversed: >-
    Invertida, la Rueda puede reflejar frustración por los retrasos o la sensación de que el esfuerzo no da fruto. También puede señalar que repites el mismo enfoque esperando un resultado distinto. Puedes revisar qué ha funcionado antes, qué no y dónde un pequeño cambio de método podría modificar el patrón.
  growthUpright: >-
    Ver tu vida como una serie de ciclos, y no como una única línea recta, puede ser liberador. Notar tus propios ritmos, como cuándo tienes energía o cuándo necesitas descanso, puede ayudarte a planificar a su favor y no en su contra. Puedes trazar un mapa del último año y notar sus puntos de inflexión.
  growthReversed: >-
    Invertida, la Rueda puede preguntarte si estás intentando controlar lo que no se puede controlar. Puede reflejar el deseo de certeza en un tiempo de cambios. Puedes practicar soltar una cosa en la que no puedes influir y poner esa energía en una en la que sí puedes.
reflectionQuestions:
