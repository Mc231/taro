    ¿Qué intuyes sobre tu situación que no has dicho en voz alta?
  - >-
    ¿Qué silencio, incluido el tuyo, merecería que lo escucharas con más atención?
  - "¿Dónde podrías reservarte diez minutos de calma esta semana?"
imageryNote: >-
  La Sacerdotisa de Taro se imagina sentada en el umbral de una puerta bañada por la luna, mitad en la luz y mitad en la sombra, con un libro cerrado sobre las rodillas. Detrás de la figura, una cortina se mueve como si algo esperara al otro lado. Una luna creciente reflejada en una pila de agua quieta puede evocar los ciclos y la intuición, y los tonos azul profundo sugieren calma en la superficie y hondura debajo. La quietud serena y atenta de la figura es el centro de la imagen.
