shortUpright: >-
  Una invitación serena a escuchar lo que ya intuyes pero aún no has puesto en palabras.
shortReversed: >-
  El ruido de fuera quizá esté tapando una voz interior más tranquila; un poco de silencio podría ayudar.
meaningUpright: |-
  La Sacerdotisa se sienta entre dos columnas, en el umbral entre lo conocido y lo que aún está oculto. Esta figura no actúa ni explica; su don es la atención: esa escucha profunda y paciente que nota lo que hay bajo la superficie de una situación, una conversación o un sentimiento.
  En la vida cotidiana, esta carta puede reflejar una corazonada que no puedes justificar del todo, la sensación de que algo no se está diciendo o un sueño que te acompaña hasta la tarde. Puede señalar momentos en los que la respuesta no llega reuniendo más información, sino sentándote en calma con lo que ya tienes. Algunas cosas solo se aclaran cuando dejas de forzar la claridad.
  Esta carta te invita a confiar en las partes más lentas y menos verbales de ti. Puedes reservar tiempo para escribir en tu diario, dar un paseo sin auriculares o simplemente hacer una pausa antes de responder. El saber interior no sustituye a los hechos, y puede convivir con ellos. La Sacerdotisa te pide que notes lo que tu voz más callada ha intentado decirte y que le des un poco de espacio antes de decidir qué hacer.
meaningReversed: |-
  Invertida, la Sacerdotisa puede sugerir que tu voz interior está presente, pero cuesta oírla. Los días ajetreados, las opiniones ajenas o un flujo constante de pantallas pueden desplazar la quietud que esta carta necesita. Quizá notes que sigues preguntando a otras personas qué hacer con algo que en parte ya sabes.
  Esta carta también puede señalar algo que llevas guardado demasiado tiempo: un sentimiento, una pregunta o una verdad que ha permanecido oculta y ahora pesa. La intimidad es sana; un secreto que te aísla quizá merezca una segunda mirada.
  Quizá quieras crear un pequeño rincón de silencio y ver qué aflora. Puede ayudarte escribir sin corregir, o hacerte una pregunta sencilla y esperar la primera respuesta honesta. ¿Qué has intuido que aún no te has permitido decir?
aspects:
  relationshipsUpright: >-
    En las relaciones, la Sacerdotisa puede reflejar un vínculo en el que mucho se entiende sin palabras, o un momento en el que escuchar importa más que hablar. Puede invitarte a notar las corrientes de fondo: lo que podría significar el silencio de una amistad o lo que protege tu propia reticencia. Puedes ofrecer a alguien cercano el regalo de una atención sin prisas.
  relationshipsReversed: >-
    Invertida, esta carta puede señalar cosas que quedan sin decir entre tú y alguien cercano, o la costumbre de leer entre líneas sin preguntar directamente. Puedes considerar si una pregunta amable y honesta podría sustituir a las suposiciones. También puede reflejar la necesidad de proteger tu mundo interior y, a la vez, dejar que alguien vea un poco más de él.
  workUpright: >-
    En el trabajo o en un proyecto, la Sacerdotisa puede sugerir que no todas las decisiones tienen que tomarse hoy. Puede invitarte a observar, reunir impresiones y confiar en tu sentido del momento oportuno. El trabajo reflexivo, como investigar, escribir, planificar o acompañar a otras personas, encaja bien con esta carta. La competencia serena y la discreción quizá se valoren más de lo que imaginas.
  workReversed: >-
    Invertida, la Sacerdotisa puede reflejar que dudas de un buen instinto porque otras voces suenan más fuerte, o que en un equipo se retiene información. Puedes preguntarte qué sabes de una situación que todavía no has expresado. Encontrar una forma tranquila y adecuada de compartirlo podría aclarar el trabajo para todo el mundo, también para ti.
  growthUpright: >-
    El crecimiento con la Sacerdotisa suele empezar en la quietud. Puedes experimentar con unos minutos al día en los que simplemente notes tus pensamientos, tu respiración o tu entorno, sin intentar arreglar nada. Con el tiempo, esta clase de atención puede ayudarte a distinguir entre el parloteo ansioso y una sensación interior más estable.
  growthReversed: >-
    Invertida, la Sacerdotisa puede preguntarte si últimamente has vivido sobre todo en la superficie, reaccionando sin reflexionar. Puede ser un empujón para volver hacia dentro, sin la presión de encontrar respuestas inmediatas. Puedes reservar un pequeño ritual de calma esta semana y notar qué cambia cuando te das espacio para escuchar.
reflectionQuestions:
