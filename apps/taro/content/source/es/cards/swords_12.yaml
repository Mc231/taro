imageryNote: >-
  La ilustración original muestra a una figura a caballo inclinada hacia delante sobre un caballo al galope, con la espada extendida y la capa restallando al viento. Los árboles de la ladera se doblan en la misma dirección, y nubes deshilachadas corren por el cielo. La inclinación hacia delante y las nubes veloces sugieren impulso y convicción, mientras que los árboles doblados insinúan la fuerza que esa velocidad ejerce sobre todo lo que la rodea.
