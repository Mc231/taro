imageryNote: >-
  Una figura camina inclinada hacia delante, rodeando con los brazos un alto haz de diez bastones que casi le tapa la cara, hacia una pequeña casa o un pueblo en el horizonte. El haz representa las responsabilidades acumuladas; el rostro oculto, cómo una carga pesada puede estrechar la mirada, y el destino cercano, un final al alcance. El camino abierto deja espacio para imaginar que la carga se comparte o se deja en el suelo.
