shortUpright: >-
  Quizá cargues con más de lo que te toca; esta carta te invita a notar el peso y lo que de verdad hay que cargar.
shortReversed: >-
  Quizá parte de la carga esté lista para salir de tus hombros; podrías mirar qué dejar, compartir o rechazar.
meaningUpright: |-
  El Diez de Bastos muestra a alguien que carga un gran haz de bastones, rodeándolo con los brazos, con la cabeza inclinada, caminando hacia una casa a lo lejos. El fuego que empezó como una sola chispa se ha multiplicado en muchos compromisos, y sostener cada uno exige esfuerzo.
  Esta carta suele aparecer cuando las responsabilidades se han ido acumulando poco a poco: un proyecto que no dejó de crecer, un puesto que absorbió tareas extra, cuidar de otras personas mientras intentas mantener vivos tus propios planes. Mucho de ello quizá empezó con entusiasmo o por sentido del deber, y puede costar recordar cuándo se volvió tan pesado.
  Esta carta te invita a mirar con honestidad lo que sostienes. ¿Qué responsabilidades son tuyas y cuáles han caído sobre ti por inercia? ¿Cuáles siguen conectadas con algo que te importa? El destino quizá esté cerca, pero aun así puedes preguntarte si podrías cargar esto de otra manera: en porciones más pequeñas, con ayuda o dejando algunas cosas por el camino.
meaningReversed: |-
  Invertido, el Diez de Bastos puede señalar un momento de liberación. Quizá empieces a soltar responsabilidades que nunca fueron tuyas, a delegar o a decir que no a peticiones que añadirían más peso. Puede haber alivio al darte cuenta de que no tienes que cargar con todo a la vez.
  También puede reflejar el patrón opuesto vuelto hacia dentro: empeñarte en hacerlo todo sin ayuda, incluso cuando hay ayuda disponible, porque pedirla parece más difícil que esforzarse.
  Puede ser buen momento para ordenar tu carga. Puedes hacer una lista de lo que llevas y marcar lo que podría compartirse, aplazarse o dejarse. Los cambios pequeños, como una tarea delegada o una invitación rechazada, pueden marcar una diferencia real. Soltar no es fracasar; puede ser una forma de guardar tu energía para lo que más importa.
aspects:
  relationshipsUpright: >-
    En las relaciones, esta carta puede reflejar un desequilibrio en quién carga con qué: una persona que se ocupa de casi toda la planificación, las preocupaciones o el trabajo emocional. Puedes notar si el reparto parece justo y hablarlo abiertamente. Compartir el peso puede acercar a las personas, mientras que cargar de más en silencio suele alimentar un resentimiento callado.
  relationshipsReversed: >-
    Invertida, quizá estés aprendiendo a pedir ayuda o a apartarte de papeles que asumiste por otras personas. Al principio puede resultar incómodo. Puedes considerar qué responsabilidades te gustaría compartir y cómo pedirlo de una forma que invite a cooperar, sin esperar a que el cansancio te impida pedir nada.
  workUpright: >-
    En el trabajo o en los estudios, el Diez de Bastos puede señalar un exceso de compromisos: más tareas que tiempo, o un proyecto que ha crecido más allá de su forma inicial. Puedes hacer balance de tus compromisos, aclarar prioridades con las personas implicadas y buscar lo que se pueda simplificar. Terminar bien a menudo depende de cargar menos a la vez.
  workReversed: >-
    Invertido, quizá empieces a poner límites, delegar o renegociar plazos, o quizá te resistas a hacerlo. Puedes identificar una tarea que otra persona podría asumir, o un compromiso que podrías rechazar. Hacer espacio en tu carga de trabajo puede devolverte la concentración y el entusiasmo con el que empezó todo.
  growthUpright: >-
    Una creencia útil de cuestionar aquí es que debes encargarte de todo. ¿De dónde viene esa creencia? Puedes notar cómo responden tu cuerpo y tu ánimo a una carga pesada, y tratar esas señales como información sobre lo que necesita cambiar.
  growthReversed: >-
    Invertido, quizá estés descubriendo la ligereza que llega al dejar algo en el suelo. Puedes explorar qué quieres seguir cargando porque le da sentido a tu vida y qué estás en condiciones de soltar. Elegir tus responsabilidades, en vez de simplemente aceptarlas, puede ser un acto discreto de respeto hacia ti.
