imageryNote: >-
  La ilustración muestra a una figura coronada, sentada sobre agua en movimiento en una plataforma de piedra gastada, con una copa en una mano y un bastón corto en la otra. El agua a su alrededor sube y baja, pero sus hombros siguen relajados y su mirada se mantiene serena. Este contraste sugiere dominio emocional, mientras que los azules profundos templados por toques dorados insinúan sabiduría y generosidad.
