imageryNote: >-
  La ilustración muestra a una figura, vista de espaldas, frente a siete copas que flotan en una bruma cambiante. Cada copa contiene un símbolo distinto, quizá una llave, una guirnalda, una casita, una estrella, una forma enroscada, una caja cerrada y un espejo, que representan el acceso, el elogio, la seguridad, la esperanza, la inquietud, los secretos y la propia imagen. Una luz suave y onírica y unos colores cambiantes pueden sugerir lo seductoras e inciertas que son estas visiones, invitando a preguntarse cuál de ellas es real.
