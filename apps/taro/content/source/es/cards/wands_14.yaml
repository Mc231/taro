shortUpright: >-
  Una energía clara y visionaria te invita a liderar con propósito y convertir grandes ideas en un rumbo que otros puedan seguir.
shortReversed: >-
  Quizá un fuerte empuje se esté volviendo impaciencia o control; podrías comprobar si tu visión aún deja espacio a los demás.
meaningUpright: |-
  El Rey de Bastos lleva el fuego del palo a su madurez. Sentado en un trono, pero algo inclinado hacia delante, con el bastón en la mano, esta figura parece lista para actuar. La energía es visionaria y decidida: alguien que ve hacia dónde podrían ir las cosas y tiene la confianza y la experiencia para marcar el rumbo.
  Esta cualidad puede aparecer cuando te haces cargo de un proyecto, guías a un grupo a través de un cambio o tomas una decisión audaz basada en valores claros. También puede describir a un mentor o a alguien al frente cuyo sentido del propósito da valor a los demás.
  Esta carta te invita a asumir tu propia autoridad. Aquí el liderazgo tiene menos que ver con el control y más con la visión, la integridad y la constancia. Puedes preguntarte a qué objetivo mayor sirven tus esfuerzos actuales y cómo podrías compartirlo con claridad con las personas implicadas. Cuando un rumbo es honesto y se comunica bien, la gente a menudo quiere sumarse a él, no solo obedecer.
meaningReversed: |-
  Invertido, el Rey de Bastos puede reflejar un empuje que ha perdido el equilibrio. Quizá te impaciente el ritmo de los demás, saques adelante planes sin escuchar o te pongas metas tan altas que no dejan espacio para el descanso. Por otro lado, puede señalar a alguien al mando, quizá tú, que ha perdido de vista la visión y no sabe bien hacia dónde ir.
  Esta carta quizá te invite a mirar cómo usas tu influencia. ¿Tu energía inspira a la gente o la abruma? ¿Sigue viva la visión para ti?
  Puedes hacer una pausa para reconectar con tu propósito, pedir opiniones sinceras o compartir más las decisiones. Un liderazgo sólido suele nacer tanto de escuchar como de dirigir.
aspects:
  relationshipsUpright: >-
    En las relaciones, esta carta puede reflejar una presencia segura, protectora y alentadora. Puedes aportar visión a los planes compartidos y ayudar a las personas cercanas a creer en sus propias metas. La invitación es liderar con generosidad, ofreciendo dirección cuando es bienvenida y apoyo cuando otra persona quiere llevar el timón.
  relationshipsReversed: >-
    Invertida, quizá una persona esté tomando demasiado control de las decisiones, o la impaciencia esté creando tensión. Puedes notar si estás escuchando de verdad a alguien cercano o si ya estás preparando tu respuesta. Invitar las ideas de la otra persona puede convertir un plan unilateral en uno compartido.
  workUpright: >-
    En el trabajo o en un proyecto, el Rey de Bastos puede señalar liderazgo, visión estratégica y el valor de tomar la iniciativa. Puedes definir un objetivo claro, comunicarlo con entusiasmo y delegar confiando en las fortalezas de los demás. La integridad y la coherencia ayudan a que la gente se sienta segura siguiendo un rumbo ambicioso.
  workReversed: >-
    Invertido, quizá estés empujando demasiado, esperando que los demás sigan tu ritmo, o sin tener claro el rumbo. Puedes dar un paso atrás para revisar la visión con las personas implicadas. Pedir aportaciones y ajustar las metas puede hacer que un plan sea más realista y cuente con más apoyo.
  growthUpright: >-
    Para el crecimiento personal, esta carta te invita a hacerte cargo de tu rumbo. ¿Qué quieres construir a largo plazo y qué valores lo guían? Puedes escribir una breve declaración de propósito y usarla como punto de referencia para las decisiones que vienen.
  growthReversed: >-
    Invertido, puedes explorar cómo te relacionas con el control y la paciencia. ¿Sientes que siempre tienes que llevar las riendas, o evitas liderar porque te parece demasiado? Encontrar un término medio, en el que diriges tu propia vida con confianza y flexibilidad, puede ser una forma estable de fuerza.
reflectionQuestions:
  - >-
    ¿Hacia qué visión trabajas y con qué claridad podrías describírsela a otra persona?
  - >-
    ¿Cómo podrías liderar de una forma que invite a los demás a aportar sus fortalezas?
  - >-
    ¿Dónde podría un poco más de paciencia hacer más eficaz tu empuje?
imageryNote: >-
  Una figura está sentada en un asiento elevado al borde de un mirador, inclinada hacia delante, con un bastón florecido firmemente plantado a su lado, como si estuviera a punto de levantarse. Más allá, un camino serpentea hacia colinas lejanas iluminadas por el sol de la tarde. El bastón florecido sugiere una visión viva que crece; el mirador, una amplia vista de lo que podría construirse, y la inclinación hacia delante, la disposición a convertir las ideas en acción. Brasas o pequeños motivos de llamas pueden evocar el elemento fuego.
