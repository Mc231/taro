shortUpright: >-
  El avance es posible cuando reúnes tus distintos impulsos y los diriges hacia un mismo rumbo.
shortReversed: >-
  Quizá la energía tire en varias direcciones a la vez. ¿Dónde podrías retomar las riendas con suavidad?
meaningUpright: |-
  El Carro es la carta de avanzar con propósito. Su imagen tradicional muestra dos animales que tiran de un vehículo, a menudo de colores distintos, como si cada uno quisiera ir por su lado. La tarea de quien conduce no es luchar contra ellos, sino guiarlos juntos. Ese es el corazón de esta carta: convertir la tensión interior en una dirección firme.
  En la vida cotidiana, esta carta puede reflejar una semana en la que por fin te comprometes con una meta y la mantienes pese a las distracciones: entrenar para un evento, terminar un trabajo grande, mudarte o hacer un cambio del que llevas mucho tiempo hablando. Puede señalar la disciplina de equilibrar necesidades que compiten, como la ambición y el descanso, o el entusiasmo y la prudencia, sin dejar que una gane del todo.
  Esta carta te invita a considerar adónde quieres ir y qué te está desviando. Puedes preguntarte cómo usar tus sentimientos encontrados como combustible y no como freno. El Carro destaca el enfoque y la voluntad, y también la protección tranquila de conocerte lo bastante bien como para llevar el timón.
meaningReversed: |-
  Invertido, el Carro puede reflejar un impulso que se ha detenido o dispersado. Quizá tengas mucho que hacer y aun así no termines de avanzar, dividiendo tu energía entre demasiadas metas o sin saber qué dirección es realmente la tuya. Las riendas están ahí, pero quizá se sientan flojas.
  Esta carta también puede señalar un exceso de empuje: forzar el progreso a base de puro esfuerzo mientras ignoras las señales de que la ruta necesita ajustes. La fuerza de voluntad por sí sola puede llevarte lejos, pero se agota cuando no va acompañada de claridad.
  Quizá quieras hacer una pausa y nombrar las fuerzas que tiran de ti. ¿Cuáles importan más ahora y cuáles podrían esperar? Elegir una dirección clara para los próximos días, y permitirte dejar las demás a un lado por un tiempo, puede ayudarte a sentir de nuevo firmeza en el asiento del conductor.
aspects:
  relationshipsUpright: >-
    En las relaciones, el Carro puede reflejar un sentido compartido de dirección: atravesar juntos una etapa ajetreada o difícil, cada persona apoyando las metas de la otra. Puede invitarte a hablar de hacia dónde van ambas personas y de cómo mantener el mismo ritmo. Aquí el compromiso se parece a un esfuerzo constante y a un ánimo mutuo.
  relationshipsReversed: >-
    Invertida, esta carta puede señalar a dos personas que tiran en direcciones distintas, o a una que lleva el timón mientras la otra se siente arrastrada. Puedes considerar si estás empujando una relación hacia una meta antes de que ambas personas estén preparadas. Bajar el ritmo para acordar el destino podría aliviar la tensión.
  workUpright: >-
    En el trabajo o en un proyecto, el Carro destaca el empuje y el esfuerzo enfocado. Puede reflejar una fase de llevar un proyecto hasta la meta, competir de forma sana o mantener a un equipo avanzando unido. Puedes fijar un objetivo claro, reunir tus recursos y darte un plazo realista que elijas tú.
  workReversed: >-
    Invertido, el Carro puede reflejar un proyecto que pierde impulso o la sensación de ir con prisas sin un plan claro. También puede señalar prioridades contradictorias que vienen de distintas personas. Puedes dar un paso atrás, aclarar cómo sería realmente el éxito y decidir qué tareas te acercan a él y cuáles solo llenan tu agenda.
  growthUpright: >-
    Para el crecimiento personal, esta carta te invita a practicar la autodirección. Saber lo que quieres y mantener unidos tus distintos estados de ánimo y motivos es una habilidad. Puedes elegir una meta con sentido y notar cómo te mantienes en el rumbo, celebrando cada pequeño tramo de camino que recorres.
  growthReversed: >-
    Invertido, el Carro puede preguntarte si te estás exigiendo demasiado o si dejas que otras personas marquen tu rumbo. Puede ser una invitación a reconectar con tus propias razones para ir adonde vas. Puedes hacer una pausa cada mañana y preguntarte qué dirección sientes de verdad como tuya hoy.
reflectionQuestions:
  - >-
    ¿Qué dos partes de ti tiran ahora mismo en direcciones distintas?
  - "¿Quién viaja a tu lado y cómo se apoyan mutuamente?"
  - >-
    ¿Con qué dirección concreta podrías comprometerte durante los próximos días?
imageryNote: >-
  El Carro de Taro se imagina como una figura que conduce un carro pequeño y robusto por una carretera junto al mar, tirado por dos animales de temperamento opuesto, uno tranquilo y otro inquieto. Quien conduce sostiene las riendas con ligereza y dirige con atención, sin fuerza. Un toldo con forma de concha sobre el asiento puede aludir a Cáncer y a la protección que permite avanzar con seguridad, mientras que la carretera abierta y las luces lejanas del puerto sugieren un destino elegido, no impuesto.
