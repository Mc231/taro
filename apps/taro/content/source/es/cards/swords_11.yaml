shortUpright: >-
  La curiosidad está despierta; puedes seguir una pregunta con ojos nuevos y ver adónde lleva tu pensamiento.
shortReversed: >-
  Quizá los pensamientos impacientes se dispersen en muchas direcciones; podrías notar dónde escuchar serviría más que hablar.
meaningUpright: |-
  La Sota de Espadas es una mente joven y rápida que se encuentra con el mundo. De pie en una colina ventosa, con la espada en alto, la Sota lo observa todo, con ganas de aprender, preguntar y poner a prueba las ideas. Esta carta habla de la curiosidad antes de la pericia, el emocionante comienzo de entender algo nuevo.
  Quizá reconozcas esta carta en las ganas de investigar un tema hasta bien entrada la noche, en hacer la pregunta que nadie más se atreve a hacer o en la energía de empezar un curso, un debate o un proyecto que estira tu pensamiento. También puede reflejar estar alerta y observar, reunir información antes de comprometerte con una opinión.
  Esta carta te invita a disfrutar de aprender. No necesitas tener todas las respuestas; hacer buenas preguntas puede bastar por ahora. También puedes notar cómo compartes lo que descubres. El entusiasmo por las ideas llega mejor cuando va acompañado de escucha. ¿Qué tema o pregunta llama tu atención y cómo podrías explorarlo con audacia y humildad a la vez?
meaningReversed: |-
  Invertida, la Sota de Espadas puede reflejar una curiosidad que ha perdido el rumbo. Las ideas quizá se dispersen más rápido de lo que puedes seguirlas, o quizá empieces muchas cosas sin terminar ninguna. La energía mental es alta, pero el enfoque es escaso.
  Otra lectura es que las palabras vayan más rápido que el pensamiento: hablar antes de escuchar, transmitir algo sin comprobarlo o ponerte a la defensiva cuando se cuestiona una idea. El filo sin cuidado puede hacer las conversaciones más difíciles de lo necesario.
  Esta carta te invita a bajar un poco el ritmo de tu pensamiento. Puedes elegir un hilo que seguir por ahora y dejar que los demás esperen. Antes de compartir una opinión, podrías hacer una pregunta más. ¿Qué podrías aprender si escucharas con las mismas ganas con que quieres hablar?
aspects:
  relationshipsUpright: >-
    En las relaciones, la Sota de Espadas puede señalar conversaciones animadas, curiosidad por el mundo interior de alguien o el deseo de entender del todo una situación. Puedes hacer las preguntas que te has planteado, con interés genuino y sin sospecha. Saber escuchar forma parte de esta carta tanto como la rapidez con las palabras.
  relationshipsReversed: >-
    Invertida, esta carta puede reflejar palabras descuidadas, secretos que se transmiten o la costumbre de debatir en vez de conectar. Puedes notar si la curiosidad se ha convertido en fisgoneo o en actitud defensiva. Detenerte a pensar cómo pueden llegar tus palabras puede proteger la confianza. Una simple disculpa por un comentario precipitado puede tener mucho efecto.
  workUpright: >-
    En el trabajo, la Sota de Espadas puede reflejar una fase de aprendizaje: una habilidad nueva, una investigación reciente o un puesto que te pide pensar con rapidez. Puedes ofrecerte para tareas que amplíen tu comprensión y pedir a tus colegas que te expliquen lo que saben. Tomar notas y poner a prueba los supuestos puede convertir el entusiasmo inicial en un conocimiento sólido.
  workReversed: >-
    Invertida, esta carta puede sugerir una atención dispersa: saltar entre tareas, compartir ideas a medio formar demasiado pronto o reaccionar rápido ante las críticas. Puedes elegir una prioridad que profundizar antes de añadir más. Comprobar los datos antes de presentarlos e invitar a dar opiniones con calma puede hacer tus ideas más sólidas y más fiables.
  growthUpright: >-
    Para el crecimiento personal, la Sota de Espadas te invita a cultivar una mente de principiante. Puedes acercarte a un tema del que sabes poco y permitirte sentir curiosidad sin necesidad de impresionar. Preguntar por qué, leer de todo y notar tus propios supuestos puede mantener tu pensamiento fresco y flexible.
  growthReversed: >-
    Invertida, esta carta puede reflejar pensamientos inquietos que saltan antes de aterrizar. Puedes practicar terminar una idea antes de empezar la siguiente, o notar cuándo sientes el impulso de defenderte en vez de considerar. La curiosidad vuelta hacia ti, preguntándote por qué reaccionas como reaccionas, puede ser un punto de partida útil.
