imageryNote: >-
  En la ilustración original, una figura joven está en lo alto de una colina cubierta de hierba, con la espada alzada y la mirada hacia el horizonte. El viento agita la hierba y dispersa una bandada de pajarillos por un cielo luminoso surcado de nubes. La espada alzada sugiere la disposición a poner a prueba las ideas; los pájaros, pensamientos rápidos que van y vienen, y el punto elevado, el deseo de verlo todo a la vez.
