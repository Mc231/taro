shortUpright: >-
  Quizá tu esfuerzo se esté notando; permítete recibir cierto reconocimiento y fíjate en quién te ayudó a llegar aquí.
shortReversed: >-
  Quizá el reconocimiento no llegue o satisfaga menos de lo esperado; podrías preguntarte qué es para ti el éxito, en tus términos.
meaningUpright: |-
  El Seis de Bastos es una carta de reconocimiento. Tras la fricción del Cinco, alguien avanza a caballo con una corona de laurel en su bastón, y la gente a lo largo del camino parece aclamarle. Captura el momento en que el esfuerzo se hace visible y los demás lo reconocen.
  Esto puede ser una buena valoración de un trabajo en el que pusiste el alma, una amistad que te dice que admira cómo llevaste algo, o completar un reto que en su día dudaste poder afrontar. También puede ser una confianza más discreta: caminar con la cabeza un poco más alta porque sabes que lo hiciste bien.
  Esta carta te invita a aceptar el aprecio sin quitarle importancia. El reconocimiento puede dar energía y valor para el siguiente paso. Al mismo tiempo, la figura está rodeada de gente, un recordatorio de que pocos logros son del todo individuales. Puedes disfrutar del momento y también pensar en quién te apoyó y cómo podrías compartir parte del mérito.
meaningReversed: |-
  Invertido, el Seis de Bastos puede reflejar un esfuerzo que ha pasado desapercibido, o elogios que no terminan de llegarte. Quizá hayas logrado algo y aun así sientas que no cuenta hasta que otra persona lo diga. También puede señalar el cansancio de aparentar una confianza que no sientes del todo.
  A veces esta carta invertida describe un éxito discreto, importante para ti aunque no sea visible para los demás. Ese tipo de avance también cuenta.
  Puede ser un momento para mirar cuánto de tu sentido de valía depende del aplauso. ¿Cómo sería reconocer primero tu propio esfuerzo? Puedes escribir aquello que te enorgullece, incluidas las partes que nadie más vio, y dejar que eso sea una fuente de ánimo más estable que la aprobación externa.
aspects:
  relationshipsUpright: >-
    En las relaciones, esta carta puede reflejar un aprecio que fluye en ambas direcciones: sentir orgullo por alguien cercano, o sentir su mirada y su apoyo. Puede invitarte a celebrar en voz alta los logros de cada cual. Puedes decirle a una amistad, a tu pareja o a un familiar algo que admiras de esa persona, y permitirte recibir su ánimo a cambio.
  relationshipsReversed: >-
    Invertida, quizá sientas que tus esfuerzos en una relación pasan desapercibidos, o que el reconocimiento se ha convertido en una competición silenciosa. Puedes considerar decir con claridad qué tipo de aprecio te importa y preguntarle lo mismo a la otra persona. Un agradecimiento pequeño y concreto a menudo cambia más el ambiente que los grandes gestos.
  workUpright: >-
    En el trabajo o en los estudios, el Seis de Bastos puede señalar resultados visibles: una valoración positiva, un proyecto bien recibido, un momento para presentar lo que has hecho. Puedes usar esta confianza para compartir tus ideas con más apertura, reconociendo también a quienes contribuyeron. El reconocimiento compartido con generosidad suele construir equipos más sólidos.
  workReversed: >-
    Invertido, tus aportaciones quizá pasen desapercibidas, o el éxito dependa demasiado de cómo se ven las cosas desde fuera. Puedes hacer tu trabajo más visible de forma tranquila y objetiva, como un breve resumen de lo que has entregado, y reflexionar también sobre qué resultados te importan con independencia de quién los note.
  growthUpright: >-
    Para el crecimiento personal, esta carta te invita a permitirte sentir orgullo. Reconocer tus avances puede construir una confianza que te acompañe en el siguiente reto. Puedes guardar una breve lista de cosas que has llevado bien últimamente, para volver a ella los días en que tu confianza flaquee.
  growthReversed: >-
    Invertido, la inseguridad o la necesidad de aprobación quizá estén apagando tu sensación de logro. Puedes explorar de dónde viene tu idea del éxito y si todavía encaja contigo. Definir el éxito con tus propias palabras puede hacer que el reconocimiento ajeno sea un extra agradable y no algo de lo que dependes.
