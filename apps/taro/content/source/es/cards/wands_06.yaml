imageryNote: >-
  Una figura a caballo, sobre un animal tranquilo, avanza entre una pequeña multitud con un bastón coronado por una guirnalda de hojas. Otros bastones alzados flanquean el camino como una guardia de honor. La guirnalda representa el reconocimiento ganado con esfuerzo; el caballo sereno, una confianza entrenada y no apresurada, y las figuras de alrededor, la comunidad que comparte y apoya el logro.
