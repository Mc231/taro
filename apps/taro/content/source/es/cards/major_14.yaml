shortUpright: >-
  Una mezcla más lenta y constante de lo que necesitas podría darte más calma que cualquier extremo.
shortReversed: >-
  Quizá algo se esté inclinando demasiado hacia un lado. Esta carta te invita a notarlo y reequilibrarlo con suavidad.
meaningUpright: |-
  La Templanza es la carta de mezclar las cosas en la medida justa. Su imagen suele mostrar agua que se vierte de un recipiente a otro, con cuidado, para que apenas se derrame. La habilidad no está en elegir una cosa frente a otra, sino en combinarlas: trabajo y descanso, acción y paciencia, lo que quieres ahora y lo que querrás más adelante.
  En la vida cotidiana, esta carta puede reflejar encontrar un ritmo que funciona, como un horario con suficiente espacio, un acuerdo que respeta a ambas personas o un hábito ajustado poco a poco hasta que encaja. Puede señalar la satisfacción tranquila de la moderación, menos emocionante que los extremos, pero a menudo más sostenible.
  Esta carta te invita a considerar dónde le vendría bien a tu vida un poco más de equilibrio. Puedes preguntarte qué partes están demasiado llenas y cuáles descuidadas, y qué pequeños ajustes podrían acercarlas. La Templanza destaca la paciencia: las buenas mezclas llevan tiempo, y experimentar con suavidad puede enseñarte más que cualquier cambio radical repentino.
meaningReversed: |-
  Invertida, la Templanza puede reflejar una sensación de desequilibrio. Quizá estés volcando demasiado en un área de tu vida, como el trabajo, una relación o una preocupación, mientras otra se seca. O quizá notes un vaivén entre extremos: todo o nada, actividad frenética o agotamiento, rigidez o descuido.
  Esta carta también puede señalar impaciencia con un proceso que necesita tiempo, y la tentación de forzar los resultados en vez de dejar que se mezclen.
  Quizá quieras hacer un inventario sencillo. ¿Dónde te estás excediendo y dónde te estás quedando por debajo? Elegir un ajuste suave, y no un arreglo drástico, puede ayudarte a recalibrar. El equilibrio no es un lugar al que se llega una vez; es algo a lo que vuelves una y otra vez con pequeñas correcciones.
aspects:
  relationshipsUpright: >-
    En las relaciones, la Templanza puede reflejar una armonía construida con acuerdos y comprensión. Puede invitarte a encontrarte con alguien a medio camino, a combinar sus estilos y necesidades distintos y a tener paciencia mientras aprenden los ritmos de cada cual. Un cuidado sereno y constante puede hacer que un vínculo resulte fácil de habitar.
  relationshipsReversed: >-
    Invertida, esta carta puede señalar una relación en la que dominan las necesidades de una persona, o en la que los conflictos escalan rápido. Puedes considerar cómo bajar la intensidad: ir más despacio en las conversaciones, hacer pausas cuando los ánimos se calientan y buscar el punto de encuentro entre lo que quiere cada persona.
  workUpright: >-
    En el trabajo o en un proyecto, la Templanza destaca el progreso constante y la buena colaboración. Puede reflejar la combinación de habilidades o ideas distintas en algo que funciona bien, o dosificar tu energía para que dure. Puedes buscar la versión del plan que sea ambiciosa y aun así sostenible.
  workReversed: >-
    Invertida, la Templanza puede reflejar exceso de trabajo, decisiones precipitadas o roces entre personas con enfoques distintos. Puedes preguntarte dónde el ritmo se ha vuelto poco realista y qué se podría simplificar. Encontrar un término medio entre prioridades que compiten puede reducir el estrés de todas las personas implicadas. Incluso una tarde sin reuniones puede mostrar cómo se siente un ritmo más estable.
  growthUpright: >-
    Para el crecimiento personal, esta carta te invita a practicar la moderación sin rigidez. Puedes notar tus propios puntos de equilibrio: cuánto descanso, actividad, tiempo a solas y tiempo con otras personas te ayudan a sentir estabilidad. Los ajustes pequeños y constantes pueden traer más calma que los grandes propósitos.
  growthReversed: >-
    Invertida, la Templanza puede preguntarte si has estado funcionando a base de extremos. Puede reflejar la necesidad de bajar el ritmo, descansar o volver a incluir en tus días un ingrediente que falta. Puedes elegir un área para reequilibrarla con suavidad y darte tiempo para ver cómo se asienta.
reflectionQuestions:
