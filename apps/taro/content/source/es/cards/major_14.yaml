imageryNote: >-
  La Templanza de Taro se imagina como una figura alada a la orilla de un río lento, vertiendo con cuidado un líquido entre dos recipientes distintos, uno de barro y otro de vidrio. El chorro entre ambos se curva con suavidad, como si el equilibrio se encontrara en tiempo real. Las piedras que cruzan el río sugieren un camino intermedio de una orilla a la otra, y los suaves colores del amanecer sobre colinas lejanas mantienen un ambiente sereno y esperanzador.
