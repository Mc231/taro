shortUpright: >-
  Un momento para saborear lo que ya es bueno y notar cuánto has contribuido tú a que lo sea.
shortReversed: >-
  Quizá algo parezca satisfactorio sin que lo sientas así; piensa qué te traería contento desde dentro.
meaningUpright: |-
  El Nueve de Copas suele llamarse la carta de los deseos. Muestra a una figura a gusto entre copas llenas, claramente satisfecha con lo que tiene. Habla del contento: la sensación de que basta, de un deseo cumplido o de una esperanza que llegó a algo.
  Esta carta te invita a notar la satisfacción cuando está presente, en vez de pasar directamente a la siguiente meta. Quizá terminaste algo en lo que trabajaste mucho, disfrutaste de una buena comida con gente que te cae bien o simplemente sientes, por un momento, que tu vida está en calma. Estas experiencias merecen saborearse.
  También puede invitarte a reflexionar sobre lo que de verdad deseas. Si pudieras llenar una copa más, ¿qué contendría? Tener claros tus deseos puede orientar decisiones de formas pequeñas y prácticas. Disfrutar del placer y la comodidad forma parte de una vida plena. La gratitud, en este sentido, no consiste en sentir que deberías ser feliz; consiste en notar lo que ya es bueno y dejar que cuente.
meaningReversed: |-
  Invertido, el Nueve de Copas puede reflejar una distancia entre cómo se ven las cosas y cómo se sienten. Quizá tengas lo que creías querer y aun así notes que falta algo. O quizá el placer se haya inclinado hacia el exceso, y la comodidad se haya convertido en una forma de evitar sentimientos en vez de disfrutar de la vida.
  También puede volverse hacia dentro y sugerir que el contento duradero tiene menos que ver con posesiones o logros y más con tu relación contigo.
  Esta carta invita a una reflexión honesta. ¿Qué esperabas que trajera este deseo y qué trajo en realidad? Puedes buscar la satisfacción en los valores, la conexión y el sentido, además de en los resultados. Los placeres pequeños y sinceros, elegidos con cuidado, quizá ofrezcan más que acumular. Está bien querer cosas; la pregunta es qué se sentiría como suficiente.
aspects:
  relationshipsUpright: >-
    En las relaciones, el Nueve de Copas puede reflejar contento y tranquilidad con las personas que te rodean. Puede invitarte a disfrutar de un vínculo tal como es, compartiendo placeres y diciendo lo que valoras. Puedes notar cómo es para ti un vínculo satisfactorio, para cuidarlo con intención y no por casualidad.
  relationshipsReversed: >-
