  workReversed: >-
    Invertido, la carta puede reflejar un éxito que se siente vacío, o la persecución de señales de logro que no reflejan lo que valoras. Puedes preguntarte qué haría que tu trabajo tuviera sentido, no solo que impresionara. Alinear las metas con tus valores puede convertir el logro en una satisfacción genuina.
  growthUpright: >-
    Para el crecimiento personal, el Nueve de Copas invita a una práctica de gratitud y disfrute. Puedes terminar cada día anotando tres cosas que te sentaron bien, por pequeñas que sean. Con el tiempo, esto puede entrenar tu atención hacia el contento y facilitar reconocer cuándo tienes suficiente.
  growthReversed: >-
    Invertido, esta carta puede pedirte que examines la diferencia entre el placer y la plenitud. Quizá notes hábitos de consumo, de ajetreo o de comparación que te dejan con ganas de más. Explorar qué te da una satisfacción profunda, y no un subidón rápido, puede guiar decisiones más amables y duraderas.
reflectionQuestions:
