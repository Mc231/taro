  relationshipsReversed: >-
    Invertida, la carta puede sugerir un control que deja poco espacio a los demás, o un énfasis en el sustento práctico que eclipsa la conexión emocional. Puedes preguntarte cómo vive tu apoyo alguien cercano y si le gustaría tener más voz o más ternura en el vínculo.
  workUpright: >-
    En el trabajo, el Rey de Oros puede describir un liderazgo práctico y fiable. Quizá confíen en ti para gestionar recursos, guiar a otras personas o tomar decisiones con los pies en la tierra. Puedes pensar cómo usar tu experiencia con generosidad, acompañando a otros y construyendo estructuras que apoyen tanto a las personas como los resultados.
  workReversed: >-
    Aquí la carta puede reflejar inflexibilidad, control excesivo de cada detalle o valorar el estatus por encima de un trabajo con sentido. También puede señalar que cargas con demasiada responsabilidad sin ayuda. Puedes mirar dónde delegar, escuchar más o redefinir el éxito podría crear una forma de trabajar más sana y sostenible.
  growthUpright: >-
    Para el crecimiento personal, esta carta te invita a reconocer la madurez y la competencia que has desarrollado. Puedes reflexionar sobre qué significa para ti la estabilidad y cómo la has creado. Reconocer tu propia capacidad de sostener, a ti y a otras personas, puede profundizar la confianza en ti.
