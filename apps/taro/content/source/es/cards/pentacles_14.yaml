imageryNote: >-
  La ilustración puede mostrar a una figura coronada sentada en un trono tallado con motivos de toros, rodeada de parras y de un jardín amurallado, con una moneda apoyada con soltura en una mano. El toro puede simbolizar la resistencia y la fuerza terrenal; las parras, la madurez y la abundancia, y los muros, un dominio protegido y bien cuidado. La postura relajada sugiere una autoridad arraigada en la experiencia, y los verdes profundos y los dorados pueden reflejar un sustento duradero y paciente.
