imageryNote: >-
  La ilustración puede centrarse en una figura de pie que sostiene en una mano una balanza equilibrada mientras con la otra ofrece monedas a personas cercanas. Seis monedas pueden repartirse por la escena, unas en las manos y otras en el aire entre ellas. La balanza puede simbolizar la equidad y la consideración; la mano tendida, la generosidad, y las distintas posiciones de las figuras, la cuestión del poder que puede esconderse en silencio dentro de cualquier intercambio.
