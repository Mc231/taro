meaningUpright: |-
  El Seis de Oros muestra a una figura que sostiene una balanza mientras reparte monedas con otras personas. Es una carta sobre el flujo de recursos entre la gente: dinero, sí, pero también tiempo, atención, consejos, paciencia y ayuda práctica. La balanza sugiere un cuidado por la equidad, y la mano abierta, disposición a compartir.
  Quizá ahora estés en posición de dar, ofreciendo ayuda a una amistad, acompañando a alguien que empieza o apoyando una causa que te importa. O quizá estés del lado de quien recibe, aceptando un favor, una mano o una segunda oportunidad. Ambos papeles tienen su propia gracia, y la mayoría de las personas pasamos de uno a otro con el tiempo.
  Esta carta te invita a reflexionar sobre el espíritu de tus intercambios. ¿Tu forma de dar nace libremente o con expectativas calladas? ¿Puedes recibir sin sentirte menos? Puedes notar dónde la generosidad crea una conexión real y dónde un poco más de equilibrio u honestidad haría que todas las personas implicadas se sintieran respetadas.
meaningReversed: |-
  Invertido, el Seis de Oros puede señalar un intercambio que se ha vuelto desigual. Quizá una persona dé mucho más de lo que recibe, o la ayuda llegue con condiciones no dichas: gratitud esperada, decisiones influidas, una sensación de deuda. También puede reflejar la dificultad de recibir en absoluto, como si aceptar ayuda significara perder posición.
  Es una invitación a revisar la balanza sin culpas. El desequilibrio suele crecer en silencio, por costumbre más que por intención.
  Puedes mirar una relación o un acuerdo en el que dar y recibir no terminan de encajar. ¿Hay algo que has estado dando que se ha vuelto agotador? ¿Hay un apoyo que has estado rechazando? Nombrar las expectativas con claridad, o ajustar cuánto ofreces, puede devolver un intercambio que se sienta justo y elegido libremente por ambas partes.
aspects:
  relationshipsUpright: >-
    En las relaciones, esta carta puede reflejar un cuidado generoso y mutuo: un apoyo que fluye en ambas direcciones con el tiempo, aunque ningún día sea del todo igual. Puedes notar cómo muestras tu cuidado de formas prácticas y cómo dejas que otras personas te cuiden. Dar las gracias a alguien por algo concreto que ofrece puede mantener ese flujo cálido y visible.
  relationshipsReversed: >-
    Invertida, la carta puede sugerir un vínculo en el que una persona siente que da más, o en el que la ayuda lleva una obligación. Puedes plantear con suavidad cómo vives tú el equilibrio, sin llevar la cuenta. A veces el cambio más amable es pedir lo que necesitas, o dejar que alguien te ayude sin empeñarte en devolverlo enseguida.
  workUpright: >-
    En el trabajo, esta carta puede describir compartir conocimientos, mentoría, un reconocimiento justo o un apoyo colaborativo. Quizá estés en posición de abrirle una puerta a alguien, o de aceptar orientación con elegancia. Te invita a notar cómo se reparten los recursos y el mérito a tu alrededor y cómo podrías contribuir a un flujo más justo.
  workReversed: >-
    Aquí la carta puede reflejar un esfuerzo que no se reconoce, favores que generan presión o expectativas poco claras sobre lo que se debe. Puedes aclarar acuerdos, hablar de tus aportaciones o notar dónde asumes trabajo extra por defecto. El intercambio justo en el trabajo suele empezar por hacer visible lo invisible.
  growthUpright: >-
    Para el crecimiento personal, el Seis de Oros te invita a explorar tu propia relación con la generosidad. ¿Dónde te resulta alegre dar? ¿Dónde te resulta cómodo recibir? Puedes practicar esta semana un pequeño acto de generosidad y uno de recibir, notando qué despierta cada uno en ti.
  growthReversed: >-
    Invertido, la carta puede reflejar dar como forma de sentir que vales, o rechazar ayuda para mantener el control. Puedes explorar dónde empezaron estos patrones y si todavía encajan. Permitirte estar en ambos lados de la balanza puede profundizar el respeto por ti y la confianza.
