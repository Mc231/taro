imageryNote: >-
  Het originele beeld toont een winderige kust onder gescheurde, snel bewegende wolken. Eén figuur houdt losjes drie zwaarden vast en kijkt achterom, terwijl er nog twee zwaarden op het zand liggen. Twee andere figuren lopen weg naar het water. De verspreide zwaarden suggereren onopgeloste ruzies, en de afgewende ruggen wijzen op afstand die door conflict is ontstaan. De onrustige lucht weerspiegelt een hoofd dat nog in beroering is nadat de woorden zijn opgehouden.
