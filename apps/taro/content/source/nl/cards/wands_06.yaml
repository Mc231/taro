meaningUpright: |-
  De Zes van Staven is een kaart van erkenning. Na de wrijving van de Vijf rijdt iemand vooruit met een krans aan de staf, en mensen langs de weg lijken te juichen. De kaart vangt het moment waarop inzet zichtbaar wordt en anderen die erkennen.
  Dat kan eruitzien als goede feedback op werk waar je je helemaal in hebt gestort, een vriend die zegt dat die bewondert hoe je iets hebt aangepakt, of een uitdaging voltooien waarvan je ooit twijfelde of je die aankon. Het kan ook een stillere vorm van zelfvertrouwen zijn: iets rechter staan omdat je weet dat je het goed hebt gedaan.
  Deze kaart nodigt je uit waardering aan te nemen zonder haar weg te wuiven. Erkenning kan energie geven en moed voor de volgende stap. Tegelijk is de figuur omringd door mensen, een herinnering dat weinig prestaties helemaal in je eentje worden geleverd. Je kunt van het moment genieten en ook nagaan wie je heeft gesteund, en hoe je een deel van de eer met hen kunt delen.
meaningReversed: |-
  Omgekeerd kan de Zes van Staven inzet weerspiegelen die onopgemerkt is gebleven, of lof die je niet echt bereikt. Misschien heb je iets bereikt en voelt het toch alsof het pas telt als iemand anders het zegt. De kaart kan ook wijzen op vermoeidheid van zelfvertrouwen uitstralen dat je niet helemaal voelt.
  Soms beschrijft deze omgekeerde kaart een stil succes, betekenisvol voor jou, ook als anderen het niet zien. Zulke vooruitgang telt ook.
  Dit kan een moment zijn om te kijken hoeveel van je gevoel van eigenwaarde afhangt van applaus. Hoe zou het zijn om eerst zelf je inzet te erkennen? Je kunt opschrijven waar je trots op bent, ook de delen die niemand anders zag, en dat een stevigere bron van aanmoediging laten zijn dan goedkeuring van buitenaf.
aspects:
  relationshipsUpright: >-
    In relaties kan deze kaart waardering weerspiegelen die twee kanten op stroomt: trots zijn op iemand die dicht bij je staat, of je door die persoon gezien en gesteund voelen. De kaart kan je uitnodigen elkaars successen hardop te vieren. Je kunt een vriend, partner of familielid vertellen wat je in die persoon bewondert, en jezelf hun aanmoediging laten ontvangen.
  relationshipsReversed: >-
    Omgekeerd heb je misschien het gevoel dat je inzet in een relatie niet wordt opgemerkt, of dat erkenning een stille wedstrijd is geworden. Je kunt overwegen duidelijk te zeggen welk soort waardering voor jou telt, en de ander hetzelfde te vragen. Klein, concreet dank je wel zeggen kan de sfeer vaak meer veranderen dan grote gebaren.
  workUpright: >-
    Op het werk of in een studie kan de Zes van Staven wijzen op zichtbare resultaten: positieve feedback, een project dat goed wordt ontvangen, een moment om te presenteren wat je hebt gedaan. Je kunt dit zelfvertrouwen gebruiken om je ideeën opener te delen, en ook de mensen te noemen die hebben bijgedragen. Erkenning die gul wordt gedeeld, bouwt meestal sterkere teams.
  workReversed: >-
    Omgekeerd voelen je bijdragen misschien over het hoofd gezien, of hangt succes te veel af van hoe dingen er van buitenaf uitzien. Je kunt je werk op een rustige, feitelijke manier zichtbaarder maken, zoals met een korte samenvatting van wat je hebt opgeleverd, en ook nadenken over welke resultaten voor jou tellen, wie ze ook opmerkt.
  growthUpright: >-
    Voor persoonlijke groei nodigt deze kaart je uit jezelf trots te laten voelen. Je vooruitgang erkennen kan zelfvertrouwen opbouwen dat meegaat naar de volgende uitdaging. Je kunt een kort lijstje bijhouden van dingen die je de laatste tijd goed hebt aangepakt, om op terug te vallen op dagen waarop je zelfvertrouwen dunner voelt.
  growthReversed: >-
    Omgekeerd dempen twijfel aan jezelf of een behoefte aan goedkeuring misschien je gevoel van voldoening. Je kunt verkennen waar je idee van succes vandaan komt en of het nog bij je past. Succes in je eigen woorden omschrijven kan erkenning van anderen tot een prettige bonus maken, iets waar je niet van afhangt.
