imageryNote: >-
  Een ruiter op een kalm paard trekt door een kleine menigte, met een staf die bekroond is met een krans van bladeren. Andere opgeheven staven omzomen het pad als een erehaag. De krans staat voor erkenning die met inzet is verdiend, het rustige paard voor zelfvertrouwen dat is getraind en niet afgeraffeld, en de figuren eromheen voor de gemeenschap die de prestatie deelt en steunt.
