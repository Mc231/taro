imageryNote: >-
  Een figuur loopt voorovergebogen, de armen om een hoge bundel van tien staven geslagen die het gezicht bijna verbergt, op weg naar een klein huis of stadje aan de horizon. De bundel staat voor opgestapelde verantwoordelijkheden, het verborgen gezicht voor hoe een zware last je blik kan vernauwen, en de nabije bestemming voor een einde dat binnen bereik is. De open weg laat ruimte om je voor te stellen dat de last wordt gedeeld of neergelegd.
