shortUpright: >-
  Misschien draag je meer dan je deel; deze kaart nodigt je uit het gewicht op te merken en wat echt gedragen moet worden.
shortReversed: >-
  Een deel van de last kan misschien van je schouders; je kunt kijken wat je kunt neerleggen, delen of weigeren.
meaningUpright: |-
  De Tien van Staven toont iemand die een grote bundel staven draagt, de armen eromheen geslagen, het hoofd gebogen, op weg naar een huis in de verte. Het vuur dat begon als één vonk, is uitgegroeid tot veel verplichtingen, en elke verplichting kost moeite om vast te houden.
  Deze kaart verschijnt vaak als verantwoordelijkheden zich geleidelijk hebben opgestapeld: een project dat bleef groeien, een rol die er steeds taken bij kreeg, voor anderen zorgen en tegelijk je eigen plannen in leven proberen te houden. Veel ervan is misschien begonnen uit enthousiasme of plichtsgevoel, en het kan moeilijk zijn je te herinneren wanneer het zo zwaar werd.
  Deze kaart nodigt je uit eerlijk te kijken naar wat je vasthoudt. Welke verantwoordelijkheden zijn van jou, en welke zijn vanzelf bij jou terechtgekomen? Welke hangen nog samen met iets wat je belangrijk vindt? De bestemming is misschien dichtbij, maar je kunt je nog steeds afvragen of je dit anders zou kunnen dragen: in kleinere vrachten, met hulp, of door onderweg sommige dingen neer te leggen.
meaningReversed: |-
  Omgekeerd kan de Tien van Staven wijzen op een moment van loslaten. Misschien begin je verantwoordelijkheden neer te leggen die nooit van jou waren, te delegeren, of nee te zeggen tegen verzoeken die meer gewicht zouden toevoegen. Er kan opluchting zitten in het besef dat je niet alles tegelijk hoeft te dragen.
  De kaart kan ook het tegenovergestelde patroon weerspiegelen: erop staan alles alleen te doen, ook als er hulp is, omdat vragen moeilijker voelt dan worstelen.
  Dit kan een goed moment zijn om je last te sorteren. Je kunt opschrijven wat je draagt en aangeven wat gedeeld, uitgesteld of geschrapt kan worden. Kleine veranderingen, zoals één gedelegeerde taak of één afgeslagen uitnodiging, kunnen echt verschil maken. Loslaten is geen falen; het kan een manier zijn om je energie te bewaren voor wat het meest telt.
aspects:
  relationshipsUpright: >-
    In relaties kan deze kaart een onevenwicht weerspiegelen in wie wat draagt: één persoon die het meeste plant, piekert of het emotionele werk doet. Je kunt opmerken of de last eerlijk voelt en er open over praten. Het gewicht delen kan mensen dichter bij elkaar brengen, terwijl stilletjes te veel dragen vaak sluimerende wrok oplevert.
  relationshipsReversed: >-
    Omgekeerd leer je misschien om hulp te vragen of een stap terug te doen uit rollen die je voor anderen op je nam. Dat kan in het begin ongemakkelijk voelen. Je kunt overwegen welke verantwoordelijkheden je zou willen delen en hoe je erom kunt vragen op een manier die uitnodigt tot samenwerking, zonder te wachten tot je te moe bent om nog te vragen.
  workUpright: >-
    Op het werk of in een studie kan de Tien van Staven wijzen op te veel verplichtingen: meer taken dan tijd, of een project dat zijn eerste vorm is ontgroeid. Je kunt je verplichtingen op een rij zetten, prioriteiten afstemmen met de betrokkenen en zoeken naar wat eenvoudiger kan. Goed afronden hangt vaak af van minder tegelijk dragen.
  workReversed: >-
    Omgekeerd begin je misschien grenzen te stellen, te delegeren of deadlines opnieuw af te spreken, of verzet je je daar juist tegen. Je kunt één taak benoemen die iemand anders zou kunnen doen, of één verplichting die je zou kunnen afslaan. Ruimte maken in je werklast kan zowel je focus terugbrengen als het enthousiasme waarmee het werk begon.
  growthUpright: >-
    Een nuttige overtuiging om hier te bevragen is dat je alles zelf moet doen. Waar komt die overtuiging vandaan? Je kunt opmerken hoe je lichaam en je stemming reageren op een zware last, en die signalen behandelen als informatie over wat er moet veranderen.
  growthReversed: >-
    Omgekeerd ontdek je misschien de lichtheid die ontstaat als je iets neerlegt. Je kunt verkennen wat je wilt blijven dragen omdat het betekenis geeft, en wat je klaar bent om los te laten. Je verantwoordelijkheden kiezen, en ze niet zomaar aanvaarden, kan een stille daad van zelfrespect zijn.
