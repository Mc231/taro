imageryNote: >-
  De Zon van Taro is voorgesteld als een wijd zomerveld op het middaguur, met vrienden van verschillende leeftijden die eten delen op een kleed onder een enorme, warme zon. Vliegers stijgen op met de wind en lange schaduwen zijn nergens te zien, wat een moment suggereert waarin niets verborgen hoeft te blijven. Felgele en warmoranje tinten vullen het tafereel, terwijl een hond die door het gras rent een speelse toon toevoegt. Het beeld nodigt de kijker uit warmte, helderheid en ongecompliceerde vreugde te voelen.
