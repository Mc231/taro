imageryNote: >-
  De Hogepriesteres van Taro is voorgesteld zittend op de drempel van een door de maan verlichte deuropening, half in het licht en half in de schaduw, met een gesloten boek op de knieën. Achter de figuur beweegt een gordijn, alsof er iets achter wacht. Een maansikkel die weerspiegelt in een stille kom kan verwijzen naar cycli en intuïtie, en diepblauwe tinten suggereren rust aan de oppervlakte met diepte daaronder. De stille, aandachtige rust van de figuur vormt het middelpunt van het beeld.
