imageryNote: >-
  Een enkele levende staf rijst op in het beeld, vers gesneden en toch nog uitlopend met groene scheuten, alsof het hout niet kan ophouden met groeien. Aan de top verzamelt zich een klein vlammetje of een gloed. De tak staat voor rauwe creatieve kracht die nog leeft en geen vorm heeft, en de nieuwe blaadjes suggereren dat inspiratie groeit als je haar verzorgt. Warme rood- en goudtinten kunnen het element vuur dragen, met een open lucht erachter als hint naar ruimte die nog verkend kan worden.
