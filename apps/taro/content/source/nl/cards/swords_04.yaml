imageryNote: >-
  Het originele beeld toont een figuur die rust op een lage stenen bank in een stille, overwelfde ruimte. Drie zwaarden hangen rustig aan de muur erboven, en een vierde ligt plat onder de bank, alle opgeborgen. Zacht licht valt door een klein raam. De afgesloten kamer suggereert een veilige schuilplaats, de opgeborgen zwaarden wijzen op gedachten die voorlopig opzij zijn gelegd, en het zachte licht laat zien dat de wereld buiten geduldig wacht.
