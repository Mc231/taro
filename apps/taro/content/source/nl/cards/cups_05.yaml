  relationshipsReversed: >-
    Omgekeerd kan de kaart beweging weerspiegelen naar verzoening, of naar vrede met hoe een relatie is veranderd. Misschien ben je klaar om een oude grief los te laten, of die in elk geval losser vast te houden. Bedenk hoe vergeving er voor jou uit zou zien, met in je achterhoofd dat je daarvoor niet hoeft te aanvaarden wat niet goed voelt.
  workUpright: >-
