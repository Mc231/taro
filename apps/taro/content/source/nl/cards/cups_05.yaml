imageryNote: >-
  Het beeld toont een figuur in een mantel met gebogen hoofd boven drie omgevallen kelken, waarvan de inhoud in de grond wegsijpelt. Achter de figuur staan twee kelken nog rechtop, makkelijk over het hoofd te zien. Een pad of een oversteekplaats in de verte kan een weg verder suggereren als de tijd daar is. Koele, ingetogen tinten drukken rouw uit, terwijl een dun lijntje licht op de staande kelken laat zien dat niet alles weg is.
