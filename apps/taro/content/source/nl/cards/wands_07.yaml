shortUpright: >-
  Misschien verdedig je een standpunt dat belangrijk voor je is; deze kaart eert de moed die het kost om stand te houden.
shortReversed: >-
  Alles tegelijk verdedigen kan je uitputten; je kunt kiezen welke grond echt de moeite waard is om vast te houden.
meaningUpright: |-
  De Zeven van Staven toont iemand op hogere grond, die één staf vasthoudt tegen meerdere die van onderen opkomen. De positie is niet makkelijk, maar biedt wel een voordeel. Deze kaart gaat over overtuiging: opkomen voor waar je in gelooft, iets beschermen waarvoor je hebt gewerkt, of je evenwicht bewaren als anderen tegengas geven.
  Ze kan verschijnen als je in een groep een impopulaire mening uitspreekt, een grens bewaakt bij iemand die die steeds test, of doorgaat met een project waar anderen aan twijfelen. Als je een plek van enig succes hebt bereikt, merk je misschien ook dat meer mensen die willen uitdagen of in twijfel trekken.
  Deze kaart nodigt je uit je eigen kracht op te merken en de waarden die er richting aan geven. Stand houden vraagt geen agressie; het kan rustig, kalm en helder gebeuren. Je kunt jezelf afvragen wat je precies verdedigt en waarom het ertoe doet, zodat je energie gaat naar wat belangrijk voor je is en niet naar elke voorbijkomende uitdaging.
meaningReversed: |-
  Omgekeerd kan de Zeven van Staven het gevoel weerspiegelen dat je in de minderheid bent of uitgeput raakt. Misschien verdedig je al lang een standpunt en begint de inspanning zichtbaar te worden. Of je merkt dat je op je hoede bent, ook als niemand je echt aanvalt.
  Deze kaart kan ook wijzen op een moment van heroverweging. Niet elke uitdaging heeft een antwoord nodig, en niet elk standpunt hoeft voor altijd te worden vastgehouden. Eén strijd loslaten kan energie vrijmaken voor de strijd die er meer toe doet.
  Je kunt de balans opmaken van waar je tegengas geeft en waarom. Welke grenzen beschermen je waarden, en welke zijn een gewoonte van defensiviteit geworden? Het kan helpen om steun te vragen, een stap terug te doen om te rusten, of anderen de last te laten meedragen zodat je de heuvel niet alleen hoeft te verdedigen.
aspects:
  relationshipsUpright: >-
    In hechte banden kan deze kaart weerspiegelen dat je opkomt voor je behoeften, ook als dat wat wrijving geeft. Ze kan ook wijzen op het verdedigen van iemand om wie je geeft. Je kunt overwegen hoe je een grens met warmte bewaakt, door helder te zeggen wat voor jou belangrijk is en toch ruimte te laten voor het gezichtspunt van de ander.
  relationshipsReversed: >-
    Omgekeerd heb je misschien het gevoel dat je bij iemand altijd in de verdediging zit, of dat elk gesprek een debat wordt. Je kunt opmerken of je jezelf beschermt tegen echte kritiek of tegen een oude angst. Een zachtere benadering, of een pauze voordat je reageert, kan ruimte openen voor een eerlijkere uitwisseling.
  workUpright: >-
    Op het werk of in een creatief project kan de Zeven van Staven wijzen op vasthouden aan een norm of een idee onder druk: concurrentie, kritiek of veranderende eisen. Je kunt je redenen en onderbouwing verzamelen zodat je met rustig zelfvertrouwen kunt spreken. Volharding komt hier voort uit helderheid over wat je beschermt en waarom het ertoe doet.
  workReversed: >-
    Omgekeerd ben je misschien te dun uitgesmeerd en reageer je op elke uitdaging of vraag alsof alles even dringend is. Je kunt de een of twee kwesties kiezen die echt je standpunt nodig hebben en de rest voorlopig laten gaan. Collega's of medewerkers om steun vragen kan een moeilijke positie ook makkelijker vol te houden maken.
  growthUpright: >-
    Je positie vasthouden, al is het maar even, is een bewijs van veerkracht dat erkenning verdient. Je hebt meer vermogen om bij je waarden te blijven dan je misschien denkt. Je kunt terugdenken aan een moment waarop je stand hield en opmerken wat toen hielp, zoals een heldere reden, iemand die je steunde of een vaste routine.
  growthReversed: >-
    Omgekeerd draag je misschien een gevoel van voortdurende waakzaamheid met je mee. Het kan de moeite waard zijn te verkennen waar dat vandaan komt en of het je nog dient. Je strijd kiezen is niet opgeven; het kan een manier zijn om je energie te beschermen, zodat je moed beschikbaar is wanneer het er echt toe doet.
