imageryNote: >-
  Eén figuur staat op een verhoging van rotsige grond, met de voeten ongelijk neergezet, een staf met beide handen geheven terwijl zes andere van onder de rand omhoogduwen. De ongelijke ondergrond suggereert dat overtuiging niet altijd comfortabel is, en de hogere grond laat een echt uitkijkpunt zien dat met inzet is verdiend. De staven beneden kunnen staan voor uitdagingen, vragen en concurrerende stemmen, en de vaste greep voor moed die in waarden is geworteld.
