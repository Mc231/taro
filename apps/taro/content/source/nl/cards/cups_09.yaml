imageryNote: >-
  Het beeld toont een figuur die ontspannen zit, met losse schouders, met negen volle kelken om zich heen op lage tafels en kussens, als een kamer die voor gasten is klaargemaakt. De open, tevreden uitdrukking suggereert plezier en zelfverzekerdheid. Rijke maar warme kleuren, misschien diep rood en goud, kunnen comfort en gastvrijheid oproepen, een zachte herinnering aan een hoop die enige vorm heeft gekregen.
