shortUpright: >-
  Misschien beweeg je van ruw water naar rustiger kusten; verandering kan stil en langzaam zijn en toch echt.
shortReversed: >-
  Iets houdt je misschien vast op de oude oever; je kunt opmerken wat je nog niet klaar bent om te verlaten.
meaningUpright: |-
  De Zes van Zwaarden is een kaart van overtocht. Een kleine boot steekt het water over, laat woelige golven achter zich en koerst naar een rustiger kust. De reis is niet dramatisch. Ze is gestaag, soms verdrietig, vaak een opluchting.
  Deze kaart kan elke overgang weerspiegelen van een moeilijker hoofdstuk naar een makkelijker: een zware periode op het werk afsluiten, naar een nieuwe plek verhuizen, een stap terug doen uit een slopende situatie, of gewoon voelen dat je gedachten tot rust beginnen te komen na een storm. De zwaarden reizen mee met de passagiers, wat suggereert dat sommige herinneringen en lessen meegaan. Je hoeft niet alles achter te laten om verder te komen.
  Deze kaart nodigt je uit de richting op te merken waarin je al gaat, ook als de vooruitgang traag voelt. Je kunt jezelf afvragen wie of wat je helpt de oversteek te maken, en of je die hulp kunt aannemen. Overgangen mengen vaak opluchting met een beetje verdriet om wat achterblijft; beide gevoelens kunnen in dezelfde boot zitten. Wat zou deze overtocht zachter voor je maken?
meaningReversed: |-
  Omgekeerd kan de Zes van Zwaarden een overgang weerspiegelen die wordt uitgesteld of waartegen je je verzet. Misschien weet je dat het tijd is om verder te gaan, maar houden gewoonte, praktische banden of onzekerheid over wat er aan de overkant wacht je tegen. De boot is misschien klaar terwijl jij nog op de steiger staat.
  Een andere lezing is te veel meenemen van de oude oever: zorgen, rollen of verwachtingen die de oversteek zwaarder maken dan nodig. Soms kan de kaart ook wijzen op even teruggaan om iets af te maken voordat je echt kunt vertrekken.
  Je kunt jezelf afvragen wat je nog nodig hebt om te bewegen. Is het informatie, steun, afsluiting of toestemming van jezelf? Verandering kan wachten tot je er klaar voor bent, en klaar zijn kun je ook in kleine stappen opbouwen. Wat is één ding dat je zou kunnen neerleggen voordat je vertrekt?
aspects:
  relationshipsUpright: >-
    In relaties kan deze kaart wijzen op samen door een moeilijke periode gaan naar rustiger grond, of op zachtjes afstand nemen van een patroon dat je niet meer dient. Ze kan ook weerspiegelen dat je iemand die dicht bij je staat steunt in een eigen overgang. Je kunt opmerken hoe stil gezelschap, zonder dingen op te lossen, iemand kan helpen zich minder alleen te voelen tijdens de oversteek.
  relationshipsReversed: >-
    Omgekeerd kan de Zes van Zwaarden moeite weerspiegelen om een oude dynamiek achter te laten, of oude pijn meenemen naar een nieuw hoofdstuk. Je kunt overwegen welke verwachtingen bij een eerdere relatie horen en niet bij deze. Praten over wat jullie allebei op de oude oever willen achterlaten, kan het heden lichter laten voelen.
  workUpright: >-
    Op het werk kan deze kaart een geleidelijke verschuiving suggereren: een nieuwe rol, een veranderd team, of een stressvol project achterlaten voor stabielere grond. De overgang voelt misschien niet spannend, maar kan wel opluchting brengen. Je kunt de balans opmaken van de vaardigheden en lessen die je meeneemt, en gewoonten loslaten die alleen bij het ruwe water hoorden.
  workReversed: >-
    Omgekeerd kan deze kaart een verandering op het werk weerspiegelen die steeds wordt uitgesteld, of onafgemaakte taken die je binden aan een situatie die je wilt verlaten. Je kunt opschrijven wat echt af moet en wat kan worden overgedragen. Soms is een paar losse eindjes afronden precies wat de boot eindelijk van de steiger laat gaan.
  growthUpright: >-
    Voor persoonlijke groei nodigt de Zes van Zwaarden je uit langzame vooruitgang te eren. Afstand nemen van een oude manier van denken gebeurt vaak in veel kleine dagen en niet in één gedurfde sprong. Je kunt bewijs opmerken dat je al rustiger of wijzer bent dan vroeger, en jezelf erkenning geven voor de afgelegde afstand.
  growthReversed: >-
    Omgekeerd kan deze kaart weerspiegelen dat je je vastklampt aan vertrouwde patronen, ook als ze niet meer helpen, of vooruit haast zonder te verwerken wat er is gebeurd. Je kunt even stilstaan om één keer bewust terug te kijken, en benoemen wat je meeneemt en wat je klaar bent los te laten. Draai je dan weer naar het water.
reflectionQuestions:
