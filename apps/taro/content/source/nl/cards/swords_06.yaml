imageryNote: >-
  In het originele beeld glijdt een kleine boot van gerimpeld water naar een stille, mistige kust. Zes zwaarden staan rechtop in de boot als een stille lading, en een zittende passagier kijkt vooruit. Een lange vaarboom duwt gestaag door het ondiepe water. Het veranderende water toont een verschuiving van onrust naar kalmte, de zwaarden suggereren lessen die worden meegenomen, en de vaarboom wijst op geduldige beweging, stap voor stap.
