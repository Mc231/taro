imageryNote: >-
  Vijf figuren, elk met een staf, staan dicht bij elkaar met hun staven schuin en kruisend omhoog. Het tafereel is levendig en een beetje chaotisch, maar niemand lijkt gewond, waardoor het open blijft of het om een echte wedstrijd of een oefenspel gaat. De wirwar van kruisende staven kan staan voor ideeën en ambities die tegen elkaar in duwen, en de open grond om hen heen suggereert ruimte om een stap terug te doen en een gedeeld ritme te vinden.
