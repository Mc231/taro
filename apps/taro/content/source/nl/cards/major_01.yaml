    Op welke ene intentie kun je vandaag handelen met wat je al hebt?
imageryNote: >-
  De Magiër van Taro is voorgesteld bij een marktkraam op een kruispunt bij het ochtendgloren, terwijl die vier eenvoudige voorwerpen voor de vier kleuren neerlegt: een groene tak, een aarden beker, een mes om brood te snijden en één munt. De ene hand reikt naar de kraam, de andere wijst naar de opklarende lucht en verbindt idee en daad. Lichtdraden tussen de voorwerpen suggereren aandacht die losse gereedschappen tot één doel verbindt, en een onaf brood laat zien dat het maken net begonnen is.
