shortUpright: >-
  Misschien heb je al meer in handen dan je denkt; deze kaart vraagt wat je daarmee wilt maken.
shortReversed: >-
  Je gereedschap ligt op tafel, maar je aandacht is misschien ergens anders. Wat zou helpen om die te verzamelen?
meaningUpright: |-
  De Magiër is de kaart van een idee dat werkelijkheid wordt. Waar de Dwaas op pad gaat zonder plan, blijft de Magiër staan, kijkt naar wat binnen handbereik ligt en besluit dat te gebruiken. Het traditionele beeld van één hand omhoog en één hand omlaag suggereert een brug tussen intentie en actie, tussen wat je je voorstelt en wat je vandaag echt kunt doen.
  In het dagelijks leven kan deze kaart het moment weerspiegelen waarop een plan eindelijk een datum krijgt, een tijdsbudget, een eerste versie. Ze kan wijzen op vaardigheden die je snel over het hoofd ziet omdat ze je makkelijk afgaan: een talent om dingen uit te leggen, kleine problemen op te lossen of mensen samen te brengen. Vindingrijkheid betekent hier opmerken dat de stukken al op tafel liggen.
  Deze kaart nodigt je uit om te overwegen waar je aandacht naartoe gaat. Focus is een soort ambacht; je kunt het oefenen. Je kunt jezelf afvragen welk ene ding je tot leven wilt brengen, en welk gereedschap dat je al hebt het een stap dichterbij kan brengen. De Magiër belooft geen resultaten. De kaart laat de kracht zien van met intentie verschijnen en gebruiken wat je hebt.
meaningReversed: |-
  Omgekeerd kan de Magiër vermogen weerspiegelen dat er wel is, maar nog niet wordt gebruikt. Misschien heb je de vaardigheden en de ideeën, maar voel je je energie in te veel richtingen weglekken, of twijfel je of jouw bijdrage ertoe doet. De tafel is gedekt; de handen bewegen nog niet echt.
  Deze kaart kan ook wijzen op slimheid die een beetje scheef is gaan lopen: charme of snelle praat gebruiken om het saaie deel van het werk over te slaan, of zelfverzekerd overkomen terwijl je je vanbinnen onzeker voelt. Geen van beide is een moreel falen. Beide kunnen tekenen zijn dat intentie en actie uit elkaar zijn gedreven.
  Je kunt kijken waar je aandacht zich opsplitst. Eén kleine, concrete taak kiezen en afmaken kan het vertrouwen in je eigen handen herstellen. Het kan ook helpen om jezelf af te vragen wat je anders zou doen als niemand meekeek.
aspects:
  relationshipsUpright: >-
    In relaties kan de Magiër de kracht van heldere, directe communicatie weerspiegelen. De kaart kan je uitnodigen te zeggen wat je bedoelt en te handelen op een manier die bij je woorden past. Je kunt opmerken hoeveel je de toon van een band kunt vormen met kleine, bewuste gebaren: een attent bericht, een plan dat je echt uitvoert, aandacht zonder afleiding.
  relationshipsReversed: >-
    Omgekeerd kan deze kaart vragen of woorden en daden in een hechte band op één lijn liggen, bij jou of bij de ander. Ze kan ook weerspiegelen dat je achterhoudt wat je echt denkt, of een versie van jezelf speelt waarvan je denkt dat die gewaardeerd wordt. Je kunt overwegen wat er zou veranderen als je iemand je echte bedoelingen liet zien, ook de onzekere.
  workUpright: >-
    Op het werk of in een project wijst de Magiër op vaardigheid die een kans ontmoet. De kaart kan je uitnodigen je vermogens, contacten en middelen op een rij te zetten en ze op één helder doel te richten. Dit is een kaart van beginnen, een idee presenteren, een prototype bouwen of eindelijk het voorstel schrijven. Focus en doorzetten tellen hier zwaarder dan vooraf alle antwoorden hebben.
  workReversed: >-
    Omgekeerd kan de Magiër onderbenut talent weerspiegelen, of inzet die zo dun is uitgesmeerd dat niets echt aankomt. De kaart kan ook wijzen op de verleiding om te overdrijven of de kantjes eraf te lopen. Je kunt jezelf afvragen welke taak nu echt je energie verdient, en hoe eerlijk, gestaag werk daaraan de komende dagen eruit zou zien.
  growthUpright: >-
    Voor persoonlijke groei nodigt deze kaart je uit je eigen handelingsvermogen te erkennen. Je kunt de vaardigheden, gewoonten en steun opschrijven die je al hebt, en opmerken hoe ze iets kunnen dienen wat je belangrijk vindt. Oefening, herhaling en een heldere intentie zijn het stille gereedschap van de Magiër; kleine dagelijkse keuzes kunnen na verloop van tijd uitgroeien tot echte verandering.
  growthReversed: >-
    Omgekeerd kan de Magiër een kloof weerspiegelen tussen wie je weet dat je zou kunnen zijn en de gewoonten die je leeft. De kaart kan vragen waar twijfel aan jezelf je laat wachten op toestemming. Je kunt één vaardigheid kiezen om openlijk en onvolmaakt te oefenen, en opmerken hoe zelfvertrouwen groeit door te doen, zonder te wachten tot je je klaar voelt.
reflectionQuestions:
