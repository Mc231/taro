shortUpright: >-
  Goed werk groeit vaak tussen mensen. Merk op hoe verschillende vaardigheden in elkaar kunnen passen bij iets waar je om geeft.
shortReversed: >-
  Een gezamenlijke inzet trekt misschien verschillende kanten op. Het kan helpen rollen, plannen en hoe jullie naar elkaar luisteren opnieuw te bekijken.
meaningUpright: |-
  De Drie van Pentakels is een kaart van samen met anderen bouwen. Drie munten die in een bouwwerk zijn verwerkt, suggereren werk dat niemand in zijn eentje vorm kan geven: de een brengt het ontwerp, een ander het materiaal, weer een ander de vaste hand. Wat opvalt, is niet rang maar respect voor wat ieder bijdraagt.
  In het dagelijks leven kan dat zich laten zien als een teamproject dat eindelijk klikt, een buur die je helpt iets te repareren, een studiegroep, of een mentor wiens feedback je vaardigheid aanscherpt. De kaart kan ook de voldoening weerspiegelen van erkend worden voor jouw deel, en anderen erkennen voor het hunne.
  Deze kaart nodigt je uit om te overwegen waar samenwerking je werk kan optillen boven wat je alleen zou bereiken. Je kunt jezelf afvragen wiens deskundigheid de jouwe aanvult, hoe je een plan helder kunt delen, en hoe je inbreng ontvangt. Vakmanschap verdiept zich als mensen bereid zijn naar dezelfde bouwtekening te kijken en die samen te verbeteren.
meaningReversed: |-
  Omgekeerd kan de Drie van Pentakels wijzen op een gezamenlijke inzet die haar gemeenschappelijke plan kwijt is. Mensen werken misschien hard, maar naar net verschillende beelden toe, of rollen zijn vaag, waardoor sommige taken dubbel worden gedaan en andere tussen wal en schip vallen. De kaart kan ook de neiging weerspiegelen alles alleen te doen, misschien omdat vragen trager of minder veilig voelt.
  Dit is een uitnodiging om de bouwtekening opnieuw te bekijken en niet om schuld toe te wijzen. Niet op één lijn zitten komt veel voor, en het vroeg benoemen kost meestal minder dan doorzetten.
  Je kunt een kort gesprek voorstellen over doelen en wie wat doet, of het plan opschrijven waar iedereen het kan zien. Werk je vaak in je eentje, overweeg dan één onderdeel dat je zou kunnen overdragen, en merk op wat er verandert als iemand anders zijn vaardigheid aan de jouwe toevoegt.
aspects:
  relationshipsUpright: >-
    In hechte banden kan deze kaart teamwerk in het dagelijks leven weerspiegelen: samen een verhuizing plannen, huishoudtaken delen, elkaars projecten steunen. Je kunt opmerken hoe jullie sterke kanten verschillen en hoe dat een geschenk kan zijn in plaats van wrijving. Hardop zeggen wat je waardeert aan hoe iemand bijdraagt, kan het fundament versterken dat jullie samen bouwen.
  relationshipsReversed: >-
    Omgekeerd kan de kaart suggereren dat jij en iemand die dicht bij je staat naar verschillende beelden van hetzelfde doel werken, of dat één persoon meer van de praktische last draagt. Zonder de score bij te houden, kunnen jullie gaan zitten en verwachtingen vergelijken. Verhelderen wie wat doet, kan spanning verlichten en ieder helpen zich gezien te voelen.
  workUpright: >-
    Op het werk benadrukt deze kaart samenwerking en vakmanschap. Ze kan een project weerspiegelen waarin heldere communicatie en wederzijds respect ieders vaardigheden laten zien. Je kunt kansen zoeken om om feedback te vragen, je kennis te delen of mensen samen te brengen wier vermogens goed bij elkaar passen. Kwaliteit stijgt vaak als het plan wordt gedeeld.
  workReversed: >-
    Hier kan de kaart wijzen op onduidelijke rollen, misverstanden of een team dat verschillende kanten op trekt. Ze kan ook weerspiegelen dat je alleen werkt aan iets wat baat zou hebben bij andere ogen. Je kunt een korte afstemming voorstellen over doelen en verantwoordelijkheden, of één collega vragen je aanpak te bekijken voordat je verdergaat.
  growthUpright: >-
    Voor persoonlijke groei kan de Drie van Pentakels je uitnodigen met en van anderen te leren. Een leraar, een workshop, een oefenpartner of een online gemeenschap kan je helpen een vaardigheid te verfijnen. Je kunt opmerken hoe het voelt om beginner te zijn tussen mensen die meer weten, en hoeveel je in ruil te bieden hebt.
  growthReversed: >-
    Omgekeerd kan de kaart terughoudendheid weerspiegelen om gezien te worden terwijl je nog leert, of een gewoonte om feedback weg te wuiven. Je kunt verkennen waardoor inbreng moeilijk te ontvangen is. Eén persoon kiezen die je vertrouwt om onaf werk aan te laten zien, kan leren veranderen in een gedeeld proces en geen eenzame toets.
