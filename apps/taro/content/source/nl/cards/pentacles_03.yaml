imageryNote: >-
  Het beeld kan drie figuren plaatsen rond een onaf bouwwerk, zoals een boog, een werkbank of een opgetrokken frame, elk bezig met een andere taak. De een houdt een plan vast, de ander bewerkt het materiaal, de derde houdt het stevig of beoordeelt het. Drie munten die in het bouwwerk zelf zijn verwerkt, kunnen suggereren dat waarde ontstaat door samenwerking. Steigers, gereedschap en open ruimte rond het bouwwerk laten zien dat het werk nog bezig is en open voor verbetering.
