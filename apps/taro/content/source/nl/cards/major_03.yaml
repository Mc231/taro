shortUpright: >-
  Er groeit iets, in jou of om je heen. Deze kaart nodigt je uit het met geduld en warmte te verzorgen.
shortReversed: >-
  Je zorg stroomt misschien naar buiten terwijl je eigen bron opdroogt. Waar kan een deel ervan naar jou terugkeren?
meaningUpright: |-
  De Keizerin is de kaart van groei die ontstaat door zorg. Waar de Hogepriesteres naar binnen luistert, keert de Keizerin zich naar de levende wereld: tuinen, maaltijden, dingen die met de hand zijn gemaakt, het plezier van goed brood of warm zonlicht. Deze kaart staat voor creativiteit die voedt, of het nu gaat om een project, een thuis, een vriendschap of je eigen gevoel van gemak.
  In het dagelijks leven kan deze kaart een periode van maken weerspiegelen: koken voor vrienden, weer gaan schetsen, voor planten of mensen zorgen, of gewoon merken dat je je meer thuis voelt in je lichaam dan anders. Ze kan ook wijzen op geduld. De Keizerin weet dat groei zijn eigen tijd neemt, en dat trekken aan een zaailing hem niet sneller laat groeien.
  Deze kaart nodigt je uit om te overwegen wat je laat groeien en hoe je dat doet. Je kunt jezelf afvragen waar wat meer zachtheid, schoonheid of rust iets kan helpen opbloeien. Overvloed gaat hier minder over veel hebben en meer over opmerken en genieten van wat al om je heen leeft.
meaningReversed: |-
  Omgekeerd kan de Keizerin zorg weerspiegelen die uit balans is geraakt. Misschien steek je energie in iedereen en alles behalve jezelf, tot creativiteit droog aanvoelt en zelfs fijne dingen klusjes lijken. Of zorg slaat door naar te veel betrokkenheid: zo stevig vasthouden dat er weinig ruimte is voor anderen om op hun eigen manier te groeien.
  Deze kaart kan ook wijzen op een creatief project dat stil is komen te liggen, of op het contact verliezen met de eenvoudige, lichamelijke dingen die je normaal houvast geven.
  Je kunt kijken waar je zorg naartoe gaat en of een deel ervan naar huis kan komen. Een kleine daad van zorg voor jezelf, zoals een voedzame maaltijd, een rustige wandeling of een paar minuten iets maken gewoon voor de lol, kan een manier zijn om weer contact te maken met de royale energie van de Keizerin.
aspects:
  relationshipsUpright: >-
    In relaties kan de Keizerin warmte, genegenheid en het gevoel van verzorgd worden weerspiegelen, of van met gulheid voor anderen zorgen. De kaart kan je uitnodigen samen voor comfort te zorgen: gedeelde maaltijden, tijd buiten, kleine tedere gebaren. Je kunt opmerken hoe de mensen die dicht bij je staan graag verzorgd worden, en hoe jij dat zelf graag hebt.
  relationshipsReversed: >-
    Omgekeerd kan de Keizerin vragen of de zorg in een relatie eenzijdig is geworden, of dat bezorgdheid is overgegaan in het sturen van de keuzes van een ander. Je kunt overwegen waar je een stap terug kunt doen en de ander meer kunt vertrouwen, en waar je opener kunt vragen om de zorg die je zelf nodig hebt.
  workUpright: >-
    Op het werk of in een creatief project wijst de Keizerin op vruchtbare grond. De kaart kan een tijd weerspiegelen waarin ideeën makkelijk groeien, waarin je een team kunt koesteren, een tuin vol projecten, of een langzaam, lonend stuk vakwerk. Ze nodigt je uit je werkplek comfortabeler te maken en vooruitgang te waarderen die voortkomt uit gestage, geduldige aandacht.
  workReversed: >-
    Omgekeerd kan deze kaart uitputting weerspiegelen door voor ieders projecten te zorgen behalve die van jezelf, of een creatieve blokkade die met geen enkele inspanning lijkt te wijken. Je kunt jezelf afvragen wat het werk weer voedend zou maken: een andere omgeving, een kortere takenlijst, of toestemming om iets onvolmaakts te maken.
  growthUpright: >-
    Voor persoonlijke groei nodigt de Keizerin je uit te genieten van het zijn in je lichaam en in de tastbare wereld. Rust, goed eten, tijd in de natuur en eenvoudige genoegens zijn hier geen verwennerij; het zijn manieren om op te laden. Je kunt opmerken wat je helpt je geaard en gul te voelen, en daar wat meer ruimte voor maken.
  growthReversed: >-
    Omgekeerd kan de Keizerin een zachte herinnering zijn dat jij hetzelfde geduld verdient dat je anderen geeft. De kaart kan weerspiegelen dat je het contact met je eigen behoeften kwijt bent, of twijfelt aan je creatieve waarde. Je kunt beginnen met één klein, vriendelijk ritueel dat alleen van jou is, en kijken hoe het je week verandert.
