imageryNote: >-
  De Keizerin van Taro is voorgesteld als een figuur die rust in een moestuin aan het eind van de zomer, omringd door rijpende groenten, een brood dat afkoelt op een vensterbank en een beek die voorbijstroomt. Zachte geweven stoffen en een mand vers geplukt fruit suggereren comfort en zintuiglijk plezier, terwijl bijen tussen de bloemen wijzen op groei die ontstaat door veel kleine daden van zorg. De sfeer is warm en ontspannen en nodigt de kijker uit de overvloed op te merken die er al is.
