shortUpright: >-
  Nog niet alles is helder, en dat is in orde. Deze kaart nodigt je uit langzaam te gaan en je zintuigen te vertrouwen.
shortReversed: >-
  Een mist begint misschien op te trekken. Wat zie je nu helderder dan eerst?
meaningUpright: |-
  De Maan is de kaart van het tussengebied: het licht dat vormen laat zien zonder hun randen te tonen. In deze zachte gloed kunnen dingen groter, vreemder of magischer lijken dan bij daglicht. De kaart spreekt over dromen, stemmingen, verbeelding en het onrustige gevoel niet goed te weten waar je staat.
  In het dagelijks leven kan deze kaart een situatie weerspiegelen waarin stukjes ontbreken, een gevoel dat je niet kunt benoemen, of zorgen die 's nachts groter lijken dan 's ochtends. Ze kan wijzen op een tijd waarin logica alleen weinig helpt, en waarin intuïtie, dromen en creatief werk aanwijzingen kunnen bieden. Onzekerheid is hier geen waarschuwing; het is gewoon deel van een pad lopen dat je nog niet helemaal kunt overzien.
  Deze kaart nodigt je uit om te overwegen wat echt is en wat misschien verbeelding. Je kunt jezelf afvragen welke van je angsten op feiten zijn gebaseerd en welke op verhalen die je jezelf hebt verteld. De Maan benadrukt geduld met onduidelijkheid. Langzaam gaan, bij je instinct nagaan hoe iets voelt en op meer licht wachten voordat je grote beslissingen neemt, kan in mistige tijden een wijze aanpak zijn.
meaningReversed: |-
  Omgekeerd kan de Maan weerspiegelen dat verwarring begint op te trekken. Iets wat troebel voelde, komt misschien scherper in beeld, of je bent klaar om recht te kijken naar een zorg die je vermeed. Dat kan opluchting brengen, ook als het beeld niet helemaal prettig is.
  Deze kaart kan ook wijzen op de trucs die het hoofd uithaalt: jezelf een handig verhaal vertellen, of angstige gedachten in kringetjes laten ronddraaien. Die patronen opmerken is op zich al een stap naar helderheid.
  Je kunt opschrijven wat je zeker weet en wat je vermoedt. Het verschil op papier zien kan een zorg terugbrengen tot haar echte grootte. Het pad vertrouwen vraagt niet dat je het helemaal ziet; het kan genoeg zijn om de volgende stap te zien en die met zorg te zetten.
aspects:
  relationshipsUpright: >-
    In relaties kan de Maan onzekerheid weerspiegelen over waar je staat of wat iemand anders voelt. De kaart kan je uitnodigen op te merken of je gaten opvult met aannames. Zachte, directe vragen en geduld kunnen helpen, net als aandacht voor je eigen emotionele reacties zonder overhaaste conclusies.
  relationshipsReversed: >-
    Omgekeerd kan deze kaart wijzen op misverstanden die beginnen op te helderen, of op het herkennen van een onbehulpzaam verhaal dat je over iemand hebt verteld. Je kunt overwegen een eerlijk gesprek te voeren om na te gaan wat er echt klopt, en ruimte te maken voor de kant van de ander. Helderheid komt vaak in kleine stukjes, en elk eerlijk gesprek voegt er één toe.
  workUpright: >-
    Op het werk of in een project benadrukt de Maan onduidelijkheid: vage doelen, veranderende informatie of een creatief proces dat zijn vorm nog niet heeft gevonden. De kaart kan je uitnodigen het niet-weten een tijdje te verdragen. Fantasierijk brainstormen kan hier goed gedijen, terwijl vaste toezeggingen er baat bij kunnen hebben te wachten op meer helderheid.
  workReversed: >-
    Omgekeerd kan de Maan weerspiegelen dat verwarring optrekt nu er nieuwe informatie binnenkomt, of dat er een kans is om een misverstand op te helderen. Je kunt open vragen opschrijven en heldere antwoorden zoeken. De kaart kan ook wijzen op jezelf betrappen op denken in rampscenario's en kiezen voor een rustiger blik. Heldere feiten maken de volgende beslissing meestal lichter.
  growthUpright: >-
    Dromen, verbeelding en de minder rationele kanten van je geest zijn onder de Maan het verkennen waard. Schrijven of creatief spel kan je helpen ernaar te luisteren. Je kunt je stemmingen en hun patronen opmerken en ze behandelen als informatie, niet als bevelen.
  growthReversed: >-
    Omgekeerd kan de Maan vragen of angst je blik meer heeft gevormd dan feiten. De kaart kan een groeiend vermogen weerspiegelen om door zorgen heen te kijken. Je kunt oefenen met even stilstaan wanneer een angstige gedachte opkomt, en je afvragen wat een rustigere vriend zou opmerken. Na verloop van tijd kan dat moment van stilstaan een vastere gewoonte worden.
reflectionQuestions:
  - >-
    Welke van je huidige zorgen is gebaseerd op feiten, en welke op vermoedens?
  - >-
