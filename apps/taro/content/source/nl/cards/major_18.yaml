    Wat is de volgende kleine stap die je helder kunt zien, ook al is de rest mistig?
imageryNote: >-
  De Maan van Taro is voorgesteld als een bleke maan, half verborgen achter voorbijdrijvende wolken, boven een pad door hoog riet langs de oever. Het pad glinstert op sommige plekken en verdwijnt op andere, zodat de reiziger langzaam gaat. Een reiger die stil in het ondiepe water staat, kan geduldige aandacht suggereren, terwijl rimpelingen op het water wijzen op gevoelens die van onderen opkomen. Zilverachtig licht, zachte schaduwen en vage randen nodigen de kijker uit de eigen zintuigen te vertrouwen op een onzekere reis.
