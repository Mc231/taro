imageryNote: >-
  Het beeld kan twee figuren tonen die door sneeuw of regen langs een muur lopen, met gebogen hoofd tegen het weer, terwijl boven hen een raam gloeit met vijf munten in het patroon. Het contrast tussen het koude pad en het verlichte raam kan moeite symboliseren naast nabije beschutting. De plaats van het raam, net buiten het blikveld van de figuren, suggereert steun die er is maar nog niet is opgemerkt of gezocht.
