imageryNote: >-
  Het beeld toont een figuur, van achteren gezien, tegenover zeven kelken die in drijvende nevel zweven. Elke kelk bevat een ander symbool, misschien een sleutel, een krans, een klein huis, een ster, een opgerolde vorm, een gesloten kistje en een spiegel, die staan voor toegang, lof, zekerheid, hoop, onbehagen, geheimen en zelfbeeld. Zacht, dromerig licht en verschuivende kleuren kunnen suggereren hoe verleidelijk en onzeker deze visioenen zijn, en nodigen de kijker uit zich af te vragen welke ervan echt is.
