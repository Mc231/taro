shortUpright: >-
  Veel mogelijkheden glinsteren misschien tegelijk; deze kaart nodigt je uit te genieten van het verbeelden en dan elke mogelijkheid goed te bekijken.
shortReversed: >-
  De mist van opties trekt misschien op; bedenk welke keuze nog echt voelt als de glans van het verbeelden verdwijnt.
meaningUpright: |-
  De Zeven van Kelken toont vaak een figuur tegenover een rij kelken die in de lucht zweven, elk met een ander visioen. Het is een kaart van verbeelding, mogelijkheden en de duizeligheid die kan ontstaan als je te veel keuzes hebt.
  Verbeelding is een gave. Ze laat je levens voorstellen die je nog niet hebt geleefd en ideeën die nog niemand anders had. Maar deze kaart merkt ook op hoe makkelijk dagdromen vervagen tot plannen. Sommige kelken bevatten echte kansen, sommige wensen, en sommige zorgen die zich voordoen als mogelijkheden.
  In het dagelijks leven kan dat eruitzien als van project naar project springen, door opties scrollen zonder te kiezen, of je aangetrokken voelen tot een droom zonder eerste stap. De kaart nodigt je uit te genieten van dromen en dan beter te kijken. Welke optie past bij je waarden en je werkelijke omstandigheden? Wat zou de eerste kleine actie zijn? Eén kiezen betekent niet dat je de andere voor altijd kwijt bent; het betekent dat je iets de kans geeft om werkelijkheid te worden.
meaningReversed: |-
  Omgekeerd kan de Zeven van Kelken helderheid weerspiegelen die na een periode van verwarring komt. De zwevende kelken komen misschien tot rust, en je ziet welke iets wezenlijks bevatten en welke vooral nevel waren. Dat kan voelen als opluchting, of als een kleine teleurstelling nu sommige fantasieën vervagen.
  De kaart kan ook het tegenovergestelde suggereren: kiezen vermijden door elke mogelijkheid open te houden, of verbeelding helemaal wegzetten in naam van praktisch zijn.
  De uitnodiging is hier om een geaarde middenweg te vinden. Je kunt één optie kiezen en die op een kleine manier zonder druk uitproberen. Merk op wat je in de praktijk enthousiast maakt, niet alleen in theorie. Een dagdroom loslaten kan ruimte maken voor een plan dat je echt kunt leven, en dromen kan iets blijven waar je voor inspiratie naar terugkeert.
aspects:
  relationshipsUpright: >-
    In relaties kan deze kaart weerspiegelen dat je iemand idealiseert, of je veel mogelijke toekomsten voorstelt met of zonder een bepaalde persoon. De kaart kan je uitnodigen het verschil op te merken tussen wie iemand is en wie je hoopt dat die is. Je kunt van de verbeelding genieten en haar tegelijk aarden in echte gesprekken over wat ieder van jullie wil.
  relationshipsReversed: >-
    Omgekeerd kan de Zeven van Kelken wijzen op een relatie helderder zien, misschien nadat een romantische waas is opgetrokken. Die helderheid kan een kans zijn om te bouwen op wat echt is. Je kunt jezelf afvragen wat je nu werkelijk waardeert in de band, niet wat je je in het begin voorstelde, en dat open delen.
  workUpright: >-
    Op het werk kan deze kaart een overvloed aan ideeën of opties weerspiegelen, zoals meerdere projecten, paden of aanbiedingen die om aandacht strijden. De kaart kan je uitnodigen elk ervan af te wegen tegen je prioriteiten, tijd en energie. Ze naast elkaar opschrijven kan helpen. Verbeelding is nuttig om te brainstormen; beslissingen hebben vaak stevigere grond nodig.
  workReversed: >-
    Omgekeerd kan de kaart weerspiegelen dat je je keuze vernauwt tot een duidelijke richting, of je eindelijk aan één project verbindt. Misschien merk je dat er weer focus komt. Voel je je ontgoocheld, bedenk dan welke delen van de oorspronkelijke visie het nog waard zijn om mee te nemen naar iets wat realistischer is en meer van jou.
  growthUpright: >-
    Voor persoonlijke groei nodigt de Zeven van Kelken je uit je dagdromen te begrijpen. Welk verlangen drukt elk ervan uit? Je kunt schrijven over een terugkerende fantasie en zoeken naar de behoefte eronder, zoals vrijheid, erkenning of rust. Die behoefte op een kleine, echte manier vervullen kan meer voldoening geven dan de droom zelf.
  growthReversed: >-
    Omgekeerd kan deze kaart een groeiend vermogen weerspiegelen om wensen te onderscheiden van voornemens. Je kunt oefenen met elke dag één heldere beslissing nemen, hoe klein ook. Na verloop van tijd kan dat vertrouwen in je eigen oordeel opbouwen, met ruimte voor verbeelding om te inspireren zonder af te leiden.
reflectionQuestions:
  - >-
    Welke van je huidige opties voelt het meest levend als je je voorstelt er een echte stap naartoe te zetten?
  - >-
    Welk verlangen zit misschien verborgen onder een dagdroom waar je steeds naar terugkeert?
  - >-
