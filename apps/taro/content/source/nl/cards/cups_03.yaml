imageryNote: >-
  Het beeld toont drie figuren in een losse kring, met hun kelken geheven en elkaar rakend in het midden. Rond hun voeten kan een oogst van fruit, bloemen of ranken overvloed suggereren die groeit uit gedeelde inzet. Hun verschillende kleding, houdingen en kleuren kunnen staan voor vrienden die zichzelf blijven en toch bij elkaar horen. Beweging in het tafereel, zoals een danspas of een draaiende zoom, laat gemakkelijke, ongedwongen vreugde zien.
