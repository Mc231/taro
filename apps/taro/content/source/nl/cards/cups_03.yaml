  relationshipsReversed: >-
    Omgekeerd kan deze kaart spanning in een groep weerspiegelen, of het gevoel buitengesloten te worden. Ze kan ook wijzen op invloed van buitenaf op een band, in welke vorm dan ook. Zonder te gissen kun je gewoon vragen hoe het ervoor staat. Het kan ook helpen tijd door te brengen met mensen bij wie je niets hoeft op te voeren of bij te houden.
  workUpright: >-
    Op het werk kan de Drie van Kelken wijzen op teamgeest, een gedeeld succes of medewerkers die het echt leuk vinden om samen te werken. De kaart kan je uitnodigen vooruitgang onderweg te vieren, niet alleen aan het eind. Mensen bij naam bedanken, de eer delen en kleine mijlpalen markeren kan een groep sterker en het werk voldoeningsvoller maken.
  workReversed: >-
    Omgekeerd kan de kaart een team weerspiegelen dat zijn warmte kwijt is, misschien door roddel, kliekjes of gewoon te veel werk. Je kunt opmerken of sociale druk je keuzes vormt, zoals langer blijven om erbij te horen. Bedenk hoe gezonde collegialiteit er voor jou uit zou zien, en waar je die op een kleine manier zelf kunt voorleven.
  growthUpright: >-
