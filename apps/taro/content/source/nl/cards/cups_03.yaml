  growthReversed: >-
    Omgekeerd kan deze kaart vragen of je drukte of gezelschap gebruikt om niet alleen te zijn met je gedachten. Ze kan ook eenzaamheid weerspiegelen die moeilijk toe te geven is. Je kunt sociale tijd afwisselen met tijd alleen en opmerken welke van de twee je meer mist. Contact zoeken met één persoon kan een zacht beginpunt zijn.
