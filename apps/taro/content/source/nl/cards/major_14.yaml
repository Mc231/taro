imageryNote: >-
  Gematigdheid van Taro is voorgesteld als een gevleugelde figuur aan de oever van een trage rivier, die zorgvuldig vloeistof overgiet tussen twee verschillende vaten, het ene van klei en het andere van glas. De straal tussen de vaten buigt zacht, alsof de balans ter plekke wordt gevonden. Stapstenen door de rivier suggereren een middenweg van de ene oever naar de andere, en zachte kleuren van de zonsopgang boven verre heuvels houden de sfeer kalm en hoopvol.
