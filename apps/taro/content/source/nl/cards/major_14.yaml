shortUpright: >-
  Een tragere, stabielere mengeling van wat je nodig hebt, kan meer rust brengen dan welk uiterste ook.
shortReversed: >-
  Iets slaat misschien te ver door naar één kant. Deze kaart nodigt je uit het op te merken en rustig bij te stellen.
meaningUpright: |-
  Gematigdheid is de kaart van dingen mengen in de juiste maat. Het beeld toont vaak water dat zorgvuldig tussen twee vaten wordt overgegoten, zodat er weinig wordt gemorst. De kunst zit niet in het een boven het ander kiezen, wel in ze samenvoegen: werk en rust, actie en geduld, wat je nu wilt en wat je later zult willen.
  In het dagelijks leven kan deze kaart weerspiegelen dat je een ritme vindt dat werkt, zoals een planning met genoeg ruimte erin, een compromis dat beide mensen respecteert, of een gewoonte die je beetje bij beetje bijstelt tot ze goed voelt. Ze kan wijzen op de stille voldoening van matigheid, die minder spannend is dan uitersten, maar vaak beter vol te houden.
  Deze kaart nodigt je uit om te overwegen waar je leven wat meer balans kan gebruiken. Je kunt jezelf afvragen welke delen overvol voelen en welke verwaarloosd, en welke kleine aanpassingen ze dichter bij elkaar kunnen brengen. Gematigdheid benadrukt geduld: goede mengsels hebben tijd nodig, en rustig experimenteren kan je meer leren dan een plotselinge, grote omslag.
meaningReversed: |-
  Omgekeerd kan Gematigdheid een gevoel van onevenwicht weerspiegelen. Misschien steek je te veel in één deel van je leven, zoals werk, een relatie of een zorg, terwijl een ander deel opdroogt. Of je merkt dat je heen en weer schiet tussen uitersten: alles of niets, druk of uitgeput, streng of slordig.
  Deze kaart kan ook wijzen op ongeduld met een proces dat tijd nodig heeft, en de verleiding om resultaten af te dwingen zonder ze te laten mengen.
  Je kunt een eenvoudige inventaris maken. Waar doe je te veel, en waar te weinig? Eén zachte aanpassing kiezen, geen ingrijpende oplossing, kan je helpen opnieuw af te stemmen. Balans is geen plek waar je één keer aankomt; het is iets waar je steeds weer naar terugkeert, met kleine correcties.
aspects:
  relationshipsUpright: >-
    In relaties kan Gematigdheid harmonie weerspiegelen die is opgebouwd door compromis en begrip. De kaart kan je uitnodigen iemand halverwege tegemoet te komen, jullie verschillende stijlen en behoeften te mengen, en geduldig te zijn terwijl je elkaars ritmes leert kennen. Rustige, stabiele zorg kan een band licht laten voelen.
  relationshipsReversed: >-
    Omgekeerd kan deze kaart wijzen op een relatie waarin de behoeften van één persoon overheersen, of waarin conflicten snel escaleren. Je kunt overwegen hoe je de intensiteit kunt verlagen: gesprekken vertragen, een pauze nemen als het verhit raakt, en zoeken naar de overlap tussen wat ieder van jullie wil.
  workUpright: >-
    Op het werk of in een project benadrukt Gematigdheid gestage vooruitgang en goede samenwerking. De kaart kan weerspiegelen dat je verschillende vaardigheden of ideeën combineert tot iets wat goed werkt, of dat je je krachten verdeelt zodat je energie blijft. Je kunt zoeken naar de versie van het plan die ambitieus is en toch vol te houden.
  workReversed: >-
    Omgekeerd kan Gematigdheid overwerk weerspiegelen, overhaaste beslissingen of wrijving tussen mensen met verschillende werkwijzen. Je kunt jezelf afvragen waar het tempo onrealistisch is geworden en wat eenvoudiger kan. Een middenweg vinden tussen tegenstrijdige prioriteiten kan de druk voor iedereen verlagen. Zelfs één middag zonder vergaderingen kan laten voelen hoe een rustiger tempo is.
  growthUpright: >-
    Voor persoonlijke groei nodigt deze kaart je uit matigheid te oefenen zonder star te worden. Je kunt je eigen evenwichtspunten opmerken: hoeveel rust, beweging, tijd alleen en tijd met anderen je helpen je stabiel te voelen. Kleine, consequente aanpassingen kunnen meer rust brengen dan grote voornemens.
  growthReversed: >-
    Omgekeerd kan Gematigdheid vragen of je op uitersten hebt geleefd. De kaart kan een behoefte weerspiegelen om te vertragen, te rusten, of een ontbrekend ingrediënt weer aan je dagen toe te voegen. Je kunt één gebied kiezen om rustig opnieuw in balans te brengen, en jezelf tijd geven om te zien hoe het zich zet.
