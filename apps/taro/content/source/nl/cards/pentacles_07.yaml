imageryNote: >-
  Het beeld kan een figuur tonen die even stilstaat naast een bladrijke plant of rank waaraan zeven munten als rijpend fruit hangen, leunend op een schoffel of spade. De rustende houding kan beoordeling symboliseren en de behoefte een stap terug te doen, terwijl de plant groei suggereert die haar eigen tijd neemt. Aarde, bladeren en gereedschap samen kunnen spreken van gestage arbeid, en de onrijpe oogst herinnert de kijker eraan dat het werk nog bezig is.
