imageryNote: >-
  Het originele beeld toont een figuur gezeten op een hoge stenen troon op een bergkam, met het zwaard volkomen rechtop, het gezicht recht naar de kijker gekeerd. Dunne, ordelijke wolken strekken zich uit over een bleke lucht, en twee vogels vliegen in evenwijdige lijnen erboven. Het rechtopstaande zwaard suggereert vaste principes, de directe blik wijst op eerlijkheid, en de geordende lucht op een geest die zijn rust heeft gevonden.
