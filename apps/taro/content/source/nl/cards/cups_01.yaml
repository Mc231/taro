imageryNote: >-
  Het beeld draait om één kelk die overloopt, waarvan het water in een paar dunne straaltjes in een stille vijver eronder valt. Waterlelies of lotusbladeren op het oppervlak kunnen staan voor gevoelens die langzaam opengaan en op diepe plekken wortelen. Een zacht licht boven de kelk kan ontvankelijkheid suggereren, een gave die wordt aangeboden en niet vastgegrepen. De sfeer is rustige overvloed: meer dan genoeg, die zachtjes naar buiten stroomt.
