reflectionQuestions:
  - "Wat voelt alsof het je nu vooruit roept?"
  - >-
    Is er iemand, jijzelf inbegrepen, die je eerlijker wilt gaan zien?
  - >-
    Welke les uit het verleden wil je meenemen naar je volgende hoofdstuk?
imageryNote: >-
  Het Oordeel van Taro is voorgesteld als een wijd landschap bij dageraad na een lange winter, waar een heldere klok luidt vanaf een heuveltop en mensen uit hun huizen stappen in het eerste licht, zich uitrekkend en omhoog kijkend. Smeltende sneeuw onthult groene scheuten eronder. Een open raam met gordijnen die naar buiten waaien, suggereert een innerlijke roep die wordt beantwoord. Verre bergen verwijzen naar het perspectief dat eerlijke reflectie brengt, en bleke ochtendkleuren spreken van vernieuwing.
