shortUpright: >-
  Iets wat je in gang hebt gezet, begint te reizen; je kunt uitkijken naar wat terugkomt en je voorbereiden op de volgende fase.
shortReversed: >-
  Vooruitgang voelt misschien trager dan je hoopte; dit kan een tijd zijn om verwachtingen bij te stellen, niet om op te geven.
meaningUpright: |-
  Waar de Twee van Staven over plannen ging, laat de Drie van Staven plannen zien die al in beweging zijn. De schepen hebben de haven verlaten, bij wijze van spreken: berichten zijn verstuurd, aanvragen ingediend, eerste stappen gezet. Nu volgt een periode van naar de horizon kijken terwijl dingen zich ontvouwen buiten je directe controle.
  Deze kaart kan het voldane gevoel van eerste vooruitgang weerspiegelen, zoals een project dat zijn eerste supporters krijgt, een nieuwe gewoonte die inslijt, of een samenwerking die verder reikt dan je had verwacht. Ze kan ook de waarde van voorbereiding benadrukken: je hebt genoeg grondwerk gedaan om een stap terug te kunnen doen en verder vooruit te kijken.
  De uitnodiging is om twee dingen tegelijk vast te houden: vertrouwen in wat je bent begonnen en openheid voor hoe het zich ontwikkelt. Je kunt opmerken waar je inspanningen beginnen aan te sluiten bij andere mensen, en overwegen wat de volgende fase van je zou kunnen vragen. Groei vraagt vaak nieuwe vaardigheden, nieuwe partners of een iets groter beeld van wat je aan het bouwen bent.
meaningReversed: |-
  Omgekeerd kan de Drie van Staven wachten weerspiegelen dat in rusteloosheid is omgeslagen. Misschien heb je het werk gedaan en zie je toch weinig terugkomen, of zien de resultaten er anders uit dan je je had voorgesteld. Het is makkelijk om traagheid als mislukking te lezen, ook als dingen gewoon hun tijd nemen.
  Soms wijst deze kaart ook op een beperkt zicht: je richten op één enkele uitkomst en de kleinere tekenen van beweging om je heen missen, of zo ver vooruit plannen dat het heden leeg voelt.
  Dit kan een goed moment zijn om naar je verwachtingen te kijken. Waren je tijdlijnen realistisch? Mis je informatie, of is er een partner die je nog niet om hulp hebt gevraagd? Je kunt het plan bijstellen zonder het op te geven, en nota nemen van de vooruitgang die stilletjes al heeft plaatsgevonden.
aspects:
  relationshipsUpright: >-
    In hechte banden kan deze kaart een band weerspiegelen die voorbij haar eerste hoofdstuk groeit, met meer vertrouwen, nieuwe gedeelde plannen of openheid om andere mensen erbij te betrekken. De kaart kan je uitnodigen te waarderen hoe ver jullie samen zijn gekomen en te praten over waar jullie hierna heen willen, met ruimte voor ieders eigen horizon.
  relationshipsReversed: >-
    Omgekeerd heb je misschien het gevoel dat je wacht tot iemand je halverwege tegemoetkomt, of dat een relatie zich niet ontwikkelt in het tempo waarop je hoopte. Het kan helpen je verwachtingen open te delen, zonder in stilte de vooruitgang te meten. Je kunt ook vragen waar de ander op hoopt, want jullie tijdlijnen kunnen gewoon verschillen.
  workUpright: >-
    Op het werk of in een studie kan de Drie van Staven wijzen op projecten die meer bereik krijgen: een lancering, een campagne, een samenwerking tussen teams of locaties. Je kunt overwegen hoe je die vaart kunt ondersteunen, bijvoorbeeld door op te volgen, je netwerk te verbreden of je op de volgende fase voor te bereiden voordat die aanbreekt, zodat je eigen vooruitgang je niet overvalt.
  workReversed: >-
    Omgekeerd laten resultaten misschien op zich wachten, of is een plan vertraagd door dingen waar je geen invloed op had. Zonder harder in dezelfde richting te duwen, kun je bekijken wat je tot nu toe hebt geleerd en de route bijstellen. Navragen bij de betrokkenen kan obstakels, of stille successen, zichtbaar maken die je vanaf je eigen plek makkelijk mist.
  growthUpright: >-
    Vertrouwen op de inzet die je al hebt geleverd, is een stille vorm van groei. Groei gaat vaak buiten het zicht door na de eerste stappen. Je kunt terugkijken naar waar je een paar maanden geleden begon en opmerken wat er is veranderd, en dan met die wijdere blik kiezen wat je hierna wilt verkennen.
  growthReversed: >-
    Omgekeerd vertroebelt ongeduld met jezelf misschien je zicht op echte vooruitgang. Je kunt verkennen waar je onmiddellijke verandering verwacht en waar een trager ritme vriendelijker zou zijn. Een eenvoudig overzicht bijhouden van kleine stappen kan groei beter zichtbaar maken als de horizon nog leeg lijkt.
