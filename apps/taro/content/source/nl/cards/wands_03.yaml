imageryNote: >-
  Een figuur staat op een heuvel of klif, met de rug half naar de kijker, met drie staven om zich heen geplant als markeringen van inzet, en kijkt naar boten of reizigers die beneden over open water of vlakten trekken. Vroeg licht kan een nieuwe fase suggereren die begint. De verre beweging staat voor plannen die al onderweg zijn, en de vaste houding voor geduldig vertrouwen terwijl de resultaten nog op reis zijn.
