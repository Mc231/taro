imageryNote: >-
  Het beeld kan mensen van verschillende leeftijden samenbrengen onder een poort die toegang geeft tot een huis of binnenplaats, met dieren die vlakbij rusten en tien munten in een patroon over het tafereel verdeeld. De poort kan een drempel symboliseren tussen privéleven en gedeeld leven, de mix van leeftijden continuïteit, en de munten in hun patroon een structuur die in de loop van de tijd is gebouwd. Warme, rustige kleuren kunnen erbij horen suggereren, terwijl de drukke compositie laat zien hoe ingewikkeld elk huishouden vanbinnen is.
