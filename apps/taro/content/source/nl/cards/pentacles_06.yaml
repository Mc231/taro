imageryNote: >-
  Het beeld kan draaien om een staande figuur die in de ene hand een weegschaal in evenwicht houdt, terwijl de andere hand munten aanbiedt aan mensen in de buurt. Zes munten kunnen rond het tafereel zijn geplaatst, sommige in handen en sommige in de lucht ertussen. De weegschaal kan eerlijkheid en aandacht symboliseren, de uitgestoken hand gulheid, en de verschillende posities van de figuren de vraag naar macht die stil in elke uitwisseling kan zitten.
