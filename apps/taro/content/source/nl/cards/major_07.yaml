  relationshipsReversed: >-
    Omgekeerd kan deze kaart wijzen op twee mensen die verschillende kanten op trekken, of op één persoon die stuurt terwijl de ander zich meegevoerd voelt. Je kunt overwegen of je een relatie naar een doel duwt voordat jullie er allebei klaar voor zijn. Vertragen om het eens te worden over de bestemming kan de spanning verlichten.
  workUpright: >-
