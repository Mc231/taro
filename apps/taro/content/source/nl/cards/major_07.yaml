imageryNote: >-
  De Zegewagen van Taro is voorgesteld als een figuur die een kleine, stevige kar over een kustweg mendt, getrokken door twee dieren met een tegengesteld temperament, het ene kalm en het andere onrustig. De menner houdt de teugels losjes vast en stuurt met aandacht, zonder kracht. Een schelpachtige overkapping boven de zitplaats kan verwijzen naar Kreeft en de bescherming die iemand veilig vooruit laat gaan, terwijl de open weg en de verre lichtjes van de haven een bestemming suggereren die zelf is gekozen en niet opgelegd.
