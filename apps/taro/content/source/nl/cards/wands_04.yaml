imageryNote: >-
  Vier rechtopstaande staven zijn verbonden door een slinger van bladeren, bloemen en linten en vormen samen een open poort. Daarachter komen figuren met opgeheven handen samen, en in de verte staat een eenvoudig huis of een ommuurd stadje. Het kader van vier suggereert een stevig fundament dat met inzet is gebouwd, de slinger een oogst van gedeelde vreugde, en de open poort een welkom dat anderen binnenlaat en niet buitensluit.
