imageryNote: >-
  Het beeld toont een eenzame figuur met een wandelstok, van achteren gezien, die een zorgvuldig opgestapelde rij kelken op de oever achterlaat. Voor de figuur liggen glooiende heuvels en een slingerend pad onder een dunne maansikkel. Een zichtbaar gat in de gestapelde kelken kan iets onvolledigs suggereren. Diepe blauw- en zilvertinten roepen zelfbeschouwing op en de stille aantrekkingskracht van wat nog niet is verkend.
