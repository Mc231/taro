shortUpright: >-
  Een pauze, gekozen of niet, kan een uitzicht bieden dat je nooit zou zien als je vooruit raast.
shortReversed: >-
  Wachten is misschien uitstellen geworden. Wat zou je helpen kiezen tussen stil blijven staan en bewegen?
meaningUpright: |-
  De Gehangene hangt ondersteboven aan een levende boom, maar het gezicht is kalm, soms zelfs stralend. Dit is geen kaart van straf. Het is een kaart van bewuste opschorting: uit de gewone stroom van doen stappen om dingen anders te zien. Als je de wereld op zijn kop zet, kan wat vanzelfsprekend leek ineens vreemd lijken, en kan wat onmogelijk leek binnen bereik komen.
  In het dagelijks leven kan deze kaart een project weerspiegelen dat stilligt, een plan dat door omstandigheden is uitgesteld, of een moment waarop je beseft dat harder duwen niet helpt. Ze kan wijzen op de waarde van een vast idee loslaten over hoe iets zou moeten verlopen. Soms is de nuttigste zet stoppen met bewegen en gewoon kijken.
  Deze kaart nodigt je uit om te overwegen wat een pauze je zou kunnen bieden. Je kunt jezelf afvragen wat je zou opmerken als je je situatie vanuit de tegenovergestelde hoek bekeek. De Gehangene suggereert dat overgave, in de zin van de behoefte aan controle loslaten, ruimte kan maken voor inzicht, en dat wachten actief kan zijn als er aandacht bij komt.
meaningReversed: |-
  Omgekeerd kan de Gehangene een pauze weerspiegelen die langer duurt dan zinvol is. Misschien voel je je vastzitten in een tussenfase, wachtend op verandering zonder goed te weten waarop je wacht. Besluiteloosheid kan veiliger gaan voelen dan kiezen.
  Deze kaart kan ook wijzen op verzet tegen een pauze die je nodig hebt: elk moment vullen om het ongemak van stilte te vermijden, of je eigen behoeften opofferen op een manier waar niemand meer iets aan heeft.
  Je kunt jezelf afvragen wat het wachten beschermt. Is het tijd om te bewegen, wat is dan de kleinste stap die je los zou krijgen? Moet je stoppen, welke toestemming kun je jezelf dan geven om zonder schuldgevoel te rusten? Hoe dan ook is de keuze aan jou, en die keuze maken kan je weer een gevoel van richting geven.
aspects:
  relationshipsUpright: >-
    In relaties kan de Gehangene een moment weerspiegelen om een stap terug te doen en een situatie vanuit het gezichtspunt van de ander te zien. De kaart kan je uitnodigen de behoefte los te laten om een discussie te winnen of alles meteen op te lossen. Geduld en de bereidheid om anders te kijken kunnen onverwacht begrip openen.
  relationshipsReversed: >-
    Omgekeerd kan deze kaart wijzen op een relatie die in het ongewisse hangt, waarin geen van beiden benoemt wat ze willen. De kaart kan ook weerspiegelen dat je meer geeft dan eerlijk voelt, in de hoop dat dingen veranderen. Je kunt overwegen of het tijd is om vriendelijk te zeggen wat je nodig hebt, zodat jullie allebei verder kunnen.
  workUpright: >-
    Op het werk of in een project benadrukt de Gehangene een pauze om opnieuw na te denken. Vertragingen kunnen frustrerend zijn, maar ze kunnen ook tijd bieden om aannames te bevragen, alternatieven te onderzoeken of een idee te laten rijpen. Je kunt een rustige periode gebruiken om je werk vanuit een heel andere hoek te bekijken.
  workReversed: >-
    Omgekeerd kan de Gehangene een project weerspiegelen dat te lang vastzit, of een beslissing die eindeloos wordt uitgesteld. Je kunt jezelf afvragen op welke informatie of steun je eigenlijk wacht. Jezelf een milde deadline geven, of ervoor kiezen één optie los te laten, kan weer beweging brengen.
  growthUpright: >-
    Loslaten is een vaardigheid, en de Gehangene biedt een kans om die te oefenen. Wat je loslaat, kan een overtuiging zijn, een verwachting of de gewoonte om te haasten. Je kunt één vertrouwd ding in omgekeerde volgorde of vanuit een nieuwe hoek doen, en opmerken wat die kleine verstoring zichtbaar maakt over hoe je de wereld meestal ziet.
  growthReversed: >-
    Omgekeerd kan de Gehangene vragen of je stilte vermijdt of erin vastzit. De kaart kan rusteloosheid weerspiegelen of het gevoel in de wacht te staan. Je kunt bij jezelf nagaan: is dit een tijd voor geduld, of voor een zacht duwtje? Je eerlijke antwoord kan de volgende stap richting geven.
