imageryNote: >-
  De Gehangene van Taro is voorgesteld terwijl die aan één enkel ondersteboven hangt aan een stevige, levende tak, met ontspannen armen en een kalm, zelfs nieuwsgierig gezicht. Vanuit deze hoek ziet de figuur de wereld weerspiegeld in een vijver eronder, andersom gedraaid. De boom is groen en zit in de knop, wat laat zien dat de pauze deel is van groei en er geen einde aan maakt. Waterige blauwtinten en losse, vloeiende kleding weerspiegelen overgave, dromen en onder de oppervlakte kijken.
