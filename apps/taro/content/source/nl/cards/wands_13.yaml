imageryNote: >-
  Een figuur zit ontspannen op een brede zetel in een zonnige open plek in het bos, met een bladerende staf in de ene hand en de andere open naar de kijker. Naast de figuur gloeit een haardvuur, en vlakbij ligt een waakzaam dier als metgezel. De haard suggereert warmte die aan anderen wordt aangeboden, de open hand gulheid, en de ontspannen houding een zelfvertrouwen dat zich niet hoeft te bewijzen. Warme goud- en barnsteentinten kunnen vuur op zijn rustigst en stralendst weerspiegelen.
