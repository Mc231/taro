imageryNote: >-
  In het originele beeld staat een figuur op zachte, drassige grond binnen een losse kring van zwaarden die in de aarde zijn gestoken. Een dun lint bedekt de ogen en een ander hangt over de polsen zonder geknoopt te zijn. Achter de figuur is de kring open, en een pad leidt naar verre heuvels. De linten suggereren grenzen die losser kunnen worden, en de open plek wijst op opties die nog niet zijn gezien.
