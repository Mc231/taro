shortUpright: >-
  Je staat aan de rand van wat je kent en kijkt naar buiten; een goed moment om te schetsen waar je naartoe zou willen.
shortReversed: >-
  Comfort en voorzichtigheid houden een groter plan misschien op de plank; je kunt nog eens kijken wat je daar vasthoudt.
meaningUpright: |-
  De Twee van Staven volgt op de eerste vonk met een pauze voor visie. Het idee is niet langer alleen een gevoel; nu sta je iets hoger en kijk je naar het uitzicht, benieuwd hoe ver het zou kunnen reiken. Eén staf staat al achter je in de grond, een teken van wat je hebt opgebouwd, terwijl je de andere in je hand houdt, klaar om ergens nieuws heen te dragen.
  Deze kaart verschijnt vaak als je een grotere stap overweegt: een opleiding in een andere stad, een rol anders vormgeven, een project beginnen dat meer van je vraagt dan je gewone routine. Ze kan ook het rusteloze gevoel weerspiegelen dat je een plek bent ontgroeid terwijl je er nog steeds op gesteld bent.
  De uitnodiging is hier om tegelijk ambitieus en eerlijk te plannen. Je kunt opschrijven waar je op hoopt, wat het zou kosten aan tijd en energie, en welke eerste zet klein genoeg is om te proberen. Ver vooruitkijken is nuttig; de volgende stap kiezen die je echt kunt zetten ook.
meaningReversed: |-
  Omgekeerd kan de Twee van Staven een plan weerspiegelen dat op papier blijft. Misschien blijf je naar de horizon staren zonder je tas in te pakken, omdat het vertrouwde veiliger voelt of omdat de bestemming nog vaag is. Soms is die aarzeling verstandig, en soms is het gewoon gewoonte.
  Deze kaart kan ook wijzen op plannen die zijn gemaakt voor de goedkeuring van iemand anders, of op een visie die niet meer past bij wie je aan het worden bent. Als een doel zwaar voelt en niet spannend, kan het de moeite waard zijn je af te vragen of het nog wel van jou is.
  Je kunt je kaart met frisse ogen opnieuw bekijken. Hoe zou een kleinere, persoonlijkere versie van dit plan eruitzien? Welke angst is het luidst, en gaat die over de stap zelf of over wat anderen zouden kunnen denken? Haar benoemen kan de volgende zet minder als een sprong laten voelen en meer als een keuze.
aspects:
  relationshipsUpright: >-
    In relaties kan deze kaart uitnodigen tot een gesprek over de toekomst die ieder van jullie voor zich ziet: waar je wilt wonen, hoe je je tijd wilt besteden, wat je hoopt te verkennen. De kaart kan een band weerspiegelen die voelt als een veilige basis van waaruit ieder vrij is om naar buiten te kijken. Je kunt iemand die dicht bij je staat vragen naar welke horizon die de laatste tijd kijkt.
  relationshipsReversed: >-
    Omgekeerd houden jij of iemand die dicht bij je staat misschien een wens naar verandering in, omdat het riskant voelt om die hardop te zeggen. Plannen kunnen stilletjes uit elkaar groeien als ze nooit worden gedeeld. Dit kan een moment zijn om te praten over hoop die privé is gebleven, en evenveel te luisteren als te praten, zodat niemand van jullie alleen plant.
  workUpright: >-
    Op het werk kan de Twee van Staven wijzen op strategisch denken: de volgende fase van een project in kaart brengen, een nieuw vakgebied overwegen, of een doel op langere termijn vormgeven. Je kunt wat tijd besteden aan het grotere geheel voordat je weer in de dagelijkse taken duikt, en dan één concrete actie kiezen die het plan van het whiteboard in beweging brengt.
  workReversed: >-
    Omgekeerd zit een plan op het werk misschien vast tussen comfort en ambitie, of is het meer gevormd door wat verwacht lijkt te worden dan door wat jij wilt. Je kunt nagaan of het doel je nog motiveert. Zo ja, dan kan het helpen het op te knippen in een eerste klein experiment; zo nee, dan is het plan opnieuw tekenen ook een geldige weg vooruit.
  growthUpright: >-
    Voor persoonlijke groei nodigt deze kaart je uit je eigen ambities serieus te nemen. Wat zou je verkennen als je jezelf toestemming gaf om verder te denken dan je gebruikelijke grenzen? Je kunt een ruwe schets maken van het komende jaar of de komende twee jaar, niet als vaste belofte, wel als richting die je helpt kansen op te merken als ze zich aandienen.
  growthReversed: >-
    Omgekeerd trekken de wens naar zekerheid en de wens naar groei misschien verschillende kanten op. Beide zijn echte behoeften. Je kunt verkennen wat een nieuwe stap veilig genoeg zou maken om te proberen, en welke steun, oefening of informatie een ver idee kan veranderen in iets wat je geleidelijk kunt naderen.
reflectionQuestions:
