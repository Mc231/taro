imageryNote: >-
  Een figuur staat op een hoge muur of richel, met één staf stevig naast zich in de grond en een tweede losjes in de hand, en kijkt uit naar ver land of zee. Vlakbij liggen een kleine globe, een kaart of een kompas. De vaste staf staat voor wat al is opgebouwd, de opgeheven staf voor de keuze om verder te gaan. Het wijde uitzicht nodigt de kijker uit zich veel mogelijke routes voor te stellen, en niet één vastgelegd pad.
