imageryNote: >-
  Het beeld toont een zittende figuur onder een boom of naast stil water, met de armen over elkaar en de blik omlaag gericht op drie kelken op de grond. Een vierde kelk drijft op een bries naar de figuur toe of dobbert op het water, makkelijk te missen. Gedempte kleuren en een gesloten houding kunnen naar binnen gekeerd zijn en een behoefte aan pauze suggereren, terwijl de aangeboden kelk een draad van mogelijkheid in beeld houdt.
