imageryNote: >-
  Het beeld kan één figuur tonen die tussen wijnranken of fruitbomen staat, met negen munten verweven in het groen eromheen en een vogeltje dat rustig op één hand zit. De overvloedige tuin kan de vruchten van geduldige zorg symboliseren, de vogel een gedisciplineerde, zachte geest, en de onverhaaste houding een stil zelfvertrouwen. Rijke groentinten en goud kunnen verfijning zonder overdaad suggereren, een ruimte die verdiend en persoonlijk gevormd voelt.
