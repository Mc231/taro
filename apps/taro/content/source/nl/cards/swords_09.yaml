  growthReversed: >-
    Omgekeerd kan deze kaart weerspiegelen dat je leert dat gedachten niet altijd feiten zijn. Je kunt het moment opmerken waarop een zorg begint en die zachtjes benoemen als een zorg. Na verloop van tijd kan die kleine pauze ruimte scheppen tussen jou en de angst. Om steun vragen hoort bij deze groei en is geen teken van zwakte.
