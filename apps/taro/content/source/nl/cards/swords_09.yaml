imageryNote: >-
  Het originele beeld toont een figuur die rechtop in bed zit, de knieën opgetrokken, in een donkere kamer die alleen wordt verlicht door een dun streepje maanlicht bij het raam. Negen zwaarden hangen in nette rijen aan de muur erachter en raken de figuur nooit. Een opgevouwen deken en een kleine lamp wachten vlakbij, nog uit. De rijen zwaarden suggereren rondcirkelende gedachten, terwijl de lamp en het raam laten zien dat troost en ochtend dichtbij zijn.
