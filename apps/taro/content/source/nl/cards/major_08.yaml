    Omgekeerd kan Kracht weerspiegelen dat je je uitgeput voelt door druk, of twijfelt of je een uitdaging aankunt. De kaart kan ook wijzen op fel reageren onder stress. Je kunt jezelf afvragen welke steun of rust je zou helpen weer vaste grond onder je voeten te vinden, en hoe je een tempo kiest dat je kunt volhouden.
  growthUpright: >-
    Kracht suggereert dat je vriendschap sluit met je eigen innerlijke leeuw, zonder hem op te sluiten: de sterke gevoelens, verlangens en instincten die je maken tot wie je bent. Je kunt nieuwsgierig worden naar wat ze nodig hebben, zonder ertegen te vechten. Zelfcompassie is hier geen zwakte; het is een oefening die moed beter vol te houden maakt.
  growthReversed: >-
