imageryNote: >-
  Kracht van Taro is voorgesteld als een kalme figuur die geknield zit in een zonnige weide naast een grote leeuw, met één hand rustend op zijn manen terwijl het dier ontspannen en vol vertrouwen tegen de figuur aanleunt. Er zijn geen touwen of kettingen; de band blijkt uit nabijheid en gemak. Wilde bloemen die om hen heen groeien, suggereren dat geduld zachtere dingen laat opbloeien. Warm, goudkleurig licht houdt de sfeer vredig en toont kracht en zachtheid zij aan zij.
