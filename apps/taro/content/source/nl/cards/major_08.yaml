  relationshipsReversed: >-
    Omgekeerd kan deze kaart wijzen op een kort lontje, of op iemand die gevoelens inslikt om conflict te vermijden. Je kunt overwegen of je te hard bent voor jezelf of voor iemand die dicht bij je staat. Vriendelijk iets zeggen voordat frustratie zich opstapelt, kan de band beschermen en ook je eigen gevoel van rust.
  workUpright: >-
