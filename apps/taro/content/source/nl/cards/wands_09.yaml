shortUpright: >-
  Je hebt veel doorstaan en staat nog overeind; deze kaart eert je veerkracht op het laatste stuk.
shortReversed: >-
  Zo lang op je hoede blijven kan vermoeiend zijn; je kunt opmerken waar het veilig is om te rusten en anderen toe te laten.
meaningUpright: |-
  De Negen van Staven toont iemand die door uitdagingen is gegaan en nog op de been staat. De figuur leunt op één staf, een beetje moe en waakzaam, binnen een kring van andere staven die als een zelfgebouwd hek in de grond staan. Dit is veerkracht met wat blauwe plekken van ervaring: niet ongeschonden, maar ook niet verslagen.
  De kaart kan je aanspreken als een lang project bijna klaar is, als je door een veeleisende periode van zorgen of studeren heen gaat, of als je tegenslagen hebt gehad en ervoor kiest door te gaan. Je weet nu meer dan aan het begin, ook over waar je grenzen liggen.
  Deze kaart nodigt je uit te erkennen hoe ver je bent gekomen en te gebruiken wat je hebt geleerd. Volharding is waardevol, en je krachten doseren ook. Je kunt jezelf afvragen wat je door dit laatste stuk zou helpen: een duidelijke eindstreep, een paar uur rust, een praktische grens, of een herinnering dat je dichter bij het einde bent dan het voelt.
meaningReversed: |-
  Omgekeerd kan de Negen van Staven vermoeidheid weerspiegelen die zich in de loop van de tijd heeft opgebouwd. Misschien heb je het gevoel dat je jezelf of je projecten al zo lang bewaakt dat ontspannen onmogelijk lijkt. Voorzichtigheid die je door eerdere moeilijkheden hebt geleerd, kan omslaan in wantrouwen tegenover elke nieuwe situatie.
  Deze kaart kan ook wijzen op een grens die wordt bereikt. Doorduwen is niet altijd de sterkste keuze; soms betekent kracht toegeven dat je een pauze of een helpende hand nodig hebt.
  Je kunt verkennen waar je verdediging nog nuttig is en waar ze nu ook steun buitenhoudt, niet alleen moeilijkheden. Is er iemand op wie je kunt leunen, een taak die je kunt overdragen, of een pauze die je jezelf kunt gunnen? Je waakzaamheid op een veilige plek een beetje laten zakken kan een manier zijn om te zorgen voor de veerkracht die je hebt opgebouwd.
aspects:
  relationshipsUpright: >-
    In hechte banden kan deze kaart een relatie weerspiegelen die moeilijke tijden heeft doorstaan en nog overeind staat. Ze kan ook wijzen op voorzichtigheid die is aangeleerd door eerdere pijn. Je kunt de stabiliteit waarderen die jullie samen hebben opgebouwd, en opmerken of oude argwaan nog nodig is bij iemand die heeft laten zien dat die te vertrouwen is.
  relationshipsReversed: >-
    Omgekeerd houd je anderen misschien op afstand om niet opnieuw teleurgesteld te worden, of ben je te moe om zoveel te geven als anders. Je kunt overwegen iemand die dicht bij je staat te vertellen dat je reserves laag zijn. Jezelf laten steunen kan een band verdiepen en hoeft hem niet te verzwakken.
  workUpright: >-
    Op het werk of in een studie kan de Negen van Staven wijzen op de laatste krachtsinspanning van een lang traject. Ervaring heeft je realistischer gemaakt over obstakels, en die kennis is nuttig. Je kunt de resterende stappen zorgvuldig plannen, je focus beschermen en jezelf herinneren aan de redenen waarom je begon, zodat het laatste stuk zinvol voelt en niet alleen zwaar.
  workReversed: >-
    Omgekeerd zit je misschien dicht bij je grens, werk je defensief of heb je het gevoel dat je alles alleen moet doen. Je kunt kijken wat gedelegeerd, uitgesteld of vereenvoudigd kan worden. Eerlijk praten over wat je aankunt, kan een verantwoordelijke keuze zijn die zowel jou als het werk beschermt.
  growthUpright: >-
    Je bent misschien taaier dan je jezelf toekent. Elke moeilijkheid die je tegenkwam, heeft je iets geleerd over wat je aankunt. Je kunt een paar lessen uit recente uitdagingen opschrijven en overwegen hoe ze je kunnen leiden met wat meer zelfvertrouwen en wat minder spanning.
  growthReversed: >-
    Omgekeerd eist voortdurende waakzaamheid misschien haar tol. Je kunt verkennen hoe rust er voor jou uitziet en of je jezelf daar genoeg van gunt. Je waakzaamheid op kleine, veilige manieren verzachten, zoals met een rustige avond of een eerlijk gesprek, kan je kracht minder als een pantser laten voelen.
reflectionQuestions:
  - >-
