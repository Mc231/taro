imageryNote: >-
  Een figuur staat in de schemering binnen een kring van staven die in de grond zijn geslagen, leunt op een ervan en kijkt met alerte ogen naar buiten. Naast de figuur brandt een klein kampvuur laag. De kring van staven suggereert de verdediging die door ervaring is gebouwd, het lage vuur de energie die na een lange inspanning nog brandend wordt gehouden, en het afnemende licht een dag die ten einde loopt. De waakzame houding bevat zowel vermoeidheid als de volharding die doorgaat.
