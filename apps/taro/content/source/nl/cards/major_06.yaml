shortUpright: >-
  Een keuze gemaakt met hart en hoofd samen, in lijn met wat je echt belangrijk vindt.
shortReversed: >-
  Een deel van jou wil misschien het een en een ander deel het ander. Deze kaart nodigt je uit naar beide te luisteren voor je kiest.
meaningUpright: |-
  De Geliefden wordt vaak gelezen als een kaart van romantiek, maar het diepere thema is afstemming: twee delen, twee mensen of twee paden die elkaar ontmoeten op een manier die heel voelt. De kaart vraagt wat je het belangrijkst vindt, en of de keuzes die voor je liggen dat weerspiegelen. Verbinding gaat hier zowel over anderen als over jezelf.
  In het dagelijks leven kan deze kaart een relatie weerspiegelen waarin je je echt gezien voelt, een samenwerking op het werk waarin ideeën vanzelf stromen, of een beslissing waarbij je duidelijk moet zeggen wat ertoe doet voor jou. Ze kan wijzen op een moment van kiezen tussen twee goede opties, waarbij er geen vanzelfsprekend juist antwoord is, alleen het antwoord dat past bij wie je aan het worden bent.
  Deze kaart nodigt je uit om te overwegen hoe eerlijk je bent tegenover jezelf en anderen. Je kunt jezelf afvragen waartoe je je aangetrokken voelt en waarom, en waaraan je je wilt verbinden. De Geliefden laat zien dat betekenisvolle keuzes zelden over perfectie gaan. Ze gaan erover dat je je hart en je oordeel in dezelfde kamer brengt en ze met elkaar laat praten.
meaningReversed: |-
  Omgekeerd kan De Geliefden het gevoel weerspiegelen dat je twee kanten op wordt getrokken. Wat je wilt en wat je denkt te moeten willen, komen misschien niet overeen, of een hechte band voelt een beetje vals, omdat ieder iets anders belangrijk vindt zonder het te zeggen.
  Deze kaart kan ook wijzen op een beslissing die steeds wordt uitgesteld, misschien omdat kiezen voor de ene optie betekent dat je de andere loslaat. De keuze ontwijken kan op korte termijn makkelijker voelen, terwijl het ongemerkt energie kost.
  Je kunt opschrijven wat elke optie je eerlijk gezegd biedt en van je vraagt, en welke van je waarden ze ondersteunt. Het kan helpen op te merken waar je je het meest jezelf voelt. Opnieuw op één lijn komen begint vaak met een kleine, eerlijke erkenning, eerst tegenover jezelf en dan, als het goed voelt, tegenover iemand anders.
aspects:
  relationshipsUpright: >-
    In relaties kan De Geliefden diep wederzijds begrip weerspiegelen en het plezier van elkaar kiezen, in de liefde, in vriendschap of in de familie. De kaart kan je uitnodigen te delen wat je echt belangrijk vindt en te luisteren naar wat de ander belangrijk vindt. Nabijheid groeit als beide mensen eerlijk kunnen zijn en zich toch welkom voelen.
  relationshipsReversed: >-
    Omgekeerd kan deze kaart wijzen op een kloof tussen de hoop of prioriteiten van twee mensen, of op gevoelens die niet zijn uitgesproken. Je kunt overwegen of je je te veel aanpast om de vrede te bewaren, of verwacht dat iemand raadt wat je nodig hebt. Een open, vriendelijk gesprek over waarden kan jullie allebei helpen zien waar je staat.
  workUpright: >-
    Op het werk of in een project benadrukt De Geliefden samenwerking en keuzes die geworteld zijn in je waarden. De kaart kan een samenwerking weerspiegelen die het goede in beide mensen naar boven haalt, of een beslissing over welke richting je volgt. Je kunt jezelf afvragen welke optie zowel zinvol als praktisch voelt, en beide laten meetellen in je keuze.
  workReversed: >-
    Omgekeerd kan De Geliefden wrijving in een samenwerking weerspiegelen, of het gevoel dat je werk niet past bij wat je belangrijk vindt. De kaart kan ook wijzen op aarzeling bij een keuze tussen twee paden. Je kunt opsommen wat elk pad van je zou vragen, en opmerken aan welk pad je dat liever zou geven.
  growthUpright: >-
    Je eigen waarden helderder leren kennen is het innerlijke werk waar deze kaart naar wijst. Als je begrijpt wat ertoe doet voor jou, gaan keuzes minder over anderen tevredenstellen en meer over trouw blijven aan jezelf. Je kunt drie waarden opschrijven en opmerken waar ze je dagen al richting geven.
  growthReversed: >-
    Omgekeerd kan De Geliefden innerlijk conflict weerspiegelen: een deel van jou wil verandering, een ander deel wil comfort. Geen van beide delen heeft ongelijk. Je kunt elk deel een stem geven, op papier of in een gesprek, en kijken of er een keuze is die beide eert, al is het maar gedeeltelijk.
reflectionQuestions:
