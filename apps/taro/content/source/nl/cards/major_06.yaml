imageryNote: >-
  De Geliefden van Taro is voorgesteld als twee figuren aan weerszijden van een smalle beek, die over het water elkaars hand proberen te pakken, zo getekend dat iedereen zichzelf in beide figuren kan herkennen. Boven hen cirkelen twee vogels in dezelfde heldere lucht. Op de ene oever groeit een fruitboom en op de andere een bloeiende rank: twee verschillende gaven die elkaar in het midden ontmoeten. De beek suggereert de keuze en de moeite die echte verbinding van beide mensen vraagt.
