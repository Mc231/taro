imageryNote: >-
  Het originele beeld toont drie slanke zwaarden die tegen een hartvormige steen leunen, onder een lage grijze lucht. Er valt zachte regen omheen, en aan de rand van de wolken verschijnt een vage opening van licht. De steen suggereert het gewicht van verdriet, terwijl de regen wijst op tranen en loslaten. Het verre licht laat zien dat stormen voorbijtrekken, zonder te beloven wanneer.
