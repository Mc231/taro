  relationshipsReversed: >-
    Omgekeerd kan de Drie van Zwaarden suggereren dat een pijn tussen mensen begint af te nemen, of dat er een nog stil vanbinnen wordt vastgehouden. Misschien is een excuus mogelijk, of is de gezondere stap gewoon aanvaarding. Je kunt je afvragen wat je nodig hebt om vrede te voelen, met of zonder de ander. Vergeving, als die komt, kan in haar eigen tijd komen.
  workUpright: >-
