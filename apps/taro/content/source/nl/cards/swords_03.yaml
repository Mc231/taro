  growthReversed: >-
    Omgekeerd kan deze kaart weerspiegelen dat je leert loslaten wat pijn doet, in een tempo dat veilig voelt. Je kunt opmerken waar je je adem inhoudt, letterlijk of figuurlijk. Een zucht, een paar tranen of een paar eerlijke zinnen in een dagboek kunnen een kleine daad van loslaten zijn. Herstel verloopt zelden in een rechte lijn, en dat is in orde.
