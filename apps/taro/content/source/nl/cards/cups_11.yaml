imageryNote: >-
  Het beeld toont een jonge figuur die een kelk op schouderhoogte houdt en verrast ontdekt dat er een visje van binnenuit terugkijkt. De kleding kan golf- of bloemmotieven dragen, en een kustlijn erachter verwijst naar de diepte van gevoel waaruit ideeën opkomen. Zachte pasteltinten en een lichte, nieuwsgierige uitdrukking brengen openheid, verbeelding en de charme van onverwachte boodschappen van binnenuit over.
