imageryNote: >-
  Het beeld kan een figuur midden in een stap tonen, die twee munten in de lucht houdt, verbonden door een lint of koord dat in een eindeloze bocht lust. Daarachter kunnen golvend water of boten die op de golven rijzen en dalen de voortdurende beweging van het dagelijks leven weerspiegelen. De lus suggereert continuïteit en het doorlopende karakter van balans, terwijl de lichte, dansende houding laat zien dat bijsturen met gemak en zelfs een beetje spel kan gebeuren.
