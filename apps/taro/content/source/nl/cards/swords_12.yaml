imageryNote: >-
  Het originele beeld toont een ruiter die voorover leunt op een galopperend paard, het zwaard vooruit, de cape klapperend in de wind. Bomen op de heuvel buigen dezelfde kant op, en rafelige wolken jagen erboven voorbij. De voorovergebogen houding en de jagende wolken suggereren vaart en overtuiging, terwijl de gebogen bomen laten zien welke kracht zo'n snelheid uitoefent op alles eromheen.
