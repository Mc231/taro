imageryNote: >-
  In het originele beeld houdt een zittende figuur twee gekruiste zwaarden dicht tegen de borst, met een zachte doek over de ogen. Een bleke maansikkel hangt laag boven kalm, ondiep water vol stenen. De gekruiste zwaarden vormen een behoedzame vorm, als een deur die dicht wordt gehouden. Het stille water en het nachtlicht suggereren emoties die onder de oppervlakte rusten, en de bedekte ogen wijzen op de keuze om nog niet te kijken.
