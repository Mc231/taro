  relationshipsReversed: >-
    Omgekeerd kan de Twee van Zwaarden het einde van een wapenstilstand weerspiegelen. Gevoelens die waren weggestopt, komen misschien boven, of iemand vraagt je eindelijk te zeggen waar je staat. Dat kan ongemakkelijk voelen, en het kan ook ruimte maken voor meer eerlijkheid. Je kunt delen wat je vasthield in kleine, heldere stukjes, niet alles tegelijk.
  workUpright: >-
    Op het werk kan deze kaart een beslissing weerspiegelen die in de wacht staat: twee benaderingen, twee aanvragen voor je tijd, of twee prioriteiten die even dringend lijken. Wachten kan verstandig zijn als je meer feiten nodig hebt. Je kunt opschrijven wat elke optie van je zou vragen en wat ze zou opleveren, en opmerken welk lijstje je ontwijkt. Die tegenzin kan ook nuttige informatie zijn.
  workReversed: >-
    Omgekeerd komt de vastgelopen keuze misschien weer in beweging, soms omdat een deadline of een nieuw detail de vraag afdwingt. Misschien voel je je opgejaagd. Het kan helpen te scheiden wat echt vandaag beslist moet worden van wat nog even kan wachten. Heb je een stuk informatie vermeden, dan kan dit het moment zijn om er recht naar te kijken en je erdoor te laten leiden.
  growthUpright: >-
    Voor persoonlijke groei nodigt de Twee van Zwaarden je uit op te merken hoe je jezelf tegen moeilijke gevoelens beschermt door stil te blijven staan. Stilte kan rustgevend zijn; het kan ook een manier zijn om niet te voelen. Je kunt proberen een paar minuten bij elke optie te blijven en te letten op de reactie van je lichaam, naast je redenering. Beide manieren van weten tellen.
  growthReversed: >-
    Omgekeerd kan deze kaart een keerpunt in eerlijkheid naar jezelf weerspiegelen. Iets wat je op afstand hield, is nu dichterbij. Je kunt het met nieuwsgierigheid benaderen en zonder oordeel, en het in je eigen tempo in je opnemen. Je ogen openen betekent niet dat je meteen moet handelen; het betekent dat je ervoor kiest helder te zien voordat je beslist.
