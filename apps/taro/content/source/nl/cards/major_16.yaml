imageryNote: >-
  De Toren van Taro is voorgesteld als een hoge, smalle stenen toren op een rotsachtige top, waarvan de kroon wordt gelicht door een plotselinge lichtflits uit een stormachtige lucht. Vonken of kleine vlammetjes verspreiden zich als zaadjes in de wind, wat suggereert dat wat vrijkomt nieuwe beginnen kan meedragen. Het tafereel is getekend als een moment van verlichting, helder tegen donkere wolken, met de nadruk op opruimen en inzicht, nooit op schade aan wie dan ook.
