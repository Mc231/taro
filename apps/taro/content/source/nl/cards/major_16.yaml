  relationshipsReversed: >-
    Omgekeerd kan deze kaart wijzen op spanning die zich stilletjes heeft opgebouwd, of op een moeilijke waarheid vermijden om de vrede te bewaren. Je kunt overwegen of iets nu vriendelijk benoemen een grotere breuk later kan voorkomen. De kaart kan ook een band weerspiegelen die na een zware periode op eerlijkere grond opnieuw wordt opgebouwd.
  workUpright: >-
    Op het werk of in een project benadrukt de Toren onverwachte verschuivingen: een verandering in plannen, structuren of prioriteiten die van je vraagt je aan te passen. De kaart kan ook een baanbrekend idee weerspiegelen dat de gewone manier van werken verstoort. Je kunt je richten op wat je kunt beïnvloeden en waarvoor de verandering ruimte maakt.
  workReversed: >-
    Omgekeerd kan de Toren een project of systeem weerspiegelen waarvan iedereen weet dat het kwetsbaar is, maar dat niemand aanpakt. Je kunt jezelf afvragen of een geplande, geleidelijke verandering vriendelijker zou zijn dan afwachten. De kaart kan ook wijzen op opnieuw opbouwen na een verstoring, met de kans iets stevigers te ontwerpen.
  growthUpright: >-
    Voor persoonlijke groei nodigt deze kaart je uit overtuigingen los te laten die geen stand meer houden. Een plotseling inzicht kan desoriënterend voelen, maar markeert vaak echte vooruitgang. Je kunt opschrijven wat je nu anders ziet, en hoe je wilt dat dat nieuwe begrip je keuzes vormt.
  growthReversed: >-
    Omgekeerd kan de Toren vragen of je je verzet tegen een innerlijke verandering die al gaande is. De kaart kan een zacht, geleidelijk afbrokkelen van oude verdedigingsmuren weerspiegelen. Je kunt jezelf toestaan je een tijdje onrustig te voelen, en geduldig zijn terwijl je op stevigere grond opnieuw bouwt.
