imageryNote: >-
  Het beeld kan een figuur tonen die over een werkbank gebogen staat, met gereedschap in de hand, een munt vormend terwijl afgewerkte munten vlakbij in een nette rij hangen, misschien aan een paal of muur. Een weg of stad in de verte kan een wijdere wereld suggereren waar de maker zich even van heeft afgewend om zich te concentreren. De herhaalde munten kunnen oefening en consequentheid symboliseren, en de verdiepte houding de stille voldoening van bekwaam, aandachtig werk.
