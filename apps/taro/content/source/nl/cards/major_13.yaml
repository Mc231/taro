imageryNote: >-
  De Dood van Taro is voorgesteld als een stil herfstlandschap waarin een trage rivier gevallen bladeren meevoert naar een opkomende zon aan de horizon. Een figuur in een mantel loopt zonder haast langs het water en draagt één zaaddoos of een kale tak, symbolen van wat eindigt en wat wacht om te groeien. Een witte bloem tegen een donkere achtergrond kan vernieuwing binnen het loslaten suggereren. De sfeer is kalm en respectvol en wijst op transformatie, niet op verlies.
