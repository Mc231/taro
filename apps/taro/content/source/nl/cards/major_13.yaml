shortUpright: >-
  Een fase sluit zich misschien. Deze kaart nodigt je uit op te merken wat er eindigt en welke ruimte het achterlaat.
shortReversed: >-
  Iets is misschien klaar om te eindigen, terwijl een deel van jou vasthoudt. Wat zou je helpen je greep te verslappen?
meaningUpright: |-
  Ondanks de naam gaat deze kaart niet over de fysieke dood. Ze spreekt over afsluitingen in de gewone, menselijke zin: het einde van een fase, een rol, een gewoonte of een manier om naar jezelf te kijken. Zoals de herfst de takken leegmaakt voor nieuwe groei, suggereert ze dat sommige dingen moeten eindigen zodat andere kunnen beginnen.
  In het dagelijks leven kan deze kaart weerspiegelen dat je uit een huis vertrekt, een opleiding afrondt, afstand neemt van een project of merkt dat een oude versie van jezelf niet meer past. Dat kan gemengde gevoelens oproepen: opluchting, verdriet, onzekerheid, zelfs opwinding. Ze zijn allemaal natuurlijk. Transformatie verloopt zelden netjes, en het kost vaak tijd om te begrijpen wat een verandering mogelijk heeft gemaakt.
  Deze kaart nodigt je uit om te overwegen wat klaar is om losgelaten te worden. Je kunt jezelf afvragen wat je nog uit gewoonte meedraagt, en welke ruimte er zou kunnen ontstaan als je het neerlegt. De Dood laat zien dat afsluitingen, ook welkome, erkenning verdienen. Eren wat is geweest kan het makkelijker maken om je te richten op wat er hierna kan komen.
meaningReversed: |-
  Omgekeerd kan de Dood een afsluiting weerspiegelen die haar tijd neemt. Misschien voel je dat een fase voorbij is terwijl je er nog aan vasthoudt, misschien omdat het vertrouwde veiliger voelt dan het onbekende, of omdat loslaten voelt als een deel van jezelf verliezen.
  Deze kaart kan ook wijzen op een overgang die langzaam en stil verloopt, onder de oppervlakte, zonder één duidelijk moment. Niet elke verandering komt met een schone breuk.
  Je kunt opmerken waaraan je je vastklampt en wat dat vastklampen beschermt. Kleine afscheidsrituelen, zoals een afscheidsbrief schrijven die je niet verstuurt, een la opruimen of een laatste dag markeren, kunnen helpen. Er is geen haast. Jezelf toestaan te rouwen om wat eindigt, kan het loslaten zachter laten voelen.
aspects:
  relationshipsUpright: >-
    In relaties kan deze kaart een belangrijke verandering weerspiegelen in hoe een band werkt: een nieuwe fase, een verschuiving in rollen, of het einde van een patroon waar geen van beiden nog iets aan had. Ze zegt niets over iemands lichamelijke welzijn. De kaart kan je uitnodigen samen te erkennen wat er verandert, met eerlijkheid en zorg.
  relationshipsReversed: >-
    Omgekeerd kan deze kaart wijzen op vasthouden aan een oude dynamiek die beide mensen zijn ontgroeid, of op moeite om te aanvaarden dat een band is veranderd. Je kunt overwegen wat je nodig zou hebben om de relatie haar nieuwe vorm te laten aannemen, welke vorm dat ook blijkt te zijn.
  workUpright: >-
    Op het werk of in een project benadrukt de Dood voltooiing en overgang. De kaart kan weerspiegelen dat je een rol afrondt, een project afsluit of afscheid neemt van een werkwijze die haar tijd heeft gehad. Je kunt de balans opmaken van wat je hebt geleerd en wat je wilt meenemen naar het volgende hoofdstuk.
  workReversed: >-
    Omgekeerd kan de Dood weerspiegelen dat je uit gewoonte bij een taak, rol of methode blijft nadat die niet meer past. De kaart kan ook wijzen op angst voor wat erna komt. Je kunt opschrijven wat de huidige situatie je nog geeft en wat ze kost, en opmerken wat die balans je vertelt.
  growthUpright: >-
    Oude identiteiten kunnen vallen als bladeren en ruimte maken voor wat zich nog aan het vormen is. Je kunt overtuigingen over jezelf opmerken die ooit klopten, maar nu niet meer. Ze loslaten kan ruimte scheppen voor een versie van jou die eerlijker past bij wie je aan het worden bent.
  growthReversed: >-
    Omgekeerd kan de Dood vragen of angst voor verandering je in een kleinere ruimte houdt dan je nodig hebt. De kaart kan een langzame, geduldige transformatie weerspiegelen die je vertrouwen verdient. Je kunt deze week één klein ding kiezen om los te laten en opmerken hoe dat daarna voelt.
