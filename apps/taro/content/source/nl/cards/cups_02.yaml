imageryNote: >-
  Het beeld toont twee figuren, of twee handen, die elk een kelk naar de ander heffen over een kleine afstand. Tussen hen in kan een gedeeld embleem, zoals verstrengelde stelen of twee vissen, suggereren dat de ontmoeting iets schept wat geen van beiden alleen bezit. Gespiegelde kleuren aan weerszijden kunnen gelijkwaardigheid uitdrukken, met een zachte gloed waar de kelken elkaar bijna raken, alsof de verbinding zelf licht geeft.
