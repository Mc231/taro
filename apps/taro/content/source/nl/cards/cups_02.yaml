shortUpright: >-
  Een moment om op te merken waar zorg twee kanten op stroomt, en wat een band gelijkwaardig en levend laat voelen.
shortReversed: >-
  Iets tussen jou en een ander voelt misschien uit balans; bedenk waar ieder van jullie echt om vraagt.
meaningUpright: |-
  De Twee van Kelken toont twee mensen, of twee kanten van een leven, die elkaar als gelijken ontmoeten en elkaar iets aanbieden. Het is een kaart van herkenning: de opluchting van begrepen worden, en het plezier van de ander op jouw beurt te begrijpen. De verbinding die ze beschrijft, kan romantisch zijn, maar net zo goed een vriendschap, een creatieve samenwerking, een band tussen broers en zussen of een werkrelatie.
  Je herkent deze energie misschien in een gesprek waarin beide mensen luisteren, in een verzoening na een misverstand, of in de stille afspraak van twee mensen die ervoor kiezen er voor elkaar te blijven zijn. De kaart kan ook weerspiegelen dat je twee kanten van jezelf samenbrengt die verschillende kanten op trokken.
  Deze kaart nodigt je uit op te merken waar in je leven echt sprake is van geven en nemen, en dat te eren. Wederkerigheid betekent niet de score bijhouden. Het betekent dat beide mensen zich vrij voelen om te geven, te ontvangen en te zeggen wat ze nodig hebben.
meaningReversed: |-
  Omgekeerd kan de Twee van Kelken wijzen op een band die uit balans is geraakt. Eén persoon geeft misschien meer of luistert minder, of twee mensen praten gewoon langs elkaar heen. Dat hoeft niet te betekenen dat er iets kapot is; veel banden gaan door zulke periodes.
  De kaart kan zich ook naar binnen richten en vragen hoe goed je een partner voor jezelf bent. Ben je net zo geduldig en eerlijk met je eigen behoeften als je probeert te zijn met die van een ander?
  Je kunt kijken naar een relatie die ongelijk voelt en je afvragen waar ieder eigenlijk op hoopt, onder het meningsverschil aan de oppervlakte. Een rustig, eerlijk gesprek, of wat afstand om helderder te zien, kan nuttiger zijn dan alles tegelijk willen oplossen. Balans is iets wat mensen samen bouwen, uitwisseling voor uitwisseling.
aspects:
  relationshipsUpright: >-
    In relaties kan deze kaart wederzijdse aantrekking, vriendschap of een partnerschap weerspiegelen waarin beide mensen zich gezien voelen. Ze kan je uitnodigen de kleine rituelen op te merken die een band stabiel houden: even vragen hoe het gaat, onthouden wat belangrijk is voor de ander, eenvoudig sorry zeggen. Je kunt jezelf afvragen wat je het meest waardeert aan iemand die dicht bij je staat, en of die dat weet.
  relationshipsReversed: >-
    Omgekeerd kan deze kaart een band weerspiegelen waarin één persoon meer van het emotionele gewicht draagt, of waarin een misverstand niet is uitgepraat. Je kunt overwegen wat je zou zeggen als je wist dat het vriendelijk zou worden gehoord. Herstel begint vaak met één eerlijke zin en de bereidheid het antwoord te horen zonder je meteen te verdedigen.
  workUpright: >-
    Op het werk kan de Twee van Kelken wijzen op een veelbelovende samenwerking, een collega die je vertrouwt of een relatie met een klant die op respect is gebouwd. De kaart kan je uitnodigen de eer te delen, om inbreng te vragen en afspraken zo helder te maken dat beide kanten zich zeker voelen. Goede samenwerkingen groeien vaak meer uit gedeelde waarden dan uit gedeelde vaardigheden.
  workReversed: >-
    Omgekeerd kan de kaart een werkrelatie weerspiegelen waarin verwachtingen onuitgesproken of ongelijk zijn. Misschien gaat één persoon uit van overeenstemming waar die er niet is. Je kunt in gewone woorden benoemen wat ieder verwacht, en nagaan of jullie rollen nog passen. Helderheid kan een vriendelijkheid zijn, ook als het gesprek in het begin ongemakkelijk voelt.
  growthUpright: >-
    Innerlijk partnerschap is hier het groeithema, een kans om delen van jezelf met elkaar te verzoenen: wat je wilt en wat je belangrijk vindt, of je praktische en je tedere kant. Je kunt een korte dialoog schrijven tussen twee stemmen in jou en kijken waar ze het al eens zijn. Integratie kan voelen als een partner vinden vanbinnen.
  growthReversed: >-
    Omgekeerd kan deze kaart vragen of je op anderen leunt voor een gevoel van balans dat je ook vanbinnen zou kunnen opbouwen. Je kunt opmerken waar je goedkeuring zoekt voordat je op je eigen blik vertrouwt. Jezelf behandelen met dezelfde eerlijkheid die je een goede vriend biedt, kan je stevigheid geven, keuze voor keuze.
reflectionQuestions:
