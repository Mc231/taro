shortUpright: >-
  Een heldere, visionaire energie nodigt je uit met een doel te leiden en grote ideeën om te zetten in een richting die anderen kunnen volgen.
shortReversed: >-
  Sterke drive slaat misschien door naar ongeduld of controle; je kunt nagaan of je visie nog ruimte laat voor anderen.
meaningUpright: |-
  De Koning van Staven brengt het vuur van de kleur tot rijpheid. Gezeten op een troon maar licht voorovergebogen, met de staf in de hand, lijkt deze figuur klaar om te handelen. De energie is visionair en besluitvaardig: iemand die ziet waar dingen naartoe kunnen gaan en het zelfvertrouwen en de ervaring heeft om de richting te bepalen.
  Deze kwaliteit kan zich laten zien als je de leiding neemt over een project, een groep door een verandering begeleidt, of een gedurfde beslissing neemt die in heldere waarden is geworteld. Ze kan ook een mentor of leider beschrijven wiens gevoel voor richting anderen moed geeft.
  Deze kaart nodigt je uit in je eigen gezag te stappen. Leiderschap gaat hier minder over controle en meer over visie, integriteit en doorzetten. Je kunt jezelf afvragen welk groter doel je huidige inspanningen dienen en hoe je dat helder kunt delen met de betrokkenen. Als een richting eerlijk is en goed wordt overgebracht, willen anderen vaak meedoen, en niet alleen opdrachten volgen.
meaningReversed: |-
  Omgekeerd kan de Koning van Staven drive weerspiegelen die uit balans is geraakt. Misschien voel je ongeduld met het tempo van anderen, druk je plannen door zonder te luisteren, of stel je doelen zo hoog dat er geen ruimte meer is voor rust. Aan de andere kant kan de kaart wijzen op een leider, misschien jij, die de visie uit het oog is verloren en niet goed weet waar het hierna heen moet.
  Deze kaart nodigt je misschien uit te kijken naar hoe je je invloed gebruikt. Inspireert je energie mensen, of overweldigt ze hen? Leeft de visie nog voor jou?
  Je kunt even stilstaan om weer contact te maken met je doel, om eerlijke feedback vragen of beslissingen breder delen. Sterk leiderschap groeit vaak net zo goed uit luisteren als uit sturen.
aspects:
  relationshipsUpright: >-
    In relaties kan deze kaart een zelfverzekerde, beschermende en bemoedigende aanwezigheid weerspiegelen. Je kunt visie inbrengen in gedeelde plannen en de mensen dicht bij je helpen in hun eigen doelen te geloven. De uitnodiging is om met gulheid te leiden: richting bieden als die welkom is en steun als iemand anders wil sturen.
  relationshipsReversed: >-
    Omgekeerd neemt één persoon misschien te veel de beslissingen over, of zorgt ongeduld voor spanning. Je kunt opmerken of je volledig luistert naar iemand die dicht bij je staat of al je antwoord aan het plannen bent. De ideeën van de ander uitnodigen kan een eenzijdig plan veranderen in een gedeeld plan.
  workUpright: >-
    Op het werk of in een project kan de Koning van Staven wijzen op leiderschap, strategische visie en de moed om initiatief te nemen. Je kunt een helder doel bepalen, het met enthousiasme overbrengen en delegeren op een manier die vertrouwt op de sterke kanten van anderen. Integriteit en consequentheid helpen mensen zich veilig te voelen bij het volgen van een ambitieuze richting.
  workReversed: >-
    Omgekeerd duw je misschien te hard, verwacht je dat anderen jouw tempo bijhouden, of weet je zelf niet goed welke richting je op wilt. Je kunt een stap terug doen om de visie samen met de betrokkenen te herzien. Om inbreng vragen en doelen bijstellen kan een plan zowel realistischer als breder gedragen maken.
  growthUpright: >-
    Voor persoonlijke groei nodigt deze kaart je uit eigenaarschap te nemen over je richting. Wat wil je op langere termijn opbouwen, en welke waarden geven daar richting aan? Je kunt een korte beschrijving van je doel opschrijven en die gebruiken als ijkpunt voor de keuzes die komen.
  growthReversed: >-
    Omgekeerd kun je verkennen hoe je je verhoudt tot controle en geduld. Heb je het gevoel dat je altijd de leiding moet hebben, of vermijd je leiderschap omdat het te veel voelt? Een middenweg vinden, waarin je je eigen leven met zelfvertrouwen en flexibiliteit leidt, kan een stabiele vorm van kracht zijn.
reflectionQuestions:
  - >-
    Aan welke visie werk je, en hoe helder zou je die aan iemand anders kunnen beschrijven?
  - >-
    Hoe zou je kunnen leiden op een manier die anderen uitnodigt hun sterke kanten in te brengen?
  - >-
    Waar zou wat meer geduld je drive doeltreffender kunnen maken?
imageryNote: >-
  Een figuur zit op een hoge zetel aan de rand van een uitkijkpunt, licht voorovergebogen, met een bloeiende staf stevig naast zich in de grond, alsof die op het punt staat op te staan. Daarachter slingert een weg naar verre heuvels in het late zonlicht. De bloeiende staf suggereert een visie die leeft en groeit, het uitkijkpunt een wijd zicht op wat er gebouwd zou kunnen worden, en de voorovergebogen houding de bereidheid om ideeën in daden om te zetten. Gloeiende sintels of kleine vlammotieven kunnen het element vuur dragen.
