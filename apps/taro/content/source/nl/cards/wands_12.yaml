imageryNote: >-
  Een ruiter in volle galop leunt voorover op een steigerend of springend paard, de staf hoog geheven, de mantel wapperend erachter. Woestijnheuvels of open vlakten strekken zich voor de ruiter uit, en kleine vlamvormen of salamanders kunnen de kleding versieren. Het springende paard staat voor passie en drive, de geheven staf voor een doel dat in daden wordt omgezet, en het wijde landschap voor een avontuur dat zich nog ontvouwt. De voorovergebogen houding wijst op zowel moed als haast.
