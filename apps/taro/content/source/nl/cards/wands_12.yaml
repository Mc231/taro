    Omgekeerd neem je misschien overhaaste beslissingen, of voel je je geblokkeerd en ongeduldig. Je kunt nagaan of snelheid echt nodig is of dat een korte pauze om te plannen je beter zou dienen. Frustratie omzetten in een helder lijstje volgende acties kan je energie vooruit helpen, zodat ze niet in kringetjes draait.
  growthUpright: >-
    Moed en honger naar ervaring zijn gaven die deze kaart je vraagt te gebruiken. Wat zou je doen als je op je eigen enthousiasme vertrouwde? Je kunt iets proberen wat je uitdaagt, en opmerken hoe het voelt om vanuit passie te handelen en niet alleen vanuit voorzichtigheid.
