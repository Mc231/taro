  - >-
    Waar kun je deze week één ongestoord uur voor jezelf beschermen?
imageryNote: >-
  De Kluizenaar van Taro is voorgesteld als een figuur in een mantel op een hoge, besneeuwde bergkam bij het vallen van de avond, met een eenvoudige lantaarn die alleen de volgende paar stappen van het pad verlicht. Een wandelstok die door gebruik glad is gesleten, suggereert steun uit ervaring. Voetsporen in de sneeuw laten zien hoe ver de figuur al is gekomen. Koele blauw- en grijstinten spreken van alleen zijn en heldere lucht, terwijl de warme gloed van de lantaarn laat zien dat inzicht meegedragen kan worden, zelfs door het donkerste stuk van de weg.
