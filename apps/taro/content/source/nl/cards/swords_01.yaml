imageryNote: >-
  Het originele beeld draait om één rechtopstaand zwaard dat oprijst door wijkende wolken, met een snede die het eerste licht vangt. Bij de punt hangt een dunne kroonring, die suggereert dat een helder idee een leidend principe kan worden. Open lucht en bewegende wind omringen het, het element van denken en adem. De sfeer is fris en wakker, als koude ochtendlucht, en wijst op het moment waarop een versnipperde geest één heldere lijn vindt om te volgen.
