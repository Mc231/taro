  workUpright: >-
    Op het werk of in een project kan de Aas van Zwaarden een doorbraak in begrip markeren: een probleemstelling die eindelijk klopt, een strak plan, of een nieuw idee dat het testen waard is. Dit kan een goed moment zijn om het idee op te schrijven zolang het vers is en het te delen met iemand die kan helpen het aan te scherpen. Helderheid over het doel maakt de volgende stappen vaak beter zichtbaar.
  workReversed: >-
    Omgekeerd kan deze kaart een project suggereren dat mistig voelt: vage doelen, tegenstrijdige boodschappen of te veel ideeën die tegelijk concurreren. Harder duwen helpt misschien minder dan een stap terug doen. Je kunt proberen de ene vraag te benoemen die nu het meest telt, of betrokkenen om duidelijkheid vragen zonder te gissen. Soms is de helderste zet toegeven wat nog onbekend is.
  growthUpright: >-
    Voor persoonlijke groei nodigt de Aas van Zwaarden je uit de verhalen op te merken die je jezelf vertelt en ze te toetsen aan wat je echt weet. Een fris perspectief kan een oude aanname losmaken. Je kunt schrijven verkennen als manier om gedachten in gewone woorden te vangen, zodat je ernaar kunt kijken en niet erdoorheen. Nieuwsgierigheid naar je eigen geest kan een stille vorm van moed zijn.
  growthReversed: >-
    Omgekeerd kan deze kaart een hoofd weerspiegelen dat druk bezig is maar niet vooruitkomt, rondjes draaiend langs dezelfde zorgen of plannen. Je kunt opmerken wanneer denken is omgeslagen in piekeren. Rust, beweging of een andere omgeving kan je gedachten ruimte geven om te bezinken. Het is prima een vraag nog wat langer open te laten terwijl helderheid in haar eigen tempo groeit.
