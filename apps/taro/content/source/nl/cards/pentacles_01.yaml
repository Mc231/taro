imageryNote: >-
  Het beeld kan draaien om één munt of schijf die door een open hand wordt aangeboden, tegen een achtergrond van bewerkt land: een tuinhek, lage hagen, een pad dat naar heuvels leidt. De munt staat voor iets tastbaars en mogelijks, terwijl het hek een drempel suggereert naar een ruimte die nog verzorgd moet worden. Gedempte groentinten en warme aardetinten kunnen geduld, groei en de stille waarde van wat je kunt vasthouden onderstrepen.
