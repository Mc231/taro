imageryNote: >-
  Het beeld toont een gekroonde figuur die boven bewegend water zit op een platform van verweerde steen, met een kelk in de ene hand en een korte staf in de andere. Het water rondom stijgt en daalt, maar de schouders van de figuur blijven ontspannen en de blik blijft rustig. Dat contrast suggereert emotionele meesterschap, terwijl diepe blauwtinten, verwarmd door accenten van goud, wijzen op wijsheid en gulheid.
