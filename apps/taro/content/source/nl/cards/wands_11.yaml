imageryNote: >-
  Een jeugdige figuur staat in een open landschap, houdt een staf rechtop en kijkt met open fascinatie naar een verse scheut die uit het hout groeit. De kleding kan kleine vlammen of salamanders als motief dragen, als hint naar het element vuur. De uitlopende staf staat voor een idee dat leeft en groeit, de verwonderde blik voor nieuwsgierigheid, en het open land voor de vele richtingen die nog wachten om verkend te worden.
