  relationshipsReversed: >-
    Omgekeerd komt opwinding in een relatie misschien in vlagen en ebt ze snel weg, of voel je je verlegen om enthousiasme te tonen. Je kunt opmerken of je meer op zoek bent naar iets nieuws dan naar diepgang. Je oprechte interesse laten zien, ook op kleine manieren, kan de ander uitnodigen met dezelfde openheid te reageren.
  workUpright: >-
    Op het werk of in een studie kan de Schildknaap van Staven wijzen op een leerfase: een nieuwe vaardigheid, een nieuwe rol of een idee dat je graag wilt testen. Enthousiasme is hier een troef. Je kunt vrijuit vragen stellen, je aanmelden voor iets onbekends, en vroege fouten zien als deel van het proces, niet als oordeel over je kunnen.
  workReversed: >-
    Omgekeerd heb je misschien veel ideeën en weinig opvolging, of weet je niet goed waar je je energie op moet richten. Je kunt één project kiezen en het een stap verder brengen dan je gewend bent. Praten met een mentor of collega kan ook helpen een versnipperde vonk om te zetten in een duidelijkere richting.
  growthUpright: >-
    De Schildknaap van Staven geeft je een eenvoudige opdracht: maak weer contact met je nieuwsgierigheid. Wat ontdekte je graag toen er geen druk was om iets te bereiken? Je kunt deze week tijd vrijmaken voor een speels experiment, en alles wat je ontdekt behandelen als nuttige informatie over wat je energie geeft.
  growthReversed: >-
