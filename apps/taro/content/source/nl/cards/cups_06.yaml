imageryNote: >-
  Het beeld toont twee kleine figuren op een beschutte binnenplaats of in een tuin, waarbij de een de ander een kelk vol bloemen aanbiedt. Andere kelken in de buurt, elk met bloesems, suggereren herinneringen die zijn geplant en nog groeien. Een oude muur of een deuropening op de achtergrond kan staan voor thuis en de bescherming van vertrouwde plekken. Warme, zachte kleuren brengen onschuld, gulheid en het vanzelfsprekende vertrouwen van vroeger over.
