meaningUpright: |-
  De Zes van Kelken is een kaart van herinnering en zachte goedheid. Ze toont vaak een figuur die een kelk vol bloemen aan een ander aanbiedt, een gebaar dat eenvoudig, gul en zonder berekening is. De kaart kan doen denken aan de kindertijd, oude vrienden, vertrouwde plekken of een tijd waarin dingen makkelijker voelden.
  In het dagelijks leven kan deze kaart weerspiegelen dat je weer contact maakt met iemand uit je verleden, terugkeert naar een hobby waar je ooit van hield, of troost vindt in een liedje, een recept of een geur die je terugvoert. Ze kan ook wijzen op kleine daden van vriendelijkheid die worden gegeven en ontvangen zonder verwachting.
  De uitnodiging is het verleden te laten geven wat het kan: warmte, perspectief, een herinnering aan wie je altijd bent geweest. Nostalgie kan een bron zijn als ze je helpt te onthouden wat er voor jou toe doet. Je kunt jezelf afvragen welke eigenschap uit een eerdere tijd je naar het heden zou willen meenemen, zoals speelsheid, nieuwsgierigheid of gemak.
meaningReversed: |-
  Omgekeerd kan de Zes van Kelken suggereren dat herinnering een plek is geworden om je te verstoppen in plaats van een plek om te bezoeken. Misschien vergelijk je het heden ongunstig met een geïdealiseerde versie van het verleden, of houd je vast aan oude patronen en rollen die niet meer passen.
  De kaart kan ook de andere kant op wijzen: de bereidheid om voorbij iets uit je geschiedenis te groeien en een oud verhaal achter te laten, zodat een nieuw kan beginnen.
  Deze kaart nodigt je uit met vriendelijkheid en eerlijkheid tegelijk naar het verleden te kijken. Wat is er echt gebeurd, en wat heb je eraan toegevoegd in het herinneren? Je kunt de delen houden die je voeden en je greep losser maken op de delen die je klein houden. Volwassen worden betekent niet dat je tederheid verliest; het kan betekenen dat je haar meeneemt in keuzes die bij vandaag horen.
aspects:
  relationshipsUpright: >-
    In relaties kan de Zes van Kelken een weerzien weerspiegelen, een gedeelde herinnering of een vriendschap met diepe wortels. De kaart kan uitnodigen tot speelsheid en eenvoudige gebaren, zoals een briefje, een gedeeld tussendoortje of een oude foto die je met een glimlach stuurt. Je kunt opmerken hoe een gedeelde geschiedenis vertrouwen schept, en hoe jullie samen nieuwe herinneringen kunnen toevoegen.
  relationshipsReversed: >-
    Omgekeerd kan deze kaart wijzen op een band die vooral door het verleden bij elkaar wordt gehouden, of op iemand vergelijken met wie die vroeger was. Je kunt overwegen of je je verhoudt tot de persoon die nu voor je staat, of tot een ouder beeld van die persoon. Elkaar laten veranderen kan een band levend en eerlijk houden.
  workUpright: >-
    Op het werk kan deze kaart weerspiegelen dat je terugkeert naar iets waar je in het begin van genoot, iemand begeleidt die nieuwer is, of oude vaardigheden op een frisse manier inzet. De kaart kan je uitnodigen eenvoudige goede wil mee te brengen naar je werkplek. Kleine beleefdheden, zoals hulp aanbieden voordat erom wordt gevraagd, vormen een cultuur vaak meer dan grote uitspraken.
  workReversed: >-
    Omgekeerd kan de kaart weerspiegelen dat je vasthoudt aan hoe dingen vroeger gingen, of je verzet tegen een verandering omdat de oude manier veiliger voelt. Je kunt jezelf afvragen welke tradities het werk nog dienen en welke uit gewoonte worden bewaard. Het verleden respecteren en ruimte maken voor nieuwe benaderingen kan een overgang voor iedereen makkelijker maken.
  growthUpright: >-
    Voor persoonlijke groei nodigt de Zes van Kelken je uit weer contact te maken met de nieuwsgierigheid en het plezier van je jongere zelf. Je kunt een activiteit oppakken waar je als kind van hield, met geen ander doel dan genieten. Je herinneren wat je ooit een licht en onbezorgd gevoel gaf, kan richting geven aan hoe je nu je tijd besteedt.
  growthReversed: >-
    Omgekeerd kan deze kaart je vragen een oud verhaal over jezelf bij te werken. Misschien bepaalt een etiket uit je kindertijd nog steeds hoe je je eigen kunnen ziet. Je kunt één overtuiging uit het verleden opschrijven en je afvragen of die nog klopt. Haar loslaten kan ruimte maken voor wie je aan het worden bent.
