imageryNote: >-
  De Ster van Taro is voorgesteld als een nachtelijk tafereel in een daktuin, waar een figuur jonge planten water geeft uit een kan, terwijl een heldere ster door een opening in de wolken schijnt. Regentonnen en een kleine vijver vangen op wat de lucht teruggeeft. Motten die rond een lantaarn cirkelen, kunnen staan voor gedachten die naar het licht worden getrokken. Koele blauw- en zilvertinten wekken een gevoel van rust, openheid en zachte vernieuwing nadat een storm is overgetrokken.
