shortUpright: >-
  Na een zware periode keert er misschien een stillere hoop terug. Deze kaart nodigt je uit die binnen te laten.
shortReversed: >-
  Hoop voelt nu misschien ver weg. Kleine, vaste dingen kunnen je helpen de weg ernaar terug te vinden.
meaningUpright: |-
  De Ster is een kaart van hoop en vernieuwing. In de reeks volgt ze vaak op de omwenteling van de Toren, en haar sfeer is de rust na de storm: een heldere nachtlucht, koel water, een moment waarop je eindelijk kunt uitademen. Hoop is hier geen luid optimisme. Het is een stil vertrouwen dat dingen beter kunnen worden en dat je iets waardevols te bieden hebt.
  In het dagelijks leven kan deze kaart weerspiegelen dat je je lichter voelt na een moeilijke periode, weer contact maakt met een creatieve droom, of kleine tekenen van vooruitgang opmerkt die je eraan herinneren waarom je begon. Ze kan wijzen op momenten van openheid, waarop je je ideeën of gevoelens kunt delen zonder pantser, en op de eenvoudige, herstellende kracht van rust, natuur en tijd.
  Deze kaart nodigt je uit om te overwegen wat je nu hoop geeft, hoe klein ook. Je kunt jezelf afvragen wat je in je leven zou willen vernieuwen, en wat je helpt je verfrist te voelen. De Ster benadrukt gulheid, naar anderen en naar jezelf. Ze suggereert je energie te steken in wat je voedt, en de rest te laten bezinken.
meaningReversed: |-
  Omgekeerd kan de Ster een tijd weerspiegelen waarin hoop zwakker voelt. Misschien ben je moe, ontmoedigd, of twijfel je of je inspanningen ertoe doen. Het licht is niet uit, maar het kan moeilijker te zien zijn door de wolken heen.
  Deze kaart kan ook wijzen op het contact verliezen met wat je normaal inspireert, misschien omdat je zoveel hebt gegeven dat er weinig over is voor je eigen dromen.
  Je kunt zoeken naar kleine bronnen van vernieuwing: een wandeling onder een open lucht, een gesprek met iemand die in je gelooft, een terugkeer naar een eenvoudig genoegen. Hoop komt vaak in kleine stapjes terug, niet in één keer. Als de zwaarte blijft, kan contact zoeken met iemand die je vertrouwt of met een gekwalificeerde professional een zorgzame stap zijn.
aspects:
  relationshipsUpright: >-
    In relaties kan de Ster openheid, oprechtheid en een gevoel van hernieuwd vertrouwen weerspiegelen. De kaart kan je uitnodigen je hoop te delen met iemand die dicht bij je staat, of iemand aan te moedigen die dat nodig heeft. Een band die door een moeilijke tijd is gegaan, kan nu rustiger en hoopvoller voelen.
  relationshipsReversed: >-
    Omgekeerd kan deze kaart wijzen op je ongezien of ontmoedigd voelen in een relatie, of op je ware gevoelens achterhouden uit angst dat ze niet welkom zijn. Je kunt overwegen wat je zou helpen je veiliger te voelen om open te zijn, en of een klein, eerlijk gebaar wat vertrouwen zou kunnen herstellen.
  workUpright: >-
    Op het werk of in een project benadrukt de Ster inspiratie en een gevoel van zingeving. De kaart kan weerspiegelen dat je weer contact maakt met waarom je doet wat je doet, of na een tegenslag nieuwe energie vindt. Je kunt tijd geven aan een doel op lange termijn of een creatief idee dat je hoopvol stemt.
  workReversed: >-
    Omgekeerd kan de Ster weerspiegelen dat je motivatie kwijtraakt of het gevoel hebt dat je werk geen betekenis heeft. Je kunt jezelf afvragen wat je oorspronkelijk naar dit pad trok, en of een deel van die vonk er nog is. Kleine successen en collega's die je steunen kunnen helpen het gevoel van zingeving terug te brengen.
  growthUpright: >-
    Vernieuwing en zachte zelfzorg vormen de kern van wat de Ster over groei zegt. Je kunt opmerken wat je weer op krachten brengt en daar wat meer ruimte voor maken. Een intentie voor de komende maanden, geworteld in wat je echt hoopt en niet in wat je denkt te moeten willen, kan je houvast geven.
  growthReversed: >-
    Omgekeerd kan de Ster vragen of je op een lege tank hebt gedraaid. De kaart kan een behoefte weerspiegelen om jezelf aan te vullen voordat je meer kunt geven. Je kunt beginnen met één kleine dagelijkse gewoonte die je rust geeft, en die stilletjes laten groeien. Jezelf aanvullen is deel van geven, geen pauze ervan.
