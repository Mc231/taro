shortUpright: >-
  Er draait iets. Deze kaart nodigt je uit de cyclus op te merken waarin je zit en hoe je erin mee wilt bewegen.
shortReversed: >-
  Een vertrouwd patroon komt misschien weer langs. Wat zou je deze keer anders kunnen doen?
meaningUpright: |-
  Het Rad van Fortuin is de kaart van cycli. Seizoenen wisselen, stemmingen rijzen en dalen, drukke periodes maken plaats voor rustige. Niets blijft voor altijd bovenaan of onderaan. Deze kaart herinnert je eraan dat verandering een gewoon deel van het leven is, en dat een deel ervan buiten ieders controle ligt, terwijl een ander deel reageert op hoe je ermee omgaat.
  In het dagelijks leven kan deze kaart een keerpunt weerspiegelen: een hoofdstuk dat sluit en een ander dat opengaat, een gelukkige meevaller die je plannen verschuift, of een onverwachte tegenslag die je tempo verandert. Ze kan ook wijzen op het herkennen van een patroon dat al eerder opdook, zoals hetzelfde soort situatie in een nieuwe vorm, en het met frisse ogen bekijken.
  Deze kaart nodigt je uit om te overwegen waar je nu op je eigen rad staat. Je kunt jezelf afvragen wat deze fase van je vraagt, en wat ze je zou kunnen leren. Het Rad beslist niet over je leven. De kaart laat zien dat flexibiliteit, perspectief en gevoel voor humor je kunnen helpen de wendingen mee te maken, en dat een moeilijk seizoen een seizoen is, geen blijvende toestand.
meaningReversed: |-
  Omgekeerd kan het Rad van Fortuin het gevoel weerspiegelen dat je in een kringetje vastzit, of dat je je verzet tegen een verandering die al gaande is. Misschien heb je het gevoel dat dingen je overkomen, of merk je dat hetzelfde frustrerende patroon steeds terugkomt in een ander jasje.
  Deze kaart kan ook wijzen op stevig vasthouden aan een goede fase, uit angst dat die niet kan blijven. Vastklampen maakt het natuurlijke draaien zwaarder.
  Je kunt kijken naar wat binnen je bereik ligt. Patronen herhalen zich vaak tot er iets verschuift in hoe we reageren, al is het maar een beetje. Het kan helpen de cyclus die je ziet te benoemen, je eigen aandeel erin op te merken zonder schuld, en één klein ding te kiezen om anders te doen. Je kunt het rad niet stoppen, maar je kunt er wel steviger op komen te staan.
aspects:
  relationshipsUpright: >-
    In relaties kan het Rad een nieuwe fase weerspiegelen: dichter naar elkaar toe groeien, naar een volgend stadium gaan of je gewoon aanpassen aan veranderende omstandigheden. De kaart kan je uitnodigen flexibel te blijven en open te praten over hoe dingen verschuiven. Relaties hebben, net als seizoenen, ritmes, en die benoemen kan helpen er samen doorheen te gaan.
  relationshipsReversed: >-
    Omgekeerd kan deze kaart wijzen op vertrouwde conflicten die steeds terugkomen, of op verzet tegen een relatie die van vorm verandert. Je kunt overwegen welk patroon jij en iemand die dicht bij je staat vaak herhalen, en wat ieder van jullie anders zou kunnen proberen. Verandering hoeft geen verlies te betekenen; het kan groei betekenen.
  workUpright: >-
    Op het werk of in een project benadrukt het Rad veranderende omstandigheden en nieuwe openingen. De kaart kan een wijziging in plannen weerspiegelen, een nieuw team of een project dat ineens vooruitgaat. Je kunt alert blijven op kansen en tegelijk onthouden dat elke fase, druk of rustig, iets te bieden heeft.
  workReversed: >-
    Omgekeerd kan het Rad frustratie over vertraging weerspiegelen, of het gevoel dat inspanning niets oplevert. De kaart kan ook wijzen op steeds dezelfde aanpak herhalen en een ander resultaat verwachten. Je kunt nagaan wat eerder werkte, wat niet, en waar een kleine verandering in werkwijze het patroon zou kunnen verschuiven.
  growthUpright: >-
    Je leven zien als een reeks cycli, en niet als één rechte lijn, kan bevrijdend zijn. Je eigen ritmes opmerken, zoals wanneer je vol energie zit of wanneer je rust nodig hebt, kan je helpen ermee te plannen en niet ertegenin. Je kunt het afgelopen jaar in kaart brengen en de keerpunten opmerken.
  growthReversed: >-
    Omgekeerd kan het Rad vragen of je probeert te beheersen wat niet te beheersen is. De kaart kan een wens naar zekerheid weerspiegelen in een tijd van verandering. Je kunt oefenen met het loslaten van één ding waar je geen invloed op hebt, en die energie steken in één ding waar je dat wel hebt.
