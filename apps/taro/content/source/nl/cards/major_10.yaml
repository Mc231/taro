imageryNote: >-
  Het Rad van Fortuin van Taro is voorgesteld als een groot draaiend wiel in een lucht die aan de ene rand overgaat van dageraad naar nacht aan de andere, zodat elke fase tegelijk zichtbaar is. Kleine figuren en wezens rijden mee op de rand, sommige stijgend en andere dalend, geen enkele stilstaand. Symbolen van de vier seizoenen in de hoeken kunnen het idee van natuurlijke cycli omlijsten. In de naaf suggereert een rustig, onbeweeglijk middelpunt het vaste perspectief dat je kunt vinden, zelfs terwijl alles draait.
