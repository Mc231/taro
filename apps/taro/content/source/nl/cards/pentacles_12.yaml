imageryNote: >-
  Het beeld kan een ruiter tonen die rustig op een stevig, stilstaand paard zit, één munt vasthoudt en uitkijkt over geploegde akkers. Het stilstaande paard kan geduld en uithoudingsvermogen symboliseren, het omgeploegde land methodisch werk dat al is gedaan, en de rustige blik gestage aandacht voor wat er voor ligt. Donkere, stevige tinten en zware vormen kunnen betrouwbaarheid onderstrepen, met een hint van hoe stilstand soms traagheid kan worden.
