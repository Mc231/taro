  growthReversed: >-
    Omgekeerd kan deze kaart een groeiende eerlijkheid tegenover jezelf weerspiegelen. Misschien betrap je een handig verhaal dat je jezelf hebt verteld en bevraag je het zachtjes. Eerlijk zijn tegenover jezelf vraagt geen hardheid; het betekent gewoon dat je jezelf helder laat zien. Wat zou je anders doen als je ophield deze situatie weg te verklaren?
