imageryNote: >-
  Het originele beeld toont een figuur die op de tenen een door de maan verlicht veld oversteekt, met een armvol zwaarden, terwijl er een paar achterblijven in het gras. Verderop gloeien tenten zachtjes, nietsvermoedend. Een spoor van voetafdrukken laat de gekozen weg zien. De armvol suggereert meer op je nemen dan werd aangeboden, de achtergebleven zwaarden wijzen op wat niet gedragen kan worden, en de blik achterom wijst op het onbehagen van ongezien handelen.
