shortUpright: >-
  Een zwaar hoofdstuk loopt misschien ten einde; het benoemen kan ruimte maken voor rust en een langzame wending.
shortReversed: >-
  Het dieptepunt ligt misschien achter je; je kunt de eerste tekenen opmerken van stabiliteit die terugkeert.
meaningUpright: |-
  De Tien van Zwaarden markeert het einde van een moeilijk hoofdstuk. Alles wat in een bepaalde situatie mis kon gaan, lijkt mis te zijn gegaan, en er zit een vermoeide stilte in dat toegeven. Toch wordt de lucht aan de horizon al lichter. Deze kaart gaat net zo goed over voltooiing als over pijn.
  Je herkent haar misschien in het moment waarop je ophoudt te vechten tegen een situatie die duidelijk haar tijd heeft gehad: een project dat niet te redden was, een patroon dat je eindelijk ziet voor wat het is, of een periode van spanning die je uitgeput heeft achtergelaten. Vaak zit er een vreemde opluchting in het bereiken van de bodem, omdat je je niet langer hoeft schrap te zetten voor verdere vallen.
  Deze kaart nodigt je uit het einde een einde te laten zijn. Je hoeft het niet te dramatiseren of er snel overheen te stappen. Je kunt jezelf afvragen wat dit hoofdstuk je heeft geleerd en wat je klaar bent niet meer mee te dragen. Rust past hier. Opnieuw beginnen hoeft niet vandaag, maar misschien merk je dat het eerste licht er al is, wachtend tot je opkijkt.
meaningReversed: |-
  Omgekeerd kan de Tien van Zwaarden langzaam herstel na een zware tijd weerspiegelen. Het ergste is misschien voorbij, en je merkt kleine tekenen van stabiliteit die terugkeert: beter slapen, een moment van humor, zin om weer plannen te maken. Opstaan gaat vaak geleidelijk, met goede dagen en moeilijkere.
  Een andere lezing is verzet tegen een einde dat al heeft plaatsgevonden: proberen iets nieuw leven in te blazen wat rust nodig heeft, of een pijnlijk hoofdstuk opnieuw afspelen zonder het af te sluiten.
  Deze kaart nodigt je uit te verzamelen wat je hebt geleerd en de rest los te laten. Je kunt mild zijn voor jezelf over het tempo van herstel. Steun van anderen, eenvoudige routines en geduld kunnen je helpen weer op te bouwen. Welk deel van je leven voelt klaar om opnieuw te beginnen, hoe stil ook?
aspects:
  relationshipsUpright: >-
    In relaties kan deze kaart het einde weerspiegelen van een patroon, een fase of een hoop die niet vol te houden was. Dat kan zwaar en definitief voelen. Je kunt jezelf toestaan te rouwen om wat niet werkte en ook opluchting op te merken. Afsluitingen kunnen ruimte maken voor eerlijkere banden, met jezelf en met anderen, wanneer je er klaar voor bent.
  relationshipsReversed: >-
    Omgekeerd kan de Tien van Zwaarden wijzen op herstel na een pijnlijke tijd tussen mensen, of op moeite om te aanvaarden dat er iets is veranderd. Je kunt opmerken of je vasthoudt aan wat niet kan terugkeren. Leunen op vrienden die bij je zijn gebleven, kan je helpen vertrouwen en warmte in je eigen tempo weer op te bouwen.
  workUpright: >-
    Op het werk kan deze kaart een project of rol weerspiegelen dat haar natuurlijke einde bereikt, soms na veel inzet. Ze kan ook opbranden laten zien, het gevoel niets meer te kunnen geven. Je kunt erkennen dat sommige dingen niet verder te duwen zijn. De balans opmaken van wat je hebt gewonnen en rusten voor de volgende stap kan je energie beschermen.
  workReversed: >-
    Omgekeerd kan deze kaart suggereren dat je na een tegenslag geleidelijk weer vaste grond vindt. Motivatie komt misschien in kleine golven terug. Je kunt beginnen met bescheiden doelen en elk ervan vieren. Merk je dat je iets nieuw leven probeert in te blazen wat echt af is, dan kan het helpen die energie te richten op wat er hierna zou kunnen komen.
  growthUpright: >-
    Voor persoonlijke groei nodigt de Tien van Zwaarden je uit afsluitingen te zien als deel van een grotere cyclus. Een dieptepunt bereiken kan schijn wegnemen en laten zien wat ertoe doet. Je kunt schrijven over wat dit hoofdstuk je heeft geleerd, zonder je te haasten om er iets positiefs in te vinden. Eerlijke erkenning is een vorm van kracht op zich.
  growthReversed: >-
    Omgekeerd kan deze kaart een stille terugkeer van hoop en energie weerspiegelen. Misschien merk je dat je draagkracht stap voor stap weer groeit. Wees geduldig met dagen die als een terugval voelen; herstel verloopt zelden in een rechte lijn. Bedenk welke lessen je wilt meenemen, en welke oude verhalen je klaar bent voorgoed neer te leggen.
