imageryNote: >-
  Het originele beeld toont tien zwaarden naast elkaar op vlakke grond aan de rand van een donker meer, als gereedschap dat aan het eind van een lange dag is neergelegd. De nachtlucht erboven is zwaar, maar langs de verre horizon spreidt zich een heldere band van goudkleurig licht uit. De rij zwaarden suggereert een voltooide cyclus, het stille water wijst op uitputting en rust, en de dageraad laat zien dat er een nieuwe dag begint.
