imageryNote: >-
  De Duivel van Taro is voorgesteld als een schimmige, gehoornde figuur die boven twee kleinere figuren troont, die met losse, slappe kettingen aan zijn zetel vastzitten. De kettingen zijn duidelijk los om hun polsen getekend, zodat de kijker kan opmerken dat ze ze zelf zouden kunnen afdoen. Zwak fakkellicht en diepe aardetinten scheppen een zware sfeer, terwijl een vage deuropening van licht aan de rand van het tafereel laat zien dat er een ander pad te vinden is.
