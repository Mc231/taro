  relationshipsReversed: >-
    Omgekeerd kan deze kaart wijzen op een stap terug doen uit een ongezonde dynamiek, of een grens stellen die moeilijk te stellen was. Je kunt overwegen welke steun je nodig hebt om die grens te bewaken. De kaart kan ook een relatie weerspiegelen die eerlijker wordt nu verborgen gevoelens naar buiten komen.
  workUpright: >-
    Op het werk of in een project benadrukt de Duivel het gevoel ergens aan vast te zitten: lange werkdagen, een behoefte aan goedkeuring, of een rol waarin je vooral blijft uit angst voor verandering. Je kunt jezelf afvragen wat de situatie je oplevert en wat ze je kost, en of kleine veranderingen je weer een gevoel van keuze kunnen geven.
  workReversed: >-
    Omgekeerd kan de Duivel weerspiegelen dat je loskomt van een onhandige werkgewoonte, zoals perfectionisme of altijd bereikbaar zijn. De kaart kan ook wijzen op het herkennen van druk die je normaal was gaan vinden. Je kunt deze nieuwe vrijheid beschermen met een heldere grens, zoals een vaste eindtijd of een limiet aan berichten na werktijd.
  growthUpright: >-
    De Duivel opent de deur naar schaduwwerk: rustig de delen van jezelf verkennen die je meestal verbergt. Je kunt een gewoonte opmerken die dwangmatig voelt en je met nieuwsgierigheid, zonder oordeel, afvragen wat ze je probeert te geven. Begrip komt vóór verandering.
  growthReversed: >-
