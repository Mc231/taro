shortUpright: >-
  Een cyclus is misschien rond aan het komen. Deze kaart nodigt je uit stil te staan en te eren wat je hebt voltooid.
shortReversed: >-
  Iets is misschien bijna af. Welke laatste stap of welk los eindje verdient je aandacht?
meaningUpright: |-
  De Wereld is de laatste kaart van de Grote Arcana, het einde van de reis die met de Dwaas begon. Het is een kaart van voltooiing en heelheid: het gevoel dat de stukjes op hun plek zijn gevallen, dat een cyclus is doorleefd en dat je je, voor dit moment, thuis voelt in het verhaal dat je tot nu toe hebt geleefd.
  In het dagelijks leven kan deze kaart weerspiegelen dat je een lang project afrondt, een doel bereikt waar je naartoe hebt gewerkt, of je gewoon thuis voelt in je leven en je lichaam. Ze kan wijzen op integratie: de lessen van veel ervaringen, de makkelijke en de moeilijke, samenbrengen tot een gevoel van wie je bent. Erbij horen kan hier betekenen dat je hoort bij een gemeenschap, een plek of bij jezelf.
  Deze kaart nodigt je uit om te overwegen wat je hebt bereikt en het te vieren. Je kunt jezelf afvragen hoe je bent veranderd sinds deze cyclus begon, en wat je wilt meenemen naar de volgende. De Wereld laat zien dat voltooiing geen einde is in de zin van stoppen. Het is een moment van volheid voordat een nieuwe reis begint.
meaningReversed: |-
  Omgekeerd kan de Wereld een cyclus weerspiegelen die bijna rond is, maar nog niet helemaal. Een paar losse eindjes, een onuitgesproken afscheid of een laatste taak houden je misschien tegen om je klaar te voelen. Misschien voel je dat je klaar bent om verder te gaan, terwijl iets je nog op je plek houdt.
  Deze kaart kan ook wijzen op elders naar afsluiting zoeken, kortere wegen zoeken of hopen dat anderen de dingen voor je afronden.
  Je kunt de een of twee dingen benoemen die je zouden helpen je compleet te voelen. Het kan gaan om een praktische taak afmaken, iemand bedanken, een teleurstelling erkennen of jezelf gewoon erkenning geven voor hoe ver je bent gekomen. Die laatste stap bewust zetten kan een bijna-einde veranderen in een echt einde.
aspects:
  relationshipsUpright: >-
    In relaties kan de Wereld een gevoel van vervulling en wederzijds begrip weerspiegelen, alsof een band helemaal tot zijn recht komt. De kaart kan je uitnodigen te waarderen wat jullie samen hebben opgebouwd en gedeelde mijlpalen te vieren. Relaties voelen hier heel, met ruimte voor zowel nabijheid als ieders eigen vrijheid.
  relationshipsReversed: >-
    Omgekeerd kan deze kaart wijzen op iets onopgelosts in een relatie, een gesprek dat niet is afgemaakt of een hoofdstuk dat niet is afgesloten. Je kunt overwegen wat jullie allebei zou helpen vrede te voelen, of dat nu betekent dat er iets gezegd moet worden of dat je aanvaardt dat het al is gezegd.
  workUpright: >-
    Op het werk of in een project benadrukt de Wereld voltooiing en erkenning. De kaart kan weerspiegelen dat je een belangrijk stuk werk afrondt, een mijlpaal bereikt of voelt dat je rol goed bij je past. Je kunt de tijd nemen om te erkennen wat jij en anderen hebben bereikt voordat je aan het volgende begint.
  workReversed: >-
    Omgekeerd kan de Wereld een project weerspiegelen dat in de laatste fase vastzit, of het gevoel dat je de finish net niet haalt. Je kunt opschrijven wat er nog over is en beslissen of het echt moet gebeuren of losgelaten kan worden. Kleine, gerichte inzet kan helpen dingen netjes af te ronden.
  growthUpright: >-
    Voordat je naar het volgende doel reikt, kan het helpen te erkennen hoe ver je al bent gekomen. Je kunt terugdenken aan de lessen, uitdagingen en vreugden van een recent hoofdstuk en opmerken hoe ze samen een vollediger beeld van jezelf vormen. Integratie is een stille vorm van prestatie.
  growthReversed: >-
    Omgekeerd kan de Wereld vragen wat je nodig hebt om je compleet te voelen. De kaart kan een gevoel van onrust of onvolledigheid weerspiegelen. Je kunt één ding benoemen dat je al een tijd wilt afmaken, het je volle aandacht geven, en dan opmerken hoe het voelt om die cirkel te sluiten.
