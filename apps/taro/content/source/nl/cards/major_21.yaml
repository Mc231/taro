imageryNote: >-
  De Wereld van Taro is voorgesteld als een figuur die danst binnen een grote ovale krans van bladeren en bloemen uit elk seizoen en vrij beweegt in het midden van een sterrenhemel. Rond de krans markeren vier kleine emblemen voor vuur, water, lucht en aarde de randen van het tafereel, wat balans en heelheid suggereert. Een lint dat uit de hand van de danser wappert, buigt terug naar waar het begon en nodigt de kijker uit een gevoel van aankomst te ervaren en van een reis die rond is.
