imageryNote: >-
  De Dwaas van Taro is voorgesteld aan de rand van een hoge plek met open lucht voor zich, midden in een stap, met alleen een klein bundeltje bij zich. Een klein dier aan de hielen kan staan voor instinct, speels of waarschuwend. Eén witte bloem kan onschuld en openheid suggereren, terwijl de wijde horizon en het ochtendlicht spreken van mogelijkheden. Het opgeheven gezicht van de figuur nodigt de kijker uit zich af te vragen waar die naar kijkt, en wat die heeft besloten niet mee te dragen.
