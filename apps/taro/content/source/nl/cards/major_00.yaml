meaningUpright: |-
  De Dwaas staat helemaal aan het begin van de Grote Arcana, met het nummer nul, nog voordat er ook maar één les is geleerd. Het is de energie van iemand die op pad gaat met een lichte tas en een open blik, meer benieuwd naar wat de weg te bieden heeft dan naar waar die precies eindigt.
  In het dagelijks leven kan deze kaart de eerste week op een nieuwe plek weerspiegelen, een hobby die je oppakt zonder plan om er meester in te worden, of een gesprek dat je begint zonder elke zin te oefenen. De kaart kan wijzen op een deel van jou dat klaar is om iets te proberen, ook al vraagt een ander deel om een zekerheid die niemand kan bieden. Niet weten is hier geen tekortkoming; het is gewoon waar elke reis begint.
  Deze kaart nodigt je uit om te overwegen waar wat meer lichtheid zou kunnen helpen. Wat zou er veranderen als je jezelf toestond weer beginner te zijn, eenvoudige vragen te stellen en al doende te leren? De Dwaas vraagt je niet om je gezond verstand opzij te zetten. De kaart vraagt je wel op te merken of de angst om het fout te doen je ervan weerhoudt om überhaupt een stap te zetten.
meaningReversed: |-
  Omgekeerd kan de Dwaas laten zien dat de vonk van een nieuw begin nog niet echt vlam heeft gevat. Misschien voel je je aangetrokken tot iets nieuws, terwijl je tegelijk heel stil blijft staan, het idee steeds opnieuw omdraait en wacht op een teken dat het veilig is om te bewegen. Soms is dat wachten verstandig; soms is het ongemerkt een gewoonte geworden.
  Deze stand kan ook de omgekeerde neiging weerspiegelen: energie die vooruit stormt zonder te kijken, overal ja op zegt en weinig ruimte laat om te merken waar je voeten neerkomen. Beide neigingen delen een vraag over bereidheid en vertrouwen.
  Je kunt jezelf afvragen welke van de twee nu dichterbij voelt. Als je je inhoudt, wat is dan één kleine manier met weinig op het spel om het water te testen? Als je voortjaagt, hoe zou het eruitzien om je enthousiasme te houden en één moment van rust in te lassen voor de volgende sprong?
aspects:
  relationshipsUpright: >-
    In relaties kan de Dwaas een speelse, onbevangen kwaliteit weerspiegelen: iemand ontmoeten zonder script, of je opnieuw laten verrassen door een vertrouwde band. Deze kaart kan je uitnodigen om nieuwsgierig te zijn naar de mensen die dicht bij je staan en vragen te stellen waarvan je denkt het antwoord al te kennen. Openheid is hier geen naïviteit; het is de bereidheid om aanwezig te zijn zonder vooraf te bepalen hoe het moet gaan.
  relationshipsReversed: >-
    Omgekeerd kan deze kaart wijzen op aarzeling om iemand toe te laten, of op zo snel gaan dat de ander weinig ruimte heeft om bij te blijven. Je kunt opmerken of je jezelf beschermt door vaag te blijven, of de langzamere fasen van iemand leren kennen overslaat. Een vriendelijk gesprek over tempo, het jouwe en dat van de ander, kan voor jullie allebei ruimte maken.
  workUpright: >-
    Op het werk of in elk project kan de Dwaas het begin van iets onbekends weerspiegelen: een nieuwe rol, een cursus, een creatief idee zonder staat van dienst. De kaart nodigt je uit om vroege fouten als informatie te zien en niet als oordeel. Je kunt jezelf afvragen wat je zou proberen als de eerste poging ruw mocht zijn, en wie je onderweg kan helpen de kneepjes te leren.
  workReversed: >-
    Omgekeerd kan de Dwaas een idee weerspiegelen dat steeds wordt uitgesteld tot de omstandigheden perfect voelen, of een sprong zonder de basis te controleren. Je kunt overwegen of je meer informatie nodig hebt of gewoon meer moed. De kleinst mogelijke eerste stap opschrijven, plus één praktische voorzorg, kan een vage wens veranderen in iets wat je kunt uitproberen zonder alles op het spel te zetten.
  growthUpright: >-
    Voor persoonlijke groei viert deze kaart de beginnersgeest. Ze kan je uitnodigen iets te proberen waarbij je geen reputatie te verliezen hebt: een nieuwe vaardigheid, een andere route naar huis, een vraag die je hardop stelt. Groei komt hier voort uit nieuwsgierig blijven en je laten verrassen, niet uit alles in één keer goed doen.
  growthReversed: >-
    Omgekeerd kan de Dwaas vragen of de angst om gek over te komen je wereld kleiner is gaan maken. De kaart kan ook rusteloosheid weerspiegelen die van het ene nieuwe ding naar het volgende springt, zonder dat iets wortel kan schieten. Je kunt opmerken welk patroon vertrouwd voelt, en een week lang experimenteren met het milde tegenovergestelde.
reflectionQuestions:
