  - "Welke verwachting wil je deze week eens beter bekijken?"
imageryNote: >-
  De Hiërofant van Taro is voorgesteld als een leraar op een stille binnenplaats, zittend op een versleten stenen bank onder een oude boom, met een kleine kring toehoorders van verschillende leeftijden. Aan de riem van de leraar hangt een zware sleutel, een symbool van inzicht dat via studie en oefening wordt doorgegeven. Boeken op de bank en een klok in de boog erboven suggereren gedeelde rituelen en leren. Een open hek aan de overkant van de binnenplaats laat zien dat elke les ergens nieuws heen kan leiden.
