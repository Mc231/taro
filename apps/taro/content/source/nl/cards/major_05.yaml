shortUpright: >-
  Er kan wijsheid liggen in wat anderen al voor je hebben bewandeld. Welke traditie of leraar kan nu helpen?
shortReversed: >-
  Een geërfde regel past misschien niet meer. Deze kaart nodigt je uit hem te toetsen aan wat je echt belangrijk vindt.
meaningUpright: |-
  De Hiërofant is de kaart van gedeelde kennis: de manieren van doen die een gemeenschap van generatie op generatie doorgeeft. De kaart kan staan voor leraren, mentoren, instellingen, rituelen en gedragscodes, alles wat mensen helpt samen te leren en het gevoel te hebben dat ze bij iets groters horen.
  In het dagelijks leven kan deze kaart weerspiegelen dat je je aanmeldt voor een les, een recept volgt dat in een familie is doorgegeven, een ervaren collega om raad vraagt of een mijlpaal markeert met een vertrouwde plechtigheid. Ze kan wijzen op de geruststelling dat je niet alles alleen hoeft te bedenken. Tradities dragen de lessen van veel mensen in zich, en er zit vaak gezond verstand in.
  Deze kaart nodigt je uit om te overwegen wat je hebt geërfd en wat je zelf hebt gekozen. Je kunt jezelf afvragen welke gedeelde waarden je leven stabiliteit geven, en van wie je nu zou kunnen leren. De Hiërofant gaat niet over blinde gehoorzaamheid; de kaart laat de waarde zien van een vorm goed leren, of je die nu behoudt, aanpast of uiteindelijk in je eigen woorden doorgeeft.
meaningReversed: |-
  Omgekeerd kan de Hiërofant een groeiende afstand weerspiegelen tot de regels of verwachtingen waarmee je bent opgegroeid. Iets wat ooit goed voelde, lijkt nu misschien te beperkt, of je merkt dat je een script meer uit gewoonte volgt dan uit overtuiging.
  Deze kaart kan ook wijzen op de omgekeerde neiging: elke conventie zo stellig afwijzen dat je mist wat er nog bruikbaar aan is. Vragen stellen is gezond; het werkt meestal goed als het voortkomt uit nieuwsgierigheid en niet uit verzet.
  Je kunt één verwachting bekijken die zwaar voelt en je afvragen waar die vandaan komt. Weerspiegelt ze nog jouw waarden, of die van iemand anders? Je eigen weg vinden kan betekenen dat je de delen houdt die je nog dienen en met respect loslaat wat dat niet meer doet.
aspects:
  relationshipsUpright: >-
    In relaties kan de Hiërofant gedeelde waarden, toewijding en de rituelen weerspiegelen die mensen bij elkaar houden: familietradities, jubilea, wekelijkse telefoontjes. De kaart kan je uitnodigen op te merken waar jij en iemand die dicht bij je staat allebei in geloven, en hoe jullie dat eren. Raad van een vriend of een ouder iemand die je vertrouwt, kan nu ook helpen.
  relationshipsReversed: >-
    Omgekeerd kan deze kaart wijzen op spanning tussen wat er van een relatie wordt verwacht en wat echt klopt voor de mensen die erin zitten. Je kunt overwegen of je normen van buitenaf volgt die niet bij jullie situatie passen. Een eerlijk gesprek over het soort band dat jullie allebei willen, kan ruimte maken voor je eigen manier van doen.
  workUpright: >-
    Op het werk of in een studie benadrukt de Hiërofant een vak goed leren, gevestigde methoden respecteren en een mentor vinden. Het kan een goed moment zijn om een cursus te volgen, een diploma te halen of iemand met ervaring te vragen je de kneepjes te leren. Deel uitmaken van een team of instelling kan steun en structuur bieden.
  workReversed: >-
    Omgekeerd kan de Hiërofant frustratie weerspiegelen over hoe dingen altijd al werden gedaan, of het gevoel dat het officiële pad niet bij je past. Je kunt jezelf afvragen welke regels kwaliteit beschermen en welke alleen verandering tegenhouden. Rustig en met onderbouwing een betere aanpak voorstellen kan meer opleveren dan om het systeem heen werken.
  growthUpright: >-
    Voor persoonlijke groei nodigt deze kaart je uit te leren van wie je zijn voorgegaan. Boeken, leraren, gemeenschappen en vaste oefeningen kunnen kaders bieden die je ontwikkeling steunen. Je kunt één discipline of traditie kiezen om met geduld te bestuderen, en opmerken wat die te bieden heeft voordat je beslist wat je ermee doet.
  growthReversed: >-
    Omgekeerd kan de Hiërofant een duwtje zijn om je eigen richtlijnen te schrijven. De kaart kan een moment weerspiegelen waarop je een overtuiging of een oude rol ontgroeit. Je kunt de waarden opschrijven die je vandaag echt hebt, in je eigen woorden, en opmerken waar ze overlappen met wat je is geleerd en waar ze zachtjes uiteengaan.
reflectionQuestions:
  - "Welke waarden heb je geërfd, en welke heb je zelf gekozen?"
