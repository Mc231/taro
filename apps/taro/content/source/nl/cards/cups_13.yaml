imageryNote: >-
  Het beeld toont een zittende figuur aan de waterkant, die een kelk met beide handen vasthoudt, het oppervlak weerspiegelt de lucht. Schelpen, golven of waterdieren die in de zetel zijn uitgesneden, kunnen een diepe band met de wereld van gevoel suggereren. Stil water en een zachte lucht weerspiegelen rustige ontvankelijkheid, terwijl de zorgvuldige manier waarop de kelk wordt vastgehouden wijst op innerlijke diepten die met respect worden behandeld.
