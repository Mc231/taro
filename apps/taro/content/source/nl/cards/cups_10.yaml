imageryNote: >-
  Het beeld verzamelt tien kelken rond een groep figuren van verschillende leeftijden, die samen een open landschap delen met een huis vlakbij. Water dat door groen land stroomt, suggereert emotionele voeding die een gemeenschap draagt. Open armen, verbonden handen of een gedeelde dans kunnen vreugde en gemak overbrengen. Heldere maar zachte kleuren weerspiegelen warmte, veiligheid en het gevoel ergens goed te zijn aangekomen.
