imageryNote: >-
  Gerechtigheid van Taro is voorgesteld als een kalme, rechtop zittende figuur die een weegschaal in evenwicht op hoogte van het hart houdt en een rechtopstaand zwaard dat naar de hemel wijst. De figuur kijkt de kijker recht aan, wat eerlijkheid suggereert zonder dat er iets verborgen is. Twee eenvoudige zuilen en een effen gordijn erachter houden het tafereel rustig, alsof er ruimte wordt gemaakt voor zorgvuldig nadenken. Koele luchtblauwe tinten en één warm accent kunnen de ontmoeting van verstand en geweten weerspiegelen.
