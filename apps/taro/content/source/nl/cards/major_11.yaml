shortUpright: >-
  Een moment om dingen eerlijk af te wegen en zo te handelen dat je het later met een goed gevoel kunt uitleggen.
shortReversed: >-
  Iets voelt misschien uit balans. Deze kaart nodigt je uit er helder naar te kijken, ook naar je eigen aandeel.
meaningUpright: |-
  Gerechtigheid houdt in de ene hand een weegschaal en in de andere een zwaard. De weegschaal staat voor zorgvuldig afwegen; het zwaard voor de helderheid om te handelen als je dat hebt gedaan. Deze kaart gaat over eerlijkheid, oprechtheid en verantwoordelijkheid nemen voor je keuzes, met het besef dat daden gevolgen hebben en dat je ze met zorg kunt kiezen.
  In het dagelijks leven kan deze kaart een beslissing weerspiegelen die een helder hoofd vraagt, zoals taken eerlijk verdelen, oprechte feedback geven of een fout toegeven en het goedmaken. Ze kan wijzen op momenten waarop je wordt gevraagd een situatie van alle kanten te bekijken voordat je reageert, en net zo eerlijk te zijn tegenover jezelf als je tegenover anderen probeert te zijn.
  Deze kaart nodigt je uit om te overwegen hoe een evenwichtige reactie eruit zou zien. Je kunt jezelf afvragen welke feiten ertoe doen, wat iedere betrokkene nodig heeft en waarvoor jij verantwoordelijkheid kunt nemen. Gerechtigheid voorspelt niet hoe een formele kwestie afloopt. De kaart benadrukt integriteit: handelen in lijn met wat je juist vindt, en met een rustige geest aanvaarden wat daarop volgt.
meaningReversed: |-
  Omgekeerd kan Gerechtigheid het gevoel weerspiegelen dat iets oneerlijk is, of dat de weegschaal in een situatie is doorgeslagen. Misschien heb je het gevoel dat je meer draagt dan je deel, of merk je de verleiding om niet naar je eigen aandeel in een moeilijkheid te kijken.
  Deze kaart kan ook wijzen op jezelf te streng beoordelen, elke keuze afwegend tegen een onmogelijke norm. Verantwoording afleggen is nuttig; voortdurende zelfkritiek is niet hetzelfde.
  Je kunt de situatie zo neutraal mogelijk opschrijven, alsof je haar uitlegt aan een vriend met een eerlijk oordeel. Wat is van jou om te dragen, en wat niet? Eerlijkheid zoeken kan betekenen dat je je uitspreekt, iets herstelt, of gewoon een oordeel loslaat dat zwaar is geworden om mee te dragen.
aspects:
  relationshipsUpright: >-
    In relaties kan Gerechtigheid balans en wederzijds respect weerspiegelen: beide mensen geven en ontvangen op een manier die eerlijk voelt. De kaart kan je uitnodigen eerlijk te kijken naar hoe verantwoordelijkheden en zorg worden gedeeld. Heldere, vriendelijke gesprekken over verwachtingen kunnen vertrouwen versterken en stille wrok voorkomen.
  relationshipsReversed: >-
    Omgekeerd kan deze kaart wijzen op een onevenwicht, zoals één persoon die meer van het emotionele of praktische werk doet, of een conflict waarin de schuld eenzijdig voelt. Je kunt overwegen hoe eerlijkheid er vanuit beide gezichtspunten uitziet, en of een excuus of een duidelijkere afspraak de balans kan herstellen.
  workUpright: >-
    Op het werk of in een project benadrukt Gerechtigheid integriteit, een eerlijk proces en zorgvuldige beslissingen. De kaart kan weerspiegelen dat je de afspraken over verwachtingen herziet, evenwichtige feedback geeft of opties op hun merites afweegt. Je kunt jezelf afvragen welke keuze je zonder ongemak openlijk zou kunnen uitleggen aan iedereen die erdoor wordt geraakt.
  workReversed: >-
    Omgekeerd kan Gerechtigheid frustratie weerspiegelen over oneerlijke behandeling of onduidelijke regels. De kaart kan ook wijzen op de kantjes eraf lopen onder druk. Je kunt de feiten rustig noteren, zo nodig passende steun zoeken, en nagaan of je eigen handelen past bij de norm die je ook van anderen zou willen zien.
  growthUpright: >-
    Voor persoonlijke groei nodigt deze kaart je uit te leven naar je waarden en eigenaarschap te nemen voor je keuzes. Zonder hardheid nadenken over de gevolgen van je daden kan je helpen groeien. Je kunt naar één recente beslissing kijken en je afvragen wat je zou behouden, en wat je een volgende keer anders zou kunnen doen.
  growthReversed: >-
    Omgekeerd kan Gerechtigheid vragen of je jezelf aan een veel strengere norm houdt dan anderen. De kaart kan schuldgevoel weerspiegelen dat blijft hangen terwijl de les al is geleerd. Je kunt oefenen met een eerlijke zelfbeoordeling: benoemen wat er misging en ook wat er goed ging.
