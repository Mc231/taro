# Crisis resources directory: the one source for the app asset and the Worker
# (01 §7.5, 03 §9.5, 05 §4.2; RC25, RC81). Format: ../README.md.
#
# LLM draft (Phase 5 Sprint 5.3). Numbers are copied from the 05 §4.2 minimum
# set. Names, URLs, hours and languages were drafted from general knowledge
# and are NOT verified: every entry stays `verifiedAt: null` until the owner
# checks it against the official source (Phase 18 Sprint 18.4) and records
# the source list in 00_DECISIONS.md. `validate --release` fails until then.
#
# Selection (03 §9.5): country -> localeFallback[locale] -> international; at
# most 3 entries, always including international, so keep each country to at
# most 2 entries.
localeFallback:
  en: US
  ar: null
  de: DE
  es: ES
  fr: FR
  it: IT
  ja: JP
  ko: KR
  nl: NL
  pt: BR          # pt is Brazilian Portuguese (05 §9.3)
  tr: TR
  uk: UA
