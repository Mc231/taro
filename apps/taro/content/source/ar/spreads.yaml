  single: >-
    يناسب توزيع البطاقة الواحدة الأوقات التي تريد فيها فكرة واحدة واضحة ترافقك طوال اليوم، أو حين يكون السؤال بسيطًا وتبحث عن نقطة انطلاق للتأمل لا عن خريطة مفصّلة. ويفيد أيضًا حين يضيق الوقت أو حين تكون في بداية تعرّفك إلى البطاقات.
  three_ppf: >-
    يناسب توزيع الماضي والحاضر والمستقبل الأوقات التي تريد فيها رؤية كيف تطوّر موقف ما مع الوقت. فهو يساعدك على ملاحظة الأنماط التي أوصلتك إلى هنا، وما هو فاعل الآن، وإلى أين قد تتجه الأمور إن لم يتغير شيء، كي تقرر ما تود الاحتفاظ به أو تغييره.
  three_sao: >-
    يناسب توزيع الوضع والفعل والنتيجة المواقف العملية حين تريد التفكير فيما يمكنك فعله بعد ذلك. فهو ينظر إلى الوضع كما هو، وإلى نهج يستحق التفكير فيه، وإلى أين قد يقود هذا النهج إن اتبعته.
  relationship: >-
    يساعد توزيع العلاقة على التأمل في أي رابط وثيق: شريك، أو صديق، أو فرد من العائلة، أو زميل. فهو ينظر إلى ما تقدّمه أنت، وكيف قد يعيش الطرف الآخر الأمور، وما يجمعكما، وما يُثقل على الرابط، وما يمكن أن ينمو إليه. وهو يصف نظرتك أنت إلى العلاقة، لا أفكار الطرف الآخر.
  two_paths: >-
    يناسب توزيع الطريقين الأوقات التي توازن فيها بين خيارين. من المفيد تسميتهما لنفسك قبل السحب: المسار أ والمسار ب. ينظر التوزيع إلى الموقف الكامن وراء الاختيار، وإلى ما قد يطلبه منك كل طريق، وإلى أين قد يقود كل منهما، لتتمكن من مقارنتهما بقيمك الخاصة. ويبقى القرار لك.
  celtic_cross: >-
    يناسب الصليب السلتي المواقف المعقدة التي تريد استكشافها بعمق. تنظر مواضعه العشرة في جوهر المسألة، وما يعترضها، وجذورها، والأحداث القريبة، وما قد يأتي بعد ذلك، ثم فيك أنت، ومحيطك، وآمالك ومخاوفك، وإلى أين قد تتجه الأمور إن لم يتغير شيء. ومن المفيد أن تمنح نفسك وقتًا لقراءته على مهل.
