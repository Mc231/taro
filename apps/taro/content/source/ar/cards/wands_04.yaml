imageryNote: >-
  تتصل أربع عصي منتصبة بإكليل من الأوراق والأزهار والشرائط، فتشكّل بوابة مفتوحة. ووراءها يجتمع أشخاص رافعين أيديهم، فيما يقبع في البعيد بيت بسيط أو بلدة مسوّرة. يوحي الإطار الرباعي بأسس مستقرة بُنيت بالجهد، والإكليل بحصاد من الفرح المشترك، والبوابة المفتوحة بترحيب يدعو الآخرين إلى الدخول بدلًا من إبقائهم خارجًا.
