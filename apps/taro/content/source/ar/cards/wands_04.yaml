shortUpright: >-
  محطة ما تستحق أن يُحتفى بها؛ إنها لحظة للاجتماع والشكر والاستمتاع بإحساس البيت.
shortReversed: >-
  قد يبدو احتفال ما أهدأ أو أقل استقرارًا مما توقعت؛ يمكنك أن تنظر فيما قد يساعدك على الشعور بأنك في بيتك.
meaningUpright: |-
  أربعة من العصي بطاقة وصول واجتماع. تشكّل أربع عصي إطارًا بسيطًا، كأعمدة مظلة أو بوابة مزينة لاستقبال الضيوف. وهي تعلن مرحلة صنع فيها الجهد شيئًا مستقرًا بما يكفي للوقوف تحته ومشاركته.
  في الحياة اليومية، قد يبدو ذلك إنهاء فترة عمل شاقة ثم الطبخ للأصدقاء، أو الانتقال إلى مكان يبدو أخيرًا مكانك، أو عائلة أو مجتمع يجتمع حول مناسبة مشتركة. الأمر لا يتعلق بنجاح باهر بقدر ما يتعلق بدفء بلوغ محطة استراحة والناس من حولك.
  تدعوك هذه البطاقة إلى التوقف والاحتفاء بما حققته، مهما بدا متواضعًا. فالاحتفال ليس مكافأة فحسب؛ إنه يقوّي الروابط ويمنح طاقة لما يأتي بعد. يمكنك أن تفكر فيمن كانوا جزءًا من هذا الفصل وكيف يمكنك أن تشكرهم، أو ببساطة أن تسمح لنفسك بالاستمتاع بإحساس الانتماء دون الاندفاع إلى الهدف التالي.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يوحي أربعة من العصي بأن إحساس البيت أو الانتماء مهتز قليلًا. ربما تتغير خطط اجتماع ما، أو لم يستقر انتقال بعد، أو ربما تحضر احتفالًا وتشعر ببعض البعد عنه.
  وقد يشير أيضًا إلى احتفال انطوى إلى الداخل. ربما تفخر بهدوء بشيء لم يلاحظه الآخرون، أو تفضّل طريقة صغيرة وخاصة للاحتفاء بمحطة ما. وقد يكون لذلك معناه الخاص.
  قد يكون هذا وقتًا للسؤال عمّا يجعل مكانًا أو مجموعة تبدو كالبيت بالنسبة إليك. هل في أسسك ما يطلب الانتباه: روتين، أو حديث، أو إصلاح صغير؟ يمكنك أن تجد طريقة واحدة لصنع جيب من الثبات، حتى لو كانت الصورة الأكبر لا تزال تستقر.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس هذه البطاقة الدفء والاحتفال المشترك والشعور بالترحيب. وقد تكون لحظة لتكريم رابط ما، سواء بذكرى سنوية، أو لقاء بعد غياب، أو وجبة مشتركة، أو مجرد قول ما يعنيه لك الطرف الآخر بصوت عالٍ. يمكنك أن تلاحظ أين تشعر بالألفة أكثر مع شخص ما، وأن تخبره بذلك.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تشعر بأنك خارج دائرة تهتم بها قليلًا، أو تلاحظ توترًا حول اجتماع أو مساحة مشتركة. ليس على كل مناسبة أن تكون مثالية لتكون ذات معنى. يمكنك التفكير في خطوة صغيرة صادقة نحو استعادة الصلة، كدعوة، أو حديث هادئ، أو عرض للمساعدة في أمر يهم الطرف الآخر.
  workUpright: >-
    في العمل أو في مشروع ما، قد يشير أربعة من العصي إلى بلوغ محطة تستحق الاعتراف: إطلاق، أو مرحلة مكتملة، أو فريق وجد إيقاعه. يمكنك أن تأخذ وقتًا للاحتفال مع من جعلوا ذلك ممكنًا. فالاعتراف بالجهد المشترك قد يقوّي الثقة ويمنح المرحلة التالية أساسًا أثبت.
  workReversed: >-
    في الوضع المعكوس، قد تمر محطة دون اعتراف، أو قد يكون فريق ما أقل استقرارًا مما يبدو. يمكنك أن تسمّي التقدم بنفسك بدلًا من انتظار أن يفعل ذلك غيرك، أو تنظر فيما قد يساعد المجموعة على الشعور بأمان أكبر: أدوار أوضح، أو مساحة مشتركة، أو لحظة للتأمل في المسافة التي قطعتموها معًا.
  growthUpright: >-
    في النمو الشخصي، تدعوك هذه البطاقة إلى ترك الإنجازات تستقر قبل المضي قدمًا. فالاحتفاء بخطوة مكتملة قد يبني إحساسًا بالاستقرار الداخلي يرافقك في اللحظات الأصعب. يمكنك أن تصنع طقسًا صغيرًا خاصًا بك، كنزهة، أو ملاحظة مكتوبة، أو وجبة مفضلة، لتكريم خطوة قطعتها مؤخرًا.
  growthReversed: >-
    في الوضع المعكوس، ربما تتجاوز محطاتك الخاصة سريعًا، أو تشعر بأن لا شيء قد اكتمل بما يكفي للاحتفال به. يمكنك أن تستكشف ما يعنيه البيت لك في الداخل: أيّ العادات أو الأماكن أو الأشخاص يساعدك على الشعور بالثبات. وتقوية واحد منها قد تجعل الأرض تحت قدميك أقرب إليك.
