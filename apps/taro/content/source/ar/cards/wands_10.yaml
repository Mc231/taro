imageryNote: >-
  يسير شخص منحنيًا إلى الأمام، ذراعاه ملتفتان حول حزمة طويلة من عشر عصي تكاد تخفي وجهه، متجهًا نحو بيت صغير أو بلدة في الأفق. ترمز الحزمة إلى المسؤوليات المتراكمة، والوجه المخفي إلى الطريقة التي قد يضيّق بها الحمل الثقيل مجال الرؤية، والوجهة القريبة إلى نهاية في المتناول. ويترك الطريق المفتوح مجالًا لتخيّل الحمل وهو يُتقاسم أو يوضع جانبًا.
