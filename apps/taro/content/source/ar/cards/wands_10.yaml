shortUpright: >-
  ربما تحمل أكثر من نصيبك؛ تدعوك هذه البطاقة إلى ملاحظة الثقل وما الذي يحتاج حقًا إلى أن يُحمل.
shortReversed: >-
  قد يكون جزء من الحمل جاهزًا لأن يُرفع عن كتفيك؛ يمكنك النظر فيما يمكنك وضعه جانبًا أو تقاسمه أو رفضه.
meaningUpright: |-
  يُظهر عشرة من العصي شخصًا يحمل حزمة كبيرة من العصي، ذراعاه ملتفتان حولها ورأسه منحنٍ، سائرًا نحو بيت في البعيد. النار التي بدأت شرارة واحدة تضاعفت لتصبح التزامات كثيرة، وكل منها يتطلب جهدًا لحمله.
  تظهر هذه البطاقة كثيرًا حين تتراكم المسؤوليات تدريجيًا: مشروع ظل يكبر، أو دور استوعب مهام إضافية، أو رعاية للآخرين مع محاولة إبقاء خططك الخاصة حية. ربما بدأ كثير من ذلك بحماسة أو إحساس بالواجب، وقد يصعب تذكّر متى صار ثقيلًا إلى هذا الحد.
  تدعوك هذه البطاقة إلى النظر بصدق فيما تحمله. أيّ المسؤوليات تخصك، وأيّها حطّ عليك تلقائيًا؟ وأيّها لا يزال مرتبطًا بشيء تهتم به؟ قد تكون الوجهة قريبة، لكن يمكنك مع ذلك أن تسأل ما إذا كان بإمكانك أن تحمل هذا بطريقة مختلفة: على دفعات أصغر، أو بمساعدة، أو مع وضع بعض الأشياء جانبًا في الطريق.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يشير عشرة من العصي إلى لحظة تحرر. ربما بدأت تضع جانبًا مسؤوليات لم تكن لك أصلًا، أو تفوّض، أو تقول لا لطلبات قد تزيد الثقل. وقد يكون في إدراك أنك لست مضطرًا إلى حمل كل شيء دفعة واحدة شيء من الارتياح.
  وقد تعكس أيضًا النمط المعاكس منقلبًا إلى الداخل: الإصرار على فعل كل شيء وحدك، حتى حين تكون المساعدة متاحة، لأن الطلب يبدو أصعب من المكابدة.
  قد يكون هذا وقتًا مناسبًا لفرز حملك. يمكنك أن تدوّن ما تحمله وتحدد ما يمكن تقاسمه أو تأجيله أو تركه. التغييرات الصغيرة، كمهمة واحدة مفوَّضة أو دعوة واحدة مُعتذَر عنها، قد تُحدث فرقًا حقيقيًا. التخلي ليس فشلًا؛ بل قد يكون طريقة للاحتفاظ بطاقتك لما يهم أكثر.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس هذه البطاقة اختلالًا في من يحمل ماذا: طرف واحد يتولى معظم التخطيط أو القلق أو العمل العاطفي. يمكنك أن تلاحظ ما إذا كان الحمل يبدو منصفًا، والحديث عنه بانفتاح. فتقاسم الثقل قد يقرّب الناس، بينما يولّد الحمل الزائد الصامت غالبًا استياءً خفيًا.
  relationshipsReversed: >-
    في الوضع المعكوس، ربما تتعلم طلب المساعدة أو التراجع عن أدوار تحملتها من أجل الآخرين. وقد يبدو ذلك غير مريح في البداية. يمكنك التفكير في المسؤوليات التي تود تقاسمها، وكيف تطلب ذلك بطريقة تدعو إلى التعاون، بدلًا من الانتظار حتى يمنعك التعب من الطلب أصلًا.
  workUpright: >-
    في العمل أو الدراسة، قد يشير عشرة من العصي إلى التزامات زائدة: مهام أكثر من الوقت، أو مشروع كبر أبعد من شكله الأول. يمكنك أن تجرد التزاماتك، وتوضح الأولويات مع الأشخاص المعنيين، وتبحث عن أي شيء يمكن تبسيطه. فالإنهاء الجيد يعتمد غالبًا على حمل أقل في وقت واحد.
  workReversed: >-
    في الوضع المعكوس، ربما بدأت تضع حدودًا، أو تفوّض، أو تعيد التفاوض على المواعيد النهائية، أو ربما تقاوم فعل ذلك. يمكنك تحديد مهمة واحدة يمكن لشخص آخر التعامل معها، أو التزام واحد يمكنك الاعتذار عنه. فإفساح المجال في عبء عملك قد يعيد التركيز والحماسة التي بدأ بها العمل.
  growthUpright: >-
    من القناعات التي تستحق المساءلة هنا أن عليك التعامل مع كل شيء بنفسك. من أين جاءت هذه القناعة؟ يمكنك أن تلاحظ كيف يستجيب جسدك ومزاجك للحمل الثقيل، وتتعامل مع تلك الإشارات بوصفها معلومات عمّا يحتاج إلى التغيير.
  growthReversed: >-
    في الوضع المعكوس، ربما تكتشف الخفة التي تأتي من وضع شيء ما جانبًا. يمكنك أن تستكشف ما تريد أن تواصل حمله لأنه يمنحك معنى، وما تشعر بالجاهزية لتركه. فاختيار مسؤولياتك، بدلًا من مجرد قبولها، قد يكون فعلًا هادئًا من احترام الذات.
