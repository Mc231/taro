imageryNote: >-
  تشق ثماني عصي سماءً واسعة بشكل مائل، متوازية وطائرة، فوق منظر طبيعي هادئ يجري فيه نهر أو طريق في الأسفل. لا أشخاص في المشهد، بل حركة فقط. توحي الزاوية المشتركة بطاقة متسقة في اتجاه واحد، والسماء المفتوحة بطريق واضح، والنهر في الأسفل بالتدفق الثابت للأحداث. ويدعو غياب الشخوص الناظر إلى الإحساس بالحركة بدلًا من مشاهدة قصة شخص آخر.
