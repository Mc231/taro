  relationshipsReversed: >-
    في الوضع المعكوس، قد يعكس ستة من السيوف صعوبة في ترك ديناميكية قديمة خلفك، أو حمل جراح الماضي إلى فصل جديد. يمكنك التفكير في التوقعات التي تنتمي إلى علاقة سابقة لا إلى هذه العلاقة. والحديث عمّا يريد كلاكما تركه على الشاطئ القديم قد يجعل الحاضر أخف.
  workUpright: >-
    في العمل، قد توحي هذه البطاقة بتحول تدريجي: دور جديد، أو فريق تغيّر، أو ترك مشروع مرهق نحو أرض أثبت. قد لا يبدو الانتقال مثيرًا، لكنه قد يجلب الارتياح. يمكنك أن تجرد المهارات والدروس التي تحملها معك، وتتخلى عن عادات لم تنتمِ إلا إلى المياه المضطربة.
  workReversed: >-
    في الوضع المعكوس، قد تعكس هذه البطاقة تغييرًا في العمل يتأجل باستمرار، أو مهام غير منتهية تربطك بموقف تريد تركه. يمكنك أن تدوّن ما يحتاج حقًا إلى الإنجاز وما يمكن تسليمه. وأحيانًا يكون إغلاق بعض الأطراف المعلّقة هو ما يسمح أخيرًا للقارب بمغادرة الرصيف.
  growthUpright: >-
    في النمو الشخصي، يدعوك ستة من السيوف إلى تكريم التقدم البطيء. فالابتعاد عن طريقة تفكير قديمة يحدث غالبًا عبر أيام صغيرة كثيرة لا عبر قفزة جريئة واحدة. يمكنك أن تلاحظ الأدلة على أنك صرت أهدأ أو أحكم مما كنت، وتمنح نفسك التقدير على المسافة التي قطعتها.
  growthReversed: >-
    في الوضع المعكوس، قد تعكس هذه البطاقة تشبثًا بأنماط مألوفة حتى حين لم تعد تساعد، أو اندفاعًا إلى الأمام دون استيعاب ما حدث. يمكنك أن تتوقف لتنظر إلى الوراء مرة واحدة، عن قصد، وتسمّي ما تحمله معك وما تشعر بالجاهزية لتركه. ثم تلتفت نحو الماء من جديد.
