imageryNote: >-
  في الصورة الأصلية، ينساب قارب صغير من مياه متموجة نحو شاطئ ساكن يلفه الضباب. وتنتصب ستة نصال في القارب كحمولة هادئة، ويجلس راكب ووجهه إلى الأمام. وتدفع عصا طويلة القارب بثبات عبر المياه الضحلة. يُظهر الماء المتغير تحولًا من الاضطراب إلى الهدوء، وتوحي النصال بدروس تُحمل معًا، فيما تشير العصا إلى حركة صبورة خطوة بخطوة.
