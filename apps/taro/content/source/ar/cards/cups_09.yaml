  growthUpright: >-
    في النمو الشخصي، يدعو تسعة من الكؤوس إلى ممارسة الامتنان والاستمتاع. يمكنك أن تختم كل يوم بتدوين ثلاثة أشياء شعرت بأنها طيبة، مهما كانت صغيرة. ومع الوقت، قد يدرّب ذلك انتباهك على القناعة ويسهّل عليك إدراك أن لديك ما يكفي.
  growthReversed: >-
    في الوضع المعكوس، قد تطلب منك هذه البطاقة تفحّص الفرق بين المتعة والامتلاء. يمكنك أن تلاحظ عادات الاستهلاك أو الانشغال أو المقارنة التي تتركك راغبًا في المزيد. واستكشاف ما يجلب رضا عميقًا، لا دفعة سريعة، قد يرشد إلى اختيارات ألطف وأكثر دوامًا.
