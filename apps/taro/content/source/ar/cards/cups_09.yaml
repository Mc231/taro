  workUpright: >-
    في العمل، قد تعكس هذه البطاقة رضا عن إنجاز، أو تقديرًا لجهد، أو مجرد استمتاع بما تفعله. وقد تدعوك إلى التوقف والاعتراف بالتقدم الذي أحرزته. فالاحتفاء بمحطة ما، ولو بشكل خاص، قد يعيد الطاقة لما يأتي بعدها ويذكّرك بسبب أهمية العمل.
  workReversed: >-
