  - "أين تشعر بأن لديك سلطة، وأين تتنازل عنها؟"
  - "ما الروتين الواحد الذي قد يمنح أسبوعك شكلًا أكثر ثباتًا؟"
imageryNote: >-
  يُتخيَّل إمبراطور Taro جالسًا إلى طاولة حجرية متينة مثبتة في سفح تل، وأمامه خريطة وعصا قياس ومصباح مرتبة بعناية. وتُظهر الجدران الحجرية الممتدة عبر الحقول خلفه حدودًا بُنيت باليد، حجرًا فوق حجر. ويمكن لكبش يرعى قريبًا أن يلمّح إلى برج الحمل والدافع إلى البدء. وتوحي درجات الأحمر الدافئة بالحيوية، فيما يلمّح باب صغير تُرك مفتوحًا في أحد الجدران إلى أن البنى المتينة يمكنها أن تسمح للناس بالعبور.
