shortUpright: >-
  طاقة واضحة ذات رؤية تدعوك إلى القيادة بغاية، وتحويل الأفكار الكبيرة إلى اتجاه يمكن للآخرين اتباعه.
shortReversed: >-
  قد يميل الدافع القوي إلى نفاد الصبر أو السيطرة؛ يمكنك التحقق مما إذا كانت رؤيتك لا تزال تترك مكانًا للآخرين.
meaningUpright: |-
  يبلغ ملك العصي بنار هذه المجموعة نضجها. يجلس على عرش لكنه يميل قليلًا إلى الأمام، وعصاه في يده، كأنه مستعد للفعل. الطاقة هنا ذات رؤية وحاسمة: شخص يستطيع أن يرى إلى أين قد تمضي الأمور، ويملك الثقة والخبرة لتحديد الاتجاه.
  قد تظهر هذه الصفة حين تتولى قيادة مشروع، أو توجه مجموعة خلال تغيير ما، أو تتخذ قرارًا جريئًا متجذرًا في قيم واضحة. وقد تصف أيضًا مرشدًا أو قائدًا يمنح إحساسه بالغاية الآخرين شجاعة.
  تدعوك هذه البطاقة إلى أن تتقدم إلى سلطتك الخاصة. القيادة هنا تتعلق بالرؤية والنزاهة والمتابعة أكثر مما تتعلق بالسيطرة. يمكنك أن تسأل أيّ غاية أكبر تخدمها جهودك الحالية، وكيف يمكنك مشاركتها بوضوح مع المعنيين. فحين يكون الاتجاه صادقًا ومشروحًا جيدًا، يرغب الآخرون غالبًا في الانضمام إليه بدلًا من مجرد اتباع الأوامر.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس ملك العصي دافعًا فقد توازنه. ربما تشعر بنفاد الصبر تجاه إيقاع الآخرين، أو تمرر الخطط دون إصغاء، أو تضع أهدافًا عالية جدًا لا تترك مكانًا للراحة. ومن الجهة الأخرى، قد يشير إلى قائد، ربما أنت، فقد رؤية الغاية ولا يعرف إلى أين يتجه بعد ذلك.
  قد تدعوك هذه البطاقة إلى النظر في طريقة استخدامك لتأثيرك. هل طاقتك تلهم الناس أم تثقل عليهم؟ وهل الرؤية لا تزال حية بالنسبة إليك؟
  يمكنك التوقف لاستعادة الصلة بغايتك، أو طلب ملاحظات صادقة، أو إشراك عدد أكبر من الناس في القرارات. فالقيادة القوية تنمو غالبًا من الإصغاء بقدر ما تنمو من التوجيه.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس هذه البطاقة حضورًا واثقًا وحاميًا ومشجعًا. يمكنك أن تجلب الرؤية إلى الخطط المشتركة، وتساعد المقربين منك على الإيمان بأهدافهم. والدعوة هنا هي القيادة بسخاء، بتقديم التوجيه حين يكون مرحَّبًا به، والدعم حين يريد شخص آخر أن يمسك بالمقود.
  relationshipsReversed: >-
    في الوضع المعكوس، قد يستأثر طرف واحد بالقرارات أكثر من اللازم، أو قد يخلق نفاد الصبر توترًا. يمكنك أن تلاحظ ما إذا كنت تصغي تمامًا لشخص قريب أم تخطط لإجابتك مسبقًا. ودعوة الطرف الآخر إلى طرح أفكاره قد تحوّل خطة من جانب واحد إلى خطة مشتركة.
  workUpright: >-
    في العمل أو في مشروع ما، قد يشير ملك العصي إلى القيادة والرؤية الاستراتيجية والشجاعة في أخذ المبادرة. يمكنك تحديد هدف واضح، وإيصاله بحماسة، والتفويض بطريقة تثق بنقاط قوة الآخرين. فالنزاهة والاتساق يساعدان الناس على الشعور بالأمان في اتباع اتجاه طموح.
  workReversed: >-
    في الوضع المعكوس، ربما تضغط أكثر من اللازم، أو تتوقع من الآخرين مجاراة إيقاعك، أو لا تشعر باليقين بشأن الاتجاه بنفسك. يمكنك التراجع خطوة لمراجعة الرؤية مع المعنيين. وطلب الآراء وتعديل الأهداف قد يجعل الخطة أكثر واقعية وأوسع دعمًا.
  growthUpright: >-
    في النمو الشخصي، تدعوك هذه البطاقة إلى تولي زمام اتجاهك. ما الذي تريد بناءه على المدى البعيد، وأيّ القيم ترشده؟ يمكنك كتابة بيان قصير لغايتك واستخدامه مرجعًا للاختيارات المقبلة.
  growthReversed: >-
    في الوضع المعكوس، يمكنك أن تستكشف علاقتك بالسيطرة والصبر. هل تشعر بأن عليك أن تكون دائمًا في موقع القيادة، أم تتجنب القيادة لأنها تبدو أكثر من اللازم؟ وإيجاد طريق وسط، تقود فيه حياتك بثقة ومرونة، قد يكون شكلًا ثابتًا من أشكال القوة.
