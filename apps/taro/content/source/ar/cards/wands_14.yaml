imageryNote: >-
  يجلس شخص على مقعد مرتفع عند حافة مُطلّ، مائلًا إلى الأمام وبجانبه عصا مزهرة مغروسة بثبات، كأنه على وشك النهوض. وأمامه طريق يتعرج نحو تلال بعيدة يضيئها شمس الأصيل. توحي العصا المزهرة برؤية حية تنمو، والمُطلّ بنظرة واسعة على ما يمكن بناؤه، والميل إلى الأمام بالاستعداد لتحويل الأفكار إلى فعل. وقد تحمل الجمرات أو زخارف اللهب الصغيرة عنصر النار.
