shortUpright: >-
  تقف على حافة ما تعرفه وتنظر إلى الخارج؛ إنها لحظة مناسبة لرسم المكان الذي قد تود الذهاب إليه.
shortReversed: >-
  ربما تبقي الراحةُ والحذر خطةً أكبر على الرف؛ يمكنك أن تنظر مجددًا إلى ما يبقيك هناك.
meaningUpright: |-
  يأتي اثنان من العصي بعد الشرارة الأولى بوقفة للرؤية. لم تعد الفكرة مجرد شعور؛ أنت الآن تقف في مكان أعلى قليلًا، تتأمل المنظر وتتساءل إلى أي مدى قد يمتد. إحدى العصوين مغروسة بالفعل خلفك، علامة على ما بنيته، والأخرى في يدك، جاهزة لتُحمل إلى مكان جديد.
  تظهر هذه البطاقة كثيرًا حين توازن خطوة أكبر: الالتحاق بدورة في مدينة أخرى، أو إعادة تشكيل دور، أو بدء مشروع يطلب منك أكثر من روتينك المعتاد. وقد تعكس أيضًا الشعور القلق بأنك تجاوزت مساحة ما بينما لا تزال تحبها.
  الدعوة هنا هي التخطيط بطموح وصدق في آن. يمكنك أن تدوّن ما تأمله، وما سيكلّفه من وقت وطاقة، وأيّ خطوة أولى صغيرة بما يكفي لتجربتها. النظر بعيدًا مفيد؛ وكذلك اختيار الخطوة التالية التي تستطيع اتخاذها فعلًا.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس اثنان من العصي خطة تبقى على الورق. ربما تواصل التحديق في الأفق دون أن تحزم حقيبة، لأن المألوف يبدو أكثر أمانًا أو لأن الوجهة لا تزال ضبابية. أحيانًا يكون التردد حكيمًا، وأحيانًا يكون مجرد عادة.
  وقد تشير هذه البطاقة أيضًا إلى خطط وُضعت لنيل استحسان شخص آخر، أو إلى رؤية لم تعد تناسب الشخص الذي تصير إليه. فحين يبدو هدف ما ثقيلًا لا مثيرًا، قد يستحق الأمر أن تسأل ما إذا كان لا يزال هدفك أنت.
  يمكنك أن تعيد النظر في خريطتك بعين جديدة. كيف قد تبدو نسخة أصغر وأكثر شخصية من هذه الخطة؟ أيّ خوف هو الأعلى صوتًا، وهل يتعلق بالخطوة نفسها أم بما قد يظنه الآخرون؟ تسميته قد تجعل الخطوة التالية أقرب إلى الاختيار منها إلى القفزة.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تدعو هذه البطاقة إلى حديث عن المستقبل الذي يتخيله كل منكما: أين تريدان العيش، وكيف تريدان قضاء وقتكما، وما الذي تأملان استكشافه. وقد تعكس رابطًا يبدو قاعدة آمنة ينطلق منها كل طرف بحرية للنظر إلى الخارج. يمكنك أن تسأل شخصًا قريبًا عن الأفق الذي يتطلع إليه مؤخرًا.
  relationshipsReversed: >-
    في الوضع المعكوس، ربما تكتم أنت أو شخص قريب منك رغبة في التغيير لأن قولها بصوت عالٍ يبدو مخاطرة. قد تتباعد الخطط بهدوء حين لا تُتشارك أبدًا. قد تكون هذه لحظة للحديث عن آمال ظلت خاصة، مع الإصغاء بقدر الكلام، كي لا يخطط أيّ منكما وحده.
  workUpright: >-
    في العمل، قد يشير اثنان من العصي إلى التفكير الاستراتيجي: رسم المرحلة التالية من مشروع، أو التفكير في مجال جديد، أو تشكيل هدف بعيد المدى. يمكنك أن تقضي بعض الوقت في الصورة الكبيرة قبل العودة إلى المهام اليومية، ثم تختار فعلًا ملموسًا واحدًا ينقل الخطة من السبورة إلى الحركة.
  workReversed: >-
    في الوضع المعكوس، قد تكون خطة في العمل عالقة بين الراحة والطموح، أو مشكّلة بما يبدو متوقعًا أكثر مما تريده. يمكنك التحقق مما إذا كان الهدف لا يزال يحفزك. إن كان كذلك، فقد يساعد تقسيمه إلى تجربة أولى صغيرة؛ وإن لم يكن، فإعادة رسم الخطة طريق مشروع أيضًا للمضي قدمًا.
  growthUpright: >-
    في النمو الشخصي، تدعوك هذه البطاقة إلى أخذ طموحاتك على محمل الجد. ما الذي ستستكشفه لو سمحت لنفسك بالتفكير أبعد من حدودك المعتادة؟ يمكنك أن ترسم صورة تقريبية للعام أو العامين المقبلين، لا بوصفها وعدًا ثابتًا، بل اتجاهًا يساعدك على ملاحظة الفرص حين تظهر.
  growthReversed: >-
    في الوضع المعكوس، قد تتجاذب الرغبة في الأمان والرغبة في النمو في اتجاهين مختلفين. وكلتاهما حاجة حقيقية. يمكنك أن تستكشف ما الذي قد يجعل خطوة جديدة آمنة بما يكفي لتجربتها، وأيّ نوع من الدعم أو الممارسة أو المعلومات قد يحوّل فكرة بعيدة إلى شيء يمكنك الاقتراب منه تدريجيًا.
reflectionQuestions:
  - >-
    حين تنظر أبعد من روتينك الحالي، ما الذي تجد نفسك تتوق إلى استكشافه؟
  - >-
    دعم مَن قد يجعل خطوة أكبر تبدو أكثر إمكانًا، وكيف يمكنك إخباره بها؟
  - "ما أصغر خطوة أولى قد تختبر هذه الخطة في الواقع؟"
imageryNote: >-
  يقف شخص على سور عالٍ أو حافة مرتفعة، وإلى جانبه عصا مثبتة بإحكام، وعصا ثانية يمسكها بيده برخاوة، ناظرًا نحو أرض أو بحر بعيدين. ويستقر قربه كرة أرضية صغيرة أو خريطة أو بوصلة. ترمز العصا المثبتة إلى ما بُني بالفعل، والمرفوعة إلى اختيار الذهاب أبعد. ويدعو المنظر الواسع الناظر إلى تخيّل طرق ممكنة كثيرة بدلًا من مسار واحد محدد.
