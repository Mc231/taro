imageryNote: >-
  يقف شخص وحيد على ارتفاع من أرض صخرية، قدماه مغروستان على نحو غير متساوٍ، رافعًا عصا بكلتا يديه بينما تندفع ست عصي أخرى من أسفل الحافة. توحي الأرض غير المستوية بأن القناعة ليست مريحة دائمًا، ويُظهر المرتفع موقعًا مشرفًا حقيقيًا اكتُسب بالجهد. وقد ترمز العصي في الأسفل إلى التحديات والأسئلة والأصوات المتنافسة، والقبضة الثابتة إلى شجاعة متجذرة في القيم.
