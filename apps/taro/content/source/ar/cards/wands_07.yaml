shortUpright: >-
  ربما تتمسك بموقف يهمك؛ وتكرّم هذه البطاقة الشجاعة التي يتطلبها الثبات.
shortReversed: >-
  الدفاع عن كل شيء في وقت واحد قد يرهقك؛ يمكنك أن تختار الأرض التي تستحق حقًا أن تتمسك بها.
meaningUpright: |-
  يُظهر سبعة من العصي شخصًا على أرض مرتفعة، يمسك عصا واحدة في مواجهة عصي عدة ترتفع من الأسفل. الموقف ليس سهلًا، لكنه يمنح ميزة. تدور هذه البطاقة حول القناعة: الدفاع عمّا تؤمن به، أو حماية شيء عملت من أجله، أو الحفاظ على ثبات قدميك حين يدفعك الآخرون.
  قد تظهر حين تعبّر عن رأي غير شائع في مجموعة، أو تحافظ على حدّ مع شخص يواصل اختباره، أو تواصل مشروعًا يشك فيه الآخرون. وبعد أن بلغت قدرًا من النجاح، قد تجد أيضًا أن عددًا أكبر من الناس يريد تحدّيه أو مساءلته.
  تدعوك هذه البطاقة إلى ملاحظة قوتك والقيم التي تمنحها غايتها. الثبات لا يتطلب العدوانية؛ يمكن أن يكون هادئًا ومتزنًا وواضحًا. يمكنك أن تسأل عمّا تدافع عنه بالضبط ولماذا يهم، كي تذهب طاقتك إلى ما هو مهم لك لا إلى كل تحدٍّ عابر.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس سبعة من العصي شعورًا بأن من حولك يفوقونك عددًا، أو شعورًا بالإنهاك. ربما تدافع عن موقف منذ وقت طويل، وبدأ الجهد يظهر أثره. أو ربما تلاحظ أنك في حالة تأهب حتى حين لا يهاجمك أحد فعلًا.
  وقد تشير هذه البطاقة أيضًا إلى لحظة لإعادة التفكير. ليس كل تحدٍّ بحاجة إلى رد، وليس كل موقف بحاجة إلى التمسك به إلى الأبد. فالتخلي عن معركة واحدة قد يحرر طاقة للمعارك الأهم.
  يمكنك أن تجرد المواضع التي تقاوم فيها ولماذا. أيّ الحدود تحمي قيمك، وأيّها تحول إلى عادة دفاعية؟ قد يساعد أن تطلب الدعم، أو تتراجع خطوة للراحة، أو تدع الآخرين يتقاسمون الحمل بدلًا من الدفاع عن التل وحدك.
aspects:
  relationshipsUpright: >-
    في الروابط القريبة، قد تعكس هذه البطاقة التعبير عن احتياجاتك، حتى حين يُحدث ذلك بعض الاحتكاك. وقد تشير أيضًا إلى الدفاع عن شخص تهتم به. يمكنك التفكير في كيفية الحفاظ على حدّ بدفء، بقول ما يهمك بوضوح مع ترك مساحة لوجهة نظر الطرف الآخر.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تشعر بأنك دائمًا في موقف الدفاع مع شخص ما، أو بأن كل حديث يتحول إلى جدال. يمكنك أن تلاحظ ما إذا كنت تحمي نفسك من نقد حقيقي أم من خوف قديم. مقاربة ألين، أو وقفة قبل الرد، قد تفتح مساحة لتبادل أصدق.
  workUpright: >-
    في العمل أو في مشروع إبداعي، قد يشير سبعة من العصي إلى التمسك بمعيار أو فكرة تحت الضغط: منافسة، أو نقد، أو مطالب متغيرة. يمكنك أن تجمع أسبابك وأدلتك كي تتحدث بثقة هادئة. والمثابرة هنا تأتي من الوضوح بشأن ما تحميه ولماذا يهم.
  workReversed: >-
    في الوضع المعكوس، ربما تتوزع طاقتك أكثر من اللازم، فتستجيب لكل تحدٍّ أو طلب كأنها جميعًا ملحّة بالقدر نفسه. يمكنك اختيار القضية أو القضيتين اللتين تحتاجان حقًا إلى موقفك، وترك الباقي الآن. وطلب المساندة من الزملاء أو المتعاونين قد يجعل الموقف الصعب أسهل احتمالًا.
  growthUpright: >-
    التمسك بموقفك، ولو لوقت قصير، دليل على صلابة تستحق الاعتراف. فلديك من القدرة على الثبات على قيمك أكثر مما قد تظن. يمكنك أن تتذكر وقتًا ثبتّ فيه وتلاحظ ما ساعدك حينها، كسبب واضح، أو شخص داعم، أو روتين ثابت.
  growthReversed: >-
    في الوضع المعكوس، ربما تحمل إحساسًا بيقظة دائمة. قد يستحق الأمر أن تستكشف مصدره وما إذا كان لا يزال يخدمك. اختيار معاركك ليس استسلامًا؛ بل قد يكون طريقة لحماية طاقتك كي تكون شجاعتك حاضرة حين يكون لها أهمية حقيقية.
