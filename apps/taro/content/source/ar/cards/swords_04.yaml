imageryNote: >-
  تُظهر الصورة الأصلية شخصًا يستريح على مقعد حجري منخفض في مكان هادئ ذي سقف مقبب. وتتدلى ثلاثة نصال بهدوء على الجدار فوقه، ويستقر رابع أفقيًا تحت المقعد، وكلها مركونة جانبًا. ويسقط ضوء ناعم عبر نافذة صغيرة. توحي الغرفة المغلقة بملاذ آمن، وتشير النصال المركونة إلى أفكار وُضعت جانبًا الآن، فيما يلمّح الضوء اللطيف إلى أن العالم في الخارج ينتظر بصبر.
