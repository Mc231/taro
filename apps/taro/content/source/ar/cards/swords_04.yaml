shortUpright: >-
  التوقف جزء من العمل؛ قد يكون هذا وقتًا لوضع الأشياء جانبًا وترك ذهنك يهدأ.
shortReversed: >-
  قد تتأجل الراحة باستمرار، أو قد تكون فترة هادئة جاهزة للانتهاء؛ يمكنك ملاحظة أيّهما يبدو صحيحًا.
meaningUpright: |-
  أربعة من السيوف بطاقة راحة مقصودة. السيوف موضوعة جانبًا، لا ضائعة ولا مكسورة، بل مركونة لبعض الوقت. فبعد الجهد أو الخلاف أو فترة طويلة من التفكير المكثف، يحتاج العقل إلى مكان يستلقي فيه.
  قد يظهر ذلك في عطلة نهاية أسبوع بلا خطط، أو أمسية بلا شاشات، أو مجرد قول لا لالتزام إضافي. وقد يعكس فترة تعافٍ بعد أمر متطلب، يكون فيها فعل القليل أنفع ما يمكنك فعله. وقد يشير أيضًا إلى تأمل هادئ: وقت وحدك لفرز أفكارك قبل العودة إلى العالم.
  يجد كثيرون الراحة أصعب من العمل، لأن التوقف يسمح للمشاعر والأسئلة بالظهور. تدعوك هذه البطاقة إلى النظر إلى الراحة بوصفها مهارة لا مكافأة يجب أن تكسبها. كيف سيبدو أن تمنح نفسك سكونًا حقيقيًا، ولو لفترة قصيرة؟ يمكنك أن تلاحظ أيّ أنواع التوقف تتركك منتعشًا وأيّها يتركك مشتتًا فقط. فالعودة إلى العالم بعد ذلك قد تبدو أوضح حين تسمح لنفسك فعلًا بالتوقف.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس أربعة من السيوف راحة تتأجل باستمرار. ربما تعمل على مخزونك الاحتياطي، وتقول لنفسك إنك ستبطئ بعد مهمة أخرى. فالتململ، أو صعوبة الانفصال عن العمل، أو الشعور بالتعب حتى بعد النوم، قد تكون إشارات تستحق الإصغاء.
  وقراءة أخرى هي العكس: خلوة دامت بما يكفي، واستعداد لطيف للعودة إلى النشاط. فالسكون الذي رمّمك يومًا قد يبدو الآن تهربًا، وخطوة صغيرة عائدة إلى العالم قد تجلب الطاقة بدلًا من أن تستنزفها.
  يمكنك أن تسأل أيّ القراءتين تناسب وضعك اليوم. هل تحتاج إلى توقف لم تأخذه، أم تشعر بالجاهزية للنهوض من توقف أخذته؟ وفي الحالتين، الإصغاء إلى إيقاعك أنت، لا إلى إيقاع غيرك، قد يرشد الخطوة التالية.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تدعو هذه البطاقة إلى توقف: وقت متباعد للتفكير، أو استراحة من موضوع محتدم، أو مجرد رفقة هادئة دون الحاجة إلى نقاش الأمور. فالمساحة قد تكون رعاية حين تُسمّى ويُتفق عليها. يمكنك أن تخبر شخصًا قريبًا بأنك تحتاج إلى قليل من الراحة كي يُفهم سكونك على أنه إعادة شحن لا انسحاب.
  relationshipsReversed: >-
    في الوضع المعكوس، قد يعكس أربعة من السيوف توقفًا تحول إلى مسافة، أو علاقة لا يجد فيها أحد مساحة للتنفس. يمكنك التفكير فيما إذا كان قد حان وقت استعادة الصلة بعد فترة هادئة، أم أنك تحتاج إلى طلب بعض المساحة. ويمكن تقديم أيّ الطلبين بلطف ودون لوم.
  workUpright: >-
    في العمل، قد تشير هذه البطاقة إلى توقف مخطط: إجازة، أو أسبوع أخف، أو تراجع بعد إنهاء مشروع متطلب. الراحة جزء من الجهد المستدام. يمكنك حماية بعض الوقت غير المجدول كي تستقر الأفكار من تلقاء نفسها. وكثيرًا ما يصبح الحل الذي لم تجده وأنت تدفع مرئيًا حين تتوقف عن النظر إليه مباشرة.
  workReversed: >-
    في الوضع المعكوس، قد تعكس هذه البطاقة عملًا رغم الإنهاك، أو شعورًا بالعجز عن الانفصال عن العمل. يمكنك أن تلاحظ أين تواصل الراحة الانزلاق إلى أسفل القائمة. أو قد تعلن الاستعداد للعودة بعد استراحة، بمنظور جديد. والبدء بمهام صغيرة يمكن إدارتها قد يساعدك على العودة تدريجيًا دون أن تثقل على نفسك.
  growthUpright: >-
    في النمو الشخصي، يدعوك أربعة من السيوف إلى بناء عادات مريحة: استراحات منتظمة، أو صباحات هادئة، أو وقت في الطبيعة. فالسكون يمنح أفكارك فرصة لترتيب نفسها. يمكنك تجربة بضع دقائق من عدم فعل أي شيء على الإطلاق وملاحظة ما يطفو. الراحة ليست كسلًا؛ إنها الطريقة التي تعود بها الطاقة.
  growthReversed: >-
    في الوضع المعكوس، قد تعكس هذه البطاقة ذهنًا قلقًا يقاوم التوقف، أو خلوة تحولت بهدوء إلى مخبأ. يمكنك أن تتفقد نفسك بلطف: هل لا يزال هذا التوقف يمنحك شيئًا؟ وإن بدت الراحة مستحيلة، فنزهة قصيرة أو نفَس أبطأ قد يكونان بداية. وإن شعرت بالجاهزية للحركة، فقد تكون البداية الرفيقة هي الأنسب.
