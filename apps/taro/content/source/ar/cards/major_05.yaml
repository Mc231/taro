shortUpright: >-
  قد تكون هناك حكمة فيما سلكه آخرون قبلك. أيّ تقليد أو معلّم قد يساعد الآن؟
shortReversed: >-
  قاعدة موروثة قد لا تناسبك بعد الآن. تدعوك هذه البطاقة إلى اختبارها في ضوء ما تقدّره حقًا.
meaningUpright: |-
  الكاهن الأعظم هو بطاقة المعرفة المشتركة: طرق فعل الأشياء التي ينقلها مجتمع من جيل إلى جيل. وقد يرمز إلى المعلمين والمرشدين والمؤسسات والطقوس وقواعد الممارسة، وكل ما يساعد الناس على التعلم معًا والشعور بالانتماء إلى شيء أكبر منهم.
  في الحياة اليومية، قد تعكس هذه البطاقة الانضمام إلى دورة، أو اتباع وصفة طعام متوارثة في العائلة، أو طلب التوجيه من زميل خبير، أو الاحتفاء بمحطة مهمة بمراسم مألوفة. وقد تشير إلى الراحة في عدم الاضطرار إلى اختراع كل شيء وحدك. فالتقاليد تحمل دروس كثيرين، وغالبًا ما يكون فيها حسّ سليم.
  تدعوك هذه البطاقة إلى التفكير فيما ورثته وما اخترته. يمكنك أن تسأل أيّ القيم المشتركة تمنح حياتك ثباتًا، وممن يمكنك أن تتعلم الآن. لا يدور الكاهن الأعظم حول الطاعة العمياء؛ بل يسلّط الضوء على قيمة تعلّم شكلٍ ما جيدًا، سواء احتفظت به، أو كيّفته، أو نقلته يومًا ما بكلماتك الخاصة.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس الكاهن الأعظم مسافة تتسع بينك وبين القواعد أو التوقعات التي نشأت عليها. شيء كان يبدو صائبًا قد يبدو الآن ضيقًا، أو قد تستشعر أنك كنت تتبع نصًّا مكتوبًا بدافع العادة أكثر من القناعة.
  وقد تشير هذه البطاقة أيضًا إلى الميل المعاكس: رفض كل عُرف بحزم يجعلك تفوّت ما قد يظل مفيدًا فيه. المساءلة صحية، وتميل إلى أن تنجح حين تنبع من الفضول لا من ردّ الفعل.
  ربما يفيدك أن تنظر إلى توقّع واحد يبدو ثقيلًا وتسأل من أين جاء. هل ما زال يعكس قيمك أم قيم شخص آخر؟ إيجاد طريقك الخاص قد يشمل الاحتفاظ بالأجزاء التي لا تزال تخدمك، والتخلي باحترام عن الأجزاء التي لم تعد كذلك.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد يعكس الكاهن الأعظم القيم المشتركة والالتزامات والطقوس التي تجمع الناس: تقاليد العائلة، والذكريات السنوية، والمكالمات الأسبوعية. وقد يدعوك إلى ملاحظة ما تؤمن به أنت وشخص قريب منك معًا، وكيف تكرّمانه. وقد يكون التوجيه من صديق موثوق أو من شخص أكبر سنًّا مفيدًا الآن أيضًا.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تشير هذه البطاقة إلى توتر بين ما يُتوقع من علاقة ما وما يبدو صادقًا فعلًا لأصحابها. يمكنك التفكير فيما إذا كنت تتبع أعرافًا خارجية لا تناسب وضعك. حديث صادق عن نوع الرابط الذي يريده كلاكما قد يفسح المجال لطريقتكما الخاصة في فعل الأشياء.
  workUpright: >-
    في العمل أو الدراسة، يسلّط الكاهن الأعظم الضوء على تعلّم الحرفة كما ينبغي، واحترام الأساليب الراسخة، والعثور على مرشد. قد يكون هذا وقتًا مناسبًا للالتحاق بدورة، أو الحصول على مؤهل، أو طلب المساعدة من شخص خبير ليعرّفك على أصول العمل. والانتماء إلى فريق أو مؤسسة قد يقدّم الدعم إلى جانب البنية.
  workReversed: >-
    في الوضع المعكوس، قد يعكس الكاهن الأعظم إحباطًا من الطريقة التي طالما أُنجزت بها الأمور، أو إحساسًا بأن المسار الرسمي لا يناسبك. يمكنك أن تسأل أيّ القواعد تحمي الجودة وأيّها تقاوم التغيير فحسب. اقتراح نهج أفضل بهدوء وبالأدلة قد يكون أجدى من الالتفاف على النظام.
  growthUpright: >-
    في النمو الشخصي، تدعوك هذه البطاقة إلى التعلم ممن سبقوك. فالكتب والمعلمون والمجتمعات والممارسات قد تقدّم أُطرًا تدعم تطورك. يمكنك اختيار مجال واحد أو تقليد واحد لدراسته بصبر، وملاحظة ما يقدّمه قبل أن تقرر ما ستأخذه منه.
  growthReversed: >-
    في الوضع المعكوس، قد يكون الكاهن الأعظم دفعة لكتابة إرشاداتك الخاصة. وقد يعكس لحظة تتجاوز فيها قناعة ما أو دورًا قديمًا. يمكنك أن تدوّن القيم التي تؤمن بها حقًا اليوم، بكلماتك أنت، وتلاحظ أين تلتقي مع ما تعلّمته وأين تفترق عنه بلطف.
