imageryNote: >-
  يُتخيَّل كاهن Taro الأعظم معلّمًا في فناء هادئ، يجلس على مقعد حجري بالٍ تحت شجرة قديمة، ومن حوله حلقة صغيرة من المستمعين من أعمار مختلفة. يتدلى من حزامه مفتاح ثقيل، رمزًا لفهم يُنقل عبر الدراسة والممارسة. وتوحي الكتب المكدسة على المقعد والجرس المعلّق في القوس أعلاه بالطقوس والتعلم المشترك. ويلمّح باب مفتوح في الطرف البعيد من الفناء إلى أن كل تعليم قد يقود إلى مكان جديد.
