shortUpright: >-
  أصوات وطاقات كثيرة تتصادم؛ وقد يشحذ الاحتكاك الأفكار بقدر ما يرهقك.
shortReversed: >-
  قد يهدأ صدام ما، أو ينتقل إلى ما تحت السطح؛ يمكنك أن تلاحظ أيّ الخلافات لا يزال يحتاج إلى إصغاء منصف.
meaningUpright: |-
  يُظهر خمسة من العصي طاقة تتصادم. عصي عدة تتقاطع وتتضارب، ويصعب أن تعرف إن كان هذا عراكًا حقيقيًا أم لعبة أم حصة تدريب. وهذا الالتباس هو قلب البطاقة: فالاحتكاك نفسه قد يبدو مستنزفًا أو منشّطًا بحسب الطريقة التي يُحمل بها.
  قد تتعرف عليه في اجتماع يتكلم فيه الجميع في وقت واحد، أو في بيت مشترك يتجادل سكانه حول الأعمال المنزلية، أو في مشروع جماعي له اتجاهات كثيرة، أو ببساطة في ذهن مليء بالأولويات المتنافسة. قد يكون في المزيج طموح وكبرياء وأفكار جيدة، كلها تشد في اتجاهات مختلفة.
  تدعوك هذه البطاقة إلى النظر في نوع الخلاف الذي تعيشه. هل يساعد كل فكرة على أن تصبح أقوى، أم تحول إلى تسجيل نقاط؟ يمكنك تجربة إبطاء التبادل، أو تسمية هدف مشترك، أو الاتفاق على قواعد بسيطة كي تصبح طاقة الاختلاف مفيدة لا مرهقة. وأحيانًا يُظهر التراجع لحظة أين يكمن الخلاف الحقيقي.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يشير خمسة من العصي إلى تحول في طريقة التعامل مع الخلاف. قد يهدأ التوتر مع عثور الناس على أرضية مشتركة، أو قد يُدفع ببساطة بعيدًا عن الأنظار، فتبقى الخلافات دون قول حفاظًا على السلام.
  وقد ينقلب أيضًا إلى الداخل، شدًّا وجذبًا بين أجزاء مختلفة منك: الجزء الذي يريد الراحة والجزء الذي يريد الدفع، أو خطتان لا تستطيع اتباعهما معًا.
  قد تكون هذه لحظة لملاحظة ما إذا كان الهدوء حقيقيًا أم على السطح فقط. فتجنب كل جدال قد يترك احتياجات مهمة دون أن تُسمع، بينما قد يصفّي حديث منصف الأجواء. يمكنك أن تسأل أيّ خلاف، في داخلك أو من حولك، قد يستفيد من نظرة صبورة وصادقة، وما الذي قد يجعل خوضه آمنًا.
aspects:
  relationshipsUpright: >-
    في الروابط القريبة، قد تعكس هذه البطاقة مناوشات، أو تنافسًا مرحًا، أو خلافات صغيرة متكررة. ليس كل احتكاك علامة على مشكلة؛ فقد يُظهر أن الطرفين يهتمان ولديهما آراء قوية. يمكنك أن تلاحظ ما إذا كنت تصغي لتفهم أم تنتظر دورك في الرد، وأن تجرب تسمية ما يريده كلاكما قبل الجدال حول طريقة الوصول إليه.
  relationshipsReversed: >-
    في الوضع المعكوس، قد يكون خلاف ما في طور الهدوء، أو ربما صمت دون أن يُحل. يمكنك التفكير فيما إذا كان الصمت يمنحكما مساحة أم يتجنب موضوعًا مهمًا فحسب. وقد تكون اللحظة الهادئة وقتًا مناسبًا للعودة إليه بلطف، مع فضول تجاه وجهة نظر الطرف الآخر.
  workUpright: >-
    في العمل أو ضمن فريق، قد يشير خمسة من العصي إلى منافسة، أو فوضى عصف ذهني، أو أدوار غير واضحة. الطاقة عالية لكنها قد تكون مشتتة. يمكنك المساعدة في توجيهها بتوضيح الهدف، أو تناوب الأدوار في طرح الأفكار، أو اقتراح طريقة بسيطة لاتخاذ القرار. فالنقاش الصحي قد يقود إلى خطة أقوى حين يشعر الجميع بأنهم مسموعون.
  workReversed: >-
    في الوضع المعكوس، قد يستقر الخلاف في العمل ليصبح تعاونًا، أو قد يغلي تحت أسطح مهذبة. يمكنك البحث عن الخلافات غير المعلنة التي تبطئ الأمور. ودعوة الآخرين إلى إبداء آرائهم بصدق، أو إيجاد أرضية مشتركة في قرار صغير واحد، قد يساعد على تحويل التوتر الصامت إلى طاقة عمل من جديد.
  growthUpright: >-
    يمكن التعامل مع التحديات بوصفها تمرينًا لا دليلًا على أي شيء. فالاحتكاك قد يُظهر لك أين تكون آراؤك راسخة، وأين تكون مرنة، وأين تشعر بالحاجة إلى إثبات نفسك. يمكنك أن تلاحظ ما يستثير جانبك التنافسي وما الذي يحاول حمايته.
  growthReversed: >-
    في الوضع المعكوس، قد يكون الصراع داخليًا: رغبات أو قيم أو خطط متعارضة تمنعك من الاستقرار على مسار واحد. يمكنك استكشاف كل جانب كتابةً، ومنحه صوتًا منصفًا. فرؤيتها مبسوطة أمامك قد تسهّل إيجاد طريق يكرّم أكثر من حاجة واحدة من احتياجاتك.
reflectionQuestions:
  - >-
    أيّ خلاف من حولك يبدو الأكثر إرهاقًا، وأيّها يبدو الأكثر فائدة؟
  - >-
    كيف يمكنك أن تدعو شخصًا ما إلى تبادل أفكار أكثر إنصافًا وهدوءًا؟
  - "أيّ جزء منك يتجادل مع جزء آخر، وماذا يحتاج كل جانب؟"
imageryNote: >-
  يقف خمسة أشخاص متقاربين، يحمل كل منهم عصا، وقد رفعوا عصيهم بزوايا متقاطعة. المشهد حيوي وفيه شيء من الفوضى، لكن لا يبدو أن أحدًا قد أُصيب بأذى، فيبقى مفتوحًا بين منافسة حقيقية ولعبة تدريبية. وقد يرمز تشابك العصي المتقاطعة إلى أفكار وطموحات يدفع بعضها بعضًا، فيما توحي الأرض المفتوحة حولهم بمساحة للتراجع خطوة وإيجاد إيقاع مشترك.
