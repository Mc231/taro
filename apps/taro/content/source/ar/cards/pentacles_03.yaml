shortUpright: >-
  العمل الجيد ينمو غالبًا بين الناس. يمكنك ملاحظة كيف قد تتكامل مهارات مختلفة في شيء يهمك.
shortReversed: >-
  قد يتجاذب جهدٌ مشترك في اتجاهات مختلفة. قد يساعد أن تعيد النظر في الأدوار والخطط وطريقة إصغاء كل منكم للآخر.
meaningUpright: |-
  ثلاثة من العملات بطاقة البناء مع الآخرين. ثلاث عملات مثبتة في بناء ما توحي بعمل لا يستطيع شخص واحد أن يشكّله وحده: أحدهم يأتي بالتصميم، وآخر بالمواد، وثالث باليدين الثابتتين. وما يبرز ليس المرتبة بل احترام ما يقدّمه كل منهم.
  في الحياة اليومية، قد يظهر ذلك في مشروع جماعي ينسجم أخيرًا، أو جار يساعدك على إصلاح شيء ما، أو مجموعة دراسة، أو مرشد تشحذ ملاحظاته مهارتك. وقد يعكس أيضًا الرضا بالاعتراف بدورك، وباعترافك بأدوار الآخرين.
  تدعوك هذه البطاقة إلى التفكير في المواضع التي قد يرفع فيها التعاون عملك أبعد مما ستنجزه وحدك. يمكنك أن تسأل خبرة مَن تكمّل خبرتك، وكيف يمكنك مشاركة خطة بوضوح، وكيف تتلقى الآراء. فالحرفة تتعمق حين يكون الناس مستعدين للنظر إلى المخطط نفسه وتحسينه معًا.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يشير ثلاثة من العملات إلى جهد مشترك فقد خطته المشتركة. قد يعمل الناس بجد لكن نحو صور مختلفة قليلًا، أو قد تكون الأدوار مبهمة، فتتكرر بعض المهام وتسقط أخرى في الفجوات. وقد يعكس أيضًا ميلًا إلى فعل كل شيء وحدك، ربما لأن الطلب يبدو أبطأ أو أقل أمانًا.
  هذه دعوة لمراجعة المخطط لا لتوزيع اللوم. فعدم الاتساق شائع، وتسميته مبكرًا تكلّف عادةً أقل من المضي قدمًا رغمه.
  يمكنك اقتراح حديث قصير حول الأهداف ومن يفعل ماذا، أو كتابة الخطة حيث يستطيع الجميع رؤيتها. وإن كنت تميل إلى العمل منعزلًا، يمكنك التفكير في جزء واحد تسلّمه لغيرك، وملاحظة ما يتغير حين يضيف شخص آخر مهارته إلى مهارتك.
aspects:
  relationshipsUpright: >-
    في الروابط القريبة، قد تعكس هذه البطاقة العمل الجماعي في الحياة اليومية: التخطيط لانتقال معًا، أو تقاسم المهام المنزلية، أو دعم مشاريع كل منكما. يمكنك أن تلاحظ كيف تختلف نقاط قوتكما وكيف قد يكون ذلك هدية لا احتكاكًا. وقول ما تقدّره في طريقة إسهام شخص ما بصوت عالٍ قد يقوّي الأساس الذي تبنيانه معًا.
  relationshipsReversed: >-
    في الوضع المعكوس، قد توحي البطاقة بأنك وشخصًا قريبًا تعملان نحو صورتين مختلفتين للهدف نفسه، أو بأن طرفًا واحدًا يحمل القسط الأكبر من العبء العملي. وبدلًا من عدّ النقاط، يمكنكما الجلوس ومقارنة التوقعات. فتوضيح من يتولى ماذا قد يخفف التوتر ويساعد كلًّا منكما على الشعور بأنه مرئي.
  workUpright: >-
    في العمل، تسلّط هذه البطاقة الضوء على التعاون والحرفة. وقد تعكس مشروعًا يتيح فيه التواصل الواضح والاحترام المتبادل لمهارات الجميع أن تظهر. يمكنك البحث عن فرص لطلب الملاحظات، أو مشاركة معرفتك، أو الجمع بين أشخاص تتناسب قدراتهم. فالجودة كثيرًا ما ترتفع حين تكون الخطة مشتركة.
  workReversed: >-
    هنا قد تشير البطاقة إلى أدوار غير واضحة، أو تداخل في التواصل، أو فريق يشد في اتجاهات مختلفة. وقد تعكس أيضًا العمل منفردًا على شيء كان سيستفيد من عيون أخرى. يمكنك اقتراح مواءمة قصيرة للأهداف والمسؤوليات، أو دعوة زميل واحد لمراجعة مقاربتك قبل أن تمضي أبعد.
  growthUpright: >-
    في النمو الشخصي، قد يدعوك ثلاثة من العملات إلى التعلم مع الآخرين ومنهم. فمعلّم، أو ورشة عمل، أو شريك تمرين، أو مجتمع على الإنترنت قد يساعدك على صقل مهارة. يمكنك أن تلاحظ شعورك وأنت مبتدئ بين أشخاص يعرفون أكثر، وكم لديك لتقدّمه في المقابل.
  growthReversed: >-
    في الوضع المعكوس، قد تعكس البطاقة ترددًا في أن تُرى وأنت لا تزال تتعلم، أو عادة صرف الملاحظات. يمكنك أن تستكشف ما الذي يجعل تلقي الآراء صعبًا. واختيار شخص واحد موثوق تعرض عليه عملًا غير مكتمل قد يحوّل التعلم إلى عملية مشتركة بدلًا من اختبار منعزل.
reflectionQuestions:
  - "أيّ مهاراتك تستمتع بتقديمها لجهد مشترك؟"
  - "منظور مَن قد يقوّي شيئًا تبنيه حاليًا؟"
  - "أيّ جزء من الخطة سيستفيد من أن يُكتب ويُتشارك؟"
imageryNote: >-
  قد تضع الصورة ثلاثة أشخاص حول بناء غير مكتمل، كقوس أو طاولة عمل أو إطار مرفوع، ينشغل كل منهم بمهمة مختلفة. أحدهم يمسك خطة، والآخر يشكّل المادة، والثالث يثبّت أو يقيّم. وقد توحي ثلاث عملات مدمجة في البناء نفسه بأن القيمة تُصنع بالتعاون. وتلمّح السقالات والأدوات والمساحة المفتوحة حول البناء إلى أن العمل لا يزال جاريًا ومفتوحًا للتحسين.
