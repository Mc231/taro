shortUpright: >-
  قد يكون شعور جديد في طور الصعود؛ تدعوك هذه البطاقة إلى أن تفسح له مكانًا وتلاحظ إلى أين يريد أن يتدفق.
shortReversed: >-
  قد تحتاج كأسك إلى أن تمتلئ قبل أن تفيض؛ يمكنك التفكير فيما قد يعيد ملأك بهدوء اليوم.
meaningUpright: |-
  آس الكؤوس هو أول حركة في مجموعة الماء: إناء واحد ممتلئ حتى يفيض. وقد يعكس شعورًا يصل قبل أن تجد له كلمات، كالحنان، أو الدهشة، أو الارتياح، أو دفء مفاجئ تجاه شخص أو شيء. لا يلزم فعل أي شيء به بعد. البطاقة تطلب منك ببساطة أن تلاحظ وجوده.
  في الحياة اليومية، قد يبدو ذلك ضحكًا حقيقيًا لأول مرة منذ أسابيع، أو تأثرًا بمقطوعة موسيقية، أو اكتشاف أن استياءً قديمًا قد لان دون أن تحاول. وقد يشير أيضًا إلى دافع إبداعي جديد، أو رغبة في أن تكون ألطف مع نفسك.
  تدعوك هذه البطاقة إلى الانفتاح على الشعور بدلًا من إدارته فورًا. يمكنك أن تسأل إلى أين تريد رعايتك أن تذهب، وما إذا كنت تسمح لبعضها بأن يصل إليك أنت أيضًا. القلب المنفتح ليس وعدًا بأي شيء؛ إنه طريقة لملاقاة اليوم بمساحة أوسع قليلًا في الداخل.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يوحي آس الكؤوس بأن الشعور حاضر لكنه محتجز قريبًا، كماء في جرة مغطاة. ربما انشغلت برعاية الآخرين، أو بدا أكثر أمانًا أن تبقي المشاعر على مسافة لبعض الوقت. لا عيب في ذلك؛ فحماية القلب قد تكون استجابة معقولة لموسم متطلب.
  وقد تعكس هذه البطاقة أيضًا إحساسًا بالعمل والخزّان فارغ. قد تلاحظ أن المتع الصغيرة تمر باهتة، أو أنك تعطي من كأس لم تُملأ منذ وقت طويل.
  الدعوة هنا لطيفة. فبدلًا من إجبار نفسك على الشعور أكثر، يمكنك النظر فيما يرمّمك بهدوء، كالنوم، أو نزهة قرب الماء، أو حديث غير مستعجل، أو ساعة لا يحتاج إليك فيها أحد. وحين يملأ شيء ما الكأس، يمكنك أن تسمح لنفسك بملاحظته. فالانفتاح قد يعود بإيقاعه الخاص.
aspects:
  relationshipsUpright: >-
    في الروابط القريبة، قد يعكس آس الكؤوس موجة جديدة من الدفء، مع شريك أو صديق أو العائلة أو شخص جديد. وقد يدعوك إلى التعبير عن المودة ببساطة ودون حسابات: رسالة تُرسل لأنك فكرت فيه، أو شكر صادق، أو لحظة انتباه كامل. ويمكنك أيضًا أن تلاحظ كيف يبدو تلقي الرعاية إلى جانب منحها.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تشير هذه البطاقة إلى مودة مكبوحة، ربما بسبب جرح سابق أو مجرد تعب. قد تلاحظ أنك تصغي بتهذيب بينما تحافظ على مسافة صغيرة. لا حاجة إلى الدفع. يمكنك التفكير فيما إذا كان فعل انفتاح صغير وآمن واحد، كقول ما تقدّره، قد يسمح بمزيد من الدفء بينك وبين شخص قريب.
  workUpright: >-
    في العمل أو في أي مشروع يهمك، قد تعكس هذه البطاقة حماسة متجددة، أو فكرة جديدة تحرّك مشاعرك حقًا. وقد تدعوك إلى إدخال الشعور فيما تفعله: الاهتمام بمن تخدمهم، والاستمتاع بالحرفة، والفضول تجاه ما يمكن أن ينمو. يمكنك أن تدوّن ما يثير حماستك الآن، قبل أن تبدأ الاعتبارات العملية في تشكيله.
  workReversed: >-
    في الوضع المعكوس، قد تعكس البطاقة عملًا صار آليًا، تؤدي فيه الحركات بينما ينتظر اهتمامك في مكان آخر. وهذا شائع بعد جهد طويل. يمكنك أن تسأل ما الذي جذبك إلى هذا الطريق أول مرة، أو أيّ جزء صغير منه لا يزال ينبض بالحياة، وترى ما إذا كان منح هذا الجزء مساحة أكبر يعيد شيئًا من التدفق.
  growthUpright: >-
    في النمو الشخصي، يدعو آس الكؤوس إلى الصدق العاطفي مع نفسك. يمكنك التمرن على تسمية المشاعر حين تصل، دون تصنيفها جيدة أو سيئة. فالكتابة في المذكرات، أو الوقت قرب الماء، أو مجرد التوقف قبل الرد، قد يفسح مساحة لذلك. والغاية ليست السعادة الدائمة، بل علاقة ألطف وأكثر انفتاحًا مع حياتك الداخلية.
  growthReversed: >-
    في الوضع المعكوس، قد توحي هذه البطاقة بتوجيه الرعاية إلى الداخل قبل تقديم المزيد إلى الخارج. إن بدا مخزونك منخفضًا، يمكنك التعامل مع الراحة والمتع الصغيرة بوصفها ضرورية لا اختيارية. وقد يفيد أن تلاحظ ما يستنزفك وما يملؤك. وإن بقيت المشاعر الثقيلة معك، فالحديث مع شخص تثق به قد يكون خطوة مفيدة أيضًا.
