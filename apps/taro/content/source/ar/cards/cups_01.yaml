imageryNote: >-
  تتمحور الصورة حول إناء واحد ممتلئ حتى الحافة، يسقط ماؤه في جداول رفيعة عدة إلى بركة ساكنة تحته. وقد ترمز زنابق الماء أو أوراق اللوتس على السطح إلى مشاعر تتفتح ببطء وتمد جذورها في الأعماق. وقد يوحي ضوء ناعم فوق الكأس بالتقبّل، بعطاء يُمدّ لا يُنتزع. والجو العام وفرة هادئة: أكثر من الكفاية، تفيض بلطف إلى الخارج.
