shortUpright: >-
  تدعوك هذه البطاقة إلى الإصغاء بعمق، للآخرين ولنفسك، بحضور هادئ ورحيم.
shortReversed: >-
  ربما تمتص أكثر مما تستطيع حمله؛ يمكنك التفكير في الرعاية والحدود التي قد تساعدك على الشعور بالثبات.
meaningUpright: |-
  تجلس ملكة الكؤوس على حافة الماء، ممسكة بكأس تتأملها بانتباه هادئ. وترمز هذه الشخصية إلى النضج العاطفي في صورته المتقبّلة: القدرة على الشعور بعمق، واستشعار ما يحتاج إليه الآخرون، والاستجابة برحمة دون أن تفقد نفسك.
  قد تعكس هذه البطاقة لحظة تكون فيها الحضور الهادئ الذي يحتاج إليه أحدهم، أو تنجذب فيها إلى الإصغاء أكثر إلى حدسك. وهي تسلّط الضوء على التعاطف والصبر ونوع الرعاية الذي يصنع الأمان لا الضغط.
  في الحياة اليومية، قد يبدو ذلك إصغاءً لصديق دون استعجال لإصلاح الأمور، أو ثقة بإحساس هادئ تجاه موقف ما، أو صنع مساحة لطيفة في البيت يستطيع فيها الناس أن يكونوا على طبيعتهم. وقد يشير أيضًا إلى عمل إبداعي أو تأملي يستمد من حياتك الداخلية.
  تدعوك البطاقة إلى تكريم الحساسية بوصفها قوة. يمكنك أن تسأل كيف يمكنك رعاية الآخرين مع الاحتفاظ بكأس من الرحمة لنفسك.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد تعكس ملكة الكؤوس رعاية فاضت عن حوافها. ربما تمتص مشاعر الآخرين امتصاصًا كاملًا حتى يصعب العثور على مشاعرك، أو تعطي كثيرًا فلا يبقى لك إلا القليل.
  وقد تشير أيضًا إلى الداخل: حاجة إلى استعادة الصلة بحدسك بعد الإصغاء أساسًا إلى الآخرين، أو مشاعر تطلب الانتباه بدلًا من أن توضع جانبًا.
  تدعوك هذه البطاقة إلى التعامل مع الحدود بوصفها شكلًا من أشكال الرحمة. كيف سيبدو أن ترعى دون أن تحمل كل شيء؟ يمكنك أن تخصص وقتًا هادئًا للاطمئنان على نفسك، أو أن تقول لا لطلب واحد، أو أن تدع شخصًا آخر يحمل جزءًا من العبء. فحين تُرعى كأسك أنت، قد تتدفق الرعاية التي تقدّمها بحرية أكبر وإجهاد أقل.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس ملكة الكؤوس إصغاءً عميقًا ودعمًا عاطفيًا وتفهمًا. وقد تدعوك إلى صنع رابط تكون فيه المشاعر مرحَّبًا بها. يمكنك أن تلاحظ كيف تقدّم المواساة للآخرين وكيف تحب أن تتلقاها، وأن تشارك ذلك مع شخص قريب كي تتدفق الرعاية في الاتجاهين.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تشير هذه البطاقة إلى تحمّل الكثير من الثقل العاطفي لشخص آخر، أو إغفال احتياجاتك داخل رابط ما. يمكنك أن تسأل أين قد يحميك حدّ لطيف ويحمي العلاقة معًا. فرعاية نفسك قد تكون جزءًا من رعاية شخص آخر.
  workUpright: >-
    في العمل، قد تعكس هذه البطاقة أدوارًا تستدعي التعاطف، كأعمال الرعاية أو التعليم أو الإبداع أو الدعم، أو ببساطة أن تكون الزميل الذي يثق به الآخرون. وقد تدعوك إلى تقدير الذكاء العاطفي بوصفه مهارة حقيقية. فالإصغاء الجيد قد يشكّل النتائج بقدر أي استراتيجية.
  workReversed: >-
    في الوضع المعكوس، قد تعكس البطاقة إنهاكًا عاطفيًا من كونك سند الجميع في العمل. يمكنك أن تلاحظ أين تتبنى ضغوط الآخرين كأنها ضغوطك. ويمكنك توضيح ما يخصك أن تحمله وما لا يخصك، وإيجاد طرق صغيرة لاستعادة طاقتك خلال اليوم.
  growthUpright: >-
    في النمو الشخصي، تدعوك ملكة الكؤوس إلى تعميق علاقتك بحدسك ومشاعرك. يمكنك الجلوس بهدوء مع سؤال ما وملاحظة ما يطفو قبل أن تفكر فيه مليًّا. وقد تساعدك ممارسات مثل الكتابة في المذكرات أو الوقت قرب الماء على الإصغاء إلى الداخل.
  growthReversed: >-
    في الوضع المعكوس، قد تطلب منك هذه البطاقة أن تمد الرحمة إلى نفسك. قد تلاحظ نقدًا ذاتيًا لن توجهه أبدًا إلى صديق. والعادات اللطيفة والراحة والحدود قد تساعدك على الشعور بالثبات. وإن صارت المشاعر غامرة، فالتواصل مع شخص تثق به قد يقدّم الدعم.
