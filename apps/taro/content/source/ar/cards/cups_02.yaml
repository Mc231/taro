shortUpright: >-
  لحظة لملاحظة أين تتدفق الرعاية في الاتجاهين، وما الذي يجعل الرابط متكافئًا وحيًّا.
shortReversed: >-
  قد يبدو شيء ما بينك وبين شخص آخر مختل التوازن؛ يمكنك التفكير فيما يطلبه كل منكما حقًا.
meaningUpright: |-
  يُظهر اثنان من الكؤوس شخصين، أو جانبين من حياة واحدة، يلتقيان على قدم المساواة ويقدّم كل منهما شيئًا للآخر. إنها بطاقة الاعتراف المتبادل: الارتياح لأنك مفهوم، ومتعة أن تفهم شخصًا في المقابل. وقد يكون الرابط الذي تصفه رومانسيًا، لكنه قد يكون بالسهولة نفسها صداقة، أو تعاونًا إبداعيًا، أو رابطة أخوة، أو شراكة عمل.
  قد تتعرف على هذه الطاقة في حديث يصغي فيه الطرفان، أو في مصالحة بعد سوء فهم، أو في الاتفاق الهادئ بين شخصين يختاران أن يواصلا الحضور أحدهما للآخر. وقد تعكس أيضًا الجمع بين جانبين منك كانا يشدّان في اتجاهين مختلفين.
  تدعوك هذه البطاقة إلى ملاحظة المواضع التي فيها أخذ وعطاء حقيقيان في حياتك، وتكريمها. فالتبادل لا يعني عدّ النقاط، بل يعني أن يشعر الطرفان بحرية العطاء والتلقي وقول ما يحتاجان إليه.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يشير اثنان من الكؤوس إلى رابط مال عن توازنه. ربما يعطي طرف أكثر، أو يصغي أقل، أو ربما يتحدث شخصان دون أن يلتقيا. لا يعني ذلك بالضرورة أن شيئًا ما قد انكسر؛ فكثير من الروابط تمر بمواسم كهذه.
  وقد تنقلب البطاقة أيضًا إلى الداخل، فتسأل عن مدى حسن مصاحبتك لنفسك. هل تمنح احتياجاتك من الصبر والإنصاف بقدر ما تحاول أن تمنح احتياجات غيرك؟
  يمكنك النظر إلى علاقة تبدو غير متكافئة، والسؤال عمّا يأمله كل طرف حقًا تحت سطح الخلاف. حديث هادئ وصادق، أو قليل من المسافة لرؤية أوضح، قد يكون أنفع من محاولة إصلاح كل شيء دفعة واحدة. فالتوازن شيء يبنيه الناس معًا، تبادلًا بعد تبادل.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس هذه البطاقة انجذابًا متبادلًا، أو صداقة، أو شراكة يشعر فيها الطرفان بأنهما مرئيان. وقد تدعوك إلى ملاحظة الطقوس الصغيرة التي تحافظ على ثبات الرابط: الاطمئنان، وتذكّر ما يهم الطرف الآخر، والاعتذار ببساطة. يمكنك أن تسأل نفسك عمّا تقدّره أكثر في شخص قريب، وما إذا كان يعرف ذلك.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تعكس هذه البطاقة رابطًا يحمل فيه طرف واحد الجزء الأكبر من الثقل العاطفي، أو سوء فهم لم يُبدَّد بعد. يمكنك التفكير فيما ستقوله لو عرفت أنه سيُسمع بلطف. فالترميم يبدأ غالبًا بجملة صادقة واحدة، واستعداد لسماع الرد دون الدفاع عن نفسك فورًا.
  workUpright: >-
    في العمل، قد يشير اثنان من الكؤوس إلى تعاون واعد، أو زميل تثق به، أو علاقة مع عميل مبنية على الاحترام. وقد يدعوك إلى تقاسم الفضل، وطلب الآراء، وصياغة الاتفاقات بوضوح كافٍ ليشعر الطرفان بالأمان. فالشراكات الجيدة تنمو غالبًا من القيم المشتركة أكثر من المهارات المشتركة.
  workReversed: >-
    في الوضع المعكوس، قد تعكس البطاقة علاقة عمل توقعاتها غير معلنة أو غير متكافئة. ربما يفترض طرف وجود اتفاق حيث لا اتفاق. يمكنك تسمية ما يتوقعه كل منكما بكلمات بسيطة، والتحقق مما إذا كانت أدواركما لا تزال مناسبة. فالوضوح قد يكون لطفًا، حتى حين يبدو الحديث محرجًا في البداية.
  growthUpright: >-
    الشراكة الداخلية هي موضوع النمو هنا، فرصة للمصالحة بين أجزاء منك: ما تريده وما تقدّره، أو جانبك العملي وجانبك الرقيق. يمكنك كتابة حوار قصير بين صوتين في داخلك، وترى أين يتفقان بالفعل. فالاندماج قد يشبه العثور على شريك في الداخل.
  growthReversed: >-
    في الوضع المعكوس، قد تسأل هذه البطاقة ما إذا كنت تعتمد على الآخرين في إحساس بالتوازن يمكنك أيضًا أن تبنيه في داخلك. يمكنك أن تلاحظ أين تبحث عن الاستحسان قبل أن تثق برأيك. ومعاملة نفسك بالإنصاف ذاته الذي تمنحه لصديق مقرّب قد تكون ممارسة تمنح الثبات، اختيارًا صغيرًا بعد آخر.
reflectionQuestions:
  - "ما الذي يجعلك تشعر بأن شخصًا آخر يلاقيك حقًا؟"
  - >-
    أين يبدو رابط في حياتك غير متكافئ، وما الذي قد يعيد إليه شيئًا من التوازن؟
  - "كيف يمكنك أن تعبّر عن تقديرك لشخص يواصل الحضور من أجلك؟"
imageryNote: >-
  تجمع الصورة شخصين، أو يدين، يرفع كل منهما كأسًا نحو الآخر عبر مسافة صغيرة. وبينهما شعار مشترك، كسيقان متشابكة أو سمكتين توأمين، قد يوحي بأن اللقاء يخلق شيئًا لا يملكه أيّ منهما وحده. وقد تعبّر الألوان المتناظرة على الجانبين عن التكافؤ، مع توهج لطيف حيث تكاد الكأسان تتلامسان، كأن الرابط نفسه يشعّ ضوءًا.
