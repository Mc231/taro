shortUpright: >-
  الدفء العملي والرعاية متاحان لك. يمكنك ملاحظة كيف تصنع الراحة للآخرين، وما إذا كنت تشمل نفسك.
shortReversed: >-
  قد تتدفق الرعاية إلى الخارج بينما تنفد طاقتك. يمكنك النظر في كيفية رعاية احتياجاتك بالدفء نفسه الذي ترعى به احتياجات الآخرين.
meaningUpright: |-
  تجلس ملكة العملات في مكان خصب مزروع، ممسكة بعملة في حجرها كأنها تحتضن شيئًا حيًّا. ترمز هذه الملكة إلى رعاية عملية: وجبة جاهزة حين يصل أحدهم، وبيت يبعث على الراحة، وميزانية تُدار بعناية، وحديقة تُطعم الناس. الطاقة هنا دافئة ومدبّرة وراسخة، وهي صفات يمكن لأي أحد أن يحملها.
  قد تتعرف على ذلك في رعاية بيت، أو دعم صديق خلال وقت مزدحم، أو جعل مساحة عمل مرحِّبة، أو إدارة الوقت والموارد بحيث يكفي الجميع. وقد تعكس أيضًا العناية بجسدك ومحيطك: الراحة، والطعام المغذي، والهواء النقي، والأماكن التي يطيب البقاء فيها.
  تدعوك هذه البطاقة إلى ملاحظة المهارة الهادئة في صنع الراحة والاستقرار. كيف ترعى الآخرين ومحيطك؟ هل تمنح نفسك الرعاية ذاتها؟ يمكنك اختيار طريقة واحدة لجعل حياتك اليومية أكثر تغذية قليلًا، وترك اللطف العملي يبدأ من البيت.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد تعكس ملكة العملات رعاية صارت مائلة إلى جهة. ربما ترعى الجميع ما عدا نفسك، وتعمل وخزّانك فارغ بينما يشعر الآخرون بالدعم. أو قد تميل الرعاية إلى السيطرة، فتصبح المساعدة إدارة، ولا يبقى للآخرين إلا القليل من المساحة لإيجاد طريقهم الخاص.
  تطلب منك هذه القراءة مراجعة طريقة تدفق الرعاية. فالرعاية قيّمة، وتعمل جيدًا حين تكون قابلة للاستمرار ومحترمة لكل المعنيين، وأنت منهم.
  يمكنك أن تسأل عمّا تحتاج إليه وتؤجله. هل يمكن لشخص آخر أن يتولى مهمة ما؟ هل يمكنك أن تترك معيارًا ما ينخفض قليلًا دون أن ينهار البيت كله؟ فرعاية طاقتك ومساحتك وراحتك ليست أنانية؛ بل قد تكون ما يتيح لرعايتك أن تدوم.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس هذه البطاقة رعاية دافئة وعملية: أن تجعل شخصًا يشعر بأنه في بيته، وأن تدعمه بطرق ملموسة، وأن تصنعا معًا قاعدة مستقرة. يمكنك أن تلاحظ كيف تعبّر عن الحب بالأفعال، وكيف يفضّل من حولك تلقيه. فوجبة مشتركة أو أمسية هادئة قد تحمل معنى كبيرًا.
  relationshipsReversed: >-
    في الوضع المعكوس، قد توحي البطاقة بأنك تعطي من الرعاية أكثر مما تتلقى، أو بأن المساعدة تحولت إلى إدارة اختيارات شخص آخر. يمكنك الحديث بانفتاح عن التوازن وطلب الدعم في المقابل. فالسماح للآخرين برعايتك قد يعمّق القرب.
  workUpright: >-
    في العمل، قد تصف ملكة العملات كفاءة مقرونة بالدفء: إدارة الموارد جيدًا، ودعم الزملاء، وصنع بيئة يستطيع فيها الناس إنجاز عمل جيد. يمكنك إدراك موهبتك في جعل الأمور تسير بسلاسة، والتفكير في كيفية مشاركة هذه المهارة دون أن تحملها وحدك.
  workReversed: >-
    هنا قد تعكس البطاقة إجهاد نفسك من أجل الآخرين في العمل، أو صعوبة في الموازنة بين العمل والحياة في البيت. يمكنك النظر في المسؤوليات التي تخصك حقًا ووضع حدود حول وقتك. فالرعاية المستدامة لفريق تشمل رعاية نفسك.
  growthUpright: >-
    في النمو الشخصي، تدعوك هذه البطاقة إلى رعاية نفسك عمليًا: وجبات منتظمة، وراحة، ووقت في الهواء الطلق، ومساحة مريحة. يمكنك أن تصنع روتينًا صغيرًا واحدًا للعناية بالذات يمنحك الثبات، وتتعامل معه بوصفه التزامًا مهمًا لا إضافة اختيارية.
  growthReversed: >-
    في الوضع المعكوس، قد تعكس البطاقة عادة وضع احتياجاتك في آخر القائمة، أو قياس قيمتك بمقدار ما تفعله للآخرين. يمكنك أن تستكشف من أين جاء هذا النمط. فمنح نفسك الصبر ذاته الذي تمنحه للآخرين قد يعيد الطاقة والبهجة معًا.
