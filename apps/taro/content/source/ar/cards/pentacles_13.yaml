imageryNote: >-
  قد تُظهر الصورة شخصية متوّجة جالسة على عرش منحوت داخل حديقة مزهرة، تمسك عملة برفق في حجرها. وقد تحيط بالعرش أزهار وثمار وحيوان صغير كالأرنب، وربما يجري جدول قريب. قد ترمز الحديقة إلى وفرة تأتي من الرعاية، والعملة المحتضنة إلى عناية يقظة بالموارد، والحيوان إلى الغنى الإبداعي والراحة في عالم الطبيعة.
