  workUpright: >-
    في العمل أو في مشروع ما، يسلّط الرجل المشنوق الضوء على توقف لإعادة التفكير. قد يكون التأخير محبطًا، لكنه قد يمنح وقتًا لمساءلة الافتراضات، أو البحث في البدائل، أو ترك فكرة تنضج. يمكنك استخدام فترة بطيئة للنظر إلى عملك من زاوية مختلفة تمامًا.
  workReversed: >-
    في الوضع المعكوس، قد يعكس الرجل المشنوق مشروعًا عالقًا منذ وقت طويل أو قرارًا يُؤجَّل بلا نهاية. يمكنك أن تسأل ما المعلومات أو الدعم الذي تنتظره حقًا. وضع موعد نهائي لطيف لنفسك، أو اختيار التخلي عن أحد الخيارات، قد يساعد على عودة الحركة.
  growthUpright: >-
    التخلي مهارة، والرجل المشنوق يقدّم فرصة للتمرن عليها. ما تتخلى عنه قد يكون قناعة، أو توقعًا، أو عادة الاستعجال. يمكنك أن تجرّب فعل أمر مألوف بترتيب معكوس أو من زاوية جديدة، وتلاحظ ما يكشفه هذا الاضطراب الصغير عن طريقتك المعتادة في رؤية العالم.
  growthReversed: >-
    في الوضع المعكوس، قد يسأل الرجل المشنوق ما إذا كنت تتجنب السكون أو تعلق فيه. وقد يعكس قلقًا أو إحساسًا بالتعليق. يمكنك أن تتفقد نفسك: هل هذا وقت للصبر أم وقت لدفعة لطيفة؟ إجابتك الصادقة قد ترشد خطوتك التالية.
