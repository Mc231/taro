shortUpright: >-
  ربما تلتفت إلى الداخل لبعض الوقت؛ تدعوك هذه البطاقة إلى ملاحظة ما يُعرض عليك بينما تتأمل.
shortReversed: >-
  قد يعود الاهتمام بعد فترة هادئة؛ يمكنك التفكير في الدعوة التي تبدو جديرة بالقبول الآن.
meaningUpright: |-
  كثيرًا ما يُظهر أربعة من الكؤوس شخصًا يجلس منعزلًا، ينظر إلى ثلاث كؤوس أمامه بينما تُقدَّم له كأس رابعة، ربما دون أن يلاحظها. إنها بطاقة توقف ووزن داخلي. شيء كان يرضيك يومًا ربما فقد مذاقه، ولا تعرف بعد مما قد يحل محله.
  قد يبدو ذلك مللًا من روتين ما، أو شعورًا باهتًا بعد بلوغ هدف، أو رغبة في الابتعاد عن الحياة الاجتماعية لبعض الوقت. وقد يكون أيضًا تأملًا حقيقيًا: أخذ الوقت للتفكير فيما تريده قبل قول نعم لأي شيء آخر.
  الانسحاب ليس فشلًا. أحيانًا يكون تمامًا ما يحتاج إليه قلب متعب. والبطاقة تدعوك ببساطة إلى الحفاظ على الفضول بدلًا من الانغلاق. وبينما تجلس مع أفكارك، يمكنك أن ترفع بصرك بين حين وآخر وتلاحظ ما يُمدّ إليك. فعرض للمساعدة، أو فكرة جديدة، أو لطف صغير قد يكون أقرب مما يبدو، ولك الحرية في أن تقرر ما إذا كان يناسبك.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس أربعة من الكؤوس نقطة تحول بعد فترة انسحاب. قد تشعر بالاستعداد لرفع بصرك من جديد، مع انفتاح على أحاديث وإمكانات بدت مملة أو بعيدة المنال من قبل. وقد يعود الفضول بهدوء، أولًا على هيئة تململ، ثم على هيئة اهتمام.
  وقد يشير أيضًا إلى الاتجاه الآخر: انسحاب امتد أطول مما أفاد، وصار عادة رفض. يمكنك أن تلاحظ ما إذا كنت تعتذر عن الدعوات بدافع حاجة حقيقية أم بدافع الجمود فحسب.
  وفي الحالتين، تدعو هذه البطاقة إلى وقفة لطيفة مع النفس. ما الذي بدأ يلفت انتباهك من جديد، إن وُجد؟ لست مضطرًا إلى قبول كل عرض يصل. واختيار شيء صغير واحد للمشاركة فيه، وملاحظة شعورك تجاهه، قد يكفي لمعرفة ما تشعر بالاستعداد له الآن.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد يعكس أربعة من الكؤوس حاجة إلى مساحة، أو إحساسًا بأن رابطًا ما صار روتينيًا. وقد يدعوك إلى السؤال عمّا إذا كنت تغفل عن رعاية تُقدَّم إليك، كلفتة أو سؤال أو دعوة. يمكنك أن تخبر شخصًا قريبًا بأنك تحتاج إلى وقت للتفكير، كي لا تُفهم المسافة على أنها عدم اهتمام.
  relationshipsReversed: >-
    في الوضع المعكوس، قد توحي هذه البطاقة باستعادة الصلة بعد فترة انطواء. قد تشعر باستعداد أكبر لسماع ما كان شخص ما يحاول قوله، أو للمبادرة بالتواصل. وإن كنت لا تزال تحتاج إلى مساحة، فقول ذلك بلطف قد يحمي الرابط. واللحظات المشتركة الصغيرة، كنزهة أو وجبة، قد تكون طريقة مريحة لإيجاد طريق العودة.
  workUpright: >-
    في العمل، قد تعكس هذه البطاقة تململًا، أو إحساسًا بأن المهام لم تعد تعني الكثير، أو توقفًا لإعادة تقييم الاتجاه. وقد تدعوك إلى النظر مجددًا في فرص صرفت النظر عنها بسرعة. فحديث، أو مسؤولية جديدة، أو دورة تجاهلتها، قد يستحق نظرة ثانية، حتى لو لم تكن الشرارة حاضرة بعد.
  workReversed: >-
    في الوضع المعكوس، قد تشير البطاقة إلى عودة الدافع، أو إلى استعداد لقول نعم لشيء جديد. يمكنك أن تلاحظ أيّ المشاريع بدأت تثير اهتمامك من جديد. وإن شعرت بالعلوق في دوامة من الرفض، يمكنك تجربة التزام صغير واحد ثم التأمل بعده فيما إذا كان قد منحك طاقة أم أخذ منها.
  growthUpright: >-
    في النمو الشخصي، يدعو أربعة من الكؤوس إلى تأمل صادق فيما يرضيك حقًا. يمكنك أن تدوّن الأشياء التي تفعلها بدافع العادة، وتسأل أيّها لا يزال مهمًا. فالوقت الهادئ قد يكون قيّمًا، ما دام اختيارًا لا مكانًا تشعر فيه بأنك عالق.
  growthReversed: >-
    في الوضع المعكوس، قد تعكس هذه البطاقة خروجًا من فترة تأمل بأولويات أوضح. قد تلاحظ عودة الامتنان لأشياء كنت تعدّها من المسلّمات. وقد يفيد أن تدوّن ما تعلّمته أثناء انطوائك، كي تبقى البصيرة معك حين تزدحم الحياة من جديد.
reflectionQuestions:
  - "ما الذي فقد جاذبيته بالنسبة إليك مؤخرًا، وماذا قد يخبرك ذلك؟"
  - "ما الذي قد يعرضه عليك شخص ما ولم تلاحظه تمامًا؟"
  - >-
    ما الدعوة الصغيرة التي يمكنك أن تقول لها نعم، لمجرد أن ترى شعورك؟
imageryNote: >-
  تضع الصورة شخصًا جالسًا تحت شجرة أو بجوار ماء ساكن، ذراعاه معقودتان ونظره منخفض نحو ثلاث كؤوس على الأرض. وتنجرف كأس رابعة نحوه مع النسيم أو تطفو على سطح الماء، فيسهل أن تفوته. وقد توحي الألوان الخافتة والوقفة المنغلقة بالانطواء والحاجة إلى التوقف، فيما تُبقي الكأس المعروضة خيطًا من الإمكانية في مجال الرؤية.
