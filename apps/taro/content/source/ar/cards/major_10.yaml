imageryNote: >-
  تُتخيَّل عجلة الحظ في Taro عجلة عظيمة دوّارة في سماء تتدرج من الفجر عند أحد طرفيها إلى الليل عند الطرف الآخر، فتُظهر كل المراحل في آن. تركب على حافتها شخوص ومخلوقات صغيرة، بعضها يصعد وبعضها يهبط، ولا يبقى أيّ منها ساكنًا. وقد تؤطر رموز الفصول الأربعة في الزوايا فكرة الدورات الطبيعية. وفي المحور، يوحي مركز هادئ لا يتحرك بالمنظور الثابت الذي يمكن العثور عليه حتى حين يدور كل شيء.
