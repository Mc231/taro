shortUpright: >-
  الأمور تدور. تدعوك هذه البطاقة إلى ملاحظة الدورة التي تعيشها وكيف تريد أن تتحرك معها.
shortReversed: >-
  قد يعود نمط مألوف من جديد. ما الذي يمكنك فعله بشكل مختلف هذه المرة؟
meaningUpright: |-
  عجلة الحظ هي بطاقة الدورات. فالفصول تتعاقب، والأمزجة ترتفع وتنخفض، وفترات الانشغال تفسح المجال لفترات هادئة. لا شيء يبقى في القمة أو في القاع إلى الأبد. تذكّرك هذه البطاقة بأن التغيير جزء طبيعي من الحياة، وبأن بعضه خارج سيطرة أي أحد، بينما يستجيب بعضه الآخر لطريقة ملاقاتك له.
  في الحياة اليومية، قد تعكس هذه البطاقة نقطة تحول: فصل يُغلق وآخر يُفتح، أو فرصة طيبة تغيّر خططك، أو انتكاسة غير متوقعة تغيّر إيقاعك. وقد تشير أيضًا إلى إدراك نمط ظهر من قبل، كأن يأتي النوع نفسه من المواقف في شكل جديد، فتراه بعين جديدة.
  تدعوك هذه البطاقة إلى التفكير في موقعك من عجلتك الخاصة الآن. يمكنك أن تسأل ما الذي تطلبه منك هذه المرحلة، وما الذي قد تعلّمك إياه. لا تقرر العجلة حياتك نيابةً عنك؛ بل تسلّط الضوء على أن المرونة والمنظور الأوسع وروح الدعابة قد تساعدك على اجتياز المنعطفات، وعلى أن الموسم الصعب موسم، لا حالة دائمة.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد تعكس عجلة الحظ إحساسًا بالدوران في حلقة مفرغة، أو مقاومة تغيير بدأ بالفعل. قد تشعر بأن الأحداث تقع عليك، أو تلاحظ أن النمط المحبط نفسه يعود مرتديًا ثيابًا مختلفة.
  وقد تشير هذه البطاقة أيضًا إلى التمسك بقوة بمرحلة جيدة خوفًا من ألا تدوم. فالتشبث يجعل الدوران الطبيعي أصعب.
  ربما يفيدك أن تنظر إلى ما هو في متناولك. فالأنماط تتكرر غالبًا حتى يتغير شيء في طريقة استجابتنا، ولو قليلًا. قد يساعد أن تسمّي الدورة التي تراها، وتلاحظ دورك فيها دون لوم، وتختار أمرًا صغيرًا واحدًا تفعله بشكل مختلف. لا يمكنك إيقاف العجلة، لكن يمكنك أن تجد عليها موطئ قدم أثبت.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس العجلة مرحلة جديدة: تقاربًا أكبر، أو انتقالًا إلى طور مختلف، أو مجرد تكيّف مع ظروف متغيرة. وقد تدعوك إلى الحفاظ على المرونة والحديث بانفتاح عن الطريقة التي تتبدل بها الأمور. للعلاقات، كالفصول، إيقاعاتها، وتسميتها قد تساعدكما على عبورها معًا.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تشير هذه البطاقة إلى خلافات مألوفة تعود باستمرار، أو إلى مقاومة تغيّر شكل العلاقة. يمكنك التفكير في النمط الذي تميل أنت وشخص قريب منك إلى تكراره، وما الذي يمكن لكل منكما أن يجرّبه بشكل مختلف. التغيير لا يعني بالضرورة الخسارة؛ قد يعني النمو.
  workUpright: >-
    في العمل أو في مشروع ما، تسلّط العجلة الضوء على ظروف متبدلة وأبواب جديدة. وقد تعكس تغييرًا في الخطط، أو فريقًا جديدًا، أو مشروعًا يتقدم فجأة. يمكنك أن تحافظ على انتباهك للفرص، مع تذكّر أن كل مرحلة، مزدحمة كانت أو بطيئة، لديها ما تقدّمه.
  workReversed: >-
    في الوضع المعكوس، قد تعكس العجلة إحباطًا من التأخير، أو شعورًا بأن الجهد لا يؤتي ثماره. وقد تشير أيضًا إلى تكرار النهج نفسه مع توقّع نتيجة مختلفة. يمكنك مراجعة ما نجح من قبل وما لم ينجح، وأين قد يغيّر تعديل صغير في الأسلوب هذا النمط.
  growthUpright: >-
    رؤية حياتك سلسلةً من الدورات، لا خطًا مستقيمًا واحدًا، قد تكون محرِّرة. وملاحظة إيقاعاتك الخاصة، كأوقات شعورك بالنشاط أو حاجتك إلى الراحة، قد تساعدك على التخطيط معها لا ضدها. يمكنك أن ترسم خريطة للعام الماضي وتلاحظ نقاط تحوله.
  growthReversed: >-
    في الوضع المعكوس، قد تسأل العجلة ما إذا كنت تحاول التحكم فيما لا يمكن التحكم فيه. وقد تعكس رغبة في اليقين في زمن متغير. يمكنك أن تتمرن على التخلي عن أمر واحد لا تستطيع التأثير فيه، وتوجيه تلك الطاقة إلى أمر واحد تستطيع التأثير فيه.
