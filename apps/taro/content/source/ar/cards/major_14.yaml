shortUpright: "مزيج أبطأ وأثبت مما تحتاج إليه قد يجلب راحة أكثر من أي تطرف."
shortReversed: >-
  قد يكون شيء ما مائلًا أكثر من اللازم نحو جهة واحدة. تدعوك هذه البطاقة إلى الملاحظة وإعادة التوازن بلطف.
meaningUpright: |-
  الاعتدال هو بطاقة مزج الأشياء بالمقدار الصحيح. كثيرًا ما تُظهر صورته ماءً يُسكب بين إناءين، بعناية، فلا يُراق منه إلا القليل. المهارة ليست في اختيار شيء على حساب آخر، بل في المزج بينهما: العمل والراحة، الفعل والصبر، ما تريده الآن وما ستريده لاحقًا.
  في الحياة اليومية، قد تعكس هذه البطاقة إيجاد إيقاع ناجح، كجدول فيه مساحة كافية، أو تسوية تحترم الطرفين، أو عادة تُعدَّل قليلًا قليلًا حتى تبدو مناسبة. وقد تشير إلى الرضا الهادئ الذي يمنحه الاعتدال، وهو أقل إثارة من التطرف لكنه غالبًا أكثر قابلية للاستمرار.
  تدعوك هذه البطاقة إلى التفكير في المواضع التي قد تحتاج فيها حياتك إلى قليل من التوازن. يمكنك أن تسأل أيّ الجوانب تبدو مكتظة وأيّها يبدو مهمَلًا، وما التعديلات الصغيرة التي قد تقرّب بينها. يسلّط الاعتدال الضوء على الصبر: فالمزيج الجيد يحتاج إلى وقت، والتجريب اللطيف قد يعلّمك أكثر من أي تغيير جذري مفاجئ.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس الاعتدال إحساسًا باختلال التوازن. ربما تصب الكثير في مجال واحد من حياتك، كالعمل أو علاقة ما أو همّ ما، بينما يجف مجال آخر. أو ربما تلاحظ تأرجحًا بين الأطراف: كل شيء أو لا شيء، انشغال أو إنهاك، صرامة أو إهمال.
  وقد تشير هذه البطاقة أيضًا إلى نفاد الصبر تجاه عملية تحتاج إلى وقت، وإغراء بفرض النتائج بدلًا من تركها تمتزج.
  ربما يفيدك أن تجري جردًا بسيطًا. أين تبالغ، وأين تقصّر؟ اختيار تعديل لطيف واحد بدلًا من إصلاح جذري قد يساعدك على إعادة المعايرة. التوازن ليس مكانًا تصل إليه مرة واحدة؛ إنه شيء تعود إليه مرة بعد مرة، بتصحيحات صغيرة.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد يعكس الاعتدال انسجامًا مبنيًا على التسوية والتفاهم. وقد يدعوك إلى ملاقاة شخص ما في منتصف الطريق، والمزج بين أساليبكما واحتياجاتكما المختلفة، والتحلي بالصبر بينما يتعلم كل منكما إيقاع الآخر. الرعاية الهادئة الثابتة قد تجعل الرابط مريحًا.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تشير هذه البطاقة إلى علاقة تطغى فيها احتياجات طرف واحد، أو تتصاعد فيها الخلافات بسرعة. يمكنك التفكير في كيفية تخفيف الحدة: إبطاء الأحاديث، وأخذ استراحات حين تحتدم الأمور، والبحث عن نقاط الالتقاء بين ما يريده كل منكما.
  workUpright: >-
    في العمل أو في مشروع ما، يسلّط الاعتدال الضوء على التقدم الثابت والتعاون الجيد. وقد يعكس الجمع بين مهارات أو أفكار مختلفة في شيء يعمل جيدًا، أو تنظيم إيقاعك بحيث تدوم طاقتك. يمكنك البحث عن نسخة من الخطة تكون طموحة وقابلة للاستمرار معًا.
  workReversed: >-
    في الوضع المعكوس، قد يعكس الاعتدال إرهاقًا من العمل، أو قرارات متسرعة، أو احتكاكًا بين أشخاص ذوي مقاربات مختلفة. يمكنك أن تسأل أين صار الإيقاع غير واقعي وما الذي يمكن تبسيطه. إيجاد طريق وسط بين الأولويات المتنافسة قد يخفف الضغط على كل المعنيين. وحتى ظهيرة واحدة بلا اجتماعات قد تُظهر كيف يبدو الإيقاع الأكثر ثباتًا.
  growthUpright: >-
    في النمو الشخصي، تدعوك هذه البطاقة إلى ممارسة الاعتدال دون جمود. يمكنك أن تلاحظ نقاط توازنك الخاصة: كم من الراحة والنشاط والوقت وحدك والوقت مع الآخرين يساعدك على الشعور بالثبات. التعديلات الصغيرة المنتظمة قد تجلب راحة أكثر من القرارات الكبيرة.
  growthReversed: >-
    في الوضع المعكوس، قد يسأل الاعتدال ما إذا كنت تعيش على الأطراف القصوى. وقد يعكس حاجة إلى الإبطاء، أو الراحة، أو إعادة مكوّن مفقود إلى أيامك. يمكنك اختيار مجال واحد لإعادة توازنه بلطف، ومنح نفسك وقتًا لترى كيف يستقر.
