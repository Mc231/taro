imageryNote: >-
  يُتخيَّل اعتدال Taro شخصًا مجنّحًا على حافة نهر بطيء، يسكب سائلًا بعناية بين إناءين مختلفين، أحدهما من الفخار والآخر من الزجاج. ينحني التيار بينهما بلطف، كأن التوازن يُكتشف في اللحظة نفسها. وتوحي حجارة العبور الممتدة عبر النهر بطريق وسط من ضفة إلى أخرى، فيما تحافظ ألوان الشروق الناعمة فوق التلال البعيدة على جو هادئ ومفعم بالأمل.
