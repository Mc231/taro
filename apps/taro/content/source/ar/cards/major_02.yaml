shortUpright: >-
  دعوة هادئة للإصغاء إلى ما تستشعره بالفعل ولم تضعه في كلمات بعد.
shortReversed: >-
  قد يطغى ضجيج الخارج على صوت أهدأ في داخلك؛ وقليل من الصمت قد يساعد.
meaningUpright: |-
  تجلس الكاهنة العليا بين عمودين، على عتبة ما هو معروف وما لا يزال خفيًا. لا تتحرك هذه الشخصية ولا تشرح؛ موهبتها الانتباه: ذلك الإصغاء العميق الصبور الذي يلاحظ ما يكمن تحت سطح موقف أو حديث أو شعور.
  في الحياة اليومية، قد تعكس هذه البطاقة حدسًا لا تستطيع تبريره بالكامل، أو إحساسًا بأن شيئًا ما لا يُقال، أو حلمًا يرافقك حتى الظهيرة. وقد تشير إلى لحظات لا تُوجد فيها الإجابة بجمع مزيد من المعلومات، بل بالجلوس بهدوء مع ما لديك. بعض الأمور لا تتضح إلا حين تتوقف عن الإلحاح في طلب الوضوح.
  تدعوك هذه البطاقة إلى الثقة بالأجزاء الأبطأ والأقل كلامًا في نفسك. يمكنك أن تخصص وقتًا للكتابة في مذكراتك، أو لنزهة دون سماعات، أو لمجرد وقفة قبل الرد. المعرفة الداخلية ليست بديلًا عن الحقائق، ويمكنها أن تسير إلى جانبها. تسألك الكاهنة العليا أن تلاحظ ما يحاول صوتك الأهدأ أن يقوله لك، وأن تمنحه بعض المساحة قبل أن تقرر ما ستفعله.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد توحي الكاهنة العليا بأن صوتك الداخلي حاضر لكن سماعه صعب. فالأيام المزدحمة وآراء الآخرين وتدفق الشاشات المستمر قد تزاحم السكون الذي تحتاج إليه هذه البطاقة. قد تلاحظ أنك تواصل سؤال الآخرين عمّا تفعله في أمر تعرفه جزئيًا بالفعل.
  وقد تشير هذه البطاقة أيضًا إلى كتمان شيء ما لوقت طويل: شعور أو سؤال أو حقيقة ظلت مخفية وصارت الآن ثقيلة. الخصوصية أمر صحي؛ أما الكتمان الذي يعزلك فقد يستحق نظرة ثانية.
  ربما يفيدك أن تصنع جيبًا صغيرًا من الهدوء وترى ما يطفو على السطح. قد يساعد أن تكتب دون تحرير، أو أن تطرح على نفسك سؤالًا بسيطًا واحدًا وتنتظر أول إجابة صادقة. ما الذي استشعرته ولم تسمح لنفسك بقوله بعد؟
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس الكاهنة العليا رابطًا يُفهم فيه الكثير دون كلمات، أو لحظة يكون فيها الإصغاء أهم من الكلام. وقد تدعوك إلى ملاحظة التيارات الخفية: ما قد يعنيه صمت صديق، أو ما يحميه ترددك أنت. يمكنك أن تهدي شخصًا قريبًا انتباهًا غير مستعجل.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تشير هذه البطاقة إلى أمور بقيت دون قول بينك وبين شخص قريب، أو إلى عادة القراءة بين السطور بدلًا من السؤال المباشر. يمكنك التفكير فيما إذا كان سؤال لطيف وصادق قد يحل محل التخمين. وقد تعكس أيضًا حاجة إلى حماية عالمك الداخلي مع السماح لأحدهم برؤية المزيد منه قليلًا.
  workUpright: >-
    في العمل أو في مشروع ما، قد توحي الكاهنة العليا بأنه ليس على كل قرار أن يُتخذ اليوم. وقد تدعوك إلى المراقبة وجمع الانطباعات والثقة بإحساسك بالتوقيت. الأعمال التأملية مثل البحث والكتابة والتخطيط والإرشاد تناسب هذه البطاقة. وقد يُقدَّر الإتقان الهادئ والكتمان أكثر مما تدرك.
  workReversed: >-
    في الوضع المعكوس، قد تعكس الكاهنة العليا تشكيكًا في حدس سليم لأن أصوات الآخرين أعلى، أو معلومات تُحجب داخل فريق. يمكنك أن تسأل ما الذي تعرفه عن موقف ما ولم تفصح عنه. إيجاد طريقة هادئة ومناسبة لمشاركته قد يجعل العمل أوضح للجميع، وأنت منهم.
  growthUpright: >-
    يميل النمو مع الكاهنة العليا إلى أن يبدأ في السكون. يمكنك أن تجرّب بضع دقائق يوميًا لمجرد ملاحظة أفكارك أو أنفاسك أو ما حولك دون محاولة إصلاح أي شيء. ومع الوقت، قد يساعدك هذا النوع من الانتباه على التمييز بين الثرثرة القلقة وإحساس داخلي أكثر ثباتًا.
  growthReversed: >-
    في الوضع المعكوس، قد تسأل الكاهنة العليا ما إذا كنت تعيش على السطح في الآونة الأخيرة، تتفاعل بدلًا من أن تتأمل. وقد تكون دفعة لطيفة للعودة إلى الداخل، دون ضغط للعثور على إجابات فورية. يمكنك أن تخصص طقسًا هادئًا واحدًا هذا الأسبوع وتلاحظ ما يتغير حين تمنح نفسك مساحة للإصغاء.
