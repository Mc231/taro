imageryNote: >-
  تُتخيَّل كاهنة Taro العليا جالسة على عتبة باب يغمره ضوء القمر، نصفها في الضوء ونصفها في الظل، وعلى ركبتيها كتاب مغلق. وخلفها ستارة تتحرك كأن شيئًا ينتظر وراءها. قد يردد هلالٌ منعكس في حوض ساكن صدى الدورات والحدس، وتوحي درجات الأزرق العميق بهدوء على السطح وعمق تحته. أما سكونها الهادئ اليقظ فهو مركز الصورة.
