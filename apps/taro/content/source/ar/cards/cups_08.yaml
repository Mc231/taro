shortUpright: >-
  شيء ما قد لم يعد يملؤك، حتى لو بدا مكتملًا؛ تدعوك هذه البطاقة إلى ملاحظة الوجهة التي يشدّك إليها قلبك.
shortReversed: >-
  ربما تتجاذبك الرغبة في البقاء والرغبة في الرحيل؛ يمكنك التفكير فيما تحتاج إلى معرفته قبل اختيار أيّ منهما.
meaningUpright: |-
  كثيرًا ما يُظهر ثمانية من الكؤوس شخصًا يبتعد عن صف مرتب من الكؤوس، متجهًا نحو أرض مفتوحة تحت سماء ليلية. الكؤوس ليست مكسورة ولا منسكبة. الأمر ببساطة أن شيئًا فيها لم يعد يرضي، وقد قرر الشخص أن يبحث عمّا ينقص.
  تتحدث هذه البطاقة عن الشجاعة الهادئة في ترك شيء يبدو جيدًا من الخارج: دور، أو روتين، أو هوية، أو طريقة عيش لم تعد تبدو صادقة. وكثيرًا ما يكون ذلك أقل شبهًا بخروج درامي منه بإدراك بطيء بأنك تجاوزت شيئًا ما.
  في الحياة اليومية، قد تعكس رغبة في مزيد من المعنى في عملك، أو حاجة إلى وقت وحدك للتفكير، أو ابتعادًا عن موقف يستنزفك. تدعوك البطاقة إلى أخذ هذا التوق على محمل الجد. فالابتعاد لا يتحتم أن يكون مفاجئًا أو دائمًا؛ قد يكون مسافة تجريبية، أو استراحة للذهن. يمكنك أن تسأل عمّا تبحث عنه حقًا، وعمّا تستعد لتركه خلفك للعثور عليه.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس ثمانية من الكؤوس حيرة بين البقاء والرحيل. قد تستشعر أن شيئًا ما ليس على ما يرام، لكنك لا تعرف إن كان عليك المضي أم المحاولة من جديد. فالخوف من المجهول، أو الوفاء لما بنيته، قد يبقيك في مكانك.
  وقد يشير أيضًا إلى النمط المعاكس: الرحيل مرة بعد مرة، والتنقل من شيء إلى آخر دون منح أي شيء فرصة التعمق.
  تدعوك هذه البطاقة إلى الإبطاء والنظر في الاختيار عن قرب. كيف سيبدو البقاء لو كان اختيارًا لا مجرد ركون إلى الوضع القائم؟ وما الذي يتطلبه الرحيل؟ يمكنك مناقشة الأمر مع شخص تثق به، أو وضع موعد لطيف للقرار. وأيًّا كان الاتجاه الذي تختاره، فاتخاذ القرار عن وعي قد يجلب إحساسًا بالسلام.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس هذه البطاقة رغبة في مزيد من العمق، أو إدراكًا بأن رابطًا ما قد استنفد شكله الحالي. وقد تدعو إلى تأمل صادق فيما تحتاج إليه وما ينقص. وقد يعني التراجع خطوة حديثًا عن التغيير، أو مزيدًا من المساحة الشخصية، أو أحيانًا اختيار نوع مختلف من الروابط.
  relationshipsReversed: >-
    في الوضع المعكوس، قد يعكس ثمانية من الكؤوس ترددًا بشأن علاقة لا تبدو مُرضية، أو نمطًا من الانسحاب كلما ازداد القرب. يمكنك أن تسأل ما إذا كنت تبقى بدافع الحب أم الخوف، وما إذا كنت ترحل بدافع الحاجة أم العادة. والتواصل الواضح اللطيف قد يساعد في الحالتين.
  workUpright: >-
    في العمل، قد تعكس هذه البطاقة رغبة في غاية أكبر، حتى حين يبدو كل شيء مستقرًا. وقد تدعوك إلى استكشاف ما قد يبدو أكثر معنى، ربما بتجربة مجال جديد، أو تعلّم شيء مختلف، أو إعادة تشكيل دورك الحالي. فالمضي قدمًا قد يكون تحولًا داخليًا قبل وقت طويل من أن يصبح تحولًا خارجيًا.
  workReversed: >-
    في الوضع المعكوس، قد تعكس البطاقة شعورًا بالعلوق في وظيفة أو مشروع تجاوزته، أو قفزًا بين الأدوار دون استقرار. يمكنك أن تدوّن ما ستفتقده وما ستتركه عن طيب خاطر. ويمكنك التفكير فيما إذا كان تغيير المقاربة، لا تغيير المكان، قد يلبي الحاجة التي تشعر بها.
  growthUpright: >-
    في النمو الشخصي، يدعو ثمانية من الكؤوس إلى رحلة نحو الداخل. يمكنك أن تخصص وقتًا للتأمل فيما يمنح حياتك معنى الآن، مقارنةً بما كان يمنحها من قبل. فالمشي، أو الكتابة في المذكرات، أو استراحة قصيرة من الروتين، قد تساعدك على سماع ما تستعد للتحرك نحوه.
  growthReversed: >-
    في الوضع المعكوس، قد تطلب منك هذه البطاقة ملاحظة أنماط التجنب أو التململ. هل تترك المواقف هربًا من الانزعاج، أم تبقى تجنبًا للتغيير؟ يمكنك التمرن على البقاء مع عدم اليقين وقتًا أطول قليلًا قبل الفعل. ففهم نمطك الخاص قد يجعل الاختيارات المقبلة أوضح وألطف.
