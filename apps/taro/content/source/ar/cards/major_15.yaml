imageryNote: >-
  يُتخيَّل شيطان Taro شخصًا ظليًّا ذا قرنين يجثم فوق شخصين أصغر مربوطين بمقعده بسلاسل رخوة مرتخية. وتُرسم السلاسل مرتخية بوضوح حول معصميهما، داعيةً الناظر إلى ملاحظة أنهما قادران على رفعها عنهما. ويصنع ضوء المشاعل الخافت ودرجات التراب العميقة جوًّا ثقيلًا، فيما يلمّح باب باهت من الضوء على طرف المشهد إلى أن طريقًا آخر موجود ويمكن العثور عليه.
