shortUpright: >-
  قد تمسك بك عادة أو تعلّق ما بقوة أكبر مما تدرك. ملاحظة ذلك هي الخطوة الأولى.
shortReversed: >-
  نمط كان يُحكم قبضته ذات يوم قد يكون في طور الارتخاء. ما الذي قد يساعدك على الابتعاد أكثر؟
meaningUpright: |-
  لا يتعلق الشيطان بالشر. إنها بطاقة عن الأنماط والتعلقات التي قد تمسك بنا، غالبًا بموافقتنا الصامتة. تُظهر صورتها التقليدية شخصين مقيدين بسلاسل رخوة، وعادةً ما تكون السلاسل رخوة بما يكفي لنزعها. وتسأل البطاقة: ما الذي يبقيك هنا، وكم منه اختيار؟
  في الحياة اليومية، قد تعكس هذه البطاقة تصفح الهاتف حتى وقت متأخر من الليل، أو قول نعم خوفًا من خذلان أحدهم، أو البحث عن الاستحسان أو الراحة بطرق تتركك أكثر فراغًا بعدها، أو البقاء في روتين لم يعد يخدمك لأن المغادرة تبدو غامضة أكثر من اللازم. وقد تشير أيضًا إلى أجزاء من نفسك تفضّل ألا تنظر إليها، كالحسد أو الاستياء أو الرغبة، وهي أجزاء تميل إلى أن تقوى حين تُتجاهل.
  تدعوك هذه البطاقة إلى التفكير فيما له عليك سلطة أكبر مما تود. يمكنك أن تسأل أيّ حاجة تحاول عادة ما أن تلبيها، وما إذا كانت هناك طريقة ألطف لتلبيتها. يسلّط الشيطان الضوء على الوعي دون خجل. فرؤية النمط بوضوح هي غالبًا اللحظة التي يبدأ فيها بالارتخاء.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس الشيطان ارتخاءً. فعادة أو ديناميكية في علاقة أو قناعة بدت يومًا غير قابلة للكسر قد تفقد قبضتها، وقد تبدأ في رؤية خيارات أخرى. وقد يجلب ذلك ارتياحًا مصحوبًا ببعض عدم اليقين بشأن من تكون دون النمط القديم.
  وقد تشير هذه البطاقة أيضًا إلى عمل مواجهة ظلك: النظر بصدق إلى المشاعر أو الدوافع الصعبة وتقبّلها جزءًا من كونك إنسانًا.
  ربما يفيدك أن تلاحظ أي خطوات صغيرة اتخذتها بالفعل بعيدًا عن شيء كان يمسك بك. ما الذي جعلها ممكنة؟ إبقاء أشكال الدعم تلك قريبة، وطلب المساعدة حيث لا يزال الشد قويًا، قد يجعل التغيير أكثر دوامًا. الحرية تنمو غالبًا ببطء، اختيارًا بعد اختيار.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد يعكس الشيطان أنماطًا من الاعتمادية أو الغيرة أو السيطرة، من أي جانب كانت، أو رابطًا تجمعه العادة أكثر مما تجمعه الرعاية. وقد يدعوك إلى النظر بصدق فيما يبقيكما متصلين، وما إذا كان الطرفان يشعران بالحرية. تسمية النمط بلطف قد تفتح المجال لتغييره.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تشير هذه البطاقة إلى الابتعاد عن ديناميكية غير صحية، أو وضع حدّ كان وضعه صعبًا. يمكنك التفكير في الدعم الذي تحتاج إليه للحفاظ على هذا الحد. وقد تعكس أيضًا علاقة تصبح أكثر صدقًا مع خروج المشاعر الخفية إلى العلن.
  workUpright: >-
    في العمل أو في مشروع ما، يسلّط الشيطان الضوء على الشعور بالارتباط بشيء ما: ساعات طويلة، أو حاجة إلى الاستحسان، أو دور تبقى فيه أساسًا خوفًا من التغيير. يمكنك أن تسأل ما الذي تحصل عليه من الوضع وما الذي يكلّفك، وما إذا كانت تغييرات صغيرة قد تعيد إليك الإحساس بالاختيار.
  workReversed: >-
    في الوضع المعكوس، قد يعكس الشيطان تحررًا من عادة عمل غير مفيدة، كالسعي إلى الكمال أو الإتاحة الدائمة. وقد يشير أيضًا إلى إدراك ضغط كنت قد اعتدت عليه. يمكنك حماية هذه الحرية الجديدة بحدّ واضح، كوقت لانتهاء العمل أو حدّ للرسائل بعد ساعات الدوام.
  growthUpright: >-
    يفتح الشيطان الباب لعمل الظل: استكشاف الأجزاء التي تميل إلى إخفائها من نفسك برفق. يمكنك أن تلاحظ عادة تبدو قهرية وتسأل، بفضول لا بحكم، عمّا تحاول أن تمنحك إياه. الفهم يأتي قبل التغيير.
  growthReversed: >-
    في الوضع المعكوس، قد يعكس الشيطان تقدمًا في إرخاء تعلّق قديم. وقد تكون لحظة للاعتراف بالمسافة التي قطعتها. وإن ظلت عادات أو مشاعر ثقيلة تعود، فالحديث مع شخص تثق به أو مع مختص مؤهل قد يقدّم دعمًا ثابتًا على الطريق.
