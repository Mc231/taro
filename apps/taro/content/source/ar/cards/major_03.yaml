shortUpright: >-
  شيء ما ينمو، فيك أو من حولك. وتدعوك هذه البطاقة إلى رعايته بصبر ودفء.
shortReversed: >-
  ربما تتدفق الرعاية إلى الخارج بينما ينضب معينك أنت. أين يمكن أن يعود إليك بعضها؟
meaningUpright: |-
  الإمبراطورة هي بطاقة النمو الذي يحدث بالرعاية. فحيث تصغي الكاهنة العليا إلى الداخل، تلتفت الإمبراطورة إلى العالم الحي في الخارج: الحدائق، والوجبات، والأشياء المصنوعة باليد، ومتعة الخبز الطيب أو ضوء الشمس الدافئ. ترمز هذه البطاقة إلى الإبداع الذي يغذّي، سواء كان مشروعًا أو بيتًا أو صداقة أو شعورك الخاص بالارتياح.
  في الحياة اليومية، قد تعكس هذه البطاقة موسمًا من الصنع: الطبخ للأصدقاء، أو العودة إلى الرسم، أو العناية بالنباتات أو بالناس، أو مجرد ملاحظة أنك تشعر بالألفة مع جسدك أكثر من المعتاد. وقد تشير أيضًا إلى الصبر. فالإمبراطورة تعرف أن للنمو وقته الخاص، وأن شدّ النبتة لا يجعلها تنمو أسرع.
  تدعوك هذه البطاقة إلى التفكير فيما تزرعه وكيف تزرعه. يمكنك أن تسأل أين قد يساعد قليل من الليونة أو الجمال أو الراحة شيئًا ما على الازدهار. الوفرة هنا لا تتعلق بامتلاك الكثير بقدر ما تتعلق بملاحظة ما هو حيّ من حولك بالفعل والاستمتاع به.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد تعكس الإمبراطورة رعاية فقدت توازنها. ربما تصب طاقتك في كل شخص وكل شيء ما عدا نفسك، حتى يجفّ الإبداع وتبدو حتى الأشياء الممتعة أعباءً. أو ربما تميل الرعاية إلى التدخل الزائد، فتتمسك بقوة لا تترك للآخرين مساحة كافية لينموا على طريقتهم.
  وقد تشير هذه البطاقة أيضًا إلى مشروع إبداعي متوقف، أو إلى انقطاع عن أشكال الراحة البسيطة والجسدية التي تمنحك الثبات عادةً.
  ربما يفيدك أن تنظر إلى الموضع الذي تذهب إليه رعايتك، وما إذا كان بعضها يستطيع العودة إليك. فعلٌ صغير من العناية بنفسك، كوجبة مغذية، أو نزهة متمهلة، أو بضع دقائق لصنع شيء للمتعة فقط، قد يكون طريقة لاستعادة الصلة بطاقة الإمبراطورة السخية.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس الإمبراطورة الدفء والمودة والشعور بأنك موضع رعاية، أو برعاية الآخرين بسخاء. وقد تدعوك إلى صنع الراحة معًا: وجبات مشتركة، ووقت في الهواء الطلق، وإيماءات حنان صغيرة. يمكنك أن تلاحظ كيف يحب المقربون منك أن يُعتنى بهم، وكيف تحب أنت أيضًا أن يُعتنى بك.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تسأل الإمبراطورة ما إذا كانت الرعاية في علاقة ما قد صارت من طرف واحد، أو ما إذا كان الاهتمام قد انزلق إلى إدارة اختيارات شخص آخر. يمكنك التفكير في المواضع التي قد تتراجع فيها خطوة وتثق بالطرف الآخر أكثر، وتلك التي قد تطلب فيها بانفتاح أكبر الرعاية التي تحتاج إليها أنت.
  workUpright: >-
    في العمل أو في مشروع إبداعي، تشير الإمبراطورة إلى أرض خصبة. وقد تعكس وقتًا تنمو فيه الأفكار بسهولة، وتستطيع فيه رعاية فريق، أو حديقة من المشاريع، أو عمل حِرفي بطيء ومجزٍ. وهي تدعوك إلى جعل مساحة عملك أكثر راحة، وإلى تقدير التقدم الذي يأتي من انتباه ثابت وصبور.
  workReversed: >-
    في الوضع المعكوس، قد تعكس هذه البطاقة إنهاكًا من العناية بمشاريع الجميع ما عدا مشروعك، أو تعثرًا إبداعيًا لا يبدو أن أي قدر من الدفع يحرّكه. يمكنك أن تسأل ما الذي قد يجعل العمل مغذّيًا من جديد: تغيير المكان، أو قائمة مهام أقصر، أو السماح لنفسك بصنع شيء غير مكتمل.
  growthUpright: >-
    في النمو الشخصي، تدعوك الإمبراطورة إلى الاستمتاع بوجودك في جسدك وفي العالم المادي. الراحة والطعام الجيد والوقت في الطبيعة والمتع البسيطة ليست ترفًا هنا؛ إنها طرق لاستعادة الطاقة. يمكنك أن تلاحظ ما يساعدك على الشعور بالثبات والسخاء، وأن تفسح له مساحة أكبر قليلًا.
  growthReversed: >-
    في الوضع المعكوس، قد تكون الإمبراطورة تذكيرًا لطيفًا بأنك تستحق الصبر نفسه الذي تمنحه للآخرين. وقد تعكس شعورًا بالانقطاع عن احتياجاتك أو شكًا في قيمتك الإبداعية. يمكنك أن تبدأ بطقس صغير ولطيف واحد يخصك وحدك، وترى كيف يغيّر أسبوعك.
