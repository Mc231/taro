imageryNote: >-
  تُتخيَّل إمبراطورة Taro في حديقة مطبخ في أواخر الصيف، مستريحة بين خضروات تنضج، ورغيف يبرد على حافة نافذة، وجدول ماء يجري بجوارها. وتوحي الأقمشة المنسوجة الناعمة وسلة الفاكهة المقطوفة للتو بالراحة ومتعة الحواس، فيما يلمّح النحل المتنقل بين الأزهار إلى نمو يحدث عبر أفعال رعاية صغيرة كثيرة. الجو دافئ ومتمهل، يدعو الناظر إلى ملاحظة الوفرة الحاضرة بالفعل.
