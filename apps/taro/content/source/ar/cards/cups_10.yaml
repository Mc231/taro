shortUpright: >-
  لحظة لملاحظة أين تشعر بالفعل بأنك في بيتك، ومَن يساعدك على الشعور بالانتماء.
shortReversed: >-
  قد يبدو الانسجام متوترًا أو بعيد المنال؛ يمكنك التفكير فيما يعنيه الانتماء لك، أبعد من أي صورة مثالية.
meaningUpright: |-
  يختتم عشرة من الكؤوس مجموعة الماء بصورة للسعادة المشتركة: أناس معًا في مكان يشبه البيت، والكؤوس العشر مجتمعة حولهم. وهو يتحدث عن الانتماء والامتلاء العاطفي وسهولة الوجود بين أشخاص يتقبلونك.
  البيت في هذه البطاقة ليس مكانًا أو عائلة تقليدية فحسب. قد يكون عائلة تختارها، أو دائرة قريبة من الأصدقاء، أو مجتمعًا، أو حتى لحظة سلام في داخلك. المهم هو الشعور بأنك مرحَّب بك كما أنت.
  في الحياة اليومية، قد يبدو ذلك أمسية هادئة مع من تحب، أو إحساسًا بالانسجام بعد فترة صعبة، أو مجرد تقدير للعادات الصغيرة التي تربط الناس معًا. تدعوك البطاقة إلى ملاحظة أين تشعر بالفعل بأنك في بيتك ورعاية تلك الروابط. وقد تسألك أيضًا عمّا تسهم به في ذلك الإحساس بالانتماء، وكيف يمكنك مشاركته على نطاق أوسع قليلًا.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس عشرة من الكؤوس انسجامًا متوترًا، أو فجوة بين صورة البيت السعيد وما تشعر به الأمور فعلًا. قد تستشعر انقطاعًا داخل عائلة أو مجموعة، أو تشعر بضغط للحفاظ على صورة مثالية لا تطابق الواقع.
  وقد يشير أيضًا إلى الداخل: توق إلى الانتماء يصعب تسميته، أو إحساس بأنك لم تجد بعد المكان الذي يناسبك.
  تدعوك هذه البطاقة إلى النظر إلى الانتماء بصدق ورحمة. كيف سيبدو الشعور بالبيت حقًا بالنسبة إليك، أبعد من التوقعات؟ يمكنك البدء بأفعال صغيرة تبني القرب، كمشاركة وجبة أو الإصغاء دون تشتت. فالانتماء ينمو غالبًا ببطء، عبر لحظات رعاية عادية، ويمكن أن يتخذ أشكالًا كثيرة مختلفة.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس هذه البطاقة رعاية متبادلة والتزامًا وإحساسًا مشتركًا بالبيت، مع شريك أو عائلة أو أصدقاء أو دائرة مختارة. وقد تدعوك إلى تقدير الطقوس اليومية التي تحفظ هذه الروابط. يمكنك التعبير عن امتنانك لمن يشعرونك بالانتماء، بالكلمات أو بأفعال صغيرة.
  relationshipsReversed: >-
    في الوضع المعكوس، قد يشير عشرة من الكؤوس إلى توتر أو مسافة داخل مجموعة قريبة، أو إلى مقارنة علاقاتك بصورة مثالية. يمكنك أن تسأل عمّا يحتاج إليه كل شخص حقًا ليشعر الجميع بالبيت معًا. والأحاديث المنفتحة اللطيفة قد تساعد على إعادة بناء القرب بإيقاع واقعي.
  workUpright: >-
    في العمل، قد تعكس هذه البطاقة فريقًا داعمًا، أو إحساسًا بغاية مشتركة، أو مكان عمل يهتم فيه الناس ببعضهم حقًا. وقد تدعوك إلى الإسهام في تلك الثقافة. يمكنك أن تلاحظ كيف يؤثر الشعور بالتقدير في عملك، وكيف يمكنك مساعدة الآخرين على الشعور بالمثل.
  workReversed: >-
    في الوضع المعكوس، قد تعكس البطاقة مكان عمل يتحدث عن كونه عائلة لكنه لا يتصرف كذلك دائمًا، أو خطًا ضبابيًا بين الحياة الشخصية والعمل. يمكنك التفكير في الحدود التي قد تحمي وقتك في البيت. والبحث عن الانتماء في أماكن عدة قد يخفف الضغط عن أيّ منها.
  growthUpright: >-
    في النمو الشخصي، يدعوك عشرة من الكؤوس إلى تنمية إحساس بالبيت في داخلك. يمكنك أن تلاحظ ما يساعدك على الشعور بالاستقرار والتكامل، كأماكن أو ممارسات أو أشخاص بعينهم. وإدخال ذلك في روتينك قد يمنحك أساسًا ثابتًا تتواصل منه مع الآخرين.
  growthReversed: >-
    في الوضع المعكوس، قد تطلب منك هذه البطاقة تفحّص قناعاتك حول الشكل الذي ينبغي أن تبدو عليه الحياة السعيدة. قد تجد أن بعض التوقعات جاءت من الآخرين لا منك. والتخلي عن صورة مثالية قد يفسح المجال لإحساس بالامتلاء أصدق وأقرب إلى ما يمكن عيشه.
