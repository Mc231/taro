imageryNote: >-
  تُتخيَّل عربة Taro شخصًا يقود عربة صغيرة متينة على طريق ساحلي، يجرّها حيوانان متباينا الطبع، أحدهما هادئ والآخر قلق. يمسك السائق اللجام بخفة، ويوجّه بالانتباه لا بالقوة. وقد تلمّح مظلة تشبه الصدفة فوق المقعد إلى برج السرطان وإلى الحماية التي تتيح لأحدهم أن يتقدم بأمان، فيما توحي الطريق المفتوحة وأضواء الميناء البعيدة بوجهة مختارة لا مفروضة.
