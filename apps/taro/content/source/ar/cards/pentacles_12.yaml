imageryNote: >-
  قد تُظهر الصورة فارسًا يجلس بهدوء على حصان متين ساكن، ممسكًا بعملة واحدة وناظرًا عبر حقول محروثة. قد يرمز الحصان الساكن إلى الصبر والتحمل، والأرض المحروثة إلى عمل منهجي أُنجز بالفعل، والنظرة المستوية إلى انتباه ثابت لما ينتظر أمامه. وقد تؤكد الدرجات الداكنة الصلبة والأشكال الثقيلة الموثوقية، مع تلميح إلى أن السكون قد يصبح أحيانًا جمودًا.
