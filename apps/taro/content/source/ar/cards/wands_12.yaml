shortUpright: >-
  طاقة جريئة مغامرة جاهزة للانطلاق؛ يمكنك اتباع شغفك مع إبقاء عينك على الطريق.
shortReversed: >-
  قد تسبق الطاقة الاتجاه؛ ربما تكون هذه لحظة لإبطاء الاندفاع واختيار الوجهة.
meaningUpright: |-
  فارس العصي هو النار في حركتها. يمتطي حصانًا مفعمًا بالحيوية ويرفع عصاه عاليًا، فيندفع إلى الأمام بشغف وثقة وولع بالمغامرة. فحيث يتساءل التابع، يتصرف الفارس.
  قد تظهر هذه الطاقة في قرار مفاجئ بالسفر، أو دفقة حافز لبدء ذلك المشروع أخيرًا، أو استعداد لخوض مخاطرة كانت ستبدو يومًا جريئة أكثر من اللازم. وقد تجلب جاذبية وشجاعة وحماسة معدية تجذب الآخرين معها.
  تدعوك هذه البطاقة إلى الثقة بدافعك وتركه يحملك إلى أرض جديدة. الزخم ثمين، وأحيانًا تكون الطريقة الوحيدة لاكتشاف إلى أين يقود طريق ما هي الانطلاق فيه. وفي الوقت نفسه، يحتاج الحصان المندفع إلى فارس يعرف تقريبًا إلى أين يذهب. يمكنك توجيه هذه الطاقة إلى مغامرة واحدة واضحة، مع إبقاء ما يكفي من الوعي للتعديل إن تغيرت الأرض تحتك.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس فارس العصي طاقة تسبق اتجاهها. ربما تبدأ الأشياء على عجل وتفقد الاهتمام في منتصف الطريق، أو تتصرف باندفاع ثم تضطر إلى التعامل مع العواقب، أو تشعر بالإحباط لأن دافعك لا يجد منفذًا.
  وقد تشير أيضًا إلى شغف مكبوح، يتراكم معه التململ لأن الظروف تبقيك في الانتظار.
  قد تكون هذه لحظة للسؤال إلى أين تريد نارك أن تذهب، وما الذي قد يساعدها على الوصول دون أن تحترق. يمكنك التوقف قبل قرار كبير، أو إنهاء شيء قبل البدء بالتالي، أو إيجاد منفذ صحي للطاقة القلقة، كالحركة، أو مهمة إبداعية، أو حديث صادق عمّا يبدو معرقلًا.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس هذه البطاقة الإثارة والانجذاب وروح المغامرة: خططًا عفوية، وأحاديث مكثفة، ورغبة في فعل الأشياء معًا. يمكنك الاستمتاع بالطاقة مع التحقق من أن الإيقاع يناسب كل المعنيين. فالمغامرات المشتركة تميل إلى أن تكون أغنى حين يكون لكل طرف رأي في الاتجاه.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تتحرك المشاعر القوية أسرع من التواصل، أو قد تبرد الحماسة بالسرعة التي جاءت بها. يمكنك أن تلاحظ ما إذا كنت أنت أو شخص قريب تتصرفان باندفاع دون تشاور. والإبطاء للحديث عمّا يريده كل طرف حقًا قد يجلب الثبات إلى رابط مليء بالشرارات.
  workUpright: >-
    في العمل أو في مشروع ما، قد يشير فارس العصي إلى أخذ زمام المبادرة بجرأة: عرض فكرة طموحة، أو قيادة دفعة، أو التحرك بسرعة لاغتنام فرصة. يمكنك استخدام هذا الدافع لكسر الجمود، مع وضع خطة بسيطة للخطوات التي تلي الدفقة المثيرة الأولى.
  workReversed: >-
    في الوضع المعكوس، ربما تتسرع في القرارات أو تشعر بالعرقلة ونفاد الصبر. يمكنك التحقق مما إذا كانت السرعة ضرورية حقًا أم أن توقفًا قصيرًا للتخطيط سيخدمك أكثر. وتحويل الإحباط إلى قائمة واضحة بالخطوات التالية قد يساعد طاقتك على التقدم بدلًا من الدوران في حلقات.
  growthUpright: >-
    الشجاعة والشهية للتجربة هبتان تطلب منك هذه البطاقة أن تستخدمهما. ما الذي ستفعله لو وثقت بحماستك؟ يمكنك تجربة شيء يوسّع حدودك، وملاحظة كيف يبدو التصرف انطلاقًا من الشغف لا من الحذر وحده.
  growthReversed: >-
    في الوضع المعكوس، يمكنك أن تستكشف علاقتك بالاندفاع. متى تجلب لك العفوية الفرح، ومتى تشتتك؟ وتعلّم التوقف لحظة قبل الفعل، دون أن تفقد شرارتك، قد يساعد طاقتك على أن تصبح شيئًا توجهه أنت لا شيئًا يوجهك.
