imageryNote: >-
  فارس في منتصف عدوه يميل إلى الأمام على حصان يشبّ أو يقفز، عصاه مرفوعة عاليًا وعباءته تنساب خلفه. وتمتد أمامه تلال صحراوية أو سهول مفتوحة، وقد تزيّن ملابسه أشكال لهب صغيرة أو سمندلات. يرمز الحصان القافز إلى الشغف والدافع، والعصا المرفوعة إلى غاية تُحمل إلى الفعل، والمنظر الواسع إلى مغامرة لا تزال تتكشف. ويلمّح الميل إلى الأمام إلى الشجاعة والتسرع معًا.
