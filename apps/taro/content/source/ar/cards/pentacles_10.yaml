shortUpright: >-
  قد يظهر في الأفق شيء بُني ليدوم. يمكنك ملاحظة الجذور والتقاليد والأشخاص الذين يشعرونك بأنك جزء من شيء أكبر.
shortReversed: >-
  قد تبدو البنى أو التوقعات القديمة ثقيلة. يمكنك التفكير في التقاليد التي تحتفظ بها وتلك التي تعيد تشكيلها لنفسك.
meaningUpright: |-
  يختتم عشرة من العملات رحلة المجموعة من بذرة واحدة إلى بيت كامل. يجمع مشهده التقليدي أجيالًا عدة في مكان واحد، مع بيت وقوس وحيوانات وعملات منسوجة في المكان. وهو يتحدث عن أسس تدوم أكثر من أي لحظة بعينها: الانتماء، والتاريخ المشترك، والرعاية طويلة الأمد التي تجعل المكان يبدو بيتًا.
  قد تتعرف على ذلك في اجتماع عائلي، أو عائلة مختارة أو مجتمع نما من حولك، أو تقاليد متوارثة، أو إحساس بأن جهودك اليومية تسهم في شيء سيبقى ذا أهمية أبعد من هذا العام. والإرث هنا لا يتعلق بالثروة وحدها. بل يشمل القصص والقيم والوصفات والمهارات وطرق العيش معًا.
  تدعوك البطاقة إلى التأمل فيما ورثته وما تأمل أن تنقله. يمكنك أن تسأل أيّ الجذور تغذّيك، وأيّ نوع من الأسس تبنيه، وكيف يمكنك قضاء وقتك في علاقات وممارسات تبدو دائمة.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس عشرة من العملات توترًا داخل البنى المحيطة بك: توقعات عائلية تبدو ثقيلة، أو تقاليد لم تعد مناسبة، أو خلافات حول الموارد والمسؤوليات المشتركة. وقد يشير أيضًا إلى إحساس بأن الأسس التي تعتمد عليها أقل صلابة مما بدت.
  وكثيرًا ما تكون هذه دعوة إلى المراجعة لا إلى الرفض. فلك أن تقرر أيّ أجزاء إرثك، العملية أو العاطفية، تحملها إلى الأمام.
  يمكنك تسمية توقّع واحد تعيش وفقه ولم يكن لك حقًا. كيف سيبدو أن تكرّم جذورك وتشكّل البيت بشروطك أنت؟ فالأحاديث الواضحة اللطيفة حول الأدوار والخطط قد تساعد على تقوية ما يهم وإرخاء ما لا يهم برفق.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس هذه البطاقة انتماءً عميقًا: روابط العائلة، أو العائلة المختارة، أو الصداقة الطويلة التي تمنحك إحساسًا بالاستمرارية. يمكنك أن تلاحظ التقاليد والقصص المشتركة التي تجمع دائرتك، وتفكر في كيفية رعايتها، ربما ببدء طقس جديد أو الحفاظ على طقس قديم.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تشير البطاقة إلى توتر حول الأدوار العائلية أو الالتزامات أو اختلاف القيم بين الأجيال. يمكنك التأمل في التوقعات التي تريد تلبيتها وتلك التي تود إعادة التفاوض عليها. فوضع حدّ نابع من الرعاية قد يحمي العلاقة أحيانًا بدلًا من أن يؤذيها.
  workUpright: >-
    في العمل، قد يوحي عشرة من العملات ببناء شيء ذي قيمة طويلة الأمد، كمؤسسة، أو مجموعة أعمال، أو دور يدعم الآخرين. يمكنك التفكير في إرث جهدك: ما الذي تسهم به ويمكن للآخرين البناء عليه، وكيف يمكنك توثيقه أو مشاركته.
  workReversed: >-
    هنا قد تعكس البطاقة ضغطًا لاتباع مسار موروث، أو ثقافة عمل لا تتناغم مع قيمك، أو عدم استقرار في بنية كنت تعتمد عليها. يمكنك التأمل في نوع الأساس الذي تريد أن يقوم عليه عملك، وأيّ التغييرات الصغيرة قد تقرّبك منه.
  growthUpright: >-
    في النمو الشخصي، تدعوك هذه البطاقة إلى استكشاف جذورك: القيم والعادات والقصص التي شكّلتك. يمكنك أن تدوّن بعضًا مما تمتن له وتفكر في كيفية حمله إلى الأمام. فالنمو قد يعني تكريم المكان الذي جئت منه وتقرير ما تنقله معًا.
  growthReversed: >-
    في الوضع المعكوس، قد تعكس البطاقة أنماطًا موروثة دون اختيار، أو شعورًا بعدم الانتماء التام إلى أي مكان. يمكنك أن تتفحص بلطف نصًّا عائليًا أو ثقافيًا واحدًا لا تزال تتبعه. فإدراكه بوضوح قد يمنحك مساحة للاحتفاظ بما يغذّيك وإعادة كتابة ما لا يغذّيك.
