shortUpright: "قليل من الوقت بعيدًا قد يساعدك على سماع أفكارك بوضوح أكبر."
shortReversed: >-
  ربما تحولت العزلة إلى انعزال، أو إلى تجنّب الهدوء تمامًا. أيّ توازن يبدو مناسبًا؟
meaningUpright: |-
  يسير الناسك وحيدًا على درب جبلي، حاملًا فانوسًا لا يضيء إلا الخطوات القليلة التالية. تدور هذه البطاقة حول الابتعاد عن الضجيج للبحث عن إجاباتك الخاصة. والناسك ليس وحيدًا بقدر ما هو صاحب غاية: لانسحابه سبب، والضوء يُحمل ولا يُنتظر.
  في الحياة اليومية، قد تعكس هذه البطاقة اختيار أمسية هادئة بدلًا من أمسية مزدحمة، أو نزهة منفردة للتفكير في قرار، أو قضاء الوقت مع كتاب أو دفتر أو حرفة تتطلب التركيز. وقد تشير إلى موسم لإعادة تقييم الأولويات، تقلّ فيه أهمية آراء الآخرين أمام إحساسك الذي يتشكل ببطء بما هو صادق بالنسبة إليك.
  تدعوك هذه البطاقة إلى التفكير فيما تبحث عنه، وما إذا كنت قد منحت نفسك مساحة كافية للعثور عليه. يمكنك أن تسأل ما السؤال الواحد الذي ستأخذه معك في نزهة طويلة. يوحي الناسك بأن الحكمة تأتي غالبًا في لمحات صغيرة ثابتة، كفانوس يكشف الطريق خطوة بخطوة، وبأن هذا يكفي لمواصلة المسير.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس الناسك عزلة دامت أطول مما تفيد. فالوقت وحدك قد يتحول ببطء إلى انسحاب يصبح فيه التواصل أصعب يومًا بعد يوم. قد تلاحظ أنك تفكر في حلقات مفرغة بدلًا من التفكير نحو شيء ما.
  وقد تشير هذه البطاقة أيضًا إلى العكس: انشغال شديد أو إحاطة دائمة بالآخرين لا تترك أي مساحة للتأمل. تجنّب الهدوء قد يكون طريقة لتجنّب سؤال لا تشعر بالجاهزية لمواجهته.
  ربما يفيدك أن تنظر أيّ الجانبين أقرب إليك. إن كنت قد أمضيت وقتًا طويلًا وحدك، فما الطريقة الصغيرة المريحة لاستعادة الصلة بشخص ما؟ وإن كنت تتجنب السكون، فما الذي قد تتعلمه من عشر دقائق وحدك مع أفكارك؟ الفانوس لا يزال بين يديك لترفعه.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد يعكس الناسك حاجة إلى مساحة للتفكير، وقيمة الأشخاص الذين يحترمون هذه الحاجة. وقد يدعوك إلى أن توضح بلطف أن الابتعاد يتعلق بالتأمل لا بالرفض. الوقت وحدك قد يساعدك على العودة إلى الآخرين بوضوح أكبر بشأن ما تريده وما يمكنك تقديمه.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تشير هذه البطاقة إلى انسحاب يشعر به الآخرون مسافةً، أو إلى وحدة لم تذكرها لأحد. يمكنك التفكير فيما إذا كنت تنتظر أن يبادر شخص آخر بالتواصل. رسالة قصيرة صادقة قد تعيد فتح باب، حتى لو بقيت بحاجة إلى بعض الهدوء بعد ذلك.
  workUpright: >-
    في العمل أو الدراسة، يسلّط الناسك الضوء على العمل العميق المركّز والتفكير المستقل. قد تكون هذه لحظة مناسبة للبحث أو الكتابة أو التخطيط أو تعلّم شيء بعمق. يمكنك أن تحمي بعض الوقت دون مقاطعة، وتلاحظ ما يأتيك من أفكار حين لا تنشغل بالرد على الآخرين باستمرار.
  workReversed: >-
    في الوضع المعكوس، قد يعكس الناسك عملًا في عزلة لفترة أطول من اللازم، أو افتقادًا لآراء قد تساعد. وقد يشير أيضًا إلى الإفراط في التفكير في قرار ما. يمكنك أن تطلب من زميل موثوق أو مرشد نظرة جديدة، وتلاحظ كيف قد تشحذ مشاركةُ أفكارك تلك الأفكار.
  growthUpright: >-
    في النمو الشخصي، تدعو هذه البطاقة إلى ممارسة العزلة المختارة ومساءلة الذات. فالكتابة في المذكرات، أو المشي، أو مجرد الجلوس بهدوء مع سؤال ما، قد يساعدك على فهم نفسك بشكل أفضل. يمكنك أن تتخيل فانوسك الخاص بصيرةً واحدة اكتسبتها مؤخرًا، وتتركها تضيء خطوتك التالية.
  growthReversed: >-
    في الوضع المعكوس، قد يسأل الناسك ما إذا كنت تختبئ من نفسك أو من الآخرين. وقد يعكس حاجة إلى الموازنة بين التأمل والتواصل. يمكنك أن تخطط لطقس هادئ واحد ولحظة اجتماعية صغيرة واحدة هذا الأسبوع، وتلاحظ شعورك مع كل منهما. التوازن هنا شخصي؛ وحدك من يستطيع استشعار المزيج المناسب.
