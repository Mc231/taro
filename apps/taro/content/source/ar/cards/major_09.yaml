imageryNote: >-
  يُتخيَّل ناسك Taro شخصًا متدثرًا بعباءة على حافة جبلية عالية مغطاة بالثلج عند الغسق، يحمل فانوسًا بسيطًا لا يضيء إلا الخطوات القليلة التالية من الدرب. وتوحي عصا مشي صقلها الاستعمال بدعم مستمد من التجربة. وتُظهر آثار الأقدام في الثلج خلفه كم قطع من الطريق. تتحدث درجات الأزرق والرمادي الباردة عن العزلة والهواء الصافي، فيما يُظهر توهج الفانوس الدافئ أن البصيرة يمكن أن تُحمل حتى في أحلك مقاطع الطريق.
