imageryNote: >-
  تُظهر الصورة الأصلية شاطئًا تعصف به الريح تحت غيوم ممزقة سريعة الحركة. يمسك شخص ثلاثة نصال برخاوة وهو ينظر إلى الخلف، بينما يرقد نصلان آخران على الرمل. ويبتعد شخصان آخران نحو الماء. توحي النصال المتناثرة بجدالات لم تُحسم، وتشير الظهور المولّية إلى مسافة صنعها الخلاف. وتعكس السماء القلقة ذهنًا لا يزال مضطربًا بعد أن توقفت الكلمات.
