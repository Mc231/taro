shortUpright: >-
  قد يُكسب جدال بينما يُخسر شيء آخر؛ يمكنك أن تسأل كم كلّف هذا الانتصار فعلًا.
shortReversed: >-
  قد يكون خلاف ما جاهزًا لأن يبرد؛ وربما هناك متسع للتخلي عن الحاجة إلى إثبات أنك على حق لصالح السلام.
meaningUpright: |-
  ينظر خمسة من السيوف إلى الخلاف بعد وقوعه. شخص جمع السيوف وادّعى الفوز، بينما يبتعد آخرون مولّين ظهورهم. والسؤال الذي تطرحه البطاقة ليس من فاز، بل ما الذي كان الفوز يستحقه.
  قد ترى هذه البطاقة في خلاف أثبتّ فيه وجهة نظرك لكن الأجواء بردت، أو في مجموعة محادثة صارت حادة، أو في موقف تنازلت فيه لمجرد إنهاء التوتر. وقد تعكس الكبرياء، أو الرغبة في الكلمة الأخيرة، أو الشعور المقلق بأنك قلت أكثر مما قصدت. وقد تشير أيضًا إلى الوقوف على الجانب الآخر، الشعور بأنك أمام من هو أقوى واختيار الرحيل.
  تدعوك هذه البطاقة إلى التفكير في المعارك التي تهمك حقًا. الدفاع عن قيمك مهم؛ لكن ليس كل صدام يستحق الطاقة نفسها. يمكنك أن تلاحظ ما تشعر به بعد انتهاء جدال: رضا، أو وحدة، أو ارتياح، أو ندم. فهذا الشعور قد يرشد طريقة تعاملك مع الخلاف التالي، وما إذا كانت بعض الجسور تستحق الترميم.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس خمسة من السيوف خلافًا يفقد حرارته. ربما يستعد الناس لوضع مواقفهم جانبًا، أو ربما تشعر بالرغبة في إصلاح ما انكسر بعد جدال تجاوز الحد. والمصالحة قد تبدأ باعتراف بسيط.
  وقراءة أخرى هي استياء عالق: خلاف انتهى رسميًا لكنه لا يزال يُعاد في ذهنك، أو إحساس بأمر لم يُحسم يلوّن الأحاديث الجديدة.
  يمكنك أن تسأل كيف قد يبدو التخلي هنا. لا يتحتم أن يعني الموافقة، بل فقط اختيار عدم حمل المعركة أبعد من ذلك. أحيانًا يكون الابتعاد شكلًا هادئًا من أشكال القوة؛ وأحيانًا تكون المبادرة بالتواصل كذلك. ما الذي قد يساعدك على الشعور بالسلام مع الطريقة التي تُركت بها الأمور؟
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس هذه البطاقة جدالًا صار فيه كسب الحجة أهم من القرب. يمكنك أن تلاحظ أنماط عدّ النقاط أو الحاجة إلى الكلمة الأخيرة، فيك أو في غيرك. وقد يساعد أن تسأل عمّا كان كل طرف يحاول حمايته حقًا. ففهم تلك الحاجة قد يحوّل الحديث من منافسة إلى مشكلة مشتركة.
  relationshipsReversed: >-
    في الوضع المعكوس، قد يشير خمسة من السيوف إلى ترميم بعد قطيعة، أو إلى توتر لا يزال يغلي تحت كلمات مهذبة. يمكنك التفكير فيما إذا كان اعتذار، أو حديث موضّح، أو مجرد لطف قد يخفف الأمور. وإن ظل رابط ما يعود إلى الخلاف نفسه، فقد يستحق الأمر استكشاف ما يعيد إشعاله.
  workUpright: >-
    في العمل، قد تعكس هذه البطاقة منافسة أو توترًا في المكتب: فضل يُنسب إلى غير أهله، أو أفكار تُصرف، أو نقاش ترك الناس مجروحين. يمكنك أن تسأل ما إذا كان فوزك يخدم الهدف المشترك. فالتعاون يطلب منك أحيانًا التخلي عن نقطة كي يتحرك العمل. واختيار معاركك قد يحمي طاقتك وعلاقات عملك معًا.
  workReversed: >-
    في الوضع المعكوس، قد تشير هذه البطاقة إلى تصفية الأجواء بعد احتكاك في العمل، أو إلى قرار بالابتعاد عن نزاع مستنزف. يمكنك أن تلاحظ ما إذا كان خلاف قديم لا يزال يؤثر في طريقة تواصلك مع زميل. فحديث قصير وهادئ يركّز على المستقبل قد يفعل أكثر من إعادة الجدال حول من كان محقًا.
  growthUpright: >-
    في النمو الشخصي، يدعوك خمسة من السيوف إلى النظر في علاقتك بالفوز والخسارة. ماذا يحرّك الخلاف فيك: حاجة إلى إثبات نفسك، أم خوف من أن يُتجاهل حضورك؟ يمكنك التمرن على التوقف قبل الرد في لحظة محتدمة، ومنح نفسك نفَسًا لاختيار كلماتك بدلًا من رد الفعل.
  growthReversed: >-
    في الوضع المعكوس، قد تعكس هذه البطاقة تحررًا من ضغينة قديمة أو من الرغبة في إعادة جدالات الماضي. قد يبدو التخلي خسارة، لكنه كثيرًا ما يحرر طاقة لما يهمك الآن. يمكنك أن تكتب ما كنت ستقوله لو استطعت، ثم تقرر ما إذا كان يحتاج إلى أن يُقال بصوت عالٍ أم يكفي أن يوضع جانبًا.
