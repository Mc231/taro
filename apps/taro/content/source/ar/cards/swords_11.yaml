shortUpright: >-
  الفضول مستيقظ؛ يمكنك تتبع سؤال بعين جديدة وترى إلى أين يأخذ تفكيرك.
shortReversed: >-
  قد تتشتت الأفكار المتلهفة في اتجاهات كثيرة؛ يمكنك ملاحظة أين قد يخدمك الإصغاء أكثر من الكلام.
meaningUpright: |-
  تابع السيوف ذهن يافع سريع يلاقي العالم. يقف على تل عاصف رافعًا نصله، يراقب كل شيء، متلهفًا للتعلم والسؤال واختبار الأفكار. تدور هذه البطاقة حول الفضول الذي يسبق الخبرة، البداية المثيرة لفهم شيء جديد.
  قد تتعرف على هذه البطاقة في الرغبة في البحث في موضوع حتى ساعة متأخرة من المساء، أو في طرح السؤال الذي لا يطرحه أحد غيرك، أو في طاقة بدء دورة أو نقاش أو مشروع يوسّع تفكيرك. وقد تعكس أيضًا اليقظة والانتباه، وجمع المعلومات قبل الالتزام برأي.
  تدعوك هذه البطاقة إلى الاستمتاع بكونك متعلمًا. لست بحاجة إلى امتلاك كل الإجابات؛ قد يكفي الآن طرح أسئلة جيدة. ويمكنك أيضًا أن تلاحظ كيف تشارك ما تكتشفه. فالحماسة للأفكار تصل جيدًا حين تقترن بالإصغاء. أيّ موضوع أو سؤال يستدعي انتباهك، وكيف يمكنك استكشافه بجرأة وتواضع معًا؟
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس تابع السيوف فضولًا فقد اتجاهه. قد تتشتت الأفكار أسرع مما تستطيع متابعتها، أو قد تبدأ أشياء كثيرة دون أن تنهي أيًّا منها. الطاقة الذهنية عالية، لكن التركيز رقيق.
  وقراءة أخرى هي كلمات تتحرك أسرع من الفكر: الكلام قبل الإصغاء، أو تمرير شيء لم يُتحقق منه، أو اتخاذ موقف دفاعي حين تُسائَل فكرة ما. فالحدة بلا رفق قد تجعل الأحاديث أصعب مما يلزم.
  تدعوك هذه البطاقة إلى إبطاء إيقاع تفكيرك قليلًا. يمكنك اختيار خيط واحد تتبعه الآن، وترك الخيوط الأخرى تنتظر. وقبل مشاركة رأي ما، يمكنك طرح سؤال إضافي واحد. ما الذي قد تتعلمه لو أصغيت بالتلهف نفسه الذي تريد أن تتكلم به؟
aspects:
  relationshipsUpright: >-
    في العلاقات، قد يشير تابع السيوف إلى حديث حيوي، أو فضول تجاه عالم شخص ما الداخلي، أو رغبة في فهم موقف ما فهمًا كاملًا. يمكنك طرح الأسئلة التي تساءلت عنها، باهتمام حقيقي لا بريبة. فالإصغاء الجيد جزء من هذه البطاقة بقدر ما هي سرعة الكلمات.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تعكس هذه البطاقة كلمات متهورة، أو أسرارًا تُتناقل، أو عادة الجدال بدلًا من التواصل. يمكنك أن تلاحظ ما إذا كان الفضول قد تحول إلى تطفل أو إلى موقف دفاعي. فالتوقف للتفكير في وقع كلماتك قد يحمي الثقة. واعتذار بسيط عن ملاحظة متسرعة قد يُحدث فرقًا كبيرًا.
  workUpright: >-
    في العمل، قد يعكس تابع السيوف مرحلة تعلّم: مهارة جديدة، أو بحثًا جديدًا، أو دورًا يطلب منك التفكير السريع. يمكنك التطوع لمهام توسّع فهمك، وطلب من الزملاء أن يشرحوا ما يعرفونه. وتدوين الملاحظات واختبار الافتراضات قد يحوّلان الحماسة المبكرة إلى معرفة راسخة.
  workReversed: >-
    في الوضع المعكوس، قد توحي هذه البطاقة بانتباه مشتت: القفز بين المهام، أو مشاركة أفكار نصف مكتملة في وقت مبكر جدًا، أو الرد بسرعة على النقد. يمكنك اختيار أولوية واحدة لتعميقها قبل إضافة المزيد. والتحقق من الحقائق قبل عرضها ودعوة الآخرين إلى إبداء ملاحظاتهم بهدوء قد يجعل أفكارك أقوى وأجدر بالثقة.
  growthUpright: >-
    في النمو الشخصي، يدعوك تابع السيوف إلى تنمية عقل المبتدئ. يمكنك اختيار موضوع لا تعرف عنه الكثير، والسماح لنفسك بالفضول دون حاجة إلى إبهار أحد. فالسؤال عن السبب، والقراءة الواسعة، وملاحظة افتراضاتك قد تبقي تفكيرك متجددًا ومرنًا.
  growthReversed: >-
    في الوضع المعكوس، قد تعكس هذه البطاقة أفكارًا قلقة تقفز قبل أن تحط. يمكنك التمرن على إنهاء فكرة قبل البدء بالتالية، أو على ملاحظة اللحظة التي تشعر فيها بالرغبة في الدفاع بدلًا من التفكير. والفضول الموجّه نحو نفسك، بسؤالك عن سبب ردود أفعالك، قد يكون نقطة انطلاق مفيدة.
