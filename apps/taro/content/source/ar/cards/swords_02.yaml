shortUpright: >-
  خياران يوازن أحدهما الآخر الآن؛ يمكنك أن تلاحظ ما تبقيه بعيدًا عن النظر كي تحافظ على السلام.
shortReversed: >-
  ربما يقترب التوقف من نهايته؛ شيء تجنبت النظر إليه قد يطلب نظرة لطيفة وصادقة.
meaningUpright: |-
  يصف اثنان من السيوف موقفًا معلّقًا بين طريقين. لا يبدو أيّ من الخيارين صائبًا بوضوح، فتبقيهما متوازنين، بذراعين متقاطعتين، وتنتظر. قد يكون هذا توقفًا حكيمًا، لحظة للتنفس قبل الاختيار. وقد يكون أيضًا طريقة لعدم النظر إلى شيء من شأنه أن يجعل الاختيار أوضح.
  قد تتعرف على هذه البطاقة في قرار تواصل تأجيله، أو في خلاف اخترت ألا تنحاز فيه إلى طرف، أو في هدنة مع نفسك حول سؤال لا تريد مواجهته بعد. فالهدوء على السطح قد يخفي جهدًا كبيرًا تحته؛ وإبقاء شيئين ثقيلين ساكنين أمر متعب.
  تدعوك هذه البطاقة إلى التفكير فيما يحميه هذا السكون. هل يمنحك وقتًا لجمع المعلومات، أم يبعدك عن معلومات تملكها بالفعل؟ قد ترغب في تسمية كل خيار بوضوح، بما في ذلك ما تشعر به تجاهه، لا ما تفكر فيه فقط. وأحيانًا يتغير التوازن بمجرد السماح لشعور خفي واحد بالخروج إلى الضوء، فتصبح الخطوة التالية أسهل.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس اثنان من السيوف طريقًا مسدودًا بدأ ينفرج. تنزلق العصابة عن العينين؛ وشيء تجنبته قد يدخل مجال الرؤية، سواء شعرت بالجاهزية أم لا. وقد يجلب ذلك ارتياحًا، وقد يجلب أيضًا فيضًا من المشاعر كنت قد وضعتها جانبًا.
  وقراءة أخرى هي ميل التوازن من حركة قليلة جدًا إلى ضغط كبير جدًا: آخرون يدفعونك إلى الاختيار قبل أن تجد وقتًا للتفكير، أو قرار يُتخذ بسرعة لمجرد إنهاء انزعاج الانتظار.
  يمكنك أن تسأل عمّا تعرفه الآن ولم تسمح لنفسك بمعرفته من قبل. لا حاجة إلى القفز؛ يمكنك استيعاب المنظر الجديد ببطء. أيّ اختيار يبدو مختلفًا حين تسمح لنفسك برؤيته كاملًا، وكيف قد تبدو خطوة تالية مدروسة من هنا؟
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تشير هذه البطاقة إلى مواجهة صامتة: شخصان يتجنبان موضوعًا للحفاظ على الهدوء، أو أنت تكتم رأيك لتحافظ على حيادك بين آخرين. والسلام الذي يُحفظ هكذا قد يبدو هشًّا. يمكنك التفكير فيما إذا كان حديث لطيف وصادق قد يحل محل الصمت الحذر، وفيما ستقوله لو لم يكن عليك أن تحرس الجانبين في آن.
  relationshipsReversed: >-
    في الوضع المعكوس، قد يعكس اثنان من السيوف نهاية هدنة. فالمشاعر التي طُويت قد تطفو، أو قد يطلب منك أحدهم أن تقول أخيرًا أين تقف. وقد يبدو ذلك غير مريح، لكنه قد يفسح المجال لمزيد من الصدق. قد ترغب في مشاركة ما كنت تحمله على أجزاء صغيرة وواضحة بدلًا من دفعة واحدة.
  workUpright: >-
    في العمل، قد تعكس هذه البطاقة قرارًا معلّقًا: مقاربتين، أو عرضين على وقتك، أو أولويتين تبدوان ملحّتين بالقدر نفسه. قد يكون الانتظار معقولًا إن كنت تحتاج إلى مزيد من الحقائق. يمكنك أن تدوّن ما سيطلبه منك كل خيار وما سيمنحك إياه، وتلاحظ أيّ القائمتين تجد نفسك تتجنبها. فهذا التمنع قد يكون معلومة مفيدة أيضًا.
  workReversed: >-
    في الوضع المعكوس، قد يعود الاختيار المتوقف إلى الحركة، أحيانًا لأن موعدًا نهائيًا أو تفصيلًا جديدًا يفرض السؤال. قد تشعر بالاستعجال. وقد يساعد الفصل بين ما يحتاج حقًا إلى قرار اليوم وما يمكن أن ينتظر قليلًا. وإن كنت تتجنب معلومة ما، فقد تكون هذه لحظة النظر إليها مباشرة وتركها ترشدك.
  growthUpright: >-
    في النمو الشخصي، يدعوك اثنان من السيوف إلى ملاحظة كيف تحمي نفسك من المشاعر الصعبة بالسكون. قد يكون السكون مريحًا، وقد يكون أيضًا طريقة لعدم الشعور. يمكنك تجربة الجلوس مع كل خيار بضع دقائق، والانتباه إلى استجابة جسدك إلى جانب استدلالك. فكلا النوعين من المعرفة مهم.
  growthReversed: >-
    في الوضع المعكوس، قد تعكس هذه البطاقة نقطة تحول في الصدق مع الذات. شيء أبقيته على مسافة صار أقرب الآن. يمكنك الاقتراب منه بفضول لا بحكم، واستيعابه بإيقاعك الخاص. ففتح عينيك لا يعني أن عليك التصرف فورًا؛ بل يعني أنك تختار الرؤية بوضوح قبل أن تقرر.
reflectionQuestions:
