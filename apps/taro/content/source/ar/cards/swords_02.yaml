    ما الحقيقة أو الشعور الذي يمكنك أن تسمح لنفسك بالنظر إليه هذا الأسبوع؟
imageryNote: >-
  في الصورة الأصلية، يمسك شخص جالس سيفين متقاطعين قرب صدره، وعلى عينيه قطعة قماش ناعمة. ويتدلى هلال شاحب منخفضًا فوق ماء ضحل هادئ تتناثر فيه الحجارة. يشكّل النصلان المتقاطعان هيئة متحفظة، كباب يُبقى مغلقًا. ويوحي الماء الساكن وضوء الليل بمشاعر تستريح تحت السطح، فيما تشير العينان المغطاتان إلى اختيار عدم النظر بعد.
