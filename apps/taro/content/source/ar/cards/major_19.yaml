imageryNote: >-
  تُتخيَّل شمس Taro حقلًا صيفيًا واسعًا عند الظهيرة، يتشارك فيه أصدقاء من أعمار مختلفة الطعام على بساط تحت شمس دافئة هائلة. ترتفع الطائرات الورقية مع النسيم ولا أثر للظلال الطويلة، إيحاءً بلحظة لا شيء فيها يُخفى. تملأ درجات الأصفر الزاهية والبرتقالي الدافئ المشهد، فيما يضيف كلب يركض عبر العشب لمسة من المرح. وتدعو الصورة الناظر إلى الشعور بالدفء والوضوح والفرح البسيط.
