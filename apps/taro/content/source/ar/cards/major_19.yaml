shortUpright: >-
  لحظة دفء ووضوح. تدعوك هذه البطاقة إلى الاستمتاع بما هو مشرق ومنفتح في حياتك.
shortReversed: >-
  الضوء لا يزال هناك، حتى لو مرّت الغيوم. ما الذي يساعدك على الشعور بالدفء والوضوح؟
meaningUpright: |-
  الشمس من أكثر بطاقات المجموعة فرحًا وانفتاحًا. إنها طاقة صباح صافٍ، وطفل يلعب في حديقة، والشعور بأن تكون على طبيعتك تمامًا دون حاجة إلى الاختباء. وبعد عدم يقين القمر، تجلب هذه البطاقة الوضوح: يمكن رؤية الأشياء كما هي، وغالبًا ما تكون أبسط وأدفأ مما كان يُخشى.
  في الحياة اليومية، قد تعكس هذه البطاقة يومًا يبدو فيه كل شيء أسهل قليلًا، أو إحساسًا بالفخر بشيء أنجزته، أو وقتًا في الهواء الطلق يرفع معنوياتك، أو علاقة تشعر فيها بالقبول والارتياح. وقد تشير إلى ثقة لا تحتاج إلى الصراخ، وإلى المتع البسيطة التي تجعل الحياة طيبة: الضحك، وأشعة الشمس، واللعب.
  تدعوك هذه البطاقة إلى التفكير فيما يجلب لك فرحًا حقيقيًا وكيف يمكنك أن تفسح له مساحة أكبر. يمكنك أن تسأل أين يمكنك أن تسمح لنفسك بالظهور على نحو أكمل. تسلّط الشمس الضوء على تفاؤل متجذر في اللحظة الحاضرة، وتذكّر بأنه لا بأس في الاحتفاء بما يسير على ما يرام، ومشاركة دفئك، وتركه يعود إليك.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد تعكس الشمس وقتًا يبدو فيه الفرح خافتًا قليلًا. الدفء لم يختفِ؛ ربما هو فقط مختبئ خلف جدول مزدحم أو تعب أو شك في الذات. قد تجد صعوبة أكبر من المعتاد في الاستمتاع باللحظات الجميلة أو الشعور بالفخر بنفسك.
  وقد تشير هذه البطاقة أيضًا إلى سطوع زائد: إظهار وجه مبتهج بينما تشعر بغير ذلك، أو دفع نفسك إلى الإيجابية طوال الوقت.
  ربما يفيدك أن تبحث عن مصادر صغيرة وبسيطة للدفء، كالوقت في الخارج، أو نشاط مرح، أو شخص يضحكك. وقد يساعد أيضًا أن تسمح لنفسك بالشعور بما تشعر به فعلًا، لا بما تظن أنه ينبغي أن تشعر به. الفرح الحقيقي يعود غالبًا بسهولة أكبر حين لا يُفرض.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس الشمس الدفء والانفتاح والسعادة المشتركة. وقد تدعوك إلى الاستمتاع بوقت غير معقد مع من تهتم بهم: الضحك، واللعب، والخروج إلى الهواء الطلق. قد تبدو العلاقات أخف حين يشعر الطرفان بحرية أن يكونا على طبيعتهما وأن يحتفي كل منهما بالآخر.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تشير هذه البطاقة إلى علاقة فقدت شيئًا من خفتها، ربما تحت وطأة الضغط أو الروتين. يمكنك التفكير في التخطيط لشيء بسيط وممتع معًا، أو التحقق مما إذا كان أحدهم يخفي شعوره الحقيقي خلف سطح مبتهج. قد تعود الخفة عبر لحظات صغيرة مشتركة.
  workUpright: >-
    في العمل أو في مشروع ما، تسلّط الشمس الضوء على الوضوح والظهور والحماسة. وقد تعكس لحظة يُعترف فيها بجهودك، أو يبدو فيها العمل منشّطًا لا مستنزفًا. يمكنك مشاركة أفكارك بثقة، والسماح لنفسك بالاستمتاع بالتقدم على طول الطريق.
  workReversed: >-
    في الوضع المعكوس، قد تعكس الشمس شعورًا بالتجاهل، أو صعوبة في إيجاد الحماسة لعملك. وقد تشير أيضًا إلى انكشاف زائد، كضغط مفرط لتقديم الأداء. يمكنك أن تسأل ما التغيير الصغير الذي قد يجلب مزيدًا من الطاقة والدفء إلى أيام عملك.
  growthUpright: >-
    في النمو الشخصي، تدعوك هذه البطاقة إلى استعادة الصلة بحماستك وفضولك الطبيعيين. يمكنك أن تعود إلى شيء أحببته في طفولتك، أو تجرّب شيئًا جديدًا لمجرد المتعة. فالثقة قد تنمو من الفرح بقدر ما تنمو من الإنجاز.
  growthReversed: >-
    في الوضع المعكوس، قد تسأل الشمس ما إذا كنت تقسو على نفسك أكثر من اللازم، أو تأخذ الأمور بجدية مفرطة منذ وقت طويل. وقد تعكس حاجة إلى اللعب والراحة والخفة. يمكنك أن تخصص نشاطًا صغيرًا مبهجًا واحدًا هذا الأسبوع، دون أي هدف سوى الاستمتاع به.
