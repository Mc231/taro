imageryNote: >-
  تُظهر الصورة الأصلية شخصًا يعبر حقلًا مقمرًا على أطراف أصابعه، حاملًا حفنة من النصال بين ذراعيه بينما تُترك بضعة نصال قائمة في العشب خلفه. وتتوهج خيام بعيدة بهدوء، غافلة. ويُظهر أثر من آثار الأقدام الطريق الذي سلكه. توحي الحفنة بتحمّل أكثر مما عُرض، وتلمّح النصال الباقية إلى ما لا يمكن حمله، فيما تشير الالتفاتة إلى الخلف إلى قلق التصرف بعيدًا عن الأنظار.
