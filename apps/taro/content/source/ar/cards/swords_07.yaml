shortUpright: >-
  ربما تجري خطة ذكية أو التفاف هادئ؛ يمكنك أن تسأل ما إذا كان ذلك يناسب الشخص الذي تريد أن تكونه.
shortReversed: >-
  قد تفقد خطة خفية جاذبيتها؛ والصدق مع نفسك أو مع الآخرين قد يبدو أخف من جهد الإخفاء.
meaningUpright: |-
  يُظهر سبعة من السيوف شخصًا يتسلل بأكثر مما أُعطي، ملتفتًا إلى الخلف ليرى إن كان أحد قد لاحظ. إنها بطاقة الاستراتيجية والدهاء والتصرف منفردًا. وأحيانًا يكون ذلك حسن تدبير؛ وأحيانًا يكون طريقة لتجنب طريق أصعب وأصدق.
  قد تتعرف على هذه البطاقة في طريق مختصر تُغريك سلوكه، أو في حديث تتجنبه بالالتفاف بهدوء حول شخص ما، أو في خطة أبقيتها لنفسك. وقد تعكس الشعور بأن عليك التعامل مع الأمور وحدك لأن الطلب سيكون معقدًا أكثر من اللازم. وقد تشير أيضًا إلى الشك في أن شيئًا ما ليس واضحًا تمامًا في موقف من حولك، دون يقين.
  تدعوك هذه البطاقة إلى التفكير فيما يحميه هذا الكتمان أو الجهد المنفرد. قد تكون الاستقلالية حكيمة، وليست كل خطة بحاجة إلى جمهور. ومع ذلك، يمكنك أن تسأل ما إذا كان هذا الطريق يتوافق مع قيمك، وكم يكلّف إبقاؤه مخفيًا. هل يمكن بلوغ الهدف نفسه بطريقة تستطيع الحديث عنها علنًا؟
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس سبعة من السيوف خطة خفية تفقد قبضتها. ربما صار الاحتفاظ بسر ما أكثر إرهاقًا مما يستحق، أو ربما تشعر بالاستعداد لمشاركة ما كنت تحمله وحدك. والمصارحة، ولو جزئيًا، قد تجلب ارتياحًا غير متوقع.
  وقراءة أخرى منطوية إلى الداخل: القصة التي ترويها لنفسك لتتجنب حقيقة غير مريحة. فخداع الذات قد يكون خفيًا، كإقناع نفسك بأن حل مشكلة ما يقع على عاتق شخص آخر.
  يمكنك أن تسأل أين قد يجعل قليل من الانفتاح وضعك أبسط. قد يعني ذلك الاعتراف بخطأ، أو طلب مساعدة تجنبت طلبها، أو إعادة النظر في استراتيجية تعتمد على ألا يلاحظ أحد. ما الذي قد يتغير لو سمحت لشخص واحد موثوق برؤية الصورة كاملة؟
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس هذه البطاقة أمرًا غير معلن: قرارًا اتُّخذ بهدوء، أو حاجة تُلبّى في مكان آخر، أو إحساسًا مقلقًا بأن ليس كل شيء يُتشارك. وهي لا تتهم أحدًا. يمكنك التفكير في المواضع التي يبدو فيها الانفتاح مخاطرة ولماذا. فالفضول اللطيف، لا الريبة، يميل إلى استدعاء الصدق من الآخرين ومن نفسك.
  relationshipsReversed: >-
    في الوضع المعكوس، قد يشير سبعة من السيوف إلى حقائق تخرج إلى الضوء، أو إلى رغبة في مزيد من الشفافية مع شخص قريب. قد تشعر بالاستعداد لقول ما كتمته. وإن انفتح شخص آخر عليك، فالإصغاء دون حكم فوري قد يجعل الترميم ممكنًا. فالثقة كثيرًا ما تنمو حين يُقابل الصدق بالرعاية.
  workUpright: >-
    في العمل، قد تعكس هذه البطاقة الالتفاف على نظام ما بدلًا من العمل من خلاله، أو نسبة الفضل لنفسك بهدوء، أو حمل مهمة وحدك لتجنب التنسيق مع الآخرين. لحسن التدبير قيمته. يمكنك أن تسأل ما إذا كانت مقاربتك ستصمد لو رآها الجميع، وما إذا كان حديث مباشر قد يوصلك أبعد بجهد أقل.
  workReversed: >-
    في الوضع المعكوس، قد توحي هذه البطاقة بإعادة النظر في استراتيجية تعتمد على البقاء بعيدًا عن الأنظار، أو بمشاركة معلومات احتفظت بها أخيرًا. يمكنك طلب المساعدة في أمر كابدته وحدك. فالانفتاح بشأن طريق مختصر أو خطأ في وقت مبكر قد يكون أسهل بكثير من إدارته لاحقًا.
  growthUpright: >-
    في النمو الشخصي، يدعوك سبعة من السيوف إلى النظر في الأوقات التي تتصرف فيها منفردًا ولماذا. فالاعتماد على الذات قد يكون قوة، وقد يكون أيضًا طريقة لتجنب الانكشاف. يمكنك أن تلاحظ المواقف التي تختار فيها الدهاء على المباشرة، وتجرب أن تطلب ما تريده بوضوح.
  growthReversed: >-
    في الوضع المعكوس، قد تعكس هذه البطاقة صدقًا متناميًا مع نفسك. قد تلتقط قصة مريحة كنت ترويها وتسائلها بلطف. فالصدق مع الذات لا يتطلب القسوة؛ بل يعني ببساطة السماح لنفسك بالرؤية بوضوح. ما الذي كنت ستفعله بشكل مختلف لو توقفت عن تبرير هذا الموقف؟
