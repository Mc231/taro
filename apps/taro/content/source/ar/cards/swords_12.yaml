shortUpright: >-
  الزخم حاضر؛ يمكنك توجيه التفكير السريع نحو فعل هادف مع إبقاء عينك على من بجانبك.
shortReversed: >-
  قد تسبق السرعة التفكير؛ والإبطاء لفترة قصيرة قد يساعدك على الوصول إلى حيث تقصد فعلًا.
meaningUpright: |-
  يندفع فارس السيوف إلى الأمام بأقصى سرعة، نصله ممدود والريح تزمجر. تحمل هذه البطاقة طاقة ذهن اتخذ قراره ويريد أن ينفذه الآن. وهي تتحدث عن العزيمة، والشجاعة في الجهر بالرأي، وإثارة السعي وراء فكرة دون تردد.
  قد تتعرف على هذه البطاقة حين تشعر بالاستعداد لمواجهة مشكلة مباشرة، أو الدفاع عن مبدأ، أو دفع مشروع متوقف إلى الأمام أخيرًا. وقد تعكس دفقة إنتاجية، أو حجة قوية قُدّمت جيدًا، أو استعدادًا لقول الأمر الصعب الذي يتجنبه الآخرون. لهذا الدافع قيمة حقيقية؛ فهو قد يكسر الجمود ويحرّك الأمور.
  وتدعوك هذه البطاقة أيضًا إلى التفكير في الطريق أمامك. فالسرعة قد تتجاوز بك تفاصيل مهمة، والآراء القوية قد تطغى على أصوات أهدأ. يمكنك أن تسأل ما إذا كان زخمك يخدم هدفًا واضحًا، وما إذا كان الآخرون يمضون معك أم يُتركون خلفك. كيف يمكنك أن تحافظ على شجاعة هذه الطاقة ومباشرتها مع اختيار اتجاهك بعناية؟
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس فارس السيوف طاقة مشتتة أو متحركة بسرعة زائدة. ربما تبدأ الأشياء باندفاع، أو تتكلم بحدة، أو تدفع إلى الأمام دون إحساس واضح بالوجهة. وقد تكون النتيجة احتكاكًا، أو تعبًا، أو حاجة إلى التراجع.
  وقراءة أخرى هي زخم معطَّل: رغبة في الفعل تكبحها الظروف أو الشكوك، وقد تتراكم لتصبح إحباطًا.
  تدعوك هذه البطاقة إلى إبطاء الحصان إلى المشي لحظة. يمكنك التحقق من اتجاهك، والتفكير في وقع كلماتك، والسؤال عمّا إذا كانت العجلة ضرورية حقًا. فأخذ نفَس قبل الفعل لا يضعف عزمك؛ بل قد يركّزه. ما الذي قد يتغير لو تحركت بغاية لا بعجلة؟
aspects:
  relationshipsUpright: >-
    في العلاقات، قد يعكس فارس السيوف المباشرة: قول ما تفكر فيه، أو خوض حديث كنت تتجنبه، أو الدفاع عن شخص ما. فالصدق قد يصفّي الأجواء. يمكنك الموازنة بين السرعة والعناية، ومنح الطرف الآخر وقتًا للرد والشعور بأنه مسموع بدلًا من أن تغمره قوة قناعتك.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تشير هذه البطاقة إلى كلمات قيلت على عجل، أو جدالات تتصاعد بسرعة، أو نفاد صبر تجاه إيقاع شخص آخر. يمكنك أن تلاحظ اللحظات التي تتسرع فيها في الاستنتاج بشأن ما يقصده الآخر. فالإبطاء، أو طرح سؤال، أو مجرد الانتظار يومًا قبل الرد، قد يمنع جرحًا لا داعي له.
  workUpright: >-
    في العمل، قد يوحي فارس السيوف بدفعة لإنجاز الأمور: معالجة تراكم المهام، أو تبنّي مقترح، أو التحرك بسرعة لاغتنام فرصة واضحة. قد يلهم تركيزك الآخرين. يمكنك إبقاء التواصل مفتوحًا كي يفهم الفريق اتجاهك، والتحقق مرتين من التفاصيل الأساسية كي لا تقوّض السرعة الجودة.
  workReversed: >-
    في الوضع المعكوس، قد تعكس هذه البطاقة اندفاعًا إلى المهام دون خطة، أو صدامًا مع الزملاء، أو إحباطًا من بطء الإجراءات. يمكنك التوقف لتحديد الأولويات والتفكير فيما إذا كان الحل السريع سيصمد. وإن كان التقدم معطلًا، فتوجيه طاقتك إلى التحضير قد يجعل الخطوة اللاحقة أكثر فاعلية بكثير.
  growthUpright: >-
    في النمو الشخصي، يدعوك فارس السيوف إلى الفعل وفق قناعاتك. يمكنك اختيار هدف واحد والسعي إليه بتركيز، وملاحظة الطاقة التي تأتي من الجهد الملتزم. فالشجاعة في الكلام والحركة قيّمة؛ واقترانها بالتأمل يساعدك على النمو في الاتجاه الذي تريده حقًا.
  growthReversed: >-
    في الوضع المعكوس، قد تعكس هذه البطاقة تململًا أو اختيارات متهورة. يمكنك أن تلاحظ ما يدفع الرغبة في الاستعجال: حماسة، أو قلق، أو رغبة في تجنب الانزعاج. وإدخال وقفات صغيرة في يومك، ولو بضعة أنفاس قبل قرار ما، قد يساعدك على الاستجابة بتأنٍّ بدلًا من رد الفعل.
