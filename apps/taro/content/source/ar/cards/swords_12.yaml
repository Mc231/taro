imageryNote: >-
  تُظهر الصورة الأصلية فارسًا يميل إلى الأمام على حصان يعدو، نصله ممدود وعباءته تخفق في الريح. وتنحني الأشجار على سفح التل في الاتجاه نفسه، وتتسابق غيوم ممزقة في الأعلى. يوحي الميل إلى الأمام والغيوم المتسابقة بالزخم والقناعة، فيما تلمّح الأشجار المنحنية إلى القوة التي تفرضها مثل هذه السرعة على كل ما حولها.
