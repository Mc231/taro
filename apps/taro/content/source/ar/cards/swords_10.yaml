imageryNote: >-
  تُظهر الصورة الأصلية عشرة نصال موضوعة جنبًا إلى جنب على أرض مستوية عند حافة بحيرة داكنة، كأدوات وُضعت في نهاية يوم طويل. السماء الليلية فوقها ثقيلة، لكن شريطًا صافيًا من الضوء الذهبي يمتد على طول الأفق البعيد. يوحي صف النصال بدورة اكتملت، ويشير الماء الساكن إلى الإنهاك والراحة، فيما يلمّح الفجر إلى أن يومًا آخر يبدأ.
