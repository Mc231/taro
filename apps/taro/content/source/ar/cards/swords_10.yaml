shortUpright: >-
  قد يبلغ فصل صعب نهايته؛ وتسميته قد تفسح المجال للراحة ولمنعطف بطيء.
shortReversed: >-
  قد تكون أدنى نقطة خلفك؛ يمكنك ملاحظة العلامات الأولى لعودة الثبات.
meaningUpright: |-
  يعلن عشرة من السيوف نهاية فصل صعب. يبدو أن كل ما كان يمكن أن يسوء في موقف بعينه قد ساء، وفي الاعتراف بذلك سكون متعب. ومع ذلك، تبدأ السماء في الأفق بالإشراق بالفعل. تتعلق هذه البطاقة بالاكتمال بقدر ما تتعلق بالألم.
  قد تتعرف عليها في اللحظة التي تتوقف فيها عن مقاومة موقف استنفد غرضه بوضوح: مشروع لم يكن بالإمكان إنقاذه، أو نمط تراه أخيرًا على حقيقته، أو فترة إجهاد أنهكتك. وكثيرًا ما يكون في بلوغ القاع ارتياح غريب، لأنك لم تعد مضطرًا إلى الاستعداد لسقطات أخرى.
  تدعوك هذه البطاقة إلى ترك النهاية تكون نهاية. لا حاجة إلى تهويلها أو تجاوزها مسرعًا. يمكنك أن تسأل عمّا علّمك إياه هذا الفصل وما تشعر بالجاهزية للتوقف عن حمله. الراحة مناسبة هنا. والبدء من جديد لا يتحتم أن يحدث اليوم، لكنك قد تلاحظ أن الضوء الأول موجود بالفعل، ينتظر أن ترفع بصرك.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس عشرة من السيوف تعافيًا بطيئًا بعد وقت صعب. ربما مرّ الأسوأ، وقد تلاحظ علامات صغيرة على عودة الثبات: نوم أفضل، أو لحظة دعابة، أو رغبة في وضع الخطط من جديد. والنهوض يكون غالبًا تدريجيًا، بأيام طيبة وأخرى أصعب.
  وقراءة أخرى هي مقاومة نهاية حدثت بالفعل، ومحاولة إحياء شيء يحتاج إلى الراحة، أو إعادة فصل مؤلم بدلًا من إغلاقه.
  تدعوك هذه البطاقة إلى جمع ما تعلّمته وترك الباقي. يمكنك أن تلطف بنفسك بشأن إيقاع التعافي. فالدعم من الآخرين، والعادات البسيطة، والصبر قد تساعدك على إعادة البناء. أيّ جزء من حياتك يبدو جاهزًا لأن يبدأ من جديد، مهما كان ذلك بهدوء؟
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس هذه البطاقة نهاية نمط، أو مرحلة، أو أمل لم يكن بالإمكان الحفاظ عليه. وقد يبدو ذلك ثقيلًا ونهائيًا. يمكنك أن تسمح لنفسك بالحزن على ما لم ينجح مع ملاحظة أي ارتياح أيضًا. فالنهايات قد تفسح المجال لروابط أصدق، مع نفسك ومع الآخرين، حين تشعر بالجاهزية.
  relationshipsReversed: >-
    في الوضع المعكوس، قد يشير عشرة من السيوف إلى التعافي بعد وقت مؤلم بين شخصين، أو إلى صعوبة في تقبّل أن شيئًا ما قد تغير. يمكنك أن تلاحظ ما إذا كنت تتمسك بما لا يمكن أن يعود. والاتكاء على أصدقاء بقوا معك قد يساعدك على إعادة بناء الثقة والدفء بإيقاعك الخاص.
  workUpright: >-
    في العمل، قد تعكس هذه البطاقة مشروعًا أو دورًا يبلغ نهايته الطبيعية، أحيانًا بعد جهد كبير. وقد تُظهر أيضًا الاحتراق النفسي، الإحساس بأنه لم يعد لديك ما تعطيه. يمكنك الاعتراف بأن بعض الأشياء لا يمكن دفعها أبعد. وجرد ما كسبته والراحة قبل الخطوة التالية قد يحميان طاقتك.
  workReversed: >-
    في الوضع المعكوس، قد توحي هذه البطاقة باستعادة التوازن تدريجيًا بعد انتكاسة. قد يعود الدافع على موجات صغيرة. يمكنك البدء بأهداف متواضعة والاحتفاء بكل منها. وإن لاحظت أنك تحاول إحياء شيء انتهى حقًا، فقد يساعد توجيه تلك الطاقة نحو ما قد يأتي بعده.
  growthUpright: >-
    في النمو الشخصي، يدعوك عشرة من السيوف إلى رؤية النهايات جزءًا من دورة أكبر. فبلوغ نقطة منخفضة قد يزيل التظاهر ويُظهر لك ما يهم. يمكنك الكتابة عمّا علّمك إياه هذا الفصل، دون استعجال للعثور على جانب مشرق. فالاعتراف الصادق شكل من أشكال القوة في حد ذاته.
  growthReversed: >-
    في الوضع المعكوس، قد تعكس هذه البطاقة عودة هادئة للأمل والطاقة. قد تلاحظ قدرتك تنمو من جديد، خطوة بخطوة. ويمكنك التحلي بالصبر مع الأيام التي تبدو كأنها انتكاسات؛ فالتعافي نادرًا ما يسير في خط مستقيم. ويمكنك التفكير في الدروس التي تريد حملها معك، والقصص القديمة التي تشعر بالجاهزية لوضعها جانبًا نهائيًا.
