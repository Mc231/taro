shortUpright: >-
  قد يبدو موسم ما باردًا أو ناقصًا. والمساعدة قد تكون أحيانًا أقرب مما تبدو، حتى حين يبدو طلبها صعبًا.
shortReversed: >-
  قد تكون فترة صعبة في طور التخفف. يمكنك ملاحظة أين بدأ الدفء والدعم يصلان إليك من جديد.
meaningUpright: |-
  خمسة من العملات من أهدأ بطاقات المجموعة وأصعبها. يُظهر مشهده التقليدي أشخاصًا يسيرون عبر الثلج مارّين بنافذة مضاءة، منشغلين بالبرد والطريق أمامهم. وقد يتحدث عن أوقات تبدو فيها الموارد أو الانتماء أو الطاقة شحيحة، ويبدو فيها كأن الجميع في الداخل بينما أنت في الخارج.
  قد يعكس ذلك فترة من الميزانيات الضيقة، أو مرحلة وحدة بعد انتقال، أو شعورًا بالإقصاء من مجموعة، أو مجرد إنهاك من شتاء طويل من الجهد. ولا تحكم البطاقة على هذه المشاعر. بل تعترف بها بوصفها حقيقية وإنسانية.
  أما خيطها الألطف فيكمن في النافذة. فقد يكون الدعم موجودًا قريبًا، في صديق، أو خدمة مجتمعية، أو جار، أو مجموعة أشخاص ساروا في طريق مشابه، وكثيرًا ما تكمن الصعوبة في ملاحظته أو في السماح لنفسك بأن تطرق الباب. يمكنك أن تسأل أيّ مساعدة كنت ستقدّمها لشخص آخر في موقفك، وما إذا كان بإمكانك أن تمنح نفسك الإذن ذاته بطلب المساعدة.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس خمسة من العملات عودة بطيئة للثبات بعد وقت صعب. ربما تجد مأوى، عبر مساعدة عملية، أو صلة متجددة، أو تغيير صغير يجعل الحياة اليومية أقل إجهادًا. وقد يعود الدفء تدريجيًا، ويستحق أن يُلاحظ حتى حين يكون متواضعًا.
  وقد تشير البطاقة أيضًا إلى قلق يبقى بعد تحسن الظروف: عادة الاستعداد للبرد حتى بعد أن انفتح الباب. كان لهذه اليقظة معنى من قبل. وقد تكون الآن شيئًا يمكنك تليينه.
  يمكنك أن تجرد ما تغير، ولو قليلًا، وتعترف بالصلابة التي حملتك. أين يمكنك قبول قدر أكبر قليلًا من الدعم، أو تقديم بعضه لشخص لا يزال في الثلج؟ فالتعافي كثيرًا ما يتعمق حين يُتقاسم.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس هذه البطاقة شعورًا بأنك في الخارج: مُغفَل من الأصدقاء، أو بعيد عن العائلة، أو تكابد مع شخص ما وقتًا صعبًا. يمكنك أن تلاحظ من حاول الوصول إليك، ولو على نحو غير كامل. فإخبار شخص واحد موثوق بما تمر به قد يحوّل المشقة المشتركة إلى دفء مشترك.
  relationshipsReversed: >-
    في الوضع المعكوس، قد توحي البطاقة باستعادة الصلة بعد فترة من البعد، أو باستعداد للسماح للآخرين بالمساعدة. وقد تعكس أيضًا جرحًا عالقًا من الإقصاء. يمكنك الاعتراف بهذا الشعور بصدق مع ملاحظة الأشخاص الحاضرين الآن، والتفكير في طريقة واحدة لتقريبهم أكثر قليلًا.
  workUpright: >-
    في العمل، قد يعكس خمسة من العملات موسمًا شحيحًا: موارد محدودة، أو شعورًا بعدم التقدير، أو إحساسًا بأنك خارج دائرة القرارات. يمكنك البحث عن النوافذ المضاءة المتاحة لك، كزميل، أو شبكة دعم، أو برنامج لتطوير المهارات، والتفكير في الخطوة العملية التي قد تخفف الضغط.
  workReversed: >-
    هنا قد تعكس البطاقة ظروفًا بدأت تتحسن، أو استعدادًا لطلب الدعم الذي تحتاج إليه. وقد تشير أيضًا إلى حذر يبقى بعد فترة صعبة. يمكنك أن تلاحظ ما تغير وتدع خططك تعكس الأرض الأكثر ثباتًا، مع الاحتفاظ بالدروس التي علّمتك إياها الأوقات الصعبة.
  growthUpright: >-
    في النمو الشخصي، تدعو هذه البطاقة إلى الرحمة بنفسك في الأوقات الشحيحة أو الموحشة. فالمكابدة لا تعني أنك ارتكبت خطأ. يمكنك أن تستكشف ما الذي يجعل طلب المساعدة صعبًا. وإن بقيت المشاعر الثقيلة معك، فالحديث مع شخص تثق به أو مع مختص مؤهل قد يكون مصدر دعم ذا معنى.
  growthReversed: >-
    في الوضع المعكوس، قد تعكس البطاقة ثقة متنامية بالنفس بعد فترة صعبة. يمكنك أن تلاحظ العادات الصغيرة والأشخاص والاختيارات التي ساعدتك على العبور. وتسميتها قد تسهّل العودة إليها. ويمكنك التفكير في كيفية تحويل شيء من هذا الفهم الذي اكتسبته بعناء إلى لطف تجاه آخرين يواجهون شتاءً مشابهًا.
