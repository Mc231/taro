imageryNote: >-
  قد تُظهر الصورة شخصين يسيران عبر الثلج أو المطر بمحاذاة جدار، رأساهما منحنيان أمام الطقس، بينما تتوهج فوقهما نافذة مثبتة في زخرفتها خمس عملات. وقد يرمز التباين بين الطريق البارد والنافذة المضاءة إلى المشقة إلى جانب مأوى قريب. ويوحي موضع النافذة، الخارج قليلًا عن مجال نظرهما، بدعم حاضر لكنه لم يُلاحظ أو يُطلب بعد.
