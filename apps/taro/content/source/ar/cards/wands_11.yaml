shortUpright: >-
  طاقة فضولية مرحة تريد أن تستكشف؛ يمكنك اتباع ما يثير حماستك والسماح لنفسك بخوض تجربة البداية.
shortReversed: >-
  قد تتنقل الحماسة بين أشياء كثيرة أو يكبحها الشك؛ يمكنك اختيار شيء واحد لاستكشافه بلطف.
meaningUpright: |-
  تابع العصي هو التلميذ المتحمس في عالم النار. يمسك عصا تتبرعم وينظر إليها بانبهار، ويمثل الفضول الذي يسبق الخبرة: متعة اكتشاف شيء جديد والرغبة في معرفة المزيد.
  قد تظهر هذه الطاقة في التسجيل في دورة بدافع اللحظة، أو قراءة كل ما يمكنك العثور عليه عن اهتمام جديد، أو إخبار الأصدقاء بفكرة خطرت لك للتو. وقد تكون أيضًا رسالة أو دعوة تفتح بابًا على شيء غير مألوف. ثمة روح لعب هنا، واستعداد لأن يراك الآخرون وأنت تحاول.
  تدعوك هذه البطاقة إلى مقاربة الحياة بانفتاح المبتدئ. لست بحاجة إلى معرفة أين يقودك اهتمام ما كي تستكشفه. يمكنك أن تسمح لنفسك بالتجريب دون ضغط الإتقان الفوري، وتلاحظ كيف تبدو تلك الحرية. فأحيانًا تبدأ أكثر الشغوفات دوامًا أسئلةً صغيرة مرحة.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس تابع العصي فضولًا لا يجد أين يحط. ربما تقفز من اهتمام إلى آخر، تبدأ المشاريع ببهجة وتتركها حين تخبو جِدّتها. أو ربما يكون الفضول موجودًا لكنه مكبوح بالقلق من أن تبدو قليل الخبرة.
  وقد تصف هذه البطاقة أيضًا أفكارًا لا تزال في طور التشكل: شرارات تحتاج إلى مزيد من الوقت قبل أن تصبح جاهزة للمشاركة.
  يمكنك أن تستكشف ما وراء التململ أو التردد. أهو الملل، أم الخوف من الالتزام، أم الخوف من عدم الإتقان بعد؟ أحد السبل إلى الأمام اختيار اهتمام واحد ووضع هدف صغير قليل الضغط له. وسبيل آخر أن تسمح لنفسك بالاستمتاع بالاستكشاف دون أن يتحتم عليه أن يقود إلى مكان بعينه.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس هذه البطاقة فضولًا جديدًا تجاه شخص ما: رغبة في معرفة المزيد عنه، أو تجربة أشياء جديدة معًا، أو تبادل طاقة مرحة. وقد تجلب الخفة إلى رابط مألوف أيضًا. يمكنك أن تطرح على شخص قريب سؤالًا لم تطرحه من قبل، أو تقترح نشاطًا لم يجربه أيّ منكما.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تأتي الحماسة في علاقة ما على دفعات وتخبو بسرعة، أو قد تشعر بالخجل من إظهار حماستك. يمكنك أن تلاحظ ما إذا كنت تبحث عن الجِدّة بدلًا من العمق. فإظهار اهتمامك الحقيقي، ولو بطرق صغيرة، قد يدعو الطرف الآخر إلى الاستجابة بالانفتاح نفسه.
  workUpright: >-
    في العمل أو الدراسة، قد يشير تابع العصي إلى مرحلة تعلّم: مهارة جديدة، أو دور جديد، أو فكرة تتحمس لاختبارها. الحماسة رصيد هنا. يمكنك أن تطرح الأسئلة بحرية، وتتطوع لشيء غير مألوف، وتتعامل مع الأخطاء المبكرة بوصفها جزءًا من العملية لا حكمًا على قدرتك.
  workReversed: >-
    في الوضع المعكوس، قد تكون لديك أفكار كثيرة ومتابعة قليلة، أو قد لا تعرف إلى أين توجه طاقتك. يمكنك اختيار مشروع واحد والتقدم به خطوة أبعد من المعتاد. والحديث مع مرشد أو زميل قد يساعد أيضًا على تحويل شرارة مشتتة إلى اتجاه أوضح.
  growthUpright: >-
    يمنحك تابع العصي مهمة بسيطة: استعادة الصلة بفضولك. ما الذي أحببت استكشافه حين لم يكن هناك ضغط لتحقيق أي شيء؟ يمكنك أن تخصص وقتًا لتجربة مرحة هذا الأسبوع، وتتعامل مع ما تكتشفه بوصفه معلومات مفيدة عمّا يمنحك الطاقة.
  growthReversed: >-
    في الوضع المعكوس، قد يمنعك الحرج أو الذهن القلق من التعمق. يمكنك أن تستكشف ما يعنيه البقاء مع اهتمام واحد وقتًا أطول قليلًا مما يبدو طبيعيًا، والسماح للآخرين بأن يروا أنك لا تزال في بدايته. فالعمق يأتي غالبًا بعد اللحظة التي كنت ستمضي فيها عادةً.
