imageryNote: >-
  يقف شخص يافع في منظر طبيعي مفتوح، ممسكًا بعصا منتصبة، ويتأمل بانبهار برعمًا طازجًا ينبت من خشبها. وقد تحمل ملابسه زخارف صغيرة على شكل لهب أو سمندل تلمّح إلى عنصر النار. ترمز العصا المتبرعمة إلى فكرة حية تنمو، والنظرة المندهشة إلى الفضول، والأرض المفتوحة إلى الاتجاهات الكثيرة التي لا تزال تنتظر الاستكشاف.
