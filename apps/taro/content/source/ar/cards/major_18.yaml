imageryNote: >-
  يُتخيَّل قمر Taro قمرًا شاحبًا يحجب نصفه سحاب منجرف، فوق درب يشق القصب الطويل قرب الشاطئ. يتلألأ الدرب في مواضع ويختفي في أخرى، فيمضي المسافر ببطء. ويمكن لمالك حزين واقف بسكون في المياه الضحلة أن يوحي بالانتباه الصبور، فيما تلمّح التموجات على سطح الماء إلى مشاعر تصعد من الأعماق. ويدعو الضوء الفضي والظلال الناعمة والحواف الضبابية الناظر إلى الثقة بحواسه في رحلة غير مؤكدة.
