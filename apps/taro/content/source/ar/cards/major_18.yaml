shortUpright: >-
  ليس كل شيء واضحًا بعد، ولا بأس بذلك. تدعوك هذه البطاقة إلى التحرك ببطء والثقة بحواسك.
shortReversed: >-
  ربما بدأ الضباب ينقشع. ما الذي تراه الآن بوضوح أكبر مما كنت تراه من قبل؟
meaningUpright: |-
  القمر هو بطاقة المنطقة الوسطى: الضوء الذي يُظهر الأشكال دون أن يُظهر حوافها. في هذا الوهج الناعم، قد تبدو الأشياء أكبر أو أغرب أو أكثر غموضًا مما هي عليه في ضوء النهار. تتحدث البطاقة عن الأحلام والأمزجة والخيال، وعن الشعور المقلق بعدم معرفة موقعك تمامًا.
  في الحياة اليومية، قد تعكس هذه البطاقة موقفًا تنقصه بعض القطع، أو شعورًا لا تستطيع تسميته، أو مخاوف تبدو في الليل أكبر منها في الصباح. وقد تشير إلى وقت لا يساعد فيه المنطق وحده كثيرًا، وقد تقدّم فيه الحدسُ والأحلامُ والعملُ الإبداعي بعض المفاتيح. عدم اليقين هنا ليس تحذيرًا؛ إنه ببساطة جزء من السير في طريق لا تستطيع رؤيته كاملًا بعد.
  تدعوك هذه البطاقة إلى التفكير فيما هو حقيقي وما قد يكون متخيَّلًا. يمكنك أن تسأل أيّ مخاوفك مبنيّ على حقائق وأيّها على قصص رويتها لنفسك. يسلّط القمر الضوء على الصبر مع الغموض. فالتحرك ببطء، والإصغاء إلى غرائزك، وانتظار مزيد من الضوء قبل اتخاذ القرارات الكبيرة، قد يكون نهجًا حكيمًا في الأوقات الضبابية.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس القمر حيرة بدأت تنقشع. شيء بدا معتمًا قد يصبح أوضح، أو قد تشعر بالجاهزية للنظر مباشرة إلى قلق كنت تتجنبه. وقد يجلب ذلك ارتياحًا، حتى لو لم تكن الصورة مريحة تمامًا.
  وقد تشير هذه البطاقة أيضًا إلى الحيل التي يمارسها العقل: أن تروي لنفسك قصة مريحة، أو أن تترك الأفكار القلقة تدور في حلقات. وملاحظة هذه الأنماط خطوة في حد ذاتها نحو الوضوح.
  ربما يفيدك أن تدوّن ما تعرفه يقينًا وما تخمّنه. رؤية الفرق على الورق قد تعيد القلق إلى حجمه الحقيقي. الثقة بالطريق لا تتطلب رؤيته كله؛ قد يكفي أن ترى الخطوة التالية وتخطوها بعناية.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد يعكس القمر عدم يقين بشأن موقعك أو بشأن ما يشعر به شخص آخر. وقد يدعوك إلى ملاحظة ما إذا كنت تملأ الفراغات بالافتراضات. الأسئلة اللطيفة المباشرة والصبر قد يساعدان، كما يساعد الانتباه إلى استجاباتك العاطفية دون التسرع في الاستنتاج.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تشير هذه البطاقة إلى سوء فهم بدأ يتبدد، أو إلى إدراك قصة غير مفيدة رويتها عن شخص ما. يمكنك التفكير في حديث صادق للتحقق مما هو صحيح فعلًا، وإفساح المجال لوجهة نظر الطرف الآخر. الوضوح يأتي غالبًا على أجزاء صغيرة، وكل تبادل صادق يضيف جزءًا.
  workUpright: >-
    في العمل أو في مشروع ما، يسلّط القمر الضوء على الغموض: أهداف غير واضحة، أو معلومات متغيرة، أو عملية إبداعية لم تجد شكلها بعد. وقد يدعوك إلى تحمّل عدم المعرفة لبعض الوقت. قد يزدهر العصف الذهني الخيالي هنا، بينما قد تستفيد الالتزامات الحاسمة من انتظار مزيد من الوضوح.
  workReversed: >-
    في الوضع المعكوس، قد يعكس القمر حيرة تنقشع مع وصول معلومات جديدة، أو فرصة لمعالجة سوء فهم. يمكنك أن تدوّن الأسئلة المفتوحة وتسعى إلى إجابات واضحة. وقد يشير أيضًا إلى أن تضبط نفسك وأنت تفكر في أسوأ الاحتمالات فتختار نظرة أهدأ. فالحقائق الواضحة تميل إلى أن تجعل القرار التالي أخف.
  growthUpright: >-
    الأحلام والخيال والأجزاء الأقل عقلانية من ذهنك تستحق الاستكشاف تحت ضوء القمر. فالكتابة في المذكرات أو اللعب الإبداعي قد يساعدانك على الإصغاء إليها. يمكنك أن تلاحظ أمزجتك وأنماطها، وتتعامل معها بوصفها معلومات لا أوامر.
  growthReversed: >-
    في الوضع المعكوس، قد يسأل القمر ما إذا كان القلق يشكّل نظرتك أكثر من الحقائق. وقد يعكس قدرة متنامية على الرؤية عبر المخاوف. يمكنك التمرن على التوقف حين تظهر فكرة خائفة، والسؤال عمّا قد يلاحظه صديق أهدأ بدلًا من ذلك. ومع الوقت، قد يصبح هذا التوقف عادة أكثر ثباتًا.
