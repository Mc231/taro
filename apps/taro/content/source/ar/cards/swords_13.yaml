imageryNote: >-
  في الصورة الأصلية، تجلس شخصية على مقعد حجري منحوت مرتفع فوق الغيوم، تمسك نصلًا منتصبًا بإحدى يديها بينما تمتد الأخرى مفتوحة. ويحلّق طائر واحد في الهواء الصافي فوقها. يوحي النصل المنتصب بالتمييز، وتشير اليد المفتوحة إلى الإنصاف والاستعداد للإصغاء، فيما يلمّح الطائر الوحيد إلى ذهن مستقل بعيد النظر.
