shortUpright: >-
  البصيرة الواضحة والصوت اللطيف المباشر قد يجتمعان؛ يمكنك أن تثق بما علّمتك إياه التجربة.
shortReversed: >-
  ربما تصلّب الوضوح فصار مسافة؛ يمكنك ملاحظة أين قد يعود الدفء دون التخلي عن الصدق.
meaningUpright: |-
  تجلس ملكة السيوف منتصبة على مقعد مرتفع، نصلها مرفوع وإحدى يديها ممدودة كأنها تدعو إلى الصدق. ترمز هذه البطاقة إلى إدراك واضح صاغته التجربة، القدرة على رؤية الموقف كما هو والحديث عنه ببساطة. وهذا الوضوح ليس باردًا؛ إنه يأتي من عيش الأمور والتعلم منها.
  قد تتعرف على هذه الطاقة حين تضع حدًّا حازمًا دون أن تعتذر عنه، أو تقدّم ملاحظات صادقة ومنصفة، أو تتخذ قرارًا مبنيًا على الحقائق لا على الأماني. وقد تعكس أيضًا الاستقلالية: الثقة بحكمك الخاص والحاجة إلى مساحة للتفكير بنفسك. وقد يأتيك الناس لأنهم يعرفون أنك ستخبرهم بالحقيقة.
  تدعوك هذه البطاقة إلى التفكير في كيفية عمل الوضوح والرحمة معًا. فالرؤية الواضحة لا تتطلب القسوة، واللطف لا يتطلب التظاهر. يمكنك أن تسأل أين منحتك تجربتك، بما فيها صعوبات الماضي، منظورًا يستحق الثقة. كيف يمكنك استخدام هذه البصيرة لدعم نفسك والآخرين بالصدق والعناية معًا؟
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد تعكس ملكة السيوف وضوحًا تحول إلى برود. ربما دفعتك جراح الماضي إلى التحفظ، أو سرعة الانتقاد، أو التردد في السماح للآخرين بالاقتراب. فالصدق قد يصبح درعًا حين يُستخدم لإبقاء الناس على مسافة.
  وقراءة أخرى هي العكس: صعوبة في قول حقيقتك، أو السماح للآخرين بتشويش حكمك، أو وضع حدود لا تصمد.
  تدعوك هذه البطاقة إلى النظر في كيفية موازنتك بين العقل والقلب الآن. يمكنك أن تلاحظ ما إذا كانت خيبة أمل قديمة تشكّل طريقة استجابتك للناس اليوم. فالتليين لا يعني التخلي عن معاييرك؛ بل قد يعني ترك الدفء يسير إلى جانب صدقك. كيف سيبدو أن تتكلم بوضوح وتحافظ على انفتاحك؟
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس ملكة السيوف تواصلًا واضحًا وحدودًا صحية. ربما تعرف ما تقبله وما لا تقبله، وتقول ذلك بهدوء. هذه الطاقة تقدّر الصدق وتحترم الآخرين بما يكفي لتخبرهم بالحقيقة. واقتران المباشرة بالدفء يساعد الناس على الشعور بالاحترام والرعاية معًا.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تشير هذه البطاقة إلى تحفظ، أو ملاحظات حادة، أو إبقاء الآخرين على مسافة بعد التعرض لجرح. يمكنك التفكير فيما إذا كانت حماية نفسك قد بدأت تكلّفك القرب. ومشاركة قليل مما تشعر به، لا مما تفكر فيه فقط، قد تدعو إلى تواصل أدفأ دون التخلي عن حدودك.
  workUpright: >-
    في العمل، قد توحي ملكة السيوف بحكم منصف، ومعايير واضحة، وقدرة على النفاذ عبر الحيرة. ربما تكون الشخص الذي يسمّي المشكلة الحقيقية في اجتماع، أو يقدّم ملاحظات تساعد الآخرين على التحسن. استقلاليتك وتجربتك نقاط قوة؛ ومشاركة منطقك بانفتاح تساعد الآخرين على الثقة بقراراتك.
  workReversed: >-
    في الوضع المعكوس، قد تعكس هذه البطاقة ملاحظات انتقادية مفرطة، أو معايير جامدة، أو عزل نفسك عن الفريق. وقد تشير أيضًا إلى الشك في حكمك حين يعترض الآخرون. يمكنك الموازنة بين الصراحة والتشجيع، وتذكّر أن التوقعات الواضحة تعمل أفضل حين يشعر الناس بالدعم في تحقيقها.
  growthUpright: >-
    في النمو الشخصي، تدعوك ملكة السيوف إلى الثقة بالحكمة التي اكتسبتها. يمكنك التأمل في تجربة صعبة وتسمية ما علّمتك إياه. فمعرفة الذات الواضحة تساعدك على وضع الحدود، والتواصل بصدق، واتخاذ اختيارات منسجمة مع قيمك، حتى حين لا تكون الأكثر شعبية.
  growthReversed: >-
    في الوضع المعكوس، قد تعكس هذه البطاقة حاجة إلى تليين ناقدك الداخلي أو التخلي عن استياء قديم. يمكنك أن تلاحظ اللحظات التي تحكم فيها على نفسك أو على الآخرين بقسوة، وتسأل كيف قد تبدو كلمات ألطف تبقى صادقة. فالوضوح يقوى ولا يضعف حين يتضمن التفهم.
