imageryNote: >-
  تُتخيَّل بطاقة الموت في Taro منظرًا خريفيًا هادئًا، يحمل فيه نهر بطيء أوراقًا متساقطة نحو شمس تشرق في الأفق. ويسير شخص متدثر بعباءة على مهل بجوار الماء، حاملًا قرنة بذور واحدة أو غصنًا عاريًا، رمزين لما ينتهي وما ينتظر أن ينمو. وقد توحي زهرة بيضاء على خلفية داكنة بالتجدد في قلب التحرر. الجو هادئ ومحترم، يشير إلى التحول لا إلى الفقد.
