shortUpright: >-
  قد تكون مرحلة ما على وشك الانتهاء. تدعوك هذه البطاقة إلى ملاحظة ما ينتهي والمساحة التي يتركها.
shortReversed: >-
  قد يكون شيء ما جاهزًا للانتهاء بينما يتشبث به جزء منك. ما الذي قد يساعدك على إرخاء قبضتك؟
meaningUpright: |-
  رغم اسمها، لا تتحدث هذه البطاقة عن الموت الجسدي. إنها تتحدث عن النهايات بالمعنى الإنساني العادي: ختام مرحلة، أو دور، أو عادة، أو طريقة في رؤية نفسك. وكما يعرّي الخريف الأغصان قبل النمو الجديد، توحي البطاقة بأن بعض الأشياء تحتاج إلى أن تنتهي كي تبدأ أشياء أخرى.
  في الحياة اليومية، قد تعكس هذه البطاقة مغادرة منزل، أو إنهاء دورة دراسية، أو الابتعاد عن مشروع، أو ملاحظة أن نسخة قديمة منك لم تعد تناسبك. وقد تحمل مزيجًا من المشاعر: ارتياحًا، وحزنًا، وعدم يقين، بل وحماسة أيضًا. كلها طبيعية. فالتحول نادرًا ما يكون مرتبًا، وغالبًا ما يستغرق وقتًا لفهم ما جعله التغيير ممكنًا.
  تدعوك هذه البطاقة إلى التفكير فيما هو جاهز لأن يُترك. يمكنك أن تسأل ما الذي لا تزال تحمله بدافع العادة، وأيّ مساحة قد تنفتح لو وضعته جانبًا. تسلّط بطاقة الموت الضوء على أن النهايات، حتى المرحَّب بها، تستحق الاعتراف. وتكريم ما كان قد يسهّل الالتفات إلى ما قد يأتي بعده.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد تعكس بطاقة الموت نهاية تأخذ وقتها. قد تستشعر أن مرحلة ما قد انتهت بينما لا تزال تتمسك بها، ربما لأن المألوف يبدو أكثر أمانًا من المجهول، أو لأن التخلي يبدو كأنه فقدان لجزء منك.
  وقد تشير هذه البطاقة أيضًا إلى انتقال يحدث ببطء وهدوء تحت السطح، لا في لحظة واحدة واضحة. فليس كل تغيير يأتي بقطيعة حاسمة.
  ربما يفيدك أن تلاحظ ما تتشبث به وما يحميه هذا التشبث. قد تساعد طقوس الختام الصغيرة، ككتابة رسالة وداع لا ترسلها، أو إفراغ درج، أو الاحتفاء بيوم أخير. لا حاجة إلى الاستعجال. فالسماح لنفسك بالحزن على ما ينتهي قد يجعل التحرر ألطف.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس هذه البطاقة تغيرًا مهمًا في طريقة عمل رابط ما: مرحلة جديدة، أو تبدلًا في الأدوار، أو نهاية نمط لم يعد يفيد أيًّا من الطرفين. وهي لا تشير إلى السلامة الجسدية لأي أحد. وقد تدعوك إلى الاعتراف معًا بما يتغير، بصدق ورعاية.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تشير هذه البطاقة إلى التمسك بديناميكية قديمة تجاوزها الطرفان، أو إلى صعوبة في تقبّل أن رابطًا ما قد تغير. يمكنك التفكير فيما تحتاج إليه لتسمح للعلاقة بأن تتخذ شكلها الجديد، أيًّا كان هذا الشكل.
  workUpright: >-
    في العمل أو في مشروع ما، تسلّط بطاقة الموت الضوء على الإنجاز والانتقال. وقد تعكس إنهاء دور، أو إغلاق مشروع، أو التقاعد عن طريقة عمل استنفدت غرضها. يمكنك أن تجرد ما تعلّمته وما تريد أن تحمله معك إلى الفصل التالي.
  workReversed: >-
    في الوضع المعكوس، قد تعكس بطاقة الموت البقاء مع مهمة أو دور أو أسلوب بدافع العادة بعد أن توقف عن ملاءمتك. وقد تشير أيضًا إلى الخوف مما يأتي بعده. يمكنك أن تدوّن ما لا يزال الوضع الحالي يمنحك إياه وما يكلّفك، وتلاحظ ما تخبرك به هذه الموازنة.
  growthUpright: >-
    قد تتساقط الهويات القديمة كأوراق الشجر، فاسحةً المجال لما لا يزال يتشكل. يمكنك أن تلاحظ قناعات عن نفسك كانت صحيحة يومًا لكنها لم تعد كذلك. والتخلي عنها قد يصنع مساحة لنسخة منك أصدق مع الشخص الذي تصير إليه.
  growthReversed: >-
    في الوضع المعكوس، قد تسأل بطاقة الموت ما إذا كان الخوف من التغيير يبقيك في مساحة أضيق مما تحتاج إليه. وقد تعكس تحولًا بطيئًا صبورًا يستحق ثقتك. يمكنك اختيار أمر صغير واحد لتتخلى عنه هذا الأسبوع، وملاحظة شعورك بعد ذلك.
