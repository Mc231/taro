shortUpright: >-
  شرارة اهتمام جديدة تطلب قليلًا من الهواء والانتباه قبل أن تصبح لهبًا.
shortReversed: >-
  قد تكون الشرارة موجودة، لكن شيئًا ما يمنعها من الاشتعال بعد؛ يمكنك ملاحظة ما تحتاج إليه.
meaningUpright: |-
  آس العصي هو أول وميض للنار في المجموعة: فكرة مفاجئة، أو انجذاب فضولي، أو اللحظة التي يجعلك فيها شيء ما تعتدل في جلستك وتفكر «أريد أن أجرّب هذا». إنه طاقة خام قبل أن تكون لها خطة، أقرب إلى بذرة حماسة منه إلى مشروع مكتمل.
  في الحياة اليومية، قد يبدو ذلك رسمًا سريعًا على ظهر إيصال، أو رغبة في تعلّم آلة موسيقية طالما أعجبتك، أو حديثًا يتركك مفعمًا بالإمكانات. وقد يكون أيضًا شهية متجددة لشيء وضعته جانبًا، تعود بدفء أكبر مما توقعت.
  تدعوك هذه البطاقة إلى ملاحظة الوجهة التي تريد طاقتك أن تذهب إليها الآن، دون مطالبتها بتبرير نفسها بعد. الشرارة لا تحتاج إلى دراسة جدوى؛ تحتاج إلى قليل من الأكسجين. يمكنك أن تمنحها اليوم منفذًا صغيرًا وملموسًا، كعشر دقائق، أو ملاحظة أولى، أو رسالة واحدة إلى شخص يشاركك الاهتمام، وترى كيف تستجيب.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس آس العصي شرارة لم تشتعل تمامًا. قد يكون الاهتمام حقيقيًا، لكنه يُؤجَّل إلى الغد باستمرار، أو يتوهج ثم يخبو قبل أن يجد ما يتمسك به. وأحيانًا تتوزع الطاقة على بدايات كثيرة فلا ينال أيّ منها دفئًا كافيًا.
  وقد يشير أيضًا إلى مرحلة أهدأ. فليست كل فكرة جاهزة للعرض؛ بعضها يحتاج إلى وقت تحت التراب، يجمع قوته في ملاحظات خاصة وأحلام يقظة قبل أن يصبح جاهزًا لضوء النهار.
  قد تكون هذه لحظة للسؤال عمّا تحتاج إليه شرارتك فعلًا. أهو الوقت، أم خطوة أولى أوضح، أم إذن بأن تكون في موقع المبتدئ، أم مجرد راحة قبل البدء؟ يمكنك اختيار فكرة واحدة من الكومة ومنحها مساحة صغيرة محمية، بدلًا من انتظار اللحظة المثالية.
aspects:
  relationshipsUpright: >-
    في الروابط القريبة، قد تعكس هذه البطاقة دفقة جديدة من الدفء أو الفضول: رغبة في التخطيط لشيء جديد معًا، أو طرح أسئلة مختلفة، أو إضفاء مزيد من المرح على علاقة مألوفة. يمكنك أن تلاحظ مَن يشعل حماستك هذه الأيام، وأيّ مغامرة مشتركة، ولو صغيرة، قد تسمح لهذه الطاقة بالتنقل بينكما.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تبدو الشرارة بينك وبين شخص قريب مكتومة بفعل الروتين أو التعب أو تردد لم يُعبَّر عنه. هذا لا يعني أن الدفء قد زال؛ ربما ينتظر فرصة فحسب. يمكنك التفكير فيما كان يشعل الحديث بينكما، وما إذا كانت لفتة فضول صغيرة قد تستدعي شيئًا من تلك الحيوية.
  workUpright: >-
    في العمل أو في مشروع إبداعي، قد يشير آس العصي إلى فكرة لها جاذبية حقيقية: مقاربة جديدة، أو مشروع جانبي، أو مقترح تعود إليه باستمرار. يمكنك أن تمنحها شكلًا ملموسًا أولًا، كمخطط أولي، أو نموذج تجريبي، أو عرض قصير لشخص تثق به، كي تُختبر في العلن لا في ذهنك فقط.
  workReversed: >-
    في الوضع المعكوس، قد يكون الدافع متذبذبًا. ربما تنتظر فكرة ما موافقة، أو تتنافس بدايات كثيرة على وقتك. قد تكون هذه لحظة لاختيار خيط واحد تتبعه ووضع الخيوط الأخرى جانبًا الآن. فالتقدم الصغير المرئي في فكرة واحدة قد يعيد إشعال طاقة أكبر من التخطيط لعدة أفكار معًا.
  growthUpright: >-
    الفضول معلّم قائم بذاته، وهذه البطاقة توحي باتباعه. فما تنجذب إليه يقول غالبًا شيئًا عمّا يريد أن ينمو فيك. يمكنك أن تدوّن الشرارات التي تشعر بها هذا الأسبوع دون الحكم عليها، وتبحث عن تلك التي تعود باستمرار.
  growthReversed: >-
    في الوضع المعكوس، ربما تنتظر الشعور بالجاهزية قبل أن تبدأ، أو تقسو على نفسك لأنك لا تشعر بالإلهام. الطاقة تميل إلى التحرك في مواسم. يمكنك أن تعامل هذه الفترة بوصفها وقتًا للتجمع الهادئ: الراحة والقراءة والملاحظة، وترك اهتمام جديد يتشكل بإيقاعه الخاص.
