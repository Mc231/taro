imageryNote: >-
  تنتصب في الإطار عصا حية واحدة، مقطوعة حديثًا لكنها لا تزال تطلق براعم خضراء، كأن الخشب لا يستطيع التوقف عن النمو. ويتجمع عند طرفها لهب صغير أو توهج. يرمز الغصن إلى قوة إبداعية خام لا تزال حية وغير مشكَّلة، وتوحي الأوراق الجديدة بأن الإلهام ينمو حين يُرعى. وقد تحمل درجات الأحمر والذهبي الدافئة عنصر النار، مع سماء مفتوحة في الخلفية تلمّح إلى مساحة لا تزال تنتظر الاستكشاف.
