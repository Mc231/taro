shortUpright: >-
  لحظة للنظر إلى الوراء بصدق، ومسامحة ما يمكنك مسامحته، وتلبية ما يناديك إلى الأمام.
shortReversed: >-
  قد يكون صوت الناقد الداخلي أعلى من المعتاد. ماذا قد تُظهر لك نظرة منصفة ولطيفة إلى ماضيك؟
meaningUpright: |-
  الحكم بطاقة يقظة وتجدد. وهي لا تتعلق بحكم الآخرين عليك بقدر ما تتعلق ببلوغ نقطة من التأمل الصادق في الذات: النظر إلى حيث كنت، وأخذ ما تعلّمته، والشعور بالجاهزية للنهوض نحو فصل جديد. وكثيرًا ما يصاحبها إحساس بنداء، دافع داخلي يقول إن الوقت قد حان.
  في الحياة اليومية، قد تعكس هذه البطاقة لحظة وضوح بعد فترة طويلة من الحيرة، أو قرارًا بالسعي أخيرًا وراء شيء أجّلته، أو مراجعة لاختيار سابق تساعدك على المضي قدمًا. وقد تشير إلى المسامحة، لنفسك أو لشخص آخر، وإلى الارتياح الذي يأتي من رؤية قصتك في ضوء أكمل وأكثر إنصافًا.
  تدعوك هذه البطاقة إلى التفكير فيما يناديك الآن. يمكنك أن تسأل ما الذي ستفعله لو وثقت بأن تجاربك السابقة قد هيأتك له. يسلّط الحكم الضوء على التجدد عبر الفهم: فحين تستطيع النظر إلى تاريخك بصدق ورحمة، قد تجد أنك أكثر حرية في اختيار ما يأتي بعد ذلك.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس الحكم ناقدًا داخليًا قاسيًا. ربما تعيد استحضار أخطاء قديمة، أو تشك في قيمتك، أو تتردد في المضي قدمًا بسبب شيء في الماضي. النداء موجود، لكن الشعور بالذنب أو الخوف قد يطغى عليه.
  وقد تشير هذه البطاقة أيضًا إلى تجنّب التأمل كليًا: الانتقال من شيء إلى آخر دون التوقف للتعلم مما حدث.
  ربما يفيدك أن تنظر إلى ماضيك بالإنصاف الذي تمنحه لصديق. ماذا تعلّمت، وما الذي تشعر بالجاهزية لوضعه جانبًا؟ قد تكون كتابة رسالة تفهّم إلى نفسك الأصغر سنًّا إحدى طرق البدء. تلبية النداء لا تتطلب الكمال؛ قد تبدأ بخطوة صادقة واحدة.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد يعكس الحكم نقطة تحول: تصفية مظالم قديمة، أو التزامًا متجددًا، أو مراجعة متبادلة تقرّب بينكما. وقد يدعوك إلى الحديث بصدق عن الماضي والاتفاق معًا على ما تريدانه في المستقبل. والمسامحة، حيث تبدو مناسبة، قد تفسح المجال لبداية جديدة.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تشير هذه البطاقة إلى لوم أو أحكام عالقة في علاقة ما، من جانب واحد أو من الجانبين. يمكنك التفكير فيما إذا كان التمسك بالجراح القديمة لا يزال يحميك، أم أنه يبقيك عالقًا. حديث منفتح وهادئ قد يساعد الطرفين على رؤية الأمور بإنصاف أكبر.
  workUpright: >-
    في العمل أو في مشروع ما، يسلّط الحكم الضوء على الإحساس بالرسالة. وقد يعكس إدراك نوع العمل الذي يبدو ذا معنى، أو مراجعة مشاريع سابقة لتقرير ما يأتي بعدها. يمكنك الإصغاء إلى ما يثير حماستك، والسؤال كيف يمكن لمهاراتك أن تخدم هذا الاتجاه.
  workReversed: >-
    في الوضع المعكوس، قد يعكس الحكم خوفًا من النقد يعيقك، أو تجاهلًا لإحساس بأن وقت التغيير قد حان. وقد يشير أيضًا إلى قسوة مفرطة في تقييم أدائك السابق. يمكنك أن تدوّن ما تعلّمته وكيف قد يرشد خطوتك التالية.
  growthUpright: >-
    مراجعة متأنية لرحلتك حتى الآن قد تكون نقطة تحول في حد ذاتها. يمكنك أن تنظر إلى الوراء على فترة مهمة، وتلاحظ كيف نموت وما الذي تخليت عنه. وهذا المنظور قد يساعدك على تلبية نداء جديد بثقة ووضوح.
  growthReversed: >-
    في الوضع المعكوس، قد يسأل الحكم ما إذا كنت تحمل شعورًا بالذنب أو لومًا للذات لا داعي له. وقد يعكس حاجة إلى التحرر من قصص قديمة عن نفسك. يمكنك التمرن على ملاحظة اللحظة التي يقسو فيها صوتك الداخلي، ومنح نفسك بلطف نظرة أكثر إنصافًا. فالصوت الداخلي المنصف قد يجعل النمو أخف وأكثر إمكانًا.
