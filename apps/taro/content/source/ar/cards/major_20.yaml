imageryNote: >-
  يُتخيَّل حكم Taro منظرًا واسعًا عند الفجر بعد شتاء طويل، يرنّ فيه جرس صافٍ من قمة تل، ويخرج الناس من بيوتهم إلى الضوء الأول، يتمطّون ويرفعون أبصارهم. ويكشف الثلج الذائب عن براعم خضراء تحته. وتوحي نافذة مفتوحة تتطاير ستائرها إلى الخارج بنداء داخلي يُلبّى. وتلمّح الجبال البعيدة إلى المنظور الذي يجلبه التأمل الصادق، فيما تتحدث ألوان الصباح الشاحبة عن التجدد.
