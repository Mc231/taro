imageryNote: >-
  قد تُظهر الصورة شخصًا جالسًا يضم عملة واحدة إلى صدره، بينما تستقر أخرى تحت قدميه وتتوازن أخرى فوق رأسه، وخلفه بلدة على مسافة. قد توحي الوقفة المنغلقة بالحماية والاكتفاء بالذات، والمباني البعيدة بعالم أُبقي خارج الدائرة. وقد تؤكد الأشكال الصلبة الكتلية والهيئة المغلقة الاستقرار، إلى جانب السؤال عمّا يكلّفه هذا الاستقرار.
