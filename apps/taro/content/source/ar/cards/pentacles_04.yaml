shortUpright: >-
  ربما تمسك شيئًا قريبًا منك لتحفظه. يمكنك ملاحظة أين تمنحك تلك الحماية الثبات وأين تبدأ في تقييدك.
shortReversed: >-
  قد تكون قبضة مشدودة في طور الارتخاء، أو تطلب ذلك. يمكنك أن تستكشف ما الذي يمكن أن تتركه يتدفق دون أن تشعر بانعدام الأمان.
meaningUpright: |-
  يُظهر أربعة من العملات شخصًا يمسك عملاته قريبة منه: واحدة مضمومة إلى صدره، وأخرى مثبتة تحت قدميه أو فوق رأسه. إنها بطاقة عن الأمان والرغبة في حماية ما لديك، سواء كان مالًا أو وقتًا أو طاقة أو مساحة أو مشاعر.
  في هذا حكمة. فبعد فترة من عدم اليقين، قد يكون الإمساك الثابت اختيارًا معقولًا. قد تتعرف عليه في ادخار جزء من طاقتك لنفسك، أو حماية روتين يمنحك الهدوء، أو وضع حدّ حول عطلات نهاية الأسبوع.
  لكن الوقفة نفسها قد تتصلب. فاليد التي تقبض طويلًا لا تستطيع تلقي أي شيء جديد. تدعوك البطاقة إلى ملاحظة الفرق بين التمسك بشيء لأنه مهم، والتمسك به لأن التخلي يبدو مخيفًا. يمكنك أن تسأل عمّا تحميه، وما الذي يلزم لتشعر بالأمان مع قليل من الانفتاح، وما إذا كان شيء مما تحتفظ به يمكن أن يُتقاسم، أو يُنفق على الفرح، أو يُسمح له بالتغير.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس أربعة من العملات قبضة بدأت ترتخي. ربما تلاحظ كم يتطلب إبقاء كل شيء في مكانه من جهد، وتتساءل عمّا قد يحدث لو استرخيت قليلًا. وقد يبدو ذلك محرِّرًا ومقلقًا في آن.
  وقد تشير البطاقة أيضًا إلى الوجه الآخر للموضوع نفسه: قلق من الندرة يظهر في هيئة تشبث، أو على النقيض، ترك الموارد تنزلق دون انتباه يُذكر. وكلاهما قد ينبع من المصدر نفسه، الإحساس بأن الأمان هش.
  يمكنك أن تستكشف علاقتك بالكفاية. ما الذي سيبدو كافيًا من الوقت أو المال أو الانتباه أو الراحة؟ فالتجارب الصغيرة في السخاء تجاه نفسك أو الآخرين، بإيقاعك الخاص، قد تُظهر أين يبدو الانفتاح آمنًا وأين لا يزال حدّ ما يخدمك.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس هذه البطاقة نزعة حمائية: حراسة مشاعرك أو استقلاليتك أو وقتك. والحدود الصحية جزء من ذلك. ويمكنك أيضًا أن تلاحظ ما إذا كان الحذر يُبقي شخصًا قريبًا على مسافة ذراع. فمشاركة أمر صغير وحقيقي عن نفسك قد تختبر ما إذا كان في الرابط متسع لقليل من الانفتاح.
  relationshipsReversed: >-
    في الوضع المعكوس، قد توحي البطاقة بلين، باستعداد للسماح لشخص ما بالاقتراب أو للتوقف عن الحساب المفصّل لمن أعطى ماذا. وقد تعكس أيضًا قلقًا من فقدان شخص ما يظهر في هيئة سيطرة. يمكنك أن تسأل بلطف عمّا قد يساعدك على الشعور بالأمان، والحديث عنه بدلًا من إحكام قبضتك.
  workUpright: >-
    في العمل، قد يصف أربعة من العملات مقاربة حذرة وحمائية: التمسك بدور أو أسلوب أو معلومات تبدو موطئ قدمك. للاستقرار قيمته. يمكنك أن تسأل ما إذا كان هذا الحذر لا يزال مناسبًا، أم أن مشاركة المعرفة وتجربة مقاربة جديدة قد تجعل موقعك يبدو أقوى لا أضعف.
  workReversed: >-
    هنا قد تعكس البطاقة إرخاء العادات الجامدة في العمل، أو التفويض، أو تقاسم الفضل بحرية أكبر. وقد تشير أيضًا إلى استخدام مشتت للوقت أو الجهد. يمكنك النظر إلى أين تذهب طاقتك كل أسبوع، وتقرر عن قصد ما يستحق الحماية الحذرة وما يمكن أن يتدفق بسهولة أكبر.
  growthUpright: >-
    في النمو الشخصي، تدعوك هذه البطاقة إلى استكشاف ما يعنيه الأمان لك. فبعض ما تتمسك به قد يكون مراسي ثمينة؛ وبعضه قد يكون احتياطات قديمة من أوقات أصعب. يمكنك فرزها بلطف، مع الاحتفاظ بما لا يزال يمنحك الثبات، وملاحظة ما لم تعد بحاجة إلى حراسته عن قرب.
  growthReversed: >-
    في الوضع المعكوس، قد تعكس البطاقة استعدادًا متناميًا للثقة، أو إنفاق الطاقة على أشياء تجلب الفرح، أو ترك روتين ما يتغير. يمكنك أن تلاحظ أي انزعاج يطفو وأنت ترخي السيطرة، وتتعامل معه بفضول. فالشعور بالأمان مع الإمساك بالأشياء برفق مهارة يمكن بناؤها ببطء.
