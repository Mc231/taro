shortUpright: >-
  شيء رعيته ينمو ببطء. قد تكون لحظة مناسبة للتوقف، والنظر إلى تقدمك، واختيار ما سترعاه بعد ذلك.
shortReversed: >-
  قد يبدو التقدم أبطأ مما أملت. يمكنك أن تسأل ما إذا كان الجهد يحتاج إلى الصبر، أم إلى اتجاه جديد، أم ببساطة إلى راحة.
meaningUpright: |-
  يُظهر سبعة من العملات شخصًا يتوقف في منتصف عمله، متكئًا على أداة وناظرًا إلى نبتة مثقلة بالعملات. الحصاد لم ينضج بعد، لكن النمو ظاهر. إنها بطاقة مراجعة الحصيلة: التراجع خطوة عن الجهد لرؤية ما أنتجه حتى الآن وما لا يزال يحتاج إليه.
  قد تتعرف على ذلك في مشروع طويل بلغ منتصفه، أو مهارة تحسنت دون أن تلاحظ، أو علاقة بُنيت على مدى سنوات، أو حديقة تمتلئ ببطء. والتوقف مهم. فمن دونه، قد تواصل العمل بدافع العادة لا بدافع النية.
  تدعوك البطاقة إلى النظر في جهدك بصبر وصدق. أيّ أجزاء عملك تزدهر؟ وأيّها توقف؟ وهل الإيقاع الذي تحافظ عليه إيقاع يمكنك الاستمرار عليه؟ يمكنك التعامل مع هذه اللحظة بوصفها نقطة مراجعة، فتختار عن قصد أين تضع طاقتك في الموسم المقبل بدلًا من مجرد المواصلة.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس سبعة من العملات إحباطًا من بطء التقدم. ربما تبذل عملًا ثابتًا دون أن ترى نتائج، وتتساءل إن كان الأمر يستحق المواصلة. وقد يشير أيضًا إلى جهد موزع على أحواض كثيرة، فلا ينال أيّ منها ما يكفي من الماء.
  تطلب منك هذه القراءة مراجعة الخطة لا الحكم على نفسك. فبعض الأشياء تنمو ببطء بطبيعتها؛ وبعضها قد يحتاج إلى مقاربة مختلفة.
  يمكنك أن تنظر بصدق إلى أين يذهب وقتك ورعايتك. أيّ الجهود لا يزال يعكس ما تريده؟ وأيّها يستمر أساسًا لأنك استثمرت فيه الكثير بالفعل؟ فالسماح لنفسك بإعادة توجيه الطاقة، أو بالراحة قبل القرار، قد يحوّل الإحباط إلى إحساس أوضح بما ينبغي رعايته.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس هذه البطاقة قيمة الصبر والانتباه الثابت. فالثقة والقرب ينموان غالبًا ببطء، عبر لحظات صغيرة كثيرة. يمكنك أن تتوقف لتلاحظ كيف تعمّق رابط ما مع الوقت، وتسأل عمّا يحتاج إليه بعد ذلك: مزيدًا من الوقت معًا، أو اهتمامًا مشتركًا جديدًا، أو ببساطة استمرار الرعاية الموثوقة.
  relationshipsReversed: >-
    في الوضع المعكوس، قد توحي البطاقة بنفاد صبر تجاه طريقة تطور رابط ما، أو بإحساس بالعطاء الكثير دون أن يعود. يمكنك التأمل فيما إذا كانت توقعاتك تتوافق مع الإيقاع الذي يمكن لهذا الرابط أن ينمو به واقعيًا، والحديث بانفتاح عمّا يأمله كل منكما.
  workUpright: >-
    في العمل، يدعو سبعة من العملات إلى وقفة لمراجعة التقدم في الجهود طويلة الأمد. يمكنك تقييم ما ينجح، وما توقف، وأين تركز بعد ذلك. وقد تكون أيضًا لحظة لتقدير المهارات والأسس التي بنيتها، حتى لو كانت النتيجة النهائية لا تزال بعيدة بعض الشيء.
  workReversed: >-
    هنا قد تعكس البطاقة تململًا من بطء النتائج، أو جهدًا فقد اتجاهه. يمكنك مراجعة أهدافك والتحقق مما إذا كانت مهامك اليومية لا تزال تخدمها. فتعديل الخطة، أو تضييق التركيز، أو طلب الملاحظات، قد يساعد الجهد على أن يبدو هادفًا من جديد.
  growthUpright: >-
    في النمو الشخصي، تدعوك هذه البطاقة إلى الصبر مع تطورك. فالتغيير يحدث غالبًا تحت السطح قبل أن يظهر. يمكنك أن تنظر إلى الأشهر الماضية وتلاحظ ما نما، ولو قليلًا، وتدع هذا الدليل يشجعك على مواصلة رعاية ما يهم.
  growthReversed: >-
    في الوضع المعكوس، قد تعكس البطاقة إحباطًا أو مقارنة بتقدم الآخرين. يمكنك أن تستكشف ما إذا كنت تقيس النمو بجدول زمني ليس لك. واختيار ممارسة واحدة لمواصلتها بعناية، وترك غيرها الآن، قد يجعل النمو أخف.
