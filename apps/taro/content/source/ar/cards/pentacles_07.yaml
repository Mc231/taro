imageryNote: >-
  قد تُظهر الصورة شخصًا يتوقف بجوار نبتة أو كرمة مورقة تتدلى منها سبع عملات كثمار تنضج، متكئًا على معول أو مجرفة. قد ترمز الوقفة المستريحة إلى التقييم والحاجة إلى التراجع خطوة، فيما توحي النبتة بنمو يأخذ وقته الخاص. ويمكن للتربة والأوراق والأداة معًا أن تتحدث عن العمل الدؤوب، فيما تذكّر الطبيعة غير الناضجة للحصاد الناظر بأن العمل لا يزال جاريًا.
