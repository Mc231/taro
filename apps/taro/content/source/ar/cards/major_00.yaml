shortUpright: "خطوة نحو شيء جديد، يقودها الفضول أكثر من اليقين."
shortReversed: "وقفة على الحافة: أهي حذر، أم خوف من أن يبدو المرء ساذجًا؟"
meaningUpright: |-
  يقف الأحمق في أول الأركانا الكبرى، ورقمه صفر، قبل أن يُتعلَّم أي درس. إنه طاقة من ينطلق بحقيبة خفيفة ووجه منفتح، مهتمًا بما قد يكشفه الطريق أكثر من معرفة أين ينتهي بالضبط.
  في الحياة اليومية، قد تعكس هذه البطاقة الأسبوع الأول في مكان جديد، أو هواية بدأتها دون خطة لإتقانها، أو حديثًا تبدؤه دون أن تتمرّن على كل كلمة. وقد تشير إلى جزء منك مستعد للتجربة، بينما يطلب جزء آخر يقينًا لا يملك أحد أن يقدّمه. هنا، عدم المعرفة ليس عيبًا؛ إنه ببساطة المكان الذي تبدأ منه كل رحلة.
  تدعوك هذه البطاقة إلى التفكير في المواضع التي قد يفيدك فيها قدر أكبر من الخفة. ما الذي قد يتغير لو سمحت لنفسك بأن تعود إلى موقع المبتدئ، تطرح الأسئلة البسيطة وتتعلم بالممارسة؟ لا يطلب منك الأحمق أن تتجاهل الحسّ السليم، بل يطلب أن تلاحظ ما إذا كان الخوف من الخطأ يمنعك من اتخاذ أي خطوة على الإطلاق.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يشير الأحمق إلى شرارة بداية جديدة لم تشتعل تمامًا بعد. قد تشعر بانجذاب نحو شيء جديد بينما لا تتحرك قدماك، تقلّب الفكرة وتنتظر علامة تقول إن الحركة آمنة. أحيانًا يكون هذا الانتظار حكيمًا، وأحيانًا يتحول بهدوء إلى عادة.
  وقد يعكس هذا الوضع أيضًا الميل المعاكس: طاقة تندفع إلى الأمام دون نظر، تقول نعم لكل شيء وتترك مساحة قليلة لملاحظة أين تقع القدمان. يشترك الميلان في سؤال واحد عن الجاهزية والثقة.
  ربما يفيدك أن تسأل أيّهما أقرب إليك الآن. إن كنت تتراجع، فما الطريقة الصغيرة القليلة المخاطر لتجربة الأمر؟ وإن كنت تسابق الوقت، فكيف يمكنك أن تحافظ على حماستك وتضيف لحظة توقف واحدة قبل القفزة التالية؟
aspects:
  relationshipsUpright: >-
    في العلاقات، قد يعكس الأحمق صفة مرحة غير متحفظة: لقاء شخص دون سيناريو مسبق، أو السماح لرابط مألوف بأن يفاجئك من جديد. وقد يدعوك إلى الاقتراب من المقرّبين منك بفضول، وطرح أسئلة تظن أنك تعرف إجاباتها. الانفتاح هنا ليس سذاجة، بل استعداد للحضور دون أن تقرر مسبقًا كيف ينبغي أن تسير الأمور.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تشير هذه البطاقة إلى تردد في السماح لشخص ما بالاقتراب، أو إلى تحرك سريع لا يترك للطرف الآخر مجالًا لمجاراتك. يمكنك أن تلاحظ ما إذا كنت تحمي نفسك بالغموض، أو تتجاوز المراحل الأبطأ من التعارف. حديث لطيف عن الإيقاع، إيقاعك وإيقاعه، قد يفتح مساحة لكليكما.
  workUpright: >-
    في العمل أو في أي مشروع، قد يعكس الأحمق بداية شيء غير مألوف: دور جديد، أو دورة تدريبية، أو فكرة إبداعية بلا سجل سابق. وهو يدعوك إلى التعامل مع الأخطاء الأولى بوصفها معلومات لا أحكامًا. يمكنك أن تسأل ما الذي ستجربه لو سُمح للمحاولة الأولى بأن تكون خشنة، ومن يمكنه أن يساعدك على تعلّم الأساسيات في الطريق.
  workReversed: >-
    في الوضع المعكوس، قد يعكس الأحمق فكرة تؤجَّل باستمرار حتى تبدو الظروف مثالية، أو قفزة تمت دون التحقق من الأساسيات. يمكنك التفكير فيما إذا كنت تحتاج إلى مزيد من المعلومات أم إلى مزيد من الشجاعة فحسب. تدوين أصغر خطوة أولى ممكنة، ومعها احتياط عملي واحد، قد يحوّل أمنية غامضة إلى شيء يمكن اختباره دون المراهنة بكل شيء.
  growthUpright: >-
    في النمو الشخصي، تحتفي هذه البطاقة بعقل المبتدئ. وقد تدعوك إلى تجربة شيء ليس لديك فيه سمعة تحميها: مهارة جديدة، أو طريق مختلف إلى البيت، أو سؤال تطرحه بصوت عالٍ. النمو هنا يأتي من الحفاظ على الفضول والسماح لنفسك بأن تُفاجأ، لا من إتقان كل شيء من المحاولة الأولى.
  growthReversed: >-
    في الوضع المعكوس، قد يسأل الأحمق ما إذا كان الخوف من الظهور بمظهر سخيف قد بدأ يضيّق عالمك. وقد يعكس أيضًا قلقًا يقفز من شيء جديد إلى آخر دون أن يترك لأي منها فرصة التجذّر. يمكنك أن تلاحظ أي النمطين يبدو مألوفًا، وأن تجرّب عكسه اللطيف لمدة أسبوع.
