imageryNote: >-
  قد تُظهر الصورة شخصًا منحنيًا على طاولة عمل، الأدوات في يديه، يشكّل عملة بينما تتدلى عملات مكتملة في صف مرتب قريب، ربما على عمود أو جدار. وقد يوحي طريق أو بلدة في البعيد بعالم أوسع ابتعد عنه الصانع ليركّز. وقد ترمز العملات المتكررة إلى الممارسة والاتساق، والوقفة المستغرقة إلى الرضا الهادئ في العمل الماهر المنتبه.
