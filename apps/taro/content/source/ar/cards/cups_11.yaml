  relationshipsReversed: >-
    في الوضع المعكوس، قد تشير هذه البطاقة إلى خجل، أو انعدام أمان عاطفي، أو إشارات متضاربة في رابط ما. يمكنك أن تسأل ما إذا كنت أنت أو شخص قريب تكبحان مشاعركما خوفًا من الرفض. والصدق اللطيف، المقدَّم بإيقاع مريح، قد يسهّل على الطرفين الشعور بالأمان.
  workUpright: >-
    في العمل، قد تعكس هذه البطاقة فكرة إبداعية جديدة، أو مقاربة طازجة، أو فضولًا تجاه مجال مختلف. وقد تدعوك إلى مشاركة اقتراح غير مألوف، أو التجريب بمرح في مهمة ما. فالأفكار المبكرة لا تحتاج إلى أن تكون مصقولة؛ تحتاج إلى مساحة لتُستكشف قبل أن يحكم عليها أحد.
  workReversed: >-
    في الوضع المعكوس، قد تعكس البطاقة تعثرًا إبداعيًا، أو ترددًا في مشاركة الأفكار خوفًا من النقد. يمكنك تجربة العمل على شيء لنفسك أولًا، دون توقع نتائج. وبناء الثقة ببطء قد يساعدك على تقديم أفكارك حين تبدو جاهزة لأن تُرى.
  growthUpright: >-
    في النمو الشخصي، يدعوك تابع الكؤوس إلى تنمية الفضول تجاه مشاعرك وحدسك. يمكنك الاحتفاظ بدفتر للأحلام أو الصور أو الانطباعات الغريبة، لمجرد ملاحظة الأنماط مع الوقت. ومقاربة حياتك الداخلية بمرح قد تجعل فهم الذات أخف وأكثر جاذبية.
  growthReversed: >-
    في الوضع المعكوس، قد تطلب منك هذه البطاقة اللطف مع الأجزاء الأكثر هشاشة في نفسك. يمكنك أن تلاحظ اللحظات التي تصرف فيها مشاعرك بوصفها طفولية أو سخيفة. وتقديم التشجيع لنفسك، كما تفعل مع صديق صغير، قد يساعد الحساسية على أن تصبح قوة لا شيئًا يُخفى.
