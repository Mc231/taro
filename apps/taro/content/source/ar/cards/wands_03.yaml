imageryNote: >-
  يقف شخص على تل أو قمة جرف وظهره ملتفت جزئيًا، وحوله ثلاث عصي مغروسة كعلامات على الجهد، يراقب قوارب أو مسافرين يعبرون مياهًا مفتوحة أو سهولًا في الأسفل. وقد يوحي الضوء المبكر ببدء مرحلة جديدة. ترمز الحركة البعيدة إلى خطط انطلقت بالفعل، والوقفة الثابتة إلى ثقة صبورة بينما لا تزال النتائج في طريقها.
