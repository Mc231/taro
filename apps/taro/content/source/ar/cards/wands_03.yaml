shortUpright: >-
  شيء أطلقته بدأ يمضي في طريقه؛ يمكنك أن ترقب ما يعود إليك وتستعد للمرحلة التالية.
shortReversed: >-
  قد يبدو التقدم أبطأ مما أملت؛ ربما يكون هذا وقتًا لتعديل التوقعات لا للاستسلام.
meaningUpright: |-
  إذا كان اثنان من العصي يدور حول التخطيط، فإن ثلاثة من العصي يُظهر خططًا انطلقت بالفعل. لقد غادرت السفن الميناء، إن صح التعبير: أُرسلت الرسائل، وقُدّمت الطلبات، واتُّخذت الخطوات الأولى. والآن تأتي فترة مراقبة الأفق بينما تتكشف الأمور خارج سيطرتك المباشرة.
  قد تعكس هذه البطاقة الشعور المُرضي بالتقدم المبكر، كمشروع يكسب أول داعميه، أو عادة جديدة تستقر، أو تعاون يمتد أبعد مما توقعت. وقد تسلّط الضوء أيضًا على قيمة التحضير: لقد أنجزت من العمل الأساسي ما يكفي لتتراجع خطوة وتنظر أبعد.
  الدعوة هنا أن تجمع بين أمرين معًا: الثقة بما بدأته والانفتاح على طريقة تطوره. يمكنك أن تلاحظ أين بدأت جهودك تتصل بأشخاص آخرين، وأن تفكر فيما قد تطلبه منك المرحلة التالية. فالتوسع يحتاج غالبًا إلى مهارات جديدة، أو شركاء جدد، أو صورة أكبر قليلًا لما تبنيه.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس ثلاثة من العصي انتظارًا تحول إلى قلق. ربما أنجزت العمل ولا ترى إلا القليل يعود إليك، أو ربما تبدو النتائج مختلفة عمّا تخيلته. من السهل أن يُقرأ البطء على أنه فشل، حتى حين تأخذ الأمور وقتها فحسب.
  وأحيانًا تشير هذه البطاقة أيضًا إلى رؤية ضيقة: التركيز على نتيجة واحدة وتفويت العلامات الأصغر للحركة من حولك، أو التخطيط لمسافة بعيدة جدًا حتى يبدو الحاضر فارغًا.
  قد تكون هذه لحظة مناسبة للنظر في توقعاتك. هل كانت جداولك الزمنية واقعية؟ هل هناك معلومات تنقصك، أو شريك لم تطلب مساعدته بعد؟ يمكنك تعديل الخطة دون التخلي عنها، وتدوين أي تقدم حدث بهدوء بالفعل.
aspects:
  relationshipsUpright: >-
    في الروابط القريبة، قد تعكس هذه البطاقة علاقة تنمو أبعد من فصلها الأول، بثقة أكبر، أو خطط مشتركة جديدة، أو انفتاح على إشراك أشخاص آخرين. وقد تدعوك إلى تقدير المسافة التي قطعتماها معًا والحديث عن الوجهة التي تودان الذهاب إليها، مع ترك مساحة لأفق كل طرف الخاص.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تشعر بأنك تنتظر أن يلاقيك أحدهم في منتصف الطريق، أو بأن علاقة ما لا تتطور بالإيقاع الذي أملته. قد يساعد أن تشارك توقعاتك بانفتاح بدلًا من قياس التقدم بصمت. ويمكنك أيضًا أن تسأل الطرف الآخر عمّا يأمله، فربما تختلف جداولكما الزمنية فحسب.
  workUpright: >-
    في العمل أو الدراسة، قد يشير ثلاثة من العصي إلى مشاريع يتسع مداها: إطلاق، أو جهد تواصل، أو تعاون بين فرق أو أماكن مختلفة. يمكنك التفكير في كيفية دعم هذا الزخم، ربما بالمتابعة، أو توسيع شبكة معارفك، أو الاستعداد للمرحلة التالية قبل وصولها، كي لا يفاجئك تقدمك نفسه.
  workReversed: >-
    في الوضع المعكوس، قد تتأخر النتائج في الظهور، أو قد تكون خطة ما واجهت تأخيرات خارجة عن سيطرتك. وبدلًا من الدفع بقوة أكبر في الاتجاه نفسه، يمكنك مراجعة ما تعلّمته حتى الآن وتعديل المسار. والتواصل مع الأشخاص المعنيين قد يكشف عقبات، أو نجاحات هادئة، يسهل تفويتها من موقعك.
  growthUpright: >-
    الثقة بالجهد الذي بذلته بالفعل نوع هادئ من النمو. فالنمو يستمر غالبًا بعيدًا عن الأنظار بعد الخطوات الأولى. يمكنك أن تنظر إلى حيث بدأت قبل بضعة أشهر وتلاحظ ما تغير، ثم تختار ما تود استكشافه بعد ذلك بهذه الرؤية الأوسع.
  growthReversed: >-
    في الوضع المعكوس، قد يحجب نفاد صبرك مع نفسك رؤيتك للتقدم الحقيقي. يمكنك أن تستكشف أين تتوقع تغييرًا فوريًا وأين قد يكون الإيقاع الأبطأ ألطف بك. والاحتفاظ بسجل بسيط للخطوات الصغيرة قد يجعل النمو أسهل رؤية حين يبدو الأفق فارغًا.
