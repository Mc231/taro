shortUpright: >-
  طاقة دافئة واثقة متاحة لك؛ يمكنك أن تسمح لنفسك بأن تشغل مساحتك وتشارك نورك مع الآخرين.
shortReversed: >-
  قد تكون نارك الداخلية متذبذبة أو منهكة؛ يمكنك النظر فيما يستنزف ثقتك وما يجددها.
meaningUpright: |-
  تجسّد ملكة العصي نارًا صارت ثابتة ومشعّة. تجلس مرتاحة بجوار موقد متوهج، وفي يدها عصا مورقة، واثقة دون حاجة إلى إثبات أي شيء. الطاقة هنا دافئة وجاذبة وسخية: شخص يستطيع أن يضيء الغرفة ويحافظ مع ذلك على مركزه.
  قد تتعرف على هذه الصفة في نفسك حين تتحدث بسهولة، أو تستضيف الناس بدفء حقيقي، أو تسعى وراء مشروع إبداعي بشغف وواقعية معًا. وقد تصف أيضًا شخصًا في حياتك تشجع ثقته الآخرين على التألق.
  تدعوك هذه البطاقة إلى امتلاك مواهبك. الثقة لا يتحتم أن تكون صاخبة؛ قد تكون الإحساس الهادئ بأن لديك ما يستحق أن يُقدَّم. يمكنك أن تلاحظ أين تميل إلى الانكماش، وأن تجرب شغل مساحة أكبر قليلًا. فمشاركة دفئك وحماستك وأفكارك قد تكون هدية لك وللناس من حولك.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد تعكس ملكة العصي لهبًا خفت. ربما تشك في نفسك، أو تتعب من أن تكون دائمًا من يجلب الطاقة، أو تكبح حيويتك لتتجنب لفت الانتباه.
  وأحيانًا تشير الملكة في وضعها المعكوس إلى نار تُستخدم بطرق أقل سخاءً: المقارنة، أو الحسد، أو الحاجة إلى التحكم في الأضواء. وكثيرًا ما تنمو هذه من الشعور بعدم الظهور.
  قد تكون هذه لحظة للعناية بنارك الخاصة. ما الذي يستنزف ثقتك، وما الذي كان يجددها؟ يمكنك العودة إلى نشاط يشعرك بالحياة، أو قضاء الوقت مع أشخاص يقدّرونك، أو الراحة دون شعور بالذنب. فالثقة تعود غالبًا تدريجيًا، حين تستعيد الصلة بما يهمك لا بالطريقة التي تبدو بها.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس هذه البطاقة الدفء والانفتاح وإحساسًا قويًا بالذات داخل الرابط. يمكنك أن تجلب الطاقة والتشجيع لمن تهتم بهم مع الوفاء لاحتياجاتك. وهذه الصفة قد تجعل العلاقات حيوية وصادقة، يتمتع فيها كل طرف بحرية التألق.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تشعر بأن غيرك يحجبك، أو بأنك أمر مسلّم به، أو قد يغريك أن تقارن نفسك بالآخرين. يمكنك التفكير فيما إذا كنت تمنح الدفء دون أن تتلقاه. والتعبير عمّا تحتاج إليه، وتقدير نفسك قبل انتظار تقدير الآخرين، قد يساعد على استعادة التوازن في رابط قريب.
  workUpright: >-
    في العمل أو في الجهود الإبداعية، قد تشير ملكة العصي إلى قيادة واثقة وموهبة في إلهام الآخرين. يمكنك أن تتولى مشروعًا علنًا، وتشارك أفكارك بقناعة، وتصنع جوًّا يشعر فيه الزملاء بالحيوية. فحماستك قد تكون موردًا عمليًا، لا مجرد مزاج.
  workReversed: >-
    في الوضع المعكوس، ربما تتوزع على أدوار كثيرة جدًا، أو تشك في قدراتك بعد انتكاسة. يمكنك تحديد المهام التي تستخدم نقاط قوتك حقًا وحماية الوقت المخصص لها. والتخلي عن الحاجة إلى الحضور في كل مكان في آن قد يساعد ثقتك الطبيعية على العودة.
  growthUpright: >-
    لدفئك أثر في الآخرين، وهذه البطاقة تطلب منك أن تمتلكه. ما الذي يجعلك تشعر بأكبر قدر من الحيوية والثقة بالنفس؟ يمكنك ملاحظة الأوساط التي تشعر فيها بالثقة، ونقل شيء من تلك الطاقة إلى المجالات التي تتراجع فيها عادةً.
  growthReversed: >-
    في الوضع المعكوس، يمكنك أن تستكشف أين يشغل الشك في الذات أو المقارنة حيزًا من أفكارك. قد يساعد أن تلاحظ تقدمك وصفاتك دون قياسها بما لدى أي شخص آخر. فالراحة واللعب كلاهما طريقة لإعادة إشعال نار خفت لهيبها.
reflectionQuestions:
