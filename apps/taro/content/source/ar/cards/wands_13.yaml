imageryNote: >-
  تجلس شخصية مرتاحة على مقعد عريض في فسحة تغمرها الشمس، تستقر عصا مورقة في إحدى يديها والأخرى مفتوحة نحو الناظر. ويتوهج بجانبها موقد، ويرقد قربها حيوان رفيق يقظ. يوحي الموقد بدفء يُقدَّم للآخرين، واليد المفتوحة بالسخاء، والجلسة المسترخية بثقة لا تحتاج إلى إثبات نفسها. وقد تردد درجات الذهبي والكهرماني الدافئة صدى النار في أكثر حالاتها استقرارًا وإشعاعًا.
