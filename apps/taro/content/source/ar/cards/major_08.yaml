shortUpright: >-
  الشجاعة لا تزأر دائمًا. أحيانًا تبدو صبرًا ولطفًا وبقاءً مع أمر صعب.
shortReversed: >-
  قد يبدو ثباتك الداخلي رقيقًا الآن. اللطف مع نفسك قد يكون نقطة بداية قوية.
meaningUpright: |-
  القوة بطاقة شجاعة، لكنها ليست الشجاعة الصاخبة. تُظهر صورتها التقليدية شخصًا يضع يده بهدوء على أسد، لا ليقهره بل ليهدّئه. القوة هنا تأتي من الصبر والدفء والحضور الثابت القادر على ملاقاة الطاقة الجامحة، طاقة شخص آخر أو طاقتك أنت، دون ذعر.
  في الحياة اليومية، قد تعكس هذه البطاقة البقاء هادئًا في حديث متوتر، أو الوفاء بوعد صار مزعجًا، أو البقاء مع شعور قوي وقتًا كافيًا لفهمه بدلًا من التصرف بناءً عليه فورًا. وقد تشير إلى الثقة الهادئة لدى من لا يحتاج إلى إثبات أي شيء. ترويض الأسد لا يعني كبته بقدر ما يعني مصادقته.
  تدعوك هذه البطاقة إلى التفكير في طريقة استجابتك للضغط. يمكنك أن تسأل أين قد تكون الرحمة، بما فيها الرحمة بنفسك، أجدى من القوة الغاشمة. توحي القوة بأن الليونة والحزم يمكن أن يتعايشا، وبأن أكثر أنواع الشجاعة دوامًا كثيرًا ما تكون ثابتة ولطيفة ومثابرة.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد تعكس القوة وقتًا يصعب فيه العثور على ثباتك المعتاد. قد ينفد الصبر بسرعة، أو قد تسمع صوتًا داخليًا أحدّ وأكثر انتقادًا من المعتاد. الأسد قلق، وأنت كذلك.
  وقد تشير هذه البطاقة أيضًا إلى شجاعة انطوت إلى الداخل ولم يُعبَّر عنها بعد: قد تكون أقوى مما تشعر، لكن الشك في نفسك جعل إظهار ذلك صعبًا. أو قد تعكس محاولة لإبقاء كل شيء متماسكًا بقوة الإرادة وحدها، وهي محاولة تميل إلى أن تُستنزف.
  ربما يفيدك أن تلاحظ كيف تتحدث إلى نفسك حين تصعب الأمور. ما الذي قد يتغير لو استخدمت النبرة التي تستخدمها مع صديق خائف؟ إعادة بناء الشجاعة تبدأ غالبًا بأفعال صغيرة من اللطف مع الذات، وبطلب الدعم حين يثقل الحمل.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس القوة صبرًا ودفئًا يساعدان الناس على الشعور بالأمان معك. وقد تدعوك إلى ملاقاة المزاج الصعب لدى شخص ما بالهدوء بدلًا من مجاراة حدّته، مع الحفاظ على حدودك. الحزم اللطيف قد يبني الثقة مع الوقت.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تشير هذه البطاقة إلى سرعة الغضب، أو إلى شخص يبتلع مشاعره ليتجنب الخلاف. يمكنك التفكير فيما إذا كنت تقسو أكثر من اللازم على نفسك أو على شخص قريب. التعبير بلطف، قبل أن يتراكم الإحباط، قد يحمي الرابط ويحمي إحساسك بالثبات.
  workUpright: >-
    في العمل أو في مشروع ما، تسلّط القوة الضوء على المثابرة والنضج العاطفي. وقد تعكس التعامل مع مهمة أو شخص كثير المطالب بصبر ولباقة، أو القيادة بالتشجيع لا بالضغط. يمكنك أن تثق بأن الجهد الثابت والمنتظم له قيمته، حتى حين لا يراقب أحد.
  workReversed: >-
    في الوضع المعكوس، قد تعكس القوة شعورًا بالإنهاك تحت الضغط، أو شكًا في قدرتك على مواجهة تحدٍّ ما. وقد تشير أيضًا إلى ردود فعل حادة تحت التوتر. يمكنك أن تسأل أيّ دعم أو راحة قد يساعدانك على استعادة توازنك، وكيف تضع إيقاعًا يمكنك الحفاظ عليه.
  growthUpright: >-
    توحي القوة بمصادقة أسدك الداخلي بدلًا من حبسه: المشاعر القوية والرغبات والغرائز التي تجعلك من أنت. وبدلًا من محاربتها، يمكنك أن تسأل بفضول عمّا تحتاج إليه. الرحمة بالذات ليست ضعفًا هنا؛ إنها ممارسة تجعل الشجاعة أكثر قابلية للاستمرار.
  growthReversed: >-
    في الوضع المعكوس، قد تكون القوة تذكيرًا بأن الثقة قد تنخفض ثم تعود. وقد تعكس فترة من الشك في الذات أو النقد الداخلي القاسي. يمكنك الاحتفاظ بقائمة قصيرة بلحظات تعاملت فيها مع الأمور جيدًا، وقراءتها في الأيام الصعبة، دليلًا على الثبات الذي تملكه بالفعل.
