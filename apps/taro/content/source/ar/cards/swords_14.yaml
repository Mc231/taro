imageryNote: >-
  تُظهر الصورة الأصلية شخصًا جالسًا على عرش حجري عالٍ فوق حافة جبلية، نصله منتصب تمامًا ووجهه متجه مباشرة نحو الناظر. وتمتد غيوم رفيعة منتظمة عبر سماء شاحبة، ويحلّق طائران في خطين متوازيين في الأعلى. يوحي النصل المنتصب بمبادئ راسخة، وتشير النظرة المباشرة إلى الصدق، فيما تلمّح السماء المنتظمة إلى ذهن وجد سكينته.
