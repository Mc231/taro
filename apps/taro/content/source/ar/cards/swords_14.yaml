shortUpright: >-
  قد يرشدك التفكير الثابت والمبادئ المنصفة؛ يمكنك أن تقرر انطلاقًا مما هو صحيح لا مما هو سهل.
shortReversed: >-
  ربما صار المنطق جامدًا أو منفصلًا؛ يمكنك أن تسأل ما إذا كانت مبادئك لا تزال تترك مكانًا للناس.
meaningUpright: |-
  يجلس ملك السيوف بهدوء على عرش مرتفع، نصله منتصب ونظرته ثابتة. يمثل هذا الشخص التفكير الناضج: القدرة على وزن الأدلة، وتطبيق المبادئ باتساق، واتخاذ قرارات منصفة حتى حين لا تكون مريحة. إنه وضوح صار نوعًا من القيادة.
  قد تتعرف على هذه الطاقة حين يُطلب منك الحكم على موقف بحياد، أو شرح مسألة معقدة ببساطة، أو التمسك بمبادئك تحت الضغط. وقد تعكس أن تكون صوت العقل في لحظة محتدمة، أو أن تبحث عن شخص تحترم وضوح تفكيره. والبطاقة تقدّر النزاهة: التصرف بما يتوافق مع ما تقول إنك تؤمن به.
  تدعوك هذه البطاقة إلى التفكير في طريقة اتخاذك للقرارات. هل تجمع الحقائق، وتصغي إلى وجهات النظر المختلفة، ثم تختار بقناعة؟ يمكنك أن تلاحظ أين تبعدك المشاعر أو الضغوط عن معاييرك، وأين قد تساعد مقاربة هادئة ومنظمة. وفي الوقت نفسه، تشمل الحكمة معرفة أن الناس أكثر من مشكلات تنتظر الحل. كيف يمكن لتفكيرك الواضح أن يخدم الإنصاف والتفهم معًا؟
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس ملك السيوف تفكيرًا صار جامدًا أو منفصلًا. قد تُطبّق القواعد دون اعتبار للناس الذين تمسّهم، أو يُستخدم الذكاء للسيطرة لا للتوضيح. وقد تُكسب الحجج بينما تُخسر الثقة.
  وقراءة أخرى هي سلطة غير واثقة: التشكيك في حكمك، أو الانصياع للآخرين حين تعرف أفضل، أو الشعور بالعجز عن القرار.
  تدعوك هذه البطاقة إلى إعادة وصل المنطق بالإنسانية. يمكنك أن تسأل ما إذا كانت مبادئك لا تزال تخدم غايتها، أم أنها تصلبت إلى عادات. فالإصغاء إلى وقع قرار ما على الآخرين قد يجعله أحكم لا أضعف. أين يمكنك أن تدع التعاطف يغني تفكيرك مع الثبات على ما تؤمن به؟
aspects:
  relationshipsUpright: >-
    في العلاقات، قد يعكس ملك السيوف حضورًا ثابتًا ومنصفًا: شخصًا يناقش الأمور بهدوء، ويفي بكلمته، ويساعد الآخرين على رؤية الموقف بوضوح. يمكنك أن تجلب هذه الطاقة إلى خلاف ما بالتركيز على الحقائق والقيم المشتركة. ومن المفيد أن تسمّي المشاعر أيضًا، كي لا يبدو الوضوح مسافة.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تشير هذه البطاقة إلى برود، أو وعظ، أو استخدام المنطق لصرف مشاعر شخص ما. وقد تعكس أيضًا صعوبة في اتخاذ موقف واضح. يمكنك أن تلاحظ اللحظات التي تلوذ فيها بالمنطق لتتجنب الانكشاف. فالسماح للآخرين برؤية قلبك إلى جانب عقلك قد يعمّق الثقة والتفاهم.
  workUpright: >-
    في العمل، قد يوحي ملك السيوف بقيادة عبر التفكير الواضح: وضع سياسات منصفة، أو اتخاذ قرارات صعبة بشفافية، أو تقديم إرشاد خبير. قد يُوثق بك لوزن الآراء المتنافسة واتخاذ القرار. وشرح منطقك بانفتاح والبقاء متسقًا يساعدان الآخرين على اتباعك بثقة.
  workReversed: >-
    في الوضع المعكوس، قد تعكس هذه البطاقة قواعد جامدة، أو قرارات تُتخذ دون استشارة المتأثرين بها، أو ميلًا إلى الإفراط في التحليل حتى لا يتحرك شيء. يمكنك أن تسأل ما إذا كانت إجراءات ما لا تزال تخدم هدفها. فدعوة الآخرين إلى الإسهام والاعتراف بعدم اليقين قد يقوّيان سلطتك بدلًا من أن يضعفاها.
  growthUpright: >-
    في النمو الشخصي، يدعوك ملك السيوف إلى تحديد مبادئك والعيش وفقها. يمكنك أن تدوّن القيم التي توجه اختياراتك وتراجع قراراتك الأخيرة في ضوئها. فالتفكير الواضح مهارة يمكن التمرن عليها: جمع الحقائق، والنظر في وجهات النظر، ثم الالتزام بمسار بتأنٍّ.
  growthReversed: >-
    في الوضع المعكوس، قد تعكس هذه البطاقة اعتمادًا مفرطًا على التحليل أو قسوة في الحكم على الذات. يمكنك أن تلاحظ اللحظات التي تطالب فيها نفسك بمنطق كامل ولا تترك مكانًا للأخطاء. والموازنة بين العقل والرحمة بالذات قد تساعدك على اتخاذ القرار بحرية أكبر والتعلم بلطف أكبر من النتائج التي تفاجئك.
