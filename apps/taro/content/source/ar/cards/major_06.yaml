imageryNote: >-
  تُتخيَّل بطاقة العشاق في Taro شخصين يقف كل منهما على ضفة من جدول ضيق، ويمدّان أيديهما لتتشابك فوقه، مرسومَين بحيث يستطيع أي ناظر أن يرى نفسه في أيٍّ منهما. وفوقهما يحلّق طائران في السماء المضيئة نفسها. على إحدى الضفتين تنمو شجرة مثمرة، وعلى الأخرى كرمة مزهرة، عطيّتان مختلفتان تلتقيان في المنتصف. ويوحي الجدول بالاختيار والجهد اللذين يطلبهما التواصل الحقيقي من الطرفين.
