shortUpright: "اختيار يصنعه القلب والعقل معًا، منسجمًا مع ما تقدّره حقًا."
shortReversed: >-
  قد يريد جزء منك شيئًا ويريد جزء آخر شيئًا مختلفًا. تدعوك هذه البطاقة إلى الإصغاء لكليهما قبل الاختيار.
meaningUpright: |-
  كثيرًا ما تُقرأ بطاقة العشاق على أنها بطاقة الرومانسية، لكن موضوعها الأعمق هو الانسجام: التقاء جزأين، أو شخصين، أو طريقين على نحو يبدو متكاملًا. فهي تسأل عمّا تقدّره أكثر من أي شيء، وما إذا كانت الاختيارات التي أمامك تعكسه. والتواصل هنا يكون مع الآخرين ومع نفسك معًا.
  في الحياة اليومية، قد تعكس هذه البطاقة علاقة تشعر فيها بأن الآخر يراك حقًا، أو شراكة في العمل تتدفق فيها الأفكار بسهولة، أو قرارًا يتطلب منك أن تقول بوضوح ما يهمك. وقد تشير إلى لحظة اختيار بين خيارين جيدين، لا توجد فيها إجابة صحيحة واضحة، بل الإجابة التي تناسب الشخص الذي تصير إليه.
  تدعوك هذه البطاقة إلى التفكير في مدى صدقك مع نفسك ومع الآخرين. يمكنك أن تسأل نحو ماذا تنجذب ولماذا، وبماذا تستعد للالتزام. تسلّط بطاقة العشاق الضوء على أن الاختيارات ذات المعنى نادرًا ما تتعلق بالكمال؛ بل تتعلق بجمع قلبك وحكمك في الغرفة نفسها وتركهما يتحاوران.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد تعكس بطاقة العشاق إحساسًا بالانشداد في اتجاهين. فما تريده وما تظن أنه ينبغي أن تريده قد لا يتطابقان، أو قد يبدو رابط قريب خارج الإيقاع قليلًا، حيث يقدّر كل طرف أشياء مختلفة دون أن يقول ذلك.
  وقد تشير هذه البطاقة أيضًا إلى قرار يتأجل باستمرار، ربما لأن اختيار أحد الخيارين يعني التخلي عن الآخر. تجنّب الاختيار قد يبدو أسهل على المدى القصير، بينما يستنزف الطاقة بهدوء.
  ربما يفيدك أن تدوّن ما يقدّمه كل خيار بصدق وما يطلبه منك، وأيّ قيمك يدعمها. وقد يساعد أن تلاحظ أين تشعر بأنك أقرب إلى نفسك. إعادة الانسجام تبدأ غالبًا باعتراف صغير وصادق، لنفسك أولًا، ثم لشخص آخر إن بدا ذلك مناسبًا.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس بطاقة العشاق تفاهمًا متبادلًا عميقًا ومتعة اختيار كل طرف للآخر، سواء في الحب أو الصداقة أو العائلة. وقد تدعوك إلى مشاركة ما تقدّره حقًا والإصغاء إلى ما يقدّره الطرف الآخر أيضًا. ينمو القرب حين يستطيع الطرفان أن يكونا صادقين ويشعرا مع ذلك بالترحيب.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تشير هذه البطاقة إلى فجوة بين آمال شخصين أو أولوياتهما، أو إلى مشاعر لم يُعبَّر عنها. يمكنك التفكير فيما إذا كنت تتكيف أكثر من اللازم حفاظًا على السلام، أو تتوقع من أحدهم أن يخمّن ما تحتاج إليه. حديث منفتح ولطيف عن القيم قد يساعدكما على رؤية موقع كل منكما.
  workUpright: >-
    في العمل أو في مشروع ما، تسلّط بطاقة العشاق الضوء على التعاون والاختيارات المتجذرة في قيمك. وقد تعكس شراكة تُظهر أفضل ما في الطرفين، أو قرارًا بشأن الاتجاه الذي ستسلكه. يمكنك أن تسأل أيّ الخيارات يبدو ذا معنى وعمليًا في آن، وأن تدع الاعتبارين يُحتسبان في اختيارك.
  workReversed: >-
    في الوضع المعكوس، قد تعكس بطاقة العشاق احتكاكًا في شراكة ما، أو إحساسًا بأن عملك لا يتوافق مع ما يهمك. وقد تشير أيضًا إلى تردد في الاختيار بين طريقين. يمكنك أن تدوّن ما سيطلبه منك كل طريق، وتلاحظ أيّهما تشعر باستعداد أكبر لمنحه ذلك.
  growthUpright: >-
    معرفة قيمك بوضوح أكبر هي العمل الداخلي الذي تشير إليه هذه البطاقة. فحين تفهم ما يهمك، تصبح الاختيارات أقل ارتباطًا بإرضاء الآخرين وأكثر ارتباطًا بالوفاء لنفسك. يمكنك أن تدوّن ثلاث قيم وتلاحظ أين توجّه أيامك بالفعل.
  growthReversed: >-
    في الوضع المعكوس، قد تعكس بطاقة العشاق صراعًا داخليًا: جزء منك يريد التغيير، وجزء يريد الراحة. لا أحد الجزأين مخطئ. يمكنك أن تمنح كلًّا منهما صوتًا، على الورق أو في حديث، وترى ما إذا كان هناك اختيار يكرّم الاثنين، ولو جزئيًا.
reflectionQuestions:
