shortUpright: >-
  قد تكتمل دورة ما. تدعوك هذه البطاقة إلى التوقف وتكريم ما أتممته.
shortReversed: >-
  قد يكون شيء ما على وشك الاكتمال. أيّ خطوة أخيرة أو طرف معلّق يستحق انتباهك؟
meaningUpright: |-
  العالم هو البطاقة الأخيرة في الأركانا الكبرى، نهاية الرحلة التي بدأت مع الأحمق. إنها بطاقة الاكتمال والتكامل: الإحساس بأن القطع قد اجتمعت، وبأن دورة قد عيشت حتى نهايتها، وبأنك، في هذه اللحظة، تشعر بالألفة في القصة التي عشتها حتى الآن.
  في الحياة اليومية، قد تعكس هذه البطاقة إنهاء مشروع طويل، أو بلوغ هدف عملت من أجله، أو مجرد الشعور بالألفة في حياتك وجسدك. وقد تشير إلى الاندماج: جمع دروس تجارب كثيرة، السهلة منها والصعبة، في إحساس بمن تكون. والانتماء هنا قد يعني الانتماء إلى مجتمع، أو مكان، أو إلى نفسك.
  تدعوك هذه البطاقة إلى التفكير فيما حققته والاحتفاء به. يمكنك أن تسأل كيف تغيرت منذ بدأت هذه الدورة، وما الذي تود أن تحمله إلى الدورة التالية. يسلّط العالم الضوء على أن الاكتمال ليس نهاية بمعنى التوقف، بل لحظة امتلاء قبل أن تبدأ رحلة جديدة.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس العالم دورة شارفت على الاكتمال لكنها لم تكتمل تمامًا. بعض الأطراف المعلّقة، أو وداع لم يُقل، أو مهمة أخيرة، قد يمنعك من الشعور بالانتهاء. قد تستشعر أنك تشعر بالجاهزية للمضي قدمًا بينما لا يزال شيء ما يبقيك في مكانك.
  وقد تشير هذه البطاقة أيضًا إلى البحث عن الخاتمة في مكان آخر، أو التماس الطرق المختصرة، أو الأمل في أن يربط الآخرون الخيوط نيابةً عنك.
  ربما يفيدك أن تحدد الأمر أو الأمرين اللذين قد يساعدانك على الشعور بالاكتمال. قد يكون ذلك إنهاء مهمة عملية، أو شكر شخص ما، أو الاعتراف بخيبة أمل، أو ببساطة منح نفسك التقدير على المسافة التي قطعتها. اتخاذ تلك الخطوة الأخيرة بنية واضحة قد يحوّل شبه النهاية إلى نهاية حقيقية.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد يعكس العالم إحساسًا بالامتلاء والتفاهم المتبادل، كأن رابطًا ما قد بلغ نضجه. وقد يدعوك إلى تقدير ما بنيتماه معًا والاحتفاء بالمحطات المشتركة. تبدو العلاقات هنا متكاملة، فيها مساحة للقرب وللحرية الفردية معًا.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تشير هذه البطاقة إلى أمر لم يُحسم في علاقة ما، أو حديث لم يكتمل، أو فصل لم يُغلق. يمكنك التفكير فيما قد يساعدكما كليكما على الشعور بالسلام، سواء كان ذلك قول شيء ما أو تقبّل أنه قد قيل.
  workUpright: >-
    في العمل أو في مشروع ما، يسلّط العالم الضوء على الإنجاز والتقدير. وقد يعكس إنهاء عمل مهم، أو بلوغ محطة، أو الشعور بأن دورك يناسبك جيدًا. يمكنك أن تأخذ وقتًا للاعتراف بما حققته أنت والآخرون قبل البدء بالشيء التالي.
  workReversed: >-
    في الوضع المعكوس، قد يعكس العالم مشروعًا عالقًا في مرحلته الأخيرة، أو إحساسًا بعدم بلوغ خط النهاية تمامًا. يمكنك أن تدوّن ما تبقى، وتقرر ما إذا كان يحتاج حقًا إلى إنجاز أم يمكن التخلي عنه. الجهد الصغير المركّز قد يساعد على إغلاق الأمور بإتقان.
  growthUpright: >-
    قبل السعي إلى الهدف التالي، قد يفيد أن تدرك المسافة التي قطعتها. يمكنك التأمل في دروس فصل قريب وتحدياته وأفراحه، وملاحظة كيف تتكامل في صورة أكمل عن نفسك. فالاندماج نوع هادئ من الإنجاز.
  growthReversed: >-
    في الوضع المعكوس، قد يسأل العالم عمّا تحتاج إليه لتشعر بالاكتمال. وقد يعكس إحساسًا بالقلق أو بالنقص. يمكنك أن تسمّي أمرًا واحدًا كنت تنوي إنهاءه وتمنحه كامل انتباهك، ثم تلاحظ شعورك حين تُغلق تلك الحلقة.
