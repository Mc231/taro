shortUpright: >-
  لقد مررت بالكثير وما زلت تقف على قدميك؛ وتكرّم هذه البطاقة صلابتك في المرحلة الأخيرة.
shortReversed: >-
  البقاء في حالة تأهب لوقت طويل قد يكون متعبًا؛ يمكنك ملاحظة أين يكون من الآمن أن ترتاح وتسمح للآخرين بالاقتراب.
meaningUpright: |-
  يُظهر تسعة من العصي شخصًا مرّ بتحديات ولا يزال واقفًا. يتكئ على عصا واحدة، متعبًا قليلًا ومتيقظًا، داخل حلقة من عصي أخرى مغروسة كسياج بناه بنفسه. إنها صلابة تحمل بعض كدمات التجربة: لم تبقَ بلا أثر، لكنها لم تُهزم أيضًا.
  قد تخاطبك هذه البطاقة حين يوشك مشروع طويل على الانتهاء، أو حين تجتاز موسمًا شاقًا من رعاية الآخرين أو الدراسة، أو حين واجهت انتكاسات واخترت أن تواصل. أنت تعرف الآن أكثر مما كنت تعرفه في البداية، بما في ذلك مواضع حدودك.
  تدعوك هذه البطاقة إلى الاعتراف بالمسافة التي قطعتها، واستخدام ما تعلّمته. المثابرة قيّمة، وكذلك ضبط الإيقاع. يمكنك أن تسأل ما الذي قد يساعدك في هذه المرحلة الأخيرة: خط نهاية واضح، أو بضع ساعات من الراحة، أو حدّ عملي، أو تذكير بأنك أقرب إلى النهاية مما تشعر.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس تسعة من العصي تعبًا تراكم مع الوقت. ربما تشعر بأنك تحرس نفسك أو مشاريعك منذ وقت طويل حتى بات الاسترخاء يبدو مستحيلًا. والحذر الذي تعلّمته من صعوبات الماضي قد يتحول إلى ريبة تجاه كل موقف جديد.
  وقد تشير هذه البطاقة أيضًا إلى بلوغ حدّ ما. فالمواصلة رغم كل شيء ليست دائمًا الخيار الأقوى؛ أحيانًا تعني القوة الاعتراف بأنك تحتاج إلى استراحة أو إلى يد تساعدك.
  يمكنك أن تستكشف أين لا تزال دفاعاتك مفيدة، وأين باتت تُبقي الدعم بعيدًا كما تُبقي الصعوبة. هل هناك من يمكنك الاتكاء عليه، أو مهمة يمكنك تسليمها، أو استراحة يمكنك أن تسمح بها لنفسك؟ خفض حذرك قليلًا، في مكان آمن، قد يكون طريقة للعناية بالصلابة التي بنيتها.
aspects:
  relationshipsUpright: >-
    في الروابط القريبة، قد تعكس هذه البطاقة علاقة صمدت في أوقات صعبة ولا تزال قائمة. وقد تشير أيضًا إلى حذر تعلّمته من جراح سابقة. يمكنك تقدير الثبات الذي بنيتماه معًا، مع ملاحظة ما إذا كان الحذر القديم لا يزال ضروريًا مع شخص أثبت أنه أهل للثقة.
  relationshipsReversed: >-
    في الوضع المعكوس، ربما تُبقي الآخرين على مسافة كي لا تُخذل مجددًا، أو تشعر بتعب يمنعك من العطاء كالمعتاد. يمكنك التفكير في إخبار شخص قريب بأن طاقتك تنفد. فالسماح لنفسك بتلقي الدعم قد يعمّق الرابط بدلًا من أن يضعفه.
  workUpright: >-
    في العمل أو الدراسة، قد يشير تسعة من العصي إلى الدفعة الأخيرة في جهد طويل. لقد جعلتك التجربة أكثر واقعية بشأن العقبات، وهذه المعرفة مفيدة. يمكنك التخطيط للخطوات المتبقية بعناية، وحماية تركيزك، وتذكير نفسك بالأسباب التي بدأت من أجلها، كي تبدو المرحلة الأخيرة ذات غاية لا مستنزفة فحسب.
  workReversed: >-
    في الوضع المعكوس، قد تقترب من حدّك، فتعمل بروح دفاعية أو تشعر بأن عليك التعامل مع كل شيء وحدك. يمكنك النظر فيما يمكن تفويضه أو تأجيله أو تبسيطه. والحديث بصدق عن قدرتك قد يكون خيارًا مسؤولًا يحميك ويحمي العمل معًا.
  growthUpright: >-
    ربما تملك من الصلابة أكثر مما تعترف به لنفسك. فكل صعوبة واجهتها علّمتك شيئًا عمّا تستطيع تحمّله. يمكنك أن تدوّن بعض الدروس من تحديات قريبة، وتفكر كيف قد ترشدك بثقة أكبر قليلًا وإجهاد أقل قليلًا.
  growthReversed: >-
    في الوضع المعكوس، قد تكون اليقظة الدائمة قد بدأت تترك أثرها. يمكنك أن تستكشف كيف تبدو الراحة بالنسبة إليك، وما إذا كنت تسمح لنفسك بما يكفي منها. وتليين حذرك بطرق صغيرة وآمنة، كأمسية هادئة أو حديث صادق، قد يساعد قوتك على أن تبدو أقل شبهًا بالدرع.
