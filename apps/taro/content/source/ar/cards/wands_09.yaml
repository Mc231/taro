imageryNote: >-
  يقف شخص عند الغسق داخل حلقة من العصي المغروسة في الأرض، متكئًا على إحداها وناظرًا إلى الخارج بعينين يقظتين. وبجانبه نار مخيم صغيرة خافتة. توحي حلقة العصي بالدفاعات التي بُنيت بالتجربة، والنار الخافتة بطاقة لا تزال حية بعد جهد طويل، والضوء الآفل بيوم يقترب من نهايته. وتحمل الوقفة اليقظة التعب والمثابرة التي تواصل المسير معًا.
