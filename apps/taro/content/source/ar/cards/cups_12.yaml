  workUpright: >-
    في العمل، قد تعكس هذه البطاقة مقترحًا إبداعيًا، أو فكرة يحركها الشغف، أو دورًا يتيح لك استخدام خيالك وتعاطفك. وقد تدعوك إلى عرض شيء يهمك، أو إلى إدخال مزيد من القلب في مهامك الحالية. فالحماسة قد تكون معدية حين تقترن بالمتابعة.
  workReversed: >-
