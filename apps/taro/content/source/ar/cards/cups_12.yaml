imageryNote: >-
  تُظهر الصورة فارسًا على حصان هادئ، يتقدم ببطء على ضفة نهر أو عبر وادٍ هادئ، ممسكًا بكأس إلى الأمام كهدية. وقد توحي نقوش الأمواج أو الأصداف على درعه وعباءته بالخيال والعمق العاطفي. ويردد الماء المتدفق قربه حركة الشعور. وتنقل درجات الأزرق والفضي الناعمة، مع لمسة لون دافئة، الرومانسية والصدق وإحساسًا حالمًا بالغاية.
