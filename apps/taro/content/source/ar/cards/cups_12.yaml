  growthUpright: >-
    في النمو الشخصي، يدعوك فارس الكؤوس إلى اتباع ما يحرّكك. يمكنك تجربة نشاط إبداعي أو إنساني لمجرد أنه يهمك. فملاحظة ما يحرّك قلبك قد توضح قيمك وتساعدك على العيش وفقها بطرق يومية عادية.
  growthReversed: >-
    في الوضع المعكوس، قد تطلب منك هذه البطاقة استكشاف الفجوة بين الطريقة التي تتخيل بها نفسك والطريقة التي تتصرف بها. قد تلاحظ نمطًا من البدء بحماسة ثم الفتور. وبناء عادات لطيفة حول شغفك قد يساعده على الاستمرار أبعد من اندفاعة الشعور الأولى.
