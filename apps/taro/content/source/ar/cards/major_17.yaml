imageryNote: >-
  تُتخيَّل نجمة Taro مشهدًا ليليًا في حديقة على سطح، يسقي فيه شخص نباتات صغيرة من إبريق بينما تتلألأ نجمة ساطعة عبر فجوة في الغيوم. وتجمع براميل المطر وبركة صغيرة ما تعيده السماء. وقد ترمز الفراشات الليلية التي تحوم حول فانوس إلى أفكار تنجذب نحو الضوء. وتصنع درجات الأزرق والفضي الباردة إحساسًا بالهدوء والانفتاح والتجدد اللطيف بعد أن تمر العاصفة.
