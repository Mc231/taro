shortUpright: >-
  بعد مرحلة صعبة، قد يعود أمل أهدأ. تدعوك هذه البطاقة إلى أن تفسح له مكانًا.
shortReversed: >-
  قد يبدو الأمل بعيدًا الآن. أشياء صغيرة وثابتة قد تساعدك على إيجاد طريق العودة إليه.
meaningUpright: |-
  النجمة بطاقة أمل وتجدد. كثيرًا ما تلي اضطراب البرج في التسلسل، ومزاجها هو الهدوء الذي يلي العاصفة: سماء ليلية صافية، وماء بارد، ولحظة تستطيع فيها أخيرًا أن تتنفس بارتياح. الأمل هنا ليس تفاؤلًا صاخبًا، بل ثقة هادئة بأن الأمور يمكن أن تتحسن وبأن لديك ما يستحق أن يُقدَّم.
  في الحياة اليومية، قد تعكس هذه البطاقة شعورًا بالخفة بعد فترة صعبة، أو استعادة الصلة بحلم إبداعي، أو ملاحظة علامات تقدم صغيرة تذكّرك بسبب بدايتك. وقد تشير إلى لحظات انفتاح تشعر فيها بالقدرة على مشاركة أفكارك أو مشاعرك دون درع، وإلى القوة البسيطة المرمِّمة للراحة والطبيعة والوقت.
  تدعوك هذه البطاقة إلى التفكير فيما يمنحك الأمل الآن، مهما كان صغيرًا. يمكنك أن تسأل ما الذي تود تجديده في حياتك، وما الذي يساعدك على الشعور بالانتعاش. تسلّط النجمة الضوء على السخاء، تجاه الآخرين وتجاه نفسك. وهي توحي بصب طاقتك فيما يغذّيك، وترك الباقي يستقر.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد تعكس النجمة وقتًا يبدو فيه الأمل أخفت. ربما تشعر بالتعب أو الإحباط، أو تشك في أن جهودك ذات أهمية. لم ينطفئ الضوء، لكن رؤيته عبر الغيوم قد تكون أصعب.
  وقد تشير هذه البطاقة أيضًا إلى انقطاع عمّا يلهمك عادةً، ربما لأنك تعطي كثيرًا حتى لا يبقى إلا القليل لأحلامك الخاصة.
  ربما يفيدك أن تبحث عن مصادر صغيرة للتجدد: نزهة تحت سماء مفتوحة، أو حديث مع شخص يؤمن بك، أو عودة إلى متعة بسيطة. الأمل يعود غالبًا على دفعات صغيرة لا دفعة واحدة. وإن ظل الثقل باقيًا، فالتواصل مع شخص تثق به أو مع مختص مؤهل قد يكون خطوة رعاية.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس النجمة الانفتاح والصدق وإحساسًا بثقة متجددة. وقد تدعوك إلى مشاركة آمالك مع شخص قريب، أو إلى تقديم التشجيع لمن يحتاج إليه. ورابط مرّ بوقت صعب قد يبدو الآن أهدأ وأكثر أملًا.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تشير هذه البطاقة إلى شعور بعدم الظهور أو بالإحباط في علاقة ما، أو إلى كتمان مشاعرك الحقيقية خوفًا من ألا تلقى ترحيبًا. يمكنك التفكير فيما قد يساعدك على الشعور بأمان أكبر في الانفتاح، وما إذا كانت لفتة صغيرة صادقة قد تعيد بناء بعض الثقة.
  workUpright: >-
    في العمل أو في مشروع ما، تسلّط النجمة الضوء على الإلهام والإحساس بالغاية. وقد تعكس استعادة الصلة بسبب قيامك بما تقوم به، أو العثور على طاقة جديدة بعد انتكاسة. يمكنك أن تمنح وقتًا لهدف بعيد المدى أو لفكرة إبداعية تجعلك تشعر بالأمل.
  workReversed: >-
    في الوضع المعكوس، قد تعكس النجمة فقدان الدافع أو الشعور بأن عملك يفتقر إلى المعنى. يمكنك أن تسأل ما الذي جذبك إلى هذا الطريق في الأصل، وما إذا كان أي جزء من تلك الشرارة لا يزال موجودًا. الانتصارات الصغيرة والزملاء الداعمون قد يساعدون على إعادة بناء الإحساس بالغاية.
  growthUpright: >-
    التجدد والعناية اللطيفة بالذات في صميم رسالة النجمة عن النمو. يمكنك أن تلاحظ ما يرمّمك وتفسح له مساحة أكبر قليلًا. ووضع نية للأشهر المقبلة، متجذرة فيما تأمله حقًا لا فيما تشعر بأنه ينبغي أن تريده، قد يمنحك الثبات.
  growthReversed: >-
    في الوضع المعكوس، قد تسأل النجمة ما إذا كنت تعمل وخزّانك فارغ. وقد تعكس حاجة إلى التزود قبل أن تستطيع تقديم المزيد. يمكنك أن تبدأ بممارسة يومية صغيرة واحدة تجلب لك الهدوء، وتتركها تنمو بهدوء مع الوقت. فإعادة ملء نفسك جزء من العطاء، لا توقف عنه.
