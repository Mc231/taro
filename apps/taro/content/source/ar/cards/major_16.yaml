  growthReversed: >-
    في الوضع المعكوس، قد يسأل البرج ما إذا كنت تقاوم تغييرًا داخليًا بدأ بالفعل. وقد يعكس تفككًا لطيفًا وتدريجيًا لدفاعات قديمة. يمكنك أن تسمح لنفسك بالشعور بعدم الاستقرار لبعض الوقت، وأن تتحلى بالصبر وأنت تعيد البناء على أرض أصلب.
