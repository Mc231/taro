  relationshipsReversed: >-
    في الوضع المعكوس، قد تشير هذه البطاقة إلى توتر يتراكم بهدوء، أو إلى تجنّب حقيقة صعبة حفاظًا على السلام. يمكنك التفكير فيما إذا كانت تسمية أمر ما بلطف الآن قد تمنع قطيعة أكبر لاحقًا. وقد تعكس أيضًا رابطًا يُعاد بناؤه على أرض أصدق بعد فترة صعبة.
  workUpright: >-
