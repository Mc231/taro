imageryNote: >-
  يُتخيَّل برج Taro برجًا حجريًا طويلًا ونحيلًا على قمة صخرية، تطيح بتاجه ومضة ضوء مفاجئة من سماء عاصفة. وتتناثر الشرارات أو اللهب الصغير كالبذور في الريح، موحيةً بأن ما يتحرر قد يحمل بدايات جديدة. ويُرسم المشهد لحظةَ إشراق، ساطعًا على خلفية الغيوم الداكنة، ليبقى التركيز على الإزالة والبصيرة لا على أذى أي أحد.
