imageryNote: >-
  تُتخيَّل عدالة Taro شخصًا رزينًا منتصب القامة، يحمل ميزانًا متوازنًا بمحاذاة القلب، ونصلًا قائمًا يشير إلى السماء. ينظر مباشرة إلى الناظر، موحيًا بصدق لا يُخفي شيئًا. ويحافظ عمودان بسيطان وستارة عادية في الخلفية على بساطة المشهد، كأنهما يفسحان المجال للتفكير المتأني. وقد تعكس درجات الأزرق الهوائية الباردة مع لمسة دافئة واحدة التقاء العقل بالضمير.
