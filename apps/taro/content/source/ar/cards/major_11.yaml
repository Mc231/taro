shortUpright: "لحظة لوزن الأمور بصدق، والتصرف بطريقة ترتاح لشرحها لاحقًا."
shortReversed: >-
  قد يبدو شيء ما مختل التوازن. تدعوك هذه البطاقة إلى النظر إليه بوضوح، بما في ذلك دورك أنت.
meaningUpright: |-
  تحمل العدالة ميزانًا في يد وسيفًا في الأخرى. يرمز الميزان إلى وزن الأمور بعناية، والسيف إلى الوضوح اللازم للتصرف بعد ذلك. تدور هذه البطاقة حول الإنصاف والصدق وتحمّل مسؤولية اختياراتك، وفهم أن للأفعال عواقب وأن بإمكانك أن تختارها بعناية.
  في الحياة اليومية، قد تعكس هذه البطاقة قرارًا يحتاج إلى ذهن صافٍ، مثل تقسيم المهام بإنصاف، أو تقديم ملاحظات صادقة، أو الاعتراف بخطأ وإصلاحه. وقد تشير إلى لحظات يُطلب منك فيها أن تنظر إلى الموقف من كل جوانبه قبل الرد، وأن تنصف نفسك بقدر ما تحاول إنصاف الآخرين.
  تدعوك هذه البطاقة إلى التفكير في الشكل الذي قد تبدو عليه استجابة متوازنة. يمكنك أن تسأل أيّ الحقائق مهمة، وما الذي يحتاج إليه كل شخص معني، وما الذي يمكنك تحمّل مسؤوليته. لا تتنبأ العدالة بنتيجة أي مسألة رسمية؛ بل تسلّط الضوء على النزاهة: التصرف بما يتوافق مع ما تؤمن بأنه صواب، وتقبّل ما يليه بذهن ثابت.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد تعكس العدالة إحساسًا بأن أمرًا ما غير منصف، أو بأن كفتي الميزان في موقف ما قد مالتا. قد تشعر بأنك تحمل أكثر من نصيبك، أو تلاحظ إغراءً بتجنب النظر إلى دورك أنت في صعوبة ما.
  وقد تشير هذه البطاقة أيضًا إلى الحكم على نفسك بقسوة مفرطة، ووزن كل اختيار بمعيار مستحيل. تحمّل المسؤولية مفيد؛ أما النقد الذاتي المستمر فأمر مختلف.
  ربما يفيدك أن تدوّن الموقف بأكبر قدر ممكن من الحياد، كأنك تشرحه لصديق منصف. ما الذي يخصك أن تتحمله، وما الذي لا يخصك؟ السعي إلى الإنصاف قد يعني أن تعبّر عن رأيك، أو أن تصلح شيئًا، أو ببساطة أن تتخلى عن حكم صار حمله ثقيلًا.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس العدالة التوازن والاحترام المتبادل: أن يعطي الطرفان ويأخذا بطريقة تبدو منصفة. وقد تدعوك إلى النظر بصدق في كيفية تقاسم المسؤوليات والرعاية. الأحاديث الواضحة واللطيفة عن التوقعات قد تقوّي الثقة وتمنع الاستياء الصامت.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تشير هذه البطاقة إلى اختلال في التوازن، كأن يقوم طرف واحد بالجزء الأكبر من العمل العاطفي أو العملي، أو خلاف يبدو فيه اللوم من جهة واحدة. يمكنك التفكير في شكل الإنصاف من وجهتي النظر، وما إذا كان اعتذار أو اتفاق أوضح قد يعيد التوازن.
  workUpright: >-
    في العمل أو في مشروع ما، تسلّط العدالة الضوء على النزاهة والإجراءات المنصفة والقرارات المدروسة. وقد تعكس مراجعة التوقعات المتفق عليها، أو تقديم ملاحظات متوازنة، أو وزن الخيارات وفق مزاياها. يمكنك أن تسأل أيّ اختيار سترتاح لشرحه علنًا لكل من يتأثر به.
  workReversed: >-
    في الوضع المعكوس، قد تعكس العدالة إحباطًا من معاملة غير منصفة أو قواعد غير واضحة. وقد تشير أيضًا إلى اختصار الطريق تحت الضغط. يمكنك تدوين الحقائق بهدوء، وطلب الدعم المناسب إن لزم، والتحقق من أن أفعالك تطابق المعيار الذي تود أن يلتزم به الآخرون.
  growthUpright: >-
    في النمو الشخصي، تدعوك هذه البطاقة إلى العيش وفق قيمك وتحمّل مسؤولية اختياراتك. التأمل في آثار أفعالك، دون قسوة، قد يساعدك على النمو. يمكنك أن تنظر إلى قرار اتخذته مؤخرًا وتسأل ما الذي ستحتفظ به، وما الذي قد تفعله بشكل مختلف في المرة القادمة.
  growthReversed: >-
    في الوضع المعكوس، قد تسأل العدالة ما إذا كنت تُلزم نفسك بمعيار أشد بكثير مما تُلزم به الآخرين. وقد تعكس شعورًا بالذنب يبقى بعد أن يكون الدرس قد تُعلّم بالفعل. يمكنك التمرن على تقييم منصف للذات: تسمية ما سار على نحو خاطئ وما سار على نحو صحيح معًا.
