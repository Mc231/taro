shortUpright: >-
  لحظة حزينة أو جارحة قد تطلب أن تُعاش لا أن تُبرَّر؛ ويمكن تكريم الأسى برفق.
shortReversed: >-
  قد يكون أشد ما في الجرح في طور التخفف؛ يمكنك ملاحظة ما يساعدك على التنفس بحرية أكبر قليلًا.
meaningUpright: |-
  يتحدث ثلاثة من السيوف عن الأسى: وجع خيبة الأمل، أو الفقد، أو كلمات وقعت بقسوة. وهو لا يقول كم يدوم الشعور أو ما الذي سببه. إنه ببساطة يعترف بأن بعض اللحظات تؤلم، وبأن الألم حقيقي.
  قد تتعرف على هذه البطاقة في حديث تركك مهتزًّا، أو خبر غيّر طريقة رؤيتك لشيء ما، أو حزن يعود في ظهيرة عادية. وقد تعكس أيضًا لسعة فهم حقيقة كنت تأمل ألا تكون كذلك. وكثيرًا ما يريد العقل المفكر أن يحلل الألم، ويجد السبب، ويصلحه بسرعة.
  تدعوك هذه البطاقة بلطف إلى ترك الشعور يكون شعورًا. فالمطر يهطل ثم يمر؛ والحزن قد يتحرك بطريقة مشابهة حين يُسمح له بذلك. قد ترغب في منح نفسك اللطف والوقت ورفقة أشخاص يستطيعون الإصغاء دون أن يستعجلوك. وإن بقيت المشاعر الثقيلة معك، فالحديث مع شخص تثق به أو مع مختص مؤهل قد يساعد. ماذا يعني أن تعامل حزنك كما تعامل حزن صديق؟
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس ثلاثة من السيوف تخففًا بطيئًا للألم. قد تكون العاصفة في طريقها إلى الرحيل، حتى لو كانت الأرض لا تزال مبتلة. قد تلاحظ عودة لحظات صغيرة من الخفة، أو تجد أنك تستطيع الحديث عمّا حدث بثبات أكبر قليلًا.
  وقراءة أخرى هي أسى منطوٍ إلى الداخل: ألم يُمسك بإحكام ولا يُتشارك، ربما لأنه يبدو شخصيًا جدًا أو لأن الآخرين يبدون كأنهم يتوقعون أن تكون قد تجاوزته. فالألم الذي يُكتم قد يطول أكثر مما يلزم.
  تدعوك هذه البطاقة إلى ملاحظة ما يساعدك على التخلي، ولو قليلًا. قد يكون الكتابة، أو الوقت في الهواء الطلق، أو حديثًا موثوقًا، أو مجرد إذن بالحزن دون موعد نهائي. لا يوجد إيقاع صحيح للتعافي من لحظة مؤلمة. ما الشيء اللطيف الواحد الذي يمكنك أن تقدّمه لنفسك اليوم؟
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس هذه البطاقة مشاعر مجروحة: كلمة قاسية، أو خيبة أمل، أو مسافة مؤلمة بينك وبين شخص قريب. وهي لا تقول من المخطئ. يمكنك التفكير في منح الشعور مساحة قبل أن تقرر ما يعنيه. وحين تشعر بالجاهزية، فمشاركة الألم بهدوء والإصغاء إلى وجهة نظر الطرف الآخر قد يساعدان كليكما على فهم ما حدث.
  relationshipsReversed: >-
    في الوضع المعكوس، قد يوحي ثلاثة من السيوف بجرح بدأ يخف بين شخصين، أو بجرح لا يزال محمولًا بصمت في الداخل. ربما يكون الاعتذار ممكنًا، أو ربما تكون الخطوة الأصح هي التقبّل ببساطة. يمكنك أن تسأل عمّا تحتاج إليه لتشعر بالسلام، سواء شمل ذلك الطرف الآخر أم لا. والمسامحة، إن جاءت، قد تأتي في وقتها.
  workUpright: >-
    في العمل أو في مشروع ما، قد تعكس هذه البطاقة خيبة أمل: ملاحظات ناقدة لاسعة، أو خطة لم تكتمل، أو انتكاسة بعد جهد حقيقي. لا بأس في أن تشعر بذلك. يمكنك أن تسمح لنفسك بوقفة قبل الرد، ثم تبحث عن الجزء المفيد من الرسالة بعد أن تمر الموجة الأولى. فقيمتك أكبر من نتيجة واحدة.
  workReversed: >-
    في الوضع المعكوس، قد تشير هذه البطاقة إلى التعافي من انتكاسة مهنية، أو إلى إحباط تحمله بصمت. يمكنك أن تلاحظ ما إذا كانت خيبة أمل قديمة لا تزال تشكّل طريقة تعاملك مع المهام الجديدة. وتسميتها، ربما مع زميل أو مرشد موثوق، قد يرخي قبضتها ويساعدك على العودة إلى عملك بطاقة جديدة.
  growthUpright: >-
    في النمو الشخصي، يدعوك ثلاثة من السيوف إلى التمرن على الرفق بألمك. فالأسى جزء من كونك إنسانًا، لا علامة على أن فيك خللًا. يمكنك أن تستكشف طرقًا بسيطة للعناية بنفسك حين تشعر بالانخفاض: الراحة، والحركة، وأشكال الراحة المألوفة، وأشخاص يتركونك كما أنت.
  growthReversed: >-
    في الوضع المعكوس، قد تعكس هذه البطاقة تعلّم التحرر مما يؤلم بإيقاع يبدو آمنًا. يمكنك أن تلاحظ أين كنت تحبس أنفاسك، حرفيًا أو مجازيًا. فإطلاق تنهيدة، أو بضع دموع، أو بضع جمل صادقة في المذكرات، قد يكون فعل تحرر صغيرًا. والتعافي نادرًا ما يسير في خط مستقيم، ولا بأس بذلك.
