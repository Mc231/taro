imageryNote: >-
  تُظهر الصورة الأصلية ثلاثة نصال نحيلة مستندة إلى حجر على شكل قلب، تحت سماء رمادية منخفضة. ويهطل حوله مطر ناعم، ويظهر انفراج خافت من الضوء عند حافة الغيوم. يوحي الحجر بثقل الأسى، ويشير المطر إلى الدموع والتحرر. ويلمّح الضوء البعيد إلى أن العواصف تمضي، دون وعد بموعد.
