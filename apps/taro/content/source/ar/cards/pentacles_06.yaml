shortUpright: >-
  الموارد والوقت والرعاية تتنقل بين الناس. يمكنك ملاحظة كيف تعطي، وكيف تتلقى، وما الذي يبدو منصفًا للجميع.
shortReversed: >-
  قد يبدو تبادل ما مائلًا إلى جهة. يمكنك النظر فيما يُعطى، وما يُتوقع في المقابل، وما الذي قد يبدو أكثر تكافؤًا.
meaningUpright: |-
  يُظهر ستة من العملات شخصًا يحمل ميزانًا بينما يتقاسم العملات مع آخرين. إنها بطاقة عن تدفق الموارد بين الناس: المال، نعم، ولكن أيضًا الوقت والانتباه والنصيحة والصبر والمساعدة العملية. يوحي الميزان بالحرص على الإنصاف، وتوحي اليد المفتوحة بالاستعداد للمشاركة.
  ربما تكون في موقع العطاء الآن، فتقدّم المساعدة لصديق، أو ترشد شخصًا ما، أو تدعم قضية تهمك. أو ربما تكون في موقع التلقي، فتقبل معروفًا، أو يد عون، أو فرصة ثانية. ولكل من الدورين لطفه الخاص، ومعظمنا يتنقل بينهما مع الوقت.
  تدعوك هذه البطاقة إلى التأمل في روح تبادلاتك. هل يأتي عطاؤك بحرية، أم بتوقعات صامتة؟ هل يمكنك أن تتلقى دون أن تشعر بالصغر؟ يمكنك أن تلاحظ أين يصنع السخاء صلة حقيقية، وأين قد يتيح قليل من التوازن أو الصدق لكل المعنيين الشعور بالاحترام.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يشير ستة من العملات إلى تبادل صار غير متكافئ. قد يعطي طرف أكثر بكثير مما يتلقى، أو قد تأتي المساعدة بشروط غير معلنة: امتنان متوقع، أو اختيارات مُوجَّهة، أو إحساس بالدَّين. وقد تعكس أيضًا صعوبة في التلقي أصلًا، كأن قبول المساعدة يعني فقدان المكانة.
  هذه دعوة لمراجعة الميزان دون لوم. فاختلال التوازن كثيرًا ما ينمو بهدوء، بالعادة لا بالقصد.
  يمكنك النظر في علاقة أو ترتيب واحد يبدو فيه العطاء والتلقي غير متوازنين. هل هناك شيء تعطيه وصار مستنزفًا؟ هل هناك دعم ترفضه؟ فتسمية التوقعات بوضوح، أو تعديل مقدار ما تقدّمه، قد يعيد تبادلًا يبدو منصفًا ومختارًا بحرية من الجانبين.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس هذه البطاقة رعاية سخية ومتبادلة: دعمًا يتدفق في الاتجاهين مع الوقت، حتى لو لم يكن متساويًا في يوم بعينه. يمكنك أن تلاحظ كيف تُظهر الرعاية بطرق عملية، وكيف تسمح للآخرين برعايتك. وشكر شخص ما تحديدًا على ما يقدّمه قد يبقي هذا التدفق دافئًا ومرئيًا.
  relationshipsReversed: >-
    في الوضع المعكوس، قد توحي البطاقة برابط يشعر فيه طرف بأنه يعطي أكثر، أو تحمل فيه المساعدة التزامًا. يمكنك أن تطرح بلطف شعورك تجاه هذا التوازن، دون عدّ النقاط. وأحيانًا يكون التغيير الألطف أن تطلب ما تحتاج إليه، أو أن تدع شخصًا يقدّم المساعدة دون الإصرار على ردّها فورًا.
  workUpright: >-
    في العمل، قد تصف هذه البطاقة مشاركة المعرفة، أو الإرشاد، أو التقدير المنصف، أو الدعم التعاوني. ربما تكون في موقع يتيح لك فتح باب لشخص ما، أو قبول التوجيه بلباقة. وهي تدعوك إلى ملاحظة كيف تُتقاسم الموارد والفضل من حولك، وكيف يمكنك الإسهام في تدفق أكثر إنصافًا.
  workReversed: >-
    هنا قد تعكس البطاقة جهدًا لا يُقدَّر، أو خدمات تخلق ضغطًا، أو توقعات غير واضحة حول ما هو مستحق. يمكنك توضيح الاتفاقات، أو التعبير عن إسهاماتك، أو ملاحظة أين تقدّم عملًا إضافيًا تلقائيًا. فالتبادل المنصف في العمل كثيرًا ما يبدأ بجعل غير المرئي مرئيًا.
  growthUpright: >-
    في النمو الشخصي، يدعوك ستة من العملات إلى استكشاف علاقتك الخاصة بالسخاء. أين يبدو العطاء مبهجًا؟ وأين يبدو التلقي مريحًا؟ يمكنك التمرن على فعل سخاء صغير واحد هذا الأسبوع وفعل تلقٍّ واحد، وملاحظة ما يثيره كل منهما فيك.
  growthReversed: >-
    في الوضع المعكوس، قد تعكس البطاقة العطاء وسيلةً للشعور بالجدارة، أو رفض المساعدة للبقاء في موقع السيطرة. يمكنك أن تستكشف أين بدأت هذه الأنماط وما إذا كانت لا تزال مناسبة. فالسماح لنفسك بالوقوف على كفتي الميزان قد يعمّق احترام الذات والثقة.
reflectionQuestions:
  - "أين تميل إلى العطاء بحرية أكبر، وأين تتحفظ؟"
  - >-
    أيّ تبادل في حياتك يبدو غير متكافئ، وما الذي قد يجعله أكثر إنصافًا؟
  - >-
    كيف يمكنك أن تتلقى المساعدة من شخص ما هذا الأسبوع دون أن تشعر بأنك مدين له؟
imageryNote: >-
  قد تتمحور الصورة حول شخص واقف يحمل ميزانًا متوازنًا بإحدى يديه بينما تقدّم الأخرى عملات لأشخاص قريبين. وقد تتوزع ست عملات في أرجاء المشهد، بعضها في الأيدي وبعضها في الهواء بينهم. قد يرمز الميزان إلى الإنصاف والمراعاة، واليد الممدودة إلى السخاء، فيما تطرح المواقع المختلفة للأشخاص سؤال السلطة الذي قد يكمن بهدوء في أي تبادل.
