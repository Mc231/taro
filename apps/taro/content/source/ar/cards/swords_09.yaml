imageryNote: >-
  تُظهر الصورة الأصلية شخصًا جالسًا في سريره، ركبتاه مضمومتان، في غرفة مظلمة لا يضيئها إلا شريط رفيع من ضوء القمر عند النافذة. وتتدلى تسعة نصال في صفوف مرتبة على الجدار خلفه، دون أن تلمسه أبدًا. وتنتظر بطانية مطوية ومصباح صغير غير مضاء على مقربة. توحي صفوف النصال بأفكار تدور في حلقات، فيما يلمّح المصباح والنافذة إلى أن الطمأنينة والصباح قريبان.
