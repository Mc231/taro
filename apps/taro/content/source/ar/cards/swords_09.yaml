shortUpright: >-
  قد تبدو المخاوف أكبر في الساعات الهادئة؛ يمكنك ملاحظة أيّ المخاوف تتعلق بالآن وأيّها تتعلق بالاحتمال.
shortReversed: >-
  قد يبدأ ثقل القلق في الانقشاع، أو قد يطلب أن يُتقاسم بدلًا من أن يُحمل وحدك.
meaningUpright: |-
  تسعة من السيوف هي بطاقة الذهن في ساعة متأخرة من الليل. شخص يجلس في الظلام وأفكاره تتسارع، بينما الغرفة من حوله ساكنة تمامًا. تبدو المخاوف هائلة، لكن كثيرًا منها يتعلق بأشياء لم تحدث وقد لا تحدث أبدًا.
  قد تتعرف على هذه البطاقة في السهر وأنت تعيد حديثًا في ذهنك، أو تتخيل أسوأ الاحتمالات بشأن خطة ما، أو تشعر بذنب صغير يثقل مع كل ساعة. وقد تعكس فترة تراكم فيها الضغط وظل الذهن يدور دون أن يحط في أي مكان. والسيوف معلّقة على الجدار لا تلمس الشخص، ما يوحي بأن كثيرًا من الثقل يعيش في الفكر.
  تدعوك هذه البطاقة إلى اللطف مع ذهنك القلق. يمكنك أن تدوّن مخاوفك، ثم تسأل أيّها يمكنك التصرف حياله وأيّها لا يمكنك إلا أن تحمله برخاوة. فضوء الصباح، أو صوت موثوق، أو خطوة عملية صغيرة، كثيرًا ما يصغّر ما بدا غامرًا في الظلام. وإن بقي القلق ثقيلًا لوقت طويل، فالحديث مع شخص تثق به أو مع مختص مؤهل قد يساعد. لست مضطرًا إلى حمل كل فكرة وحدك.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس تسعة من السيوف قلقًا يبدأ في الانقشاع. ربما تنام أفضل قليلًا، أو تجد أن موقفًا خشيته كان أسهل في التعامل مما تخيلت. المنظور يعود، حتى لو بقي شيء من عدم الارتياح.
  وقراءة أخرى هي ضغط منطوٍ إلى الداخل ومخفي: إظهار وجه هادئ للآخرين بينما تشعر في السر بالاستنزاف. فإبقاء المخاوف سرًّا قد يجعلها تبدو أكبر وأكثر وحدة.
  تدعوك هذه البطاقة إلى التفكير في مشاركة ما يشغل بالك مع شخص تثق به. فقول الخوف بصوت عالٍ كثيرًا ما يكشف حجمه الحقيقي. ويمكنك أيضًا أن تلاحظ العادات التي تساعد أفكارك على الهدوء، كالمشي، أو التنفس ببطء، أو الكتابة قبل النوم، وأن تفسح لها مكانًا. ما الذي قد يساعدك على الشعور بوحدة أقل مع ما تحمله؟
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس هذه البطاقة أفكارًا قلقة حول شخص قريب: إعادة ما قاله، أو القلق بشأن موقع الأمور، أو تخيّل نظرته إليك. وقد تبدو هذه القصص مقنعة في الليل. يمكنك التفكير في التحقق من إحداها بلطف في وضح النهار، بسؤال بسيط. فالتواصل الواضح اللطيف كثيرًا ما يخفف ما يضخّمه الخيال.
  relationshipsReversed: >-
    في الوضع المعكوس، قد يشير تسعة من السيوف إلى البوح بمخاوفك لشخص قريب، أو إلى ملاحظة أن قطيعة خشيتها كانت أصغر مما ظننت. وقد يعكس أيضًا إخفاء الضغط عن الآخرين لتجنب إثقالهم. يمكنك أن تتذكر أن السماح للناس بدعمك قد يقرّبهم بدلًا من أن يبعدهم.
  workUpright: >-
    في العمل، قد تعكس هذه البطاقة ضغطًا يتبعك إلى البيت: موعد نهائي يطرد النوم، أو خوف من الخطأ، أو قلق بشأن نظرة الآخرين إلى جهودك. يمكنك أن تكتب الخطوة الأولى لليوم التالي قبل أن تتوقف مساءً، كي يحصل ذهنك على الإذن بالراحة. وتقسيم المخاوف الكبيرة إلى مهام صغيرة قد يجعلها أسهل في الإدارة.
  workReversed: >-
    في الوضع المعكوس، قد توحي هذه البطاقة بضغط يخف في العمل، أو بقرار التحدث أخيرًا مع أحد عن حمل يبدو ثقيلًا أكثر من اللازم. يمكنك طلب الوضوح حيث يغذي عدم اليقين قلقك. وتسمية مصدر قلق أمام زميل أو مدير قد تحوّل عبئًا خاصًا إلى مشكلة مشتركة لها خيارات عملية.
  growthUpright: >-
    في النمو الشخصي، يدعوك تسعة من السيوف إلى ملاحظة علاقتك بالقلق. متى يبدأ ذهنك في الدوران، وما الذي يساعده على الإبطاء؟ يمكنك تجربة روتين مسائي قصير يعلن نهاية اليوم. فاللطف مع أفكارك القلقة، بدلًا من محاربتها، قد يرخي قبضتها.
  growthReversed: >-
    في الوضع المعكوس، قد تعكس هذه البطاقة تعلّم أن الأفكار ليست حقائق دائمًا. يمكنك أن تلاحظ اللحظة التي يبدأ فيها قلق ما وتسمّيه بلطف قلقًا. ومع الوقت، قد تصنع هذه الوقفة الصغيرة مسافة بينك وبين الخوف. وطلب الدعم جزء من هذا النمو، لا علامة ضعف.
