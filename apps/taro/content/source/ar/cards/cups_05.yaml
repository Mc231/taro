imageryNote: >-
  تُظهر الصورة شخصًا متدثرًا بعباءة، رأسه منحنٍ فوق ثلاث كؤوس مقلوبة يتسرب ما فيها إلى الأرض. وخلفه كأسان لا تزالان قائمتين ويسهل إغفالهما. وقد يوحي درب أو معبر في البعيد بطريق للمضي حين يحين الوقت. وتعبّر الدرجات الباردة الخافتة عن الحداد، فيما يلمّح خيط رفيع من الضوء على الكأسين القائمتين إلى أن ليس كل شيء قد ذهب.
