shortUpright: >-
  قد يملأ فقدٌ ما مجال رؤيتك؛ تدعوك هذه البطاقة إلى أن تحزن بصدق، وأن تلاحظ مع الوقت ما لا يزال قائمًا.
shortReversed: >-
  قد يكون ثقل خيبة الأمل في طور التخفف؛ يمكنك التفكير فيما بقي معك وإلى أين تريد أن تلتفت بعد ذلك.
meaningUpright: |-
  يُظهر خمسة من الكؤوس شخصًا ينظر إلى كؤوس انسكبت، بينما تبقى كؤوس أخرى قائمة خلفه. إنها بطاقة عن خيبة الأمل والحزن: الشعور بأن شيئًا ما لم يجرِ كما أُمل، والانجذاب إلى البقاء مع ما فُقد.
  هذا الانجذاب إنساني. فحين تفشل خطة، أو تتغير صداقة، أو لا يتحقق توقع، يستغرق استيعاب ذلك وقتًا. لا تطلب منك هذه البطاقة أن تستعجل. فالحداد جزء من الاهتمام بشيء ما، وتسمية الفقد قد تكون طريقة لتكريمه.
  في الحياة اليومية، قد تعكس هذه البطاقة إعادة حديث ما في ذهنك مرارًا، أو استعراض ما كان بإمكانك فعله بشكل مختلف، أو صعوبة في الاستمتاع بشيء بسبب ما ينقص. وهي تدعوك بلطف، حين تشعر بالجاهزية، إلى أن تلتفت قليلًا وتلاحظ ما لم ينسكب: علاقات، ونقاط قوة، وخيارات لا تزال موجودة. يمكن للأمرين أن يكونا صحيحين معًا، الفقد وما تبقى.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس خمسة من الكؤوس عودة بطيئة للثبات بعد خيبة أمل. قد تلاحظ أن الفقد يؤلم بحدة أقل، أو أنك تستطيع الحديث عنه دون أن يملأ يومك كله. التقبّل لا يعني التظاهر بأنه لم يكن مهمًا؛ بل يعني إيجاد مساحة لحمله إلى جانب أشياء أخرى.
  وقد تشير هذه البطاقة أيضًا إلى أن المسامحة، لشخص آخر أو لنفسك، صارت ممكنة أكثر قليلًا. أو قد توحي بأن الحزن قد وُضع جانبًا بدلًا من أن يُعاش، وأنه يطلب لحظة انتباه أهدأ.
  يمكنك أن تسأل عمّا تعلّمته من هذه التجربة وما تريد أن تحمله معك. فالالتفات إلى ما تبقى ليس خيانة لما فُقد. وإن بقيت المشاعر الثقيلة معك، فمشاركتها مع شخص تثق به قد تجعل الحمل أخف.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس هذه البطاقة حزنًا على رابط تغيّر، أو أمل لم يتحقق، أو كلمات جرحت. وقد تدعوك إلى الاعتراف بذلك الشعور بدلًا من إزاحته جانبًا. ويمكنك أيضًا أن تلاحظ الأشخاص الذين بقوا قريبين خلال الصعوبة، وتخبرهم كم يعني لك ذلك.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تعكس البطاقة تحركًا نحو المصالحة، أو نحو السلام مع الطريقة التي تغيرت بها علاقة ما. ربما تشعر بالاستعداد للتخلي عن ضغينة قديمة، أو على الأقل لحملها برخاوة أكبر. يمكنك التفكير في شكل المسامحة بالنسبة إليك، مع تذكّر أنها لا تتطلب منك قبول ما لا يبدو صائبًا.
  workUpright: >-
    في العمل، قد يعكس خمسة من الكؤوس خيبة أمل من مشروع توقف، أو ملاحظات جارحة، أو فرصة ذهبت إلى غيرك. وقد يدعوك إلى أخذ لحظة لاستيعاب ذلك قبل التخطيط للخطوة التالية. وبعد ذلك، يمكنك أن تدوّن المهارات والعلاقات والأفكار التي لا تزال لك لتبني عليها.
  workReversed: >-
    في الوضع المعكوس، قد تعكس البطاقة تعافيًا من انتكاسة وبداية رؤية خيارات جديدة. قد تلاحظ أن بابًا حزنت لانغلاقه قد ترك مساحة لشيء آخر. ويمكنك كتابة مراجعة موجزة لما حدث، مع التركيز على الدروس لا على اللوم، كي تمضي بوضوح أكبر.
  growthUpright: >-
    الحزن والندم يستحقان مكانًا في قصتك، وتسأل هذه البطاقة كيف تمنحهما ذلك المكان دون أن تتركهما يكتبان بقيتها. يمكنك التمرن على ملاحظة اللحظات التي يعود فيها انتباهك مرارًا إلى ما سار على نحو خاطئ. وتوسيع النظرة بلطف، ولو لبضع دقائق يوميًا، قد يسهّل رؤية الصورة كاملة.
  growthReversed: >-
    في الوضع المعكوس، قد يعكس خمسة من الكؤوس صلابة تنمو بعد وقت صعب. قد تلاحظ منظورًا جديدًا أو رحمة أعمق منحتك إياها التجربة. والاحتفاء بالتغيير بطقس صغير، ككتابة رسالة لا ترسلها، قد يساعدك على إغلاق فصل وفتح التالي.
