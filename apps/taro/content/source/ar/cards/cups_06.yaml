imageryNote: >-
  تُظهر الصورة شخصين صغيرين في فناء أو حديقة محمية، يقدّم أحدهما للآخر كأسًا مليئة بالأزهار. وتوحي كؤوس أخرى قريبة، تحمل كل منها براعم، بذكريات زُرعت ولا تزال تنمو. ويمكن لجدار قديم أو مدخل في الخلفية أن يرمز إلى البيت وإلى حماية الأماكن المألوفة. وتنقل الألوان الدافئة الناعمة البراءة والسخاء والثقة السهلة لأيام مضت.
