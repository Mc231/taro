shortUpright: >-
  قد تجلب ذكرى أو لطف بسيط الدفء اليوم؛ تدعوك هذه البطاقة إلى ملاحظة ما لا يزال الماضي يمنحك إياه.
shortReversed: >-
  قد يشدّك الماضي أكثر من المعتاد؛ يمكنك التفكير في الذكريات التي تغذّيك وتلك التي تبعدك عن الحاضر.
meaningUpright: |-
  ستة من الكؤوس بطاقة ذاكرة ولطف رقيق. كثيرًا ما تُظهر شخصًا يقدّم لآخر كأسًا مليئة بالأزهار، في لفتة بسيطة وسخية خالية من الحسابات. وقد تستحضر الطفولة، أو الأصدقاء القدامى، أو الأماكن المألوفة، أو زمنًا كانت فيه الأمور تبدو أسهل.
  في الحياة اليومية، قد تعكس هذه البطاقة استعادة الصلة بشخص من ماضيك، أو العودة إلى هواية أحببتها يومًا، أو إيجاد العزاء في أغنية أو وصفة أو رائحة تعيدك إلى الوراء. وقد تشير أيضًا إلى أفعال لطف صغيرة تُعطى وتُتلقى دون انتظار مقابل.
  الدعوة هنا أن تدع الماضي يقدّم ما يستطيع: الدفء، والمنظور، والتذكير بمن كنت دائمًا. فالحنين قد يكون موردًا حين يساعدك على تذكّر ما يهمك. يمكنك أن تسأل أيّ صفة من زمن سابق تود أن تحملها إلى الحاضر، كروح اللعب أو الفضول أو الطمأنينة.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يوحي ستة من الكؤوس بأن الذاكرة صارت مكانًا للاختباء لا مكانًا للزيارة. قد تجد نفسك تقارن الحاضر سلبًا بنسخة مثالية من الماضي، أو تتمسك بأنماط وأدوار قديمة لم تعد مناسبة.
  وقد يشير أيضًا إلى الاتجاه الآخر: استعداد للنمو أبعد من شيء ما في تاريخك، وترك قصة قديمة خلفك كي تبدأ قصة جديدة.
  تدعوك هذه البطاقة إلى النظر إلى الماضي بلطف وصدق معًا. ما الذي حدث فعلًا، وما الذي أضفته وأنت تتذكره؟ يمكنك الاحتفاظ بالأجزاء التي تغذّيك وإرخاء قبضتك عن تلك التي تُبقيك صغيرًا. فالنضج لا يعني فقدان الرقة؛ بل قد يعني حملها معك إلى اختيارات تنتمي إلى اليوم.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد يعكس ستة من الكؤوس لقاءً بعد غياب، أو ذكرى مشتركة، أو صداقة ذات جذور عميقة. وقد يدعو إلى روح اللعب والإيماءات البسيطة، كملاحظة، أو وجبة خفيفة مشتركة، أو صورة قديمة تُرسل مع ابتسامة. يمكنك أن تلاحظ كيف يخلق التاريخ المشترك الثقة، وكيف يمكنكما إضافة ذكريات جديدة معًا.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تشير هذه البطاقة إلى رابط يجمعه الماضي أساسًا، أو إلى مقارنة شخص ما بمن كان عليه. يمكنك التفكير فيما إذا كنت تتعامل مع الشخص الماثل أمامك الآن، أم مع صورة قديمة له. فالسماح لكل منكما بالتغير قد يبقي الرابط حيًّا وصادقًا.
  workUpright: >-
    في العمل، قد تعكس هذه البطاقة العودة إلى شيء استمتعت به في البدايات، أو إرشاد شخص أحدث عهدًا، أو الاستفادة من مهارات قديمة بطريقة جديدة. وقد تدعوك إلى إدخال حسن النية البسيط إلى مكان العمل. فالمجاملات الصغيرة، كعرض المساعدة قبل أن تُطلب، كثيرًا ما تشكّل ثقافة المكان أكثر من التصريحات الكبيرة.
  workReversed: >-
    في الوضع المعكوس، قد تعكس البطاقة تشبثًا بالطريقة التي كانت تُنجز بها الأمور، أو مقاومة لتغيير لأن الطريقة القديمة تبدو أكثر أمانًا. يمكنك أن تسأل أيّ التقاليد لا يزال يخدم العمل، وأيّها يُحتفظ به بدافع العادة. فاحترام الماضي مع إفساح المجال لمقاربات جديدة قد يسهّل الانتقال على الجميع.
  growthUpright: >-
    في النمو الشخصي، يدعوك ستة من الكؤوس إلى استعادة الصلة بفضول نفسك الأصغر سنًّا وبهجتها. يمكنك العودة إلى نشاط أحببته في طفولتك، دون هدف سوى الاستمتاع. وتذكّر ما كان يشعرك يومًا بالخفة والتمهل قد يرشد اختياراتك في طريقة قضاء وقتك الآن.
  growthReversed: >-
    في الوضع المعكوس، قد تطلب منك هذه البطاقة تحديث قصة قديمة عن نفسك. ربما لا يزال وصف من الطفولة يشكّل نظرتك إلى قدراتك. يمكنك أن تدوّن قناعة واحدة من الماضي وتسأل ما إذا كانت لا تزال صحيحة. والتخلي عنها قد يفسح المجال لمن تصير إليه.
