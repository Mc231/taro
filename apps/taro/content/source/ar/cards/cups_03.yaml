shortUpright: >-
  لحظة لملاحظة مَن يشاركك أفراحك، وكيف يمكنك أن تشاركه أفراحه في المقابل.
shortReversed: >-
  قد يبدو التواصل رقيقًا أو متعبًا الآن؛ يمكنك التفكير في الاجتماعات التي تغذّيك وتلك التي تملأ الوقت فحسب.
meaningUpright: |-
  ثلاثة من الكؤوس بطاقة أصدقاء يرفعون كؤوسهم معًا. إنها تحتفي بنوع من التواصل لا يحتاج إلى سبب: ضحك حول طاولة المطبخ، أو مجموعة محادثة تضيء بخبر سار، أو جيران يساعدون دون أن يُطلب منهم. فحيث ينظر اثنان من الكؤوس إلى رابط واحد، تنظر هذه البطاقة إلى الدائرة.
  قد تعكس موسمًا من الاجتماعات، أو محطة تستحق الاحتفاء، أو مجرد إحساس بالانتماء إلى مجموعة تراك. وقد تشير أيضًا إلى دعم موجود من حولك بالفعل، ربما أكثر مما كنت تلاحظ.
  تدعوك هذه البطاقة إلى أن تتشارك الفرح بدلًا من ادخاره لوقت لاحق. يمكنك التواصل مع شخص تنوي رؤيته منذ مدة، أو قبول دعوة، أو صنع مناسبة صغيرة خاصة بك. الاحتفال لا يحتاج إلى أن يكون فخمًا. أحيانًا يكون مجرد اعتراف مشترك بأن شيئًا جميلًا قد حدث، أو بأنكم اجتزتم شيئًا صعبًا.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس ثلاثة من الكؤوس حياة اجتماعية خارج الإيقاع. قد تشعر بأنك على هامش مجموعة كنت تشعر يومًا بأنك جزء منها، أو تلاحظ أن صداقات تباعدت مع تغير الحياة. أو ربما يكون هناك فائض من الشيء الجميل: خطط لا تترك مجالًا للراحة، أو احتفالات صارت وسيلة لتجنب مشاعر أهدأ.
  لا شيء من هذا حكم على صداقاتك. فالدوائر تتغير أشكالها، ومن الطبيعي أن تتجاوز بعض الاجتماعات وتشتاق إلى أخرى.
  الدعوة هنا هي النظر إلى جودة روابطك لا إلى عددها. أيّ الأشخاص يتركونك أقرب إلى نفسك؟ وأين قد تقول نعم بدافع العادة؟ لقاء صادق واحد مع صديق واحد قد يقدّم أكثر من تقويم مزدحم.
aspects:
  relationshipsUpright: >-
    في العلاقات، تسلّط هذه البطاقة الضوء على الشبكة الأوسع حول الرابط: الأصدقاء، والعائلة، والعائلة التي تختارها. وقد تدعوك إلى مشاركة اللحظات الطيبة مع من يدعمونك، أو إلى الترحيب بشخص قريب في دائرتك. ويمكنك أيضًا أن تلاحظ كم تسندك صداقاتك، وتمنحها شيئًا من الانتباه الذي يُخصص عادةً لعلاقة واحدة.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تعكس هذه البطاقة توترًا في مجموعة، أو إحساسًا بالإقصاء. وقد تشير أيضًا إلى تأثير خارجي على رابط ما، أيًّا كان شكله. وبدلًا من التخمين، يمكنك أن تسأل بوضوح عن حال الأمور. وقد يساعد أيضًا قضاء الوقت مع أشخاص لا تحتاج معهم إلى التظاهر أو مجاراة أحد.
  workUpright: >-
    في العمل، قد يشير ثلاثة من الكؤوس إلى روح الفريق، أو نجاح مشترك، أو متعاونين يستمتعون حقًا بالعمل معًا. وقد يدعوك إلى الاحتفاء بالتقدم على طول الطريق، لا عند خط النهاية فقط. فشكر الناس بأسمائهم، وتقاسم الفضل، والاحتفاء بالمحطات الصغيرة قد يجعل المجموعة أقوى والعمل أكثر إرضاءً.
  workReversed: >-
    في الوضع المعكوس، قد تعكس البطاقة فريقًا فقد دفأه، ربما بسبب النميمة أو التكتلات أو مجرد ضغط العمل. يمكنك أن تلاحظ ما إذا كان الضغط الاجتماعي يشكّل اختياراتك، كالبقاء حتى وقت متأخر لتنسجم مع الآخرين. ويمكنك التفكير في شكل الزمالة الصحية بالنسبة إليك، وأين يمكنك أن تكون قدوة لها بطريقة صغيرة.
  growthUpright: >-
    في النمو الشخصي، تدعوك هذه البطاقة إلى تقدير الفرح بوصفه جزءًا من حياة متوازنة، لا مكافأة عليك أن تكسبها أولًا. يمكنك أن تدوّن المسرات الصغيرة المشتركة على مدى أسبوع. فملاحظتها قد تسهّل إدراك المجتمع الذي تملكه بالفعل، ورؤية أين قد تود توسيعه.
  growthReversed: >-
    في الوضع المعكوس، قد تسأل هذه البطاقة ما إذا كنت تستخدم الانشغال أو الرفقة لتجنب البقاء وحدك مع أفكارك. وقد تعكس أيضًا وحدة يصعب الاعتراف بها. يمكنك الموازنة بين الوقت الاجتماعي والعزلة وملاحظة أيّهما تفتقده أكثر. والتواصل مع شخص واحد قد يكون بداية لطيفة.
reflectionQuestions:
  - "مَن الأشخاص الذين تود الاحتفال معهم أكثر من غيرهم، ولماذا؟"
  - "أيّ الاجتماعات تملؤك، وأيّها يستنزفك؟"
  - >-
    ما المناسبة الصغيرة التي يمكنك صنعها لمشاركة شيء جميل هذا الأسبوع؟
imageryNote: >-
  تُظهر الصورة ثلاثة أشخاص في دائرة غير محكمة، يرفعون كؤوسهم فتلتقي في المنتصف. وحول أقدامهم حصاد من الفاكهة أو الأزهار أو الكروم قد يوحي بوفرة تنمو من الجهد المشترك. وقد ترمز ملابسهم ووقفاتهم وألوانهم المختلفة إلى أصدقاء يحافظون على تميّزهم بينما ينتمون معًا. وتنقل الحركة في المشهد، كخطوة رقص أو طرف ثوب يدور، فرحًا سهلًا غير متكلَّف.
