shortUpright: >-
  ربما تشعر بالاستعداد للاستمتاع بما زرعه جهدك. يمكنك ملاحظة الثقة الهادئة في الوقوف في مساحة شكّلتها بنفسك.
shortReversed: >-
  قد تبدو الراحة بعيدة المنال أو فارغة على نحو غريب. يمكنك أن تسأل ما الذي قد يتيح لك أن ترتاح حقًا فيما تملكه بالفعل.
meaningUpright: |-
  يُظهر تسعة من العملات شخصًا يتجول في حديقة مزدهرة، كرومها مثقلة بالثمار والعملات من حوله. يبدو مرتاحًا، وحيدًا لكن دون شعور بالوحدة. تتحدث هذه البطاقة عن الاكتفاء الذاتي ومتعة الاستمتاع بما ساعدت رعايتك وانضباطك على إنمائه.
  قد تتعرف عليها في بيت جعلته مريحًا، أو مهارة صارت تعيلك، أو وقت تعلّمت أن تقضيه جيدًا مع نفسك، أو مجرد إحساس بأن حياتك اتخذت بعض الشكل الذي أردته. وهنا رقيّ أيضًا: تقدير للجمال والذوق والمتع الصغيرة التي تبدو مستحقة.
  تدعوك البطاقة إلى التوقف والاستمتاع فعلًا بما زرعته، بدلًا من الانتقال مباشرة إلى الهدف التالي. يمكنك أن تسأل ما الذي تعنيه الاستقلالية لك، وأيّ أشكال الراحة تغذّيك حقًا، وكيف يمكنك تكريم جهدك. فتقدير الذات المتجذر في قيمك قد يبدو أثبت من قيمة تُقاس باستحسان الآخرين.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس تسعة من العملات صعوبة في الارتياح فيما بنيته. ربما يواصل العمل مزاحمة الاستمتاع، أو تبدو الراحة جوفاء، كأنها تخص شخصًا آخر. وقد يشير أيضًا إلى الاعتماد على الاستحسان الخارجي، حيث يتوقف الإحساس بالقيمة على مظهر الأمور لا على الشعور بها.
  تدور هذه القراءة حول الالتفات إلى الداخل. فقد تكون الحديقة موجودة، لكنك ربما لا تسمح لنفسك بالتجول فيها.
  يمكنك أن تستكشف ما الذي يجعل قبول الطمأنينة صعبًا. هل هناك قناعة بأن الراحة يجب أن تُكتسب من جديد دائمًا؟ هل تختلط الاستقلالية بالعزلة؟ فاختيار متعة صغيرة واحدة للاستمتاع بها تمامًا، دون شعور بالذنب أو جمهور، قد يكون خطوة أولى نحو الشعور بالألفة في حياتك.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس هذه البطاقة إحساسًا آمنًا بالذات تحمله إلى روابطك. فالاستمتاع بصحبة نفسك قد يجعل الوقت مع الآخرين اختيارًا لا حاجة. يمكنك أن تلاحظ كيف قد تدعم استقلاليتك وقربك من الناس كلٌّ منهما الآخر، وتتقاسم شيئًا من حديقتك مع من تحب.
  relationshipsReversed: >-
    في الوضع المعكوس، قد توحي البطاقة بالاتكاء على علاقة ما للإحساس بالقيمة، أو بإبقاء الناس على مسافة لحماية استقلاليتك. يمكنك أن تسأل أيّ توازن بين القرب والاعتماد على الذات يبدو مناسبًا لك الآن، وأن تسمح بلطف لشخص ما برؤية نقاط قوتك واحتياجاتك معًا.
  workUpright: >-
    في العمل، قد يعكس تسعة من العملات ثقة بقدراتك وثمار الجهد المتواصل، كالاستقلالية أو الاحترام أو إيقاع مستحق. يمكنك أن تأخذ وقتًا للاعتراف بما حققته والاستمتاع بالاستقرار الذي ساعدت على صنعه قبل وضع الهدف التالي.
  workReversed: >-
    هنا قد تشير البطاقة إلى إفراط في العمل لا يترك مجالًا يُذكر لتقدير أي شيء، أو إلى إنجازات تبدو أقل إرضاءً مما توقعت. يمكنك التأمل في الثمار التي تهمك فعلًا. فتعديل الحدود حول وقتك قد يتيح لفوائد عملك أن تصل إلى بقية حياتك.
  growthUpright: >-
    في النمو الشخصي، تدعوك هذه البطاقة إلى تنمية تقدير الذات والاستمتاع. فالوقت وحدك، أو مساحة جميلة، أو روتين متقن، قد تكون تعبيرات عن احترام نفسك. يمكنك أن تصنع طقسًا صغيرًا واحدًا يحتفي بالمسافة التي قطعتها، وتتركه يكون لك وحدك.
  growthReversed: >-
    في الوضع المعكوس، قد تعكس البطاقة شعورًا قلقًا بأن لا شيء يكفي تمامًا، أو راحة تُطلب لملء فجوة داخلية. يمكنك أن تستكشف كيف ستبدو القناعة الحقيقية، أبعد من المظاهر. فملاحظة لحظات الطمأنينة الحقيقية، مهما كانت قصيرة، قد تساعدك على إدراكها والعودة إليها.
