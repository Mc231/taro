imageryNote: >-
  قد تُظهر الصورة شخصًا واحدًا يقف بين كروم العنب أو أشجار الفاكهة، وتسع عملات منسوجة في النبات من حوله، وطائر صغير يستريح بهدوء على إحدى يديه. قد ترمز الحديقة الوافرة إلى ثمار الرعاية الصبورة، والطائر إلى ذهن منضبط ولطيف، والوقفة غير المستعجلة إلى ثقة هادئة. وقد توحي درجات الأخضر الغني والذهبي برقيّ بلا إفراط، بمساحة تبدو مستحقة ومشكَّلة بلمسة شخصية.
