shortUpright: >-
  قد تتلألأ إمكانات كثيرة في آن؛ تدعوك هذه البطاقة إلى الاستمتاع بالتخيل، ثم النظر عن قرب إلى كل منها.
shortReversed: >-
  قد يكون ضباب الخيارات في طور الانقشاع؛ يمكنك التفكير في الاختيار الذي يبقى حقيقيًا بعد أن يخفت وهج التخيل.
meaningUpright: |-
  كثيرًا ما يُظهر سبعة من الكؤوس شخصًا يواجه صفًّا من الكؤوس العائمة في الهواء، تحمل كل منها رؤية مختلفة. إنها بطاقة الخيال والإمكانات والدوار الذي قد يأتي من كثرة الخيارات.
  الخيال موهبة. فهو يتيح لك تصوّر حيوات لم تعشها بعد وأفكار لم تخطر لأحد. لكن هذه البطاقة تلاحظ أيضًا كم يسهل أن تختلط أحلام اليقظة بالخطط. فبعض الكؤوس تحمل فرصًا حقيقية، وبعضها يحمل أمنيات، وبعضها يحمل مخاوف تتنكر في هيئة إمكانات.
  في الحياة اليومية، قد يبدو ذلك قفزًا بين المشاريع، أو تصفحًا للخيارات دون اختيار، أو انجذابًا إلى حلم لا خطوة أولى له. تدعوك البطاقة إلى الاستمتاع بالحلم ثم النظر عن قرب. أيّ خيار يناسب قيمك وظروفك الفعلية؟ وما الفعل الصغير الأول؟ اختيار واحد لا يعني خسارة البقية إلى الأبد؛ بل يعني منح شيء ما فرصة أن يصبح حقيقيًا.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس سبعة من الكؤوس وضوحًا يصل بعد فترة من الحيرة. قد تبدأ الكؤوس العائمة في الاستقرار، وقد ترى أيّها يحمل شيئًا ملموسًا وأيّها كان في معظمه ضبابًا. وقد يبدو ذلك ارتياحًا، أو خيبة أمل صغيرة مع تلاشي بعض الأوهام.
  وقد يوحي أيضًا بالعكس: تجنّب الاختيار بإبقاء كل الإمكانات مفتوحة، أو إقصاء الخيال كليًا باسم الواقعية.
  الدعوة هنا هي إيجاد أرضية وسطى ثابتة. يمكنك اختيار خيار واحد واختباره بطريقة صغيرة قليلة الضغط. ومن المفيد ملاحظة ما يثير حماستك في التطبيق لا في النظرية. فالتخلي عن حلم يقظة قد يفسح المجال لخطة يمكنك أن تعيشها فعلًا، ويمكن أن يبقى الحلم شيئًا تعود إليه للإلهام.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس هذه البطاقة إضفاء صورة مثالية على شخص ما، أو تخيّل مستقبلات كثيرة ممكنة مع شخص بعينه أو من دونه. وقد تدعوك إلى ملاحظة الفرق بين من يكون الشخص ومن تأمل أن يكون. يمكنك الاستمتاع بالخيال مع ترسيخه في أحاديث حقيقية عمّا يريده كل منكما.
  relationshipsReversed: >-
    في الوضع المعكوس، قد يشير سبعة من الكؤوس إلى رؤية علاقة ما بوضوح أكبر، ربما بعد انقشاع ضباب رومانسي. وهذا الوضوح قد يكون فرصة للبناء على ما هو حقيقي. يمكنك أن تسأل عمّا تقدّره حقًا في الرابط الآن، لا عمّا تخيلته في البداية، ومشاركة ذلك بانفتاح.
  workUpright: >-
    في العمل، قد تعكس هذه البطاقة فائضًا من الأفكار أو الخيارات، كمشاريع أو مسارات أو عروض عدة تتنافس على الانتباه. وقد تدعوك إلى وزن كل منها في ضوء أولوياتك ووقتك وطاقتك. وقد يساعد تدوينها جنبًا إلى جنب. فالخيال مفيد للعصف الذهني؛ أما القرارات فتحتاج غالبًا إلى أرض أصلب.
  workReversed: >-
    في الوضع المعكوس، قد تعكس البطاقة تضييق الخيارات نحو اتجاه واضح، أو الالتزام أخيرًا بمشروع واحد. قد تلاحظ عودة الإحساس بالتركيز. وإن شعرت بزوال الأوهام، يمكنك التفكير في أيّ أجزاء الرؤية الأصلية لا تزال تستحق أن تُحمل إلى شيء أكثر واقعية وأقرب إليك.
  growthUpright: >-
    في النمو الشخصي، يدعوك سبعة من الكؤوس إلى فهم أحلام يقظتك. أيّ توق يعبّر عنه كل منها؟ يمكنك الكتابة في مذكراتك عن خيال متكرر والبحث عن الحاجة الكامنة تحته، كالحرية أو التقدير أو الراحة. وتلبية تلك الحاجة بطريقة صغيرة وحقيقية قد يكون أكثر إرضاءً من الحلم نفسه.
  growthReversed: >-
    في الوضع المعكوس، قد تعكس هذه البطاقة قدرة متنامية على التمييز بين الأمنيات والنوايا. يمكنك التمرن على اتخاذ قرار واضح واحد كل يوم، مهما كان صغيرًا. ومع الوقت، قد يبني ذلك الثقة بحكمك الخاص مع ترك مساحة للخيال كي يلهمك لا ليشتتك.
reflectionQuestions:
