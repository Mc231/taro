imageryNote: >-
  يمضي فارس على حصان هادئ عبر حشد صغير، حاملًا عصا يتوّجها إكليل من الأوراق. وتصطف عصي أخرى مرفوعة على جانبي الطريق كحرس شرف. يرمز الإكليل إلى تقدير اكتُسب بالجهد، والحصان الثابت إلى ثقة دُرّبت لا استُعجلت، والأشخاص المحيطون إلى المجتمع الذي يشارك في الإنجاز ويدعمه.
