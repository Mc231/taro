shortUpright: >-
  قد يحظى جهدك بالملاحظة؛ يمكنك أن تسمح لنفسك بتلقي بعض التقدير، وأن تلاحظ مَن ساعدك على الوصول إلى هنا.
shortReversed: >-
  قد يبدو التقدير غائبًا أو أقل إرضاءً مما أملت؛ يمكنك أن تسأل ما يعنيه النجاح لك بشروطك أنت.
meaningUpright: |-
  ستة من العصي بطاقة تقدير. فبعد احتكاك البطاقة الخامسة، يتقدم فارس وعلى عصاه إكليل، ويبدو الناس على طول الطريق وكأنهم يهتفون. إنها تلتقط اللحظة التي يصبح فيها الجهد مرئيًا ويعترف به الآخرون.
  قد يبدو ذلك ملاحظات طيبة على عمل بذلت فيه نفسك، أو صديقًا يخبرك بإعجابه بطريقة تعاملك مع أمر ما، أو إتمام تحدٍّ شككت يومًا في قدرتك على مواجهته. وقد يكون أيضًا نوعًا أهدأ من الثقة: أن تقف منتصب القامة قليلًا لأنك تعرف أنك أحسنت.
  تدعوك هذه البطاقة إلى قبول التقدير دون إزاحته جانبًا. فالتقدير قد يكون منشّطًا وقد يمنحك الشجاعة للخطوة التالية. وفي الوقت نفسه، يحيط الناس بالفارس، وفي ذلك تذكير بأن قليلًا من الإنجازات يكون فرديًا تمامًا. يمكنك أن تستمتع باللحظة، وأن تفكر أيضًا فيمن دعمك، وكيف يمكنك أن تتقاسم معهم بعض الفضل.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس ستة من العصي جهدًا مرّ دون ملاحظة، أو مديحًا لا يصل إليك تمامًا. ربما حققت شيئًا ولا تزال تشعر بأنه لا يُحتسب حتى يقول أحد ذلك. وقد يشير أيضًا إلى تعب من إظهار ثقة لا تشعر بها كاملة.
  وأحيانًا تصف هذه البطاقة في وضعها المعكوس نجاحًا هادئًا، ذا معنى لك حتى لو لم يكن مرئيًا للآخرين. وهذا النوع من التقدم مهم أيضًا.
  قد تكون هذه لحظة للنظر في مدى اعتماد إحساسك بقيمتك على التصفيق. كيف سيكون الأمر لو اعترفت بجهدك أنت أولًا؟ يمكنك أن تدوّن ما تفخر به، بما في ذلك الأجزاء التي لم يرها أحد، وتتركه يكون مصدر تشجيع أثبت من استحسان الخارج.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس هذه البطاقة تقديرًا يتدفق في الاتجاهين: الفخر بشخص قريب، أو الشعور بأنه يراك ويدعمك. وقد تدعوكما إلى الاحتفاء بانتصارات كل منكما بصوت عالٍ. يمكنك أن تخبر صديقًا أو شريكًا أو فردًا من العائلة بشيء تعجب به فيه، وتسمح لنفسك بتلقي تشجيعه في المقابل.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تشعر بأن جهودك في علاقة ما تمر دون ملاحظة، أو بأن التقدير صار منافسة صامتة. يمكنك التفكير في قول نوع التقدير الذي يهمك بوضوح، وسؤال الطرف الآخر عن الأمر نفسه. فالشكر الصغير المحدد قد يغيّر الجو أكثر من الإيماءات الكبيرة.
  workUpright: >-
    في العمل أو الدراسة، قد يشير ستة من العصي إلى نتائج مرئية: ملاحظات إيجابية، أو مشروع لقي استقبالًا حسنًا، أو لحظة لعرض ما أنجزته. يمكنك استخدام هذه الثقة لمشاركة أفكارك بانفتاح أكبر، مع نسبة الفضل إلى من أسهموا. فالتقدير الذي يُتقاسم بسخاء يميل إلى بناء فرق أقوى.
  workReversed: >-
    في الوضع المعكوس، قد تبدو إسهاماتك مُغفلة، أو قد يعتمد النجاح أكثر من اللازم على المظهر الخارجي للأمور. يمكنك أن تجعل عملك أكثر وضوحًا بطريقة هادئة وواقعية، كملخص قصير لما أنجزته، وأن تتأمل أيضًا في النتائج التي تهمك بغض النظر عمّن يلاحظها.
  growthUpright: >-
    في النمو الشخصي، تدعوك هذه البطاقة إلى السماح لنفسك بالشعور بالفخر. فالاعتراف بتقدمك قد يبني ثقة ترافقك إلى التحدي التالي. يمكنك الاحتفاظ بقائمة قصيرة بأمور أحسنت التعامل معها مؤخرًا، لتعود إليها في الأيام التي تبدو فيها ثقتك أرق.
  growthReversed: >-
    في الوضع المعكوس، قد يخفت إحساسك بالإنجاز بفعل الشك في الذات أو الحاجة إلى الاستحسان. يمكنك أن تستكشف من أين جاءت فكرتك عن النجاح، وما إذا كانت لا تزال تناسبك. فتعريف النجاح بكلماتك أنت قد يجعل تقدير الآخرين إضافة لطيفة لا شيئًا تعتمد عليه.
