imageryNote: >-
  يُتخيَّل ساحر Taro عند كشك في سوق على مفترق طرق عند الفجر، يرتّب أربعة أغراض متواضعة تمثل المجموعات الأربع: غصنًا أخضر، وكأسًا من الفخار، وسكينًا لتقطيع الخبز، وعملة واحدة. تمتد إحدى يديه نحو الكشك، وتشير الأخرى إلى السماء التي يزداد ضوؤها، رابطةً الفكرة بالفعل. وتوحي خيوط الضوء الممتدة بين الأغراض بانتباه يجمع أدوات متفرقة في غاية واحدة، فيما يلمّح رغيف لم يكتمل إلى أن الصنع قد بدأ للتو.
