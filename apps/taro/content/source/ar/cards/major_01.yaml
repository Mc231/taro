shortUpright: >-
  قد تملك مما تحتاج إليه أكثر مما تظن؛ وتسألك هذه البطاقة ما الذي تريد أن تصنعه به.
shortReversed: >-
  أدواتك على الطاولة، لكن انتباهك ربما في مكان آخر. ما الذي قد يساعدك على جمعه؟
meaningUpright: |-
  الساحر هو بطاقة تحويل الفكرة إلى شيء حقيقي. فحيث ينطلق الأحمق دون خطة، يتوقف الساحر وينظر إلى ما في متناوله ويقرر أن يستخدمه. والصورة التقليدية ليدٍ مرفوعة وأخرى تشير إلى الأسفل توحي بجسر بين النية والفعل، بين ما تتخيله وما يمكنك فعله اليوم حقًا.
  في الحياة اليومية، قد تعكس هذه البطاقة اللحظة التي تحصل فيها خطة أخيرًا على موعد، وعلى وقت مخصص لها، وعلى مسودة أولى. وقد تشير إلى مهارات تميل إلى إغفالها لأنها تأتيك بسهولة: موهبة في الشرح، أو في إصلاح المشكلات الصغيرة، أو في جمع الناس. حسن التدبير هنا يعني أن تلاحظ أن القطع موجودة على الطاولة بالفعل.
  تدعوك هذه البطاقة إلى التفكير في الموضع الذي يذهب إليه انتباهك. فالتركيز نوع من الحرفة يمكن التمرّن عليه. يمكنك أن تسأل ما الشيء الواحد الذي تود أن تخرجه إلى الوجود، وأيّ الأدوات التي تملكها قد تقرّبه خطوة. لا يَعِد الساحر بنتائج، بل يسلّط الضوء على قوة الحضور بنية واضحة واستخدام ما لديك.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس الساحر قدرة حاضرة لكنها لم تُستخدم بعد. ربما تملك المهارات والأفكار، لكنك تشعر بأن طاقتك تتسرب في اتجاهات كثيرة، أو تشك في أن مساهمتك ذات قيمة. الطاولة جاهزة، لكن اليدين لا تتحركان تمامًا.
  وقد تشير هذه البطاقة أيضًا إلى ذكاء انحرف قليلًا عن مساره: استخدام الجاذبية أو الكلام السريع لتجاوز الجزء الممل من العمل، أو إظهار ثقة على السطح مع شعور بعدم اليقين في الداخل. ليس أيّ من ذلك عيبًا أخلاقيًا، لكن كليهما قد يكون علامة على أن النية والفعل قد تباعدا.
  ربما يفيدك أن تنظر إلى المواضع التي ينقسم فيها تركيزك. اختيار مهمة واحدة صغيرة وملموسة وإنجازها قد يعيد بناء الثقة بيديك. وقد يفيد أيضًا أن تسأل ما الذي كنت ستفعله بشكل مختلف لو لم يكن أحد يراقب.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد يعكس الساحر قوة التواصل الواضح والمباشر. وقد يدعوك إلى قول ما تعنيه والتصرف بما يتوافق مع كلماتك. يمكنك أن تلاحظ إلى أي حد تستطيع تشكيل نبرة العلاقة بإيماءات صغيرة مقصودة: رسالة مدروسة، أو خطة نُفّذت حتى النهاية، أو انتباه يُمنح دون تشتت.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تسأل هذه البطاقة ما إذا كانت الأقوال والأفعال متسقة في علاقة قريبة، من جهتك أو من جهة الطرف الآخر. وقد تعكس أيضًا كتمان ما تفكر فيه حقًا، أو تقديم نسخة من نفسك تظن أنها ستنال الإعجاب. يمكنك التفكير فيما قد يتغير لو سمحت لأحدهم برؤية نواياك الحقيقية، حتى غير المؤكدة منها.
  workUpright: >-
    في العمل أو في مشروع ما، يشير الساحر إلى التقاء المهارة بالفرصة. وقد يدعوك إلى جرد قدراتك وعلاقاتك ومواردك، وتوجيهها نحو هدف واحد واضح. إنها بطاقة البدء، وعرض الفكرة، وبناء النموذج الأولي، أو كتابة المقترح أخيرًا. التركيز والمتابعة أهم هنا من امتلاك كل الإجابات مسبقًا.
  workReversed: >-
    في الوضع المعكوس، قد يعكس الساحر موهبة غير مستثمرة بما يكفي، أو جهدًا موزعًا على نحو رقيق لا يصيب فيه شيء هدفه تمامًا. وقد يشير أيضًا إلى إغراء المبالغة في العرض أو اختصار الطريق. يمكنك أن تسأل أي مهمة تستحق طاقتك حقًا الآن، وكيف سيبدو العمل الصادق المتواصل عليها في الأيام القليلة المقبلة.
  growthUpright: >-
    في النمو الشخصي، تدعوك هذه البطاقة إلى إدراك قدرتك على الفعل. يمكنك أن تدوّن المهارات والعادات وأشكال الدعم التي تملكها بالفعل، وأن تلاحظ كيف قد تخدم شيئًا يهمك. الممارسة والتكرار والنية الواضحة هي أدوات الساحر الهادئة؛ والاختيارات اليومية الصغيرة قد تتراكم لتصنع تغييرًا حقيقيًا مع الوقت.
  growthReversed: >-
    في الوضع المعكوس، قد يعكس الساحر فجوة بين الشخص الذي تعرف أن بإمكانك أن تكونه والعادات التي تعيشها. وقد يسأل أين يجعلك الشك في الذات تنتظر الإذن. يمكنك اختيار مهارة واحدة للتمرن عليها علنًا وبلا كمال، وملاحظة كيف تنمو الثقة من الفعل لا من انتظار الشعور بالجاهزية.
