shortUpright: >-
  قد تشعر بأنك محاصر، لكن بعض الحدود يعيش في الفكر أساسًا؛ وحركة صغيرة واحدة قد تُظهر مساحة أكبر مما يبدو.
shortReversed: >-
  قد تكون القيود في طور الارتخاء؛ يمكنك ملاحظة قناعة لم تعد تمسك بك بالإحكام الذي كانت عليه.
meaningUpright: |-
  يُظهر ثمانية من السيوف شخصًا تحيط به النصال، عيناه مغطاتان ويداه مربوطتان برخاوة. وعند النظر عن قرب، تظهر فجوة في الدائرة، والقيود ليست محكمة كثيرًا. تتحدث هذه البطاقة عن تجربة الشعور بالحصار حين يكون جزء من الفخ مصنوعًا من الأفكار.
  قد تتعرف عليها في موقف يبدو فيه كل خيار مسدودًا، أو حين تواصل قول «لا أستطيع» قبل المحاولة، أو حين يشلّ الخوف من الخطأ حركتك تمامًا. القيود الحقيقية موجودة، وهذه البطاقة لا تتجاهلها. إنها تسأل ببساطة ما إذا كانت بعض الجدران قناعات لم تسائلها: أنه لا خيار لك، أو أن أحدًا لن يساعد، أو أن الوقت قد فات للتغيير.
  تدعوك هذه البطاقة إلى اختبار حدّ واحد بلطف. يمكنك أن تدوّن الأفكار التي تبقيك في مكانك وتسأل أيّها حقائق وأيّها مخاوف. وأحيانًا تكفي تسمية قناعة ما لإرخائها. ما الخطوة الصغيرة التي ستتخذها لو افترضت أن هناك مساحة أكبر قليلًا مما تظن؟
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس ثمانية من السيوف شعورًا بالتحرر. تنزلق العصابة عن العينين وتبدو الدائرة أقل انغلاقًا مما كانت. ربما تلاحظ خيارات لم تكن تراها من قبل، أو تشعر بالاستعداد للخروج من موقف علقت فيه.
  وقراءة أخرى هي جاذبية الأنماط القديمة: فما إن تبدأ في الحركة حتى تعود الشكوك المألوفة وتحاول جذبك إلى الدائرة من جديد. وهذا جزء شائع من التغيير، لا فشل.
  يمكنك أن تسأل عمّا ساعدك على كسب ولو قدر قليل من الحرية، وكيف تفعل المزيد منه. فالدعم من الآخرين، أو المعلومات الجديدة، أو مجرد التمرن، قد يبقي القيود رخوة. أيّ قناعة تشعر بالجاهزية لوضعها جانبًا، وماذا تود أن تضع مكانها؟
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس هذه البطاقة شعورًا بالعلوق: عجزًا عن قول ما تحتاج إليه، أو تقيّدًا بدور تجاوزته. وقد تُظهر أيضًا كيف تبقيك الافتراضات حول ما يظنه الآخرون صامتًا. يمكنك التحقق من أحد تلك الافتراضات مباشرة، بسؤال لطيف. فالناس غالبًا أكثر انفتاحًا على التغيير مما توحي به مخاوفنا.
  relationshipsReversed: >-
    في الوضع المعكوس، قد يشير ثمانية من السيوف إلى حرية جديدة في رابط ما: التعبير أخيرًا، أو وضع حدّ، أو رؤية ديناميكية مألوفة بعين جديدة. يمكنك أن تلاحظ أين لا تزال المخاوف القديمة تحاول إسكاتك. والتمرن على أفعال صدق صغيرة قد يساعد المنظور الجديد على أن يصبح جزءًا ثابتًا من طريقة تواصلك.
  workUpright: >-
    في العمل، قد تعكس هذه البطاقة شعورًا بأنك محصور بالتوقعات أو القواعد، أو بقناعة أنك تفتقر إلى المهارات اللازمة لتغيير وضعك. بعض الحدود قد يكون حقيقيًا. يمكنك أن تدوّن الخيارات التي صرفت النظر عنها وتنظر مجددًا في أحدها. والحديث مع مرشد أو صديق قد يكشف طرقًا لم تفكر فيها.
  workReversed: >-
    في الوضع المعكوس، قد توحي هذه البطاقة بالخروج من الرتابة: تجربة مقاربة جديدة، أو طلب مسؤوليات مختلفة، أو التخلي عن قصة قديمة حول ما تقدر عليه. قد تلاحظ ومضة من الشك في الذات وأنت تتحرك. ويمكنك التعامل معها بوصفها علامة نمو لا سببًا للتوقف.
  growthUpright: >-
    في النمو الشخصي، يدعوك ثمانية من السيوف إلى ملاحظة الصوت الداخلي الذي يقول إنك لا تستطيع. يمكنك أن تسأل بلطف أين تعلّم هذا الصوت قواعده. فمساءلة قناعة لا تعني إجبار نفسك على تخطي كل خوف؛ بل تعني منح نفسك الإذن بالبحث عن الفجوة في الدائرة.
  growthReversed: >-
    في الوضع المعكوس، قد تعكس هذه البطاقة ارتخاءً حقيقيًا للأفكار المقيِّدة للذات. يمكنك أن تحتفي بالتقدم الذي أحرزته، مهما كان صغيرًا، وتتمرن على النظرة الجديدة بانتظام كي تقوى. وحين تعود الشكوك القديمة، يمكنك ملاقاتها بالفضول لا بالاستسلام.
