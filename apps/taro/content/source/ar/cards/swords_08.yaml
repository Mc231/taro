imageryNote: >-
  في الصورة الأصلية، يقف شخص على أرض رخوة كالمستنقع داخل حلقة غير محكمة من النصال المغروسة في التراب. يغطي شريط رفيع عينيه، ويتدلى آخر فوق معصميه دون أن يُعقد. وخلفه تنفتح الحلقة، ويقود درب نحو تلال بعيدة. توحي الأشرطة بحدود يمكن إرخاؤها، وتشير الفجوة المفتوحة إلى خيارات لم تُرَ بعد.
