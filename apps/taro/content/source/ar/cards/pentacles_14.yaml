imageryNote: >-
  قد تُظهر الصورة شخصًا متوّجًا جالسًا على عرش منحوت بزخارف الثيران، تحيط به كروم العنب وحديقة مسوّرة، وعملة مستقرة بارتياح في إحدى يديه. قد يرمز الثور إلى التحمل والقوة الأرضية، والكروم إلى النضج والوفرة، والجدران إلى مجال محمي حسن الرعاية. وتوحي الجلسة المسترخية بسلطة متجذرة في الخبرة، فيما قد تعكس درجات الأخضر العميق والذهبي عطاءً صبورًا دائمًا.
