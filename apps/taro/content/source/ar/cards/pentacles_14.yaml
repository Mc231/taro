shortUpright: >-
  حضور ثابت وقادر متاح لك. يمكنك ملاحظة كيف تستخدم خبرتك ومواردك لصنع الاستقرار لنفسك وللآخرين.
shortReversed: >-
  ربما صار الأمان ثقلًا يصعب حمله. يمكنك أن تسأل ما الذي يعنيه النجاح لك أبعد من السيطرة أو المظاهر.
meaningUpright: |-
  يجلس ملك العملات محاطًا بالكروم وجدران متينة، مسترخيًا وآمنًا، وعملة مستقرة على ركبته. يرمز هذا الملك إلى النضج الكامل لمجموعة التراب: الإتقان العملي، والصبر، والقدرة على بناء شيء مستقر يمكن للآخرين الاعتماد عليه. والسلطة هنا تأتي من الخبرة لا من القوة.
  قد تتعرف على هذه الطاقة في شخص يدير بيتًا أو فريقًا بهدوء، ويتخذ قرارات مدروسة بشأن الوقت والموارد، أو يستخدم ما بناه لدعم من حوله. وقد تعكس أيضًا ثقتك المتنامية في التعامل الجيد مع المسؤوليات العملية.
  تدعوك هذه البطاقة إلى التفكير في علاقتك بالاستقرار والعطاء. ما الذي بنيته بجهد ثابت، وكيف تستخدمه؟ يمكنك أن تلاحظ أين يمكنك أن تجود بوقتك أو معرفتك أو دعمك، وأين تعني الرعاية الحسنة للموارد حماية ما لديك. فالأمان قد يكون شيئًا يُتقاسم، لا شيئًا يُحرس فقط.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس ملك العملات علاقة بالأمان صارت جامدة أو ثقيلة. قد تشتد السيطرة، فلا تترك الخطط مجالًا لآراء الآخرين، أو قد يُقاس النجاح في الغالب بالمظاهر والممتلكات. وقد يشير أيضًا إلى ضغط الشعور بالمسؤولية عن استقرار الجميع.
  تدور هذه القراءة حول صفة زادت عن حدها. فالموثوقية والقدرة أمران قيّمان؛ لكنه يصبح عبئًا حين لا يترك مساحة للراحة أو المرونة أو اختيارات الآخرين.
  يمكنك أن تسأل ما الذي يعنيه النجاح لك حقًا، أبعد من مظهر الأمور. أين يمكنك تقاسم المسؤولية أو إرخاء معيار ما؟ واستعادة الصلة بالقيم الكامنة وراء جهدك، كالرعاية والأمان والإحساس بالإسهام، قد تجعل الاستقرار داعمًا من جديد لا مقيِّدًا.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد تعكس هذه البطاقة رعاية موثوقة وسخية: شخصًا يوفر الاستقرار، ويفي بالالتزامات، ويشعر الآخرين بالأمان. ربما تكون هذا الحضور الثابت لشخص ما، أو تقدّره فيه. ومشاركة القرارات والتعبير عن الدفء إلى جانب الموثوقية قد يجعلان ذلك الأمان متبادلًا.
  relationshipsReversed: >-
    في الوضع المعكوس، قد توحي البطاقة بسيطرة لا تترك للآخرين إلا القليل من المساحة، أو بتركيز على العطاء العملي يطغى على الصلة العاطفية. يمكنك أن تسأل كيف يعيش شخص قريب دعمك، وما إذا كان يود صوتًا أكبر أو حنانًا أكثر في الرابط.
  workUpright: >-
    في العمل، قد يصف ملك العملات قيادة عملية وموثوقية. ربما يُوثق بك لإدارة الموارد، أو توجيه الآخرين، أو اتخاذ قرارات راسخة. يمكنك التفكير في كيفية استخدام خبرتك بسخاء، بإرشاد الآخرين وبناء بنى تدعم الناس إلى جانب النتائج.
  workReversed: >-
    هنا قد تعكس البطاقة عدم مرونة، أو إدارة مفرطة للتفاصيل، أو تقديم المكانة على العمل ذي المعنى. وقد تشير أيضًا إلى حمل قدر كبير من المسؤولية وحدك. يمكنك النظر في المواضع التي قد يصنع فيها التفويض، أو الإصغاء أكثر، أو إعادة تعريف النجاح طريقة عمل أصح وأكثر استدامة.
  growthUpright: >-
    في النمو الشخصي، تدعوك هذه البطاقة إلى إدراك النضج والكفاءة اللذين نمّيتهما. يمكنك التأمل فيما يعنيه الاستقرار لك وكيف صنعته. فالاعتراف بقدرتك على العطاء، لنفسك وللآخرين، قد يعمّق الثقة بالنفس.
  growthReversed: >-
    في الوضع المعكوس، قد تعكس البطاقة تعلقًا قويًا بالسيطرة أو بالعلامات الخارجية للإنجاز. يمكنك أن تستكشف ما الذي تخشى حدوثه لو أرخيت قبضتك. فإيجاد الأمان في قيمك وعلاقاتك، لا فيما تملكه أو تديره فقط، قد يجلب طمأنينة أكبر.
