imageryNote: >-
  تُظهر الصورة شخصًا متوّجًا يجلس فوق ماء متحرك على منصة من حجر عتيق، في إحدى يديه كأس وفي الأخرى صولجان قصير. يرتفع الماء من حوله وينخفض، لكن كتفيه تبقيان مسترخيتين ونظرته مستوية. ويوحي هذا التباين بالتمكن العاطفي، فيما تلمّح درجات الأزرق العميق المدفأة بلمسات ذهبية إلى الحكمة والسخاء.
