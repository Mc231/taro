meaningUpright: |-
  يُتخيَّل ملك الكؤوس شخصية ثابتة يحيط بها ماء متحرك، هادئًا بينما تتبدل التيارات. تمثل هذه البطاقة التمكن العاطفي في صورته الفاعلة: القدرة على الشعور بعمق مع الاستجابة بحكمة وإنصاف ولطف.
  قد تعكس لحظة يُطلب منك فيها أن تقود أو تتوسط أو تدعم الآخرين في موقف صعب. لا ينكر ملك الكؤوس المشاعر. بل يعترف بها ويختار كيف يتصرف، مُبقيًا القلب والعقل معًا في الحوار.
  في الحياة اليومية، قد يبدو ذلك حفاظًا على الهدوء في اجتماع متوتر، أو تقديم نصيحة مدروسة لصديق، أو اتخاذ قرار يوازن بين الرحمة والواقعية. وقد يشير أيضًا إلى نوع ناضج وسخي من الرعاية يحمي دون أن يتحكم.
  تدعوك هذه البطاقة إلى الثقة بأنك تستطيع ملاقاة التيارات القوية بثبات. يمكنك أن تسأل كيف قد تبدو استجابة هادئة ومهتمة في موقف يحرّك مشاعرك، وأيّ دعم قد يساعدك على تقديمها.
meaningReversed: |-
  حين تظهر البطاقة في وضعها المعكوس، قد يعكس ملك الكؤوس مشاعر مقيدة بإحكام زائد، أو مشاعر تفيض على نحو متفاوت. قد تلاحظ أنك تبدو هادئًا بينما تشعر بالاضطراب في الداخل، أو تتفاعل بقوة أكبر مما يستدعيه الموقف.
  وقد يشير أيضًا إلى استخدام الفهم العاطفي بطرق توجّه الآخرين بدلًا من أن تدعمهم، أو إلى أن تكون أنت من يُوجَّه. وملاحظة ذلك دون لوم قد تكون خطوة أولى نحو أنماط ألطف.
  تدعوك هذه البطاقة إلى إيجاد ثبات يشمل مشاعرك بدلًا من كبتها. ما الذي قد تتجنب الشعور به؟ يمكنك تجربة تسمية المشاعر على انفراد، أو التوقف قبل الرد، أو مناقشة الأمور مع شخص تثق به. فالتوازن قد ينمو من الاعتراف الصادق، لا من التحكم الكامل.
aspects:
  relationshipsUpright: >-
    في العلاقات، قد يعكس ملك الكؤوس رعاية ثابتة وناضجة وحضورًا هادئًا في اللحظات العاطفية. وقد يدعوك إلى الإصغاء بعمق والاستجابة بتأنٍّ لا بسرعة. يمكنك أن تلاحظ كيف تساعد الآخرين على الشعور بالأمان، وكيف تحب أن تُدعم في المقابل.
  relationshipsReversed: >-
    في الوضع المعكوس، قد تشير هذه البطاقة إلى مسافة عاطفية، أو أمزجة مفاجئة، أو صراع صامت على السيطرة في علاقة ما. يمكنك أن تسأل ما إذا كانت المشاعر تُتشارك بانفتاح أم تُدار خلف الكواليس. والتواصل الصادق الهادئ قد يساعد على استعادة الثقة والإحساس بالتوازن بينكما.
  workUpright: >-
    في العمل، قد تعكس هذه البطاقة قيادة دبلوماسية، أو إرشادًا، أو قدرة على إبقاء الفريق ثابتًا تحت الضغط. وقد تدعوك إلى إدخال الذكاء العاطفي في القرارات. فالموازنة بين التعاطف والحدود الواضحة قد تصنع مكان عمل يشعر فيه الناس بالرعاية والتوجيه معًا.
  workReversed: >-
    في الوضع المعكوس، قد تعكس البطاقة ضغطًا يُخفى حتى يفيض، أو قيادة تُبقي الناس في حالة عدم توازن. يمكنك التفكير في كيفية معالجة التوتر بانفتاح وإنصاف. وطلب الدعم أو تفويض بعض المهام قد يمنع الضغط من التراكم تحت السطح.
  growthUpright: >-
    في النمو الشخصي، يدعوك ملك الكؤوس إلى الجمع بين الشعور والعقل. يمكنك التمرن على ملاحظة شعور ما، وتسميته، ثم اختيار استجابة تناسب قيمك. ومع الوقت، قد يبني ذلك ثقة هادئة بقدرتك على الحفاظ على توازنك حين تعصف الأمور.
  growthReversed: >-
    في الوضع المعكوس، قد تطلب منك هذه البطاقة استكشاف طريقة تعاملك مع المشاعر القوية. قد تلاحظ أنماطًا من كتمان كل شيء أو إطلاقه كله. والممارسات اللطيفة، كالتوقف للتنفس أو الكتابة قبل الكلام، قد تساعدك على إيجاد أرضية وسطى تُحترم فيها المشاعر دون أن تستولي على كل شيء.
