imageryNote: >-
  Eine Gestalt sitzt auf einem hohen Sitz am Rand eines Aussichtspunkts, nach vorn gelehnt, einen blühenden Stab fest neben sich verankert, als wollte sie gleich aufstehen. Hinter ihr windet sich eine Straße zu fernen Hügeln im späten Sonnenlicht. Der blühende Stab deutet eine Vision an, die lebendig ist und wächst, der Aussichtspunkt einen weiten Blick auf das, was entstehen könnte, und die Vorwärtsneigung die Bereitschaft, Ideen in Handlung zu verwandeln. Glut oder kleine Flammenmotive können das Element Feuer tragen.
