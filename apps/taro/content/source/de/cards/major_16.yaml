imageryNote: >-
  Der Turm von Taro ist ein hoher, schmaler Steinturm auf einem felsigen Gipfel, dessen Spitze von einem plötzlichen Lichtstrahl aus stürmischem Himmel abgehoben wird. Funken oder kleine Flammen verstreuen sich wie Samen im Wind und deuten an, dass das Freigesetzte neue Anfänge in sich tragen kann. Die Szene ist als Moment der Erhellung gezeichnet, hell vor dunklen Wolken, und hält den Blick auf Aufräumen und Einsicht gerichtet, nicht auf Schaden für irgendjemanden.
