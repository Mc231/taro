imageryNote: >-
  Die Hohepriesterin von Taro sitzt an der Schwelle eines mondbeschienenen Torbogens, halb im Licht und halb im Schatten, ein geschlossenes Buch auf den Knien. Hinter der Gestalt bewegt sich ein Vorhang, als würde dahinter etwas warten. Eine Mondsichel, die sich in einem stillen Becken spiegelt, kann an Zyklen und Intuition erinnern, und tiefe Blautöne deuten Ruhe an der Oberfläche und Tiefe darunter an. Die stille, aufmerksame Ruhe der Gestalt bildet die Mitte des Bildes.
