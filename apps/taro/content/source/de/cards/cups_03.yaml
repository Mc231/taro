imageryNote: >-
  Das Bild zeigt drei Gestalten in einem lockeren Kreis, ihre Kelche erhoben, die sich in der Mitte treffen. Zu ihren Füßen kann eine Ernte aus Früchten, Blumen oder Ranken Fülle andeuten, die aus gemeinsamer Mühe wächst. Ihre unterschiedliche Kleidung, Haltung und Farbe kann für Freunde stehen, die eigenständig bleiben und doch zusammengehören. Bewegung in der Szene, wie ein Tanzschritt oder ein schwingender Saum, vermittelt leichte, ungezwungene Freude.
