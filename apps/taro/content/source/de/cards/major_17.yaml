imageryNote: >-
  Der Stern von Taro ist eine nächtliche Szene in einem Dachgarten, in der eine Gestalt junge Pflanzen aus einem Krug gießt, während ein heller Stern durch eine Wolkenlücke scheint. Regentonnen und ein kleiner Teich sammeln, was der Himmel zurückgibt. Nachtfalter, die eine Laterne umkreisen, können für Gedanken stehen, die zum Licht gezogen werden. Kühle Blau- und Silbertöne schaffen ein Gefühl von Ruhe, Offenheit und sanfter Erneuerung, nachdem ein Sturm vorübergezogen ist.
