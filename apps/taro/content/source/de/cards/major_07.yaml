  relationshipsReversed: >-
    Umgekehrt kann diese Karte auf zwei Menschen hinweisen, die in verschiedene Richtungen ziehen, oder darauf, dass eine Person lenkt, während sich die andere mitgezogen fühlt. Du könntest überlegen, ob du eine Beziehung auf ein Ziel zutreibst, bevor ihr beide bereit seid. Langsamer zu werden und euch auf das Ziel zu einigen, könnte die Anspannung lösen.
  workUpright: >-
    Bei der Arbeit oder in einem Projekt betont der Wagen Antrieb und gebündelte Mühe. Er kann eine Phase spiegeln, in der du ein Projekt über die Ziellinie bringst, dich auf gesunde Weise mit anderen misst oder ein Team gemeinsam in Bewegung hältst. Du könntest ein klares Ziel festlegen, deine Mittel sammeln und dir einen realistischen Zeitplan geben, den du selbst wählst.
  workReversed: >-
    Umgekehrt kann der Wagen ein Projekt spiegeln, das an Schwung verliert, oder das Gefühl, ohne klaren Plan zu hetzen. Er kann auch auf widersprüchliche Prioritäten verschiedener Menschen hinweisen. Du könntest einen Schritt zurücktreten, klären, wie Erfolg tatsächlich aussieht, und entscheiden, welche Aufgaben dich dorthin bringen und welche dich nur beschäftigt halten.
  growthUpright: >-
    Für dein persönliches Wachstum lädt diese Karte dich ein, Selbststeuerung zu üben. Zu wissen, was du willst, und deine verschiedenen Stimmungen und Beweggründe zusammenzuhalten, ist eine Fähigkeit. Du könntest ein bedeutsames Ziel wählen und bemerken, wie du dich auf Kurs hältst, und dabei jede kleine Wegstrecke feiern, die du zurücklegst.
  growthReversed: >-
