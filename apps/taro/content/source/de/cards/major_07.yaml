imageryNote: >-
  Der Wagen von Taro ist eine Gestalt, die einen kleinen, robusten Karren eine Küstenstraße entlang lenkt, gezogen von zwei Tieren mit gegensätzlichem Temperament, eines ruhig, eines unruhig. Die Gestalt hält die Zügel locker und steuert mit Aufmerksamkeit, nicht mit Kraft. Ein muschelförmiges Dach über dem Sitz kann auf das Sternzeichen Krebs anspielen und auf den Schutz, der sicheres Vorankommen ermöglicht, während die offene Straße und die fernen Hafenlichter ein selbst gewähltes Ziel andeuten, kein aufgezwungenes.
