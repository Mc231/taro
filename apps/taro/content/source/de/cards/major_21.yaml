  relationshipsReversed: >-
    Umgekehrt kann diese Karte auf etwas Ungeklärtes in einer Beziehung hinweisen, ein Gespräch, das nicht zu Ende geführt wurde, oder ein Kapitel, das nicht abgeschlossen ist. Du könntest überlegen, was euch beiden helfen würde, Frieden zu finden, ob das bedeutet, etwas auszusprechen, oder anzunehmen, dass es gesagt worden ist.
  workUpright: >-
    Bei der Arbeit oder in einem Projekt betont die Welt Abschluss und Anerkennung. Sie kann spiegeln, dass du eine bedeutende Arbeit fertigstellst, einen Meilenstein erreichst oder spürst, dass deine Rolle gut zu dir passt. Du könntest dir Zeit nehmen, anzuerkennen, was du und andere erreicht haben, bevor du mit dem Nächsten beginnst.
  workReversed: >-
    Umgekehrt kann die Welt ein Projekt spiegeln, das in der letzten Phase feststeckt, oder das Gefühl, die Ziellinie nicht ganz zu erreichen. Du könntest auflisten, was noch offen ist, und entscheiden, ob es wirklich getan werden muss oder losgelassen werden kann. Kleine, gezielte Mühe kann helfen, die Dinge sauber abzuschließen.
  growthUpright: >-
    Bevor du nach dem nächsten Ziel greifst, kann es helfen zu erkennen, wie weit du gekommen bist. Du könntest über die Lehren, Herausforderungen und Freuden eines kürzlichen Kapitels nachdenken und bemerken, wie sie sich zu einem volleren Bild von dir zusammenfügen. Integration ist eine stille Art von Erfolg.
