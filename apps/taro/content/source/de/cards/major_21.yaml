imageryNote: >-
  Die Welt von Taro ist eine Gestalt, die in einem großen ovalen Kranz aus Blättern und Blumen aller Jahreszeiten tanzt und sich frei in der Mitte eines Sternenhimmels bewegt. Rund um den Kranz markieren vier kleine Sinnbilder für Feuer, Wasser, Luft und Erde die Ränder der Szene und deuten Gleichgewicht und Ganzheit an. Ein Band, das aus der Hand der tanzenden Gestalt flattert, kehrt in einer Schleife zu seinem Anfang zurück und lädt dazu ein, ein Gefühl von Ankommen und einer Reise zu spüren, die sich rundet.
