imageryNote: >-
  Der Mond von Taro ist ein blasser Mond, halb verborgen von ziehenden Wolken, über einem Pfad durch hohes Schilf am Ufer. Der Pfad schimmert an manchen Stellen und verschwindet an anderen, sodass die reisende Gestalt langsam geht. Ein Reiher, der still im flachen Wasser steht, kann geduldige Aufmerksamkeit andeuten, während Wellen auf dem Wasser auf Gefühle hinweisen, die von unten aufsteigen. Silbriges Licht, weiche Schatten und verschwommene Ränder laden dazu ein, auf einer ungewissen Reise den eigenen Sinnen zu vertrauen.
