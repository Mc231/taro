imageryNote: >-
  Der Gehängte von Taro hängt an einem Knöchel kopfüber von einem kräftigen, lebendigen Ast, die Arme entspannt, das Gesicht ruhig, sogar neugierig. Aus diesem Blickwinkel sieht die Gestalt die Welt in einem Teich darunter gespiegelt, umgekehrt. Der Baum ist grün und voller Knospen und zeigt, dass die Pause Teil des Wachstums ist und nicht sein Ende. Wässrige Blautöne und lockere, fließende Kleidung erinnern an Hingabe, Träumen und den Blick unter die Oberfläche.
