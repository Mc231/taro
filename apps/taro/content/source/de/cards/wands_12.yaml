imageryNote: >-
  Eine Gestalt im vollen Galopp lehnt sich auf einem steigenden oder springenden Pferd nach vorn, den Stab hoch erhoben, der Umhang weht hinter ihr. Wüstenhügel oder offene Ebenen erstrecken sich vor ihr, und kleine Flammenformen oder Salamander können die Kleidung schmücken. Das springende Pferd steht für Leidenschaft und Antrieb, der erhobene Stab für Absicht, die in Handlung getragen wird, und die weite Landschaft für ein Abenteuer, das sich noch entfaltet. Die Vorwärtsneigung deutet Mut und Hast zugleich an.
