  relationshipsReversed: >-
    Umgekehrt kann diese Karte auf eine Spannung hinweisen zwischen dem, was von einer Beziehung erwartet wird, und dem, was sich für die Menschen darin wirklich stimmig anfühlt. Du könntest überlegen, ob du äußeren Normen folgst, die nicht zu deiner Situation passen. Ein ehrliches Gespräch darüber, welche Art von Verbindung ihr beide wollt, kann Raum für euren eigenen Weg schaffen.
  workUpright: >-
    Bei der Arbeit oder im Studium betont der Hierophant, ein Handwerk richtig zu lernen, bewährte Methoden zu respektieren und eine Mentorin oder einen Mentor zu finden. Es könnte ein guter Zeitpunkt sein, einen Kurs zu belegen, eine Qualifikation zu erwerben oder eine erfahrene Person zu bitten, dich einzuarbeiten. Teil eines Teams oder einer Institution zu sein, kann Unterstützung und Struktur bieten.
  workReversed: >-
    Umgekehrt kann der Hierophant Frust darüber spiegeln, wie die Dinge schon immer gemacht wurden, oder das Gefühl, dass der offizielle Weg nicht zu dir passt. Du könntest dich fragen, welche Regeln Qualität sichern und welche sich einfach gegen Veränderung sperren. Einen besseren Ansatz ruhig und mit Belegen vorzuschlagen, kann wirksamer sein, als das System zu umgehen.
  growthUpright: >-
    Für dein persönliches Wachstum lädt diese Karte dich ein, von denen zu lernen, die vor dir kamen. Bücher, Lehrende, Gemeinschaften und Praktiken können Rahmen bieten, die deine Entwicklung unterstützen. Du könntest eine Disziplin oder Tradition wählen, die du mit Geduld studierst, und wahrnehmen, was sie bietet, bevor du entscheidest, was du daraus machst.
  growthReversed: >-
    Umgekehrt kann der Hierophant ein Anstoß sein, deine eigenen Leitlinien zu schreiben. Er kann einen Moment spiegeln, in dem du einer Überzeugung oder einer alten Rolle entwächst. Du könntest die Werte, die du heute wirklich hast, in deinen eigenen Worten aufschreiben und bemerken, wo sie sich mit dem decken, was man dir beigebracht hat, und wo sie sanft eigene Wege gehen.
