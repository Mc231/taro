imageryNote: >-
  Der Hierophant von Taro ist eine lehrende Gestalt in einem stillen Innenhof, sitzend auf einer abgenutzten Steinbank unter einem alten Baum, umgeben von einem kleinen Kreis Zuhörender unterschiedlichen Alters. Am Gürtel hängt ein schwerer Schlüssel, ein Symbol für Verständnis, das durch Studium und Übung weitergegeben wird. Bücher, die auf der Bank gestapelt sind, und eine Glocke im Bogen darüber deuten gemeinsame Rituale und gemeinsames Lernen an. Ein offenes Tor auf der anderen Seite des Hofes lässt ahnen, dass jede Lehre an einen neuen Ort führen kann.
