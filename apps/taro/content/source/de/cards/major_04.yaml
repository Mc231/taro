  relationshipsReversed: >-
    Umgekehrt kann diese Karte fragen, ob in einer Beziehung eine Person die meisten Bedingungen festlegt. Vielleicht bemerkst du Muster von Kontrolle, Sturheit oder stillschweigend aufgestellten Regeln, auf welcher Seite auch immer. Ein ruhiges Gespräch darüber, was jede Seite braucht, um sich respektiert zu fühlen, könnte helfen, das Gleichgewicht wiederherzustellen, ohne daraus einen Wettkampf zu machen.
  workUpright: >-
    Bei der Arbeit oder in einem Projekt zeigt der Herrscher Organisation und Verantwortung. Es könnte ein guter Moment sein, Prioritäten zu setzen, Rollen festzulegen oder ein System aufzubauen, das die tägliche Arbeit erleichtert. Führung bedeutet hier Beständigkeit, Fairness und zu deinem Wort zu stehen, ob du einen offiziellen Titel hast oder nicht.
  workReversed: >-
    Umgekehrt kann der Herrscher einen Arbeitsplatz spiegeln, der übermäßig starr wirkt, oder deine eigene Neigung, unter Stress alles bis ins Kleinste zu kontrollieren. Er kann auch auf Frust über Autoritäten hinweisen. Du könntest dich fragen, welche Regeln der Arbeit wirklich dienen und wo du auf konstruktive Weise mehr Flexibilität anbieten oder erbitten könntest.
  growthUpright: >-
    Eine stille Form des Wachstums besteht darin, für dich selbst eine beständige Stütze zu werden. Routinen, Selbstdisziplin und Versprechen, die du dir selbst hältst, können eine leise Zuversicht aufbauen. Du könntest eine Gewohnheit wählen, die das Leben unterstützt, das du dir wünschst, und ihr eine einfache, verlässliche Struktur geben.
  growthReversed: >-
    Umgekehrt kann der Herrscher fragen, ob du zu streng mit dir bist oder nicht streng genug. Selbstdisziplin, die hart wird, kann Energie rauben, während fehlende Struktur dich haltlos zurücklassen kann. Du könntest nach dem Mittelweg suchen: einem Rahmen, der fest genug ist, um dich zu halten, und sanft genug, um darin zu leben.
