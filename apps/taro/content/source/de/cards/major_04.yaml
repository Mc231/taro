imageryNote: >-
  Der Herrscher von Taro sitzt an einem massiven Steintisch, der in einen Hang gebaut ist, darauf sorgfältig geordnet eine Karte, ein Messstab und eine Lampe. Trockenmauern, die sich hinter ihm über die Felder ziehen, zeigen Grenzen, die von Hand gebaut wurden, Stein für Stein. Ein Widder, der in der Nähe grast, kann auf das Sternzeichen Widder und den Drang zum Anfangen anspielen. Warme Rottöne deuten Lebenskraft an, und ein kleines offenes Tor in einer Mauer lässt ahnen, dass feste Strukturen trotzdem Menschen hindurchlassen können.
