  relationshipsReversed: >-
    Umgekehrt kann die Herrscherin fragen, ob die Fürsorge in einer Beziehung einseitig geworden ist oder ob Sorge in das Lenken der Entscheidungen eines anderen Menschen gerutscht ist. Du könntest überlegen, wo du einen Schritt zurücktreten und der anderen Person mehr vertrauen könntest und wo du offener um die Fürsorge bitten könntest, die du selbst brauchst.
  workUpright: >-
