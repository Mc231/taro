  growthUpright: >-
    Für dein persönliches Wachstum lädt die Herrscherin dich ein, es zu genießen, in deinem Körper und in der greifbaren Welt zu sein. Ruhe, gutes Essen, Zeit in der Natur und einfache Freuden sind hier kein Luxus; sie sind Wege, neue Kraft zu schöpfen. Vielleicht bemerkst du, was dir hilft, dich geerdet und großzügig zu fühlen, und schaffst dafür etwas mehr Raum.
  growthReversed: >-
    Umgekehrt kann die Herrscherin eine sanfte Erinnerung sein, dass du dieselbe Geduld verdienst, die du anderen schenkst. Sie kann spiegeln, dass du den Kontakt zu deinen eigenen Bedürfnissen verloren hast oder an deinem kreativen Wert zweifelst. Du könntest mit einem kleinen, freundlichen Ritual beginnen, das nur dir gehört, und sehen, wie es deine Woche verändert.
