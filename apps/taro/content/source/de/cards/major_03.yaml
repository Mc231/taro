imageryNote: >-
  Die Herrscherin von Taro ruht im Spätsommer in einem Küchengarten, umgeben von reifendem Gemüse, einem Brot, das auf einem Fenstersims abkühlt, und einem vorbeifließenden Bach. Weiche gewebte Stoffe und ein Korb mit frisch gepflücktem Obst deuten Behaglichkeit und die Freude der Sinne an, während Bienen zwischen den Blüten auf Wachstum durch viele kleine Gesten der Fürsorge hinweisen. Die Stimmung ist warm und gelassen und lädt dazu ein, die Fülle wahrzunehmen, die schon da ist.
