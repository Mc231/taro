  relationshipsReversed: >-
    Umgekehrt fühlt sich der Funke zwischen dir und einem nahen Menschen vielleicht gedämpft an, durch Routine, Müdigkeit oder unausgesprochenes Zögern. Das heißt nicht, dass die Wärme verschwunden ist; sie wartet vielleicht nur auf eine Gelegenheit. Du könntest überlegen, was früher Gespräche zwischen euch entfacht hat und ob eine kleine Geste der Neugier etwas von dieser Lebendigkeit zurückholen könnte.
  workUpright: >-
    Bei der Arbeit oder in einem kreativen Projekt kann das Ass der Stäbe auf eine Idee mit echter Anziehungskraft hinweisen: einen neuen Ansatz, ein Nebenprojekt, einen Vorschlag, zu dem du immer wieder zurückkehrst. Du könntest ihr eine erste greifbare Form geben, etwa eine grobe Gliederung, einen Prototyp oder einen kurzen Pitch vor jemandem, dem du vertraust, damit sie sich draußen bewähren kann und nicht nur in deinem Kopf.
  workReversed: >-
    Umgekehrt flackert die Motivation vielleicht. Möglicherweise wartet eine Idee auf Freigabe, oder zu viele Anfänge konkurrieren um deine Zeit. Das könnte ein Moment sein, einen Faden auszuwählen und die anderen vorerst beiseitezulegen. Kleiner, sichtbarer Fortschritt bei einer einzigen Idee kann oft mehr Energie neu entfachen, als mehrere gleichzeitig zu planen.
