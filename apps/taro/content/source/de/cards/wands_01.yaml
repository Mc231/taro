imageryNote: >-
  Ein einzelner lebendiger Stab ragt ins Bild, frisch geschnitten und doch mit grünen Trieben, als könne das Holz nicht aufhören zu wachsen. An seiner Spitze sammelt sich eine kleine Flamme oder ein Glühen. Der Zweig steht für rohe schöpferische Kraft, die noch lebendig und ungeformt ist, und die neuen Blätter deuten an, dass Inspiration wächst, wenn sie gepflegt wird. Warme Rot- und Goldtöne können das Element Feuer tragen, mit offenem Himmel dahinter als Hinweis auf Raum, der noch erkundet werden will.
