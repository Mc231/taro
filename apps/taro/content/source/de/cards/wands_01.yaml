  growthReversed: >-
    Umgekehrt wartest du vielleicht darauf, dich bereit zu fühlen, bevor du beginnst, oder bist streng mit dir, weil du dich nicht inspiriert fühlst. Energie bewegt sich oft in Jahreszeiten. Du könntest diese Zeit als stilles Sammeln betrachten: ruhen, lesen, wahrnehmen und ein neues Interesse in seinem eigenen Tempo Gestalt annehmen lassen.
