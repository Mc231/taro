imageryNote: >-
  Die Kraft von Taro ist eine ruhige Gestalt, die auf einer sonnigen Wiese neben einem großen Löwen kniet, eine Hand in seiner Mähne, während sich das Tier entspannt und vertrauensvoll an sie lehnt. Es gibt keine Seile oder Ketten; die Verbindung zeigt sich durch Nähe und Leichtigkeit. Wildblumen, die um beide herum wachsen, deuten an, dass Geduld sanfteren Dingen Raum zum Gedeihen gibt. Warmes goldenes Licht hält die Stimmung friedlich und zeigt Kraft und Sanftheit Seite an Seite.
