  relationshipsReversed: >-
    Umgekehrt kann diese Karte auf schnell gereizte Stimmung hinweisen oder darauf, dass jemand seine Gefühle hinunterschluckt, um Konflikte zu vermeiden. Du könntest überlegen, ob du zu hart mit dir selbst oder mit einem nahen Menschen bist. Freundlich das Wort zu ergreifen, bevor sich Frust aufstaut, kann die Verbindung und dein eigenes Gefühl von Stabilität schützen.
  workUpright: >-
    Bei der Arbeit oder in einem Projekt betont die Kraft Beharrlichkeit und emotionale Reife. Sie kann spiegeln, dass du eine anspruchsvolle Aufgabe oder einen anspruchsvollen Menschen mit Geduld und Anmut meisterst oder durch Ermutigung führst, nicht durch Druck. Du könntest darauf vertrauen, dass beständige, gleichmäßige Mühe zählt, auch wenn niemand zusieht.
  workReversed: >-
    Umgekehrt kann die Kraft spiegeln, dass dich Druck zermürbt oder dass du an deiner Fähigkeit zweifelst, eine Herausforderung zu bewältigen. Sie kann auch darauf hinweisen, dass du unter Stress scharf reagierst. Du könntest dich fragen, welche Unterstützung oder Ruhe dir helfen würde, wieder Halt zu finden, und wie du ein Tempo wählst, das du halten kannst.
  growthUpright: >-
    Die Kraft deutet an, dich mit deinem inneren Löwen anzufreunden, ohne ihn einzusperren: mit den starken Gefühlen, Wünschen und Instinkten, die dich ausmachen. Statt gegen sie zu kämpfen, könntest du neugierig werden, was sie brauchen. Selbstmitgefühl ist hier keine Schwäche; es ist eine Übung, die Mut nachhaltiger macht.
  growthReversed: >-
    Umgekehrt kann die Kraft daran erinnern, dass Zuversicht sinken und wiederkommen kann. Sie kann eine Phase von Selbstzweifeln oder harter innerer Kritik spiegeln. Du könntest eine kurze Liste von Momenten führen, in denen du gut zurechtgekommen bist, und sie an schweren Tagen lesen, als Beleg für die Stabilität, die du schon hast.
