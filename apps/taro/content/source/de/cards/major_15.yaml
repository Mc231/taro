imageryNote: >-
  Der Teufel von Taro ist eine schattenhafte, gehörnte Gestalt, die über zwei kleineren Gestalten thront, die mit lockeren, durchhängenden Ketten an ihren Sitz gebunden sind. Die Ketten liegen deutlich sichtbar locker um ihre Handgelenke und laden dazu ein zu bemerken, dass sie sie abstreifen könnten. Gedämpftes Fackellicht und tiefe Erdtöne schaffen eine schwere Stimmung, während ein schwacher Lichtspalt einer Tür am Rand der Szene andeutet, dass sich ein anderer Weg finden lässt.
