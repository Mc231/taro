imageryNote: >-
  Der Magier von Taro steht im Morgengrauen an einem Marktstand an einer Wegkreuzung und ordnet vier einfache Gegenstände für die vier Farben: einen grünen Zweig, einen Tonbecher, ein Brotmesser und eine einzelne Münze. Eine Hand greift zum Stand, die andere weist zum heller werdenden Himmel und verbindet Idee und Handlung. Lichtfäden zwischen den Gegenständen deuten an, wie Aufmerksamkeit einzelne Werkzeuge zu einem Zweck verbindet, und ein unfertiges Brot lässt ahnen, dass das Schaffen gerade erst begonnen hat.
