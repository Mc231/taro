imageryNote: >-
  Acht Stäbe ziehen diagonal über einen weiten Himmel, parallel und im Flug, über einer sanften Landschaft mit einem Fluss oder einer Straße darunter. Es gibt keine Menschen in der Szene, nur Bewegung. Der gemeinsame Winkel deutet Energie an, die in eine Richtung ausgerichtet ist, der offene Himmel einen freien Weg und der Fluss darunter den stetigen Fluss der Ereignisse. Das Fehlen von Gestalten lädt dazu ein, die Bewegung zu spüren, statt der Geschichte eines anderen zuzusehen.
