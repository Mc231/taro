imageryNote: >-
  Die Gerechtigkeit von Taro ist eine gefasste, aufrechte Gestalt, die eine ausgeglichene Waage auf Herzhöhe hält und eine aufrechte Klinge, die zum Himmel zeigt. Die Gestalt blickt direkt zur betrachtenden Person, was Ehrlichkeit ohne Verborgenes andeutet. Zwei schlichte Säulen und ein einfacher Vorhang dahinter halten die Szene aufgeräumt, als schafften sie Raum für sorgfältiges Nachdenken. Kühle Luftblautöne und ein einzelner warmer Akzent können das Zusammentreffen von Vernunft und Gewissen spiegeln.
