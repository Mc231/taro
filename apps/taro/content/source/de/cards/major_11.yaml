shortUpright: >-
  Ein Moment, um ehrlich abzuwägen und so zu handeln, dass du es später gern erklärst.
shortReversed: >-
  Etwas fühlt sich vielleicht unausgewogen an. Diese Karte lädt dich ein, es klar anzusehen, auch deinen eigenen Anteil.
meaningUpright: |-
  Die Gerechtigkeit hält in einer Hand eine Waage und in der anderen ein Schwert. Die Waage steht für sorgfältiges Abwägen, das Schwert für die Klarheit, danach zu handeln. Diese Karte handelt von Fairness, Ehrlichkeit und davon, Verantwortung für deine Entscheidungen zu übernehmen, im Wissen, dass Handlungen Folgen haben und dass du sie mit Sorgfalt wählen kannst.
  Im Alltag kann diese Karte eine Entscheidung spiegeln, die einen klaren Kopf braucht, etwa Aufgaben fair zu verteilen, ehrliches Feedback zu geben oder einen Fehler zuzugeben und wiedergutzumachen. Sie kann auf Momente hinweisen, in denen du eine Situation von allen Seiten betrachten sollst, bevor du reagierst, und in denen du zu dir selbst so fair sein darfst, wie du es zu anderen sein willst.
  Diese Karte lädt dich ein zu überlegen, wie eine ausgewogene Antwort aussähe. Du könntest dich fragen, welche Fakten zählen, was jede beteiligte Person braucht und wofür du Verantwortung übernehmen kannst. Die Gerechtigkeit sagt nicht voraus, wie eine formelle Angelegenheit ausgeht. Sie betont Integrität: im Einklang mit dem zu handeln, was du für richtig hältst, und anzunehmen, was folgt, mit ruhigem Sinn.
meaningReversed: |-
  Umgekehrt kann die Gerechtigkeit das Gefühl spiegeln, dass etwas unfair ist oder dass die Waage in einer Situation gekippt ist. Vielleicht trägst du mehr als deinen Anteil, oder du bemerkst die Versuchung, deinen eigenen Anteil an einer Schwierigkeit nicht anzusehen.
  Die Karte kann auch darauf hinweisen, dass du dich zu hart beurteilst und jede Entscheidung an einem unmöglichen Maßstab misst. Verantwortung ist nützlich; ständige Selbstkritik ist etwas anderes.
  Vielleicht möchtest du die Situation so neutral wie möglich aufschreiben, als würdest du sie einem fairen Freund oder einer fairen Freundin erklären. Was gehört zu dir, und was nicht? Nach Fairness zu suchen, kann bedeuten, das Wort zu ergreifen, etwas wiedergutzumachen oder einfach ein Urteil loszulassen, das schwer zu tragen geworden ist.
aspects:
  relationshipsUpright: >-
    In Beziehungen kann die Gerechtigkeit Ausgewogenheit und gegenseitigen Respekt spiegeln: Beide geben und nehmen auf eine Weise, die sich fair anfühlt. Sie kann dich einladen, ehrlich hinzuschauen, wie Verantwortung und Fürsorge verteilt sind. Klare, freundliche Gespräche über Erwartungen können Vertrauen stärken und stillem Groll vorbeugen.
  relationshipsReversed: >-
    Umgekehrt kann diese Karte auf ein Ungleichgewicht hinweisen, etwa wenn eine Person mehr von der emotionalen oder praktischen Arbeit trägt oder in einem Konflikt die Schuld einseitig verteilt scheint. Du könntest überlegen, wie Fairness aus beiden Blickwinkeln aussähe und ob eine Entschuldigung oder eine klarere Absprache das Gleichgewicht wiederherstellen könnte.
  workUpright: >-
    Bei der Arbeit oder in einem Projekt betont die Gerechtigkeit Integrität, faire Abläufe und sorgfältige Entscheidungen. Sie kann spiegeln, dass du gegenseitige Erwartungen überprüfst, ausgewogenes Feedback gibst oder Möglichkeiten nach ihren Vorzügen abwägst. Du könntest dich fragen, welche Entscheidung du allen Betroffenen offen erklären könntest, ohne dich unwohl zu fühlen.
  workReversed: >-
    Umgekehrt kann die Gerechtigkeit Frust über unfaire Behandlung oder unklare Regeln spiegeln. Sie kann auch darauf hinweisen, dass unter Druck Abkürzungen genommen werden. Du könntest die Fakten ruhig festhalten, dir bei Bedarf passende Unterstützung suchen und prüfen, ob dein eigenes Handeln dem Maßstab entspricht, den du dir von anderen wünschst.
  growthUpright: >-
    Für dein persönliches Wachstum lädt diese Karte dich ein, nach deinen Werten zu leben und Verantwortung für deine Entscheidungen zu übernehmen. Ohne Härte über die Wirkung deines Handelns nachzudenken, kann dir helfen zu wachsen. Du könntest dir eine kürzlich getroffene Entscheidung ansehen und fragen, was du beibehalten und was du nächstes Mal anders machen würdest.
  growthReversed: >-
    Umgekehrt kann die Gerechtigkeit fragen, ob du an dich einen viel strengeren Maßstab anlegst als an andere. Sie kann Schuldgefühle spiegeln, die bleiben, obwohl die Lektion längst gelernt ist. Du könntest eine faire Selbsteinschätzung üben: benennen, was schiefgelaufen ist, und auch, was gut gelaufen ist.
