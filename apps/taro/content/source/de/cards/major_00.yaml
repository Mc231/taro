imageryNote: >-
  Der Narr von Taro steht am Rand einer Anhöhe, vor sich den offenen Himmel, mitten im Schritt, und trägt nur ein kleines Bündel. Ein kleines Tier an seinen Fersen kann für Instinkt stehen, verspielt oder warnend. Eine einzelne weiße Blume kann Unschuld und Offenheit andeuten, während der weite Horizont und das Morgenlicht von Möglichkeiten erzählen. Das nach oben gewandte Gesicht der Figur lädt dazu ein zu fragen, wohin sie blickt und was sie bewusst nicht mitnimmt.
