  Im eigenen Bild steht eine Gestalt auf weichem, sumpfigem Boden in einem lockeren Ring aus Klingen, die in die Erde gesteckt sind. Ein dünnes Band bedeckt die Augen, ein anderes liegt über den Handgelenken, ohne verknotet zu sein. Hinter der Gestalt ist der Ring offen, und ein Pfad führt zu fernen Hügeln. Die Bänder deuten Grenzen an, die sich lockern lassen, und die offene Lücke weist auf Möglichkeiten hin, die noch nicht gesehen wurden.
