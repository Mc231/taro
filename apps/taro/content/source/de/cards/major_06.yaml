imageryNote: >-
  Die Liebenden von Taro sind zwei Gestalten auf beiden Seiten eines schmalen Bachs, die sich über das Wasser hinweg die Hände reichen, so gezeichnet, dass sich jede und jeder in beiden Gestalten wiedererkennen kann. Über ihnen kreisen zwei Vögel im selben hellen Himmel. Auf dem einen Ufer wächst ein Obstbaum, auf dem anderen eine blühende Ranke, zwei verschiedene Gaben, die sich in der Mitte treffen. Der Bach deutet die Wahl und die Mühe an, die echte Verbindung von beiden verlangt.
