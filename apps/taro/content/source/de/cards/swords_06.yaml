imageryNote: >-
  Im eigenen Bild gleitet ein kleines Boot von gekräuseltem Wasser auf ein stilles, nebliges Ufer zu. Sechs Klingen stehen aufrecht im Boot wie eine stille Fracht, und eine sitzende Gestalt blickt nach vorn. Eine lange Stange schiebt das Boot stetig durch das flache Wasser. Das sich wandelnde Wasser zeigt einen Übergang von Aufruhr zu Ruhe, die Klingen deuten mitgenommene Lehren an, und die Stange weist auf geduldige Bewegung hin, Schritt für Schritt.
