imageryNote: >-
  Eine Gestalt steht in der Abenddämmerung in einem Kreis von Stäben, die in den Boden getrieben sind, stützt sich auf einen davon und blickt mit wachen Augen hinaus. Neben ihr brennt ein kleines Lagerfeuer niedrig. Der Kreis der Stäbe deutet die Schutzmauern an, die durch Erfahrung gebaut wurden, das niedrige Feuer die Energie, die nach langer Mühe noch am Leben gehalten wird, und das schwindende Licht einen Tag, der sich dem Ende neigt. Die wachsame Haltung trägt zugleich Müdigkeit und die Beharrlichkeit, die weitergeht.
