imageryNote: >-
  Die Mäßigkeit von Taro ist eine geflügelte Gestalt am Rand eines langsamen Flusses, die sorgfältig Flüssigkeit zwischen zwei verschiedenen Gefäßen hin- und hergießt, eines aus Ton, eines aus Glas. Der Strahl zwischen ihnen beschreibt einen sanften Bogen, als würde das Gleichgewicht gerade in diesem Moment gefunden. Trittsteine durch den Fluss deuten einen Mittelweg von einem Ufer zum anderen an, und weiche Farben des Sonnenaufgangs über fernen Hügeln halten die Stimmung ruhig und hoffnungsvoll.
