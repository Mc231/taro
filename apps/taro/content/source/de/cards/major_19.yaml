  relationshipsReversed: >-
    Umgekehrt kann diese Karte auf eine Beziehung hinweisen, die etwas von ihrer Leichtigkeit verloren hat, vielleicht unter Stress oder Routine. Du könntest überlegen, gemeinsam etwas Einfaches und Lustiges zu planen, oder darauf achten, ob jemand hinter einer fröhlichen Fassade verbirgt, wie es ihm wirklich geht. Leichtigkeit kann durch kleine gemeinsame Momente zurückkehren.
  workUpright: >-
    Bei der Arbeit oder in einem Projekt betont die Sonne Klarheit, Sichtbarkeit und Begeisterung. Sie kann einen Moment spiegeln, in dem deine Mühe anerkannt wird oder in dem Arbeit Energie gibt, statt sie zu rauben. Du könntest deine Ideen mit Zuversicht teilen und dir erlauben, den Fortschritt unterwegs zu genießen.
  workReversed: >-
    Umgekehrt kann die Sonne spiegeln, dass du dich übersehen fühlst oder Mühe hast, Begeisterung für deine Arbeit zu finden. Sie kann auch auf zu viel Aufmerksamkeit hinweisen, etwa zu viel Leistungsdruck. Du könntest dich fragen, welche kleine Veränderung mehr Energie und Wärme in deine Arbeitstage bringen würde.
  growthUpright: >-
    Für dein persönliches Wachstum lädt diese Karte dich ein, wieder mit deiner natürlichen Begeisterung und Neugier in Kontakt zu kommen. Du könntest etwas wieder aufgreifen, das du als Kind geliebt hast, oder einfach aus Spaß etwas Neues ausprobieren. Selbstvertrauen kann ebenso aus Freude wachsen wie aus Leistung.
  growthReversed: >-
    Umgekehrt kann die Sonne fragen, ob du zu lange zu hart mit dir oder zu ernst warst. Sie kann das Bedürfnis nach Spiel, Ruhe und Leichtigkeit spiegeln. Du könntest dir diese Woche eine kleine fröhliche Aktivität vornehmen, ohne ein anderes Ziel, als sie zu genießen.
