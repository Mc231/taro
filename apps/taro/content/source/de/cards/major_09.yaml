imageryNote: >-
  Der Eremit von Taro ist eine Gestalt im Umhang auf einem hohen, verschneiten Grat in der Abenddämmerung. Sie hält eine einfache Laterne, die nur die nächsten paar Schritte des Pfades erhellt. Ein vom Gebrauch glatt gewordener Wanderstab deutet Halt an, der aus Erfahrung gewachsen ist. Fußspuren im Schnee zeigen, wie weit die Gestalt schon gekommen ist. Kühle Blau- und Grautöne erzählen von Alleinsein und klarer Luft, während das warme Leuchten der Laterne zeigt, dass Einsicht auch durch den dunkelsten Abschnitt des Weges getragen werden kann.
