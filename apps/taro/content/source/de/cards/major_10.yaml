  relationshipsReversed: >-
    Umgekehrt kann diese Karte auf vertraute Konflikte hinweisen, die immer wiederkehren, oder auf Widerstand dagegen, dass eine Beziehung ihre Form ändert. Du könntest überlegen, welches Muster du und ein naher Mensch gern wiederholt und was jede Seite anders versuchen könnte. Wandel muss keinen Verlust bedeuten; er kann Wachstum bedeuten.
  workUpright: >-
    Bei der Arbeit oder in einem Projekt betont das Rad sich wandelnde Umstände und neue Möglichkeiten. Es kann eine Planänderung spiegeln, ein neues Team oder ein Projekt, das plötzlich vorankommt. Du könntest aufmerksam für Gelegenheiten bleiben und dich daran erinnern, dass jede Phase, ob voll oder ruhig, etwas zu bieten hat.
  workReversed: >-
