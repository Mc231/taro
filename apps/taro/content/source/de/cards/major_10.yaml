  growthUpright: >-
    Dein Leben als Folge von Zyklen zu sehen, nicht als eine gerade Linie, kann befreiend sein. Deine eigenen Rhythmen wahrzunehmen, etwa wann du voller Energie bist und wann du Ruhe brauchst, kann dir helfen, mit ihnen zu planen, nicht gegen sie. Du könntest das letzte Jahr skizzieren und seine Wendepunkte bemerken.
