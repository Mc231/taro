imageryNote: >-
  Das Rad des Schicksals von Taro ist ein großes, sich drehendes Rad vor einem Himmel, der an einem Rand von Morgendämmerung und am anderen von Nacht erfüllt ist und so jede Phase zugleich zeigt. Kleine Gestalten und Wesen fahren auf seinem Rand mit, manche steigend, manche sinkend, keine still. Symbole der vier Jahreszeiten in den Ecken können die Idee natürlicher Zyklen einrahmen. In der Nabe deutet eine ruhige, unbewegte Mitte die beständige Perspektive an, die sich finden lässt, während sich alles dreht.
