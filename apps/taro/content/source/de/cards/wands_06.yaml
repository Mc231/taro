imageryNote: >-
  Eine Gestalt reitet auf einem ruhigen Pferd durch eine kleine Menge und hält einen Stab, gekrönt von einem Blätterkranz. Weitere erhobene Stäbe säumen den Weg wie eine Ehrenwache. Der Kranz steht für Anerkennung, die durch Mühe verdient wurde, das ruhige Pferd für Selbstvertrauen, das geübt und nicht überstürzt ist, und die umstehenden Gestalten für die Gemeinschaft, die den Erfolg teilt und mitträgt.
