imageryNote: >-
  Das Gericht von Taro ist eine weite Morgenlandschaft nach einem langen Winter, in der eine klare Glocke von einem Hügel läutet und Menschen aus ihren Häusern ins erste Licht treten, sich strecken und aufblicken. Schmelzender Schnee gibt grüne Triebe darunter frei. Ein offenes Fenster, dessen Vorhänge nach außen wehen, deutet einen inneren Ruf an, dem gefolgt wird. Ferne Berge lassen die Perspektive ahnen, die ehrliche Rückschau bringt, und blasse Morgenfarben sprechen von Erneuerung.
