  relationshipsReversed: >-
    Umgekehrt kann diese Karte auf anhaltende Schuldzuweisungen oder Urteile in einer Beziehung hinweisen, auf einer Seite oder auf beiden. Du könntest überlegen, ob das Festhalten an alten Verletzungen dich noch schützt oder dich festhält. Ein offenes, ruhiges Gespräch könnte beiden helfen, die Dinge fairer zu sehen.
  workUpright: >-
    Bei der Arbeit oder in einem Projekt betont das Gericht ein Gefühl von Berufung. Es kann spiegeln, dass du erkennst, welche Art von Arbeit sich sinnvoll anfühlt, oder dass du frühere Projekte durchgehst, um zu entscheiden, was als Nächstes kommt. Du könntest darauf hören, was dich begeistert, und dich fragen, wie deine Fähigkeiten dieser Richtung dienen könnten.
  workReversed: >-
    Umgekehrt kann das Gericht spiegeln, dass dich die Angst vor Kritik zurückhält oder dass du das Gefühl überhörst, dass es Zeit für eine Veränderung ist. Es kann auch darauf hinweisen, dass du deine bisherigen Leistungen zu kritisch siehst. Du könntest auflisten, was du gelernt hast und wie es deinen nächsten Schritt leiten könnte.
  growthUpright: >-
    Ein nachdenklicher Rückblick auf deinen bisherigen Weg kann selbst ein Wendepunkt sein. Du könntest auf eine bedeutsame Zeit zurückschauen und bemerken, wie du gewachsen bist und was du losgelassen hast. Diese Perspektive kann dir helfen, einem neuen Ruf mit Zuversicht und Klarheit zu folgen.
  growthReversed: >-
    Umgekehrt kann das Gericht fragen, ob du unnötige Schuldgefühle oder Selbstvorwürfe mit dir trägst. Es kann das Bedürfnis spiegeln, alte Geschichten über dich loszulassen. Du könntest üben zu bemerken, wann deine innere Stimme hart wird, und dir sanft einen faireren Blick anzubieten. Eine fairere innere Stimme kann Wachstum leichter und möglicher erscheinen lassen.
