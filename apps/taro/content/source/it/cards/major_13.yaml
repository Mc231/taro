  growthUpright: >-
    Le vecchie identità possono cadere come foglie, facendo spazio a ciò che sta ancora prendendo forma. Potresti notare convinzioni su di te che un tempo erano vere ma ora non lo sono più. Lasciarle andare può creare spazio per una versione di te più fedele alla persona che stai diventando.
