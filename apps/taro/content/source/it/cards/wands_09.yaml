imageryNote: >-
  Una figura sta al crepuscolo dentro un cerchio di bastoni piantati nel terreno, appoggiata a uno di essi, e guarda lontano con occhi attenti. Accanto arde basso un piccolo fuoco da campo. Il cerchio di bastoni suggerisce le difese costruite con l’esperienza, il fuoco basso l’energia ancora viva dopo un lungo sforzo, e la luce che cala un giorno che volge al termine. La postura vigile racchiude sia la stanchezza sia la perseveranza che continua ad andare avanti.
