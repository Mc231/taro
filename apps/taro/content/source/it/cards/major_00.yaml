imageryNote: >-
  Il Matto di Taro è immaginato sul bordo di un’altura, con il cielo aperto davanti, a metà di un passo, con un piccolo fagotto come unico bagaglio. Un piccolo animale da compagnia ai suoi piedi può rappresentare l’istinto, giocoso o prudente. Un unico fiore bianco può suggerire innocenza e apertura, mentre l’ampio orizzonte e la luce del mattino parlano di possibilità. Il volto rivolto verso l’alto invita chi guarda a chiedersi verso che cosa stia guardando, e che cosa abbia scelto di non portare con sé.
