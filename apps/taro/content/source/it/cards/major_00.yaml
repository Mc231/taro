  workUpright: >-
    Al lavoro o in qualsiasi progetto, il Matto può rispecchiare l’inizio di qualcosa di sconosciuto: un nuovo ruolo, un corso, un’idea creativa senza precedenti. Ti invita a trattare i primi errori come informazioni, non come sentenze. Potresti chiederti che cosa proveresti se il primo tentativo potesse essere grezzo, e chi potrebbe aiutarti a imparare il mestiere lungo la strada.
  workReversed: >-
    Rovesciato, il Matto può rispecchiare un’idea che continua a essere rimandata finché le condizioni non sembreranno perfette, o un salto fatto senza controllare le basi. Potresti considerare se ti servono più informazioni o semplicemente più coraggio. Scrivere il primo passo più piccolo possibile, insieme a una precauzione pratica, può trasformare un desiderio vago in qualcosa da mettere alla prova senza giocarsi tutto.
  growthUpright: >-
    Per la crescita personale, questa carta celebra la mente da principiante. Può invitarti a provare qualcosa in cui non hai una reputazione da difendere: una nuova abilità, una strada diversa per tornare a casa, una domanda fatta ad alta voce. Qui la crescita nasce dal restare nella curiosità e dal lasciarti sorprendere, non dal fare tutto giusto al primo tentativo.
  growthReversed: >-
    Rovesciato, il Matto può chiederti se la paura di fare brutta figura abbia cominciato a rimpicciolire il tuo mondo. Può anche rispecchiare un’irrequietezza che salta da una novità all’altra senza lasciare che nessuna metta radici. Potresti notare quale schema ti è familiare e sperimentare per una settimana il suo gentile opposto.
