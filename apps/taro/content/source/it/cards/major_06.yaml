imageryNote: >-
  Gli Amanti di Taro sono immaginati come due figure ai lati di un ruscello stretto, che si sporgono per stringersi la mano sopra l’acqua, disegnate in modo che chiunque possa riconoscersi nell’una o nell’altra. Sopra di loro, due uccelli volteggiano nello stesso cielo luminoso. Su una riva cresce un albero da frutto e sull’altra una vite in fiore: due doni diversi che si incontrano a metà strada. Il ruscello suggerisce la scelta e l’impegno che un legame autentico chiede a entrambe le persone.
