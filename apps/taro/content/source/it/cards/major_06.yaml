shortUpright: >-
  Una scelta fatta insieme dal cuore e dalla mente, in sintonia con ciò a cui tieni davvero.
shortReversed: >-
  Una parte di te forse vuole una cosa e un’altra parte un’altra. Questa carta ti invita ad ascoltarle entrambe prima di scegliere.
meaningUpright: |-
  Gli Amanti vengono spesso letti come una carta d’amore romantico, ma il loro tema più profondo è l’allineamento: l’incontro di due parti, due persone o due strade in un modo che dà un senso di interezza. Ti chiedono che cosa conta di più per te, e se le scelte che hai davanti lo rispecchiano. Qui il legame riguarda sia gli altri sia te.
  Nella vita di tutti i giorni questa carta può rispecchiare una relazione in cui senti che qualcuno ti vede davvero, una collaborazione di lavoro in cui le idee scorrono con facilità, o una decisione che ti chiede di dire chiaramente che cosa conta per te. Può indicare il momento di scegliere tra due buone opzioni, quando non c’è una risposta giusta evidente, ma solo quella che si adatta a chi stai diventando.
  Questa carta ti invita a considerare quanta sincerità usi con te e con gli altri. Potresti chiederti che cosa ti attira e perché, e a che cosa vuoi davvero impegnarti. Gli Amanti mettono in luce che le scelte significative raramente riguardano la perfezione. Riguardano il portare il cuore e il giudizio nella stessa stanza e lasciarli parlare.
meaningReversed: |-
  Rovesciati, gli Amanti possono rispecchiare la sensazione di una spinta in due direzioni opposte. Ciò che vuoi e ciò che pensi di dover volere potrebbero non coincidere, oppure un legame stretto potrebbe sembrare un po’ stonato, con ciascuno che dà valore a cose diverse senza dirlo.
  Questa carta può anche indicare una decisione che continua a essere rimandata, forse perché scegliere un’opzione significa rinunciare a un’altra. Evitare la scelta può sembrare più facile nell’immediato, mentre consuma energia in silenzio.
  Potresti scrivere che cosa ogni opzione onestamente ti offre e ti chiede, e quale dei tuoi valori sostiene. Può aiutarti notare dove ti senti più te. Il riallineamento spesso comincia con una piccola ammissione sincera, prima a te e poi, se ti sembra giusto, a qualcun altro.
aspects:
  relationshipsUpright: >-
    Nelle relazioni, gli Amanti possono rispecchiare una profonda comprensione reciproca e il piacere di scegliersi, che si tratti di amore, amicizia o famiglia. Possono invitarti a condividere ciò a cui tieni davvero e ad ascoltare ciò a cui tiene l’altra persona. La vicinanza cresce quando entrambi possono essere sinceri e sentirsi comunque accolti.
  relationshipsReversed: >-
    Rovesciata, questa carta può indicare una distanza tra le speranze o le priorità di due persone, o sentimenti che non sono stati espressi. Potresti considerare se ti stai adattando troppo per mantenere la pace, o se ti aspetti che qualcuno indovini ciò di cui hai bisogno. Una conversazione aperta e gentile sui valori potrebbe aiutarvi a capire a che punto siete.
  workUpright: >-
    Al lavoro o in un progetto, gli Amanti mettono in luce la collaborazione e le scelte radicate nei tuoi valori. Possono rispecchiare una collaborazione che tira fuori il meglio di entrambe le persone, o una decisione sulla direzione da prendere. Potresti chiederti quale opzione ti sembra significativa oltre che pratica, e lasciare che entrambe le cose contino nella tua scelta.
  workReversed: >-
    Rovesciati, gli Amanti possono rispecchiare attriti in una collaborazione o la sensazione che il tuo lavoro non corrisponda a ciò che ti sta a cuore. Possono anche indicare un’esitazione nella scelta tra due strade. Potresti elencare che cosa ti chiederebbe ciascuna strada, e notare a quale lo daresti più volentieri.
  growthUpright: >-
    Conoscere più chiaramente i tuoi valori è il lavoro interiore verso cui questa carta ti orienta. Quando capisci che cosa conta per te, le scelte riguardano meno il compiacere gli altri e più il restare fedele a te. Potresti scrivere tre valori e notare dove guidano già le tue giornate.
  growthReversed: >-
    Rovesciati, gli Amanti possono rispecchiare un conflitto interiore: una parte di te desidera un cambiamento, un’altra desidera il conforto. Nessuna delle due ha torto. Potresti dare voce a ciascuna, sulla carta o in una conversazione, e vedere se esiste una scelta che le rispetti entrambe, anche solo in parte.
