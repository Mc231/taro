imageryNote: >-
  Il Giudizio di Taro è immaginato come un ampio paesaggio all’alba dopo un lungo inverno, dove una campana limpida suona dalla cima di una collina e le persone escono di casa nella prima luce, stiracchiandosi e alzando lo sguardo. La neve che si scioglie rivela germogli verdi. Una finestra aperta con le tende spinte verso l’esterno suggerisce una chiamata interiore a cui si risponde. Le montagne lontane richiamano la prospettiva che porta una riflessione sincera, e i colori tenui del mattino parlano di rinnovamento.
