imageryNote: >-
  Una figura sta in cima a una collina o a una scogliera, in parte di spalle, con tre bastoni piantati intorno come segni dell’impegno, e osserva barche o viaggiatori che attraversano acque aperte o pianure più in basso. La prima luce del giorno può suggerire l’inizio di una nuova fase. Il movimento lontano rappresenta progetti già avviati, e la postura salda una fiducia paziente mentre i risultati sono ancora in viaggio.
