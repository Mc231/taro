  L’illustrazione originale mostra una figura seduta nel letto, con le ginocchia raccolte, in una stanza buia illuminata solo da una sottile lama di luna alla finestra. Nove lame sono appese in file ordinate sulla parete alle sue spalle, senza mai toccare la figura. Una coperta piegata e una piccola lampada aspettano lì vicino, spente. Le file di lame suggeriscono pensieri che girano in tondo, mentre la lampada e la finestra lasciano intendere che il conforto e il mattino sono a portata di mano.
