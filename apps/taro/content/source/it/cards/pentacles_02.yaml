imageryNote: >-
  L’illustrazione può mostrare una figura a metà di un passo, che tiene in aria due monete unite da un nastro o da un cordone che si avvolge in una curva senza fine. Alle sue spalle, acque che ondeggiano o barche che salgono e scendono sulle onde possono richiamare il movimento costante della vita quotidiana. L’anello suggerisce continuità e la natura sempre in corso dell’equilibrio, mentre la postura leggera, quasi di danza, lascia intendere che adattarsi si può fare con agio e perfino con un po’ di gioco.
