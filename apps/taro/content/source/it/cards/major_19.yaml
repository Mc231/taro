imageryNote: >-
  Il Sole di Taro è immaginato come un ampio campo estivo a mezzogiorno, con amici di età diverse che condividono del cibo su una coperta sotto un sole enorme e caldo. Gli aquiloni salgono nella brezza e non si vedono ombre lunghe, a suggerire un momento senza nulla da nascondere. Gialli brillanti e arancioni caldi riempiono la scena, mentre un cane che corre nell’erba aggiunge una nota di gioco. L’immagine invita chi guarda a sentire calore, chiarezza e una gioia semplice.
