imageryNote: >-
  Una figura sta in piedi su un alto muro o su una sporgenza, con un bastone fissato saldamente accanto a sé e un secondo tenuto con leggerezza in mano, lo sguardo rivolto verso terre o mari lontani. Un piccolo globo, una mappa o una bussola riposano lì vicino. Il bastone fisso rappresenta ciò che è già stato costruito, quello sollevato la scelta di andare oltre. L’ampia veduta invita chi guarda a immaginare molti percorsi possibili, non un unico tracciato prestabilito.
