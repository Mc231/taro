  workUpright: >-
    Al lavoro, il Due di Bastoni può indicare un pensiero strategico: tracciare la fase successiva di un progetto, considerare un nuovo campo o dare forma a un obiettivo a lungo termine. Potresti dedicare un po’ di tempo al quadro generale prima di rituffarti nei compiti quotidiani, e poi scegliere un’azione concreta che porti il piano dalla lavagna al movimento.
  workReversed: >-
