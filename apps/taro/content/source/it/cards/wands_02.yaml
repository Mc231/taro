  growthUpright: >-
    Per la crescita personale, questa carta ti invita a prendere sul serio le tue ambizioni. Che cosa esploreresti se ti dessi il permesso di pensare oltre i tuoi soliti limiti? Potresti abbozzare un’immagine del prossimo anno o due, non come una promessa fissa, ma come una direzione che ti aiuti a notare le opportunità quando si presentano.
