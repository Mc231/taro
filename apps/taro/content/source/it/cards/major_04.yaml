imageryNote: >-
  L’Imperatore di Taro è immaginato come una figura seduta a un robusto tavolo di pietra incassato in un pendio, con una mappa, un’asta da misura e una lanterna disposte con ordine. I muretti a secco che attraversano i campi alle sue spalle mostrano confini costruiti a mano, pietra dopo pietra. Un ariete che pascola lì vicino può richiamare l’Ariete e la spinta a cominciare. I rossi caldi suggeriscono vitalità, e un piccolo cancello lasciato aperto in un muretto lascia intendere che anche le strutture salde possono far passare le persone.
