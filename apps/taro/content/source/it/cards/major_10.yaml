  relationshipsReversed: >-
    Rovesciata, questa carta può indicare conflitti familiari che continuano a tornare, o una resistenza al fatto che una relazione cambi forma. Potresti considerare quale schema tendete a ripetere tu e una persona vicina, e che cosa ciascuno potrebbe provare a fare in modo diverso. Cambiare non deve per forza significare perdere; può significare crescere.
  workUpright: >-
    Al lavoro o in un progetto, la Ruota mette in luce circostanze in movimento e nuove aperture. Può rispecchiare un cambio di programma, un nuovo gruppo o un progetto che all’improvviso va avanti. Potresti tenere gli occhi aperti sulle opportunità, ricordando che ogni fase, intensa o lenta, ha qualcosa da offrire.
