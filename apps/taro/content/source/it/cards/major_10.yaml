imageryNote: >-
  La Ruota della Fortuna di Taro è immaginata come una grande ruota che gira in un cielo che passa dall’alba, su un lato, alla notte, sull’altro, mostrando tutte le fasi insieme. Piccole figure e creature viaggiano sul bordo, alcune salgono e altre scendono, nessuna resta ferma. I simboli delle quattro stagioni negli angoli possono incorniciare l’idea dei cicli naturali. Al centro, un perno calmo e immobile suggerisce la prospettiva stabile che si può trovare anche mentre tutto gira.
