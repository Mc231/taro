  growthUpright: >-
    Vedere la tua vita come una serie di cicli, e non come un’unica linea retta, può essere liberatorio. Notare i tuoi ritmi, per esempio quando hai molta energia o quando hai bisogno di riposo, può aiutarti a organizzarti seguendoli e non contrastandoli. Potresti ripercorrere l’ultimo anno e notarne i punti di svolta.
