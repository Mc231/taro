imageryNote: >-
  Il Papa di Taro è immaginato come un maestro in un cortile silenzioso, seduto su una panca di pietra consumata sotto un vecchio albero, con un piccolo cerchio di persone di età diverse in ascolto. Una pesante chiave pende dalla cintura del maestro, simbolo di una comprensione trasmessa attraverso lo studio e la pratica. I libri impilati sulla panca e una campana nell’arco sopra di lui suggeriscono riti condivisi e apprendimento. Un cancello aperto in fondo al cortile lascia intendere che ogni insegnamento può portare verso qualcosa di nuovo.
