  L’illustrazione originale mostra una riva spazzata dal vento sotto nuvole strappate e veloci. Una figura tiene mollemente tre lame e si volta indietro, mentre altre due lame giacciono sulla sabbia. Altre due figure si allontanano verso l’acqua. Le lame sparse suggeriscono discussioni rimaste irrisolte, e le spalle voltate indicano la distanza creata dal conflitto. Il cielo inquieto rispecchia una mente ancora agitata quando le parole si sono fermate.
