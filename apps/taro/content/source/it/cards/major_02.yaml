imageryNote: >-
  La Papessa di Taro è immaginata seduta sulla soglia di una porta illuminata dalla luna, metà nella luce e metà nell’ombra, con un libro chiuso appoggiato sulle ginocchia. Dietro la figura, una tenda si muove come se oltre ci fosse qualcosa in attesa. Una falce di luna riflessa in una vasca d’acqua immobile può richiamare i cicli e l’intuizione, e i toni di blu profondo suggeriscono calma in superficie e profondità sotto. La quiete attenta e silenziosa della figura è il centro dell’immagine.
