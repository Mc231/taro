imageryNote: >-
  Una figura siede a suo agio su un ampio seggio in una radura illuminata dal sole, con un bastone che mette foglie appoggiato in una mano e l’altra aperta verso chi guarda. Accanto brilla il fuoco di un focolare, e un animale da compagnia vigile è disteso lì vicino. Il focolare suggerisce un calore offerto agli altri, la mano aperta la generosità, e la postura rilassata una sicurezza che non ha bisogno di dimostrarsi. Ori e ambre calde possono richiamare il fuoco nella sua forma più quieta e radiosa.
