  growthUpright: >-
    Il coraggio e la sete di esperienza sono doni che questa carta ti chiede di usare. Che cosa faresti se ti fidassi del tuo entusiasmo? Potresti provare qualcosa che ti spinge oltre i tuoi limiti abituali, e notare che effetto fa agire per passione e non solo per prudenza.
