imageryNote: >-
  Una figura in pieno galoppo si sporge in avanti su un cavallo impennato o in salto, il bastone alzato e il mantello che sventola alle spalle. Colline desertiche o pianure aperte si stendono davanti, e piccole fiamme o salamandre possono decorare gli abiti. Il cavallo in salto rappresenta passione e spinta, il bastone alzato uno scopo portato all’azione, e l’ampio paesaggio un’avventura ancora in corso. La postura protesa in avanti allude sia al coraggio sia alla fretta.
