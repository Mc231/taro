  relationshipsReversed: >-
    Rovesciata, i sentimenti forti potrebbero correre più veloci della comunicazione, oppure l’entusiasmo potrebbe raffreddarsi in fretta come è arrivato. Potresti notare se tu o una persona vicina state agendo d’impulso senza confrontarvi. Rallentare per parlare di ciò che ciascuno desidera davvero può portare stabilità a un legame pieno di scintille.
  workUpright: >-
