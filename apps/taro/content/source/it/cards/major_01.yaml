imageryNote: >-
  Il Mago di Taro è immaginato all’alba, a un banco di mercato all’incrocio di due strade, mentre dispone quattro oggetti umili per i quattro semi: un ramo verde, una coppa di terracotta, un coltello per il pane e una sola moneta. Una mano si allunga verso il banco, l’altra indica il cielo che si rischiara, unendo idea e azione. Fili di luce tra gli oggetti suggeriscono l’attenzione che riunisce strumenti separati in un unico scopo, e una pagnotta non finita lascia intendere che il lavoro è appena cominciato.
