shortUpright: >-
  Forse hai già più di quanto ti serve; questa carta ti chiede che cosa vuoi crearci.
shortReversed: >-
  I tuoi strumenti sono sul tavolo, ma la tua attenzione forse è altrove. Che cosa ti aiuterebbe a raccoglierla?
meaningUpright: |-
  Il Mago è la carta che trasforma un’idea in qualcosa di reale. Dove il Matto parte senza alcun piano, il Mago si ferma, guarda ciò che ha a portata di mano e decide di usarlo. L’immagine tradizionale di una mano alzata e una rivolta verso il basso suggerisce un ponte tra intenzione e azione, tra ciò che immagini e ciò che puoi davvero fare oggi.
  Nella vita quotidiana questa carta può rispecchiare il momento in cui un progetto riceve finalmente una data, un tempo dedicato, una prima bozza. Può indicare abilità che tendi a trascurare perché ti vengono facili: un talento per spiegare le cose, per risolvere piccoli problemi, per far incontrare le persone. Qui l’intraprendenza significa accorgersi che i pezzi sono già sul tavolo.
  Questa carta ti invita a considerare dove va la tua attenzione. La concentrazione è una sorta di mestiere: si può allenare. Potresti chiederti quale cosa ti piacerebbe portare alla luce, e quale degli strumenti che hai già potrebbe avvicinarla di un passo. Il Mago non promette risultati. Mette in luce la forza di presentarsi con un’intenzione e di usare ciò che si ha.
meaningReversed: |-
  Rovesciato, il Mago può rispecchiare capacità presenti ma non ancora usate. Potresti avere le competenze e le idee, eppure sentire la tua energia disperdersi in troppe direzioni, o dubitare che il tuo contributo conti. La tavola è apparecchiata; le mani non si muovono ancora del tutto.
  Questa carta può anche indicare un’abilità un po’ deviata: usare il fascino o la parlantina per saltare la parte del lavoro che sembra noiosa, o mostrare una superficie sicura mentre dentro ci si sente incerti. Nessuna delle due cose è una colpa morale. Entrambe possono essere segni che intenzione e azione si sono allontanate.
  Potresti osservare dove la tua attenzione si sta dividendo. Scegliere un compito piccolo e concreto e portarlo a termine può ricostruire la fiducia nelle tue mani. Può anche aiutarti chiederti che cosa faresti in modo diverso se nessuno ti stesse guardando.
aspects:
  relationshipsUpright: >-
    Nelle relazioni, il Mago può rispecchiare la forza di una comunicazione chiara e diretta. Può invitarti a dire ciò che intendi e ad agire in modo coerente con le tue parole. Potresti notare quanto puoi influire sul tono di un legame attraverso piccoli gesti intenzionali: un messaggio premuroso, un programma rispettato, un’attenzione data senza distrazioni.
  relationshipsReversed: >-
    Rovesciata, questa carta può chiederti se in un legame stretto parole e azioni si corrispondono, le tue o quelle dell’altra persona. Può anche rispecchiare il trattenere ciò che pensi davvero, o il recitare una versione di te che credi verrà apprezzata. Potresti considerare che cosa cambierebbe se lasciassi vedere a qualcuno le tue vere intenzioni, anche quelle incerte.
  workUpright: >-
    Al lavoro o in un progetto, il Mago indica l’incontro tra abilità e opportunità. Può invitarti a fare il punto delle tue capacità, dei tuoi contatti e delle tue risorse, e a orientarli verso un obiettivo chiaro. È una carta da avvio, da proposta, da prototipo, da progetto finalmente messo per iscritto. Qui contano la concentrazione e la costanza, non l’avere ogni risposta in anticipo.
  workReversed: >-
    Rovesciato, il Mago può rispecchiare un talento poco sfruttato, o un impegno così sparpagliato che nulla arriva davvero a segno. Può anche indicare la tentazione di esagerare le promesse o di prendere scorciatoie. Potresti chiederti quale compito meriti davvero la tua energia adesso, e come sarebbe un lavoro onesto e costante su di esso nei prossimi giorni.
  growthUpright: >-
    Per la crescita personale, questa carta ti invita a riconoscere la tua capacità di agire. Potresti elencare le abilità, le abitudini e i sostegni che hai già, e notare come potrebbero servire a qualcosa a cui tieni. Pratica, ripetizione e intenzione chiara sono gli strumenti silenziosi del Mago; piccole scelte quotidiane, nel tempo, possono sommarsi in un cambiamento reale.
  growthReversed: >-
    Rovesciato, il Mago può rispecchiare una distanza tra la persona che sai di poter essere e le abitudini che stai vivendo. Può chiederti dove l’insicurezza ti stia facendo aspettare un permesso. Potresti scegliere un’abilità da esercitare apertamente, anche in modo imperfetto, e notare come la fiducia cresca facendo, senza aspettare di sentirti all’altezza.
