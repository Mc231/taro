imageryNote: >-
  L’illustrazione può mostrare due figure che avanzano nella neve o nella pioggia lungo un muro, a capo chino contro il maltempo, mentre sopra di loro brilla una finestra con cinque monete inserite nel disegno. Il contrasto tra il sentiero freddo e la finestra illuminata può simboleggiare la difficoltà accanto a un riparo vicino. La posizione della finestra, appena fuori dalla linea dello sguardo delle figure, suggerisce un sostegno presente ma non ancora notato né cercato.
