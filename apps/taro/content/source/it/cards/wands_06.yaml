meaningUpright: |-
  Il Sei di Bastoni è una carta di riconoscimento. Dopo l’attrito del Cinque, una figura avanza a cavallo con una corona d’alloro sul bastone, e le persone lungo la strada sembrano applaudire. Coglie il momento in cui l’impegno diventa visibile e gli altri lo riconoscono.
  Può avere l’aspetto di un buon riscontro su un lavoro in cui hai messo tutto te, di un’amica o di un amico che ti dice di ammirare come hai gestito qualcosa, o del portare a termine una sfida che un tempo dubitavi di poter affrontare. Può anche essere una forma di fiducia più quieta: camminare a testa un po’ più alta perché sai di aver fatto bene.
  Questa carta ti invita ad accogliere l’apprezzamento senza scacciarlo. Il riconoscimento può dare energia e coraggio per il passo successivo. Allo stesso tempo, la figura è circondata da persone, a ricordare che pochi risultati si ottengono senza nessuno accanto. Potresti goderti il momento e anche considerare chi ti ha sostenuto, e come potresti condividere una parte del merito.
meaningReversed: |-
  Rovesciato, il Sei di Bastoni può rispecchiare un impegno passato inosservato, o lodi che non arrivano davvero fino a te. Potresti aver realizzato qualcosa e sentire comunque che non conta finché qualcun altro non lo dice. Può anche indicare la stanchezza di mostrare una sicurezza che non senti del tutto.
  A volte, rovesciata, questa carta descrive un successo silenzioso, importante per te anche se non è visibile agli altri. Anche quel tipo di progresso conta.
  Potrebbe essere il momento di guardare quanto il tuo senso di valore dipenda dagli applausi. Come sarebbe essere la prima persona a riconoscere il tuo impegno? Potresti scrivere ciò di cui provi orgoglio, comprese le parti che nessun altro ha visto, e lasciare che diventi una fonte di incoraggiamento più stabile dell’approvazione esterna.
aspects:
  relationshipsUpright: >-
    Nelle relazioni, questa carta può rispecchiare un apprezzamento che scorre in entrambe le direzioni: provare orgoglio per una persona vicina, o sentire il suo sguardo e il suo sostegno. Può invitarvi a celebrare ad alta voce i successi l’uno dell’altro. Potresti dire a una persona a te cara qualcosa che ammiri in lei, e lasciarti raggiungere dal suo incoraggiamento.
  relationshipsReversed: >-
    Rovesciata, potresti sentire che i tuoi sforzi in una relazione passano inosservati, o che il riconoscimento è diventato una gara silenziosa. Potresti considerare di dire chiaramente quale tipo di apprezzamento conta per te, e di chiedere lo stesso all’altra persona. Un grazie piccolo e specifico spesso cambia l’atmosfera più dei grandi gesti.
  workUpright: >-
    Al lavoro o nello studio, il Sei di Bastoni può indicare risultati visibili: riscontri positivi, un progetto accolto bene, un momento per presentare ciò che hai fatto. Potresti usare questa fiducia per condividere le tue idee più apertamente, dando anche merito alle persone che hanno contribuito. Un riconoscimento condiviso con generosità tende a costruire gruppi più solidi.
  workReversed: >-
    Rovesciato, i tuoi contributi potrebbero sembrare trascurati, o il successo potrebbe dipendere troppo da come appaiono le cose dall’esterno. Potresti rendere più visibile il tuo lavoro in modo calmo e concreto, per esempio con un breve riepilogo di ciò che hai consegnato, e riflettere anche su quali risultati contano per te a prescindere da chi li nota.
  growthUpright: >-
    Per la crescita personale, questa carta ti invita a concederti un po’ di orgoglio. Riconoscere i tuoi progressi può costruire una fiducia che ti accompagna nella sfida successiva. Potresti tenere un breve elenco delle cose che hai gestito bene di recente, da rileggere nei giorni in cui la fiducia sembra più sottile.
  growthReversed: >-
    Rovesciato, l’insicurezza o il bisogno di approvazione potrebbero offuscare il tuo senso di realizzazione. Potresti esplorare da dove venga la tua idea di successo e se ti si addica ancora. Definire il successo con parole tue può rendere il riconoscimento degli altri un piacevole extra, non qualcosa da cui dipendi.
