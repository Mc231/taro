  Una figura a cavallo di un destriero tranquillo attraversa una piccola folla, con un bastone coronato da una ghirlanda di foglie. Altri bastoni sollevati fiancheggiano il percorso come una guardia d’onore. La ghirlanda rappresenta un riconoscimento guadagnato con l’impegno, il cavallo calmo una fiducia costruita con l’allenamento e non con la fretta, e le figure intorno la comunità che partecipa al risultato e lo sostiene.
