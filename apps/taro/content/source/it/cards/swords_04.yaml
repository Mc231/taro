imageryNote: >-
  L’illustrazione originale mostra una figura che riposa su una bassa panca di pietra in uno spazio silenzioso e a volta. Tre lame sono appese con calma alla parete, e una quarta giace distesa sotto la panca, tutte riposte. Una luce morbida entra da una piccola finestra. La stanza chiusa suggerisce un rifugio sicuro, le lame riposte indicano pensieri messi da parte per ora, e la luce gentile lascia intendere che il mondo fuori aspetta con pazienza.
