imageryNote: >-
  L’Eremita di Taro è immaginato come una figura avvolta in un mantello su un alto crinale innevato al crepuscolo, con una semplice lanterna che illumina solo i prossimi passi del sentiero. Un bastone da cammino levigato dall’uso suggerisce il sostegno raccolto dall’esperienza. Le impronte nella neve alle sue spalle mostrano quanta strada la figura abbia già fatto. Blu e grigi freddi parlano di solitudine e di aria limpida, mentre il bagliore caldo della lanterna mostra che la comprensione si può portare con sé anche nel tratto più buio della strada.
