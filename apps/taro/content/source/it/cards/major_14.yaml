imageryNote: >-
  La Temperanza di Taro è immaginata come una figura alata sulla riva di un fiume lento, che versa con cura un liquido tra due recipienti diversi, uno di terracotta e uno di vetro. Il getto tra i due si incurva dolcemente, come se l’equilibrio venisse trovato proprio in quel momento. Le pietre per guadare il fiume suggeriscono una via di mezzo da una riva all’altra, e i tenui colori dell’alba sulle colline lontane mantengono l’atmosfera calma e piena di speranza.
