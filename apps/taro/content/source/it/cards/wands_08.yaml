imageryNote: >-
  Otto bastoni sfrecciano in diagonale in un cielo ampio, paralleli e in volo, sopra un paesaggio dolce con un fiume o una strada più in basso. Nella scena non ci sono persone, solo movimento. L’angolo comune suggerisce un’energia allineata in una direzione, il cielo aperto un percorso libero e il fiume in basso il flusso costante degli eventi. L’assenza di figure invita chi guarda a sentire il movimento, senza osservare la storia di qualcun altro.
