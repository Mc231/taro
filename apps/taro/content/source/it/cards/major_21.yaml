meaningUpright: |-
  Il Mondo è l’ultima carta degli Arcani maggiori, la fine del viaggio cominciato con il Matto. È una carta di compimento e di interezza: la sensazione che i pezzi si siano ricomposti, che un ciclo sia stato vissuto fino in fondo e che tu sia, per questo momento, a casa nella storia che hai vissuto finora.
  Nella vita di tutti i giorni questa carta può rispecchiare il completamento di un lungo progetto, il raggiungimento di un obiettivo per cui hai lavorato, o semplicemente il sentirti a casa nella tua vita e nel tuo corpo. Può indicare l’integrazione: riunire le lezioni di molte esperienze, quelle facili e quelle difficili, in un senso di chi sei. Qui l’appartenenza può voler dire appartenere a una comunità, a un luogo o a te.
  Questa carta ti invita a considerare ciò che hai realizzato e a festeggiarlo. Potresti chiederti che cosa è cambiato in te da quando questo ciclo è cominciato, e che cosa vorresti portare nel prossimo. Il Mondo mette in luce che il compimento non è una fine nel senso di fermarsi. È un momento di pienezza prima che cominci un nuovo viaggio.
meaningReversed: |-
  Rovesciato, il Mondo può rispecchiare un ciclo quasi completo, ma non del tutto. Qualche filo da annodare, un saluto non detto o un ultimo compito potrebbero impedirti di sentire che è davvero finito. Potresti sentire che è ora di andare avanti mentre qualcosa ti trattiene ancora al tuo posto.
  Questa carta può anche indicare il cercare la chiusura altrove, il cercare scorciatoie o lo sperare che siano gli altri a sistemare le cose al posto tuo.
  Potresti individuare le una o due cose che ti aiuterebbero a sentire il cerchio chiuso. Potrebbe trattarsi di finire un compito pratico, ringraziare qualcuno, riconoscere una delusione o semplicemente darti credito per la strada che hai fatto. Compiere quell’ultimo passo con intenzione può trasformare una quasi-fine in una fine vera.
aspects:
  relationshipsUpright: >-
    Nelle relazioni, il Mondo può rispecchiare un senso di appagamento e di comprensione reciproca, come se un legame avesse trovato la sua piena forma. Può invitarti ad apprezzare ciò che avete costruito insieme e a celebrare i traguardi condivisi. Qui le relazioni sembrano complete, con spazio sia per la vicinanza sia per la libertà di ciascuno.
  relationshipsReversed: >-
    Rovesciata, questa carta può indicare qualcosa di irrisolto in una relazione, una conversazione non conclusa o un capitolo non ancora chiuso. Potresti considerare che cosa vi aiuterebbe a sentirvi in pace, che significhi dire qualcosa o accettare che è già stato detto.
  workUpright: >-
    Al lavoro o in un progetto, il Mondo mette in luce compimento e riconoscimento. Può rispecchiare la conclusione di un lavoro importante, il raggiungimento di un traguardo o la sensazione che il tuo ruolo ti stia a pennello. Potresti prenderti del tempo per riconoscere ciò che tu e gli altri avete realizzato prima di cominciare la cosa successiva.
  workReversed: >-
    Rovesciato, il Mondo può rispecchiare un progetto bloccato all’ultima fase o la sensazione di non riuscire a tagliare del tutto il traguardo. Potresti elencare ciò che manca e decidere se va davvero fatto o se lo puoi lasciar andare. Uno sforzo piccolo e concentrato può aiutarti a chiudere le cose in modo pulito.
  growthUpright: >-
    Prima di puntare all’obiettivo successivo, può aiutarti riconoscere quanta strada hai fatto. Potresti riflettere sulle lezioni, le sfide e le gioie di un capitolo recente e notare come si compongono in un’immagine più piena di te. L’integrazione è una forma silenziosa di realizzazione.
  growthReversed: >-
    Rovesciato, il Mondo può chiederti di che cosa hai bisogno per sentire il cerchio chiuso. Può rispecchiare una sensazione di irrequietezza o di incompiutezza. Potresti nominare una cosa che hai in mente di finire da tempo e darle tutta la tua attenzione, poi notare come ti senti quando chiudi quel cerchio.
