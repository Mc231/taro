imageryNote: >-
  Il Mondo di Taro è immaginato come una figura che danza dentro una grande ghirlanda ovale di foglie e fiori di ogni stagione, muovendosi liberamente al centro di un cielo stellato. Intorno alla ghirlanda, quattro piccoli emblemi per fuoco, acqua, aria e terra segnano i bordi della scena, suggerendo equilibrio e interezza. Un nastro che scende dalla mano della figura danzante torna al punto da cui è partito, invitando chi guarda a sentire un senso di arrivo e di un viaggio che si chiude in cerchio.
