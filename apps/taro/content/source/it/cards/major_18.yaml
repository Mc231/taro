imageryNote: >-
  La Luna di Taro è immaginata come una luna pallida, per metà nascosta da nuvole in movimento, sopra un sentiero tra alte canne lungo la riva. Il sentiero luccica in alcuni punti e scompare in altri, così chi viaggia procede piano. Un airone immobile nell’acqua bassa può suggerire un’attenzione paziente, mentre le increspature sull’acqua lasciano intuire sentimenti che salgono dal profondo. La luce argentea, le ombre morbide e i contorni sfumati invitano chi guarda a fidarsi dei propri sensi in un viaggio incerto.
