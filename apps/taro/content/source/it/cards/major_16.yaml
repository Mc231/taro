imageryNote: >-
  La Torre di Taro è immaginata come una torre di pietra alta e stretta su un picco roccioso, la cui sommità viene sollevata da un improvviso lampo di luce caduto da un cielo in tempesta. Scintille o piccole fiamme si disperdono come semi nel vento, suggerendo che ciò che viene liberato può portare con sé nuovi inizi. La scena è disegnata come un momento di illuminazione, luminoso contro nuvole scure, così che l’attenzione resti sullo sgombero e sulla comprensione, non sul danno a qualcuno.
