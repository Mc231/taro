imageryNote: >-
  La Stella di Taro è immaginata come una scena notturna in un giardino pensile, dove una figura annaffia giovani piante con una brocca mentre una stella luminosa brilla attraverso uno squarcio tra le nuvole. Botti per la pioggia e un piccolo stagno raccolgono ciò che il cielo restituisce. Le falene che girano intorno a una lanterna possono rappresentare pensieri attirati verso la luce. I blu freschi e i toni argentati creano una sensazione di calma, apertura e dolce rinnovamento dopo il passaggio di una tempesta.
