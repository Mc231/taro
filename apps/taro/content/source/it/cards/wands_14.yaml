imageryNote: >-
  Una figura siede su un seggio alto al bordo di un belvedere, protesa in avanti, con un bastone fiorito piantato saldamente accanto, come se stesse per alzarsi. Più in là una strada si snoda verso colline lontane illuminate dal sole del tardo pomeriggio. Il bastone fiorito suggerisce una visione viva e in crescita, il belvedere un’ampia veduta di ciò che si potrebbe costruire, e la postura protesa la prontezza a trasformare le idee in azione. Braci o piccoli motivi di fiamma possono richiamare l’elemento del fuoco.
