imageryNote: >-
  La Forza di Taro è immaginata come una figura calma inginocchiata in un prato illuminato dal sole accanto a un grande leone, con una mano posata sulla criniera mentre l’animale si appoggia a lei, rilassato e fiducioso. Non compaiono corde né catene; il legame si mostra attraverso la vicinanza e la tranquillità. I fiori di campo che crescono intorno a entrambi suggeriscono che la pazienza lascia fiorire le cose più delicate. Una calda luce dorata mantiene l’atmosfera serena, mostrando potenza e dolcezza fianco a fianco.
