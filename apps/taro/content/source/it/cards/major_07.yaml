imageryNote: >-
  Il Carro di Taro è immaginato come una figura che guida un piccolo carro robusto lungo una strada costiera, trainato da due animali di temperamento opposto, uno calmo e uno irrequieto. Chi guida tiene le redini con leggerezza e conduce con attenzione, senza forzare. Una copertura a forma di conchiglia sopra il sedile può richiamare il Cancro e la protezione che permette di avanzare in sicurezza, mentre la strada aperta e le luci lontane di un porto suggeriscono una meta scelta, non imposta.
