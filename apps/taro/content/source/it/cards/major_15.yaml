imageryNote: >-
  Il Diavolo di Taro è immaginato come una figura cornuta e in ombra, appollaiata sopra due figure più piccole legate al suo seggio da catene allentate e lasche. Le catene sono disegnate chiaramente larghe intorno ai polsi, e invitano chi guarda a notare che potrebbero sfilarsele. La luce fioca delle torce e i toni scuri della terra creano un’atmosfera pesante, mentre una tenue soglia di luce al bordo della scena lascia intendere che c’è un altro sentiero da trovare.
