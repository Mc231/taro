imageryNote: >-
  La Giustizia di Taro è immaginata come una figura composta ed eretta, che tiene una bilancia in equilibrio all’altezza del cuore e una lama dritta rivolta al cielo. La figura guarda chi osserva dritto negli occhi, suggerendo un’onestà che non nasconde nulla. Due colonne semplici e una tenda spoglia alle sue spalle mantengono la scena sgombra, come per fare spazio a un pensiero attento. I blu freschi dell’aria e un unico accento caldo possono rispecchiare l’incontro tra ragione e coscienza.
