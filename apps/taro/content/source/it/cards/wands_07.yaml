  Una figura sta su un rialzo di terreno roccioso, con i piedi piantati in modo irregolare, un bastone sollevato con entrambe le mani mentre altri sei spingono dal basso oltre il bordo. L’appoggio irregolare suggerisce che la convinzione non è sempre comoda, e il terreno più alto mostra un vero punto di vista guadagnato con l’impegno. I bastoni in basso possono rappresentare sfide, domande e voci in competizione, e la presa salda un coraggio radicato nei valori.
