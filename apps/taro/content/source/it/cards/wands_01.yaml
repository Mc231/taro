  relationshipsReversed: >-
    Rovesciata, la scintilla tra te e una persona vicina potrebbe sembrare attutita dalla routine, dalla stanchezza o da un’esitazione non detta. Non significa che il calore sia sparito; potrebbe semplicemente aspettare un varco. Potresti considerare che cosa un tempo accendeva le vostre conversazioni, e se un piccolo gesto di curiosità potrebbe riportare un po’ di quella vivacità.
  workUpright: >-
    Al lavoro o in un progetto creativo, l’Asso di Bastoni può indicare un’idea con una vera forza di attrazione: un nuovo approccio, un progetto parallelo, una proposta a cui continui a tornare. Potresti darle una prima forma concreta, come una bozza, un prototipo o una breve presentazione a una persona di fiducia, così che possa essere messa alla prova all’aperto e non solo nella tua testa.
