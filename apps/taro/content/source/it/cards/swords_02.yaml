imageryNote: >-
  Nell’illustrazione originale, una figura seduta tiene due lame incrociate vicino al petto, con un panno morbido sugli occhi. Una falce di luna pallida pende bassa sopra un’acqua calma e poco profonda, punteggiata di sassi. Le lame incrociate formano una figura difensiva, come una porta tenuta chiusa. L’acqua immobile e la luce notturna suggeriscono emozioni che riposano sotto la superficie, e gli occhi coperti indicano la scelta di non guardare ancora.
