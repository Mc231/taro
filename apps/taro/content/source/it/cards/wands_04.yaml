imageryNote: >-
  Quattro bastoni dritti sono uniti da una ghirlanda di foglie, fiori e nastri, e formano un passaggio aperto. Al di là, alcune figure si riuniscono con le mani alzate, e una casa semplice o un borgo cinto da mura si vede in lontananza. La cornice dei quattro bastoni suggerisce basi stabili costruite con l’impegno, la ghirlanda un raccolto di gioia condivisa, e il passaggio aperto un benvenuto che invita gli altri a entrare senza tenerli fuori.
