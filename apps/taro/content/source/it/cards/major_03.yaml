imageryNote: >-
  L’Imperatrice di Taro è immaginata come una figura a riposo in un orto di fine estate, circondata da ortaggi che maturano, una pagnotta che si raffredda sul davanzale e un ruscello che scorre accanto. Tessuti morbidi e intrecciati e un cesto di frutta appena colta suggeriscono il conforto e il piacere dei sensi, mentre le api che passano da un fiore all’altro lasciano intuire una crescita fatta di tanti piccoli gesti di cura. L’atmosfera è calda e senza fretta, e invita chi guarda a notare l’abbondanza già presente.
