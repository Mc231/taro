  relationshipsReversed: >-
    Rovesciata, l’Imperatrice può chiederti se la cura in una relazione sia diventata a senso unico, o se la premura sia scivolata nel gestire le scelte di qualcun altro. Potresti considerare dove fare un passo indietro e fidarti di più dell’altra persona, e dove chiedere più apertamente la cura di cui hai bisogno anche tu.
  workUpright: >-
