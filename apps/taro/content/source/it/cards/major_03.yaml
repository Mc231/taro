  growthUpright: >-
    Per la crescita personale, l’Imperatrice ti invita a goderti l’essere nel tuo corpo e nel mondo fisico. Riposo, buon cibo, tempo nella natura e piaceri semplici qui non sono lussi: sono modi per ricaricarti. Potresti notare che cosa ti aiuta a sentirti con i piedi per terra e con il cuore generoso, e fargli un po’ più di spazio.
  growthReversed: >-
