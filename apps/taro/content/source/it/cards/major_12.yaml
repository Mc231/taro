imageryNote: >-
  L’Appeso di Taro è immaginato sospeso a testa in giù per una caviglia a un ramo robusto e vivo, con le braccia rilassate e il volto calmo, perfino curioso. Da questa angolazione la figura vede il mondo riflesso in uno specchio d’acqua sottostante, capovolto. L’albero è verde e pieno di gemme, a mostrare che la pausa fa parte della crescita e non ne segna la fine. I blu acquatici e gli abiti morbidi e fluenti richiamano la resa, il sogno e il vedere sotto la superficie.
