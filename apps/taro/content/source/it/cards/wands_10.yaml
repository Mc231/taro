imageryNote: >-
  Una figura cammina piegata in avanti, con le braccia strette intorno a un alto fascio di dieci bastoni che le nasconde quasi il viso, diretta verso una piccola casa o un paese all’orizzonte. Il fascio rappresenta le responsabilità accumulate, il viso nascosto il modo in cui un carico pesante può restringere lo sguardo, e la meta vicina una fine a portata di mano. La strada aperta lascia spazio per immaginare il carico condiviso o posato.
