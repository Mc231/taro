  single: >-
    Обирайте одну карту, коли хочете мати одну чітку підказку на весь день або коли питання просте і Вам потрібна відправна точка для роздумів, а не детальна мапа. Вона також добре підходить, коли бракує часу або коли Ви лише знайомитеся з картами.
  three_ppf: >-
    Обирайте «Минуле, теперішнє, майбутнє», коли хочете побачити, як ситуація розвивалася з плином часу. Цей розклад допомагає помітити закономірності, які привели Вас сюди, те, що діє зараз, і те, куди все може рухатися, якщо нічого не зміниться, щоб Ви могли вирішити, що хочете зберегти, а що змінити.
  three_sao: >-
    Обирайте «Ситуація, дія, результат», коли перед Вами щось практичне і хочеться обміркувати, що можна зробити далі. Розклад розглядає ситуацію такою, якою вона є, підхід, який варто розглянути, і те, куди цей підхід може привести, якщо Ви ним скористаєтеся.
  relationship: >-
    Обирайте розклад «Стосунки», щоб поміркувати про будь-який близький зв’язок: з партнером чи партнеркою, другом, родичем або колегою. Він розглядає, що вносите Ви, як усе може переживати інша людина, що Вас поєднує, що обтяжує зв’язок і на що він може перерости. Розклад описує Ваш погляд на стосунки, не думки іншої людини.
  two_paths: >-
    Обирайте «Два шляхи», коли зважуєте вибір між двома варіантами. Назвіть їх для себе, перш ніж тягнути карти: Шлях А і Шлях Б. Розклад розглядає ситуацію, що стоїть за вибором, чого може вимагати від Вас кожен шлях і куди може привести кожен із них, щоб Ви могли порівняти їх зі своїми цінностями. Рішення залишається за Вами.
  celtic_cross: >-
    Обирайте «Кельтський хрест» для складної ситуації, яку хочете глибоко дослідити. Його десять позицій розглядають суть справи, те, що їй перешкоджає, її коріння, недавні події та те, що може бути далі, а потім Вас самих, Ваше оточення, Ваші надії та страхи і те, куди все може рухатися, якщо нічого не зміниться. Дайте собі час прочитати його неквапливо.
