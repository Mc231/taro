meaningUpright: |-
  Шістка Кубків — карта пам’яті й лагідної доброти. Вона часто показує одну фігуру, що простягає іншій чашу з квітами, жест простий, щедрий і без розрахунку. Вона може нагадувати про дитинство, старих друзів, знайомі місця чи час, коли все здавалося легшим.
  У щоденному житті ця карта може відображати відновлення зв’язку з кимось із минулого, повернення до колись улюбленого хобі чи розраду в пісні, рецепті чи запаху, що переносить Вас назад. Вона може вказувати й на невеликі вияви доброти, які дарують і приймають без очікувань.
  Запрошення — дозволити минулому дати те, що воно може: тепло, перспективу, нагадування про те, ким Ви були завжди. Ностальгія може бути ресурсом, коли допомагає пам’ятати, що для Вас важливо. Можна запитати себе, яку якість із попередніх часів Ви хотіли б принести в теперішнє, як-от грайливість, цікавість чи легкість.
meaningReversed: |-
  У перевернутому положенні Шістка Кубків може натякати, що пам’ять стала місцем, де ховаються, а не місцем, яке відвідують. Можливо, Ви порівнюєте теперішнє, не на його користь, з ідеалізованою версією минулого або тримаєтеся за старі шаблони й ролі, що вже не пасують.
  Вона може вказувати й в інший бік: на готовність перерости щось зі своєї історії, лишивши стару історію позаду, щоб могла початися нова.
  Ця карта запрошує дивитися на минуле водночас із добротою і чесністю. Що насправді сталося, а що Ви додали, згадуючи? Можна зберегти те, що Вас живить, і послабити хватку там, де минуле робить Вас меншими. Дорослішати не означає втрачати ніжність; це може означати брати її з собою в рішення, що належать сьогоденню.
aspects:
  relationshipsUpright: >-
    У стосунках Шістка Кубків може відображати зустріч після розлуки, спільний спогад чи дружбу з глибоким корінням. Вона може запрошувати до грайливості й простих жестів, як-от записки, спільного частування чи старого фото, надісланого з усмішкою. Можна помітити, як спільна історія створює довіру і як Ви могли б додати нових спогадів разом.
  relationshipsReversed: >-
    У перевернутому положенні ця карта може вказувати на зв’язок, що тримається переважно на минулому, або на порівняння когось із тим, ким він колись був. Варто поміркувати, чи спілкуєтеся Ви з людиною, яка перед Вами зараз, чи з давнішим її образом. Дозвіл одне одному змінюватися може зберегти зв’язок живим і чесним.
  workUpright: >-
    У роботі ця карта може відображати повернення до того, що Вам подобалося на початку, наставництво для новішої людини чи свіже використання старих навичок. Вона може запрошувати приносити просту доброзичливість на роботу. Невеликі люб’язності, як-от запропонувати допомогу до того, як попросять, часто формують культуру більше, ніж гучні заяви.
  workReversed: >-
    У перевернутому положенні карта може відображати чіпляння за те, як усе робилося раніше, чи опір змінам, бо старий спосіб здається безпечнішим. Можна запитати себе, які традиції досі служать роботі, а які зберігаються за звичкою. Повага до минулого разом із місцем для нових підходів може полегшити перехід для всіх.
  growthUpright: >-
    Для особистісного зростання Шістка Кубків запрошує знову відчути цікавість і захват себе молодшого. Можна повернутися до заняття, яке Ви любили в дитинстві, без жодної мети, крім задоволення. Згадка про те, що колись давало відчуття легкості й неквапливості, може підказати, як проводити час тепер.
  growthReversed: >-
    У перевернутому положенні ця карта може просити оновити стару історію про себе. Можливо, ярлик із дитинства досі впливає на те, як Ви бачите свої здібності. Можна записати одне переконання з минулого й запитати, чи воно досі правдиве. Відпустивши його, Ви звільните місце для того, ким стаєте.
