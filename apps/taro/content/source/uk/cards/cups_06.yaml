imageryNote: >-
  Зображення показує дві невеликі фігури в затишному дворику чи саду: одна простягає іншій чашу, повну квітів. Інші чаші поруч, кожна з квітами, натякають на спогади, які посадили й які досі ростуть. Старий мур чи дверний проріз на тлі можуть уособлювати дім і захист знайомих місць. Теплі м’які барви передають невинність, щедрість і легку довіру давніших днів.
