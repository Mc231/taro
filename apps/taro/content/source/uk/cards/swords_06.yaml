shortUpright: >-
  Можливо, Ви рухаєтеся з бурхливої води до спокійніших берегів; зміни можуть бути тихими й повільними і все ж справжніми.
shortReversed: >-
  Щось може тримати Вас на старому березі; можна помітити, що Ви ще не готові покинути.
meaningUpright: |-
  Шістка Мечів — карта переправи. Невеликий човен перетинає воду, лишаючи позаду неспокійні хвилі й прямуючи до тихішого берега. Подорож не драматична. Вона стабільна, часом сумна, часто приносить полегшення.
  Ця карта може відображати будь-який перехід від важчого розділу до легшого: завершення складного робочого періоду, переїзд, крок назад від виснажливої ситуації чи просто відчуття, що думки починають заспокоюватися після бурі. Клинки пливуть разом із пасажирами, і це натякає, що деякі спогади й уроки їдуть із Вами. Не треба лишати все позаду, щоб рухатися вперед.
  Ця карта запрошує помітити напрямок, у якому Ви вже рухаєтеся, навіть якщо поступ здається повільним. Можна запитати себе, хто чи що допомагає Вам переправитися і чи можете Ви прийняти цю допомогу. Переходи часто поєднують полегшення з легким сумом за тим, що лишається позаду; обидва почуття можуть пливти в одному човні. Що зробило б цю переправу лагіднішою для Вас?
meaningReversed: |-
  У перевернутому положенні Шістка Мечів може відображати перехід, що затримується чи якому опираються. Можливо, Ви знаєте, що час рушати далі, але Вас стримують звичка, практичні зв’язки чи непевність щодо того, що чекає на іншому березі. Човен може бути готовий, а Ви ще на пристані.
  Інше прочитання — Ви несете забагато зі старого берега: тривоги, ролі чи очікування, що роблять переправу важчою, ніж потрібно. Іноді вона може вказувати й на коротке повернення, щоб щось завершити, перш ніж справді піти.
  Можна запитати себе, чого Вам ще бракує, щоб рушити. Інформації, підтримки, завершеності чи дозволу від самих себе? Зміни можуть зачекати, поки Ви будете готові, а готовність можна вибудовувати невеликими кроками. Що одне Ви могли б покласти, перш ніж вирушити?
aspects:
  relationshipsUpright: >-
    У стосунках ця карта може вказувати на спільне проходження важкого відтинку до спокійнішого ґрунту чи на лагідний відхід від шаблону, що вже Вам не служить. Вона може відображати й підтримку близької людини в її власному переході. Можна помітити, як тихе товариство, а не розв’язання проблем, допомагає людині почуватися менш самотньою під час переправи.
  relationshipsReversed: >-
    У перевернутому положенні Шістка Мечів може відображати складність залишити позаду стару динаміку чи перенесення минулих ран у новий розділ. Варто поміркувати, які очікування належать попереднім стосункам, а не цим. Розмова про те, що Ви обоє хочете лишити на старому березі, може зробити теперішнє легшим.
  workUpright: >-
    У роботі ця карта може натякати на поступову зміну: нову роль, змінену команду чи вихід зі стресового проєкту на стійкіший ґрунт. Перехід може не здаватися захопливим, але може принести полегшення. Можна підбити підсумок навичок і уроків, які Ви берете з собою, і відпустити звички, що належали лише бурхливій воді.
  workReversed: >-
    У перевернутому положенні ця карта може відображати зміну на роботі, яку постійно відкладають, чи незавершені завдання, що прив’язують Вас до ситуації, яку Ви хочете покинути. Можна записати, що справді треба завершити, а що можна передати. Іноді саме завершення кількох дрібниць нарешті дає човну відчалити.
  growthUpright: >-
    Для особистісного зростання Шістка Мечів запрошує шанувати повільний поступ. Віддалення від старого способу мислення часто відбувається протягом багатьох невеликих днів, а не одним сміливим стрибком. Можна помітити свідчення того, що Ви вже спокійніші чи мудріші, ніж були, і віддати собі належне за пройдену відстань.
  growthReversed: >-
    У перевернутому положенні ця карта може відображати чіпляння за знайомі шаблони, навіть коли вони вже не допомагають, чи поспіх уперед без осмислення того, що сталося. Можна зупинитися й один раз свідомо озирнутися, назвавши, що берете з собою, а що готові відпустити. А потім знову обернутися до води.
