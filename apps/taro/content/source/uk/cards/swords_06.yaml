imageryNote: >-
  На оригінальному зображенні невеликий човен ковзає зі збриженої води до тихого туманного берега. Шість клинків стоять у човні вертикально, наче тихий вантаж, а пасажир сидить обличчям уперед. Довга жердина рівномірно відштовхується від мілини. Мінлива вода показує перехід від сум’яття до спокою, клинки натякають на уроки, які везуть із собою, а жердина — на терплячий рух крок за кроком.
