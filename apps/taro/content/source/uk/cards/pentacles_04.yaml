  Зображення може показувати сидячу фігуру, що притискає одну монету до грудей, інші лежать під ногами й балансують над головою, а позаду вдалині стоїть місто. Замкнена постава може натякати на захист і самодостатність, а далекі будинки — на світ, що лишається за межами кола. Масивні, брилисті форми й закритий силует можуть підкреслювати стабільність разом із питанням, чого вона коштує.
