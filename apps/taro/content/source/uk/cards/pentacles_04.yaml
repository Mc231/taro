shortUpright: >-
  Можливо, Ви тримаєте щось близько, щоб уберегти. Помітьте, де цей захист дає опору, а де починає обмежувати.
shortReversed: >-
  Міцна хватка, можливо, слабне чи просить про це. Можна дослідити, що Ви могли б дати текти, не почуваючись у небезпеці.
meaningUpright: |-
  Четвірка Пентаклів показує когось, хто тримає свої монети близько: одну притиснуто до грудей, інші міцно стоять під ногами чи над головою. Це карта про безпеку й прагнення захистити те, що маєш, хай то гроші, час, енергія, простір чи почуття.
  У цьому є мудрість. Після періоду непевності тримати все міцно може бути розумним вибором. Ви можете впізнати це в тому, що зберігаєте частину енергії для себе, бережете розпорядок, що Вас заспокоює, чи встановлюєте межу довкола вихідних.
  Та сама постава може й задубіти. Рука, що занадто довго стискає, не може прийняти нічого нового. Карта запрошує помітити різницю між утриманням того, що важливо, і утриманням через те, що відпустити страшно. Можна запитати себе, що Ви захищаєте, що потрібно, щоб почуватися безпечно з трохи більшою відкритістю, і чи не можна частину того, що Ви бережете, розділити, витратити на радість чи дати їй змінитися.
meaningReversed: |-
  У перевернутому положенні Четвірка Пентаклів може відображати хватку, що починає слабнути. Можливо, Ви помічаєте, скільки зусиль іде на те, щоб тримати все на місці, і замислюєтеся, що буде, якщо трохи розслабитися. Це може відчуватися і звільненням, і неспокоєм.
  Карта може вказувати й на інший бік тієї самої теми: тривогу про нестачу, що проявляється як чіпляння, або, навпаки, дозвіл ресурсам вислизати без особливої уваги. Обидва варіанти можуть мати одне джерело — відчуття, що безпека крихка.
  Можна дослідити свої стосунки з поняттям «досить». Що відчувалося б достатнім у часі, грошах, увазі чи відпочинку? Невеликі експерименти зі щедрістю до себе чи інших, у власному темпі, можуть показати, де відкритість безпечна, а де межа ще служить Вам.
aspects:
  relationshipsUpright: >-
    У стосунках ця карта може відображати захисну позицію: бережете свої почуття, незалежність чи час. Здорові межі — частина цього. Можна помітити й те, чи не тримає обережність когось близького на відстані. Поділитися однією невеликою справжньою річчю про себе може перевірити, чи є в зв’язку місце для трохи більшої відкритості.
  relationshipsReversed: >-
    У перевернутому положенні карта може натякати на пом’якшення, готовність підпустити когось ближче чи перестати ретельно рахувати, хто що дав. Вона може відображати й страх утратити когось, що проявляється як контроль. Можна лагідно запитати себе, що допомогло б почуватися в безпеці, і поговорити про це, а не стискати хватку.
  workUpright: >-
    У роботі Четвірка Пентаклів може описувати обережний, захисний підхід: утримання ролі, методу чи інформації, що здаються Вашою опорою. Стабільність може бути цінною. Можна запитати себе, чи досі пасує ця обережність, чи обмін знаннями й новий підхід могли б зробити Вашу позицію сильнішою, а не слабшою.
  workReversed: >-
    Тут карта може відображати послаблення жорстких робочих звичок, делегування чи щедріше розділення заслуг. Вона може вказувати й на розпорошене використання часу чи зусиль. Можна поглянути, куди йде Ваша енергія щотижня, і свідомо вирішити, що заслуговує на дбайливий захист, а що могло б текти легше.
  growthUpright: >-
    Для особистісного зростання ця карта запрошує дослідити, що означає для Вас безпека. Дещо з того, за що Ви тримаєтеся, може бути цінними якорями; дещо — старими запобіжниками з важчих часів. Можна лагідно їх розібрати, зберігши те, що досі дає опору, і помітивши, що вже не треба так пильно стерегти.
  growthReversed: >-
    У перевернутому положенні карта може відображати дедалі більшу готовність довіряти, витрачати енергію на те, що приносить радість, чи дозволити розпорядку змінитися. Можна помітити незручність, що виникає, коли Ви послаблюєте контроль, і поставитися до неї з цікавістю. Почуватися безпечно, тримаючи речі легко, — навичка, яку можна вибудовувати поступово.
