shortUpright: >-
  Усе обертається. Ця карта запрошує помітити цикл, у якому Ви перебуваєте, і як Ви хочете з ним рухатися.
shortReversed: >-
  Знайомий шаблон може знову повертатися. Що Ви могли б зробити інакше цього разу?
meaningUpright: |-
  Колесо Фортуни — це карта циклів. Пори року змінюються, настрої піднімаються й спадають, насичені періоди змінюються тихими. Ніщо не лишається нагорі чи внизу назавжди. Ця карта нагадує, що зміни — звичайна частина життя і що частина з них поза чиїмось контролем, а частина відгукується на те, як Ви їх зустрічаєте.
  У повсякденному житті ця карта може відображати поворотний момент: один розділ закривається, а інший відкривається, щаслива нагода змінює Ваші плани або несподівана перешкода змінює темп. Вона може вказувати й на впізнавання шаблону, який уже траплявся, наприклад, коли ситуація того самого типу приходить у новій формі, і на погляд на нього свіжими очима.
  Ця карта запрошує Вас поміркувати, де Ви зараз перебуваєте на власному колесі. Можна запитати себе, чого вимагає від Вас цей етап і чого він може навчити. Колесо не вирішує Ваше життя за Вас. Воно підкреслює, що гнучкість, перспектива й почуття гумору можуть допомогти проходити повороти і що важка пора — це пора, а не постійний стан.
meaningReversed: |-
  У перевернутому положенні Колесо Фортуни може відображати відчуття, що Ви застрягли в колі або опираєтеся змінам, які вже відбуваються. Вам може здаватися, що події стаються з Вами, або Ви помічаєте, що той самий неприємний шаблон знову повертається в іншому вбранні.
  Ця карта може вказувати й на те, що Ви міцно тримаєтеся за добрий етап, боячись, що він не триватиме. Чіпляння робить природний поворот важчим.
  Можливо, варто подивитися, що у Вашій владі. Шаблони часто повторюються, доки щось у тому, як ми реагуємо, не зміниться хоч трохи. Може допомогти назвати цикл, який Ви бачите, без звинувачень помітити свою роль у ньому й обрати одну дрібницю, яку зробите інакше. Зупинити колесо Ви не можете, але можете знайти на ньому твердішу опору.
aspects:
  relationshipsUpright: >-
    У стосунках Колесо може відображати новий етап: зближення, перехід на інший рівень чи просто пристосування до обставин, що змінюються. Воно може запрошувати лишатися гнучкими й відкрито говорити про те, як усе змінюється. Стосунки, як і пори року, мають свої ритми, і якщо їх назвати, легше проходити їх разом.
  relationshipsReversed: >-
    У перевернутому положенні ця карта може вказувати на знайомі конфлікти, що повертаються, або на опір тому, що стосунки змінюють форму. Варто поміркувати, який шаблон Ви з кимось близьким схильні повторювати і що кожен із Вас міг би спробувати інакше. Зміни не обов’язково означають втрату; вони можуть означати зростання.
  workUpright: >-
    У роботі чи проєкті Колесо підкреслює мінливі обставини й нові можливості. Воно може відображати зміну планів, нову команду чи проєкт, що раптом зрушує з місця. Можна пильнувати нагоди, пам’ятаючи, що кожен етап, насичений чи повільний, має що запропонувати.
  workReversed: >-
    У перевернутому положенні Колесо може відображати роздратування через затримки або відчуття, що зусилля не окуповуються. Воно може вказувати й на повторення того самого підходу з очікуванням іншого результату. Можна переглянути, що працювало раніше, що ні, і де невелика зміна методу могла б зрушити шаблон.
  growthUpright: >-
    Бачити своє життя як низку циклів, а не одну пряму лінію, може звільняти. Якщо помічати власні ритми, як-от коли Ви сповнені енергії, а коли потребуєте відпочинку, можна планувати разом із ними, а не всупереч їм. Можна накреслити мапу минулого року й помітити його поворотні моменти.
  growthReversed: >-
    У перевернутому положенні Колесо може питати, чи не намагаєтеся Ви контролювати те, що контролювати неможливо. Воно може відображати бажання певності в мінливий час. Можна потренуватися відпускати одну річ, на яку не маєте впливу, і спрямовувати цю енергію на одну, на яку маєте.
