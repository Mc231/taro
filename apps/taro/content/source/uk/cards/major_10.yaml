imageryNote: >-
  Колесо Фортуни Taro постає великим колесом, що обертається на тлі неба, яке переходить від світанку з одного краю до ночі з іншого, показуючи всі фази водночас. На його ободі їдуть маленькі фігурки й істоти, одні піднімаються, інші спускаються, і жодна не стоїть на місці. Символи чотирьох пір року в кутах можуть обрамлювати ідею природних циклів. У маточині — спокійний, нерухомий центр, що натякає на стійку перспективу, яку можна знайти, навіть коли все обертається.
