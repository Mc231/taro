imageryNote: >-
  Вісім жезлів мчать навскіс широким небом, паралельно, у польоті, над лагідним краєвидом із річкою чи дорогою внизу. У сцені немає людей, лише рух. Спільний кут натякає на енергію, спрямовану в один бік, відкрите небо — на ясний шлях, а річка внизу — на стабільний плин подій. Відсутність фігур запрошує глядача відчути рух, а не спостерігати за чужою історією.
