  growthUpright: >-
    Для особистісного зростання ця карта запрошує помічати, коли енергія тече легко і що це уможливлює. Можливо, це ясна мета, певна пора дня чи підтримувальне оточення. Можна якийсь час довіритися цьому потоку й побачити, скільки всього може відбутися, коли зусилля й напрямок збігаються.
  growthReversed: >-
