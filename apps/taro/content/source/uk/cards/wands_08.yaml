  workUpright: >-
    У роботі чи навчанні Вісімка Жезлів може вказувати на продуктивний етап: завдання рухаються, погодження надходять, проєкт пришвидшується. Можна зосередитися на кількох речах, що підтримують розгін, і оперативно відповідати на повідомлення. Ясні пріоритети допомагають швидкості ставати поступом, а не мішаниною діяльності.
  workReversed: >-
