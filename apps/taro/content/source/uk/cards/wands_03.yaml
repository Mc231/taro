shortUpright: >-
  Те, що Ви запустили, починає свою подорож; можна стежити, що повертається, і готуватися до наступного етапу.
shortReversed: >-
  Поступ може здаватися повільнішим, ніж Ви сподівалися; можливо, час переглянути очікування, а не здаватися.
meaningUpright: |-
  Якщо Двійка Жезлів була про планування, то Трійка Жезлів показує плани, що вже в русі. Кораблі, так би мовити, вийшли з гавані: повідомлення надіслано, заявки подано, перші кроки зроблено. Тепер настає час дивитися на обрій, поки події розгортаються поза Вашим безпосереднім контролем.
  Ця карта може відображати приємне відчуття перших успіхів: проєкт здобуває перших прихильників, нова звичка вкорінюється, співпраця сягає далі, ніж Ви чекали. Вона може підкреслювати й цінність підготовки: Ви заклали досить підґрунтя, щоб відступити й подивитися далі вперед.
  Запрошення тут — тримати дві речі водночас: упевненість у тому, що Ви почали, і відкритість до того, як це розвиватиметься. Можна помітити, де Ваші зусилля починають поєднуватися з іншими людьми, і поміркувати, чого може вимагати наступний етап. Розширення часто потребує нових навичок, нових партнерів чи трохи ширшої картини того, що Ви будуєте.
meaningReversed: |-
  У перевернутому положенні Трійка Жезлів може відображати очікування, що перетворилося на неспокій. Можливо, Ви зробили роботу, а віддачі майже не бачите, або результати виглядають інакше, ніж Ви уявляли. Повільність легко сприйняти як невдачу, навіть коли все просто потребує часу.
  Іноді ця карта вказує й на вузький погляд: зосередженість на одному результаті, за якою не видно дрібніших ознак руху довкола, або планування так далеко наперед, що теперішнє здається порожнім.
  Можливо, це слушна мить, щоб поглянути на свої очікування. Чи були Ваші терміни реалістичними? Чи бракує Вам якоїсь інформації, чи є партнер, якого Ви ще не попросили про допомогу? Можна скоригувати план, не відмовляючись від нього, і помітити поступ, що вже тихо відбувся.
aspects:
  relationshipsUpright: >-
    У близьких стосунках ця карта може відображати зв’язок, що виростає за межі першого розділу: більше довіри, нові спільні плани чи відкритість до того, щоб залучати інших людей. Вона може запрошувати оцінити, який шлях Ви вже пройшли разом, і поговорити, куди хотіли б рушити далі, лишаючи місце для власного обрію кожного.
  relationshipsReversed: >-
    У перевернутому положенні Вам може здаватися, що Ви чекаєте, поки хтось піде назустріч, або що стосунки розвиваються не в тому темпі, на який Ви сподівалися. Може допомогти відкрито поділитися очікуваннями, а не мовчки міряти поступ. Також можна запитати, на що сподівається інша людина, адже Ваші терміни можуть просто різнитися.
  workUpright: >-
    У роботі чи навчанні Трійка Жезлів може вказувати на проєкти, що здобувають ширше охоплення: запуск, комунікацію назовні, співпрацю між командами чи місцями. Можна поміркувати, як підтримати цей розгін, наприклад нагадати про себе, розширити коло контактів чи підготуватися до наступної фази заздалегідь, щоб власний поступ не застав Вас зненацька.
  workReversed: >-
    У перевернутому положенні результати можуть з’являтися повільно, або план натрапив на затримки, які Ви не могли контролювати. Замість тиснути сильніше в тому самому напрямку, можна переглянути, чого Ви вже навчилися, і скоригувати маршрут. Розмова із залученими людьми може виявити перешкоди чи тихі успіхи, яких легко не помітити з Вашого місця.
  growthUpright: >-
    Довіра до зусиль, які Ви вже доклали, — тихий різновид зростання. Після перших кроків зростання часто триває поза полем зору. Можна озирнутися туди, звідки Ви почали кілька місяців тому, помітити, що змінилося, а потім із цим ширшим поглядом обрати, що хочете дослідити далі.
  growthReversed: >-
    У перевернутому положенні нетерплячість до себе може затуляти Вам справжній поступ. Можна дослідити, де Ви чекаєте миттєвих змін, а де повільніший ритм був би добрішим. Простий запис невеликих кроків може допомогти побачити зростання, коли обрій ще здається порожнім.
reflectionQuestions:
  - "Що Ви вже запустили і що заслуговує на мить визнання?"
  - >-
    Хто міг би допомогти Вам побачити далі, ніж видно з того місця, де Ви зараз?
  - >-
    Як Ви могли б уже зараз підготуватися до наступного етапу того, що почали?
imageryNote: >-
  Фігура стоїть на пагорбі чи на краю скелі, частково обернувшись спиною; три жезли встромлено довкола неї, ніби позначки докладених зусиль, а вона стежить за човнами чи мандрівниками, що рухаються відкритою водою чи рівниною внизу. Раннє світло може натякати на початок нового етапу. Далекий рух уособлює плани, що вже здійснюються, а стійка постава — терплячу впевненість, поки результати ще в дорозі.
