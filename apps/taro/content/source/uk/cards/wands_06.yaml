imageryNote: >-
  Вершник на спокійному коні рухається крізь невеликий натовп, тримаючи жезл, увінчаний вінком із листя. Інші підняті жезли обрамлюють шлях, ніби почесна варта. Вінок уособлює визнання, здобуте зусиллями, спокійний кінь — упевненість, що її вишколено, а не поквапом здобуто, а фігури довкола — спільноту, яка поділяє й підтримує досягнення.
