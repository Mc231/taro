shortUpright: >-
  Ваші зусилля, можливо, помічають; дозвольте собі прийняти трохи визнання й помітьте, хто допоміг Вам дійти сюди.
shortReversed: >-
  Визнання може бракувати або воно тішить менше, ніж хотілося; можна запитати, що означає успіх саме для Вас.
meaningUpright: |-
  Шістка Жезлів — карта визнання. Після тертя П’ятірки вперед їде вершник із вінком на жезлі, а люди обабіч шляху ніби вітають його. Вона схоплює мить, коли зусилля стають видимими й інші їх визнають.
  Це може виглядати як добрий відгук на роботу, у яку Ви вклали себе, друг, який каже, що захоплюється тим, як Ви з чимось упоралися, чи подоланий виклик, у здатності впоратися з яким Ви колись сумнівалися. Це може бути й тихіша впевненість: Ви стоїте трохи рівніше, бо знаєте, що впоралися добре.
  Ця карта запрошує приймати вдячність, не відмахуючись від неї. Визнання може наповнювати енергією й давати сміливість для наступного кроку. Водночас фігуру оточують люди, і це нагадує, що мало які досягнення цілком одноосібні. Можна насолодитися миттю й водночас поміркувати, хто Вас підтримував і як Ви могли б розділити частину заслуг.
meaningReversed: |-
  У перевернутому положенні Шістка Жезлів може відображати зусилля, що лишилися непоміченими, або похвалу, яка ніби не доходить до Вас. Можливо, Ви чогось досягли, але досі відчуваєте, що це не рахується, доки хтось інший цього не скаже. Вона може вказувати й на втому від того, що Ви граєте впевненість, якої цілком не відчуваєте.
  Іноді ця перевернута карта описує тихий успіх, значущий для Вас, навіть якщо інші його не бачать. Такий поступ теж важить.
  Можливо, це мить поглянути, наскільки Ваше відчуття цінності залежить від оплесків. Як це — першими визнати власні зусилля? Можна записати, чим пишаєтеся, зокрема тим, чого ніхто не бачив, і дозволити цьому стати стійкішим джерелом підбадьорення, ніж зовнішнє схвалення.
aspects:
  relationshipsUpright: >-
    У стосунках ця карта може відображати вдячність в обидва боки: гордість за когось близького або відчуття, що він Вас бачить і підтримує. Вона може запрошувати вголос радіти перемогам одне одного. Можна сказати другові, партнерові чи родичеві, чим Ви в ньому захоплюєтеся, і дозволити собі прийняти його підбадьорення у відповідь.
  relationshipsReversed: >-
    У перевернутому положенні Вам може здаватися, що Ваші зусилля в стосунках лишаються непоміченими або що визнання перетворилося на тихе змагання. Варто поміркувати, чи не сказати ясно, яка вдячність для Вас важлива, і запитати про те саме іншу людину. Невелика конкретна подяка часто змінює настрій більше, ніж гучні жести.
  workUpright: >-
    У роботі чи навчанні Шістка Жезлів може вказувати на видимі результати: позитивний відгук, добре сприйнятий проєкт, нагоду представити зроблене. Можна скористатися цією впевненістю, щоб відкритіше ділитися ідеями, водночас віддаючи належне людям, які долучилися. Щедро розділене визнання зазвичай робить команди сильнішими.
  workReversed: >-
    У перевернутому положенні Ваш внесок може здаватися непоміченим, або успіх надто залежить від того, як усе виглядає ззовні. Можна спокійно й фактично зробити свою роботу помітнішою, наприклад коротким підсумком зробленого, а також поміркувати, які результати важливі для Вас незалежно від того, хто їх помітить.
  growthUpright: >-
    Для особистісного зростання ця карта запрошує дозволити собі відчути гордість. Визнання власного поступу може будувати впевненість, що переноситься на наступний виклик. Можна вести короткий список того, з чим Ви нещодавно добре впоралися, щоб повертатися до нього в дні, коли впевненості менше.
  growthReversed: >-
    У перевернутому положенні невпевненість у собі чи потреба у схваленні можуть притлумлювати відчуття досягнення. Можна дослідити, звідки взялося Ваше уявлення про успіх і чи воно досі Вам пасує. Визначивши успіх власними словами, Ви можете зробити визнання від інших приємним доповненням, а не тим, від чого залежите.
