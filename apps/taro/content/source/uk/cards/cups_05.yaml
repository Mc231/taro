imageryNote: >-
  Зображення показує фігуру в плащі зі схиленою головою над трьома перекинутими чашами, вміст яких вбирається в землю. Позаду фігури дві чаші стоять рівно, і їх легко не помітити. Стежка чи переправа вдалині можуть натякати на шлях далі, коли настане час. Прохолодні приглушені тони виражають скорботу, а тонка смужка світла на чашах, що стоять, натякає, що не все втрачено.
