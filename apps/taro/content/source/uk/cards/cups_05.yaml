meaningUpright: |-
  П’ятірка Кубків показує фігуру, що дивиться вниз на перекинуті чаші, тоді як інші стоять позаду неї. Це карта розчарування й горя: відчуття, що щось склалося не так, як Ви сподівалися, і тяжіння лишатися з тим, що втрачено.
  Це тяжіння людське. Коли план зривається, дружба змінюється чи очікування не справджується, потрібен час, щоб це прийняти. Ця карта не просить поспішати. Скорбота — частина небайдужості, а назвати втрату може бути способом її вшанувати.
  У повсякденному житті ця карта може відображати прокручування розмови в голові, перебирання того, що можна було зробити інакше, чи складність тішитися чимось через те, чого бракує. Вона лагідно запрошує, коли будете готові, трохи обернутися й помітити те, що не перекинулося: стосунки, сильні сторони чи можливості, які досі є. Обидві речі можуть бути правдою водночас: і втрата, і те, що лишилося.
meaningReversed: |-
  У перевернутому положенні П’ятірка Кубків може відображати повільне повернення стійкості після розчарування. Можна помітити, що втрата болить уже не так гостро або що Ви можете говорити про неї, і вона не заповнює весь день. Прийняття не означає вдавати, що це не мало значення; воно означає знайти місце, щоб нести це поруч з іншим.
  Ця карта може вказувати й на те, що прощення, когось іншого чи себе, стає трохи можливішим. Або вона може натякати, що горе відклали, замість прожити, і воно просить тихішої миті уваги.
  Можна запитати себе, чого навчив Вас цей досвід і що Ви хочете взяти далі. Звернутися до того, що лишилося, — не зрада того, що втрачено. Якщо важкі почуття не минають, поділитися ними з людиною, якій довіряєте, може полегшити ношу.
aspects:
  relationshipsUpright: >-
    У стосунках ця карта може відображати смуток через зв’язок, що змінився, надію, яка не справдилася, чи слова, що поранили. Вона може запрошувати визнати це почуття, а не відмахуватися від нього. Можна помітити й людей, які лишилися поруч у скруті, і сказати їм, як багато це для Вас означає.
  relationshipsReversed: >-
    У перевернутому положенні карта може відображати рух до примирення чи до миру з тим, як змінилися стосунки. Можливо, Ви готові відпустити давню образу або принаймні тримати її легше. Подумайте, як виглядало б прощення для Вас, пам’ятаючи, що воно не вимагає приймати те, що здається неправильним.
  workUpright: >-
    У роботі П’ятірка Кубків може відображати розчарування через проєкт, що застиг, відгук, який зачепив, чи нагоду, що дісталася комусь іншому. Вона може запрошувати дати собі мить, щоб це пережити, перш ніж планувати наступний крок. Потім можна записати навички, стосунки й ідеї, на які Ви досі можете спиратися.
  workReversed: >-
    У перевернутому положенні карта може відображати відновлення після невдачі й поступове бачення нових варіантів. Можна помітити, що двері, за якими Ви сумували, залишили місце для чогось іншого. Подумайте, чи не написати короткий огляд того, що сталося, зосереджуючись на уроках, а не на звинуваченнях, щоб рушити далі з більшою ясністю.
  growthUpright: >-
    Горе й жаль заслуговують на місце у Вашій історії, і ця карта питає, як дати їм це місце, не дозволяючи їм писати решту. Можна вправлятися помічати, коли увага знову й знову повертається до того, що пішло не так. Лагідне розширення погляду, хай на кілька хвилин щодня, може полегшити бачення всієї картини.
  growthReversed: >-
    У перевернутому положенні П’ятірка Кубків може відображати стійкість, що зростає після важкого часу. Можна помітити новий погляд чи глибше співчуття, які подарував цей досвід. Позначити зміну невеликим ритуалом, як-от листом, який не надсилатимете, може допомогти закрити один розділ і відкрити наступний.
