imageryNote: >-
  Сонце Taro постає широким літнім полем опівдні, де друзі різного віку діляться їжею на ковдрі під величезним теплим сонцем. Повітряні змії здіймаються на вітерці, а довгих тіней ніде не видно, що натякає на мить, коли нічого ховати. Яскраво-жовті й теплі помаранчеві барви наповнюють сцену, а пес, що біжить травою, додає ноту гри. Зображення запрошує глядача відчути тепло, ясність і просту радість.
