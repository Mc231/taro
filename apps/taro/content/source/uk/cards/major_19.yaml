shortUpright: >-
  Мить тепла й ясності. Ця карта запрошує насолодитися тим, що є світлим і відкритим у Вашому житті.
shortReversed: >-
  Світло нікуди не зникло, навіть якщо пропливають хмари. Що допомагає Вам відчувати тепло й ясність?
meaningUpright: |-
  Сонце — одна з найвідкритіше радісних карт колоди. Це енергія ясного ранку, дитини, що грається в саду, відчуття, що Ви цілком є собою й не мусите ховатися. Після непевності Місяця ця карта приносить ясність: речі видно такими, якими вони є, і часто вони простіші й тепліші, ніж здавалося зі страху.
  У повсякденному житті ця карта може відображати день, коли все трохи легше, гордість за щось, що Ви зробили, час надворі, який піднімає настрій, або стосунки, у яких Вас приймають і Вам легко. Вона може вказувати на впевненість, якій не треба кричати, і на прості радощі, від яких життя здається добрим: сміх, сонце, гру.
  Ця карта запрошує Вас поміркувати, що приносить Вам справжню радість і як дати їй більше місця. Можна запитати себе, де Ви могли б дозволити собі бути баченими повніше. Сонце підкреслює оптимізм, що спирається на теперішню мить, нагадуючи, що цілком нормально тішитися тим, що йде добре, ділитися своїм теплом і дозволяти йому повертатися до Вас.
meaningReversed: |-
  У перевернутому положенні Сонце може відображати час, коли радість здається трохи приглушеною. Тепло не зникло; воно просто може ховатися за щільним розкладом, утомою чи невпевненістю в собі. Можливо, Вам складніше, ніж зазвичай, тішитися добрими моментами чи пишатися собою.
  Ця карта може вказувати й на надмір яскравості: усміхнене обличчя, коли насправді почуваєтеся інакше, або вимогу до себе постійно бути позитивними.
  Можливо, варто пошукати невеликі прості джерела тепла: час надворі, грайливе заняття чи людину, з якою Ви смієтеся. Також може допомогти дозволити собі відчувати те, що Ви насправді відчуваєте, а не те, що, на Вашу думку, слід. Справжня радість часто легше повертається, коли її не змушують.
aspects:
  relationshipsUpright: >-
    У стосунках Сонце може відображати тепло, відкритість і спільне щастя. Воно може запрошувати насолоджуватися простим часом із людьми, які Вам дорогі: сміятися, гратися, бути надворі. Стосунки можуть ставати легшими, коли обоє почуваються вільними бути собою й радіти одне одному.
  relationshipsReversed: >-
    У перевернутому положенні ця карта може вказувати на стосунки, що втратили частину легкості, можливо, під тиском стресу чи рутини. Варто поміркувати, чи не запланувати щось просте й веселе разом або чи не ховає хтось справжні почуття за усміхненою поверхнею. Легкість може повертатися через невеликі спільні моменти.
  workUpright: >-
    У роботі чи проєкті Сонце підкреслює ясність, помітність і ентузіазм. Воно може відображати мить, коли Ваші зусилля визнають, або коли робота наповнює енергією, а не виснажує. Можна впевнено ділитися ідеями й дозволяти собі тішитися поступом дорогою.
  workReversed: >-
    У перевернутому положенні Сонце може відображати відчуття, що Вас не помічають, або складність знайти ентузіазм для своєї роботи. Воно може вказувати й на надмірну видимість, як-от сильний тиск показувати результати. Можна запитати себе, яка невелика зміна додала б Вашим робочим дням більше енергії й тепла.
  growthUpright: >-
    Для особистісного зростання ця карта запрошує знову відчути свій природний ентузіазм і цікавість. Можна повернутися до чогось, що Ви любили в дитинстві, або спробувати щось нове просто для задоволення. Упевненість може зростати з радості так само, як і з досягнень.
  growthReversed: >-
    У перевернутому положенні Сонце може питати, чи не були Ви надто суворі до себе чи надто серйозні надто довго. Воно може відображати потребу в грі, відпочинку й легкості. Можна запланувати цього тижня одне невелике радісне заняття без жодної мети, крім насолоди ним.
reflectionQuestions:
