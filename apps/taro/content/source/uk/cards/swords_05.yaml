shortUpright: >-
  Суперечку можна виграти, втративши щось інше; можна запитати, чого насправді коштувала перемога.
shortReversed: >-
  Конфлікт, можливо, готовий охолонути; може знайтися місце, щоб відпустити потребу мати рацію заради миру.
meaningUpright: |-
  П’ятірка Мечів дивиться на конфлікт уже після нього. Хтось зібрав клинки й заявив про свою перемогу, а інші йдуть геть, обернувшись спиною. Питання, яке ставить карта, — не хто переміг, а чого була варта перемога.
  Ви можете побачити цю карту в незгоді, де довели свою правоту, але атмосфера охолола, у груповому чаті, що став різким, чи в ситуації, де Ви поступилися, аби лише покласти край напрузі. Вона може відображати гордість, бажання сказати останнє слово чи неприємне відчуття, що сказали більше, ніж мали на увазі. Вона може вказувати й на інший бік: відчуття, що Вас переважили, і рішення піти.
  Ця карта запрошує поміркувати, які битви справді важливі для Вас. Обстоювати свої цінності важливо; не кожне зіткнення варте однакової енергії. Можна помітити, що Ви відчуваєте, коли суперечка закінчується: задоволення, самотність, полегшення, жаль. Це почуття може підказати, як підходити до наступної незгоди і чи варто відбудовувати деякі мости.
meaningReversed: |-
  У перевернутому положенні П’ятірка Мечів може відображати конфлікт, що втрачає жар. Люди, можливо, готові скласти свої позиції, або Ви відчуваєте бажання загладити провину після суперечки, що зайшла задалеко. Примирення може початися з простого визнання.
  Інше прочитання — образа, що не минає: незгода офіційно скінчилася, але досі прокручується в голові, чи відчуття незавершеності, що забарвлює нові розмови.
  Можна запитати себе, як виглядало б тут відпускання. Воно не обов’язково означає згоду, лише рішення не нести суперечку далі. Іноді піти геть — тиха форма сили; іноді — простягнути руку. Що допомогло б Вам відчути спокій щодо того, як усе лишилося?
aspects:
  relationshipsUpright: >-
    У стосунках ця карта може відображати суперечку, де мати рацію стало важливіше, ніж бути близькими. Можна помітити шаблони ведення рахунку чи потреби в останньому слові, у себе чи в інших. Може допомогти запитати, що насправді намагався захистити кожен. Розуміння цієї потреби може перетворити розмову зі змагання на спільне завдання.
  relationshipsReversed: >-
    У перевернутому положенні П’ятірка Мечів може вказувати на відновлення після розриву чи на напругу, що досі тліє під ввічливими словами. Варто поміркувати, чи не полегшили б ситуацію вибачення, з’ясувальна розмова чи просто трохи доброти. Якщо зв’язок постійно повертається до тієї самої суперечки, варто дослідити, що знову й знову її розпалює.
  workUpright: >-
    У роботі ця карта може відображати конкуренцію чи напругу в колективі: привласнені заслуги, відкинуті ідеї чи дебати, після яких лишилися синці. Можна запитати себе, чи допомагає Ваша перемога спільній меті. Співпраця іноді вимагає відпустити певний пункт, щоб робота могла рухатися. Вибір битв може зберегти і Вашу енергію, і робочі стосунки.
  workReversed: >-
    У перевернутому положенні ця карта може вказувати на очищення атмосфери після робочого тертя чи на рішення відійти від виснажливої суперечки. Можна помітити, чи не впливає давній конфлікт на те, як Ви спілкуєтеся з колегою. Коротка спокійна розмова, зосереджена на майбутньому, може дати більше, ніж пережовування того, хто мав рацію.
  growthUpright: >-
    Для особистісного зростання П’ятірка Мечів запрошує поглянути на свої стосунки з перемогою й поразкою. Що збурює у Вас конфлікт: потребу довести себе, страх, що Вас не помітять? Можна вправлятися робити паузу перед відповіддю в гарячу мить, даючи собі подих, щоб обрати слова, а не реагувати.
  growthReversed: >-
    У перевернутому положенні ця карта може відображати відпускання давньої образи чи бажання прокручувати минулі суперечки. Відпустити може здаватися поразкою, але часто це звільняє енергію для того, що Вам важливо зараз. Можна записати, що Ви сказали б, якби могли, а потім вирішити, чи це треба казати вголос, чи просто покласти.
reflectionQuestions:
