imageryNote: >-
  Оригінальне зображення показує обвітрений берег під розірваними хмарами, що швидко пливуть. Одна фігура недбало тримає три клинки й озирається, а ще два клинки лежать на піску. Дві інші фігури йдуть геть до води. Розкидані клинки натякають на нерозв’язані суперечки, а обернені спини — на дистанцію, створену конфліктом. Неспокійне небо відображає розум, що досі збурений, хоча слова вже стихли.
