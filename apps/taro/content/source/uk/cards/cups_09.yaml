imageryNote: >-
  Зображення показує фігуру, що невимушено сидить, розслабивши плечі, а довкола на низьких столиках і подушках розставлено дев’ять повних чаш, наче в кімнаті, приготованій для гостей. Її відкритий, вдоволений вираз обличчя натякає на насолоду й упевненість у собі. Насичені, але теплі барви, можливо, глибокі червоні й золоті, можуть викликати відчуття затишку й гостинності, лагідне нагадування про надію, що набула певної форми.
