meaningUpright: |-
  Дев’ятку Кубків часто називають картою бажань. Вона показує фігуру, якій легко серед повних чаш і яка явно тішиться тим, що має. Вона говорить про задоволеність: відчуття «досить», здійсненого бажання чи надії, що до чогось привела.
  Ця карта запрошує помічати вдоволення, коли воно є, а не одразу рушати до наступної мети. Можливо, Ви завершили те, над чим наполегливо працювали, насолодилися добрим обідом із приємними людьми чи просто на мить відчули легкість у своєму житті. Такі переживання варто смакувати.
  Вона може запрошувати й поміркувати, чого Ви справді бажаєте. Якби можна було наповнити ще одну чашу, що в ній було б? Ясне знання своїх бажань може впливати на рішення невеликими практичними способами. Насолода й затишок — частина повного життя. Вдячність у цьому сенсі не про те, що Ви мусите бути щасливими; вона про те, щоб помічати вже добре й дозволяти йому важити.
meaningReversed: |-
  У перевернутому положенні Дев’ятка Кубків може відображати розрив між тим, як усе виглядає, і тим, як відчувається. Можливо, Ви маєте те, чого, як думали, хотіли, і все одно відчуваєте, що чогось бракує. Або насолода могла перейти в надмір, коли затишок стає способом уникати почуттів, а не тішитися життям.
  Вона може звертатися й усередину, натякаючи, що тривала задоволеність менше залежить від речей чи досягнень і більше — від Ваших стосунків із собою.
  Ця карта запрошує до чесних роздумів. Що Ви чекали від цього бажання і що воно насправді принесло? Можна шукати вдоволення в цінностях, зв’язках і сенсі, а не лише в результатах. Невеликі щирі радощі, дбайливо обрані, можуть дати більше, ніж накопичення. Хотіти чогось — нормально; питання в тому, що відчувалося б як «досить».
aspects:
  relationshipsUpright: >-
    У стосунках Дев’ятка Кубків може відображати задоволеність і легкість із людьми довкола. Вона може запрошувати насолоджуватися зв’язком таким, яким він є, ділитися радощами й казати, що Ви цінуєте. Можна помітити, як для Вас виглядає зв’язок, що наповнює, щоб плекати його свідомо, а не випадково.
  relationshipsReversed: >-
    У перевернутому положенні ця карта може вказувати на очікування, що стосунки забезпечать усю Вашу задоволеність, або на відчуття, що чогось бракує попри зовнішню гармонію. Можна дослідити, які потреби Ви могли б задовольнити самі і про що хотіли б відкритіше попросити когось близького.
  workUpright: >-
    У роботі ця карта може відображати вдоволення досягненням, визнання зусиль чи просту радість від того, що Ви робите. Вона може запрошувати зупинитися й визнати поступ, якого Ви досягли. Відзначення віхи, хай навіть наодинці, може відновити енергію для того, що буде далі, і нагадати, чому робота важлива.
  workReversed: >-
    У перевернутому положенні карта може відображати успіх, що здається порожнім, чи гонитву за ознаками досягнень, які не відображають Ваших цінностей. Можна запитати себе, що зробило б Вашу роботу змістовною, а не лише вражаючою. Узгодження цілей із цінностями може перетворити досягнення на справжнє вдоволення.
  growthUpright: >-
    Для особистісного зростання Дев’ятка Кубків запрошує до практики вдячності й насолоди. Можна завершувати кожен день, занотовуючи три речі, які були приємними, хай навіть дрібні. З часом це може привчити увагу до задоволеності й полегшити розпізнавання моменту, коли маєте досить.
  growthReversed: >-
    У перевернутому положенні ця карта може просити розглянути різницю між насолодою й наповненістю. Можна помітити звички споживання, зайнятості чи порівняння, після яких хочеться ще. Дослідження того, що приносить глибоке вдоволення, а не швидкий підйом, може підказати лагідніші й триваліші рішення.
