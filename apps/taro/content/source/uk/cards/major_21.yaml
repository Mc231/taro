meaningUpright: |-
  Світ — остання карта Старших арканів, кінець подорожі, що почалася з Блазня. Це карта завершеності й цілісності: відчуття, що частини склалися докупи, цикл прожито і Ви, принаймні цієї миті, удома в історії, яку прожили досі.
  У повсякденному житті ця карта може відображати завершення довгого проєкту, досягнення мети, до якої Ви йшли, або просто відчуття, що Вам добре у своєму житті й тілі. Вона може вказувати на інтеграцію: поєднання уроків багатьох переживань, легких і важких, у відчуття того, хто Ви є. Причетність тут може означати належність до спільноти, місця чи самих себе.
  Ця карта запрошує Вас поміркувати, чого Ви досягли, і відсвяткувати це. Можна запитати себе, як Ви змінилися відтоді, як почався цей цикл, і що хотіли б узяти з собою в наступний. Світ підкреслює, що завершення — не кінець у сенсі зупинки. Це мить повноти перед початком нової подорожі.
meaningReversed: |-
  У перевернутому положенні Світ може відображати цикл, що майже, але не зовсім завершений. Кілька невирішених дрібниць, невимовлене прощання чи останнє завдання можуть заважати Вам відчути завершеність. Можливо, Ви відчуваєте готовність рухатися далі, а щось усе ще тримає Вас на місці.
  Ця карта може вказувати й на пошук завершення деінде: на обхідні шляхи чи надію, що інші все за Вас доведуть до кінця.
  Можливо, варто визначити одну-дві речі, які допомогли б Вам відчути завершеність. Це може бути практичне завдання, яке варто закінчити, подяка комусь, визнання розчарування або просто визнання того, який шлях Ви пройшли. Свідомо зроблений останній крок може перетворити майже-завершення на справжнє.
aspects:
  relationshipsUpright: >-
    У стосунках Світ може відображати відчуття наповненості й взаєморозуміння, ніби зв’язок набув своєї повної форми. Він може запрошувати оцінити те, що Ви збудували разом, і відзначити спільні віхи. Стосунки тут відчуваються цілісними, з місцем і для близькості, і для особистої свободи.
  relationshipsReversed: >-
    У перевернутому положенні ця карта може вказувати на щось нерозв’язане у стосунках, недомовлену розмову чи незакритий розділ. Варто поміркувати, що допомогло б Вам обом відчути спокій, хай це означатиме щось сказати чи прийняти, що вже сказано.
  workUpright: >-
    У роботі чи проєкті Світ підкреслює завершення й визнання. Він може відображати закінчення вагомої роботи, досягнення віхи чи відчуття, що Ваша роль Вам добре пасує. Можна знайти час, щоб визнати, чого досягли Ви й інші, перш ніж братися за наступне.
  workReversed: >-
    У перевернутому положенні Світ може відображати проєкт, що застряг на останньому етапі, чи відчуття, що фінішна лінія ніяк не досягається. Можна записати, що лишилося, і вирішити, чи це справді треба робити, чи можна відпустити. Невеликі зосереджені зусилля можуть допомогти охайно все завершити.
  growthUpright: >-
    Перш ніж тягнутися до наступної мети, варто визнати, який шлях Ви вже пройшли. Можна поміркувати над уроками, викликами й радощами нещодавнього розділу й помітити, як вони складаються в повнішу картину Вас самих. Інтеграція — тихий різновид досягнення.
  growthReversed: >-
    У перевернутому положенні Світ може питати, чого Вам бракує, щоб відчути завершеність. Він може відображати неспокій чи відчуття незавершеності. Можна назвати одну справу, яку давно збиралися закінчити, приділити їй усю увагу, а потім помітити, як це — замкнути це коло.
reflectionQuestions:
  - "Який цикл у Вашому житті, здається, замикається?"
  - >-
    Кому Ви хотіли б подякувати за допомогу на шляху туди, де Ви зараз?
  - >-
    Який останній крок допоміг би Вам відчути, що щось справді завершено?
imageryNote: >-
  Світ Taro постає фігурою, що танцює всередині великого овального вінка з листя й квітів усіх пір року, вільно рухаючись у центрі зоряного неба. Довкола вінка чотири невеликі емблеми вогню, води, повітря й землі позначають краї сцени, натякаючи на рівновагу й цілісність. Стрічка, що тягнеться з руки танцівника, закручується назад туди, звідки почалася, запрошуючи глядача відчути прибуття й подорож, що замкнула коло.
