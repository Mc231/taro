shortUpright: >-
  Можливо, Ви тримаєте позицію, важливу для Вас; ця карта шанує мужність, потрібну, щоб стояти твердо.
shortReversed: >-
  Захищати все й одразу виснажливо; можна обрати, яку позицію справді варто тримати.
meaningUpright: |-
  Сімка Жезлів показує когось на підвищенні, хто одним жезлом стримує кілька, що здіймаються знизу. Позиція непроста, але дає перевагу. Ця карта про переконаність: обстоювати те, у що віриш, захищати те, над чим працював, або втримувати рівновагу, коли інші тиснуть.
  Вона може з’являтися, коли Ви висловлюєте непопулярну думку в групі, тримаєте межу з людиною, яка її постійно перевіряє, чи продовжуєте проєкт, у якому інші сумніваються. Досягнувши певного успіху, Ви також можете помітити, що більше людей хочуть його оскаржити чи поставити під сумнів.
  Ця карта запрошує помітити власну силу й цінності, що надають їй мети. Стояти твердо не вимагає агресії; це може бути стійко, спокійно й ясно. Можна запитати себе, що саме Ви захищаєте і чому це важливо, щоб Ваша енергія йшла на те, що для Вас вагоме, а не на кожен випадковий виклик.
meaningReversed: |-
  У перевернутому положенні Сімка Жезлів може відображати відчуття, що Вас переважають числом чи виснажили. Можливо, Ви довго обстоювали позицію, і зусилля починають даватися взнаки. Або Ви помічаєте, що лишаєтеся напоготові, навіть коли ніхто насправді не нападає.
  Ця карта може вказувати й на мить переосмислення. Не кожен виклик потребує відповіді, і не кожну позицію треба тримати вічно. Відмова від однієї боротьби може звільнити енергію для важливіших.
  Можна підбити підсумок, де Ви чините опір і чому. Які межі захищають Ваші цінності, а які стали звичкою оборонятися? Може допомогти попросити про підтримку, відступити, щоб відпочити, або дозволити іншим розділити ношу, а не тримати пагорб наодинці.
aspects:
  relationshipsUpright: >-
    У близьких стосунках ця карта може відображати обстоювання своїх потреб, навіть коли це створює певне тертя. Вона може вказувати й на захист когось, хто Вам дорогий. Варто поміркувати, як тримати межу з теплом: ясно казати, що для Вас важливо, і водночас лишати місце для погляду іншої людини.
  relationshipsReversed: >-
    У перевернутому положенні Вам може здаватися, що з кимось Ви завжди в обороні або що кожна розмова перетворюється на дебати. Можна помітити, чи захищаєтеся Ви від справжньої критики, чи від давнього страху. М’якший підхід або пауза перед відповіддю можуть відкрити простір для чеснішої розмови.
  workUpright: >-
    У роботі чи творчому проєкті Сімка Жезлів може вказувати на вірність стандарту чи ідеї під тиском: конкуренції, критики чи мінливих вимог. Можна зібрати свої аргументи й докази, щоб говорити зі спокійною впевненістю. Наполегливість тут походить від ясності щодо того, що Ви захищаєте і чому це важливо.
  workReversed: >-
    У перевернутому положенні Ви, можливо, розриваєтеся, відповідаючи на кожен виклик чи запит так, ніби всі однаково термінові. Можна обрати одне-два питання, що справді потребують Вашої позиції, а решту поки відпустити. Прохання про підтримку до колег чи співавторів теж може полегшити утримання складної позиції.
  growthUpright: >-
    Утримання позиції, навіть недовге, — свідчення стійкості, яке варто визнати. У Вас більше здатності обстоювати свої цінності, ніж може здаватися. Можна згадати, коли Ви трималися твердо, і помітити, що тоді допомагало: ясна причина, людина, що підтримала, чи стабільний розпорядок.
  growthReversed: >-
    У перевернутому положенні Ви, можливо, носите в собі відчуття постійної пильності. Варто дослідити, звідки воно береться і чи досі Вам служить. Вибір битв — не капітуляція; це може бути спосіб берегти енергію, щоб Ваша мужність була доступна, коли справді знадобиться.
reflectionQuestions:
  - "Що Ви зараз обстоюєте і чому це для Вас важливо?"
  - >-
    Де Ви могли б відпустити меншу боротьбу, щоб зберегти енергію для більшої?
  - >-
    Хто міг би стати поруч, щоб Ви не тримали цю позицію наодинці?
imageryNote: >-
  Одна фігура стоїть на кам’янистому підвищенні, нерівно поставивши ноги, тримає жезл обома руками, а шість інших здіймаються з-за краю знизу. Нерівна опора натякає, що переконаність не завжди зручна, а підвищення показує справжню вигідну позицію, здобуту зусиллями. Жезли внизу можуть уособлювати виклики, питання й суперницькі голоси, а стійкий хват — мужність, що спирається на цінності.
