shortUpright: >-
  Можливо, Ви якийсь час звернені всередину; ця карта запрошує помітити, що Вам пропонують, поки Ви розмірковуєте.
shortReversed: >-
  Після тихого періоду може повертатися інтерес; подумайте, яке запрошення зараз варто прийняти.
meaningUpright: |-
  Четвірка Кубків часто показує фігуру, що сидить осторонь і дивиться на три чаші перед собою, поки четверту їй простягають, можливо, непомітно. Це карта паузи й внутрішнього зважування. Те, що колись Вас задовольняло, могло втратити смак, і Ви ще не певні, що це замінить.
  Це може виглядати як нудьга від розпорядку, відчуття порожнечі після досягнутої мети чи бажання на якийсь час відійти від спілкування. Це може бути й справжнє споглядання: час обміркувати, чого Ви хочете, перш ніж погоджуватися на щось іще.
  Відсторонення — не невдача. Іноді саме цього потребує втомлене серце. Карта лише запрошує лишатися допитливими, а не закритими. Поки Ви перебуваєте зі своїми думками, можна час від часу підводити погляд і помічати, що Вам простягають. Пропозиція допомоги, нова ідея чи невелика доброта можуть бути ближче, ніж здається, і Ви вільні вирішувати, чи це Вам пасує.
meaningReversed: |-
  У перевернутому положенні Четвірка Кубків може відображати поворотний момент після періоду відсторонення. Можливо, Ви готові знову підвести погляд, відкриті до розмов і можливостей, що раніше здавалися нудними чи недосяжними. Цікавість може повертатися тихо, спершу як неспокій, потім як інтерес.
  Вона може вказувати й в інший бік: на відсторонення, що тривало довше, ніж допомагало, і стало звичкою відмовлятися. Можна помітити, чи відхиляєте Ви запрошення зі справжньої потреби, чи просто через інерцію.
  Так чи інакше, ця карта запрошує лагідно звіритися із собою. Що, якщо взагалі щось, знову почало привертати Вашу увагу? Не треба приймати кожну пропозицію. Обрати одну невелику справу, до якої долучитися, і подивитися, як це відчувається, може бути досить, щоб зрозуміти, до чого Ви зараз готові.
aspects:
  relationshipsUpright: >-
    У стосунках Четвірка Кубків може відображати потребу в просторі чи відчуття, що зв’язок став рутинним. Вона може запрошувати запитати себе, чи не пропускаєте Ви турботу, яку Вам пропонують: жест, питання чи запрошення. Можна сказати комусь близькому, що Вам потрібен час подумати, щоб дистанцію не сприйняли за байдужість.
  relationshipsReversed: >-
    У перевернутому положенні ця карта може пропонувати відновити зв’язок після періоду відсторонення. Можливо, Ви охочіше почуєте те, що хтось намагався сказати, чи першими зробите крок. Якщо простір ще потрібен, лагідно сказати про це може вберегти зв’язок. Невеликі спільні моменти, як-от прогулянка чи трапеза, можуть стати зручним способом знайти дорогу назад.
  workUpright: >-
    У роботі ця карта може відображати неспокій, відчуття, що завдання вже мало що важать, чи паузу для переоцінки напрямку. Вона може запрошувати ще раз поглянути на можливості, які Ви швидко відкинули. Розмова, нова відповідальність чи курс, який Ви проігнорували, можуть заслуговувати на другий погляд, навіть якщо іскри ще немає.
  workReversed: >-
    У перевернутому положенні карта може вказувати на мотивацію, що повертається, чи на готовність погодитися на щось нове. Можна помітити, які проєкти знову почали Вас цікавити. Якщо Ви застрягли в колі відмов, подумайте, чи не спробувати одне невелике зобов’язання, а потім поміркувати, чи дало воно енергію, чи забрало її.
  growthUpright: >-
    Для особистісного зростання Четвірка Кубків запрошує чесно поміркувати, що Вас справді задовольняє. Можна скласти список того, що робите за звичкою, і запитати, що з цього досі важливе. Тихий час може бути цінним, доки лишається вибором, а не місцем, де Ви почуваєтеся застряглими.
  growthReversed: >-
    У перевернутому положенні ця карта може відображати вихід із періоду роздумів із яснішими пріоритетами. Можна помітити, як повертається вдячність за те, що колись сприймалося як належне. Може допомогти записати, чого Ви навчилися в період відсторонення, щоб це прозріння лишилося з Вами, коли життя знову стане насиченішим.
reflectionQuestions:
  - >-
    Що останнім часом втратило для Вас привабливість і що це може Вам казати?
  - >-
    Що Вам, можливо, хтось пропонує, а Ви цього цілком не помітили?
  - >-
    На яке одне невелике запрошення Ви могли б погодитися, просто щоб відчути, як це?
imageryNote: >-
  Зображення розміщує сидячу фігуру під деревом чи біля тихої води; руки схрещено, погляд опущено на три чаші на землі. Четверта чаша підпливає до неї з вітерцем чи гойдається на поверхні води, і її легко не помітити. Приглушені барви й закрита поза можуть натякати на заглибленість у себе й потребу в паузі, а простягнута чаша тримає в полі зору нитку можливості.
