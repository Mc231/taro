imageryNote: >-
  Повішений Taro постає підвішеним догори ногами за одну щиколотку до міцної живої гілки, з розслабленими руками й спокійним, навіть допитливим обличчям. Під цим кутом фігура бачить світ, що відбивається в ставку внизу, перевернутий у протилежний бік. Дерево зелене й у бруньках, показуючи, що пауза — частина зростання, а не його кінець. Водянисто-сині тони й вільний, плинний одяг перегукуються з відпусканням, мріями й баченням під поверхнею.
