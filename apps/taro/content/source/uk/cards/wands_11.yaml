shortUpright: >-
  Допитлива, грайлива енергія прагне досліджувати; ідіть за тим, що Вас захоплює, і дозвольте собі бути новачком.
shortReversed: >-
  Ентузіазм може мерехтіти між багатьма речами чи стримуватися сумнівом; можна обрати одну й лагідно її дослідити.
meaningUpright: |-
  Паж Жезлів — завзятий учень вогню. Ця фігура тримає жезл, що пускає пагони, і дивиться на нього із захопленням; вона уособлює цікавість, що передує майстерності: радість відкриття чогось нового й бажання знати більше.
  Ця енергія може виявлятися як запис на курс під впливом миті, читання всього, що вдається знайти про нове захоплення, чи розповіді друзям про ідею, що щойно спала на думку. Це може бути й повідомлення чи запрошення, що відчиняє двері до чогось незнайомого. Тут є відчуття гри й готовність, щоб інші бачили, як Ви пробуєте.
  Ця карта запрошує підходити до життя з відкритістю новачка. Не треба знати, куди веде захоплення, щоб його досліджувати. Можна дозволити собі експериментувати без тиску одразу бути в цьому добрими й помітити, як відчувається ця свобода. Іноді найтриваліші пристрасті починаються з невеликих грайливих питань.
meaningReversed: |-
  У перевернутому положенні Паж Жезлів може відображати цікавість, якій нема де приземлитися. Ви можете перескакувати від одного захоплення до іншого, з радістю починаючи проєкти й кидаючи їх, коли минає новизна. Або цікавість є, але її стримує тривога видатися недосвідченими.
  Ця карта може описувати й ідеї, що ще формуються: іскри, яким потрібно більше часу, перш ніж ними можна буде поділитися.
  Можна дослідити, що стоїть за неспокоєм чи ваганням. Нудьга, страх зобов’язань чи страх бути ще недостатньо добрими? Один зі шляхів — обрати одне захоплення й поставити для нього невелику мету без тиску. Інший — дозволити собі насолоджуватися дослідженням, не вимагаючи, щоб воно кудись конкретно вело.
aspects:
  relationshipsUpright: >-
    У стосунках ця карта може відображати свіжу цікавість до когось: бажання більше про нього дізнатися, спробувати нове разом чи поділитися грайливою енергією. Вона може принести легкість і в знайомий зв’язок. Можна поставити комусь близькому питання, якого Ви ніколи не ставили, або запропонувати заняття, якого жоден із Вас ще не пробував.
  relationshipsReversed: >-
    У перевернутому положенні захоплення в стосунках може приходити спалахами й швидко згасати, або Ви соромитеся показувати ентузіазм. Можна помітити, чи не шукаєте Ви новизни замість глибини. Якщо дати своїй справжній зацікавленості проявитися, хай у дрібницях, це може запросити іншу людину відповісти такою самою відкритістю.
  workUpright: >-
    У роботі чи навчанні Паж Жезлів може вказувати на етап навчання: нову навичку, нову роль чи ідею, яку Вам кортить перевірити. Ентузіазм тут — перевага. Можна вільно ставити питання, зголошуватися на щось незнайоме й сприймати ранні помилки як частину процесу, а не як вирок Вашим здібностям.
  workReversed: >-
    У перевернутому положенні у Вас може бути багато ідей і мало доведеного до кінця, або Ви не певні, куди спрямувати енергію. Можна обрати один проєкт і просунути його на крок далі, ніж зазвичай. Розмова з наставником чи колегою теж може допомогти перетворити розпорошену іскру на ясніший напрямок.
  growthUpright: >-
    Паж Жезлів дає Вам просте завдання: знову відчути свою цікавість. Що Ви любили досліджувати, коли не було тиску чогось досягати? Можна цього тижня виділити час для грайливого експерименту й сприйняти все, що відкриєте, як корисну інформацію про те, що Вас наповнює енергією.
  growthReversed: >-
    У перевернутому положенні сором’язливість чи неспокійний розум можуть заважати Вам заглибитися. Можна дослідити, що означало б залишитися з одним захопленням трохи довше, ніж здається природним, і дозволити собі бути в ньому помітно новими. Глибина часто приходить одразу після тієї миті, коли Ви зазвичай рушили б далі.
reflectionQuestions:
