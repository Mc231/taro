shortUpright: >-
  Те, про що Ви дбали, повільно росте. Можливо, слушна мить зупинитися, поглянути на поступ і обрати, що плекати далі.
shortReversed: >-
  Поступ може здаватися повільнішим, ніж хотілося. Можна запитати себе, чого потребують зусилля: терпіння, нового напрямку чи просто відпочинку.
meaningUpright: |-
  Сімка Пентаклів показує фігуру, що зупинилася посеред роботи, спершись на інструмент, і дивиться на рослину, обважнілу від монет. Урожай ще не готовий, але зростання видно. Це карта підбиття підсумків: відступити від зусиль, щоб побачити, що вони вже дали і чого ще потребують.
  Ви можете впізнати це в довгому проєкті на півдорозі, у навичці, що покращилася, поки Ви не помічали, у стосунках, що будувалися роками, чи в саду, який поволі заповнюється. Пауза важлива. Без неї можна й далі працювати за звичкою, а не з наміром.
  Карта запрошує подивитися на свої зусилля терпляче й чесно. Які частини Вашої роботи процвітають? Які застигли? Чи посильний темп, якого Ви тримаєтеся? Можна сприйняти цю мить як контрольну точку й свідомо обрати, куди вкласти енергію наступного сезону, а не просто тиснути далі.
meaningReversed: |-
  У перевернутому положенні Сімка Пентаклів може відображати роздратування повільним поступом. Можливо, Ви наполегливо працюєте, не бачачи результатів, і замислюєтеся, чи варто продовжувати. Вона може вказувати й на зусилля, розподілені між забагатьма ділянками, так що жодна не отримує досить води.
  Це прочитання просить переглянути план, а не судити себе. Деякі речі за природою ростуть повільно; іншим може знадобитися інший підхід.
  Можна чесно поглянути, куди йдуть Ваш час і турбота. Які зусилля досі відображають те, чого Ви хочете? Які тривають переважно тому, що Ви вже стільки в них вклали? Дозвіл собі перенаправити енергію чи відпочити перед рішенням може перетворити роздратування на ясніше відчуття того, про що дбати.
aspects:
  relationshipsUpright: >-
    У стосунках ця карта може відображати цінність терпіння й стабільної уваги. Довіра й близькість часто ростуть повільно, через безліч дрібних моментів. Можна зупинитися й помітити, як поглибився зв’язок із часом, і запитати, чого він потребує далі: більше спільного часу, нового спільного захоплення чи просто й далі надійної турботи.
  relationshipsReversed: >-
    У перевернутому положенні карта може натякати на нетерплячість щодо того, як розвивається зв’язок, чи на відчуття, що Ви даєте багато, не бачачи віддачі. Можна поміркувати, чи відповідають Ваші очікування темпу, у якому цей зв’язок реально може рости, і відкрито поговорити про те, на що сподівається кожен.
  workUpright: >-
    У роботі Сімка Пентаклів запрошує до паузи, щоб переглянути поступ у довгострокових зусиллях. Можна оцінити, що працює, що застигло і де зосередитися далі. Це може бути й мить оцінити навички й підґрунтя, які Ви збудували, навіть якщо до завершеного результату ще далеко.
  workReversed: >-
    Тут карта може відображати неспокій через повільні результати чи зусилля, що втратили напрямок. Можна переглянути свої цілі й перевірити, чи досі служать їм щоденні завдання. Коригування плану, звуження фокуса чи пошук відгуку можуть допомогти зусиллям знову набути мети.
  growthUpright: >-
    Для особистісного зростання ця карта запрошує до терпіння щодо власного розвитку. Зміни часто відбуваються під поверхнею, перш ніж стануть помітні. Можна озирнутися на минулі місяці й помітити, що виросло, хай трохи, і дозволити цьому свідченню підбадьорити Вас і далі дбати про важливе.
  growthReversed: >-
    У перевернутому положенні карта може відображати зневіру чи порівняння з поступом інших. Можна дослідити, чи не міряєте Ви зростання графіком, що Вам не належить. Обрати одну практику, яку продовжувати дбайливо, а інші поки відпустити, може зробити зростання легшим.
reflectionQuestions:
  - "Про що Ви дбаєте вже певний час і на що це тихо виросло?"
  - >-
    Де Ваші очікування щодо поступу можуть не збігатися з темпом, якого потребують речі?
  - >-
    Які зусилля заслуговують на більше Вашої турботи наступного сезону, а які Ви могли б відпустити?
imageryNote: >-
  Зображення може показувати фігуру, що зупинилася біля листяної рослини чи лози, де, наче плоди, що достигають, висять сім монет, і спирається на сапу чи лопату. Поза відпочинку може символізувати оцінювання й потребу відступити, а рослина — зростання, що має свій час. Ґрунт, листя й інструмент разом можуть говорити про стабільну працю, а недостиглий урожай нагадує глядачеві, що робота ще триває.
