imageryNote: >-
  Відлюдник Taro постає фігурою в плащі на високому засніженому гребені в сутінках, із простим ліхтарем, що освітлює лише кілька наступних кроків стежки. Ціпок, відшліфований частим ужитком, натякає на опору, здобуту з досвіду. Сліди на снігу позаду показують, який шлях фігура вже пройшла. Прохолодні сині й сірі тони говорять про усамітнення та чисте повітря, а тепле сяйво ліхтаря показує, що прозріння можна нести навіть крізь найтемніший відтинок дороги.
