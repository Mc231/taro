imageryNote: >-
  Оригінальне зображення показує фігуру, що сидить у ліжку, підтягнувши коліна, у темній кімнаті, освітленій лише тонкою смужкою місячного світла у вікні. Дев’ять клинків висять рівними рядами на стіні позаду, ніколи не торкаючись фігури. Поруч чекають складена ковдра й невелика лампа, ще не запалена. Ряди клинків натякають на думки, що ходять по колу, а лампа й вікно — на те, що розрада й ранок уже близько.
