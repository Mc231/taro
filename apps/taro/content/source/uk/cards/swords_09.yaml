  relationshipsReversed: >-
    У перевернутому положенні Дев’ятка Мечів може вказувати на те, що Ви відкриваєте свої тривоги комусь близькому, чи помічаєте, що розрив, якого боялися, був меншим, ніж здавалося. Вона може відображати й приховування стресу від інших, щоб не обтяжувати їх. Можна пам’ятати, що дозвіл людям підтримати Вас може зблизити, а не відштовхнути.
  workUpright: >-
    У роботі ця карта може відображати стрес, що йде за Вами додому: дедлайн, що не дає спати, страх помилитися чи хвилювання про те, як сприймають Ваші зусилля. Можна записати перший крок на завтра, перш ніж завершити вечір, щоб розум мав дозвіл відпочити. Розбиття великих турбот на невеликі завдання може зробити їх посильнішими.
  workReversed: >-
    У перевернутому положенні ця карта може натякати на послаблення тиску на роботі чи на рішення нарешті поговорити з кимось про ношу, що здається надто важкою. Можна попросити ясності там, де непевність живить тривогу. Назвавши турботу колезі чи керівникові, можна перетворити приватний тягар на спільне завдання з практичними варіантами.
  growthUpright: >-
    Для особистісного зростання Дев’ятка Мечів запрошує помітити свої стосунки з тривогою. Коли Ваш розум починає закручуватися в спіраль і що допомагає йому сповільнитися? Можна поекспериментувати з коротким вечірнім ритуалом, що позначає кінець дня. Доброта до тривожних думок, а не боротьба з ними, може послабити їхню хватку.
  growthReversed: >-
    У перевернутому положенні ця карта може відображати усвідомлення, що думки не завжди факти. Можна помічати мить, коли починається тривога, і лагідно називати її тривогою. З часом ця невелика пауза може створити простір між Вами й страхом. Звернення по підтримку — частина цього зростання, а не ознака слабкості.
