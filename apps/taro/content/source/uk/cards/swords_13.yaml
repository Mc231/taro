shortUpright: >-
  Ясний погляд і добрий, прямий голос можуть іти разом; можна довіритися тому, чого навчив досвід.
shortReversed: >-
  Ясність, можливо, затверділа в дистанцію; можна помітити, де тепло могло б повернутися без утрати чесності.
meaningUpright: |-
  Королева Мечів рівно сидить на високому сидінні, з піднятим клинком і простягнутою рукою, ніби запрошує до чесності. Ця карта уособлює ясне сприйняття, сформоване досвідом, здатність бачити ситуацію такою, як вона є, і говорити про неї просто. Ця ясність не холодна; вона походить від того, що через щось пройшли й чогось навчилися.
  Ви можете впізнати цю енергію, коли встановлюєте тверду межу, не вибачаючись за неї, даєте чесний і справедливий відгук чи ухвалюєте рішення на основі фактів, а не бажаного. Вона може відображати й незалежність: довіру до власного судження й потребу в просторі, щоб думати самостійно. Люди можуть приходити до Вас, бо знають, що Ви скажете правду.
  Ця карта запрошує поміркувати, як ясність і співчуття можуть працювати разом. Ясно бачити не вимагає різкості, а бути добрими не вимагає вдавати. Можна запитати себе, де Ваш досвід, зокрема минулі труднощі, дав Вам погляд, якому варто довіряти. Як Ви могли б використати це розуміння, щоб підтримувати себе й інших і чесно, і дбайливо?
meaningReversed: |-
  У перевернутому положенні Королева Мечів може відображати ясність, що обернулася холодністю. Минулі рани могли зробити Вас настороженими, швидкими на критику чи неохочими підпускати людей близько. Чесність може стати щитом, коли нею тримають людей на відстані.
  Інше прочитання — протилежне: складність висловити свою правду, дозвіл іншим розмивати Ваше судження чи межі, що не тримаються.
  Ця карта запрошує поглянути, як Ви зараз балансуєте розум і серце. Можна помітити, чи не впливає давнє розчарування на те, як Ви реагуєте на людей сьогодні. Пом’якшитися не означає відмовитися від своїх стандартів; це може означати дозволити теплу йти поруч із чесністю. Як виглядало б говорити ясно й водночас лишатися відкритими?
aspects:
  relationshipsUpright: >-
    У стосунках Королева Мечів може відображати ясне спілкування й здорові межі. Можливо, Ви знаєте, що приймете, а що ні, і спокійно про це кажете. Ця енергія цінує чесність і досить поважає інших, щоб казати їм правду. Поєднання прямоти з теплом допомагає людям почуватися і шанованими, і оточеними турботою.
  relationshipsReversed: >-
    У перевернутому положенні ця карта може вказувати на настороженість, гострі зауваження чи тримання інших на відстані після болю. Варто поміркувати, чи не почав самозахист коштувати Вам близькості. Якщо поділитися трохи тим, що відчуваєте, а не лише тим, що думаєте, це може запросити до теплішого зв’язку, не відмовляючись від меж.
  workUpright: >-
    У роботі Королева Мечів може натякати на справедливе судження, ясні стандарти й здатність розсікати плутанину. Можливо, саме Ви називаєте на нараді справжню проблему чи даєте відгук, що допомагає іншим ставати кращими. Ваша незалежність і досвід — сильні сторони; відкрито ділячись своїми міркуваннями, Ви допомагаєте іншим довіряти Вашим рішенням.
  workReversed: >-
    У перевернутому положенні ця карта може відображати надто критичні відгуки, жорсткі стандарти чи самоізоляцію від команди. Вона може вказувати й на сумнів у власному судженні, коли інші заперечують. Можна поєднувати відвертість із підбадьоренням і пам’ятати, що ясні очікування працюють краще, коли люди відчувають підтримку в їх виконанні.
  growthUpright: >-
    Для особистісного зростання Королева Мечів запрошує довіряти здобутій мудрості. Можна поміркувати над складним досвідом і назвати, чого він навчив. Ясне знання себе допомагає встановлювати межі, чесно спілкуватися й ухвалювати рішення відповідно до своїх цінностей, навіть коли вони не найпопулярніші.
  growthReversed: >-
    У перевернутому положенні ця карта може відображати потребу пом’якшити внутрішнього критика чи відпустити давню образу. Можна помічати, коли Ви суворо судите себе чи інших, і питати, якими були б лагідніші, але так само чесні слова. Ясність стає сильнішою, а не слабшою, коли включає розуміння.
reflectionQuestions:
