  - "Яку межу Ви хотіли б окреслити ясніше цього тижня?"
imageryNote: >-
  На оригінальному зображенні фігура сидить на різьбленому кам’яному сидінні високо над хмарами, тримаючи клинок прямо вгору однією рукою, а друга рука відкрита й простягнута. У чистому повітрі вгорі кружляє одинокий птах. Вертикальний клинок натякає на розважливість, відкрита рука — на справедливість і готовність слухати, а одинокий птах — на незалежний, далекоглядний розум.
