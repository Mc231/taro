shortUpright: >-
  Цікавість прокинулася; можна піти за питанням свіжим поглядом і подивитися, куди воно поведе Ваші думки.
shortReversed: >-
  Жваві думки можуть розлітатися в усі боки; можна помітити, де слухати було б корисніше, ніж говорити.
meaningUpright: |-
  Паж Мечів — це юний, швидкий розум, що зустрічається зі світом. Стоячи на вітряному пагорбі з високо піднятим клинком, Паж за всім спостерігає, прагнучи вчитися, питати й перевіряти ідеї. Ця карта про цікавість, що передує знанню, захопливий початок розуміння чогось нового.
  Ви можете впізнати цю карту в бажанні досліджувати тему до пізнього вечора, у питанні, якого ніхто інший не поставить, чи в енергії початку курсу, дискусії чи проєкту, що розширює Ваше мислення. Вона може відображати й пильність та уважність, збирання інформації, перш ніж зайняти певну позицію.
  Ця карта запрошує насолоджуватися роллю учня. Не треба мати всі відповіді; поки що досить ставити добрі питання. Можна помітити й те, як Ви ділитеся відкритим. Ентузіазм щодо ідей сприймається добре, коли поєднаний з умінням слухати. Яка тема чи яке питання кличе Вашу увагу і як Ви могли б дослідити це і сміливо, і скромно?
meaningReversed: |-
  У перевернутому положенні Паж Мечів може відображати цікавість, що втратила напрямок. Ідеї можуть розлітатися швидше, ніж Ви встигаєте за ними, або Ви починаєте багато справ, не завершуючи жодної. Розумової енергії багато, але зосередженості мало.
  Інше прочитання — слова, що рухаються швидше за думку: говорити, не вислухавши, переказувати неперевірене чи захищатися, коли ідею ставлять під сумнів. Гострота без турботи може робити розмови складнішими, ніж потрібно.
  Ця карта запрошує трохи сповільнити темп мислення. Можна поки що обрати одну нитку, а інші хай почекають. Перш ніж ділитися думкою, можна поставити ще одне питання. Чого Ви могли б навчитися, якби слухали так само жваво, як хочете говорити?
aspects:
  relationshipsUpright: >-
    У стосунках Паж Мечів може вказувати на жваву розмову, цікавість до чийогось внутрішнього світу чи бажання повністю зрозуміти ситуацію. Можна поставити питання, які Вас цікавили, зі щирим інтересом, а не з підозрою. Уміння добре слухати — така ж частина цієї карти, як і швидкість у словах.
  relationshipsReversed: >-
    У перевернутому положенні ця карта може відображати необережні слова, переказані таємниці чи звичку сперечатися замість того, щоб зближуватися. Можна помітити, чи не перетворилася цікавість на допитування чи захисну реакцію. Пауза, щоб подумати, як можуть сприйнятися Ваші слова, може вберегти довіру. Просте вибачення за поспішне зауваження може багато змінити.
  workUpright: >-
    У роботі Паж Мечів може відображати етап навчання: нову навичку, свіже дослідження чи роль, що вимагає думати на ходу. Можна зголошуватися на завдання, що розширюють Ваше розуміння, і просити колег пояснити те, що вони знають. Нотатки й перевірка припущень можуть перетворити початковий ентузіазм на ґрунтовне знання.
  workReversed: >-
    У перевернутому положенні ця карта може натякати на розпорошену увагу: перескакування між завданнями, надто ранній показ сирих ідей чи швидку реакцію на критику. Можна обрати один пріоритет і заглибитися в нього, перш ніж додавати нові. Перевірка фактів перед презентацією та спокійне запрошення до відгуків можуть зробити Ваші ідеї сильнішими й вартими довіри.
  growthUpright: >-
    Для особистісного зростання Паж Мечів запрошує плекати розум новачка. Можна взятися за предмет, про який мало знаєте, і дозволити собі цікавитися, не намагаючись вражати. Питання «чому», широке читання й помічання власних припущень можуть зберегти Ваше мислення свіжим і гнучким.
  growthReversed: >-
    У перевернутому положенні ця карта може відображати неспокійні думки, що стрибають, не приземлившись. Можна вправлятися завершувати одну ідею, перш ніж починати наступну, чи помічати, коли виникає бажання захищатися замість обміркувати. Цікавість, звернена до себе, питання, чому Ви реагуєте саме так, може бути корисною відправною точкою.
