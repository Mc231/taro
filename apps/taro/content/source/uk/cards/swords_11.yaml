imageryNote: >-
  На оригінальному зображенні юна фігура стоїть на трав’янистій вершині пагорба з піднятим клинком, погляд звернено до обрію. Вітер куйовдить траву й розганяє зграйку маленьких птахів по яскравому небу з хмарними смугами. Піднятий клинок натякає на готовність перевіряти ідеї, птахи — на швидкі, метушливі думки, а висока точка огляду — на бажання побачити все одразу.
