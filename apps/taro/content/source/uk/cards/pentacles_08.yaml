imageryNote: >-
  Зображення може показувати фігуру, схилену над верстаком з інструментами в руках, що обробляє монету, а готові монети висять рівним рядом поруч, можливо, на стовпі чи стіні. Дорога чи місто вдалині можуть натякати на ширший світ, від якого майстер відійшов, щоб зосередитися. Повторювані монети можуть символізувати практику й послідовність, а заглиблена поза — тихе задоволення від вправної, уважної роботи.
