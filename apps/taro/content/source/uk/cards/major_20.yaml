shortUpright: >-
  Мить, щоб чесно озирнутися, пробачити, що можете, і відгукнутися на те, що кличе Вас уперед.
shortReversed: >-
  Внутрішній критик може звучати гучніше, ніж зазвичай. Що показав би справедливий, добрий погляд на Ваше минуле?
meaningUpright: |-
  Суд — це карта пробудження й оновлення. Вона не стільки про те, щоб Вас судили інші, скільки про точку чесних роздумів над собою: поглянути, де Ви були, взяти те, чого навчилися, і відчути готовність піднятися в новий розділ. Часто є відчуття поклику, внутрішньої підказки, що каже: час.
  У повсякденному житті ця карта може відображати мить ясності після довгого періоду плутанини, рішення нарешті взятися за те, що Ви відкладали, або підбиття підсумків щодо минулого вибору, яке допомагає рухатися далі. Вона може вказувати на прощення, себе чи когось іншого, і на полегшення від того, що бачите свою історію в повнішому, справедливішому світлі.
  Ця карта запрошує Вас поміркувати, що кличе Вас зараз. Можна запитати себе, що Ви зробили б, якби довіряли тому, що минулий досвід Вас до цього підготував. Суд підкреслює оновлення через розуміння: коли Ви можете дивитися на свою історію чесно й зі співчуттям, Ви можете виявити, що вільніше обираєте, що буде далі.
meaningReversed: |-
  У перевернутому положенні Суд може відображати суворого внутрішнього критика. Можливо, Ви прокручуєте старі помилки, сумніваєтеся у своїй цінності чи вагаєтеся рухатися вперед через щось у минулому. Поклик є, але провина чи страх можуть його заглушати.
  Ця карта може вказувати й на повне уникання роздумів: перехід від однієї справи до іншої без паузи, щоб повчитися з того, що сталося.
  Можливо, варто поглянути на своє минуле з тією справедливістю, яку Ви запропонували б другові. Чого Ви навчилися і що готові відкласти? Лист розуміння до себе молодшого може стати одним зі способів почати. Відгук на поклик не вимагає досконалості; він може початися з одного чесного кроку.
aspects:
  relationshipsUpright: >-
    У стосунках Суд може відображати поворотний момент: звільнення від старих образ, оновлене зобов’язання чи спільне підбиття підсумків, що Вас зближує. Він може запрошувати чесно поговорити про минуле й разом вирішити, чого Ви хочете надалі. Прощення, там, де воно здається слушним, може звільнити місце для нового початку.
  relationshipsReversed: >-
    У перевернутому положенні ця карта може вказувати на затяжні звинувачення чи осуд у стосунках з одного чи з обох боків. Варто поміркувати, чи старі образи досі Вас захищають, чи вже тримають на місці. Відкрита, спокійна розмова могла б допомогти обом побачити все справедливіше.
  workUpright: >-
    У роботі чи проєкті Суд підкреслює відчуття покликання. Він може відображати усвідомлення того, яка робота здається Вам змістовною, або перегляд минулих проєктів, щоб вирішити, що далі. Можна прислухатися до того, що Вас захоплює, і запитати себе, як Ваші навички могли б служити цьому напрямку.
  workReversed: >-
    У перевернутому положенні Суд може відображати страх критики, що Вас стримує, або нехтування відчуттям, що час змін. Він може вказувати й на надмірну критичність щодо своїх минулих результатів. Можна записати, чого Ви навчилися і як це могло б спрямувати Ваш наступний крок.
  growthUpright: >-
    Вдумливий огляд пройденого шляху сам по собі може стати поворотним моментом. Можна озирнутися на вагомий період, помічаючи, як Ви зросли і що відпустили. Така перспектива може допомогти відгукнутися на новий поклик з упевненістю та ясністю.
  growthReversed: >-
    У перевернутому положенні Суд може питати, чи не несете Ви зайвої провини чи самозвинувачення. Він може відображати потребу відпустити старі історії про себе. Можна вправлятися помічати, коли внутрішній голос стає суворим, і лагідно пропонувати собі справедливіший погляд. Справедливіший внутрішній голос може зробити зростання легшим і досяжнішим.
