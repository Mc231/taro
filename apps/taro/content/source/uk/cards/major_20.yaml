imageryNote: >-
  Суд Taro постає широким світанковим краєвидом після довгої зими, де з вершини пагорба лунає чистий дзвін, а люди виходять зі своїх домівок у перше світло, потягуються й дивляться вгору. Сніг, що тане, відкриває зелені паростки під собою. Відчинене вікно із завісками, що здуваються назовні, натякає на внутрішній поклик, на який відгукнулися. Далекі гори натякають на перспективу, яку дають чесні роздуми, а бліді ранкові барви говорять про оновлення.
