imageryNote: >-
  Зірка Taro постає нічною сценою в саду на даху, де фігура поливає молоді рослини з глечика, поки яскрава зірка сяє крізь просвіт у хмарах. Бочки для дощової води й невеликий ставок збирають те, що повертає небо. Метелики, що кружляють довкола ліхтаря, можуть уособлювати думки, які тягнуться до світла. Прохолодні сині та срібні тони створюють відчуття спокою, відкритості й лагідного оновлення після бурі, що минула.
