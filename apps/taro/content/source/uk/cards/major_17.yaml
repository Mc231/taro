shortUpright: >-
  Після важкого періоду може повертатися тихіша надія. Ця карта запрошує впустити її.
shortReversed: >-
  Надія зараз може здаватися далекою. Невеликі, стабільні речі можуть допомогти знайти шлях назад до неї.
meaningUpright: |-
  Зірка — це карта надії й оновлення. У послідовності вона часто йде після потрясіння Вежі, і її настрій — це спокій після бурі: ясне нічне небо, прохолодна вода, мить, коли можна нарешті видихнути. Надія тут не гучний оптимізм. Це тиха довіра до того, що все може покращитися і що Вам є що запропонувати.
  У повсякденному житті ця карта може відображати легкість після складного періоду, повернення до творчої мрії чи помічені маленькі ознаки поступу, що нагадують, навіщо Ви почали. Вона може вказувати на моменти відкритості, коли Ви можете ділитися ідеями чи почуттями без обладунків, і на просту відновлювальну силу відпочинку, природи та часу.
  Ця карта запрошує Вас поміркувати, що дає Вам надію зараз, хай навіть зовсім маленьку. Можна запитати себе, що хотіли б оновити у своєму житті і що допомагає Вам відчувати свіжість. Зірка підкреслює щедрість, і до інших, і до себе. Вона пропонує спрямовувати енергію в те, що Вас живить, а решті дати вляжуться.
meaningReversed: |-
  У перевернутому положенні Зірка може відображати час, коли надія здається тьмянішою. Можливо, Ви втомилися, зневірилися чи сумніваєтеся, чи важать Ваші зусилля. Світло не згасло, але крізь хмари його може бути важче побачити.
  Ця карта може вказувати й на відірваність від того, що зазвичай Вас надихає, можливо, тому, що Ви віддавали так багато, що для власних мрій мало що лишилося.
  Можливо, варто пошукати невеликі джерела оновлення: прогулянку під відкритим небом, розмову з людиною, яка у Вас вірить, повернення до простої радості. Надія часто повертається невеликими кроками, а не вся одразу. Якщо важкість не минає, звернутися до людини, якій довіряєте, або до кваліфікованого фахівця може бути дбайливим кроком.
aspects:
  relationshipsUpright: >-
    У стосунках Зірка може відображати відкритість, щирість і відчуття відновленої довіри. Вона може запрошувати поділитися надіями з кимось близьким або підбадьорити того, хто цього потребує. Зв’язок, що пройшов через складний час, тепер може здаватися спокійнішим і сповненим надії.
  relationshipsReversed: >-
    У перевернутому положенні ця карта може вказувати на відчуття, що Вас не бачать чи що Ви зневірилися у стосунках, або на стримування справжніх почуттів зі страху, що їх не приймуть. Варто поміркувати, що допомогло б Вам почуватися безпечніше, відкриваючись, і чи не міг би невеликий чесний жест відновити трохи довіри.
  workUpright: >-
    У роботі чи проєкті Зірка підкреслює натхнення й відчуття мети. Вона може відображати повернення до того, навіщо Ви робите те, що робите, або свіжу енергію після невдачі. Можна приділити час довгостроковій меті чи творчій ідеї, яка сповнює Вас надії.
  workReversed: >-
    У перевернутому положенні Зірка може відображати втрату мотивації чи відчуття, що Вашій роботі бракує сенсу. Можна запитати себе, що спершу привабило Вас на цей шлях і чи лишилася ще якась частина тієї іскри. Невеликі перемоги й колеги, що підтримують, можуть допомогти відновити відчуття мети.
  growthUpright: >-
    Оновлення й лагідна турбота про себе — серце того, що Зірка каже про зростання. Можна помітити, що Вас відновлює, і дати цьому трохи більше місця. Намір на найближчі місяці, що спирається на справжні Ваші надії, а не на те, чого, на Вашу думку, слід хотіти, може заземлювати.
  growthReversed: >-
    У перевернутому положенні Зірка може питати, чи не працюєте Ви на порожньому баку. Вона може відображати потребу поповнити сили, перш ніж давати більше. Можна почати з однієї невеликої щоденної практики, що приносить спокій, і дати їй тихо зростати з часом. Поповнювати себе — частина віддавання, а не перерва в ньому.
reflectionQuestions:
