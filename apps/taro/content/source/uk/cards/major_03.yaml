shortUpright: >-
  Щось росте у Вас чи довкола. Ця карта запрошує доглядати це терпляче й тепло.
shortReversed: >-
  Турбота може витікати назовні, поки Ваша власна криниця міліє. Де частина її могла б повернутися до Вас?
meaningUpright: |-
  Імператриця — це карта зростання через турботу. Якщо Верховна Жриця слухає всередину, то Імператриця звертається назовні, до живого світу: садів, страв, речей, зроблених руками, насолоди від доброго хліба чи теплого сонця. Ця карта уособлює творчість, що живить, хай то проєкт, дім, дружба чи Ваше власне відчуття легкості.
  У щоденному житті ця карта може відображати пору творення: готування для друзів, повернення до малювання, догляд за рослинами чи людьми або просто відчуття, що Вам у власному тілі затишніше, ніж зазвичай. Вона може вказувати й на терпіння. Імператриця знає, що зростання має свій час і що, тягнучи паросток, його не змусиш рости швидше.
  Ця карта запрошує Вас поміркувати, що Ви плекаєте і як саме. Можна запитати себе, де трохи більше м’якості, краси чи відпочинку могли б допомогти чомусь розквітнути. Достаток тут — не стільки про те, щоб мати багато, скільки про вміння помічати й тішитися тим, що вже живе довкола Вас.
meaningReversed: |-
  У перевернутому положенні Імператриця може відображати турботу, що втратила рівновагу. Можливо, Ви вкладаєте енергію в усіх і все, крім себе, аж поки творчість не пересохне, а навіть приємні речі не почнуть здаватися обов’язком. Або ж турбота може переходити в надмірну залученість, коли тримаєте так міцно, що іншим лишається мало простору рости по-своєму.
  Ця карта може вказувати й на творчий проєкт, що застиг, або на розрив зі звичними простими тілесними втіхами, які зазвичай Вас заспокоюють.
  Можливо, варто подивитися, куди йде Ваша турбота і чи не могла б частина її повернутися додому. Невеликий вияв турботи про себе, як-от поживна страва, повільна прогулянка чи кілька хвилин творення чогось просто для задоволення, може стати способом знову відчути щедру енергію Імператриці.
aspects:
  relationshipsUpright: >-
    У стосунках Імператриця може відображати тепло, ніжність і відчуття, що про Вас дбають, або що Ви щедро дбаєте про інших. Вона може запрошувати разом створювати затишок: спільні трапези, час надворі, невеликі жести ніжності. Можна помітити, як люблять, щоб про них дбали, Ваші близькі, і як цього хочете Ви самі.
  relationshipsReversed: >-
    У перевернутому положенні Імператриця може питати, чи не стала турбота в стосунках однобічною або чи не перейшло піклування в керування чужими рішеннями. Варто поміркувати, де Ви могли б відступити й більше довіритися іншій людині, а де відкритіше попросити тієї турботи, якої потребуєте самі.
  workUpright: >-
    У роботі чи творчому проєкті Імператриця вказує на родючий ґрунт. Вона може відображати час, коли ідеї ростуть легко, коли Ви можете плекати команду, цілий сад проєктів чи повільну, вдячну ремісничу справу. Вона запрошує зробити робочий простір затишнішим і цінувати поступ, що приходить від стабільної, терплячої уваги.
  workReversed: >-
    У перевернутому положенні ця карта може відображати вигорання від того, що Ви доглядаєте проєкти всіх, окрім власних, або творчий блок, який не зрушує жодний натиск. Можна запитати себе, що зробило б роботу знову поживною: зміна обстановки, коротший список справ чи дозвіл зробити щось неідеальне.
  growthUpright: >-
    Для особистісного зростання Імператриця запрошує насолоджуватися перебуванням у своєму тілі й у фізичному світі. Відпочинок, добра їжа, час на природі та прості радощі тут не примхи, а способи відновити сили. Можна помітити, що допомагає Вам почуватися заземлено й щедро, і дати цьому трохи більше місця.
  growthReversed: >-
    У перевернутому положенні Імператриця може лагідно нагадувати, що Ви заслуговуєте на те саме терпіння, яке даруєте іншим. Вона може відображати відчуття відірваності від власних потреб або сумнів у своїй творчій цінності. Можна почати з одного маленького доброго ритуалу, що належить лише Вам, і подивитися, як він змінить Ваш тиждень.
reflectionQuestions:
  - >-
    Що зараз росте у Вашому житті й заслуговує на трохи терпіння?
  - "Як Ви любите, щоб про Вас дбали, і кому Ви про це казали?"
  - "Для якої простої радості Ви могли б знайти час сьогодні?"
imageryNote: >-
  Імператриця Taro постає фігурою, що відпочиває на городі наприкінці літа серед овочів, які достигають, біля хлібини, що холоне на підвіконні, і струмка, що біжить поруч. М’які ткані полотна й кошик щойно зібраних фруктів натякають на затишок і насолоду відчуттів, а бджоли, що перелітають між квітами, — на зростання через безліч дрібних виявів турботи. Настрій теплий і неквапливий, він запрошує глядача помітити достаток, який уже є.
