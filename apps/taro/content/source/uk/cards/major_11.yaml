shortUpright: >-
  Час чесно все зважити й діяти так, щоб згодом Вам було приємно це пояснити.
shortReversed: >-
  Щось може здаватися незбалансованим. Ця карта запрошує ясно на це подивитися, зокрема й на свою роль.
meaningUpright: |-
  Справедливість тримає в одній руці терези, а в другій — меч. Терези означають ретельне зважування; меч — ясність, щоб діяти, коли зважено. Ця карта про чесність, справедливість і відповідальність за свої рішення, про розуміння, що дії мають наслідки і що їх можна обирати дбайливо.
  У повсякденному житті ця карта може відображати рішення, яке потребує ясної голови: справедливо розподілити обов’язки, дати чесний відгук чи визнати помилку й загладити її. Вона може вказувати на моменти, коли від Вас просять поглянути на ситуацію з усіх боків, перш ніж відповідати, і бути такими ж справедливими до себе, як Ви намагаєтеся бути до інших.
  Ця карта запрошує Вас поміркувати, як виглядала б зважена відповідь. Можна запитати себе, які факти важливі, чого потребує кожна залучена людина і за що Ви можете взяти відповідальність. Справедливість не прогнозує, чим завершиться будь-яка офіційна справа. Вона підкреслює цілісність: діяти відповідно до того, що Ви вважаєте правильним, і приймати те, що буде далі, зі спокійним розумом.
meaningReversed: |-
  У перевернутому положенні Справедливість може відображати відчуття, що щось несправедливо або що терези в ситуації схилилися. Вам може здаватися, що Ви несете більше, ніж Ваша частка, або Ви помічаєте спокусу не дивитися на власну роль у труднощах.
  Ця карта може вказувати й на надто суворий осуд себе, коли кожне рішення міряється неможливою меркою. Відповідальність корисна; постійна самокритика — це не те саме.
  Можливо, варто записати ситуацію якомога нейтральніше, ніби пояснюєте її неупередженому другові. Що належить Вам, а що ні? Пошук справедливості може означати висловитися, щось виправити або просто відпустити осуд, який стало важко нести.
aspects:
  relationshipsUpright: >-
    У стосунках Справедливість може відображати рівновагу й взаємну повагу: обоє дають і отримують так, що це здається справедливим. Вона може запрошувати чесно поглянути, як розподілено обов’язки й турботу. Ясні, добрі розмови про очікування можуть зміцнити довіру й запобігти тихій образі.
  relationshipsReversed: >-
    У перевернутому положенні ця карта може вказувати на дисбаланс, як-от коли одна людина робить більше емоційної чи практичної роботи, або на конфлікт, де провину покладено однобічно. Варто поміркувати, як виглядала б справедливість з обох точок зору і чи могли б вибачення або ясніша домовленість відновити рівновагу.
  workUpright: >-
    У роботі чи проєкті Справедливість підкреслює цілісність, чесний процес і зважені рішення. Вона може відображати перегляд домовленостей щодо очікувань, збалансований відгук чи оцінювання варіантів за їхніми перевагами. Можна запитати себе, яке рішення Ви спокійно пояснили б відкрито всім, кого воно стосується.
  workReversed: >-
    У перевернутому положенні Справедливість може відображати роздратування через несправедливе ставлення чи неясні правила. Вона може вказувати й на спокусу зрізати кути під тиском. Можна спокійно занотувати факти, за потреби пошукати доречної підтримки й перевірити, чи відповідають Ваші власні дії тій мірці, якої Ви хотіли б від інших.
  growthUpright: >-
    Для особистісного зростання ця карта запрошує жити відповідно до своїх цінностей і брати відповідальність за свої рішення. Роздуми про наслідки своїх дій без суворості можуть допомогти рости. Можна поглянути на одне нещодавнє рішення й запитати, що Ви залишили б, а що наступного разу зробили б інакше.
  growthReversed: >-
    У перевернутому положенні Справедливість може питати, чи не міряєте Ви себе значно суворішою міркою, ніж інших. Вона може відображати провину, що не минає навіть після того, як урок уже засвоєно. Можна практикувати чесну самооцінку: називати і те, що пішло не так, і те, що вдалося.
