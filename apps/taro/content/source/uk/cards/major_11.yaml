imageryNote: >-
  Справедливість Taro постає зібраною, рівно поставленою фігурою, що тримає врівноважені терези на рівні серця й прямий клинок, спрямований у небо. Фігура дивиться просто на глядача, натякаючи на чесність без прихованого. Дві прості колони й однотонна завіса позаду лишають сцену вільною, ніби звільняючи місце для вдумливої думки. Прохолодні небесно-сині тони й один теплий акцент можуть відображати зустріч розуму й сумління.
