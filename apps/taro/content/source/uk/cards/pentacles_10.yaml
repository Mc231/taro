imageryNote: >-
  Зображення може збирати людей різного віку під аркою, що веде до будинку чи двору, з тваринами, що відпочивають поруч, і десятьма монетами, розміщеними візерунком по всій сцені. Арка може символізувати поріг між приватним і спільним життям, поєднання поколінь — тяглість, а візерунок монет — структуру, збудовану з часом. Теплі, усталені барви можуть натякати на причетність, а насичена композиція — на складність усередині кожної оселі.
