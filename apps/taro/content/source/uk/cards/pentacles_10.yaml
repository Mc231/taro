shortUpright: >-
  Щось, збудоване надовго, може ставати видимим. Помітьте коріння, традиції й людей, завдяки яким Ви відчуваєте себе частиною чогось більшого.
shortReversed: >-
  Старі структури чи очікування можуть здаватися важкими. Можна поміркувати, які традиції зберегти, а які переосмислити для себе.
meaningUpright: |-
  Десятка Пентаклів завершує шлях масті від однієї насінини до цілої оселі. Її традиційна сцена збирає кілька поколінь в одному місці з будинком, аркою, тваринами й монетами, вплетеними в обстановку. Вона говорить про основи, що переживають будь-яку окрему мить: причетність, спільну історію й тривалу турботу, завдяки якій місце стає домом.
  Ви можете впізнати це в родинному зібранні, в обраній родині чи спільноті, що виросла довкола Вас, у традиціях, що передаються, чи у відчутті, що Ваші щоденні зусилля долучаються до чогось, що матиме значення й після цього року. Спадщина тут — не лише багатство. Вона включає історії, цінності, рецепти, навички й способи бути разом.
  Карта запрошує поміркувати, що Ви успадкували і що сподіваєтеся передати. Можна запитати себе, яке коріння Вас живить, яку основу Ви будуєте і як могли б присвячувати час стосункам і практикам, що відчуваються тривкими.
meaningReversed: |-
  У перевернутому положенні Десятка Пентаклів може відображати напругу в структурах, що Вас оточують: родинні очікування, що здаються важкими, традиції, що вже не пасують, чи незгоди щодо спільних ресурсів і обов’язків. Вона може вказувати й на відчуття, що основи, на які Ви спираєтеся, менш міцні, ніж здавалося.
  Часто це запрошення переглянути, а не відкинути. Саме Ви вирішуєте, які частини своєї спадщини, практичної чи емоційної, нести далі.
  Можна назвати одне очікування, за яким Ви жили, хоча воно ніколи по-справжньому не було Вашим. Як виглядало б шанувати своє коріння, водночас формуючи дім на власних умовах? Ясні, добрі розмови про ролі й плани можуть допомогти зміцнити важливе й лагідно послабити те, що ні.
aspects:
  relationshipsUpright: >-
    У стосунках ця карта може відображати глибоку причетність: зв’язки родини, обраної родини чи давньої дружби, що дають відчуття тяглості. Можна помітити традиції та спільні історії, що тримають Ваше коло разом, і подумати, як їх плекати, можливо, започаткувавши новий ритуал чи зберігши старий.
  relationshipsReversed: >-
    У перевернутому положенні карта може вказувати на напругу довкола родинних ролей, обов’язків чи різних цінностей поколінь. Можна поміркувати, які очікування Ви хочете виправдати, а які хотіли б переглянути. Дбайлива межа іноді може захистити стосунки, а не зашкодити їм.
  workUpright: >-
    У роботі Десятка Пентаклів може натякати на будування чогось із тривалою цінністю, як-от організації, доробку чи ролі, що підтримує інших. Можна поміркувати про спадщину своїх зусиль: що Ви вносите таке, на чому інші могли б будувати, і як це задокументувати чи цим поділитися.
  workReversed: >-
    Тут карта може відображати тиск іти успадкованим шляхом, робочу культуру, що не відповідає Вашим цінностям, чи нестабільність структури, на яку Ви покладалися. Можна поміркувати, на якій основі Ви хочете, щоб трималася Ваша робота, і які невеликі зміни могли б наблизити Вас до цього.
  growthUpright: >-
    Для особистісного зростання ця карта запрошує дослідити своє коріння: цінності, звички й історії, що Вас сформували. Можна записати кілька, за які Ви вдячні, і поміркувати, як хочете нести їх далі. Зростання може означати і шану до того, звідки Ви, і рішення про те, що передасте.
  growthReversed: >-
    У перевернутому положенні карта може відображати шаблони, успадковані без вибору, чи відчуття, що Ви ніде цілком не свої. Можна лагідно розглянути один родинний чи культурний сценарій, якого Ви досі дотримуєтеся. Ясно його впізнавши, Ви отримаєте простір зберегти те, що живить, і переписати те, що ні.
