shortUpright: >-
  Пауза — частина роботи; можливо, час відкласти все й дати розуму затихнути.
shortReversed: >-
  Відпочинок, можливо, постійно відкладається, або тихий період готовий завершитися; можна помітити, що з цього правдиве.
meaningUpright: |-
  Четвірка Мечів — карта свідомого відпочинку. Клинки прибрано, не загублено й не зламано, просто відкладено на якийсь час. Після зусиль, конфлікту чи довгого періоду напруженого мислення розумові потрібне місце, де прилягти.
  Це може виглядати як вихідні без планів, вечір без екранів чи просто відмова від ще одного зобов’язання. Вона може відображати період відновлення після чогось вимогливого, коли робити менше — найкорисніше, що можна зробити. Вона може вказувати й на тихі роздуми: час на самоті, щоб розібрати думки, перш ніж повернутися у світ.
  Багатьом людям відпочивати складніше, ніж працювати, бо зупинка дає спливти почуттям і питанням. Ця карта запрошує сприймати відпочинок як навичку, а не як нагороду, яку треба заслужити. Як виглядало б подарувати собі справжню тишу, хай ненадовго? Можна помітити, які паузи Вас освіжають, а які лише відволікають. Повертатися у світ після цього може бути ясніше, коли Ви справді дозволили собі зупинитися.
meaningReversed: |-
  У перевернутому положенні Четвірка Мечів може відображати відпочинок, що постійно відкладається. Можливо, Ви працюєте на запасах, кажучи собі, що сповільнитеся після ще одного завдання. Неспокій, складність вимкнутися чи втома навіть після сну можуть бути сигналами, до яких варто прислухатися.
  Інше прочитання — протилежне: усамітнення тривало досить, і з’являється лагідна готовність повернутися до справ. Тиша, що колись відновлювала, тепер може здаватися униканням, і невеликий крок назад у світ міг би додати енергії, а не забрати її.
  Можна запитати себе, що з цього пасує до Вашої ситуації сьогодні. Вам потрібна пауза, якої Ви ще не зробили, чи Ви готові піднятися з тієї, що вже триває? Так чи інакше, дослухання до власного темпу, а не до чужого, може підказати наступний крок.
aspects:
  relationshipsUpright: >-
    У стосунках ця карта може запрошувати до паузи: часу нарізно, щоб подумати, перерви в гарячій темі чи просто тихого спільного перебування без потреби все обговорювати. Простір може бути турботою, коли його названо й погоджено. Можна сказати комусь близькому, що Вам потрібно трохи відпочити, щоб Вашу тишу сприйняли як перезаряджання, а не як віддалення.
  relationshipsReversed: >-
    У перевернутому положенні Четвірка Мечів може відображати паузу, що перетворилася на дистанцію, чи стосунки, у яких нікому дихнути. Варто поміркувати, чи не час відновити зв’язок після тихого періоду, чи, навпаки, попросити трохи простору. Обидва прохання можна висловити лагідно й без звинувачень.
  workUpright: >-
    У роботі ця карта може вказувати на заплановану паузу: відпустку, легший тиждень чи крок назад після завершення вимогливого проєкту. Відпочинок — частина посильних зусиль. Можна вберегти трохи незапланованого часу, щоб ідеї вляглися самі. Часто рішення, якого Ви не могли знайти під натиском, стає видимим, коли перестаєте дивитися на нього прямо.
  workReversed: >-
    У перевернутому положенні ця карта може відображати роботу крізь виснаження чи нездатність вимкнутися. Можна помітити, де відпочинок постійно сповзає вниз списку. Або вона може позначати готовність повернутися після перерви зі свіжим поглядом. Почати з невеликих посильних завдань може допомогти поступово увійти в ритм, не перевантажуючи себе.
  growthUpright: >-
    Для особистісного зростання Четвірка Мечів запрошує вибудовувати звички відпочинку: регулярні паузи, тихі ранки чи час на природі. Тиша дає думкам нагоду впорядкуватися. Можна поекспериментувати з кількома хвилинами повного неробства й помітити, що з’явиться. Відпочинок — не лінощі; це те, як повертається енергія.
  growthReversed: >-
    У перевернутому положенні ця карта може відображати неспокійний розум, що опирається зупинці, чи усамітнення, яке непомітно стало схованкою. Можна лагідно звіритися із собою: чи ця пауза досі щось Вам дає? Якщо відпочинок здається неможливим, коротка прогулянка чи повільніше дихання можуть стати початком. Якщо Ви готові рухатися, починайте м’яко.
reflectionQuestions:
