    Який відпочинок справді Вас відновлює, а не просто заповнює час?
  - >-
    Хто у Вашому житті зрозумів би, якби Ви попросили тихий день?
  - >-
    Яке одне зобов’язання Ви могли б відкласти цього тижня, щоб звільнити місце для тиші?
imageryNote: >-
  Оригінальне зображення показує фігуру, що відпочиває на низькій кам’яній лаві в тихому склепінчастому просторі. Три клинки спокійно висять на стіні вгорі, а четвертий лежить пласко під лавою, усі прибрані. Крізь невелике вікно падає м’яке світло. Замкнена кімната натякає на безпечне усамітнення, прибрані клинки — на думки, відкладені на потім, а лагідне світло — на те, що світ надворі терпляче чекає.
