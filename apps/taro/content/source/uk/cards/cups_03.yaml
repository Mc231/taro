imageryNote: >-
  Зображення показує три фігури у вільному колі, їхні чаші підняті й зустрічаються посередині. Біля ніг урожай фруктів, квітів чи лози може натякати на достаток, що виростає зі спільних зусиль. Різний одяг, пози й кольори можуть уособлювати друзів, які лишаються самобутніми, водночас належачи одне одному. Рух у сцені, як-от танцювальний крок чи край одягу, що крутиться, передає легку, невимушену радість.
