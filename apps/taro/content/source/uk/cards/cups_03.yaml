shortUpright: >-
  Мить помітити, хто ділить Ваші радощі і як Ви могли б розділити їхні у відповідь.
shortReversed: >-
  Зв’язки зараз можуть здаватися тонкими чи втомливими; подумайте, які зустрічі Вас живлять, а які лише заповнюють час.
meaningUpright: |-
  Трійка Кубків — карта друзів, що разом піднімають чаші. Вона вшановує той зв’язок, якому не потрібна причина: сміх за кухонним столом, груповий чат, що спалахує добрими новинами, сусідів, що допомагають, не чекаючи прохання. Якщо Двійка Кубків дивиться на один зв’язок, то ця карта дивиться на коло.
  Вона може відображати пору зустрічей, віху, яку варто відзначити, чи просто відчуття належності до групи, яка Вас бачить. Вона може вказувати й на підтримку, що вже є довкола, можливо, більшу, ніж Ви помічали.
  Ця карта запрошує дозволити радості бути спільною, а не відкладати її на потім. Можна написати комусь, із ким давно хотіли побачитися, прийняти запрошення чи влаштувати власну невелику нагоду. Святкування не мусить бути грандіозним. Іноді це просто спільне визнання, що сталося щось добре або що вдалося пройти через щось важке.
meaningReversed: |-
  У перевернутому положенні Трійка Кубків може відображати соціальне життя, що звучить не в тон. Можливо, Ви почуваєтеся на краю групи, частиною якої колись були, або помічаєте, що дружба віддалилася, коли життя змінилися. Або ж доброго може бути забагато: плани, що не лишають місця для відпочинку, чи свята, які стали способом уникати тихіших почуттів.
  Ніщо з цього не є вироком Вашим дружбам. Кола змінюють форму, і природно переростати одні зустрічі й сумувати за іншими.
  Запрошення — поглянути на якість зв’язків, а не на їхню кількість. Після яких людей Ви почуваєтеся більше собою? Де Ви, можливо, погоджуєтеся за звичкою? Одна щира зустріч з одним другом може дати більше, ніж переповнений календар.
aspects:
  relationshipsUpright: >-
    У стосунках ця карта підкреслює ширшу мережу довкола зв’язку: друзів, родину, обрану родину. Вона може запрошувати ділитися добрими моментами з людьми, які Вас підтримують, або прийняти когось близького до свого кола. Можна помітити й те, як сильно Вас тримають дружби, і приділити їм трохи уваги, яку зазвичай віддають одним стосункам.
  relationshipsReversed: >-
    У перевернутому положенні ця карта може відображати напругу в групі чи відчуття, що Вас лишили осторонь. Вона може вказувати й на зовнішній вплив на зв’язок, у будь-якій формі. Замість здогадуватися, можна просто запитати, як справи. Також може допомогти час із людьми, поруч із якими не треба грати роль чи встигати за кимось.
  workUpright: >-
    У роботі Трійка Кубків може вказувати на командний дух, спільну перемогу чи колег, яким щиро подобається працювати разом. Вона може запрошувати відзначати поступ дорогою, а не лише на фініші. Подяка людям на ім’я, розділені заслуги й відзначені невеликі віхи можуть зробити групу сильнішою, а роботу — приємнішою.
  workReversed: >-
    У перевернутому положенні карта може відображати команду, що втратила тепло, можливо, через плітки, угруповання чи просте перевантаження. Можна помітити, чи не впливає соціальний тиск на Ваші рішення, як-от залишатися допізна, щоб вписатися. Подумайте, як виглядала б для Вас здорова колегіальність і де Ви могли б подати їй приклад у дрібниці.
  growthUpright: >-
    Для особистісного зростання ця карта запрошує цінувати радість як частину збалансованого життя, а не як нагороду, яку спершу треба заслужити. Можна протягом тижня занотовувати маленькі спільні втіхи. Помічаючи їх, легше впізнати спільноту, яка вже є, і побачити, де Ви хотіли б її розширити.
  growthReversed: >-
    У перевернутому положенні ця карта може питати, чи не використовуєте Ви зайнятість чи компанію, щоб не лишатися наодинці зі своїми думками. Вона може відображати й самотність, у якій важко зізнатися. Можна збалансувати час із людьми й час на самоті та помітити, чого бракує більше. Звернутися до однієї людини може бути лагідним початком.
