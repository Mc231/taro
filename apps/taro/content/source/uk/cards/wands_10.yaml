imageryNote: >-
  Фігура йде, зігнувшись уперед, обхопивши руками високий оберемок із десяти жезлів, що майже ховає її обличчя, до невеликого будинку чи містечка на обрії. Оберемок уособлює накопичені обов’язки, сховане обличчя — те, як важка ноша може звужувати погляд, а близький пункт призначення — кінець, що вже досяжний. Відкрита дорога лишає місце уявити, що ношу розділено чи покладено.
