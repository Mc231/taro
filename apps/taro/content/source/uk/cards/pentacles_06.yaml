shortUpright: >-
  Ресурси, час і турбота рухаються між людьми. Помітьте, як Ви даєте, як приймаєте і що здається справедливим для всіх.
shortReversed: >-
  Обмін може здаватися однобоким. Можна поглянути, що дається, чого чекають у відповідь і що відчувалося б рівніше.
meaningUpright: |-
  Шістка Пентаклів показує фігуру з терезами, що ділиться монетами з іншими. Це карта про рух ресурсів між людьми: грошей, так, але й часу, уваги, порад, терпіння й практичної допомоги. Терези натякають на дбайливість щодо справедливості, а відкрита рука — на готовність ділитися.
  Можливо, Ви зараз у становищі, коли можете давати: допомогти другові, стати наставником для когось чи підтримати важливу для Вас справу. Або Ви, можливо, приймаєте: послугу, руку допомоги чи другий шанс. Обидві ролі мають свою гідність, і більшість із нас із часом переходить між ними.
  Ця карта запрошує поміркувати про дух Ваших обмінів. Чи даєте Ви вільно, чи з тихими очікуваннями? Чи можете приймати, не почуваючись меншими? Можна помітити, де щедрість створює справжній зв’язок, а де трохи більше рівноваги чи чесності дали б усім залученим відчути повагу.
meaningReversed: |-
  У перевернутому положенні Шістка Пентаклів може вказувати на обмін, що став нерівним. Одна людина може давати значно більше, ніж отримує, або допомога може мати невисловлені умови: очікувану вдячність, вплив на рішення, відчуття боргу. Вона може відображати й складність приймати взагалі, ніби прийняти допомогу означає втратити становище.
  Це запрошення переглянути терези без звинувачень. Дисбаланс часто наростає тихо, зі звички, а не з наміру.
  Можна поглянути на одні стосунки чи домовленість, де давання й отримання здаються розладнаними. Чи є щось, що Ви давали й що стало виснажливим? Чи є підтримка, від якої Ви відмовлялися? Ясно назвати очікування чи скоригувати, скільки Ви пропонуєте, може відновити обмін, що здається справедливим і вільно обраним з обох боків.
aspects:
  relationshipsUpright: >-
    У стосунках ця карта може відображати щедру взаємну турботу: підтримку, що з часом тече в обидва боки, навіть якщо в певний день вона нерівна. Можна помітити, як Ви виявляєте турботу практично і як дозволяєте іншим дбати про Вас. Конкретна подяка комусь за те, що він дає, може зберегти цей потік теплим і видимим.
  relationshipsReversed: >-
    У перевернутому положенні карта може натякати на зв’язок, де одна людина відчуває, що дає більше, або де допомога несе зобов’язання. Можна лагідно сказати, як для Вас відчувається баланс, не ведучи рахунку. Іноді найдобріша зміна — попросити те, чого потребуєте, або дозволити комусь допомогти, не наполягаючи одразу повернути борг.
  workUpright: >-
    У роботі ця карта може описувати обмін знаннями, наставництво, справедливе визнання чи взаємну підтримку. Можливо, Ви можете відчинити комусь двері або з гідністю прийняти пораду. Вона запрошує помітити, як довкола Вас розподіляються ресурси й заслуги і як Ви могли б посприяти справедливішому потоку.
  workReversed: >-
    Тут карта може відображати невизнані зусилля, послуги, що створюють тиск, чи неясні очікування щодо того, хто кому винен. Можна уточнити домовленості, сказати про свій внесок чи помітити, де Ви за замовчуванням робите додаткову роботу. Чесний обмін на роботі часто починається з того, що невидиме стає видимим.
  growthUpright: >-
    Для особистісного зростання Шістка Пентаклів запрошує дослідити власні стосунки зі щедрістю. Де давати радісно? Де приймати комфортно? Можна цього тижня зробити один невеликий щедрий вчинок і один раз щось прийняти, помічаючи, що кожне з цього у Вас пробуджує.
  growthReversed: >-
    У перевернутому положенні карта може відображати давання як спосіб відчути власну цінність чи відмову від допомоги, щоб зберегти контроль. Можна дослідити, де почалися ці шаблони і чи досі вони пасують. Дозвіл собі бути по обидва боки терезів може поглибити самоповагу й довіру.
reflectionQuestions:
  - "Де Ви зазвичай даєте найвільніше, а де стримуєтеся?"
  - >-
    Який обмін у Вашому житті здається нерівним і що зробило б його справедливішим?
  - >-
    Як Ви могли б цього тижня прийняти від когось допомогу, не відчуваючи себе в боргу?
imageryNote: >-
  Зображення може зосереджуватися на фігурі, що стоїть із врівноваженими терезами в одній руці, а другою простягає монети людям поруч. Шість монет можуть бути розміщені по всій сцені: одні в руках, інші в повітрі між ними. Терези можуть символізувати справедливість і зважливість, простягнута рука — щедрість, а різні пози фігур — питання влади, що може тихо ховатися в будь-якому обміні.
