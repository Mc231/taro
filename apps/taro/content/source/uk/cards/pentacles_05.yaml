shortUpright: >-
  Певна пора може здаватися холодною чи бідною. Допомога іноді ближче, ніж здається, навіть коли попросити важко.
shortReversed: >-
  Важкий період, можливо, минає. Можна помітити, де тепло й підтримка знову починають до Вас доходити.
meaningUpright: |-
  П’ятірка Пентаклів — одна з тихіших і важчих карт масті. Її традиційна сцена показує людей, що бредуть снігом повз освітлене вікно, зосереджені на холоді й дорозі попереду. Вона може говорити про часи, коли ресурсів, причетності чи енергії бракує і здається, що всі інші всередині, а Ви — надворі.
  Це може відображати період скрутного бюджету, самотній час після переїзду, відчуття, що Вас виключили з групи, чи просто втому від довгої зими зусиль. Карта не засуджує цих почуттів. Вона визнає їх справжніми й людськими.
  Її лагідніша нитка — у вікні. Підтримка може бути поруч: у друга, у громадській службі, у сусіда чи в групі людей, що пройшли подібний шлях, а складність часто в тому, щоб її помітити чи дозволити собі постукати. Можна запитати себе, яку допомогу Ви запропонували б комусь у Вашому становищі і чи могли б дати собі той самий дозвіл звернутися.
meaningReversed: |-
  У перевернутому положенні П’ятірка Пентаклів може відображати повільне повернення стійкості після важкого часу. Можливо, Ви знаходите прихисток через практичну допомогу, відновлені зв’язки чи невелику зміну, що робить щоденне життя менш напруженим. Тепло може повертатися поступово, і його варто помічати, навіть коли воно скромне.
  Карта може вказувати й на тривогу, що лишається після того, як обставини покращилися: звичку напружуватися в очікуванні холоду навіть тоді, коли двері вже відчинилися. Раніше ця пильність мала сенс. Тепер її, можливо, можна послабити.
  Можна підбити підсумок того, що змінилося, хай трохи, і визнати стійкість, яка Вас пронесла. Де Ви могли б прийняти трохи більше підтримки чи запропонувати її комусь, хто ще в снігу? Відновлення часто поглиблюється, коли ним діляться.
aspects:
  relationshipsUpright: >-
    У стосунках ця карта може відображати відчуття, що Ви ззовні: друзі Вас не помічають, родина далеко, або Ви разом із кимось проходите складний час. Можна помітити, хто намагався до Вас достукатися, хай і недосконало. Якщо дати знати одній людині, якій довіряєте, через що Ви проходите, спільна скрута може стати спільним теплом.
  relationshipsReversed: >-
    У перевернутому положенні карта може натякати на відновлення зв’язку після періоду дистанції чи на готовність дозволити іншим допомогти. Вона може відображати й затаєну образу через те, що Вас лишили осторонь. Можна чесно визнати це почуття, водночас помічаючи людей, які поруч зараз, і подумати про один спосіб підпустити їх трохи ближче.
  workUpright: >-
    У роботі П’ятірка Пентаклів може віддзеркалювати скрутний період: обмежені ресурси, відчуття невизнання чи того, що Ви поза колом ухвалення рішень. Можна пошукати освітлені вікна, доступні Вам, як-от колегу, мережу підтримки чи програму розвитку навичок, і подумати, який практичний крок зменшив би напругу.
  workReversed: >-
    Тут карта може відображати умови, що починають покращуватися, чи готовність попросити потрібної підтримки. Вона може вказувати й на обережність, що лишається після важкого періоду. Можна помітити, що змінилося, і дозволити своїм планам відображати стійкіший ґрунт, зберігаючи уроки, яких навчили важкі часи.
  growthUpright: >-
    Для особистісного зростання ця карта запрошує до співчуття до себе в скрутні чи самотні часи. Труднощі не означають, що Ви зробили щось не так. Можна дослідити, що ускладнює прохання про допомогу. Якщо важкі почуття не минають, розмова з людиною, якій довіряєте, чи з кваліфікованим фахівцем може стати вагомим джерелом підтримки.
  growthReversed: >-
    У перевернутому положенні карта може відображати зростання довіри до себе після важкого періоду. Можна помітити невеликі ритуали, людей і рішення, що допомогли Вам пройти. Якщо назвати їх, до них легше повертатися. Подумайте, як Ви могли б перенести частину цього вистражданого розуміння в доброту до інших, хто стикається з подібною зимою.
reflectionQuestions:
  - >-
    Де у Вашому житті зараз чогось бракує чи щось здається недосяжним?
  - >-
    Хто, можливо, ближче й охочіше допоможе, ніж Ви дозволяли собі помітити?
  - >-
    Яким одним невеликим способом Ви могли б упустити тепло чи підтримку цього тижня?
imageryNote: >-
  Зображення може показувати дві фігури, що йдуть уздовж стіни крізь сніг чи дощ, схиливши голови від негоди, а над ними світиться вікно з п’ятьма монетами у візерунку. Контраст холодної дороги й освітленого вікна може символізувати скруту поруч із близьким прихистком. Розташування вікна, трохи поза полем зору фігур, натякає на підтримку, яка є, але ще не помічена й не досягнута.
