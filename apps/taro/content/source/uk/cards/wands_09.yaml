imageryNote: >-
  Фігура стоїть у сутінках усередині кола жезлів, встромлених у землю, спирається на один із них і дивиться назовні пильним поглядом. Поруч тихо жевріє невелике багаття. Коло жезлів натякає на захист, збудований досвідом, низький вогонь — на енергію, яку вдалося зберегти після довгих зусиль, а згасаюче світло — на день, що добігає кінця. Пильна постава поєднує і втому, і наполегливість, що веде далі.
