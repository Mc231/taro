meaningUpright: |-
  Дев’ятка Жезлів показує когось, хто пройшов через випробування й досі стоїть на ногах. Фігура спирається на один жезл, трохи втомлена й пильна, усередині кола з інших жезлів, встромлених у землю, наче паркан, який вона сама збудувала. Це стійкість, що має синці досвіду: не неторкана, але й не переможена.
  Вона може звертатися до Вас, коли довгий проєкт майже завершено, коли Ви проходите вимогливий період догляду за кимось чи навчання або коли Ви пережили невдачі й вирішили йти далі. Тепер Ви знаєте більше, ніж на початку, зокрема й те, де Ваші межі.
  Ця карта запрошує визнати, який шлях Ви пройшли, і скористатися тим, чого навчилися. Наполегливість цінна, але так само цінне вміння розподіляти сили. Можна запитати себе, що допомогло б на цьому останньому відтинку: ясна фінішна лінія, кілька годин відпочинку, практична межа чи нагадування, що кінець ближче, ніж здається.
meaningReversed: |-
  У перевернутому положенні Дев’ятка Жезлів може відображати втому, що накопичувалася з часом. Вам може здаватися, що Ви так довго захищали себе чи свої проєкти, що розслабитися неможливо. Обережність, засвоєна з минулих труднощів, може перетворитися на підозріливість до кожної нової ситуації.
  Ця карта може вказувати й на досягнуту межу. Пробиватися далі не завжди найсильніший вибір; іноді сила полягає в тому, щоб визнати, що потребуєте перерви чи допомоги.
  Можна дослідити, де Ваш захист ще корисний, а де він тепер не пускає не лише труднощі, а й підтримку. Чи є людина, на яку Ви могли б спертися, завдання, яке могли б передати, чи пауза, яку могли б собі дозволити? Трохи послабити захист у безпечному місці — це спосіб подбати про стійкість, яку Ви збудували.
aspects:
  relationshipsUpright: >-
    У близьких стосунках ця карта може відображати зв’язок, що пережив важкі часи й досі тримається. Вона може вказувати й на обережність, засвоєну з минулих ран. Можна оцінити стабільність, яку Ви збудували разом, і помітити, чи потрібна ще давня настороженість із людиною, яка показала, що їй можна довіряти.
  relationshipsReversed: >-
    У перевернутому положенні Ви, можливо, тримаєте інших на відстані, щоб знову не розчаруватися, або почуваєтеся надто втомленими, щоб давати стільки, як зазвичай. Варто поміркувати, чи не сказати комусь близькому, що Ваші сили на межі. Дозвіл собі приймати підтримку може поглибити зв’язок, а не послабити його.
  workUpright: >-
    У роботі чи навчанні Дев’ятка Жезлів може вказувати на фінальний ривок у довгих зусиллях. Досвід зробив Вас реалістичнішими щодо перешкод, і це знання корисне. Можна ретельно спланувати решту кроків, берегти зосередженість і нагадувати собі, навіщо Ви почали, щоб останній відтинок мав мету, а не лише виснажував.
  workReversed: >-
    У перевернутому положенні Ви, можливо, близькі до межі, працюєте в обороні чи відчуваєте, що мусите впоратися з усім самі. Можна поглянути, що можна делегувати, відкласти чи спростити. Чесна розмова про свої можливості може бути відповідальним вибором, що береже і Вас, і роботу.
  growthUpright: >-
    Можливо, Ви витриваліші, ніж визнаєте. Кожна трудність, з якою Ви стикалися, чогось навчила Вас про те, із чим Ви здатні впоратися. Можна записати кілька уроків із нещодавніх випробувань і поміркувати, як вони могли б вести Вас далі з трохи більшою впевненістю й трохи меншим напруженням.
  growthReversed: >-
    У перевернутому положенні постійна пильність може давати взнаки. Можна дослідити, як виглядає відпочинок для Вас і чи дозволяєте Ви собі його досить. Якщо послаблювати захист у невеликих безпечних формах, як-от тихий вечір чи чесна розмова, Ваша сила може менше нагадувати обладунок.
