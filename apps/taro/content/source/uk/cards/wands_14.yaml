shortUpright: >-
  Ясна, далекоглядна енергія запрошує вести з метою й перетворювати великі ідеї на напрямок, яким можуть іти інші.
shortReversed: >-
  Сильний натиск може переходити в нетерплячість чи контроль; можна перевірити, чи лишає Ваше бачення місце для інших.
meaningUpright: |-
  Король Жезлів доводить вогонь масті до зрілості. Він сидить на троні, але трохи нахилився вперед із жезлом у руці, ніби готовий діяти. Енергія тут далекоглядна й рішуча: це хтось, хто бачить, куди все може рухатися, і має впевненість і досвід, щоб задати напрямок.
  Ця якість може виявлятися, коли Ви берете на себе проєкт, ведете групу крізь зміни чи ухвалюєте сміливе рішення, що спирається на ясні цінності. Вона може описувати й наставника чи лідера, чиє відчуття мети додає іншим мужності.
  Ця карта запрошує увійти у власний авторитет. Лідерство тут — менше про контроль і більше про бачення, цілісність і доведення справ до кінця. Можна запитати себе, якій більшій меті служать Ваші теперішні зусилля і як ясно поділитися нею із залученими людьми. Коли напрямок чесний і добре пояснений, інші часто хочуть до нього долучитися, а не просто виконувати накази.
meaningReversed: |-
  У перевернутому положенні Король Жезлів може відображати рушійну силу, що втратила рівновагу. Вас може дратувати чужий темп, Ви можете проштовхувати плани, не слухаючи, або ставити такі високі цілі, що не лишається місця для відпочинку. З іншого боку, він може вказувати на лідера, можливо, Вас самих, що втратив бачення й не певен, куди рухатися далі.
  Ця карта може запрошувати поглянути, як Ви користуєтеся своїм впливом. Ваша енергія надихає людей чи пригнічує їх? Чи бачення досі живе для Вас?
  Можна зупинитися, щоб знову відчути свою мету, попросити чесного відгуку чи ширше ділитися ухваленням рішень. Сильне лідерство часто зростає з уміння слухати так само, як і з уміння спрямовувати.
aspects:
  relationshipsUpright: >-
    У стосунках ця карта може відображати впевнену, захисну й підбадьорливу присутність. Можна приносити бачення в спільні плани й допомагати близьким повірити у власні цілі. Запрошення тут — вести щедро: пропонувати напрямок, коли він доречний, і підтримку, коли кермувати хоче хтось інший.
  relationshipsReversed: >-
    У перевернутому положенні одна людина може брати надто багато контролю над рішеннями, або нетерплячість може створювати напругу. Можна помітити, чи слухаєте Ви когось близького повністю, чи вже плануєте відповідь. Запрошення до ідей іншої людини може перетворити однобічний план на спільний.
  workUpright: >-
    У роботі чи проєкті Король Жезлів може вказувати на лідерство, стратегічне бачення й мужність проявити ініціативу. Можна визначити ясну мету, донести її з ентузіазмом і делегувати так, щоб довіряти сильним сторонам інших. Цілісність і послідовність допомагають людям почуватися безпечно, ідучи за амбітним напрямком.
  workReversed: >-
    У перевернутому положенні Ви, можливо, тиснете надто сильно, чекаєте, що інші йтимуть у Вашому темпі, або самі не певні напрямку. Можна відступити й переглянути бачення разом із залученими людьми. Запит думок і корекція цілей можуть зробити план і реалістичнішим, і ширше підтримуваним.
  growthUpright: >-
    Для особистісного зростання ця карта запрошує взяти відповідальність за свій напрямок. Що Ви хочете збудувати в довшій перспективі і які цінності цим керують? Можна написати коротке формулювання своєї мети й використовувати його як орієнтир для майбутніх рішень.
  growthReversed: >-
    У перевернутому положенні можна дослідити свої стосунки з контролем і терпінням. Ви відчуваєте, що завжди мусите керувати, чи уникаєте лідерства, бо воно здається надто важким? Пошук середнього шляху, коли Ви ведете власне життя впевнено й гнучко, може стати стійкою формою сили.
reflectionQuestions:
  - >-
    До якого бачення Ви йдете і наскільки ясно могли б описати його комусь іншому?
  - >-
    Як Ви могли б вести так, щоб запрошувати інших долучати свої сильні сторони?
  - >-
    Де трохи більше терпіння зробило б Вашу рушійну силу дієвішою?
imageryNote: >-
  Фігура сидить на високому сидінні на краю оглядового майданчика, нахилившись уперед, поруч міцно встромлено квітучий жезл, ніби вона от-от підведеться. За нею дорога в’ється до далеких пагорбів, освітлених призахідним сонцем. Квітучий жезл натякає на живе бачення, що росте, оглядовий майданчик — на широкий погляд на те, що можна збудувати, а нахил уперед — на готовність перетворювати ідеї на дії. Жаринки чи невеликі мотиви полум’я можуть передавати стихію вогню.
