meaningUpright: |-
  Десятка Мечів позначає кінець складного розділу. Усе, що могло піти не так у певній ситуації, ніби пішло, і є втомлена тиша в тому, щоб це визнати. Та на обрії небо вже світлішає. Ця карта стільки ж про завершення, скільки про біль.
  Ви можете впізнати її в миті, коли перестаєте боротися із ситуацією, що явно вичерпала себе: проєкт, який не вдалося врятувати, шаблон, який Ви нарешті бачите таким, яким він є, чи період напруження, що лишив Вас виснаженими. Часто є дивне полегшення в тому, щоб дійти до дна, бо вже не треба напружуватися в очікуванні нових падінь.
  Ця карта запрошує дозволити завершенню бути завершенням. Не треба його драматизувати чи проскакувати повз нього. Можна запитати себе, чого навчив Вас цей розділ і що Ви готові перестати нести. Відпочинок тут доречний. Починати знову не обов’язково сьогодні, але Ви можете помітити, що перше світло вже тут і чекає, поки Ви підведете погляд.
meaningReversed: |-
  У перевернутому положенні Десятка Мечів може відображати повільне відновлення після важкого часу. Найгірше, можливо, минуло, і можна помітити невеликі ознаки повернення стійкості: кращий сон, мить гумору, бажання знову будувати плани. Підйом часто поступовий, із добрими днями й важчими.
  Інше прочитання — опір завершенню, що вже відбулося, спроби оживити те, що потребує спокою, чи прокручування болісного розділу замість того, щоб закрити його.
  Ця карта запрошує зібрати те, чого Ви навчилися, а решту відпустити. Можна бути лагідними до себе щодо темпу відновлення. Підтримка інших, прості ритуали й терпіння можуть допомогти відбудуватися. Яка частина Вашого життя здається готовою почати знову, хай навіть тихо?
aspects:
  relationshipsUpright: >-
    У стосунках ця карта може відображати кінець шаблону, етапу чи надії, яку не вдалося втримати. Це може відчуватися важко й остаточно. Можна дозволити собі сумувати за тим, що не вдалося, і водночас помітити полегшення, якщо воно є. Завершення можуть звільнити місце для чесніших зв’язків, із собою та з іншими, коли Ви будете готові.
  relationshipsReversed: >-
    У перевернутому положенні Десятка Мечів може вказувати на відновлення після болісного часу між людьми чи на складність прийняти, що щось змінилося. Можна помітити, чи не тримаєтеся Ви за те, що не може повернутися. Опора на друзів, які лишилися поруч, може допомогти відбудувати довіру й тепло у власному темпі.
  workUpright: >-
    У роботі ця карта може відображати проєкт чи роль, що доходять природного кінця, іноді після чималих зусиль. Вона може показувати й вигорання, відчуття, що більше нічого дати. Можна визнати, що деякі речі неможливо тиснути далі. Підбиття підсумків того, що Ви здобули, і відпочинок перед наступним кроком можуть зберегти Вашу енергію.
  workReversed: >-
    У перевернутому положенні ця карта може натякати на поступове знаходження опори після невдачі. Мотивація може повертатися невеликими хвилями. Можна почати зі скромних цілей і відзначати кожну. Якщо помітите, що намагаєтеся оживити щось справді завершене, може допомогти перенаправити цю енергію на те, що може бути далі.
  growthUpright: >-
    Для особистісного зростання Десятка Мечів запрошує бачити завершення як частину більшого циклу. Досягнення найнижчої точки може зняти вдавання й показати, що справді важливо. Можна написати про те, чого навчив Вас цей розділ, не поспішаючи шукати срібну підкладку. Чесне визнання — сила сама по собі.
  growthReversed: >-
    У перевернутому положенні ця карта може відображати тихе повернення надії й енергії. Можна помітити, як Ваші сили знову зростають, крок за кроком. Будьте терплячими до днів, що здаються відкатом назад; відновлення рідко рухається прямою лінією. Подумайте, які уроки хочете взяти далі, а які старі історії готові покласти назавжди.
