imageryNote: >-
  Оригінальне зображення показує десять клинків, покладених поруч на рівній землі біля темного озера, наче інструменти, відкладені наприкінці довгого дня. Нічне небо вгорі важке, але вздовж далекого обрію простягається ясна смуга золотого світла. Ряд клинків натякає на завершений цикл, тиха вода — на виснаження й відпочинок, а світанок — на те, що починається новий день.
