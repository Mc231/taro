imageryNote: >-
  Оригінальне зображення показує вершника, що нахилився вперед на коні в галопі, із виставленим клинком і плащем, що лопотить на вітрі. Дерева на схилі гнуться в той самий бік, а рвані хмари мчать угорі. Нахил уперед і хмари, що мчать, натякають на розгін і переконаність, а зігнуті дерева — на силу, з якою така швидкість діє на все довкола.
