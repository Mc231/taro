shortUpright: >-
  Розгін уже тут; можна спрямувати швидке мислення в цілеспрямовані дії, не втрачаючи з поля зору тих, хто поруч.
shortReversed: >-
  Швидкість може випереджати думку; ненадовго сповільнившись, легше дістатися туди, куди Ви справді прямуєте.
meaningUpright: |-
  Лицар Мечів мчить уперед на повній швидкості, із виставленим клинком і ревучим вітром. Ця карта несе енергію розуму, що ухвалив рішення й хоче діяти негайно. Вона говорить про цілеспрямованість, мужність висловитися й захват від того, щоб іти за ідеєю без вагань.
  Ви можете впізнати цю карту, коли відчуваєте готовність узятися за проблему прямо, обстояти принцип чи нарешті зрушити застиглий проєкт. Вона може відображати спалах продуктивності, гострий і добре сформульований аргумент чи готовність сказати складне, чого інші уникають. Ця рушійна сила справді цінна; вона може подолати інерцію й зрушити справу.
  Ця карта запрошує поміркувати й про шлях попереду. Швидкість може пронести Вас повз важливі деталі, а сильні думки — заглушити тихіші голоси. Можна запитати себе, чи служить Ваш розгін ясній меті і чи рухаються інші разом із Вами, чи лишаються позаду. Як зберегти мужність і прямоту цієї енергії, водночас дбайливо обираючи напрямок?
meaningReversed: |-
  У перевернутому положенні Лицар Мечів може відображати енергію, що розпорошена чи рухається надто швидко. Можливо, Ви починаєте справи імпульсивно, говорите різко чи рветеся вперед без ясного відчуття, куди прямуєте. Наслідком можуть бути тертя, утома чи потреба повертатися назад.
  Інше прочитання — заблокований розгін: бажання діяти, яке стримують обставини чи сумніви, і яке може накопичуватися в роздратування.
  Ця карта запрошує на мить перевести коня на крок. Можна перевірити напрямок, подумати про вплив своїх слів і запитати себе, чи справді потрібна така терміновість. Подих перед дією не послаблює рішучості; він може її сфокусувати. Що змінилося б, якби Ви рухалися з метою, а не поспіхом?
aspects:
  relationshipsUpright: >-
    У стосунках Лицар Мечів може відображати прямоту: казати, що думаєте, розпочати розмову, якої уникали, чи заступитися за когось. Чесність може очистити атмосферу. Можна поєднувати швидкість із турботою, даючи іншій людині час відповісти й відчути, що її почули, а не придавили силою Вашої переконаності.
  relationshipsReversed: >-
    У перевернутому положенні ця карта може вказувати на слова, сказані поспіхом, суперечки, що швидко загострюються, чи нетерплячість до чужого темпу. Можна помічати, коли Ви поспішно робите висновки про те, що має на увазі інша людина. Сповільнитися, поставити питання чи просто почекати день із відповіддю може вберегти від непотрібного болю.
  workUpright: >-
    У роботі Лицар Мечів може натякати на ривок, щоб завершити справи: розібрати завали, обстояти пропозицію чи швидко скористатися ясною нагодою. Ваша зосередженість може надихати інших. Можна тримати спілкування відкритим, щоб команда розуміла Ваш напрямок, і двічі перевіряти ключові деталі, щоб швидкість не шкодила якості.
  workReversed: >-
    У перевернутому положенні ця карта може відображати кидання в завдання без плану, сутички з колегами чи роздратування повільними процесами. Можна зупинитися, щоб визначити пріоритети, і подумати, чи витримає швидке рішення. Якщо поступ заблоковано, спрямування енергії в підготовку може зробити майбутній крок значно дієвішим.
  growthUpright: >-
    Для особистісного зростання Лицар Мечів запрошує діяти відповідно до своїх переконань. Можна обрати одну мету й зосереджено до неї йти, помічаючи енергію, яку дають віддані зусилля. Мужність говорити й рухатися цінна; поєднання її з роздумами допомагає рости в напрямку, якого Ви справді хочете.
  growthReversed: >-
    У перевернутому положенні ця карта може відображати неспокій чи імпульсивні рішення. Можна помітити, що живить бажання поспішати: захват, тривога чи бажання уникнути незручності. Невеликі паузи протягом дня, хай кілька подихів перед рішенням, можуть допомогти відповідати вдумливо, а не реагувати.
reflectionQuestions:
