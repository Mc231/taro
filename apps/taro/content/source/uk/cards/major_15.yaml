shortUpright: >-
  Звичка чи прив’язаність може тримати Вас міцніше, ніж Ви усвідомлюєте. Помітити це — перший крок.
shortReversed: >-
  Шаблон, що колись міцно тримав, може слабшати. Що допомогло б Вам відступити ще далі?
meaningUpright: |-
  Диявол — не про зло. Це карта про шаблони й прив’язаності, які можуть нас тримати, часто з нашої мовчазної згоди. Її традиційний образ показує дві фігури, вільно скуті ланцюгами, причому ланцюги зазвичай настільки вільні, що їх можна скинути. Карта питає: що тримає Вас тут і наскільки це Ваш вибір?
  У повсякденному житті ця карта може відображати гортання стрічки до пізньої ночі, згоду зі страху когось розчарувати, гонитву за схваленням чи втіхою так, що потім почуваєтеся ще спустошенішими, або перебування в розпорядку, що вже не служить Вам, бо піти здається надто непевним. Вона може вказувати й на ті частини себе, на які Ви воліли б не дивитися, як-от заздрість, образу чи бажання, які зазвичай сильнішають, коли їх ігнорують.
  Ця карта запрошує Вас поміркувати, що має над Вами більше влади, ніж Вам хотілося б. Можна запитати себе, яку потребу намагається задовольнити звичка і чи немає добрішого способу її задовольнити. Диявол підкреслює усвідомлення без сорому. Ясно побачити шаблон — часто саме та мить, коли він починає слабшати.
meaningReversed: |-
  У перевернутому положенні Диявол може відображати послаблення. Звичка, динаміка у стосунках чи переконання, що колись здавалися незламними, можуть втрачати хватку, і Ви, можливо, починаєте бачити інші варіанти. Це може принести полегшення разом із певною непевністю щодо того, хто Ви без старого шаблону.
  Ця карта може вказувати й на роботу зустрічі зі своєю тінню: чесний погляд на складні почуття чи мотиви та їх прийняття як частини людської природи.
  Можливо, варто помітити невеликі кроки, які Ви вже зробили геть від того, що Вас тримало. Що зробило їх можливими? Якщо тримати ці опори поруч і просити допомоги там, де тяжіння ще сильне, зміна може стати тривалішою. Свобода часто зростає повільно, по одному вибору за раз.
aspects:
  relationshipsUpright: >-
    У стосунках Диявол може відображати шаблони залежності, ревнощів чи контролю з будь-якого боку або зв’язок, що тримається більше на звичці, ніж на турботі. Він може запрошувати чесно поглянути, що Вас поєднує і чи почуваються обоє вільними. Лагідно назвати шаблон — означає відкрити простір, щоб його змінити.
  relationshipsReversed: >-
    У перевернутому положенні ця карта може вказувати на крок назад від нездорової динаміки чи на межу, яку було важко встановити. Варто поміркувати, якої підтримки Ви потребуєте, щоб цю межу втримати. Вона може відображати й стосунки, що стають чеснішими, коли приховані почуття виходять назовні.
  workUpright: >-
    У роботі чи проєкті Диявол підкреслює відчуття прив’язаності до чогось: довгих годин, потреби у схваленні чи ролі, у якій лишаєтеся переважно зі страху змін. Можна запитати себе, що Ви отримуєте від ситуації, чого вона Вам коштує і чи могли б невеликі зміни повернути відчуття вибору.
  workReversed: >-
    У перевернутому положенні Диявол може відображати звільнення від непродуктивної робочої звички, як-от перфекціонізму чи постійної доступності. Він може вказувати й на усвідомлення тиску, який Ви вважали нормою. Можна вберегти цю нову свободу ясною межею, наприклад часом завершення роботи чи обмеженням на повідомлення після неї.
  growthUpright: >-
    Диявол відчиняє двері до роботи з тінню: лагідного дослідження тих частин себе, які Ви схильні ховати. Можна помітити звичку, що здається нав’язливою, і з цікавістю, без осуду, запитати, що вона намагається Вам дати. Розуміння приходить раніше за зміни.
  growthReversed: >-
    У перевернутому положенні Диявол може відображати поступ у послабленні старої прив’язаності. Це може бути мить, щоб визнати, який шлях Ви вже пройшли. Якщо важкі звички чи почуття повертаються, розмова з людиною, якій довіряєте, або з кваліфікованим фахівцем може дати стійку підтримку на цьому шляху.
reflectionQuestions:
