  - >-
    Де в близьких стосунках Ви почуваєтеся менш вільними, ніж хотіли б?
  - >-
    Який невеликий крок геть від старого шаблону Ви могли б зробити цього тижня?
imageryNote: >-
  Диявол Taro постає тіньовою рогатою фігурою, що височіє над двома меншими фігурами, прикутими до її сидіння вільними, провислими ланцюгами. Ланцюги виразно вільно лежать на їхніх зап’ястях, запрошуючи глядача помітити, що їх можна скинути. Тьмяне світло смолоскипів і глибокі земляні тони створюють важкий настрій, а слабкий світлий дверний отвір на краю сцени натякає, що є інший шлях, який можна знайти.
