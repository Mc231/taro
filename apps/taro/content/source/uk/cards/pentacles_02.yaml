  - >-
    Яке одне зобов’язання Ви могли б призупинити чи розділити на найближчі кілька днів?
imageryNote: >-
  Зображення може показувати фігуру на півкроці, що тримає в повітрі дві монети, з’єднані стрічкою чи шнуром, який вигинається безкінечною петлею. Позаду хвиляста вода чи човни, що піднімаються й опускаються на хвилях, можуть перегукуватися з постійним рухом щоденного життя. Петля натякає на безперервність і тривалу природу рівноваги, а легка, танцювальна постава — на те, що підлаштовуватися можна легко й навіть трохи граючись.
