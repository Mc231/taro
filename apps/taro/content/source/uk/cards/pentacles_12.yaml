shortUpright: >-
  Стабільні, надійні зусилля рухають справу вперед. Помітьте цінність того, щоб послідовно з’являтися, навіть коли поступ здається повільним.
shortReversed: >-
  Послідовність, можливо, перетворилася на колію. Можна поміркувати, де невелика зміна темпу могла б повернути енергію.
meaningUpright: |-
  Лицар Пентаклів сидить на важкому, терплячому коні, що стоїть на місці, а не мчить. Серед придворних карт цей лицар найменш поквапливий і найнадійніший. Він говорить про стабільний поступ, ретельне планування й тиху силу того, щоб робити те, що пообіцяли.
  Ви можете впізнати це в розпорядку, якого дотримуєтеся місяцями, у завершенні справи, до якої інші втратили інтерес, у щоденному маленькому часі для довгого проєкту чи в ролі людини, на яку друзі покладаються, коли треба щось практичне. Темп може бути не захопливим, але посильним, і це важливо.
  Ця карта запрошує цінувати послідовність як силу. Чому Ви віддані і як регулярна присутність рухає це вперед? Можна перевірити, чи реалістичний Ваш план, берегти розпорядок, що його підтримує, і помічати довіру, яку Ви будуєте, до себе та в інших, щоразу доводячи справу до кінця. Деякі цілі досягаються не ривками, а наполегливістю.
meaningReversed: |-
  У перевернутому положенні Лицар Пентаклів може відображати стабільність, що стала застряганням. Розпорядок може тривати довго після того, як перестав Вам служити, або обережність не дає спробувати щось нове. Дні можуть почати здаватися однаковими, а робота — тривати без особливого відчуття напрямку чи радості.
  Це прочитання вказує на якість, якої стало забагато. Надійність досі цінна; їй просто може знадобитися трохи повітря.
  Можна запитати себе, якого розпорядку Ви дотримуєтеся переважно за звичкою. Чи не могла б одна невелика зміна, як-от новий маршрут, інший порядок справ чи свіжа мета, повернути трохи руху? Якщо стримує обережність, подумайте, як виглядав би невеликий експеримент із низьким ризиком. Стабільність може включати зміни, коли їх обирають дбайливо.
aspects:
  relationshipsUpright: >-
    У стосунках ця карта може відображати надійну, терплячу турботу: постійну присутність, дотримання обіцянок, повільне будування довіри. Можливо, саме Ви — опора в зв’язку, або Ви цінуєте того, хто нею є. Може допомогти помітити, як надійність створює безпеку, і висловити цю вдячність уголос.
  relationshipsReversed: >-
    У перевернутому положенні карта може натякати на стосунки, що здаються надто рутинними, чи на обережність, що не дає висловлювати почуття. Можна внести невелику зміну в спільний час чи поділитися тим, що зазвичай лишається практичним і невисловленим. Передбачуваність і тепло можуть співіснувати, коли про них дбають обоє.
  workUpright: >-
    У роботі Лицар Пентаклів може описувати старанний, методичний поступ. Можливо, саме Ви доводите справи до кінця, перевіряєте деталі й тримаєте проєкти в русі. Можна визнати цінність цього внеску й подбати, щоб Ваш темп і навантаження лишалися посильними з часом.
  workReversed: >-
    Тут карта може відображати роботу, що здається одноманітною, чи вагання проявити ініціативу. Можна пошукати невелику ділянку, де Ви могли б запропонувати вдосконалення чи навчитися нового. Поєднання надійності з цікавістю може зробити Вашу роботу і надійною, і захопливою.
  growthUpright: >-
    Для особистісного зростання ця карта запрошує цінувати повільні, стабільні зусилля. Звички, збудовані день за днем, часто переживають драматичні обіцянки собі. Можна обрати один простий розпорядок, що Вас підтримує, і дотримуватися його визначений час, помічаючи, як послідовність формує довіру до себе.
  growthReversed: >-
    У перевернутому положенні карта може відображати відчуття застряглості чи браку мотивації або чіпляння за розпорядок, щоб уникнути непевності. Можна дослідити, яку зміну Ви відкладаєте і чому. Невелика й посильна різноманітність може допомогти почуватися водночас заземлено й живо.
