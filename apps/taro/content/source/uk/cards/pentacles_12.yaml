imageryNote: >-
  Зображення може показувати вершника, що спокійно сидить на міцному нерухомому коні, тримає одну монету й дивиться на зорані поля. Нерухомий кінь може символізувати терпіння й витривалість, борозни на землі — вже виконану методичну роботу, а рівний погляд — стабільну увагу до того, що попереду. Темні, щільні тони й важкі форми можуть підкреслювати надійність із натяком на те, як нерухомість іноді може ставати інерцією.
