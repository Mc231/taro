  relationshipsReversed: >-
    У перевернутому положенні ця карта може вказувати на холодність, повчання чи використання логіки, щоб знецінити чиїсь почуття. Вона може відображати й складність зайняти ясну позицію. Можна помітити, коли Ви ховаєтеся в міркування, щоб уникнути вразливості. Дозвіл іншим бачити Ваше серце, а не лише розум, може поглибити довіру й розуміння.
  workUpright: >-
    У роботі Король Мечів може натякати на лідерство через ясне мислення: встановлення справедливих правил, прозоре ухвалення складних рішень чи фахові поради. Вам можуть довіряти зважувати суперечливі погляди й вирішувати. Відкрите пояснення своїх міркувань і послідовність допомагають іншим упевнено йти за Вами.
  workReversed: >-
    У перевернутому положенні ця карта може відображати жорсткі правила, рішення без порад із тими, кого вони стосуються, чи схильність аналізувати доти, доки ніщо не рухається. Можна запитати себе, чи служить процес досі своїй меті. Запрошення до думок і визнання непевності можуть зміцнити Ваш авторитет, а не применшити його.
  growthUpright: >-
    Для особистісного зростання Король Мечів запрошує визначити свої принципи й жити за ними. Можна записати цінності, що спрямовують Ваші рішення, і звірити з ними нещодавні вибори. Ясне мислення — навичка, яку можна практикувати: зібрати факти, розглянути погляди, а потім вдумливо обрати курс.
  growthReversed: >-
    У перевернутому положенні ця карта може відображати надмірну опору на аналіз чи суворе самоосудження. Можна помітити, коли Ви вимагаєте від себе бездоганної логіки й не лишаєте місця для помилок. Поєднання розуму з добротою до себе може допомогти вирішувати вільніше й лагідніше вчитися на результатах, що Вас дивують.
reflectionQuestions:
  - "Який принцип Ви найбільше хочете бачити у своїх рішеннях?"
  - >-
    Де Вашим міркуванням, можливо, бракує розуміння того, що відчуває інша людина?
  - >-
    Яке одне рішення Ви могли б ухвалити цього тижня, спокійно зваживши факти?
imageryNote: >-
  Оригінальне зображення показує фігуру на високому кам’яному троні на гірському хребті, клинок тримають цілком вертикально, обличчя звернене просто до глядача. Тонкі впорядковані хмари простягаються блідим небом, а два птахи летять угорі паралельними лініями. Вертикальний клинок натякає на тверді принципи, прямий погляд — на чесність, а впорядковане небо — на розум, що знайшов свій спокій.
