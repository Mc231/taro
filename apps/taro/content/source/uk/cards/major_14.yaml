imageryNote: >-
  Помірність Taro постає крилатою фігурою на березі повільної річки, що обережно переливає рідину між двома різними посудинами, глиняною і скляною. Струмінь між ними лагідно вигинається, ніби рівновагу знаходять просто зараз. Камені-переходи через річку натякають на середній шлях від одного берега до іншого, а м’які барви світанку над далекими пагорбами зберігають спокійний, сповнений надії настрій.
