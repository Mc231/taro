shortUpright: >-
  Повільніше, стійкіше поєднання того, що Вам потрібно, може дати більше легкості, ніж будь-яка крайність.
shortReversed: >-
  Щось може надто хилитися в один бік. Ця карта запрошує це помітити й лагідно відновити рівновагу.
meaningUpright: |-
  Помірність — це карта змішування речей у правильній мірі. На її зображенні часто воду обережно переливають між двома посудинами так, щоб мало що пролилося. Уміння полягає не в тому, щоб обрати одне замість іншого, а в тому, щоб їх поєднати: роботу й відпочинок, дію й терпіння, те, чого хочете зараз, і те, чого захочете згодом.
  У повсякденному житті ця карта може відображати пошук ритму, що працює: розклад із достатнім запасом простору, компроміс, що поважає обох, чи звичку, яку потроху підлаштовують, доки вона не стане зручною. Вона може вказувати на тихе задоволення від поміркованості, менш захопливої за крайнощі, але часто стійкішої.
  Ця карта запрошує Вас поміркувати, де Вашому життю бракує трохи рівноваги. Можна запитати себе, які частини переповнені, а які занедбані, і які невеликі корективи могли б їх зблизити. Помірність підкреслює терпіння: добрі поєднання потребують часу, а лагідні експерименти можуть навчити більшого, ніж будь-яка раптова перебудова.
meaningReversed: |-
  У перевернутому положенні Помірність може відображати відчуття дисбалансу. Можливо, Ви вкладаєте забагато в одну сферу життя, як-от роботу, стосунки чи тривогу, а інша тим часом пересихає. Або Ви помічаєте коливання між крайнощами: усе або нічого, зайнятість або виснаження, суворість або недбалість.
  Ця карта може вказувати й на нетерплячість щодо процесу, якому потрібен час, і на спокусу силоміць отримати результат замість дати всьому поєднатися.
  Можливо, варто провести простий перелік. Де Ви перестараєтеся, а де недотягуєте? Якщо обрати одну лагідну корекцію замість радикального виправлення, це може допомогти налаштуватися наново. Рівновага — не місце, куди приходиш раз і назавжди; до неї повертаються знову й знову, невеликими поправками.
aspects:
  relationshipsUpright: >-
    У стосунках Помірність може відображати гармонію, збудовану на компромісі й розумінні. Вона може запрошувати піти комусь назустріч, поєднати різні стилі й потреби та терпляче вивчати ритми одне одного. Спокійна, стабільна турбота може зробити так, що в зв’язку легко перебувати.
  relationshipsReversed: >-
    У перевернутому положенні ця карта може вказувати на стосунки, де переважають потреби однієї людини, або де конфлікти швидко загострюються. Варто поміркувати, як знизити напругу: сповільнювати розмови, робити перерви, коли стає гаряче, і шукати перетин між тим, чого хоче кожен із Вас.
  workUpright: >-
    У роботі чи проєкті Помірність підкреслює стабільний поступ і добру співпрацю. Вона може відображати поєднання різних навичок чи ідей у щось, що добре працює, або розподіл сил так, щоб енергії вистачило надовго. Можна пошукати таку версію плану, що водночас амбітна й посильна.
  workReversed: >-
    У перевернутому положенні Помірність може відображати перевантаження, поспішні рішення чи тертя між людьми з різними підходами. Можна запитати себе, де темп став нереалістичним і що можна спростити. Середній шлях між суперечливими пріоритетами може зменшити стрес для всіх залучених. Навіть один пообідній час без нарад може показати, яким є спокійніший темп.
  growthUpright: >-
    Для особистісного зростання ця карта запрошує практикувати поміркованість без жорсткості. Можна помітити власні точки рівноваги: скільки відпочинку, активності, часу на самоті й з іншими допомагає Вам почуватися стійко. Невеликі послідовні корективи можуть дати більше легкості, ніж великі обіцянки собі.
  growthReversed: >-
    У перевернутому положенні Помірність може питати, чи не жили Ви останнім часом на крайнощах. Вона може відображати потребу сповільнитися, відпочити чи повернути у свої дні інгредієнт, якого бракує. Можна обрати одну сферу, щоб лагідно відновити в ній рівновагу, і дати собі час побачити, як усе вляжеться.
