shortUpright: >-
  Багато можливостей може мерехтіти одночасно; ця карта запрошує насолодитися уявою, а тоді уважно придивитися до кожної.
shortReversed: >-
  Туман варіантів може розвіюватися; подумайте, який вибір лишається справжнім, коли згасає сяйво уяви.
meaningUpright: |-
  Сімка Кубків часто показує фігуру перед рядом чаш, що ширяють у повітрі, і в кожній — інше видіння. Це карта уяви, можливостей і запаморочення, яке може приходити від надміру вибору.
  Уява — це дар. Вона дає змогу уявити життя, якого Ви ще не прожили, й ідеї, що не спадали на думку нікому іншому. Але ця карта помічає й те, як легко мрії зливаються з планами. В одних чашах справжні можливості, в інших — бажання, а ще в інших — тривоги, перевдягнені в можливості.
  У повсякденному житті це може виглядати як перескакування між проєктами, гортання варіантів без вибору чи тяжіння до мрії, у якої немає першого кроку. Карта запрошує насолодитися мріями, а тоді придивитися уважніше. Який варіант пасує до Ваших цінностей і реальних обставин? Якою була б перша невелика дія? Обрати одне не означає назавжди втратити інше; це означає дати чомусь шанс стати реальним.
meaningReversed: |-
  У перевернутому положенні Сімка Кубків може відображати ясність, що приходить після періоду плутанини. Чаші, що ширяють, можуть почати осідати, і Ви, можливо, побачите, у яких є щось вагоме, а які були переважно туманом. Це може відчуватися як полегшення чи як невелике розчарування, коли деякі фантазії згасають.
  Вона може натякати й на протилежне: уникання вибору, коли тримаєш відкритими всі можливості, або повне відкидання уяви заради практичності.
  Запрошення тут — знайти обґрунтовану середину. Можна обрати один варіант і перевірити його в невеликий спосіб без тиску. Помічайте, що захоплює Вас на практиці, а не в теорії. Відпустивши мрію, можна звільнити місце для плану, яким справді можна жити, а мріяти й далі можна, повертаючись до мрій по натхнення.
aspects:
  relationshipsUpright: >-
    У стосунках ця карта може відображати ідеалізацію когось чи уявлення багатьох можливих майбутніх із певною людиною чи без неї. Вона може запрошувати помітити різницю між тим, ким людина є, і тим, ким Ви сподіваєтеся її бачити. Можна насолоджуватися уявою, водночас заземлюючи її справжніми розмовами про те, чого хоче кожен.
  relationshipsReversed: >-
    У перевернутому положенні Сімка Кубків може вказувати на ясніше бачення стосунків, можливо, після того, як розвіявся романтичний серпанок. Ця ясність може стати нагодою будувати на тому, що справжнє. Можна запитати себе, що Ви справді цінуєте в зв’язку тепер, а не те, що уявляли спочатку, і відкрито цим поділитися.
  workUpright: >-
    У роботі ця карта може відображати надлишок ідей чи варіантів, як-от кілька проєктів, шляхів чи пропозицій, що змагаються за увагу. Вона може запрошувати зважити кожен із них відповідно до пріоритетів, часу й енергії. Може допомогти записати їх поруч. Уява корисна для мозкового штурму; рішення часто потребують твердішого ґрунту.
  workReversed: >-
    У перевернутому положенні карта може відображати звуження до ясного напрямку чи нарешті ухвалене рішення взятися за один проєкт. Можна помітити, як повертається зосередженість. Якщо Ви розчаровані, подумайте, які частини первісного бачення ще варто перенести в щось реалістичніше й більше Ваше.
  growthUpright: >-
    Для особистісного зростання Сімка Кубків запрошує зрозуміти свої мрії. Яку тугу виражає кожна з них? Можна написати в щоденнику про повторювану фантазію й пошукати потребу під нею, як-от свободу, визнання чи відпочинок. Задовольнити цю потребу в невеликий, реальний спосіб може бути приємніше, ніж сама мрія.
  growthReversed: >-
    У перевернутому положенні ця карта може відображати зростання здатності відрізняти бажання від намірів. Можна вправлятися щодня ухвалювати одне ясне рішення, хай невелике. З часом це може зміцнити довіру до власного судження, лишаючи місце для уяви, яка надихає, а не відволікає.
reflectionQuestions:
  - >-
    Який із Ваших нинішніх варіантів здається найживішим, коли Ви уявляєте справжній крок до нього?
  - >-
    Яка туга може ховатися за мрією, до якої Ви постійно повертаєтеся?
  - >-
    Який один невеликий вибір Ви могли б зробити цього тижня, щоб перейти від уяви до дії?
imageryNote: >-
  Зображення показує фігуру, видиму зі спини, перед сімома чашами, що ширяють у мінливому тумані. У кожній чаші інший символ, можливо, ключ, гірлянда, маленький будинок, зірка, звита фігура, закрита скринька й дзеркало, що означають доступ, похвалу, безпеку, надію, неспокій, таємниці й образ себе. М’яке, мрійливе світло й мінливі барви можуть натякати, наскільки звабливі й непевні ці видіння, запрошуючи глядача замислитися, яке з них справжнє.
