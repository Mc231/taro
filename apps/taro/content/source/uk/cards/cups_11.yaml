shortUpright: >-
  Грайливе почуття чи невелика творча ідея можуть Вас здивувати; ця карта запрошує зустріти їх із цікавістю.
shortReversed: >-
  Ніжне почуття може ховатися чи хитатися; подумайте, як зробити безпечним висловлення того, що Ви відчуваєте.
meaningUpright: |-
  Паж Кубків — наймолодша фігура масті води, яку часто зображують, коли вона роздивляється рибку, що виглядає з чаші. Образ лагідно абсурдний, і в цьому вся суть. Ця карта вшановує цікавість, здивування й готовність сприйняти несподіване почуття чи ідею досить серйозно, щоб їх дослідити.
  Вона може відображати новий творчий імпульс, раптову ніжність до когось, передчуття, що з’являється нізвідки, чи грайливий настрій, від якого звичайні речі здаються новими. Пажеві не треба знати, куди все це веде. Він просто відкритий.
  У щоденному житті це може виглядати як начерк ідеї, щире повідомлення, спроба творчого хобі чи дозвіл собі тішитися дрібницею. Карта запрошує підходити до свого внутрішнього життя з відкритістю новачка. Можна помітити, що Вас сьогодні дивує, і приділити цьому мить уваги, перш ніж набіжать практичні думки.
meaningReversed: |-
  У перевернутому положенні Паж Кубків може відображати почуття, якими важко ділитися, чи творчі ідеї, що здаються надто крихкими, щоб їх показувати. Можливо, Ви боїтеся видатися смішними чи вразливими й ховаєте свій внутрішній світ.
  Він може вказувати й на настрої, що швидко змінюються, чи на мрії, які замінюють дію, замість надихати на неї.
  Ця карта запрошує ставитися до своєї чутливої сторони терпляче. Що допомогло б Вам почуватися досить безпечно, щоб висловитися, хай навіть одній людині чи на приватній сторінці? Можна знайти вихід без тиску, як-от щоденник чи альбом для ескізів, де нічого не мусить бути добрим. Якщо почуття здаються великими й нестійкими, просто назвати їх може полегшити змогу їх тримати. Цікавість може відрости знову, щойно матиме трохи прихистку.
aspects:
  relationshipsUpright: >-
    У стосунках Паж Кубків може відображати милі жести, грайливий флірт, щиру записку чи початок ніжної дружби. Він може запрошувати відкрито виявляти прихильність, не обмірковуючи надміру. Можна помітити й те, як хтось близький виявляє турботу дрібними несподіваними способами, і дати йому знати, що Ви це побачили.
  relationshipsReversed: >-
    У перевернутому положенні ця карта може вказувати на сором’язливість, емоційну непевність чи суперечливі сигнали в зв’язку. Можна запитати себе, чи не стримуєте Ви чи хтось близький почуття зі страху бути відкинутими. Лагідна чесність у комфортному темпі може полегшити обом відчуття безпеки.
  workUpright: >-
    У роботі ця карта може відображати нову творчу ідею, свіжий підхід чи цікавість до іншої сфери. Вона може запрошувати поділитися нестандартною пропозицією чи грайливо поекспериментувати із завданням. Ранні ідеї не мусять бути відшліфованими; їм потрібен простір для дослідження, перш ніж хтось їх оцінюватиме.
  workReversed: >-
    У перевернутому положенні карта може відображати творчий блок чи вагання ділитися ідеями зі страху критики. Можна спершу попрацювати над чимось лише для себе, без очікування результатів. Поступове зміцнення впевненості може допомогти представити свої ідеї, коли вони будуть готові до показу.
  growthUpright: >-
    Для особистісного зростання Паж Кубків запрошує плекати цікавість до своїх почуттів і передчуттів. Можна вести записник для снів, образів чи дивних вражень, просто щоб із часом помічати закономірності. Грайливий підхід до внутрішнього життя може зробити самопізнання легшим і привабливішим.
  growthReversed: >-
    У перевернутому положенні ця карта може просити бути лагідними до вразливіших частин себе. Можна помітити, коли Ви відкидаєте власні почуття як дитячі чи безглузді. Підбадьорення себе, як молодого друга, може допомогти чутливості стати силою, а не тим, що треба ховати.
