imageryNote: >-
  Зображення показує юну фігуру, що тримає чашу на рівні плеча й здивовано бачить, як зсередини на неї дивиться маленька рибка. Її одяг може мати візерунки хвиль чи квітів, а берег позаду натякає на глибини почуттів, з яких виринають ідеї. М’які пастельні тони й легкий, допитливий вираз обличчя передають відкритість, уяву й чарівність несподіваних звісток зсередини.
