imageryNote: >-
  Зображення може зосереджуватися на одній монеті чи диску, простягнутих відкритою долонею, на тлі обробленої землі: садова хвіртка, низькі живоплоти, стежка, що веде до пагорбів. Монета уособлює щось відчутне й можливе, а хвіртка натякає на поріг до простору, який ще треба доглядати. Приглушені зелені й теплі земляні тони можуть підкреслювати терпіння, зростання й тиху цінність того, що можна тримати в руках.
