imageryNote: >-
  Маг Taro постає біля ринкового прилавка на перехресті на світанку й розкладає чотири скромні предмети для чотирьох мастей: зелену гілку, глиняну чашу, ніж для хліба й одну монету. Одна рука тягнеться до прилавка, друга вказує на світліше небо, поєднуючи ідею та дію. Нитки світла між предметами нагадують увагу, що зводить окремі інструменти до однієї мети, а недоїдений окраєць натякає, що творення тільки-но почалося.
