shortUpright: >-
  Можливо, у Вас уже є більше потрібного, ніж здається; ця карта питає, що Ви хочете з цим створити.
shortReversed: >-
  Ваші інструменти на столі, але увага, можливо, деінде. Що допомогло б її зібрати?
meaningUpright: |-
  Маг — це карта перетворення ідеї на щось реальне. Якщо Блазень вирушає без жодного плану, то Маг зупиняється, дивиться, що є під рукою, і вирішує цим скористатися. Традиційний образ однієї руки, піднятої догори, й другої, що вказує вниз, нагадує міст між наміром і дією, між тим, що Ви уявляєте, і тим, що справді можете зробити сьогодні.
  У щоденному житті ця карта може відображати момент, коли план нарешті отримує дату, бюджет часу, першу чернетку. Вона може вказувати на навички, які Ви схильні не помічати, бо вони даються легко: уміння пояснювати, виправляти дрібні негаразди, об’єднувати людей. Винахідливість тут означає помітити, що всі частини вже лежать на столі.
  Ця карта запрошує Вас поміркувати, куди йде Ваша увага. Зосередженість — це своєрідне ремесло, і його можна вправляти. Можна запитати себе, що одне Ви хотіли б утілити і який із наявних інструментів міг би наблизити це на крок. Маг не обіцяє результатів. Він підкреслює силу того, щоб прийти з наміром і скористатися тим, що маєте.
meaningReversed: |-
  У перевернутому положенні Маг може відображати здібності, які є, але ще не використовуються. У Вас можуть бути і навички, й ідеї, але енергія ніби витікає в забагато напрямків, або Ви сумніваєтеся, що Ваш внесок важить. Стіл накрито, а руки ще не зовсім рухаються.
  Ця карта може вказувати й на кмітливість, трохи звернену вбік: на чарівність чи швидкі слова, щоб оминути нудну частину роботи, або на впевнений вигляд при внутрішній непевності. Жодне з цього не є моральною вадою. І те, і те може свідчити, що намір і дія розійшлися.
  Можливо, варто подивитися, де розщеплюється Ваша увага. Якщо обрати одне невелике конкретне завдання й довести його до кінця, це може відновити довіру до власних рук. Також може допомогти запитання: що Ви робили б інакше, якби ніхто не дивився?
aspects:
  relationshipsUpright: >-
    У стосунках Маг може відображати силу ясного, прямого спілкування. Він може запрошувати казати те, що Ви маєте на увазі, і діяти відповідно до своїх слів. Можна помітити, як сильно Ви здатні впливати на тон зв’язку через невеликі свідомі жести: продумане повідомлення, план, доведений до кінця, увагу без відволікань.
  relationshipsReversed: >-
    У перевернутому положенні ця карта може питати, чи збігаються слова й дії в близьких стосунках, Ваші чи іншої людини. Вона може відображати й стримування того, що Ви насправді думаєте, або гру в ту версію себе, яка, на Вашу думку, сподобається. Варто поміркувати, що змінилося б, якби Ви показали комусь свої справжні наміри, навіть непевні.
  workUpright: >-
    У роботі чи проєкті Маг вказує на зустріч майстерності й можливості. Він може запрошувати оцінити свої здібності, контакти й ресурси і спрямувати їх на одну ясну мету. Це карта початку, презентації, створення прототипу чи нарешті написаної пропозиції. Зосередженість і доведення до кінця тут важать більше, ніж готові відповіді на все наперед.
  workReversed: >-
    У перевернутому положенні Маг може відображати талант, який недовикористано, або зусилля, розподілені так тонко, що ніщо не влучає. Він може вказувати й на спокусу перебільшити чи зрізати кути. Можна запитати себе, яке завдання справді заслуговує на Вашу енергію зараз і як виглядала б чесна, стабільна робота над ним протягом найближчих кількох днів.
  growthUpright: >-
    Для особистісного зростання ця карта запрошує визнати власну здатність діяти. Можна скласти список навичок, звичок і опор, які у Вас уже є, і помітити, як вони могли б послужити тому, що Вам важливо. Практика, повторення і ясний намір — тихі інструменти Мага; невеликі щоденні рішення з часом можуть скластися в справжні зміни.
  growthReversed: >-
    У перевернутому положенні Маг може відображати розрив між тим, ким, як Ви знаєте, Ви могли б бути, і звичками, якими живете. Він може питати, де невпевненість у собі змушує Вас чекати дозволу. Можна обрати одну навичку й практикувати її відкрито, неідеально, помічаючи, як упевненість зростає від дії, а не від чекання на відчуття готовності.
