  - "Яка одна звичка могла б надати Вашому тижню стійкішої форми?"
imageryNote: >-
  Імператор Taro постає фігурою за міцним кам’яним столом, вбудованим у схил пагорба, де в ретельному порядку розкладено мапу, мірну жердину й лампу. Мури із сухої кладки, що перетинають поля позаду, показують межі, збудовані руками, камінь за каменем. Баран, що пасеться поруч, може натякати на Овна й прагнення починати. Теплі червоні барви говорять про життєву силу, а невелика хвіртка, залишена відчиненою в одному з мурів, натякає, що міцні структури все ж можуть пропускати людей.
