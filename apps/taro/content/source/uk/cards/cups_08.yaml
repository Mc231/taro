shortUpright: >-
  Щось, можливо, більше Вас не наповнює, навіть якщо виглядає завершеним; ця карта запрошує помітити, куди тягне серце далі.
shortReversed: >-
  Можливо, Ви розриваєтеся між «лишитися» й «піти»; подумайте, що Вам треба знати, перш ніж обрати.
meaningUpright: |-
  Вісімка Кубків часто показує фігуру, що йде геть від охайного ряду чаш на відкриту місцевість під нічним небом. Чаші не розбиті й не перекинуті. Просто щось у них більше не задовольняє, і фігура вирішила пошукати те, чого бракує.
  Ця карта говорить про тиху мужність покинути щось, що ззовні здається цілком нормальним: роль, розпорядок, ідентичність чи спосіб життя, що перестали відчуватися правдивими. Часто це не драматичний вихід, а повільне усвідомлення, що Ви щось переросли.
  У щоденному житті вона може відображати бажання більшого сенсу в роботі, потребу в часі на самоті, щоб подумати, чи крок назад від ситуації, що Вас виснажує. Карта запрошує серйозно поставитися до цієї туги. Піти не обов’язково раптово чи назавжди; це може бути пробна дистанція, пауза в думках. Можна запитати себе, що Ви насправді шукаєте і що готові лишити, щоб це знайти.
meaningReversed: |-
  У перевернутому положенні Вісімка Кубків може відображати стан між «лишитися» й «піти». Можливо, Ви відчуваєте, що щось не так, але не певні, чи рушати далі, чи спробувати ще раз. Страх невідомого чи вірність тому, що Ви збудували, можуть тримати на місці.
  Вона може вказувати й на протилежний шаблон: знову й знову йти, дрейфуючи від одного до іншого, не даючи нічому шансу поглибитися.
  Ця карта запрошує сповільнитися й уважніше поглянути на вибір. Як виглядало б «лишитися», якби це було обрано, а не сталося за замовчуванням? Чого вимагало б «піти»? Можна обговорити це з людиною, якій довіряєте, чи встановити м’який термін для рішення. Хоч який напрямок оберете, свідомий вибір може принести відчуття спокою.
aspects:
  relationshipsUpright: >-
    У стосунках ця карта може відображати бажання більшої глибини чи усвідомлення, що зв’язок у теперішній формі вичерпав себе. Вона може запрошувати чесно поміркувати, чого Вам бракує. Крок назад може означати розмову про зміни, більше особистого простору чи, часом, вибір іншого типу зв’язку.
  relationshipsReversed: >-
    У перевернутому положенні Вісімка Кубків може відображати вагання щодо стосунків, які не наповнюють, або шаблон віддалятися щоразу, коли зростає близькість. Можна запитати себе, чи лишаєтеся Ви з любові чи зі страху і чи йдете з потреби чи за звичкою. Ясне, добре спілкування може допомогти в будь-якому разі.
  workUpright: >-
    У роботі ця карта може відображати прагнення більшої мети, навіть коли все виглядає стабільно. Вона може запрошувати дослідити, що здавалося б змістовнішим, можливо, спробувавши нову сферу, вивчивши щось інше чи переформувавши теперішню роль. Рух далі може бути внутрішнім зрушенням задовго до того, як стане зовнішнім.
  workReversed: >-
    У перевернутому положенні карта може відображати відчуття застрягання в роботі чи проєкті, які Ви переросли, або перескакування між ролями без укорінення. Можна записати, за чим Ви сумували б, а що охоче покинули б. Подумайте, чи не могла б зміна підходу, а не місця, задовольнити потребу, яку Ви відчуваєте.
  growthUpright: >-
    Для особистісного зростання Вісімка Кубків запрошує в подорож усередину. Можна виділити час, щоб поміркувати, що надає сенсу Вашому життю зараз, на відміну від того, що надавало раніше. Прогулянки, щоденник чи коротка перерва в розпорядку можуть допомогти почути, до чого Ви готові рухатися.
  growthReversed: >-
    У перевернутому положенні ця карта може просити помітити шаблони уникання чи неспокою. Ви покидаєте ситуації, щоб утекти від незручності, чи лишаєтеся, щоб уникнути змін? Можна вправлятися трохи довше перебувати в непевності, перш ніж діяти. Розуміння власного шаблону може зробити майбутні рішення яснішими й добрішими.
reflectionQuestions:
  - >-
    Що у Вашому житті виглядає завершеним, але більше не наповнює?
  - "Що Ви шукаєте такого, чого не дає Ваша теперішня ситуація?"
  - >-
    Який невеликий крок допоміг би дослідити зміну, поки що не беручи на себе зобов’язань?
imageryNote: >-
  Зображення показує самотню фігуру з дорожнім ціпком, видиму зі спини, що лишає на березі дбайливо складену купку чаш. Попереду здіймаються пагорби й в’ється стежка під тонким серпом місяця. Помітна прогалина серед складених чаш може натякати на щось незавершене. Глибокі сині й срібні тони викликають заглибленість у себе й тихе тяжіння до того, що ще не досліджено.
