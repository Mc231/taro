meaningUpright: |-
  Четвірка Жезлів — карта прибуття й зібрання. Чотири жезли утворюють просту рамку, наче опори намету чи ворота, прикрашені для гостей. Вона позначає етап, коли зусилля створили щось достатньо стабільне, щоб під ним стояти й ним ділитися.
  У повсякденному житті це може виглядати як завершення важкого робочого періоду й вечеря для друзів, переїзд у простір, що нарешті відчувається Вашим, чи родина або громада, що збирається довкола спільної події. Ідеться не стільки про грандіозний успіх, скільки про тепло від того, що Ви дісталися місця перепочинку, а довкола люди.
  Ця карта запрошує зупинитися й відзначити досягнуте, хай яким скромним воно здається. Святкування — не лише нагорода; воно зміцнює зв’язки й дає енергію для того, що буде далі. Можна подумати, хто був частиною цього розділу і як Ви могли б подякувати, або просто дозволити собі насолодитися відчуттям причетності, не поспішаючи до наступної мети.
meaningReversed: |-
  У перевернутому положенні Четвірка Жезлів може натякати, що відчуття дому чи причетності трохи хитке. Плани на зустріч можуть змінюватися, переїзд ще не вляжеться, або Ви присутні на святі, але почуваєтеся дещо осторонь.
  Вона може вказувати й на свято, звернене всередину. Можливо, Ви тихо пишаєтеся чимось, чого інші не помітили, або волієте невеликий, приватний спосіб відзначити віху. Це може бути цінним саме по собі.
  Можливо, це час запитати, що робить місце чи групу домом для Вас. Чи не просить уваги щось у Ваших основах: розпорядок, розмова, невеликий ремонт? Можна знайти один спосіб створити куточок стабільності, навіть якщо загальна картина ще не вляглася.
aspects:
  relationshipsUpright: >-
    У стосунках ця карта може відображати тепло, спільне свято й відчуття, що Вам раді. Це може бути мить ушанувати зв’язок через річницю, зустріч після розлуки, спільну трапезу чи просто сказати вголос, що для Вас означає інша людина. Можна помітити, з ким Ви почуваєтеся найбільше вдома, і сказати їй про це.
  relationshipsReversed: >-
    У перевернутому положенні Ви можете почуватися трохи поза колом, яке Вам дороге, або помічати напругу довкола зустрічі чи спільного простору. Не кожна подія мусить бути ідеальною, щоб мати значення. Варто поміркувати про невеликий чесний крок до відновлення зв’язку, як-от запрошення, тиху розмову чи пропозицію допомогти з чимось, що важливо для іншої людини.
  workUpright: >-
    У роботі чи проєкті Четвірка Жезлів може вказувати на віху, яку варто визнати: запуск, завершену фазу, команду, що знайшла свій ритм. Можна знайти час відсвяткувати з людьми, які зробили це можливим. Визнання спільних зусиль може зміцнити довіру й дати наступному етапу стійкішу основу.
  workReversed: >-
    У перевернутому положенні віха може минути без визнання, або команда може бути менш згуртованою, ніж здається. Можна самим назвати поступ, не чекаючи, поки це зробить хтось інший, або поглянути, що допомогло б групі почуватися впевненіше: ясніші ролі, спільний простір чи мить, щоб поміркувати, який шлях Ви пройшли разом.
  growthUpright: >-
    Для особистісного зростання ця карта запрошує дати досягненням улягтися, перш ніж рухатися далі. Відзначення завершеного кроку може будувати внутрішню стабільність, що переноситься й у важчі моменти. Можна створити власний невеликий ритуал, як-от прогулянку, записку чи улюблену страву, щоб ушанувати нещодавній крок уперед.
  growthReversed: >-
    У перевернутому положенні Ви, можливо, проскакуєте повз власні віхи або відчуваєте, що ніщо не завершено достатньо, щоб святкувати. Можна дослідити, що означає дім для Вас усередині: які звички, місця чи люди допомагають почуватися заземлено. Зміцнення одного з них може зробити ґрунт під ногами більше Вашим.
