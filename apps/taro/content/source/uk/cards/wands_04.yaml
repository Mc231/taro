imageryNote: >-
  Чотири вертикальні жезли з’єднує гірлянда з листя, квітів і стрічок, утворюючи відчинену браму. За нею збираються фігури з піднятими руками, а вдалині видніється простий будинок чи обнесене муром містечко. Четвірка-рамка натякає на стійкі основи, збудовані зусиллями, гірлянда — на врожай спільної радості, а відчинена брама — на гостинність, що запрошує інших, а не тримає їх ззовні.
