imageryNote: >-
  Зображення показує фігуру, що сидить біля води, обережно тримаючи чашу обома руками, а її поверхня віддзеркалює небо. Мушлі, хвилі чи водяні істоти, вирізьблені на сидінні, можуть натякати на глибокий зв’язок зі світом почуттів. Тиха вода й м’яке небо відображають спокійну сприйнятливість, а дбайливий спосіб, у який тримають чашу, натякає на шанобливе ставлення до внутрішніх глибин.
