meaningUpright: |-
  Королева Кубків сидить біля води, тримаючи чашу й роздивляючись її з тихою увагою. Ця фігура уособлює емоційну зрілість у її сприйнятливій формі: здатність глибоко відчувати, відчувати, чого потребують інші, і відповідати зі співчуттям, не втрачаючи себе.
  Ця карта може відображати мить, коли Ви — та спокійна присутність, якої хтось потребує, або коли Вас тягне уважніше прислухатися до власної інтуїції. Вона підкреслює емпатію, терпіння й ту турботу, що створює безпеку, а не тиск.
  У повсякденному житті це може виглядати як уміння вислухати друга, не поспішаючи все виправляти, довіра до тихого відчуття щодо ситуації чи створення вдома лагідного простору, де люди можуть бути собою. Вона може вказувати й на творчу чи вдумливу роботу, що спирається на Ваше внутрішнє життя.
  Карта запрошує шанувати чутливість як силу. Можна запитати себе, як дбати про інших, водночас зберігаючи чашу співчуття й для себе.
meaningReversed: |-
  У перевернутому положенні Королева Кубків може відображати турботу, що перелилася через край. Можливо, Ви так повно вбираєте почуття інших людей, що власні важко знайти, або віддаєте так багато, що для Вас майже нічого не лишається.
  Вона може вказувати й усередину: на потребу знову відчути власну інтуїцію після того, як слухали переважно інших, чи на почуття, що просять уваги, а не відкладання.
  Ця карта запрошує сприймати межі як форму співчуття. Як виглядало б дбати, не несучи все на собі? Можна виділити тихий час, щоб звіритися із собою, відмовити на одне прохання чи дозволити комусь іншому взяти частину ноші. Коли про Вашу власну чашу подбано, турбота, яку Ви даруєте, може текти вільніше й з меншим напруженням.
aspects:
  relationshipsUpright: >-
    У стосунках Королева Кубків може відображати глибоке слухання, емоційну підтримку й розуміння. Вона може запрошувати творити зв’язок, у якому почуттям раді. Можна помітити, як Ви втішаєте інших і як любите, щоб утішали Вас, і поділитися цим із кимось близьким, щоб турбота текла в обидва боки.
  relationshipsReversed: >-
    У перевернутому положенні ця карта може вказувати на те, що Ви берете на себе забагато чужої емоційної ваги або втрачаєте з поля зору власні потреби в зв’язку. Можна запитати себе, де лагідна межа могла б уберегти і Вас, і стосунки. Турбота про себе може бути частиною турботи про когось іншого.
  workUpright: >-
    У роботі ця карта може відображати ролі, що потребують емпатії, як-от догляд, викладання, творча чи підтримувальна робота, або просто те, що Ви колега, якому довіряють інші. Вона може запрошувати цінувати емоційний інтелект як справжню навичку. Уміння добре слухати може впливати на результати не менше, ніж будь-яка стратегія.
  workReversed: >-
    У перевернутому положенні карта може відображати емоційне виснаження від того, що Ви на роботі опора для всіх. Можна помітити, де Ви сприймаєте чужий стрес як свій. Подумайте, чи не уточнити, що Вам належить нести, а що ні, і чи не знайти невеликі способи відновлювати енергію протягом дня.
  growthUpright: >-
    Для особистісного зростання Королева Кубків запрошує поглибити стосунки зі своєю інтуїцією й почуттями. Можна тихо побути з питанням і помітити, що з’являється, перш ніж Ви його обміркуєте. Такі практики, як щоденник чи час біля води, можуть допомогти слухати себе зсередини.
  growthReversed: >-
    У перевернутому положенні ця карта може просити поширити співчуття й на себе. Можна помітити самокритику, яку Ви ніколи не спрямували б на друга. Лагідні ритуали, відпочинок і межі можуть допомогти почуватися стійко. Якщо почуття стають надто сильними, звернення до людини, якій довіряєте, може дати підтримку.
