  - "Де хтось міг би підтримати Вас так, як Ви підтримуєте інших?"
  - >-
    Яким одним способом Ви могли б зробити свій щоденний простір поживнішим цього тижня?
imageryNote: >-
  Зображення може показувати увінчану фігуру на різьбленому троні посеред квітучого саду, що лагідно тримає монету на колінах. Трон можуть оточувати квіти, плоди й невелика тварина, як-от кролик, а поруч може текти струмок. Сад може символізувати достаток через турботу, монета, яку колишуть, — уважне господарювання, а тварина — творче багатство й затишок у світі природи.
