shortUpright: >-
  Вам доступні практичне тепло й турбота. Помітьте, як Ви створюєте затишок для інших і чи включаєте до цього себе.
shortReversed: >-
  Турбота може текти назовні, поки Ваші сили вичерпуються. Можна поглянути, як дбати про власні потреби так само тепло, як про чужі.
meaningUpright: |-
  Королева Пентаклів сидить у пишному, доглянутому просторі, тримаючи монету на колінах, ніби колише щось живе. Ця королева уособлює практичну турботу: страву, готову, коли хтось приходить, дім, де відпочиваєш, бюджет, який ведуть дбайливо, сад, що годує людей. Енергія тут тепла, винахідлива й заземлена, і ці якості може мати будь-хто.
  Ви можете впізнати це в догляді за домом, підтримці друга в насичений час, у тому, щоб зробити робочий простір гостинним, чи в розпорядженні часом і ресурсами так, щоб усім вистачало. Вона може відображати й турботу про власне тіло й оточення: відпочинок, поживну їжу, свіже повітря й простори, де приємно бути.
  Ця карта запрошує помітити тиху майстерність створення затишку й стабільності. Як Ви дбаєте про інших і про своє оточення? Чи даруєте собі ту саму турботу? Можна обрати один спосіб зробити щоденне життя трохи поживнішим і дозволити практичній доброті початися вдома.
meaningReversed: |-
  У перевернутому положенні Королева Пентаклів може відображати турботу, що стала однобокою. Можливо, Ви доглядаєте всіх, крім себе, працюючи на порожньому баку, поки інші почуваються підтриманими. Або турбота може перейти в контроль, коли допомога стає керуванням, і іншим лишається мало простору шукати власний шлях.
  Це прочитання просить переглянути, як тече турбота. Плекання цінне, і воно працює добре, коли посильне й шанобливе до всіх залучених, зокрема до Вас.
  Можна запитати себе, чого Ви потребуєте, але відкладаєте. Чи міг би хтось інший узяти на себе завдання? Чи могли б Ви послабити певний стандарт, і весь дім від цього не розвалився б? Турбота про власну енергію, простір і затишок — не егоїзм; можливо, саме вона дає Вашій турботі тривати.
aspects:
  relationshipsUpright: >-
    У стосунках ця карта може відображати теплу, практичну турботу: зробити так, щоб людина почувалася вдома, підтримувати її відчутно, разом створювати стабільну основу. Можна помітити, як Ви виражаєте любов діями і як люди довкола воліють її отримувати. Спільна трапеза чи тихий вечір можуть нести чимало сенсу.
  relationshipsReversed: >-
    У перевернутому положенні карта може натякати, що Ви даєте більше турботи, ніж отримуєте, або що допомога перетворилася на керування чужими рішеннями. Можна відкрито поговорити про баланс і попросити підтримки у відповідь. Дозвіл іншим дбати про Вас може поглибити близькість.
  workUpright: >-
    У роботі Королева Пентаклів може описувати компетентність, поєднану з теплом: добре розпорядження ресурсами, підтримку колег, створення середовища, де люди можуть добре працювати. Можна визнати свій хист до того, щоб усе йшло гладко, і поміркувати, як ділитися цією навичкою, не несучи все самотужки.
  workReversed: >-
    Тут карта може відображати перенапруження заради інших на роботі чи складність збалансувати роботу й домашнє життя. Можна поглянути, які обов’язки справді Ваші, і встановити межі довкола свого часу. Посильна турбота про команду включає турботу про себе.
  growthUpright: >-
    Для особистісного зростання ця карта запрошує практично дбати про себе: регулярне харчування, відпочинок, час надворі, затишний простір. Можна створити один невеликий ритуал турботи про себе, що заземлює, і сприймати його як важливе зобов’язання, а не як необов’язковий додаток.
  growthReversed: >-
    У перевернутому положенні карта може відображати звичку ставити власні потреби на останнє місце чи міряти свою цінність тим, скільки робите для інших. Можна дослідити, звідки цей шаблон. Подарувати собі те саме терпіння, яке даруєте іншим, може повернути і енергію, і радість.
reflectionQuestions:
