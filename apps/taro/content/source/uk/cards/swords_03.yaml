shortUpright: >-
  Сумна чи болісна мить може просити, щоб її відчули, а не пояснювали; смуток можна шанувати лагідно.
shortReversed: >-
  Найгостріша частина болю, можливо, слабне; можна помітити, що допомагає Вам дихати трохи вільніше.
meaningUpright: |-
  Трійка Мечів говорить про смуток: щем розчарування, втрати чи слів, що влучили боляче. Вона не каже, скільки триватиме почуття чи що його спричинило. Вона просто визнає, що деякі моменти болять і що цей біль справжній.
  Ви можете впізнати цю карту в розмові, після якої Вас трусило, у новині, що змінила Ваш погляд на щось, чи в горі, що повертається звичайного дня. Вона може відображати й укол від розуміння правди, якої Ви сподівалися не почути. Часто мислячий розум хоче аналізувати біль, знайти причину й швидко все виправити.
  Ця карта лагідно запрошує дозволити почуттю бути почуттям. Дощ падає, а потім минає; смуток може рухатися подібно, коли йому це дозволяють. Можна подарувати собі доброту, час і товариство людей, здатних вислухати, не квапивши. Якщо важкі почуття не минають, розмова з людиною, якій довіряєте, чи з кваліфікованим фахівцем може допомогти. Що означало б ставитися до власного смутку так, як Ви ставилися б до смутку друга?
meaningReversed: |-
  У перевернутому положенні Трійка Мечів може відображати повільне послаблення болю. Буря, можливо, відходить, хоча земля ще мокра. Можна помітити, як повертаються невеликі миті легкості, або відчути, що можете говорити про те, що сталося, трохи стійкіше.
  Інше прочитання — смуток, звернений усередину: біль, який міцно тримають і яким не діляться, можливо, тому що він здається надто особистим, або тому що інші ніби чекають, що з Вами вже все гаразд. Біль, що лишається невисловленим, може затримуватися довше, ніж потрібно.
  Ця карта запрошує помітити, що допомагає Вам відпускати, хоч трохи. Це може бути письмо, час надворі, довірча розмова чи просто дозвіл сумувати без дедлайну. Немає правильного темпу відновлення після болісної миті. Що одне лагідне Ви могли б подарувати собі сьогодні?
aspects:
  relationshipsUpright: >-
    У стосунках ця карта може відображати зранені почуття: різке слово, розчарування чи болісну дистанцію між Вами й кимось близьким. Вона не каже, хто винен. Варто поміркувати, чи не дати почуттю місце, перш ніж вирішувати, що воно означає. Коли будете готові, спокійно поділитися болем і вислухати погляд іншої людини може допомогти обом зрозуміти, що сталося.
  relationshipsReversed: >-
    У перевернутому положенні Трійка Мечів може натякати на біль, що починає слабнути між людьми, чи на біль, який досі тихо тримають усередині. Можливо, вибачення можливе, а можливо, здоровішим кроком буде просте прийняття. Можна запитати себе, чого Вам потрібно, щоб відчути спокій, хай із цією людиною чи без неї. Прощення, якщо воно прийде, може прийти у свій час.
  workUpright: >-
    У роботі чи проєкті ця карта може відображати розчарування: критичний відгук, що зачепив, план, який не склався, чи невдачу після справжніх зусиль. Відчувати це — нормально. Можна дозволити собі паузу перед відповіддю, а потім, коли мине перша хвиля, пошукати корисну частину повідомлення. Ваша цінність більша за один результат.
  workReversed: >-
    У перевернутому положенні ця карта може вказувати на відновлення після професійної невдачі чи на роздратування, яке Ви мовчки носите в собі. Можна помітити, чи не впливає давнє розчарування на те, як Ви беретеся за нові завдання. Якщо назвати його, можливо, із колегою чи наставником, якому довіряєте, його хватка може послабитися, і Ви повернетеся до роботи зі свіжою енергією.
  growthUpright: >-
    Для особистісного зростання Трійка Мечів запрошує практикувати ніжність до власного болю. Смуток — частина людського життя, а не ознака, що з Вами щось не так. Можна дослідити прості способи дбати про себе, коли Вам сумно: відпочинок, рух, звичні втіхи й люди, які дозволяють бути такими, як Ви є.
  growthReversed: >-
    У перевернутому положенні ця карта може відображати навчання відпускати те, що болить, у темпі, який здається безпечним. Можна помітити, де Ви затримували подих, буквально чи образно. Видих, кілька сліз чи кілька чесних речень у щоденнику можуть бути невеликим актом відпускання. Відновлення рідко буває прямою лінією, і це нормально.
reflectionQuestions:
  - "Яке почуття Ви намагалися подолати самими лише думками?"
  - >-
    Кому Ви могли б дозволити побачити свій смуток, не чекаючи, що ця людина його виправить?
  - "Що одне добре Ви могли б зробити для себе сьогодні?"
imageryNote: >-
  Оригінальне зображення показує три тонкі клинки, що спираються на камінь у формі серця під низьким сірим небом. Довкола тихо падає дощ, а на краю хмар проглядає слабкий просвіт. Камінь натякає на вагу смутку, дощ — на сльози й вивільнення. Далеке світло натякає, що бурі минають, не обіцяючи, коли саме.
