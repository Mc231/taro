shortUpright: >-
  Певний етап може завершуватися. Ця карта запрошує помітити, що закінчується і який простір лишається.
shortReversed: >-
  Щось може бути готовим завершитися, поки частина Вас за нього тримається. Що допомогло б послабити хватку?
meaningUpright: |-
  Попри назву, ця карта не про фізичну смерть. Вона говорить про завершення у звичайному, людському сенсі: кінець етапу, ролі, звички чи способу бачити себе. Як осінь звільняє гілки перед новим ростом, вона натякає, що деяким речам треба завершитися, щоб інші могли початися.
  У повсякденному житті ця карта може відображати переїзд, завершення курсу, вихід із проєкту чи відчуття, що стара версія Вас більше не пасує. Вона може принести суміш почуттів: полегшення, смуток, непевність, навіть захват. Усі вони природні. Перетворення рідко буває охайним, і часто потрібен час, щоб зрозуміти, що зміна зробила можливим.
  Ця карта запрошує Вас поміркувати, що готове до відпускання. Можна запитати себе, що Ви досі несете за звичкою і який простір міг би відкритися, якби Ви це поклали. Смерть підкреслює, що завершення, навіть бажані, заслуговують на визнання. Ушанування того, що було, може полегшити поворот до того, що може бути далі.
meaningReversed: |-
  У перевернутому положенні Смерть може відображати завершення, яке не поспішає. Ви можете відчувати, що етап минув, і водночас триматися за нього, можливо, тому, що знайоме здається безпечнішим за невідоме, або тому, що відпустити — наче втратити частину себе.
  Ця карта може вказувати й на перехід, що відбувається повільно й тихо, під поверхнею, а не в одну ясну мить. Не кожна зміна приходить із чітким розривом.
  Можливо, варто помітити, за що Ви чіпляєтеся і що це чіпляння оберігає. Можуть допомогти невеликі ритуали закриття, як-от прощальний лист, який Ви не надсилатимете, розібрана шухляда чи відзначений останній день. Поспішати не треба. Дозвіл собі сумувати за тим, що завершується, може зробити відпускання лагіднішим.
aspects:
  relationshipsUpright: >-
    У стосунках ця карта може відображати суттєву зміну в тому, як працює зв’язок: новий етап, зміну ролей чи кінець шаблону, що вже не допомагав жодній людині. Вона не вказує на чиєсь фізичне самопочуття. Вона може запрошувати разом визнати те, що змінюється, чесно й дбайливо.
  relationshipsReversed: >-
    У перевернутому положенні ця карта може вказувати на чіпляння за стару динаміку, яку обоє переросли, або на складність прийняти, що зв’язок змінився. Варто поміркувати, чого Вам знадобилося б, щоб дозволити стосункам набути нової форми, хоч якою вона виявиться.
  workUpright: >-
    У роботі чи проєкті Смерть підкреслює завершення й перехід. Вона може відображати кінець ролі, закриття проєкту чи відмову від способу роботи, що вичерпав себе. Можна підбити підсумок того, чого Ви навчилися і що хочете взяти з собою в наступний розділ.
  workReversed: >-
    У перевернутому положенні Смерть може відображати перебування в завданні, ролі чи методі за звичкою, коли вони вже не пасують. Вона може вказувати й на страх перед тим, що буде потім. Можна записати, що поточна ситуація ще дає Вам і чого коштує, і помітити, що каже цей баланс.
  growthUpright: >-
    Старі ідентичності можуть опадати, як листя, звільняючи місце для того, що ще формується. Можна помітити переконання про себе, які колись були правдивими, але тепер уже ні. Відпустивши їх, Ви можете звільнити простір для версії себе, чеснішої щодо того, ким Ви стаєте.
  growthReversed: >-
    У перевернутому положенні Смерть може питати, чи не тримає Вас страх змін у тіснішому просторі, ніж Вам потрібно. Вона може відображати повільне, терпляче перетворення, що заслуговує на Вашу довіру. Можна обрати цього тижня одну дрібницю, яку відпустите, і помітити, як почуватиметеся після цього.
reflectionQuestions:
  - "Який розділ Вашого життя, здається, тихо закривається?"
  - >-
    Який старий шаблон у близьких стосунках, можливо, готовий змінитися?
  - >-
    Який невеликий ритуал допоміг би дбайливо відзначити завершення?
imageryNote: >-
  Смерть Taro постає тихим осіннім краєвидом, де повільна річка несе опале листя до сонця, що сходить на обрії. Неквапна фігура в плащі йде вздовж води, тримаючи одну насінну коробочку чи голу гілку — символи того, що закінчується, і того, що чекає, щоб прорости. Біла квітка на темному тлі може натякати на оновлення всередині відпускання. Настрій спокійний і шанобливий, він вказує на перетворення, а не на втрату.
