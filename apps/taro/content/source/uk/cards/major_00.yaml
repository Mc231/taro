shortUpright: >-
  Крок у щось нове, зроблений радше з цікавістю, ніж із певністю.
shortReversed: "Пауза на краю: це обережність чи страх видатися смішними?"
meaningUpright: |-
  Блазень стоїть на самому початку Старших арканів під номером нуль, ще до того, як засвоєно будь-який урок. Це енергія людини, що вирушає в дорогу з легкою торбою й відкритим обличчям і більше цікавиться тим, що може показати шлях, ніж тим, де саме він закінчується.
  У повсякденному житті ця карта може відображати перший тиждень на новому місці, хобі, за яке беретеся без плану стати майстром, або розмову, яку починаєте, не репетируючи кожної фрази. Вона може вказувати на ту частину Вас, що готова пробувати, навіть коли інша частина просить певності, якої ніхто не може дати. Тут незнання — не вада, а просто місце, з якого починається кожна подорож.
  Ця карта запрошує Вас поміркувати, де трохи більше легкості могло б допомогти. Що змінилося б, якби Ви дозволили собі знову бути новачком, ставити прості питання й учитися на практиці? Блазень не просить ігнорувати здоровий глузд. Він просить помітити, чи не заважає Вам страх помилитися зробити бодай якийсь крок.
meaningReversed: |-
  У перевернутому положенні Блазень може показувати іскру нового початку, яка ще не зовсім розгорілася. Вас може тягнути до чогось свіжого, а Ви водночас стоїте нерухомо, обертаєте ідею в голові й чекаєте знаку, що рухатися безпечно. Іноді таке чекання мудре; іноді воно непомітно перетворилося на звичку.
  Ця позиція може відображати й протилежний нахил: енергію, що мчить уперед, не озираючись, погоджується на все й лишає мало місця, щоб помітити, куди ступають ноги. Обидва нахили ставлять те саме питання про готовність і довіру.
  Можливо, варто запитати себе, що з цього Вам зараз ближче. Якщо Ви стримуєтеся, яким може бути один маленький спосіб без великих ставок спробувати воду? Якщо Ви мчите, як виглядало б зберегти ентузіазм і додати одну мить паузи перед наступним стрибком?
aspects:
  relationshipsUpright: >-
    У стосунках Блазень може відображати грайливу, незахищену якість: зустріч із кимось без сценарію або дозвіл знайомому зв’язку знову Вас здивувати. Він може запрошувати принести цікавість у стосунки з близькими людьми й ставити питання, відповіді на які Ви нібито вже знаєте. Відкритість тут — не наївність, а готовність бути присутніми, не вирішуючи наперед, як усе має піти.
  relationshipsReversed: >-
    У перевернутому положенні ця карта може вказувати на вагання, чи впускати когось у своє життя, або на такий швидкий рух, що іншій людині складно встигати. Можна помітити, чи не захищаєте Ви себе розмитістю, чи не пропускаєте повільніші етапи знайомства. Лагідна розмова про темп, Ваш і її, може відкрити простір для Вас обох.
  workUpright: >-
    У роботі чи будь-якому проєкті Блазень може відображати початок чогось незнайомого: нову роль, курс, творчу ідею без жодної історії успіху. Він запрошує сприймати ранні помилки як інформацію, а не як вироки. Можна запитати себе, що Ви спробували б, якби першій спробі дозволено було бути сирою, і хто міг би допомогти Вам освоїтися дорогою.
  workReversed: >-
    У перевернутому положенні Блазень може відображати ідею, яку постійно відкладають, доки умови не здадуться ідеальними, або стрибок без перевірки основ. Варто поміркувати, чого Вам бракує: більше інформації чи просто більше сміливості. Якщо записати найменший можливий перший крок і один практичний запобіжник, туманне бажання може стати тим, що можна перевірити, не ставлячи на кін усе.
  growthUpright: >-
    Для особистісного зростання ця карта вшановує розум новачка. Вона може запрошувати спробувати щось там, де Вам не треба захищати репутацію: нову навичку, інший шлях додому, питання, поставлене вголос. Зростання тут приходить від цікавості й готовності дивуватися, а не від того, щоб усе вдалося з першої спроби.
  growthReversed: >-
    У перевернутому положенні Блазень може запитувати, чи не почав страх видатися безглуздо звужувати Ваш світ. Він може відображати й неспокій, що перескакує від однієї новинки до іншої, не даючи жодній пустити коріння. Можна помітити, який шаблон Вам знайоміший, і тиждень поекспериментувати з його лагідною протилежністю.
