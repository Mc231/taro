  - >-
    Який перший крок без великих ставок Ви могли б зробити цього тижня?
imageryNote: >-
  Блазень Taro постає на краю високого місця з відкритим небом попереду, на півкроці, з маленьким клуночком у руках. Невелика тваринка-супутник біля ніг може символізувати інстинкт, грайливий або застережливий. Одна біла квітка може натякати на невинність і відкритість, а широкий обрій і ранкове світло говорять про можливості. Підняте обличчя фігури запрошує глядача запитати, куди вона дивиться і що вирішила не брати з собою.
