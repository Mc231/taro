  - "У кого Ви могли б повчитися і про що його запитали б?"
  - >-
    Який найменший справжній крок до нової навички Ви могли б зробити цього тижня?
imageryNote: >-
  Зображення може показувати юну фігуру на відкритому полі, що тримає одну монету на рівні очей і уважно її роздивляється. Довкола можуть бути свіжозорана земля, невеликий гай і далекі пагорби. Піднята монета може символізувати зосереджене навчання й захоплення відчутним, відкрита земля — потенціал, який ще треба обробити, а рівна, уважна постава — готовність учитися крок за кроком.
