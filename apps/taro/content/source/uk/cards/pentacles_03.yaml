meaningUpright: |-
  Трійка Пентаклів — карта будівництва разом з іншими. Три монети, вбудовані в споруду, натякають на роботу, якої жодна людина не змогла б створити сама: одна приносить задум, інша — матеріали, ще інша — вправні руки. Вирізняється не ранг, а повага до внеску кожного.
  У повсякденному житті це може виявлятися як командний проєкт, що нарешті склався, сусід, який допомагає щось полагодити, навчальна група чи наставник, чий відгук відточує Вашу майстерність. Вона може відображати й задоволення від того, що Ваш внесок визнали, і від того, що Ви визнаєте внесок інших.
  Ця карта запрошує поміркувати, де співпраця могла б підняти Вашу роботу вище, ніж Ви впоралися б самі. Можна запитати себе, чия експертиза доповнює Вашу, як ясно поділитися планом і як Ви приймаєте пропозиції. Майстерність поглиблюється, коли люди готові дивитися на одне креслення й покращувати його разом.
meaningReversed: |-
  У перевернутому положенні Трійка Пентаклів може вказувати на спільні зусилля, що втратили спільний план. Люди можуть наполегливо працювати, але на трохи різні картини, або ролі можуть бути розмитими, тож одні завдання дублюються, а інші випадають. Вона може відображати й тяжіння робити все самотужки, можливо, тому що попросити здається повільніше чи менш безпечно.
  Це запрошення переглянути креслення, а не шукати винних. Неузгодженість трапляється часто, і назвати її рано зазвичай коштує менше, ніж тиснути далі.
  Можна запропонувати коротку розмову про цілі й про те, хто що робить, чи записати план там, де його бачать усі. Якщо Ви схильні працювати ізольовано, подумайте про одну частину, яку могли б передати, і помітьте, що змінюється, коли хтось додає свою навичку до Вашої.
aspects:
  relationshipsUpright: >-
    У близьких стосунках ця карта може відображати командну роботу в щоденному житті: спільне планування переїзду, розподіл хатніх справ, підтримку проєктів одне одного. Можна помітити, чим відрізняються Ваші сильні сторони і як це може бути даром, а не тертям. Якщо вголос сказати, що Ви цінуєте у внеску іншої людини, це може зміцнити фундамент, який Ви будуєте разом.
  relationshipsReversed: >-
    У перевернутому положенні карта може натякати, що Ви з кимось близьким рухаєтеся до різних картин тієї самої мети або що одна людина несе більше практичного навантаження. Замість вести рахунок, можна сісти й порівняти очікування. Уточнення того, хто що робить, може зняти напругу й допомогти кожному відчути, що його бачать.
  workUpright: >-
    У роботі ця карта підкреслює співпрацю й майстерність. Вона може відображати проєкт, де ясне спілкування й взаємна повага дають розкритися навичкам кожного. Можна шукати нагоди попросити відгуку, поділитися знаннями чи поєднати людей, чиї здібності добре доповнюють одна одну. Якість часто зростає, коли план спільний.
  workReversed: >-
    Тут карта може вказувати на неясні ролі, плутанину чи команду, що тягне в різні боки. Вона може відображати й роботу наодинці над тим, що виграло б від інших очей. Можна запропонувати коротко узгодити цілі й обов’язки чи запросити одного колегу переглянути Ваш підхід, перш ніж іти далі.
  growthUpright: >-
    Для особистісного зростання Трійка Пентаклів може запрошувати вчитися разом з іншими й у них. Учитель, майстерня, партнер для практики чи онлайн-спільнота можуть допомогти відшліфувати навичку. Можна помітити, як це — бути новачком серед людей, які знають більше, і як багато Ви можете запропонувати у відповідь.
  growthReversed: >-
    У перевернутому положенні карта може відображати неохоту показуватися, поки ще вчитеся, чи звичку відкидати відгуки. Можна дослідити, що ускладнює прийняття порад. Обрати одну людину, якій довіряєте, щоб показувати їй незавершену роботу, може перетворити навчання на спільний процес, а не самотнє випробування.
reflectionQuestions:
