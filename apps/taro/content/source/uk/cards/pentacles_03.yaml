imageryNote: >-
  Зображення може розміщувати три фігури довкола незавершеної споруди, як-от арки, верстака чи піднятого каркаса, і кожна зайнята своїм завданням. Одна тримає план, друга обробляє матеріал, третя підтримує чи оцінює. Три монети, вбудовані в саму споруду, можуть натякати, що цінність створюється співпрацею. Риштування, інструменти й відкритий простір довкола будови натякають, що робота ще триває й відкрита до вдосконалення.
