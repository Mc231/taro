shortUpright: >-
  Можливо, діє хитрий план чи тихий обхідний шлях; можна запитати себе, чи пасує він людині, якою Ви хочете бути.
shortReversed: >-
  Прихований план може втрачати привабливість; чесність із собою чи з іншими може бути легшою за зусилля приховувати.
meaningUpright: |-
  Сімка Мечів показує когось, хто вислизає з більшим, ніж йому дали, озираючись, чи ніхто не помітив. Це карта стратегії, кмітливості й дій наодинці. Іноді це винахідливість; іноді — спосіб уникнути важчого, чеснішого шляху.
  Ви можете впізнати цю карту в обхідному шляху, яким кортить скористатися, у розмові, якої Ви уникаєте, тихо обходячи когось, чи в плані, який тримаєте при собі. Вона може відображати відчуття, що мусите впоратися з усім самі, бо попросити було б надто складно. Вона може вказувати й на підозру, що в ситуації довкола щось не зовсім відкрито, без певності в цьому.
  Ця карта запрошує поміркувати, що захищає ця таємність чи самотні зусилля. Незалежність може бути мудрою, і не кожен план потребує глядачів. Утім, можна запитати себе, чи відповідає цей шлях Вашим цінностям і чого коштує тримати його в таємниці. Чи можна досягти тієї самої мети так, щоб про це можна було говорити відкрито?
meaningReversed: |-
  У перевернутому положенні Сімка Мечів може відображати прихований план, що втрачає хватку. Тримати щось у таємниці могло стати втомливіше, ніж воно того варте, або Ви відчуваєте готовність поділитися тим, що несли наодинці. Зізнання, хай часткове, може принести несподіване полегшення.
  Інше прочитання звернене всередину: історія, яку Ви розповідаєте собі, щоб уникнути незручної правди. Самообман може бути тонким, як-от переконання себе, що розв’язувати проблему має хтось інший.
  Можна запитати себе, де трохи більше відкритості спростило б Вашу ситуацію. Це може означати визнати помилку, попросити допомоги, про яку Ви уникали просити, чи переглянути стратегію, що розраховує на те, що ніхто не помітить. Що змінилося б, якби Ви дозволили одній людині, якій довіряєте, побачити всю картину?
aspects:
  relationshipsUpright: >-
    У стосунках ця карта може відображати щось невисловлене: тихо ухвалене рішення, потребу, задоволену деінде, чи неспокійне відчуття, що діляться не всім. Вона нікого не звинувачує. Варто поміркувати, де відкритість здається ризикованою і чому. Лагідна цікавість, а не підозра, зазвичай запрошує до чесності й інших, і Вас самих.
  relationshipsReversed: >-
    У перевернутому положенні Сімка Мечів може вказувати на правду, що виходить на світло, чи на бажання бути прозорішими з кимось близьким. Можливо, Ви готові сказати те, що стримували. Якщо хтось інший відкриється Вам, вислухати без миттєвого осуду може уможливити відновлення. Довіра часто зростає, коли чесність зустрічають із турботою.
  workUpright: >-
    У роботі ця карта може відображати обхід системи замість роботи в ній, тихе привласнення заслуг чи виконання завдання наодинці, щоб не координуватися з іншими. Винахідливість має цінність. Можна запитати себе, чи витримав би Ваш підхід, якби всі могли його бачити, і чи не дала б пряма розмова більше з меншим напруженням.
  workReversed: >-
    У перевернутому положенні ця карта може пропонувати переглянути стратегію, що залежить від того, щоб лишатися непоміченими, чи нарешті поділитися інформацією, яку Ви тримали при собі. Можна попросити допомоги з тим, із чим Ви наодинці мучилися. Відкрито сказати про обхідний шлях чи помилку рано може бути значно легше, ніж розгрібати це згодом.
  growthUpright: >-
    Для особистісного зростання Сімка Мечів запрошує поглянути, коли й чому Ви дієте наодинці. Опора на себе може бути силою, а може бути способом уникати вразливості. Можна помітити ситуації, у яких Ви обираєте хитрість замість прямоти, і поекспериментувати, просто просячи того, чого хочете.
  growthReversed: >-
    У перевернутому положенні ця карта може відображати зростання чесності із собою. Можна впіймати зручну історію, яку Ви собі розповідали, і лагідно поставити її під сумнів. Чесність із собою не вимагає суворості; вона просто означає дозволити собі бачити ясно. Що Ви робили б інакше, якби перестали виправдовувати цю ситуацію?
reflectionQuestions:
