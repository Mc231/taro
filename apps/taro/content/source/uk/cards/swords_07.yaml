    З чим Ви справляєтеся наодинці, хоча, можливо, могли б розділити це з кимось?
  - >-
    Де пряма розмова могла б спрацювати краще, ніж тихий обхідний шлях?
  - >-
    Яку одну невелику правду Ви могли б сказати вголос цього тижня?
imageryNote: >-
  Оригінальне зображення показує фігуру, що навшпиньки перетинає освітлене місяцем поле з оберемком клинків, а кілька лишаються стояти в траві позаду. Далекі намети тихо світяться, нічого не підозрюючи. Ланцюжок слідів показує пройдений шлях. Оберемок натякає на взяте понад запропоноване, клинки, що лишилися, — на те, чого не понести, а погляд назад — на неспокій від дій потай.
