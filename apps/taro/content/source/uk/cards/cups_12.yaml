imageryNote: >-
  Зображення показує вершника на спокійному коні, що повільно рухається берегом річки чи тихою долиною, простягаючи чашу вперед як дарунок. Мотиви хвиль чи мушель на його обладунку й плащі можуть натякати на уяву й емоційну глибину. Течія води поруч перегукується з рухом почуттів. М’які сині й срібні тони з дотиком теплого кольору передають романтику, щирість і мрійливе відчуття мети.
