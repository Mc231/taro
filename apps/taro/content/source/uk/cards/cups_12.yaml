meaningUpright: |-
  Лицар Кубків їде неквапливим кроком, тримаючи чашу перед собою, ніби несе дарунок. На відміну від інших лицарів, він не мчить уперед. Він рухається життям, керуючись почуттями, ідеалами й бажанням творити красу чи зв’язок.
  Ця карта може відображати романтику в широкому сенсі: зворушення людьми, мистецтвом, справами чи ідеями й бажання діяти відповідно до цього почуття. Вона може вказувати на запрошення, творчу пропозицію чи вияв прихильності. Вона може описувати й Вашу власну здатність іти за серцем, водночас рухаючись уперед.
  У повсякденному житті це може виглядати як робота над проєктом, що Вас захоплює, висловлене захоплення кимось чи рішення, ухвалене з огляду на те, що здається змістовним, а не найефективнішим. Карта запрошує шанувати свої ідеали й лагідно втілювати їх у дії. Можна запитати себе, що Ви запропонували б світові, якби трохи більше довіряли серцю, і яким міг би бути витончений перший крок.
meaningReversed: |-
  У перевернутому положенні Лицар Кубків може відображати ідеали, що відпливли від реальності, чи почуття, які змінюються надто швидко, щоб на них будувати. Можна помітити обіцянки, дані в теплу мить, які важко виконати, чи схильність закохуватися в ідею чогось більше, ніж у саму річ.
  Він може звертатися й усередину: творчий чи романтичний імпульс, що чекає на більшу зрілість, або настрій, який треба зрозуміти, перш ніж він зможе спрямовувати дії.
  Ця карта запрошує поєднати серце зі стійкістю. Чого Ви справді хочете, коли сяйво вляжеться? Можна перевірити, чи збігаються Ваші слова й дії, і сповільнити зобов’язання, доки вони не стануть посильними. Мрії можуть лишатися прекрасними, стаючи водночас заземленішими.
aspects:
  relationshipsUpright: >-
    У стосунках Лицар Кубків може відображати тепло, романтику чи щирий жест із партнером, другом чи кимось новим. Він може запрошувати висловлювати почуття щиро й творчо. Можна помітити, як це — вести з добротою і дозволяти діям відповідати словам.
  relationshipsReversed: >-
    У перевернутому положенні ця карта може вказувати на суперечливі сигнали, мінливість настрою чи ідеалізацію когось. Можна запитати себе, чи висловлюються почуття ясно й послідовно, Вами та іншою людиною. Заземлення романтики в щоденній надійності, як-от дотримання дрібних обіцянок, може з часом збудувати глибшу довіру.
  workUpright: >-
    У роботі ця карта може відображати творчу пропозицію, ідею, рушієм якої є пристрасть, чи роль, що дає змогу використовувати уяву й емпатію. Вона може запрошувати запропонувати щось, що Вам небайдуже, чи вкласти більше серця в поточні завдання. Ентузіазм може бути заразним, коли поєднаний з доведенням справ до кінця.
  workReversed: >-
    У перевернутому положенні карта може відображати ідеї, що лишаються на етапі презентації, чи мотивацію, що злітає й падає разом із настроєм. Можна розбити велике бачення на менші кроки, яких Ви здатні дотримуватися. Чесність щодо своїх можливостей може вберегти і Ваші ідеали, і довіру, яку покладають на Вас інші.
  growthUpright: >-
    Для особистісного зростання Лицар Кубків запрошує йти за тим, що Вас зворушує. Можна спробувати творче чи співчутливе заняття просто тому, що воно для Вас важливе. Помічаючи, що хвилює Ваше серце, можна прояснити свої цінності й жити відповідно до них у звичайних щоденних справах.
  growthReversed: >-
    У перевернутому положенні ця карта може просити дослідити розрив між тим, якими Ви себе уявляєте, і тим, як дієте. Можна помітити шаблон, коли починаєте з ентузіазмом, а потім згасаєте. Лагідні ритуали довкола Ваших захоплень можуть допомогти їм тривати й після першого спалаху почуттів.
