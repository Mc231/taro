shortUpright: >-
  Ви стоїте на межі знайомого й дивитеся назовні; це слушна мить, щоб накреслити, куди Ви хотіли б рушити.
shortReversed: >-
  Затишок і обережність можуть тримати більший план на полиці; можна ще раз поглянути, що Вас там тримає.
meaningUpright: |-
  Двійка Жезлів іде за першою іскрою як пауза для бачення. Ідея вже не просто відчуття; тепер Ви стоїте трохи вище, дивитеся на краєвид і міркуєте, як далеко він може сягати. Один жезл уже встромлено позаду Вас як знак того, що Ви збудували, а другий у руці, готовий вирушити кудись у нове місце.
  Ця карта часто з’являється, коли Ви зважуєте більший крок: навчання в іншому місті, переосмислення ролі, проєкт, що вимагає від Вас більше, ніж звичний розпорядок. Вона може відображати й неспокійне відчуття, що Ви переросли простір, хоча досі його любите.
  Запрошення тут — планувати водночас амбітно й чесно. Можна записати, на що Ви сподіваєтеся, чого це коштуватиме в часі й енергії і який перший крок достатньо малий, щоб його спробувати. Дивитися далеко корисно; так само корисно обрати наступний крок, який Ви справді можете зробити.
meaningReversed: |-
  У перевернутому положенні Двійка Жезлів може відображати план, що лишається на папері. Ви можете й далі вдивлятися в обрій, не пакуючи валізу, бо знайоме здається безпечнішим або пункт призначення ще розмитий. Іноді вагання мудре, а іноді це просто звичка.
  Ця карта може вказувати й на плани, складені заради чийогось схвалення, або на бачення, що вже не пасує людині, якою Ви стаєте. Коли мета здається важкою, а не захопливою, варто запитати, чи вона досі Ваша.
  Можна переглянути свою мапу свіжим поглядом. Як виглядала б менша, особистіша версія цього плану? Який страх найгучніший і чи він про сам крок, чи про те, що можуть подумати інші? Якщо назвати його, наступний хід може здаватися менше стрибком і більше вибором.
aspects:
  relationshipsUpright: >-
    У стосунках ця карта може запрошувати до розмови про майбутнє, яке уявляє кожен із Вас: де хочете жити, як проводити час, що прагнете дослідити. Вона може відображати зв’язок, що є надійною базою, з якої кожен вільний дивитися назовні. Можна запитати когось близького, на який обрій він останнім часом дивиться.
  relationshipsReversed: >-
    У перевернутому положенні Ви чи хтось близький можете стримувати бажання змін, бо сказати про нього вголос здається ризикованим. Плани можуть тихо розходитися, коли ними ніколи не діляться. Це може бути мить, щоб поговорити про надії, які тримали в собі, слухаючи стільки ж, скільки говорячи, щоб ніхто з Вас не планував наодинці.
  workUpright: >-
    У роботі Двійка Жезлів може вказувати на стратегічне мислення: окреслення наступного етапу проєкту, розгляд нової галузі чи формування довшої мети. Можна приділити трохи часу загальній картині, перш ніж знову поринути в щоденні справи, а потім обрати одну конкретну дію, що перенесе план із дошки в рух.
  workReversed: >-
    У перевернутому положенні робочий план може застрягти між затишком і амбіціями або формуватися більше тим, чого від Вас нібито чекають, ніж тим, чого Ви хочете. Можна перевірити, чи досі мета Вас мотивує. Якщо так, допомогти може перший невеликий експеримент; якщо ні, перекреслити план — теж цілком слушний шлях уперед.
  growthUpright: >-
    Для особистісного зростання ця карта запрошує серйозно поставитися до власних амбіцій. Що Ви дослідили б, якби дозволили собі думати за межами звичних обмежень? Можна накидати приблизну картину наступного року чи двох не як тверду обіцянку, а як напрямок, що допомагає помічати можливості, коли вони з’являються.
  growthReversed: >-
    У перевернутому положенні бажання безпеки й бажання зростання можуть тягнути в різні боки. Обидві потреби справжні. Можна дослідити, що зробило б новий крок досить безпечним, щоб його спробувати, і яка підтримка, практика чи інформація могли б перетворити далеку ідею на те, до чого можна наближатися поступово.
reflectionQuestions:
  - >-
    Коли Ви дивитеся за межі звичного розпорядку, що Вам кортить дослідити?
  - >-
    Чия підтримка зробила б більший крок досяжнішим і як Ви могли б розповісти цій людині про нього?
  - >-
    Який найменший перший крок перевірив би цей план у реальному житті?
imageryNote: >-
  Фігура стоїть на високому мурі чи виступі: один жезл міцно закріплено поруч, другий вона легко тримає в руці, вдивляючись у далеку землю чи море. Поруч лежить маленький глобус, мапа чи компас. Закріплений жезл уособлює вже збудоване, піднятий — рішення йти далі. Широкий краєвид запрошує глядача уявити багато можливих маршрутів, а не один визначений шлях.
