shortUpright: >-
  Можливо, Ви готові насолодитися тим, що виплекали власними зусиллями. Помітьте тиху впевненість у просторі, який Ви сформували.
shortReversed: >-
  Затишок може здаватися недосяжним чи дивно порожнім. Можна запитати себе, що дало б справді відпочити в тому, що вже маєте.
meaningUpright: |-
  Дев’ятка Пентаклів показує фігуру, що прогулюється квітучим садом серед лоз, обважнілих від плодів, і монет довкола. Їй, здається, легко, вона сама, але не самотня. Ця карта говорить про самодостатність і насолоду тим, що допомогли виростити Ваша турбота й дисципліна.
  Ви можете впізнати це в домі, який зробили затишним, у навичці, що тепер Вас підтримує, у часі, який навчилися добре проводити на самоті, чи просто у відчутті, що Ваше життя частково набуло бажаної форми. Тут є й вишуканість: цінування краси, смаку й невеликих розкошів, що відчуваються заслуженими.
  Карта запрошує зупинитися й справді насолодитися виплеканим, а не одразу рушати до наступної мети. Можна запитати себе, що означає для Вас незалежність, які втіхи справді живлять і як Ви могли б ушанувати власні зусилля. Відчуття власної цінності, що спирається на Ваші цінності, може бути стійкішим, ніж цінність, виміряна чужим схваленням.
meaningReversed: |-
  У перевернутому положенні Дев’ятка Пентаклів може відображати складність відпочити в тому, що Ви збудували. Робота може постійно витісняти насолоду, або затишок може здаватися порожнім, ніби належить комусь іншому. Вона може вказувати й на залежність від зовнішнього схвалення, коли відчуття цінності залежить від того, як усе виглядає, а не як відчувається.
  Це прочитання про звернення всередину. Сад, можливо, є, але Ви не дозволяєте собі ним прогулятися.
  Можна дослідити, що ускладнює прийняття легкості. Чи є переконання, що відпочинок завжди треба заслуговувати знову? Чи не плутається незалежність з ізоляцією? Обрати одну невелику радість і насолодитися нею повністю, без провини й глядачів, може бути першим кроком до відчуття себе вдома у власному житті.
aspects:
  relationshipsUpright: >-
    У стосунках ця карта може відображати стійке відчуття себе, яке Ви приносите у свої зв’язки. Насолода власним товариством може зробити час з іншими вибором, а не потребою. Можна помітити, як Ваша незалежність і близькість до людей можуть підтримувати одне одного, і поділитися частиною свого саду з тими, кого любите.
  relationshipsReversed: >-
    У перевернутому положенні карта може натякати, що Ви спираєтеся на стосунки, щоб відчути власну цінність, або тримаєте людей на відстані, щоб захистити незалежність. Можна запитати себе, яке поєднання близькості й опори на себе здається Вам слушним зараз, і лагідно дозволити комусь побачити і Ваші сильні сторони, і Ваші потреби.
  workUpright: >-
    У роботі Дев’ятка Пентаклів може відображати впевненість у своїх здібностях і плоди тривалих зусиль, як-от автономію, повагу чи заслужений ритм. Можна знайти час визнати досягнуте й насолодитися стабільністю, яку Ви допомогли створити, перш ніж ставити наступну мету.
  workReversed: >-
    Тут карта може вказувати на перепрацювання, що лишає мало місця, щоб щось оцінити, чи на досягнення, що тішать менше, ніж очікувалося. Можна поміркувати, які винагороди справді важливі для Вас. Коригування меж довкола Вашого часу може дати плодам роботи дістатися й до решти життя.
  growthUpright: >-
    Для особистісного зростання ця карта запрошує плекати відчуття власної цінності й насолоду. Час на самоті, гарний простір, продуманий розпорядок — усе це може бути виявом поваги до себе. Можна створити один невеликий ритуал, що вшановує пройдений шлях, і дозволити йому бути просто для Вас.
  growthReversed: >-
    У перевернутому положенні карта може відображати неспокійне відчуття, що всього ніколи не досить, чи затишок, якого шукають, щоб заповнити внутрішню порожнечу. Можна дослідити, як відчувалася б справжня задоволеність поза зовнішнім виглядом. Помічаючи моменти справжньої легкості, хай короткі, легше їх упізнавати й до них повертатися.
reflectionQuestions:
  - >-
    Що Ви виплекали у своєму житті, але рідко зупиняєтеся, щоб цим насолодитися?
  - >-
    Як Ваша незалежність впливає на те, як Ви зближуєтеся з людьми?
  - >-
    Яку невелику радість Ви могли б повністю подарувати собі цього тижня, не заслуговуючи її?
imageryNote: >-
  Зображення може показувати одну фігуру серед виноградних лоз чи плодових дерев, з дев’ятьма монетами, вплетеними в зелень довкола, і маленьким птахом, що спокійно сидить на руці. Рясний сад може символізувати плоди терплячої турботи, птах — дисциплінований, лагідний розум, а неквапна постава — тиху впевненість. Насичені зелені й золоті тони можуть натякати на вишуканість без надмірності, на простір, що відчувається заслуженим і сформованим власноруч.
