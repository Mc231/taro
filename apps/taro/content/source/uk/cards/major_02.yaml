shortUpright: >-
  Тихе запрошення прислухатися до того, що Ви вже відчуваєте, але ще не висловили словами.
shortReversed: >-
  Зовнішній шум може заглушати тихіший голос усередині Вас; трохи тиші могло б допомогти.
meaningUpright: |-
  Верховна Жриця сидить між двома колонами, на порозі між відомим і ще прихованим. Ця фігура не діє й не пояснює; її дар — увага, те глибоке, терпляче слухання, яке помічає, що лежить під поверхнею ситуації, розмови чи почуття.
  У повсякденному житті ця карта може відображати передчуття, яке Ви не можете цілком обґрунтувати, відчуття, що щось недоговорено, або сон, що не відпускає аж до обіду. Вона може вказувати на моменти, коли відповідь з’являється не від збирання додаткової інформації, а від тихого перебування з тим, що вже є. Деякі речі стають ясними лише тоді, коли перестаєш вимагати ясності.
  Ця карта запрошує Вас довіритися повільнішим, менш словесним частинам себе. Можна виділити час для щоденника, прогулянки без навушників або просто для паузи перед відповіддю. Внутрішнє знання не замінює фактів і може існувати поруч із ними. Верховна Жриця просить помітити, що намагався сказати Вам тихіший голос, і дати йому трохи місця, перш ніж вирішувати, що робити.
meaningReversed: |-
  У перевернутому положенні Верховна Жриця може натякати, що Ваш внутрішній голос є, але його важко почути. Насичені дні, думки інших людей чи безперервний потік екранів можуть витісняти тишу, якої потребує ця карта. Можливо, Ви помічаєте, що знову й знову питаєте інших, що робити з тим, про що частково вже знаєте.
  Ця карта може вказувати й на те, що Ви надто довго щось тримаєте в собі: почуття, питання чи правду, яка лишалася прихованою і тепер здається важкою. Приватність — це здорово; але таємність, що Вас ізолює, може заслуговувати на другий погляд.
  Можливо, варто створити невеликий куточок тиші й подивитися, що випливе. Може допомогти писати без редагування або поставити собі одне просте питання й дочекатися першої чесної відповіді. Що Ви відчули, але ще не дозволили собі сказати?
aspects:
  relationshipsUpright: >-
    У стосунках Верховна Жриця може відображати зв’язок, де багато зрозуміло без слів, або мить, коли слухати важливіше, ніж говорити. Вона може запрошувати помітити підводні течії: що може означати мовчання друга чи що захищає Ваша власна нерішучість. Можна подарувати близькій людині неквапливу увагу.
  relationshipsReversed: >-
    У перевернутому положенні ця карта може вказувати на недомовленості між Вами та кимось близьким або на звичку читати між рядків замість того, щоб запитати прямо. Варто поміркувати, чи не могло б лагідне, чесне питання замінити здогадки. Вона може відображати й потребу берегти свій внутрішній світ, водночас дозволяючи комусь побачити його трохи більше.
  workUpright: >-
    У роботі чи проєкті Верховна Жриця може натякати, що не кожне рішення треба ухвалювати сьогодні. Вона може запрошувати спостерігати, збирати враження й довіряти своєму відчуттю часу. Цій карті добре пасує вдумлива робота: дослідження, письмо, планування чи наставництво. Тиху компетентність і стриманість можуть цінувати більше, ніж Вам здається.
  workReversed: >-
    У перевернутому положенні Верховна Жриця може відображати сумніви в слушному чутті через те, що інші гучніші, або інформацію, яку в команді притримують. Можна запитати себе, що Ви знаєте про ситуацію, але ще не озвучили. Спокійний, доречний спосіб поділитися цим міг би зробити роботу яснішою для всіх, зокрема й для Вас.
  growthUpright: >-
    Зростання з Верховною Жрицею зазвичай починається в тиші. Можна щодня кілька хвилин просто помічати свої думки, дихання чи довкілля, нічого не намагаючись виправити. З часом така увага може допомогти відрізняти тривожне базікання від стійкішого внутрішнього чуття.
  growthReversed: >-
    У перевернутому положенні Верховна Жриця може питати, чи не жили Ви останнім часом переважно на поверхні, реагуючи замість того, щоб розмірковувати. Це може бути поштовх знову звернутися всередину без тиску швидко знайти відповіді. Можна відвести цього тижня час для одного тихого ритуалу й помітити, що зміниться, коли дасте собі простір слухати.
reflectionQuestions:
  - >-
    Що Ви відчуваєте щодо своєї ситуації, але ще не сказали вголос?
  - "Чиє мовчання, зокрема Ваше власне, варто послухати уважніше?"
  - >-
    Де цього тижня Ви могли б знайти для себе десять тихих хвилин?
imageryNote: >-
  Верховна Жриця Taro постає на порозі освітленого місяцем дверного проходу, наполовину у світлі, наполовину в тіні, із закритою книгою на колінах. Позаду фігури ворушиться завіса, ніби за нею щось чекає. Серп місяця, що відбивається в нерухомій чаші з водою, може перегукуватися з циклами та інтуїцією, а глибокі сині відтінки натякають на спокій на поверхні й глибину під нею. Тиха, уважна нерухомість фігури — центр зображення.
