shortUpright: >-
  У тому, що інші пройшли до Вас, може бути мудрість. Яка традиція чи вчитель могли б допомогти зараз?
shortReversed: >-
  Успадковане правило може вже не пасувати. Ця карта запрошує звірити його з тим, що Ви справді цінуєте.
meaningUpright: |-
  Ієрофант — це карта спільного знання: способів робити речі, які громада передає від покоління до покоління. Він може уособлювати вчителів, наставників, установи, ритуали й професійні норми, усе, що допомагає людям учитися разом і відчувати причетність до чогось більшого за себе.
  У повсякденному житті ця карта може відображати вступ на курс, рецепт, що передається в родині, прохання до досвідченого колеги про пораду чи відзначення важливої події знайомим обрядом. Вона може вказувати на втіху від того, що не треба все вигадувати самотужки. Традиції несуть уроки багатьох людей, і в них часто є чимало здорового глузду.
  Ця карта запрошує Вас поміркувати, що Ви успадкували, а що обрали. Можна запитати себе, які спільні цінності надають Вашому життю стійкості і в кого Ви могли б повчитися зараз. Ієрофант — не про сліпу покору; він підкреслює цінність того, щоб добре опанувати форму, хоч би Ви її зберегли, пристосували чи згодом передали далі власними словами.
meaningReversed: |-
  У перевернутому положенні Ієрофант може відображати дедалі більшу відстань від правил чи очікувань, з якими Ви зростали. Щось, що колись здавалося правильним, тепер може видаватися надто вузьким, або Ви відчуваєте, що дотримуєтеся сценарію радше за звичкою, ніж із переконання.
  Ця карта може вказувати й на протилежний нахил: таке рішуче відкидання кожної умовності, що Ви пропускаєте те, що в ній досі могло б знадобитися. Сумнів — це здорово; зазвичай він працює добре, коли в ньому більше цікавості, ніж протесту.
  Можливо, варто поглянути на одне очікування, що здається важким, і запитати, звідки воно взялося. Чи досі воно відображає Ваші цінності, а чи чиїсь інші? Пошук власного шляху може передбачати збереження того, що й далі Вам служить, і шанобливе прощання з тим, що вже ні.
aspects:
  relationshipsUpright: >-
    У стосунках Ієрофант може відображати спільні цінності, зобов’язання та ритуали, що тримають людей разом: родинні традиції, річниці, щотижневі дзвінки. Він може запрошувати помітити, у що вірите і Ви, і хтось близький, і як Ви це шануєте. Порада від друга, якому довіряєте, чи від старшої людини теж може зараз стати в пригоді.
  relationshipsReversed: >-
    У перевернутому положенні ця карта може вказувати на напругу між тим, чого очікують від стосунків, і тим, що насправді здається правдивим для людей у них. Варто поміркувати, чи не дотримуєтеся Ви зовнішніх норм, які не пасують до Вашої ситуації. Чесна розмова про те, якого зв’язку хочете Ви обоє, може звільнити місце для Вашого власного способу жити.
  workUpright: >-
    У роботі чи навчанні Ієрофант підкреслює ґрунтовне опанування ремесла, повагу до усталених методів і пошук наставника. Це може бути слушний час, щоб пройти курс, здобути кваліфікацію чи попросити досвідчену людину показати, що й до чого. Належність до команди чи установи може дати не лише структуру, а й підтримку.
  workReversed: >-
    У перевернутому положенні Ієрофант може відображати роздратування тим, як усе робилося завжди, або відчуття, що офіційний шлях Вам не пасує. Можна запитати себе, які правила захищають якість, а які просто опираються змінам. Спокійно й з аргументами запропонувати кращий підхід може бути дієвіше, ніж обходити систему.
  growthUpright: >-
    Для особистісного зростання ця карта запрошує вчитися в тих, хто був до Вас. Книжки, вчителі, спільноти й практики можуть дати рамки, що підтримують Ваш розвиток. Можна обрати одну дисципліну чи традицію й терпляче її вивчати, помічаючи, що вона дає, перш ніж вирішити, що з цим робити.
  growthReversed: >-
    У перевернутому положенні Ієрофант може підштовхувати написати власні настанови. Він може відображати мить, коли Ви переростаєте певне переконання чи стару роль. Можна записати власними словами цінності, яких справді дотримуєтеся сьогодні, і помітити, де вони збігаються з тим, чого Вас учили, а де лагідно розходяться.
reflectionQuestions:
  - "Які цінності Ви успадкували, а які обрали самі?"
  - >-
    Хто навчив Вас чогось важливого і що Ви взяли з того, як саме ця людина вчила?
  - >-
    Яке одне очікування Ви хотіли б уважніше розглянути цього тижня?
imageryNote: >-
  Ієрофант Taro постає вчителем у тихому внутрішньому дворику, що сидить на стертій кам’яній лаві під старим деревом у невеликому колі слухачів різного віку. На поясі вчителя висить важкий ключ — символ розуміння, що передається через навчання та практику. Стоси книжок на лаві й дзвін в арці над головою натякають на спільні ритуали й навчання. Відчинена брама на протилежному боці дворика підказує, що кожне вчення може вести до чогось нового.
