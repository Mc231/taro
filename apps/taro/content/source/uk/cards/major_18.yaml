imageryNote: >-
  Місяць Taro постає блідим місяцем, наполовину схованим за хмарами, що пливуть над стежкою крізь високий очерет на березі. Подекуди стежка мерехтить, а подекуди зникає, тож мандрівник іде повільно. Чапля, що нерухомо стоїть на мілині, може натякати на терплячу увагу, а брижі на воді — на почуття, що піднімаються з глибини. Сріблясте світло, м’які тіні й розмиті краї запрошують глядача довіряти своїм відчуттям у непевній подорожі.
