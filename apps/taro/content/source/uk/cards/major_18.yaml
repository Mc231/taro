shortUpright: >-
  Не все ще ясно, і це нормально. Ця карта запрошує рухатися повільно й довіряти своїм відчуттям.
shortReversed: >-
  Туман, можливо, починає розсіюватися. Що Ви тепер бачите ясніше, ніж раніше?
meaningUpright: |-
  Місяць — це карта проміжного стану: світла, що показує обриси, але не їхні межі. У цьому м’якому сяйві речі можуть здаватися більшими, дивнішими чи чарівнішими, ніж удень. Карта говорить про сни, настрої, уяву й тривожне відчуття, коли не зовсім знаєш, де стоїш.
  У повсякденному житті ця карта може відображати ситуацію, у якій бракує частин, почуття, яке Ви не можете назвати, або тривоги, що вночі здаються більшими, ніж уранці. Вона може вказувати на час, коли сама лише логіка мало допомагає, а підказки можуть дати інтуїція, сни й творча робота. Непевність тут — не застереження, а просто частина шляху, якого Ви ще не бачите повністю.
  Ця карта запрошує Вас поміркувати, що реальне, а що може бути уявним. Можна запитати себе, які з Ваших страхів спираються на факти, а які — на історії, що Ви самі собі розповіли. Місяць підкреслює терпіння до невизначеності. Рухатися повільно, звірятися зі своїми інстинктами й чекати більшого світла, перш ніж ухвалювати великі рішення, може бути мудрим підходом у туманні часи.
meaningReversed: |-
  У перевернутому положенні Місяць може відображати плутанину, що починає розвіюватися. Те, що здавалося каламутним, може ставати чіткішим, або Ви, можливо, готові прямо поглянути на тривогу, якої уникали. Це може принести полегшення, навіть якщо картина не зовсім приємна.
  Ця карта може вказувати й на хитрощі розуму: зручну історію, яку Ви собі розповідаєте, або тривожні думки, що бігають по колу. Помітити ці шаблони — уже крок до ясності.
  Можливо, варто записати, що Ви знаєте напевно, а про що здогадуєтеся. Побачена на папері різниця може зменшити тривогу до її справжнього розміру. Довіра до шляху не вимагає бачити його весь; часом досить побачити наступний крок і дбайливо його зробити.
aspects:
  relationshipsUpright: >-
    У стосунках Місяць може відображати непевність щодо того, де Ви стоїте чи що відчуває інша людина. Він може запрошувати помітити, чи не заповнюєте Ви прогалини припущеннями. Можуть допомогти лагідні прямі питання й терпіння, а також увага до власних емоційних реакцій без поспішних висновків.
  relationshipsReversed: >-
    У перевернутому положенні ця карта може вказувати на непорозуміння, що починають розвіюватися, або на усвідомлення непродуктивної історії, яку Ви розповідали про когось. Варто поміркувати про чесну розмову, щоб перевірити, що насправді правда, і дати місце погляду іншої людини. Ясність часто приходить невеликими частинами, і кожна чесна розмова додає одну.
  workUpright: >-
    У роботі чи проєкті Місяць підкреслює невизначеність: неясні цілі, мінливу інформацію чи творчий процес, що ще не знайшов своєї форми. Він може запрошувати якийсь час потерпіти незнання. Тут може процвітати образний мозковий штурм, а тверді зобов’язання, можливо, краще відкласти до появи більшої ясності.
  workReversed: >-
    У перевернутому положенні Місяць може відображати плутанину, що розвіюється з появою нової інформації, або нагоду розв’язати непорозуміння. Можна записати відкриті питання й пошукати ясних відповідей. Він може вказувати й на те, що Ви ловите себе на думках про найгірший сценарій і обираєте спокійніший погляд. Ясні факти зазвичай полегшують наступне рішення.
  growthUpright: >-
    Під Місяцем варто дослідити сни, уяву й менш раціональні частини свого розуму. Щоденник чи творча гра можуть допомогти до них прислухатися. Можна помічати свої настрої та їхні закономірності, сприймаючи їх як інформацію, а не як накази.
  growthReversed: >-
    У перевернутому положенні Місяць може питати, чи не формувала тривога Ваш погляд більше, ніж факти. Він може відображати зростання здатності бачити крізь тривоги. Можна вправлятися зупинятися, коли з’являється тривожна думка, і питати себе, що помітив би натомість спокійніший друг. З часом ця пауза може стати стійкішою звичкою.
