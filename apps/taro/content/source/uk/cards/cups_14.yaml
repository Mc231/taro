  - >-
    Де Ви могли б запропонувати комусь у своєму житті спокійний, дбайливий провід?
  - >-
    Що допомогло б Вам лишатися стійкими в ситуації, яка зараз Вас хвилює?
imageryNote: >-
  Зображення показує увінчану короною фігуру, що сидить над рухливою водою на платформі зі звітрілого каменю, з чашею в одній руці й коротким жезлом у другій. Вода довкола піднімається й опадає, але плечі фігури лишаються розслабленими, а погляд рівним. Цей контраст натякає на емоційну майстерність, а глибокі сині тони, зігріті дотиками золота, — на мудрість і щедрість.
