meaningUpright: |-
  Король Кубків постає стійкою фігурою серед рухливої води, спокійною, поки течії змінюються. Ця карта уособлює емоційну майстерність в активній формі: здатність глибоко відчувати й водночас відповідати з мудрістю, справедливістю й добротою.
  Вона може відображати мить, коли Вас кличуть вести, посередничати чи підтримувати інших у складній ситуації. Король Кубків не заперечує почуттів. Натомість ця фігура визнає їх і обирає, як діяти, залучаючи до розмови і серце, і розум.
  У повсякденному житті це може виглядати як збереження самовладання на напруженій нараді, вдумлива порада другові чи рішення, що поєднує співчуття з практичністю. Вона може вказувати й на зрілу, щедру турботу, яка захищає, не контролюючи.
  Ця карта запрошує довіритися тому, що Ви здатні зустрічати сильні течії стійко. Можна запитати себе, якою була б спокійна й дбайлива відповідь у ситуації, що Вас хвилює, і яка підтримка допомогла б її дати.
meaningReversed: |-
  У перевернутому положенні Король Кубків може відображати емоції, які тримають надто міцно, чи такі, що вихлюпуються нерівно. Можна помітити, що Ви виглядаєте спокійними, а всередині вирує, або реагуєте сильніше, ніж вимагає ситуація.
  Він може вказувати й на використання емоційного розуміння так, щоб керувати іншими, а не підтримувати їх, або на те, що керують Вами. Помітити це без звинувачень може бути першим кроком до добріших шаблонів.
  Ця карта запрошує знайти стійкість, що включає Ваші почуття, а не придушує їх. Що Ви, можливо, уникаєте відчувати? Можна спробувати називати емоції наодинці, робити паузу перед відповіддю чи обговорювати все з людиною, якій довіряєте. Рівновага може зростати з чесного визнання, а не з ідеального контролю.
aspects:
  relationshipsUpright: >-
    У стосунках Король Кубків може відображати стійку, зрілу турботу й спокійну присутність в емоційні моменти. Він може запрошувати глибоко слухати й відповідати вдумливо, а не швидко. Можна помітити, як Ви допомагаєте іншим почуватися безпечно і якої підтримки хотіли б у відповідь.
  relationshipsReversed: >-
    У перевернутому положенні ця карта може вказувати на емоційну дистанцію, раптові зміни настрою чи тиху боротьбу за контроль у стосунках. Можна запитати, чи діляться почуттями відкрито, чи керують ними за лаштунками. Чесне, спокійне спілкування може допомогти відновити довіру й відчуття рівноваги між Вами.
  workUpright: >-
    У роботі ця карта може відображати дипломатичне лідерство, наставництво чи здатність тримати команду стійкою під тиском. Вона може запрошувати застосовувати емоційний інтелект в ухваленні рішень. Поєднання емпатії з ясними межами може створити робоче місце, де люди почуваються і під опікою, і під проводом.
  workReversed: >-
    У перевернутому положенні карта може відображати стрес, який приховують, доки він не виплесне, чи лідерство, що вибиває людей із рівноваги. Варто поміркувати, як відкрито й справедливо розв’язувати напругу. Прохання про підтримку чи делегування частини завдань можуть не дати тиску накопичуватися під поверхнею.
  growthUpright: >-
    Для особистісного зростання Король Кубків запрошує поєднати почуття й розум. Можна вправлятися помічати емоцію, називати її, а потім обирати відповідь, що пасує до Ваших цінностей. З часом це може збудувати тиху впевненість у здатності зберігати рівновагу, коли все стає бурхливим.
  growthReversed: >-
    У перевернутому положенні ця карта може просити дослідити, як Ви поводитеся з сильними емоціями. Можна помітити шаблони, коли все тримається в собі або все виплескується. Лагідні практики, як-от пауза, щоб подихати, чи запис думок перед розмовою, можуть допомогти знайти середину, де почуття шанують, але вони не беруть гору.
reflectionQuestions:
