shortUpright: >-
  Вам доступна тепла, упевнена енергія; можна дозволити собі займати місце й ділитися своїм світлом з іншими.
shortReversed: >-
  Ваш внутрішній вогонь може мерехтіти чи бути надто розпорошеним; можна поглянути, що виснажує впевненість, а що її оновлює.
meaningUpright: |-
  Королева Жезлів утілює вогонь, що став стійким і променистим. Ця фігура невимушено сидить біля сяйливого вогнища з жезлом, що пускає листя, у руці; вона впевнена, і їй не треба нічого доводити. Енергія тут тепла, притягальна й щедра: це хтось, хто може освітити кімнату й водночас зберегти власний центр.
  Ви можете впізнати цю якість у собі, коли легко висловлюєтеся, приймаєте людей зі щирим теплом чи працюєте над творчим проєктом і з пристрастю, і з практичністю. Вона може описувати й когось у Вашому житті, чия впевненість заохочує інших сяяти.
  Ця карта запрошує визнати свої дари. Упевненість не мусить бути гучною; це може бути спокійне відчуття, що Вам є що запропонувати. Можна помітити, де Ви схильні стискатися, і поекспериментувати, займаючи трохи більше місця. Ділитися теплом, ентузіазмом та ідеями може бути даром і для Вас, і для людей довкола.
meaningReversed: |-
  У перевернутому положенні Королева Жезлів може відображати полум’я, що пригасло. Можливо, Ви сумніваєтеся в собі, втомилися завжди бути тим, хто приносить енергію, або стримуєте свою життєвість, щоб уникнути уваги.
  Іноді перевернута Королева вказує на вогонь, використаний менш щедро: порівняння, заздрість чи потребу контролювати увагу до себе. Це часто виростає з відчуття, що тебе не бачать.
  Можливо, це мить подбати про власний вогонь. Що виснажувало Вашу впевненість і що колись її оновлювало? Можна повернутися до заняття, від якого почуваєтеся живими, провести час із людьми, які Вас цінують, чи відпочити без провини. Упевненість часто повертається поступово, коли Ви знову відчуваєте те, що Вам важливо, а не те, як Ви виглядаєте.
aspects:
  relationshipsUpright: >-
    У стосунках ця карта може відображати тепло, відкритість і сильне відчуття себе в зв’язку. Можна приносити енергію й підбадьорення людям, які Вам дорогі, лишаючись вірними власним потребам. Ця якість може робити стосунки жвавими й чесними, де кожен вільний сяяти.
  relationshipsReversed: >-
    У перевернутому положенні Ви можете почуватися в тіні, сприйнятими як належне чи відчувати спокусу порівнювати себе з іншими. Варто поміркувати, чи не віддавали Ви тепло, не отримуючи його. Висловлювання своїх потреб і вміння цінувати себе, не чекаючи цього від інших, можуть допомогти відновити рівновагу в близькому зв’язку.
  workUpright: >-
    У роботі чи творчих зусиллях Королева Жезлів може вказувати на впевнене лідерство й дар надихати інших. Можна помітно взяти відповідальність за проєкт, переконано ділитися ідеями й створювати атмосферу, у якій колеги відчувають приплив енергії. Ваш ентузіазм може бути практичним ресурсом, а не лише настроєм.
  workReversed: >-
    У перевернутому положенні Ви, можливо, розриваєтеся між забагатьма ролями або сумніваєтеся у своїх здібностях після невдачі. Можна визначити завдання, які справді використовують Ваші сильні сторони, і берегти час для них. Відмова від потреби бути всюди одночасно може допомогти повернути природну впевненість.
  growthUpright: >-
    Ваше тепло впливає на інших, і ця карта просить це визнати. Що змушує Вас почуватися найживішими й найвпевненішими? Можна помітити обставини, у яких Ви почуваєтеся впевнено, і принести трохи цієї енергії туди, де зазвичай стримуєтеся.
  growthReversed: >-
    У перевернутому положенні можна дослідити, де невпевненість у собі чи порівняння займають місце у Ваших думках. Може допомогти помічати власний поступ і якості, не міряючи їх чужими. Відпочинок і гра — обидва способи знову розпалити вогонь, що пригас.
