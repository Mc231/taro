imageryNote: >-
  Фігура невимушено сидить на широкому сидінні серед осяяної сонцем галявини; в одній руці спочиває жезл, що пускає листя, а друга відкрита до глядача. Поруч сяє вогнище, а неподалік лежить пильна тварина-супутник. Вогнище натякає на тепло, яке дарують іншим, відкрита рука — на щедрість, а розслаблена постава — на впевненість, якій не треба себе доводити. Теплі золоті й бурштинові відтінки можуть перегукуватися з вогнем у його найусталенішому й найпроменистішому стані.
