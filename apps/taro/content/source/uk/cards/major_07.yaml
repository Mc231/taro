imageryNote: >-
  Колісниця Taro постає фігурою, що править невеликим міцним возом уздовж прибережної дороги, а тягнуть його дві тварини протилежної вдачі, одна спокійна, друга неспокійна. Візник тримає віжки легко, кермуючи увагою, а не силою. Схожий на мушлю навіс над сидінням може натякати на Рака й захист, що дає змогу безпечно рухатися вперед, а відкрита дорога й далекі вогні гавані говорять про мету, обрану, а не нав’язану.
