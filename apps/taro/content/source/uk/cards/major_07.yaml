shortUpright: >-
  Рух уперед можливий, коли Ви тримаєте різні пориви разом і спрямовуєте їх в один бік.
shortReversed: >-
  Енергія може тягнути одразу в кілька боків. Де Ви могли б лагідно знову взяти віжки?
meaningUpright: |-
  Колісниця — це карта руху вперед із метою. Її традиційний образ показує двох тварин, що тягнуть повіз, часто різного кольору, ніби кожна хоче йти своїм шляхом. Завдання візника — не боротися з ними, а вести їх разом. У цьому й суть карти: перетворити внутрішню напругу на стійкий напрямок.
  У повсякденному житті ця карта може відображати тиждень, коли Ви нарешті беретеся за мету й тримаєтеся її попри відволікання: готуєтеся до змагань, завершуєте велике завдання, переїжджаєте чи робите зміну, про яку давно говорили. Вона може вказувати на дисципліну балансування між різними потребами, як-от амбіціями й відпочинком або захватом і обережністю, щоб жодна не перемогла цілком.
  Ця карта запрошує Вас поміркувати, куди Ви хочете йти і що збиває Вас із курсу. Можна запитати себе, як використати змішані почуття як пальне, а не як гальма. Колісниця підкреслює зосередженість і волю, а також тихий захист, який дає достатнє знання себе, щоб кермувати.
meaningReversed: |-
  У перевернутому положенні Колісниця може відображати рух, що застиг чи розпорошився. Можливо, Ви зайняті, але ніби не рухаєтеся, розриваєтеся між забагатьма цілями або не певні, який напрямок справді Ваш. Віжки є, але вони можуть здаватися ослабленими.
  Ця карта може вказувати й на надмірний натиск: прагнення зрушити справу самим лише зусиллям, не помічаючи ознак, що маршрут треба скоригувати. Сила волі сама по собі може завести далеко, але вона втомлюється, коли поруч немає ясності.
  Можливо, варто зупинитися й назвати сили, що Вас тягнуть. Які з них найважливіші зараз, а які можуть зачекати? Якщо обрати один ясний напрямок на найближчі дні й дозволити собі на певний час відкласти решту, це може допомогти знову відчути стійкість на місці візника.
aspects:
  relationshipsUpright: >-
    У стосунках Колісниця може відображати спільне відчуття напрямку: Ви разом проходите насичений чи складний період, і кожен підтримує цілі іншого. Вона може запрошувати поговорити про те, куди Ви обоє рухаєтеся і як іти в одному темпі. Відданість тут виглядає як стабільні зусилля та взаємне підбадьорення.
  relationshipsReversed: >-
    У перевернутому положенні ця карта може вказувати на двох людей, що тягнуть у різні боки, або на те, що одна людина кермує, а інша почувається пасажиром. Варто поміркувати, чи не підштовхуєте Ви стосунки до мети раніше, ніж обоє готові. Сповільнитися й домовитися про пункт призначення могло б зменшити напругу.
  workUpright: >-
    У роботі чи проєкті Колісниця підкреслює рушійну силу та зосереджені зусилля. Вона може відображати етап, коли Ви доводите проєкт до фінішу, здорово змагаєтеся чи тримаєте команду в спільному русі. Можна визначити ясну мету, зібрати ресурси й дати собі реалістичні терміни, обрані Вами самими.
  workReversed: >-
    У перевернутому положенні Колісниця може відображати проєкт, що втрачає оберти, або відчуття поспіху без ясного плану. Вона може вказувати й на суперечливі пріоритети від різних людей. Можна відступити на крок, уточнити, як насправді виглядає успіх, і вирішити, які завдання наближають до нього, а які лише створюють зайнятість.
  growthUpright: >-
    Для особистісного зростання ця карта запрошує практикувати самоспрямування. Знати, чого хочете, і тримати разом різні настрої та мотиви — це навичка. Можна обрати одну вагому мету й помічати, як Ви тримаєте себе на курсі, відзначаючи кожен невеликий відтинок пройденого шляху.
  growthReversed: >-
    У перевернутому положенні Колісниця може питати, чи не женете Ви себе надто сильно або чи не дозволяєте іншим визначати Ваш курс. Це може бути запрошення знову відчути власні причини йти туди, куди Ви йдете. Можна щоранку звірятися із собою й питати, який напрямок сьогодні справді Ваш.
