imageryNote: >-
  Зображення може показувати увінчану фігуру на троні, прикрашеному різьбленими биками, серед виноградних лоз і обнесеного муром саду, з монетою, що легко лежить в одній руці. Бик може символізувати витривалість і земну силу, лози — зрілість і достаток, а мури — захищені, доглянуті володіння. Розслаблена постава натякає на авторитет, що спирається на досвід, а глибокі зелені й золоті тони можуть відображати тривале, терпляче забезпечення.
