shortUpright: >-
  Вам доступна стійка, вправна присутність. Помітьте, як Ви могли б використати досвід і ресурси, щоб створити стабільність для себе й інших.
shortReversed: >-
  Безпека, можливо, стала важким тягарем. Можна запитати себе, що означає для Вас успіх поза контролем і зовнішнім виглядом.
meaningUpright: |-
  Король Пентаклів сидить серед лоз і міцних мурів, розслаблений і впевнений, а на коліні в нього лежить монета. Цей король уособлює повну зрілість масті землі: практичну майстерність, терпіння й здатність збудувати щось стабільне, на що можуть покластися інші. Авторитет тут походить від досвіду, а не від сили.
  Ви можете впізнати цю енергію в людині, що спокійно керує домом чи командою, вдумливо ухвалює рішення щодо часу й ресурсів чи використовує збудоване, щоб підтримувати людей довкола. Вона може відображати й Вашу зростаючу впевненість у тому, що Ви добре справляєтеся з практичними обов’язками.
  Ця карта запрошує поміркувати про свої стосунки зі стабільністю й забезпеченням. Що Ви збудували стабільними зусиллями і як цим користуєтеся? Можна помітити, де Ви могли б бути щедрими своїм часом, знаннями чи підтримкою, а де добре господарювання означає берегти те, що маєте. Безпекою можна ділитися, а не лише її стерегти.
meaningReversed: |-
  У перевернутому положенні Король Пентаклів може відображати стосунки з безпекою, що стали жорсткими чи важкими. Контроль може затягуватися, так що плани не лишають місця для думок інших, або успіх може вимірюватися переважно зовнішнім виглядом і майном. Він може вказувати й на тиск відчуття відповідальності за стабільність усіх.
  Це прочитання про якість, якої забагато. Бути надійними й вправними цінно; це стає тягарем, коли не лишає місця для відпочинку, гнучкості чи вибору інших людей.
  Можна запитати себе, що насправді означає для Вас успіх поза тим, як усе виглядає. Де Ви могли б розділити відповідальність чи послабити стандарт? Повернення до цінностей за Вашими зусиллями, як-от турботи, безпеки й відчуття внеску, може знову зробити стабільність підтримувальною, а не обмежувальною.
aspects:
  relationshipsUpright: >-
    У стосунках ця карта може відображати надійну, щедру турботу: людину, що забезпечує стабільність, дотримується зобов’язань і дає іншим відчуття безпеки. Можливо, саме Ви є такою опорою для когось, або цінуєте це в ньому. Спільні рішення й вияв тепла поруч із надійністю можуть зробити цю безпеку взаємною.
  relationshipsReversed: >-
    У перевернутому положенні карта може натякати на контроль, що лишає іншим мало місця, чи на наголос на практичному забезпеченні, що затьмарює емоційний зв’язок. Можна запитати себе, як хтось близький відчуває Вашу підтримку і чи не хотів би він більше голосу чи ніжності в зв’язку.
  workUpright: >-
    У роботі Король Пентаклів може описувати практичне лідерство й надійність. Вам можуть довіряти керувати ресурсами, вести інших чи ухвалювати виважені рішення. Можна поміркувати, як щедро використовувати свій досвід, наставляючи інших і будуючи структури, що підтримують і людей, і результати.
  workReversed: >-
    Тут карта може відображати негнучкість, мікроменеджмент чи цінування статусу понад змістовну роботу. Вона може вказувати й на надмірну відповідальність, яку Ви несете самі. Можна поглянути, де делегування, більше слухання чи нове визначення успіху могли б створити здоровіший і посильніший спосіб роботи.
  growthUpright: >-
    Для особистісного зростання ця карта запрошує визнати зрілість і компетентність, які Ви розвинули. Можна поміркувати, що означає для Вас стабільність і як Ви її створили. Визнання власної здатності забезпечувати себе та інших може поглибити довіру до себе.
  growthReversed: >-
    У перевернутому положенні карта може відображати сильну прив’язаність до контролю чи до зовнішніх ознак досягнень. Можна дослідити, чого Ви боїтеся, якщо послабите хватку. Пошук безпеки у своїх цінностях і стосунках, а не лише в тому, чим володієте чи керуєте, може принести більше легкості.
