shortUpright: >-
  Мужність не завжди гарчить. Іноді вона виглядає як терпіння, доброта й готовність лишатися з чимось важким.
shortReversed: >-
  Ваша внутрішня стійкість зараз може здаватися тонкою. Лагідність до себе може стати міцним початком.
meaningUpright: |-
  Сила — це карта мужності, але не гучної. Її традиційний образ показує фігуру, що спокійно кладе руку на лева, не долаючи його, а заспокоюючи. Сила тут походить від терпіння, тепла й стійкої присутності, яка може зустріти дику енергію, чужу чи власну, без паніки.
  У повсякденному житті ця карта може відображати спокій у напруженій розмові, дотримання обіцянки, коли вона стала незручною, або вміння побути із сильним почуттям достатньо довго, щоб його зрозуміти, а не діяти під його впливом одразу. Вона може вказувати на тиху впевненість людини, якій не треба нічого доводити. Приборкати лева — це не стільки придушити його, скільки з ним заприятелювати.
  Ця карта запрошує Вас поміркувати, як Ви реагуєте на тиск. Можна запитати себе, де співчуття, зокрема до себе, могло б подіяти краще за силу. Сила натякає, що м’якість і твердість можуть жити разом і що найтриваліша мужність часто буває стійкою, доброю й наполегливою.
meaningReversed: |-
  У перевернутому положенні Сила може відображати час, коли звичну стійкість знайти складніше. Терпіння може швидко закінчуватися, або Ви можете чути внутрішній голос, різкіший і критичніший, ніж зазвичай. Лев неспокійний, і Ви теж.
  Ця карта може вказувати й на мужність, звернену всередину й ще не виявлену: можливо, Ви сильніші, ніж почуваєтеся, але сумніви в собі ускладнили змогу це показати. Або вона може відображати спробу втримати все самою лише силою волі, яка зазвичай виснажується.
  Можливо, варто помітити, як Ви говорите із собою, коли важко. Що змінилося б, якби Ви обрали тон, яким заспокоювали б наляканого друга? Відновлення мужності часто починається з невеликих виявів доброти до себе і з прохання про підтримку, коли ноша важка.
aspects:
  relationshipsUpright: >-
    У стосунках Сила може відображати терпіння й тепло, завдяки яким людям із Вами безпечно. Вона може запрошувати зустрічати чийсь важкий настрій спокоєм, не підхоплюючи його напруги, і водночас тримати власні межі. Лагідна твердість із часом може будувати довіру.
  relationshipsReversed: >-
    У перевернутому положенні ця карта може вказувати на запальність або на те, що хтось ковтає свої почуття, щоб уникнути конфлікту. Варто поміркувати, чи не надто Ви суворі до себе чи до когось близького. Якщо м’яко заговорити, перш ніж накопичиться роздратування, це може вберегти і зв’язок, і Ваше власне відчуття стійкості.
  workUpright: >-
    У роботі чи проєкті Сила підкреслює наполегливість і емоційну зрілість. Вона може відображати вміння впоратися з вимогливим завданням чи людиною з терпінням і гідністю або вести за собою підбадьоренням, а не тиском. Можна довіритися тому, що стабільні, послідовні зусилля важать, навіть коли ніхто не бачить.
  workReversed: >-
    У перевернутому положенні Сила може відображати виснаження від тиску або сумнів, що Ви впораєтеся з викликом. Вона може вказувати й на різкі реакції під стресом. Можна запитати себе, яка підтримка чи відпочинок допомогли б знову відчути ґрунт під ногами і як задати темп, якого можна дотримуватися.
  growthUpright: >-
    Сила пропонує заприятелювати з власним внутрішнім левом, а не замикати його в клітці: із сильними почуттями, бажаннями й інстинктами, що роблять Вас Вами. Замість боротися з ними, можна зацікавитися, чого вони потребують. Співчуття до себе тут не слабкість, а практика, що робить мужність стійкішою.
  growthReversed: >-
    У перевернутому положенні Сила може нагадувати, що впевненість може зникати й повертатися. Вона може відображати період сумнівів у собі чи суворої внутрішньої критики. Можна вести короткий список моментів, коли Ви добре впоралися, і перечитувати його у важкі дні як свідчення стійкості, яка у Вас уже є.
reflectionQuestions:
