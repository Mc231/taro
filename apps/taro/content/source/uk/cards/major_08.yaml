imageryNote: >-
  Сила Taro постає спокійною фігурою, що стоїть на колінах на осяяному сонцем лузі поруч із великим левом; одна рука лежить на його гриві, а звір, розслаблений і довірливий, тулиться ближче. Немає ні мотузок, ні ланцюгів; зв’язок показано через близькість і легкість. Польові квіти, що ростуть довкола обох, натякають, що терпіння дає розквітнути лагіднішим речам. Тепле золоте світло зберігає мирний настрій, показуючи силу й лагідність пліч-о-пліч.
