imageryNote: >-
  У центрі зображення — одна посудина, що переливається через край, і її вода кількома тонкими цівками падає в тихе плесо внизу. Латаття чи листя лотоса на поверхні може уособлювати почуття, що розкриваються повільно й вкорінюються в глибоких місцях. М’яке світло над чашею може натякати на сприйнятливість, на дар, який простягають, а не хапають. Загальний настрій — спокійний достаток: більше ніж досить, і воно лагідно переливається назовні.
