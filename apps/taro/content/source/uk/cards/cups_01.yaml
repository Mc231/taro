meaningUpright: |-
  Туз Кубків — перший порух масті води: одна посудина, така повна, що переливається через край. Він може відображати почуття, що приходить раніше, ніж Ви знайдете для нього слова, як-от ніжність, благоговіння, полегшення чи раптове тепло до когось або чогось. Поки що з ним нічого не треба робити. Карта просто просить помітити, що воно є.
  У повсякденному житті це може виглядати як перший за кілька тижнів щирий сміх, зворушення від музики чи відкриття, що стара образа пом’якшилася без жодних Ваших зусиль. Він може вказувати й на новий творчий імпульс чи бажання бути добрішими до себе.
  Ця карта запрошує лишатися відкритими, а не одразу керувати почуттям. Можна запитати себе, куди хоче спрямуватися Ваша турбота і чи дозволяєте Ви частині її досягати й Вас. Відкрите серце нічого не обіцяє; це спосіб зустрічати день, маючи всередині трохи більше простору.
meaningReversed: |-
  У перевернутому положенні Туз Кубків може натякати, що почуття є, але його тримають при собі, як воду в закритому глечику. Можливо, Ви були зайняті турботою про інших, або якийсь час було безпечніше тримати емоції на відстані. У цьому немає нічого поганого; берегти серце може бути розумною відповіддю на вимогливий період.
  Ця карта може відображати й відчуття, що Ви працюєте на порожньому баку. Можна помітити, що дрібні радощі не відгукуються або що Ви віддаєте з чаші, яку давно не наповнювали.
  Запрошення тут лагідне. Замість змушувати себе відчувати більше, можна поглянути, що тихо Вас відновлює: сон, прогулянка біля води, неквапна розмова чи година, коли Ви нікому не потрібні. Коли щось таки наповнює чашу, дозвольте собі це помітити. Відкритість може повернутися у своєму темпі.
aspects:
  relationshipsUpright: >-
    У близьких стосунках Туз Кубків може відображати свіжу хвилю тепла з партнером, другом, родиною чи кимось новим. Він може запрошувати виявляти прихильність просто й без розрахунку: повідомлення, надіслане, бо Ви про людину подумали, щира подяка, мить повної уваги. Можна помітити й те, як це — приймати турботу, а не лише давати.
  relationshipsReversed: >-
    У перевернутому положенні ця карта може вказувати на стриману прихильність, можливо, через минулі рани чи просту втому. Можна помітити, що Ви ввічливо слухаєте, лишаючись трохи осторонь. Тиснути не треба. Подумайте, чи не міг би один невеликий безпечний вияв відкритості, як-от сказати, що Ви цінуєте, дати трохи більше тепла рухатися між Вами й кимось близьким.
  workUpright: >-
    У роботі чи будь-якому проєкті, що Вам небайдужий, ця карта може відображати відновлений ентузіазм чи нову ідею, яка справді Вас зворушує. Вона може запрошувати вкладати почуття в те, що Ви робите: турботу про людей, яким служите, насолоду ремеслом, цікавість до того, що може вирости. Можна занотувати, що Вас захоплює зараз, поки практичні міркування ще не почали надавати цьому форми.
  workReversed: >-
    У перевернутому положенні карта може відображати роботу, що стала механічною, коли Ви виконуєте рухи, а інтерес чекає деінде. Це звично після довгих зусиль. Можна запитати себе, що спершу привабило Вас на цей шлях або яка невелика його частина досі здається живою, і подивитися, чи не поверне частину потоку більше місця для неї.
  growthUpright: >-
    Для особистісного зростання Туз Кубків запрошує до емоційної чесності із собою. Можна вправлятися називати почуття, щойно вони з’являються, не поділяючи їх на добрі й погані. Щоденник, час біля води чи просто пауза перед відповіддю можуть дати для цього місце. Мета — не постійне щастя, а добріші, відкритіші стосунки зі своїм внутрішнім життям.
  growthReversed: >-
    У перевернутому положенні ця карта може пропонувати спрямувати турботу всередину, перш ніж давати більше назовні. Якщо запаси здаються вичерпаними, можна сприймати відпочинок і дрібні радощі як необхідність, а не як опцію. Може допомогти помічати, що Вас виснажує, а що наповнює. Якщо важкі почуття не минають, розмова з людиною, якій довіряєте, теж може бути корисним кроком.
