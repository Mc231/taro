shortUpright: >-
  Мить помітити, де Ви вже почуваєтеся вдома і хто допомагає Вам відчувати причетність.
shortReversed: >-
  Гармонія може здаватися напруженою чи недосяжною; подумайте, що означала б для Вас причетність поза будь-якою ідеальною картинкою.
meaningUpright: |-
  Десятка Кубків завершує масть води образом спільного щастя: люди разом у місці, що відчувається домом, а довкола них зібрано всі десять чаш. Вона говорить про причетність, емоційну наповненість і легкість перебування серед людей, які приймають Вас такими, як Ви є.
  Дім у цій карті — не лише місце чи традиційна родина. Це може бути обрана родина, близьке коло друзів, спільнота чи навіть мить спокою всередині себе. Важливе відчуття, що Вам раді такими, як Ви є.
  У повсякденному житті це може виглядати як спокійний вечір із рідними, відчуття гармонії після складного періоду чи просто вдячність за дрібні ритуали, що поєднують людей. Карта запрошує помітити, де Ви вже почуваєтеся вдома, і плекати ці зв’язки. Вона може запитати й про те, що Ви вносите в це відчуття причетності і як могли б поділитися ним трохи ширше.
meaningReversed: |-
  У перевернутому положенні Десятка Кубків може відображати гармонію, що здається напруженою, чи розрив між образом щасливого дому й тим, як усе насправді відчувається. Можливо, Ви відчуваєте відчуженість у родині чи групі або тиск підтримувати ідеал, що не відповідає реальності.
  Вона може вказувати й усередину: на тугу за причетністю, яку важко назвати, чи відчуття, що Ви ще не знайшли свого місця.
  Ця карта запрошує дивитися на причетність чесно й зі співчуттям. Як насправді виглядало б для Вас відчуття дому поза очікуваннями? Можна почати з невеликих дій, що будують близькість, як-от спільна трапеза чи слухання без відволікань. Причетність часто зростає повільно, через звичайні моменти турботи, і може набувати дуже різних форм.
aspects:
  relationshipsUpright: >-
    У стосунках ця карта може відображати взаємну турботу, відданість і спільне відчуття дому з партнером, родиною, друзями чи обраним колом. Вона може запрошувати цінувати щоденні ритуали, що підтримують ці зв’язки. Можна висловити вдячність людям, завдяки яким Ви відчуваєте причетність, словами чи невеликими вчинками.
  relationshipsReversed: >-
    У перевернутому положенні Десятка Кубків може вказувати на напругу чи дистанцію в близькому колі або на порівняння своїх стосунків з ідеалізованою картинкою. Можна запитати, чого справді потребує кожен, щоб почуватися разом удома. Відкриті, лагідні розмови можуть допомогти відновити близькість у реалістичному темпі.
  workUpright: >-
    У роботі ця карта може відображати команду, що підтримує, відчуття спільної мети чи робоче місце, де люди щиро дбають одне про одного. Вона може запрошувати долучитися до такої культури. Можна помітити, як відчуття, що Вас цінують, впливає на Вашу роботу і як Ви могли б допомогти іншим відчувати те саме.
  workReversed: >-
    У перевернутому положенні карта може відображати робоче місце, що говорить про себе як про родину, але не завжди так діє, або розмиту межу між особистим життям і роботою. Варто поміркувати, які межі вберегли б Ваш час удома. Пошук причетності в кількох місцях може зменшити тиск на кожне з них.
  growthUpright: >-
    Для особистісного зростання Десятка Кубків запрошує плекати відчуття дому всередині себе. Можна помітити, що допомагає Вам почуватися врівноважено й цілісно: певні місця, практики чи люди. Якщо вбудувати їх у свій розпорядок, це може дати стійку основу для зв’язку з іншими.
  growthReversed: >-
    У перевернутому положенні ця карта може просити розглянути переконання про те, яким має бути щасливе життя. Можливо, Ви виявите, що деякі очікування походять від інших, а не від Вас. Відпустивши ідеалізований образ, можна звільнити місце для автентичнішого й посильнішого відчуття наповненості.
reflectionQuestions:
