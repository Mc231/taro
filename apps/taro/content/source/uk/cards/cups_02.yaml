shortUpright: >-
  Мить помітити, де турбота тече в обидва боки і що робить зв’язок рівним і живим.
shortReversed: >-
  Щось між Вами й іншою людиною може здаватися незбалансованим; подумайте, чого насправді просить кожен.
meaningUpright: |-
  Двійка Кубків показує двох людей чи дві частини життя, що зустрічаються як рівні й щось пропонують одне одному. Це карта впізнавання: полегшення від того, що тебе розуміють, і радість від того, що розумієш когось у відповідь. Зв’язок, який вона описує, може бути романтичним, але так само це може бути дружба, творча співпраця, зв’язок між братами чи сестрами або робоче партнерство.
  Ви можете впізнати цю енергію в розмові, де обоє слухають, у примиренні після непорозуміння чи в тихій згоді двох людей, які вирішують і далі бути поруч одне з одним. Вона може відображати й поєднання двох сторін Вас самих, що тягнули в різні боки.
  Ця карта запрошує помітити, де у Вашому житті є справжнє «даю й отримую», і вшанувати це. Взаємність не означає вести рахунок. Вона означає, що обоє почуваються вільними пропонувати, приймати й казати, чого потребують.
meaningReversed: |-
  У перевернутому положенні Двійка Кубків може вказувати на зв’язок, що втратив рівновагу. Одна людина може давати більше чи слухати менше, або двоє просто говорять повз одне одного. Це не обов’язково означає, що щось зламано; багато зв’язків проходять такі періоди.
  Карта може звертатися й усередину, питаючи, наскільки добре Ви є партнером самим собі. Чи такі ж Ви терплячі й справедливі до власних потреб, як намагаєтеся бути до чужих?
  Можна поглянути на стосунки, що здаються нерівними, і запитати, на що насправді сподівається кожен під поверхневою незгодою. Спокійна чесна розмова чи трохи дистанції, щоб побачити ясніше, можуть бути кориснішими за спробу виправити все одразу. Рівновагу люди будують разом, обмін за обміном.
aspects:
  relationshipsUpright: >-
    У стосунках ця карта може відображати взаємне притягання, дружбу чи партнерство, у якому обоє почуваються баченими. Вона може запрошувати помітити дрібні ритуали, що тримають зв’язок стійким: поцікавитися, як справи, пам’ятати, що важливо для іншої людини, просто перепросити. Можна запитати себе, що Ви найбільше цінуєте в комусь близькому і чи знає він про це.
  relationshipsReversed: >-
    У перевернутому положенні ця карта може відображати зв’язок, де одна людина несе більше емоційної ваги, або де непорозуміння так і не прояснилося. Варто поміркувати, що Ви сказали б, якби знали, що Вас вислухають лагідно. Відновлення часто починається з одного чесного речення й готовності почути відповідь, не захищаючись одразу.
  workUpright: >-
    У роботі Двійка Кубків може вказувати на перспективну співпрацю, колегу, якому довіряєте, чи стосунки з клієнтом, збудовані на повазі. Вона може запрошувати ділитися заслугами, просити думок і робити домовленості настільки ясними, щоб обидві сторони почувалися впевнено. Добрі партнерства часто виростають більше зі спільних цінностей, ніж зі спільних навичок.
  workReversed: >-
    У перевернутому положенні карта може відображати робочі стосунки, де очікування невисловлені чи нерівні. Можливо, хтось вважає, що згода є, хоча її немає. Можна простими словами назвати, чого кожен очікує, і перевірити, чи досі пасують Ваші ролі. Ясність може бути добротою, навіть коли розмова спершу здається незграбною.
  growthUpright: >-
    Тема зростання тут — внутрішнє партнерство, нагода примирити частини себе: те, чого хочете, і те, що цінуєте, або практичну й ніжну сторони. Можна написати короткий діалог між двома голосами всередині й подивитися, де вони вже згодні. Інтеграція може відчуватися як знайдений партнер усередині.
  growthReversed: >-
    У перевернутому положенні ця карта може питати, чи не покладаєтеся Ви на інших у відчутті рівноваги, яке могли б будувати й усередині. Можна помітити, де Ви шукаєте схвалення, перш ніж довіритися власному погляду. Ставитися до себе з тією самою справедливістю, яку пропонуєте близькому другові, може бути стабілізувальною практикою, крок за кроком.
reflectionQuestions:
  - "Що дає Вам відчуття, що інша людина справді Вас зустріла?"
  - >-
    Де зв’язок у Вашому житті здається нерівним і що могло б частково відновити рівновагу?
  - >-
    Як Ви могли б виявити вдячність людині, яка постійно поруч із Вами?
imageryNote: >-
  Зображення поєднує дві фігури чи дві руки, що піднімають чаші одна до одної через невеликий простір. Між ними спільна емблема, як-от переплетені стебла чи дві рибини, може натякати, що зустріч створює те, чого жоден не має наодинці. Віддзеркалені кольори з кожного боку можуть виражати рівність, а м’яке сяйво там, де чаші майже торкаються, — те, що сам зв’язок випромінює світло.
