shortUpright: >-
  Приходить ясна думка; можна помітити, що стає простим, щойно Ви назвете це прямо.
shortReversed: >-
  Ясність, можливо, близько, але ще не зовсім досяжна; є час дати туману осісти, перш ніж вирішувати.
meaningUpright: |-
  Туз Мечів — це мить, коли думка набуває чіткості. Після періоду шуму чи плутанини одна ідея виділяється чисто, як єдина лінія на порожній сторінці. Ця карта запрошує поміркувати, що Ви тепер бачите ясніше, ніж раніше, і що ця ясність робить можливим.
  У щоденному житті це може виглядати як нарешті знайдені слова для почуття, довкола якого Ви ходили тижнями, або усвідомлення, що проблема, яка здавалася складною, має один чесний центр. Це може бути початок нового плану, питання, яке Ви готові поставити вголос, чи рішення, яке тепер можна сформулювати без застережень. Іноді це просто полегшення від розуміння.
  Ясне мислення — це інструмент, і, як будь-який інструмент, він працює добре, коли з ним поводяться дбайливо. Можна запитати себе, як використати цю нову ясність так, щоб шанувати і правду, і людей, яких вона торкається. Як виглядало б сказати просту річ лагідно й дозволити одній ясній ідеї спрямувати Ваш наступний невеликий крок?
meaningReversed: |-
  У перевернутому положенні Туз Мечів може відображати ясність, що заблокована чи затримується. Ідея може бути, але вона постійно вислизає або приходить заплутаною в забагато інших думок. Можна помітити, що Ви знову й знову репетируєте в голові ту саму суперечку чи багато разів переписуєте повідомлення, так і не надсилаючи його.
  Інше прочитання — різкість, що втратила турботу: правда, сказана так прямо, що її важко почути, чи певність, яка закриває інші погляди. Ясність може ставати крихкою, коли нею користуються, щоб перемогти, а не щоб зрозуміти.
  Ця карта запрошує дати своєму мисленню трохи простору. Записування, прогулянка чи розмова з людиною, якій довіряєте, можуть дати туману розсіятися самому. Можливо, сьогодні Вам не потрібна вся відповідь. Що одне невелике Ви вже знаєте і чи могли б почати з цього?
aspects:
  relationshipsUpright: >-
    У стосунках Туз Мечів може вказувати на розмову, що очищає атмосферу. Можливо, Ви нарешті зможете назвати, чого потребуєте, або почути те, що хтось близький намагався сказати. Чесність, запропонована з теплом, може зробити зв’язок легшим. Можна обирати слова ясні, але не ранячі, щоб правда стала мостом, а не стіною.
  relationshipsReversed: >-
    У перевернутому положенні ця карта може відображати невисловлені слова чи слова, сказані надто різко. Можливо, непорозуміння зросло, бо кожен здогадується про значення слів іншого. Варто поміркувати, чи не сповільнитися перед складною розмовою: що Ви насправді хочете, щоб інша людина зрозуміла, і що допомогло б їй це почути? Лагідне питання може відкрити більше, ніж гостра відповідь.
  workUpright: >-
    У роботі чи проєкті Туз Мечів може позначати прорив у розумінні: формулювання проблеми, що нарешті має сенс, чистий план чи нову ідею, яку варто перевірити. Це може бути слушна мить записати ідею, поки вона свіжа, і поділитися нею з людиною, яка допоможе її відточити. Ясність щодо мети часто полегшує бачення наступних кроків.
  workReversed: >-
    У перевернутому положенні ця карта може натякати на проєкт, що здається туманним: неясні цілі, суперечливі сигнали чи забагато ідей, що змагаються одночасно. Сильніший натиск може допомогти менше, ніж крок назад. Можна спробувати назвати одне питання, що найважливіше зараз, або попросити ясності в залучених людей, а не здогадуватися. Іноді найясніший хід — визнати, що досі невідоме.
  growthUpright: >-
    Для особистісного зростання Туз Мечів запрошує помічати історії, які Ви собі розповідаєте, і звіряти їх із тим, що Ви справді знаєте. Свіжий погляд може послабити давнє припущення. Можна спробувати щоденник як спосіб ловити думки простими словами, щоб дивитися на них, а не крізь них. Цікавість до власного розуму може бути тихим різновидом мужності.
  growthReversed: >-
    У перевернутому положенні ця карта може відображати розум, що зайнятий, але не рухається вперед, крутячись у тих самих тривогах чи планах. Можна помітити, коли мислення перетворилося на надмірні роздуми. Відпочинок, рух чи зміна обстановки можуть дати думкам простір улягтися. Цілком нормально тримати питання відкритим трохи довше, поки ясність збирається у власному темпі.
reflectionQuestions:
  - >-
    Що Ви розумієте тепер, але не могли висловити словами місяць тому?
  - "Де ясне, добре речення могло б зробити стосунки легшими?"
  - "Яку одну ідею Ви хочете записати, поки вона не згасла?"
imageryNote: >-
  Оригінальне зображення зосереджене на єдиному вертикальному клинку, що здіймається крізь хмари, які розходяться, а його лезо ловить перше світло. Біля вістря висить тонкий обруч, натякаючи, що ясна ідея може стати провідним принципом. Довкола відкрите небо й рухоме повітря — стихія думки й дихання. Настрій чіткий і бадьорий, як холодне ранкове повітря, і вказує на мить, коли розпорошений розум знаходить одну чисту лінію, за якою можна йти.
