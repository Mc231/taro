shortUpright: >-
  Багато голосів і енергій стикаються; тертя може загострювати ідеї так само, як і виснажувати Вас.
shortReversed: >-
  Сутичка може стихати або йти в підпілля; можна помітити, які розбіжності ще потребують чесного вислуховування.
meaningUpright: |-
  П’ятірка Жезлів показує зіткнення енергій. Кілька жезлів перехрещуються й б’ються один об одного, і важко сказати, чи це справжня бійка, гра чи тренування. Ця двозначність — серце карти: те саме тертя може виснажувати чи надихати залежно від того, як із ним поводитися.
  Ви можете впізнати її в нараді, де всі говорять одночасно, у спільному житлі, де сперечаються через хатні обов’язки, у груповому проєкті з забагатьма напрямками чи просто в голові, повній суперечливих пріоритетів. У цій суміші можуть бути амбіції, гордість і добрі ідеї, і всі тягнуть у різні боки.
  Ця карта запрошує поглянути, у якому конфлікті Ви перебуваєте. Чи допомагає він кожній ідеї ставати сильнішою, чи перетворився на заробляння очок? Можна спробувати сповільнити обмін, назвати спільну мету чи домовитися про прості правила, щоб енергія незгоди стала корисною, а не виснажливою. Іноді, якщо на мить відступити, видно, у чому насправді полягає розбіжність.
meaningReversed: |-
  У перевернутому положенні П’ятірка Жезлів може вказувати на зміну в тому, як поводяться з конфліктом. Напруга може спадати, бо люди знаходять спільне, а може просто ховатися з очей, коли розбіжності лишають невисловленими заради миру.
  Вона може звертатися й усередину, як перетягування каната між різними частинами Вас: тією, що хоче відпочити, і тією, що хоче тиснути, або між двома планами, за якими неможливо йти водночас.
  Можливо, це мить помітити, чи спокій справжній, чи лише на поверхні. Уникання кожної суперечки може залишити важливі потреби непочутими, а чесна розмова може очистити атмосферу. Можна запитати себе, яка розбіжність, усередині чи довкола Вас, виграла б від терплячого, чесного погляду і що зробило б таку розмову безпечною.
aspects:
  relationshipsUpright: >-
    У близьких стосунках ця карта може відображати дрібні суперечки, грайливе суперництво чи повторювані невеликі незгоди. Не кожне тертя — ознака проблеми; воно може показувати, що обоє небайдужі й мають сильні погляди. Можна помітити, чи слухаєте Ви, щоб зрозуміти, чи чекаєте, щоб відповісти, і спробувати назвати, чого хочете обоє, перш ніж сперечатися, як цього досягти.
  relationshipsReversed: >-
    У перевернутому положенні незгода може остигати, а може й затихнути, так і не розв’язавшись. Варто поміркувати, чи мовчання дає обом простір, чи просто дозволяє уникати важливої теми. Спокійна мить може стати слушним часом лагідно до неї повернутися, з цікавістю до погляду іншої людини.
  workUpright: >-
    У роботі чи команді П’ятірка Жезлів може вказувати на конкуренцію, хаос мозкового штурму чи неясні ролі. Енергії багато, але вона може бути розпорошеною. Можна допомогти спрямувати її: уточнити мету, по черзі ділитися ідеями чи запропонувати простий спосіб ухвалити рішення. Здорова дискусія може привести до сильнішого плану, коли кожен почувається почутим.
  workReversed: >-
    У перевернутому положенні робочий конфлікт може переходити в співпрацю, а може тліти під ввічливою поверхнею. Можна пошукати невисловлені розбіжності, що гальмують справу. Запрошення до чесних думок чи пошук спільного в одному невеликому рішенні можуть допомогти знову перетворити тиху напругу на робочу енергію.
  growthUpright: >-
    Виклики можна сприймати як тренування, а не як доказ чогось. Тертя може показати, де Ваші погляди тверді, де гнучкі, а де Ви відчуваєте потребу щось довести. Можна помітити, що вмикає Вашу змагальну сторону і що вона намагається захистити.
  growthReversed: >-
    У перевернутому положенні боротьба може бути внутрішньою: суперечливі бажання, цінності чи плани, що не дають обрати один курс. Можна дослідити кожну сторону на папері, давши їй чесний голос. Коли бачиш їх розкладеними, легше знайти шлях, що шанує більше ніж одну Вашу потребу.
