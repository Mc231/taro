imageryNote: >-
  П’ять фігур, кожна з жезлом, стоять тісно одна біля одної, піднявши жезли під перехресними кутами. Сцена жвава й трохи хаотична, але ніхто не виглядає скривдженим, тож лишається відкритим, чи це справжнє змагання, чи тренувальна гра. Сплетіння жезлів може символізувати ідеї та амбіції, що тиснуть одна на одну, а відкритий простір довкола натякає, що є місце відступити й знайти спільний ритм.
