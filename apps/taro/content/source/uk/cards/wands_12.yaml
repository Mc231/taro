shortUpright: >-
  Смілива, жадібна до пригод енергія готова рушати; можна йти за пристрастю, не зводячи очей із дороги.
shortReversed: >-
  Енергія може випереджати напрямок; можливо, час стримати натиск і обрати, куди цілитися.
meaningUpright: |-
  Лицар Жезлів — це вогонь у русі. Верхи на жвавому коні, із піднятим жезлом, ця фігура мчить уперед із пристрастю, упевненістю й смаком до пригод. Якщо Паж дивується, то Лицар діє.
  Ця енергія може з’являтися як раптове рішення вирушити в подорож, приплив мотивації нарешті почати той проєкт чи готовність до ризику, який колись здався б надто сміливим. Вона може принести чарівність, мужність і заразний ентузіазм, що захоплює за собою інших.
  Ця карта запрошує довіритися своїй рушійній силі й дозволити їй вивести Вас на нову територію. Розгін цінний, і часом єдиний спосіб дізнатися, куди веде шлях, — вирушити ним. Водночас коню, що мчить, потрібен вершник, який приблизно знає, куди їде. Можна спрямувати цю енергію в одну ясну пригоду й зберігати досить уважності, щоб скоригувати курс, якщо ґрунт під ногами зміниться.
meaningReversed: |-
  У перевернутому положенні Лицар Жезлів може відображати енергію, що випереджає свій напрямок. Можливо, Ви починаєте справи поспіхом і втрачаєте інтерес на півдорозі, дієте імпульсивно, а потім маєте справу з наслідками, або Вас дратує, що Вашій рушійній силі нема куди податися.
  Він може вказувати й на стриману пристрасть, коли неспокій наростає, бо обставини змушують чекати.
  Можливо, це мить запитати, куди хоче Ваш вогонь і що допомогло б йому туди дістатися, не вигоривши. Можна зупинитися перед великим рішенням, завершити одне, перш ніж братися за інше, або знайти здоровий вихід для неспокійної енергії, як-от рух, творче завдання чи чесну розмову про те, що здається заблокованим.
aspects:
  relationshipsUpright: >-
    У стосунках ця карта може відображати захват, притягання й дух пригод: спонтанні плани, насичені розмови, бажання робити щось разом. Можна насолоджуватися цією енергією, водночас перевіряючи, чи темп пасує всім. Спільні пригоди зазвичай багатші, коли обоє мають голос у виборі напрямку.
  relationshipsReversed: >-
    У перевернутому положенні сильні почуття можуть рухатися швидше за спілкування, або захват може згаснути так само швидко, як з’явився. Можна помітити, чи не дієте Ви чи хтось близький імпульсивно, не звіряючись з іншим. Якщо сповільнитися й поговорити про те, чого кожен справді хоче, це може надати стійкості зв’язку, повному іскор.
  workUpright: >-
    У роботі чи проєкті Лицар Жезлів може вказувати на сміливу ініціативу: презентацію амбітної ідеї, керування ривком чи швидкий відгук на нагоду. Можна скористатися цією рушійною силою, щоб подолати інерцію, і водночас скласти простий план кроків після першого захопливого поштовху.
  workReversed: >-
    У перевернутому положенні Ви, можливо, квапите рішення або почуваєтеся заблокованими й нетерплячими. Можна перевірити, чи справді потрібна швидкість, чи коротка пауза для планування послужила б краще. Перетворення роздратування на ясний список наступних дій може допомогти енергії рухатися вперед, а не по колу.
  growthUpright: >-
    Мужність і жага досвіду — дари, якими ця карта просить скористатися. Що Ви зробили б, якби довіряли власному ентузіазму? Можна спробувати щось, що розширює Ваші межі, і помітити, як це — діяти з пристрасті, а не лише з обережності.
  growthReversed: >-
    У перевернутому положенні можна дослідити свої стосунки з імпульсом. Коли спонтанність приносить Вам радість, а коли лишає розпорошеними? Якщо навчитися ненадовго зупинятися перед дією, не втрачаючи іскри, Ваша енергія може стати тим, чим Ви кермуєте, а не тим, що кермує Вами.
