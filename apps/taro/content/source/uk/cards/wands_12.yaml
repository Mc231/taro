imageryNote: >-
  Вершник у розпалі галопу нахиляється вперед на коні, що стає дибки чи стрибає, жезл високо піднято, плащ майорить позаду. Попереду простягаються пустельні пагорби чи відкриті рівнини, а одяг вершника можуть прикрашати маленькі язики полум’я чи саламандри. Кінь у стрибку уособлює пристрасть і рушійну силу, піднятий жезл — мету, втілену в дію, а широкий краєвид — пригоду, що ще розгортається. Нахил уперед натякає і на мужність, і на поспіх.
