shortUpright: >-
  Два варіанти поки що врівноважують один одного; можна помітити, що Ви тримаєте поза полем зору, щоб зберегти мир.
shortReversed: >-
  Пауза, можливо, закінчується; те, на що Ви уникали дивитися, може просити лагідного, чесного погляду.
meaningUpright: |-
  Двійка Мечів описує утримувану позицію між двома шляхами. Жоден варіант не є явно правильним, тож Ви тримаєте їх у рівновазі, схрестивши руки, і чекаєте. Це може бути мудра пауза, мить перевести подих перед вибором. А може бути й способом не дивитися на те, що зробило б вибір яснішим.
  Ви можете впізнати цю карту в рішенні, яке постійно відкладаєте, у незгоді, де Ви вирішили не ставати на чийсь бік, чи в перемир’ї із собою щодо питання, якого ще не хочете торкатися. Спокій на поверхні може приховувати чимало зусиль під нею; тримати нерухомо дві важкі речі втомлює.
  Ця карта запрошує поміркувати, що захищає ця нерухомість. Вона дає Вам час зібрати інформацію чи відгороджує від інформації, яка у Вас уже є? Можна просто назвати кожен варіант, зокрема що Ви щодо нього відчуваєте, а не лише що думаєте. Іноді рівновага зміщується, щойно одному прихованому почуттю дозволено вийти на світло, і наступний крок стає легшим.
meaningReversed: |-
  У перевернутому положенні Двійка Мечів може відображати глухий кут, що починає послаблюватися. Пов’язка сповзає; те, чого Ви уникали, може ставати видимим, готові Ви до цього чи ні. Це може принести полегшення, а може й хвилю почуттів, які Ви відклали.
  Інше прочитання — рівновага, що хилиться від надто малого руху до надто великого тиску: інші підганяють Вас обрати, перш ніж Ви встигли подумати, або рішення ухвалюють поспіхом, аби лише покласти край незручності очікування.
  Можна запитати себе, що Ви тепер знаєте такого, чого раніше не дозволяли собі знати. Не треба стрибати; новий погляд можна приймати повільно. Який вибір виглядає інакше, коли Ви дозволяєте собі побачити його повністю, і яким міг би бути вдумливий наступний крок звідси?
aspects:
  relationshipsUpright: >-
    У стосунках ця карта може вказувати на тихе протистояння: двоє уникають теми, щоб усе було спокійно, або Ви стримуєте свій погляд, щоб лишатися нейтральними між іншими. Мир, збережений так, може здаватися крихким. Варто поміркувати, чи не могла б лагідна, чесна розмова замінити обережне мовчання і що Ви сказали б, якби не мусили стерегти обидва боки водночас.
  relationshipsReversed: >-
    У перевернутому положенні Двійка Мечів може відображати кінець перемир’я. Почуття, які були сховані, можуть спливти, або хтось може попросити Вас нарешті сказати, на чиєму Ви боці. Це може бути незручно, але може й звільнити місце для більшої чесності. Можна ділитися тим, що Ви тримали в собі, невеликими ясними частинами, а не всім одразу.
  workUpright: >-
    У роботі ця карта може відображати відкладене рішення: два підходи, дві пропозиції щодо Вашого часу чи два пріоритети, що здаються однаково нагальними. Чекати може бути розумно, якщо Вам потрібно більше фактів. Можна записати, чого вимагав би від Вас кожен варіант і що дав би, і помітити, якого списку Ви уникаєте. Ця неохота теж може бути корисною інформацією.
  workReversed: >-
    У перевернутому положенні застиглий вибір може знову рушити, іноді тому, що термін чи нова деталь змушують поставити питання. Ви можете почуватися поквапленими. Може допомогти відокремити те, що справді треба вирішити сьогодні, від того, що може трохи почекати. Якщо Ви уникали певної інформації, можливо, саме час прямо на неї поглянути й дозволити їй Вас спрямувати.
  growthUpright: >-
    Для особистісного зростання Двійка Мечів запрошує помітити, як Ви захищаєтеся від важких почуттів, лишаючись нерухомими. Нерухомість може давати відпочинок; а може бути способом не відчувати. Можна спробувати кілька хвилин побути з кожним варіантом, звертаючи увагу на реакцію тіла, а не лише на міркування. Обидва види знання важливі.
  growthReversed: >-
    У перевернутому положенні ця карта може відображати поворотний момент у чесності із собою. Щось, що Ви тримали на відстані, тепер ближче. Можна підійти до нього з цікавістю, а не з осудом, приймаючи його у власному темпі. Розплющити очі не означає, що треба діяти негайно; це означає, що Ви обираєте ясно бачити, перш ніж вирішувати.
reflectionQuestions:
  - >-
    Що Ви тримаєте поза полем зору, щоб рішення лишалося врівноваженим?
  - >-
    Де Ви підтримуєте обережний мир між людьми і чого це Вам коштує?
  - >-
    На який один факт чи яке почуття Ви могли б дозволити собі поглянути цього тижня?
imageryNote: >-
  На оригінальному зображенні сидяча фігура тримає два схрещені клинки біля грудей, а очі прикриває м’яка тканина. Блідий серп місяця низько висить над тихою мілкою водою, усіяною камінцями. Схрещені клинки утворюють насторожену форму, наче зачинені двері. Тиха вода й нічне світло натякають на емоції, що спочивають під поверхнею, а закриті очі вказують на рішення поки що не дивитися.
