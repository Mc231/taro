imageryNote: >-
  Закохані Taro постають двома фігурами по обидва боки вузького струмка, що тягнуться одна до одної, щоб потиснути руки над водою; їх зображено так, щоб будь-хто міг упізнати себе в будь-якій із них. Над ними два птахи кружляють у тому самому ясному небі. На одному березі росте плодове дерево, на другому — квітуча лоза: два різні дари, що зустрічаються посередині. Струмок натякає на вибір і зусилля, яких справжній зв’язок вимагає від обох людей.
