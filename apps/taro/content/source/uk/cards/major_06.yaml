shortUpright: >-
  Вибір, зроблений серцем і розумом разом, відповідно до того, що Ви справді цінуєте.
shortReversed: >-
  Одна частина Вас може хотіти одного, а інша — іншого. Ця карта запрошує вислухати обидві, перш ніж обирати.
meaningUpright: |-
  Закоханих часто тлумачать як карту романтики, але її глибша тема — узгодженість: зустріч двох частин, двох людей чи двох шляхів так, що це відчувається цілісним. Вона питає, що Ви цінуєте найбільше і чи відображають це рішення, які стоять перед Вами. Зв’язок тут — і з іншими, і з собою.
  У повсякденному житті ця карта може відображати стосунки, у яких Вас справді бачать, робоче партнерство, де ідеї течуть легко, або рішення, яке вимагає ясно сказати, що для Вас важливо. Вона може вказувати на мить вибору між двома добрими варіантами, коли немає очевидно правильної відповіді, а є лише та, що пасує людині, якою Ви стаєте.
  Ця карта запрошує Вас поміркувати, наскільки Ви чесні з собою та іншими. Можна запитати себе, до чого Вас тягне і чому, і до чого Ви готові взяти зобов’язання. Закохані підкреслюють, що вагомий вибір рідко пов’язаний з досконалістю. Він про те, щоб привести серце й судження в одну кімнату й дати їм поговорити.
meaningReversed: |-
  У перевернутому положенні Закохані можуть відображати відчуття, що Вас тягне у два боки. Те, чого Ви хочете, і те, чого, на Вашу думку, слід хотіти, можуть не збігатися, або близький зв’язок може звучати трохи не в тон, коли кожен цінує різне, не кажучи про це.
  Ця карта може вказувати й на рішення, яке постійно відкладається, можливо, тому, що обрати один варіант означає відпустити інший. Уникати вибору може бути легше в короткій перспективі, але це тихо виснажує.
  Можливо, варто записати, що чесно пропонує і чого вимагає від Вас кожен варіант і які Ваші цінності він підтримує. Може допомогти помітити, де Ви найбільше почуваєтеся собою. Повернення узгодженості часто починається з невеликого правдивого визнання, спершу собі, а потім, якщо це здається слушним, комусь іншому.
aspects:
  relationshipsUpright: >-
    У стосунках Закохані можуть відображати глибоке взаєморозуміння й радість від того, що Ви обираєте одне одного, у коханні, дружбі чи родині. Вони можуть запрошувати поділитися тим, що Ви справді цінуєте, і вислухати, що цінує інша людина. Близькість зростає, коли обоє можуть бути чесними й водночас почуватися бажаними.
  relationshipsReversed: >-
    У перевернутому положенні ця карта може вказувати на розрив між надіями чи пріоритетами двох людей або на невисловлені почуття. Варто поміркувати, чи не пристосовуєтеся Ви надто сильно заради миру або чи не чекаєте, що хтось сам здогадається, чого Ви потребуєте. Відкрита, добра розмова про цінності могла б допомогти обом побачити, де Ви є.
  workUpright: >-
    У роботі чи проєкті Закохані підкреслюють співпрацю й вибір, що спирається на Ваші цінності. Вони можуть відображати партнерство, яке розкриває найкраще в обох, або рішення про те, яким напрямком іти. Можна запитати себе, який варіант здається не лише практичним, а й змістовним, і дати обом цим якостям важити у виборі.
  workReversed: >-
    У перевернутому положенні Закохані можуть відображати тертя в партнерстві або відчуття, що Ваша робота не відповідає тому, що Вам небайдуже. Вони можуть вказувати й на вагання у виборі між двома шляхами. Можна записати, чого вимагав би від Вас кожен шлях, і помітити, якому з них Ви охочіше це віддали б.
  growthUpright: >-
    Ясніше знати власні цінності — ось внутрішня робота, на яку вказує ця карта. Коли Ви розумієте, що для Вас важливо, вибір стає менше про те, щоб догодити іншим, і більше про вірність собі. Можна записати три цінності й помітити, де вони вже спрямовують Ваші дні.
  growthReversed: >-
    У перевернутому положенні Закохані можуть відображати внутрішній конфлікт: частина Вас хоче змін, частина — затишку. Жодна з них не помиляється. Можна дати голос кожній, на папері чи в розмові, і подивитися, чи є вибір, що шанує обидві, хай навіть частково.
