name: Ace of Cups
keywordsUpright:
  - open heart
  - new feeling
  - receptivity
  - emotional renewal
  - compassion
keywordsReversed:
  - feelings held back
  - emptied reserves
  - inner refilling
  - guarded heart
shortUpright: A fresh feeling may be rising; this card invites you to let it in and notice where it wants to flow.
shortReversed: Your cup may need filling before it can pour; consider what would quietly replenish you today.
meaningUpright: >-
  The Ace of Cups is the first stirring of the suit of water: a single vessel so full that it spills over. It can reflect a feeling that arrives before you have words for it, such as tenderness, awe, relief or a sudden warmth toward someone or something. Nothing has to be done with it yet. The card simply asks you to notice that it is there.

  In everyday life this might look like laughing properly for the first time in weeks, feeling moved by a piece of music, or finding that an old resentment has softened without you trying. It can also point to a new creative impulse, or a wish to be kinder to yourself.

  This card invites you to stay open rather than manage the feeling straight away. You might ask where your care wants to go, and whether you are letting some of it reach you too. An open heart is not a promise of anything; it is a way of meeting the day with a little more room inside.
meaningReversed: >-
  Reversed, the Ace of Cups may suggest that feeling is present but held close, like water in a covered jar. Perhaps you have been busy looking after others, or it has felt safer to keep emotions at arm's length for a while. There is nothing wrong with that; guarding your heart can be a sensible response to a demanding season.

  This card can also reflect a sense of running on empty. You might notice that small pleasures land flatly, or that you are giving from a cup that has not been refilled in some time.

  The invitation here is gentle. Rather than forcing yourself to feel more, you might look at what quietly restores you, such as sleep, a walk near water, an unhurried conversation or an hour when no one needs you. When something does refill the cup, let yourself notice it. Openness can return at its own pace.
aspects:
  relationshipsUpright: >-
    In close bonds, the Ace of Cups can reflect a fresh wave of warmth, whether with a partner, a friend, family or someone new. It may invite you to express affection simply and without calculation: a message sent because you thought of them, an honest thank-you, a moment of full attention. You might also notice how it feels to receive care as well as give it.
  relationshipsReversed: >-
    Reversed, this card may point to affection that is held back, perhaps because of past hurt or plain tiredness. You might notice that you listen politely while staying slightly out of reach. There is no need to push. Consider whether one small, safe act of openness, like saying what you appreciate, could let a little more warmth move between you and someone close.
  workUpright: >-
    At work or in any project you care about, this card may reflect renewed enthusiasm, or a new idea that genuinely moves you. It can invite you to bring feeling into what you do: care for the people you serve, pleasure in the craft, curiosity about what could grow. You might note what excites you now, before practical concerns start to shape it.
  workReversed: >-
    Reversed, the card may reflect work that has become mechanical, where you go through the motions while your interest waits somewhere else. This is common after long effort. You might ask what first drew you to this path, or which small part of it still feels alive, and see whether giving that part more room restores some of the flow.
  growthUpright: >-
    For personal growth, the Ace of Cups invites emotional honesty with yourself. You might practice naming feelings as they arrive, without ranking them as good or bad. Journaling, time near water or simply pausing before you respond can make space for this. The aim is not constant happiness but a kinder, more open relationship with your inner life.
  growthReversed: >-
    Reversed, this card may suggest turning care inward before offering more outward. If your reserves feel low, you could treat rest and small pleasures as necessary rather than optional. It may help to notice what drains you and what refills you. If heavy feelings stay with you, talking with someone you trust can be a useful step too.
reflectionQuestions:
  - What feeling has been trying to get your attention lately?
  - Who or what has refilled your cup recently, and how might you thank them?
  - What is one small way you could let more warmth in this week?
imageryNote: >-
  The art centers on a single vessel brimming over, its water falling in several thin streams into a still pool below. Water lilies or lotus leaves on the surface can stand for feelings that open slowly and root in deep places. A soft light above the cup may suggest receptivity, an offering held out rather than grasped. The overall mood is calm abundance: more than enough, spilling gently outward.
