cardId: swords_03
reviewStatus: machine
element: air
astrology: saturn_in_libra
name: Three of Swords
keywordsUpright:
  - sorrow
  - hurtful words
  - grief
  - painful truth
  - letting tears come
keywordsReversed:
  - slow recovery
  - releasing hurt
  - holding pain in
  - forgiveness in time
  - the storm passing
shortUpright: A sad or hurtful moment may be asking to be felt rather than explained away; sorrow can be honored gently.
shortReversed: The sharpest part of a hurt may be easing; you might notice what helps you breathe a little more freely.
meaningUpright: >-
  The Three of Swords speaks of sorrow: the ache of disappointment, loss, or
  words that landed hard. It does not say how long the feeling lasts or what
  caused it. It simply acknowledges that some moments hurt, and that the hurt
  is real.

  You might recognize this card in a conversation that left you shaken, news
  that changed how you see something, or grief that returns on an ordinary
  afternoon. It can also reflect the sting of understanding a truth you hoped
  was not so. Often the thinking mind wants to analyze the pain, find the
  reason, and fix it quickly.

  This card gently invites you to let the feeling be a feeling. Rain falls,
  and then it passes; sadness can move in a similar way when it is allowed to.
  You may want to give yourself kindness, time, and the company of people who
  can listen without rushing you. If heavy feelings stay with you, talking to
  someone you trust or a qualified professional can help. What would it mean
  to treat your own sorrow the way you would treat a friend's?
meaningReversed: >-
  Reversed, the Three of Swords can reflect the slow easing of a hurt. The
  storm may be moving on, even if the ground is still wet. You might notice
  small moments of lightness returning, or find you can speak about what
  happened with a little more steadiness.

  Another reading is sorrow turned inward: pain held tightly and not shared,
  perhaps because it feels too private or because others seem to expect you to
  be fine already. Hurt that is kept silent can linger longer than it needs to.

  This card invites you to notice what helps you let go, even a little. It
  might be writing, time outdoors, a trusted conversation, or simply
  permission to feel sad without a deadline. There is no correct pace for
  recovering from a painful moment. What is one gentle thing you could offer
  yourself today?
aspects:
  relationshipsUpright: >-
    In relationships, this card may reflect hurt feelings: a harsh word, a
    disappointment, or a painful distance between you and someone close. It
    does not say who is at fault. You might consider giving the feeling room
    before deciding what it means. When you are ready, sharing the hurt calmly
    and listening to the other person's side can help both of you understand
    what happened.
  relationshipsReversed: >-
    Reversed, the Three of Swords can suggest a hurt beginning to ease between
    people, or one still held quietly inside. Perhaps an apology is possible,
    or perhaps the healthier step is simply acceptance. You might ask what you
    need to feel at peace, whether that includes the other person or not.
    Forgiveness, if it comes, can arrive in its own time.
  workUpright: >-
    At work or in a project, this card can reflect disappointment: critical
    feedback that stung, a plan that did not come together, or a setback after
    real effort. It is fine to feel it. You might allow yourself a pause before
    responding, then look for the useful part of the message once the first
    wave has passed. Your worth is larger than one outcome.
  workReversed: >-
    Reversed, this card may point to recovering from a professional setback,
    or to frustration you have been carrying silently. You might notice
    whether an old disappointment is still shaping how you approach new tasks.
    Naming it, perhaps with a trusted colleague or mentor, can loosen its grip
    and help you return to your work with fresh energy.
  growthUpright: >-
    For personal growth, the Three of Swords invites you to practice
    tenderness toward your own pain. Sorrow is part of being human, not a sign
    that something is wrong with you. You might explore simple ways of caring
    for yourself when you feel low: rest, movement, familiar comforts, and
    people who let you be as you are.
  growthReversed: >-
    Reversed, this card can reflect learning to release what hurts at a pace
    that feels safe. You might notice where you have been holding your breath,
    literally or figuratively. Letting out a sigh, a few tears, or a few honest
    sentences in a journal can be a small act of release. Recovery is rarely a
    straight line, and that is all right.
reflectionQuestions:
  - What feeling have you been trying to think your way out of?
  - Who could you let see your sadness without needing them to fix it?
  - What is one kind thing you could do for yourself today?
imageryNote: >-
  The original art shows three slender blades resting against a heart-shaped
  stone, set beneath a low gray sky. Soft rain falls around it, and a faint
  break of light appears at the edge of the clouds. The stone suggests the
  weight of sorrow, while the rain points to tears and release. The distant
  light hints that storms move on, without promising when.
