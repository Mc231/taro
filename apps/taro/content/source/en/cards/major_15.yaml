cardId: major_15
reviewStatus: machine
element: earth
astrology: capricorn
name: The Devil
keywordsUpright:
  - attachment
  - habits that bind
  - temptation
  - shadow self
  - honest awareness
keywordsReversed:
  - loosening ties
  - breaking a pattern
  - reclaiming choice
  - facing the shadow
shortUpright: "A habit or attachment may be holding you more tightly than you realize. Noticing it is the first step."
shortReversed: "A pattern that once had a firm hold may be loosening. What would help you step further away?"
meaningUpright: >-
  The Devil is not about evil. It is a card about the patterns and attachments
  that can hold us, often with our quiet agreement. Its traditional image shows
  two figures loosely chained, and the chains are usually loose enough to slip
  off. The card asks: what keeps you here, and how much of it is choice?

  In everyday life this card may reflect scrolling late into the night, saying
  yes out of fear of disappointing someone, chasing approval or comfort in ways
  that leave you feeling emptier afterward, or staying in a routine that no
  longer serves you because leaving feels too uncertain. It can also point to
  the parts of yourself you prefer not to look at, such as envy, resentment or
  desire, which tend to grow stronger when ignored.

  This card invites you to consider what has more power over you than you would
  like. You might ask what need a habit is trying to meet, and whether there is
  a kinder way to meet it. The Devil highlights awareness without shame. Seeing
  a pattern clearly is often the moment it begins to loosen.
meaningReversed: >-
  Reversed, the Devil may reflect a loosening. A habit, relationship dynamic or
  belief that once felt unbreakable might be losing its grip, and you may be
  starting to see other options. This can bring relief along with some
  uncertainty about who you are without the old pattern.

  This card can also point to the work of facing your shadow: looking honestly
  at difficult feelings or motives and accepting them as part of being human.

  You may want to notice any small steps you have already taken away from
  something that held you. What made them possible? Keeping those supports
  close, and asking for help where the pull is still strong, can make the
  change more lasting. Freedom often grows slowly, one choice at a time.
aspects:
  relationshipsUpright: >-
    In relationships, the Devil can reflect patterns of dependency, jealousy or
    control, on either side, or a bond held together more by habit than by
    care. It may invite you to look honestly at what keeps you connected and
    whether both people feel free. Naming a pattern kindly can open room to
    change it.
  relationshipsReversed: >-
    Reversed, this card may point to stepping back from an unhealthy dynamic or
    setting a boundary that has been hard to set. You might consider what
    support you need to keep that boundary. It can also reflect a relationship
    becoming more honest as hidden feelings come into the open.
  workUpright: >-
    At work or in a project, the Devil highlights feeling tied to something:
    long hours, a need for approval, or a role you stay in mainly out of fear
    of change. You might ask what you are getting from the situation and what it
    is costing you, and whether small changes could restore a sense of choice.
  workReversed: >-
    Reversed, the Devil may reflect breaking free from an unhelpful work habit,
    such as perfectionism or constant availability. It can also point to
    recognizing pressure you had normalized. You might protect this new freedom
    with a clear boundary, such as a finishing time or a limit on messages after
    hours.
  growthUpright: >-
    The Devil opens the door to shadow work: gently exploring the
    parts of yourself you tend to hide. You might notice a habit that feels
    compulsive and ask, with curiosity rather than judgment, what it is trying
    to give you. Understanding comes before change.
  growthReversed: >-
    Reversed, the Devil may reflect progress in loosening an old attachment. It
    can be a moment to acknowledge how far you have come. If heavy habits or
    feelings keep returning, talking with someone you trust or a qualified
    professional can offer steady support along the way.
reflectionQuestions:
  - "Which habit has more hold on you than you would like, and what need does it meet?"
  - "Where in a close relationship do you feel less free than you want to be?"
  - "What small step away from an old pattern could you take this week?"
imageryNote: >-
  Taro's Devil is imagined as a shadowy, horned figure perched above two
  smaller figures who are linked to its seat by loose, slack chains. The
  chains are drawn clearly loose around their wrists, inviting the
  viewer to notice that they could lift them off. Dim torchlight and deep
  earth tones create a heavy mood, while a faint doorway of light at the edge
  of the scene hints that another path is there to be found.
