shortUpright: You may be turned inward for a while; this card invites you to notice what is being offered while you reflect.
shortReversed: Interest may be returning after a quiet stretch; consider which invitation feels worth accepting now.
meaningUpright: >-
  The Four of Cups often shows a figure sitting apart, looking at three cups in front of them while a fourth is offered, perhaps unnoticed. It is a card of pause and inner weighing. Something that once satisfied you may have lost its taste, and you are not yet sure what would replace it.

  This can look like boredom with a routine, a flat feeling after reaching a goal, or a wish to step back from social life for a while. It can also be genuine contemplation: taking time to consider what you want before saying yes to anything else.

  Withdrawal is not a failure. Sometimes it is exactly what a tired heart needs. The card simply invites you to stay curious rather than closed. While you sit with your thoughts, you might glance up now and then and notice what is being held out to you. An offer of help, a new idea or a small kindness may be closer than it seems, and you are free to decide whether it fits.
meaningReversed: >-
  Reversed, the Four of Cups may reflect a turning point after a period of withdrawal. You might feel ready to look up again, open to conversations and possibilities that seemed dull or out of reach before. Curiosity can return quietly, first as restlessness, then as interest.

  It can also point the other way: a withdrawal that has lasted longer than it helped, becoming a habit of saying no. You might notice whether you are declining invitations from real need or simply from inertia.

  Either way, this card invites a gentle check-in. What, if anything, has started to catch your attention again? You do not have to accept every offer that arrives. Choosing one small thing to engage with, and seeing how it feels, may be enough to learn what you are ready for now.
aspects:
  relationshipsUpright: >-
    In relationships, the Four of Cups may reflect a need for space, or a sense that a bond has become routine. It can invite you to ask whether you are overlooking care that is being offered, such as a gesture, a question or an invitation. You might tell someone close that you need time to think, so that distance is not mistaken for disinterest.
  relationshipsReversed: >-
    Reversed, this card may suggest reconnecting after a withdrawn stretch. You might feel more willing to hear what someone has been trying to say, or to reach out first. If you still need space, saying so kindly can protect the bond. Small shared moments, like a walk or a meal, can be a comfortable way to find your way back.
  workUpright: >-
    At work, this card can reflect restlessness, a sense that tasks no longer mean much, or a pause to reassess direction. It may invite you to look again at opportunities you dismissed quickly. A conversation, a new responsibility or a course you ignored could be worth a second look, even if the spark is not there yet.
  workReversed: >-
    Reversed, the card may point to motivation returning, or to a readiness to say yes to something new. You might notice which projects have begun to interest you again. If you feel stuck in a loop of declining, consider trying one small commitment and reflecting afterwards on whether it gave you energy or took it.
  growthUpright: >-
    For personal growth, the Four of Cups invites honest reflection on what truly satisfies you. You might list the things you do out of habit and ask which of them still matter. Quiet time can be valuable, as long as it remains a choice rather than a place where you feel stuck.
  growthReversed: >-
    Reversed, this card may reflect coming out of a reflective period with clearer priorities. You might notice gratitude returning for things you once took for granted. It could help to write down what you learned while you were withdrawn, so the insight stays with you as life gets busier again.
reflectionQuestions:
  - What has lost its appeal for you lately, and what might that be telling you?
  - What might someone be offering you that you have not fully noticed?
  - What is one small invitation you could say yes to, just to see how it feels?
imageryNote: >-
  The art places a seated figure beneath a tree or beside still water, arms folded, gaze lowered toward three cups on the ground. A fourth cup drifts toward them on a breeze or floats on the water's surface, easy to miss. Muted colors and a closed posture can suggest inwardness and a need for pause, while the offered cup keeps a thread of possibility in view.
