cardId: wands_06
reviewStatus: machine
element: fire
astrology: jupiter_in_leo
name: Six of Wands
keywordsUpright:
  - recognition
  - confidence
  - public achievement
  - encouragement
  - pride in your work
keywordsReversed:
  - seeking approval
  - unnoticed effort
  - self-doubt
  - quiet success
  - redefining success
shortUpright: Your effort may be getting noticed; let yourself receive some recognition and notice who helped you get here.
shortReversed: Recognition may feel missing or less satisfying than hoped; you might ask what success means to you on your own terms.
meaningUpright: >-
  The Six of Wands is a card of recognition. After the friction of the Five,
  someone rides forward with a wreath on their staff, and people along the way
  seem to cheer. It captures the moment when effort becomes visible and others
  acknowledge it.

  This can look like good feedback on work you poured yourself into, a friend
  telling you they admire how you handled something, or finishing a challenge
  you once doubted you could face. It can also be a quieter kind of confidence:
  standing a little taller because you know you did well.

  This card invites you to accept appreciation without brushing it aside.
  Recognition can be energizing and can give you courage for the next step.
  At the same time, the figure is surrounded by people, which is a reminder
  that few achievements are entirely solo. You might enjoy the moment and also
  consider who supported you, and how you could share some of the credit.
meaningReversed: >-
  Reversed, the Six of Wands can reflect effort that has gone unnoticed, or
  praise that does not quite reach you. You may have achieved something and
  still feel it does not count until someone else says so. It can also point
  to tiredness from performing confidence you do not fully feel.

  Sometimes this card reversed describes a quiet success, meaningful to you
  even if it is not visible to others. That kind of progress matters too.

  This may be a moment to look at how much of your sense of worth depends on
  applause. What would it be like to recognize your own effort first? You might
  write down what you are proud of, including the parts no one else saw, and
  let that be a steadier source of encouragement than outside approval.
aspects:
  relationshipsUpright: >-
    In relationships, this card may reflect appreciation flowing both ways:
    feeling proud of someone close, or feeling seen and supported by them. It
    can invite you to celebrate each other's wins out loud. You might tell a
    friend, partner or family member about something you admire in them, and
    let yourself receive their encouragement in return.
  relationshipsReversed: >-
    Reversed, you may feel that your efforts in a relationship go unnoticed,
    or that recognition has become a quiet competition. You might consider
    saying clearly what kind of appreciation matters to you, and asking the
    other person the same. Small, specific thanks can often shift the mood more
    than grand gestures.
  workUpright: >-
    At work or in study, the Six of Wands can point to visible results:
    positive feedback, a project well received, a moment to present what you
    have done. You might use this confidence to share your ideas more openly,
    while also crediting the people who contributed. Recognition shared
    generously tends to build stronger teams.
  workReversed: >-
    Reversed, your contributions may feel overlooked, or success may depend
    too much on how things look from outside. You might make your work more
    visible in a calm, factual way, such as a short summary of what you
    delivered, and also reflect on which results matter to you regardless of
    who notices them.
  growthUpright: >-
    For personal growth, this card invites you to let yourself feel proud.
    Acknowledging your progress can build confidence that carries into the
    next challenge. You might keep a short list of things you have handled
    well recently, to return to on days when your confidence feels thinner.
  growthReversed: >-
    Reversed, self-doubt or a need for approval may be dimming your sense of
    accomplishment. You might explore where your idea of success came from
    and whether it still fits you. Defining success in your own words can make
    recognition from others a pleasant extra rather than something you depend
    on.
reflectionQuestions:
  - What have you accomplished recently that you have not fully acknowledged?
  - Who helped you along the way, and how might you share the credit with them?
  - What would success look like if no one else were watching?
imageryNote: >-
  A rider on a calm horse moves through a small crowd, holding a staff crowned
  with a wreath of leaves. Other raised staffs line the path like an honor
  guard. The wreath stands for recognition earned through effort, the steady
  horse for confidence that has been trained rather than rushed, and the
  surrounding figures for the community that shares in and supports the
  achievement.
