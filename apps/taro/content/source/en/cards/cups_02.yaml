name: Two of Cups
keywordsUpright:
  - mutual connection
  - reciprocity
  - partnership
  - shared respect
  - attraction
keywordsReversed:
  - imbalance
  - miscommunication
  - repairing trust
  - partnering yourself
shortUpright: A moment to notice where care flows both ways, and what makes a connection feel equal and alive.
shortReversed: Something between you and another may feel out of balance; consider what each of you is really asking for.
meaningUpright: >-
  The Two of Cups shows two people, or two parts of a life, meeting as equals and offering something to each other. It is a card of recognition: the relief of being understood, and the pleasure of understanding someone in return. The connection it describes can be romantic, but it can just as easily be a friendship, a creative collaboration, a sibling bond or a working partnership.

  You might recognize this energy in a conversation where both people listen, in a reconciliation after a misunderstanding, or in the quiet agreement of two people who choose to keep showing up for each other. It can also reflect bringing together two sides of yourself that have been pulling in different directions.

  This card invites you to notice where there is genuine give and take in your life, and to honor it. Reciprocity does not mean keeping score. It means both people feel free to offer, to receive and to say what they need.
meaningReversed: >-
  Reversed, the Two of Cups may point to a connection that has tipped out of balance. One person may be giving more, or listening less, or two people may simply be talking past each other. It does not have to mean anything is broken; many bonds go through seasons like this.

  The card can also turn inward, asking how well you partner with yourself. Are you as patient and fair with your own needs as you try to be with someone else's?

  You might look at a relationship that feels uneven and ask what each person is really hoping for, beneath the surface disagreement. A calm, honest conversation, or a little distance to see more clearly, may be more useful than trying to fix everything at once. Balance is something people build together, one exchange at a time.
aspects:
  relationshipsUpright: >-
    In relationships, this card can reflect mutual attraction, friendship or a partnership where both people feel seen. It may invite you to notice the small rituals that keep a bond steady: checking in, remembering what matters to the other person, apologizing simply. You might ask what you appreciate most about someone close, and whether they know it.
  relationshipsReversed: >-
    Reversed, this card may reflect a bond where one person carries more of the emotional weight, or where a misunderstanding has not been cleared. You might consider what you would say if you knew it would be heard kindly. Repair often starts with one honest sentence and a willingness to hear the reply without defending yourself straight away.
  workUpright: >-
    At work, the Two of Cups can point to a promising collaboration, a colleague you trust or a client relationship built on respect. It may invite you to share credit, ask for input and make agreements clear enough that both sides feel secure. Good partnerships often grow from shared values more than from shared skills.
  workReversed: >-
    Reversed, the card may reflect a working relationship where expectations are unspoken or uneven. Perhaps one person assumes agreement where there is none. You might name what you each expect, in plain words, and check whether your roles still fit. Clarity can be a kindness, even when the conversation feels awkward at first.
  growthUpright: >-
    Inner partnership is the growth theme here, a chance to reconcile parts of yourself: what you want and what you value, or your practical side and your tender one. You might write a short dialogue between two voices inside you and see where they already agree. Integration can feel like finding a partner within.
  growthReversed: >-
    Reversed, this card may ask whether you rely on others for a sense of balance you could also build inside. You might notice where you seek approval before trusting your own view. Treating yourself with the same fairness you offer a close friend can be a steadying practice, one small choice at a time.
reflectionQuestions:
  - What makes you feel truly met by another person?
  - Where does a connection in your life feel uneven, and what might restore some balance?
  - How could you show appreciation to someone who keeps showing up for you?
imageryNote: >-
  The art pairs two figures, or two hands, each raising a cup toward the other across a small space. Between them, a shared emblem such as intertwined stems or twin fish can suggest that the meeting creates something neither holds alone. Mirrored colors on each side may express equality, with a gentle glow where the cups nearly touch, as if the connection itself gives off light.
