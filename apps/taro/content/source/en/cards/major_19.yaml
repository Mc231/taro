cardId: major_19
reviewStatus: machine
element: fire
astrology: sun
name: The Sun
keywordsUpright:
  - joy
  - clarity
  - warmth
  - confidence
  - vitality
keywordsReversed:
  - dimmed joy
  - self-doubt
  - overexposure
  - finding light again
shortUpright: "A moment of warmth and clarity. This card invites you to enjoy what is bright and open in your life."
shortReversed: "The light is still there, even if clouds are passing. What helps you feel warm and clear?"
meaningUpright: >-
  The Sun is one of the most openly joyful cards in the deck. It is the energy
  of a clear morning, a child playing in a garden, the feeling of being fully
  yourself without needing to hide. After the uncertainty of the Moon, this card
  brings clarity: things can be seen as they are, and often they are simpler
  and warmer than feared.

  In everyday life this card may reflect a day when everything feels a little
  easier, a sense of pride in something you have done, time outdoors that lifts
  your mood, or a relationship where you feel accepted and at ease. It can point
  to confidence that does not need to shout, and to the simple pleasures that
  make life feel good: laughter, sunshine, play.

  This card invites you to consider what brings you genuine joy and how you
  could make more room for it. You might ask where you could let yourself be
  seen more fully. The Sun highlights optimism grounded in the present moment,
  a reminder that it is all right to celebrate what is going well, to share
  your warmth and to let it come back to you.
meaningReversed: >-
  Reversed, the Sun may reflect a time when joy feels a little muted. The warmth
  is not gone; it may simply be hidden behind a busy schedule, tiredness or
  self-doubt. You might find it harder than usual to enjoy good moments or to
  feel proud of yourself.

  This card can also point to too much brightness: putting on a cheerful face
  when you feel otherwise, or pushing yourself to be positive all the time.

  You may want to look for small, simple sources of warmth, such as time
  outside, a playful activity, or someone who makes you laugh. It can also help
  to let yourself feel what you actually feel, rather than what you think you
  should. Genuine joy often returns more easily when it is not forced.
aspects:
  relationshipsUpright: >-
    In relationships, the Sun can reflect warmth, openness and shared happiness.
    It may invite you to enjoy uncomplicated time with the people you care
    about: laughing, playing, being outdoors. Relationships can feel lighter
    when both people feel free to be themselves and to celebrate each other.
  relationshipsReversed: >-
    Reversed, this card may point to a relationship that has lost some of its
    lightness, perhaps under stress or routine. You might consider planning
    something simple and fun together, or checking whether someone is hiding
    how they really feel behind a cheerful surface.
    Lightness can return through small, shared moments.
  workUpright: >-
    At work or in a project, the Sun highlights clarity, visibility and
    enthusiasm. It may reflect a moment when your efforts are recognized, or when
    work feels energizing rather than draining. You might share your ideas
    confidently and let yourself enjoy progress along the way.
  workReversed: >-
    Reversed, the Sun may reflect feeling overlooked, or struggling to find
    enthusiasm for your work. It can also point to overexposure, such as too much
    pressure to perform. You might ask what small change would bring more
    energy and warmth into your working days.
  growthUpright: >-
    For personal growth, this card invites you to reconnect with your natural
    enthusiasm and curiosity. You might revisit something you loved as a child
    or try something new just for the fun of it. Confidence can grow from joy as
    much as from achievement.
  growthReversed: >-
    Reversed, the Sun may ask whether you have been too hard on yourself or too
    serious for too long. It can reflect a need for play, rest and lightness.
    You might schedule one small joyful activity this week, without any goal
    beyond enjoying it.
reflectionQuestions:
  - "What brought you genuine joy recently, however small?"
  - "With whom do you feel most free to be yourself?"
  - "What could you do this week purely for the pleasure of it?"
imageryNote: >-
  Taro's Sun is imagined as a wide summer field at midday, with friends of
  different ages sharing food on a blanket under a huge, warm sun. Kites rise on
  the breeze and long shadows are nowhere to be seen, suggesting a moment with
  nothing to hide. Bright yellows and warm oranges fill the scene, while a dog
  running through the grass adds a note of play. The image invites the viewer to
  feel warmth, clarity and uncomplicated joy.
