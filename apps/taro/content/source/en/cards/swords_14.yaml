cardId: swords_14
reviewStatus: machine
element: air
astrology: air_of_air
name: King of Swords
keywordsUpright:
  - intellectual authority
  - fairness
  - clear principles
  - reasoned decisions
  - integrity
keywordsReversed:
  - rigidity
  - cold logic
  - misused authority
  - second-guessing
  - reason with empathy
shortUpright: Steady reasoning and fair principles can guide you; you might decide from what is true rather than what is easy.
shortReversed: Logic may have become rigid or detached; you might ask whether your principles still leave room for people.
meaningUpright: >-
  The King of Swords sits calmly on a high throne, blade upright, gaze
  steady. This figure represents mature thinking: the ability to weigh evidence,
  apply principles consistently, and make decisions that are fair even when
  they are not comfortable. This is clarity that has become a kind of
  leadership.

  You might recognize this energy when you are asked to judge a situation
  impartially, explain a complex matter simply, or hold to your principles
  under pressure. It can reflect being the voice of reason in a heated
  moment, or seeking out someone whose clear thinking you respect. The card
  values integrity: acting in line with what you say you believe.

  This card invites you to consider how you make decisions. Do you gather
  the facts, listen to different views, and then choose with conviction? You
  might notice where emotions or pressure pull you away from your own
  standards, and where a calm, structured approach could help. At the same
  time, wisdom includes knowing that people are more than problems to be
  solved. How can your clear thinking serve fairness and understanding at
  once?
meaningReversed: >-
  Reversed, the King of Swords can reflect reasoning that has become rigid
  or detached. Rules may be applied without regard for the people they
  affect, or intelligence used to control rather than clarify. Arguments can
  be won while trust is lost.

  Another reading is uncertain authority: second-guessing your judgment,
  deferring to others when you know better, or feeling unable to decide.

  This card invites you to reconnect logic with humanity. You might ask
  whether your principles still serve their purpose, or whether they have
  hardened into habits. Listening to how a decision will land for others can
  make it wiser, not weaker. Where could you let empathy inform your
  reasoning while still standing by what you believe?
aspects:
  relationshipsUpright: >-
    In relationships, the King of Swords can reflect a steady, fair presence:
    someone who talks things through calmly, keeps their word, and helps
    others see a situation clearly. You might bring this energy to a
    disagreement by focusing on facts and shared values. Remember to name
    feelings too, so clarity does not come across as distance.
  relationshipsReversed: >-
    Reversed, this card may point to coldness, lecturing, or using logic to
    dismiss someone's feelings. It can also reflect struggling to take a clear
    position. You might notice when you retreat into reasoning to avoid
    vulnerability. Letting others see your heart as well as your mind can
    deepen trust and understanding.
  workUpright: >-
    At work, the King of Swords can suggest leadership through clear
    thinking: setting fair policies, making tough calls transparently, or
    offering expert guidance. You might be trusted to weigh competing views
    and decide. Explaining your reasoning openly and staying consistent helps
    others follow your lead with confidence.
  workReversed: >-
    Reversed, this card may reflect rigid rules, decisions made without
    consulting those affected, or a tendency to overanalyze until nothing
    moves. You might ask whether a process still serves its goal. Inviting
    input and acknowledging uncertainty can strengthen your authority rather
    than diminish it.
  growthUpright: >-
    For personal growth, the King of Swords invites you to define and live
    by your principles. You might write down the values that guide your
    choices and check recent decisions against them. Clear thinking is a
    skill you can practice: gather facts, consider perspectives, then commit
    thoughtfully to a course.
  growthReversed: >-
    Reversed, this card can reflect overreliance on analysis or harsh
    self-judgment. You might notice when you demand perfect logic from
    yourself and leave no room for mistakes. Balancing reason with
    self-compassion can help you decide more freely and learn more gently
    from outcomes that surprise you.
reflectionQuestions:
  - Which principle do you most want your decisions to reflect?
  - Where might your reasoning be missing how someone else feels?
  - What is one decision you could make this week by weighing facts calmly?
imageryNote: >-
  The original art shows a figure seated on a tall stone throne on a
  mountain ridge, blade held perfectly upright, face turned directly toward
  the viewer. Thin, orderly clouds stretch across a pale sky, and two birds
  fly in parallel lines overhead. The upright blade suggests firm principles,
  the direct gaze points to honesty, and the ordered sky hints at a mind that
  has found its calm.
