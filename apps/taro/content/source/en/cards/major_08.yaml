cardId: major_08
reviewStatus: machine
element: fire
astrology: leo
name: Strength
keywordsUpright:
  - gentle courage
  - patience
  - compassion
  - inner steadiness
  - quiet confidence
keywordsReversed:
  - self-doubt
  - frayed patience
  - harsh self-talk
  - rebuilding courage
shortUpright: "Courage does not always roar. Sometimes it looks like patience, kindness and staying with something hard."
shortReversed: "Your inner steadiness may feel thin right now. Gentleness toward yourself could be a strong place to start."
meaningUpright: >-
  Strength is a card of courage, but not the loud kind. Its traditional image
  shows a figure calmly resting a hand on a lion, not overpowering it but
  soothing it. The strength here comes from patience, warmth and a steady
  presence that can meet wild energy, whether someone else's or your own,
  without panic.

  In everyday life this card may reflect staying calm in a tense conversation,
  keeping a promise when it has become inconvenient, or sitting with a strong
  feeling long enough to understand it rather than act on it straight away. It
  can point to the quiet confidence of someone who does not need to prove
  anything. Taming the lion is less about suppressing it and more about
  befriending it.

  This card invites you to consider how you respond to pressure. You might ask
  where compassion, including compassion for yourself, could be more effective
  than force. Strength suggests that softness and firmness can live together,
  and that the most lasting kind of courage is often steady, kind and
  persistent.
meaningReversed: >-
  Reversed, Strength may reflect a time when your usual steadiness feels harder
  to find. Patience might run out quickly, or you might hear an inner voice
  that is sharper and more critical than usual. The lion is restless, and so
  are you.

  This card can also point to courage turned inward and not yet expressed: you
  may be stronger than you feel, but doubting yourself has made it hard to
  show. Or it can reflect an effort to hold everything together through willpower
  alone, which tends to wear thin.

  You may want to notice how you speak to yourself when things are hard. What
  would change if you used the tone you would use with a frightened friend?
  Rebuilding courage often starts with small acts of self-kindness, and with
  asking for support when the load is heavy.
aspects:
  relationshipsUpright: >-
    In relationships, Strength can reflect patience and warmth that help people
    feel safe with you. It may invite you to meet someone's difficult moods with
    calm rather than matching their intensity, while still holding your own
    boundaries. Gentle firmness can build trust over time.
  relationshipsReversed: >-
    Reversed, this card may point to short tempers, or to someone swallowing
    their feelings to avoid conflict. You might consider whether you are being
    too hard on yourself or on someone close. Speaking up kindly, before
    frustration builds, can protect the connection and your own sense of
    steadiness.
  workUpright: >-
    At work or in a project, Strength highlights persistence and emotional
    maturity. It may reflect handling a demanding task or person with patience
    and grace, or leading by encouragement rather than pressure. You might trust
    that steady, consistent effort counts, even when no one is watching.
  workReversed: >-
    Reversed, Strength may reflect feeling worn down by pressure, or doubting
    your ability to cope with a challenge. It can also point to reacting sharply
    under stress. You might ask what support or rest would help you recover your
    footing, and how to set a pace you can keep.
  growthUpright: >-
    Strength suggests befriending your own inner lion rather than caging it:
    the strong feelings, desires and instincts that make you who you are.
    Rather than fighting them, you might get curious about what they need.
    Self-compassion is not weakness here; it is a practice that makes courage
    more sustainable.
  growthReversed: >-
    Reversed, Strength may be a reminder that confidence can dip and return. It
    can reflect a stretch of self-doubt or harsh inner criticizm. You might keep
    a short list of moments when you coped well, and read it on difficult days,
    as evidence of the steadiness you already have.
reflectionQuestions:
  - "What would gentle courage look like in the situation on your mind?"
  - "Whose difficult mood are you meeting, and how could you stay steady with them?"
  - "What kind words could you offer yourself today?"
imageryNote: >-
  Taro's Strength is imagined as a calm figure kneeling in a sunlit meadow
  beside a large lion, one hand resting on its mane while the animal leans in,
  relaxed and trusting. No ropes or chains appear; the bond is shown through
  closeness and ease. Wildflowers growing around both of them suggest that
  patience lets gentler things flourish. Warm golden light keeps the mood
  peaceful, showing power and gentleness side by side.
