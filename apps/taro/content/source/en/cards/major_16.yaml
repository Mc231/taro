cardId: major_16
reviewStatus: machine
element: fire
astrology: mars
name: The Tower
keywordsUpright:
  - sudden change
  - clearing away
  - breakthrough
  - shaken assumptions
  - truth revealed
keywordsReversed:
  - averting upheaval
  - slow unraveling
  - resisting change
  - rebuilding
shortUpright: "Something built on shaky ground may be shifting. This card invites you to notice what was not holding."
shortReversed: "Change may be arriving slowly rather than all at once. What could you rebuild more honestly?"
meaningUpright: >-
  The Tower is the card of sudden change. A structure that seemed solid is
  shaken, and what was hidden comes into view. It can feel unsettling, yet this
  card is less about disaster than about clearing: the moment when something
  that was not really working can no longer be ignored. What falls away is
  often what was built on assumptions rather than on firm ground.

  In everyday life this card may reflect an unexpected piece of news that
  changes your plans, a realization that turns your view of a situation upside
  down, or a moment when an old story you told yourself stops making sense. It
  can bring a flash of clarity, uncomfortable but useful, and a sense that
  things cannot go back to exactly how they were.

  This card invites you to consider what a shake-up might be showing you. You
  might ask which beliefs or arrangements were resting on shaky foundations,
  and what a sturdier structure could look like. The Tower highlights that
  after a clearing, there is room to rebuild in a way that reflects what you
  now know.
meaningReversed: >-
  Reversed, the Tower may reflect change that is happening more slowly, as a
  gradual unraveling rather than one sudden jolt. You might sense that
  something needs to shift but keep propping it up, hoping to avoid a larger
  disruption.

  This card can also point to the period after a big upheaval, when the dust is
  settling and the work of rebuilding begins. That stage can be quieter and
  more thoughtful than the moment of change itself.

  You may want to ask what you are holding together that might be ready to be
  redesigned. Could you make a small, deliberate change now rather than waiting
  for circumstances to force a larger one? If you are already rebuilding, what
  would you like to keep from before, and what would you like to do
  differently this time?
aspects:
  relationshipsUpright: >-
    In relationships, the Tower can reflect a sudden honest moment, such as a
    long-avoided conversation finally happening or an assumption about someone
    being overturned. It may feel unsettling, yet it can clear the air. You might
    consider what this new clarity makes possible, and what support you and
    others need to steady yourselves.
  relationshipsReversed: >-
    Reversed, this card may point to tension that has been building quietly, or
    to avoiding a difficult truth to keep the peace. You might consider whether
    naming something gently now could prevent a bigger rupture later. It can
    also reflect a bond being rebuilt on more honest ground after a hard
    period.
  workUpright: >-
    At work or in a project, the Tower highlights unexpected shifts: a change in
    plans, structures or priorities that asks you to adapt. It may also reflect
    a breakthrough idea that disrupts the usual way of doing things. You might
    focus on what you can influence and what the change makes room for.
  workReversed: >-
    Reversed, the Tower may reflect a project or system that everyone knows is
    fragile but no one addresses. You might ask whether a planned, gradual change
    would be kinder than waiting. It can also point to rebuilding after a
    disruption, with an opportunity to design something sturdier.
  growthUpright: >-
    For personal growth, this card invites you to let go of beliefs that no
    longer hold up. A sudden insight can feel disorienting, yet it often marks
    real progress. You might write down what you now see differently, and how
    you would like that new understanding to shape your choices.
  growthReversed: >-
    Reversed, the Tower may ask whether you are resisting an inner change that
    is already under way. It can reflect a gentle, gradual breakdown of old
    defenses. You might allow yourself to feel unsettled for a while, and be
    patient as you rebuild on firmer ground.
reflectionQuestions:
  - "Which belief or arrangement in your life might be resting on shaky ground?"
  - "What honest conversation might clear the air with someone close?"
  - "What would you like to rebuild differently, now that you know more?"
imageryNote: >-
  Taro's Tower is imagined as a tall, narrow stone tower on a rocky peak, its
  crown lifted off by a sudden bolt of light from a stormy sky. Sparks or small
  flames scatter like seeds in the wind, suggesting that what is released may
  carry new beginnings. The scene is drawn as a moment of illumination, bright
  against dark clouds, keeping the focus on clearing and insight rather than
  on harm to anyone.
