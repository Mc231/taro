cardId: swords_06
reviewStatus: machine
element: air
astrology: mercury_in_aquarius
name: Six of Swords
keywordsUpright:
  - transition
  - moving on
  - calmer waters
  - leaving the familiar
  - gradual change
keywordsReversed:
  - resisting change
  - unfinished business
  - a delayed departure
  - carrying old weight
  - returning to reflect
shortUpright: You may be moving from rough water toward calmer shores; change can be quiet and slow and still be real.
shortReversed: Something may be holding you on the old shore; you might notice what you are not yet ready to leave.
meaningUpright: >-
  The Six of Swords is a card of passage. A small boat crosses water, leaving
  choppy waves behind and heading for a quieter shore. The journey is not
  dramatic. It is steady, sometimes sad, often relieving.

  This card can reflect any transition from a harder chapter toward an easier
  one: finishing a difficult period at work, moving to a new place, stepping
  back from a draining situation, or simply feeling your thoughts begin to
  calm after a storm. The blades travel with the passengers, which suggests
  that some memories and lessons come along. You do not have to leave
  everything behind to move forward.

  This card invites you to notice the direction you are already heading,
  even if progress feels slow. You might ask who or what is helping you make
  the crossing, and whether you can accept that help. Transitions often mix
  relief with a little grief for what is left behind; both feelings can ride
  in the same boat. What would make this passage gentler for you?
meaningReversed: >-
  Reversed, the Six of Swords can reflect a transition that is delayed or
  resisted. You may know it is time to move on but feel held back by habit,
  practical ties, or uncertainty about what is waiting on the other side. The
  boat may be ready while you are still on the dock.

  Another reading is carrying too much from the old shore: worries, roles, or
  expectations that make the crossing heavier than it needs to be. Sometimes
  it can also point to going back briefly to finish something before you can
  truly leave.

  You might ask what you still need in order to move. Is it information,
  support, closure, or permission from yourself? Change can wait until you are
  ready, and readiness can also be built in small steps. What is one piece you
  could put down before setting out?
aspects:
  relationshipsUpright: >-
    In relationships, this card may point to moving through a hard stretch
    together toward calmer ground, or to gently stepping away from a pattern
    that no longer serves you. It can also reflect supporting someone close
    through their own transition. You might notice how quiet companionship,
    rather than solving, can help a person feel less alone as they cross.
  relationshipsReversed: >-
    Reversed, the Six of Swords can reflect difficulty leaving an old dynamic
    behind, or bringing past hurts into a new chapter. You might consider
    which expectations belong to an earlier relationship and not this one.
    Talking about what you both want to leave on the old shore can make the
    present feel lighter.
  workUpright: >-
    At work, this card can suggest a gradual shift: a new role, a changed
    team, or leaving a stressful project for steadier ground. The transition
    may not feel exciting, but it can bring relief. You might take stock of
    the skills and lessons you are bringing with you, and let go of habits
    that belonged only to the rough water.
  workReversed: >-
    Reversed, this card may reflect a change at work that keeps being put
    off, or unfinished tasks tying you to a situation you want to leave. You
    might list what truly needs completing and what could be handed over.
    Sometimes wrapping up a few loose ends is what finally lets the boat leave
    the dock.
  growthUpright: >-
    For personal growth, the Six of Swords invites you to honor slow
    progress. Moving away from an old way of thinking often happens over many
    small days rather than one bold leap. You might notice evidence that you
    are already calmer or wiser than you were, and give yourself credit for
    the distance traveled.
  growthReversed: >-
    Reversed, this card can reflect clinging to familiar patterns even when
    they no longer help, or rushing ahead without processing what happened.
    You might pause to look back once, deliberately, and name what you are
    taking with you and what you are ready to release. Then turn toward the
    water again.
reflectionQuestions:
  - What are you slowly moving away from, and what are you moving toward?
  - Who is helping you through this change, and how could you thank them?
  - What is one thing you could leave behind to make your journey lighter?
imageryNote: >-
  In the original art, a small boat glides from ruffled water toward a still,
  misty shore. Six blades stand upright in the boat like a quiet cargo, and a
  seated passenger faces forward. A long pole pushes steadily through the
  shallows. The changing water shows a shift from turmoil to calm, the blades
  suggest lessons carried along, and the pole points to patient,
  step-by-step movement.
