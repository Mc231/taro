cardId: wands_02
reviewStatus: machine
element: fire
astrology: mars_in_aries
name: Two of Wands
keywordsUpright:
  - planning ahead
  - wider horizons
  - bold intention
  - weighing options
  - personal vision
keywordsReversed:
  - staying in the familiar
  - fear of the unknown
  - unclear direction
  - planning without acting
  - rethinking the map
shortUpright: You stand at the edge of what you know, looking outward; this is a good moment to sketch where you might want to go.
shortReversed: Comfort and caution may be keeping a bigger plan on the shelf; you could look again at what holds you there.
meaningUpright: >-
  The Two of Wands follows the first spark with a pause for vision. The idea is
  no longer just a feeling; now you are standing somewhere a little higher,
  looking at the view and wondering how far it could reach. One staff is
  already planted behind you, a sign of what you have built, while the other
  is in your hand, ready to be carried somewhere new.

  This card often shows up when you are weighing a larger step: taking a course
  in another city, reshaping a role, starting a project that asks more of you
  than your usual routine. It can also reflect the restless feeling of having
  outgrown a space while still being fond of it.

  The invitation here is to plan with ambition and honesty at once. You might
  write down what you are hoping for, what it would cost in time and energy,
  and which first move is small enough to try. Looking far is useful; so is
  choosing the next step you can actually take.
meaningReversed: >-
  Reversed, the Two of Wands can reflect a plan that stays on paper. You may
  keep gazing at the horizon without packing a bag, because the familiar feels
  safer or because the destination is still fuzzy. Sometimes the hesitation is
  wise, and sometimes it is simply habit.

  This card may also point to plans made for someone else's approval, or to a
  vision that no longer fits who you are becoming. When a goal feels heavy
  rather than exciting, it can be worth asking whether it is still yours.

  You might revisit your map with fresh eyes. What would a smaller, more
  personal version of this plan look like? Which fear is loudest, and is it
  about the step itself or about what others might think? Naming it can make
  the next move feel less like a leap and more like a choice.
aspects:
  relationshipsUpright: >-
    In relationships, this card may invite a conversation about the future you
    are each imagining: where you want to live, how you want to spend your time,
    what you hope to explore. It can reflect a bond that feels like a secure
    base from which each person is free to look outward. You might ask someone
    close what horizon they are looking toward lately.
  relationshipsReversed: >-
    Reversed, you or someone close may be holding back a wish for change
    because it feels risky to say out loud. Plans can drift apart quietly when
    they are never shared. This may be a moment to talk about hopes that have
    been kept private, listening as much as speaking, so that neither of you is
    planning alone.
  workUpright: >-
    At work, the Two of Wands can point to strategic thinking: mapping the
    next stage of a project, considering a new field, or shaping a longer-term
    goal. You might spend some time on the bigger picture before diving back
    into daily tasks, and then choose one concrete action that moves the plan
    from the whiteboard into motion.
  workReversed: >-
    Reversed, a plan at work may be stuck between comfort and ambition, or
    shaped more by what seems expected than by what you want. You might check
    whether the goal still motivates you. If it does, breaking it into a first
    small experiment can help; if it does not, redrawing the plan is also a
    valid way forward.
  growthUpright: >-
    For personal growth, this card invites you to take your own ambitions
    seriously. What would you explore if you gave yourself permission to think
    beyond your usual limits? You might sketch a rough picture of the next year
    or two, not as a fixed promise, but as a direction that helps you notice
    opportunities when they appear.
  growthReversed: >-
    Reversed, the wish for security and the wish for growth may be pulling in
    different directions. Both are real needs. You might explore what would
    make a new step feel safe enough to try, and what kind of support,
    practice or information could turn a distant idea into something you can
    approach gradually.
reflectionQuestions:
  - When you look past your current routine, what do you find yourself longing to explore?
  - Whose support would make a bigger step feel more possible, and have you told them about it?
  - What is the smallest first move that would test this plan in real life?
imageryNote: >-
  A figure stands on a high wall or ledge, one staff fixed firmly beside them
  and a second held loosely in hand, gazing toward distant land or sea. A small
  globe, map or compass rests nearby. The fixed staff stands for what has
  already been built, the raised one for the choice to go further. The wide
  view invites the viewer to imagine many possible routes rather than a single
  set path.
