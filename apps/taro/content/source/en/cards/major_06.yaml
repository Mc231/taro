cardId: major_06
reviewStatus: machine
element: air
astrology: gemini
name: The Lovers
keywordsUpright:
  - connection
  - meaningful choice
  - alignment of values
  - honesty
  - mutual respect
keywordsReversed:
  - inner conflict
  - misalignment
  - avoided decision
  - reconnecting with values
shortUpright: "A choice made from the heart and the head together, in line with what you truly value."
shortReversed: "Part of you may want one thing and part another. This card invites you to listen to both before choosing."
meaningUpright: >-
  The Lovers is often read as a card of romance, but its deeper theme is
  alignment: the meeting of two parts, two people or two paths in a way that
  feels whole. It asks what you value most, and whether the choices in front of
  you reflect it. Connection here is both with others and with yourself.

  In everyday life this card may reflect a relationship where you feel truly
  seen, a partnership at work where ideas flow easily, or a decision that
  requires you to say clearly what matters to you. It can point to a moment of
  choosing between two good options, where there is no obvious right answer,
  only the one that fits who you are becoming.

  This card invites you to consider how honest you are being with yourself and
  others. You might ask what you are drawn toward and why, and what you are
  willing to commit to. The Lovers highlights that meaningful choices are rarely
  about perfection. They are about bringing your heart and your judgment into
  the same room and letting them talk.
meaningReversed: >-
  Reversed, the Lovers may reflect a sense of being pulled in two directions.
  What you want and what you think you should want might not match, or a close
  bond may feel slightly out of tune, with each person valuing different things
  without saying so.

  This card can also point to a decision that keeps being postponed, perhaps
  because choosing one option means letting go of another. Avoiding the choice
  can feel easier in the short term while quietly draining energy.

  You may want to write down what each option honestly offers and asks of you,
  and which of your values it supports. It can help to notice where you feel
  most like yourself. Realignment often begins with a small, truthful admission,
  first to yourself and then, if it feels right, to someone else.
aspects:
  relationshipsUpright: >-
    In relationships, the Lovers can reflect deep mutual understanding and the
    pleasure of choosing each other, whether in romance, friendship or family.
    It may invite you to share what you truly value and to listen to what the
    other person values too. Closeness grows when both people can be honest and
    still feel welcome.
  relationshipsReversed: >-
    Reversed, this card may point to a gap between two people's hopes or
    priorities, or to feelings that have not been voiced. You might consider
    whether you are adapting too much to keep the peace, or expecting someone to
    guess what you need. An open, kind conversation about values could help you
    both see where you stand.
  workUpright: >-
    At work or in a project, the Lovers highlights collaboration and choices
    rooted in your values. It may reflect a partnership that brings out the good
    in both people, or a decision about which direction to follow. You might ask
    which option feels meaningful as well as practical, and let both count in
    your choice.
  workReversed: >-
    Reversed, the Lovers may reflect friction in a partnership or a sense that
    your work does not match what you care about. It can also point to hesitation
    over a choice between two paths. You might list what each path would ask of
    you, and notice which one you feel more willing to give that to.
  growthUpright: >-
    Knowing your own values more clearly is the inner work this card points toward. When you understand what matters to you, choices become less about
    pleasing others and more about staying true to yourself. You might write down
    three values and notice where they already guide your days.
  growthReversed: >-
    Reversed, the Lovers can reflect inner conflict: part of you wanting change,
    part wanting comfort. Neither part is wrong. You might give each a voice, on
    paper or in conversation, and see if there is a choice that honors both,
    even if only partly.
reflectionQuestions:
  - "Which of your values feels most important to honor right now?"
  - "Where in a close relationship could you be a little more honest about what you want?"
  - "What choice have you been postponing, and what would help you make it?"
imageryNote: >-
  Taro's Lovers is imagined as two figures standing on either side of a narrow
  stream, reaching to clasp hands across it, drawn so that anyone can see
  themselves in either figure. Above them, two birds circle in the same bright
  sky. On one bank grows a fruit tree and on the other a flowering vine, two
  different gifts meeting in the middle. The stream suggests the choice and the
  effort that real connection asks of both people.
