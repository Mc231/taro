cardId: major_13
reviewStatus: machine
element: water
astrology: scorpio
name: Death
keywordsUpright:
  - endings
  - transformation
  - clearing space
  - closing a chapter
  - release
keywordsReversed:
  - holding on
  - resisting change
  - lingering endings
  - slow transition
shortUpright: "A phase may be closing. This card invites you to notice what is ending and the space it leaves."
shortReversed: "Something may be ready to end while part of you holds on. What would help you loosen your grip?"
meaningUpright: >-
  Despite its name, this card is not about physical death. It speaks of
  endings in the ordinary, human sense: the close of a phase, a role, a habit
  or a way of seeing yourself. Like autumn clearing the branches before new
  growth, it suggests that some things need to finish for others to begin.

  In everyday life this card may reflect moving out of a home, finishing a
  course, stepping away from a project or noticing that an old version of you
  no longer fits. It can bring a mix of feelings: relief, sadness, uncertainty,
  even excitement. All of them are natural. Transformation is rarely neat, and
  it often takes time to understand what a change has made possible.

  This card invites you to consider what is ready to be released. You might ask
  what you are still carrying out of habit, and what space could open if you
  set it down. Death highlights that endings, even welcome ones, deserve
  acknowledgement. Honoring what has been can make it easier to turn toward
  what might come next.
meaningReversed: >-
  Reversed, Death may reflect an ending that is taking its time. You might sense
  that a phase is over while still holding on to it, perhaps because the
  familiar feels safer than the unknown, or because letting go feels like
  losing part of yourself.

  This card can also point to a transition happening slowly and quietly, below
  the surface, rather than in one clear moment. Not every change arrives with a
  clean break.

  You may want to notice what you are clinging to and what the clinging is
  protecting. Small rituals of closure, such as writing a goodbye letter you do
  not send, clearing a drawer or marking a last day, can help. There is no need
  to rush. Allowing yourself to grieve what is ending can make the release feel
  gentler.
aspects:
  relationshipsUpright: >-
    In relationships, this card can reflect a significant change in how a bond
    works: a new stage, a shift in roles, or the end of a pattern that no longer
    helped either person. It does not point to anyone's physical wellbeing. It
    may invite you to acknowledge what is changing together, with honesty and
    care.
  relationshipsReversed: >-
    Reversed, this card may point to holding on to an old dynamic that both
    people have outgrown, or to difficulty accepting that a connection has
    changed. You might consider what you would need to let the relationship take
    its new shape, whatever that shape turns out to be.
  workUpright: >-
    At work or in a project, Death highlights completion and transition. It may
    reflect finishing a role, closing a project or retiring a way of working that
    has run its course. You might take stock of what you have learned and what
    you want to carry forward into the next chapter.
  workReversed: >-
    Reversed, Death may reflect staying with a task, role or method out of habit
    after it has stopped fitting. It can also point to fear of what comes after.
    You might list what the current situation still gives you and what it costs,
    and notice what the balance tells you.
  growthUpright: >-
    Old identities can fall away like leaves, making room for what is still forming.
    You might notice beliefs about yourself that were true once but are not
    true now. Releasing them can create room for a version of you that is more
    honest to who you are becoming.
  growthReversed: >-
    Reversed, Death may ask whether fear of change is keeping you in a smaller
    space than you need. It can reflect a slow, patient transformation that
    deserves your trust. You might choose one small thing to let go of this week
    and notice how it feels afterward.
reflectionQuestions:
  - "What chapter of your life feels as if it is quietly closing?"
  - "Which old pattern in a close relationship might be ready to change?"
  - "What small ritual could help you mark an ending with care?"
imageryNote: >-
  Taro's Death is imagined as a quiet autumn landscape where a slow river
  carries fallen leaves toward a rising sun on the horizon. A cloaked,
  unhurried figure walks beside the water, carrying a single seed pod or
  bare branch, symbols of what ends and what waits to grow. A white flower on
  a dark background can suggest renewal within release. The mood is calm and
  respectful, pointing to transformation rather than loss.
