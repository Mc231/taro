name: Knight of Cups
keywordsUpright:
  - romance
  - idealism
  - following the heart
  - invitation
  - charm
keywordsReversed:
  - moodiness
  - unrealistic ideals
  - unkept promises
  - grounding a dream
shortUpright: A heartfelt idea or invitation may be moving toward you; this card invites you to follow what you care about with grace.
shortReversed: Feelings may be running ahead of reality; consider which promises and dreams you can actually carry through.
meaningUpright: >-
  The Knight of Cups rides at an unhurried pace, holding a cup out in front as though bringing an offering. Unlike the other knights, this one is not charging ahead. They move through life guided by feelings, ideals and a wish to create beauty or connection.

  This card can reflect romance in its broad sense: being moved by people, art, causes or ideas, and wanting to act on that feeling. It may point to an invitation, a creative proposal or a gesture of affection. It can also describe your own ability to follow your heart while still moving forward.

  In everyday life, this might look like pursuing a passion project, expressing admiration for someone, or making a choice based on what feels meaningful rather than what is most efficient. The card invites you to honor your ideals and bring them into action with gentleness. You might ask what you would offer the world if you trusted your heart a little more, and what a graceful first step could be.
meaningReversed: >-
  Reversed, the Knight of Cups may reflect ideals that have drifted away from reality, or feelings that change too quickly to build on. You might notice promises made in a warm moment that are hard to keep, or a tendency to fall for the idea of something more than the thing itself.

  It can also turn inward: a creative or romantic impulse that is waiting for more maturity, or a mood that needs understanding before it can guide action.

  This card invites you to pair your heart with steadiness. What do you genuinely want, once the glow settles? You might check whether your words and actions line up, and slow down commitments until they feel sustainable. Dreams can stay beautiful while becoming more grounded.
aspects:
  relationshipsUpright: >-
    In relationships, the Knight of Cups may reflect warmth, romance or a heartfelt gesture, whether with a partner, a friend or someone new. It can invite you to express your feelings sincerely and creatively. You might notice what it feels like to lead with kindness and to let your actions match your words.
  relationshipsReversed: >-
    Reversed, this card may point to mixed messages, moodiness or idealizing someone. You might ask whether feelings are being expressed clearly and consistently, by you and by the other person. Grounding romance in everyday reliability, like keeping small promises, can build deeper trust over time.
  workUpright: >-
    At work, this card can reflect a creative proposal, an idea driven by passion or a role that lets you use your imagination and empathy. It may invite you to pitch something you care about, or to bring more heart to your current tasks. Enthusiasm can be contagious when it is paired with follow-through.
  workReversed: >-
    Reversed, the card may reflect ideas that stay at the pitching stage, or motivation that rises and falls with your mood. You might break a big vision into smaller steps you can keep. Being honest about your capacity can protect both your ideals and the trust others place in you.
  growthUpright: >-
    For personal growth, the Knight of Cups invites you to follow what moves you. You might try a creative or compassionate activity simply because it matters to you. Noticing what stirs your heart can clarify your values and help you live by them in ordinary, daily ways.
  growthReversed: >-
    Reversed, this card may ask you to explore the gap between how you imagine yourself and how you act. You might notice a pattern of starting with enthusiasm and then fading. Building gentle routines around your passions can help them last beyond the first rush of feeling.
reflectionQuestions:
  - What are you drawn toward right now, and what does it say about your values?
  - Where could your words and actions line up more closely with someone you care about?
  - What graceful first step could you take toward something that moves you?
imageryNote: >-
  The art shows a rider on a calm horse, moving slowly along a riverbank or through a quiet valley, a cup held forward as an offering. Wave or shell motifs on their armor and cloak can suggest imagination and emotional depth. Flowing water nearby echoes the movement of feeling. Soft blues and silvers, with a touch of warm color, convey romance, sincerity and a dreamy sense of purpose.
