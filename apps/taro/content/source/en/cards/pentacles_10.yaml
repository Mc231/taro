cardId: pentacles_10
reviewStatus: machine
element: earth
astrology: mercury_in_virgo
name: Ten of Pentacles
keywordsUpright:
  - legacy
  - belonging
  - lasting foundations
  - generations
  - shared roots
keywordsReversed:
  - inherited pressure
  - family tension
  - unstable foundations
  - redefining home
shortUpright: Something built to last may be coming into view. Notice the roots, traditions and people that make you feel part of something larger.
shortReversed: Old structures or expectations may feel heavy. You might consider which traditions to keep and which to reshape for yourself.
meaningUpright: >-
  The Ten of Pentacles completes the suit's journey from a single seed to a
  whole household. Its traditional scene gathers several generations in one
  place, with a home, an archway, animals and coins woven into the setting. It
  speaks of foundations that outlast any single moment: belonging, shared
  history, and the long-term care that makes a place feel like home.

  You might recognize this in a family gathering, a chosen family or community
  that has grown around you, traditions passed down, or a sense that your
  daily efforts contribute to something that will matter beyond this year.
  Legacy here is not about wealth alone. It includes stories, values, recipes,
  skills and ways of being together.

  The card invites you to reflect on what you have inherited and what you hope
  to pass on. You might ask which roots nourish you, what kind of foundation you
  are building, and how you could spend your time on relationships and
  practices that feel lasting.
meaningReversed: >-
  Reversed, the Ten of Pentacles may reflect tension within the structures that
  surround you: family expectations that feel heavy, traditions that no longer
  fit, or disagreements about shared resources and responsibilities. It can
  also point to a sense that the foundations you rely on are less solid than
  they seemed.

  This is often an invitation to revisit rather than reject. You get to decide
  which parts of your inheritance, practical or emotional, you carry forward.

  You might name one expectation you have been living by that was never truly
  yours. What would it look like to honor your roots while shaping home on
  your own terms? Clear, kind conversations about roles and plans can help
  strengthen what matters and gently loosen what does not.
aspects:
  relationshipsUpright: >-
    In relationships this card may reflect deep belonging: the bonds of family,
    chosen family or long friendship that give you a sense of continuity. You
    might notice the traditions and shared stories that hold your circle
    together, and consider how to nurture them, perhaps by starting a new ritual
    or preserving an old one.
  relationshipsReversed: >-
    Reversed, the card may point to strain around family roles, obligations or
    differing values across generations. You might reflect on which expectations
    you want to meet and which you would like to renegotiate. Setting a caring
    boundary can sometimes protect a relationship rather than harm it.
  workUpright: >-
    At work the Ten of Pentacles can suggest building something with long-term
    value, such as an organization, a body of work, or a role that supports
    others. You might consider the legacy of your effort: what you are
    contributing that others could build on, and how you could document or share
    it.
  workReversed: >-
    Here the card may reflect pressure to follow an inherited path, a workplace
    culture that feels out of step with your values, or instability in a
    structure you depended on. You might reflect on what kind of foundation you
    want your work to rest on, and which small changes could move you toward it.
  growthUpright: >-
    For personal growth this card invites you to explore your roots: the values,
    habits and stories that shaped you. You might write down a few you are
    grateful for and consider how you want to carry them forward. Growth can mean
    both honoring where you come from and deciding what you pass on.
  growthReversed: >-
    Reversed, the card may reflect patterns inherited without choosing them, or a
    feeling of not quite belonging anywhere. You might gently examine one family
    or cultural script you still follow. Recognizing it clearly can give you room
    to keep what nourishes you and rewrite what does not.
reflectionQuestions:
  - What have you inherited, in values, habits or stories, that you want to keep?
  - Who makes you feel a sense of belonging, and how could you nurture that bond?
  - What kind of foundation are you building that could support others in time?
imageryNote: >-
  The art may gather people of different ages beneath an archway leading into a
  home or courtyard, with animals resting nearby and ten coins arranged in a
  pattern across the scene. The archway can symbolize a threshold between
  private and shared life, the mix of ages continuity, and the patterned coins
  a structure built over time. Warm, settled colors may suggest belonging,
  while the busy composition hints at the complexity inside every household.
