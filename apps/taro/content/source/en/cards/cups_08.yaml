  - inner search
  - moving on
keywordsReversed:
  - fear of leaving
  - indecision
  - staying to try again
  - aimless drifting
shortUpright: Something may no longer fill you, even if it looks complete; this card invites you to notice where your heart is pulling next.
shortReversed: You may be torn between staying and going; consider what you would need to know before choosing either one.
meaningUpright: >-
  The Eight of Cups often shows a figure walking away from a neat row of cups, heading toward open ground under a night sky. The cups are not broken or spilled. It is simply that something about them no longer satisfies, and the figure has decided to look for what is missing.

  This card speaks to the quiet courage of leaving something that seems fine from the outside: a role, a routine, an identity or a way of living that has stopped feeling true. It is often less a dramatic exit than a slow recognition that you have outgrown something.

  In daily life, it may reflect wanting more meaning from your work, needing time alone to think, or stepping back from a situation that drains you. The card invites you to take that longing seriously. Walking away does not have to be sudden or permanent; it can be a trial distance, a pause of the mind. You might ask what you are really searching for, and what you are willing to leave behind to find it.
meaningReversed: >-
  Reversed, the Eight of Cups may reflect being caught between staying and leaving. You might sense that something is not right but feel unsure whether to move on or try again. Fear of the unknown, or loyalty to what you have built, can keep you in place.

  It can also point to the opposite pattern: leaving again and again, drifting from one thing to the next without giving anything the chance to deepen.

  This card invites you to slow down and look at the choice more closely. What would staying look like if it were chosen rather than defaulted to? What would leaving require? You might talk it through with someone you trust, or set a gentle deadline for deciding. Whichever direction you choose, making the choice deliberately can bring a sense of peace.
aspects:
  relationshipsUpright: >-
    In relationships, this card may reflect a wish for more depth, or a recognition that a bond has run its course in its current form. It can invite honest reflection on what you need that is missing. Stepping back might mean a conversation about change, more personal space or, sometimes, choosing a different kind of connection.
  relationshipsReversed: >-
    Reversed, the Eight of Cups may reflect hesitation about a relationship that feels unfulfilling, or a pattern of withdrawing whenever closeness grows. You might ask whether you are staying from love or from fear, and whether you are leaving from need or from habit. Clear, kind communication can help either way.
  workUpright: >-
    At work, this card can reflect a desire for more purpose, even when everything looks stable. It may invite you to explore what would feel more meaningful, perhaps by trying a new area, learning something different or reshaping your current role. Moving on can be an inner shift long before it becomes an outer one.
  workReversed: >-
    Reversed, the card may reflect feeling stuck in a job or project you have outgrown, or jumping between roles without settling. You might list what you would miss and what you would gladly leave. Consider whether a change of approach, rather than a change of place, could meet the need you are feeling.
  growthUpright: >-
    For personal growth, the Eight of Cups invites a journey inward. You might set aside time to reflect on what gives your life meaning now, as opposed to what did before. Walking, journaling or a short break from routine can help you hear what you are ready to move toward.
  growthReversed: >-
    Reversed, this card may ask you to notice patterns of avoidance or restlessness. Are you leaving situations to escape discomfort, or staying to avoid change? You might practice sitting with uncertainty a little longer before acting. Understanding your own pattern can make future choices clearer and kinder.
reflectionQuestions:
  - What in your life looks complete but no longer feels fulfilling?
  - What are you searching for that your current situation does not offer?
  - What small step could help you explore a change without committing to it yet?
imageryNote: >-
  The art shows a lone figure with a walking staff, seen from behind as they leave a careful stack of cups on the shore. Ahead lie rising hills and a winding path under a thin crescent moon. A visible gap in the stacked cups can suggest something incomplete. Deep blues and silvers evoke introspection and the quiet pull toward what has not yet been explored.
