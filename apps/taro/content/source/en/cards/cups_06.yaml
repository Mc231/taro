shortUpright: A memory or a simple kindness may bring warmth today; this card invites you to notice what the past still gives you.
shortReversed: The past may be pulling harder than usual; consider which memories nourish you and which keep you from the present.
meaningUpright: >-
  The Six of Cups is a card of memory and gentle kindness. It often shows one figure offering a cup of flowers to another, a gesture that is simple, generous and free of calculation. It can bring to mind childhood, old friends, familiar places or a time when things felt easier.

  In daily life, this card might reflect reconnecting with someone from your past, returning to a hobby you once loved, or finding comfort in a song, a recipe or a smell that carries you back. It can also point to small acts of kindness given and received without expectation.

  The invitation is to let the past offer what it can: warmth, perspective, a reminder of who you have always been. Nostalgia can be a resource when it helps you remember what matters to you. You might ask which quality from an earlier time you would like to bring into the present, such as playfulness, curiosity or ease.
meaningReversed: >-
  Reversed, the Six of Cups may suggest that memory has become a place to hide rather than a place to visit. You might find yourself comparing the present unfavorably with an idealized version of the past, or holding onto old patterns and roles that no longer fit.

  It can also point the other way: a readiness to grow beyond something from your history, leaving an old story behind so a new one can begin.

  This card invites you to look at the past with kindness and honesty together. What really happened, and what have you added in remembering it? You might keep the parts that nourish you and loosen your grip on those that keep you small. Growing up does not mean losing tenderness; it can mean bringing it with you into choices that belong to today.
aspects:
  relationshipsUpright: >-
    In relationships, the Six of Cups may reflect a reunion, a shared memory or a friendship with deep roots. It can invite playfulness and simple gestures, such as a note, a shared snack or an old photo sent with a smile. You might notice how shared history creates trust, and how you could add new memories together.
  relationshipsReversed: >-
    Reversed, this card may point to a bond held together mainly by the past, or to comparing someone with who they used to be. You might consider whether you are relating to the person in front of you now, or to an older picture of them. Letting each other change can keep a connection alive and honest.
  workUpright: >-
    At work, this card can reflect returning to something you enjoyed early on, mentoring someone newer or drawing on old skills in a fresh way. It may invite you to bring simple goodwill into the workplace. Small courtesies, like offering help before you are asked, often shape a culture more than big statements do.
  workReversed: >-
    Reversed, the card may reflect clinging to how things used to be done, or resisting a change because the old way feels safer. You might ask which traditions still serve the work and which are kept out of habit. Respecting the past while making room for new approaches can ease a transition for everyone.
  growthUpright: >-
    For personal growth, the Six of Cups invites you to reconnect with the curiosity and delight of your younger self. You might revisit an activity you loved as a child, with no goal but enjoyment. Remembering what once made you feel light and unhurried can guide choices about how you spend your time now.
  growthReversed: >-
    Reversed, this card may ask you to update an old story about yourself. Perhaps a label from childhood still shapes how you see your abilities. You might write down one belief from the past and ask whether it is still true. Letting it go can make room for who you are becoming.
reflectionQuestions:
  - Which memory brings you comfort, and what does it remind you to value?
  - Who from your past would you like to reconnect with, and why?
  - What part of an old story about yourself might be ready to change?
imageryNote: >-
  The art shows two small figures in a sheltered courtyard or garden, one offering a cup filled with flowers to the other. Other cups nearby, each holding blossoms, suggest memories planted and still growing. An old wall or a doorway in the background can stand for home and the protection of familiar places. Warm, soft colors convey innocence, generosity and the easy trust of earlier days.
