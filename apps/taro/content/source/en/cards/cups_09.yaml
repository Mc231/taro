shortUpright: A moment to savor what is already good, and to notice how much of it you helped bring about.
shortReversed: Something may look satisfying without feeling so; consider what would bring you contentment from the inside.
meaningUpright: >-
  The Nine of Cups is often called the wish card. It shows a figure at ease among full cups, clearly pleased with what they have. It speaks to contentment: the feeling of enough, of a wish met or a hope that came to something.

  This card invites you to notice satisfaction when it is present, instead of moving straight to the next goal. Perhaps you finished something you worked hard on, enjoyed a good meal with people you like, or simply feel at ease in your life for a moment. These experiences are worth savoring.

  It can also invite you to reflect on what you truly wish for. If you could pour one more cup, what would it hold? Knowing your wishes clearly can shape choices in small, practical ways. Enjoying pleasure and comfort is part of a full life. Gratitude, in this sense, is not about feeling you should be happy; it is about noticing what is already good and letting it count.
meaningReversed: >-
  Reversed, the Nine of Cups may reflect a gap between how things look and how they feel. You might have what you thought you wanted and still sense something missing. Or pleasure may have tipped into excess, with comfort becoming a way to avoid feelings rather than enjoy life.

  It can also turn inward, suggesting that lasting contentment is less about possessions or achievements and more about your relationship with yourself.

  This card invites honest reflection. What did you expect this wish to bring, and what did it actually bring? You might look for satisfaction in values, connection and meaning as well as in results. Small, sincere pleasures, chosen with care, may offer more than accumulating more. It is fine to want things; the question is what would feel like enough.
aspects:
  relationshipsUpright: >-
    In relationships, the Nine of Cups may reflect feeling content and at ease with the people around you. It can invite you to enjoy a connection as it is, sharing pleasures and saying what you appreciate. You might notice what a satisfying bond looks like for you, so you can nurture it with intention rather than by chance.
  relationshipsReversed: >-
    Reversed, this card may point to expecting a relationship to supply all your contentment, or to feeling that something is missing despite outward harmony. You might explore which needs you could meet for yourself, and what you would like to ask for more openly from someone close.
  workUpright: >-
    At work, this card can reflect satisfaction with an achievement, recognition for effort or simply enjoying what you do. It may invite you to pause and acknowledge the progress you have made. Celebrating a milestone, even privately, can restore energy for whatever comes next and remind you why the work matters.
  workReversed: >-
    Reversed, the card may reflect success that feels hollow, or chasing markers of achievement that do not reflect what you value. You might ask what would make your work feel meaningful, not just impressive. Aligning goals with your values can turn accomplishment into genuine satisfaction.
  growthUpright: >-
    For personal growth, the Nine of Cups invites a practice of gratitude and enjoyment. You might end each day by noting three things that felt good, however small. Over time, this can train your attention toward contentment and make it easier to recognize when you have enough.
  growthReversed: >-
    Reversed, this card may ask you to examine the difference between pleasure and fulfillment. You might notice habits of consumption, busyness or comparison that leave you wanting more. Exploring what brings deep satisfaction, rather than a quick lift, can guide gentler and more lasting choices.
reflectionQuestions:
  - What in your life right now feels like enough?
  - Which wish have you been holding, and what do you hope it would bring you?
  - How could you savor something good this week without rushing to the next goal?
imageryNote: >-
  The art shows a figure seated at ease, shoulders relaxed, with nine full cups set around them on low tables and cushions, like a room prepared for guests. Their open, satisfied expression suggests pleasure and self-assurance. Rich but warm colors, perhaps deep reds and golds, can evoke comfort and hospitality, a gentle reminder of a hope that has found some form.
