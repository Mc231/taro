cardId: pentacles_06
reviewStatus: machine
element: earth
astrology: moon_in_taurus
name: Six of Pentacles
keywordsUpright:
  - giving and receiving
  - generosity
  - fair exchange
  - mutual support
keywordsReversed:
  - uneven exchange
  - strings attached
  - giving too much
  - rebalancing
shortUpright: Resources, time and care are moving between people. Notice how you give, how you receive and what feels fair to everyone.
shortReversed: An exchange may feel lopsided. You might look at what is given, what is expected in return and what would feel more even.
meaningUpright: >-
  The Six of Pentacles shows a figure holding scales while sharing coins with
  others. It is a card about the flow of resources between people: money, yes,
  but also time, attention, advice, patience and practical help. The scales
  suggest care about fairness, and the open hand suggests willingness to share.

  You may be in a position to give right now, offering help to a friend,
  mentoring someone, or supporting a cause that matters to you. Or you might be
  on the receiving end, accepting a favor, a helping hand or a second chance.
  Both roles carry their own grace, and most of us move between them over time.

  This card invites you to reflect on the spirit of your exchanges. Does your
  giving come freely, or with quiet expectations? Can you receive without
  feeling small? You might notice where generosity creates real connection, and
  where a little more balance or honesty would let everyone involved feel
  respected.
meaningReversed: >-
  Reversed, the Six of Pentacles may point to an exchange that has become
  uneven. One person might give far more than they receive, or help might come
  with unspoken strings: gratitude expected, choices influenced, a sense of
  owing. It can also reflect difficulty receiving at all, as if accepting help
  meant losing standing.

  This is an invitation to revisit the scales without blame. Imbalance often
  grows quietly, through habit rather than intent.

  You might look at one relationship or arrangement where giving and receiving
  feel off. Is there something you have been giving that has become draining?
  Is there support you have been refusing? Naming expectations clearly, or
  adjusting how much you offer, can restore an exchange that feels fair and
  freely chosen on both sides.
aspects:
  relationshipsUpright: >-
    In relationships this card may reflect generous, mutual care: support that
    flows both ways over time, even when it is not equal on any given day. You
    might notice how you show care in practical ways and how you let others care
    for you. Thanking someone specifically for what they give can keep that flow
    warm and visible.
  relationshipsReversed: >-
    Reversed, the card may suggest a bond where one person feels they give more,
    or where help carries obligation. You might gently raise how the balance
    feels to you, without keeping score. Sometimes the kindest change is to ask
    for what you need, or to let someone offer help without insisting on paying
    it back straight away.
  workUpright: >-
    At work this card can describe sharing knowledge, mentoring, fair
    recognition or collaborative support. You might be in a position to open a
    door for someone, or to accept guidance gracefully. It invites you to notice
    how resources and credit are shared around you, and how you could contribute
    to a fairer flow.
  workReversed: >-
    Here the card may reflect effort that goes unrecognized, favors that create
    pressure, or unclear expectations around what is owed. You might clarify
    agreements, speak up about your contributions, or notice where you give extra
    labor by default. Fair exchange at work often begins with making the
    invisible visible.
  growthUpright: >-
    For personal growth the Six of Pentacles invites you to explore your own
    relationship with generosity. Where does giving feel joyful? Where does
    receiving feel comfortable? You might practice one small act of generosity
    this week and one act of receiving, noticing what each brings up in you.
  growthReversed: >-
    Reversed, the card may reflect giving as a way to feel worthy, or refusing
    help to stay in control. You might explore where these patterns began and
    whether they still fit. Allowing yourself to be on both sides of the scales
    can deepen self-respect and trust.
reflectionQuestions:
  - Where do you tend to give most freely, and where do you hold back?
  - Which exchange in your life feels uneven, and what would make it feel fairer?
  - How could you receive help from someone this week without feeling you owe them?
imageryNote: >-
  The art may center on a standing figure holding a balanced pair of scales in
  one hand while the other offers coins to people nearby. Six coins can be
  arranged around the scene, some in hands and some in the air between them.
  The scales can symbolize fairness and consideration, the outstretched hand
  generosity, and the differing positions of the figures the question of power
  that can sit quietly inside any exchange.
