cardId: swords_02
reviewStatus: machine
element: air
astrology: moon_in_libra
name: Two of Swords
keywordsUpright:
  - a difficult choice
  - stalemate
  - weighing options
  - guarded balance
  - pausing to decide
keywordsReversed:
  - information surfacing
  - indecision easing
  - avoidance
  - pressure to choose
  - opening the eyes
shortUpright: Two options balance each other for now; you might notice what you are keeping out of view to hold the peace.
shortReversed: The pause may be ending; something you avoided looking at could be asking for a gentle, honest glance.
meaningUpright: >-
  The Two of Swords describes a held position between two paths. Neither
  option is clearly right, so you keep them balanced, arms crossed, waiting.
  This can be a wise pause, a moment to breathe before choosing. It can also
  be a way of not looking at something that would make the choice clearer.

  You might recognize this card in a decision you keep postponing, a
  disagreement where you have chosen not to take a side, or a truce with
  yourself about a question you do not want to face yet. Calm on the surface
  can hide a lot of effort underneath; holding two heavy things still is
  tiring.

  This card invites you to consider what the stillness is protecting. Is it
  giving you time to gather information, or keeping you from information you
  already have? You may want to name each option plainly, including what you
  feel about it, not just what you think. Sometimes the balance shifts as soon
  as one hidden feeling is allowed into the light, and the next step becomes
  easier to take.
meaningReversed: >-
  Reversed, the Two of Swords can reflect a stalemate that is starting to
  loosen. The blindfold slips; something you avoided may be coming into view,
  whether you feel ready or not. This can bring relief, and it can also bring
  a rush of feelings you had set aside.

  Another reading is the balance tipping from too little movement to too much
  pressure: others pushing you to choose before you have had time to think, or
  a decision made quickly just to end the discomfort of waiting.

  You might ask what you now know that you did not let yourself know before.
  There is no need to leap; you can take in the new view slowly. Which choice
  looks different once you let yourself see it fully, and what would a
  thoughtful next step look like from here?
aspects:
  relationshipsUpright: >-
    In relationships, this card may point to a quiet standoff: two people
    avoiding a topic to keep things calm, or you holding back your view to
    stay neutral between others. Peace kept this way can feel fragile. You
    might consider whether a gentle, honest conversation could replace the
    careful silence, and what you would want to say if you did not have to
    guard both sides at once.
  relationshipsReversed: >-
    Reversed, the Two of Swords can reflect a truce ending. Feelings that were
    tucked away may surface, or someone may ask you to finally say where you
    stand. This can feel uncomfortable, and it can also make room for more
    honesty. You may want to share what you have been holding in small, clear
    pieces rather than all at once.
  workUpright: >-
    At work, this card can reflect a decision on hold: two approaches, two
    offers of your time, or two priorities that seem equally pressing. Waiting
    may be sensible if you need more facts. You might list what each option
    would ask of you and what it would give, and notice which list you find
    yourself avoiding. That reluctance can be useful information too.
  workReversed: >-
    Reversed, the stalled choice may be moving again, sometimes because a
    deadline or new detail forces the question. You might feel rushed. It can
    help to separate what truly needs deciding today from what can wait a
    little longer. If you have been avoiding a piece of information, this may
    be the moment to look at it directly and let it guide you.
  growthUpright: >-
    For personal growth, the Two of Swords invites you to notice how you
    protect yourself from hard feelings by staying still. Stillness can be
    restful; it can also be a way of not feeling. You might try sitting with
    each option for a few minutes and paying attention to your body's response
    as well as your reasoning. Both kinds of knowing matter.
  growthReversed: >-
    Reversed, this card may reflect a turning point in self-honesty. Something
    you kept at arm's length is closer now. You might approach it with
    curiosity rather than judgment, taking it in at your own pace. Opening
    your eyes does not mean you must act at once; it means you are choosing to
    see clearly before you decide.
reflectionQuestions:
  - What are you keeping out of view so that a decision can stay balanced?
  - Where are you holding a careful peace between people, and what does it cost you?
  - What is one fact or feeling you could let yourself look at this week?
imageryNote: >-
  In the original art, a seated figure holds two crossed blades close to the
  chest, a soft cloth over the eyes. A pale crescent hangs low above calm,
  shallow water scattered with stones. The crossed blades form a guarded
  shape, like a door kept shut. The still water and night light suggest
  emotions resting under the surface, and the covered eyes point to the choice
  of not yet looking.
