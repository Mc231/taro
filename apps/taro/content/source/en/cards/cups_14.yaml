shortUpright: This card invites you to stay steady in strong currents, guiding with both feeling and clear thought.
shortReversed: Feelings may be held too tightly or spilling unevenly; consider what would help you meet them with steadiness.
meaningUpright: >-
  The King of Cups is imagined as a steady figure surrounded by moving water, calm while the currents shift. This card represents emotional mastery in its active form: the ability to feel deeply while responding with wisdom, fairness and kindness.

  It can reflect a moment when you are called to lead, mediate or support others through a difficult situation. The King of Cups does not deny feelings. Instead, this figure acknowledges them and chooses how to act, keeping both heart and mind in the conversation.

  In everyday life, this might look like staying composed in a tense meeting, offering thoughtful advice to a friend or making a decision that balances compassion with practicality. It can also point to a mature, generous kind of care that protects without controlling.

  This card invites you to trust that you can meet strong currents with steadiness. You might ask what a calm and caring response would look like in a situation that stirs you, and what support would help you offer it.
meaningReversed: >-
  Reversed, the King of Cups may reflect emotions that are being held too tightly, or ones that are spilling out unevenly. You might notice yourself appearing calm while feeling turbulent inside, or reacting more strongly than a situation calls for.

  It can also point to using emotional understanding in ways that steer others rather than support them, or to being steered yourself. Noticing this without blame can be a first step toward kinder patterns.

  This card invites you to find a steadiness that includes your feelings rather than suppressing them. What might you be avoiding feeling? You might try naming emotions privately, pausing before responding or talking things through with someone you trust. Balance can grow from honest acknowledgment, not from perfect control.
aspects:
  relationshipsUpright: >-
    In relationships, the King of Cups may reflect steady, mature care and a calm presence during emotional moments. It can invite you to listen deeply and respond thoughtfully rather than quickly. You might notice how you help others feel safe, and how you would like to be supported in return.
  relationshipsReversed: >-
    Reversed, this card may point to emotional distance, sudden moods or a quiet struggle for control in a relationship. You might ask whether feelings are being shared openly or managed behind the scenes. Honest, calm communication can help restore trust and a sense of balance between you.
  workUpright: >-
    At work, this card can reflect diplomatic leadership, mentoring or the ability to keep a team steady under pressure. It may invite you to bring emotional intelligence to decisions. Balancing empathy with clear boundaries can create a workplace where people feel both cared for and guided.
  workReversed: >-
    Reversed, the card may reflect stress being hidden until it spills over, or leadership that keeps people off balance. You might consider how to address tension openly and fairly. Asking for support or delegating some tasks can keep pressure from building beneath the surface.
  growthUpright: >-
    For personal growth, the King of Cups invites you to bring feeling and reason together. You might practice noticing an emotion, naming it and then choosing a response that fits your values. Over time, this can build a quiet confidence in your ability to stay balanced when things get stormy.
  growthReversed: >-
    Reversed, this card may ask you to explore how you handle strong emotions. You might notice patterns of holding everything in or letting it all out. Gentle practices, like pausing to breathe or writing before speaking, can help you find a middle ground where feelings are respected but do not take over.
reflectionQuestions:
  - How do you tend to respond when strong feelings rise in you?
  - Where could you offer calm, caring guidance to someone in your life?
  - What would help you stay steady in a situation that currently stirs you?
imageryNote: >-
  The art shows a crowned figure seated above moving water on a platform of weathered stone, a cup in one hand and a short staff in the other. The water around them rises and falls, yet the figure's shoulders stay loose and the gaze remains level. This contrast suggests emotional mastery, while deep blues warmed by touches of gold hint at wisdom and generosity.
