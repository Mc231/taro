shortUpright: A loss may be filling your view; this card invites you to grieve honestly and, in time, notice what still stands.
shortReversed: The weight of a disappointment may be easing; consider what has remained with you and where you want to turn next.
meaningUpright: >-
  The Five of Cups shows a figure looking down at cups that have spilled, while others remain upright behind them. It is a card about disappointment and grief: the feeling of something not turning out as hoped, and the pull to stay with what has been lost.

  That pull is human. When a plan falls through, a friendship changes or an expectation is not met, it takes time to absorb it. This card does not ask you to hurry. Mourning is part of caring about something, and naming a loss can be a way of honoring it.

  In everyday life, this card might reflect replaying a conversation, going over what you could have done differently, or finding it hard to enjoy something because of what is missing. It gently invites you, when you are ready, to turn slightly and notice what has not spilled: relationships, strengths or options that are still there. Both things can be true at once, the loss and what remains.
meaningReversed: >-
  Reversed, the Five of Cups may reflect a slow return of steadiness after a disappointment. You might notice that the loss hurts less sharply, or that you can speak about it without it filling the whole day. Acceptance does not mean pretending it did not matter; it means finding room to carry it alongside other things.

  This card can also point to forgiveness, of someone else or of yourself, becoming a little more possible. Or it can suggest that grief has been set aside rather than felt, and is asking for a quieter moment of attention.

  You might ask what you have learned from this experience and what you want to take forward. Turning toward what remains is not a betrayal of what was lost. If heavy feelings stay with you, sharing them with someone you trust can make the load feel lighter.
aspects:
  relationshipsUpright: >-
    In relationships, this card may reflect sadness over a bond that has changed, a hope that was not met or words that hurt. It can invite you to acknowledge that feeling rather than brushing it aside. You might also notice the people who have stayed close through difficulty, and let them know how much that means to you.
  relationshipsReversed: >-
    Reversed, the card may reflect movement toward reconciliation, or toward peace with how a relationship has changed. You might be ready to let go of an old grievance, or at least hold it more loosely. Consider what forgiveness would look like for you, remembering that it does not require you to accept what does not feel right.
  workUpright: >-
    At work, the Five of Cups can reflect disappointment over a project that stalled, feedback that stung or an opportunity that went elsewhere. It may invite you to take a moment to process that before planning the next step. Afterward, you might list the skills, relationships and ideas that are still yours to build on.
  workReversed: >-
    Reversed, the card may reflect recovering from a setback and starting to see new options. You might notice that a door you mourned closing has left space for something else. Consider writing a brief review of what happened, focusing on lessons rather than blame, so you can move on with more clarity.
  growthUpright: >-
    Grief and regret deserve a place in your story, and this card asks how to give them that place without letting them write the rest of it. You might practice noticing when your attention returns again and again to what went wrong. Gently widening the view, even for a few minutes each day, can make it easier to see the whole picture.
  growthReversed: >-
    Reversed, the Five of Cups may reflect resilience growing after a hard time. You might notice a new perspective or a deeper compassion that the experience gave you. Marking the change with a small ritual, like writing a letter you do not send, can help you close one chapter and open the next.
reflectionQuestions:
  - What loss or disappointment is asking to be acknowledged right now?
  - Who or what has stayed with you through a difficult time?
  - What still stands in your life that you could turn toward, even briefly?
imageryNote: >-
  The art shows a cloaked figure with head bowed over three toppled cups, their contents seeping into the ground. Behind the figure, two cups remain upright and easy to overlook. A path or a crossing in the distance can suggest a way onward when the time is right. Cool, subdued tones express mourning, while a thin line of light on the standing cups hints that not everything is gone.
