cardId: major_10
reviewStatus: machine
element: fire
astrology: jupiter
name: Wheel of Fortune
keywordsUpright:
  - cycles
  - change
  - turning points
  - adaptability
  - perspective
keywordsReversed:
  - resisting change
  - feeling stuck
  - repeating patterns
  - finding your footing
shortUpright: "Things are turning. This card invites you to notice the cycle you are in and how you want to move with it."
shortReversed: "A familiar pattern may be coming round again. What could you do differently this time?"
meaningUpright: >-
  The Wheel of Fortune is the card of cycles. Seasons turn, moods rise and fall,
  busy periods give way to quiet ones. Nothing stays at the top or the bottom
  for ever. This card reminds you that change is a normal part of life, and that
  some of it is outside anyone's control while some of it responds to how you
  meet it.

  In everyday life this card may reflect a turning point: a chapter closing and
  another opening, a lucky break that shifts your plans, or an unexpected
  setback that changes your pace. It can also point to recognizing a pattern
  that has shown up before, such as the same kind of situation arriving in a
  new form, and seeing it with fresh eyes.

  This card invites you to consider where you are on your own wheel right now.
  You might ask what this phase is asking of you, and what it could be teaching
  you. The Wheel does not decide your life for you. It highlights that
  flexibility, perspective and a sense of humor can help you ride the turns,
  and that a hard season is a season, not a permanent state.
meaningReversed: >-
  Reversed, the Wheel of Fortune may reflect a sense of being stuck in a loop
  or resisting a change that is already under way. You might feel that events
  are happening to you, or notice that the same frustrating pattern keeps
  returning in different clothes.

  This card can also point to holding on tightly to a good phase, fearing that
  it cannot last. Clinging makes the natural turning feel harder.

  You may want to look at what is within your reach. Patterns often repeat
  until something in how we respond shifts, even slightly. It can help to name
  the cycle you see, notice your part in it without blame, and choose one small
  thing to do differently. You cannot stop the wheel, but you can find firmer
  footing on it.
aspects:
  relationshipsUpright: >-
    In relationships, the Wheel can reflect a new phase: getting closer, moving
    to a different stage or simply adjusting to changing circumstances. It may
    invite you to stay flexible and to talk openly about how things are
    shifting. Relationships, like seasons, have rhythms, and naming them can
    help you move through them together.
  relationshipsReversed: >-
    Reversed, this card may point to familiar conflicts that keep returning, or
    to resistance to a relationship changing shape. You might consider what
    pattern you and someone close tend to repeat, and what each of you could try
    differently. Change does not have to mean loss; it can mean growth.
  workUpright: >-
    At work or in a project, the Wheel highlights shifting circumstances and new
    openings. It may reflect a change in plans, a new team or a project that
    suddenly moves forward. You might stay alert to opportunities while
    remembering that every phase, busy or slow, has something to offer.
  workReversed: >-
    Reversed, the Wheel may reflect frustration with delays or a feeling that
    effort is not paying off. It can also point to repeating the same approach
    and expecting a different result. You might review what has worked before,
    what has not, and where a small change in method could shift the pattern.
  growthUpright: >-
    Seeing your life as a series of cycles, rather than one straight line, can be freeing. Noticing your own rhythms, such as when
    you feel energized or when you need rest, can help you plan with them rather
    than against them. You might map the last year and notice its turning
    points.
  growthReversed: >-
    Reversed, the Wheel may ask whether you are trying to control what cannot be
    controlled. It can reflect a wish for certainty during a changing time. You
    might practice letting go of one thing you cannot influence, and putting
    that energy into one thing you can.
reflectionQuestions:
  - "What cycle or season do you feel you are in right now?"
  - "Which pattern keeps returning in your relationships, and what might it ask of you?"
  - "What is one thing within your control that you could focus on this week?"
imageryNote: >-
  Taro's Wheel of Fortune is imagined as a great turning wheel set in a sky
  that shifts from dawn at one edge to night at the other, showing every phase
  at once. Small figures and creatures ride its rim, some rising and some
  descending, none staying still. Symbols of the four seasons in the corners
  may frame the idea of natural cycles. At the hub, a calm, unmoving center
  suggests the steady perspective that can be found even while everything
  turns.
