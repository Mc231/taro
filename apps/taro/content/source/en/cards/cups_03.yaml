shortUpright: A moment to notice who shares your joys, and how you might share theirs in return.
shortReversed: Connection may feel thin or tiring right now; consider which gatherings nourish you and which only fill time.
meaningUpright: >-
  The Three of Cups is a card of friends raising their cups together. It celebrates the kind of connection that does not need a reason: laughter at a kitchen table, a group chat that lights up with good news, neighbors who help without being asked. Where the Two of Cups looks at one bond, this card looks at the circle.

  It can reflect a season of gatherings, a milestone worth marking or simply a sense of belonging to a group that sees you. It might also point to support that is already around you, perhaps more than you have been noticing.

  This card invites you to let joy be shared rather than saved for later. You might reach out to someone you have been meaning to see, say yes to an invitation or create a small occasion of your own. Celebration does not need to be grand. Sometimes it is just acknowledging, together, that something good happened, or that you got through something hard.
meaningReversed: >-
  Reversed, the Three of Cups may reflect a social life that feels out of tune. You might feel on the edge of a group you once felt part of, or notice that friendships have drifted as lives changed. Alternatively, there may be too much of a good thing: plans that leave no room to rest, or celebrations that have become a way to avoid quieter feelings.

  None of this is a verdict on your friendships. Circles change shape, and it is natural to outgrow some gatherings and long for others.

  The invitation is to look at the quality of your connections rather than their number. Which people leave you feeling more like yourself? Where might you be saying yes out of habit? A single honest catch-up with one friend may offer more than a crowded calendar.
aspects:
  relationshipsUpright: >-
    In relationships, this card highlights the wider web around a bond: friends, family, chosen family. It may invite you to share good moments with the people who support you, or to welcome someone close into your circle. You might also notice how much your friendships sustain you, and give them some of the attention usually reserved for a single relationship.
  relationshipsReversed: >-
    Reversed, this card may reflect tension in a group, or a sense of being left out. It can also point to an outside influence on a bond, in whatever form it takes. Rather than guessing, you might ask plainly how things stand. It may also help to spend time with people around whom you do not have to perform or keep up.
  workUpright: >-
    At work, the Three of Cups can point to team spirit, a shared win or collaborators who genuinely enjoy working together. It may invite you to celebrate progress along the way, not only at the finish. Thanking people by name, sharing credit and marking small milestones can make a group stronger and the work more satisfying.
  workReversed: >-
    Reversed, the card may reflect a team that has lost its warmth, perhaps through gossip, cliques or simple overload. You might notice whether social pressure is shaping your choices, such as staying late to fit in. Consider what healthy collegiality would look like for you, and where you could model it in a small way.
  growthUpright: >-
    For personal growth, this card invites you to value joy as part of a balanced life, not a reward you must earn first. You might keep a note of small shared delights across a week. Noticing them can make it easier to recognize the community you already have, and to see where you might like to widen it.
  growthReversed: >-
    Reversed, this card may ask whether you are using busyness or company to avoid being alone with your thoughts. It could also reflect loneliness that is hard to admit. You might balance social time with solitude and notice which one you are missing more. Reaching out to one person can be a gentle place to start.
reflectionQuestions:
  - Who are the people you most want to celebrate with, and why?
  - Which gatherings leave you feeling full, and which leave you feeling drained?
  - What small occasion could you create to share something good this week?
imageryNote: >-
  The art shows three figures in a loose circle, their cups lifted and meeting in the middle. Around their feet, a harvest of fruit, flowers or vines can suggest abundance that grows from shared effort. Their different clothing, postures and colors may stand for friends who stay distinct while belonging together. Movement in the scene, like a dance step or a turning hem, conveys easy, unforced joy.
