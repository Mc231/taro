cardId: major_11
reviewStatus: machine
element: air
astrology: libra
name: Justice
keywordsUpright:
  - fairness
  - honesty
  - accountability
  - clear judgment
  - cause and effect
keywordsReversed:
  - imbalance
  - avoiding responsibility
  - self-judgment
  - seeking fairness
shortUpright: "A moment to weigh things honestly and act in a way you would feel good explaining later."
shortReversed: "Something may feel out of balance. This card invites you to look at it clearly, including your own part."
meaningUpright: >-
  Justice holds a set of scales in one hand and a sword in the other. The
  scales stand for weighing things carefully; the sword for the clarity to act
  once you have. This card is about fairness, honesty and taking responsibility
  for your choices, understanding that actions have consequences and that you
  can choose them with care.

  In everyday life this card may reflect a decision that needs a clear head,
  such as dividing tasks fairly, giving honest feedback or admitting a mistake
  and making amends. It can point to moments when you are asked to look at a
  situation from every side before responding, and to be as fair to yourself as
  you try to be to others.

  This card invites you to consider what a balanced response would look like.
  You might ask which facts matter, what each person involved needs, and what
  you can take responsibility for. Justice does not predict how any formal
  matter will turn out. It highlights integrity: acting in line with what you
  believe is right, and accepting what follows with a steady mind.
meaningReversed: >-
  Reversed, Justice may reflect a sense that something is unfair, or that the
  scales in a situation have tipped. You might feel you are carrying more than
  your share, or notice a temptation to avoid looking at your own part in a
  difficulty.

  This card can also point to judging yourself too harshly, weighing every
  choice against an impossible standard. Accountability is useful; constant
  self-criticizm is not the same thing.

  You may want to write down the situation as neutrally as you can, as if
  explaining it to a fair-minded friend. What is yours to own, and what is not?
  Seeking fairness might mean speaking up, making a repair, or simply letting
  go of a judgment that has become heavy to carry.
aspects:
  relationshipsUpright: >-
    In relationships, Justice can reflect balance and mutual respect: both people
    giving and receiving in a way that feels fair. It may invite you to look
    honestly at how responsibilities and care are shared. Clear, kind
    conversations about expectations can strengthen trust and prevent quiet
    resentment.
  relationshipsReversed: >-
    Reversed, this card may point to an imbalance, such as one person doing more
    of the emotional or practical work, or a conflict where blame feels
    one-sided. You might consider what fairness would look like from both points
    of view, and whether an apology or a clearer agreement could restore
    balance.
  workUpright: >-
    At work or in a project, Justice highlights integrity, fair process and
    careful decisions. It may reflect reviewing a contract of expectations,
    giving balanced feedback or weighing options on their merits. You might ask
    which choice you would be comfortable explaining openly to everyone
    affected.
  workReversed: >-
    Reversed, Justice may reflect frustration with unfair treatment or unclear
    rules. It can also point to cutting corners under pressure. You might note
    the facts calmly, seek appropriate support if needed, and check that your
    own actions match the standard you would like others to meet.
  growthUpright: >-
    For personal growth, this card invites you to live by your values and take
    ownership of your choices. Reflecting on the effects of your actions,
    without harshness, can help you grow. You might look at one recent decision
    and ask what you would keep, and what you might do differently next time.
  growthReversed: >-
    Reversed, Justice may ask whether you hold yourself to a much stricter
    standard than you hold others. It can reflect guilt that lingers after a
    lesson has already been learned. You might practice fair self-assessment:
    naming both what went wrong and what went right.
reflectionQuestions:
  - "What would a fair response look like here, to others and to yourself?"
  - "Where might responsibilities in a close relationship need rebalancing?"
  - "What is one thing you are ready to take ownership of this week?"
imageryNote: >-
  Taro's Justice is imagined as a composed, upright figure holding balanced
  scales at heart height and an upright blade pointing to the sky. The figure
  looks straight at the viewer, suggesting honesty with nothing hidden. Two
  simple columns and a plain curtain behind keep the scene uncluttered, as if
  clearing space for careful thought. Cool air-blues and a single warm accent
  may reflect the meeting of reason and conscience.
