shortUpright: A moment to notice where you already feel at home, and who helps you feel you belong.
shortReversed: Harmony may feel strained or out of reach; consider what belonging would mean for you, beyond any ideal picture.
meaningUpright: >-
  The Ten of Cups completes the suit of water with an image of shared happiness: people together in a place that feels like home, with all ten cups gathered around them. It speaks to belonging, emotional fulfillment and the ease of being among people who accept you.

  Home in this card is not only a place or a traditional family. It can be chosen family, a close circle of friends, a community or even a moment of peace within yourself. What matters is the feeling of being welcome as you are.

  In everyday life, this might look like a relaxed evening with loved ones, a sense of harmony after a difficult period, or simply appreciating the small routines that bind people together. The card invites you to notice where you already feel at home and to nurture those connections. It may also ask what you contribute to that sense of belonging, and how you could share it a little more widely.
meaningReversed: >-
  Reversed, the Ten of Cups may reflect harmony that feels strained, or a gap between the picture of a happy home and how things actually feel. You might sense disconnection within a family or group, or feel pressure to maintain an ideal that does not match reality.

  It can also point inward: a longing for belonging that is hard to name, or a sense that you have not yet found where you fit.

  This card invites you to look at belonging with honesty and compassion. What would feeling at home really look like for you, beyond expectations? You might start with small acts that build closeness, such as sharing a meal or listening without distraction. Belonging often grows slowly, through ordinary moments of care, and it can take many different shapes.
aspects:
  relationshipsUpright: >-
    In relationships, this card may reflect mutual care, commitment and a shared sense of home, whether with a partner, family, friends or a chosen circle. It can invite you to appreciate the everyday rituals that sustain these bonds. You might express gratitude to the people who make you feel you belong, in words or in small acts.
  relationshipsReversed: >-
    Reversed, the Ten of Cups may point to tension or distance in a close group, or to comparing your relationships with an idealized picture. You might ask what each person truly needs to feel at home together. Open, gentle conversations can help rebuild closeness at a realiztic pace.
  workUpright: >-
    At work, this card can reflect a supportive team, a sense of shared purpose or a workplace where people genuinely care for each other. It may invite you to contribute to that culture. You might notice how feeling valued affects your work, and how you could help others feel the same.
  workReversed: >-
    Reversed, the card may reflect a workplace that talks about being a family but does not always act like one, or a blurred line between personal life and work. You might consider which boundaries would protect your time at home. Seeking belonging in several places can ease the pressure on any single one.
  growthUpright: >-
    For personal growth, the Ten of Cups invites you to cultivate a sense of home within yourself. You might notice what helps you feel settled and whole, such as certain places, practices or people. Building those into your routine can offer a steady foundation from which to connect with others.
  growthReversed: >-
    Reversed, this card may ask you to examine beliefs about what a happy life should look like. You might find that some expectations come from others rather than from you. Letting go of an idealized image can make room for a more authentic and more livable sense of fulfillment.
reflectionQuestions:
  - Where, or with whom, do you feel most at home?
  - What does belonging mean to you, apart from what you were taught it should look like?
  - What small act could strengthen a sense of home this week?
imageryNote: >-
  The art gathers ten cups around a group of figures of different ages, sharing an open landscape with a home nearby. Water flowing through green land suggests emotional nourishment that sustains a community. Open arms, linked hands or a shared dance can convey joy and ease. Bright yet gentle colors reflect warmth, safety and the feeling of having arrived somewhere good.
