cardId: wands_03
reviewStatus: machine
element: fire
astrology: sun_in_aries
name: Three of Wands
keywordsUpright:
  - momentum
  - expansion
  - looking ahead
  - early progress
  - trust in your efforts
keywordsReversed:
  - impatience
  - slow returns
  - frustrated plans
  - adjusting course
  - limited view
shortUpright: Something you set in motion is starting to travel; you can watch for what comes back and prepare for the next stage.
shortReversed: Progress may feel slower than you hoped; this could be a time to adjust expectations rather than give up.
meaningUpright: >-
  Where the Two of Wands was about planning, the Three of Wands shows plans
  already in motion. Ships have left harbor, so to speak: messages are sent,
  applications submitted, first steps taken. Now there is a period of watching
  the horizon while things unfold beyond your direct control.

  This card can reflect the satisfying feeling of early progress, such as a
  project gaining its first supporters, a new habit settling in, or a
  collaboration reaching further than you expected. It may also highlight the
  value of preparation: you have done enough groundwork that you can stand back
  and look further ahead.

  The invitation is to hold two things at once: confidence in what you have
  started and openness to how it develops. You might notice where your efforts
  are beginning to connect with other people, and consider what the next
  stage could ask of you. Expansion often needs new skills, new partners, or a
  slightly bigger picture of what you are building.
meaningReversed: >-
  Reversed, the Three of Wands can reflect waiting that has turned into
  restlessness. You may have done the work and still see little coming back,
  or the results may look different from what you pictured. It is easy to
  read slowness as failure, even when things are simply taking their time.

  Sometimes this card also points to a narrow view: focusing on a single
  outcome and missing the smaller signs of movement around you, or planning
  so far ahead that the present feels empty.

  This may be a good moment to look at your expectations. Were your timelines
  realiztic? Is there information you are missing, or a partner you have not
  yet asked for help? You might adjust the plan without abandoning it, and
  take note of whatever progress has quietly already happened.
aspects:
  relationshipsUpright: >-
    In close bonds, this card may reflect a connection that is growing beyond
    its first chapter, with more trust, new shared plans, or an openness to
    including other people. It can invite you to appreciate how far you have
    come together and to talk about where you would like to go next, while
    leaving room for each person's own horizon.
  relationshipsReversed: >-
    Reversed, you might feel that you are waiting for someone to meet you
    halfway, or that a relationship is not developing at the pace you hoped.
    It can help to share your expectations openly rather than silently
    measuring progress. You might also ask what the other person is hoping for,
    since your timelines may simply differ.
  workUpright: >-
    At work or in study, the Three of Wands can point to projects gaining
    reach: a launch, an outreach effort, a collaboration across teams or
    places. You might consider how to support that momentum, perhaps by
    following up, widening your network, or preparing for the next phase before
    it arrives, so you are not caught off guard by your own progress.
  workReversed: >-
    Reversed, results may be slow to appear, or a plan may have met delays you
    could not control. Rather than pushing harder in the same direction, you
    might review what you have learned so far and adjust the route. Checking
    in with the people involved can reveal obstacles, or quiet successes, that
    are easy to miss from where you stand.
  growthUpright: >-
    Trusting the effort you have already put in is a quiet kind of growth. Growth often continues out of sight after the first steps.
    You might look back at where you started a few months ago and notice what
    has changed, then choose what you would like to explore next with that
    wider view.
  growthReversed: >-
    Reversed, impatience with yourself may be clouding your view of real
    progress. You might explore where you expect instant change and where a
    slower rhythm would be kinder. Keeping a simple record of small steps can
    make growth easier to see when the horizon still looks empty.
reflectionQuestions:
  - What have you already set in motion that deserves a moment of recognition?
  - Who could help you see further than you can from where you stand right now?
  - How might you prepare now for the next stage of something you have started?
imageryNote: >-
  A figure stands on a hill or cliff top with their back partly turned,
  three staffs planted around them like markers of effort, watching boats or
  travelers moving across open water or plains below. Early light can suggest
  a new stage beginning. The distant movement stands for plans already under
  way, and the steady stance for patient confidence while results are still
  on their journey.
