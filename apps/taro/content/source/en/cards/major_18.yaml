cardId: major_18
reviewStatus: machine
element: water
astrology: pisces
name: The Moon
keywordsUpright:
  - uncertainty
  - intuition
  - dreams
  - the unknown
  - shifting feelings
keywordsReversed:
  - clearing confusion
  - facing worries
  - self-deception
  - trusting the path
shortUpright: "Not everything is clear yet, and that is all right. This card invites you to move slowly and trust your senses."
shortReversed: "A fog may be starting to lift. What do you see more clearly now than you did before?"
meaningUpright: >-
  The Moon is the card of the in-between: the light that shows shapes without
  showing their edges. In this soft glow, things can look larger, stranger or
  more magical than they are in daylight. The card speaks of dreams, moods,
  imagination and the unsettled feeling of not quite knowing where you stand.

  In everyday life this card may reflect a situation with missing pieces, a
  feeling you cannot name, or worries that seem bigger at night than in the
  morning. It can point to a time when logic alone does not help much, and when
  intuition, dreams and creative work may offer clues. Uncertainty here is not
  a warning; it is simply part of walking a path you cannot fully see yet.

  This card invites you to consider what is real and what may be imagined. You
  might ask which of your fears are based on facts and which on stories you
  have told yourself. The Moon highlights patience with ambiguity. Moving
  slowly, checking in with your instincts and waiting for more light before
  making big decisions can be a wise approach during foggy times.
meaningReversed: >-
  Reversed, the Moon may reflect confusion beginning to clear. Something that
  felt murky might be coming into focus, or you might be ready to look directly
  at a worry you had been avoiding. That can bring relief, even if the picture
  is not entirely comfortable.

  This card can also point to the tricks the mind plays: telling yourself a
  convenient story, or letting anxious thoughts run in loops. Noticing these
  patterns is itself a step toward clarity.

  You may want to write down what you know for certain and what you are
  guessing. Seeing the difference on paper can shrink a worry to its real size.
  Trusting the path does not require seeing all of it; it can be enough to see
  the next step and take it with care.
aspects:
  relationshipsUpright: >-
    In relationships, the Moon can reflect uncertainty about where you stand or
    what someone else is feeling. It may invite you to notice whether you are
    filling gaps with assumptions. Gentle, direct questions and patience can
    help, as can paying attention to your own emotional responses without
    rushing to conclusions.
  relationshipsReversed: >-
    Reversed, this card may point to misunderstandings starting to clear, or to
    recognizing an unhelpful story you have told about someone. You might
    consider having an honest conversation to check what is actually true, and
    making room for the other person's side.
    Clarity often arrives in small pieces, and each honest exchange adds one.
  workUpright: >-
    At work or in a project, the Moon highlights ambiguity: unclear goals,
    shifting information or a creative process that has not yet found its form.
    It may invite you to tolerate not knowing for a while. Imaginative
    brainstorming can thrive here, while firm commitments may benefit from
    waiting for more clarity.
  workReversed: >-
    Reversed, the Moon may reflect confusion lifting as new information arrives,
    or a chance to address a misunderstanding. You might write down open
    questions and seek clear answers. It can also point to catching yourself
    in worst-case thinking and choosing a calmer view.
    Clear facts tend to make the next decision lighter.
  growthUpright: >-
    Dreams, imagination and the less rational parts of your mind are worth exploring under the Moon. Journaling or creative play can
    help you listen to them. You might notice your moods and their patterns,
    treating them as information rather than as orders.
  growthReversed: >-
    Reversed, the Moon may ask whether anxiety has been shaping your view more
    than facts. It can reflect a growing ability to see through worries. You
    might practice pausing when a fearful thought appears and asking what a
    calmer friend would notice instead.
    Over time, that pause can become a steadier habit.
reflectionQuestions:
  - "Which of your current worries is based on facts, and which on guesses?"
  - "Where might you be filling a silence with assumptions about someone?"
  - "What is the next small step you can see clearly, even if the rest is foggy?"
imageryNote: >-
  Taro's Moon is imagined as a pale moon half hidden by drifting cloud above a
  path through tall reeds by the shore. The path shimmers in places and
  disappears in others, so the traveler goes slowly. A heron standing still
  in the shallows can suggest patient attention, while ripples on the water hint
  at feelings rising from below. Silvery light, soft shadows and blurred edges
  invite the viewer to trust their senses on an uncertain journey.
