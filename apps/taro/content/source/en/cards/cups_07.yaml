shortUpright: Many possibilities may be shimmering at once; this card invites you to enjoy imagining, then look closely at each one.
shortReversed: The fog of options may be lifting; consider which choice still feels real once the glow of imagining fades.
meaningUpright: >-
  The Seven of Cups often shows a figure facing a row of cups that float in the air, each holding a different vision. It is a card of imagination, possibility and the dizziness that can come from having too many choices.

  Imagination is a gift. It lets you picture lives you have not lived yet and ideas no one else has had. But this card also notices how easily daydreams blur with plans. Some of the cups hold real opportunities, some hold wishes, and some hold worries dressed up as possibilities.

  In everyday life, this might look like jumping between projects, scrolling through options without choosing, or feeling pulled toward a dream that has no first step. The card invites you to enjoy dreaming and then to look more closely. Which option fits your values and your actual circumstances? What would the first small action be? Choosing one does not mean losing the others forever; it means giving something the chance to become real.
meaningReversed: >-
  Reversed, the Seven of Cups may reflect clarity arriving after a period of confusion. The floating cups may start to settle, and you might see which ones hold something substantial and which were mostly mist. This can feel like relief, or like a small disappointment as some fantasies fade.

  It can also suggest the opposite: avoiding choice by keeping every possibility open, or dismissing imagination entirely in the name of being practical.

  The invitation here is to find grounded middle ground. You might pick one option and test it in a small, low-pressure way. Notice what excites you in practice rather than in theory. Letting go of a daydream can open room for a plan you can actually live, and dreaming can remain something you return to for inspiration.
aspects:
  relationshipsUpright: >-
    In relationships, this card may reflect idealizing someone, or imagining many possible futures with or without a particular person. It can invite you to notice the difference between who someone is and who you hope they are. You might enjoy the imagination while grounding it in real conversations about what each of you wants.
  relationshipsReversed: >-
    Reversed, the Seven of Cups may point to seeing a relationship more clearly, perhaps after a romantic haze has lifted. This clarity can be a chance to build on what is real. You might ask what you truly value in the bond now, rather than what you pictured at the start, and share that openly.
  workUpright: >-
    At work, this card can reflect a surplus of ideas or options, such as several projects, paths or offers competing for attention. It may invite you to weigh each one against your priorities, time and energy. Writing them down side by side can help. Imagination is useful for brainstorming; decisions often need firmer ground.
  workReversed: >-
    Reversed, the card may reflect narrowing down to a clear direction, or finally committing to one project. You might notice a sense of focus returning. If you feel disillusioned, consider which parts of the original vision are still worth carrying forward into something more realiztic and more your own.
  growthUpright: >-
    For personal growth, the Seven of Cups invites you to understand your daydreams. What longing does each one express? You might journal about a recurring fantasy and look for the need beneath it, such as freedom, recognition or rest. Meeting that need in a small, real way can be more satisfying than the dream itself.
  growthReversed: >-
    Reversed, this card may reflect a growing ability to tell wishes apart from intentions. You might practice making one clear decision each day, however small. Over time, this can build trust in your own judgment while leaving room for imagination to inspire rather than distract.
reflectionQuestions:
  - Which of your current options feels most alive when you imagine taking a real step toward it?
  - What longing might be hiding beneath a daydream you keep returning to?
  - What one small choice could you make this week to move from imagining to doing?
imageryNote: >-
  The art shows a figure, seen from behind, facing seven cups that hover in drifting mist. Each cup holds a different symbol, perhaps a key, a garland, a small house, a star, a coiled shape, a closed box and a mirror, standing for access, praise, security, hope, unease, secrets and self-image. Soft, dreamlike light and shifting colors can suggest how alluring and uncertain these visions are, inviting the viewer to wonder which of them is real.
