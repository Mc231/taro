shortUpright: Worries can loom larger in the quiet hours; you might notice which fears are about now and which are about maybe.
shortReversed: The weight of worry may be starting to lift, or it may be asking to be shared rather than carried alone.
meaningUpright: >-
  The Nine of Swords is the card of the late-night mind. Someone sits up in
  the dark, thoughts racing, while the room around them is perfectly still.
  The worries feel enormous, yet many of them are about things that have not
  happened and may never happen.

  You might recognize this card in lying awake replaying a conversation,
  imagining worst cases about a plan, or feeling guilt about something small
  grow heavier with each hour. It can reflect a period when stress has piled
  up and the mind keeps circling without landing anywhere. The blades hang on
  the wall rather than touching the figure, which suggests that much of the
  weight lives in thought.

  This card invites you to be gentle with your worried mind. You might write
  your fears down, then ask which of them you can act on and which you can
  only hold loosely. Morning light, a trusted voice, or a small practical step
  often shrinks what seemed overwhelming in the dark. If worry stays heavy for
  a long time, talking to someone you trust or a qualified professional can
  help. You do not have to carry every thought alone.
meaningReversed: >-
  Reversed, the Nine of Swords can reflect worry beginning to lift. You may
  be sleeping a little better, or finding that a feared situation turned out
  more manageable than you imagined. Perspective is returning, even if some
  unease remains.

  Another reading is stress turned inward and hidden: presenting a calm face
  to others while privately feeling stretched thin. Keeping worries secret can
  make them feel bigger and lonelier.

  This card invites you to consider sharing what is on your mind with someone
  you trust. Saying a fear out loud often reveals its true size. You might
  also notice which habits help your thoughts settle, such as a walk,
  breathing slowly, or writing before bed, and make room for them. What would
  help you feel less alone with what you are carrying?
aspects:
  relationshipsUpright: >-
    In relationships, this card may reflect anxious thoughts about someone
    close: replaying what they said, worrying about where things stand, or
    imagining how they see you. These stories can feel convincing at night.
    You might consider checking one of them gently in daylight, with a simple
    question. Clear, kind communication often eases what imagination
    magnifies.
  relationshipsReversed: >-
    Reversed, the Nine of Swords can point to opening up about your worries
    to someone close, or noticing that a feared rift was smaller than you
    thought. It may also reflect hiding stress from others to avoid burdening
    them. You might remember that letting people support you can bring you
    closer rather than push them away.
  workUpright: >-
    At work, this card can reflect stress that follows you home: a deadline
    that keeps you awake, fear of making a mistake, or worry about how your
    efforts are seen. You might write tomorrow's first step before you stop
    for the evening, so your mind has permission to rest. Breaking large
    concerns into small tasks can make them feel more manageable.
  workReversed: >-
    Reversed, this card may suggest pressure easing at work, or the choice to
    finally talk to someone about a load that feels too heavy. You might ask
    for clarity where uncertainty is feeding your worry. Naming a concern to a
    colleague or manager can turn a private burden into a shared problem with
    practical options.
  growthUpright: >-
    For personal growth, the Nine of Swords invites you to notice your
    relationship with worry. When does your mind start to spiral, and what
    helps it slow down? You might experiment with a short evening routine that
    signals the end of the day. Kindness toward your anxious thoughts, rather
    than fighting them, can loosen their hold.
  growthReversed: >-
    Reversed, this card can reflect learning that thoughts are not always
    facts. You might notice the moment a worry begins and gently name it as a
    worry. Over time, this small pause can create space between you and the
    fear. Reaching out for support is part of this growth, not a sign of
    weakness.
reflectionQuestions:
  - Which of your current worries is about something happening now, and which about a maybe?
  - Who could you tell about what keeps you up at night?
  - What small habit could help your mind settle before sleep?
imageryNote: >-
  The original art shows a figure sitting up in bed, knees drawn close, in
  a dark room lit only by a thin sliver of moonlight at the window. Nine
  blades hang in neat rows on the wall behind, never touching the figure. A
  folded blanket and a small lamp wait nearby, unlit. The rows of blades
  suggest looping thoughts, while the lamp and window hint that comfort and
  morning are close at hand.
