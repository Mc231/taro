cardId: major_14
reviewStatus: machine
element: fire
astrology: sagittarius
name: Temperance
keywordsUpright:
  - balance
  - moderation
  - blending
  - patience
  - finding the middle path
keywordsReversed:
  - excess
  - imbalance
  - impatience
  - recalibrating
shortUpright: "A slower, steadier blend of what you need could bring more ease than any extreme."
shortReversed: "Something may be tipping too far one way. This card invites you to notice and gently rebalance."
meaningUpright: >-
  Temperance is the card of mixing things in the right measure. Its image often
  shows water being poured between two vessels, carefully, so that little is
  spilled. The skill is not in choosing one thing over another but in blending
  them: work and rest, action and patience, what you want now and what you will
  want later.

  In everyday life this card may reflect finding a rhythm that works, such as a
  schedule with enough space in it, a compromise that respects both people, or
  a habit adjusted a little at a time until it feels right. It can point to the
  quiet satisfaction of moderation, which is less exciting than extremes but
  often more sustainable.

  This card invites you to consider where your life could use a little more
  balance. You might ask which parts feel overfull and which feel neglected, and
  what small adjustments could bring them closer together. Temperance
  highlights patience: good blends take time, and experimenting gently can
  teach you more than any sudden overhaul.
meaningReversed: >-
  Reversed, Temperance may reflect a sense of imbalance. You might be pouring
  too much into one area of life, such as work, a relationship or a worry, while
  another runs dry. Or you might notice a swing between extremes: all or
  nothing, busy or exhausted, strict or careless.

  This card can also point to impatience with a process that needs time, and a
  temptation to force results rather than let them blend.

  You may want to take a simple inventory. Where are you overdoing it, and
  where are you underdoing it? Choosing one gentle adjustment rather than a
  dramatic fix can help you recalibrate. Balance is not a place you arrive at
  once; it is something you return to, again and again, with small corrections.
aspects:
  relationshipsUpright: >-
    In relationships, Temperance can reflect harmony built through compromise
    and understanding. It may invite you to meet someone halfway, to blend your
    different styles and needs, and to be patient as you learn each other's
    rhythms. Calm, steady care can make a bond feel easy to be in.
  relationshipsReversed: >-
    Reversed, this card may point to a relationship where one person's needs
    dominate, or where conflicts escalate quickly. You might consider how to
    lower the intensity: slowing down conversations, taking breaks when things
    heat up, and looking for the overlap between what each of you wants.
  workUpright: >-
    At work or in a project, Temperance highlights steady progress and good
    collaboration. It may reflect combining different skills or ideas into
    something that works well, or pacing yourself so that energy lasts. You
    might look for the version of the plan that is ambitious and still
    sustainable.
  workReversed: >-
    Reversed, Temperance may reflect overwork, rushed decisions or friction
    between people with different approaches. You might ask where the pace has
    become unrealiztic and what could be simplified. Finding a middle path
    between competing priorities can reduce stress for everyone involved.
    Even one meeting-free afternoon can show what a steadier pace feels like.
  growthUpright: >-
    For personal growth, this card invites you to practice moderation without
    rigidity. You might notice your own balance points: how much rest, activity,
    time alone and time with others help you feel steady. Small, consistent
    adjustments can bring more ease than big resolutions.
  growthReversed: >-
    Reversed, Temperance may ask whether you have been running on extremes. It
    can reflect a need to slow down, rest, or reintroduce a missing ingredient
    into your days. You might choose one area to rebalance gently, and give
    yourself time to see how it settles.
reflectionQuestions:
  - "Which part of your life feels overfull, and which feels neglected?"
  - "Where could you meet someone close halfway this week?"
  - "What one small adjustment might bring more ease into your days?"
imageryNote: >-
  Taro's Temperance is imagined as a winged figure at the edge of a slow river,
  carefully pouring liquid between two different vessels, one of clay and one of
  glass. The stream between them curves gently, as if balance were being found
  in real time. Stepping stones crossing the river suggest a middle way from one
  bank to the other, and soft sunrise colors over distant hills keep the mood
  calm and hopeful.
