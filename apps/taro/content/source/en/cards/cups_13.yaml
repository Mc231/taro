name: Queen of Cups
keywordsUpright:
  - compassion
  - emotional attunement
  - intuition
  - calm presence
  - nurturing
keywordsReversed:
  - over-giving
  - emotional overwhelm
  - needing boundaries
  - inner care
shortUpright: This card invites you to listen deeply, to others and to yourself, with a calm and compassionate presence.
shortReversed: You may be absorbing more than you can hold; consider what care and boundaries would help you feel steady.
meaningUpright: >-
  The Queen of Cups sits at the edge of the water, holding a cup and studying it with quiet attention. This figure stands for emotional maturity in its receptive form: the ability to feel deeply, to sense what others need and to respond with compassion without losing yourself.

  This card can reflect a moment when you are the calm presence someone needs, or when you are drawn to listen more closely to your own intuition. It highlights empathy, patience and the kind of care that creates safety rather than pressure.

  In daily life, this might look like listening to a friend without rushing to fix things, trusting a quiet sense about a situation, or creating a gentle space at home where people can be themselves. It can also point to creative or reflective work that draws on your inner life.

  The card invites you to honor sensitivity as a strength. You might ask how you can care for others while also keeping a cup of compassion for yourself.
meaningReversed: >-
  Reversed, the Queen of Cups may reflect care that has spilled over its edges. You might be absorbing other people's feelings so fully that your own are hard to find, or giving so much that there is little left for you.

  It can also point inward: a need to reconnect with your own intuition after listening mainly to others, or feelings that are asking for attention rather than being set aside.

  This card invites you to treat boundaries as a form of compassion. What would it look like to care without carrying everything? You might set aside quiet time to check in with yourself, say no to one request or let someone else hold part of the load. When your own cup is tended, the care you offer can flow more freely and with less strain.
aspects:
  relationshipsUpright: >-
    In relationships, the Queen of Cups may reflect deep listening, emotional support and understanding. It can invite you to create a bond where feelings are welcome. You might notice how you offer comfort to others and how you like to receive it, and share that with someone close so care can flow both ways.
  relationshipsReversed: >-
    Reversed, this card may point to taking on too much of someone else's emotional weight, or losing sight of your own needs in a bond. You might ask where a gentle boundary could protect both you and the relationship. Caring for yourself can be part of caring for someone else.
  workUpright: >-
    At work, this card can reflect roles that call for empathy, such as caring, teaching, creative or support work, or simply being the colleague others trust. It may invite you to value emotional intelligence as a real skill. Listening well can shape results as much as any strategy.
  workReversed: >-
    Reversed, the card may reflect emotional exhaustion from being everyone's support at work. You might notice where you take on other people's stress as your own. Consider clarifying what is yours to hold and what is not, and finding small ways to recover your energy during the day.
  growthUpright: >-
    For personal growth, the Queen of Cups invites you to deepen your relationship with your intuition and feelings. You might sit quietly with a question and notice what comes up before you think it through. Practices like journaling or time by water can help you listen inwardly.
  growthReversed: >-
    Reversed, this card may ask you to extend compassion toward yourself. You might notice self-criticism that you would never direct at a friend. Gentle routines, rest and boundaries can help you feel steady. If feelings become overwhelming, reaching out to someone you trust can offer support.
reflectionQuestions:
  - What is your intuition quietly telling you about a current situation?
  - Where might a gentle boundary help you care for someone without losing yourself?
  - How could you offer yourself the same compassion you give to others this week?
imageryNote: >-
  The art shows a seated figure at the water's edge, cradling a cup in both hands, its surface reflecting the sky. Shells, waves or water creatures carved into the seat can suggest a deep bond with the emotional realm. Still water and a soft sky reflect calm receptivity, while the careful way the cup is held hints at inner depths treated with respect.
