cardId: pentacles_14
reviewStatus: machine
element: earth
astrology: taurus
name: King of Pentacles
keywordsUpright:
  - stewardship
  - stability
  - generous leadership
  - steady provision
  - mastery of the practical
keywordsReversed:
  - rigidity
  - status over substance
  - overcontrol
  - rethinking success
shortUpright: A steady, capable presence is available to you. Notice how you could use your experience and resources to create stability for yourself and others.
shortReversed: Security may have become a heavy weight to carry. You might ask what success means to you beyond control or appearances.
meaningUpright: >-
  The King of Pentacles sits surrounded by vines and sturdy walls, relaxed and
  secure, a coin resting on one knee. This king stands for the full maturity of the
  earth suit: practical mastery, patience and the ability to build something
  stable that others can rely on. The authority here comes from experience rather
  than force.

  You might recognize this energy in someone who manages a household or team
  calmly, who makes thoughtful decisions about time and resources, or who uses
  what they have built to support people around them. It can also reflect your
  own growing confidence in handling practical responsibilities well.

  This card invites you to consider your relationship with stability and
  provision. What have you built through steady effort, and how do you use it?
  You might notice where you could be generous with your time, knowledge or
  support, and where good stewardship means protecting what you have. Security
  can be something to share, not just to guard.
meaningReversed: >-
  Reversed, the King of Pentacles may reflect a relationship with security that
  has become rigid or heavy. Control can tighten, so that plans leave no room for
  others' input, or success might be measured mostly by appearances and
  possessions. It can also point to the pressure of feeling responsible for
  everyone's stability.

  This framing is about a quality overdone. Being dependable and capable is
  valuable; it becomes a burden when it leaves no space for rest, flexibility or
  other people's choices.

  You might ask what success truly means to you, beyond how things look. Where
  could you share responsibility or loosen a standard? Reconnecting with the
  values behind your effort, such as care, security and a sense of
  contribution, can make stability feel supportive again rather than confining.
aspects:
  relationshipsUpright: >-
    In relationships this card may reflect dependable, generous care: someone who
    provides stability, keeps commitments and makes others feel secure. You might
    be this steady presence for someone, or appreciate it in them. Sharing
    decisions and expressing warmth alongside reliability can make that security
    feel mutual.
  relationshipsReversed: >-
    Reversed, the card may suggest control that leaves little room for others, or
    an emphasis on practical provision that overshadows emotional connection. You
    might ask how someone close experiences your support, and whether they would
    like more voice or more tenderness in the bond.
  workUpright: >-
    At work the King of Pentacles can describe practical leadership and
    reliability. You may be trusted to manage resources, guide others or make
    grounded decisions. You might consider how to use your experience generously,
    mentoring others and building structures that support people as well as
    results.
  workReversed: >-
    Here the card may reflect inflexibility, micromanagement, or valuing status
    over meaningful work. It can also point to carrying too much responsibility
    alone. You might look at where delegating, listening more or redefining
    success could create a healthier and more sustainable way of working.
  growthUpright: >-
    For personal growth this card invites you to recognize the maturity and
    competence you have developed. You might reflect on what stability means to
    you and how you have created it. Acknowledging your own capacity to provide,
    for yourself and others, can deepen self-trust.
  growthReversed: >-
    Reversed, the card may reflect a strong attachment to control or to external
    markers of achievement. You might explore what you fear would happen if you
    loosened your grip. Finding security in your values and relationships, not
    only in what you own or manage, can bring greater ease.
reflectionQuestions:
  - What have you built through steady effort, and how does it support your life?
  - Where could you share your time, knowledge or care more generously with others?
  - What does success mean to you when you set aside how things look from outside?
imageryNote: >-
  The art may show a crowned figure seated on a throne carved with bull motifs,
  surrounded by grapevines and a walled garden, with a coin resting easily in
  one hand. The bull can symbolize endurance and earthly strength, the vines
  maturity and plenty, and the walls a protected, well-tended domain. The
  relaxed posture suggests authority grounded in experience, and deep greens
  and golds may reflect lasting, patient provision.
