shortUpright: A playful feeling or a small creative idea may surprise you; this card invites you to meet it with curiosity.
shortReversed: A tender feeling may be hiding or wobbling; consider how you could make it safe to express what you feel.
meaningUpright: >-
  The Page of Cups is the youngest figure of the suit of water, often shown gazing at a fish that peeks out of a cup. The image is gently absurd, and that is the point. This card celebrates curiosity, surprise and the willingness to take an unexpected feeling or idea seriously enough to explore it.

  It can reflect a new creative impulse, a sudden tenderness toward someone, a hunch that arrives out of nowhere or a playful mood that makes ordinary things feel new. The Page does not need to know where any of this leads. They are simply open.

  In daily life, this might look like doodling an idea, writing a heartfelt message, trying a creative hobby or letting yourself be delighted by something small. The card invites you to approach your inner life with the openness of a beginner. You might notice what surprises you today, and give it a moment of attention before practical thoughts crowd in.
meaningReversed: >-
  Reversed, the Page of Cups may reflect feelings that are hard to share, or creative ideas that feel too fragile to show. You might worry about seeming silly or vulnerable, and keep your inner world tucked away.

  It can also point to moods that swing quickly, or to daydreaming that replaces action rather than inspiring it.

  This card invites you to treat your sensitive side with patience. What would help you feel safe enough to express yourself, even to one person or on a private page? You might find a low-pressure outlet, like a journal or a sketchbook, where nothing has to be good. If feelings seem big and unsteady, naming them simply can make them easier to hold. Curiosity can grow back once it has a little shelter.
aspects:
  relationshipsUpright: >-
    In relationships, the Page of Cups may reflect sweet gestures, playful flirting, a heartfelt note or the start of a tender friendship. It can invite you to express affection openly and without overthinking it. You might also notice how someone close shows care in small, surprising ways, and let them know you saw it.
  relationshipsReversed: >-
    Reversed, this card may point to shyness, emotional insecurity or mixed signals in a bond. You might ask whether you or someone close is holding back feelings out of fear of rejection. Gentle honesty, offered at a comfortable pace, can make it easier for both people to feel safe.
  workUpright: >-
    At work, this card can reflect a new creative idea, a fresh approach or curiosity about a different area. It may invite you to share an unconventional suggestion or to experiment playfully with a task. Early ideas do not need to be polished; they need room to be explored before anyone judges them.
  workReversed: >-
    Reversed, the card may reflect a creative block, or hesitation to share ideas for fear of criticizm. You might try working on something just for yourself first, with no expectation of results. Building confidence slowly can help you bring your ideas forward when they feel ready to be seen.
  growthUpright: >-
    For personal growth, the Page of Cups invites you to cultivate curiosity about your feelings and hunches. You might keep a notebook for dreams, images or odd impressions, simply to notice patterns over time. Approaching your inner life playfully can make self-understanding feel lighter and more inviting.
  growthReversed: >-
    Reversed, this card may ask you to be gentle with the more vulnerable parts of yourself. You might notice when you dismiss your own feelings as childish or silly. Offering yourself encouragement, as you would to a young friend, can help sensitivity become a strength rather than something to hide.
reflectionQuestions:
  - What small surprise or idea has caught your attention lately?
  - How might you share a tender feeling with someone you trust?
  - What playful creative activity could you try this week, just for the enjoyment of it?
imageryNote: >-
  The art shows a young figure holding a cup at shoulder height, surprised to find a small fish looking back from inside. Their clothes might carry wave or flower patterns, and a shoreline behind them hints at the depths of feeling from which ideas emerge. Soft pastels and a light, curious expression convey openness, imagination and the charm of unexpected messages from within.
